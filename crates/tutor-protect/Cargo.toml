[package]
name = "tutor-protect"
description = "Data protection (r23 F4): redaction before any LLM request, the secret scan before a commit, masking of terminal output"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
regex = "1"
serde = { workspace = true }
serde_json = "1"
# the OS keychain (model keys, the Vault token): the Secret Service over D-Bus (libdbus), encrypted session
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }

[features]
# The OS keychain (`tutor_protect::keychain`), on by default. The course grader (`tutor-grade`, ADR-0008) reaches
# this crate through `tutor-eval` without it: it never holds a secret, and libdbus would stop its static build.
default = ["keychain"]
keychain = ["dep:keyring"]

[dev-dependencies]
tempfile = { workspace = true }
