[package]
name = "tutor-agent"
description = "Harness v2 do Co-Dev: loop de agente com tool use nativo (ver docs/design/harness-v2.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = "1"
# Síncrono de propósito (como o tutor-llm): a TUI e a CLI reutilizam o agente, e no
# Tauri cada sessão corre numa thread dedicada (padrão do pty.rs).
ureq = { version = "2.12", features = ["json"] }
# a política da modebar (Manual/Assistido/Auto) tem uma só fonte: tutor_llm::policy
tutor-llm = { path = "../tutor-llm" }
# glob/grep das ferramentas: o motor do ripgrep (respeita .gitignore) e regex
ignore = "0.4"
regex = "1"

[target.'cfg(unix)'.dependencies]
# matar o grupo de processos do bash (timeout/cancelamento) sem deixar netos vivos
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
