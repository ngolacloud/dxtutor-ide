name: ci
# Verificação em cada push e PR (o build.yml só corre em tags de release).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI (typecheck, build, testes, fronteiras de arquitectura)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ui:build
      - run: npm run ui:test
      - run: npm run arch:check

  rust:
    name: Rust (clippy + testes do workspace)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf
      # o crate src-tauri embute ui-app/dist em compile time (generate_context!)
      - run: npm ci && npm run ui:build
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
