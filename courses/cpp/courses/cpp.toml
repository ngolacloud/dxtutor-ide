instructions = '''
## Your turn

Implement the class `TempFile`:

```cpp
class TempFile {
public:
    explicit TempFile(const std::string& contents);
    ~TempFile();
    TempFile(const TempFile&) = delete;
    TempFile& operator=(const TempFile&) = delete;
    TempFile(TempFile&& other) noexcept;
    TempFile& operator=(TempFile&& other) noexcept;
    const std::filesystem::path& path() const;
};
```

Rules:

- The **constructor** creates a new file with a unique name directly inside
  `std::filesystem::temp_directory_path()` and writes `contents` to it exactly (open the
  stream in binary mode so nothing is translated). Two `TempFile`s must never share a name,
  even when they are created in quick succession. If the file cannot be created or written,
  throw `std::runtime_error`, without leaving a file behind.
- `path()` returns the full path of the owned file, or an **empty** path when this object no
  longer owns a file.
- The **destructor** deletes the owned file, if there is one. It must never throw: use the
  `std::filesystem::remove` overload that takes a `std::error_code&`.
- The **move constructor** takes ownership of `other`'s file and leaves `other` empty, so
  `other`'s destructor deletes nothing.
- The **move assignment** first deletes the file this object currently owns, then takes
  ownership of `other`'s file and leaves `other` empty.
- Copying is not allowed: the starter already deletes the copy operations.

Example:

```cpp
std::filesystem::path p;
{
    TempFile t("hello\n");
    p = t.path();          // the file exists and contains "hello\n"
}                          // the file is gone here
```

**Hint:** `std::exchange(other.path_, {})` reads `other`'s path and empties it in one step.
A `static` counter combined with a random number makes names unique.

Hidden tests decide correctness. They only create files through your class, inside the
temporary directory.
