target = '''
#include <iostream>
#include <memory>
#include <string>

class StringList {
    struct Node {
        std::string value;
        std::unique_ptr<Node> next;
    };
    std::unique_ptr<Node> head_;
    Node* tail_ = nullptr;
    std::size_t size_ = 0;

public:
    ~StringList() {
        while (head_) head_ = std::move(head_->next);
    }
    void push_back(std::string v) {
        auto node = std::make_unique<Node>(std::move(v), nullptr);
        Node* raw = node.get();
        if (tail_) tail_->next = std::move(node);
        else head_ = std::move(node);
        tail_ = raw;
        ++size_;
    }
    std::size_t size() const { return size_; }
    const std::string& back() const { return tail_->value; }
    void print() const {
        for (const Node* n = head_.get(); n; n = n->next.get()) std::cout << n->value << ' ';
        std::cout << '\n';
    }
};

int main() {
    StringList list;
    for (const char* w : {"red", "green", "blue"}) list.push_back(w);
    list.print();
    std::cout << list.size() << ' ' << list.back() << '\n';
}
'''
