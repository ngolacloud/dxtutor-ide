[[unit.step]]
kind = "challenge"
id = "cpp-u15-x1-dynarray"
title = "A heap array with the rule of five"
points = 30
difficulty = 15
entry = "DynArray"
intro = '''
A class that owns a raw resource must define what copying, moving and destroying it mean, or the
compiler's member-wise defaults will copy the pointer and free the same buffer twice. Writing all
five special members by hand, correctly, is how `std::vector` and `std::string` are built
underneath, and it is the clearest way to understand what the rule of zero saves you from.
'''
instructions = '''
## Your turn

Implement the class `DynArray`, a fixed-size array of `int` that owns a heap buffer allocated
with `new int[n]` and released with `delete[]`:

```cpp
class DynArray {
public:
    DynArray();                                   // empty
    explicit DynArray(std::size_t n, int fill = 0);
    DynArray(const DynArray& other);
    DynArray(DynArray&& other) noexcept;
    DynArray& operator=(const DynArray& other);
    DynArray& operator=(DynArray&& other) noexcept;
    ~DynArray();

    std::size_t size() const;
    int* data();
    const int* data() const;
    int& operator[](std::size_t i);
    const int& operator[](std::size_t i) const;
};
```

Behaviour:

- `DynArray(n, fill)` holds `n` elements, all equal to `fill`. An **empty** array (default
  constructed, or `n == 0`) has `size() == 0` and `data() == nullptr`.
- **Copies are deep**: a copy has its own buffer, so changing one never changes the other.
- **Moves steal**: the new object takes over the source's buffer (its `data()` pointer is the one
  the source had) and the source becomes empty (`size() == 0`, `data() == nullptr`). A moved-from
  `DynArray` can be assigned a new value and used again.
- Copy assignment must work when an object is assigned to itself (`a = a`).
- Both move operations must be `noexcept`, so that a `std::vector<DynArray>` moves elements
  instead of copying them when it grows. The starter leaves `noexcept` off on purpose: adding it
  is part of the exercise.
- The destructor releases the buffer. `operator[]` does not check bounds, like `std::vector`'s.

**Hint:** `std::exchange(other.data_, nullptr)` returns the old pointer and nulls the source in
one expression. For copy assignment, the **copy-and-swap** idiom (copy `other` into a local, then
swap members with it) is self-assignment safe and leaves `*this` unchanged if the allocation
throws.

Hidden tests decide correctness.
'''
starter = '''
#include <cstddef>
#include <stdexcept>

// A fixed-size array of ints that owns a heap buffer (new int[n] / delete[]).
// An empty DynArray has size() == 0 and data() == nullptr.
class DynArray {
public:
    DynArray() = default;

    // n elements, all equal to fill.
    explicit DynArray(std::size_t n, int fill = 0) {
        throw std::logic_error("not implemented");
    }

    // Deep copy: a new buffer with the same values.
    DynArray(const DynArray& other) {
        throw std::logic_error("not implemented");
    }

    // Steal other's buffer and leave other empty. Make it noexcept.
    DynArray(DynArray&& other) {
        throw std::logic_error("not implemented");
    }

    // Deep copy into an existing object; must be safe for a = a.
    DynArray& operator=(const DynArray& other) {
        throw std::logic_error("not implemented");
    }

    // Release the current buffer, steal other's, leave other empty. Make it noexcept.
    DynArray& operator=(DynArray&& other) {
        throw std::logic_error("not implemented");
    }

    ~DynArray() {
        // TODO: release the buffer. (A destructor must never throw.)
    }

    std::size_t size() const { throw std::logic_error("not implemented"); }
    int* data() { throw std::logic_error("not implemented"); }
    const int* data() const { throw std::logic_error("not implemented"); }
    int& operator[](std::size_t i) { throw std::logic_error("not implemented"); }
    const int& operator[](std::size_t i) const { throw std::logic_error("not implemented"); }

private:
    int* data_ = nullptr;
    std::size_t size_ = 0;
};
'''
tests = '''
#include <cstddef>
#include <type_traits>
#include <utility>
#include <vector>

static bool all_equal(const DynArray& a, int value) {
    for (std::size_t i = 0; i < a.size(); ++i) {
        if (a[i] != value) {
            return false;
        }
    }
    return true;
}

TEST(default_and_zero_size_are_empty) {
    DynArray e;
    CHECK_EQ(e.size(), std::size_t{0});
    CHECK(e.data() == nullptr);
    DynArray z(0, 5);
    CHECK_EQ(z.size(), std::size_t{0});
    CHECK(z.data() == nullptr);
}

TEST(constructs_with_fill_and_indexes) {
    DynArray a(5, 7);
    CHECK_EQ(a.size(), std::size_t{5});
    CHECK(a.data() != nullptr);
    CHECK(all_equal(a, 7));
    a[2] = -1;
    CHECK_EQ(a[2], -1);
    CHECK_EQ(a.data()[2], -1);
    DynArray zeros(3);
    CHECK(all_equal(zeros, 0));
    const DynArray& view = a;
    CHECK_EQ(view[0], 7);
}

TEST(copy_is_deep) {
    DynArray a(4, 1);
    DynArray b(a);
    CHECK_EQ(b.size(), std::size_t{4});
    CHECK(b.data() != a.data());
    b[0] = 99;
    CHECK_EQ(a[0], 1);
    CHECK(all_equal(a, 1));
    DynArray empty;
    DynArray copy_of_empty(empty);
    CHECK_EQ(copy_of_empty.size(), std::size_t{0});
    CHECK(copy_of_empty.data() == nullptr);
}

TEST(move_constructor_steals_the_buffer) {
    DynArray a(1000, 3);
    const int* buffer = a.data();
    DynArray b(std::move(a));
    CHECK(b.data() == buffer);
    CHECK_EQ(b.size(), std::size_t{1000});
    CHECK(all_equal(b, 3));
    CHECK_EQ(a.size(), std::size_t{0});
    CHECK(a.data() == nullptr);
}

TEST(copy_assignment_including_self) {
    DynArray a(3, 4);
    DynArray b(10, 8);
    b = a;
    CHECK_EQ(b.size(), std::size_t{3});
    CHECK(all_equal(b, 4));
    CHECK(b.data() != a.data());
    b[1] = 0;
    CHECK(all_equal(a, 4));
    DynArray small(1, 2);
    small = DynArray(6, 5);
    CHECK_EQ(small.size(), std::size_t{6});
    CHECK(all_equal(small, 5));
    DynArray& alias = a;
    a = alias;
    CHECK_EQ(a.size(), std::size_t{3});
    CHECK(all_equal(a, 4));
    DynArray empty;
    b = empty;
    CHECK_EQ(b.size(), std::size_t{0});
}

TEST(move_assignment_steals_and_empties) {
    DynArray a(50, 6);
    DynArray b(20, 1);
    const int* buffer = a.data();
    b = std::move(a);
    CHECK(b.data() == buffer);
    CHECK_EQ(b.size(), std::size_t{50});
    CHECK(all_equal(b, 6));
    CHECK_EQ(a.size(), std::size_t{0});
    CHECK(a.data() == nullptr);
    a = DynArray(2, 9);
    CHECK_EQ(a.size(), std::size_t{2});
    CHECK(all_equal(a, 9));
}

TEST(moves_are_noexcept) {
    CHECK(std::is_nothrow_move_constructible_v<DynArray>);
    CHECK(std::is_nothrow_move_assignable_v<DynArray>);
}

TEST(vector_growth_moves_instead_of_copying) {
    std::vector<DynArray> v;
    v.reserve(4);
    std::vector<const int*> buffers;
    for (int i = 0; i < 4; ++i) {
        v.emplace_back(100, i);
        buffers.push_back(v.back().data());
    }
    v.reserve(v.capacity() + 1);
    for (std::size_t i = 0; i < v.size(); ++i) {
        CHECK(v[i].data() == buffers[i]);
        CHECK(all_equal(v[i], static_cast<int>(i)));
    }
}

TEST(many_copies_and_moves) {
    std::vector<DynArray> v;
    for (int i = 0; i < 2000; ++i) {
        v.emplace_back(50, i);
    }
    std::vector<DynArray> copy = v;
    std::vector<DynArray> moved = std::move(copy);
    long long total = 0;
    for (int round = 0; round < 50; ++round) {
        for (std::size_t i = 0; i + 1 < moved.size(); i += 2) {
            DynArray tmp = std::move(moved[i]);
            moved[i] = std::move(moved[i + 1]);
            moved[i + 1] = std::move(tmp);
        }
    }
    for (const DynArray& a : moved) {
        total += a[0];
        CHECK_EQ(a.size(), std::size_t{50});
    }
    CHECK_EQ(total, 1999LL * 2000 / 2);
    CHECK(all_equal(v[7], 7));
}
'''

[unit.step.gabarito]
solution = '''
#include <algorithm>
#include <cstddef>
#include <utility>

// A fixed-size array of ints that owns a heap buffer (new int[n] / delete[]).
// An empty DynArray has size() == 0 and data() == nullptr.
class DynArray {
public:
    DynArray() = default;

    explicit DynArray(std::size_t n, int fill = 0)
        : data_(n == 0 ? nullptr : new int[n]), size_(n) {
        std::fill_n(data_, size_, fill);
    }

    DynArray(const DynArray& other)
        : data_(other.size_ == 0 ? nullptr : new int[other.size_]), size_(other.size_) {
        std::copy_n(other.data_, size_, data_);
    }

    DynArray(DynArray&& other) noexcept
        : data_(std::exchange(other.data_, nullptr)), size_(std::exchange(other.size_, 0)) {}

    DynArray& operator=(const DynArray& other) {
        if (this != &other) {
            DynArray copy(other);
            swap(copy);
        }
        return *this;
    }

    DynArray& operator=(DynArray&& other) noexcept {
        if (this != &other) {
            delete[] data_;
            data_ = std::exchange(other.data_, nullptr);
            size_ = std::exchange(other.size_, 0);
        }
        return *this;
    }

    ~DynArray() { delete[] data_; }

    std::size_t size() const { return size_; }
    int* data() { return data_; }
    const int* data() const { return data_; }
    int& operator[](std::size_t i) { return data_[i]; }
    const int& operator[](std::size_t i) const { return data_[i]; }

private:
    void swap(DynArray& other) noexcept {
        std::swap(data_, other.data_);
        std::swap(size_, other.size_);
    }

    int* data_ = nullptr;
    std::size_t size_ = 0;
};
'''
time = "copy: O(n) · move: O(1)"
space = "copy: O(n) · move: O(1)"
justification = '''
Let *n* be the number of elements.

The **constructor** and the **copy constructor** allocate one buffer of *n* ints and fill or copy
it, so they take **O(n)** time and **O(n)** space. **Copy assignment** builds a full copy first
and then swaps it in, also **O(n)** time and space; the old buffer is freed when the local copy
is destroyed at the end of the function. Doing the risky part (the allocation) before touching
`*this` gives the strong exception guarantee: if `new` throws, the object is unchanged. It is
also why `a = a` is safe, although the `this != &other` test skips the needless copy.

The **move constructor** and **move assignment** only exchange a pointer and a size, so they are
**O(1)** time and allocate nothing: **O(1)** space. Move assignment frees the old buffer with
`delete[]` before stealing, which is O(1) for `int` because ints have no destructors. Because
nothing in them can throw, they are marked `noexcept`, and that is what lets
`std::vector<DynArray>` relocate elements during growth in O(1) each instead of deep-copying
them in O(n) each. The destructor is O(1) for the same reason.

Each special member has one job, and leaving any of them to the compiler would be a bug: the
generated copy would copy the pointer, so two objects would `delete[]` the same buffer; the
generated move would copy the pointer and the size without emptying the source, with the same
result. That is the rule of five in action, and it is why everyday code prefers members such as
`std::vector<int>` or `std::unique_ptr<int[]>`, for which the rule of zero applies.
'''

