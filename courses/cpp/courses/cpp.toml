[[unit.step]]
kind = "challenge"
id = "cpp-u16-x1-group-by"
title = "A generic group_by"
points = 40
difficulty = 22
intro = '''
Grouping is a building block of reporting and data processing: bucket orders by customer,
words by length, numbers by remainder. A generic `group_by` must work for any element type
and any key function, so the type of the map's key is not known until the compiler sees the
callable. Type traits such as `std::invoke_result_t` compute it at compile time.
'''
entry = "group_by"
instructions = '''
## Your turn

Implement the function template `group_by`:

```cpp
template <typename T, typename KeyFn>
using GroupMap =
    std::map<std::remove_cvref_t<std::invoke_result_t<KeyFn&, const T&>>, std::vector<T>>;

template <typename T, typename KeyFn>
GroupMap<T, KeyFn> group_by(const std::vector<T>& items, KeyFn key);
```

`GroupMap` is provided in the starter. Its key type is whatever `key(item)` returns, with
`const` and references stripped, so a key function returning `bool` gives
`std::map<bool, std::vector<T>>`, and one returning `const std::string&` gives
`std::map<std::string, std::vector<T>>`.

Rules:

- Put every item into the group of its key. The map keeps the keys sorted.
- Inside each group, items keep the order they had in `items`.
- Call `key` **exactly once** per item. The key function may count its calls, so don't call
  it twice.
- `key` can be a lambda, a function pointer or an object with `operator()`. Call it with
  `std::invoke(key, item)` or `key(item)`.
- An empty input gives an empty map.

Examples:

- `group_by(std::vector{1, 2, 3, 4, 5}, [](int x) { return x % 2 == 0; })` gives
  `{false: [1, 3, 5], true: [2, 4]}`.
- Grouping `{"fig", "kiwi", "pear", "plum", "apple"}` by length gives
  `{3: ["fig"], 4: ["kiwi", "pear", "plum"], 5: ["apple"]}`.

**Hint:** `groups[k]` creates an empty vector the first time a key is seen, so one loop
with `push_back` is enough.

Hidden tests decide correctness.
'''
starter = '''
#include <functional>
#include <map>
#include <stdexcept>
#include <type_traits>
#include <vector>

// The map type group_by returns: the key is what key(item) returns, without const or &.
template <typename T, typename KeyFn>
using GroupMap =
    std::map<std::remove_cvref_t<std::invoke_result_t<KeyFn&, const T&>>, std::vector<T>>;

// Group items by key(item). Keys come out sorted; each group keeps the input order.
// Call key exactly once per item.
template <typename T, typename KeyFn>
GroupMap<T, KeyFn> group_by(const std::vector<T>& items, KeyFn key) {
    (void)items;
    (void)key;
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <string>
#include <type_traits>
#include <vector>

struct Person {
    std::string name;
    std::string city;
};

int tens(const int& x) { return x / 10; }

TEST(empty_input_gives_empty_map) {
    std::vector<int> none;
    auto g = group_by(none, [](int x) { return x; });
    CHECK(g.empty());
}

TEST(groups_by_parity_with_bool_keys) {
    auto g = group_by(std::vector<int>{1, 2, 3, 4, 5}, [](int x) { return x % 2 == 0; });
    static_assert(std::is_same_v<decltype(g)::key_type, bool>);
    CHECK_EQ(g.size(), 2u);
    CHECK_EQ(g[false], (std::vector<int>{1, 3, 5}));
    CHECK_EQ(g[true], (std::vector<int>{2, 4}));
}

TEST(groups_strings_by_length_keeping_order) {
    std::vector<std::string> words{"pear", "fig", "kiwi", "apple", "plum"};
    auto g = group_by(words, [](const std::string& w) { return w.size(); });
    static_assert(std::is_same_v<decltype(g)::key_type, std::size_t>);
    CHECK_EQ(g.size(), 3u);
    CHECK_EQ(g[3], (std::vector<std::string>{"fig"}));
    CHECK_EQ(g[4], (std::vector<std::string>{"pear", "kiwi", "plum"}));
    CHECK_EQ(g[5], (std::vector<std::string>{"apple"}));
    CHECK_EQ(g.begin()->first, 3u);
}

TEST(negatives_and_duplicates) {
    std::vector<int> v{-5, 0, 7, -5, 3, 0, -1};
    auto g = group_by(v, [](int x) { return (x > 0) - (x < 0); });
    CHECK_EQ(g.size(), 3u);
    CHECK_EQ(g.begin()->first, -1);
    CHECK_EQ(g[-1], (std::vector<int>{-5, -5, -1}));
    CHECK_EQ(g[0], (std::vector<int>{0, 0}));
    CHECK_EQ(g[1], (std::vector<int>{7, 3}));
}

TEST(single_item) {
    auto g = group_by(std::vector<char>{'x'}, [](char c) { return std::string(1, c); });
    CHECK_EQ(g.size(), 1u);
    CHECK_EQ(g["x"], (std::vector<char>{'x'}));
}

TEST(calls_key_exactly_once_per_item) {
    int calls = 0;
    std::vector<int> v{4, 8, 15, 16, 23, 42};
    auto g = group_by(v, [&calls](int x) {
        ++calls;
        return x % 3;
    });
    CHECK_EQ(calls, 6);
    CHECK_EQ(g[0], (std::vector<int>{15, 42}));
    CHECK_EQ(g[1], (std::vector<int>{4, 16}));
    CHECK_EQ(g[2], (std::vector<int>{8, 23}));
}

TEST(accepts_a_function_pointer) {
    auto g = group_by(std::vector<int>{12, 3, 19, 25, 7, 21}, &tens);
    CHECK_EQ(g[0], (std::vector<int>{3, 7}));
    CHECK_EQ(g[1], (std::vector<int>{12, 19}));
    CHECK_EQ(g[2], (std::vector<int>{25, 21}));
}

TEST(reference_returning_key_is_stripped) {
    std::vector<Person> people{{"Ana", "Luanda"}, {"Rui", "Porto"}, {"Eva", "Luanda"}};
    auto g = group_by(people, [](const Person& p) -> const std::string& { return p.city; });
    static_assert(std::is_same_v<decltype(g)::key_type, std::string>);
    CHECK_EQ(g.size(), 2u);
    CHECK_EQ(g["Luanda"].size(), 2u);
    CHECK_EQ(g["Luanda"][0].name, std::string("Ana"));
    CHECK_EQ(g["Luanda"][1].name, std::string("Eva"));
    CHECK_EQ(g["Porto"][0].name, std::string("Rui"));
}

TEST(large_input) {
    std::vector<int> v(100000);
    for (int i = 0; i < 100000; ++i) v[i] = i;
    auto g = group_by(v, [](int x) { return x % 7; });
    CHECK_EQ(g.size(), 7u);
    std::size_t total = 0;
    for (const auto& [k, items] : g) {
        total += items.size();
        CHECK_EQ(items.front(), k);
        CHECK_EQ(items.back() % 7, k);
    }
    CHECK_EQ(total, 100000u);
    CHECK_EQ(g[0].size(), 14286u);
}
'''

[unit.step.gabarito]
solution = '''
#include <functional>
#include <map>
#include <type_traits>
#include <vector>

// The map type group_by returns: the key is what key(item) returns, without const or &.
template <typename T, typename KeyFn>
using GroupMap =
    std::map<std::remove_cvref_t<std::invoke_result_t<KeyFn&, const T&>>, std::vector<T>>;

// Group items by key(item). Keys come out sorted; each group keeps the input order.
template <typename T, typename KeyFn>
GroupMap<T, KeyFn> group_by(const std::vector<T>& items, KeyFn key) {
    GroupMap<T, KeyFn> groups;
    for (const T& item : items) {
        groups[std::invoke(key, item)].push_back(item);
    }
    return groups;
}
'''
time = "O(n log g)"
space = "O(n)"
justification = '''
The loop visits each of the `n` items once. For each one it calls `key` once and looks the
key up in a `std::map`, a balanced binary search tree holding at most `g` distinct keys, so
the lookup costs **O(log g)**. `push_back` is amortised O(1), which gives **O(n log g)** in
total, with `n log n` as the worst case when every key is different. (Copying an item costs
whatever copying a `T` costs; for fixed-size types that is a constant.)

The result stores a copy of every item plus one tree node per distinct key, so the extra
space is **O(n)**. All the type work, deducing `T`, `KeyFn` and the key type through
`std::invoke_result_t` and `std::remove_cvref_t`, happens at compile time and costs nothing
at run time. A `std::unordered_map` would bring lookups to O(1) on average, but it would lose
the sorted key order and would require the key type to be hashable.
'''


[[unit]]
id = "cpp-u17-class-templates"
title = "Class templates & generic containers"
level = "advanced"
difficulty = 23
intro = '''
`std::vector<int>` and `std::map<std::string, double>` are not built into the language: they
are class templates, and you can write your own. You will build a generic stack, a container
whose capacity is part of its type, use class template argument deduction and
specialisation, and finish with a fixed-capacity ring buffer that works for any element
type, including ones that can only be moved.
'''
concepts = '''
## The idea

A function template generates functions; a **class template** generates whole types. The
standard containers are the classic example: the logic of a growable array is the same
whether it stores `int`, `std::string` or `Order`, so it is written once as
`template <typename T> class vector` and the compiler produces `vector<int>`,
`vector<std::string>` and so on. Each one is a distinct, unrelated type with its own fully
typed member functions, and there is no runtime cost.

## How C++ does it

```cpp
template <typename T>
class Box {
public:
    explicit Box(T value) : value_(std::move(value)) {}
    const T& get() const { return value_; }
    void set(T value);

private:
    T value_;
};

template <typename T>
void Box<T>::set(T value) { value_ = std::move(value); }
```

Inside the class, `Box` alone means `Box<T>`. A member defined outside the class repeats the
`template` line and names the class as `Box<T>::`. Template parameters can also be values,
as in `template <typename T, std::size_t N> class FixedVec`, which makes the capacity part
of the type, just like `std::array<int, 4>`.

Since C++17 you can often skip the angle brackets. With **class template argument
deduction** (CTAD), `Box b{42};` deduces `Box<int>` from the constructor argument, and
`std::vector v{1, 2, 3};` deduces `std::vector<int>`.

You can also replace the whole template for one type with an **explicit specialisation**,
`template <> class Box<bool> { … };`. That is how `std::vector<bool>` packs bits.

## What is special or tricky

- **Member functions are instantiated only when used.** `Box<T>::set` is not compiled for a
  type until someone calls it, so a container of move-only `std::unique_ptr` works as long
  as you never call the members that copy.
- **Don't demand more from `T` than you need.** `std::vector<T>(n)` and `T data_[N]` both
  default-construct `n` elements, so they fail for a type without a default constructor.
  `std::optional<T>` stores "maybe a `T`" without constructing one.
- **Definitions belong in the header.** As with function templates, defining members in a
  separate `.cpp` gives `undefined reference` errors at link time.
- **Dangling references.** Returning `const T&` to an element is efficient, but the
  reference dies with the element: it dangles after the element is popped, or after a
  `std::vector` member reallocates. Using it then is undefined behaviour.
- **Dependent names.** In a template, a nested type such as `std::vector<T>::iterator` needs
  `typename` in front of it, and members inherited from a templated base class need
  `this->`.
- **CTAD can surprise you.** `Box s{"hi"}` deduces `Box<const char*>`, not
  `Box<std::string>`. Spell the type out when it matters.

## What you will practise

You will write a generic `Stack<T>`, a `FixedVec<T, N>` with a compile-time capacity, and use
CTAD and a specialisation. The challenge is a `RingBuffer<T>`: a fixed-capacity queue that
overwrites its oldest element when full, works with move-only and non-default-constructible
types, and does every operation in O(1).
'''

[[unit.step]]
kind = "concept"
id = "cpp-u17-c1-type-blueprints"
title = "A blueprint for types"
points = 5
difficulty = 23
intro = '''
A class template is a recipe for a family of types. `Stack<int>` and `Stack<std::string>`
come from the same source code, but to the compiler they are two unrelated classes, each
generated and type-checked separately.
'''
body = '''
## Declaring a class template

```cpp
template <typename T>
class Stack {
public:
    void push(T value) { items_.push_back(std::move(value)); }
    const T& top() const { return items_.back(); }
    std::size_t size() const { return items_.size(); }

private:
    std::vector<T> items_;
};
```

`Stack` is not a type yet. `Stack<int>` is: writing it makes the compiler instantiate the
class with `T = int`. The member functions are instantiated lazily, one by one, the first
time each is called.

## Template arguments

- **Types:** `template <typename T>`.
- **Values:** `template <std::size_t N>`, known at compile time and baked into the type.
  `FixedVec<int, 3>` and `FixedVec<int, 4>` are different types.
- **Defaults:** `template <typename T, typename Alloc = std::allocator<T>>`, which is how
  `std::vector<int>` hides its second parameter.

## Deduction and specialisation

With CTAD the compiler deduces the arguments from a constructor call: `std::pair p{1, 2.5}`
is a `std::pair<int, double>`. An explicit specialisation, `template <> class Stack<bool>`,
gives one particular argument a completely different implementation.

## Designing for any `T`

A good generic container asks as little of `T` as possible. Taking values by `T` and moving
them in supports move-only types. Using `std::optional<T>` instead of default-constructed
slots supports types without a default constructor. Each operation you need from `T`
(copying, comparing, printing) is a requirement on every user of your container.
'''

