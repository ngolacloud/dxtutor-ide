#include <future>
#include <iostream>

long long sum_of_squares(int n) {
    long long s = 0;
    for (int i = 1; i <= n; ++i) s += static_cast<long long>(i) * i;
    return s;
}

int count_primes(int n) {
    int count = 0;
    for (int i = 2; i < n; ++i) {
        bool prime = true;
        for (int d = 2; d * d <= i; ++d) {
            if (i % d == 0) {
                prime = false;
                break;
