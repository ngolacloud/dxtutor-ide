    std::vector<int> v(n);
    for (std::size_t i = 0; i < n; ++i) {
        v[i] = static_cast<int>((i * 2654435761u) % 2000001) - 1000000;
    }
    std::vector<long long> prefix(n + 1, 0);
    for (std::size_t i = 0; i < n; ++i) {
        prefix[i + 1] = prefix[i] + v[i];
    }
    LL got = window_sums(v, k);
    CHECK_EQ(got.size(), n - k + 1);
    bool all_match = got.size() == n - k + 1;
    for (std::size_t i = 0; all_match && i < got.size(); ++i) {
        all_match = got[i] == prefix[i + k] - prefix[i];
    }
    CHECK(all_match);
}
