#include <sqlite3.h>
#include <stdexcept>
#include <string>
#include <thread>
#include <vector>

// Switch the database at `path` to WAL, create `nums (n INTEGER)`, insert the
// numbers 1..upto from `workers` threads (one connection per thread, each
// number exactly once), then return SELECT SUM(n), or 0 if nothing was inserted.
long long parallel_sum(const std::string& path, int upto, int workers) {
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <sqlite3.h>
#include <unistd.h>
#include <filesystem>
#include <string>

struct TempPath {
    std::string path;
    TempPath() {
        static int counter = 0;
        path = (std::filesystem::temp_directory_path() /
                ("dxt_psum_" + std::to_string(::getpid()) + "_" + std::to_string(counter++) + ".db"))
                   .string();
        clear();
    }
    ~TempPath() { clear(); }
    void clear() const {
        for (const char* suffix : {"", "-wal", "-shm"}) std::filesystem::remove(path + suffix);
    }
};

struct Inspection {
    std::string mode;
    long long count = -1, distinct = -1, min = -1, max = -1;
};

Inspection inspect(const std::string& path) {
    Inspection out;
    sqlite3* db = nullptr;
    sqlite3_open(path.c_str(), &db);
    sqlite3_busy_timeout(db, 2000);
    sqlite3_stmt* st = nullptr;
    sqlite3_prepare_v2(db, "PRAGMA journal_mode", -1, &st, nullptr);
    if (sqlite3_step(st) == SQLITE_ROW) out.mode = reinterpret_cast<const char*>(sqlite3_column_text(st, 0));
    sqlite3_finalize(st);
    sqlite3_prepare_v2(db,
                       "SELECT COUNT(*), COUNT(DISTINCT n), COALESCE(MIN(n), 0), COALESCE(MAX(n), 0)"
                       " FROM nums",
                       -1, &st, nullptr);
    if (sqlite3_step(st) == SQLITE_ROW) {
        out.count = sqlite3_column_int64(st, 0);
        out.distinct = sqlite3_column_int64(st, 1);
        out.min = sqlite3_column_int64(st, 2);
        out.max = sqlite3_column_int64(st, 3);
    }
    sqlite3_finalize(st);
    sqlite3_close(db);
    return out;
}

void check_rows(const Inspection& r, long long upto) {
    CHECK_EQ(r.count, upto);
    CHECK_EQ(r.distinct, upto);
    CHECK_EQ(r.min, upto > 0 ? 1LL : 0LL);
    CHECK_EQ(r.max, upto);
}

TEST(four_workers) {
    TempPath tmp;
    CHECK_EQ(parallel_sum(tmp.path, 100, 4), 5050LL);
    Inspection r = inspect(tmp.path);
    CHECK_EQ(r.mode, std::string("wal"));
    check_rows(r, 100);
}

TEST(single_worker) {
    TempPath tmp;
    CHECK_EQ(parallel_sum(tmp.path, 10, 1), 55LL);
    check_rows(inspect(tmp.path), 10);
}

TEST(more_workers_than_numbers) {
    TempPath tmp;
    CHECK_EQ(parallel_sum(tmp.path, 3, 8), 6LL);
    check_rows(inspect(tmp.path), 3);
}

TEST(nothing_to_insert) {
    TempPath tmp;
    CHECK_EQ(parallel_sum(tmp.path, 0, 4), 0LL);
    Inspection r = inspect(tmp.path);
    CHECK_EQ(r.mode, std::string("wal"));
    check_rows(r, 0);
}

TEST(uneven_split) {
    TempPath tmp;
    CHECK_EQ(parallel_sum(tmp.path, 7, 3), 28LL);
    check_rows(inspect(tmp.path), 7);
}

TEST(larger_input) {
    TempPath tmp;
    CHECK_EQ(parallel_sum(tmp.path, 3000, 6), 3000LL * 3001 / 2);
    Inspection r = inspect(tmp.path);
    CHECK_EQ(r.mode, std::string("wal"));
    check_rows(r, 3000);
}

TEST(connections_are_closed) {
    TempPath tmp;
    CHECK_EQ(parallel_sum(tmp.path, 50, 5), 1275LL);
    // With every connection closed, SQLite has checkpointed and deleted the log.
    CHECK(!std::filesystem::exists(tmp.path + "-wal"));
}
'''

[unit.step.gabarito]
solution = '''
#include <sqlite3.h>
#include <exception>
#include <memory>
#include <stdexcept>
#include <string>
#include <thread>
#include <vector>

namespace {

struct DbClose {
    void operator()(sqlite3* db) const { sqlite3_close(db); }
};
struct StmtFinalize {
    void operator()(sqlite3_stmt* st) const { sqlite3_finalize(st); }
};
using Db = std::unique_ptr<sqlite3, DbClose>;
using Stmt = std::unique_ptr<sqlite3_stmt, StmtFinalize>;

Db open_db(const std::string& path) {
    sqlite3* raw = nullptr;
    int rc = sqlite3_open(path.c_str(), &raw);
    Db db(raw);
    if (rc != SQLITE_OK) throw std::runtime_error(sqlite3_errmsg(raw));
    sqlite3_busy_timeout(raw, 5000);
    return db;
}

Stmt prepare(sqlite3* db, const char* sql) {
    sqlite3_stmt* raw = nullptr;
    if (sqlite3_prepare_v2(db, sql, -1, &raw, nullptr) != SQLITE_OK) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    return Stmt(raw);
}

void exec(sqlite3* db, const char* sql) {
    if (sqlite3_exec(db, sql, nullptr, nullptr, nullptr) != SQLITE_OK) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
}

// One worker: its own connection, one IMMEDIATE transaction, numbers w+1, w+1+step, ...
void insert_share(const std::string& path, int first, int step, int upto) {
    Db db = open_db(path);
    exec(db.get(), "BEGIN IMMEDIATE");
    Stmt insert = prepare(db.get(), "INSERT INTO nums (n) VALUES (?)");
    for (int n = first; n <= upto; n += step) {
        sqlite3_bind_int(insert.get(), 1, n);
        if (sqlite3_step(insert.get()) != SQLITE_DONE) {
            throw std::runtime_error(sqlite3_errmsg(db.get()));  // closing db rolls back
        }
        sqlite3_reset(insert.get());
    }
    insert.reset();
    exec(db.get(), "COMMIT");
}

}  // namespace

long long parallel_sum(const std::string& path, int upto, int workers) {
    Db db = open_db(path);
    Stmt mode = prepare(db.get(), "PRAGMA journal_mode=WAL");
    const unsigned char* text =
        sqlite3_step(mode.get()) == SQLITE_ROW ? sqlite3_column_text(mode.get(), 0) : nullptr;
    if (!text || std::string(reinterpret_cast<const char*>(text)) != "wal") {
        throw std::runtime_error("could not switch the database to WAL");
    }
    mode.reset();
    exec(db.get(), "CREATE TABLE IF NOT EXISTS nums (n INTEGER)");

    std::vector<std::exception_ptr> errors(workers);
    {
        std::vector<std::thread> pool;
        for (int w = 0; w < workers; ++w) {
            pool.emplace_back([&path, &errors, w, workers, upto] {
                try {
                    insert_share(path, w + 1, workers, upto);
                } catch (...) {
                    errors[w] = std::current_exception();
                }
            });
        }
        for (auto& t : pool) t.join();
    }
    for (const auto& e : errors) {
        if (e) std::rethrow_exception(e);
    }

    Stmt sum = prepare(db.get(), "SELECT COALESCE(SUM(n), 0) FROM nums");
    if (sqlite3_step(sum.get()) != SQLITE_ROW) {
        throw std::runtime_error(sqlite3_errmsg(db.get()));
    }
    return sqlite3_column_int64(sum.get(), 0);
}
'''
time = "O(n log n)"
space = "O(w)"
justification = '''
Each of the **n** = `upto` numbers is inserted exactly once. An insert appends to the table's
B-tree, which costs **O(log n)** in the worst case (amortised close to O(1) for appends at
the end), so the total work is **O(n log n)**. The final `SUM` scans the n rows once, **O(n)**.

The writes do not run in parallel: WAL still allows a single writer, so the workers take turns
holding the write lock. That is why each worker uses **one** `BEGIN IMMEDIATE` transaction for
its whole share: the lock changes hands **w** times instead of n times, and each commit pays
for one sync to disk instead of one per row.

Extra memory in your program is **O(w)** for **w** workers: one thread, one connection and one
`exception_ptr` each. The rows themselves live in the database file, not in memory.
'''

# ---------------------------------------------------------------------------
# 19 · The N+1 query problem
# ---------------------------------------------------------------------------

[[unit]]
id = "cpp-udb4-n-plus-one"
title = "The N+1 query problem"
level = "intermediate"
difficulty = 19
intro = '''
A loop that runs one query per item is the N+1 anti-pattern: one query fetches a list, then N
more fetch something for each element. Each query pays a fixed cost, so the total grows with N.
You will count the statements with `sqlite3_trace_v2`, fold the work into one `IN (...)` query
and one `JOIN`, and then load related rows with exactly one statement.
'''
concepts = '''
## The idea

Every statement sent to a database has a fixed cost on top of the actual work: the request travels to the server, the SQL is parsed and planned, the engine starts up, and the result travels back. That is a **round trip**. Over a network it often costs around a millisecond, far more than finding a few rows in an index.

The **N+1 problem** appears when code first runs one query to get a list (the "1"), then loops over the list and runs one more query per item (the "N"). With 3 items nobody notices. With 10 000 items, a page that runs 10 001 queries takes seconds, and the database spends most of its time on overhead. It often hides inside helpers that load related records lazily, where each query looks innocent.

The fix is to think in **sets**. SQL is built to process many rows per statement: `WHERE id IN (...)` filters by a list, `JOIN` combines related tables, and aggregates such as `SUM` and `COUNT` summarise inside the database. One statement, one round trip, whatever N is.

## How C++ does it

The C API never batches or hides anything: every `sqlite3_step` on a freshly reset statement is one execution. The shape of your C++ code *is* the shape of your database traffic, and a `step` inside a `for` loop over ids is the warning sign. Note that a prepared statement saves the parsing, not the executions: reusing one statement N times still runs N queries.

You can make the traffic visible. `sqlite3_trace_v2(db, SQLITE_TRACE_STMT, callback, context)` calls your callback each time a statement starts running, with the `sqlite3_stmt*`; `sqlite3_expanded_sql` shows its SQL with the bound values filled in.

```cpp
int count_stmt(unsigned, void* ctx, void*, void*) {
    ++*static_cast<int*>(ctx);
    return 0;
}
int statements = 0;
sqlite3_trace_v2(db, SQLITE_TRACE_STMT, count_stmt, &statements);
// ... the code you want to measure ...
sqlite3_trace_v2(db, 0, nullptr, nullptr);   // tracing off
```

When the list comes from your program, an `IN` clause needs one `?` per element, and each value is bound by position. The SQL text then depends on how many elements there are, but the values still never enter it. When the related data lives in another table, a `JOIN` fetches both sides in one statement, and stepping through its rows is fine: they were all produced by that one execution.

## What is special or tricky

- A placeholder binds one scalar. There is no way to bind a `std::vector` to a single `?`; generate `?, ?, ?` and bind each element.
- SQLite accepts an empty `IN ()`, but most databases reject it. Decide what an empty input means, and usually skip the query entirely.
- SQLite limits the number of parameters per statement (32 766 by default since version 3.32, only 999 before). Very long lists must be sent in chunks.
- `SUM` over zero rows is `NULL`, and `sqlite3_column_int` turns `NULL` into 0 silently; `COALESCE(SUM(x), 0)` says what you mean.
- The trace callback is a plain C function pointer. A lambda works only if it captures nothing; pass your state through the `void*` context.
- SQLite runs in-process, so its round trips are cheap. The same loop against a server across a network crawls; the habit matters more than the local timing.

## What you will practise

You will run the N+1 loop on purpose and count its statements, then fold the same work into one `IN (...)` query and into one `JOIN`. The challenge checks that you load related rows with exactly one statement.
'''

[[unit.step]]
kind = "concept"
id = "cpp-udb4-c1-sets"
title = "One query, not N"
points = 5
difficulty = 19
intro = '''
The cost of a database call has a fixed part (the round trip, parsing, planning) and a variable
part (the rows). The N+1 pattern pays the fixed part N times; a set-based query pays it once,
which is why it scales.
'''
body = '''
## N+1 versus a single query

```cpp
// N+1: one execution per id
for (int id : ids) {
    sqlite3_bind_int(one.get(), 1, id);          // SELECT price FROM orders WHERE id = ?
    if (sqlite3_step(one.get()) == SQLITE_ROW) total += sqlite3_column_int(one.get(), 0);
    sqlite3_reset(one.get());
}

// One execution for the whole set
std::string sql = "SELECT COALESCE(SUM(price), 0) FROM orders WHERE id IN (";
for (std::size_t i = 0; i < ids.size(); ++i) sql += i ? ", ?" : "?";
sql += ")";
// prepare sql, then bind ids[i] to placeholder i + 1 and step once
```

- The loop runs **N** executions, each paying the fixed cost.
- The set-based version runs **one**. The loop that builds the SQL only adds `?` marks; the
  ids themselves are still bound as parameters, never pasted into the text.
- When the data you need lives in a related table, a **`JOIN`** brings it back in the same
  statement instead of one lookup per row.

## Measure, don't guess

`sqlite3_trace_v2` with `SQLITE_TRACE_STMT` calls your function every time a statement starts
running. Count those calls around a piece of code and you know exactly how many queries it
issues. It is the simplest way to catch an N+1 loop hidden inside a helper function, and a
test can assert on the count.
'''

