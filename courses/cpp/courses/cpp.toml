#include <algorithm>
#include <cstddef>
#include <iostream>
#include <vector>

std::size_t lower_bound_index(const std::vector<int>& v, int target) {
    std::size_t lo = 0, hi = v.size();
    while (lo < hi) {
        std::size_t mid = lo + (hi - lo) / 2;
        if (v[mid] < target) {
            lo = mid + 1;
        } else {
            hi = mid;
        }
    }
    return lo;
}

int main() {
    const std::vector<int> v{1, 3, 3, 3, 8, 13};
    bool agrees = true;
    for (int t : {3, 4, 0, 20}) {
        std::size_t i = lower_bound_index(v, t);
        bool found = i < v.size() && v[i] == t;
        std::cout << t << " -> index " << i << (found ? " (found)" : " (missing)") << '\n';
        agrees = agrees && i == static_cast<std::size_t>(std::lower_bound(v.begin(), v.end(), t) - v.begin());
    }
    std::cout << std::boolalpha << "matches std::lower_bound: " << agrees << '\n';
