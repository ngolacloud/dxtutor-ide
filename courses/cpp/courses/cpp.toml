target = '''
#include <future>
#include <iostream>
#include <numeric>
#include <vector>

long long sum_range(const std::vector<int>& v, std::size_t begin, std::size_t end) {
    return std::accumulate(v.begin() + begin, v.begin() + end, 0LL);
}

int main() {
    std::vector<int> data(100'000);
    std::iota(data.begin(), data.end(), 1);
    const std::size_t chunks = 4;
    std::vector<std::future<long long>> parts;
    for (std::size_t c = 0; c < chunks; ++c) {
        std::size_t begin = c * data.size() / chunks;
        std::size_t end = (c + 1) * data.size() / chunks;
        parts.push_back(std::async(std::launch::async, sum_range, std::cref(data), begin, end));
    }
    long long total = 0;
    for (std::size_t c = 0; c < chunks; ++c) {
        long long part = parts[c].get();
        std::cout << "chunk " << c << " = " << part << '\n';
        total += part;
    }
    std::cout << "total = " << total << '\n';
}
