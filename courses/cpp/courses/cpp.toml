#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

struct Dir {
    std::string name;
    int own_kb;
    std::vector<Dir> children;
};

int total_kb(const Dir& d) {
    int sum = d.own_kb;
    for (const Dir& child : d.children) sum += total_kb(child);
