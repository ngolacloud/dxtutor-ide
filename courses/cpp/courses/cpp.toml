[unit.step.gabarito]
solution = '''
#include <atomic>
#include <filesystem>
#include <fstream>
#include <random>
#include <stdexcept>
#include <string>
#include <system_error>
#include <utility>

class TempFile {
public:
    explicit TempFile(const std::string& contents) : path_(unique_path()) {
        std::ofstream out(path_, std::ios::binary);
        if (!out) {
            path_.clear();
            throw std::runtime_error("cannot create a temporary file");
        }
        out.write(contents.data(), static_cast<std::streamsize>(contents.size()));
        out.close();
        if (!out) {
            remove_file();
            throw std::runtime_error("cannot write the temporary file");
        }
    }

    ~TempFile() { remove_file(); }

    TempFile(const TempFile&) = delete;
    TempFile& operator=(const TempFile&) = delete;

    TempFile(TempFile&& other) noexcept : path_(std::exchange(other.path_, {})) {}

    TempFile& operator=(TempFile&& other) noexcept {
        if (this != &other) {
            remove_file();
            path_ = std::exchange(other.path_, {});
        }
        return *this;
    }

    const std::filesystem::path& path() const { return path_; }

private:
    void remove_file() noexcept {
        if (!path_.empty()) {
            std::error_code ec;
            std::filesystem::remove(path_, ec);
            path_.clear();
        }
    }

    static std::filesystem::path unique_path() {
        static std::atomic<unsigned long long> counter{0};
        static const unsigned int seed = std::random_device{}();
        const std::filesystem::path dir = std::filesystem::temp_directory_path();
        std::filesystem::path candidate;
        do {
            candidate = dir / ("dxt-tempfile-" + std::to_string(seed) + "-" +
                               std::to_string(++counter));
        } while (std::filesystem::exists(candidate));
        return candidate;
    }

    std::filesystem::path path_;
};
'''
time = "O(n) to create, O(1) to move"
space = "O(1)"
justification = '''
Creating a `TempFile` writes the `n` bytes of `contents` once, so construction is **O(n)**
(plus the constant cost of opening the file and checking that the name is free). Moving is
**O(1)**: `std::exchange` moves a `std::filesystem::path`, which only transfers its internal
buffer, and empties the source. Destruction is one `remove` call. The object itself holds a
single path, so its memory is **O(1)**, independent of the file's size: the contents live on
disk, not in the object.

The correctness argument is about ownership. At any moment each file has exactly one owner,
the `TempFile` whose `path_` names it. The copy operations are deleted, so a second owner can
never appear; the move operations hand ownership over and leave the source's `path_` empty,
and an empty path makes `remove_file` do nothing, so the moved-from destructor deletes
nothing. Move assignment releases the old file *before* taking the new one, otherwise that
file would leak on disk. `remove_file` uses the `std::error_code` overload and is
`noexcept`, because a destructor that throws terminates the program. Marking the moves
`noexcept` also matters in practice: `std::vector` moves its elements when it reallocates only
if the move constructor cannot throw. Finally, if the constructor fails after creating the
file, it removes the file itself, because a constructor that throws never gets its destructor
called.
'''

# ── g3-own ────────────────────────────────────────────────────────────

[[unit]]
id = "cpp-u12-smart-pointers"
title = "Smart pointers & ownership"
level = "intermediate"
difficulty = 12
intro = '''
Every object on the heap needs one clear answer to the question "who deletes this, and when?".
Smart pointers are RAII applied to heap memory: `std::unique_ptr` for a single owner,
`std::shared_ptr` for shared ownership, and `std::weak_ptr` for watching without owning. You
will move ownership around, count owners, break a reference cycle, and finish with a cache that
hands out shared objects without keeping them alive.
'''
concepts = '''
## The idea

When you write `new`, you take on a debt: exactly one `delete`, at the right moment, on every
path out of your code, including the paths an exception takes. Forget it and you **leak**. Do
it twice and you get **undefined behaviour**. Use the object after it and you read freed memory.
Raw pointers cannot tell you which of these you are about to do, because a raw pointer does not
say whether it **owns** the object or merely points at it.

**Ownership** is the fix. Exactly one thing, or a well-defined group of things, is responsible
for destroying each object, and the type system records who. Unit 11 showed RAII: tie cleanup to
a destructor and scope does the rest. A **smart pointer** is a small RAII object that owns a heap
object and deletes it in its own destructor.

## How C++ does it

- **`std::unique_ptr<T>`** is the only owner. It cannot be copied, only **moved**, so ownership
  is transferred explicitly with `std::move`. It costs nothing over a raw pointer.
- **`std::shared_ptr<T>`** shares ownership. A **control block** counts the owners; the last
  one to go deletes the object. Copying a `shared_ptr` increments the count.
- **`std::weak_ptr<T>`** observes an object owned by `shared_ptr`s without counting as an owner.
  Call `lock()` to get a temporary `shared_ptr`, which is empty if the object has already died.

```cpp
#include <memory>

auto file = std::make_unique<Config>("app.ini");   // one owner
auto other = std::move(file);                       // file is now null
auto img = std::make_shared<Image>(640, 480);       // use_count() == 1
std::weak_ptr<Image> seen = img;                    // still 1
if (auto alive = seen.lock()) { alive->draw(); }    // alive while we use it
```

Prefer `std::make_unique` and `std::make_shared` to a bare `new`: they never leave a raw owning
pointer lying around, and `make_shared` allocates the object and its control block together.

## Pitfalls

- **Copying a `unique_ptr`** is a compile error: *use of deleted function
  `unique_ptr(const unique_ptr&)`*. Move it, or pass a reference if the callee only looks.
- **Using a pointer after moving from it** dereferences null, which is undefined behaviour. A
  moved-from `unique_ptr` is guaranteed to be empty, so test it before use.
- **Two smart pointers built from the same raw pointer** each think they own it, so the object
  is deleted twice. Create the smart pointer once and copy or move *that*.
- **`shared_ptr` cycles leak.** If A owns B and B owns A, neither count ever reaches zero. Make
  the back-reference a `weak_ptr`.
- **`get()` returns a non-owning raw pointer.** Never `delete` it, and never keep it after the
  owner is gone, or it dangles.

A useful rule for function signatures: take `T&` or `const T&` to use an object, take
`std::unique_ptr<T>` by value to take ownership of it, and take `std::shared_ptr<T>` by value
only when the function really keeps a share.

## What you will practise

You will transfer a `unique_ptr` into a function, watch `use_count()` rise and fall, and break a
parent/child cycle with `weak_ptr`. The challenge is a texture cache that shares objects through
`shared_ptr` but remembers them through `weak_ptr`, so it never keeps anything alive by itself.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u12-c1-ownership"
title = "Owners, observers and the three smart pointers"
points = 5
difficulty = 12
intro = '''
Ownership is a contract about lifetime: the owner destroys the object, and everybody else must
stop using it before that happens. C++ smart pointers encode the contract in the type, so the
compiler and the destructor enforce it instead of your memory.
'''
body = '''
## One owner: `std::unique_ptr`

```cpp
auto p = std::make_unique<int>(7);   // p owns an int on the heap
auto q = std::move(p);               // q owns it now; p is null
```

When `q` goes out of scope, its destructor deletes the `int`. Copying is forbidden, so there can
never be two owners by accident. Moving is a cheap pointer swap.

## Many owners: `std::shared_ptr`

```cpp
auto a = std::make_shared<int>(7);   // a.use_count() == 1
auto b = a;                          // both own it: use_count() == 2
```

The object dies when the **last** `shared_ptr` to it is destroyed or reset. The count lives in
a separate control block, and updating it is an atomic operation, so `shared_ptr` costs more
than `unique_ptr`. Reach for it only when ownership really is shared.

## An observer: `std::weak_ptr`

```cpp
std::weak_ptr<int> w = a;            // does not change use_count()
if (auto s = w.lock()) { /* *s is safe to use here */ }
```

`lock()` either gives you a new `shared_ptr` (so the object cannot die while you use it) or an
empty one when the object is already gone. `expired()` asks the same question without locking.

## Choosing

Start with `unique_ptr`; it is the default for heap objects. Upgrade to `shared_ptr` when
several parts of the program must keep the object alive and none of them is clearly in charge.
Use `weak_ptr` for back-references and caches. Plain references and raw pointers remain fine
for **using** an object that someone else owns, as long as the owner outlives the use.
'''

