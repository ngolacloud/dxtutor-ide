instructions = '''
## Your turn

Implement the function `parse_time`:

```cpp
bool parse_time(std::string_view text, int& hours, int& minutes);
```

`text` should be a time of day in the 24-hour form `HH:MM`: exactly five characters, two
digits, a colon, two digits.

- If `text` is valid, store the hours in `hours`, the minutes in `minutes`, and return `true`.
- Otherwise return `false` and **leave `hours` and `minutes` unchanged**.

`text` is valid only if:

- it has exactly 5 characters;
- characters 0, 1, 3 and 4 are digits `0`–`9`, and character 2 is `:`;
- the hours are from 0 to 23 and the minutes from 0 to 59.

Examples:

- `parse_time("09:30", h, m)` returns `true` and sets `h = 9`, `m = 30`
- `parse_time("23:59", h, m)` returns `true` and sets `h = 23`, `m = 59`
- `parse_time("24:00", h, m)` returns `false`, and `h` and `m` keep their old values
- `parse_time("9:30", h, m)` returns `false` (only 4 characters)

Do not write a `main` function: the tests provide their own.

**Hint:** a digit character `c` has the numeric value `c - '0'`, and `c` is a digit when
`c >= '0' && c <= '9'`. Small helper functions keep this readable. Compute both numbers into
local variables first, and only assign to the reference parameters once everything checks out.

Hidden tests decide correctness. Implement it, then submit.
