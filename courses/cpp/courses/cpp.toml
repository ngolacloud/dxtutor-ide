[[unit]]
id = "cpp-udb2-transactions"
title = "Transactions: all or nothing"
level = "intermediate"
difficulty = 17
intro = '''
A transaction groups several statements so that either all of them take effect or none do.
The SQLite C API never opens one for you: you send `BEGIN`, then `COMMIT` to keep the changes
or `ROLLBACK` to throw them away. You will make the rollback automatic with a small RAII guard,
and use it to build a money transfer that can never leave the books half-updated.
'''
concepts = '''
## The idea

A **transaction** groups several statements into one unit of work that is **atomic**: either every change takes effect, or none does. Moving money is the classic example. Subtracting from one account and adding to another must never be half-done, even if the second statement fails or the program crashes between them. Transactions also give **isolation** (other connections do not see your unfinished changes) and **durability** (once committed, a change survives a crash). With consistency, these are the **ACID** guarantees.

You open a transaction with `BEGIN`, keep its changes with `COMMIT`, or discard them with `ROLLBACK`.

## How C++ does it

The C API does nothing behind your back. A connection starts in **autocommit** mode: each statement is its own tiny transaction, committed as soon as it finishes. `BEGIN` switches autocommit off until the next `COMMIT` or `ROLLBACK`, and `sqlite3_get_autocommit(db)` returns non-zero exactly when no transaction is open.

```cpp
sqlite3_exec(db, "BEGIN", nullptr, nullptr, nullptr);
// ... several UPDATEs ...
sqlite3_exec(db, "COMMIT", nullptr, nullptr, nullptr);
```

The hard part is the error path. Every early `return` and every exception between `BEGIN` and `COMMIT` must roll back, and code with five ways out has five places to forget. C++ already has a tool that runs on *every* way out of a scope: the destructor. A **transaction guard** runs `BEGIN` in its constructor and `ROLLBACK` in its destructor, unless `commit()` was called first. It is the idea behind `std::lock_guard`, applied to a database.

```cpp
class Transaction {
public:
    explicit Transaction(sqlite3* db);   // BEGIN
    void commit();                       // COMMIT, and remember it
    ~Transaction();                      // ROLLBACK unless committed
};
```

## What is special or tricky

- **A failed statement does not end the transaction.** When a `CHECK` constraint rejects an `UPDATE`, SQLite undoes that one statement and returns `SQLITE_CONSTRAINT`, but the earlier statements are still pending. Rolling back is your job.
- **Updating a missing row is not an error.** `UPDATE ... WHERE id = 99` succeeds and changes nothing. `sqlite3_changes(db)` tells you how many rows the last statement touched.
- **Destructors must not throw.** A destructor runs during stack unwinding, and a second exception at that moment calls `std::terminate`. The guard ignores the result of its `ROLLBACK`.
- **Copying a guard is a bug.** Two guards for one transaction would roll it back twice. Delete the copy operations.
- **No nesting.** `BEGIN` inside an open transaction fails with "cannot start a transaction within a transaction"; `SAVEPOINT` exists for nested units.
- **Keep transactions short.** An open write transaction blocks every other writer.
- **A forgotten `COMMIT` loses the work silently.** Closing the connection rolls it back.

## What you will practise

You will commit and roll back by hand, write a guard that rolls back when an exception escapes, and watch a constraint reject the second half of a transfer. The challenge is a money transfer that must commit completely or not at all.
'''

[[unit.step]]
kind = "concept"
id = "cpp-udb2-c1-guard"
title = "BEGIN, COMMIT, ROLLBACK and a guard"
points = 5
difficulty = 17
intro = '''
Atomicity is a promise about failure: whatever goes wrong in the middle, the database ends up
as if the whole unit ran, or none of it did. SQLite keeps its side of the promise with a
journal on disk; your code keeps its side by always ending a transaction with `COMMIT` or
`ROLLBACK`.
'''
body = '''
## Autocommit and explicit transactions

By default every statement commits on its own. To make several statements one unit, wrap them:

```cpp
sqlite3_exec(db, "BEGIN", nullptr, nullptr, nullptr);
sqlite3_exec(db, "UPDATE accounts SET balance = balance - 30 WHERE id = 1", nullptr, nullptr, nullptr);
sqlite3_exec(db, "UPDATE accounts SET balance = balance + 30 WHERE id = 2", nullptr, nullptr, nullptr);
sqlite3_exec(db, "COMMIT", nullptr, nullptr, nullptr);
```

- **`BEGIN`** opens the transaction; `sqlite3_get_autocommit(db)` now returns 0.
- **`COMMIT`** makes every change permanent and visible to other connections.
- **`ROLLBACK`** discards every change made since `BEGIN`.

## Let a destructor roll back

```cpp
struct Transaction {
    sqlite3* db;
    bool done = false;
    explicit Transaction(sqlite3* d) : db(d) { sqlite3_exec(db, "BEGIN", nullptr, nullptr, nullptr); }
    void commit() { sqlite3_exec(db, "COMMIT", nullptr, nullptr, nullptr); done = true; }
    ~Transaction() { if (!done) sqlite3_exec(db, "ROLLBACK", nullptr, nullptr, nullptr); }
};
```

Create the guard at the top of a block and call `commit()` as its last line. Any `return`,
any `throw`, any branch you forgot leaves the scope without committing, and the destructor
rolls back. You cannot forget the error path, because there is no error path to write.

A production guard also checks the result codes of `BEGIN` and `COMMIT` and throws when
they fail. It never throws from the destructor.
'''

