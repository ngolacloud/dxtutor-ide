prompt = '''
Write a `Countdown` class with a nested `iterator` so that `for (int n : Countdown(5))`
counts down to 1, and use the same iterator with an explicit loop.

**Why:** range-for is a rewrite into iterator calls, so understanding the iterator protocol
lets you make your own types loopable.
'''
target = '''
#include <iostream>

class Countdown {
public:
    explicit Countdown(int from) : from_(from > 0 ? from : 0) {}

    class iterator {
    public:
        explicit iterator(int value) : value_(value) {}
        int operator*() const { return value_; }
        iterator& operator++() {
            --value_;
            return *this;
        }
        bool operator==(const iterator&) const = default;

    private:
        int value_;
    };

    iterator begin() const { return iterator(from_); }
    iterator end() const { return iterator(0); }

private:
    int from_;
};

int main() {
    for (int n : Countdown(5)) {
        std::cout << n << ' ';
    }
    std::cout << "liftoff\n";
    Countdown three(3);
    for (auto it = three.begin(); it != three.end(); ++it) {
        std::cout << '[' << *it << ']';
    }
    std::cout << '\n';
}
'''
