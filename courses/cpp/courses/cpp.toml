[[unit]]
id = "cpp-udb3-wal-pool"
title = "WAL mode & connections"
level = "intermediate"
difficulty = 18
intro = '''
A database shared by several threads needs two things: a journal mode that lets readers and a
writer work at the same time, and a connection per thread. SQLite's Write-Ahead Logging (WAL)
gives the first, and RAII makes the second a one-liner. You will switch a file database to WAL,
watch a reader keep its snapshot while a writer commits, and have several threads insert
through their own connections to an exact total.
'''
concepts = '''
## The idea

A database file shared by several threads has to answer a hard question: what does a reader see while a writer is half-way through? SQLite's original answer, the **rollback journal**, copies the old pages aside and then edits the file in place. Readers must therefore leave before a writer can commit, and new readers wait while it does.

**Write-Ahead Logging (WAL)** turns that around. A writer never edits the main file during a transaction; it **appends** the changed pages to a side file, `name.db-wal`, and a commit is just a marker at the end of that log. A reader notes how much of the log existed when its transaction started and reads that **snapshot** until it finishes. Readers never block the writer, and the writer never blocks readers. From time to time a **checkpoint** copies logged pages back into the main file. One rule remains: **one writer at a time**.

## How C++ does it

WAL is a property of the database file, switched on with a pragma that answers with the new mode as a one-row result:

```cpp
sqlite3_exec(db, "PRAGMA journal_mode=WAL", print_row, nullptr, nullptr);  // prints "wal"
```

The setting persists: every later connection to that file uses WAL. It needs a real file (an in-memory database has no log), and it creates two companions next to it, `-wal` and `-shm`.

Because there is a single writer, a second writer that arrives while the lock is held gets `SQLITE_BUSY` at once. `sqlite3_busy_timeout(db, 5000)` makes SQLite retry for up to five seconds instead, which is almost always what you want.

The other rule is **one connection per thread**. A thread-safe SQLite build lets threads share a `sqlite3*`, but it then serialises every call behind a mutex, and a transaction belongs to the connection, so two threads would end up inside each other's `BEGIN`. Open a connection inside each thread and let a `unique_ptr` close it when the thread's function returns.

```cpp
std::vector<std::thread> pool;
for (int w = 0; w < 4; ++w)
    pool.emplace_back([&path] { /* open, write, close */ });
for (auto& t : pool) t.join();
```

Threads get a unit of their own later. Here you only need `std::thread` to start a function and `join` to wait for it to finish.

## What is special or tricky

- **Upgrade deadlocks.** A plain `BEGIN` is *deferred*: it takes the write lock at the first write. Two such transactions that both read first and then write can leave one with `SQLITE_BUSY` that no timeout can resolve. `BEGIN IMMEDIATE` takes the write lock up front, so the busy timeout can do its job.
- **Cleanup means three files**: the database, `-wal` and `-shm`, removed only after every connection is closed.
- **An exception that escapes a thread's function calls `std::terminate`.** Catch inside the thread and hand the error back, for example with `std::exception_ptr`.
- **Statements belong to their connection.** Never share a `sqlite3_stmt*` between threads either.

## What you will practise

You will switch a file database to WAL, watch a reader keep its snapshot while a writer commits, and have four threads insert through their own connections. The challenge sums numbers inserted in parallel and checks that each one arrived exactly once.
'''

[[unit.step]]
kind = "concept"
id = "cpp-udb3-c1-wal"
title = "WAL and one connection per thread"
points = 5
difficulty = 18
intro = '''
Concurrency control decides what each transaction sees and who must wait. WAL gives every
reader a consistent snapshot without locking the writer out, which is a simple form of
multi-version concurrency control. The single-writer rule and a busy timeout handle the rest.
'''
body = '''
## Three moves for a shared database

```cpp
sqlite3* raw = nullptr;
sqlite3_open(path.c_str(), &raw);
Db db(raw);                                         // closed when db goes out of scope
sqlite3_busy_timeout(db.get(), 5000);               // wait up to 5 s for the write lock
sqlite3_exec(db.get(), "PRAGMA journal_mode=WAL", nullptr, nullptr, nullptr);
```

- **`PRAGMA journal_mode=WAL`** switches the *file* to write-ahead logging. It is stored in
  the database, so you only need it once, but repeating it is harmless.
- **`sqlite3_busy_timeout`** belongs to the *connection*: set it on every connection you
  open. Without it, a writer that finds the lock taken fails at once with `SQLITE_BUSY`.
- **`BEGIN IMMEDIATE`** grabs the write lock when the transaction starts, so a writer either
  waits its turn at the beginning or not at all.

## One connection per thread

```cpp
std::thread worker([&path] {
    Db db = open_db(path);                          // this thread's own connection
    sqlite3_exec(db.get(), "BEGIN IMMEDIATE", nullptr, nullptr, nullptr);
    // ... inserts ...
    sqlite3_exec(db.get(), "COMMIT", nullptr, nullptr, nullptr);
});                                                 // db closed when the lambda ends
worker.join();
```

The lambda captures `path` by reference, which is safe because `join` waits for the thread
before `path` can go out of scope. Each thread opens, uses and closes its own connection, so
no `sqlite3*` or `sqlite3_stmt*` is ever touched by two threads.
'''

