title = "Sort and count inversions"
points = 40
difficulty = 33
entry = "sort_and_count"
intro = '''
An inversion is a pair of elements that are out of order, and counting them measures how far a
sequence is from sorted. Checking every pair is O(n²), but merge sort can count them for free:
during the merge, each element taken from the right half jumps over everything still waiting in
the left half. That turns an O(n²) question into an O(n log n) one.
'''
instructions = '''
## Your turn

Implement `sort_and_count`:

```cpp
std::pair<std::vector<int>, long long> sort_and_count(const std::vector<int>& items);
```

Return a pair:

1. a **new** vector with the items in ascending order (`items` itself is `const`);
2. the number of **inversions** in `items`: pairs of indexes `i < j` with
   `items[i] > items[j]`. Equal items are not an inversion.

Examples:

- `sort_and_count({})` returns `{{}, 0}`.
- `sort_and_count({2, 4, 1, 3, 5})` returns `{{1, 2, 3, 4, 5}, 3}`. The inversions are
  (2, 1), (4, 1) and (4, 3).
- `sort_and_count({3, 1, 3, 1})` returns `{{1, 1, 3, 3}, 3}`.
- `sort_and_count({5, 4, 3, 2, 1})` returns `{{1, 2, 3, 4, 5}, 10}`.

The hidden tests include vectors of up to 1,000,000 items, so checking every pair is far too
slow. Write the sort yourself with divide and conquer. A reversed vector of 100,000 items has
4,999,950,000 inversions: that does not fit in an `int`, which is why the count is `long long`.

**Hint:** sort the two halves recursively, each returning its own count. Inversions inside a
half are already counted; what remains is pairs with one item in each half. During the merge,
when an item from the right half is strictly smaller than the current item of the left half,
how many left-half items does it form an inversion with?

Hidden tests decide correctness.
'''
