intro = '''
Deletion is the hardest BST operation because it must repair the tree's shape while preserving
the BST property. A leaf just disappears, a node with one child is replaced by that child, and
a node with two children takes the key of its in-order successor, which is then removed from
the right subtree. All three cases follow one root-to-leaf path, so deletion is O(h).
