solution = '''
#include <cstddef>
#include <vector>

std::vector<long long> window_sums(const std::vector<int>& values, std::size_t k) {
    std::vector<long long> sums;
    if (k == 0 || k > values.size()) {
        return sums;
    }
    sums.reserve(values.size() - k + 1);

    long long sum = 0;
    for (std::size_t i = 0; i < k; ++i) {
        sum += values[i];
    }
    sums.push_back(sum);

    for (std::size_t i = k; i < values.size(); ++i) {
        sum += values[i];
        sum -= values[i - k];
        sums.push_back(sum);
    }
    return sums;
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
The first loop adds the first `k` elements, and the second loop handles each of the remaining
`n - k` elements with one addition, one subtraction and one `push_back`. Every element is
therefore added once and subtracted at most once, so the time is **O(n)**, independent of
`k`. Thanks to `reserve`, the `push_back` calls never reallocate.

The result holds `n - k + 1` sums, which is **O(n)** space; apart from the output, the
function uses O(1) extra memory (the running `sum` and the loop index).

The invariant is that, after handling index `i`, `sum` equals the window ending at `i`:
adding `values[i]` extends the window on the right, and subtracting `values[i - k]` drops the
element that fell off the left. Recomputing each window from scratch would be O(n·k), which
for n = 200,000 and k = 1,000 means 200 million additions instead of 400,000. Checking
`k > values.size()` before the subtraction matters, because `std::size_t` is unsigned and
`values.size() - k` would otherwise wrap around.
'''

[[unit]]
id = "cpp-u09-maps-sets"
title = "Maps & sets"
level = "intermediate"
difficulty = 9
intro = '''
Sequences answer "what is at position i?"; associative containers answer "what goes with
this key?" and "have I seen this before?". You will count with `std::map`, look things up in
the hash-based `std::unordered_map`, keep unique sorted values in `std::set`, and learn to
choose between them by what each operation costs.
'''
concepts = '''
## The idea

Many problems are about **keys** rather than positions: the price of a product by its name,
how many times each word appears, whether a user name is already taken. An **associative
container** stores elements by key and finds them without scanning everything. The standard
library offers two families with almost the same interface:

- **Ordered** (`std::map`, `std::set`): a balanced binary search tree, usually a red-black
  tree. Keys stay sorted; lookup, insertion and removal are O(log n), and iteration visits
  the keys in ascending order.
- **Unordered** (`std::unordered_map`, `std::unordered_set`): a hash table. Lookup,
  insertion and removal are O(1) on average and O(n) in the worst case, and the iteration
  order is unspecified.

A **map** stores key-value pairs; a **set** stores keys alone.

## How C++ does it

```cpp
#include <map>
#include <string>

std::map<std::string, int> stock{{"apple", 3}, {"pear", 0}};
stock["kiwi"] = 7;                        // insert, or overwrite if present
stock.insert({"apple", 99});              // no effect: "apple" already exists
if (auto it = stock.find("pear"); it != stock.end()) {
    std::cout << it->first << ' ' << it->second << '\n';
}
bool has_plum = stock.contains("plum");   // C++20
stock.erase("pear");
for (const auto& [name, qty] : stock) {   // visits apple, kiwi: sorted
    std::cout << name << '=' << qty << '\n';
}
```

Each element of a map is a `std::pair<const Key, Value>`, and a structured binding such as
`auto& [k, v]` unpacks it. The key is `const` because changing it in place would break the
tree's order.

## Counting

`++counts[key];` is the heart of countless programs. When the key is missing, `operator[]`
inserts it with a **value-initialised** value, which is 0 for `int`, and then increments it.
One line both creates and updates the counter.

## Pitfalls

- **`operator[]` inserts.** Writing `m[key]` merely to look something up silently adds an
  entry. Test with `find`, `contains` or `count`, and read with `at`, which throws
  `std::out_of_range` when the key is missing. `operator[]` doesn't even compile on a `const`
  map.
- **Never depend on the order of an unordered container.** It can differ between compilers
  and change when the table rehashes. Copy the results into a vector and sort them when order
  matters.
- **Iterator invalidation.** Erasing an element invalidates iterators to it, so a loop that
  erases must write `it = m.erase(it);`. A rehash invalidates every iterator of an unordered
  container.
- Ordered keys need `operator<`; unordered keys need `std::hash` and `==`. Using your own type
  as a key without them produces a long template error.
- Set elements are `const`: to change one, erase it and insert the new value.

## What you will practise

You will count characters with a map, look prices up in an unordered map without inserting by
accident, and remove duplicates with a set. The challenge asks for the k most frequent words
of a text, with ties broken alphabetically.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u09-c1-trees-and-hashes"
title = "Trees, hash tables and their costs"
points = 5
difficulty = 9
intro = '''
`std::map` and `std::unordered_map` offer the same operations at different prices, because
they organise memory in completely different ways. Knowing the structure underneath tells you
which one to choose.
'''
body = '''
## The tree behind std::map

A `std::map` keeps its elements in a **balanced binary search tree**. Every node's left
subtree holds smaller keys and its right subtree larger ones, and the tree rebalances itself
so that its height stays about log2(n). A lookup walks from the root down to a leaf, one
comparison per level: a million keys need only about 20 comparisons. Because the tree is
sorted, a map can also answer "the first key not less than x" (`lower_bound`) and iterate its
keys in order.

## The table behind std::unordered_map

An `std::unordered_map` keeps an array of **buckets**. A hash function turns each key into a
number, and that number modulo the bucket count picks a bucket. A lookup hashes the key and
checks only the few elements in that bucket, so it is O(1) on average. When the **load
factor** (elements per bucket) grows too large, the table **rehashes**: it allocates more
buckets and redistributes every element. If many keys collide in one bucket, lookups degrade
towards O(n).

## Choosing

| Need | Choose |
|---|---|
| Fastest lookups, order irrelevant | `unordered_map` / `unordered_set` |
| Keys in sorted order, or range queries | `map` / `set` |
| Predictable worst case | `map` / `set` |

When in doubt, start with `std::unordered_map` for counting and lookups, and switch to
`std::map` when you need the order.
'''

