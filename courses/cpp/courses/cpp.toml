'''
prompt = '''
Write `TinyMap`, a fixed four-bucket chained map from `std::string` to `int`, store three
updates and look up a present and an absent key.

**Why:** these few lines are exactly what `std::unordered_map` does underneath, minus the
resizing you will add in the challenge.
'''
target = '''
#include <functional>
#include <iostream>
#include <string>
#include <utility>
#include <vector>

class TinyMap {
    using Bucket = std::vector<std::pair<std::string, int>>;
    std::vector<Bucket> buckets_ = std::vector<Bucket>(4);

    std::size_t index(const std::string& key) const {
        return std::hash<std::string>{}(key) % buckets_.size();
    }

public:
    void put(const std::string& key, int value) {
        Bucket& bucket = buckets_[index(key)];
        for (auto& [k, v] : bucket) {
            if (k == key) { v = value; return; }
        }
        bucket.emplace_back(key, value);
    }
    const int* get(const std::string& key) const {
        for (const auto& [k, v] : buckets_[index(key)]) {
            if (k == key) return &v;
        }
        return nullptr;
    }
};

int main() {
    TinyMap m;
    m.put("one", 1);
    m.put("two", 2);
    m.put("one", 11);
    std::cout << "one = " << *m.get("one") << '\n';
    std::cout << "three found: " << std::boolalpha << (m.get("three") != nullptr) << '\n';
}
'''
