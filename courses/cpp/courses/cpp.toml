target = '''
#include <array>
#include <cstddef>
#include <initializer_list>
#include <iostream>

template <typename T, std::size_t N>
class FixedVec {
public:
    bool push_back(const T& value) {
        if (size_ == N) return false;
        data_[size_++] = value;
        return true;
    }
    const T& at(std::size_t i) const { return data_.at(i); }
    std::size_t size() const { return size_; }
    static constexpr std::size_t capacity() { return N; }

private:
    std::array<T, N> data_{};
    std::size_t size_ = 0;
};

int main() {
    FixedVec<int, 3> v;
    for (int x : {4, 8, 15, 16}) {
        std::cout << x << (v.push_back(x) ? " kept" : " dropped") << '\n';
    }
    std::cout << "size " << v.size() << " of " << FixedVec<int, 3>::capacity() << '\n';
    for (std::size_t i = 0; i < v.size(); ++i) std::cout << v.at(i) << ' ';
    std::cout << '\n';
}
'''
