Print the results of a few calculations, each with a label, by chaining `<<`. Finish with
`std::endl` instead of `'\n'`.

**Why:** seeing that `7 / 2` prints `3` but `7.0 / 2` prints `3.5` shows you early that in
C++ the **type** of a value decides how operators behave.
'''
