kind = "challenge"
id = "cpp-u28-x1-edit-distance"
title = "Edit distance"
points = 40
difficulty = 34
entry = "edit_distance"
intro = '''
Edit distance (Levenshtein distance) is the minimum number of single-character insertions,
deletions and substitutions that turn one string into another. It is a two-dimensional DP:
the answer for two prefixes depends only on three smaller prefixes, so a table of
`(len(a) + 1) × (len(b) + 1)` cells, filled row by row, solves it in polynomial time.
'''
instructions = '''
## Your turn

Implement `edit_distance`:

```cpp
int edit_distance(std::string_view a, std::string_view b);
```

Return the minimum number of single-character edits (insert a character, delete a character,
or substitute one character for another) needed to turn `a` into `b`. Characters are compared
exactly, so `'a'` and `'A'` differ.

Examples:

- `edit_distance("kitten", "sitting")` returns `3` (k→s, e→i, insert g).
- `edit_distance("", "abc")` returns `3`.
- `edit_distance("flaw", "lawn")` returns `2` (delete f, insert n).
- `edit_distance("same", "same")` returns `0`.

The hidden tests use strings of up to 5,000 characters and must finish quickly. Naive recursion
is exponential. A full table of 5,001 × 5,001 `int`s would need 100 MB, so keep only the rows
you need: the previous row and the current one.

**Hint:** let `d[i][j]` be the edit distance between the first `i` characters of `a` and the
first `j` characters of `b`. Row 0 and column 0 are easy (only insertions or only deletions).
For the other cells, look at the last character of each prefix: either they match, or the last
edit was an insertion, a deletion or a substitution.

Hidden tests decide correctness.
'''
