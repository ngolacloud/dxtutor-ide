intro = '''
A **ring buffer** (circular buffer) implements a bounded queue on a fixed array. It stores the
index of the front element and a count, and both ends move forward modulo the capacity, so a push
or a pop is O(1) and no element ever moves. Audio drivers, network cards and logging systems use
ring buffers because they never allocate.
'''
placeholder_policy = "on_demand"
run_command = "g++ -std=c++20 -O2 main.cpp -o main && ./main"
prompt = '''
Write a `RingQueue` of capacity 4 over a `std::array`, push and pop past the end of the array so
the indices wrap around, and handle popping from an empty queue.

**Why:** building the queue yourself shows the invariant that the library hides: the elements are
`buf[head]`, `buf[(head + 1) % cap]`, ..., `count` of them.
'''
target = '''
#include <array>
#include <cstddef>
#include <iostream>
#include <stdexcept>

class RingQueue {
public:
    void push(int value) {
        if (count_ == buf_.size()) throw std::length_error("queue full");
        buf_[(head_ + count_) % buf_.size()] = value;
        ++count_;
    }
    int pop() {
        if (count_ == 0) throw std::out_of_range("queue empty");
        int value = buf_[head_];
        head_ = (head_ + 1) % buf_.size();
        --count_;
        return value;
    }
    std::size_t size() const { return count_; }
private:
    std::array<int, 4> buf_{};
    std::size_t head_ = 0;
    std::size_t count_ = 0;
};

int main() {
    RingQueue q;
    for (int v : {1, 2, 3}) q.push(v);
    std::cout << q.pop() << ' ' << q.pop() << '\n';
    for (int v : {4, 5, 6}) q.push(v);
    std::cout << "size " << q.size() << ':';
    while (q.size() > 0) std::cout << ' ' << q.pop();
    std::cout << '\n';
    try {
        q.pop();
    } catch (const std::out_of_range& e) {
        std::cout << "error: " << e.what() << '\n';
    }
}
'''
