#include <future>
#include <iostream>
#include <stdexcept>
#include <string>
#include <thread>

void parse_port(const char* text, std::promise<int> result) {
    try {
        int port = std::stoi(text);
        if (port < 1 || port > 65535) throw std::out_of_range("port out of range");
        result.set_value(port);
    } catch (...) {
        result.set_exception(std::current_exception());
