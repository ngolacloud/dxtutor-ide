placeholder_policy = "on_demand"
run_command = "g++ -std=c++20 -O2 main.cpp -o main && ./main"
prompt = '''
Write three `kind` overloads constrained by `std::integral`, `std::signed_integral` and
`std::floating_point`, and a `measure` that uses `if constexpr (requires { x.size(); })`.

**Why:** these two tools replace most of the older template tricks (`std::enable_if`, tag
dispatch) with code that says plainly which types go where.
