target = '''
#include <sqlite3.h>
#include <iostream>
#include <memory>
#include <optional>
#include <vector>

struct DbClose { void operator()(sqlite3* db) const { sqlite3_close(db); } };

std::vector<int> ids_after(sqlite3* db, std::optional<int> after, int size) {
    const char* sql = after ? "SELECT id FROM items WHERE id > ?1 ORDER BY id LIMIT ?2"
                            : "SELECT id FROM items ORDER BY id LIMIT ?2";
    sqlite3_stmt* raw = nullptr;
    sqlite3_prepare_v2(db, sql, -1, &raw, nullptr);
    std::unique_ptr<sqlite3_stmt, decltype(&sqlite3_finalize)> st(raw, &sqlite3_finalize);
    if (after) sqlite3_bind_int(raw, 1, *after);
    sqlite3_bind_int(raw, 2, size);
    std::vector<int> page;
    while (sqlite3_step(raw) == SQLITE_ROW) page.push_back(sqlite3_column_int(raw, 0));
