[[unit.step]]
kind = "challenge"
id = "cpp-u04-x1-triangle"
title = "Implement classify_triangle"
points = 20
difficulty = 4
entry = "classify_triangle"
intro = '''
Classifying triangles is a small exercise in **ordering conditions**: the impossible cases
must be rejected first, and only then do the equal-sides tests make sense. The triangle
inequality also adds two sides together, which in C++ means thinking about overflow before
you write `a + b`.
'''
instructions = '''
## Your turn

Implement the function `classify_triangle`:

```cpp
std::string classify_triangle(int a, int b, int c);
```

`a`, `b` and `c` are the lengths of three sides. Return one of four strings:

- `"invalid"` if the three lengths cannot form a triangle: any side is zero or negative, or
  any side is greater than **or equal to** the sum of the other two (a flat "triangle" does
  not count);
- `"equilateral"` if all three sides are equal;
- `"isosceles"` if exactly two sides are equal;
- `"scalene"` if all three sides are different.

The sides can come in any order.

Examples:

- `classify_triangle(3, 4, 5)` returns `"scalene"`
- `classify_triangle(2, 2, 3)` returns `"isosceles"`
- `classify_triangle(1, 2, 3)` returns `"invalid"` (1 + 2 is not greater than 3)
- `classify_triangle(0, 0, 0)` returns `"invalid"`

Sides can be as large as `2147483647`. Adding two such `int` values overflows, which is
undefined behaviour, so do the additions in `long long`.

Do not write a `main` function: the tests provide their own.

**Hint:** reject invalid input first with an `if` and `||`, then test "all equal" before
"some equal".

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
#include <stdexcept>
#include <string>

// Return "invalid", "equilateral", "isosceles" or "scalene" for sides a, b, c.
std::string classify_triangle(int a, int b, int c) {
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <limits>
#include <string>

TEST(scalene) {
    CHECK_EQ(classify_triangle(3, 4, 5), "scalene");
    CHECK_EQ(classify_triangle(5, 3, 4), "scalene");
    CHECK_EQ(classify_triangle(10, 11, 12), "scalene");
}

TEST(equilateral) {
    CHECK_EQ(classify_triangle(2, 2, 2), "equilateral");
    CHECK_EQ(classify_triangle(1, 1, 1), "equilateral");
}

TEST(isosceles_in_any_order) {
    CHECK_EQ(classify_triangle(2, 2, 3), "isosceles");
    CHECK_EQ(classify_triangle(2, 3, 2), "isosceles");
    CHECK_EQ(classify_triangle(3, 2, 2), "isosceles");
    CHECK_EQ(classify_triangle(5, 5, 1), "isosceles");
}

TEST(zero_and_negative_sides) {
    CHECK_EQ(classify_triangle(0, 0, 0), "invalid");
    CHECK_EQ(classify_triangle(0, 4, 5), "invalid");
    CHECK_EQ(classify_triangle(3, -4, 5), "invalid");
    CHECK_EQ(classify_triangle(-2, -2, -2), "invalid");
}

TEST(triangle_inequality) {
    CHECK_EQ(classify_triangle(1, 2, 3), "invalid");
    CHECK_EQ(classify_triangle(3, 1, 2), "invalid");
    CHECK_EQ(classify_triangle(1, 2, 10), "invalid");
    CHECK_EQ(classify_triangle(10, 1, 2), "invalid");
    CHECK_EQ(classify_triangle(2, 10, 1), "invalid");
    CHECK_EQ(classify_triangle(1, 1, 2), "invalid");
}

TEST(large_sides_do_not_overflow) {
    const int big = std::numeric_limits<int>::max();
    CHECK_EQ(classify_triangle(big, big, big), "equilateral");
    CHECK_EQ(classify_triangle(big, big, 1), "isosceles");
    CHECK_EQ(classify_triangle(big - 2, big - 1, big), "scalene");
    CHECK_EQ(classify_triangle(1, 1, big), "invalid");
}

TEST(sweep_small_sides) {
    int counts[4] = {0, 0, 0, 0};
    for (int a = 1; a <= 20; ++a) {
        for (int b = 1; b <= 20; ++b) {
            for (int c = 1; c <= 20; ++c) {
                std::string kind = classify_triangle(a, b, c);
                bool ok = a + b > c && a + c > b && b + c > a;
                if (!ok) {
                    CHECK_EQ(kind, "invalid");
                    ++counts[0];
                } else if (a == b && b == c) {
                    CHECK_EQ(kind, "equilateral");
                    ++counts[1];
                } else if (a == b || b == c || a == c) {
                    CHECK_EQ(kind, "isosceles");
                    ++counts[2];
                } else {
                    CHECK_EQ(kind, "scalene");
                    ++counts[3];
                }
            }
        }
    }
    CHECK_EQ(counts[1], 20);
}
'''
[unit.step.gabarito]
solution = '''
#include <string>

// Return "invalid", "equilateral", "isosceles" or "scalene" for sides a, b, c.
std::string classify_triangle(int a, int b, int c) {
    if (a <= 0 || b <= 0 || c <= 0) {
        return "invalid";
    }
    const long long x = a;
    const long long y = b;
    const long long z = c;
    if (x + y <= z || x + z <= y || y + z <= x) {
        return "invalid";
    }
    if (a == b && b == c) {
        return "equilateral";
    }
    if (a == b || b == c || a == c) {
        return "isosceles";
    }
    return "scalene";
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Whatever the side lengths, the function performs a fixed number of comparisons and three
additions, so the time is **O(1)**; it keeps three local copies of the sides, so the space is
**O(1)**.

The order of the tests carries the logic. Invalid input is rejected first, so the equality
tests only ever see real triangles. "All three equal" is tested before "at least two equal",
because every equilateral triangle would otherwise also match the isosceles test. Checking all
three inequalities makes the order of the arguments irrelevant. Finally, the sides are widened
to `long long` before adding: the sum of two `int` values can reach about 4.3 billion, which
overflows an `int` (undefined behaviour) but fits easily in 64 bits.
'''

[[unit]]
id = "cpp-u05-loops"
title = "Loops: for, range-for, while, do-while"
level = "basic"
difficulty = 5
intro = '''
Computers are good at doing the same thing many times. This unit covers the four C++ loops:
the counting `for`, the range-based `for` that walks every element of a sequence, `while`,
and `do`-`while`, plus `break` and `continue` to leave a loop early or skip one round.
'''
concepts = '''
## The idea

A **loop** repeats a block of statements, called the **body**, while a condition holds. Every
correct loop has three parts: a starting state, a condition checked before (or after) each
round, and **progress**, something in the body that moves towards making the condition
false. Forget the progress and the loop never ends.

## How C++ does it

The classic `for` puts all three parts on one line:

```cpp
for (int i = 0; i < 5; ++i) {
    std::cout << i << ' ';     // 0 1 2 3 4
}
```

`int i = 0` runs once; `i < 5` is checked before every round; `++i` runs after every round.
The variable `i` exists only inside the loop.

The **range-based `for`** visits each element of a sequence, with no index to manage:

```cpp
std::string word = "loop";
for (char c : word) {
    std::cout << c << '\n';
}
```

`while` repeats as long as its condition is true and checks it **before** each round, so the
body may run zero times. `do { ... } while (condition);` checks **after**, so the body always
runs at least once. Inside any loop, `break` leaves the loop immediately and `continue` skips
the rest of the current round and goes on to the next one.

## What is special or tricky

- **Off-by-one errors.** `for (int i = 0; i <= 5; ++i)` runs six times, not five. With
  indexes from 0, the usual condition is `i < size`.
- **Infinite loops.** A `while` whose body never changes the condition runs forever. If a
  program hangs, look for missing progress first.
- **Counting down with an unsigned type.** `for (std::size_t i = n - 1; i >= 0; --i)` never
  ends: an unsigned value is always `>= 0`, and `0 - 1` wraps around to a huge number. Count
  down with a signed type, or use a different condition.
- **Overflowing an accumulator.** Summing many `int` values can pass 2147483647, which is
  undefined behaviour. Accumulate in `long long` when totals can grow.
- **Range-for copies by default.** `for (std::string s : names)` copies every string; write
  `for (const std::string& s : names)` to read without copying.
- **The `do`-`while` semicolon.** `} while (x != 0);` needs the final `;`.
- **Mixing signed and unsigned.** `i < text.size()` with an `int i` compares signed with
  unsigned; `-Wall` warns about it. Use `std::size_t` for indexes into strings.

## What you will practise

You will count, sum and nest `for` loops, walk a string and a list with range-for using
`break` and `continue`, and use `while` and `do`-`while` where the number of rounds is not
known in advance. The challenge asks for a prime test fast enough for numbers around a
trillion, which means thinking about **when a loop can stop**.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u05-c1-iteration"
title = "Repeating with loops"
points = 5
difficulty = 5
intro = '''
A loop is a condition plus a jump back to the top of the body. How many times it runs, as a
function of the input size, is the core of **time complexity**: a loop over `n` elements is
O(n), and a loop nested inside it is O(n²). Choosing the right loop also means choosing where
the condition is checked.
'''
body = '''
## Four loops, one idea

All loops repeat a body while a condition holds. They differ in what they make convenient:

```cpp
for (int i = 1; i <= 3; ++i) { /* counted: i = 1, 2, 3 */ }

for (char c : std::string("abc")) { /* every element */ }

while (n > 1) { n /= 2; }          // checked first; may run 0 times

do { digits++; n /= 10; } while (n != 0);   // runs at least once
```

- Use the **counting `for`** when you know how many rounds you need, or need the index.
- Use the **range-for** when you want every element and do not care about positions.
- Use **`while`** when you repeat until something happens and cannot know the count upfront.
- Use **`do`-`while`** when the body must run once before the first test.

## break and continue

```cpp
for (int x = 1; x <= 10; ++x) {
    if (x % 2 == 0) {
        continue;    // skip even numbers
    }
    if (x > 7) {
        break;       // stop the whole loop
    }
    std::cout << x << ' ';   // 1 3 5 7
}
```

## Counting the work

If the body does a fixed amount of work and the loop runs `n` times, the loop costs O(n).
Two nested loops of `n` rounds each run the inner body n × n times: O(n²). Stopping early,
for example as soon as an answer is known, can change the cost dramatically.
'''

