'''
instructions = '''
## Your turn

Implement the function `parallel_sum`:

```cpp
long long parallel_sum(const std::string& path, int upto, int workers);
```

`path` is a database file that does not exist yet. Then:

1. Open it, switch it to **WAL** with `PRAGMA journal_mode=WAL`, and create the table
   `nums (n INTEGER)` if it does not exist.
2. Start `workers` threads (`workers >= 1`). Each thread opens **its own** connection with a
   busy timeout and inserts its share of the numbers `1..upto` with a bound parameter. Every
   number must be inserted exactly once.
3. Wait for all threads, then return `SELECT SUM(n)`, or `0` when nothing was inserted.

Close every connection before returning; the caller removes the files afterwards. If a
worker fails, the function must not crash the program: report it by throwing
`std::runtime_error` from `parallel_sum` after all threads have been joined.

Examples:

- `parallel_sum(path, 100, 4)` → `5050`
- `parallel_sum(path, 3, 8)` → `6` (some workers have nothing to do)
- `parallel_sum(path, 0, 4)` → `0`

**Hint:** worker `w` can take the numbers `w + 1, w + 1 + workers, w + 1 + 2 * workers, ...`.

Hidden tests decide correctness. They also check the journal mode and the rows left in
`nums`.
'''
