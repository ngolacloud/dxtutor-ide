#include <algorithm>
#include <chrono>
#include <climits>
#include <cstdint>
#include <random>
#include <vector>

// O(n^2) reference for small inputs.
static long long t_brute(const std::vector<int>& v) {
    long long c = 0;
    for (std::size_t i = 0; i < v.size(); ++i)
        for (std::size_t j = i + 1; j < v.size(); ++j)
            if (v[i] > v[j]) ++c;
    return c;
}

// O(n log n) reference with a Fenwick tree over the ranks.
static long long t_fenwick(const std::vector<int>& v) {
    std::vector<int> sorted = v;
    std::sort(sorted.begin(), sorted.end());
    sorted.erase(std::unique(sorted.begin(), sorted.end()), sorted.end());
    std::vector<long long> tree(sorted.size() + 1, 0);
    long long count = 0, seen = 0;
    for (int x : v) {
        std::size_t r = static_cast<std::size_t>(std::lower_bound(sorted.begin(), sorted.end(), x) - sorted.begin()) + 1;
        long long not_greater = 0;
        for (std::size_t i = r; i > 0; i -= i & (~i + 1)) not_greater += tree[i];
        count += seen - not_greater;
        for (std::size_t i = r; i < tree.size(); i += i & (~i + 1)) ++tree[i];
        ++seen;
    }
    return count;
}

