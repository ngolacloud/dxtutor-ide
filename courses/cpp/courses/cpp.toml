instructions = '''
## Your turn

Implement `erase`:

```cpp
bool erase(std::unique_ptr<Node>& root, int key);
```

Remove `key` from the binary search tree owned by `root` and return `true`, or return `false`
and leave the tree untouched if `key` is not in it. The `Node` struct is provided in the
starter; keys are unique. `root` may become a different node, or empty.

There are three cases for the node that holds `key`:

1. **No children**: remove it.
2. **One child**: the child takes its place.
3. **Two children**: give it the key of its in-order successor (the smallest key in its right
   subtree), then remove that successor node from the right subtree. The successor has no
   left child, so removing it is case 1 or 2.

After every call the tree must still satisfy the BST property and contain exactly the remaining
keys. Removed nodes must be freed (owning `unique_ptr` links do that for you).

Examples, on the tree built by inserting `50, 30, 70, 20, 40, 60, 80`:

- `erase(root, 20)` removes a leaf; the in-order keys become `30 40 50 60 70 80`.
- `erase(root, 50)` removes the root, which has two children; the root's key becomes 60.
- `erase(root, 99)` returns `false` and changes nothing.
- erasing from an empty tree returns `false`.

Hidden tests decide correctness, including 50,000 deletions from a tree of 100,000 random keys,
and long degenerate chains: prefer a loop over recursion.

**Hint:** walk with a `std::unique_ptr<Node>*` that points at the owning link of the current
node. Replacing `*link` replaces the node in its parent, whether the parent is a node or the root.
'''
starter = '''
#include <memory>
#include <stdexcept>

// A BST node (provided: do not change it).
struct Node {
    int key;
    std::unique_ptr<Node> left, right;
};

// Removes key from the tree owned by root. Returns true if it was present,
// false (tree unchanged) otherwise.
bool erase(std::unique_ptr<Node>& root, int key) {
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <chrono>
#include <cstdint>
#include <random>
#include <vector>

static void t_insert(std::unique_ptr<Node>& root, int key) {
    std::unique_ptr<Node>* link = &root;
    while (*link) {
        if (key == (*link)->key) return;
        link = key < (*link)->key ? &(*link)->left : &(*link)->right;
    }
    *link = std::make_unique<Node>();
    (*link)->key = key;
}

static std::unique_ptr<Node> t_build(const std::vector<int>& keys) {
    std::unique_ptr<Node> root;
    for (int k : keys) t_insert(root, k);
    return root;
}

// Iterative in-order traversal: works on degenerate trees too.
static std::vector<int> t_keys(const Node* root) {
    std::vector<int> out;
    std::vector<const Node*> stack;
    const Node* n = root;
    while (n || !stack.empty()) {
        while (n) {
            stack.push_back(n);
            n = n->left.get();
        }
        n = stack.back();
        stack.pop_back();
        out.push_back(n->key);
        n = n->right.get();
    }
    return out;
}

static bool t_strictly_increasing(const std::vector<int>& v) {
    for (std::size_t i = 1; i < v.size(); ++i) {
        if (!(v[i - 1] < v[i])) return false;
    }
    return true;
}

// Frees a tree without recursion (a long chain would overflow the stack).
static void t_free(std::unique_ptr<Node>& root) {
    std::vector<std::unique_ptr<Node>> stack;
    if (root) stack.push_back(std::move(root));
    while (!stack.empty()) {
        std::unique_ptr<Node> n = std::move(stack.back());
        stack.pop_back();
        if (n->left) stack.push_back(std::move(n->left));
        if (n->right) stack.push_back(std::move(n->right));
    }
}

TEST(erase_from_empty_tree) {
    std::unique_ptr<Node> root;
    CHECK(!erase(root, 5));
    CHECK(!root);
}

TEST(erase_a_leaf) {
    auto root = t_build({50, 30, 70, 20, 40, 60, 80});
    CHECK(erase(root, 20));
    CHECK(t_keys(root.get()) == (std::vector<int>{30, 40, 50, 60, 70, 80}));
    CHECK(!root->left->left);
}

TEST(erase_a_node_with_one_child) {
    auto root = t_build({50, 30, 70, 20, 40, 60, 80});
    CHECK(erase(root, 20));
    CHECK(erase(root, 30));  // 30 now has only the right child 40
    CHECK(root->left && root->left->key == 40);
    CHECK(t_keys(root.get()) == (std::vector<int>{40, 50, 60, 70, 80}));
    auto left_only = t_build({10, 5, 3});
    CHECK(erase(left_only, 10));  // the root has only a left child
    CHECK(left_only && left_only->key == 5);
    CHECK(t_keys(left_only.get()) == (std::vector<int>{3, 5}));
}

TEST(erase_root_with_two_children_uses_the_successor) {
    auto root = t_build({50, 30, 70, 20, 40, 60, 80});
    CHECK(erase(root, 50));
    CHECK(root && root->key == 60);
    CHECK(t_keys(root.get()) == (std::vector<int>{20, 30, 40, 60, 70, 80}));
    CHECK(erase(root, 70));  // two children again: 80 takes its place
    CHECK(t_keys(root.get()) == (std::vector<int>{20, 30, 40, 60, 80}));
    CHECK(root->right && root->right->key == 80);
}

TEST(successor_deep_in_the_right_subtree) {
    auto root = t_build({50, 30, 80, 60, 90, 70, 65});
    CHECK(erase(root, 50));  // successor 60 has a right subtree (70, 65)
    CHECK(root->key == 60);
    CHECK(t_keys(root.get()) == (std::vector<int>{30, 60, 65, 70, 80, 90}));
}

TEST(missing_key_changes_nothing) {
    auto root = t_build({50, 30, 70, -5, 40});
    const Node* before = root.get();
    CHECK(!erase(root, 99));
    CHECK(!erase(root, 35));
    CHECK(!erase(root, -6));
    CHECK(root.get() == before);
    CHECK(t_keys(root.get()) == (std::vector<int>{-5, 30, 40, 50, 70}));
}

TEST(erase_everything_one_by_one) {
    std::vector<int> keys{8, 4, 12, 2, 6, 10, 14, -1, 3, 5, 7, 9, 11, 13, 15};
    auto root = t_build(keys);
    std::vector<int> remaining = t_keys(root.get());
    for (int k : {8, 2, 15, 12, 4, -1, 10, 6, 14, 3, 5, 7, 9, 11, 13}) {
        CHECK(erase(root, k));
        std::erase(remaining, k);
        CHECK(t_keys(root.get()) == remaining);
        CHECK(!erase(root, k));
    }
    CHECK(!root);
}

TEST(degenerate_chains) {
    const int n = 20'000;
    std::unique_ptr<Node> chain;
    std::unique_ptr<Node>* tail = &chain;  // build 0 -> 1 -> ... as right children
    for (int i = 0; i < n; ++i) {
        *tail = std::make_unique<Node>();
        (*tail)->key = i;
        tail = &(*tail)->right;
    }
    CHECK(erase(chain, n - 1));  // the deepest leaf
    CHECK(erase(chain, n / 2));  // a node in the middle with one child
    CHECK(erase(chain, 0));      // the root
    std::vector<int> keys = t_keys(chain.get());
    CHECK_EQ(keys.size(), static_cast<std::size_t>(n - 3));
    CHECK(t_strictly_increasing(keys));
    CHECK_EQ(keys.front(), 1);
    CHECK_EQ(keys.back(), n - 2);
    t_free(chain);
}

TEST(fifty_thousand_deletions_from_a_random_tree) {
    const int n = 100'000;
    std::vector<int> keys(n);
    for (int i = 0; i < n; ++i) keys[i] = i;
    std::mt19937 rng(42);
    for (int i = n - 1; i > 0; --i) {
        int j = static_cast<int>(rng() % static_cast<std::uint32_t>(i + 1));
        std::swap(keys[i], keys[j]);
    }
    auto root = t_build(keys);
    auto start = std::chrono::steady_clock::now();
    bool all_true = true;
    for (int k : keys) {
        if (k % 2 == 0 && !erase(root, k)) all_true = false;
    }
    CHECK(all_true);
    bool any_missing_found = false;
    for (int k = -1000; k < 0; ++k) {
        if (erase(root, k)) any_missing_found = true;
    }
    CHECK(!any_missing_found);
    auto elapsed = std::chrono::duration<double>(std::chrono::steady_clock::now() - start);
    std::vector<int> left = t_keys(root.get());
    CHECK_EQ(left.size(), static_cast<std::size_t>(n / 2));
    CHECK(t_strictly_increasing(left));
    CHECK_EQ(left.front(), 1);
    CHECK_EQ(left.back(), n - 1);
    CHECK(elapsed.count() < 2.0);
    t_free(root);
}
'''

[unit.step.gabarito]
solution = '''
#include <memory>
#include <utility>

struct Node {
    int key;
    std::unique_ptr<Node> left, right;
};

bool erase(std::unique_ptr<Node>& root, int key) {
    // Find the owning link of the node that holds key.
    std::unique_ptr<Node>* link = &root;
    while (*link && (*link)->key != key) {
        link = key < (*link)->key ? &(*link)->left : &(*link)->right;
    }
    if (!*link) return false;

    Node* node = link->get();
    if (!node->left) {
        *link = std::move(node->right);  // zero or one (right) child
    } else if (!node->right) {
        *link = std::move(node->left);   // one (left) child
    } else {
        // Two children: the successor is the leftmost node of the right subtree.
        std::unique_ptr<Node>* succ = &node->right;
        while ((*succ)->left) succ = &(*succ)->left;
        node->key = (*succ)->key;
        *succ = std::move((*succ)->right);  // the successor has no left child
    }
    return true;
}
'''
time = "O(h): O(log n) on a balanced or random tree, O(n) on a degenerate one"
space = "O(1)"
justification = '''
The function walks one path from the root: first down to the node holding `key`, then, in the
two-children case, further down the right subtree to the leftmost node. Both walks together
visit at most *h* + 1 nodes, and every case finishes with a constant number of pointer moves,
so the time is **O(h)**. On the random tree of 100,000 keys *h* is around 40; on a sorted chain
it is *n*.

Extra space is **O(1)**: only the pointers `link`, `node` and `succ`. A recursive version would
also be O(h) time but O(h) stack, which crashes on a long chain.

Correctness rests on the BST property. Replacing a node by its only child keeps every key on
the same side of every ancestor. In the two-children case the successor is the smallest key
larger than `key`, so placing it at the node keeps everything in the left subtree smaller and
everything remaining on the right larger. The successor never has a left child, so unlinking
it is the one-child case. Each `*link = std::move(...)` releases the replacement subtree before
deleting the old node, so nothing dangles and the removed node is freed.
'''

[[unit]]
id = "cpp-u27-sorting-searching"
title = "Sorting and searching by hand"
level = "advanced"
difficulty = 33
intro = '''
`std::sort` and `std::lower_bound` are among the most used tools in the library, and both rest
on ideas you can write yourself in a few lines. You will implement insertion sort, merge two
sorted vectors, write a binary search without off-by-one errors, and then use merge sort's
divide and conquer to count inversions in a million numbers in a fraction of a second.
'''
concepts = '''
## The idea

**Sorting** puts elements in order; **searching** finds one. They are linked: once data is
sorted, **binary search** finds any element in O(log n) instead of O(n), about 20 comparisons
for a million elements.

Simple sorts such as **insertion sort** take each element and slide it left into place. That
is O(n²) comparisons in the worst case, fine for 20 elements and hopeless for a million
(about 5 × 10¹¹ steps). It shines on nearly sorted data, where it is close to O(n), which is
why real library sorts use it for small ranges.

**Merge sort** is the classic **divide and conquer** algorithm: split the range in half, sort
each half recursively, then **merge** the two sorted halves in one linear pass. There are
about log₂ n levels of halving and each level does O(n) work in total, so it is
**O(n log n)**, needs an O(n) buffer, and is **stable**: equal elements keep their order.

## How C++ does it

The library gives you all of this, and you should normally use it:

```cpp
std::vector<int> v{5, 2, 9, 1};
std::sort(v.begin(), v.end());                 // O(n log n), introsort, not stable
std::stable_sort(v.begin(), v.end());          // merge-sort based, stable
auto it = std::lower_bound(v.begin(), v.end(), 5);  // first element >= 5
bool has = std::binary_search(v.begin(), v.end(), 9);
```

Writing them by hand teaches the invariants that make them correct, and lets you change them:
the challenge needs a merge sort that also counts something during the merge, which no library
call does for you.

## What is special or tricky

- **Unsigned indices underflow.** `std::size_t j = 0; --j;` wraps to a huge number. A loop like
  `for (std::size_t j = i - 1; j >= 0; --j)` never ends, because `j >= 0` is always true for
  an unsigned type. Test `j > 0` before computing `j - 1`.
- **Out-of-bounds access is undefined behaviour.** `v[v.size()]` does not throw; it reads
  past the end. Binary search bugs often do exactly this.
- **`(lo + hi) / 2` can overflow** for large signed values; `lo + (hi - lo) / 2` cannot.
- **Half-open ranges** `[lo, hi)` match the standard library (`end()` is one past the last
  element) and remove most off-by-one errors: the size is `hi - lo`, and empty is `lo == hi`.
- **Counts outgrow `int`.** The number of pairs in 100,000 elements is about 5 × 10⁹, beyond
  the range of a 32-bit `int`. Signed overflow is undefined behaviour, so use `long long`.
- **A comparator must be a strict weak ordering.** Passing `<=` to `std::sort` is undefined
  behaviour and can crash.

## What you will practise

You will write insertion sort, merge two sorted vectors, and implement `lower_bound` with a
half-open range. The challenge sorts a vector while counting its inversions, on inputs of up
to a million numbers.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u27-c1-divide-conquer"
title = "Divide, conquer, merge"
points = 5
difficulty = 33
intro = '''
Divide and conquer solves a problem by splitting it into smaller copies of itself, solving
those recursively, and combining the answers. Merge sort is the textbook case: the split is
trivial, and all the work happens in a linear-time merge.
'''
body = '''
## Three steps

1. **Divide**: split `[lo, hi)` at `mid = lo + (hi - lo) / 2`.
2. **Conquer**: sort `[lo, mid)` and `[mid, hi)` recursively. A range of 0 or 1 element is
   already sorted: that is the base case.
3. **Combine**: merge the two sorted halves.

## The merge

Keep one index into each half. Repeatedly copy the smaller front element into a buffer and
advance that index. When one half runs out, copy the rest of the other. Each element is
copied once, so merging *n* elements is O(n).

```cpp
while (i < mid && j < hi) buf[k++] = (v[j] < v[i]) ? v[j++] : v[i++];
```

Taking from the left half on ties (`v[j] < v[i]`, not `<=`) keeps equal elements in their
original order, which makes the sort **stable**.

## Why O(n log n)

Halving *n* until ranges have one element takes about log₂ n levels. At each level the merges
together touch all *n* elements once. *n* work times log₂ n levels gives **O(n log n)**: for a
million elements, about 20 million steps instead of the 5 × 10¹¹ of an O(n²) sort.

## Binary search is divide and conquer too

On a sorted range, compare with the middle element and keep only the half that can contain the
target. Each step halves the range, so it takes O(log n) steps. The recursion depth of merge
sort is also only log₂ n, about 20 frames for a million elements, so recursion is safe here,
unlike on a linked list or a degenerate tree.
'''

