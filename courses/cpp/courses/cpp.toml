[[unit.step]]
kind = "challenge"
id = "cpp-u21-x1-bank"
title = "A thread-safe bank"
points = 40
difficulty = 27
intro = '''
A transfer touches two pieces of shared state that must change together, the classic case where
a single atomic is not enough. Fine-grained locking (one mutex per account) lets unrelated
transfers run in parallel, but it introduces the risk of deadlock, which `std::scoped_lock`'s
all-or-nothing acquisition removes.
'''
entry = "Bank"
instructions = '''
## Your turn

Implement a thread-safe `Bank`:

```cpp
class Bank {
public:
    Bank(std::size_t accounts, long long initial_balance);
    std::size_t size() const;
    long long balance(std::size_t id) const;
    bool transfer(std::size_t from, std::size_t to, long long amount);
    long long total() const;
};
```

Rules:

- The constructor opens `accounts` accounts numbered from 0, each holding `initial_balance`.
- `transfer` moves `amount` from `from` to `to` **atomically**: no other thread may ever see
  the money missing from both accounts or present in both. If `from` holds less than `amount`,
  nothing changes and it returns `false`; otherwise it returns `true`.
- Ids outside `[0, size())` throw `std::out_of_range`, and an `amount <= 0` throws
  `std::invalid_argument`.
- A transfer from an account to itself is allowed: it changes nothing and returns whether the
  account holds at least `amount`. Careful: locking the same mutex twice is undefined behaviour.
- `balance` and `total` read under the lock(s). `total` must be a **consistent snapshot**: even
  while other threads are transferring, it returns exactly the money in the bank.
- Up to eight threads call these methods at the same time, transferring in both directions
  between the same accounts. The bank must never lose money, never overdraw, and never deadlock.

Example:

```cpp
Bank bank(2, 50);
bank.transfer(0, 1, 20);   // true: balances 30 and 70
bank.transfer(0, 1, 31);   // false: account 0 holds only 30
bank.total();              // 100
```

**Hint:** give each account its own `mutable std::mutex` and keep the accounts in a
`std::vector` sized once in the constructor (a mutex can't be moved, and a vector built with a
size never needs to move its elements). Take both locks of a transfer with one
`std::scoped_lock`, and for `total` lock every account in index order before adding them up. A
single mutex for the whole bank is also correct, just less concurrent.

Hidden tests decide correctness.
'''
starter = '''
