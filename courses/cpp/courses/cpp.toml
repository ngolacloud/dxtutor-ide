explanation = '''
The program prints the table and the answer:

```text
1 1 1 1
1 0 1 2
1 1 2 0
0 1 3 3
paths: 3
```

Row 0 and column 0 have one path per cell until a wall breaks the line: the wall at (3, 0) gets
0, and so does the wall at (1, 1), so cell (2, 1) is reachable only from the left. Every other
cell adds its upper and left neighbours, and the bottom-right cell collects 3. The loops visit
each cell once with O(1) work, so the cost is O(rows × cols). Without the table, a recursive
count would revisit the same cells along every path, which grows exponentially on an open grid.
'''

