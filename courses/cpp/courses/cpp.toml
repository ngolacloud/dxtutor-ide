- `next_page(db, std::pair{100, 4}, 2)` → `{{100, 6}, {200, 3}}`
- `next_page(db, std::pair{200, 5}, 2)` → `{}`

**Tip:** SQLite compares row values. `(a, b) > (x, y)` is true when `a > x`, or when `a = x`
and `b > y`.

Hidden tests decide correctness.
