  "`*` multiplies.",
  "Both operands are whole numbers (`int`), so `/` divides and drops the remainder: 3, not 3.5.",
  "`7.0` is a decimal number (`double`), so this division keeps the fraction and prints 3.5.",
  "Three string literals chained one after another, landing on the same line.",
