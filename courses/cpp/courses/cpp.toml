target = '''
#include <algorithm>
#include <iostream>
#include <memory>

struct Node {
    int key;
    std::unique_ptr<Node> left, right;
};

void insert(std::unique_ptr<Node>& root, int key) {
    std::unique_ptr<Node>* link = &root;
    while (*link) {
        if (key == (*link)->key) return;
        link = key < (*link)->key ? &(*link)->left : &(*link)->right;
    }
    *link = std::make_unique<Node>(key);
}

int height(const Node* node) {
    if (!node) return 0;
    return 1 + std::max(height(node->left.get()), height(node->right.get()));
}

int main() {
    std::unique_ptr<Node> sorted, balanced;
    for (int k = 1; k <= 15; ++k) insert(sorted, k);
    for (int k : {8, 4, 12, 2, 6, 10, 14, 1, 3, 5, 7, 9, 11, 13, 15}) insert(balanced, k);
    std::cout << "sorted order:  height " << height(sorted.get()) << '\n';
    std::cout << "middle first:  height " << height(balanced.get()) << '\n';
}
