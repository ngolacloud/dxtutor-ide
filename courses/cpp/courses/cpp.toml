[[unit]]
id = "cpp-udb1-connect-query"
title = "Databases: the sqlite3 C API"
level = "intermediate"
difficulty = 16
intro = '''
Real programs keep their state in a database. SQLite is a complete SQL database that you link
into your program as a C library, `<sqlite3.h>`. Here you open a database, create a table, bind
values to `?` placeholders, and read rows back one `sqlite3_step` at a time, with every handle
owned by RAII so that nothing can leak.
'''
concepts = '''
## The idea

A relational database stores data in **tables**: rows that all share the same named columns. You talk to it in **SQL**, a declarative language: you describe *what* you want (`SELECT name FROM users WHERE age > 30`) and the database's query planner decides *how* to get it. Some statements change things and return no rows (`CREATE TABLE`, `INSERT`, `UPDATE`); queries return a **result set** of rows.

SQLite is an **embedded** database: there is no server process. The whole engine is a library inside your program, and a database is a single file or, with the special name `":memory:"`, a scratch database in RAM that disappears when the connection closes.

The most important habit is how values get into SQL. Gluing input into the query text lets the input change the *structure* of the query: a city such as `x' OR '1'='1` turns a lookup into "return every row". That is **SQL injection**. A **placeholder** (`?`) fixes the shape of the statement first; the values are **bound** separately, as data that is never parsed as SQL.

## How C++ does it

SQLite's API is plain C, built around two opaque handles. A `sqlite3*` is a **connection**, opened with `sqlite3_open` and released with `sqlite3_close`. A `sqlite3_stmt*` is a **prepared statement**: SQL compiled once by `sqlite3_prepare_v2`, then driven with `sqlite3_bind_*` (fill the `?`s, counted from 1), `sqlite3_step` (`SQLITE_ROW` for each row, then `SQLITE_DONE`), `sqlite3_column_*` (read a column, counted from 0), `sqlite3_reset` (run it again) and `sqlite3_finalize`.

Every handle must be released exactly once, on every path, exceptions included. That is RAII's job: hand each one to a `std::unique_ptr` whose custom deleter calls the right C function.

```cpp
struct StmtFinalize {
    void operator()(sqlite3_stmt* s) const { sqlite3_finalize(s); }
};
using Stmt = std::unique_ptr<sqlite3_stmt, StmtFinalize>;
```

Every call returns a result code, and `sqlite3_errmsg(db)` describes the last failure. Check the codes and turn failures into exceptions. Programs link with `-lsqlite3`; on Debian and Ubuntu the headers come from the `libsqlite3-dev` package.

## What is special or tricky

- `sqlite3_open` gives you a handle **even when it fails**, and that handle must still be closed. Take ownership before you check the code.
- `sqlite3_column_text` returns `const unsigned char*`, and `nullptr` for a SQL `NULL`. Building a `std::string` from `nullptr` is undefined behaviour.
- That pointer is only valid until the next `step`, `reset` or `finalize`. Copy it into a `std::string` straight away.
- `SQLITE_STATIC` in `sqlite3_bind_text` promises that your buffer outlives the statement's use of it; `SQLITE_TRANSIENT` makes SQLite take a copy.
- Placeholders stand for values only: `SELECT * FROM ?` cannot choose a table.
- Without `ORDER BY`, SQL promises no row order at all.
- A connection with unfinalized statements cannot close: `sqlite3_close` returns `SQLITE_BUSY` and the memory leaks.

## What you will practise

You will open an in-memory database and count rows, bind parameters (quotes included) to a reusable statement, and loop over a result set that contains a `NULL`. The challenge asks you to filter by a value that may contain quotes or SQL, safely and without leaking a statement.
'''

[[unit.step]]
kind = "concept"
id = "cpp-udb1-c1-lifecycle"
title = "Open, prepare, bind, step, finalize"
points = 5
difficulty = 16
intro = '''
Every SQLite program follows the same life cycle: open a connection, prepare a statement, bind
its parameters, step through its rows and finalize it. Preparing compiles the SQL into a small
program for SQLite's virtual machine; stepping runs that program until it produces the next row.
'''
body = '''
## The life cycle of a query

```cpp
sqlite3_stmt* raw = nullptr;
sqlite3_prepare_v2(db, "SELECT name FROM users WHERE id = ?", -1, &raw, nullptr);
Stmt st(raw);                                   // finalized on every way out
sqlite3_bind_int(st.get(), 1, 42);              // fill placeholder number 1
while (sqlite3_step(st.get()) == SQLITE_ROW) {
    const unsigned char* p = sqlite3_column_text(st.get(), 0);
    std::cout << (p ? reinterpret_cast<const char*>(p) : "NULL") << '\n';
}
```

- **`sqlite3_prepare_v2`** compiles the SQL. The `-1` means "read up to the terminating zero".
- **`sqlite3_bind_*`** puts a value into a `?`. Placeholders count from **1**: there are
  `bind_int`, `bind_int64`, `bind_double`, `bind_text` and `bind_null`.
- **`sqlite3_step`** runs until the next row (`SQLITE_ROW`) or the end (`SQLITE_DONE`).
  Any other code is an error.
- **`sqlite3_column_*`** reads a column of the current row. Columns count from **0**.
- **`sqlite3_reset`** rewinds the statement so you can bind new values and run it again
  without compiling it twice.
- **`sqlite3_finalize`** frees it; here the `unique_ptr` calls it for you.

For SQL with no parameters and no rows to read, such as `CREATE TABLE`,
`sqlite3_exec(db, sql, nullptr, nullptr, nullptr)` prepares, steps and finalizes in one call.

Never build SQL with `+` or `std::format`. A quote in the data breaks the statement, and a
crafted value rewrites it.
'''

