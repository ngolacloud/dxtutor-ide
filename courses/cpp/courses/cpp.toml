[[unit.step]]
kind = "challenge"
id = "cpp-u18-x1-stats"
title = "Constrained statistics"
points = 40
difficulty = 24
intro = '''
Statistics functions are a natural fit for concepts: the mean of strings or of booleans makes
no sense, and saying so in the signature turns a misuse into a clear compile error. A good
generic version also accepts any container of numbers, not just `std::vector<double>`, which
is exactly what the ranges concepts describe.
'''
entry = "mean"
instructions = '''
## Your turn

Define two concepts and two constrained function templates:

```cpp
template <typename T>
concept Arithmetic = /* ... */;

template <typename R>
concept NumericRange = /* ... */;

template <NumericRange R> double mean(const R& values);
template <NumericRange R> double median(const R& values);
```

The concepts:

- `Arithmetic<T>` is true for integral and floating-point types, **except `bool`**. So
  `int`, `long long`, `unsigned`, `float` and `double` are arithmetic; `bool`,
  `std::string` and pointers are not.
- `NumericRange<R>` is true when `R` is a `std::ranges::forward_range` whose element type
  (`std::ranges::range_value_t<R>`) is `Arithmetic`. So `std::vector<int>`,
  `std::list<double>` and `std::array<float, 3>` qualify; `std::vector<std::string>`,
  `std::vector<bool>` and `int` don't.

The functions:

- `mean` returns the arithmetic mean as a `double`. Add the values up in a `double`, so a
  range of large `int`s does not overflow.
- `median` returns the middle value of the sorted values, or the average of the two middle
  values when the count is even. Don't modify the input: copy the values first.
- Both throw `std::invalid_argument` on an empty range.
- Both must be **constrained** with `NumericRange`, so that calling them with a
  `std::vector<std::string>` does not compile. The hidden tests check this with concepts of
  their own, as well as checking `Arithmetic` and `NumericRange` directly.

Examples: `mean(std::vector{1, 2, 3, 4})` is `2.5`; `median(std::vector{5, 1, 3})` is `3.0`;
`median(std::list<double>{4, 1, 3, 2})` is `2.5`.

**Hint:** `std::integral<T> && !std::same_as<T, bool>` is half of `Arithmetic`. For
`median`, copy into a `std::vector<double>` and use `std::sort` or `std::nth_element`.

Hidden tests decide correctness.
'''
starter = '''
#include <algorithm>
#include <concepts>
#include <ranges>
#include <stdexcept>
#include <vector>

// TODO: true for integral and floating-point types, except bool.
template <typename T>
concept Arithmetic = false;

// TODO: true for forward ranges whose element type is Arithmetic.
template <typename R>
concept NumericRange = false;

// TODO: constrain with NumericRange. Mean as a double; std::invalid_argument when empty.
template <typename R>
double mean(const R& values) {
    (void)values;
    throw std::logic_error("not implemented");
}

// TODO: constrain with NumericRange. Middle value (or average of the two middle values);
// must not modify values; std::invalid_argument when empty.
template <typename R>
double median(const R& values) {
    (void)values;
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <algorithm>
#include <array>
#include <climits>
#include <cmath>
#include <list>
#include <ranges>
#include <set>
#include <string>
#include <vector>

template <typename R>
concept CanMean = requires(const R& r) { mean(r); };

template <typename R>
concept CanMedian = requires(const R& r) { median(r); };

static bool near(double a, double b) {
    return std::abs(a - b) <= 1e-9 * std::max(1.0, std::abs(b));
}

TEST(arithmetic_concept) {
    CHECK(Arithmetic<int>);
    CHECK(Arithmetic<long long>);
    CHECK(Arithmetic<unsigned>);
    CHECK(Arithmetic<float>);
    CHECK(Arithmetic<double>);
    CHECK(!Arithmetic<bool>);
    CHECK(!Arithmetic<std::string>);
    CHECK(!Arithmetic<int*>);
    CHECK(!Arithmetic<std::vector<int>>);
}

TEST(numeric_range_concept) {
    CHECK(NumericRange<std::vector<int>>);
    CHECK(NumericRange<std::list<double>>);
    CHECK((NumericRange<std::array<float, 3>>));
    CHECK(NumericRange<std::set<long>>);
    CHECK(!NumericRange<std::vector<std::string>>);
    CHECK(!NumericRange<std::vector<bool>>);
    CHECK(!NumericRange<int>);
    CHECK(!NumericRange<std::vector<int*>>);
}

TEST(functions_are_constrained) {
    CHECK(CanMean<std::vector<int>>);
    CHECK(CanMedian<std::list<double>>);
    CHECK(!CanMean<std::vector<std::string>>);
    CHECK(!CanMedian<std::vector<std::string>>);
    CHECK(!CanMean<std::vector<bool>>);
    CHECK(!CanMedian<int>);
    CHECK(!CanMean<double>);
}

TEST(mean_basic_and_types) {
    CHECK(near(mean(std::vector<int>{1, 2, 3, 4}), 2.5));
    CHECK(near(mean(std::list<double>{0.5, 1.5}), 1.0));
    CHECK(near(mean(std::array<float, 3>{1.0f, 2.0f, 6.0f}), 3.0));
    CHECK(near(mean(std::vector<int>{-3, -1, 7}), 1.0));
    CHECK(near(mean(std::vector<int>{42}), 42.0));
    CHECK(near(mean(std::views::iota(1, 101)), 50.5));
}

TEST(mean_does_not_overflow) {
    std::vector<int> big(1000, INT_MAX);
    CHECK(near(mean(big), static_cast<double>(INT_MAX)));
    std::vector<int> mixed{INT_MAX, INT_MAX, INT_MIN, INT_MIN};
    CHECK(near(mean(mixed), -0.5));
}

TEST(median_odd_even_unsorted) {
    CHECK(near(median(std::vector<int>{5, 1, 3}), 3.0));
    CHECK(near(median(std::list<double>{4, 1, 3, 2}), 2.5));
    CHECK(near(median(std::vector<int>{7}), 7.0));
    CHECK(near(median(std::vector<int>{2, 2, 2, 9}), 2.0));
    CHECK(near(median(std::vector<int>{-10, -20, 5, 0, -5}), -5.0));
    CHECK(near(median(std::vector<int>{1, 2}), 1.5));
}

TEST(median_does_not_modify_input) {
    std::vector<int> v{9, 3, 7, 1, 5};
    CHECK(near(median(v), 5.0));
    CHECK_EQ(v, (std::vector<int>{9, 3, 7, 1, 5}));
}

TEST(empty_ranges_throw) {
    int errors = 0;
    try { (void)mean(std::vector<int>{}); } catch (const std::invalid_argument&) { ++errors; }
    try { (void)median(std::list<double>{}); } catch (const std::invalid_argument&) { ++errors; }
    CHECK_EQ(errors, 2);
}

TEST(large_input) {
    std::vector<long long> v;
    v.reserve(100001);
    unsigned long long x = 12345;
    for (int i = 0; i < 100001; ++i) {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        v.push_back(static_cast<long long>(x >> 40));
    }
    std::vector<long long> sorted = v;
    std::sort(sorted.begin(), sorted.end());
    CHECK(near(median(v), static_cast<double>(sorted[50000])));
    long double total = 0;
    for (long long y : v) total += y;
    CHECK(near(mean(v), static_cast<double>(total / v.size())));
}
'''

[unit.step.gabarito]
solution = '''
#include <algorithm>
#include <concepts>
#include <cstddef>
#include <ranges>
#include <stdexcept>
#include <vector>

// Integral and floating-point types, except bool.
template <typename T>
concept Arithmetic = (std::integral<T> && !std::same_as<T, bool>) || std::floating_point<T>;

// Forward ranges whose element type is Arithmetic.
template <typename R>
concept NumericRange =
    std::ranges::forward_range<R> && Arithmetic<std::ranges::range_value_t<R>>;

template <NumericRange R>
double mean(const R& values) {
    double sum = 0.0;
    std::size_t count = 0;
    for (const auto& v : values) {
        sum += static_cast<double>(v);
        ++count;
    }
    if (count == 0) throw std::invalid_argument("mean of an empty range");
    return sum / static_cast<double>(count);
}

template <NumericRange R>
double median(const R& values) {
    std::vector<double> copy;
    for (const auto& v : values) copy.push_back(static_cast<double>(v));
    if (copy.empty()) throw std::invalid_argument("median of an empty range");
    const std::size_t mid = copy.size() / 2;
    std::nth_element(copy.begin(), copy.begin() + mid, copy.end());
    const double upper = copy[mid];
    if (copy.size() % 2 == 1) return upper;
    const double lower = *std::max_element(copy.begin(), copy.begin() + mid);
    return (lower + upper) / 2.0;
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
`mean` makes one pass over the range, doing a conversion and an addition per element, so it
runs in **O(n)** time with **O(1)** extra space. Summing in a `double` instead of the element
type is what keeps a thousand `INT_MAX` values from overflowing (signed overflow would be
undefined behaviour).

`median` copies the values into a vector, O(n) time and **O(n)** space, which also leaves
the caller's data untouched. `std::nth_element` then places the middle element where a full
sort would put it, with everything smaller to its left, in **O(n)** average time. For an even
count, the lower middle value is the largest element of the left part, found by one more
linear scan. The whole function is therefore O(n) on average; sorting the copy instead would
be simpler and cost O(n log n).

The concepts cost nothing at run time. They are checked when a call is compiled, so
`mean(std::vector<std::string>{})` is rejected with "constraints not satisfied" at the call
site, and `NumericRange` short-circuits: for `int`, `std::ranges::forward_range<int>` is
already false, so `range_value_t<int>` is never formed.
'''


[[unit]]
id = "cpp-u19-operators-iterators"
title = "Operator overloading & custom iterators"
level = "advanced"
difficulty = 25
intro = '''
Operator overloading lets your own types use `+`, `==`, `<` and `<<` like the built-in ones,
and a handful of iterator operators lets them work in a range-for loop and with the standard
algorithms. You will give a vector type arithmetic, get all six comparisons from one
defaulted `<=>`, write an iterator for range-for, and finish with a Python-style `Range`
that the `std::ranges` algorithms accept.
'''
concepts = '''
## The idea

Built-in types come with operators: you add two `int`s with `+` and compare them with `<`.
For your own types, C++ lets you define what those operators mean. An overloaded operator is
just a function with a special name, `operator+`, `operator==`, `operator<<`, and
`a + b` is shorthand for calling it. Used well, it makes a `Vec2`, a `Money` or a `Matrix`
read like mathematics. Used badly, it hides surprises behind innocent symbols, so the rule
is: only overload an operator when its meaning is obvious.

## How C++ does it

The usual pattern is a compound operator as a member and the plain one as a free function
built on it:

```cpp
struct Money {
    long cents = 0;
    Money& operator+=(Money o) { cents += o.cents; return *this; }
    auto operator<=>(const Money&) const = default;  // ==, !=, <, <=, >, >=
};
Money operator+(Money a, Money b) { return a += b; }
std::ostream& operator<<(std::ostream& out, Money m) { return out << m.cents << 'c'; }
```

- `+=` modifies `*this` and returns it by reference, so calls can chain.
- `+` is a free function, so conversions apply equally to both operands.
- In C++20, a defaulted `operator<=>` compares the members in declaration order and gives
  you all four ordering operators; it also brings a defaulted `==`, and the compiler
  rewrites `a != b` as `!(a == b)`.
- `operator<<` must be a free function, because the stream is the left operand.

## Iterators and range-for

A range-for loop is rewritten by the compiler into iterator calls:

```cpp
for (auto x : r) { ... }
// becomes roughly:
for (auto it = r.begin(), end = r.end(); it != end; ++it) { auto x = *it; ... }
```

So any type with `begin()` and `end()` returning an object that supports `*`, prefix `++`
and `!=` works in a range-for. To also satisfy the `std::ranges` algorithms, the iterator
needs a bit more: public `value_type` and `difference_type` aliases, a default constructor,
postfix `++` and `==`. The `std::forward_iterator` concept checks the whole list for you.

## What is special or tricky

- **Never return a reference to a local.** `Money& operator+(…)` returning a local variable
  leaves a dangling reference: undefined behaviour. Return by value.
- **Keep operators consistent.** If `a == b` is true, `a < b` and `b < a` must be false.
  Algorithms such as `std::sort` assume this, and break in strange ways when it is not true.
- **Don't overload `&&`, `||` or `,`.** The overloads lose short-circuit evaluation.
- **Prefix and postfix `++` differ.** Prefix returns `*this` by reference; postfix takes a
  dummy `int` parameter and returns the old value by copy.
- **Dereferencing `end()` is undefined behaviour.** It points one past the last element.
- **Forgetting `const`.** If `begin()` and `end()` are not `const`, you cannot loop over a
  `const` object, and a defaulted comparison needs `const` too.

## What you will practise

You will write arithmetic and stream operators for `Vec2`, sort dates with a defaulted
`<=>`, and write a countdown iterator. The challenge is a `Range` class like Python's
`range`, with an iterator good enough for `std::ranges` algorithms, indexing and a
value-based `==`.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u19-c1-operator-functions"
title = "Operators are functions with special names"
points = 5
difficulty = 25
intro = '''
Every overloaded operator is an ordinary function that the compiler calls when it sees the
symbol. Deciding whether that function is a member or a free function, and what it returns,
is what separates operators that behave like the built-ins from ones that surprise people.
'''
body = '''
## The translation

When the compiler sees `a + b` with a user-defined type involved, it looks for a function
named `operator+` and calls one of:

```cpp
a.operator+(b);   // a member function of a's type
operator+(a, b);  // a free function
```

## Member or free?

- **Members:** operators that must change or belong to the object: `=`, `+=`, `[]`, `()`,
  `->`, prefix and postfix `++`.
- **Free functions:** symmetric binary operators like `+` and `*`, so `2 * v` works as well
  as `v * 2`, and stream operators like `<<`, whose left operand is the stream.

## Canonical return types

| operator | returns |
|---|---|
| `a += b` | `T&`, which is `*this` |
| `a + b` | `T` by value, a new object |
| `++a` | `T&` |
| `a++` | `T` by value, the old value |
| `a == b` | `bool` |
| `a <=> b` | `std::strong_ordering` (or weak/partial) |
| `out << a` | `std::ostream&`, the same stream |

## Comparisons in C++20

Writing `auto operator<=>(const T&) const = default;` compares members one by one in
declaration order, like comparing words letter by letter. From it, and the matching `==`,
the compiler synthesises `<`, `<=`, `>`, `>=`, `==` and `!=`. You write one line and get six
consistent operators.

## Iterators are operators too

An iterator is a small object whose operators mean "current element" (`*`), "move on" (`++`)
and "same position?" (`==`). Range-for, `std::sort` and the `std::ranges` algorithms only
ever talk to containers through those operators.
'''

