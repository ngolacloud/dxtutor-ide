run_command = "g++ -std=c++20 -O2 -pthread main.cpp -o main -lsqlite3 && ./main"
intro = '''
Several threads can write to one WAL database as long as each has its own connection and waits
politely for the single write lock. `BEGIN IMMEDIATE` asks for the lock at the start, and the
busy timeout turns "the lock is taken" into "wait a moment and try again".
'''
prompt = '''
Switch a file database to WAL, start four threads that each open their own connection with a
busy timeout and insert 25 rows inside a `BEGIN IMMEDIATE` transaction, join them, and print
the number of rows.

**Why:** a connection per thread plus a busy timeout is the standard recipe for concurrent
writers on SQLite, and the exact total proves no write was lost.
'''
target = '''
#include <sqlite3.h>
#include <filesystem>
#include <iostream>
#include <memory>
#include <string>
#include <thread>
#include <vector>

namespace fs = std::filesystem;
struct DbClose { void operator()(sqlite3* db) const { sqlite3_close(db); } };

std::unique_ptr<sqlite3, DbClose> open_db(const std::string& path) {
    sqlite3* raw = nullptr;
    sqlite3_open(path.c_str(), &raw);
    sqlite3_busy_timeout(raw, 5000);
    return std::unique_ptr<sqlite3, DbClose>(raw);
}

int main() {
    std::string path = (fs::temp_directory_path() / "dxt_udb3_threads.db").string();
    for (const char* s : {"", "-wal", "-shm"}) fs::remove(path + s);
    auto db = open_db(path);
    sqlite3_exec(db.get(), "PRAGMA journal_mode=WAL; CREATE TABLE hits (id INTEGER PRIMARY KEY)",
                 nullptr, nullptr, nullptr);
    std::vector<std::thread> workers;
    for (int w = 0; w < 4; ++w) {
        workers.emplace_back([&path] {
            auto conn = open_db(path);
            sqlite3_exec(conn.get(), "BEGIN IMMEDIATE", nullptr, nullptr, nullptr);
            for (int i = 0; i < 25; ++i)
                sqlite3_exec(conn.get(), "INSERT INTO hits DEFAULT VALUES", nullptr, nullptr, nullptr);
            sqlite3_exec(conn.get(), "COMMIT", nullptr, nullptr, nullptr);
        });
    }
    for (auto& t : workers) t.join();
    auto print = [](void*, int, char** v, char**) { std::cout << v[0] << " rows\n"; return 0; };
    sqlite3_exec(db.get(), "SELECT COUNT(*) FROM hits", print, nullptr, nullptr);
    db.reset();
    for (const char* s : {"", "-wal", "-shm"}) fs::remove(path + s);
}
'''
