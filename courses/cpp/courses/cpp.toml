prompt = '''
Sum the numbers 1 to 100,000 as four `std::async` tasks over contiguous chunks, then print each
partial sum and the total.

**Why:** compared with the thread version in the previous unit, there are no shared output slots
and no explicit joins: the futures carry the results and the synchronisation.
