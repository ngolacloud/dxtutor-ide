target = '''
#include <iostream>
#include <stdexcept>
#include <string>
#include <utility>
#include <vector>

template <typename T>
class Stack {
public:
    void push(T value) { items_.push_back(std::move(value)); }
    T pop() {
        if (items_.empty()) throw std::out_of_range("pop on empty stack");
        T top = std::move(items_.back());
        items_.pop_back();
        return top;
    }
    bool empty() const { return items_.empty(); }
    std::size_t size() const { return items_.size(); }

private:
    std::vector<T> items_;
};

int main() {
    Stack<int> numbers;
    for (int i = 1; i <= 3; ++i) numbers.push(i * 10);
    std::cout << numbers.pop() << " left " << numbers.size() << '\n';
    Stack<std::string> words;
    words.push("class");
    words.push("template");
    std::cout << words.pop() << '\n';
    std::cout << words.pop() << '\n';
    std::cout << std::boolalpha << words.empty() << '\n';
}
'''
