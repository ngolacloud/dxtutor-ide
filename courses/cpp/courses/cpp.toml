prompt = '''
Call a function that modifies a copy and one that modifies a reference, swap two variables
through references, and count spaces in a string passed by `const` reference.

**Why:** choosing between `T`, `T&` and `const T&` is a decision you make for every parameter
you write in C++, and this drill shows the visible consequences of each.
'''
target = '''
#include <iostream>
#include <string>

void add_one_copy(int n) {
    n += 1;
}

void add_one_ref(int& n) {
    n += 1;
}

void swap_values(int& a, int& b) {
    int tmp = a;
    a = b;
    b = tmp;
}

std::size_t count_spaces(const std::string& text) {
    std::size_t spaces = 0;
    for (char c : text) {
        if (c == ' ') {
