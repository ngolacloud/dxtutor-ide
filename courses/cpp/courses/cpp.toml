target = '''
#include <sqlite3.h>
#include <iostream>
#include <memory>
#include <stdexcept>

struct DbClose { void operator()(sqlite3* db) const { sqlite3_close(db); } };
class Transaction {
    sqlite3* db_;
    bool done_ = false;
public:
    explicit Transaction(sqlite3* db) : db_(db) { exec("BEGIN"); }
    Transaction(const Transaction&) = delete;
    Transaction& operator=(const Transaction&) = delete;
    ~Transaction() { if (!done_) sqlite3_exec(db_, "ROLLBACK", nullptr, nullptr, nullptr); }
    void commit() { exec("COMMIT"); done_ = true; }
    void exec(const char* sql) {
        if (sqlite3_exec(db_, sql, nullptr, nullptr, nullptr) != SQLITE_OK)
            throw std::runtime_error(sqlite3_errmsg(db_));
    }
};

int main() {
    sqlite3* raw = nullptr;
