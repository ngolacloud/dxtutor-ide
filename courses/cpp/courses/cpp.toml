prompt = '''
Run three tasks of different lengths with a time slice of 2 using a `std::queue`, and print the
time at which each one finishes.

**Why:** FIFO order is what makes round-robin fair: a task that goes back in line waits behind
every other task exactly once.
'''
target = '''
#include <algorithm>
#include <iostream>
#include <queue>
#include <string>

struct Task {
    std::string name;
    int remaining;
};

int main() {
    std::queue<Task> ready;
    ready.push({"build", 5});
    ready.push({"test", 2});
    ready.push({"lint", 3});
    const int slice = 2;
    int clock = 0;
    while (!ready.empty()) {
        Task task = ready.front();
        ready.pop();
        int run = std::min(slice, task.remaining);
        clock += run;
        task.remaining -= run;
        if (task.remaining > 0) {
            ready.push(task);
        } else {
            std::cout << task.name << " finished at t=" << clock << '\n';
        }
    }
}
'''
