**Why:** packs and folds are how the standard library builds `std::make_unique`,
`std::tuple` and `std::format`-style functions that take any number of typed arguments.
'''
target = '''
#include <cstddef>
#include <iostream>
#include <string>

template <typename... Args>
auto sum(Args... args) {
    return (args + ...);
}

template <typename... Args>
void print_all(const Args&... args) {
    ((std::cout << args << ' '), ...);
    std::cout << '\n';
}

template <typename... Args>
constexpr std::size_t count_args(const Args&...) {
    return sizeof...(Args);
}

int main() {
    std::cout << sum(1, 2, 3, 4) << '\n';
    std::cout << sum(1.5, 2, 3) << '\n';
    print_all("id", 42, 3.5, std::string("ok"), 'c');
