- `top_words("the cat and the hat", 2)` returns `{{"the", 2}, {"and", 1}}`.
- `top_words("b a b a c", 5)` returns `{{"a", 2}, {"b", 2}, {"c", 1}}`.
- `top_words("   ", 3)` returns `{}`.

**Hint:** reading from a `std::istringstream` with `>>` into a `std::string` skips whitespace
and extracts one word at a time. Count with a map, copy the entries into a vector, and sort
it with a comparison function.

