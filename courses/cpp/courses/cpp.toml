[[unit.step]]
kind = "challenge"
id = "cpp-u22-x1-run-all"
title = "Run jobs concurrently, rethrow the first failure"
points = 40
difficulty = 28
intro = '''
"Run these jobs in parallel and give me all the results, or the first error" is the contract of
JavaScript's `Promise.all`, Python's `asyncio.gather` and Go's `errgroup`. Building it from
futures means deciding what happens to the other jobs when one fails, and keeping the results in
input order however the jobs finish.
'''
entry = "run_all"
instructions = '''
## Your turn

Implement `run_all`:

```cpp
std::vector<int> run_all(const std::vector<std::function<int()>>& jobs);
```

Rules:

- Run **every** job concurrently, each as its own task (`std::async` with `std::launch::async`,
  or threads with promises). Never run them one after another: the hidden tests include jobs
  that only finish when all of them are running at the same time.
- Return the results **in the order of `jobs`**, whichever job finishes first.
- An empty `jobs` returns an empty vector.
- If one or more jobs throw, first wait until **every** job has finished, then rethrow the
  exception of the failing job with the **smallest index**. Rethrow the original exception, so
  its type and `what()` are kept.

Example:

```cpp
run_all({[] { return 1; }, [] { return 2; }});   // {1, 2}

run_all({[] { return 1; },
         []() -> int { throw std::invalid_argument("bad input"); },
         []() -> int { throw std::runtime_error("later"); }});
// throws std::invalid_argument("bad input"), after all three jobs finished
```

**Hint:** start all the tasks first and keep their futures in a vector. Then `get()` each one in
order inside a `try`, remember the first `std::exception_ptr` you catch, and keep going so you
wait for the rest. At the end, `std::rethrow_exception` it.

Hidden tests decide correctness.
'''
