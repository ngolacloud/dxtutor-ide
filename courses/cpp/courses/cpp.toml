    CHECK_EQ(bank.total(), 300);
}

TEST(transfer_and_insufficient_funds) {
    Bank bank(2, 50);
    CHECK(bank.transfer(0, 1, 20));
    CHECK_EQ(bank.balance(0), 30);
    CHECK_EQ(bank.balance(1), 70);
    CHECK(!bank.transfer(0, 1, 31));
    CHECK_EQ(bank.balance(0), 30);
    CHECK_EQ(bank.balance(1), 70);
    CHECK(bank.transfer(0, 1, 30));
    CHECK_EQ(bank.balance(0), 0);
    CHECK_EQ(bank.balance(1), 100);
    CHECK(bank.transfer(1, 0, 100));
    CHECK_EQ(bank.total(), 100);
}

TEST(transfer_to_self_changes_nothing) {
    Bank bank(1, 10);
    CHECK(bank.transfer(0, 0, 5));
    CHECK(bank.transfer(0, 0, 10));
    CHECK(!bank.transfer(0, 0, 11));
    CHECK_EQ(bank.balance(0), 10);
}

TEST(rejects_bad_ids_and_amounts) {
    Bank bank(2, 10);
    CHECK(bank_test_throws<std::out_of_range>([&] { bank.transfer(0, 2, 1); }));
    CHECK(bank_test_throws<std::out_of_range>([&] { bank.transfer(7, 0, 1); }));
    CHECK(bank_test_throws<std::out_of_range>([&] { bank.balance(2); }));
    CHECK(bank_test_throws<std::invalid_argument>([&] { bank.transfer(0, 1, 0); }));
    CHECK(bank_test_throws<std::invalid_argument>([&] { bank.transfer(0, 1, -5); }));
    CHECK_EQ(bank.balance(0), 10);
    CHECK_EQ(bank.total(), 20);
}

TEST(empty_bank) {
    Bank bank(0, 100);
    CHECK_EQ(bank.size(), 0u);
    CHECK_EQ(bank.total(), 0);
    CHECK(bank_test_throws<std::out_of_range>([&] { bank.balance(0); }));
}

TEST(opposite_transfers_on_eight_threads_keep_every_balance) {
    // Around a ring of 4 accounts, 4 threads send 1 forward and 4 send 1 back.
    // Balances never get near zero, so every transfer succeeds and nets out.
    Bank bank(4, 1'000'000);
    const int rounds = 20000;
    std::vector<long long> ok(8, 0);
    std::atomic<int> errors{0};
    std::vector<std::thread> threads;
    for (std::size_t k = 0; k < 4; ++k) {
        threads.emplace_back([&, k] {
            try {
                for (int r = 0; r < rounds; ++r) ok[2 * k] += bank.transfer(k, (k + 1) % 4, 1);
            } catch (...) {
                errors.fetch_add(1);
            }
        });
        threads.emplace_back([&, k] {
            try {
                for (int r = 0; r < rounds; ++r) ok[2 * k + 1] += bank.transfer((k + 1) % 4, k, 1);
            } catch (...) {
                errors.fetch_add(1);
            }
        });
    }
    for (auto& t : threads) t.join();
    CHECK_EQ(errors.load(), 0);
    long long succeeded = 0;
    for (long long x : ok) succeeded += x;
    CHECK_EQ(succeeded, 8LL * rounds);
    for (std::size_t i = 0; i < 4; ++i) CHECK_EQ(bank.balance(i), 1'000'000);
    CHECK_EQ(bank.total(), 4'000'000);
}

TEST(concurrent_withdrawals_never_overdraw) {
    // 8 threads try 500 transfers of 1 each from an account holding 1000.
    Bank bank(2, 1000);
    std::vector<long long> ok(8, 0);
    std::atomic<int> errors{0};
    std::vector<std::thread> threads;
    for (std::size_t t = 0; t < 8; ++t) {
        threads.emplace_back([&, t] {
            try {
                for (int r = 0; r < 500; ++r) ok[t] += bank.transfer(0, 1, 1);
            } catch (...) {
                errors.fetch_add(1);
            }
        });
    }
    for (auto& t : threads) t.join();
    CHECK_EQ(errors.load(), 0);
    long long succeeded = 0;
    for (long long x : ok) succeeded += x;
    CHECK_EQ(succeeded, 1000);
    CHECK_EQ(bank.balance(0), 0);
    CHECK_EQ(bank.balance(1), 2000);
}

TEST(random_transfers_conserve_money_and_total_is_a_snapshot) {
    Bank bank(16, 100);
    std::atomic<int> errors{0};
    std::atomic<bool> writers_done{false};
    std::vector<std::thread> threads;
    for (unsigned t = 0; t < 7; ++t) {
        threads.emplace_back([&, t] {
            try {
                std::mt19937 rng(1234 + t);
                std::uniform_int_distribution<std::size_t> account(0, 15);
                std::uniform_int_distribution<long long> amount(1, 50);
                for (int r = 0; r < 20000; ++r) bank.transfer(account(rng), account(rng), amount(rng));
            } catch (...) {
                errors.fetch_add(1);
            }
        });
    }
    int bad_snapshots = 0;
    std::thread reader([&] {
        try {
            int reads = 0;
            while (!writers_done.load() || reads < 50) {
                if (bank.total() != 1600) ++bad_snapshots;
                ++reads;
            }
        } catch (...) {
            errors.fetch_add(1);
        }
    });
    for (auto& t : threads) t.join();
    writers_done.store(true);
    reader.join();
    CHECK_EQ(errors.load(), 0);
    CHECK_EQ(bad_snapshots, 0);
    CHECK_EQ(bank.total(), 1600);
    for (std::size_t i = 0; i < 16; ++i) CHECK(bank.balance(i) >= 0);
}
'''

[unit.step.gabarito]
solution = '''
#include <cstddef>
#include <mutex>
#include <stdexcept>
#include <vector>

class Bank {
public:
    Bank(std::size_t accounts, long long initial_balance) : accounts_(accounts) {
        for (Account& a : accounts_) a.balance = initial_balance;
    }

    std::size_t size() const { return accounts_.size(); }

    long long balance(std::size_t id) const {
        const Account& a = at(id);
        std::lock_guard lock(a.m);
        return a.balance;
    }

    bool transfer(std::size_t from, std::size_t to, long long amount) {
        if (amount <= 0) throw std::invalid_argument("amount must be positive");
        Account& src = at(from);
        Account& dst = at(to);
        if (from == to) {  // one account, one mutex: never lock it twice
            std::lock_guard lock(src.m);
            return src.balance >= amount;
        }
        std::scoped_lock lock(src.m, dst.m);  // both or neither, deadlock-free
        if (src.balance < amount) return false;
        src.balance -= amount;
        dst.balance += amount;
        return true;
    }

    long long total() const {
        // Lock every account in index order and keep them all locked while
        // adding, so no transfer can be half-way through the snapshot.
        std::vector<std::unique_lock<std::mutex>> held;
        held.reserve(accounts_.size());
        long long sum = 0;
        for (const Account& a : accounts_) {
            held.emplace_back(a.m);
            sum += a.balance;
        }
        return sum;
    }

private:
    struct Account {
        mutable std::mutex m;
        long long balance = 0;
    };

    Account& at(std::size_t id) {
        if (id >= accounts_.size()) throw std::out_of_range("no such account");
        return accounts_[id];
    }
    const Account& at(std::size_t id) const {
        if (id >= accounts_.size()) throw std::out_of_range("no such account");
        return accounts_[id];
    }

    std::vector<Account> accounts_;
};
'''
time = "O(1) per transfer, O(n) per total"
space = "O(n)"
justification = '''
Let `n` be the number of accounts. `transfer` validates two ids, takes two mutexes and does a
constant amount of arithmetic, so it is **O(1)** apart from waiting for the locks; `balance` is
**O(1)** too. `total` locks and reads every account once, **O(n)**, and holds up to `n` locks in a
vector, so it needs **O(n)** temporary space. The bank stores one mutex and one balance per
account: **O(n)** space overall.

Correctness rests on three arguments. **Atomicity:** the check `src.balance < amount` and both
updates sit inside one critical section that holds both accounts' mutexes, so no thread can see
or change a half-done transfer, and no check-then-act gap can overdraw an account. **No
deadlock:** `std::scoped_lock` acquires its mutexes with `std::lock`, which never blocks while
holding a lock it took (it backs off and retries), so two opposite transfers cannot each hold
one account and wait for the other. `total` does block while holding locks, but always in index
order and only on mutexes held by transfers that will finish without waiting on anything else.
**No self-deadlock:** a self-transfer takes a single lock, since locking one `std::mutex` twice is
undefined behaviour. One bank-wide mutex would be just as correct and simpler, but it would
serialise transfers between unrelated accounts.
'''

[[unit]]
id = "cpp-u22-async-futures"
title = "Tasks: std::async, futures and promises"
level = "advanced"
difficulty = 28
intro = '''
A raw thread returns nothing, and an exception inside it kills the program. A **future** is a
handle to a result that will exist later, a value or an exception, and C++ gives you
`std::async` to run a function as a task, `std::promise` to fulfil a future by hand, and
`std::packaged_task` to wrap a callable. You will fan work out to tasks, collect the results in
order, and watch exceptions travel from a worker back to the caller.
'''
concepts = '''
## The idea

Much parallel work has the shape "compute this, give me the answer later". Instead of sharing a
variable and joining a thread, you get a **future**: a one-shot channel that will eventually hold
either a value or an exception. The thread that needs the result calls `get()`, which blocks
until it is ready. The side that produces it holds the matching **promise**. This **fan-out /
fan-in** style keeps shared mutable state out of your code, so there is nothing to lock: each
task owns its inputs, and its result travels through its own future.

## How C++ does it

Everything lives in `<future>`.

```cpp
std::future<int> f = std::async(std::launch::async, [] { return 6 * 7; });
// ... the caller does other work here ...
int answer = f.get();   // waits, then returns 42
```

`std::async(std::launch::async, fn, args...)` runs `fn` on a new thread and returns a
`std::future<R>`, where `R` is what `fn` returns. If `fn` throws, the exception is stored in the
future and **rethrown by `get()`** on the caller's thread, with its original type.

A `std::promise<T>` is the manual version. `p.get_future()` hands out the future, and some thread
later calls `p.set_value(v)`, or `p.set_exception(std::current_exception())` from a `catch`
block. A `std::packaged_task<R(Args...)>` wraps a callable so that calling the task fulfils its
future, which is how thread pools return results.

`wait()` blocks without taking the value, and `wait_for(duration)` returns
`std::future_status::ready` or `timeout`, so you can poll. A `std::shared_future` lets several
threads read the same result.

## Pitfalls

- **Pass `std::launch::async` explicitly.** The default policy lets the library choose
  `deferred`, which runs the function lazily, on the thread that calls `get()`, one task after
  another, and never at all if nobody asks.
- **`get()` works once.** A second call throws `std::future_error`; `valid()` tells you whether a
  value is still there.
- **The future returned by `std::async` blocks in its destructor** until the task finishes.
  `std::async(std::launch::async, f);` with the result thrown away runs *synchronously*, because
  the temporary future is destroyed at the semicolon.
- **Broken promises.** Destroying a promise that was never set makes `get()` throw
  `std::future_error` (`broken_promise`). Setting it twice throws as well.
- **Dangling captures.** A task that captures locals by reference must finish before they go out
  of scope: get every future before you return.
- Every `std::async` task here is a thread, and starting thousands of them is slow. Group the
  work into a few chunks instead.

## What you will practise

You will launch two tasks and combine their results, deliver a value and an error through a
promise, split a sum into futures, and write `run_all`, which runs jobs concurrently, keeps their
results in input order, and rethrows the first failure only after every job has finished.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u22-c1-futures"
title = "Futures, promises and tasks"
points = 5
difficulty = 28
intro = '''
A future and a promise are the two ends of a one-shot channel between threads: the producer
writes a value or an exception once, and the consumer reads it once, waiting if necessary. Tasks
built on them return results and propagate errors the way ordinary function calls do.
'''
body = '''
## A task with a result

```cpp
std::future<long long> f =
    std::async(std::launch::async, [] { return 1LL << 40; });
long long v = f.get();   // blocks until the task has returned
```

The task runs on its own thread while the caller continues. `get()` is the meeting point: it
waits for the task, then hands over the value, and everything the task wrote is visible to the
caller afterwards.

## Errors travel too

```cpp
auto f = std::async(std::launch::async, []() -> int {
    throw std::runtime_error("disk full");
});
try {
    f.get();
} catch (const std::runtime_error& e) {
    // e.what() is "disk full", caught on the caller's thread
}
```

A plain `std::thread` would have called `std::terminate`. A future stores the exception and
rethrows it in the caller, so tasks fail the way function calls do.

## Promises: fulfilling a future by hand

```cpp
std::promise<int> p;
std::future<int> f = p.get_future();
std::jthread t([&p] { p.set_value(7); });
int x = f.get();         // 7
```

Use a promise when the result is produced by code you control yourself: a worker thread, a
callback, or a thread pool. Each promise must be set exactly once.

## Fan out, fan in

Launch one task per chunk, keep the futures in a vector, then `get()` them in order. The results
come back in the order you launched the tasks, whichever finished first.
'''

