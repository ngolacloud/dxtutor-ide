#include <atomic>
#include <chrono>
#include <functional>
#include <stdexcept>
#include <string>
#include <thread>
#include <vector>

using Jobs = std::vector<std::function<int()>>;

TEST(empty_input) {
    CHECK(run_all(Jobs{}).empty());
}

TEST(single_job) {
    Jobs jobs{[] { return 7; }};
    CHECK(run_all(jobs) == std::vector<int>({7}));
}

TEST(results_keep_input_order) {
    // The first job sleeps longest, so the jobs finish in reverse order.
    Jobs jobs;
    for (int i = 0; i < 5; ++i) {
        jobs.push_back([i] {
            std::this_thread::sleep_for(std::chrono::milliseconds(10 * (5 - i)));
            return i * i - 3;
        });
    }
    CHECK(run_all(jobs) == std::vector<int>({-3, -2, 1, 6, 13}));
}

TEST(jobs_run_concurrently) {
    // Each job waits (up to 3 s) until all four have started. Only jobs
    // that really run at the same time all return 4.
    std::atomic<int> started{0};
    Jobs jobs(4, [&started] {
        started.fetch_add(1);
        auto deadline = std::chrono::steady_clock::now() + std::chrono::seconds(3);
        while (started.load() < 4 && std::chrono::steady_clock::now() < deadline) {
            std::this_thread::yield();
        }
        return started.load();
    });
    CHECK(run_all(jobs) == std::vector<int>({4, 4, 4, 4}));
}

TEST(first_failure_by_index_is_rethrown) {
    using namespace std::chrono_literals;
    Jobs jobs{
        [] { return 1; },
        []() -> int {
            std::this_thread::sleep_for(30ms);  // fails last in time, first by index
            throw std::invalid_argument("job 1 failed");
        },
        [] { return 3; },
        []() -> int { throw std::runtime_error("job 3 failed"); },
    };
    std::string caught = "nothing thrown";
    try {
        run_all(jobs);
    } catch (const std::invalid_argument& e) {
        caught = e.what();
    } catch (const std::exception& e) {
        caught = std::string("wrong exception: ") + e.what();
    }
    CHECK_EQ(caught, std::string("job 1 failed"));
}

TEST(waits_for_every_job_before_rethrowing) {
    using namespace std::chrono_literals;
    static std::atomic<bool> finished[4];
    Jobs jobs;
    jobs.push_back([]() -> int { throw std::runtime_error("boom"); });
    for (int i = 1; i < 4; ++i) {
        jobs.push_back([i] {
            std::this_thread::sleep_for(50ms);
            finished[i].store(true);
            return i;
        });
    }
    bool threw = false;
    try {
        run_all(jobs);
    } catch (const std::runtime_error&) {
        threw = true;
    }
    CHECK(threw);
    CHECK(finished[1].load() && finished[2].load() && finished[3].load());
}

TEST(eight_jobs_with_negative_results) {
    Jobs jobs;
    std::vector<int> expected;
    for (int i = 0; i < 8; ++i) {
        jobs.push_back([i] {
            long long s = 0;
            for (int k = 1; k <= 100000 * (i + 1); ++k) s += k % 7;
            return static_cast<int>(s % 1000) - 500;
        });
        long long s = 0;
        for (int k = 1; k <= 100000 * (i + 1); ++k) s += k % 7;
        expected.push_back(static_cast<int>(s % 1000) - 500);
    }
    CHECK(run_all(jobs) == expected);
}
'''

[unit.step.gabarito]
solution = '''
#include <exception>
#include <functional>
#include <future>
#include <vector>

std::vector<int> run_all(const std::vector<std::function<int()>>& jobs) {
    std::vector<std::future<int>> futures;
    futures.reserve(jobs.size());
    for (const auto& job : jobs) {
        futures.push_back(std::async(std::launch::async, job));  // fan out
    }
    std::vector<int> results;
    results.reserve(jobs.size());
    std::exception_ptr first_error;
    for (auto& f : futures) {  // fan in, in input order
        try {
            results.push_back(f.get());
        } catch (...) {
            if (!first_error) first_error = std::current_exception();
        }
    }
    if (first_error) std::rethrow_exception(first_error);
    return results;
}
'''
time = "O(n + Σ cᵢ) work, about max cᵢ wall-clock"
space = "O(n)"
justification = '''
Let `n` be the number of jobs and `cᵢ` the running time of job `i`. Launching the tasks and
collecting their futures is **O(n)** bookkeeping, and every job runs exactly once, so the total
work is **O(n + Σ cᵢ)**. All jobs run at the same time, so with enough cores the wall-clock time
is about the slowest job, **max cᵢ**, instead of the sum a sequential loop would take. The
futures and the results take **O(n)** space.

The order of the results comes from the order of the futures, not from the order in which jobs
finish: `results[i]` is always `futures[i].get()`. Waiting for everyone before rethrowing matters
because a job still running after `run_all` returns could touch data the caller has already
destroyed. Here every future is `get()`-ed even after an error, so all jobs have finished before
`std::rethrow_exception` runs, and an `std::exception_ptr` keeps the original exception object,
type included. (The futures returned by `std::async` would also block in their destructors, but
being explicit makes the guarantee visible and works for promises too.) Launching with the
default policy could pick `deferred`, which runs each job inside its `get()`, one after another;
the concurrency test catches exactly that.
'''

[[unit]]
id = "cpp-u23-stacks-queues"
title = "Stacks & queues: std::stack, std::queue and std::deque"
level = "advanced"
difficulty = 29
intro = '''
Stacks and queues are the two simplest disciplines for holding pending work: a stack hands back
the newest item first, a queue the oldest. You will evaluate a postfix expression with
`std::stack`, schedule tasks round-robin with `std::queue`, build a fixed-capacity ring buffer by
hand, and finish with the sliding-window maximum, where a `std::deque` used as a monotonic queue
turns an O(n·k) scan into O(n).
'''
concepts = '''
## The idea

A **stack** is last in, first out (**LIFO**): you push and pop at one end, the top. Undo
histories, the call stack, bracket matching and depth-first search are stacks. A **queue** is
first in, first out (**FIFO**): you push at the back and pop at the front, like a line at a
counter. Schedulers, buffers between threads and breadth-first search are queues. A **deque**
(double-ended queue, pronounced "deck") allows pushing and popping at both ends.

All the interesting operations are **O(1)**. What you give up is the middle: there is no cheap way
to search or remove an element that isn't at an end, and that restriction is exactly what makes
these structures easy to reason about.

## How C++ does it

`std::stack<T>` (header `<stack>`) and `std::queue<T>` (header `<queue>`) are **container
adaptors**: thin wrappers that expose only the allowed operations of an underlying container,
`std::deque<T>` by default.

```cpp
std::stack<int> s;
s.push(1);
s.push(2);
int top = s.top();               // 2, the newest
s.pop();                         // pop() returns void

std::queue<std::string> q;
q.push("first");
q.push("second");
std::string next = q.front();    // "first", the oldest
q.pop();
```

`std::deque<T>` (header `<deque>`) offers `push_front`, `push_back`, `pop_front`, `pop_back`,
`front`, `back` and even `operator[]`, all **O(1)**. It stores its elements in fixed-size blocks,
so growing at either end never moves the existing elements. A `std::vector` makes a fine stack
(`push_back`, `back`, `pop_back`), but erasing its first element shifts all the others, O(n), so it
is a poor queue.

A queue is also easy to write by hand. A **ring buffer** keeps a fixed array, the index of the
front element and a count. A push writes at `(head + count) % capacity`, and the indices wrap
around the end of the array instead of shifting any element.

## Pitfalls

- **`top()`, `front()`, `back()` and `pop()` on an empty container are undefined behaviour**, not
  an exception. Check `empty()` first.
- **`pop()` returns nothing.** Read `top()` or `front()` first, then pop. The split exists so a copy
  that throws can never lose the element.
- **References die with their element.** `const auto& x = q.front(); q.pop();` leaves `x` dangling.
  Copy the value before popping.
- **Pushing at either end of a `std::deque` invalidates all its iterators**, although references to
  existing elements stay valid.
- **Unsigned arithmetic wraps.** With `std::size_t i` and `k`, `i - k + 1` is a huge number, not a
  negative one, when `i < k - 1`. Rearrange to `i + 1 >= k`.

## What you will practise

You will evaluate a postfix expression with a stack, run a round-robin scheduler with a queue,
write a ring buffer by hand, and solve the sliding-window maximum with a deque of indices that
stays in decreasing order of value.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u23-c1-lifo-fifo"
title = "LIFO, FIFO and the deque"
points = 5
difficulty = 29
intro = '''
Restricting where you may add and remove elements sounds like a limitation, but it is what makes
stacks and queues O(1) and easy to reason about. C++ provides both as adaptors over a
`std::deque`, which can grow at either end without moving anything.
'''
body = '''
## Two disciplines

| | add | remove | look |
|---|---|---|---|
| `std::stack` | `push` (top) | `pop` (top) | `top` |
| `std::queue` | `push` (back) | `pop` (front) | `front`, `back` |
| `std::deque` | `push_front`, `push_back` | `pop_front`, `pop_back` | `front`, `back`, `[i]` |

Every operation in the table is O(1). A stack reverses order: push 1, 2, 3 and you pop 3, 2, 1. A
queue preserves order: what goes in first comes out first.

## Why adaptors

`std::stack` and `std::queue` hold a container (a `std::deque` unless you choose another one,
such as `std::stack<int, std::vector<int>>`) and hide everything except the allowed operations.
The type documents your intent, and nobody can accidentally take an element from the middle.

## Look, then pop

```cpp
std::queue<int> q;
q.push(10);
q.push(20);
while (!q.empty()) {
    int x = q.front();   // copy first
    q.pop();             // then remove
    std::cout << x << '\n';
}
```

`pop` returns `void`, and calling `front` or `pop` on an empty queue is undefined behaviour, so the
`empty()` check is not optional.

## A priority queue

`<queue>` also has `std::priority_queue`, a binary heap where `top()` is always the largest
element. Push and pop cost O(log n), not O(1): it is a heap, not a queue in the FIFO sense, but it
uses the same adaptor-style interface.
'''

[[unit.step]]
kind = "drill"
