target = '''
#include <algorithm>
#include <iostream>
#include <numeric>
#include <ranges>
#include <string>
#include <vector>

struct Book {
    std::string title;
    int year;
};

int main() {
    std::vector<Book> books{{"Dune", 1965}, {"Neuromancer", 1984}, {"Foundation", 1951}, {"Hyperion", 1989}};
    std::ranges::sort(books, {}, &Book::year);
    for (const Book& b : books) {
        std::cout << b.year << " " << b.title << "\n";
    }
    auto recent = books
        | std::views::filter([](const Book& b) { return b.year >= 1980; })
        | std::views::transform(&Book::title);
    for (const std::string& t : recent) {
        std::cout << "recent: " << t << "\n";
