entry = "window_sums"
intro = '''
Summing every window of k consecutive elements naively costs O(n·k), because each window is
added up from scratch. The **sliding window** technique reuses the previous sum: when the
window moves one step, one element enters and one leaves, so each new sum costs O(1).
'''
instructions = '''
## Your turn

Implement `window_sums`:

```cpp
std::vector<long long> window_sums(const std::vector<int>& values, std::size_t k);
```

Return the sum of every window of `k` consecutive elements, in order: element `i` of the
result is `values[i] + values[i + 1] + ... + values[i + k - 1]`. A vector of n elements has
`n - k + 1` such windows.

Rules:

- If `k == 0` or `k > values.size()`, return an empty vector.
- Accumulate in `long long`: the values can be as large as `INT_MAX`, and adding three of them
  in `int` would overflow, which is undefined behaviour.
- Work in **one pass**, O(n) overall: compute the first window's sum, then slide the window by
  adding the element that enters and subtracting the element that leaves.
- Don't modify `values`. Calling `reserve` on the result is a good habit, because you know its
  final size.

Examples:

- `window_sums({1, 2, 3, 4, 5}, 2)` returns `{3, 5, 7, 9}`.
- `window_sums({4, -1, 6}, 3)` returns `{9}`.
- `window_sums({1, 2}, 3)` returns `{}`.

**Hint:** be careful with unsigned arithmetic. Check `k > values.size()` before you compute
`values.size() - k + 1`, or the subtraction wraps around to a huge number.

Hidden tests decide correctness.
'''
