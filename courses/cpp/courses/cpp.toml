#include <memory>
#include <stdexcept>
#include <string>
#include <unordered_map>
#include <utility>

// A loaded resource (provided: do not change it).
struct Texture {
    std::string name;
    explicit Texture(std::string n) : name(std::move(n)) {}
};

// Hands out shared Textures by name without keeping them alive.
class TextureCache {
public:
    // Returns the live Texture called `name` if someone still owns it;
    // otherwise creates a new one, remembers it, and returns it.
    std::shared_ptr<Texture> get(const std::string& name) {
        throw std::logic_error("not implemented");
    }

    // How many Textures get() has created so far.
    std::size_t loads() const {
        throw std::logic_error("not implemented");
    }

    // How many remembered Textures are still owned by someone.
    std::size_t alive() const {
        throw std::logic_error("not implemented");
    }

private:
    std::unordered_map<std::string, std::weak_ptr<Texture>> cache_;
    std::size_t loads_ = 0;
};
'''
tests = '''
#include <memory>
#include <string>
#include <vector>

TEST(same_name_shares_one_texture) {
    TextureCache cache;
    auto a = cache.get("grass");
    auto b = cache.get("grass");
    CHECK(a != nullptr);
    CHECK(a == b);
    CHECK_EQ(a->name, std::string("grass"));
    CHECK_EQ(cache.loads(), std::size_t{1});
    CHECK_EQ(a.use_count(), 2L);
}

TEST(different_names_are_different_textures) {
    TextureCache cache;
    auto grass = cache.get("grass");
    auto stone = cache.get("stone");
    auto blank = cache.get("");
    CHECK(grass != stone);
    CHECK(grass != blank);
    CHECK(stone != blank);
    CHECK_EQ(stone->name, std::string("stone"));
    CHECK_EQ(blank->name, std::string(""));
    CHECK_EQ(cache.loads(), std::size_t{3});
    CHECK_EQ(cache.alive(), std::size_t{3});
}

TEST(empty_cache) {
    TextureCache cache;
    CHECK_EQ(cache.loads(), std::size_t{0});
    CHECK_EQ(cache.alive(), std::size_t{0});
}

TEST(cache_does_not_keep_textures_alive) {
    TextureCache cache;
    std::weak_ptr<Texture> probe;
    {
        auto t = cache.get("water");
        probe = t;
        CHECK_EQ(cache.alive(), std::size_t{1});
        CHECK_EQ(t.use_count(), 1L);
    }
    CHECK(probe.expired());
    CHECK_EQ(cache.alive(), std::size_t{0});
    CHECK_EQ(cache.loads(), std::size_t{1});
}

TEST(reloads_after_the_last_owner_lets_go) {
    TextureCache cache;
    cache.get("lava");
    auto t = cache.get("lava");
    CHECK_EQ(cache.loads(), std::size_t{2});
    auto again = cache.get("lava");
    CHECK(t == again);
    CHECK_EQ(cache.loads(), std::size_t{2});
    CHECK_EQ(cache.alive(), std::size_t{1});
}

TEST(texture_outlives_the_cache) {
    std::shared_ptr<Texture> t;
    {
        TextureCache cache;
        t = cache.get("sky");
    }
    CHECK(t != nullptr);
    CHECK_EQ(t->name, std::string("sky"));
    CHECK_EQ(t.use_count(), 1L);
}

TEST(many_textures_half_kept) {
    TextureCache cache;
    std::vector<std::shared_ptr<Texture>> kept;
    for (int i = 0; i < 100000; ++i) {
        auto t = cache.get("tex" + std::to_string(i % 50000));
        if (i % 2 == 0) {
            kept.push_back(t);
        }
    }
    CHECK_EQ(cache.loads(), std::size_t{75000});
    CHECK_EQ(cache.alive(), std::size_t{25000});
    CHECK_EQ(kept.size(), std::size_t{50000});
    CHECK(kept[0] == kept[25000]);
    CHECK_EQ(kept[1]->name, std::string("tex2"));
    kept.clear();
    CHECK_EQ(cache.alive(), std::size_t{0});
}
'''

[unit.step.gabarito]
solution = '''
#include <cstddef>
#include <memory>
#include <string>
#include <unordered_map>
#include <utility>

// A loaded resource (provided: do not change it).
struct Texture {
    std::string name;
    explicit Texture(std::string n) : name(std::move(n)) {}
};

// Hands out shared Textures by name without keeping them alive.
class TextureCache {
public:
    std::shared_ptr<Texture> get(const std::string& name) {
        std::weak_ptr<Texture>& slot = cache_[name];
        if (std::shared_ptr<Texture> live = slot.lock()) {
            return live;
        }
        auto fresh = std::make_shared<Texture>(name);
        slot = fresh;
        ++loads_;
        return fresh;
    }

    std::size_t loads() const { return loads_; }

    std::size_t alive() const {
        std::size_t count = 0;
        for (const auto& [name, weak] : cache_) {
            if (!weak.expired()) {
                ++count;
            }
        }
        return count;
    }

private:
    std::unordered_map<std::string, std::weak_ptr<Texture>> cache_;
    std::size_t loads_ = 0;
};
'''
time = "get: O(L) average · alive: O(n)"
space = "O(n)"
justification = '''
Let *L* be the length of the requested name and *n* the number of distinct names seen so far.

**`get`** hashes the name once to find its slot in the `unordered_map`, which is **O(L)** on
average (hashing and comparing a string reads its characters). `lock()` is O(1): it checks the
control block's count and, if it is not zero, increments it. Creating a new texture with
`make_shared` is one allocation plus copying the name, again O(L). **`loads`** returns a stored
counter, O(1). **`alive`** has to inspect every remembered slot, so it is **O(n)**; keeping a
live counter instead would need a hook in each texture's destruction, which is more machinery
than this cache needs.

The cache stores one `weak_ptr` per distinct name, so its space is **O(n)** plus the names. Note
a subtlety of `make_shared`: the object and the control block share one allocation, so when a
texture dies its destructor runs immediately, but that block of memory is returned only when the
last `weak_ptr` to it is gone too. A long-lived cache with many dead entries can therefore hold
on to memory; a real cache would periodically erase expired slots. Storing `shared_ptr` in the
map would be simpler but wrong: `use_count()` would never drop to zero, and the cache would keep
every texture alive forever.
'''

[[unit]]
id = "cpp-u13-errors"
title = "Errors: exceptions, optional, variant"
level = "intermediate"
difficulty = 13
intro = '''
Programs fail: input is malformed, files are missing, numbers overflow. C++ gives you several
ways to say so, and choosing the right one is a design decision. You will throw and catch
exceptions, return "maybe a value" with `std::optional`, return "a value or an error" with
`std::variant`, and promise with `noexcept` that a function never throws.
'''
concepts = '''
## The idea

A function that cannot do its job has to tell its caller, and the caller has to be unable to
ignore the news by accident. Returning a magic value such as `-1` fails that test: nothing stops
the caller from using `-1` as if it were real data. Modern C++ offers three better tools, each
for a different kind of failure.

## How C++ does it

**Exceptions** are for errors the immediate caller usually cannot fix: a broken invariant, a
missing file, an allocation failure. `throw` creates an exception object, and the runtime
**unwinds the stack**, running the destructor of every local object on the way, until a matching
`catch` is found. RAII is what makes this safe: cleanup happens in destructors, so it happens on
the error path too.

```cpp
#include <stdexcept>

if (age < 0) {
    throw std::invalid_argument("age must not be negative");
}
// elsewhere
try { register_user(input); }
catch (const std::exception& e) { std::cerr << e.what() << "\n"; }
```

**`std::optional<T>`** is for "there may be no answer, and that is normal": a search that finds
nothing, a setting that was never set. It either holds a `T` or is empty (`std::nullopt`).

**`std::variant<A, B>`** holds exactly one of several types. Used as `variant<Value, Error>` it
returns either a result or a description of what went wrong, and the caller must look at which
one it got.

```cpp
std::optional<int> port = find_port(cfg);
int p = port.value_or(8080);

std::variant<int, ParseError> r = parse(text);
if (const int* n = std::get_if<int>(&r)) { use(*n); }
```

**`noexcept`** is a promise that a function never lets an exception escape. The compiler and the
standard library rely on it; `std::vector`, for example, only moves elements during growth if
their move constructor is `noexcept`. Break the promise and the program calls `std::terminate`.

## Pitfalls

- **Catch by `const` reference.** `catch (std::exception e)` copies the exception and slices off
  the derived part, so `what()` may lose information.
- **Order your `catch` blocks from specific to general.** A `catch (const std::exception&)`
  first swallows everything derived from it, and the later blocks never run.
- **Never let an exception escape a destructor.** Destructors are implicitly `noexcept`; a throw
  there terminates the program.
- **`*opt` on an empty optional is undefined behaviour.** When you are not sure, use the
  checked accessors: `opt.value()` throws `std::bad_optional_access`, and `std::get<T>` on the
  wrong alternative throws `std::bad_variant_access`.
- **Integer overflow is undefined behaviour.** When parsing numbers, detect overflow *before*
  it happens, or use a library routine that reports it, such as `std::from_chars`.

## What you will practise

You will catch the exceptions `std::stoi` throws, look up records with `std::optional`, and
visit a `std::variant` of shapes. The challenge is an integer parser that reports failures as a
`variant` in one function and as exceptions in another, with overflow detected safely.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u13-c1-choosing"
title = "Choosing how to report an error"
points = 5
difficulty = 13
intro = '''
Error handling is a contract between a function and its callers. The question is not only
"what went wrong" but "who can do something about it", and the answer decides whether the
failure travels as an exception, an empty optional, or an error alternative in a variant.
'''
body = '''
## Exceptions: far away and rare

```cpp
Config load_config(const std::string& path) {
    std::ifstream in(path);
    if (!in) throw std::runtime_error("cannot open " + path);
    // ...
}
```

Throw when the failure is unusual and the code that can react to it is several calls up the
stack. Every function in between stays clean: it neither checks nor forwards anything, and its
destructors still run during unwinding. The standard hierarchy gives you names for common
cases: `std::invalid_argument`, `std::out_of_range`, `std::runtime_error`, all derived from
`std::exception`.

## `std::optional`: absence is normal

```cpp
std::optional<User> find_user(int id);
if (auto u = find_user(42)) { greet(*u); }
```

Use it when "no result" is an ordinary outcome that the caller handles right away. It costs no
heap allocation: the value lives inside the optional.

## `std::variant`: the caller needs the reason

```cpp
enum class Error { NotFound, Forbidden };
std::variant<Document, Error> open(int id);
```

Use it when the caller must react differently to different failures and you want the compiler to
make the error impossible to overlook. `std::visit`, `std::get_if` and `std::holds_alternative`
inspect it. (C++23 adds `std::expected<T, E>` for exactly this shape.)

## `noexcept`

Mark functions that cannot fail, such as moves, swaps and destructors, `noexcept`. It documents
intent and lets the library pick faster algorithms. The rest of this unit practises each tool.
'''

