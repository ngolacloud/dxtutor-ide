        // of a long unique_ptr chain overflows the stack.
    }
    IntList(const IntList&) = delete;
    IntList& operator=(const IntList&) = delete;

    // TODO: take other's nodes in O(1) and leave other empty (make it noexcept).
    IntList(IntList&& other) { throw std::logic_error("not implemented"); }
    // TODO: free this list's nodes, then take other's (make it noexcept).
    IntList& operator=(IntList&& other) { throw std::logic_error("not implemented"); }

    void push_front(int value) { throw std::logic_error("not implemented"); }
    void push_back(int value) { throw std::logic_error("not implemented"); }
    // Removes and returns the first value; throws std::out_of_range if empty.
    int pop_front() { throw std::logic_error("not implemented"); }
    // Reverses in place by relinking the existing nodes.
    void reverse() { throw std::logic_error("not implemented"); }
    std::size_t size() const { throw std::logic_error("not implemented"); }
    bool empty() const { throw std::logic_error("not implemented"); }
    std::vector<int> to_vector() const { throw std::logic_error("not implemented"); }

private:
    struct Node {
        int value;
        std::unique_ptr<Node> next;
    };
    std::unique_ptr<Node> head_;
    Node* tail_ = nullptr;
    std::size_t size_ = 0;
};
'''
tests = '''
#include <chrono>
#include <stdexcept>
#include <utility>
#include <vector>

TEST(starts_empty) {
    IntList l;
    CHECK(l.empty());
    CHECK_EQ(l.size(), std::size_t{0});
    CHECK(l.to_vector().empty());
}

TEST(push_front_and_back_keep_order) {
    IntList l;
    l.push_back(2);
    l.push_back(3);
    l.push_front(1);
    l.push_front(0);
    CHECK(l.to_vector() == (std::vector<int>{0, 1, 2, 3}));
    CHECK_EQ(l.size(), std::size_t{4});
    CHECK(!l.empty());
}

TEST(pop_front_returns_values_and_resets_tail) {
    IntList l;
    l.push_back(10);
    l.push_back(-20);
    CHECK_EQ(l.pop_front(), 10);
    CHECK_EQ(l.pop_front(), -20);
    CHECK(l.empty());
    l.push_back(5);  // the tail must have been reset when the list emptied
    l.push_back(6);
    CHECK(l.to_vector() == (std::vector<int>{5, 6}));
    l.push_front(7);
    CHECK_EQ(l.pop_front(), 7);
    CHECK_EQ(l.size(), std::size_t{2});
}

TEST(pop_front_on_empty_throws_out_of_range) {
    IntList l;
    bool threw = false;
    try {
        l.pop_front();
    } catch (const std::out_of_range&) {
        threw = true;
    }
    CHECK(threw);
    l.push_front(1);
    CHECK_EQ(l.pop_front(), 1);
    threw = false;
    try {
        l.pop_front();
    } catch (const std::out_of_range&) {
        threw = true;
    }
    CHECK(threw);
}

TEST(reverse_small_lists) {
    IntList empty;
    empty.reverse();
    CHECK(empty.empty());
    empty.push_back(1);
    CHECK(empty.to_vector() == (std::vector<int>{1}));

    IntList one;
    one.push_back(5);
    one.reverse();
    CHECK(one.to_vector() == (std::vector<int>{5}));
    one.push_back(6);
    CHECK(one.to_vector() == (std::vector<int>{5, 6}));

    IntList dup;
    for (int v : {-1, 0, -1, 2, 2}) dup.push_back(v);
    dup.reverse();
    CHECK(dup.to_vector() == (std::vector<int>{2, 2, -1, 0, -1}));
    CHECK_EQ(dup.size(), std::size_t{5});
}

TEST(reverse_updates_the_tail) {
    IntList l;
    for (int v : {1, 2, 3}) l.push_back(v);
    l.reverse();
    l.push_back(0);
    l.push_front(4);
    CHECK(l.to_vector() == (std::vector<int>{4, 3, 2, 1, 0}));
    l.reverse();
    CHECK(l.to_vector() == (std::vector<int>{0, 1, 2, 3, 4}));
    l.push_back(9);
    CHECK(l.to_vector() == (std::vector<int>{0, 1, 2, 3, 4, 9}));
}

TEST(move_constructor_steals_the_nodes) {
    IntList a;
    for (int v : {1, 2, 3}) a.push_back(v);
    IntList b(std::move(a));
    CHECK(b.to_vector() == (std::vector<int>{1, 2, 3}));
    CHECK_EQ(b.size(), std::size_t{3});
    CHECK(a.empty());
    CHECK_EQ(a.size(), std::size_t{0});
    a.push_back(9);  // the moved-from list must still work
    CHECK(a.to_vector() == (std::vector<int>{9}));
    b.push_back(4);
    CHECK(b.to_vector() == (std::vector<int>{1, 2, 3, 4}));
}

TEST(move_assignment_replaces_the_contents) {
    IntList a, b;
    for (int v : {1, 2}) a.push_back(v);
    for (int v : {7, 8, 9}) b.push_back(v);
    b = std::move(a);
    CHECK(b.to_vector() == (std::vector<int>{1, 2}));
    CHECK_EQ(b.size(), std::size_t{2});
    CHECK(a.empty());
    a.push_back(3);
    CHECK(a.to_vector() == (std::vector<int>{3}));
    b.push_back(5);
    CHECK(b.to_vector() == (std::vector<int>{1, 2, 5}));
}

TEST(a_million_nodes_destroy_and_move_without_stack_overflow) {
    const int n = 1'000'000;
    auto start = std::chrono::steady_clock::now();
    {
        IntList l;
        for (int i = 0; i < n; ++i) l.push_back(i);
        CHECK_EQ(l.size(), static_cast<std::size_t>(n));
        l.reverse();
        CHECK_EQ(l.pop_front(), n - 1);
        l.push_back(-1);
        std::vector<int> v = l.to_vector();
        CHECK_EQ(v.size(), static_cast<std::size_t>(n));
        CHECK_EQ(v.front(), n - 2);
        CHECK_EQ(v.back(), -1);
    }  // the destructor frees about a million nodes here
    {
        IntList big;
        for (int i = 0; i < n; ++i) big.push_front(i);
        IntList small;
        small.push_back(1);
        big = std::move(small);  // the old million nodes are freed here
        CHECK(big.to_vector() == (std::vector<int>{1}));
    }
    auto elapsed = std::chrono::duration<double>(std::chrono::steady_clock::now() - start);
    CHECK(elapsed.count() < 2.0);
}
'''

[unit.step.gabarito]
solution = '''
#include <cstddef>
#include <memory>
#include <stdexcept>
#include <utility>
#include <vector>

class IntList {
public:
    IntList() = default;
    ~IntList() { clear(); }
    IntList(const IntList&) = delete;
    IntList& operator=(const IntList&) = delete;

    IntList(IntList&& other) noexcept
        : head_(std::move(other.head_)),
          tail_(std::exchange(other.tail_, nullptr)),
          size_(std::exchange(other.size_, 0)) {}

    IntList& operator=(IntList&& other) noexcept {
        if (this != &other) {
            clear();
            head_ = std::move(other.head_);
            tail_ = std::exchange(other.tail_, nullptr);
            size_ = std::exchange(other.size_, 0);
        }
        return *this;
    }

    void push_front(int value) {
        head_ = std::make_unique<Node>(value, std::move(head_));
        if (!tail_) tail_ = head_.get();
        ++size_;
    }

    void push_back(int value) {
        auto node = std::make_unique<Node>(value, nullptr);
        Node* raw = node.get();
        if (tail_) {
            tail_->next = std::move(node);
        } else {
            head_ = std::move(node);
        }
        tail_ = raw;
        ++size_;
    }

    int pop_front() {
        if (!head_) throw std::out_of_range("pop_front on an empty IntList");
        int value = head_->value;
        head_ = std::move(head_->next);
        if (!head_) tail_ = nullptr;
        --size_;
        return value;
    }

    void reverse() {
        tail_ = head_.get();  // the old head becomes the last node
        std::unique_ptr<Node> reversed;
        while (head_) {
            std::unique_ptr<Node> rest = std::move(head_->next);
            head_->next = std::move(reversed);
            reversed = std::move(head_);
            head_ = std::move(rest);
        }
        head_ = std::move(reversed);
    }

    std::size_t size() const { return size_; }
    bool empty() const { return size_ == 0; }

    std::vector<int> to_vector() const {
        std::vector<int> out;
        out.reserve(size_);
        for (const Node* n = head_.get(); n; n = n->next.get()) out.push_back(n->value);
        return out;
    }

private:
    struct Node {
        int value;
        std::unique_ptr<Node> next;
    };

    // Frees one node per iteration: constant stack depth for any length.
    void clear() noexcept {
        while (head_) head_ = std::move(head_->next);
        tail_ = nullptr;
        size_ = 0;
    }

    std::unique_ptr<Node> head_;
    Node* tail_ = nullptr;
    std::size_t size_ = 0;
};
'''
time = "O(1) push/pop/move; O(n) reverse, to_vector and destruction"
space = "O(1) extra for every operation (O(n) for the vector returned by to_vector)"
justification = '''
`push_front`, `push_back` and `pop_front` each create or free one node and move a constant
number of pointers, so they are **O(1)**; `push_back` stays O(1) only because `tail_`
observes the last node and is reset to `nullptr` whenever the list empties, which is what
keeps it from dangling. The move operations swap three members, **O(1)**, and use
`std::exchange` to leave the source empty and usable.

`reverse` visits each node once with three owning pointers (`reversed`, `head_`, `rest`), so
it is **O(n)** time and **O(1)** extra space; no node is allocated or copied. Its invariant:
before each iteration, `reversed` owns the already reversed prefix and `head_` owns the
untouched suffix. Taking `rest` out first is essential, because overwriting `head_->next`
would otherwise free the whole suffix.

The destructor is O(n) time but **O(1) stack**: `head_ = std::move(head_->next)` detaches the
successor before deleting the old head, whose own `next` is then empty, so no destructor
recurses. The default destruction would use one stack frame per node and crash on a
million-node list; a recursive `reverse` would fail the same way.
'''

[[unit]]
id = "cpp-u25-hash-maps-sets"
title = "Hash tables, frequencies and sets"
level = "advanced"
difficulty = 31
intro = '''
`std::unordered_map` and `std::unordered_set` answer "is this key here?" in O(1) on average,
whatever their size. You will open up the machinery behind them: hash a key into a bucket
index, resolve collisions by chaining, count frequencies and combine sets, then build a
generic, resizing hash map from scratch that holds 100,000 keys.
'''
concepts = '''
## The idea

A **hash table** stores entries in an array of **buckets**. A **hash function** turns a key
into a large integer, and `hash % bucket_count` picks the bucket. To find a key you hash it,
jump straight to its bucket and look only there. If the buckets stay short, lookup, insert
and erase cost **O(1) on average**, independent of how many entries the table holds.

Two different keys can land in the same bucket: a **collision**. With **separate chaining**,
each bucket is a small list of entries, and a lookup compares the key with each entry of
that one list using `==`. The **load factor** is `size / bucket_count`. When it grows past a
threshold, the table allocates twice as many buckets and moves every entry to its new bucket:
a **rehash**. A single rehash is O(n), but because the table doubles, the total work over n
inserts is O(n), so insertion is **amortised O(1)**.

## How C++ does it

`std::unordered_map<K, V>` and `std::unordered_set<K>` are chained hash tables. They use
`std::hash<K>` to hash and `operator==` to compare, and they expose the machinery:

```cpp
std::unordered_map<std::string, int> ages{{"ada", 36}};
ages["alan"] = 41;                       // insert or update
std::cout << ages.bucket_count() << ' ' << ages.load_factor() << '\n';
if (auto it = ages.find("ada"); it != ages.end()) std::cout << it->second << '\n';
std::cout << ages.contains("bob") << '\n';  // C++20: 0
```

`std::map` and `std::set` are the *ordered* alternatives: balanced trees with O(log n)
operations and sorted iteration. Pick the unordered ones for raw lookup speed, the ordered
ones when you need keys in order. Counting is the classic use: `++freq[word]` creates a zero
for an unseen key and increments it.

## What is special or tricky

- **`operator[]` inserts.** `if (m[key] == 0)` silently adds `key` to the map. Use `find`,
  `contains` or `count` to ask without changing anything; on a `const` map, `[]` does not
  even compile.
- **Rehashing invalidates iterators.** An insert that triggers a rehash makes every iterator
  into the table invalid; using one afterwards is undefined behaviour. References to the
  elements stay valid in `std::unordered_map`, but not in a hand-written table that stores
  entries in `std::vector`s.
- **Hash and equality must agree.** Keys that compare equal must hash equally, or the table
  looks in the wrong bucket. Your own key types need a `std::hash` specialisation or a hasher
  argument, otherwise you get a long compiler error about `std::hash<Key>`.
- **Iteration order is unspecified** and changes after a rehash. Sort the entries before you
  print them if the output must be stable.
- **A bad hash makes everything O(n).** If every key lands in one bucket, the table degrades
  into a list.

## What you will practise

You will hash keys into buckets by hand, write a tiny chained map, count words and combine
sets. The challenge is a generic `HashMap` that grows by doubling, tested with 100,000 keys.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u25-c1-buckets"
title = "Buckets, hashing and collisions"
points = 5
difficulty = 31
intro = '''
A hash table trades memory for speed: it spreads entries over many buckets so that each lookup
inspects only a handful of them. The hash function chooses the bucket, and the load factor
decides when to grow.
'''
body = '''
## From key to bucket

```cpp
std::size_t h = std::hash<std::string>{}(key);   // a large number
std::size_t b = h % buckets.size();               // a bucket index
```

The same key always produces the same hash, so it always goes to the same bucket. Different
keys usually produce different hashes, but with a limited number of buckets some of them
inevitably share one.

## Collisions and chaining

With **separate chaining**, every bucket holds a small vector of `(key, value)` pairs:

```cpp
std::vector<std::vector<std::pair<std::string, int>>> buckets(8);
```

To find a key, scan only its bucket and compare keys with `==`. The hash narrows the search,
and equality decides.

## Load factor and resizing

The **load factor** is `size / bucket_count`. If it stays below a constant such as 0.75, the
average bucket holds less than one entry and each operation is O(1) on average. When an
insert pushes it over the threshold, allocate **twice** as many buckets and re-insert every
entry, because `h % bucket_count` changes for almost every key when the count changes.

That rehash costs O(n), but doubling makes it rare: after a rehash to 2n buckets, about n
more inserts must happen before the next one. Spread over the inserts, each pays O(1) extra.
This is **amortised O(1)**, the same argument that explains why `std::vector::push_back` is
fast. A table that never resized would end up with long chains and O(n) lookups.
'''

