                     " (4, 3, 'Quotes'), (5, 42, 'Orphan');",
                     nullptr, nullptr, nullptr);
    }
    ~BlogDb() { sqlite3_close_v2(db); }
    BlogDb(const BlogDb&) = delete;
    BlogDb& operator=(const BlogDb&) = delete;
    static int on_stmt(unsigned, void* ctx, void*, void*) {
        ++static_cast<BlogDb*>(ctx)->statements;
        return 0;
    }
    AuthorMap call(const std::vector<int>& ids) {
        statements = 0;
        sqlite3_trace_v2(db, SQLITE_TRACE_STMT, on_stmt, this);
        struct Untrace {
            sqlite3* db;
            ~Untrace() { sqlite3_trace_v2(db, 0, nullptr, nullptr); }
        } untrace{db};
        return post_authors(db, ids);
    }
    bool no_open_statements() const { return sqlite3_next_stmt(db, nullptr) == nullptr; }
};

TEST(three_posts_one_statement) {
    BlogDb t;
    CHECK_EQ(t.call({1, 2, 3}), (AuthorMap{{1, "Ana"}, {2, "Bo"}, {3, "Ana"}}));
    CHECK_EQ(t.statements, 1);
    CHECK(t.no_open_statements());
}

TEST(empty_list_runs_nothing) {
    BlogDb t;
    CHECK(t.call({}).empty());
    CHECK_EQ(t.statements, 0);
}

TEST(unknown_ids_are_left_out) {
    BlogDb t;
    CHECK_EQ(t.call({2, 999}), (AuthorMap{{2, "Bo"}}));
    CHECK_EQ(t.statements, 1);
}

TEST(orphan_post_is_left_out) {
    BlogDb t;
    CHECK_EQ(t.call({5, 4}), (AuthorMap{{4, "O'Hara"}}));
    CHECK_EQ(t.statements, 1);
}

TEST(duplicates_appear_once) {
    BlogDb t;
    CHECK_EQ(t.call({3, 3, 1}), (AuthorMap{{1, "Ana"}, {3, "Ana"}}));
    CHECK_EQ(t.statements, 1);
}

TEST(single_id) {
    BlogDb t;
    CHECK_EQ(t.call({4}), (AuthorMap{{4, "O'Hara"}}));
    CHECK_EQ(t.statements, 1);
}

TEST(negative_and_zero_ids_match_nothing) {
    BlogDb t;
    CHECK(t.call({0, -1, -5}).empty());
    CHECK_EQ(t.statements, 1);
}

TEST(many_posts_still_one_statement) {
    BlogDb t;
    sqlite3_exec(t.db, "BEGIN", nullptr, nullptr, nullptr);
    sqlite3_stmt* st = nullptr;
    sqlite3_prepare_v2(t.db, "INSERT INTO posts VALUES (?, ?, 'post')", -1, &st, nullptr);
    std::vector<int> ids;
    AuthorMap expected;
    const char* names[] = {"Ana", "Bo", "O'Hara"};
    for (int i = 0; i < 2000; ++i) {
        int pid = 100 + i, aid = 1 + i % 3;
        sqlite3_bind_int(st, 1, pid);
        sqlite3_bind_int(st, 2, aid);
        sqlite3_step(st);
        sqlite3_reset(st);
        ids.push_back(pid);
        expected[pid] = names[aid - 1];
    }
    sqlite3_finalize(st);
    sqlite3_exec(t.db, "COMMIT", nullptr, nullptr, nullptr);
    CHECK(t.call(ids) == expected);
    CHECK_EQ(t.statements, 1);
    CHECK(t.no_open_statements());
}
'''

[unit.step.gabarito]
solution = '''
#include <sqlite3.h>
#include <map>
#include <memory>
#include <stdexcept>
#include <string>
#include <vector>

struct StmtFinalize {
    void operator()(sqlite3_stmt* st) const { sqlite3_finalize(st); }
};
using Stmt = std::unique_ptr<sqlite3_stmt, StmtFinalize>;

std::map<int, std::string> post_authors(sqlite3* db, const std::vector<int>& post_ids) {
    std::map<int, std::string> authors;
    if (post_ids.empty()) return authors;

    std::string sql =
        "SELECT p.id, a.name FROM posts AS p"
        " JOIN authors AS a ON a.id = p.author_id"
        " WHERE p.id IN (?";
    for (std::size_t i = 1; i < post_ids.size(); ++i) sql += ", ?";
    sql += ")";

    sqlite3_stmt* raw = nullptr;
    if (sqlite3_prepare_v2(db, sql.c_str(), -1, &raw, nullptr) != SQLITE_OK) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    Stmt st(raw);
    for (std::size_t i = 0; i < post_ids.size(); ++i) {
        sqlite3_bind_int(st.get(), static_cast<int>(i + 1), post_ids[i]);
    }

    int rc;
    while ((rc = sqlite3_step(st.get())) == SQLITE_ROW) {
        const unsigned char* name = sqlite3_column_text(st.get(), 1);
        authors.emplace(sqlite3_column_int(st.get(), 0),
                        name ? reinterpret_cast<const char*>(name) : "");
    }
    if (rc != SQLITE_DONE) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    return authors;
}
'''
time = "O(k log n)"
space = "O(k)"
justification = '''
For **k** requested ids, SQLite looks each one up in the `posts` primary-key B-tree and then
finds the author through the `authors` primary key: two **O(log n)** seeks per id, so
**O(k log n)** in total. Building the placeholder string is **O(k)**, and inserting the at most
k results into the `std::map` is **O(k log k)**, which is no larger than the lookups. The SQL
text and the map both hold O(k) items: **O(k)** space.

The point is the number of executions: exactly **one**, whatever k is. The N+1 version does the
same index work but pays the fixed cost of a statement k + 1 times. The inner `JOIN` drops
orphan posts for free, and `std::map::emplace` ignores a key that is already present, so
duplicate ids collapse on their own.
'''

# ---------------------------------------------------------------------------
# 20 · Pagination: OFFSET vs keyset
# ---------------------------------------------------------------------------

[[unit]]
id = "cpp-udb5-pagination"
title = "Pagination: OFFSET vs keyset"
level = "intermediate"
difficulty = 20
intro = '''
Long lists are shown a page at a time. `LIMIT`/`OFFSET` is easy, but it gets slower as the
offset grows and its pages shift when rows change. Keyset pagination remembers where the last
page ended and continues from there with `WHERE key > ?`. You will build both, and then a
keyset pager that handles ties in the sort column.
'''
concepts = '''
## The idea

Nobody reads ten thousand rows at once, so applications show a **page** of rows and a way to get the next one. The obvious way to ask for page *p* is to skip the rows before it: `LIMIT 20 OFFSET 40` returns rows 41 to 60. It has two problems.

- **It gets slower the deeper you go.** The database cannot jump to row 41; it must produce and throw away the first 40. Page 500 reads 10 000 rows to show 20.
- **It is unstable.** If a row before the current page is deleted, everything shifts up by one and the next page silently skips a row; an insert makes a row appear twice.

**Keyset pagination** (also called cursor or seek pagination) remembers where the previous page *ended*, the sort key of its last row, and asks for what comes after it: `WHERE id > ? ORDER BY id LIMIT 20`. With an index on the sort key, the database seeks straight to that position, so every page costs about the same, however deep. Rows inserted or deleted before the cursor do not shift anything. The trade-off: you can go to the next page, not jump to page 37.

The sort key must be **unique**. If you sort by a timestamp that several rows share, `WHERE ts > ?` skips the rest of a tie and `>=` repeats it. Add a unique tie-breaker, usually the primary key, to both the `ORDER BY` and the cursor.

## How C++ does it

A page is a `std::vector` of rows, and the cursor is a `std::optional`: empty for the first page, holding the last key afterwards. The page size is bound to `LIMIT ?` like any other value.

```cpp
std::vector<int> ids_after(sqlite3* db, std::optional<int> after, int size);
// first page:  ids_after(db, std::nullopt, 20)
// next page:   ids_after(db, page.back(), 20)
```

SQLite compares **row values** directly, so a two-column cursor reads naturally: `(ts, id) > (?, ?)` is true when `ts` is greater, or when `ts` is equal and `id` is greater. That is exactly the order `ORDER BY ts, id` produces.

## What is special or tricky

- **A negative `LIMIT` means "no limit" in SQLite.** Binding a size of -1 returns the whole table. Validate the size before it reaches SQL.
- **Without `ORDER BY`, pages are meaningless.** SQL promises no order at all, so the same query may page differently each time.
- **`page.back()` on an empty vector is undefined behaviour.** Stop walking when a page comes back empty, before you read its last element.
- **`*after` on an empty `std::optional` is undefined behaviour too.** Test it with `if (after)` first.
- **Bind both halves of a composite cursor.** It is still user input: a cursor often travels through a URL.
- `OFFSET` stays fine for small tables and for "jump to page *n*" interfaces; keyset wins for feeds, exports and infinite scrolling.

## What you will practise

You will watch an `OFFSET` page skip a row after a delete, page by key instead, and walk a whole table page by page with an optional cursor. The challenge is a keyset pager over a table whose sort column has ties.
'''

[[unit.step]]
kind = "concept"
id = "cpp-udb5-c1-paging"
title = "OFFSET versus keyset"
points = 5
difficulty = 20
intro = '''
`OFFSET` describes a page by *position*, keyset by *content*. Positions shift whenever rows
before them change and must be counted from the start, while a key stays put and can be found
with an index seek in O(log n).
'''
body = '''
## Two ways to ask for "the next page"

```sql
-- OFFSET: skip the rows of the earlier pages
SELECT id, title FROM posts ORDER BY id LIMIT 20 OFFSET 40;

-- Keyset: continue after the last id the reader saw
SELECT id, title FROM posts WHERE id > ? ORDER BY id LIMIT 20;
```

- **`OFFSET 40`** makes the database walk past 40 rows before returning anything, so the
  cost grows with the page number. If a row before the page disappears, the next page starts
  one row late and silently skips one.
- **`WHERE id > ?`** jumps straight to the right place through the index on `id`. The cost
  is the same for page 1 and page 1000, and changes before the cursor do not shift it.

## Cursors in C++

```cpp
std::optional<int> after;                    // empty: start at the beginning
while (true) {
    std::vector<int> page = ids_after(db, after, 20);
    if (page.empty()) break;                 // check BEFORE calling back()
    show(page);
    after = page.back();                     // the cursor for the next page
}
```

When the sort column is not unique, extend both the order and the cursor with the primary
key: `ORDER BY ts, id` together with `WHERE (ts, id) > (?, ?)`. And always validate the page
size first: in SQLite, `LIMIT -1` means "every row".
'''

