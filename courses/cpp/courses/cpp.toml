intro = '''
A `std::variant` is a **type-safe tagged union**: it stores exactly one of its alternatives and
remembers which one in `index()`. `std::visit` calls the overload of a visitor that matches the
current alternative, and `noexcept(expr)` asks the compiler, at compile time, whether an
expression is declared never to throw.
'''
prompt = '''
Store circles and rectangles in a `std::variant`, compute areas with a visitor struct whose
call operators are `noexcept`, and inspect a variant with `holds_alternative`, `get_if` and `get`.

**Why:** a variant replaces a class hierarchy when the set of alternatives is closed, and its
accessors show the same "checked or unchecked" choice as `optional`.
'''
target = '''
#include <iostream>
#include <variant>
#include <vector>

struct Circle { double r; };
struct Rect { double w, h; };
using Shape = std::variant<Circle, Rect>;

struct Area {
    double operator()(const Circle& c) const noexcept { return 3.14159 * c.r * c.r; }
    double operator()(const Rect& r) const noexcept { return r.w * r.h; }
};

int main() {
    std::vector<Shape> shapes{Circle{1.0}, Rect{2.0, 3.0}};
    for (const Shape& s : shapes) {
        std::cout << "index " << s.index() << " area " << std::visit(Area{}, s) << "\n";
    }
    Shape s = Rect{4.0, 0.5};
    std::cout << std::boolalpha << std::holds_alternative<Rect>(s) << "\n";
    if (const Circle* c = std::get_if<Circle>(&s)) {
        std::cout << "circle of radius " << c->r << "\n";
    } else {
        std::cout << "not a circle\n";
    }
    try {
        std::cout << std::get<Circle>(s).r << "\n";
    } catch (const std::bad_variant_access&) {
        std::cout << "get<Circle> on a Rect throws\n";
    }
    std::cout << "Area is noexcept: " << noexcept(Area{}(Circle{1.0})) << "\n";
}
'''
