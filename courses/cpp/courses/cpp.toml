#include <iostream>

int main() {
    std::cout << "Sum: " << 7 + 5 << '\n';
    std::cout << "Product: " << 7 * 5 << '\n';
    std::cout << "Division: " << 7 / 2 << '\n';
    std::cout << "Exact division: " << 7.0 / 2 << '\n';
    std::cout << "one " << "two " << "three" << '\n';
    std::cout << "Done." << std::endl;
    return 0;
}
'''
