target = '''
#include <iostream>
#include <memory>

struct Node {
    int value;
    std::unique_ptr<Node> next;
};

void remove_all(std::unique_ptr<Node>& head, int target) {
    std::unique_ptr<Node>* link = &head;
    while (*link) {
        if ((*link)->value == target) {
            *link = std::move((*link)->next);
        } else {
            link = &(*link)->next;
        }
    }
}

int main() {
    std::unique_ptr<Node> head;
    for (int v : {7, 2, 7, 1, 7}) {
        head = std::make_unique<Node>(v, std::move(head));
    }
    remove_all(head, 7);
    for (const Node* n = head.get(); n; n = n->next.get()) {
        std::cout << n->value << ' ';
    }
    std::cout << '\n';
}
