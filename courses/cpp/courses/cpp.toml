intro = '''
In WAL mode a read transaction sees the database as it was when the transaction began. A writer
can commit in the meantime without waiting, which the rollback journal does not allow, and
the reader sees the new row only when it starts a fresh transaction.
'''
prompt = '''
Open two connections to one WAL database. Let the reader begin a transaction and count the
rows, let the writer insert and commit, count again inside the reader's transaction, then end
it and count once more.

**Why:** "readers don't block writers, and each reader sees a consistent snapshot" is the
whole point of WAL; here you see both halves.
'''
target = '''
#include <sqlite3.h>
#include <filesystem>
#include <iostream>
#include <memory>
#include <string>

namespace fs = std::filesystem;
struct DbClose { void operator()(sqlite3* db) const { sqlite3_close(db); } };

std::unique_ptr<sqlite3, DbClose> open_db(const std::string& path) {
    sqlite3* raw = nullptr;
    sqlite3_open(path.c_str(), &raw);
    return std::unique_ptr<sqlite3, DbClose>(raw);
}

int count(sqlite3* db) {
    sqlite3_stmt* raw = nullptr;
    sqlite3_prepare_v2(db, "SELECT COUNT(*) FROM notes", -1, &raw, nullptr);
    std::unique_ptr<sqlite3_stmt, decltype(&sqlite3_finalize)> st(raw, &sqlite3_finalize);
    return sqlite3_step(st.get()) == SQLITE_ROW ? sqlite3_column_int(st.get(), 0) : -1;
}

int main() {
    std::string path = (fs::temp_directory_path() / "dxt_udb3_snapshot.db").string();
    for (const char* s : {"", "-wal", "-shm"}) fs::remove(path + s);
    {
        auto writer = open_db(path);
        sqlite3_exec(writer.get(), "PRAGMA journal_mode=WAL; CREATE TABLE notes (body TEXT)",
                     nullptr, nullptr, nullptr);
        auto reader = open_db(path);
        sqlite3_exec(reader.get(), "BEGIN", nullptr, nullptr, nullptr);
        std::cout << "reader sees " << count(reader.get()) << '\n';
        int rc = sqlite3_exec(writer.get(), "INSERT INTO notes VALUES ('hi')", nullptr, nullptr, nullptr);
        std::cout << "writer commit: " << (rc == SQLITE_OK ? "ok" : "busy") << '\n';
        std::cout << "reader sees " << count(reader.get()) << '\n';
        sqlite3_exec(reader.get(), "COMMIT", nullptr, nullptr, nullptr);
        std::cout << "reader sees " << count(reader.get()) << '\n';
    }
    for (const char* s : {"", "-wal", "-shm"}) fs::remove(path + s);
}
'''
