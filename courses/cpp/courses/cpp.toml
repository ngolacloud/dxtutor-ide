// transfer() moves money atomically between two accounts and must never
// lose money, overdraw or deadlock, however many threads call it at once.
class Bank {
public:
    Bank(std::size_t accounts, long long initial_balance) {
        throw std::logic_error("not implemented");
    }

    std::size_t size() const { throw std::logic_error("not implemented"); }

    // Throws std::out_of_range for an id outside [0, size()).
    long long balance(std::size_t id) const { throw std::logic_error("not implemented"); }

    // Throws std::out_of_range for a bad id and std::invalid_argument when
    // amount <= 0. Returns false, changing nothing, if `from` holds less
    // than amount. from == to is allowed and changes nothing.
    bool transfer(std::size_t from, std::size_t to, long long amount) {
        throw std::logic_error("not implemented");
    }

    // The sum of all balances, as a consistent snapshot.
    long long total() const { throw std::logic_error("not implemented"); }

private:
    // Add the data members you need, for example one std::mutex per account.
};
'''
