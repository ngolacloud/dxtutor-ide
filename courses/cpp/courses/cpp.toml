intro = '''
Reference counting has one blind spot: a **cycle**. If a team owns its lead and the lead owns
the team, each keeps the other's count above zero forever, and both leak. Making one direction a
non-owning `std::weak_ptr` breaks the cycle while still letting you reach the other object.
'''
prompt = '''
Model a `Team` that owns its lead `Employee` through a `shared_ptr`, while the employee refers
back to the team through a `weak_ptr`. Use `lock()` to follow the back-reference, then release
the team and confirm that both objects are destroyed.

**Why:** "owner points down with `shared_ptr`, child points up with `weak_ptr`" is the standard
shape for trees, graphs and observers built on shared ownership.
'''
target = '''
#include <iostream>
#include <memory>
#include <string>

struct Employee;

struct Team {
    std::string name;
    std::shared_ptr<Employee> lead;
    ~Team() { std::cout << "team " << name << " gone\n"; }
};

struct Employee {
    std::string name;
    std::weak_ptr<Team> team;
    ~Employee() { std::cout << "employee " << name << " gone\n"; }
};

int main() {
    auto team = std::make_shared<Team>();
    team->name = "core";
    team->lead = std::make_shared<Employee>();
    team->lead->name = "Ada";
    team->lead->team = team;
    std::weak_ptr<Employee> watcher = team->lead;
    if (auto t = team->lead->team.lock()) {
        std::cout << team->lead->name << " leads " << t->name << "\n";
    }
    std::cout << "team owners: " << team.use_count() << "\n";
    team.reset();
    std::cout << "lead expired: " << std::boolalpha << watcher.expired() << "\n";
}
