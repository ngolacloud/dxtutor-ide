intro = '''
Some characters cannot be typed directly inside a string literal: a double quote would end
the string, and a tab is invisible. C++ uses **escape sequences** that start with a
backslash (`\t`, `\"`, `\\`) to stand for them. A **raw string literal** `R"(...)"` switches
escapes off entirely, which is handy for text full of backslashes.
'''
prompt = '''
Print a small table with tabs, a quotation, a backslash and a raw string, and use both kinds
of comment.

**Why:** escape sequences are the first place where what you type and what gets printed
differ. Knowing them well saves you from strings that do not compile or print the wrong
thing.
'''
target = '''
#include <iostream>

/* A block comment can span
   several lines. */
int main() {
    std::cout << "Name\tLanguage\n";
    std::cout << "Ada\tC++\n";
    std::cout << "She said \"hello\".\n";
    std::cout << "A backslash: \\\n";
    std::cout << R"(Raw: \n stays as two characters)" << '\n';
    return 0;  // 0 means success
}
'''
