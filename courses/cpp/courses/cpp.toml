    CHECK_EQ(file_extension("main.cpp"), "cpp");
    CHECK_EQ(file_extension("photo.JPG"), "JPG");
    CHECK_EQ(file_extension("a.b"), "b");
}

TEST(takes_the_last_dot) {
    CHECK_EQ(file_extension("archive.tar.gz"), "gz");
    CHECK_EQ(file_extension("v1.2.3.txt"), "txt");
}

TEST(no_extension) {
    CHECK_EQ(file_extension("Makefile"), "");
    CHECK_EQ(file_extension(""), "");
    CHECK_EQ(file_extension("notes."), "");
    CHECK_EQ(file_extension(".."), "");
}

TEST(hidden_files) {
    CHECK_EQ(file_extension(".bashrc"), "");
    CHECK_EQ(file_extension("/home/ada/.bashrc"), "");
    CHECK_EQ(file_extension(".config.json"), "json");
}

TEST(paths_with_folders) {
    CHECK_EQ(file_extension("docs/report.pdf"), "pdf");
    CHECK_EQ(file_extension("build.v2/Makefile"), "");
    CHECK_EQ(file_extension("a.b/c.d"), "d");
    CHECK_EQ(file_extension("src/"), "");
    CHECK_EQ(file_extension("/usr/lib/libz.so"), "so");
}

TEST(accepts_a_std_string) {
    std::string path = "song.mp3";
    CHECK_EQ(file_extension(path), "mp3");
    CHECK_EQ(path, "song.mp3");
}

TEST(long_name) {
    std::string path(100000, 'a');
    path += ".md";
    CHECK_EQ(file_extension(path), "md");
}

TEST(returns_an_owning_string) {
    CHECK((std::is_same_v<decltype(file_extension("x.y")), std::string>));
}
'''
[unit.step.gabarito]
solution = '''
#include <string>
#include <string_view>

// Return the extension of the file named by `path` (the text after the last '.'
// of the file name, which follows the last '/'), or "" if it has none.
std::string file_extension(std::string_view path) {
    std::size_t slash = path.rfind('/');
    std::string_view name = path;
    if (slash != std::string_view::npos) {
        name = path.substr(slash + 1);
    }
    std::size_t dot = name.rfind('.');
    if (dot == std::string_view::npos || dot == 0 || dot + 1 == name.size()) {
        return "";
    }
    return std::string(name.substr(dot + 1));
}
'''
time = "O(n)"
space = "O(k)"
justification = '''
Each `rfind` scans the text from the right at most once, so together they touch each of the
`n` characters of `path` at most twice: the time is **O(n)**. Taking `substr` of a
`std::string_view` is O(1), because it only adjusts a pointer and a length; no characters
are copied while searching.

The only allocation is the returned `std::string`, which copies the `k` characters of the
extension, so the extra space is **O(k)** (at most O(n)). Returning a `std::string` rather
than a view is deliberate: a view into `path` would dangle if the caller passed a temporary
string, while an owning string is always safe to keep. The order of the checks matters too:
`dot == 0` rejects hidden files and `dot + 1 == name.size()` rejects a trailing dot, both
before `substr` runs.
'''

[[unit]]
id = "cpp-u04-control-flow"
title = "if / else, switch, the conditional operator"
level = "basic"
difficulty = 4
intro = '''
Until now every program ran the same statements every time. This unit teaches programs to
**choose**: `if` and `else` pick a path from a condition, `switch` jumps straight to one of
many cases, and the conditional operator `?:` picks between two values inside an expression.
'''
concepts = '''
## The idea

A **condition** is an expression whose value is `true` or `false`. **Control flow** is how a
program uses conditions to decide which statements run. Without it, a program is a fixed
recipe; with it, the same program can react differently to different data.

## How C++ does it

```cpp
if (temperature < 0) {
    std::cout << "freezing\n";
} else if (temperature < 20) {
    std::cout << "cool\n";
} else {
    std::cout << "warm\n";
}
```

The conditions are tested from top to bottom and only the first one that is true runs its
block. Conditions are built from comparisons (`==`, `!=`, `<`, `<=`, `>`, `>=`) and logical
operators: `&&` (and), `||` (or), `!` (not). `&&` and `||` **short-circuit**: if the left
side already decides the answer, the right side is never evaluated, which makes
`d != 0 && x / d > 1` safe.

`switch` compares one integer, `char` or enumeration value against constant `case` labels and
jumps straight to the match:

```cpp
switch (key) {
    case 'y':
        std::cout << "yes\n";
        break;
    case 'n':
        std::cout << "no\n";
        break;
    default:
        std::cout << "?\n";
}
```

The **conditional operator** chooses between two values: `int bigger = (a > b) ? a : b;`.
And since C++17, `if` can declare a variable that only exists inside the `if`:
`if (auto pos = s.find('@'); pos != std::string::npos) { ... }`.

## What is special or tricky

- **`=` is not `==`.** `if (x = 5)` *assigns* 5 and is always true. Compile with `-Wall` and
  the compiler warns you.
- **A stray semicolon.** `if (ready);` ends the `if` with an empty statement; the block after
  it always runs.
- **Missing braces.** Without `{ }`, only the *first* statement belongs to the `if`. Always
  use braces.
- **Forgotten `break`.** Execution **falls through** into the next `case`. When you want that
  on purpose, write `[[fallthrough]];` so readers (and the compiler) know.
- **`switch` does not work on `std::string`.** Only integers, characters and enumerations.
  A variable declared inside a `case` needs its own `{ }` block.
- **`0 < x < 10` compiles but lies.** It means `(0 < x) < 10`, and `true`/`false` is always
  less than 10. Write `0 < x && x < 10`.
- **Overflow inside a condition** is still overflow: `a + b > c` with large `int` values is
  undefined behaviour.

## What you will practise

You will grade a score with an `if`/`else if` chain, dispatch commands with `switch` and
deliberate fallthrough, and use `?:`, short-circuiting and an `if` with an initialiser. The
challenge asks you to classify triangles, including the impossible ones, without overflow.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u04-c1-conditions"
title = "Conditions choose the path"
points = 5
difficulty = 4
intro = '''
At machine level, every `if` becomes a **compare** followed by a **conditional jump** that
skips over the code that should not run. C++ gives you structured forms of that jump: `if`
and `else`, `switch`, and the `?:` operator, plus `&&` and `||`, which skip evaluating their
right side when they can.
'''
body = '''
## if, else if, else

```cpp
int speed = 72;
if (speed > 120) {
    std::cout << "too fast\n";
} else if (speed < 40) {
    std::cout << "too slow\n";
} else {
    std::cout << "fine\n";
}
```

The conditions are checked in order. The first true one runs its block and the rest are
skipped; if none is true, the `else` block runs. Exactly one block runs here.

## Combining conditions

- `a && b` is true when both are true. If `a` is false, `b` is not even evaluated.
- `a || b` is true when at least one is true. If `a` is true, `b` is skipped.
- `!a` flips true and false.

Short-circuiting is a feature you can rely on: `count > 0 && total / count > 10` never
divides by zero, because the division only happens when `count > 0`.

## switch for many fixed cases

When you compare one value against many constants, `switch` reads better than a long chain
and can compile to a jump table. Each `case` should end with `break`; otherwise execution
continues into the next case.

## Choosing a value with ?:

```cpp
std::string word = (n == 1) ? "item" : "items";
```

`condition ? a : b` is an **expression**: it produces `a` if the condition is true and `b`
otherwise, so it can sit inside a declaration or a `<<` chain where an `if` statement cannot.
'''

