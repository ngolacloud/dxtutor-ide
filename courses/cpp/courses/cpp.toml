[unit.step.gabarito]
solution = '''
#include <cstddef>
#include <iterator>
#include <stdexcept>

// A lazy arithmetic sequence like Python's range(start, stop, step).
class Range {
public:
    class iterator {
    public:
        using iterator_concept = std::forward_iterator_tag;
        using value_type = long long;
        using difference_type = std::ptrdiff_t;

        iterator() = default;
        iterator(long long value, long long step) : value_(value), step_(step) {}

        long long operator*() const { return value_; }
        iterator& operator++() {
            value_ += step_;
            return *this;
        }
        iterator operator++(int) {
            iterator old = *this;
            ++*this;
            return old;
        }
        bool operator==(const iterator& other) const { return value_ == other.value_; }

    private:
        long long value_ = 0;
        long long step_ = 0;
    };

    // Throws std::invalid_argument when step is 0.
    Range(long long start, long long stop, long long step = 1) : start_(start), step_(step) {
        if (step == 0) throw std::invalid_argument("Range step must not be zero");
        if (step > 0 && start < stop) {
            size_ = static_cast<std::size_t>((stop - start + step - 1) / step);
        } else if (step < 0 && start > stop) {
            size_ = static_cast<std::size_t>((start - stop - step - 1) / -step);
        }
    }

    iterator begin() const { return iterator(start_, step_); }
    iterator end() const { return iterator(at(size_), step_); }
    std::size_t size() const { return size_; }
    bool empty() const { return size_ == 0; }

    // The i-th value; std::out_of_range when i >= size().
    long long operator[](std::size_t i) const {
        if (i >= size_) throw std::out_of_range("Range index out of range");
        return at(i);
    }

    // True when both ranges produce the same sequence of values.
    bool operator==(const Range& other) const {
        if (size_ != other.size_) return false;
        if (size_ == 0) return true;
        if (start_ != other.start_) return false;
        return size_ == 1 || step_ == other.step_;
    }

private:
    long long at(std::size_t i) const { return start_ + static_cast<long long>(i) * step_; }

    long long start_;
    long long step_;
    std::size_t size_ = 0;
};
'''
time = "O(1) per operation"
space = "O(1)"
justification = '''
`Range` stores three numbers whatever its length, so its space is **O(1)**: a range of a
million values is as small as a range of three. The constructor computes the length with one
ceiling division, `(stop - start + step - 1) / step` for positive steps and its mirror image
for negative ones, so `size`, `empty` and `operator[]` are **O(1)**, and so are `begin` and
`end`, which build an iterator from `start + i * step`. Each iterator operation is one
addition or comparison, so a full loop over the range is O(n) with no allocation at all.

`==` is O(1) too, because two arithmetic sequences are equal exactly when they have the same
length and, if they are not empty, the same first value and (with two or more values) the
same step. Comparing the iterators by their current value is correct because the end
iterator's value, `start + size * step`, is exactly the value reached after `size`
increments. The iterator satisfies `std::forward_iterator`: it is default-constructible,
copyable and equality-comparable, its postfix `++` returns the old copy, and the aliases
name its value and difference types, which is what lets `std::ranges::count_if` and friends
accept a `Range`.
'''

