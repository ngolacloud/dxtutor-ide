entry = "TempFile"
intro = '''
A temporary file is a resource with a clear lifetime: create it, use it, delete it. An RAII
class that deletes the file in its destructor makes the cleanup automatic. Making the class
**movable but not copyable** keeps exactly one owner at a time, so the file is deleted
exactly once, even when ownership changes hands.
