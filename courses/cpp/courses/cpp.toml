[unit.step.gabarito]
solution = '''
#include <vector>

int* largest(std::vector<int>& values) {
    if (values.empty()) {
        return nullptr;
    }
    int* best = &values[0];
    for (int& x : values) {
        if (x > *best) {
            best = &x;
        }
    }
    return best;
}

const int* largest(const std::vector<int>& values) {
    if (values.empty()) {
        return nullptr;
    }
    const int* best = &values[0];
    for (const int& x : values) {
        if (x > *best) {
            best = &x;
        }
    }
    return best;
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
Each overload visits every element exactly once and does one comparison per element, so the
time is **O(n)** for a vector of n elements. The only extra state is the pointer `best`,
whatever the size of the vector, so the extra space is **O(1)**: nothing is copied.

Correctness rests on an invariant: before each iteration, `best` points at the first largest
element among those already visited. The comparison is strictly `>`, so an equal value later
in the vector never moves `best`, which is what makes duplicates return the first
occurrence. Because the loop variable is a reference (`int& x`), `&x` is the address of the
element inside the vector, not of a copy; with `for (int x : values)` the function would
return the address of a loop variable that dies at the end of each iteration, a dangling
pointer.

The returned pointer is valid only while the vector neither reallocates nor is destroyed:
a later `push_back` may move the elements and leave it dangling. Sorting first would cost
O(n log n) and reorder the caller's data, and copying would break the "point into the
vector" contract.
'''

[[unit]]
id = "cpp-u08-vectors-arrays"
title = "std::vector & std::array"
level = "intermediate"
difficulty = 8
intro = '''
Most programs keep data in sequences, and in C++ the default sequence is `std::vector`: a
growable array that stores its elements side by side in memory. You will compare it with
the fixed-size `std::array`, iterate in several styles, and learn the difference between a
vector's size and its capacity, which explains both its speed and its most famous pitfall.
'''
concepts = '''
## The idea

An **array** stores elements of one type **contiguously**: element *i* sits at a fixed
offset from the start, so reading element *i* is a single address calculation, O(1).
Contiguity is also why arrays are fast in practice: the CPU loads neighbouring elements into
its cache together, so a loop over an array streams through memory.

The only real question is who decides the length. If it is fixed at compile time, use
`std::array<T, N>`. If it changes while the program runs, use `std::vector<T>`.

## How C++ does it

```cpp
#include <array>
#include <vector>

std::array<int, 3> rgb{255, 128, 0};    // the size is part of the type
std::vector<double> temps{21.5, 23.0};
temps.push_back(19.0);                  // now 3 elements
double first = temps[0];                // no bounds check
double last = temps.at(2);              // checked: throws std::out_of_range
```

Both containers support range-for, `size()`, `front()`, `back()` and iterators (`begin()`,
`end()`). A `std::array` lives wherever you declare it, often on the stack, and copies like
any value. A `std::vector` object itself is small (typically three pointers); its elements
live in a heap block that the vector allocates, and its destructor frees that block for you.

## Size versus capacity

A vector's **size** is how many elements it holds. Its **capacity** is how many fit in the
block it has already allocated. When `push_back` finds the size equal to the capacity, the
vector allocates a bigger block (typically 1.5 or 2 times larger), moves every element into
it and frees the old one. Because capacity grows geometrically, a long run of `push_back`
calls costs **amortised O(1)** per element. When you know the final size, `reserve(n)`
allocates once, up front.

```cpp
std::vector<int> ids;
ids.reserve(1000);     // capacity >= 1000, size still 0
```

## Pitfalls

- **Out-of-range indexing** with `[]` is undefined behaviour, not an exception: `v[v.size()]`
  reads past the end, and so does `v[0]` on an empty vector. Use `.at()` while learning.
- **Invalidation.** After a reallocation, every pointer, reference and iterator into the old
  block dangles. Don't keep `&v[0]` across a `push_back`, and never `push_back` into a vector
  while a range-for loop is walking it.
- `std::vector<int> v(5);` holds five zeros, but `std::vector<int> v{5};` holds one element,
  5: braces prefer the initializer-list constructor.
- `size()` is unsigned (`std::size_t`). `v.size() - 1` on an empty vector wraps around to a
  huge number, and comparing a size with a negative `int` gives surprising answers.
- Passing a vector **by value** copies every element; pass `const std::vector<T>&` to read it.

## What you will practise

You will build and modify a vector, scan a `std::array`, and watch `reserve`, `size` and
`capacity` interact. The challenge asks you to compute the sum of every window of k
consecutive elements in a single pass.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u08-c1-contiguous-growth"
title = "Contiguous memory and amortised growth"
points = 5
difficulty = 8
intro = '''
Contiguous storage makes indexing a matter of arithmetic, and geometric growth makes
appending cheap on average even though some appends must copy everything. These two facts
explain almost every performance property of `std::vector`.
'''
body = '''
## One block, many elements

`v[i]` works by arithmetic: the address of element *i* is the start of the block plus
`i * sizeof(T)`. That is why indexing costs O(1) whatever the length, and why the elements
must sit side by side.

## Why push_back is cheap on average

Suppose the capacity doubles each time it runs out. Filling a vector with n elements
triggers reallocations at sizes 1, 2, 4, 8 and so on up to n, and each one moves the
elements present at that moment. The total number of moves is 1 + 2 + 4 + ... + n, which is
less than 2n. Spread over n pushes, that is a constant amount per push: **amortised O(1)**.
A single unlucky push costs O(n), but the average never does.

## Three ways to iterate

```cpp
for (std::size_t i = 0; i < v.size(); ++i) { /* use v[i] */ }
for (const auto& x : v) { /* use x */ }
for (auto it = v.begin(); it != v.end(); ++it) { /* use *it */ }
```

Use an index when the position matters, range-for when only the values do, and iterators
when an algorithm needs a position it can pass around. `end()` points one *past* the last
element, so ranges are half-open, `[begin, end)`. For an empty vector `begin() == end()`, and
every loop above runs zero times without any special case.

## std::array is not a small vector

`std::array<int, 4>` has no `push_back`: its size is a compile-time constant, and it needs no
heap allocation at all. Use it for small fixed groups such as the four directions on a grid
or the three channels of a colour.
'''

