'''
tests = '''
#include <algorithm>
#include <chrono>
#include <random>
#include <string>
#include <vector>

// Full-table reference, only for short strings.
static int t_reference(const std::string& a, const std::string& b) {
    std::vector<std::vector<int>> d(a.size() + 1, std::vector<int>(b.size() + 1));
    for (std::size_t i = 0; i <= a.size(); ++i) d[i][0] = static_cast<int>(i);
    for (std::size_t j = 0; j <= b.size(); ++j) d[0][j] = static_cast<int>(j);
    for (std::size_t i = 1; i <= a.size(); ++i)
        for (std::size_t j = 1; j <= b.size(); ++j)
            d[i][j] = std::min({d[i - 1][j] + 1, d[i][j - 1] + 1,
                                d[i - 1][j - 1] + (a[i - 1] == b[j - 1] ? 0 : 1)});
    return d[a.size()][b.size()];
}

TEST(classic_examples) {
    CHECK_EQ(edit_distance("kitten", "sitting"), 3);
    CHECK_EQ(edit_distance("flaw", "lawn"), 2);
    CHECK_EQ(edit_distance("intention", "execution"), 5);
    CHECK_EQ(edit_distance("sunday", "saturday"), 3);
}

TEST(empty_strings) {
    CHECK_EQ(edit_distance("", ""), 0);
    CHECK_EQ(edit_distance("", "abc"), 3);
    CHECK_EQ(edit_distance("abcd", ""), 4);
}

TEST(identical_and_single_edits) {
    CHECK_EQ(edit_distance("same", "same"), 0);
    CHECK_EQ(edit_distance("a", "b"), 1);
    CHECK_EQ(edit_distance("a", "A"), 1);
    CHECK_EQ(edit_distance("abc", "abxc"), 1);
    CHECK_EQ(edit_distance("abxc", "abc"), 1);
    CHECK_EQ(edit_distance("aaaa", "aaa"), 1);
}

TEST(symmetric) {
    CHECK_EQ(edit_distance("sitting", "kitten"), 3);
    CHECK_EQ(edit_distance("lawn", "flaw"), 2);
    CHECK_EQ(edit_distance("abc", ""), edit_distance("", "abc"));
}

TEST(accepts_string_views_into_larger_strings) {
    std::string text = "xxkittenxx";
    std::string_view word(text.data() + 2, 6);
    CHECK_EQ(edit_distance(word, "sitting"), 3);
}

TEST(matches_reference_on_random_strings) {
    std::mt19937 rng(11);
    for (int round = 0; round < 200; ++round) {
        std::string a(rng() % 25, 'a'), b(rng() % 25, 'a');
        for (char& ch : a) ch = static_cast<char>('a' + rng() % 3);
        for (char& ch : b) ch = static_cast<char>('a' + rng() % 3);
        CHECK_EQ(edit_distance(a, b), t_reference(a, b));
    }
}

TEST(long_strings_are_fast) {
    auto start = std::chrono::steady_clock::now();
    std::string ab, ba;
    for (int i = 0; i < 2500; ++i) {
        ab += "ab";
        ba += "ba";
    }
    CHECK_EQ(edit_distance(ab, ba), 2);  // delete the first 'a', append an 'a'
    CHECK_EQ(edit_distance(std::string(5000, 'x'), ""), 5000);
    CHECK_EQ(edit_distance(std::string(4000, 'a'), std::string(4000, 'b')), 4000);
    std::string s(5000, 'q');
    std::string t = s;
    t[100] = 'r';
    t += "zz";  // one substitution and two insertions; no shorter script exists
    CHECK_EQ(edit_distance(s, t), 3);
    CHECK_EQ(edit_distance(t, s), 3);
    auto elapsed = std::chrono::duration<double>(std::chrono::steady_clock::now() - start);
    CHECK(elapsed.count() < 2.0);
}
'''

[unit.step.gabarito]
solution = '''
#include <algorithm>
#include <cstddef>
#include <string_view>
#include <utility>
#include <vector>

int edit_distance(std::string_view a, std::string_view b) {
    if (a.size() < b.size()) std::swap(a, b);  // keep the rows as short as possible
    // prev[j]: distance between the first i-1 chars of a and the first j chars of b.
    std::vector<int> prev(b.size() + 1), cur(b.size() + 1);
    for (std::size_t j = 0; j <= b.size(); ++j) prev[j] = static_cast<int>(j);

    for (std::size_t i = 1; i <= a.size(); ++i) {
        cur[0] = static_cast<int>(i);  // delete all i characters
        for (std::size_t j = 1; j <= b.size(); ++j) {
            int substitute = prev[j - 1] + (a[i - 1] == b[j - 1] ? 0 : 1);
            int remove = prev[j] + 1;     // delete a[i-1]
            int insert = cur[j - 1] + 1;  // insert b[j-1]
            cur[j] = std::min({substitute, remove, insert});
        }
        std::swap(prev, cur);
    }
    return prev[b.size()];
}
'''
time = "O(len(a) * len(b))"
space = "O(min(len(a), len(b)))"
justification = '''
`d[i][j]`, the distance between the first `i` characters of `a` and the first `j` of `b`,
depends only on `d[i-1][j-1]` (match or substitute the last characters), `d[i-1][j]` (delete
`a[i-1]`) and `d[i][j-1]` (insert `b[j-1]`). The best edit sequence must end with one of these
three moves, which is the optimal substructure, and the base cases are `d[i][0] = i` and
`d[0][j] = j`. There are (n + 1)(m + 1) cells and each takes O(1), so the time is
**O(n · m)**: 25 million cheap cells for two 5,000-character strings, a few milliseconds at
`-O2`.

Row `i` needs only row `i - 1`, so two vectors replace the full table; `std::swap` exchanges
them in O(1) without copying. Swapping `a` and `b` first makes the rows as short as the shorter
string, giving **O(min(n, m))** extra space instead of the 100 MB a full `int` table would take
for 5,000 × 5,000.

Naive recursion re-solves the same prefix pairs over and over and takes exponential time.
Memoised recursion is also O(n · m) time, but it needs the full table and a recursion up to
n + m frames deep, while the bottom-up loop needs neither.
'''
