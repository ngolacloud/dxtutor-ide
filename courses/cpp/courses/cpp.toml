tests = '''
#include <algorithm>
#include <chrono>
#include <random>
#include <stdexcept>
#include <vector>

static std::vector<int> sliding_max_brute(const std::vector<int>& nums, std::size_t k) {
    std::vector<int> out;
    if (k > nums.size()) return out;
    for (std::size_t i = 0; i + k <= nums.size(); ++i) {
        out.push_back(*std::max_element(nums.begin() + i, nums.begin() + i + k));
    }
    return out;
}

TEST(example) {
    CHECK(sliding_max({1, 3, -1, -3, 5, 3, 6, 7}, 3) == std::vector<int>({3, 3, 5, 5, 6, 7}));
}

TEST(k_one_gives_the_input_back) {
    const std::vector<int> nums{4, 2, 7};
    CHECK(sliding_max(nums, 1) == std::vector<int>({4, 2, 7}));
}

TEST(k_equals_length) {
    CHECK(sliding_max({2, 9, 1, 9}, 4) == std::vector<int>({9}));
    CHECK(sliding_max({-3}, 1) == std::vector<int>({-3}));
}

TEST(k_too_large_or_empty) {
    CHECK(sliding_max({1, 2}, 5).empty());
    CHECK(sliding_max({}, 1).empty());
    CHECK(sliding_max({}, 3).empty());
}

TEST(k_zero_throws) {
    bool threw = false;
    try {
        sliding_max({1, 2, 3}, 0);
    } catch (const std::invalid_argument&) {
        threw = true;
    }
    CHECK(threw);
}

TEST(duplicates_and_negatives) {
    CHECK(sliding_max({-5, -5, -5, -1, -5}, 2) == std::vector<int>({-5, -5, -1, -1}));
    CHECK(sliding_max({3, 3, 3}, 2) == std::vector<int>({3, 3}));
    CHECK(sliding_max({7, 1, 7, 1, 7}, 3) == std::vector<int>({7, 7, 7}));
}

TEST(decreasing_and_increasing) {
    CHECK(sliding_max({9, 8, 7, 6, 5}, 2) == std::vector<int>({9, 8, 7, 6}));
    CHECK(sliding_max({1, 2, 3, 4, 5}, 3) == std::vector<int>({3, 4, 5}));
}

TEST(random_against_brute_force) {
    std::mt19937 rng(29);
    std::uniform_int_distribution<int> value(-20, 20);
    std::uniform_int_distribution<int> length(0, 40);
    std::uniform_int_distribution<int> window(1, 45);
    int mismatches = 0;
    for (int round = 0; round < 300; ++round) {
        std::vector<int> nums(length(rng));
        for (int& x : nums) x = value(rng);
        std::size_t k = window(rng);
        if (sliding_max(nums, k) != sliding_max_brute(nums, k)) ++mismatches;
    }
    CHECK_EQ(mismatches, 0);
}

TEST(linear_time) {
    const std::size_t n = 200'000, k = 10'000;
    std::vector<int> nums(n);
    for (std::size_t i = 0; i < n; ++i) nums[i] = static_cast<int>((i * 7919) % 10007);
    auto start = std::chrono::steady_clock::now();
    std::vector<int> result = sliding_max(nums, k);
    std::chrono::duration<double> elapsed = std::chrono::steady_clock::now() - start;
    CHECK_EQ(result.size(), n - k + 1);
    if (result.size() == n - k + 1) {
        for (std::size_t i : {std::size_t{0}, std::size_t{1}, std::size_t{12345}, n - k}) {
            CHECK_EQ(result[i], *std::max_element(nums.begin() + i, nums.begin() + i + k));
        }
    }
    CHECK(elapsed.count() < 0.5);
}
'''

[unit.step.gabarito]
solution = '''
#include <cstddef>
#include <deque>
#include <stdexcept>
#include <vector>

std::vector<int> sliding_max(const std::vector<int>& nums, std::size_t k) {
    if (k == 0) throw std::invalid_argument("k must be at least 1");
    std::vector<int> out;
    if (k > nums.size()) return out;
    out.reserve(nums.size() - k + 1);
    std::deque<std::size_t> window;  // indices; their values decrease front to back
    for (std::size_t i = 0; i < nums.size(); ++i) {
        if (!window.empty() && window.front() + k <= i) {
            window.pop_front();  // the maximum slid out of the window
        }
        while (!window.empty() && nums[window.back()] <= nums[i]) {
            window.pop_back();  // smaller and older: it can never be a maximum again
        }
        window.push_back(i);
        if (i + 1 >= k) out.push_back(nums[window.front()]);
    }
    return out;
}
'''
time = "O(n)"
space = "O(k)"
justification = '''
Each index is pushed onto the deque exactly once and popped at most once, from the front when it
leaves the window or from the back when a larger value arrives. The `while` loop can therefore
run at most `n` times **in total** over the whole scan, not per element, so the time is
**O(n)** amortised, independent of `k`. Every deque operation is O(1).

The deque only holds indices inside the current window, so it never has more than `k` entries:
**O(k)** extra space, plus the `n - k + 1` results the function must return anyway. The invariant
is that the indices in the deque increase from front to back while their values strictly
decrease. Popping smaller-or-equal values from the back keeps it, and it makes the front the
largest value in the window. An element popped from the back is never needed again, because the
new element is at least as large and stays in the window longer. Rescanning each window with
`std::max_element` is **O(n·k)**, about 2·10⁹ comparisons for the large test, while a
`std::multiset` of the window would be **O(n log k)**.

Compare `window.front() + k <= i` rather than `i - k >= window.front()`: with unsigned indices,
`i - k` wraps around to a huge number while `i < k`.
'''

