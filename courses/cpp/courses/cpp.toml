target = '''
#include <condition_variable>
#include <iostream>
#include <mutex>
#include <queue>
#include <thread>

int main() {
    std::mutex m;
    std::condition_variable cv;
    std::queue<int> jobs;
    bool done = false;
    std::jthread consumer([&] {
        int sum = 0;
        while (true) {
            std::unique_lock lock(m);
            cv.wait(lock, [&] { return !jobs.empty() || done; });
            if (jobs.empty()) break;
            int job = jobs.front();
            jobs.pop();
            lock.unlock();
            std::cout << "consumed " << job << '\n';
            sum += job;
        }
        std::cout << "sum = " << sum << '\n';
    });
    for (int i = 1; i <= 5; ++i) {
        std::lock_guard lock(m);
        jobs.push(i * 10);
        cv.notify_one();
    }
    {
        std::lock_guard lock(m);
        done = true;
    }
    cv.notify_one();
}
'''
