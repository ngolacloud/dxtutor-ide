[[unit.step]]
kind = "challenge"
id = "cpp-u20-x1-parallel-for"
title = "A parallel for loop"
points = 40
difficulty = 26
intro = '''
A parallel `for` divides the iteration space of a loop among worker threads, the core idea of
OpenMP's `parallel for` and of `std::for_each(std::execution::par, ...)`. Static, contiguous
blocks are the simplest schedule: no coordination while running, and one join per worker at the
end.
'''
entry = "parallel_for"
instructions = '''
## Your turn

Implement `parallel_for`:

```cpp
void parallel_for(std::size_t n, unsigned num_threads,
                  const std::function<void(std::size_t)>& body);
```

Call `body(i)` exactly once for every index `i` in `[0, n)`, spreading the indices across worker
threads.

Rules:

- Use `t = min(num_threads, n)` worker threads, where a `num_threads` of 0 counts as 1. When
  `n == 0`, start no threads and return.
- Give each worker one **contiguous block**: worker `w` handles `[w * n / t, (w + 1) * n / t)`.
  Because `t <= n`, every block is non-empty.
- Start **all** the workers before joining any of them, so the blocks really run at the same
  time. Call `body` only on the workers, never on the calling thread.
- Join every worker before returning: when `parallel_for` returns, every call to `body` has
  finished and its writes are visible to the caller.
- `body` only writes data that belongs to its own index, so you need no locks.

Example:

```cpp
std::vector<int> squares(5);
parallel_for(5, 2, [&](std::size_t i) { squares[i] = int(i * i); });
// squares == {0, 1, 4, 9, 16}
// worker 0 ran i = 0, 1 and worker 1 ran i = 2, 3, 4
```

**Hint:** keep the threads in a `std::vector<std::thread>` (or `std::jthread`), capture each
block's bounds by value in its lambda, and join in a second loop.

Hidden tests decide correctness.
'''
starter = '''
#include <cstddef>
#include <functional>
#include <stdexcept>
#include <thread>
#include <vector>

// Call body(i) exactly once for every i in [0, n), spread over
// t = min(num_threads, n) worker threads (a num_threads of 0 counts as 1).
// Worker w handles the contiguous block [w * n / t, (w + 1) * n / t).
// Start all the workers first, then join them all before returning.
void parallel_for(std::size_t n, unsigned num_threads,
                  const std::function<void(std::size_t)>& body) {
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <atomic>
#include <chrono>
#include <set>
#include <thread>
#include <vector>

static std::set<std::thread::id> distinct_ids(const std::vector<std::thread::id>& who) {
    return std::set<std::thread::id>(who.begin(), who.end());
}

TEST(fills_every_index) {
    std::vector<int> squares(5, -1);
    parallel_for(5, 2, [&](std::size_t i) { squares[i] = static_cast<int>(i * i); });
    CHECK(squares == std::vector<int>({0, 1, 4, 9, 16}));
}

TEST(each_index_exactly_once) {
    const std::size_t n = 1000;
    std::vector<std::atomic<int>> calls(n);
    parallel_for(n, 7, [&](std::size_t i) { calls[i].fetch_add(1); });
    std::size_t wrong = 0;
    for (std::size_t i = 0; i < n; ++i) {
        if (calls[i].load() != 1) ++wrong;
    }
    CHECK_EQ(wrong, 0u);
}

TEST(zero_items_calls_nothing) {
    std::atomic<int> calls{0};
    parallel_for(0, 4, [&](std::size_t) { calls.fetch_add(1); });
    CHECK_EQ(calls.load(), 0);
}

TEST(uses_num_threads_workers_not_the_caller) {
    const std::size_t n = 64;
    std::vector<std::thread::id> who(n);
    parallel_for(n, 4, [&](std::size_t i) { who[i] = std::this_thread::get_id(); });
    std::set<std::thread::id> ids = distinct_ids(who);
    CHECK_EQ(ids.size(), 4u);
    CHECK(ids.count(std::this_thread::get_id()) == 0);
    CHECK(ids.count(std::thread::id()) == 0);
}

TEST(contiguous_blocks) {
    // 10 indices on 3 workers: [0, 3), [3, 6), [6, 10)
    std::vector<std::thread::id> who(10);
    parallel_for(10, 3, [&](std::size_t i) { who[i] = std::this_thread::get_id(); });
    CHECK(who[0] == who[1] && who[1] == who[2]);
    CHECK(who[3] == who[4] && who[4] == who[5]);
    CHECK(who[6] == who[7] && who[7] == who[8] && who[8] == who[9]);
    CHECK(who[2] != who[3]);
    CHECK(who[5] != who[6]);
    CHECK(who[0] != who[6]);
}

TEST(more_threads_than_items) {
    std::vector<std::thread::id> who(3);
    parallel_for(3, 8, [&](std::size_t i) { who[i] = std::this_thread::get_id(); });
    CHECK_EQ(distinct_ids(who).size(), 3u);
}

TEST(zero_threads_means_one_worker) {
    std::vector<std::thread::id> who(5);
    parallel_for(5, 0, [&](std::size_t i) { who[i] = std::this_thread::get_id(); });
    std::set<std::thread::id> ids = distinct_ids(who);
    CHECK_EQ(ids.size(), 1u);
    CHECK(ids.count(std::this_thread::get_id()) == 0);
    CHECK(ids.count(std::thread::id()) == 0);
}

TEST(blocks_run_at_the_same_time) {
    // Each worker waits (up to 3 s) until all four have started.
    // Only workers that really run concurrently all see 4.
    std::atomic<int> arrived{0};
    std::vector<int> seen(4, 0);
    parallel_for(4, 4, [&](std::size_t i) {
        arrived.fetch_add(1);
        auto deadline = std::chrono::steady_clock::now() + std::chrono::seconds(3);
        while (arrived.load() < 4 && std::chrono::steady_clock::now() < deadline) {
            std::this_thread::yield();
        }
        seen[i] = arrived.load();
    });
    CHECK(seen == std::vector<int>({4, 4, 4, 4}));
}

TEST(large_range_on_eight_threads) {
    const long long n = 1'000'000;
    std::vector<long long> out(n, 0);
    parallel_for(static_cast<std::size_t>(n), 8,
                 [&](std::size_t i) { out[i] = static_cast<long long>(i) * 3 - 7; });
    long long total = 0;
    for (long long x : out) total += x;
    CHECK_EQ(total, 3 * (n * (n - 1) / 2) - 7 * n);
}
'''

[unit.step.gabarito]
solution = '''
#include <algorithm>
#include <cstddef>
#include <functional>
#include <thread>
#include <vector>

void parallel_for(std::size_t n, unsigned num_threads,
                  const std::function<void(std::size_t)>& body) {
    if (n == 0) return;
    const std::size_t t = std::min<std::size_t>(std::max(num_threads, 1u), n);
    std::vector<std::jthread> workers;
    workers.reserve(t);
    for (std::size_t w = 0; w < t; ++w) {
        const std::size_t begin = w * n / t;
        const std::size_t end = (w + 1) * n / t;
        workers.emplace_back([begin, end, &body] {
            for (std::size_t i = begin; i < end; ++i) body(i);
        });
    }
    // Leaving the function destroys the jthreads, and each destructor joins.
}
'''
time = "O(n)"
space = "O(t)"
justification = '''
Let `n` be the number of indices and `t = min(num_threads, n)` the number of workers. The blocks
`[w * n / t, (w + 1) * n / t)` tile `[0, n)` exactly, so `body` runs **n** times in total, and
starting and joining the workers costs **O(t)** more: the total work is **O(n + t) = O(n)**,
because `t <= n`. Every block holds `n / t` indices, give or take one, so with enough cores the
wall-clock time is about `n / t` calls of `body` plus the cost of creating `t` threads.

The function keeps one thread object and two bounds per worker, so the extra space is **O(t)**;
the results live in the caller's data. The correctness argument is about ordering, not
arithmetic: the bounds are captured by value, so no worker reads a variable the launching loop
is still changing, and all threads are started before any is joined, so the blocks overlap in
time. The joins in the `std::jthread` destructors make every `body(i)` happen before
`parallel_for` returns. Joining inside the launching loop would still be **O(n)** work, but the
blocks would run one after another and the wall-clock time would be the same as a plain loop.
'''

[[unit]]
id = "cpp-u21-mutex-atomics"
title = "Mutexes, atomics and condition variables"
level = "advanced"
difficulty = 27
intro = '''
When threads must share data while they run, something has to order their accesses. You will
protect shared state with `std::mutex` and RAII lock guards, replace a lock with a single
`std::atomic` operation where that is enough, and make a thread sleep until another one has work
for it with `std::condition_variable`. The challenge is a thread-safe bank whose transfers lock
two accounts at once and never lose money, overdraw or deadlock.
'''
concepts = '''
## The idea

A data race happens when threads touch the same memory without anything ordering them.
**Mutual exclusion** fixes it: a **mutex** (lock) is a token only one thread can hold at a time,
and the code that runs while holding it, the **critical section**, behaves as if no other thread
existed. Every access to the shared data, reads included, must happen under the *same* mutex.

For a single variable, the hardware offers something lighter: **atomic** instructions. An atomic
read-modify-write such as "add one" cannot be interrupted halfway, and other threads see it
either completely done or not started.

## How C++ does it

`std::mutex` (header `<mutex>`) has `lock()` and `unlock()`, but you should not call them by
hand: an early `return` or an exception would leave it locked forever. Use an RAII guard.
`std::lock_guard` locks in its constructor and unlocks in its destructor. `std::scoped_lock`
does the same for **one or more** mutexes, acquiring several with a deadlock-avoidance
algorithm. `std::unique_lock` can also unlock early, and it is what condition variables need.

```cpp
std::mutex m;
std::map<std::string, int> hits;   // guarded by m

void record(const std::string& page) {
    std::lock_guard lock(m);       // unlocked at the closing brace
    ++hits[page];
}
```

`std::atomic<T>` (header `<atomic>`) makes single operations indivisible: `fetch_add`, `++`,
`load`, `store` and `compare_exchange_weak`. By default they are sequentially consistent, the
easiest ordering to reason about.

A **condition variable** lets a thread sleep until a condition on shared data becomes true. The
waiter holds a `std::unique_lock` and calls `cv.wait(lock, predicate)`, which releases the mutex
while sleeping and re-acquires it before checking the predicate again. The other side changes
the data under the mutex, then calls `notify_one()` or `notify_all()`.

## Pitfalls

- **Deadlock.** Thread A holds `m1` and waits for `m2` while thread B holds `m2` and waits for
  `m1`: both wait forever. Take several mutexes with one `std::scoped_lock lock(m1, m2);`, or
  always in the same global order.
- **Locking the same `std::mutex` twice** from one thread is undefined behaviour, usually a hang.
  Watch for a locking method that calls another locking method, and for `scoped_lock(a.m, b.m)`
  when `a` and `b` are the same object.
- **Check-then-act races.** `if (balance >= x)` and `balance -= x` must sit in the *same*
  critical section, or another thread can slip in between them. Two atomic steps are not one
  atomic step.
- **Spurious wake-ups.** `wait` may return without a notification, so always wait with a
  predicate.
- **An unnamed guard.** `std::lock_guard<std::mutex>(m);` declares a new variable called `m` and
  does not compile, and `std::lock_guard{m};` locks and unlocks at the same semicolon. Always
  name the guard.
- Keep critical sections short, and never call unknown code while holding a lock.

## What you will practise

You will collect results into a shared vector under a mutex, count with atomics and a
compare-exchange loop, hand jobs from a producer to a consumer with a condition variable, and
build a `Bank` that eight threads can hammer with transfers at once.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u21-c1-locks-atomics"
title = "Critical sections, atomics and waiting"
points = 5
difficulty = 27
intro = '''
A mutex turns a sequence of operations into a critical section that one thread at a time can
execute. Atomics give the same guarantee for a single operation on a single variable, and a
condition variable lets a thread wait efficiently for a change made by another thread.
'''
body = '''
## A critical section

```cpp
std::mutex m;
long long balance = 100;   // guarded by m

bool withdraw(long long amount) {
    std::lock_guard lock(m);
    if (balance < amount) return false;
    balance -= amount;     // check and act under one lock
    return true;
}
```

Whichever way the function leaves, by `return` or by an exception, the guard's destructor
unlocks the mutex. Unlocking also publishes the writes: the next thread that locks `m` sees
everything done inside the previous critical section.

## Two locks at once

To move money between two accounts that each have a mutex, you need both. Taking them one at a
time in "from, then to" order deadlocks as soon as two threads transfer in opposite directions.
`std::scoped_lock lock(a.m, b.m);` takes both or neither, whatever order other threads use.

## One atomic operation

```cpp
std::atomic<int> served{0};
served.fetch_add(1);       // indivisible read-modify-write
int now = served.load();
```

Atomics are perfect for counters and flags. Updating two related variables together still needs
a mutex.

## Waiting for a condition

Sleeping in a loop wastes time, and spinning wastes a core. A `std::condition_variable` puts the
thread to sleep until another thread notifies it:

```cpp
std::unique_lock lock(m);
cv.wait(lock, [&] { return !jobs.empty(); });
```

The predicate is checked under the lock, both before sleeping and after every wake-up, so the
thread never misses a notification and never trusts a spurious one.
'''

