instructions = '''
## Your turn

Implement the function `greet`:

```cpp
std::string greet(const std::string& name);
```

It takes a name and **returns** (does not print) a `std::string` that reads
`Hello, {name}!`. `std::string` is the standard library's text type, from `<string>`; the
`const &` means the function reads the caller's name without copying it (unit 6 explains
why).

Examples:

- `greet("World")` returns `"Hello, World!"`
- `greet("Ada Lovelace")` returns `"Hello, Ada Lovelace!"`
- `greet("")` returns `"Hello, !"`

Do not write a `main` function: the tests provide their own.

**Hint:** two `std::string` values (or a `std::string` and a string literal) join with `+`.
Hand the result back with `return`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
#include <stdexcept>
#include <string>

// Return a greeting of the form "Hello, {name}!".
std::string greet(const std::string& name) {
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <sstream>
#include <string>

TEST(greets_world) {
    CHECK_EQ(greet("World"), "Hello, World!");
}

TEST(greets_cpp) {
    CHECK_EQ(greet("C++"), "Hello, C++!");
}

TEST(empty_name) {
    CHECK_EQ(greet(""), "Hello, !");
}

TEST(name_with_spaces) {
    CHECK_EQ(greet("Ada Lovelace"), "Hello, Ada Lovelace!");
}

TEST(accepts_a_string_variable) {
    std::string name = "Grace";
    CHECK_EQ(greet(name), "Hello, Grace!");
    CHECK_EQ(name, "Grace");
}

TEST(long_name) {
    std::string name(100000, 'x');
    std::string result = greet(name);
    CHECK_EQ(result.size(), name.size() + 8);
    CHECK_EQ(result.substr(0, 7), "Hello, ");
    CHECK_EQ(result.back(), '!');
}

TEST(returns_instead_of_printing) {
    std::ostringstream captured;
    std::streambuf* old = std::cout.rdbuf(captured.rdbuf());
    std::string result;
    try {
        result = greet("Linus");
    } catch (...) {
        std::cout.rdbuf(old);
        throw;
    }
    std::cout.rdbuf(old);
    CHECK_EQ(result, "Hello, Linus!");
    CHECK_EQ(captured.str(), "");
}
'''
[unit.step.gabarito]
solution = '''
#include <string>

// Return a greeting of the form "Hello, {name}!".
std::string greet(const std::string& name) {
    return "Hello, " + name + "!";
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
The result is a brand-new `std::string`: the fixed text `Hello, ` and `!` plus the `n`
characters of `name` are copied into it. Both the work and the memory grow in direct
proportion to the length of `name`, so the time is **O(n)** and the space is **O(n)**, where
`n` is the length of the name. There is no loop in your code; the copying happens inside the
`+` operations. `"Hello, " + name` works because one side is a `std::string`; two string
literals (`"Hello, " + "World"`) would not compile, since literals are plain character
arrays with no `+`.
'''

[[unit]]
id = "cpp-u02-variables"
title = "Variables & types"
level = "basic"
difficulty = 2
intro = '''
Programs need to remember values. This unit shows how C++ stores them in **variables**, why
every variable has a fixed **type** that the compiler checks before the program runs, and
what happens when you convert between types or a number grows too big for its type.
'''
concepts = '''
## The idea

A **variable** is a named piece of memory that holds a value. In C++ every variable also has
a **type**, which decides how many bytes it occupies, which values it can hold and which
operations make sense on it. C++ is **statically typed**: you choose the type when you write
the code, the compiler checks every use of the variable before the program exists, and the
type never changes while the program runs. A mistake such as adding text to a number is
caught at compile time, not discovered by a user later.

## How C++ does it

```cpp
int count = 3;              // a whole number
double price = 9.99;        // a number with a fractional part
char grade = 'A';           // one character, in single quotes
bool done = false;          // true or false
auto total = count * price; // the compiler deduces double
const int max_users = 100;  // can never be changed
```

- `int` is a whole number, usually 4 bytes, from about -2.1 billion to +2.1 billion. For
  bigger values use `long long` (8 bytes).
- `double` stores decimal numbers with about 15 significant digits.
- `auto` asks the compiler to deduce the type from the initial value. The type is still
  fixed; you just did not have to spell it.
- `const` makes a variable read-only; assigning to it later is a compile error.

You can also initialise with braces: `int n{3};`. Braces refuse **narrowing** conversions,
so `int n{9.99};` does not compile, while `int n = 9.99;` silently stores 9.

When two `int` values meet in `/`, the result is an `int` and the fraction is dropped:
`7 / 2` is `3`, and `7 % 2` (the remainder) is `1`. To get `3.5`, make one side a `double`
with an explicit conversion, `static_cast<double>(7) / 2`.

## What is special or tricky

- **Uninitialised variables.** `int x; std::cout << x;` reads garbage. Reading it is
  **undefined behaviour** (UB): the language makes no promise at all about what happens.
  Always give a variable a value when you declare it.
- **Signed overflow is UB.** `int` cannot go past 2147483647, and computing a bigger `int`
  is not guaranteed to "wrap around"; the optimiser may assume it never happens. Use
  `long long` when values can grow large.
- **Unsigned types wrap around.** `unsigned int` arithmetic is defined modulo 2^32, so
  `0u - 1` is 4294967295. Defined, but rarely what you wanted.
- **Floating point is approximate.** `0.1 + 0.2 == 0.3` is `false`, because neither value is
  exact in binary.
- **`'A'` is not `"A"`.** Single quotes make one `char`; double quotes make a string.
- **`auto x = 5 / 2;`** deduces `int` and stores 2.

## What you will practise

You will declare one variable of each basic type, do integer and decimal arithmetic, convert
between types with `static_cast`, and look at the limits of `int`. The challenge asks you to
average two `int` values exactly, without falling into integer division or overflow.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u02-c1-typed-boxes"
title = "Every variable has a type"
points = 5
difficulty = 2
intro = '''
A variable in C++ is a named box of memory, and its type is the shape of the box. Because the
compiler knows every type before the program runs, it can reject nonsense early and produce
machine code that works directly on raw bytes, with no checking at run time.
'''
body = '''
## Declaring a variable

A declaration names a type, then the variable, then (always, in this course) an initial
value:

```cpp
int lives = 3;
double speed = 2.5;
char key = 'q';
bool paused = false;
lives = lives - 1;   // assignment: the box now holds 2
```

The `=` in a declaration **initialises** the variable; later, `=` **assigns** a new value.
The type stays the same forever: `lives` will always be an `int`, and assigning `"three"` to
it is a compile error.

## Why types matter

The type tells the compiler how to read the bits in the box and which machine instructions
to use. `7 / 2` with two `int` values uses integer division and gives `3`; `7.0 / 2` uses
floating-point division and gives `3.5`. The same symbol, different operations, chosen at
compile time from the types.

## auto and const

`auto x = 2.5;` lets the compiler deduce `double` from the value. `const` locks a variable
after initialisation:

```cpp
const double gravity = 9.81;
auto falls = gravity * 2;    // double
```

## Always initialise

A local variable declared without a value, such as `int score;`, holds whatever bits were
left in that memory. Reading it is undefined behaviour, the C++ term for "anything may
happen". Giving every variable a starting value removes the whole problem.
'''

