    EventsDb() {
        sqlite3_open(":memory:", &db);
        run("CREATE TABLE events (id INTEGER PRIMARY KEY, ts INTEGER NOT NULL, name TEXT)");
        const int events[][2] = {{1, 300}, {2, 100}, {3, 200}, {4, 100},
                                 {5, 200}, {6, 100}, {7, 400}, {8, 200}};
        for (const auto& e : events) add(e[0], e[1]);
    }
    ~EventsDb() { sqlite3_close_v2(db); }
    EventsDb(const EventsDb&) = delete;
    EventsDb& operator=(const EventsDb&) = delete;
    void run(const char* sql) { sqlite3_exec(db, sql, nullptr, nullptr, nullptr); }
    void add(int id, int ts) {
        sqlite3_stmt* st = nullptr;
        sqlite3_prepare_v2(db, "INSERT INTO events VALUES (?, ?, 'event')", -1, &st, nullptr);
        sqlite3_bind_int(st, 1, id);
        sqlite3_bind_int(st, 2, ts);
        sqlite3_step(st);
        sqlite3_finalize(st);
        ordered.emplace_back(ts, id);
        std::sort(ordered.begin(), ordered.end());
    }
    Page walk(int size, bool& ok) {
        Page seen;
        std::optional<Key> cursor;
        for (int guard = 0; guard < 100000; ++guard) {
            Page page = next_page(db, cursor, size);
            if (page.empty()) return seen;
            if (static_cast<int>(page.size()) > size) ok = false;
            seen.insert(seen.end(), page.begin(), page.end());
            cursor = page.back();
        }
        ok = false;
        return seen;
    }
    bool no_open_statements() const { return sqlite3_next_stmt(db, nullptr) == nullptr; }
};

TEST(first_page) {
    EventsDb t;
    CHECK_EQ(next_page(t.db, std::nullopt, 3), (Page{{100, 2}, {100, 4}, {100, 6}}));
}

TEST(page_boundary_inside_a_tie) {
    EventsDb t;
    CHECK_EQ(next_page(t.db, Key{100, 4}, 2), (Page{{100, 6}, {200, 3}}));
    CHECK_EQ(next_page(t.db, Key{200, 3}, 3), (Page{{200, 5}, {200, 8}, {300, 1}}));
}

TEST(walk_all_pages) {
    EventsDb t;
    for (int size : {1, 2, 3, 5, 8, 50}) {
        bool ok = true;
        CHECK(t.walk(size, ok) == t.ordered);
        CHECK(ok);
    }
    CHECK(t.no_open_statements());
}

TEST(after_the_last_row) {
    EventsDb t;
    CHECK(next_page(t.db, Key{400, 7}, 5).empty());
    CHECK_EQ(next_page(t.db, Key{300, 1}, 5), (Page{{400, 7}}));
}

TEST(non_positive_size) {
    EventsDb t;
    CHECK(next_page(t.db, std::nullopt, 0).empty());
    CHECK(next_page(t.db, std::nullopt, -1).empty());
    CHECK(next_page(t.db, Key{100, 2}, -5).empty());
}

TEST(insert_before_the_cursor_does_not_repeat_rows) {
    EventsDb t;
    Page expected = t.ordered;
    Page first = next_page(t.db, std::nullopt, 4);
    t.run("INSERT INTO events VALUES (9, 50, 'late arrival')");
    Page second = next_page(t.db, first.back(), 4);
    first.insert(first.end(), second.begin(), second.end());
    CHECK(first == expected);
}

TEST(negative_timestamps) {
    EventsDb t;
    t.add(10, -5);
    t.add(11, -5);
    CHECK_EQ(next_page(t.db, std::nullopt, 2), (Page{{-5, 10}, {-5, 11}}));
    CHECK_EQ(next_page(t.db, Key{-5, 10}, 2), (Page{{-5, 11}, {100, 2}}));
}

TEST(empty_table) {
    EventsDb t;
    t.run("DELETE FROM events");
    CHECK(next_page(t.db, std::nullopt, 3).empty());
}

TEST(large_table_with_many_ties) {
    EventsDb t;
    t.run("DELETE FROM events");
    t.run("CREATE INDEX events_ts_id ON events (ts, id)");
    t.run("WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 5000)"
          " INSERT INTO events SELECT i, (i * 7919) % 50, 'bulk' FROM n");
    Page expected;
    for (int i = 1; i <= 5000; ++i) expected.emplace_back((i * 7919) % 50, i);
    std::sort(expected.begin(), expected.end());
    bool ok = true;
    CHECK(t.walk(7, ok) == expected);
    CHECK(ok);
}
'''

[unit.step.gabarito]
solution = '''
#include <sqlite3.h>
#include <memory>
#include <optional>
#include <stdexcept>
#include <utility>
#include <vector>

struct StmtFinalize {
    void operator()(sqlite3_stmt* st) const { sqlite3_finalize(st); }
};
using Stmt = std::unique_ptr<sqlite3_stmt, StmtFinalize>;

std::vector<std::pair<int, int>> next_page(sqlite3* db,
                                           std::optional<std::pair<int, int>> after,
                                           int size) {
    std::vector<std::pair<int, int>> page;
    if (size <= 0) return page;  // LIMIT -1 would mean "no limit" in SQLite

    const char* sql = after
        ? "SELECT ts, id FROM events WHERE (ts, id) > (?1, ?2) ORDER BY ts, id LIMIT ?3"
        : "SELECT ts, id FROM events ORDER BY ts, id LIMIT ?3";
    sqlite3_stmt* raw = nullptr;
    if (sqlite3_prepare_v2(db, sql, -1, &raw, nullptr) != SQLITE_OK) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    Stmt st(raw);
    if (after) {
        sqlite3_bind_int(st.get(), 1, after->first);
        sqlite3_bind_int(st.get(), 2, after->second);
    }
    sqlite3_bind_int(st.get(), 3, size);

    page.reserve(static_cast<std::size_t>(size));
    int rc;
    while ((rc = sqlite3_step(st.get())) == SQLITE_ROW) {
        page.emplace_back(sqlite3_column_int(st.get(), 0), sqlite3_column_int(st.get(), 1));
    }
    if (rc != SQLITE_DONE) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    return page;
}
'''
time = "O(log n + s)"
space = "O(s)"
justification = '''
With an index on `(ts, id)`, SQLite seeks to the first row after the cursor in **O(log n)**
and then reads the next **s** = `size` entries in order: **O(log n + s)** per page, the same
for the first page and the thousandth. Without such an index it must scan and keep the s
smallest rows, about **O(n log s)**, which is why a real application creates the index.
The returned vector holds s pairs: **O(s)** space (the `reserve` sizes it once).

Compare `OFFSET`: page p costs **O(p · s + log n)** because the skipped rows are produced and
discarded, so walking a whole table by offset is quadratic, while walking it by keyset is
linear. The composite cursor `(ts, id)` gives every row a unique place in the order, so a
boundary inside a tie neither skips nor repeats a row.
'''

# ---------------------------------------------------------------------------
# 21 · Indexes & EXPLAIN QUERY PLAN
# ---------------------------------------------------------------------------

[[unit]]
id = "cpp-udb6-indexes"
title = "Indexes & EXPLAIN QUERY PLAN"
level = "intermediate"
difficulty = 21
intro = '''
An index is a sorted copy of some columns that turns a full-table scan into a quick seek.
`EXPLAIN QUERY PLAN` shows the strategy SQLite picked, so you can check that an index is really
used instead of hoping. You will watch a `SCAN` become a `SEARCH`, meet composite and covering
indexes, and design one index that serves two queries.
'''
concepts = '''
## The idea

Without help, the only way to find the rows where `email = ?` is to read every row and test it: a **full table scan**, O(n). An **index** is a separate structure, a B-tree kept sorted by one or more columns, where each entry points back to its row. Finding a value in it is a **seek**, O(log n), just like binary search on a sorted array. On a million rows that is about 20 steps instead of a million.

Indexes are not free. Each one takes disk space, and every `INSERT`, `UPDATE` and `DELETE` must also update it. So you index the columns your important queries filter, join or sort by, not every column.

Two refinements matter in practice:

- A **composite index** on `(a, b)` is sorted by `a`, then by `b` within equal `a`s, like a phone book sorted by surname, then first name. It serves `WHERE a = ?` and `WHERE a = ? AND b = ?`, but not `WHERE b = ?` alone: that is the **leftmost prefix** rule.
- A **covering index** contains every column the query needs. SQLite then answers from the index alone and never visits the table rows at all.

## How C++ does it

Indexes are created with ordinary SQL, `CREATE INDEX IF NOT EXISTS name ON table (columns)`, run with `sqlite3_exec`. The interesting part is checking the result. Prefix any query with `EXPLAIN QUERY PLAN` and step it like any other statement: each row describes one step of the plan, and column 3 holds the human-readable detail.

```cpp
sqlite3_prepare_v2(db, "EXPLAIN QUERY PLAN SELECT name FROM users WHERE id = ?",
                   -1, &raw, nullptr);
while (sqlite3_step(raw) == SQLITE_ROW)
    std::cout << sqlite3_column_text(raw, 3) << '\n';
// SEARCH users USING INTEGER PRIMARY KEY (rowid=?)
```

The words to look for are **`SCAN table`** (read everything), **`SEARCH table USING INDEX name (col=?)`** (seek, then visit the rows) and **`USING COVERING INDEX`** (seek and answer from the index alone). Because the plan is just rows, a C++ test can assert on it, which keeps a later schema change from silently turning a seek back into a scan.

## What is special or tricky

- **An index can be ignored.** A function on the column (`WHERE lower(email) = ?`), a leading wildcard (`LIKE '%x'`) or skipping the leftmost column of a composite index all fall back to a scan.
- **The detail text changed across versions.** Older SQLite printed `SCAN TABLE users`; current versions print `SCAN users`. Match on stable words such as `SEARCH` and `USING INDEX`.
- **`EXPLAIN QUERY PLAN` does not run the query**, so unbound placeholders are fine.
- **`CREATE INDEX` without `IF NOT EXISTS` fails the second time** with "index ... already exists".
- **In an open transaction, a new index is not committed yet.** Check `sqlite3_get_autocommit`.
- Small tables may be scanned on purpose: reading 10 rows beats a seek. Test with realistic sizes.

## What you will practise

You will read the plan of a query with no index, add an index and watch the `SCAN` become a `SEARCH`, and compare composite and covering indexes. The challenge asks you to design one index that serves two hot queries, one of them from the index alone.
'''

[[unit.step]]
kind = "concept"
id = "cpp-udb6-c1-index"
title = "Why indexes matter"
points = 5
difficulty = 21
intro = '''
A B-tree index keeps keys sorted in a shallow, wide tree, so any key is a few page reads away:
O(log n) instead of the O(n) of scanning every row. `EXPLAIN QUERY PLAN` lets you confirm
which of the two your query actually gets.
'''
body = '''
## From SCAN to SEARCH

```sql
CREATE TABLE users (id INTEGER PRIMARY KEY, email TEXT, name TEXT);

EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?;
-- SCAN users

CREATE INDEX idx_users_email ON users (email);

EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?;
-- SEARCH users USING INDEX idx_users_email (email=?)
```

- **`SCAN users`** means every row is read: the cost grows linearly with the table.
- **`SEARCH ... USING INDEX`** means SQLite seeks in the index, then fetches the matching
  rows from the table.
- **`USING COVERING INDEX`** means the index alone holds every column the query needs, so
  the table is not touched at all.
- The `INTEGER PRIMARY KEY` is the table's own B-tree key, so `WHERE id = ?` is always a
  `SEARCH` without any extra index.

## Reading the plan from C++

`EXPLAIN QUERY PLAN` returns rows like any query. Prepare it, step it, and read column 3,
the detail text. Collect those strings in a test and check them with `find`:

```cpp
CHECK(plan.find("USING COVERING INDEX") != std::string::npos);
```

Composite indexes follow the **leftmost prefix** rule: an index on `(customer_id, status)`
helps queries that filter on `customer_id`, or on both columns, but not on `status` alone.
'''

