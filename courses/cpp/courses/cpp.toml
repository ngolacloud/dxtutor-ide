[unit.step.gabarito]
solution = '''
#include <algorithm>
#include <cstddef>
#include <iterator>
#include <string>
#include <utility>
#include <vector>

struct Player {
    std::string name;
    int score;
};

std::vector<std::string> leaderboard(std::vector<Player> players, int min_score, std::size_t k) {
    std::erase_if(players, [min_score](const Player& p) { return p.score < min_score; });

    const auto better = [](const Player& a, const Player& b) {
        if (a.score != b.score) {
            return a.score > b.score;
        }
        return a.name < b.name;
    };
    const auto top = players.begin() + static_cast<std::ptrdiff_t>(std::min(k, players.size()));
    std::partial_sort(players.begin(), top, players.end(), better);

    std::vector<std::string> names;
    names.reserve(static_cast<std::size_t>(top - players.begin()));
    std::transform(players.begin(), top, std::back_inserter(names),
                   [](Player& p) { return std::move(p.name); });
    return names;
}
'''
time = "O(n log k)"
space = "O(n)"
justification = '''
Let *n* be the number of players and *k* the requested size (capped at *n*).

`std::erase_if` is one linear pass that compacts the kept players: **O(n)**. `std::partial_sort`
over the survivors keeps a heap of the best *k* while scanning the rest and then sorts that heap,
which costs **O(n log k)** comparisons; each comparison is an `int` compare plus, on ties, a
string compare. Moving the *k* names out with `std::transform` is O(k). The total is
**O(n log k)**, which is O(n log n) in the worst case, when *k* ≥ *n*, and close to linear when
*k* is small, as leaderboards usually are. A full `std::sort` followed by truncation would also
pass, at O(n log n) every time.

`players` is taken **by value**, so the function works on its own copy and the caller's vector is
untouched; that copy is the **O(n)** space (a caller that no longer needs its vector can pass it
with `std::move` and avoid the copy entirely). The result adds O(k) names, which are *moved* out
of the copy instead of being copied again. The comparator is a strict weak ordering because it
compares with `>` and `<` only; the name tie-breaker makes the order total, so equal scores come
out in the same order on every run and every standard library.
'''

[[unit]]
id = "cpp-u15-move-semantics"
title = "Move semantics & the rule of five"
level = "intermediate"
difficulty = 15
intro = '''
Copying a vector of a million elements copies a million elements; moving it copies three
pointers. Move semantics let C++ transfer the resources of an object that is about to die
instead of duplicating them. You will see when the compiler copies and when it moves, why
`noexcept` on a move constructor matters to `std::vector`, and you will write a resource-owning
class that follows the rule of five.
'''
concepts = '''
## The idea

Many objects are small handles to big resources: a `std::string` points to a heap buffer, a
`std::vector` to an array, a `std::unique_ptr` to an object. **Copying** such a handle must
duplicate the resource, so both objects own independent data. But often the source is about to
be destroyed anyway: a temporary returned from a function, or a local you will never use again.
Duplicating its buffer only to free the original a moment later is pure waste. **Moving**
transfers the resource: the new object takes the pointer, and the old one is left empty.

## How C++ does it

C++ distinguishes **lvalues**, objects with a name you can use again, from **rvalues**,
temporaries about to vanish. A type can overload on that difference with a **move constructor**
`T(T&& other)` and a **move assignment** `T& operator=(T&& other)`, whose `&&` parameter binds
only to rvalues. The compiler picks them automatically for temporaries. For a named object you
are done with, you say so with `std::move`:

```cpp
std::vector<std::string> names;
std::string line = read_line();
names.push_back(line);             // copies: line is still used below
names.push_back(std::move(line));  // moves: we promise not to rely on line's value
```

`std::move` moves nothing by itself. It is a cast to `T&&` that makes overload resolution choose
the move overload.

Five special members manage an object's resources: the destructor, the copy constructor, copy
assignment, the move constructor and move assignment. The **rule of zero** says: build your class
from members that already manage themselves (`std::string`, `std::vector`, `std::unique_ptr`) and
declare none of the five; the compiler generates correct ones. The **rule of five** says: if you
must write one of them, because you manage a raw resource by hand, write or explicitly `= default`
or `= delete` all five.

## Pitfalls

- **A moved-from object is valid but unspecified.** For most standard types you may only assign a
  new value to it or destroy it. Reading a moved-from `std::string` is legal but tells you nothing;
  a moved-from `std::unique_ptr`, by contrast, is guaranteed to be null.
- **`std::move` on a `const` object silently copies**, because `const T&&` cannot bind to the move
  constructor.
- **`return std::move(local);` is a pessimisation.** Returning a local by name already moves, or
  better, elides the copy altogether.
- **Forgetting `noexcept` on a move constructor** makes `std::vector` copy instead of move when it
  grows, because it must not lose elements if a move throws halfway.
- **A hand-written copy assignment must survive `a = a`.** Freeing your buffer before copying from
  `other` destroys the data you are about to read.

## What you will practise

You will move strings, smart pointers and vectors, trace exactly which special member runs on each
line, and measure how `noexcept` changes the way a vector grows. The challenge is a heap array that
owns a raw buffer and implements all five special members correctly.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u15-c1-copy-vs-move"
title = "Copy, move and value categories"
points = 5
difficulty = 15
intro = '''
Every C++ expression has a **value category**. An lvalue names an object that persists, an
rvalue is a temporary whose resources nobody else will see again, and overload resolution uses
that difference to choose between copying and moving.
'''
body = '''
## Two ways to build a new object

```cpp
std::string a = "a long string that lives on the heap";
std::string b = a;              // copy: allocate, copy every character
std::string c = std::move(a);   // move: take a's buffer, no characters copied
```

A copy costs O(n) and leaves two independent strings. A move costs O(1): `c` steals the pointer,
size and capacity, and `a` is left in a **valid but unspecified** state. You may assign to `a` or
let it be destroyed, but don't rely on what it contains.

## Which one runs?

```cpp
void keep(std::string s);
keep(a);                        // a is an lvalue: copied into s
keep(std::move(a));             // an rvalue: moved into s
keep(a + "!");                  // a temporary: moved, no std::move needed
```

The move constructor takes `T&&`, an **rvalue reference**, which binds only to rvalues.
`std::move(x)` is just `static_cast<T&&>(x)`: it marks `x` as "I am done with this" so the move
overload wins.

## Elision: even better than a move

```cpp
std::string make() { return std::string(1000, 'x'); }
std::string s = make();         // no copy, no move: built directly in s
```

Since C++17, initialising an object from a temporary of the same type constructs it in place.
That is why returning by value is the normal, cheap way to hand results back in modern C++.

## Who writes the moves?

For a class whose members are `std::string`, `std::vector` and friends, the compiler generates a
move constructor that moves each member. You only write your own when the class manages a raw
resource itself, and then all five special members need your attention.
'''

