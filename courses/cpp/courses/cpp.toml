target = '''
#include <concepts>
#include <iostream>
#include <string>
#include <vector>

template <std::integral T>
std::string kind(T) { return "integral"; }

template <std::signed_integral T>
std::string kind(T) { return "signed integral"; }

template <std::floating_point T>
std::string kind(T) { return "floating point"; }

template <typename T>
std::string measure(const T& x) {
    if constexpr (requires { x.size(); }) {
        return "size " + std::to_string(x.size());
    } else {
        return "no size";
    }
}

int main() {
    std::cout << kind(-7) << '\n';
    std::cout << kind(7u) << '\n';
    std::cout << kind(0.5) << '\n';
    std::cout << measure(std::vector<int>{1, 2, 3}) << '\n';
    std::cout << measure(std::string("hello")) << '\n';
    std::cout << measure(42) << '\n';
}
