prompt = '''
Write a non-copyable `Transaction` class whose constructor begins, whose `commit()` commits and
whose destructor rolls back unless committed. Insert a row through it, throw before committing,
and show that the row is gone and no transaction is open.

**Why:** this guard is the C++ way to make "roll back on every error" impossible to forget.
