[[unit.step]]
kind = "challenge"
id = "cpp-u19-x1-range"
title = "A Python-style Range"
points = 40
difficulty = 25
intro = '''
Python's `range(start, stop, step)` is a **lazy sequence**: it stores three numbers, not the
values, yet it can be looped over, indexed, measured and compared. Building one in C++ puts
operator overloading and the iterator protocol together, and making its iterator satisfy
`std::forward_iterator` lets the whole `std::ranges` algorithm library work on it.
'''
entry = "Range"
instructions = '''
## Your turn

Implement the class `Range`, a lazy arithmetic sequence like Python's `range`:

```cpp
class Range {
public:
    class iterator;   // see below
    Range(long long start, long long stop, long long step = 1);
    iterator begin() const;
    iterator end() const;
    std::size_t size() const;
    bool empty() const;
    long long operator[](std::size_t i) const;
    bool operator==(const Range& other) const;
};
```

The values are `start, start + step, start + 2*step, …`, stopping **before** `stop`:

- with a positive `step`, while the value is `< stop`;
- with a negative `step`, while the value is `> stop`.

So `Range(0, 5)` is `0 1 2 3 4`, `Range(1, 10, 3)` is `1 4 7`, `Range(5, -1, -2)` is
`5 3 1`, and `Range(3, 3)` and `Range(5, 1)` are empty.

Rules:

- The constructor throws `std::invalid_argument` when `step` is 0.
- `size()` is the number of values, computed in O(1) (don't loop), and `empty()` says whether it is 0.
- `r[i]` is the `i`-th value; it throws `std::out_of_range` if `i >= size()`.
- `==` compares the **sequences**, like Python: `Range(0, 10, 3) == Range(0, 11, 3)`
  (both are `0 3 6 9`), all empty ranges are equal, and `Range(0, 1, 5) == Range(0, 1, 7)`
  (both are just `0`).
- Store only a few numbers. Never build a vector of the values.

The iterator must be a real forward iterator, so that range-for **and** algorithms such as
`std::ranges::count_if` and `std::ranges::find` work. The starter declares what it needs:
`iterator_concept`, `value_type` and `difference_type` aliases, a default constructor, `*`
returning the current value, prefix and postfix `++`, and `==`. Add the data members it
needs and a constructor that `Range` can call. The tests check
`std::forward_iterator<Range::iterator>`.

**Hint:** an iterator can hold just the current value and the step. Then `end()` is the
iterator whose value is `start + size() * step`.

Hidden tests decide correctness.
'''
starter = '''
#include <cstddef>
#include <iterator>
#include <stdexcept>

