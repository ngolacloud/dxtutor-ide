[[unit.step]]
kind = "challenge"
id = "cpp-u05-x1-is-prime"
title = "Implement is_prime"
points = 20
difficulty = 5
entry = "is_prime"
intro = '''
Testing whether a number is prime by trial division is the classic first lesson in making a
loop **stop early**. If `n` has a divisor, it has one no larger than its square root, so the
loop can end at √n instead of n: for a number near a trillion, that is a million rounds
instead of a trillion.
'''
instructions = '''
## Your turn

Implement the function `is_prime`:

```cpp
bool is_prime(long long n);
```

It returns `true` if `n` is a prime number and `false` otherwise. A prime is a whole number
greater than 1 whose only divisors are 1 and itself. Numbers below 2 (including 0, 1 and every
negative number) are not prime.

Examples:

- `is_prime(2)` returns `true`
- `is_prime(91)` returns `false` (91 = 7 × 13)
- `is_prime(1)` returns `false`
- `is_prime(-7)` returns `false`

**Performance:** the tests include numbers close to one trillion (10^12), which must be
answered in well under a second. Trying every divisor up to `n` is far too slow; think about
when you can stop looking.

Do not write a `main` function: the tests provide their own.

**Hint:** if `d * d > n` and you have found no divisor yet, there is none. Writing the
condition as `d <= n / d` avoids computing `d * d`, which can never overflow that way.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
#include <stdexcept>

// Return true if n is prime (only divisible by 1 and itself, and greater than 1).
bool is_prime(long long n) {
    throw std::logic_error("not implemented");
}
'''
tests = '''
TEST(small_primes) {
    CHECK(is_prime(2));
    CHECK(is_prime(3));
    CHECK(is_prime(5));
    CHECK(is_prime(7));
    CHECK(is_prime(13));
    CHECK(is_prime(97));
}

TEST(small_composites) {
    CHECK(!is_prime(4));
    CHECK(!is_prime(9));
    CHECK(!is_prime(15));
    CHECK(!is_prime(91));
    CHECK(!is_prime(100));
}

TEST(below_two_is_not_prime) {
    CHECK(!is_prime(1));
    CHECK(!is_prime(0));
    CHECK(!is_prime(-1));
    CHECK(!is_prime(-2));
    CHECK(!is_prime(-7));
}

TEST(squares_of_primes) {
    CHECK(!is_prime(25));
    CHECK(!is_prime(49));
    CHECK(!is_prime(1000003LL * 1000003LL));
}

TEST(counts_primes_below_ten_thousand) {
    int count = 0;
    for (long long n = -100; n < 10000; ++n) {
        if (is_prime(n)) {
            ++count;
        }
    }
    CHECK_EQ(count, 1229);
}

TEST(large_numbers) {
    CHECK(is_prime(2147483647LL));
    CHECK(is_prime(1000000007LL));
    CHECK(is_prime(999999999989LL));
    CHECK(!is_prime(999983LL * 999979LL));
    CHECK(!is_prime(1000000000000LL));
}
'''
[unit.step.gabarito]
solution = '''
// Return true if n is prime (only divisible by 1 and itself, and greater than 1).
bool is_prime(long long n) {
    if (n < 2) {
        return false;
    }
    if (n % 2 == 0) {
        return n == 2;
    }
    for (long long d = 3; d <= n / d; d += 2) {
        if (n % d == 0) {
            return false;
        }
    }
    return true;
}
'''
time = "O(√n)"
space = "O(1)"
justification = '''
If `n = a × b` with `a ≤ b`, then `a × a ≤ n`, so `a ≤ √n`: every composite number has a
divisor no larger than its square root. The loop therefore stops once `d` passes √n, and
because even numbers are handled up front it only tries odd `d`, about √n / 2 candidates. Each
round is a constant amount of work, so the time is **O(√n)**. For `n` near 10^12 that is about
500,000 rounds, a few milliseconds, where a loop up to `n` would need 10^12 rounds and run for
hours.

The function keeps only `n` and `d`, so the space is **O(1)**. Writing the condition as
`d <= n / d` rather than `d * d <= n` keeps every intermediate value within `n`, so nothing
can overflow even for the largest `long long`. Numbers below 2 are rejected first, which also
keeps negative values away from `%`.
'''

[[unit]]
id = "cpp-u06-functions"
title = "Functions: declarations, overloading, references"
level = "basic"
difficulty = 6
intro = '''
Functions let you name a piece of work and reuse it. This unit covers how C++ declares and
defines functions, how one name can have several **overloads**, how **default arguments**
work, and the most important choice you make for every parameter: pass a copy, or pass a
**reference** to the caller's own variable.
'''
concepts = '''
## The idea

A **function** is a named block of code with inputs, called **parameters**, and usually one
output, the **return value**. Functions split a big problem into small pieces you can
understand, test and reuse. Calling a function jumps to its code with fresh local variables;
returning jumps back with the result.

## How C++ does it

```cpp
int square(int x) {          // return type, name, parameters
    return x * x;
}
void log_line(const std::string& text);   // a declaration: no body yet
```

A **definition** includes the body. A **declaration** (also called a prototype) only states
the name, parameter types and return type, ending in `;`. The compiler reads the file from
top to bottom and must have seen at least a declaration before any call. `void` means the
function returns nothing.

**Overloading** lets several functions share a name if their parameter types differ; the
compiler picks the best match for each call. **Default arguments** fill in trailing
parameters the caller leaves out:

```cpp
double area(double r);                 // circle
double area(double w, double h);       // rectangle
std::string pad(std::string s, int width = 10);
```

Then the parameter-passing choice:

- **By value** (`int n`): the function gets its own copy. Changes stay inside it. Ideal for
  small types such as `int`, `double`, `char`.
- **By reference** (`int& n`): the parameter is another name for the caller's variable.
  Changes are visible to the caller. Use it when the function must modify its argument.
- **By const reference** (`const std::string& s`): no copy and no modification. The usual
  choice for reading large objects. (`std::string_view` serves the same purpose for text.)

## What is special or tricky

- **Calling before declaring** gives `'f' was not declared in this scope`. Declare it above,
  or define it before use.
- **Falling off the end** of a non-`void` function without `return` is undefined behaviour.
  `-Wall` warns with `control reaches end of non-void function`.
- **Never return a reference to a local variable.** The local dies when the function
  returns, so the caller holds a **dangling reference**; using it is undefined behaviour.
  Return by value instead.
- **A non-const reference cannot bind to a literal.** `increment(5)` does not compile when
  the parameter is `int&`: there is no variable to modify.
- **Ambiguous overloads.** With `f(long)` and `f(double)`, the call `f(1)` is an error,
  because converting `int` to either is equally good.
- **Default arguments go in the declaration only.** Repeating them in the definition is a
  compile error.

## What you will practise

You will declare functions above `main` and define them below it, write overloads and a
default argument, and watch the difference between passing by value and by reference. The
challenge asks you to parse a time of day and hand back two results through reference
parameters.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u06-c1-calls"
title = "Parameters, return values and references"
points = 5
difficulty = 6
intro = '''
Each call creates a fresh **stack frame** holding the function's parameters and local
variables, and returning destroys it. Passing by value copies the argument into that frame;
passing by reference stores only the address of the caller's variable, so the function can
read and write the original. That one difference explains when to use each.
'''
body = '''
## Declaring and defining

```cpp
int add(int a, int b);        // declaration: promises the function exists

int main() {
    std::cout << add(2, 3);   // fine: the declaration was seen above
}

int add(int a, int b) {       // definition: the actual body
    return a + b;
}
```

The compiler only needs the declaration to check a call: it knows the parameter types and the
return type. The definition can come later in the file, or in another file.

## Copies versus references

```cpp
void reset_copy(int n) { n = 0; }     // changes its own copy
void reset_ref(int& n)  { n = 0; }    // changes the caller's variable

int score = 42;
reset_copy(score);    // score is still 42
reset_ref(score);     // score is now 0
```

The `&` in a parameter type makes it a **reference**: another name for the variable the
caller passed. A reference cannot be null and always refers to the same variable.

## const references for reading

Copying a long `std::string` costs time and memory. `const std::string&` gives the function
read-only access to the caller's string with no copy at all. Rule of thumb: small values by
value, large objects you only read by `const&`, and plain `&` only when the function's job is
to modify the argument.

## Returning more than one result

A function returns one value. When it must hand back two, one common C++ pattern is to return
a `bool` meaning "did it work?" and write the results into reference parameters.
'''

