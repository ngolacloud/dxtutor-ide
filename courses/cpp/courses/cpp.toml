[unit.step.gabarito]
solution = '''
#include <algorithm>
#include <cstddef>
#include <utility>
#include <vector>

namespace {

// Sorts v[lo, hi) using buf as scratch space and returns its inversion count.
long long sort_count(std::vector<int>& v, std::vector<int>& buf, std::size_t lo, std::size_t hi) {
    if (hi - lo < 2) return 0;
    std::size_t mid = lo + (hi - lo) / 2;
    long long count = sort_count(v, buf, lo, mid) + sort_count(v, buf, mid, hi);

    std::size_t i = lo, j = mid, k = lo;
    while (i < mid && j < hi) {
        if (v[j] < v[i]) {
            count += static_cast<long long>(mid - i);  // v[j] is smaller than all of v[i, mid)
            buf[k++] = v[j++];
        } else {
            buf[k++] = v[i++];
        }
    }
    while (i < mid) buf[k++] = v[i++];
    while (j < hi) buf[k++] = v[j++];
    std::copy(buf.begin() + lo, buf.begin() + hi, v.begin() + lo);
    return count;
}

}  // namespace

std::pair<std::vector<int>, long long> sort_and_count(const std::vector<int>& items) {
    std::vector<int> v = items;
    std::vector<int> buf(v.size());
    long long count = sort_count(v, buf, 0, v.size());
    return {std::move(v), count};
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
This is merge sort with one extra addition per merge step. The recursion halves the range down
to single elements, giving about log₂ n levels; at each level the merges together copy every
element once into `buf` and back, so each level is O(n) and the total is **O(n log n)**. For a
million items that is about 20 million element moves, well under the time limit, whereas the
pairwise check would need about 5 × 10¹¹ comparisons.

Extra space is **O(n)**: the copy `v` that becomes the result, one shared buffer `buf`
allocated once (not one per call), and a recursion stack only log₂ n frames deep.

The counting rule is what makes it correct. When `v[j]` (right half) is strictly smaller than
`v[i]` (left half), it is also smaller than every remaining left item `v[i..mid)`, because the
left half is sorted, and all of those come before it in the original order. So it closes
exactly `mid - i` inversions at once. Taking the left item on ties (`v[j] < v[i]`, not `<=`)
both keeps the sort stable and ensures equal items are never counted. The sum of the counts
from both halves plus these cross counts covers every pair exactly once. The count is a
`long long` because it can reach n(n-1)/2, about 5 × 10¹¹ for a million items; overflowing an
`int` would be undefined behaviour.
'''

[[unit]]
id = "cpp-u28-recursion-dp"
title = "Recursion and dynamic programming"
level = "advanced"
difficulty = 34
intro = '''
Recursion solves a problem by reducing it to smaller instances of the same problem, and dynamic
programming makes that fast when the smaller instances overlap. You will recurse over a nested
directory tree, count how many calls a naive Fibonacci makes compared with a memoised one, fill
a bottom-up table of grid paths, and finish with edit distance, the algorithm behind diff tools
and spelling suggestions.
'''
concepts = '''
## The idea

A **recursive** function calls itself on a smaller input until it reaches a **base case** it
can answer directly. Every recursive solution needs both parts: a base case that stops, and a
step that makes progress towards it. Recursion fits naturally whenever the data is itself
recursive, such as trees, nested structures and expressions.

Some recursions solve the **same subproblem many times**. Naive Fibonacci computes `fib(n - 2)`
inside `fib(n - 1)` and again directly, and the duplication compounds: `fib(30)` makes about
2.7 million calls to compute 30 distinct values. **Dynamic programming** (DP) removes the
waste by solving each subproblem once and storing the answer:

- **Memoisation (top-down):** keep the recursion, but look the answer up in a table before
  computing it, and store it afterwards.
- **Tabulation (bottom-up):** fill the table in an order where every cell's dependencies are
  already filled, with plain loops and no recursion at all.

A problem suits DP when it has **optimal substructure** (the answer is built from answers to
subproblems) and **overlapping subproblems**. The cost becomes *number of distinct
subproblems × work per subproblem*.

## How C++ does it

A memo is usually a `std::vector` indexed by the subproblem, with a sentinel for "not computed
yet", or a `std::unordered_map` when the keys are sparse:

```cpp
long long ways(int n, std::vector<long long>& memo) {   // stairs climbed 1 or 2 at a time
    if (n <= 1) return 1;
    if (memo[n] != -1) return memo[n];
    return memo[n] = ways(n - 1, memo) + ways(n - 2, memo);
}
```

Pass the memo by reference: passed by value, every call would copy it and the memo would be
useless. A bottom-up table is a `std::vector<std::vector<T>>` or, better for speed, a flat
vector of `rows * cols` cells. When a row depends only on the previous row, two rows suffice.

## What is special or tricky

- **Stack overflow.** Each call takes a stack frame. C++ has no recursion limit and no
  exception for this: a recursion that goes too deep (millions of frames, or a missing base
  case) simply crashes with a segmentation fault. Bottom-up tables avoid the problem entirely.
- **Missing or wrong base cases** recurse forever, or index `memo[-1]`, which is undefined
  behaviour.
- **Overflow.** DP counts grow fast: `fib(93)` no longer fits in a `long long`, and signed
  overflow is undefined behaviour. Choose the type for the largest answer.
- **Sentinels must be impossible answers.** If 0 is a valid result, `0` cannot also mean "not
  computed yet"; use `-1` or `std::optional`.
- **Memory.** A full `n × m` table of 10,000 × 10,000 `int`s is 400 MB. Keep only the rows
  you need.

## What you will practise

You will recurse over a tree of directories, measure the calls saved by a memo, and fill a
grid table bottom-up. The challenge is edit distance on strings thousands of characters long,
in a table with only two rows.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u28-c1-recursion-memo"
title = "Base cases, overlap and the memo"
points = 5
difficulty = 34
intro = '''
A recursive definition becomes an efficient algorithm once you notice which subproblems repeat.
Memoisation caches them top-down; tabulation computes them bottom-up. Both turn an exponential
number of calls into one computation per distinct subproblem.
'''
body = '''
## Two parts of every recursion

```cpp
int sum_digits(int n) {
    if (n < 10) return n;                 // base case: answer directly
    return n % 10 + sum_digits(n / 10);   // step: a strictly smaller input
}
```

If the step does not shrink the input, or the base case is never reached, the recursion runs
until the stack is exhausted and the program crashes.

## Overlap

Draw the call tree of naive `fib(5)`: `fib(3)` appears twice, `fib(2)` three times, and the
tree roughly doubles with every extra level, about φⁿ calls (φ ≈ 1.618). The work explodes
because the same values are recomputed again and again, not because there are many of them:
there are only *n* + 1 distinct arguments.

## The memo

Store each answer the first time it is computed:

```cpp
if (memo[n] != -1) return memo[n];
return memo[n] = fib(n - 1, memo) + fib(n - 2, memo);
```

Now each `fib(k)` is computed once, and every later call is an O(1) lookup. The cost drops from
exponential to O(n).

## Bottom-up

Since `fib(k)` only depends on smaller arguments, you can fill the table from 0 upwards with a
loop, and keep only the last two values. No recursion means no stack-depth limit, and loops are
faster than calls. The recipe for any DP: define what a table cell means in words, find the
recurrence between cells, fill the base cells, then loop in dependency order.
'''

