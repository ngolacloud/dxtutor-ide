[[unit.step]]
kind = "challenge"
id = "cpp-u25-x1-hash-map"
title = "A resizing hash map from scratch"
points = 40
difficulty = 31
entry = "HashMap"
intro = '''
Building a hash table yourself shows why `unordered_map` operations are O(1) on average: a
hash picks one short bucket, equality settles the match, and doubling the bucket array on a
load-factor threshold keeps the chains short. Growth by doubling is what makes inserts
amortised O(1) instead of degrading to O(n).
'''
instructions = '''
## Your turn

Complete the class template `HashMap`, a separate-chaining hash table:

```cpp
template <typename K, typename V, typename Hash = std::hash<K>>
class HashMap {
public:
    explicit HashMap(std::size_t buckets = 8);   // provided
    void put(const K& key, const V& value);
    std::optional<V> get(const K& key) const;
    bool remove(const K& key);
    bool contains(const K& key) const;
    std::size_t size() const;
    std::size_t bucket_count() const;
};
```

Rules:

- Store the entries in the private `buckets_`, a vector of buckets where each bucket is a
  `std::vector<std::pair<K, V>>`. A key lives in bucket `hash_(key) % buckets_.size()`.
  Don't use `std::unordered_map`, `std::map` or a set to store the entries.
- `put` updates the value if the key is already present. Otherwise it adds the entry and,
  if the number of entries is now **more than three quarters** of the bucket count
  (`size * 4 > bucket_count * 3`), it **doubles** the bucket count and moves every entry to
  its new bucket.
- `get` returns the value, or `std::nullopt` if the key is absent.
- `remove` deletes the key and returns `true`, or returns `false` if it is absent. Removing
  never shrinks the bucket array.
- Keys are compared with `==`. The table must stay correct even with a terrible hasher that
  sends every key to the same bucket.

Example:

```cpp
HashMap<std::string, int> m;
m.put("a", 1); m.put("b", 2); m.put("a", 3);
m.get("a");                   // 3
m.size(); m.contains("b");    // 2, true
m.remove("b");                // true
m.get("b").has_value();       // false
```

Starting from 8 buckets, inserting 7 distinct keys grows the table to 16 buckets, and
inserting 100 distinct keys leaves 256 (8, 16, 32, 64, 128, 256).

Hidden tests decide correctness, including one with 100,000 keys that must finish quickly.
'''
starter = '''
#include <cstddef>
#include <functional>
#include <optional>
#include <stdexcept>
#include <utility>
#include <vector>

// A separate-chaining hash table. Doubles its bucket count when
// size * 4 > bucket_count * 3 after an insert.
template <typename K, typename V, typename Hash = std::hash<K>>
class HashMap {
public:
    explicit HashMap(std::size_t buckets = 8) : buckets_(buckets == 0 ? 1 : buckets) {}

    // Inserts the key, or updates its value if it is already present.
    void put(const K& key, const V& value) { throw std::logic_error("not implemented"); }
    // The value for key, or std::nullopt.
    std::optional<V> get(const K& key) const { throw std::logic_error("not implemented"); }
    // Removes key; returns whether it was present.
    bool remove(const K& key) { throw std::logic_error("not implemented"); }
    bool contains(const K& key) const { throw std::logic_error("not implemented"); }
    std::size_t size() const { throw std::logic_error("not implemented"); }
    std::size_t bucket_count() const { throw std::logic_error("not implemented"); }

private:
    using Bucket = std::vector<std::pair<K, V>>;
    std::vector<Bucket> buckets_;
    std::size_t size_ = 0;
    Hash hash_;
};
'''
