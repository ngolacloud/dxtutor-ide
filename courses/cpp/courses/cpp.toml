]
explanation = '''
The program prints `3 -> index 1 (found)`, `4 -> index 4 (missing)`, `0 -> index 0 (missing)`,
`20 -> index 6 (missing)` and `matches std::lower_bound: true`. For 3 the search lands on the
first of the three 3s, because an equal element moves `hi` left rather than stopping. For 4 it
returns 4, where 4 would be inserted before 8. For 20 it returns `v.size()`, one past the end,
so the `i < v.size()` test must come before `v[i]` or the read would be out of bounds. The range
shrinks every iteration (`lo` grows or `hi` drops below the old `mid + 1`), so the loop always
terminates, after at most about log₂ n + 1 steps.
'''

