title = "The BST property and O(h)"
points = 5
difficulty = 32
intro = '''
The BST property is an invariant: left subtree smaller, right subtree larger, at every node.
Every operation is a single walk from the root that relies on it, so the cost of each one is
the length of that walk, the height of the tree.
'''
body = '''
## One rule at every node

For every node `n`: keys in `n->left` are smaller than `n->key`, keys in `n->right` are larger.
The rule is not just about the direct children; it holds for whole subtrees. That is what lets
a search throw away half of what remains at every step on a well-shaped tree.

```cpp
const Node* n = root.get();
while (n && n->key != key) n = key < n->key ? n->left.get() : n->right.get();
```

## Insert is a failed search

Search for the key. If you fall off the tree, the empty slot where the search stopped is
exactly where the key belongs: put a new node there. No existing node moves, and the BST
property still holds.

## The shape depends on the order

Insert `4 2 6 1 3 5 7` and you get a perfect tree of height 3. Insert `1 2 3 4 5 6 7` and each
key becomes the right child of the previous one: a chain of height 7. Same keys, very different
costs:

- balanced: height about log2 n, so 17 levels for 100,000 keys;
- degenerate: height n, so 100,000 levels, each operation O(n), and a recursion that deep
  overflows the stack.

## In-order gives sorted output

Visit the left subtree, then the node, then the right subtree. Because of the BST property,
this prints the keys in ascending order. It also gives a simple correctness check after any
modification: the in-order sequence must be strictly increasing.
'''

