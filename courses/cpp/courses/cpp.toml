instructions = '''
## Your turn

Complete the class `IntList`, a singly linked list of `int` with `std::unique_ptr` nodes:

```cpp
class IntList {
public:
    IntList() = default;
    ~IntList();
    IntList(IntList&& other) noexcept;
    IntList& operator=(IntList&& other) noexcept;
    void push_front(int value);
    void push_back(int value);
    int pop_front();
    void reverse();
    std::size_t size() const;
    bool empty() const;
    std::vector<int> to_vector() const;
};
```

Rules:

- `push_front` and `push_back` are **O(1)**: keep the private `tail_` pointer up to date,
  including when the list becomes empty.
- `pop_front` removes and returns the first value. On an empty list it throws
  `std::out_of_range`.
- `reverse` reverses the list **in place** in O(n): relink the existing nodes, create none,
  and don't change any `value`. Afterwards `push_back` must still append at the (new) end.
- `to_vector` returns the values from front to back.
- Moving a list transfers its nodes in O(1). The moved-from list must be empty and usable.
  Move assignment frees the target's old nodes first.
- The destructor, and move assignment, must free **1,000,000 nodes** without overflowing the
  stack. The default, recursive destruction of a `unique_ptr` chain does not.
- Copying is deleted (already done in the starter).

Example:

```cpp
IntList l;
l.push_back(2); l.push_back(3); l.push_front(1);   // 1 2 3
l.reverse();                                       // 3 2 1
l.push_back(0);                                    // 3 2 1 0
l.pop_front();                                     // returns 3
```

**Hint:** reversal keeps three owning pointers: the part already reversed, the current node,
and the rest. Take the rest out of the current node *before* you overwrite its `next`.

Hidden tests decide correctness.
'''
