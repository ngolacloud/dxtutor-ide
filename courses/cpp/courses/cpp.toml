[[unit.step]]
kind = "challenge"
id = "cpp-u13-x1-parse-int"
title = "Parse an int without undefined behaviour"
points = 30
difficulty = 13
entry = "parse_int"
intro = '''
Parsing text into numbers is where many real security bugs start: an unchecked accumulator
overflows, which in C++ is undefined behaviour, and the program carries on with garbage. A
correct parser validates every character, detects overflow before it happens, and reports each
kind of failure in a way the caller cannot ignore.
'''
instructions = '''
## Your turn

Implement two functions:

```cpp
enum class ParseError { Empty, InvalidChar, Overflow };
using ParseResult = std::variant<int, ParseError>;

ParseResult parse_int(std::string_view text);
int parse_int_or_throw(std::string_view text);
```

`parse_int` reads the **whole** of `text` as a base-10 `int`. The accepted format is an optional
sign (`+` or `-`) followed by one or more digits `0`–`9`, and nothing else: no spaces, no
decimal point, no second sign. It returns:

- the value, when the text is valid and fits in an `int`;
- `ParseError::Empty`, when `text` is empty;
- `ParseError::InvalidChar`, when the text has any character that breaks the format, including a
  sign with no digits after it;
- `ParseError::Overflow`, when the format is valid but the value is outside
  `[INT_MIN, INT_MAX]`.

`parse_int_or_throw` applies the same rules but returns the `int` directly and reports failure
with exceptions: `std::invalid_argument` for `Empty` and `InvalidChar`, `std::out_of_range` for
`Overflow`.

Examples:

- `"42"` → `42`, `"+7"` → `7`, `"-0"` → `0`, `"007"` → `7`
- `"-2147483648"` → `-2147483648`, `"2147483648"` → `Overflow`
- `""` → `Empty`, `"-"` → `InvalidChar`, `" 42"` → `InvalidChar`, `"4.0"` → `InvalidChar`

Rules:

- No undefined behaviour: never let an `int` (or any signed type) overflow. Inputs can be
  100,000 characters long, and a long run of leading zeros is still a small number.
- `std::from_chars` (in `<charconv>`) parses digits and reports overflow safely, but it does not
  accept a leading `+`. Writing the digit loop yourself with an overflow check is fine too.

Hidden tests decide correctness.
'''
starter = '''
#include <stdexcept>
#include <string_view>
#include <variant>

enum class ParseError { Empty, InvalidChar, Overflow };
using ParseResult = std::variant<int, ParseError>;

// Parses the whole text as a base-10 int: an optional '+' or '-', then digits only.
// Returns the value, or the ParseError explaining why it cannot.
ParseResult parse_int(std::string_view text) {
    throw std::logic_error("not implemented");
}

// Same rules, but reports failure with exceptions:
// Empty or InvalidChar -> std::invalid_argument, Overflow -> std::out_of_range.
int parse_int_or_throw(std::string_view text) {
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <limits>
#include <stdexcept>
#include <string>

TEST(parses_plain_numbers) {
    CHECK_EQ(parse_int("42"), ParseResult{42});
    CHECK_EQ(parse_int("0"), ParseResult{0});
    CHECK_EQ(parse_int("7"), ParseResult{7});
    CHECK_EQ(parse_int("123456789"), ParseResult{123456789});
}

TEST(handles_signs) {
    CHECK_EQ(parse_int("-15"), ParseResult{-15});
    CHECK_EQ(parse_int("+7"), ParseResult{7});
    CHECK_EQ(parse_int("-0"), ParseResult{0});
    CHECK_EQ(parse_int("+0"), ParseResult{0});
    CHECK_EQ(parse_int("007"), ParseResult{7});
}

TEST(empty_input) {
    CHECK_EQ(parse_int(""), ParseResult{ParseError::Empty});
}

TEST(rejects_bad_characters) {
    const ParseResult bad{ParseError::InvalidChar};
    CHECK_EQ(parse_int("-"), bad);
    CHECK_EQ(parse_int("+"), bad);
    CHECK_EQ(parse_int(" 42"), bad);
    CHECK_EQ(parse_int("42 "), bad);
    CHECK_EQ(parse_int("4.0"), bad);
    CHECK_EQ(parse_int("12a"), bad);
    CHECK_EQ(parse_int("abc"), bad);
    CHECK_EQ(parse_int("+-5"), bad);
    CHECK_EQ(parse_int("--5"), bad);
    CHECK_EQ(parse_int("5-"), bad);
    CHECK_EQ(parse_int("0x10"), bad);
}

TEST(int_limits_are_exact) {
    const int max = std::numeric_limits<int>::max();
    const int min = std::numeric_limits<int>::min();
    CHECK_EQ(parse_int(std::to_string(max)), ParseResult{max});
    CHECK_EQ(parse_int(std::to_string(min)), ParseResult{min});
    CHECK_EQ(parse_int("+" + std::to_string(max)), ParseResult{max});
    const ParseResult over{ParseError::Overflow};
    CHECK_EQ(parse_int(std::to_string(static_cast<long long>(max) + 1)), over);
    CHECK_EQ(parse_int(std::to_string(static_cast<long long>(min) - 1)), over);
    CHECK_EQ(parse_int("99999999999999999999999999"), over);
    CHECK_EQ(parse_int("-99999999999999999999999999"), over);
}

TEST(very_long_inputs) {
    std::string zeros(100000, '0');
    CHECK_EQ(parse_int(zeros), ParseResult{0});
    CHECK_EQ(parse_int(zeros + "123"), ParseResult{123});
    CHECK_EQ(parse_int("-" + zeros + "9"), ParseResult{-9});
    CHECK_EQ(parse_int(std::string(100000, '9')), ParseResult{ParseError::Overflow});
    CHECK_EQ(parse_int(zeros + "x"), ParseResult{ParseError::InvalidChar});
}

TEST(or_throw_returns_values) {
    CHECK_EQ(parse_int_or_throw("-15"), -15);
    CHECK_EQ(parse_int_or_throw("+2024"), 2024);
}

TEST(or_throw_reports_with_exceptions) {
    bool empty_invalid = false;
    try {
        parse_int_or_throw("");
    } catch (const std::invalid_argument&) {
        empty_invalid = true;
    }
    CHECK(empty_invalid);
    bool char_invalid = false;
    try {
        parse_int_or_throw("12a");
    } catch (const std::invalid_argument&) {
        char_invalid = true;
    }
    CHECK(char_invalid);
    bool range = false;
    try {
        parse_int_or_throw("3000000000");
    } catch (const std::out_of_range&) {
        range = true;
    }
    CHECK(range);
}
'''

[unit.step.gabarito]
solution = '''
#include <charconv>
#include <cstddef>
#include <stdexcept>
#include <string_view>
#include <system_error>
#include <variant>

enum class ParseError { Empty, InvalidChar, Overflow };
using ParseResult = std::variant<int, ParseError>;

ParseResult parse_int(std::string_view text) {
    if (text.empty()) {
        return ParseError::Empty;
    }
    const std::size_t first_digit = (text[0] == '+' || text[0] == '-') ? 1 : 0;
    if (first_digit == text.size()) {
        return ParseError::InvalidChar;
    }
    for (std::size_t i = first_digit; i < text.size(); ++i) {
        if (text[i] < '0' || text[i] > '9') {
            return ParseError::InvalidChar;
        }
    }
    if (text[0] == '+') {
        text.remove_prefix(1);
    }
    int value = 0;
    const auto result = std::from_chars(text.data(), text.data() + text.size(), value);
    if (result.ec == std::errc::result_out_of_range) {
        return ParseError::Overflow;
    }
    return value;
}

int parse_int_or_throw(std::string_view text) {
    const ParseResult result = parse_int(text);
    if (const int* value = std::get_if<int>(&result)) {
        return *value;
    }
    if (std::get<ParseError>(result) == ParseError::Overflow) {
        throw std::out_of_range("integer out of range");
    }
    throw std::invalid_argument("not an integer");
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
Let *n* be the length of the text. The validation loop looks at each character once, and
`std::from_chars` makes one more pass over the digits, so the time is **O(n)**: two linear passes
are still linear. Nothing is allocated. `std::string_view` is a pointer and a length, and
`remove_prefix` only moves the pointer, so the extra space is **O(1)** regardless of the input
size. `parse_int_or_throw` adds one call and a constant amount of work on top.

Correctness rests on the order of the checks. Validating the whole format first means
`from_chars` only ever sees an optional `-` followed by digits, so the only way it can fail is
`result_out_of_range`; that also rules out inputs such as `+-5`, which `from_chars` would
otherwise happily read as `-5` after the `+` is dropped. `from_chars` detects overflow internally
without ever overflowing, and it reads leading zeros without trouble, so 100,000 zeros followed
by `123` give 123. A hand-written alternative must check `value > (INT_MAX - digit) / 10`
*before* multiplying (and treat `INT_MIN`, whose magnitude does not fit in an `int`, with care);
accumulating first and checking afterwards is too late, because the overflow itself is already
undefined behaviour. A shortcut such as "more than 10 characters means overflow" is wrong too:
it rejects long runs of leading zeros.
'''

[[unit]]
id = "cpp-u14-algorithms-lambdas"
title = "Algorithms, lambdas & ranges"
level = "intermediate"
difficulty = 14
intro = '''
The standard library ships more than a hundred tested, optimised algorithms (sorting, searching,
counting, transforming), and lambdas let you plug your own rules into them in one line. You will
sort with custom comparators, capture variables by value and by reference, compose lazy pipelines
with `std::ranges` views, and finish by building a leaderboard from a filter, a sort and a
transform.
'''
concepts = '''
## The idea

Most loops you write fall into a handful of patterns: find the first element that matches, count
the ones that do, sort by some rule, copy the ones you want, turn each element into something
else. The `<algorithm>` header names those patterns. A call such as `std::count_if` says *what*
you are doing, it is already debugged, and it is often faster than a hand-written loop. What
varies between uses is the rule ("is it negative?", "does a come before b?"), and a **lambda**
is how you write that rule inline.

## How C++ does it

Classic algorithms take a pair of **iterators**, `[first, last)`, plus an optional function
object:

```cpp
#include <algorithm>

std::sort(v.begin(), v.end());                                  // ascending
std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; }); // descending
auto n = std::count_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; });
```

A lambda `[captures](parameters) { body }` creates an unnamed function object. The **capture
list** decides which local variables it can use: `[limit]` copies `limit` when the lambda is
created, `[&total]` refers to the caller's `total`, `[=]` and `[&]` capture everything used, by
value or by reference. A lambda that modifies its own copies must be declared `mutable`.

C++20 **ranges** take the container itself and add **projections** and **views**:

```cpp
#include <ranges>

std::ranges::sort(people, {}, &Person::age);        // sort by a member
auto adults = people | std::views::filter([](const Person& p) { return p.age >= 18; });
```

A view is **lazy**: building the pipeline does no work, and elements are produced one at a time
as you iterate.

## Pitfalls

- **A comparator must be a strict weak ordering.** Use `<` or `>`, never `<=`: `std::sort`
  with `[](int a, int b) { return a <= b; }` is undefined behaviour and can crash or loop on
  equal elements.
- **Capturing by reference can dangle.** A lambda that captures a local by `&` and outlives the
  function (returned, stored, or run on another thread) reads a dead variable. Capture by value
  when the lambda escapes.
- **`std::remove_if` does not remove.** It moves the kept elements forward and returns the new
  logical end; you must still `erase`. C++20's `std::erase_if(vec, pred)` does both.
- **Iterators from different containers**, or an end before a begin, are undefined behaviour.
  The ranges versions avoid that by taking the whole container.
- **Views can dangle too.** A view refers to its source; returning a view of a local vector
  hands the caller a reference to destroyed data.

## What you will practise

You will sort, count and search with lambdas, watch captures copy and share state, and chain
`filter` and `transform` views. The challenge filters, orders and trims a list of players into a
leaderboard, using a comparator with a tie-breaker.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u14-c1-lambdas"
title = "Lambdas: functions you write in place"
points = 5
difficulty = 14
intro = '''
A lambda expression is syntax for creating a **closure**: a function object that carries
copies of, or references to, variables from the scope where it was written. The compiler turns
each lambda into a small class with an `operator()`, so calling it is as cheap as calling an
ordinary inline function.
'''
body = '''
## The shape

```cpp
auto is_even = [](int x) { return x % 2 == 0; };
bool b = is_even(4);   // true
```

- `[]` is the **capture list**: which outside variables the body may use.
- `(int x)` are the parameters, as in any function.
- `{ ... }` is the body. The return type is deduced from `return`, or written as
  `-> type` after the parameters.

Every lambda has its own unique, unnamed type, which is why you store it with `auto`, pass it to
a template such as `std::sort`, or wrap it in `std::function` when you need one type for many
different callables.

## Captures

```cpp
int limit = 10;
auto above = [limit](int x) { return x > limit; };  // copies limit now
int total = 0;
auto add = [&total](int x) { total += x; };          // refers to total
auto next = [n = 0]() mutable { return ++n; };       // its own private counter
```

A by-value capture is a snapshot taken when the lambda is created; later changes to `limit` do
not affect `above`. A by-reference capture sees, and can change, the original, so the original
must outlive the lambda. An **init-capture** such as `n = 0` creates a new variable owned by the
closure, and `mutable` allows the body to change it.

## Why it matters

Algorithms are generic: `std::sort` knows how to sort but not what "before" means for your data.
A lambda supplies that meaning at the call site, next to the code that needs it. Because the
compiler sees the lambda's body, it can inline it into the algorithm, so this flexibility
usually costs nothing at run time.
'''

