        sqlite3_prepare_v2(db, "INSERT INTO orders (customer_id, status, total) VALUES (?, ?, ?)",
                           -1, &st, nullptr);
        const char* statuses[] = {"paid", "open", "void"};
        for (int i = 0; i < rows; ++i) {
            sqlite3_bind_int(st, 1, i % 50);
            sqlite3_bind_text(st, 2, statuses[i % 3], -1, SQLITE_STATIC);
            sqlite3_bind_int(st, 3, i * 7 % 1000);
            sqlite3_step(st);
            sqlite3_reset(st);
        }
        sqlite3_finalize(st);
        run("COMMIT");
    }
    ~OrdersDb() { sqlite3_close_v2(db); }
    OrdersDb(const OrdersDb&) = delete;
    OrdersDb& operator=(const OrdersDb&) = delete;
    void run(const char* sql) { sqlite3_exec(db, sql, nullptr, nullptr, nullptr); }
    std::string plan(const char* query) const {
        std::string sql = std::string("EXPLAIN QUERY PLAN ") + query, out;
        sqlite3_stmt* st = nullptr;
        sqlite3_prepare_v2(db, sql.c_str(), -1, &st, nullptr);
        while (sqlite3_step(st) == SQLITE_ROW) {
            if (!out.empty()) out += " | ";
            out += reinterpret_cast<const char*>(sqlite3_column_text(st, 3));
        }
        sqlite3_finalize(st);
        return out;
    }
    std::vector<int> totals(const char* query, int customer, const char* status) const {
        std::vector<int> out;
        sqlite3_stmt* st = nullptr;
        sqlite3_prepare_v2(db, query, -1, &st, nullptr);
        sqlite3_bind_int(st, 1, customer);
        if (status) sqlite3_bind_text(st, 2, status, -1, SQLITE_STATIC);
        while (sqlite3_step(st) == SQLITE_ROW) out.push_back(sqlite3_column_int(st, 0));
        sqlite3_finalize(st);
        std::sort(out.begin(), out.end());
        return out;
    }
    int count(const char* sql) const {
        sqlite3_stmt* st = nullptr;
        sqlite3_prepare_v2(db, sql, -1, &st, nullptr);
        int n = sqlite3_step(st) == SQLITE_ROW ? sqlite3_column_int(st, 0) : -1;
        sqlite3_finalize(st);
        return n;
    }
};

bool has(const std::string& text, const char* word) { return text.find(word) != std::string::npos; }

TEST(two_column_query_uses_covering_index) {
    OrdersDb t;
    CHECK(has(t.plan(Q_BOTH), "SCAN"));
    add_order_index(t.db);
    std::string detail = t.plan(Q_BOTH);
    CHECK(has(detail, "SEARCH"));
    CHECK(has(detail, "USING COVERING INDEX"));
    CHECK(has(detail, "customer_id=? AND status=?"));
}

TEST(customer_only_query_searches) {
    OrdersDb t;
    add_order_index(t.db);
    std::string detail = t.plan(Q_CUSTOMER);
    CHECK(detail.rfind("SEARCH", 0) == 0);
    CHECK(has(detail, "INDEX"));
    CHECK(!has(detail, "SCAN"));
}

TEST(calling_twice_is_safe) {
    OrdersDb t;
    add_order_index(t.db);
    add_order_index(t.db);
    CHECK(has(t.plan(Q_BOTH), "USING COVERING INDEX"));
}

TEST(results_are_unchanged) {
    OrdersDb t;
    std::vector<int> both = t.totals(Q_BOTH, 7, "paid");
    std::vector<int> customer = t.totals(Q_CUSTOMER, 7, nullptr);
    CHECK(!both.empty());
    add_order_index(t.db);
    CHECK(t.totals(Q_BOTH, 7, "paid") == both);
    CHECK(t.totals(Q_CUSTOMER, 7, nullptr) == customer);
    CHECK_EQ(t.count("SELECT COUNT(*) FROM orders"), 2000);
}

TEST(index_is_committed) {
    OrdersDb t;
    add_order_index(t.db);
    CHECK(sqlite3_get_autocommit(t.db) != 0);
    CHECK(t.count("SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND tbl_name = 'orders'") >= 1);
    CHECK(sqlite3_next_stmt(t.db, nullptr) == nullptr);
}

TEST(empty_table) {
    OrdersDb t(0);
    add_order_index(t.db);
    CHECK(has(t.plan(Q_BOTH), "USING COVERING INDEX"));
    CHECK(t.plan(Q_CUSTOMER).rfind("SEARCH", 0) == 0);
}

TEST(missing_table_throws) {
    OrdersDb t(0);
    t.run("DROP TABLE orders");
    bool threw = false;
    try {
        add_order_index(t.db);
    } catch (const std::runtime_error&) {
        threw = true;
    }
    CHECK(threw);
}
'''

[unit.step.gabarito]
solution = '''
#include <sqlite3.h>
#include <stdexcept>
#include <string>

void add_order_index(sqlite3* db) {
    // customer_id first: both queries filter on it, so both can seek (leftmost prefix).
    // status second: the first query seeks on both columns.
    // total last: the first query needs nothing else, so the index covers it.
    char* err = nullptr;
    int rc = sqlite3_exec(db,
                          "CREATE INDEX IF NOT EXISTS idx_orders_customer_status_total"
                          " ON orders (customer_id, status, total)",
                          nullptr, nullptr, &err);
    if (rc != SQLITE_OK) {
        std::string message = err ? err : sqlite3_errmsg(db);
        sqlite3_free(err);
        throw std::runtime_error(message);
    }
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Building the index sorts the **n** rows by `(customer_id, status, total)`: **O(n log n)**
once, and the index stores one entry per row: **O(n)** extra space on disk. Calling the
function again costs O(1), because `IF NOT EXISTS` sees the index and does nothing.

The payoff is in the queries. Each one now seeks in **O(log n)** and reads only its **k**
matching entries, instead of scanning all n rows. Column order is the design: `customer_id`
first, so both queries share the leftmost prefix and both can seek; `status` second, so the
first query narrows on both columns; `total` last, so the first query finds everything it
selects inside the index and never visits the table. The cost is paid on every write: each
`INSERT`, `UPDATE` or `DELETE` on `orders` must also update this B-tree, in O(log n).
'''

# ── g5-templates ────────────────────────────────────────────────────────────

[[unit]]
id = "cpp-u16-templates"
title = "Function templates & type deduction"
level = "advanced"
difficulty = 22
intro = '''
A template lets you write a function once and have the compiler stamp out a separate,
fully optimised version for every type you call it with. You will write function templates,
watch the compiler deduce `T` from the arguments, step in with explicit template arguments
when deduction is ambiguous, and finish with a generic `group_by` whose result type is
computed from the lambda you pass it.
'''
concepts = '''
## The idea

Plenty of functions don't care about the exact type they work on. "Return the larger of two
values" is the same algorithm for `int`, `double` and `std::string`. Writing three copies is
tedious and error-prone, and erasing the type (a `void*`, or a base class with virtual
calls) throws away type safety and speed.

A **function template** is a blueprint. You write the code once with a placeholder type,
and every time you call it with a new type, the compiler **instantiates** it: it generates
a real function for that type, type-checks it, and optimises it exactly like hand-written
code. There is no runtime cost and no boxing. This is the opposite of Java's generics,
which erase the type, and of Python's duck typing, which checks it at run time.

## How C++ does it

```cpp
template <typename T>
T larger(T a, T b) {
    return (a < b) ? b : a;
}

larger(3, 7);            // T = int
larger(2.5, 1.0);        // T = double
larger<double>(3, 4.5);  // explicit: T = double, and 3 converts
```

The compiler works out `T` by **template argument deduction**: it matches each parameter
type against the type of the argument. A few rules cover most cases:

- With a by-value parameter `T`, top-level `const` and references are dropped, and arrays
  decay to pointers. Passing a `const int&` deduces `int`.
- With `const T&`, the `const` belongs to the parameter, so `T` is deduced without it.
- Deduction performs **no implicit conversions**. `larger(3, 4.5)` fails, because `T` cannot
  be both `int` and `double`.

When types differ on purpose, use two parameters and let `auto` deduce the return type:

```cpp
template <typename A, typename B>
auto add(A a, B b) { return a + b; }   // add(1, 2.5) is a double
```

A function with an `auto` parameter, such as `auto twice(auto x)`, is shorthand for a
template too. Templates can also take values: `template <std::size_t N>` receives a
compile-time number, which is how `std::array<int, 3>` knows its size.

## What is special or tricky

- **Templates live in headers.** The compiler needs the full definition wherever the
  template is used, so you define it, not just declare it. Declaring a template in a header
  and defining it in a `.cpp` gives `undefined reference` link errors.
- **Errors appear at instantiation.** If `T` lacks an operation the body uses, such as `<`,
  you get a long error pointing inside the template. Look for the `required from here` line:
  it shows your call. Unit 24's concepts make these errors short.
- **`deduced conflicting types for parameter 'T'`** means two arguments disagree. Convert one,
  or write `larger<double>(…)`.
- **String literals deduce `const char*`.** `larger("pear", "apple")` compares two pointers,
  not the text. Pass `std::string` or `std::string_view` instead.
- **Dependent names need `typename`.** Inside a template, `Container::value_type` might be a
  value or a type, so you write `typename Container::value_type` to say it is a type.
- Each instantiation is separate machine code, so a template used with twenty types adds
  twenty functions to the binary.

## What you will practise

You will write `larger` for several types, a `total` that works on any container, and
variadic templates that fold over any number of arguments. The challenge is a generic
`group_by` whose key type is deduced from the function you pass in.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u16-c1-blueprints"
title = "Templates are blueprints"
points = 5
difficulty = 22
intro = '''
A template is not code the compiler runs. It is a recipe the compiler follows to write code
for you, once per distinct set of template arguments. Knowing when that happens, and how the
arguments are found, explains almost every template error you will meet.
'''
body = '''
## Writing a template

```cpp
template <typename T>
T square(T x) {
    return x * x;
}
```

`template <typename T>` introduces a **template parameter** named `T`. (`class T` means the
same thing.) Until someone calls `square`, the compiler only checks the parts of the body
that don't depend on `T`.

## Instantiation

The first call `square(4)` makes the compiler deduce `T = int` and generate `int
square(int)`. A later `square(1.5)` generates a second function, `double square(double)`.
Calling `square(4)` again reuses the first one. Each instantiation is ordinary compiled code,
so a template is as fast as a hand-written overload.

## Deduction at a glance

| call | parameter | deduced `T` |
|---|---|---|
| `square(4)` | `T x` | `int` |
| `square(ci)` with `const int ci` | `T x` | `int` (top-level `const` dropped) |
| `show(ci)` | `const T& x` | `int` |
| `square("hi")` | `T x` | `const char*` (array decays) |
| `square<long>(4)` | `T x` | `long` (explicit, no deduction) |

## When deduction fails

Deduction never converts. If two arguments imply different types for the same `T`, the
call does not compile. Either name the type yourself, as in `larger<double>(3, 4.5)`, or
give the template two parameters. When the body uses an operation the type lacks, the error
appears only at instantiation, inside the template, followed by a `required from here` note
that points at your call.
'''

