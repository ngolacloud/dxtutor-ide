instructions = '''
## Your turn

Implement the function `next_page`:

```cpp
std::vector<std::pair<int, int>> next_page(sqlite3* db,
                                           std::optional<std::pair<int, int>> after,
                                           int size);
```

`db` holds this table, where many events can share the same `ts`:

```sql
CREATE TABLE events (id INTEGER PRIMARY KEY, ts INTEGER NOT NULL, name TEXT)
```

The list is ordered by `ts`, then by `id`. Return the next page of at most `size` rows as
`{ts, id}` pairs, in that order.

- `after` is empty for the first page; otherwise it is the `{ts, id}` of the last row of the
  previous page, so the caller can pass `page.back()` to get the next one.
- Return an empty vector when `size <= 0` or when nothing comes after the cursor.
- Use keyset pagination: no `OFFSET`. Ties in `ts` must never cause a row to be skipped or
  repeated. Bind every value, finalize your statement, and throw `std::runtime_error` if
  SQLite reports an error.

