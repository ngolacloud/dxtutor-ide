[[unit.step]]
kind = "challenge"
id = "cpp-u02-x1-average"
title = "Implement average"
points = 20
difficulty = 2
entry = "average"
intro = '''
Averaging two numbers looks trivial, but it hits the three classic number traps at once:
integer division throws away the half, and adding two large `int` values overflows before you
ever divide. Converting to a wider type **before** the arithmetic avoids both.
'''
instructions = '''
## Your turn

Implement the function `average`:

```cpp
double average(int a, int b);
```

It returns the **exact** average of `a` and `b` as a `double`.

Examples:

- `average(2, 4)` returns `3.0`
- `average(1, 2)` returns `1.5` (not `1`)
- `average(-3, -4)` returns `-3.5`
- `average(2147483647, 2147483647)` returns `2147483647.0`

Rules:

- The fraction must be kept: integer division is wrong here.
- `a` and `b` can be any `int` values, including the largest and smallest. `a + b` computed
  as `int` can overflow, which is undefined behaviour, so convert before you add.

Do not write a `main` function: the tests provide their own.

**Hint:** `static_cast<double>(a)` turns `a` into a `double`; arithmetic with a `double` on
either side is done in `double`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
#include <stdexcept>

// Return the exact average of a and b as a double.
double average(int a, int b) {
    throw std::logic_error("not implemented");
}
'''
tests = '''
#include <limits>
#include <type_traits>

TEST(even_sum) {
    CHECK_EQ(average(2, 4), 3.0);
    CHECK_EQ(average(10, 20), 15.0);
}

TEST(keeps_the_half) {
    CHECK_EQ(average(1, 2), 1.5);
    CHECK_EQ(average(7, 10), 8.5);
}

TEST(negative_numbers) {
    CHECK_EQ(average(-3, -4), -3.5);
    CHECK_EQ(average(-1, 2), 0.5);
    CHECK_EQ(average(-5, 5), 0.0);
}

TEST(equal_values_and_zero) {
    CHECK_EQ(average(7, 7), 7.0);
    CHECK_EQ(average(0, 0), 0.0);
}

TEST(largest_values_do_not_overflow) {
    const int hi = std::numeric_limits<int>::max();
    CHECK_EQ(average(hi, hi), 2147483647.0);
    CHECK_EQ(average(hi, hi - 1), 2147483646.5);
}

TEST(smallest_values_do_not_overflow) {
    const int lo = std::numeric_limits<int>::min();
    const int hi = std::numeric_limits<int>::max();
    CHECK_EQ(average(lo, lo), -2147483648.0);
    CHECK_EQ(average(hi, lo), -0.5);
}

TEST(returns_a_double) {
    CHECK((std::is_same_v<decltype(average(1, 2)), double>));
}
'''
[unit.step.gabarito]
solution = '''
// Return the exact average of a and b as a double.
double average(int a, int b) {
    return (static_cast<double>(a) + static_cast<double>(b)) / 2.0;
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function does two conversions, one addition and one division, whatever the values, so
the time is **O(1)**; it uses no memory beyond a couple of temporaries, so the space is
**O(1)**.

Correctness is the interesting part. Converting both operands to `double` *before* adding
means the sum is computed in floating point, so it cannot overflow: a `double` represents
every `int`, and every sum of two `int` values, exactly (it has 53 bits of precision, and
the sum needs at most 33). Dividing that exact sum by `2.0` only shifts the exponent, so the
result is exact too, including the `.5` cases. Writing `(a + b) / 2` would fail twice:
integer division drops the half, and `a + b` overflows (undefined behaviour) for large values.
'''

[[unit]]
id = "cpp-u03-strings"
title = "std::string & std::string_view"
level = "basic"
difficulty = 3
intro = '''
Text is everywhere: names, messages, file names, commands. This unit introduces
`std::string`, which owns and manages its characters, and `std::string_view`, a cheap
read-only window onto characters someone else owns, together with the methods you will use
every day to search, cut and compare text.
'''
concepts = '''
## The idea

A **string** is a sequence of characters. In memory it is a row of `char` values, one after
another, plus a length. Two questions matter for every piece of text in a C++ program: **who
owns the characters** (who allocates and frees the memory), and **who is just looking** at
them.

- `std::string` (from `<string>`) **owns** its characters. It allocates memory as it grows,
  copies them when you copy the string, and frees them automatically when the string goes
  away.
- `std::string_view` (from `<string_view>`) **does not own** anything. It is just a pointer
  to the first character and a length: a window onto text that lives somewhere else.
  Creating or copying one never copies the characters.

## How C++ does it

```cpp
std::string name = "Ada";
name += " Lovelace";                 // append: "Ada Lovelace"
std::size_t n = name.size();         // 12
char first = name[0];                // 'A'
std::string part = name.substr(4, 4);   // "Love": start at 4, take 4
std::size_t pos = name.find(' ');    // 3
bool same = (name == "Ada Lovelace");   // compares the characters
```

`find` returns the index of the first match, or the special value `std::string::npos` when
there is none. `rfind` searches from the end. Comparisons (`==`, `<`, ...) compare character
by character, by character code. C++20 adds `starts_with` and `ends_with`.
`std::to_string(42)` turns a number into text and `std::stoi("42")` turns text into an `int`.

A function that only **reads** text usually takes a `std::string_view` parameter: it accepts
a `std::string`, a string literal, or part of either, without copying.

## What is special or tricky

- **`"Hello, " + "world"` does not compile.** String literals are plain character arrays, not
  `std::string`. At least one side of `+` must be a `std::string`.
- **Check `find` against `npos`.** Never use the result as a `bool`: a match at index 0 is
  `0` (false), and `npos` is a huge number (true).
- **`s[i]` past the end is undefined behaviour.** `s.at(i)` checks the index and throws
  `std::out_of_range` instead.
- **Sizes are unsigned.** `size()` returns `std::size_t`, so `s.size() - 1` on an empty string
  wraps around to an enormous number instead of `-1`.
- **A view must not outlive its text.** `std::string_view v = std::string("temp");` points
  into a temporary string destroyed at the end of the line; using `v` afterwards is undefined
  behaviour. When you *build* new text, return a `std::string`.
- **Case matters in comparisons.** Uppercase letters have smaller codes, so `"Zebra" < "apple"`.

## What you will practise

You will build strings with `+` and `+=`, convert numbers to and from text, slice an email
address with `find` and `substr`, and inspect text through a `std::string_view`. The challenge
asks you to extract a file extension, handling paths and hidden files correctly. It needs one
`if`, which unit 4 covers in depth.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u03-c1-owning-viewing"
title = "Owning text and viewing text"
points = 5
difficulty = 3
intro = '''
Strings are the first place where C++ makes you think about **ownership**: which object is
responsible for a block of memory. `std::string` owns a buffer on the heap and frees it
automatically; `std::string_view` only borrows a pointer and a length, which makes it free to
copy but dangerous to keep longer than the text it points at.
'''
body = '''
## std::string owns its characters

```cpp
std::string greeting = "Hello";
greeting += ", world";      // the string grows its own buffer
std::string copy = greeting; // a second, independent buffer
copy[0] = 'J';               // greeting is still "Hello, world"
```

A `std::string` keeps its characters in memory it manages itself. Copying a string copies the
characters, so the two strings are independent. When a string goes out of scope, its memory
is released for you: no manual cleanup.

## std::string_view looks at someone else's characters

```cpp
std::string title = "main.cpp";
std::string_view view = title;               // no copy
std::string_view stem = view.substr(0, 4);   // "main", still no copy
```

A view is just "start here, this many characters". `substr` on a view returns another view,
so slicing costs nothing. That makes `std::string_view` the natural type for parameters of
functions that only read text.

The price is responsibility: the view does not keep the text alive. If `title` is destroyed
or modified, `view` and `stem` may point at garbage, and reading them is undefined behaviour.

## Indexes and npos

Characters are numbered from 0, so the last one is at `size() - 1`. Searching methods return
an index, or `npos` ("no position") when nothing matches:

```cpp
if (title.find('.') != std::string::npos) {
    // there is a dot somewhere
}
```
'''

