  "A `bool` is either `true` or `false`.",
  "`auto` deduces the type from the value: `2026` is an `int`, so `year` is an `int`.",
  "`const` makes `pi` read-only; any later assignment to it would not compile.",
  "",
  "Prints the label, then the number 36.",
  "Prints 1.68.",
  "A `char` prints as the character itself, `A`.",
  "By default a `bool` prints as `1` (true) or `0` (false).",
