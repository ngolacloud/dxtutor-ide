[unit.step.gabarito]
solution = '''
#include <algorithm>
#include <cstddef>
#include <sstream>
#include <string>
#include <unordered_map>
#include <utility>
#include <vector>

using WordCount = std::pair<std::string, int>;

bool ranks_before(const WordCount& a, const WordCount& b) {
    if (a.second != b.second) {
        return a.second > b.second;
    }
    return a.first < b.first;
}

std::vector<WordCount> top_words(const std::string& text, std::size_t k) {
    std::unordered_map<std::string, int> counts;
    std::istringstream in(text);
    std::string word;
    while (in >> word) {
        ++counts[word];
    }

    std::vector<WordCount> ranking(counts.begin(), counts.end());
    const std::size_t m = std::min(k, ranking.size());
    std::partial_sort(ranking.begin(), ranking.begin() + m, ranking.end(), ranks_before);
    ranking.resize(m);
    return ranking;
}
'''
time = "O(n + d log k)"
space = "O(n)"
justification = '''
Let n be the length of the text and d the number of distinct words. Splitting reads every
character once, and each `++counts[word]` hashes the word, so counting is **O(n)** on
average in total. Copying the d entries into a vector is O(d). `std::partial_sort` places
only the best `m = min(k, d)` entries in order, which costs **O(d log m)**; a full
`std::sort` would cost O(d log d), the same when k is close to d. Since d ≤ n, the total is
**O(n + d log k)**.

The map and the vector each hold at most d words whose characters add up to at most n, so the
extra space is **O(n)**.

The comparison function defines a strict total order: higher count first and, for equal
counts, the smaller string first. Because no two distinct words compare equal, the result
does not depend on the unspecified iteration order of the `unordered_map`. Without the
tie-break, words with equal counts could come out in a different order on another compiler.
'''

[[unit]]
id = "cpp-u10-classes"
title = "Classes & encapsulation"
level = "intermediate"
difficulty = 10
intro = '''
A class bundles data with the operations that keep it valid, so the rest of the program
cannot put it into a broken state. You will write structs and classes, initialise members
properly with constructor initializer lists, mark read-only member functions `const`, and
hide the representation behind a small public interface.
'''
concepts = '''
## The idea

Loose variables cannot protect themselves. If a fraction is just two `int`s, nothing stops
some line of code from setting its denominator to zero. A **class** groups **data members**
with **member functions** and controls who may touch the data. The rules that every valid
object must satisfy are its **invariants**. A class establishes them in its constructor and
preserves them in every public member function, so no outside code can break them. That is
**encapsulation**.

## How C++ does it

`struct` and `class` are the same feature with one difference: members of a `struct` are
`public` by default, members of a `class` are `private`. By convention, use `struct` for
simple bundles of data with no invariant, and `class` when there is something to protect.

```cpp
struct Size {
    int width = 0;          // default member initialisers
    int height = 0;
};
Size s{640, 480};           // aggregate initialisation
Size t{.height = 10};       // C++20 designated initialisers; width is 0

class Thermostat {
public:
    explicit Thermostat(double target) : target_(clamp(target)) {}
    double target() const { return target_; }
    void raise(double by) { target_ = clamp(target_ + by); }

private:
    static double clamp(double t) { return t < 5 ? 5 : (t > 30 ? 30 : t); }
    double target_;
};
```

The part after the colon, `: target_(clamp(target))`, is the **member initializer list**. It
initialises members directly, before the constructor body runs. Assigning in the body
instead first default-constructs each member and then overwrites it, and it is impossible
for `const` members, references and types that have no default constructor.

`explicit` stops a one-argument constructor from acting as a silent conversion: without it,
`Thermostat t = 21.0;` would compile, and so would passing a bare `double` to a function that
expects a `Thermostat`.

## const member functions

A member function marked `const` promises not to modify the object. Only `const` member
functions can be called on a `const` object or through a `const&`, which is how objects are
usually passed around. Forgetting `const` on a getter produces one of the first errors
beginners meet: "passing 'const Thermostat' as 'this' argument discards qualifiers".

## Pitfalls

- Members are initialised in **declaration order**, not in initializer-list order. If `b_` is
  initialised from `a_` but declared before it, `b_` reads an indeterminate value. GCC's
  `-Wreorder` warns about the mismatch.
- A member of built-in type without an initialiser (`int count;`) holds an indeterminate
  value, and reading it is undefined behaviour. Give every member a default.
- A class definition ends with `};`. Forgetting the semicolon gives confusing errors on the
  following line.
- Public data members make every invariant optional. Keep data private and offer operations.
- A getter and a setter for every field is not encapsulation; it only renames assignment.

## What you will practise

You will build an aggregate with designated initialisers, a class whose constructor
validates its arguments in an initializer list, and an account whose balance changes only
through its member functions. The challenge is a `Fraction` class that always keeps itself
in lowest terms.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u10-c1-invariants"
title = "Invariants: what a class promises"
points = 5
difficulty = 10
intro = '''
An invariant is a condition that holds for every object of a class whenever outside code can
look at it. Private data, a validating constructor and member functions that preserve the
condition are the three pieces that make it hold.
'''
body = '''
## An example

Suppose a `Range` must always satisfy `lo <= hi`. With public members, any line anywhere
can break that rule. With a class, only the class's own code can touch the data:

```cpp
class Range {
public:
    Range(int a, int b) : lo_(a < b ? a : b), hi_(a < b ? b : a) {}
    int length() const { return hi_ - lo_; }
    void extend_to(int x) {
        if (x < lo_) lo_ = x;
        if (x > hi_) hi_ = x;
    }

private:
    int lo_;
    int hi_;
};
```

The constructor **establishes** the invariant: whatever order the arguments arrive in, `lo_`
ends up the smaller. `extend_to` **preserves** it: each branch can only move `lo_` down or
`hi_` up. And because `lo_` and `hi_` are private, nothing else can modify them, so
`length()` never has to check for a negative answer.

## Two ways to react to bad input

A constructor cannot return an error code. When the arguments make a valid object
impossible, it either repairs them, as `Range` does by swapping, or **throws an exception**,
such as `std::invalid_argument`, so the object never exists at all. Either way, no invalid
object escapes.

## this

Inside a member function, `this` is a pointer to the object the function was called on, and
`lo_` is shorthand for `this->lo_`. In a `const` member function, `this` points to a `const`
object, which is exactly why such a function cannot assign to members.
'''

