target = '''
#include <iostream>
#include <numeric>
#include <thread>
#include <vector>

int main() {
    std::vector<int> data(1'000'000);
    std::iota(data.begin(), data.end(), 1);
    const std::size_t parts = 4;
    const std::size_t n = data.size();
    std::vector<long long> partial(parts, 0);
    std::vector<std::jthread> workers;
    for (std::size_t p = 0; p < parts; ++p) {
        std::size_t begin = p * n / parts;
        std::size_t end = (p + 1) * n / parts;
        workers.emplace_back([&data, &partial, p, begin, end] {
            long long sum = 0;
            for (std::size_t i = begin; i < end; ++i) sum += data[i];
            partial[p] = sum;
        });
    }
    workers.clear();
    long long total = std::accumulate(partial.begin(), partial.end(), 0LL);
    std::cout << "total    = " << total << '\n';
    std::cout << "expected = " << n * (n + 1) / 2 << '\n';
}
