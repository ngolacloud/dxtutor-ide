intro = '''
`<<` is the **stream insertion operator**: it sends the value on its right into the stream on
its left and gives the stream back, so several `<<` can be chained in one statement. It
works for text, whole numbers and decimal numbers alike. Arithmetic runs before printing, and
whole numbers divide differently from decimal ones.
'''
