[[unit]]
id = "cpp-u07-references-pointers"
title = "References & pointers"
level = "intermediate"
difficulty = 7
intro = '''
Every C++ object lives somewhere in memory, and this unit is about reaching the same object
by more than one name. You will meet **references**, which are permanent aliases, and
**pointers**, which are addresses you can test, move around and set to `nullptr`. Along the
way you will learn where objects live, on the stack or on the heap, and how `const` records
who is allowed to change what.
'''
concepts = '''
## The idea

A variable names an **object**: a region of memory that holds a value of some type. Often
you want a second way to reach that same object without copying it, so that a function can
change its caller's variable, or read a large vector without duplicating it. C++ gives you
two tools. A **reference** is another name for an existing object. A **pointer** is a value
that holds the **address** of an object.

## How C++ does it

```cpp
int score = 10;
int& alias = score;   // a reference: bound once, never reseated
alias += 5;           // score is now 15
int* p = &score;      // & takes the address of score
*p = 20;              // * dereferences: score is now 20
p = nullptr;          // a pointer may point at nothing
```

A reference must be initialised when it is declared and always refers to the same object;
there is no "null reference". A pointer is an ordinary variable: it can be reassigned,
compared and set to `nullptr`, so code must check it before dereferencing.

`const` says what may not change. A `const std::string&` parameter lets a function read a
string without copying it and without being able to modify it. With pointers, read the
declaration from right to left: `const int* p` is a pointer to a const `int` (you cannot
write `*p`), while `int* const q` is a const pointer (you cannot make `q` point elsewhere).

## The stack and the heap

Local variables live on the **stack**. They are created when execution reaches them and
destroyed automatically when their scope ends, which is fast and safe. Objects created with
`new` live on the **heap** (the free store) until someone calls `delete`:

```cpp
int* n = new int(42);
std::cout << *n << '\n';
delete n;             // forget this line and the memory leaks
```

Modern C++ rarely writes `new` and `delete` by hand: containers and smart pointers (unit 12)
own heap memory for you. Raw pointers still matter, because they are used everywhere as
non-owning *observers* of objects that someone else owns.

## Pitfalls

- **Dereferencing `nullptr`** or an uninitialised pointer is **undefined behaviour**: often a
  crash, sometimes silent corruption. Initialise every pointer, even if only to `nullptr`.
- **Dangling references and pointers.** Returning `&local`, or a reference to a local
  variable, hands the caller the address of an object that has already been destroyed. GCC
  warns about it; treat that warning as an error.
- A pointer or reference into a `std::vector` dangles as soon as the vector grows, because
  growing may move every element to a new block.
- Calling `delete` twice, or on memory that did not come from `new`, is undefined behaviour.
- `int& r;` does not compile: "'r' declared as reference but not initialized".

## What you will practise

You will swap two variables through references, follow a pointer that sometimes points at
nothing, and watch `const` block writes at compile time. The challenge asks you for a
function that returns a pointer *into* a vector, or `nullptr` when there is nothing to point
at, in both a mutable and a `const` version.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u07-c1-aliases-addresses"
title = "Aliases and addresses"
points = 5
difficulty = 7
intro = '''
References and pointers both let two names reach one object, but they promise different
things. A reference guarantees that an object exists; a pointer admits that it might not.
Choosing between them is part of a function's contract.
'''
body = '''
## Two ways to reach one object

```cpp
void bump(int& n) { ++n; }      // the caller writes bump(x)
void bump_ptr(int* n) {         // the caller writes bump_ptr(&x), or passes nullptr
    if (n != nullptr) {
        ++*n;
    }
}
```

Both functions change the caller's variable, but they say different things. A reference
parameter promises that there **is** an object, so the caller cannot pass "nothing". A
pointer parameter admits that there may be no object, so the function must check for
`nullptr` before it dereferences.

## Choosing

- Use a **reference** when the object must exist and the alias never changes: function
  parameters, range-for loops (`for (auto& x : v)`), returning an element of a container.
- Use a **pointer** when "no object" is a valid answer, or when the same variable must point
  at different objects over time, as when you walk through a data structure.
- Add `const` whenever you only read: `const T&` is the normal way to pass anything bigger
  than a couple of machine words.

## Value or identity?

`&x` gives the address of `x`, and `*p` gives the object at the address held in `p`. Two
pointers are equal when they hold the same address, which is how you check that two names
really refer to the *same object*, not merely to equal values:

```cpp
int a = 1;
int b = 1;
std::cout << (a == b) << (&a == &b);   // prints 10
```

Equal values, different objects. Keep that distinction in mind: it is the whole reason
references and pointers exist.
'''

