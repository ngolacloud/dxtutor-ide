target = '''
#include <sqlite3.h>
#include <iostream>
#include <memory>
#include <string>
#include <utility>

struct DbClose { void operator()(sqlite3* db) const { sqlite3_close(db); } };
struct StmtFinalize { void operator()(sqlite3_stmt* st) const { sqlite3_finalize(st); } };
using Stmt = std::unique_ptr<sqlite3_stmt, StmtFinalize>;

Stmt prepare(sqlite3* db, const char* sql) {
    sqlite3_stmt* raw = nullptr;
    sqlite3_prepare_v2(db, sql, -1, &raw, nullptr);
    return Stmt(raw);
}

int main() {
    sqlite3* raw = nullptr;
    sqlite3_open(":memory:", &raw);
    std::unique_ptr<sqlite3, DbClose> db(raw);
    sqlite3_exec(db.get(), "CREATE TABLE people (name TEXT, age INTEGER)", nullptr, nullptr, nullptr);
    Stmt insert = prepare(db.get(), "INSERT INTO people VALUES (?, ?)");
    const std::pair<std::string, int> rows[] = {{"Ana", 30}, {"Bo", 20}, {"O'Neil", 41}};
    for (const auto& [name, age] : rows) {
        sqlite3_bind_text(insert.get(), 1, name.c_str(), -1, SQLITE_TRANSIENT);
        sqlite3_bind_int(insert.get(), 2, age);
        sqlite3_step(insert.get());
        sqlite3_reset(insert.get());
    }
    Stmt find = prepare(db.get(), "SELECT age FROM people WHERE name = ?");
    for (const char* who : {"O'Neil", "Zed"}) {
        sqlite3_bind_text(find.get(), 1, who, -1, SQLITE_STATIC);
        if (sqlite3_step(find.get()) == SQLITE_ROW)
