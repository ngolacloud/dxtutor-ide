entry = "sliding_max"
instructions = '''
## Your turn

Implement `sliding_max`:

```cpp
std::vector<int> sliding_max(const std::vector<int>& nums, std::size_t k);
```

Slide a window of `k` consecutive elements across `nums`, from left to right, and return the
maximum of each window. There are `nums.size() - k + 1` windows.

- If `k` is larger than `nums.size()` (including an empty `nums`), return an empty vector.
- If `k == 0`, throw `std::invalid_argument`.
- It must run in **O(n)** time: the hidden tests include 200,000 numbers with `k = 10,000`,
  where rescanning every window is far too slow.
- Don't modify `nums`.

Examples:

- `sliding_max({1, 3, -1, -3, 5, 3, 6, 7}, 3)` returns `{3, 3, 5, 5, 6, 7}`
- `sliding_max({4, 2}, 1)` returns `{4, 2}`
- `sliding_max({1, 2}, 5)` returns `{}`

**Hint:** keep a `std::deque<std::size_t>` of *indices* whose values could still be the maximum
of some window, in decreasing order of value. The front is the current maximum; drop it once it
slides out of the window. A new element makes every smaller element at the back useless, because
it is both larger and will stay in the window longer.

Hidden tests decide correctness.
'''
