intro = '''
When a vector reallocates, it must transfer every element to the new buffer, and it promises the
**strong exception guarantee**: if anything throws, the vector is left exactly as it was. A move
that might throw halfway would break that promise, so `std::vector` only moves elements whose
move constructor is `noexcept`, and copies them otherwise.
'''
prompt = '''
Define two types that count their copies and moves, one with a `noexcept` move constructor and
one without, then force each vector to reallocate with `reserve(capacity() + 1)` and compare the
counts.

**Why:** a missing `noexcept` silently turns every vector growth into a full copy, and this
program shows the difference with numbers.
'''
target = '''
#include <iostream>
#include <type_traits>
#include <vector>

int copies = 0;
int moves = 0;

struct Risky {
    Risky() = default;
    Risky(const Risky&) { ++copies; }
    Risky(Risky&&) { ++moves; }
};

struct Safe {
    Safe() = default;
    Safe(const Safe&) { ++copies; }
    Safe(Safe&&) noexcept { ++moves; }
};

int main() {
    std::cout << std::boolalpha;
    std::cout << "Risky nothrow move: " << std::is_nothrow_move_constructible_v<Risky> << "\n";
    std::cout << "Safe nothrow move: " << std::is_nothrow_move_constructible_v<Safe> << "\n";
    std::vector<Risky> risky(3);
    std::vector<Safe> safe(3);
