title = "Evaluate postfix with std::stack"
points = 10
difficulty = 29
intro = '''
In **postfix** (reverse Polish) notation the operator comes after its operands: `3 4 + 2 *` means
`(3 + 4) * 2`. No parentheses are ever needed, and a stack evaluates it in one left-to-right pass:
numbers are pushed, and an operator pops two operands and pushes the result.
'''
placeholder_policy = "on_demand"
run_command = "g++ -std=c++20 -O2 main.cpp -o main && ./main"
prompt = '''
Write `eval_postfix` with a `std::stack<long long>` and evaluate two postfix expressions.

**Why:** this is how calculators, the JVM and many interpreters evaluate expressions, and it shows
the stack's key property: the most recent unfinished values are the ones you need next.
'''
target = '''
#include <iostream>
#include <sstream>
#include <stack>
#include <string>

long long eval_postfix(const std::string& expr) {
    std::stack<long long> st;
    std::istringstream in(expr);
    std::string tok;
    while (in >> tok) {
        if (tok == "+" || tok == "-" || tok == "*") {
            long long b = st.top();
            st.pop();
            long long a = st.top();
            st.pop();
            if (tok == "+") st.push(a + b);
            else if (tok == "-") st.push(a - b);
            else st.push(a * b);
        } else {
            st.push(std::stoll(tok));
        }
    }
    return st.top();
}

int main() {
    std::cout << eval_postfix("3 4 + 2 *") << '\n';
    std::cout << eval_postfix("10 2 8 * + 3 -") << '\n';
}
'''
