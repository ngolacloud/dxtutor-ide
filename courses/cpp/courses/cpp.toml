[unit.step.gabarito]
solution = '''
#include <cstddef>
#include <functional>
#include <optional>
#include <utility>
#include <vector>

template <typename K, typename V, typename Hash = std::hash<K>>
class HashMap {
public:
    explicit HashMap(std::size_t buckets = 8) : buckets_(buckets == 0 ? 1 : buckets) {}

    void put(const K& key, const V& value) {
        Bucket& bucket = buckets_[index(key)];
        for (auto& entry : bucket) {
            if (entry.first == key) {
                entry.second = value;
                return;
            }
        }
        bucket.emplace_back(key, value);
        ++size_;
        if (size_ * 4 > buckets_.size() * 3) rehash(buckets_.size() * 2);
    }

    std::optional<V> get(const K& key) const {
        for (const auto& entry : buckets_[index(key)]) {
            if (entry.first == key) return entry.second;
        }
        return std::nullopt;
    }

    bool remove(const K& key) {
        Bucket& bucket = buckets_[index(key)];
        for (auto& entry : bucket) {
            if (entry.first == key) {
                std::swap(entry, bucket.back());  // order inside a bucket is irrelevant
                bucket.pop_back();
                --size_;
                return true;
            }
        }
        return false;
    }

    bool contains(const K& key) const { return get(key).has_value(); }
    std::size_t size() const { return size_; }
    std::size_t bucket_count() const { return buckets_.size(); }

private:
    using Bucket = std::vector<std::pair<K, V>>;

    std::size_t index(const K& key) const { return hash_(key) % buckets_.size(); }

    void rehash(std::size_t new_count) {
        std::vector<Bucket> fresh(new_count);
        for (Bucket& bucket : buckets_) {
            for (auto& entry : bucket) {
                fresh[hash_(entry.first) % new_count].push_back(std::move(entry));
            }
        }
        buckets_ = std::move(fresh);
    }

    std::vector<Bucket> buckets_;
    std::size_t size_ = 0;
    Hash hash_;
};
'''
time = "O(1) average per operation (amortised for put); O(n) worst case"
space = "O(n)"
justification = '''
The table keeps `size <= 0.75 * bucket_count`, so the **average chain length is below one**
and `get`, `contains`, `remove` and an updating `put` inspect O(1) entries on average, plus
the cost of hashing the key. `remove` swaps the found entry with the last one of its bucket
and pops it, which is O(1) once found.

A `put` that crosses the threshold triggers a **rehash**: allocate twice as many buckets and
move every entry, O(n) for that one call. Because the count doubles, rehashes happen at sizes
about 6, 12, 24, …, n, and their costs form a geometric series that sums to less than 2n. Over
n inserts the total work is O(n), so `put` is **amortised O(1)**. Growing by a constant (say,
8 buckets each time) instead would make the series quadratic. Entries are *moved*, not copied,
during the rehash.

Space is **O(n)**: at most n entries, and the bucket array stays within a constant factor of
n. The worst case is O(n) per operation, reached when every key hashes to one bucket, as the
`ZeroHash` test shows; correctness never depends on the hash, only speed does.
'''

[[unit]]
id = "cpp-u26-binary-search-tree"
title = "Binary search trees"
level = "advanced"
difficulty = 32
intro = '''
A binary search tree keeps keys ordered by shape: everything smaller goes left, everything
larger goes right, so each comparison discards a whole subtree. You will insert keys into a
tree of `std::unique_ptr` nodes, read them back sorted, search with a loop, measure how the
insertion order decides the height, and finally delete keys in all three structural cases.
'''
concepts = '''
## The idea

A **binary search tree** (BST) is a tree of nodes where each node holds a key and up to two
children, and every node obeys the **BST property**: all keys in its left subtree are
smaller, and all keys in its right subtree are larger. That single rule makes searching
cheap. At each node you compare once and go left or right, discarding everything on the
other side.

Search, insert and delete all follow one path from the root down, so they cost **O(h)**,
where *h* is the height of the tree. The catch is that *h* depends on the insertion order:

- random insertion order gives a height around `2 ln n`, so about 40 levels for 100,000 keys;
- **sorted** insertion order gives a chain: every node has only a right child, the height is
  *n*, and the tree is a slow linked list.

Self-balancing trees (red-black, AVL) rotate nodes to keep *h* at O(log n). `std::map` and
`std::set` are red-black trees, which is why their operations are guaranteed O(log n) and
why iterating them yields keys in sorted order.

## How C++ does it

A node owns its children, so both links are `std::unique_ptr<Node>`. Insertion and search
can walk with a **pointer to the owning link**, which treats the root and every child link
the same way:

```cpp
struct Node {
    int key;
    std::unique_ptr<Node> left, right;
};

std::unique_ptr<Node>* link = &root;
while (*link && (*link)->key != key) {
    link = key < (*link)->key ? &(*link)->left : &(*link)->right;
}
// *link is the node holding key, or the empty slot where key belongs
```

An **in-order traversal** (left subtree, node, right subtree) visits the keys in ascending
order. It is the natural use of recursion on a tree, and it is how you check that a tree is
still a valid BST.

## What is special or tricky

- **Height means stack depth.** Recursive functions on a tree use one frame per level. On a
  random tree that is harmless; on a degenerate chain of 100,000 nodes, recursive insert,
  traversal or even the default destruction of the `unique_ptr` links can overflow the stack.
  Prefer loops for single-path operations such as search, insert and delete.
- **Dereferencing an empty child is undefined behaviour.** `node->left->key` crashes, or
  worse, when there is no left child. Test the pointer first.
- **Deleting a node with two children** cannot just unlink it: two subtrees would need one
  parent slot. The standard fix copies in the **in-order successor** (the smallest key of the
  right subtree) and deletes that node instead, which has at most one child.
- **Duplicates need a policy.** This unit ignores a key that is already present, like
  `std::set`.

## What you will practise

You will insert keys and print them in order, search iteratively while counting steps, and
compare the height of a balanced tree with a degenerate one. The challenge is deleting keys,
tested on 100,000 random keys.
'''

[[unit.step]]
