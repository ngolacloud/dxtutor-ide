id = "cpp-basics"
language = "cpp"
title = "C++: From Zero to Confident"
level = "beginner"
summary = "A serious, guided course in modern C++ that takes you from your very first program to the ideas that make C++ fast and safe: values and references, RAII, smart pointers, templates, concurrency. You read a short concept, build muscle memory by typing small, complete programs, then prove what you learned by writing real functions that hidden tests check."
overview = '''
## What C++ is

C++ is a compiled, statically typed language that gives you direct control over memory and
performance while still offering high-level tools: classes, templates and a rich standard
library. A compiler translates your code into machine code before it runs, with no
interpreter or garbage collector in the way. This course teaches **modern C++20**, which is
safer and clearer than the C++ of the past.

## Where it is used

C++ runs where speed and predictable resource use matter: game engines, web browsers,
database engines, high-frequency trading systems, compilers, and embedded software on devices
with little memory.

## The mental model you will build

- **Values and references.** Every variable has a type and a place in memory. You decide
  whether a function gets a copy or a reference to the original.
- **Ownership through RAII.** Every resource (memory, a file, a database connection, a lock)
  has one owner, whose destructor releases it automatically at the end of its scope.
- **Zero-cost abstractions.** Containers, algorithms, templates and lambdas compile to code
  as fast as the hand-written version, so clarity does not cost speed.
- **Undefined behaviour to avoid.** Uninitialised variables, indexing past
  the end, signed overflow and dangling references compile but break the rules; you will learn to
  recognise these traps and write code that cannot fall into them.

## How the course is organised

- **Basic:** your first program, variables and types, strings, decisions, loops, functions.
- **Intermediate:** references and pointers, vectors and maps, classes, RAII, smart pointers,
  error handling, algorithms and lambdas, move semantics, then SQLite through its C API,
  wrapped in RAII: transactions, WAL mode, the N+1 problem, pagination and indexes.
- **Advanced:** templates and C++20 concepts, operators and custom iterators, threads,
  mutexes, atomics and futures, and data structures and algorithms built by hand: stacks,
  queues, linked lists, hash tables, binary search trees, sorting, recursion and dynamic
  programming.

## How each unit works

Every unit opens with a **concept** step, a short reading on the idea and how C++ expresses
it. Three **drills** follow: you type small, complete programs line by line, guided by a
comment on every line, then compile and run them. Each unit ends with a **challenge**: you
write a real function or class, and hidden tests check it against normal and edge cases.
Once you pass, you can compare your code with a reference solution and its complexity
analysis.
'''

# ── g1-basic ────────────────────────────────────────────────────────────

[[unit]]
id = "cpp-u01-hello"
title = "Hello & iostream"
level = "basic"
difficulty = 1
intro = '''
Your very first steps in C++: what a program is, why C++ code must be **compiled** before it
can run, and how `std::cout` shows text on the screen. By the end you will write a tiny
greeting function and let the hidden tests check it.
'''
concepts = '''
## The idea

A computer does not understand English, or even C++. Its processor only runs **machine
code**: long sequences of numbers that mean "add these", "copy that", "jump there". A
**programming language** is a precise notation that people can read and that a tool can
turn into machine code.

C++ is a **compiled** language. You write your program as plain text in a **source file**
(for example `main.cpp`). A program called the **compiler** (in this course, `g++`) reads
the whole file, checks it, and translates it into an **executable**, a file of machine code.
Only then can you **run** the executable. So there are always two steps:

1. **Compile:** `g++ -std=c++20 main.cpp -o main` turns `main.cpp` into a program called `main`.
2. **Run:** `./main` starts that program.

Mistakes found in step 1 are **compile errors**: no executable is produced at all. Mistakes
in step 2 happen while the program runs. Compiling once and running many times is a big
reason C++ programs are fast: the translation work is done before the program starts.

## How C++ does it

```cpp
#include <iostream>

int main() {
    std::cout << "Hello, C++!\n";
    std::cout << "The answer is " << 42 << '\n';
    return 0;
}
```

- `#include <iostream>` pulls in the part of the **standard library** that does input and
  output.
- `int main()` is where every C++ program starts. Its body sits between `{` and `}`.
- `std::cout` is **standard output**, the text stream the terminal shows. `<<` sends a value
  into it, and you can chain several `<<` in one statement.
- `"\n"` (or the single character `'\n'`) ends a line.
- `return 0;` tells the operating system that the program succeeded.
- Every statement ends with a semicolon `;`.

`//` starts a **comment** that runs to the end of the line, and `/* ... */` wraps a comment
that can span lines. The compiler ignores comments; they are notes for human readers.

## What is special or tricky

- **A missing `;`** gives an error such as `expected ';' before ...`, often reported on the
  *next* line. Always read the **first** error first; later ones are often side effects.
- **Forgetting `#include <iostream>`** gives `'cout' is not a member of 'std'`.
- **Forgetting `std::`** gives `'cout' was not declared in this scope`. `std` is the
  standard library's **namespace**; this course writes `std::` explicitly.
- **Case matters.** `Main` is not `main`, and a program without `main` fails to build with
  `undefined reference to main`.
- **Compiling is not proof of correctness.** C++ trusts you: some mistakes compile and then
  misbehave. The flag `-Wall` turns on extra warnings; take them seriously.
- **Edit, then recompile.** Running `./main` again after editing shows the *old* behaviour
  until you compile again.

## What you will practise

You will type a first program with comments, chain values into `std::cout`, and use escape
sequences such as `\t` and `\"`. Then you will write your first function, one that builds a
greeting from a name and **returns** it instead of printing it.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u01-c1-programs"
title = "From source code to a running program"
points = 5
difficulty = 1
intro = '''
Before you write anything, picture what happens to your code. The compiler reads your whole
source file and translates it into an executable; only then does the program run, starting
at `main`. Anything you send to `std::cout` travels to **standard output**, which the
terminal shows on screen.
'''
body = '''
## Two steps: compile, then run

A C++ program starts life as a text file, usually named something like `main.cpp`. The
processor cannot run that text directly. First, the **compiler** (`g++`) reads the file,
checks that it follows the rules of the language, and writes out an **executable**. Then you
run the executable, and the operating system starts it at the function `main`.

```cpp
// A comment: the compiler skips it.
#include <iostream>

int main() {
    std::cout << "Hello, C++!\n";
    return 0;
}
```

Things to notice:

- **`#include <iostream>`** makes `std::cout` available.
- **`int main() { ... }`** is the entry point. Statements inside run from top to bottom.
- **`std::cout << "..."`** writes text to standard output. `"Hello, C++!\n"` is a **string
  literal**; `\n` inside it means "new line".
- **`return 0;`** ends `main` and reports success.

If the compiler finds a mistake, it prints an error with the file name and line number, and
no executable is produced. Fix the first error, then compile again.

## What the tutor does

In each drill you type a small, complete program. When your code matches the target, the
tutor saves it as `main.cpp` and runs `g++ -std=c++20 -O2 main.cpp -o main && ./main`:
compile, and if that worked (`&&`), run. In each challenge you write a function **without**
a `main`; the hidden tests bring their own `main`, call your function with many inputs and
check what it returns.
'''

