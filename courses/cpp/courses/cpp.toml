[unit.step.gabarito]
solution = '''
#include <string_view>

bool is_digit(char c) {
    return c >= '0' && c <= '9';
}

int two_digits(char tens, char ones) {
    return (tens - '0') * 10 + (ones - '0');
}

// Parse text of the form "HH:MM" (24-hour clock). On success, store the hours and
// minutes in the reference parameters and return true. On failure, return false and
// leave both parameters unchanged.
bool parse_time(std::string_view text, int& hours, int& minutes) {
    if (text.size() != 5 || text[2] != ':') {
        return false;
    }
    if (!is_digit(text[0]) || !is_digit(text[1]) || !is_digit(text[3]) || !is_digit(text[4])) {
        return false;
    }
    const int h = two_digits(text[0], text[1]);
    const int m = two_digits(text[3], text[4]);
    if (h > 23 || m > 59) {
        return false;
    }
    hours = h;
    minutes = m;
    return true;
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function rejects any input whose length is not exactly 5 before reading a single
character, then looks at a fixed number of positions and does a fixed amount of arithmetic.
However long the input is, the work is constant: the time is **O(1)**. It stores two local
`int`s, so the space is also **O(1)**; taking `std::string_view` by value copies only a
pointer and a length, never the characters.

The order of the checks is what makes it safe and correct. The length test comes first, so
`text[2]` and the other indexes are always inside the string (indexing past the end would be
undefined behaviour). Digits are verified before `c - '0'` is trusted as a number. The results
go into locals `h` and `m`, and the reference parameters are written only after every check
has passed, which is how the function keeps its promise to leave them unchanged on failure.
'''

