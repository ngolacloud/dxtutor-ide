title = "Write your own concept"
points = 10
difficulty = 24
intro = '''
A requires expression lists the operations a type must support, and a compound requirement
`{ expr } -> Concept;` also constrains the result type. The compiler only checks that each
line is valid; nothing is executed. `static_assert` tests the concept on good and bad types.
'''
placeholder_policy = "on_demand"
run_command = "g++ -std=c++20 -O2 main.cpp -o main && ./main"
prompt = '''
Define a `Shape` concept (an `area()` convertible to `double` and a `name()` convertible to
`std::string`), make two structs satisfy it, and write a `report` that only accepts shapes.

**Why:** a concept is an interface without inheritance or virtual calls: any type with the
right operations fits, and the check happens at compile time.
'''
target = '''
#include <concepts>
#include <iostream>
#include <string>

template <typename T>
concept Shape = requires(const T& s) {
    { s.area() } -> std::convertible_to<double>;
    { s.name() } -> std::convertible_to<std::string>;
};

struct Square {
    double side;
    double area() const { return side * side; }
    std::string name() const { return "square"; }
};

struct Circle {
    double r;
    double area() const { return 3.14159 * r * r; }
    const char* name() const { return "circle"; }
};

template <Shape S>
void report(const S& s) {
    std::cout << s.name() << ": " << s.area() << '\n';
}

int main() {
    report(Square{3.0});
    report(Circle{1.0});
    static_assert(Shape<Square> && Shape<Circle>);
    static_assert(!Shape<int>);
    std::cout << std::boolalpha << Shape<std::string> << '\n';
}
'''
