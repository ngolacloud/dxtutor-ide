[[unit.step]]
kind = "challenge"
id = "cpp-u17-x1-ring-buffer"
title = "A generic ring buffer"
points = 40
difficulty = 23
intro = '''
A **ring buffer** (circular buffer) is a queue with a fixed number of slots arranged in a
circle. Two indices chase each other around it, so pushing and popping are O(1) and nothing
ever moves or reallocates. Audio pipelines, network drivers and loggers that keep "the last
N events" all use one. Making it generic means asking as little of the element type as
possible.
'''
entry = "RingBuffer"
instructions = '''
## Your turn

Implement the class template `RingBuffer<T>`, a first-in, first-out queue with a fixed
capacity:

```cpp
template <typename T>
class RingBuffer {
public:
    explicit RingBuffer(std::size_t capacity);
    void push(T value);
    T pop();
    const T& front() const;
    const T& at(std::size_t i) const;
    std::size_t size() const;
    std::size_t capacity() const;
    bool empty() const;
    bool full() const;
};
```

Behaviour:

- The constructor throws `std::invalid_argument` if `capacity` is 0.
- `push` adds `value` at the back. If the buffer is **full**, the oldest element is
  overwritten (dropped), so the buffer always keeps the most recent `capacity` values.
- `pop` removes and returns the oldest element. `front` returns the oldest element without
  removing it. Both throw `std::out_of_range` when the buffer is empty.
- `at(i)` returns the `i`-th element counting from the oldest (`at(0)` is the front). It
  throws `std::out_of_range` if `i >= size()`.
- Every operation is **O(1)**. Don't shift elements.

Requirements on `T`, which the hidden tests check:

- `T` may be **move-only**, such as `std::unique_ptr<int>`. Move values in and out.
- `T` may have **no default constructor**, so you can't create `capacity` empty `T`s up
  front. `std::vector<std::optional<T>>` is a good storage choice.
- A popped element must be destroyed. Don't keep it alive in its slot.

Example with capacity 3: push 1, 2, 3, 4 leaves `2 3 4`, `front()` is 2, `pop()` returns 2,
and `size()` is then 2.

**Hint:** keep the index of the oldest element (`head_`) and a count. The next free slot is
`(head_ + size_) % capacity`.

Hidden tests decide correctness.
'''
starter = '''
#include <cstddef>
#include <optional>
#include <stdexcept>
#include <utility>
#include <vector>

// A fixed-capacity FIFO queue. push overwrites the oldest element when full.
// T may be move-only and may lack a default constructor. Every operation is O(1).
template <typename T>
class RingBuffer {
public:
    explicit RingBuffer(std::size_t capacity) {
        (void)capacity;
        throw std::logic_error("not implemented");
    }
    void push(T value) {
        (void)value;
        throw std::logic_error("not implemented");
    }
    T pop() { throw std::logic_error("not implemented"); }
    const T& front() const { throw std::logic_error("not implemented"); }
    const T& at(std::size_t i) const {
        (void)i;
        throw std::logic_error("not implemented");
    }
    std::size_t size() const { throw std::logic_error("not implemented"); }
    std::size_t capacity() const { throw std::logic_error("not implemented"); }
    bool empty() const { throw std::logic_error("not implemented"); }
    bool full() const { throw std::logic_error("not implemented"); }

private:
    // TODO: add the data members you need.
};
'''
tests = '''
#include <memory>
#include <string>
#include <vector>

struct NoDefault {
    explicit NoDefault(int v) : value(v) {}
    int value;
};

struct Tracked {
    static inline int live = 0;
    int id;
    explicit Tracked(int i) : id(i) { ++live; }
    Tracked(const Tracked& o) : id(o.id) { ++live; }
    Tracked(Tracked&& o) noexcept : id(o.id) { ++live; }
    Tracked& operator=(const Tracked&) = default;
    Tracked& operator=(Tracked&&) noexcept = default;
    ~Tracked() { --live; }
};

TEST(zero_capacity_is_rejected) {
    bool threw = false;
    try {
        RingBuffer<int> rb(0);
    } catch (const std::invalid_argument&) {
        threw = true;
    }
    CHECK(threw);
}

TEST(fifo_order) {
    RingBuffer<int> rb(4);
    CHECK(rb.empty());
    CHECK_EQ(rb.capacity(), 4u);
    rb.push(1);
    rb.push(2);
    rb.push(3);
    CHECK_EQ(rb.size(), 3u);
    CHECK(!rb.full());
    CHECK_EQ(rb.front(), 1);
    CHECK_EQ(rb.pop(), 1);
    CHECK_EQ(rb.pop(), 2);
    rb.push(4);
    rb.push(5);
    CHECK_EQ(rb.pop(), 3);
    CHECK_EQ(rb.pop(), 4);
    CHECK_EQ(rb.pop(), 5);
    CHECK(rb.empty());
}

TEST(overwrites_oldest_when_full) {
    RingBuffer<int> rb(3);
    for (int i = 1; i <= 4; ++i) rb.push(i);
    CHECK(rb.full());
    CHECK_EQ(rb.size(), 3u);
    CHECK_EQ(rb.front(), 2);
    CHECK_EQ(rb.at(0), 2);
    CHECK_EQ(rb.at(1), 3);
    CHECK_EQ(rb.at(2), 4);
    CHECK_EQ(rb.pop(), 2);
    CHECK_EQ(rb.size(), 2u);
    rb.push(5);
    rb.push(6);
    CHECK_EQ(rb.at(0), 4);
    CHECK_EQ(rb.at(2), 6);
}

TEST(capacity_one) {
    RingBuffer<std::string> rb(1);
    rb.push("a");
    rb.push("b");
    CHECK_EQ(rb.size(), 1u);
    CHECK(rb.full());
    CHECK_EQ(rb.front(), std::string("b"));
    CHECK_EQ(rb.pop(), std::string("b"));
    CHECK(rb.empty());
}

TEST(errors_on_empty_and_bad_index) {
    RingBuffer<int> rb(2);
    int errors = 0;
    try { rb.pop(); } catch (const std::out_of_range&) { ++errors; }
    try { (void)rb.front(); } catch (const std::out_of_range&) { ++errors; }
    try { (void)rb.at(0); } catch (const std::out_of_range&) { ++errors; }
    rb.push(-7);
    try { (void)rb.at(1); } catch (const std::out_of_range&) { ++errors; }
    CHECK_EQ(errors, 4);
    CHECK_EQ(rb.at(0), -7);
}

TEST(works_with_move_only_types) {
    RingBuffer<std::unique_ptr<int>> rb(2);
    rb.push(std::make_unique<int>(10));
    rb.push(std::make_unique<int>(20));
    rb.push(std::make_unique<int>(30));
    CHECK_EQ(*rb.front(), 20);
    std::unique_ptr<int> p = rb.pop();
    CHECK(p != nullptr);
    CHECK_EQ(*p, 20);
    CHECK_EQ(*rb.at(0), 30);
}

TEST(works_without_default_constructor) {
    RingBuffer<NoDefault> rb(3);
    rb.push(NoDefault(1));
    rb.push(NoDefault(2));
    CHECK_EQ(rb.pop().value, 1);
    CHECK_EQ(rb.front().value, 2);
}

TEST(popped_elements_are_destroyed) {
    {
        RingBuffer<Tracked> rb(3);
        rb.push(Tracked(1));
        rb.push(Tracked(2));
        rb.push(Tracked(3));
        CHECK_EQ(Tracked::live, 3);
        rb.push(Tracked(4));
        CHECK_EQ(Tracked::live, 3);
        { Tracked t = rb.pop(); CHECK_EQ(t.id, 2); }
        CHECK_EQ(Tracked::live, 2);
        (void)rb.pop();
        (void)rb.pop();
        CHECK_EQ(Tracked::live, 0);
        rb.push(Tracked(5));
        CHECK_EQ(Tracked::live, 1);
    }
    CHECK_EQ(Tracked::live, 0);
}

TEST(large_number_of_pushes) {
    RingBuffer<int> rb(1000);
    for (int i = 0; i < 100000; ++i) rb.push(i);
    CHECK_EQ(rb.size(), 1000u);
    CHECK_EQ(rb.front(), 99000);
    CHECK_EQ(rb.at(999), 99999);
    long long sum = 0;
    while (!rb.empty()) sum += rb.pop();
    CHECK_EQ(sum, 99499500LL);
}
'''

[unit.step.gabarito]
solution = '''
#include <cstddef>
#include <optional>
#include <stdexcept>
#include <utility>
#include <vector>

// A fixed-capacity FIFO queue. push overwrites the oldest element when full.
// T may be move-only and may lack a default constructor. Every operation is O(1).
template <typename T>
class RingBuffer {
public:
    explicit RingBuffer(std::size_t capacity) {
        if (capacity == 0) throw std::invalid_argument("capacity must be positive");
        slots_.resize(capacity);
    }

    void push(T value) {
        if (full()) {
            *slots_[head_] = std::move(value);
            head_ = next(head_);
        } else {
            slots_[(head_ + size_) % slots_.size()].emplace(std::move(value));
            ++size_;
        }
    }

    T pop() {
        if (empty()) throw std::out_of_range("pop on empty RingBuffer");
        T out = std::move(*slots_[head_]);
        slots_[head_].reset();
        head_ = next(head_);
        --size_;
        return out;
    }

    const T& front() const { return at(0); }

    const T& at(std::size_t i) const {
        if (i >= size_) throw std::out_of_range("RingBuffer index out of range");
        return *slots_[(head_ + i) % slots_.size()];
    }

    std::size_t size() const { return size_; }
    std::size_t capacity() const { return slots_.size(); }
    bool empty() const { return size_ == 0; }
    bool full() const { return size_ == slots_.size(); }

private:
    std::size_t next(std::size_t i) const { return (i + 1) % slots_.size(); }

    std::vector<std::optional<T>> slots_;
    std::size_t head_ = 0;
    std::size_t size_ = 0;
};
'''
time = "O(1) per operation"
space = "O(capacity)"
justification = '''
Every member does a constant amount of work: a bounds check, one or two modulo operations to
find a slot, and one construction, move or destruction of a `T`. Nothing is shifted and the
vector never grows after the constructor, so `push`, `pop`, `front`, `at`, `size` and the
predicates are all **O(1)**. (The constructor itself is O(capacity), because it creates
`capacity` empty optionals once.)

The storage is a vector of exactly `capacity` `std::optional<T>` slots plus two counters, so
the space is **O(capacity)**, independent of how many values have been pushed over the
buffer's life. `std::optional` is what makes the container truly generic: an empty slot
holds no `T` at all, so `T` needs no default constructor, and `reset()` destroys a popped
value immediately instead of leaving a stale object behind. Moving values in and out means
`T` only has to be movable. A `std::deque<T>` with a size check would also be O(1), but it
allocates in chunks as it runs, while a ring buffer allocates once and then never again.
'''


[[unit]]
id = "cpp-u18-concepts"
title = "Concepts & constraints"
level = "advanced"
difficulty = 24
intro = '''
An unconstrained template accepts any type and only complains, at length, from deep inside
its body. C++20 **concepts** let a template state what it needs up front, so wrong calls are
rejected at the call site with a short message, and overloads can be chosen by what a type
can do. You will use the standard concepts, write your own with `requires` expressions, and
finish with a small statistics library whose constraints the tests check directly.
'''
concepts = '''
## The idea

A template's body silently assumes things about `T`: that it has `<`, a `size()` method, a
`value_type`. Before C++20 those assumptions were invisible in the signature. Pass the wrong
type and the compiler reports a failure somewhere inside the instantiation, often pages of
it.

A **concept** is a named, compile-time predicate on types. `std::integral<int>` is `true`,
`std::integral<double>` is `false`. Attaching a concept to a template turns the hidden
assumption into part of the interface: the call is checked against the concept first, and a
mismatch produces "constraints not satisfied" at your call, naming the concept that failed.

## How C++ does it

There are four equivalent ways to constrain a template:

```cpp
template <std::integral T> T twice(T x);              // constrained parameter
template <typename T> requires std::integral<T> T f(T); // requires clause
template <typename T> T g(T x) requires std::integral<T>; // trailing requires
auto h(std::integral auto x);                          // abbreviated template
```

The standard library ships many concepts in `<concepts>` and `<ranges>`: `std::same_as`,
`std::convertible_to`, `std::integral`, `std::floating_point`, `std::totally_ordered`,
`std::invocable`, `std::ranges::forward_range` and more. Combine them with `&&`, `||` and `!`.

You write your own with a **requires expression**, which lists operations that must compile:

```cpp
template <typename T>
concept SmallContainer = requires(const T& c) {
    typename T::value_type;                            // type requirement
    c.empty();                                         // simple requirement
    { c.size() } -> std::convertible_to<std::size_t>;  // compound requirement
    requires sizeof(typename T::value_type) <= 8;      // nested requirement
};
```

Nothing in a requires expression runs; the compiler only checks that each line would be
valid. A concept evaluates to `true` or `false`, so
`static_assert(SmallContainer<std::vector<int>>)` tests it directly,
and `if constexpr (requires { x.size(); })` branches on one inside a template.

When two overloads both match, the **more constrained** one wins, provided its constraint
includes the other's through named concepts. `std::signed_integral` is defined as
`std::integral<T> && …`, so it beats a plain `std::integral` overload for `int`.

## What is special or tricky

- **Concepts check syntax, not meaning.** A type whose `<` is not a real ordering still
  satisfies `std::totally_ordered`. The concept documents the intent; you keep the promise.
- **A typo makes a concept quietly false.** An invalid line in a requires expression does not
  cause an error; it makes the concept unsatisfied. Test both sides with `static_assert(C<Good>)`
  and `static_assert(!C<Bad>)`.
- **`bool` and `char` are `std::integral`.** If a "number" concept should exclude `bool`,
  say so explicitly.
- **Ambiguity.** Two overloads with overlapping constraints where neither includes the other
  give "call is ambiguous".
- **`requires requires`** is legal: a requires clause whose condition is an ad hoc requires
  expression. Prefer naming a concept.
- **Deduced return types.** If a function's return type is `auto`, checking a call can mean
  instantiating its body, and an error there is a hard error, not a `false`.

## What you will practise

You will constrain functions with standard concepts, write a `Shape` concept, overload on
constraints and branch with `if constexpr`. The challenge asks you to define `Arithmetic` and
`NumericRange` concepts and constrain `mean` and `median` with them.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u18-c1-constraints"
title = "Naming what a template needs"
points = 5
difficulty = 24
intro = '''
A concept is a compile-time boolean about types. Constraining a template with one moves the
type check from "somewhere inside the instantiation" to "at the call", which gives shorter
errors and lets the compiler choose between overloads by capability.
'''
body = '''
## Before and after

```cpp
template <typename T>
T average(T a, T b) { return (a + b) / 2; }

average(std::string("a"), std::string("b"));
// error deep inside: no match for operator/ ...
```

```cpp
template <std::floating_point T>
T average(T a, T b) { return (a + b) / 2; }

average(std::string("a"), std::string("b"));
// error: no matching function ... constraints not satisfied:
//        'std::floating_point<std::string>' evaluated to false
```

The constrained version is rejected before its body is even looked at.

## Writing a concept

```cpp
template <typename T>
concept HasArea = requires(const T& s) {
    { s.area() } -> std::convertible_to<double>;
};
```

Read it as: "`T` is a `HasArea` if, for a `const T&` named `s`, the expression `s.area()`
compiles and its result converts to `double`." The body of a requires expression is never
executed.

## Using a concept

- In the template header: `template <HasArea T>`.
- In a requires clause: `requires HasArea<T> && std::copyable<T>`.
- As a value: `static_assert(HasArea<Square>)` or `if constexpr (HasArea<T>)`.

## Choosing between overloads

If several constrained overloads match, the compiler picks the one whose constraints are
strictly stronger. This replaces the older `std::enable_if` and tag-dispatch tricks with
code that reads like a sentence.
'''

