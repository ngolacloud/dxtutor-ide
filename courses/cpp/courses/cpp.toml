entry = "TextureCache"
intro = '''
A cache trades memory for time by remembering results. A **weak cache** remembers objects
without owning them: while anyone still uses a texture, every request returns the same shared
instance; once the last user lets go, the texture is freed and the next request loads it again.
`shared_ptr` for the users plus `weak_ptr` for the cache is exactly that design.
'''
instructions = '''
## Your turn

Implement the class `TextureCache`:

```cpp
class TextureCache {
public:
    std::shared_ptr<Texture> get(const std::string& name);
    std::size_t loads() const;
    std::size_t alive() const;
};
```

- `get(name)` returns the `Texture` called `name` if some `shared_ptr` still owns it. Otherwise
  it creates a new `Texture` (with `std::make_shared`), remembers it, and returns it.
- `loads()` returns how many `Texture` objects `get` has created so far.
- `alive()` returns how many of the remembered textures are still owned by someone.

Rules:

- The cache must **not** keep textures alive. A texture with no owners outside the cache must be
  destroyed, so remember them as `std::weak_ptr`, never as `std::shared_ptr`.
- A texture must survive the cache: if the cache is destroyed while someone still holds a
  texture, that texture stays valid.
- Any string is a valid name, including the empty string.
- The `Texture` struct is provided in the starter; don't change it. The private members are a
  suggestion; you may change them.

Examples:

- `auto a = cache.get("grass"); auto b = cache.get("grass");` gives `a == b`, `loads() == 1`
  and `a.use_count() == 2` (the two variables, not the cache).
- `cache.get("lava");` on its own creates a texture that dies at the end of the statement, so
  a second `cache.get("lava")` loads it again and `loads()` becomes 2.

**Hint:** `cache_[name]` gives you a reference to the `weak_ptr` slot, creating an empty one if
needed. `lock()` on that slot tells you whether a live texture is there.

Hidden tests decide correctness.
'''
