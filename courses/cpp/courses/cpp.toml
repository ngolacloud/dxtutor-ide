[[unit]]
id = "cpp-u24-linked-list"
title = "Singly linked lists"
level = "advanced"
difficulty = 30
intro = '''
A linked list stores each value in its own heap node that owns the next one, so a sequence
becomes a chain of owning pointers instead of one contiguous block of memory. You will build
nodes with `std::unique_ptr`, push and pop at the head, keep a raw tail pointer for O(1)
appends, delete by relinking, and finish with a list class that reverses in place and frees
a million nodes without overflowing the stack.
'''
concepts = '''
## The idea

A **linked list** stores a sequence as a chain of **nodes**. Each node holds a value and a
pointer to the next node; the last node points to nothing. The list itself is just a pointer
to the first node, the **head**. Nothing is contiguous: nodes live wherever the allocator put
them, connected only by pointers.

That layout trades one set of costs for another. Compared with `std::vector`:

- **Insert or remove at the head: O(1).** You relink one pointer. `v.insert(v.begin(), x)`
  shifts every element, which is O(n).
- **Insert after a node you already hold: O(1)**, for the same reason, and no pointer to any
  other node is invalidated.
- **Access by index, search: O(n).** No arithmetic jumps to element *i*; you must walk.
- **Append at the tail: O(n)**, unless you also keep a pointer to the last node.

In everyday C++, `std::vector` usually wins anyway: its elements sit next to each other, which
CPU caches love. Linked lists still matter. Trees and graphs are built from the same kind of
node, and "relink two pointers" is the trick behind LRU caches, allocators and schedulers.

## How C++ does it: ownership in the type

Each node **owns** its successor, so `next` is a `std::unique_ptr<Node>`. The head owns the
first node, and destroying the head frees the whole chain. Pointers that only *look* at a
node, such as a walking cursor or a tail pointer, are plain `Node*` or `const Node*`:

```cpp
struct Node {
    int value;
    std::unique_ptr<Node> next;   // owns the rest of the list
};

for (const Node* n = head.get(); n != nullptr; n = n->next.get()) {
    std::cout << n->value << '\n';  // n observes, it never deletes
}
```

Ownership moves, it is never copied: `std::make_unique<Node>(v, std::move(head))` creates a
node that takes over the old chain. Relinking is a move too, and `p = std::move(p->next)` is
safe because `unique_ptr` takes the new pointer before it deletes the old node.

## What is special or tricky

- **Dereferencing a null `unique_ptr` is undefined behaviour.** `head->value` on an empty
  list may crash, or may silently read garbage at `-O2`. Check `if (head)` first.
- **Recursive destruction.** The default destructor of `head` destroys the first node, whose
  destructor destroys its `next`, and so on: one stack frame per node. With a million nodes
  that overflows the stack and the program dies with a segmentation fault. Long lists need
  a destructor that frees nodes in a loop.
- **A raw pointer must not outlive its node.** After popping the last node, a `tail` pointer
  still holds the old address: dangling. Reset it to `nullptr` whenever the list empties.
- **Two owners is a compile error, not a bug.** `node->next = head;` does not compile because
  `unique_ptr` cannot be copied. Write `std::move(head)` and know that `head` is now empty.

## What you will practise

You will push to the front and pop, write a list class with a tail pointer and an iterative
destructor, and delete values through a pointer-to-link. The challenge is a complete list
class with moves and in-place reversal, tested on a million nodes.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u24-c1-owning-nodes"
title = "Owning nodes and observing pointers"
points = 5
difficulty = 30
intro = '''
A node holds a value and an owning pointer to the next node, and an empty `unique_ptr` marks
the end. Deciding who owns each node, and who merely looks at it, is the whole design of a
linked structure in modern C++.
'''
body = '''
## The node

```cpp
struct Node {
    int value;
    std::unique_ptr<Node> next;
};
std::unique_ptr<Node> head;   // empty: the list is empty
```

`next` owns the following node, or is empty at the end of the list. Nothing else in the
program may `delete` a node: when its owner goes away, the node goes with it.

## Push to the front

Create a node whose `next` takes over the current head, then make it the head. No element
moves, so this is O(1) however long the list is:

```cpp
head = std::make_unique<Node>(v, std::move(head));
```

## Walk the list

A walk only observes, so it uses a raw pointer obtained with `.get()`:

```cpp
for (const Node* n = head.get(); n; n = n->next.get()) { /* read n->value */ }
```

## Pop the front

Remember the value, then move the head one node on. The old first node loses its owner and
is freed on the spot, deterministically, with no garbage collector involved:

```cpp
int v = head->value;
head = std::move(head->next);
```

Pushing to the front reverses insertion order: the last value pushed is the first one you
meet. Appending to the end needs the last node, and finding it is an O(n) walk unless you
keep a `Node* tail` that observes it. That pointer does not own anything, so it must be kept
in step by hand: when the list becomes empty, `tail` must become `nullptr`. Every operation
in this unit combines three moves: create a node, follow `next`, and move ownership of `next`.
'''

