[unit.step.gabarito]
solution = '''
#include <sqlite3.h>
#include <memory>
#include <stdexcept>

namespace {

struct StmtFinalize {
    void operator()(sqlite3_stmt* st) const { sqlite3_finalize(st); }
};
using Stmt = std::unique_ptr<sqlite3_stmt, StmtFinalize>;

void exec_or_throw(sqlite3* db, const char* sql) {
    if (sqlite3_exec(db, sql, nullptr, nullptr, nullptr) != SQLITE_OK) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
}

class Transaction {
public:
    explicit Transaction(sqlite3* db) : db_(db) { exec_or_throw(db_, "BEGIN"); }
    Transaction(const Transaction&) = delete;
    Transaction& operator=(const Transaction&) = delete;
    ~Transaction() {
        if (!done_) sqlite3_exec(db_, "ROLLBACK", nullptr, nullptr, nullptr);
    }
    void commit() {
        exec_or_throw(db_, "COMMIT");
        done_ = true;
    }

private:
    sqlite3* db_;
    bool done_ = false;
};

// Runs an UPDATE whose ?1 is the amount and ?2 the account id; returns the rows changed.
int update(sqlite3* db, const char* sql, int amount, int id) {
    sqlite3_stmt* raw = nullptr;
    if (sqlite3_prepare_v2(db, sql, -1, &raw, nullptr) != SQLITE_OK) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    Stmt st(raw);
    sqlite3_bind_int(st.get(), 1, amount);
    sqlite3_bind_int(st.get(), 2, id);
    if (sqlite3_step(st.get()) != SQLITE_DONE) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    return sqlite3_changes(db);
}

}  // namespace

bool transfer(sqlite3* db, int src, int dst, int amount) {
    if (amount <= 0 || src == dst) return false;
    Transaction tx(db);
    if (update(db, "UPDATE accounts SET balance = balance - ?1 WHERE id = ?2 AND balance >= ?1",
               amount, src) != 1) {
        return false;  // missing source or not enough money: the guard rolls back
    }
    if (update(db, "UPDATE accounts SET balance = balance + ?1 WHERE id = ?2",
               amount, dst) != 1) {
        return false;  // missing destination: the guard undoes the debit
    }
    tx.commit();
    return true;
}
'''
time = "O(log n)"
space = "O(1)"
justification = '''
`id` is the `INTEGER PRIMARY KEY`, so each `UPDATE` finds its row with one seek in the
table's B-tree: **O(log n)** for **n** accounts. The function runs a constant number of
statements (`BEGIN`, two `UPDATE`s, `COMMIT` or `ROLLBACK`), so the total is **O(log n)**,
and it keeps only a few handles and integers: **O(1)** extra space.

The design does the checking inside SQL. `balance >= ?1` makes the debit itself refuse to
overdraw, and `sqlite3_changes` turns "no such account" and "not enough money" into a
zero-row result, so no separate `SELECT` is needed and no other writer can sneak in between
a check and the write. The `Transaction` guard turns every early `return` and every `throw`
into a `ROLLBACK`, which is why the two failure branches need no cleanup code of their own.
'''

