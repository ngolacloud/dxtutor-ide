[[unit]]
id = "cpp-u20-threads"
title = "Threads: std::thread, join and std::jthread"
level = "advanced"
difficulty = 26
intro = '''
A thread is an independent path of execution inside your program that shares its memory with
every other thread. You will start threads with `std::thread`, wait for them with `join`, let a
C++20 `std::jthread` join and stop for you, and learn why two threads touching the same variable
without synchronisation is undefined behaviour. The challenge is a small `parallel_for` that
spreads the iterations of a loop across worker threads.
'''
concepts = '''
## The idea

A **process** is a running program with its own memory. A **thread** is one sequence of
instructions running inside a process. A process can have many threads; they share the same
heap, globals and code, and each one has its own stack. On a multicore CPU threads really run
at the same time, so splitting CPU-bound work into N independent pieces can make it close to
N times faster.

The price is that the operating system decides when each thread runs. The interleaving of their
steps is unpredictable and changes from one run to the next, so a concurrent program has to be
correct for *every* possible interleaving, not just the one you happened to see.

## How C++ does it

`std::thread` (header `<thread>`) starts a thread the moment it is constructed, running any
callable with the arguments you give it. The arguments are **copied** into the new thread; wrap
one in `std::ref` when the thread must see your object instead of a copy.

```cpp
void fill(std::vector<int>& out, int i) { out[i] = i * 10; }

std::vector<int> out(2);
std::thread a(fill, std::ref(out), 0);
std::thread b([&out] { out[1] = 99; });
a.join();
b.join();   // after join, everything the threads wrote is visible here
```

`join()` blocks until the thread finishes, and it is a synchronisation point: every write the
thread made *happens before* the code after `join`. C++20 adds `std::jthread`, which joins
automatically in its destructor and carries a `std::stop_token`, so you can ask it to finish
early with `request_stop()`. `std::thread::hardware_concurrency()` hints how many threads the
machine runs at once (it may return 0 when unknown).

## Pitfalls

- **Forgetting to join.** Destroying a `std::thread` that is still joinable calls
  `std::terminate` and aborts the program. Join (or, rarely, `detach`) every thread, or use
  `std::jthread`.
- **Data races are undefined behaviour.** When two threads access the same memory location, at
  least one of them writes, and nothing orders the accesses, the program has a data race. Lost
  updates, torn values, or an optimiser that keeps a value in a register forever are all
  allowed outcomes. `++counter` from two threads is a race, and "it printed the right answer"
  proves nothing.
- **Dangling references.** A thread that captures a local by reference must finish before that
  local is destroyed. A detached thread reading a dead variable is a use-after-free.
- **Exceptions do not cross threads.** An exception that escapes the thread's function calls
  `std::terminate`.
- **`std::cout` from several threads** will not crash, but output from different threads
  interleaves unpredictably. Collect results and print them from one thread.

The race-free pattern of this unit is simple: give each thread **its own slot** to write, join
them all, and only then read the results. Sharing data between running threads (mutexes,
atomics) is the next unit.

## What you will practise

You will start and join threads that write to separate slots, stop a `std::jthread` through its
stop token, split a sum into per-thread chunks, and finish with `parallel_for`, which divides the
indices of a loop into contiguous blocks, one per worker thread.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u20-c1-threads-join-races"
title = "Threads, join and data races"
points = 5
difficulty = 26
intro = '''
A thread runs a function concurrently with the code that started it, sharing the same memory.
The language only promises that one thread sees another's writes when something orders them,
and `join` is the first such ordering you will use.
'''
body = '''
## Start, then join

Constructing a `std::thread` starts it immediately. The thread that created it keeps going in
parallel until it calls `join()`, which waits for the new thread to end.

```cpp
std::thread t([] { std::cout << "hello from a thread\n"; });
t.join();
```

## Happens-before

Threads communicate through shared memory, and C++ only guarantees that a thread sees another
thread's writes when a **happens-before** relation orders them. Starting a thread is one: what
you did before constructing it is visible inside it. Joining is another: everything the thread
wrote is visible after `join` returns.

## What a data race is

Two accesses to the same memory location **conflict** when at least one is a write. If
conflicting accesses come from different threads and neither happens before the other, the
program has a **data race**, and its behaviour is undefined. Even `++counter` is three steps
(load, add, store), so two threads can both load 5 and both store 6.

```cpp
int counter = 0;   // shared and unprotected
std::thread a([&] { for (int i = 0; i < 100000; ++i) ++counter; });
std::thread b([&] { for (int i = 0; i < 100000; ++i) ++counter; });
a.join();
b.join();          // undefined behaviour: a data race on counter
```

## The safe pattern for now

Give every thread its own output slot, join them all, and combine the results on one thread.
Different elements of a `std::vector` are different memory locations, so threads writing
different indices never conflict, and the joins order every write before your read.
'''

