[unit.step.gabarito]
solution = '''
#include <sqlite3.h>
#include <memory>
#include <stdexcept>
#include <string>
#include <vector>

struct StmtFinalize {
    void operator()(sqlite3_stmt* st) const { sqlite3_finalize(st); }
};
using Stmt = std::unique_ptr<sqlite3_stmt, StmtFinalize>;

std::vector<std::string> names_in_city(sqlite3* db, const std::string& city) {
    sqlite3_stmt* raw = nullptr;
    if (sqlite3_prepare_v2(db, "SELECT name FROM people WHERE city = ? ORDER BY name",
                           -1, &raw, nullptr) != SQLITE_OK) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    Stmt st(raw);
    // `city` outlives the statement, so SQLite may read it in place.
    sqlite3_bind_text(st.get(), 1, city.data(), static_cast<int>(city.size()), SQLITE_STATIC);

    std::vector<std::string> names;
    int rc;
    while ((rc = sqlite3_step(st.get())) == SQLITE_ROW) {
        if (const unsigned char* text = sqlite3_column_text(st.get(), 0)) {
            names.emplace_back(reinterpret_cast<const char*>(text));
        }
    }
    if (rc != SQLITE_DONE) {
        throw std::runtime_error(sqlite3_errmsg(db));
    }
    return names;
}
'''
time = "O(n + k log k)"
space = "O(k)"
justification = '''
The table has no index on `city`, so SQLite scans all **n** rows once to test the `WHERE`
condition: **O(n)**. The **k** matching names are then sorted for `ORDER BY`, which costs
**O(k log k)**. The returned vector holds the k names, so the extra space is **O(k)** (plus
the characters of the names themselves).

Binding the city costs nothing extra and keeps the statement's structure fixed whatever
characters the city contains. The `unique_ptr` adds no run-time cost over calling
`sqlite3_finalize` by hand: its deleter is an empty type, so the wrapper is exactly one
pointer, and the finalize runs on the normal return and on both `throw` paths.
'''

