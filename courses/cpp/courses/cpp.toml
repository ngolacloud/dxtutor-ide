[[unit.step]]
kind = "challenge"
id = "cpp-u10-x1-fraction"
title = "A Fraction that stays in lowest terms"
points = 30
difficulty = 10
entry = "Fraction"
intro = '''
A rational number has many spellings (1/2, 2/4, -3/-6), so a `Fraction` class picks one
**canonical form** and makes it an invariant: lowest terms, positive denominator. With that
invariant in place, equality is a comparison of two integers, and every operation only has
to re-establish it on the result.
'''
instructions = '''
## Your turn

Implement the class `Fraction`:

```cpp
class Fraction {
public:
    explicit Fraction(long long numerator, long long denominator = 1);
    long long num() const;
    long long den() const;
    Fraction plus(const Fraction& other) const;
    Fraction times(const Fraction& other) const;
    std::string to_string() const;
};
```

Every `Fraction` must satisfy this **invariant** at all times:

- the denominator is positive;
- the numerator and denominator have no common factor greater than 1 (lowest terms);
- zero is stored as `0/1`.

Rules:

- The constructor throws `std::invalid_argument` when `denominator` is 0. Otherwise it
  normalises: `Fraction(2, 4)` stores 1/2, `Fraction(1, -2)` stores -1/2, `Fraction(-3, -9)`
  stores 1/3, and `Fraction(0, -5)` stores 0/1.
- `num()` and `den()` return the stored numerator and denominator.
- `plus` and `times` return a **new** fraction, also in lowest terms, and leave both operands
  unchanged. They are `const`, so they work on `const` fractions.
- `to_string()` returns `"3/4"` or `"-1/2"`, and just the numerator, such as `"5"` or `"0"`,
  when the denominator is 1.
- Keep the data members private. Values in the tests stay small enough for `long long`,
  provided you keep every result in lowest terms.

Examples:

- `Fraction(1, 2).plus(Fraction(1, 3)).to_string()` is `"5/6"`.
- `Fraction(2, 3).times(Fraction(3, 4)).to_string()` is `"1/2"`.
- `Fraction(-1, 4).plus(Fraction(1, 4)).to_string()` is `"0"`.

**Hint:** `std::gcd` from `<numeric>` returns the greatest common divisor of the absolute
values of its arguments. Normalise once, in the constructor, and build every result through
the constructor.

Hidden tests decide correctness.
'''
starter = '''
#include <numeric>
#include <stdexcept>
#include <string>

// A fraction always kept in lowest terms with a positive denominator.
class Fraction {
public:
    // Throw std::invalid_argument if denominator == 0; otherwise normalise.
    explicit Fraction(long long numerator, long long denominator = 1) {
        throw std::logic_error("not implemented");
    }

    long long num() const { throw std::logic_error("not implemented"); }
    long long den() const { throw std::logic_error("not implemented"); }

    // Return this + other, in lowest terms.
    Fraction plus(const Fraction& other) const { throw std::logic_error("not implemented"); }

    // Return this * other, in lowest terms.
    Fraction times(const Fraction& other) const { throw std::logic_error("not implemented"); }

    // "3/4", "-1/2", or just "5" when the denominator is 1.
    std::string to_string() const { throw std::logic_error("not implemented"); }

private:
    long long num_ = 0;
    long long den_ = 1;
};
'''
tests = '''
#include <stdexcept>
#include <string>
#include <type_traits>

TEST(reduces_to_lowest_terms) {
    Fraction f(2, 4);
    CHECK_EQ(f.num(), 1);
    CHECK_EQ(f.den(), 2);
    CHECK_EQ(Fraction(6, 3).to_string(), "2");
    CHECK_EQ(Fraction(12, 18).to_string(), "2/3");
}

TEST(sign_lives_in_the_numerator) {
    CHECK_EQ(Fraction(1, -2).to_string(), "-1/2");
    CHECK_EQ(Fraction(-3, -9).to_string(), "1/3");
    CHECK_EQ(Fraction(-4, 6).num(), -2);
    CHECK_EQ(Fraction(-4, 6).den(), 3);
}

TEST(zero_is_zero_over_one) {
    Fraction z(0, -5);
    CHECK_EQ(z.num(), 0);
    CHECK_EQ(z.den(), 1);
    CHECK_EQ(z.to_string(), "0");
}

TEST(default_denominator_is_one) {
    CHECK_EQ(Fraction(7).to_string(), "7");
    CHECK_EQ(Fraction(-7).den(), 1);
}

TEST(zero_denominator_throws_invalid_argument) {
    bool threw = false;
    try {
        Fraction bad(1, 0);
        (void)bad;
    } catch (const std::invalid_argument&) {
        threw = true;
    }
    CHECK(threw);
}

TEST(addition) {
    CHECK_EQ(Fraction(1, 2).plus(Fraction(1, 3)).to_string(), "5/6");
    CHECK_EQ(Fraction(1, 2).plus(Fraction(1, 2)).to_string(), "1");
    CHECK_EQ(Fraction(-1, 4).plus(Fraction(1, 4)).to_string(), "0");
    CHECK_EQ(Fraction(1, 6).plus(Fraction(-1, 3)).to_string(), "-1/6");
}

TEST(multiplication) {
    CHECK_EQ(Fraction(2, 3).times(Fraction(3, 4)).to_string(), "1/2");
    CHECK_EQ(Fraction(-2, 5).times(Fraction(5, -2)).to_string(), "1");
    CHECK_EQ(Fraction(3, 7).times(Fraction(0)).to_string(), "0");
}

TEST(const_objects_and_unchanged_operands) {
    const Fraction a(1, 4);
    const Fraction b(3, 4);
    const Fraction sum = a.plus(b);
    CHECK_EQ(sum.to_string(), "1");
    CHECK_EQ(a.to_string(), "1/4");
    CHECK_EQ(b.to_string(), "3/4");
    CHECK(!(std::is_convertible_v<long long, Fraction>));
}

TEST(long_sums_stay_reduced) {
    Fraction total(0);
    for (long long k = 1; k <= 1000; ++k) {
        total = total.plus(Fraction(1, k * (k + 1)));
    }
    CHECK_EQ(total.to_string(), "1000/1001");

    Fraction halves(0);
    for (int k = 1; k <= 30; ++k) {
        halves = halves.plus(Fraction(1, 1LL << k));
    }
    CHECK_EQ(halves.num(), (1LL << 30) - 1);
    CHECK_EQ(halves.den(), 1LL << 30);
}
'''

[unit.step.gabarito]
solution = '''
#include <numeric>
#include <stdexcept>
#include <string>

class Fraction {
public:
    explicit Fraction(long long numerator, long long denominator = 1)
        : num_(numerator), den_(denominator) {
        if (den_ == 0) {
            throw std::invalid_argument("denominator must not be zero");
        }
        if (den_ < 0) {
            num_ = -num_;
            den_ = -den_;
        }
        const long long g = std::gcd(num_, den_);
        num_ /= g;
        den_ /= g;
    }

    long long num() const { return num_; }
    long long den() const { return den_; }

    Fraction plus(const Fraction& other) const {
        const long long g = std::gcd(den_, other.den_);
        return Fraction(num_ * (other.den_ / g) + other.num_ * (den_ / g), den_ / g * other.den_);
    }

    Fraction times(const Fraction& other) const {
        return Fraction(num_ * other.num_, den_ * other.den_);
    }

    std::string to_string() const {
        if (den_ == 1) {
            return std::to_string(num_);
        }
        return std::to_string(num_) + "/" + std::to_string(den_);
    }

private:
    long long num_;
    long long den_;
};
'''
time = "O(log min(|a|, |b|)) per operation"
space = "O(1)"
justification = '''
Every operation does a constant number of multiplications and divisions plus one call to
`std::gcd`. Euclid's algorithm takes **O(log min(|a|, |b|))** steps, because every two steps
at least halve the smaller number, so the constructor, `plus` and `times` all cost
O(log m) for the size m of the numbers involved. `num()` and `den()` are O(1), and
`to_string()` is linear in the number of digits. Each fraction stores two integers, so the
space is **O(1)**.

The design is what keeps that cost small. All normalisation happens in one place, the
constructor, and `plus` and `times` build their result *through* the constructor, so every
`Fraction` that exists satisfies the invariant: positive denominator, lowest terms, zero as
0/1. That is what makes `num()`/`den()` comparisons a valid test of equality. `plus` divides
by `gcd(den_, other.den_)` before multiplying, so the intermediate denominator is the least
common multiple rather than the full product; summing `1/(k(k+1))` or `1/2^k` stays far from
overflow. Without reduction, the denominators of the running sums would grow with every
addition until signed overflow, which is undefined behaviour, corrupted the results.
'''

[[unit]]
id = "cpp-u11-raii"
title = "RAII, destructors & file streams"
level = "intermediate"
difficulty = 11
intro = '''
In C++ the end of a scope is a precise moment: every local object is destroyed there, in
reverse order of construction, and its destructor runs. **RAII** (Resource Acquisition Is
Initialisation) builds on that guarantee: an object acquires a resource in its constructor
and releases it in its destructor, so files are closed and memory is freed on every path out
of a function. You will trace lifetimes, use the file streams, and wrap a C resource yourself.
'''
concepts = '''
## The idea

Programs hold **resources** that must be given back: heap memory, open files, sockets, locks,
database connections. Releasing them by hand, with a `close(f)` at the end of a function,
breaks as soon as the function has a second `return` or an exception skips the last line. C++
answers with a language guarantee: when an object's lifetime ends, its **destructor** runs,
automatically and at a predictable moment. **RAII** ties a resource's lifetime to an object's
lifetime: acquire in the constructor, release in the destructor. Cleanup then happens
wherever the object goes out of scope, and nobody can forget it.

## How C++ does it

A destructor is a member function named `~ClassName()`, with no parameters and no return
type. Local objects are destroyed at the closing brace of their scope, in **reverse order of
construction**, and also when an exception propagates out of the scope, which is called
**stack unwinding**.

```cpp
struct Guard {
    std::string name;
    explicit Guard(std::string n) : name(std::move(n)) { std::cout << "open " << name << '\n'; }
    ~Guard() { std::cout << "close " << name << '\n'; }
};

void work(bool fail) {
    Guard a("a");
    Guard b("b");
    if (fail) {
        return;              // prints "close b", then "close a"
    }
    std::cout << "done\n";
}                            // the same cleanup on the normal path
```

The standard library is RAII all the way down: `std::string` and `std::vector` free their
buffers, `std::unique_ptr` deletes its object, `std::lock_guard` unlocks a mutex, and the file
streams close their files.

```cpp
#include <fstream>

std::ofstream out("log.txt");   // opens (or creates) the file
out << "line 1\n";
// no close() needed: ~ofstream flushes and closes the file
```

`std::ifstream` reads, `std::ofstream` writes and `std::fstream` does both. A stream converts
to `bool`, so test `if (!in)` after opening: a missing file does not throw, it just leaves the
stream in a failed state. `std::getline(in, line)` returns the stream, which makes
`while (std::getline(in, line))` stop at the end of the file. `std::filesystem` (C++17)
builds paths with `/`, and offers `exists`, `remove` and `temp_directory_path`.

## Pitfalls

- **Copying a resource owner.** If a class that closes a handle in its destructor gets copied,
  both copies close the same handle: a double close or a double free. Delete the copy
  operations with `= delete`, or write move operations that empty the source.
- **Destructors must not throw.** They are `noexcept` by default, and an exception escaping one
  calls `std::terminate`.
- **Unchecked streams.** Reading from a stream that failed to open silently yields nothing.
- A raw owning pointer is not RAII: `new` without a matching `delete` leaks, especially on an
  early return. Prefer containers and smart pointers.
- When a constructor throws, the destructor of that object does **not** run, because the
  object never finished being built. Release anything acquired so far before throwing.

## What you will practise

You will watch constructors and destructors interleave across nested scopes, write and read a
file with the streams, and wrap C's `FILE*` in a small RAII class. The challenge is a
movable, non-copyable `TempFile` class that deletes its file exactly once.
'''

[[unit.step]]
kind = "concept"
id = "cpp-u11-c1-lifetimes"
title = "Lifetimes and stack unwinding"
points = 5
difficulty = 11
intro = '''
Every object has a lifetime with a precise beginning and end, decided by where it is
declared. RAII works because C++ guarantees that the end of a lifetime always runs the
destructor, whether the scope is left normally, by `return`, or by an exception.
'''
body = '''
## When objects die

- A **local variable** dies at the closing brace of the block that declares it. Locals in
  the same block die in reverse order of construction, so later objects, which may depend on
  earlier ones, are destroyed first.
- A **temporary**, such as the result of `std::string("a") + "b"`, dies at the end of the full
  expression that created it.
- A **data member** dies when its enclosing object dies, after the object's destructor body
  has run, in reverse order of declaration.
- A **heap object** created with `new` dies only at `delete`; that is why raw `new` needs an
  owner.

## Ending a lifetime early

A bare pair of braces creates a scope. Use one to release a resource before the end of the
function, for example to close a file before reading it back:

```cpp
{
    std::ofstream out(path);
    out << "data\n";
}   // out is closed here, so the data is on disk
std::ifstream in(path);
```

## Stack unwinding

When an exception is thrown, C++ leaves every scope between the `throw` and the matching
`catch`, and destroys each local object on the way, in the usual reverse order. Every
destructor still runs, which is why RAII code stays correct without any `try` blocks: the
cleanup lives in the destructors, not in the error-handling code.

The rule of thumb that follows is simple. Whenever you write "acquire ... release" as two
separate statements, ask which object's destructor should do the release instead.
'''

[[unit.step]]
