from django.db import migrations, models


class Migration(migrations.Migration):
    dependencies = [
        ("books", "0001_initial"),
    ]

    operations = [
        migrations.AddField(
            model_name="book",
            name="pages",
            field=models.PositiveIntegerField(default=0),
        ),
        migrations.AddField(
            model_name="book",
            name="status",
            field=models.CharField(
                choices=[("to_read", "To read"), ("reading", "Reading"), ("done", "Done")],
                default="to_read",
                max_length=10,
            ),
        ),
        migrations.AlterModelOptions(
            name="book",
            options={"ordering": ["title"]},
        ),
        migrations.AddConstraint(
            model_name="book",
            constraint=models.UniqueConstraint(fields=("title", "author"), name="unique_title_per_author"),
        ),
    ]
'''
"books/models.py" = '''
from django.db import models


class Author(models.Model):
    name = models.CharField(max_length=100, unique=True)

    class Meta:
        ordering = ["name"]

    def __str__(self):
        return self.name


class Book(models.Model):
    class Status(models.TextChoices):
        TO_READ = "to_read", "To read"
        READING = "reading", "Reading"
        DONE = "done", "Done"

    title = models.CharField(max_length=200)
    author = models.ForeignKey(Author, on_delete=models.CASCADE, related_name="books")
    pages = models.PositiveIntegerField(default=0)
    status = models.CharField(max_length=10, choices=Status.choices, default=Status.TO_READ)

    class Meta:
        ordering = ["title"]
        constraints = [
            models.UniqueConstraint(fields=["title", "author"], name="unique_title_per_author"),
        ]

    def __str__(self):
        return f"{self.title} by {self.author.name}"
'''

[[unit]]
id = "dj-u03-orm"
title = "The ORM: asking the database questions"
level = "basic"
difficulty = 3
intro = "QuerySets describe a query in Python; Django writes the SQL, runs it when you need the rows, and gives you objects back."
concepts = '''
## Managers and QuerySets

Every model has a **manager**, `objects`, and every query starts there:

```python
Book.objects.all()                                  # every book
Book.objects.filter(pages__gte=300)                 # WHERE pages >= 300
Book.objects.exclude(status=Book.Status.DONE)       # WHERE NOT status = 'done'
Book.objects.filter(author__name__iexact="frank herbert").order_by("-pages", "title")
Book.objects.get(pk=1)                              # exactly one row, or an exception
```

`filter`, `exclude` and `order_by` return a new **QuerySet**: a description of a query that
has **not run yet**. You can keep chaining. The query runs when you need the rows: iterating,
`list()`, `len()`, slicing with a step, `bool()`, or methods that return a value (`count()`,
`exists()`, `get()`, `first()`, `aggregate()`).

## Lookups follow relations

`field__lookup=value`: `exact`, `iexact` (any letter case), `contains`, `icontains`,
`startswith`, `gt`, `gte`, `lt`, `lte`, `in`… A double underscore also **follows a relation**:
`author__name__icontains="ursula"` joins the authors table for you. A minus sign in `order_by`
means descending; several fields break ties in order.

To combine conditions with OR, wrap them in **`Q` objects**:

```python
from django.db.models import Q

Book.objects.filter(Q(title__icontains=term) | Q(author__name__icontains=term))
```

## Aggregate and annotate

Counting and summing belong in the database, not in a Python loop:

```python
from django.db.models import Count, Sum

Book.objects.aggregate(total=Sum("pages"))          # {'total': 930}: ONE value for all rows
Author.objects.annotate(book_count=Count("books"))  # a value on EACH author
```

`aggregate` returns a dict, and the sum of no rows is `None`, not 0. `annotate` adds an
attribute to every object (`author.book_count`), and you can `order_by` it.

## The N + 1 problem

```python
for book in Book.objects.all():
    print(book.author.name)   # one extra query PER book
```

Each `book.author` loads the author with a query of its own: 1 query for the books + N for the
authors. **`select_related("author")`** joins the authors into the first query, so the loop is
**one** query. (For the reverse direction, many rows per object, there is
`prefetch_related`.) `assertNumQueries` in a test proves how many queries a piece of code runs.

## Changing many rows at once

`Book.objects.filter(author=a).update(status="done")` is **one** `UPDATE` statement and returns
the number of rows it changed: no objects are loaded, no `save()` per row.
'''

[[unit.step]]
