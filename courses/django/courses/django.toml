"books/api.py" = '''
import json

from django.forms.models import model_to_dict
from django.http import HttpResponse, JsonResponse
from django.urls import reverse
from django.views.decorators.http import require_http_methods

from .forms import BookForm
from .models import Book


def book_json(book):
    """A book as a JSON-ready dict: id, title, author (the name), pages, status and url."""
    return {
        "id": book.pk,
        "title": book.title,
        "author": book.author.name,
        "pages": book.pages,
        "status": book.status,
        "url": reverse("api-book", args=[book.pk]),
    }


def read_json(request):
    """The JSON object in the request body, or None when the body is not a JSON object."""
    try:
        data = json.loads(request.body or b"{}")
    except (ValueError, UnicodeDecodeError):
        return None
    return data if isinstance(data, dict) else None


def errors_json(form):
    """A form's errors as {field: [message, ...]} ("__all__" for the errors of the whole form)."""
    return {
        field: [error["message"] for error in errors]
        for field, errors in form.errors.get_json_data().items()
    }


# GET /api/books/ (optionally ?status=) -> {"books": [...]}; POST -> 201 with the new book, or 400
@require_http_methods(["GET", "POST"])
def books(request):
    if request.method == "GET":
        found = Book.objects.select_related("author")
        status = request.GET.get("status")
        if status:
            if status not in Book.Status.values:
                return JsonResponse({"error": f"unknown status: {status}"}, status=400)
            found = found.filter(status=status)
        return JsonResponse({"books": [book_json(book) for book in found]})
    data = read_json(request)
    if data is None:
        return JsonResponse({"error": "send a JSON object"}, status=400)
    form = BookForm(data)
    if not form.is_valid():
        return JsonResponse({"errors": errors_json(form)}, status=400)
    return JsonResponse(book_json(form.save()), status=201)


# GET /api/books/<pk>/ -> the book; PATCH -> change some fields; DELETE -> 204; unknown -> 404
@require_http_methods(["GET", "PATCH", "DELETE"])
def book(request, pk):
    try:
        found = Book.objects.select_related("author").get(pk=pk)
    except Book.DoesNotExist:
        return JsonResponse({"error": "not found"}, status=404)
    if request.method == "DELETE":
        found.delete()
        return HttpResponse(status=204)
    if request.method == "PATCH":
        data = read_json(request)
        if data is None:
            return JsonResponse({"error": "send a JSON object"}, status=400)
        current = model_to_dict(found, fields=BookForm.Meta.fields)
        form = BookForm({**current, **data}, instance=found)
        if not form.is_valid():
            return JsonResponse({"errors": errors_json(form)}, status=400)
        found = form.save()
    return JsonResponse(book_json(found))

'''

[[unit]]
id = "dj-u09-reviews"
title = "Final project: reviews, through every layer"
level = "advanced"
difficulty = 9
intro = "One new feature, from the database to the API: readers review books, and every part of the app learns about it."
concepts = '''
## A feature crosses every layer

Adding reviews to the bookshelf touches everything you built:

1. **the model**: a `Review` with a foreign key to `Book`, a rating that keeps its range, text
   and a creation time;
2. **the migration** that creates its table;
3. **a ModelForm** for the visitor's input;
4. **the views**: the book page shows the reviews and their average, and a POST-only view saves
   a new one;
5. **the template** of the book page;
6. **the admin**: reviews edited inline on the book's page;
7. **the API**: the reviews of a book in JSON.

Work in that order: each layer only needs the ones before it.

## Validators keep a range

```python
from django.core.validators import MaxValueValidator, MinValueValidator

rating = models.PositiveSmallIntegerField(validators=[MinValueValidator(1), MaxValueValidator(5)])
```

Validators are part of the field (and of its migration). They do **not** run on `save()`; they
run in `full_clean()`, and therefore in every ModelForm, which reports
`Ensure this value is less than or equal to 5.` for a 9.

## Averages and the empty case

`book.reviews.aggregate(avg=Avg("rating"))["avg"]` is the average, or **`None`** when there are
no reviews: show the average only when there is one (`{% if average is not None %}`), and format
it with `floatformat:1`.

## Saving a related object from a form

The review form has only `rating` and `text`; the book comes from the URL:

```python
review = form.save(commit=False)   # the object, not saved yet
review.book = book
review.save()
```

An invalid review re-renders the book page with the bound form and the status **400**: the page
is still useful, and a client (or a test) can tell that nothing was saved.

## All or nothing

Several writes that must succeed together go in `transaction.atomic()`: if anything inside raises,
every write in the block is rolled back. Django's test cases use the same mechanism to isolate
tests (unit 7).
'''

[[unit.step]]
kind = "concept"
id = "dj-u09-c1-plan"
title = "Plan the feature before the code"
points = 5
difficulty = 9
intro = '''
Before typing, list what each layer must know about reviews. The tests of the final project
check every line of this list.
'''
body = '''
## The checklist

| Layer | File | Reviews add |
|---|---|---|
| model | `models.py` | `Review(book, rating 1–5, text, created)`, newest first, `__str__` |
| migration | `migrations/0003_review.py` | one `CreateModel` that matches the model |
| form | `forms.py` | `ReviewForm` with `rating` and `text` |
| views | `views.py` | the book page gets `reviews`, `average`, `review_form`; `review_create` saves one |
| template | `book_detail.html` | the reviews, the average, the form |
| admin | `admin.py` | `ReviewInline` on `BookAdmin` |
| API | `api.py` | `GET /api/books/<pk>/reviews/` |

## The same rules everywhere

The rating's range is written once, as validators on the field. The ModelForm applies them to
the page, the admin applies them through its own forms, and the migration records them. One rule,
one place: that is the batteries-included way.
'''

