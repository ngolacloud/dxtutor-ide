target = '''
import django
from django.conf import settings

settings.configure(ROOT_URLCONF=__name__)
django.setup()

from django.http import HttpResponse
from django.urls import Resolver404, path, resolve, reverse


def book_page(request, book_id):
    return HttpResponse(f"Book #{book_id}")


urlpatterns = [
    path("books/<int:book_id>/", book_page, name="book-page"),
]

match = resolve("/books/42/")
print(match.func.__name__, match.kwargs, match.url_name)
print(reverse("book-page", args=[7]))
try:
    resolve("/books/seven/")
except Resolver404:
    print("no route for /books/seven/")
'''
