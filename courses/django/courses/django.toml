[[unit]]
id = "dj-u07-testing"
title = "Testing Django code"
level = "advanced"
difficulty = 7
intro = "Django's test runner gives every run a fresh database and every test a clean one; the test client drives your views end to end."
concepts = '''
## Running the tests

`python manage.py test` finds every `test*.py` module (the convention is `tests.py` in each
app), creates a **test database** from your migrations (with SQLite, in memory), runs the system
checks, then the tests, and destroys the database. The exit code is 0 only when every test
passed. Every project step of this course has been graded exactly this way.

## The test case classes

- `SimpleTestCase`: no database access (a test that queries fails loudly).
- `TestCase`: wraps the class and each test in a **transaction that is rolled back**, so every
  test starts from the same data. `setUpTestData` (a classmethod) creates that data once per
  class; this is the one to use by default.
- `TransactionTestCase`: really commits, then empties the tables after each test; for code that
  depends on transactions themselves.

## The test client

`self.client` sends requests through the whole stack (URLs, middleware, view, template) without
a server:

```python
response = self.client.get(reverse("book-list"), {"status": "done"})
self.assertEqual(response.status_code, 200)
self.assertEqual(list(response.context["books"]), [kindred])
self.assertTemplateUsed(response, "books/book_list.html")
self.assertContains(response, "Kindred")

response = self.client.post(reverse("book-create"), {"title": "Dune", ...})
self.assertRedirects(response, reverse("book-detail", args=[book.pk]))
```

`response.context` is the context the view rendered; `assertContains(response, text, html=True)`
compares HTML fragments regardless of whitespace; `self.client.force_login(user)` logs a user in
without a password.

## What makes a test worth having

A test is useful when it **fails if the code breaks**. Check the behaviour a user relies on, not
the implementation: the right books for a filter (not just status 200), the exact error message,
the redirect target, the text of `str()`. Other tools: `assertNumQueries(n)` fixes how many
queries a block runs; `RequestFactory` builds a request to call a view directly.

One way to measure a test suite is **mutation testing**: break the code on purpose, one change
at a time, and see whether some test notices. A broken version that no test catches is a gap in
the tests. This unit's project is graded that way.
'''

[[unit.step]]
kind = "concept"
id = "dj-u07-c1-isolation"
title = "Every test starts from the same world"
points = 5
difficulty = 7
intro = '''
Tests in a `TestCase` cannot see each other's changes. Picture each one inside a transaction
that is always rolled back.
'''
body = '''
## The life of a TestCase class

1. The runner built the test database from the migrations (once per run).
2. The class opens a transaction and runs `setUpTestData`: the shared data.
3. Each test opens a nested transaction (a savepoint), runs, and is **rolled back**: whatever it
   created, changed or deleted is undone before the next test.
4. At the end of the class, the outer transaction is rolled back too.

So a test may delete every book and the next one still finds them, and the order of the tests
never matters.

## Assert the behaviour

```python
def test_the_list_filters_by_status(self):
    response = self.client.get(reverse("book-list"), {"status": "done"})
    self.assertEqual(list(response.context["books"]), [self.messiah])
```

`status_code == 200` alone would pass for a list that ignores the filter. Ask what a user would
notice if the code were wrong, and assert exactly that.
'''

