## What goes where

| The view | The template |
|---|---|
| reads the request (`request.GET`), checks it | lays out the HTML |
| queries the models, once, with what it needs | loops, branches, formats values with filters |
| builds the context dict and calls `render()` | links with `{% url %}`, never builds paths |
