target = '''
import django
from django.conf import settings

settings.configure()
django.setup()

from django import forms


class ProgressForm(forms.Form):
    title = forms.CharField()
    pages = forms.IntegerField(min_value=1)
    read = forms.IntegerField(min_value=0)

    def clean_title(self):
        return " ".join(self.cleaned_data["title"].split())

    def clean(self):
        data = super().clean()
        if "pages" in data and "read" in data and data["read"] > data["pages"]:
            raise forms.ValidationError("You cannot read more pages than the book has.")
        return data


