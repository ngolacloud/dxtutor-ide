"books/views.py" = '''
from django.shortcuts import get_object_or_404, redirect, render
from django.views.decorators.http import require_GET, require_http_methods

from .forms import BookForm
from .models import Book


# GET / -> books/book_list.html with books, status and statuses (see the instructions)
@require_GET
def book_list(request):
    books = Book.objects.select_related("author")
    status = request.GET.get("status", "")
    if status in Book.Status.values:
        books = books.filter(status=status)
    else:
        status = ""
    context = {"books": books, "status": status, "statuses": Book.Status.choices}
    return render(request, "books/book_list.html", context)


# GET /books/<pk>/ -> books/book_detail.html with the book; 404 when there is none
@require_GET
def book_detail(request, pk):
    book = get_object_or_404(Book.objects.select_related("author"), pk=pk)
    return render(request, "books/book_detail.html", {"book": book})


# GET /books/new/ -> an empty BookForm; POST -> save and redirect to the new book, or show the errors
@require_http_methods(["GET", "POST"])
def book_create(request):
    if request.method == "POST":
        form = BookForm(request.POST)
        if form.is_valid():
            book = form.save()
            return redirect("book-detail", pk=book.pk)
    else:
        form = BookForm()
    return render(request, "books/book_form.html", {"form": form})
'''
