"books/tests.py" = '''
from django.test import TestCase
from django.urls import reverse

from .forms import BookForm
from .models import Author, Book


class BookshelfTests(TestCase):
    @classmethod
    def setUpTestData(cls):
        cls.frank = Author.objects.create(name="Frank Herbert")
        cls.dune = Book.objects.create(title="Dune", author=cls.frank, pages=412)
        cls.messiah = Book.objects.create(
            title="Dune Messiah", author=cls.frank, pages=256, status=Book.Status.DONE
        )

    def test_str_names_the_title_and_the_author(self):
        self.assertEqual(str(self.dune), "Dune by Frank Herbert")

    def test_a_book_needs_at_least_one_page(self):
        form = BookForm({"title": "Empty", "author": self.frank.pk, "pages": 0, "status": "to_read"})
        self.assertFalse(form.is_valid())
        self.assertEqual(form.errors["pages"], ["A book has at least one page."])

    def test_the_list_filters_by_status(self):
        response = self.client.get(reverse("book-list"), {"status": "done"})
        self.assertEqual(response.status_code, 200)
        self.assertEqual(list(response.context["books"]), [self.messiah])

    def test_creating_a_book_redirects_to_its_page(self):
        response = self.client.post(
            reverse("book-create"),
            {"title": "Children of Dune", "author": self.frank.pk, "pages": 444, "status": "to_read"},
        )
        book = Book.objects.get(title="Children of Dune")
        self.assertRedirects(response, reverse("book-detail", args=[book.pk]))

    def test_a_missing_book_is_not_found(self):
        response = self.client.get(reverse("book-detail", args=[999]))
        self.assertEqual(response.status_code, 404)
'''

[[unit]]
id = "dj-u08-json-api"
title = "A JSON API with plain Django"
level = "advanced"
difficulty = 8
intro = "The same models and forms can answer in JSON: read the body, validate it with the form, and reply with the right status code."
concepts = '''
## JSON in, JSON out

An API view is still a view: it takes a request and returns a response. Only the formats change.

```python
import json

from django.http import JsonResponse


def books(request):
    data = [{"id": b.pk, "title": b.title} for b in Book.objects.all()]
    return JsonResponse({"books": data})
```

`JsonResponse` serialises a dict (or, with `safe=False`, any JSON value) and sets
`Content-Type: application/json`. Wrap lists in an object, `{"books": [...]}`: it leaves room
to add fields later.

A JSON request body is **not** form data: it is in `request.body` (bytes), not in
`request.POST`. `json.loads(request.body)` reads it and raises `ValueError` (or
`UnicodeDecodeError`) when it is not JSON. Valid JSON can still be the wrong shape (a list, a
number): check that you got an object.

## Status codes are part of the answer

| Code | When |
|---|---|
| 200 OK | a read, or an update that worked |
| 201 Created | a POST that created something (return it) |
| 204 No Content | a DELETE that worked (empty body) |
| 400 Bad Request | the client sent something wrong: not JSON, invalid data |
| 404 Not Found | no such object: answer in JSON too, `{"error": "not found"}` |
| 405 Method Not Allowed | `require_http_methods` refuses the other methods |

## Validate with the form you already have

The rules for a book live in `BookForm`: reuse it. A form accepts any dict, so the parsed JSON
goes straight in, and `form.errors.get_json_data()` turns the errors into plain data:

```python
form = BookForm(data)
if not form.is_valid():
    return JsonResponse({"errors": errors_json(form)}, status=400)
book = form.save()
return JsonResponse(book_json(book), status=201)
```

For a **PATCH** (change only the fields sent), start from the current values,
`model_to_dict(book, fields=BookForm.Meta.fields)`, put the sent fields on top, and bind the form
to the existing object with `instance=book`, so `save()` updates instead of creating.

## CSRF and APIs

The CSRF check (unit 5) applies to every POST, PATCH and DELETE. A page of your own site that
calls the API with JavaScript sends the token in the `X-CSRFToken` header. An API for other
programs uses token authentication instead (Django REST framework, or your own), which is beyond
this course. The test client skips the check, so the tests here exercise the API directly.
'''

[[unit.step]]
kind = "concept"
id = "dj-u08-c1-shape"
title = "An API is a contract of shapes and codes"
points = 5
difficulty = 8
intro = '''
A client of your API cannot read your code; it reads your JSON and your status codes. Keep both
predictable.
'''
body = '''
## One shape per thing

Every book leaves the API in the same shape, built in one function:

```python
def book_json(book):
    return {"id": book.pk, "title": book.title, "author": book.author.name,
            "pages": book.pages, "status": book.status,
            "url": reverse("api-book", args=[book.pk])}
```

The list returns `{"books": [book_json(b), ...]}`, a create returns the new book, an update the
updated book. Errors have a shape too: `{"error": "..."}` for a request that makes no sense,
`{"errors": {"field": ["message"]}}` for invalid data.

## The resource and its methods

| Method and path | Does | Answers |
|---|---|---|
| `GET /api/books/` | list (filter with `?status=`) | 200 |
| `POST /api/books/` | create | 201, or 400 |
| `GET /api/books/<pk>/` | read one | 200, or 404 |
| `PATCH /api/books/<pk>/` | change some fields | 200, 400, or 404 |
| `DELETE /api/books/<pk>/` | delete | 204, or 404 |
'''

