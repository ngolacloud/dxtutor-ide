        self.assertTemplateUsed(response, "books/book_form.html")
        self.assertTrue(response.context["form"].is_bound)
        self.assertContains(response, "A book has at least one page.")
        self.assertContains(response, 'value="The Hobbit"')
        self.assertEqual(Book.objects.count(), 0)

    def test_other_methods_are_refused(self):
        self.assertEqual(self.client.put(reverse("book-create")).status_code, 405)
