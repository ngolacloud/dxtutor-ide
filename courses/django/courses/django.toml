        fields = ["title", "author", "pages", "status"]

    def clean_title(self):
        # Collapse runs of spaces inside the title ("The   Hobbit" -> "The Hobbit").
        return " ".join(self.cleaned_data["title"].split())

    def clean_pages(self):
        pages = self.cleaned_data["pages"]
        if pages < 1:
            raise forms.ValidationError("A book has at least one page.")
        return pages
