[[unit]]
id = "dj-u01-views"
title = "Views and URLs: from a path to a response"
level = "basic"
difficulty = 1
intro = "Every Django page starts the same way: the URLconf picks a view, and the view returns a response."
concepts = '''
## The request/response cycle

When a browser asks for `/books/42/`, Django builds an **`HttpRequest`** object (the method,
the path, the query string in `request.GET`, the form data in `request.POST`, the headers), finds
the code that handles that path, calls it, and sends back the **`HttpResponse`** it returns.

The code that handles a path is a **view**: a plain Python function.

```python
from django.http import HttpResponse


def home(request):
    return HttpResponse("Welcome to the bookshelf.")
```

A response has a body, a status code (200 unless you say otherwise) and headers.
`HttpResponseBadRequest` is a response with status 400, `HttpResponseNotFound` one with 404.

## The URLconf

Which view handles which path is written in a **URLconf**: a module with a list called
`urlpatterns`. The project's `config/urls.py` (the `ROOT_URLCONF`) **includes** the URLs of each
app, so every app keeps its own routes in its own `urls.py`:

```python
# books/urls.py
from django.urls import path

from . import views

urlpatterns = [
    path("", views.home, name="home"),
    path("books/<int:book_id>/", views.book_page, name="book-page"),
]
```

- `path(route, view, name=...)`: Django tries the routes **in order** and calls the first view
  that matches. No match is a **404**.
- `<int:book_id>` is a **path converter**: it matches digits and passes the view
  `book_id=42` as an `int`. Other converters: `str` (anything but `/`), `slug`, `uuid`, `path`.
- `name` lets the rest of the code refer to a route without writing the path:
  `reverse("book-page", args=[42])` gives `"/books/42/"`, and in a template
  `{% url 'book-page' 42 %}`. Change the path once, every link follows.

## Query strings and methods

`/search/?q=dune` reaches the `search` view; the query string is in `request.GET`, a
dictionary-like object: `request.GET.get("q", "")`. The HTTP method is `request.method`
(`"GET"`, `"POST"`…). The decorators in `django.views.decorators.http` refuse the methods a
view does not handle with **405 Method Not Allowed**: `@require_GET`, `@require_POST`,
`@require_http_methods(["GET", "POST"])`.

## Never trust what arrives

A name in the URL or a term in the query string is text the visitor chose. Putting it in an
HTML response as it is lets them inject markup (a `<script>`). `django.utils.html.escape`
turns `<`, `>`, `&` and quotes into entities. Templates (unit 4) do this for you automatically;
a hand-built `HttpResponse` does not.

## The project you will work in

Every project step is a real Django project: `manage.py`, the settings package `config/`
(`settings.py`, `urls.py`) and one app, `books/`. The app is already listed in
`INSTALLED_APPS`, and `config/urls.py` already includes `books.urls` at the root and the admin
under `/admin/`. In this unit you write `books/views.py` and `books/urls.py`.
'''

[[unit.step]]
kind = "concept"
id = "dj-u01-c1-cycle"
title = "A view turns a request into a response"
points = 5
difficulty = 1
intro = '''
Before typing, follow one request through Django: from the path, to the view, to the response.
'''
body = '''
## Three objects and a list

```python
# books/views.py
from django.http import HttpResponse


def book_page(request, book_id):
    return HttpResponse(f"Book #{book_id}")
```

```python
# books/urls.py
urlpatterns = [path("books/<int:book_id>/", views.book_page, name="book-page")]
```

For `GET /books/42/`:

1. Django turns the HTTP request into an **`HttpRequest`**;
2. the URLconf matches `books/<int:book_id>/` and converts `"42"` to the int `42`;
3. Django calls `book_page(request, book_id=42)`;
4. the view returns an **`HttpResponse`** whose body is `Book #42` and whose status is 200.

`/books/abc/` matches no route (the `int` converter refuses it), so Django answers **404**
without calling any view.

## Names, not paths

Code and templates link to routes by **name**: `reverse("book-page", args=[42])` →
`/books/42/`. That is why every route in this course has a `name`.
'''

