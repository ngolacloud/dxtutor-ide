[unit.step.project.tests]
"tests/__init__.py" = ""
"tests/test_pages.py" = '''
from django.test import SimpleTestCase
from django.urls import Resolver404, resolve, reverse

from books import views


class HomeTests(SimpleTestCase):
    def test_home_says_welcome(self):
        response = self.client.get("/")
        self.assertEqual(response.status_code, 200)
        self.assertEqual(response.content.decode(), "Welcome to the bookshelf.")

    def test_home_is_the_route_named_home(self):
        self.assertEqual(reverse("home"), "/")
        self.assertIs(resolve("/").func, views.home)

    def test_home_only_answers_get(self):
        self.assertEqual(self.client.post("/").status_code, 405)


class BookPageTests(SimpleTestCase):
    def test_shows_the_book_number(self):
        response = self.client.get("/books/42/")
        self.assertEqual(response.status_code, 200)
        self.assertEqual(response.content.decode(), "Book #42")

    def test_the_converter_gives_the_view_an_int(self):
        match = resolve("/books/5/")
        self.assertIs(match.func, views.book_page)
        self.assertEqual(match.kwargs, {"book_id": 5})

    def test_the_route_is_named_book_page(self):
        self.assertEqual(reverse("book-page", args=[7]), "/books/7/")

    def test_a_path_that_is_not_a_number_is_not_found(self):
        self.assertEqual(self.client.get("/books/abc/").status_code, 404)
        with self.assertRaises(Resolver404):
            resolve("/books/abc/")

    def test_only_get(self):
        self.assertEqual(self.client.delete("/books/1/").status_code, 405)


class HelloTests(SimpleTestCase):
    def test_greets_by_name(self):
        self.assertEqual(self.client.get("/hello/Ana/").content.decode(), "Hello, Ana!")

    def test_the_route_is_named_hello(self):
        self.assertEqual(reverse("hello", kwargs={"name": "Rui"}), "/hello/Rui/")

    def test_the_name_is_escaped(self):
        response = self.client.get("/hello/%3Cb%3EAna/")
        self.assertEqual(response.status_code, 200)
        self.assertEqual(response.content.decode(), "Hello, &lt;b&gt;Ana!")


class SearchTests(SimpleTestCase):
    def test_reads_the_query_string(self):
        response = self.client.get("/search/", {"q": "dune"})
        self.assertEqual(response.status_code, 200)
        self.assertEqual(response.content.decode(), "Results for: dune")

    def test_the_route_is_named_search(self):
        self.assertEqual(reverse("search"), "/search/")

    def test_the_term_is_trimmed_and_escaped(self):
        response = self.client.get("/search/", {"q": "  <i>war</i> "})
        self.assertEqual(response.content.decode(), "Results for: &lt;i&gt;war&lt;/i&gt;")

    def test_no_term_is_a_bad_request(self):
        self.assertEqual(self.client.get("/search/").status_code, 400)
        self.assertEqual(self.client.get("/search/", {"q": "   "}).status_code, 400)
'''

[unit.step.project.solution]
"books/urls.py" = '''
from django.urls import path

from . import views

# Map each path to its view and give every route a name.
urlpatterns = [
    path("", views.home, name="home"),
    path("books/<int:book_id>/", views.book_page, name="book-page"),
    path("hello/<str:name>/", views.hello, name="hello"),
    path("search/", views.search, name="search"),
]
'''
"books/views.py" = '''
from django.http import HttpResponse, HttpResponseBadRequest
from django.utils.html import escape
from django.views.decorators.http import require_GET


# GET / -> "Welcome to the bookshelf."
@require_GET
def home(request):
    return HttpResponse("Welcome to the bookshelf.")


# GET /books/<book_id>/ -> "Book #<book_id>"
@require_GET
def book_page(request, book_id):
    return HttpResponse(f"Book #{book_id}")


# GET /hello/<name>/ -> "Hello, <name>!" (the name escaped)
@require_GET
def hello(request, name):
    return HttpResponse(f"Hello, {escape(name)}!")


# GET /search/?q=<term> -> "Results for: <term>" (escaped); no q -> 400
@require_GET
def search(request):
    term = request.GET.get("q", "").strip()
    if not term:
        return HttpResponseBadRequest("Missing the q parameter.")
    return HttpResponse(f"Results for: {escape(term)}")
'''

[[unit]]
id = "dj-u02-models"
title = "Models and migrations: the database in Python"
level = "basic"
difficulty = 2
intro = "A model is a Python class that Django maps to a table; a migration is the recorded change that creates or alters it."
concepts = '''
## A model is a table

```python
from django.db import models


class Author(models.Model):
    name = models.CharField(max_length=100, unique=True)

    class Meta:
        ordering = ["name"]

    def __str__(self):
        return self.name
```

Each **model** becomes a table (`books_author`: the app label, then the model name), each
**field** a column, each instance a row. Django adds an `id` primary key by itself. Common fields:
`CharField(max_length=…)`, `TextField`, `IntegerField`, `PositiveIntegerField` (the database
refuses negatives), `BooleanField`, `DateTimeField(auto_now_add=True)` (set when the row is
created), and `ForeignKey`:

```python
author = models.ForeignKey(Author, on_delete=models.CASCADE, related_name="books")
```

A foreign key stores the id of another row. `on_delete=CASCADE` deletes the books with their
author; `related_name="books"` names the way back: `author.books.all()`.

## Choices, defaults and Meta

A field with **choices** only accepts the listed values. `TextChoices` keeps them in one place:

```python
class Status(models.TextChoices):
    TO_READ = "to_read", "To read"   # stored value, human label
    DONE = "done", "Done"

status = models.CharField(max_length=10, choices=Status.choices, default=Status.TO_READ)
```

`book.get_status_display()` returns the label. The inner **`class Meta`** holds options of the
whole model: `ordering` (the default `ORDER BY`), and `constraints`, such as
`models.UniqueConstraint(fields=["title", "author"], name="unique_title_per_author")`, which
makes the **database** refuse a second book with the same title by the same author. And
`__str__` is how a row shows up in the shell, the admin and error messages.

## Migrations record every change

The database does not read your Python. A **migration** is a file in `books/migrations/` that
lists the operations to bring the tables up to date:

```python
class Migration(migrations.Migration):
    dependencies = [("books", "0001_initial")]

    operations = [
        migrations.AddField(model_name="book", name="pages", field=models.PositiveIntegerField(default=0)),
    ]
```

`python manage.py makemigrations` compares your models with the migrations and **writes** the
next one; `python manage.py migrate` **applies** them, in the order of their `dependencies`. The
test runner builds its database from the migrations, so a model change without its migration
fails as soon as a test touches the new column. `makemigrations --check` fails when the two
disagree: CI uses it, and so do this unit's tests.

The operations you need here: `AddField`, `AlterModelOptions` (for `ordering`) and
`AddConstraint`. A new field on a table that already has rows needs a value for those rows: a
`default`.
'''

[[unit.step]]
kind = "concept"
id = "dj-u02-c1-migrations"
title = "The model is the truth, the migration is its history"
points = 5
difficulty = 2
intro = '''
Picture two things side by side: the models as they are now, and the list of migrations that
built the tables step by step. They must tell the same story.
'''
body = '''
## Two descriptions of the same table

- **`models.py`** says what the table looks like **now**.
- **`migrations/`** says how it **got** there: `0001_initial` created it, `0002_…` added a
  column, and so on. Each one names the one before in `dependencies`.

`makemigrations` is the bridge: it replays the migrations in memory, compares the result with
your models and writes the operations for the difference. When nothing differs it says
`No changes detected`; with `--check` it fails instead of writing, which is how tests and CI
catch a forgotten migration.

## What a migration records

Not SQL: Python **operations** (`CreateModel`, `AddField`, `AlterModelOptions`,
`AddConstraint`…) with the full description of each field, its arguments included (`default`,
`choices`, `max_length`). That is why changing the choices of a field is a migration too, and
why the same migrations work on SQLite, PostgreSQL or MySQL.

In this unit you write a migration by hand, the way `makemigrations` would: it is the best way
to see what one contains.
'''

