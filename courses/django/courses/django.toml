"tests/test_grader.py" = '''
"""Grades the learner's tests (books/tests.py): they must pass against the real app and fail
against each of four broken versions of it (mutants). A mutant swaps the code of one function
for a broken one while the learner's tests run, then puts the real code back."""

import unittest
from contextlib import contextmanager

from django.test import SimpleTestCase

import books.tests as learner
from books import views
from books.forms import BookForm
from books.models import Book


# ── the broken versions (each one uses only names its real module already has) ──


def str_without_author(self):
    return self.title


def clean_pages_without_check(self):
    return self.cleaned_data["pages"]


def book_list_ignoring_status(request):
    books = Book.objects.select_related("author")
    context = {"books": books, "status": "", "statuses": Book.Status.choices}
    return render(request, "books/book_list.html", context)  # noqa: F821 (views has render)


def book_create_without_redirect(request):
    form = BookForm(request.POST or None)  # noqa: F821 (views has BookForm)
    if request.method == "POST" and form.is_valid():
        form.save()
    return render(request, "books/book_form.html", {"form": form})  # noqa: F821


MUTANTS = [
    (Book.__str__, str_without_author, "str(book) leaves out the author"),
    (BookForm.clean_pages, clean_pages_without_check, "BookForm accepts a book with 0 pages"),
    (views.book_list.__wrapped__, book_list_ignoring_status, "the list ignores ?status="),
    (views.book_create.__wrapped__, book_create_without_redirect, "a valid new book does not redirect to its page"),
]


@contextmanager
def broken(function, replacement):
    real = function.__code__
    function.__code__ = replacement.__code__
    try:
        yield
    finally:
        function.__code__ = real


def run_learner_tests():
    suite = unittest.defaultTestLoader.loadTestsFromModule(learner)
    result = unittest.TestResult()
    suite.run(result)
    return suite.countTestCases(), result


def problems(result):
    return "\n".join(f"{test}: {trace.splitlines()[-1]}" for test, trace in result.failures + result.errors)


class GradeLearnerTests(SimpleTestCase):
    databases = "__all__"

    def test_there_are_at_least_four_tests(self):
        count, _ = run_learner_tests()
        self.assertGreaterEqual(count, 4, "write at least four test methods in books/tests.py")

    def test_they_pass_against_the_real_app(self):
        count, result = run_learner_tests()
        self.assertGreater(count, 0, "books/tests.py has no tests yet")
        self.assertTrue(result.wasSuccessful(), "your tests fail against the real app:\n" + problems(result))

    def test_each_broken_version_is_caught(self):
        survived = []
        for function, replacement, what in MUTANTS:
            with broken(function, replacement):
                count, result = run_learner_tests()
            if count == 0 or result.wasSuccessful():
                survived.append(what)
        self.assertEqual(survived, [], "your tests still pass when: " + "; ".join(survived))

    def test_the_real_code_is_back(self):
        # the mutants never leak: the real functions run after grading
        run_learner_tests()
        for function, replacement, _ in MUTANTS:
            self.assertIsNot(function.__code__, replacement.__code__)
'''

