</form>
{% endblock %}
'''
"books/views.py" = '''
from django.shortcuts import get_object_or_404, redirect, render
from django.views.decorators.http import require_GET, require_http_methods

from .forms import BookForm
from .models import Book


# GET / -> books/book_list.html with books, status and statuses (see the instructions)
@require_GET
def book_list(request):
    books = Book.objects.select_related("author")
    status = request.GET.get("status", "")
    if status in Book.Status.values:
        books = books.filter(status=status)
    else:
        status = ""
    context = {"books": books, "status": status, "statuses": Book.Status.choices}
    return render(request, "books/book_list.html", context)


# GET /books/<pk>/ -> books/book_detail.html with the book; 404 when there is none
@require_GET
def book_detail(request, pk):
    book = get_object_or_404(Book.objects.select_related("author"), pk=pk)
    return render(request, "books/book_detail.html", {"book": book})


# GET /books/new/ -> an empty BookForm; POST -> save and redirect to the new book, or show the errors
@require_http_methods(["GET", "POST"])
def book_create(request):
    if request.method == "POST":
        form = BookForm(request.POST)
        if form.is_valid():
            book = form.save()
            return redirect("book-detail", pk=book.pk)
    else:
        form = BookForm()
    return render(request, "books/book_form.html", {"form": form})
'''

[[unit]]
id = "dj-u06-admin"
title = "The admin: a back office for free"
level = "intermediate"
difficulty = 6
intro = "Register a model and Django builds pages to list, search, filter, create and edit it, behind a staff login."
concepts = '''
## Register a model

`django.contrib.admin` reads your models and builds a complete back office at `/admin/`: lists,
search, filters, add and change forms, deletion with confirmation, a history of changes. You only
say which models to show and how:

```python
from django.contrib import admin

from .models import Book


@admin.register(Book)
class BookAdmin(admin.ModelAdmin):
    list_display = ["title", "author", "pages", "status"]   # the columns of the list
    list_filter = ["status"]                                # the filter sidebar
    search_fields = ["title", "author__name"]               # the search box (?q=)
    list_select_related = ["author"]                        # one query for the author column
```

`@admin.register(Book)` is the same as `admin.site.register(Book, BookAdmin)`.

## Columns that are not fields

A `list_display` entry can name a method of the `ModelAdmin`. `@admin.display` gives it a column
title and, with `ordering`, makes the column sortable by a database value:

```python
def get_queryset(self, request):
    return super().get_queryset(request).annotate(num_books=Count("books"))

@admin.display(description="Books", ordering="num_books")
def book_count(self, author):
    return author.num_books
```

Annotating in `get_queryset` counts in the same query as the list: no query per row.

## Inlines and actions

An **inline** edits related rows on the parent's page: the books of an author on the author's
page.

```python
class BookInline(admin.TabularInline):
    model = Book
    extra = 0                       # no empty extra rows
    fields = ["title", "pages", "status"]
```

and `inlines = [BookInline]` on the author's admin. An **action** works on the rows selected in
the list:

```python
actions = ["mark_done"]

@admin.action(description="Mark selected books as done")
def mark_done(self, request, queryset):
    updated = queryset.update(status=Book.Status.DONE)
    self.message_user(request, f"{updated} book(s) marked as done.")
```

## Who gets in

Only users with `is_staff` reach the admin; a **superuser** has every permission. For other
staff, each model has four permissions (`add_`, `change_`, `delete_`, `view_`) that you grant to
users or groups. `python manage.py createsuperuser` makes the first account. The admin also
**checks its configuration** at start-up: a column that names no field nor method is an error
(`admin.E108`), caught by `manage.py check` and by the test runner.
'''

[[unit.step]]
kind = "concept"
id = "dj-u06-c1-modeladmin"
title = "A ModelAdmin is configuration, not pages"
points = 5
difficulty = 6
intro = '''
You do not write the admin's pages; you describe your models to it, and it builds them.
'''
body = '''
## Options, mostly

| You want | Option |
|---|---|
| columns in the list | `list_display` (fields, or methods with `@admin.display`) |
| a filter sidebar | `list_filter` |
| a search box | `search_fields`, which may follow relations: `author__name` |
| one query for related columns | `list_select_related` |
| related rows on the parent's page | `inlines` with a `TabularInline`/`StackedInline` |
| bulk operations on the selected rows | `actions` with `@admin.action` |

Everything else (the HTML, the forms, the pagination, permissions, the history) comes from
Django.

## Who it is for

The admin is a tool for the people who run the site: staff. It is not the public face of an
app, which is why the bookshelf has its own pages (units 4 and 5) as well.
'''

