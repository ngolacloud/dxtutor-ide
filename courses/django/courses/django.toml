        return {"title": "The Hobbit", "author": self.tolkien.pk, "pages": 310, "status": "to_read", **over}

    def test_a_model_form_for_book_with_four_fields(self):
        self.assertIs(BookForm._meta.model, Book)
        self.assertEqual(list(BookForm().fields), ["title", "author", "pages", "status"])

    def test_valid_data_is_cleaned(self):
        form = BookForm(self.data())
        self.assertTrue(form.is_valid(), form.errors)
        self.assertEqual(form.cleaned_data["author"], self.tolkien)
        self.assertEqual(form.cleaned_data["pages"], 310)

    def test_runs_of_spaces_in_the_title_collapse(self):
        form = BookForm(self.data(title="  The    Hobbit  "))
        self.assertTrue(form.is_valid(), form.errors)
        self.assertEqual(form.cleaned_data["title"], "The Hobbit")

    def test_a_book_has_at_least_one_page(self):
        form = BookForm(self.data(pages=0))
        self.assertFalse(form.is_valid())
        self.assertEqual(form.errors["pages"], ["A book has at least one page."])

    def test_the_title_is_required(self):
        form = BookForm(self.data(title="   "))
        self.assertFalse(form.is_valid())
        self.assertEqual(form.errors["title"], ["This field is required."])

    def test_an_unknown_status_is_refused(self):
        form = BookForm(self.data(status="lost"))
        self.assertFalse(form.is_valid())
        self.assertIn("status", form.errors)

    def test_the_same_title_twice_for_one_author_is_refused(self):
        Book.objects.create(title="The Hobbit", author=self.tolkien, pages=310)
        form = BookForm(self.data(title="The  Hobbit"))
        self.assertFalse(form.is_valid())
        self.assertEqual(
            form.non_field_errors(), ["Book with this Title and Author already exists."]
        )


class BookCreateViewTests(TestCase):
    @classmethod
    def setUpTestData(cls):
        cls.tolkien = Author.objects.create(name="J. R. R. Tolkien")

    def test_get_shows_an_empty_form(self):
        response = self.client.get(reverse("book-create"))
        self.assertEqual(response.status_code, 200)
        self.assertTemplateUsed(response, "books/book_form.html")
        self.assertTemplateUsed(response, "books/base.html")
        self.assertIsInstance(response.context["form"], BookForm)
        self.assertFalse(response.context["form"].is_bound)
        self.assertContains(response, "<title>New book · Bookshelf</title>", html=True)
        self.assertContains(response, "<h1>New book</h1>", html=True)
        self.assertContains(response, 'name="csrfmiddlewaretoken"')
        self.assertContains(response, '<form method="post" novalidate>')
        for name in ["title", "author", "pages", "status"]:
            self.assertContains(response, f'name="{name}"')
        self.assertContains(response, '<button type="submit">Save</button>', html=True)

    def test_a_valid_post_saves_and_redirects_to_the_book(self):
        response = self.client.post(
            reverse("book-create"),
            {"title": " The   Hobbit ", "author": self.tolkien.pk, "pages": "310", "status": "reading"},
        )
        book = Book.objects.get()
        self.assertEqual((book.title, book.pages, book.status), ("The Hobbit", 310, "reading"))
        self.assertRedirects(response, reverse("book-detail", args=[book.pk]))

    def test_an_invalid_post_shows_the_errors_and_saves_nothing(self):
        response = self.client.post(
            reverse("book-create"),
            {"title": "The Hobbit", "author": self.tolkien.pk, "pages": "0", "status": "to_read"},
        )
