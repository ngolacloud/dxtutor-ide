"books/admin.py" = '''
from django.contrib import admin
from django.db.models import Count

from .models import Author, Book


class BookInline(admin.TabularInline):
    model = Book
    extra = 0
    fields = ["title", "pages", "status"]


@admin.register(Author)
class AuthorAdmin(admin.ModelAdmin):
    list_display = ["name", "book_count"]
    search_fields = ["name"]
    inlines = [BookInline]

    def get_queryset(self, request):
        return super().get_queryset(request).annotate(num_books=Count("books"))

    @admin.display(description="Books", ordering="num_books")
    def book_count(self, author):
        return author.num_books


@admin.register(Book)
class BookAdmin(admin.ModelAdmin):
    list_display = ["title", "author", "pages", "status"]
    list_filter = ["status"]
    search_fields = ["title", "author__name"]
    list_select_related = ["author"]
    actions = ["mark_done"]

    @admin.action(description="Mark selected books as done")
    def mark_done(self, request, queryset):
        updated = queryset.update(status=Book.Status.DONE)
        self.message_user(request, f"{updated} book(s) marked as done.")
'''

