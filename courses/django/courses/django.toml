from django.db import models


class Author(models.Model):
    name = models.CharField(max_length=100, unique=True)

    class Meta:
        ordering = ["name"]

    def __str__(self):
        return self.name


class Book(models.Model):
    class Status(models.TextChoices):
        TO_READ = "to_read", "To read"
        READING = "reading", "Reading"
        DONE = "done", "Done"

    title = models.CharField(max_length=200)
    author = models.ForeignKey(Author, on_delete=models.CASCADE, related_name="books")
    pages = models.PositiveIntegerField(default=0)
    status = models.CharField(max_length=10, choices=Status.choices, default=Status.TO_READ)

    class Meta:
        ordering = ["title"]
        constraints = [
            models.UniqueConstraint(fields=["title", "author"], name="unique_title_per_author"),
        ]

    def __str__(self):
        return f"{self.title} by {self.author.name}"
'''
"books/queries.py" = '''
from django.db.models import Count, Q, Sum

from .models import Author, Book


def books_by(author_name):
    """The books of the author called `author_name` (any letter case), by title."""
    return Book.objects.filter(author__name__iexact=author_name).order_by("title")


def unread_long_books(min_pages):
    """Books not done yet with at least `min_pages` pages, the longest first (ties by title)."""
    return (
        Book.objects.filter(pages__gte=min_pages)
        .exclude(status=Book.Status.DONE)
        .order_by("-pages", "title")
    )


def search(term):
    """Books whose title or author name contains `term` (any letter case), by title."""
    return (
        Book.objects.filter(Q(title__icontains=term) | Q(author__name__icontains=term))
        .order_by("title")
    )


def authors_with_book_counts():
    """Every author with a `book_count` attribute, the most books first, then by name."""
    return Author.objects.annotate(book_count=Count("books")).order_by("-book_count", "name")


def pages_read():
    """The total pages of the books that are done (0 when there are none)."""
    return Book.objects.filter(status=Book.Status.DONE).aggregate(total=Sum("pages"))["total"] or 0


def shelf():
    """Every book with its author loaded in the same query, by title."""
    return Book.objects.select_related("author").order_by("title")


def finish_all_by(author):
    """Marks every book of `author` as done in one UPDATE; returns how many changed."""
    return Book.objects.filter(author=author).exclude(status=Book.Status.DONE).update(
        status=Book.Status.DONE
    )
'''
