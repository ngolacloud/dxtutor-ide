import json

from django.forms.models import model_to_dict
from django.http import HttpResponse, JsonResponse
from django.urls import reverse
from django.views.decorators.http import require_http_methods

from .forms import BookForm
from .models import Book


def book_json(book):
    """A book as a JSON-ready dict: id, title, author (the name), pages, status and url."""
    return {
        "id": book.pk,
        "title": book.title,
        "author": book.author.name,
        "pages": book.pages,
        "status": book.status,
        "url": reverse("api-book", args=[book.pk]),
    }


def read_json(request):
    """The JSON object in the request body, or None when the body is not a JSON object."""
    try:
        data = json.loads(request.body or b"{}")
    except (ValueError, UnicodeDecodeError):
        return None
    return data if isinstance(data, dict) else None


def errors_json(form):
    """A form's errors as {field: [message, ...]} ("__all__" for the errors of the whole form)."""
    return {
        field: [error["message"] for error in errors]
        for field, errors in form.errors.get_json_data().items()
    }


# GET /api/books/ (optionally ?status=) -> {"books": [...]}; POST -> 201 with the new book, or 400
@require_http_methods(["GET", "POST"])
def books(request):
    if request.method == "GET":
        found = Book.objects.select_related("author")
        status = request.GET.get("status")
        if status:
            if status not in Book.Status.values:
                return JsonResponse({"error": f"unknown status: {status}"}, status=400)
            found = found.filter(status=status)
        return JsonResponse({"books": [book_json(book) for book in found]})
    data = read_json(request)
    if data is None:
        return JsonResponse({"error": "send a JSON object"}, status=400)
    form = BookForm(data)
    if not form.is_valid():
        return JsonResponse({"errors": errors_json(form)}, status=400)
    return JsonResponse(book_json(form.save()), status=201)


# GET /api/books/<pk>/ -> the book; PATCH -> change some fields; DELETE -> 204; unknown -> 404
@require_http_methods(["GET", "PATCH", "DELETE"])
def book(request, pk):
    try:
        found = Book.objects.select_related("author").get(pk=pk)
    except Book.DoesNotExist:
        return JsonResponse({"error": "not found"}, status=404)
    if request.method == "DELETE":
        found.delete()
        return HttpResponse(status=204)
    if request.method == "PATCH":
        data = read_json(request)
        if data is None:
            return JsonResponse({"error": "send a JSON object"}, status=400)
        current = model_to_dict(found, fields=BookForm.Meta.fields)
        form = BookForm({**current, **data}, instance=found)
        if not form.is_valid():
            return JsonResponse({"errors": errors_json(form)}, status=400)
        found = form.save()
    return JsonResponse(book_json(found))



# GET /api/books/<pk>/reviews/ -> {"book": pk, "reviews": [...]}, newest first; unknown -> 404
def book_reviews(request, pk):
    raise NotImplementedError
