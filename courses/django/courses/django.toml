intro = "A view gathers the data; a template turns it into HTML, escaping every value on the way."
concepts = '''
## render()

A view rarely builds HTML by hand. It collects the data in a **context** (a dict) and renders a
template with it:

```python
from django.shortcuts import get_object_or_404, render


def book_detail(request, pk):
    book = get_object_or_404(Book, pk=pk)          # the book, or a 404 response
    return render(request, "books/book_detail.html", {"book": book})
```

With `APP_DIRS: True` in the settings, Django finds `books/book_detail.html` in
`books/templates/books/book_detail.html`. The repeated folder name is a namespace: two apps can
both have a `detail.html`.

## The template language

- `{{ book.title }}` prints a value. The dot looks up a dict key, an attribute, or calls a
  method without arguments (`{{ book.get_status_display }}`).
- `{{ value|filter }}` transforms it: `upper`, `lower`, `date:"Y-m-d"`, `default:"—"`,
  `floatformat:1`, `pluralize` (`page{{ n|pluralize }}` → `page` or `pages`), `length`…
- `{% for book in books %} … {% empty %} … {% endfor %}`: the `{% empty %}` part shows when
  the list is empty. Inside, `{{ forloop.counter }}` counts from 1.
- `{% if a == b %} … {% elif … %} … {% else %} … {% endif %}`.
- `{% url 'book-detail' book.pk %}` writes the path of a named route (unit 1).

## Inheritance

Every page shares a layout. The **base** template declares named **blocks**; a page
**extends** it and fills only the blocks it needs:

```django
{# books/base.html #}
<title>{% block title %}Bookshelf{% endblock %}</title>
<main>{% block content %}{% endblock %}</main>

{# books/book_list.html #}
{% extends "books/base.html" %}
{% block title %}Books · Bookshelf{% endblock %}
{% block content %}<h1>Books</h1>…{% endblock %}
```

`{% extends %}` must be the first tag. `{{ block.super }}` keeps the parent's content of a block.

## Escaping is automatic

Every `{{ value }}` is **HTML-escaped**: a book titled `<script>alert(1)</script>` shows up as
text, never runs. Only mark something safe (`|safe`) when you built the HTML yourself.

## A template does not query

A template only reads what the view gave it, but reading `book.author.name` in a loop still runs
a query per book if the view did not load the authors. Keep the queries in the view, with
`select_related`, and the page is one query, which a test can prove.
'''

