id = "django-basics"
language = "python"
category = "framework"
subject = "django"
title = "Django: Web Apps the Batteries-Included Way"
level = "intermediate"
summary = "Learn Django the way projects use it: views and URLs, models and migrations, the ORM, templates, forms, the admin, tests and a JSON API with plain Django, building a small reading-list app. Every exercise runs against the real Django 5.2 LTS, graded by Django's own test runner."

overview = '''
## What Django is

**Django** is a Python web framework that comes with the batteries included: a URL router, an
**ORM** that turns Python classes into database tables, **migrations** that evolve those tables,
a template language, forms with validation, an automatic **admin** site, authentication, and a
test framework. Its design is *loosely coupled*: each layer does one job and talks to the next
through a small, explicit interface.

A request travels the same path every time:

1. the **URLconf** maps the path (`/books/42/`) to a **view**;
2. the **view** is a function that takes the request and returns a response;
3. to answer, it asks **models** for data and renders a **template** (or returns JSON);
4. **middleware** wraps it all: sessions, CSRF protection, security headers.

## What you build

A small **bookshelf**: authors, books with a reading status, and reviews. Unit by unit you add
the pages, the database, the queries, the templates, a form to add books, the admin, tests, a
JSON API and, in the final project, reviews across every layer.

## How the course is organised

- **Basic:** views and URLs, models and migrations, the ORM.
- **Intermediate:** templates, forms, the admin.
- **Advanced:** testing Django code, a JSON API with plain Django, and the final project.

Each unit has a concepts text, a concept step, two drills (retype a complete program, with a
comment on every line) and a **project step**: a real Django project with `manage.py`, where the
files of the task are yours to edit and the rest is read-only. Hidden tests judge it with
Django's own test runner (`python manage.py test`), against a fresh SQLite database.

## Prepare the course once

The exercises run against **Django 5.2 LTS** (the long-term support release, supported until
April 2028). Grading never uses the network, so the first time you open the course, use
**Prepare course**: it lists the packages (Django, asgiref and sqlparse, each with its exact
version and checked against its sha256 hash) and the exact commands, and after you approve them
it installs them into a Python environment of this course (a few seconds; your own Python is not
changed). You need **Python 3.10 or newer** with the `venv` module (on Debian and Ubuntu, the
`python3-venv` package).

You should already know basic Python: functions, classes, dictionaries and lists, and
exceptions. The official Python course covers all of it.

**Official documentation:** https://docs.djangoproject.com/en/5.2/ — the tutorial ("Writing your
first Django app") and the topic guides go well with this course.
'''

