import json

from django.test import TestCase
from django.urls import reverse

from books.models import Author, Book


class ApiTestCase(TestCase):
    @classmethod
    def setUpTestData(cls):
        cls.frank = Author.objects.create(name="Frank Herbert")
        cls.octavia = Author.objects.create(name="Octavia E. Butler")
        cls.dune = Book.objects.create(title="Dune", author=cls.frank, pages=412)
        cls.kindred = Book.objects.create(
            title="Kindred", author=cls.octavia, pages=264, status=Book.Status.DONE
        )

    def send(self, method, url, body):
        data = body if isinstance(body, (str, bytes)) else json.dumps(body)
        return getattr(self.client, method)(url, data, content_type="application/json")

    def as_json(self, book):
        return {
            "id": book.pk,
            "title": book.title,
            "author": book.author.name,
            "pages": book.pages,
            "status": book.status,
            "url": f"/api/books/{book.pk}/",
        }


class ListAndCreateTests(ApiTestCase):
    def test_lists_the_books_as_json(self):
        response = self.client.get(reverse("api-books"))
        self.assertEqual(response.status_code, 200)
        self.assertEqual(response["Content-Type"], "application/json")
        self.assertEqual(response.json(), {"books": [self.as_json(self.dune), self.as_json(self.kindred)]})

    def test_the_list_is_one_query(self):
        with self.assertNumQueries(1):
            self.client.get(reverse("api-books"))

    def test_filters_by_status(self):
        response = self.client.get(reverse("api-books"), {"status": "done"})
        self.assertEqual(response.json(), {"books": [self.as_json(self.kindred)]})

    def test_an_unknown_status_is_a_bad_request(self):
        response = self.client.get(reverse("api-books"), {"status": "lost"})
        self.assertEqual(response.status_code, 400)
        self.assertEqual(response.json(), {"error": "unknown status: lost"})

    def test_post_creates_a_book(self):
        response = self.send(
            "post", reverse("api-books"),
            {"title": "Parable  of the Sower", "author": self.octavia.pk, "pages": 345, "status": "reading"},
        )
        self.assertEqual(response.status_code, 201)
        book = Book.objects.get(title="Parable of the Sower")
        self.assertEqual(response.json(), self.as_json(book))
        self.assertEqual((book.pages, book.status), (345, "reading"))

    def test_post_with_invalid_data_returns_the_errors(self):
        response = self.send(
            "post", reverse("api-books"),
            {"title": "Empty", "author": self.octavia.pk, "pages": 0, "status": "to_read"},
        )
        self.assertEqual(response.status_code, 400)
        self.assertEqual(response.json(), {"errors": {"pages": ["A book has at least one page."]}})
        self.assertFalse(Book.objects.filter(title="Empty").exists())

    def test_post_of_a_duplicate_returns_the_form_error(self):
        response = self.send(
            "post", reverse("api-books"),
            {"title": "Dune", "author": self.frank.pk, "pages": 1, "status": "to_read"},
        )
        self.assertEqual(response.status_code, 400)
        self.assertEqual(
            response.json(), {"errors": {"__all__": ["Book with this Title and Author already exists."]}}
        )

    def test_a_body_that_is_not_a_json_object_is_a_bad_request(self):
        for body in ["{not json", "[1, 2]", "42", b"\xff\xfe"]:
            response = self.send("post", reverse("api-books"), body)
            self.assertEqual(response.status_code, 400, body)
            self.assertEqual(response.json(), {"error": "send a JSON object"})
        self.assertEqual(Book.objects.count(), 2)

    def test_other_methods_are_refused(self):
        self.assertEqual(self.send("put", reverse("api-books"), {}).status_code, 405)


class OneBookTests(ApiTestCase):
    def url(self, book_or_pk):
        return reverse("api-book", args=[getattr(book_or_pk, "pk", book_or_pk)])

    def test_get_one_book(self):
        response = self.client.get(self.url(self.dune))
        self.assertEqual(response.status_code, 200)
        self.assertEqual(response.json(), self.as_json(self.dune))

    def test_an_unknown_book_is_a_json_404(self):
        for method in ["patch", "delete", "get"]:
            if method == "get":
                response = self.client.get(self.url(999))
            else:
                response = self.send(method, self.url(999), {})
            self.assertEqual(response.status_code, 404, method)
            self.assertEqual(response.json(), {"error": "not found"})

    def test_patch_changes_only_the_fields_sent(self):
        response = self.send("patch", self.url(self.dune), {"status": "done"})
        self.assertEqual(response.status_code, 200)
        self.dune.refresh_from_db()
        self.assertEqual((self.dune.title, self.dune.pages, self.dune.status), ("Dune", 412, "done"))
        self.assertEqual(response.json(), self.as_json(self.dune))

    def test_patch_is_validated_by_the_form(self):
        response = self.send("patch", self.url(self.dune), {"pages": 0})
        self.assertEqual(response.status_code, 400)
        self.assertEqual(response.json(), {"errors": {"pages": ["A book has at least one page."]}})
        self.dune.refresh_from_db()
        self.assertEqual(self.dune.pages, 412)

    def test_patch_with_a_bad_body(self):
        response = self.send("patch", self.url(self.dune), "nope")
        self.assertEqual(response.status_code, 400)
        self.assertEqual(response.json(), {"error": "send a JSON object"})

    def test_delete(self):
        response = self.client.delete(self.url(self.kindred))
        self.assertEqual(response.status_code, 204)
        self.assertEqual(response.content, b"")
        self.assertFalse(Book.objects.filter(pk=self.kindred.pk).exists())

    def test_other_methods_are_refused(self):
        self.assertEqual(self.send("put", self.url(self.dune), {}).status_code, 405)
        self.assertEqual(self.send("post", self.url(self.dune), {}).status_code, 405)
'''

