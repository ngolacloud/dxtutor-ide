[[unit]]
id = "dj-u05-forms"
title = "Forms: accepting input safely"
level = "intermediate"
difficulty = 5
intro = "A form turns text from a request into clean, validated Python values, or a list of errors to show back."
concepts = '''
## A form is a validator with a view of itself

```python
from django import forms


class NewBookForm(forms.Form):
    title = forms.CharField(max_length=200)
    pages = forms.IntegerField(min_value=1)
```

Built with data, `NewBookForm(request.POST)`, the form is **bound**. `form.is_valid()` runs
every check and returns `True` or `False`; afterwards `form.cleaned_data` holds the converted
values (`"412"` became `412`, spaces trimmed) and `form.errors` maps each field to its messages.
Printed in a template, `{{ form.as_div }}` writes every field with its label, its current value
and its errors.

## Your own rules

- `clean_<field>(self)` runs after that field's own checks; return the cleaned value or raise
  `forms.ValidationError("message")`.
- `clean(self)` runs last and sees every field: the place for rules that compare two fields.
  Its errors belong to the whole form: `form.non_field_errors()`.

## ModelForm: a form from a model

```python
class BookForm(forms.ModelForm):
    class Meta:
        model = Book
        fields = ["title", "author", "pages", "status"]
```

A `ModelForm` builds its fields from the model (`author` becomes a choice of authors, `status`
a choice of statuses), validates the model's own rules too (the unique title per author gives
the error `Book with this Title and Author already exists.`), and `form.save()` creates the row
and returns it. Always list the `fields`: never let a form accept columns you did not choose.

## The view: GET shows, POST saves, then redirect

```python
def book_create(request):
    if request.method == "POST":
        form = BookForm(request.POST)
        if form.is_valid():
            book = form.save()
            return redirect("book-detail", pk=book.pk)
    else:
        form = BookForm()
    return render(request, "books/book_form.html", {"form": form})
```

A valid POST **redirects** (302) to the new object, so a reload does not send the form twice
(the *Post/Redirect/Get* pattern). An invalid POST renders the same page again, with the bound
form: the values the visitor typed and the errors. `redirect()` accepts a route name and its
arguments.

## CSRF

Django refuses a POST that does not carry the CSRF token (another site could otherwise make a
logged-in visitor's browser submit your forms). Inside every `<form method="post">`, write
`{% csrf_token %}`. Django's test client skips the check by default, so tests can post directly.
'''

[[unit.step]]
kind = "concept"
id = "dj-u05-c1-cycle"
title = "Unbound, bound, valid or not"
points = 5
difficulty = 5
intro = '''
Follow one form through the two requests that use it: the GET that shows it and the POST that
sends it back.
'''
body = '''
## Two requests, one form class

1. **GET** `/books/new/`: `BookForm()` is **unbound**; the page shows empty fields.
2. The visitor fills it in and the browser **POSTs** the fields as text.
3. `BookForm(request.POST)` is **bound**. `is_valid()` converts each value, runs the field
   checks, then `clean_<field>`, then `clean()`, then the model's own checks.
4. **Valid**: `save()`, then redirect (302) to the new book.
   **Invalid**: render the same template with this bound form: it shows what was typed and,
   next to each field, why it was refused. Nothing was saved.

## Where each rule goes

| Rule | Where |
|---|---|
| a type, a maximum length, required or not | the field (from the model, in a ModelForm) |
| a rule about one field (at least one page) | `clean_pages` |
| a rule that compares fields | `clean` |
| a rule the database must keep (unique title per author) | the model's `Meta.constraints`; the ModelForm checks it too |
'''

