explanation = '''
One function gives every book the same shape and one reads the body, so the endpoints stay short.
`require_http_methods` answers 405 for the rest; a missing book is a JSON 404, not Django's HTML
page. Writes reuse `BookForm`, so the API and the HTML form apply the same rules and report the
same messages; a PATCH binds the form to the existing book with the current values underneath the
sent ones, so only those change. The status codes say what happened: 201 with the created book,
204 with nothing, 400 with the reason.
'''

