from django.core.validators import MaxValueValidator, MinValueValidator
from django.db import models


class Author(models.Model):
    name = models.CharField(max_length=100, unique=True)

    class Meta:
        ordering = ["name"]

    def __str__(self):
        return self.name


class Book(models.Model):
    class Status(models.TextChoices):
        TO_READ = "to_read", "To read"
        READING = "reading", "Reading"
        DONE = "done", "Done"

    title = models.CharField(max_length=200)
    author = models.ForeignKey(Author, on_delete=models.CASCADE, related_name="books")
    pages = models.PositiveIntegerField(default=0)
    status = models.CharField(max_length=10, choices=Status.choices, default=Status.TO_READ)

    class Meta:
        ordering = ["title"]
        constraints = [
            models.UniqueConstraint(fields=["title", "author"], name="unique_title_per_author"),
        ]

    def __str__(self):
        return f"{self.title} by {self.author.name}"


class Review(models.Model):
    book = models.ForeignKey(Book, on_delete=models.CASCADE, related_name="reviews")
    rating = models.PositiveSmallIntegerField(
        validators=[MinValueValidator(1), MaxValueValidator(5)]
    )
    text = models.TextField(blank=True)
    created = models.DateTimeField(auto_now_add=True)

    class Meta:
        ordering = ["-created", "-id"]

    def __str__(self):
        return f"{self.rating}/5 for {self.book.title}"
'''
"books/templates/books/book_detail.html" = '''
{% extends "books/base.html" %}

{% block title %}{{ book.title }} · Bookshelf{% endblock %}

{% block content %}
<h1>{{ book.title }}</h1>
<p>by {{ book.author.name }}</p>
<dl>
  <dt>Pages</dt><dd>{{ book.pages }} page{{ book.pages|pluralize }}</dd>
  <dt>Status</dt><dd>{{ book.get_status_display }}</dd>
</dl>

<h2>Reviews</h2>
{% if average is not None %}
<p class="average">Average rating: {{ average|floatformat:1 }} / 5</p>
{% endif %}
<ul class="reviews">
  {% for review in reviews %}
  <li>{{ review.rating }}/5 · {{ review.text }}</li>
  {% empty %}
  <li>No reviews yet.</li>
  {% endfor %}
</ul>

<form method="post" action="{% url 'review-create' book.pk %}" novalidate>
  {% csrf_token %}
  {{ review_form.as_div }}
  <button type="submit">Add review</button>
</form>

<a href="{% url 'book-list' %}">Back to all books</a>
{% endblock %}
