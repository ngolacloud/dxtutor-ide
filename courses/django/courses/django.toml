from django.test import TestCase
from django.urls import reverse

from books.models import Author, Book


class BookListTests(TestCase):
    @classmethod
    def setUpTestData(cls):
        frank = Author.objects.create(name="Frank Herbert")
        octavia = Author.objects.create(name="Octavia E. Butler")
        cls.dune = Book.objects.create(title="Dune", author=frank, pages=412)
        cls.kindred = Book.objects.create(
            title="Kindred", author=octavia, pages=264, status=Book.Status.DONE
        )
        cls.sower = Book.objects.create(
            title="Parable of the Sower", author=octavia, pages=345, status=Book.Status.READING
        )

    def test_renders_the_list_inside_the_base_template(self):
        response = self.client.get(reverse("book-list"))
        self.assertEqual(response.status_code, 200)
        self.assertTemplateUsed(response, "books/book_list.html")
        self.assertTemplateUsed(response, "books/base.html")
        self.assertContains(response, "<title>Books · Bookshelf</title>", html=True)
        self.assertContains(response, "<h1>Books</h1>", html=True)

    def test_each_book_links_to_its_page_with_author_and_status(self):
        response = self.client.get(reverse("book-list"))
        self.assertContains(response, f'<a href="/books/{self.dune.pk}/">Dune</a>', html=True)
        self.assertContains(response, "by Frank Herbert · To read")
        self.assertContains(response, "by Octavia E. Butler · Done")
        self.assertContains(response, "by Octavia E. Butler · Reading")

    def test_books_in_title_order(self):
        response = self.client.get(reverse("book-list"))
        self.assertEqual(
            [b.title for b in response.context["books"]],
            ["Dune", "Kindred", "Parable of the Sower"],
        )

    def test_the_whole_page_is_one_query(self):
        with self.assertNumQueries(1):
            self.client.get(reverse("book-list"))

    def test_filter_by_status(self):
        response = self.client.get(reverse("book-list"), {"status": "done"})
        self.assertEqual([b.title for b in response.context["books"]], ["Kindred"])
        self.assertEqual(response.context["status"], "done")
        self.assertContains(response, '<a href="?status=done" aria-current="page">Done</a>', html=True)
        self.assertContains(response, '<a href="?status=reading">Reading</a>', html=True)
        self.assertNotContains(response, "Dune")

    def test_an_unknown_status_shows_everything(self):
        response = self.client.get(reverse("book-list"), {"status": "lost"})
        self.assertEqual(len(response.context["books"]), 3)
        self.assertEqual(response.context["status"], "")
        self.assertEqual(response.context["statuses"], Book.Status.choices)
        self.assertNotContains(response, "aria-current")

