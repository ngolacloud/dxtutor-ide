long_books = long_books.exclude(status="done")     # still none
long_books = long_books.order_by("-pages")         # still none
for book in long_books:                            # ONE query, now
    ...
```

Each method returns a **new** QuerySet with one more clause; the SQL runs once, at the end,
with all of them. `print(qs.query)` shows that SQL. A function can therefore **return a
QuerySet** and let its caller add more (`queries.search("dune").filter(status="done")`): that is
how the query functions of this unit are meant to be written.

## One query, not many

The question to ask of any loop over rows is *how many queries does this run?* Read from a
related object inside the loop and you pay one per row, unless the first query brought it along
(`select_related`). Count in the database (`Count`, `Sum`) instead of in Python, and change many
rows with one `update()`.
'''

