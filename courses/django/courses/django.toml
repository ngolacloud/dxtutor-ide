title = "The bookshelf's JSON API"
points = 40
difficulty = 8
entry = "books"
intro = '''
The bookshelf gets an API next to its pages. You write `books/api.py`; the URLs are read-only, and
`BookForm` from unit 5 validates every write.
'''
instructions = '''
## Your turn

In **`books/api.py`** (`errors_json` is already written):

**`book_json(book)`** returns
`{"id", "title", "author" (the author's name), "pages", "status", "url"}`, where `url` is
`reverse("api-book", args=[book.pk])`.

**`read_json(request)`** returns the JSON object in `request.body`, or `None` when the body is not
JSON (`ValueError`, `UnicodeDecodeError`) or not an object. An empty body counts as `{}`.

**`books(request)`** at `/api/books/` (route `api-books`), **GET and POST only**:

- GET returns `{"books": [...]}` with every book (`book_json`), ordered by title, in **one**
  query (load the authors with the books). With `?status=`: only that status; an unknown status
  is a 400 `{"error": "unknown status: <value>"}`.
- POST reads the body (`read_json`; `None` → 400 `{"error": "send a JSON object"}`), validates it
  with `BookForm` (invalid → 400 `{"errors": errors_json(form)}`), saves it and answers **201**
  with the new book.

**`book(request, pk)`** at `/api/books/<pk>/` (route `api-book`), **GET, PATCH and DELETE
only**; an unknown `pk` is a 404 `{"error": "not found"}` for all three:

- GET returns the book;
- PATCH changes only the fields sent: start from
  `model_to_dict(book, fields=BookForm.Meta.fields)`, put the sent fields on top, bind
  `BookForm(merged, instance=book)`; a bad body or invalid data is a 400 as for POST; it answers
  200 with the updated book;
- DELETE deletes it and answers **204** with an empty body (`HttpResponse(status=204)`).

Hidden tests call every endpoint with JSON bodies and compare the status codes and the JSON.
'''
run_command = "python3 manage.py test"
