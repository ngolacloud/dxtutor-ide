"tests/http.rs" = '''
use std::sync::Arc;

use axum::body::Body;
use axum::http::{Request, StatusCode};
use seiva_http::{Principal, PROBLEM_JSON};
use student::interface::{tasks_router, TasksApi};
use tower::ServiceExt;

fn post(path: &str, body: &str, perms: &[&str]) -> Request<Body> {
    let mut r = Request::builder()
        .method("POST")
        .uri(path)
        .header("content-type", "application/json");
    if !perms.is_empty() {
        r = r.extension(Arc::new(Principal::new("ana", perms.iter().copied())));
    }
    r.body(Body::from(body.to_string())).unwrap()
}

fn get(path: &str, perms: &[&str]) -> Request<Body> {
    let mut r = Request::builder().uri(path);
    if !perms.is_empty() {
        r = r.extension(Arc::new(Principal::new("ana", perms.iter().copied())));
    }
    r.body(Body::empty()).unwrap()
}

async fn json(r: axum::response::Response) -> serde_json::Value {
    let bytes = axum::body::to_bytes(r.into_body(), usize::MAX).await.unwrap();
    serde_json::from_slice(&bytes).unwrap()
}

#[tokio::test]
async fn create_needs_the_permission() {
    let api = TasksApi::new();
    let r = tasks_router(api.clone()).oneshot(post("/v1/tasks", r#"{"title":"x"}"#, &[])).await.unwrap();
    assert_eq!(r.status(), StatusCode::FORBIDDEN);
    assert_eq!(r.headers()["content-type"], PROBLEM_JSON);
    let r = tasks_router(api.clone())
        .oneshot(post("/v1/tasks", r#"{"title":"x"}"#, &["tasks.read"]))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::FORBIDDEN);
}

#[tokio::test]
async fn create_returns_201_with_the_dto() {
    let api = TasksApi::new();
    let r = tasks_router(api.clone())
        .oneshot(post("/v1/tasks", r#"{"title":"  buy milk "}"#, &["tasks.create"]))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::CREATED);
    assert_eq!(json(r).await, serde_json::json!({ "id": 1, "title": "buy milk", "done": false }));
    let r = tasks_router(api.clone())
        .oneshot(post("/v1/tasks", r#"{"title":"call ana"}"#, &["tasks.create"]))
        .await
        .unwrap();
    assert_eq!(json(r).await["id"], 2);
}

#[tokio::test]
async fn an_invalid_body_is_a_422_problem() {
    let api = TasksApi::new();
    let r = tasks_router(api.clone())
        .oneshot(post("/v1/tasks", r#"{"title":"   "}"#, &["tasks.create"]))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::UNPROCESSABLE_ENTITY);
    assert_eq!(r.headers()["content-type"], PROBLEM_JSON);
    let list = tasks_router(api).oneshot(get("/v1/tasks", &[])).await.unwrap();
    assert_eq!(json(list).await, serde_json::json!([]));
