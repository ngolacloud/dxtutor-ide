use std::future::Future;
use std::sync::Mutex;

#[derive(Debug, Clone, PartialEq)]
struct Task {
    id: u128,
    done: bool,
}

trait TaskRepository {
    fn save(&self, task: &Task) -> impl Future<Output = Result<(), String>> + Send;
    fn find(&self, id: u128) -> impl Future<Output = Result<Option<Task>, String>> + Send;
}

#[derive(Default)]
struct InMemory {
    tasks: Mutex<Vec<Task>>,
}

impl TaskRepository for InMemory {
    async fn save(&self, task: &Task) -> Result<(), String> {
        let mut tasks = self.tasks.lock().map_err(|_| "poisoned".to_string())?;
        tasks.retain(|t| t.id != task.id);
        tasks.push(task.clone());
        Ok(())
    }

    async fn find(&self, id: u128) -> Result<Option<Task>, String> {
        let tasks = self.tasks.lock().map_err(|_| "poisoned".to_string())?;
        Ok(tasks.iter().find(|t| t.id == id).cloned())
    }
}

#[tokio::main(flavor = "current_thread")]
async fn main() {
    let repo = InMemory::default();
    repo.save(&Task { id: 1, done: false }).await.unwrap();
    repo.save(&Task { id: 1, done: true }).await.unwrap();
    println!("{:?}", repo.find(1).await.unwrap());
    println!("{:?}", repo.find(2).await.unwrap());
}
'''
