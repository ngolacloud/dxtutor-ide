use std::sync::{Arc, Mutex};

use seiva_ports::Scope;
use seiva_testing::{InMemoryUnitOfWork, RecordingEventPublisher, SequenceIdGenerator, TxOutcome};
use student::application::TasksService;
use student::domain::{RepositoryError, Task, TaskRepository};

/// A repository double that can be told to fail.
#[derive(Clone, Default)]
struct Repo {
    tasks: Arc<Mutex<Vec<Task>>>,
    fail: bool,
}

impl TaskRepository for Repo {
    async fn save(&self, task: &Task) -> Result<(), RepositoryError> {
        if self.fail {
            return Err(RepositoryError("the disk is full".into()));
        }
        let mut tasks = self.tasks.lock().unwrap();
        tasks.retain(|t| t.id != task.id);
        tasks.push(task.clone());
        Ok(())
    }

    async fn find(&self, id: u128) -> Result<Option<Task>, RepositoryError> {
        Ok(self.tasks.lock().unwrap().iter().find(|t| t.id == id).cloned())
    }
}

type Svc = TasksService<Repo, SequenceIdGenerator, InMemoryUnitOfWork, RecordingEventPublisher>;

fn service(repo: Repo) -> Svc {
    TasksService {
        repository: repo,
        ids: SequenceIdGenerator::new(),
        uow: InMemoryUnitOfWork::new(),
        events: RecordingEventPublisher::new(),
    }
}

fn acme() -> Scope {
    Scope::tenant("acme").unwrap()
}

#[tokio::test]
async fn complete_loads_changes_saves_and_publishes() {
    let repo = Repo::default();
    let svc = service(repo.clone());
    svc.create(acme(), "ship").await.unwrap();
    let done = svc.complete(acme(), 1).await.unwrap();
    assert!(done.done);
    assert!(repo.tasks.lock().unwrap()[0].done, "the change was saved");
    assert_eq!(svc.uow.outcomes(), [TxOutcome::Committed, TxOutcome::Committed]);
    assert_eq!(svc.uow.scopes(), [acme(), acme()]);
    assert_eq!(svc.events.topics(), ["tasks.created", "tasks.completed"]);
    let payload: serde_json::Value = serde_json::from_slice(&svc.events.events()[1].payload).unwrap();
    assert_eq!(payload, serde_json::json!({ "id": "1" }));
}

#[tokio::test]
async fn a_missing_task_rolls_back() {
    let svc = service(Repo::default());
    let err = svc.complete(acme(), 99).await.unwrap_err();
    assert_eq!(err.to_string(), "no task 99");
    assert!(err.downcast_ref::<student::application::NotFound>().is_some());
    assert_eq!(svc.uow.outcomes(), [TxOutcome::RolledBack]);
    assert_eq!(svc.events.count(), 0);
}

#[tokio::test]
async fn a_task_is_completed_once() {
    let repo = Repo::default();
    let svc = service(repo.clone());
    svc.create(acme(), "ship").await.unwrap();
    svc.complete(acme(), 1).await.unwrap();
    let err = svc.complete(acme(), 1).await.unwrap_err();
    assert_eq!(err.to_string(), "the task is already done");
    assert_eq!(svc.uow.outcomes().last(), Some(&TxOutcome::RolledBack));
    assert_eq!(svc.events.topics(), ["tasks.created", "tasks.completed"]);
}

#[tokio::test]
async fn a_failed_save_while_completing_rolls_back() {
    let repo = Repo::default();
    let svc = service(repo.clone());
    svc.create(acme(), "ship").await.unwrap();
    let broken = TasksService {
        repository: Repo { tasks: repo.tasks.clone(), fail: true },
        ids: SequenceIdGenerator::new(),
        uow: InMemoryUnitOfWork::new(),
        events: RecordingEventPublisher::new(),
    };
    assert!(broken.complete(acme(), 1).await.is_err());
    assert_eq!(broken.uow.outcomes(), [TxOutcome::RolledBack]);
    assert_eq!(broken.events.count(), 0);
    assert!(!repo.tasks.lock().unwrap()[0].done, "nothing was saved");
}
'''

