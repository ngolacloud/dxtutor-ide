#[tokio::test]
async fn get_reads_the_id_from_the_path() {
    let api = TasksApi::new();
    tasks_router(api.clone())
        .oneshot(post("/v1/tasks", r#"{"title":"one"}"#, &["tasks.create"]))
        .await
        .unwrap();
    let r = tasks_router(api.clone()).oneshot(get("/v1/tasks/1", &["tasks.read"])).await.unwrap();
    assert_eq!(r.status(), StatusCode::OK);
    assert_eq!(json(r).await["title"], "one");
    let r = tasks_router(api.clone()).oneshot(get("/v1/tasks/9", &["tasks.read"])).await.unwrap();
    assert_eq!(r.status(), StatusCode::NOT_FOUND);
    let r = tasks_router(api).oneshot(get("/v1/tasks/1", &[])).await.unwrap();
    assert_eq!(r.status(), StatusCode::FORBIDDEN);
}

#[tokio::test]
async fn list_is_public_and_complete_is_once() {
    let api = TasksApi::new();
    tasks_router(api.clone())
        .oneshot(post("/v1/tasks", r#"{"title":"one"}"#, &["tasks.create"]))
        .await
        .unwrap();
    let done = || post("/v1/tasks/complete", r#"{"id":1}"#, &["tasks.complete"]);
    let r = tasks_router(api.clone()).oneshot(done()).await.unwrap();
    assert_eq!(r.status(), StatusCode::OK);
    assert_eq!(json(r).await["done"], true);
    let r = tasks_router(api.clone()).oneshot(done()).await.unwrap();
    assert_eq!(r.status(), StatusCode::UNPROCESSABLE_ENTITY);
    let r = tasks_router(api.clone())
        .oneshot(post("/v1/tasks/complete", r#"{"id":5}"#, &["tasks.complete"]))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::NOT_FOUND);
    let r = tasks_router(api).oneshot(get("/v1/tasks", &[])).await.unwrap();
    assert_eq!(r.status(), StatusCode::OK);
    assert_eq!(json(r).await[0]["done"], true);
}
'''

[unit.step.project.solution]
"src/interface.rs" = '''
//! The interface: the facade implemented over an in-memory store, turned into routes.

use std::sync::{Arc, Mutex};

use crate::facade::{CompleteTask, CreateTask, TaskDto, TaskError, Tasks, TasksFacade};

/// The service behind the routes: the tasks in memory. Every clone shares the same list
/// (the router keeps a clone as its state).
#[derive(Clone, Default)]
pub struct TasksApi {
    tasks: Arc<Mutex<Vec<TaskDto>>>,
}

impl TasksApi {
    pub fn new() -> Self {
        Self::default()
    }
}

#[seiva::controller]
impl Tasks for TasksApi {
    async fn create(&self, cmd: CreateTask) -> Result<TaskDto, TaskError> {
        let mut tasks = self.tasks.lock().expect("tasks lock");
        let dto = TaskDto {
            id: tasks.len() as u64 + 1,
            title: cmd.title.trim().to_string(),
            done: false,
        };
        tasks.push(dto.clone());
        Ok(dto)
    }

    async fn get(&self, id: u64) -> Result<TaskDto, TaskError> {
        let tasks = self.tasks.lock().expect("tasks lock");
        tasks
            .iter()
            .find(|t| t.id == id)
            .cloned()
            .ok_or(TaskError::NotFound(id))
    }

    async fn complete(&self, cmd: CompleteTask) -> Result<TaskDto, TaskError> {
        let mut tasks = self.tasks.lock().expect("tasks lock");
        let task = tasks
            .iter_mut()
            .find(|t| t.id == cmd.id)
            .ok_or(TaskError::NotFound(cmd.id))?;
        if task.done {
            return Err(TaskError::Invalid("the task is already done".to_string()));
        }
        task.done = true;
        Ok(task.clone())
    }

    async fn list(&self) -> Result<Vec<TaskDto>, TaskError> {
        Ok(self.tasks.lock().expect("tasks lock").clone())
    }
}
'''

[[unit]]
id = "sv-u7-module"
title = "A module is five crates"
level = "advanced"
difficulty = 7
intro = "The real shape of a Seiva module: five crates whose dependency graph enforces the architecture, plus a composition root."
concepts = '''
Until now the `tasks` module lived in one crate. A real Seiva module is **five crates**, one per
layer, and the dependency rule between them is enforced by Cargo itself — code that breaks it does
not compile:

```
interface ─▶ application ─▶ domain
   │             │
   └─▶ facade ◀──┘        infrastructure ─▶ domain
```

| crate | holds | may depend on |
|---|---|---|
| `tasks-domain` | `Task`, rules, the repository port | nothing |
| `tasks-application` | `TasksService` (use cases) | domain, `seiva-ports` |
| `tasks-facade` | the contract + DTOs | `seiva`, `seiva-http` (for `Ctx`) |
| `tasks-infrastructure` | adapters (an in-memory repository) | domain |
| `tasks-interface` | the facade over the service + `#[seiva::controller]` | application, facade |

The interface **never** names the domain or the infrastructure: it imports the repository port from
the application (which re-exports it). `seiva lint` checks these rules too, and
`seiva module new <name>` scaffolds the five crates for you.

**The composition root** (`tasks-api` here, `apps/<name>-api` in Seiva projects) is the only place that
picks the adapters: the in-memory repository, the id generator, the unit of work, the event publisher —
or, in production, the DORM gateway and a broker. Swapping them is a change in one file.

**The tenant comes from the request, server-side.** Facade methods can take `&Ctx` (the request
context: the authenticated `Principal`, its tenant and permissions). The controller injects it and
keeps it **off the wire** — a client cannot send a tenant in the body. The interface turns it into a
`Scope` *fail-closed*: `ctx.scope()` is `None` for a caller without a tenant, which must become an
error (a `403`), never a global write.

**Sharing the service with the router.** The controller needs a `Clone` service. The application
service is not `Clone` (it owns its ports), so the interface keeps it behind an `Arc` and implements
`Clone` by hand — a derived `Clone` would wrongly require every port type to be `Clone`.

**From application errors to contract errors.** The use cases return `BoxError`. The interface
recognises an application error by type (`error.downcast_ref::<NotFound>()`) and maps it to the
contract (`TaskError::NotFound` → `404`); anything else is `TaskError::Invalid` (`422`).

**One workspace.** The five crates (and the root) are members of one Cargo workspace. The library
versions are declared once in `[workspace.dependencies]` and each crate says
`seiva = { workspace = true }` — in this course dxtutor writes that table from the course's single
dependency list, the same one every step has used.

Docs: "Architecture", "Add a module" and the shop tutorial (part 1, "The modular monolith").
'''

[[unit.step]]
kind = "concept"
id = "sv-c7-module"
title = "Five crates and a composition root"
points = 5
difficulty = 7
intro = "Why the layers are separate crates, and where the adapters are chosen."
body = '''
Splitting the module into crates turns the architecture into something the compiler checks:
`tasks-domain` has no dependencies, so it *cannot* import the framework; `tasks-interface` does not
depend on `tasks-infrastructure`, so it *cannot* reach for a concrete repository.

The same five crates run as a modular monolith (the composition root mounts several modules' routers
in one binary) or as a microservice (a root with one module). `seiva module split` turns one into the
other by changing composition only — the module's code does not move.

In the capstone you write the three pieces that are not given: the in-memory repository
(infrastructure), the interface (scope from `&Ctx`, the controller) and the composition root.
'''

