"tasks-application/src/lib.rs" = '''
//! tasks-application: the use cases, over the ports of `seiva-ports` and the repository
//! port of the domain. No transport, no database, no `seiva` crate.

use seiva_ports::{BoxError, EventPublisher, IdGenerator, PortResult, Scope, UnitOfWork};

// The repository port is the domain's; re-exported so the layers above import it from here.
pub use tasks_domain::{RepositoryError, Task, TaskRepository};

/// The `tasks` use cases. Generic over the ports: the composition root decides what is
/// behind each one (in-memory doubles in a test, a database in production).
pub struct TasksService<R, G, U, E> {
    pub repository: R,
    pub ids: G,
    pub uow: U,
    pub events: E,
}

impl<R, G, U, E> TasksService<R, G, U, E>
where
    R: TaskRepository + Sync,
    G: IdGenerator,
    U: UnitOfWork,
    E: EventPublisher,
{
    /// Creates a task under `scope`: the rule is checked first (no transaction for a
    /// command the domain refuses), then the task is saved AND `tasks.created` is
    /// published inside ONE transaction, so both happen or neither does.
    pub async fn create(&self, scope: Scope, title: &str) -> PortResult<Task> {
        let id = u128::from_be_bytes(self.ids.new_id().0);
        let task = Task::new(id, title).map_err(BoxError::from)?;
        let event = serde_json::to_vec(&serde_json::json!({
            "id": task.id.to_string(),
            "title": task.title,
        }))
        .map_err(BoxError::from)?;
        self.uow
            .transaction(scope, || async {
                self.repository.save(&task).await?;
                self.events.publish("tasks.created", &event).await
            })
            .await?;
        Ok(task)
    }

    /// Completes the task `id` under `scope`: load it, apply the domain rule, save it and
    /// publish `tasks.completed` — all inside ONE transaction, so a missing task or a task
    /// that is already done rolls everything back and publishes nothing.
    pub async fn complete(&self, scope: Scope, id: u128) -> PortResult<Task> {
        self.uow
            .transaction(scope, || async move {
                let mut task = self
                    .repository
                    .find(id)
                    .await?
                    .ok_or_else(|| BoxError::from(NotFound(id)))?;
                task.complete().map_err(BoxError::from)?;
                self.repository.save(&task).await?;
                let event = serde_json::to_vec(&serde_json::json!({ "id": task.id.to_string() }))
                    .map_err(BoxError::from)?;
                self.events.publish("tasks.completed", &event).await?;
                Ok(task)
            })
            .await
    }

    /// Every task.
    pub async fn list(&self) -> PortResult<Vec<Task>> {
        Ok(self.repository.list().await?)
    }
}

/// No task has this id.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct NotFound(pub u128);

impl std::fmt::Display for NotFound {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "no task {}", self.0)
    }
}

impl std::error::Error for NotFound {}
'''
"tasks-facade/Cargo.toml" = '''
[package]
name = "tasks-facade"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
seiva = { workspace = true }
seiva-http = { workspace = true }
serde = { workspace = true }
'''
"tasks-facade/src/lib.rs" = '''
//! tasks-facade: the versioned contract and its wire DTOs. Each method takes the request
//! context `&Ctx` (who is calling, in which tenant): the controller injects it and keeps it
//! off the wire.

// Facade methods are `async fn` in a public trait.
#![allow(async_fn_in_trait)]

use seiva::{facade, WireSchema};
use seiva_http::{Ctx, Problem, Validate, ValidationError};
use serde::{Deserialize, Serialize};

/// The body of `create`.
#[derive(Debug, Clone, Deserialize, Serialize, WireSchema)]
pub struct CreateTask {
    pub title: String,
}

impl Validate for CreateTask {
    fn validate(&self) -> Result<(), ValidationError> {
        if self.title.trim().is_empty() {
            return Err(ValidationError::new("title must not be empty"));
        }
        Ok(())
    }
}

/// The body of `complete`.
#[derive(Debug, Clone, Deserialize, Serialize, WireSchema)]
pub struct CompleteTask {
    pub id: u64,
}

impl Validate for CompleteTask {
    fn validate(&self) -> Result<(), ValidationError> {
        Ok(())
    }
}

/// What the contract returns: never a domain type.
#[derive(Debug, Clone, PartialEq, Eq, Serialize, WireSchema)]
pub struct TaskDto {
    pub id: u64,
    pub title: String,
    pub done: bool,
}

/// The contract's error; the controller turns it into an RFC 9457 problem.
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum TaskError {
    /// The caller has no tenant: fail closed, never a global write.
    NoTenant,
    NotFound(u64),
    Invalid(String),
}

impl From<TaskError> for Problem {
    fn from(error: TaskError) -> Self {
        match error {
            TaskError::NoTenant => Problem::forbidden("the caller has no tenant"),
            TaskError::NotFound(id) => Problem::not_found(format!("no task {id}")),
            TaskError::Invalid(why) => Problem::unprocessable_entity(why),
        }
    }
}

/// The `tasks` module's public contract, version 1.
#[facade(version = "v1")]
pub trait Tasks {
    #[requires("tasks.create")]
    async fn create(&self, ctx: &Ctx, cmd: CreateTask) -> Result<TaskDto, TaskError>;

    #[requires("tasks.read")]
    async fn list(&self, ctx: &Ctx) -> Result<Vec<TaskDto>, TaskError>;

    #[requires("tasks.complete")]
    async fn complete(&self, ctx: &Ctx, cmd: CompleteTask) -> Result<TaskDto, TaskError>;
}
