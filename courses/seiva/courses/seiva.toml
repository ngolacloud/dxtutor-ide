[unit.step.project.solution]
"tasks-infrastructure/src/lib.rs" = '''
//! tasks-infrastructure: the adapters of the ports. Here an in-memory repository; a real
//! module would add a DORM-backed (or SQL) one behind the same port.

use std::sync::Mutex;

use tasks_domain::{RepositoryError, Task, TaskRepository};

/// A [`TaskRepository`] in memory.
#[derive(Default)]
pub struct InMemoryTaskRepository {
    tasks: Mutex<Vec<Task>>,
}

impl InMemoryTaskRepository {
    pub fn new() -> Self {
        Self::default()
    }
}

fn poisoned<T>(_: T) -> RepositoryError {
    RepositoryError("the repository lock is poisoned".to_string())
}

impl TaskRepository for InMemoryTaskRepository {
    async fn save(&self, task: &Task) -> Result<(), RepositoryError> {
        let mut tasks = self.tasks.lock().map_err(poisoned)?;
        match tasks.iter_mut().find(|t| t.id == task.id) {
            Some(existing) => *existing = task.clone(),
            None => tasks.push(task.clone()),
        }
        Ok(())
    }

    async fn find(&self, id: u128) -> Result<Option<Task>, RepositoryError> {
        let tasks = self.tasks.lock().map_err(poisoned)?;
        Ok(tasks.iter().find(|t| t.id == id).cloned())
    }

    async fn list(&self) -> Result<Vec<Task>, RepositoryError> {
        Ok(self.tasks.lock().map_err(poisoned)?.clone())
    }
}
'''
"tasks-interface/src/lib.rs" = '''
//! tasks-interface: the transport shell. It implements the facade over the application's
//! service, derives the tenant from the request context, and `#[seiva::controller]` turns
//! the impl into HTTP routes. It never names the domain or the infrastructure.

use std::sync::Arc;

use seiva_http::Ctx;
use seiva_ports::{EventPublisher, IdGenerator, Scope, UnitOfWork};
use tasks_application::{Task, TaskRepository, TasksService};
use tasks_facade::{CompleteTask, CreateTask, TaskDto, TaskError, Tasks, TasksFacade};

/// The tenant the request runs under, FAIL-CLOSED: a caller without a tenant gets
/// [`TaskError::NoTenant`], never an unscoped or global write.
pub fn scope_of(ctx: &Ctx) -> Result<Scope, TaskError> {
    ctx.scope().ok_or(TaskError::NoTenant)
}

fn dto(task: Task) -> TaskDto {
    TaskDto {
        id: task.id as u64,
        title: task.title,
        done: task.done,
    }
}

/// Turns an application error into the contract's: a missing task is `NotFound`, anything
/// else (a rule the domain refused, a failed port) is `Invalid` with its message.
fn contract_error(error: seiva_ports::BoxError, id: Option<u64>) -> TaskError {
    match (error.downcast_ref::<tasks_application::NotFound>(), id) {
        (Some(_), Some(id)) => TaskError::NotFound(id),
        _ => TaskError::Invalid(error.to_string()),
    }
}

/// The facade over the application service. The router keeps a clone as its state, so the
/// service sits behind an `Arc`.
pub struct TasksApi<R, G, U, E> {
    service: Arc<TasksService<R, G, U, E>>,
}

impl<R, G, U, E> TasksApi<R, G, U, E> {
    pub fn new(service: TasksService<R, G, U, E>) -> Self {
        Self {
            service: Arc::new(service),
        }
    }
}

impl<R, G, U, E> Clone for TasksApi<R, G, U, E> {
    fn clone(&self) -> Self {
        Self {
            service: Arc::clone(&self.service),
        }
    }
}

#[seiva::controller]
impl<R, G, U, E> Tasks for TasksApi<R, G, U, E>
where
    R: TaskRepository + Send + Sync + 'static,
    G: IdGenerator + 'static,
    U: UnitOfWork + 'static,
    E: EventPublisher + 'static,
{
    async fn create(&self, ctx: &Ctx, cmd: CreateTask) -> Result<TaskDto, TaskError> {
        let scope = scope_of(ctx)?;
        let task = self
            .service
            .create(scope, &cmd.title)
            .await
            .map_err(|e| contract_error(e, None))?;
        Ok(dto(task))
    }

    async fn list(&self, ctx: &Ctx) -> Result<Vec<TaskDto>, TaskError> {
        scope_of(ctx)?;
        let tasks = self
            .service
            .list()
            .await
            .map_err(|e| contract_error(e, None))?;
        Ok(tasks.into_iter().map(dto).collect())
    }

    async fn complete(&self, ctx: &Ctx, cmd: CompleteTask) -> Result<TaskDto, TaskError> {
        let scope = scope_of(ctx)?;
        let task = self
            .service
            .complete(scope, u128::from(cmd.id))
            .await
            .map_err(|e| contract_error(e, Some(cmd.id)))?;
        Ok(dto(task))
    }
}
'''
"tasks-api/src/lib.rs" = '''
//! tasks-api: the composition root. The ONLY place that picks the adapters: the in-memory
//! repository, and the in-memory doubles for ids, transactions and events (a production
//! root would plug the DORM gateway and a broker in here instead).

use seiva_testing::{InMemoryUnitOfWork, RecordingEventPublisher, SequenceIdGenerator};
use tasks_application::TasksService;
use tasks_infrastructure::InMemoryTaskRepository;
use tasks_interface::{tasks_router, TasksApi};

/// The composed application: the HTTP router, and the events it published (to look at).
pub struct App {
    pub router: axum::Router,
    pub events: RecordingEventPublisher,
}

/// Wires the module: adapters → service → facade → routes.
pub fn compose() -> App {
    let events = RecordingEventPublisher::new();
    let service = TasksService {
        repository: InMemoryTaskRepository::new(),
        ids: SequenceIdGenerator::new(),
        uow: InMemoryUnitOfWork::new(),
        events: events.clone(),
    };
    App {
        router: tasks_router(TasksApi::new(service)),
        events,
    }
}
'''
