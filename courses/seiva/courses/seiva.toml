use seiva_ports::{BoxError, EventPublisher, IdGenerator, PortResult, Scope, UnitOfWork};

// The repository port is the domain's; re-exported so the layers above import it from here.
pub use crate::domain::{RepositoryError, Task, TaskRepository};

/// The `tasks` use cases. Generic over the ports: the composition root decides what is
/// behind each one (in-memory doubles in a test, a database in production).
pub struct TasksService<R, G, U, E> {
    pub repository: R,
    pub ids: G,
    pub uow: U,
    pub events: E,
}

impl<R, G, U, E> TasksService<R, G, U, E>
where
    R: TaskRepository + Sync,
    G: IdGenerator,
    U: UnitOfWork,
    E: EventPublisher,
{
    /// Creates a task under `scope`: the rule is checked first (no transaction for a
    /// command the domain refuses), then the task is saved AND `tasks.created` is
    /// published inside ONE transaction, so both happen or neither does.
    pub async fn create(&self, scope: Scope, title: &str) -> PortResult<Task> {
        let id = u128::from_be_bytes(self.ids.new_id().0);
        let task = Task::new(id, title).map_err(BoxError::from)?;
        let event = serde_json::to_vec(&serde_json::json!({
            "id": task.id.to_string(),
            "title": task.title,
        }))
        .map_err(BoxError::from)?;
        self.uow
            .transaction(scope, || async {
                self.repository.save(&task).await?;
                self.events.publish("tasks.created", &event).await
            })
            .await?;
        Ok(task)
    }
}
'''

[[unit]]
id = "sv-u4-change"
title = "Changing state safely"
level = "intermediate"
difficulty = 4
intro = "A second use case that loads, changes and saves an entity — and rolls back when anything fails."
concepts = '''
Creating is the easy case. Most use cases **change** something that already exists: load the
entity, ask the domain to apply a rule, save it, announce it. In Seiva all four moves happen inside
**one** `UnitOfWork::transaction`, because each of them can fail:

| Failure | Where | Result |
|---|---|---|
| No task with that id | the repository returns `Ok(None)` | `NotFound` → rollback |
| The task is already done | `Task::complete` | `DomainError::AlreadyDone` → rollback |
| The save fails | the repository returns `Err` | `RepositoryError` → rollback |

**`Option` to error.** `find` returns `Result<Option<Task>, RepositoryError>`: the `Result` says whether
the *lookup* worked, the `Option` whether there *was* a task. Turn the `None` into an application
error with `.ok_or_else(|| BoxError::from(NotFound(id)))?` — the use case decides that a missing task
is an error, not the repository.

**Application errors are types too.** `NotFound(u128)` is a small struct with `Display` ("no task 99")
and `Error`. Because it travels as a `BoxError`, the layer above can still recognise it with
`error.downcast_ref::<NotFound>()` and turn it into a `404` — while a domain error becomes a `422`.

**Moving values into the body.** The transaction body is a closure returning a future. When it needs
values owned by the caller (the `id`), write `|| async move { … }`: the `id` (a `Copy` `u128`) and the
`&self` reference are moved into the future, which is what the `'a` bounds of `transaction` expect.
The value the body returns (`Ok(task)`) is what `transaction(...).await` gives back.

**Testing failure paths.** The in-memory doubles make every branch observable: after a failed
`complete`, `uow.outcomes()` ends with `RolledBack` and `events.topics()` did not grow. A repository
double with a `fail` switch proves that a failed save publishes nothing. These are exactly the
checks the hidden tests run — and the ones you should write in your own modules
(see "Testing" in the Seiva docs).
'''

[[unit.step]]
kind = "concept"
id = "sv-c4-change"
title = "Load, change, save, announce"
points = 5
difficulty = 4
intro = "Why every move of a state change lives inside the same transaction."
body = '''
Compare the two use cases of the `tasks` module:

- `create` validates **before** the transaction (there is nothing to load), then saves and publishes
  inside it.
- `complete` has nothing to validate up front: the rule (`AlreadyDone`) depends on the stored task. So
  the load, the rule, the save and the publish all go **inside** the transaction body.

Either way the guarantee is the same: when the use case returns an error, nothing was saved and
nothing was published. In this unit you also implement your own repository adapter in a drill, to see
the port from the other side.
'''

