//! The interface: the facade implemented over an in-memory store, turned into routes.

use std::sync::{Arc, Mutex};

use crate::facade::{CompleteTask, CreateTask, TaskDto, TaskError, Tasks, TasksFacade};

/// The service behind the routes: the tasks in memory. Every clone shares the same list
/// (the router keeps a clone as its state).
#[derive(Clone, Default)]
pub struct TasksApi {
    tasks: Arc<Mutex<Vec<TaskDto>>>,
}

impl TasksApi {
    pub fn new() -> Self {
        Self::default()
    }
}

// TODO: implement the `Tasks` facade for `TasksApi`, and put `#[seiva::controller]` on that
// impl so it generates `tasks_router(service) -> axum::Router`.
//
// - `create`: the next id (1, 2, …), the TRIMMED title, not done.
// - `get`: the task with that id, or `TaskError::NotFound(id)`.
// - `complete`: mark it done; a missing task is `NotFound`, a task already done is
//   `TaskError::Invalid("the task is already done")`.
