use student::{DomainError, Task, MAX_TITLE};

#[test]
fn a_valid_task_is_open_and_trimmed() {
    let t = Task::new(7, "  write the spec  ").unwrap();
    assert_eq!(t, Task { id: 7, title: "write the spec".into(), done: false });
}

#[test]
fn an_empty_title_is_refused() {
    assert_eq!(Task::new(1, ""), Err(DomainError::EmptyTitle));
    assert_eq!(Task::new(1, " \t "), Err(DomainError::EmptyTitle));
}

#[test]
fn the_title_length_counts_characters() {
    assert!(Task::new(1, "a".repeat(MAX_TITLE)).is_ok());
    assert_eq!(
        Task::new(1, "a".repeat(MAX_TITLE + 1)),
        Err(DomainError::TitleTooLong { max: MAX_TITLE })
    );
    // 80 characters, 160 bytes: still valid
    assert!(Task::new(1, "é".repeat(MAX_TITLE)).is_ok());
    // the spaces around it do not count
    assert!(Task::new(1, format!("  {}  ", "a".repeat(MAX_TITLE))).is_ok());
}

#[test]
fn a_task_is_completed_once() {
    let mut t = Task::new(1, "ship").unwrap();
    assert_eq!(t.complete(), Ok(()));
    assert!(t.done);
    assert_eq!(t.complete(), Err(DomainError::AlreadyDone));
    assert!(t.done);
}

#[test]
fn the_errors_read_well() {
    assert_eq!(DomainError::EmptyTitle.to_string(), "a task needs a title");
    assert_eq!(
        DomainError::TitleTooLong { max: 80 }.to_string(),
        "a task title has at most 80 characters"
    );
}
'''

[unit.step.gabarito]
solution = '''
use std::fmt;

/// The longest title a task may have, in characters.
pub const MAX_TITLE: usize = 80;

/// A task. Build it with [`Task::new`], so its rules always hold.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct Task {
    pub id: u128,
    pub title: String,
    pub done: bool,
}

/// A rule of the domain said no.
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum DomainError {
    EmptyTitle,
    TitleTooLong { max: usize },
    AlreadyDone,
}

impl fmt::Display for DomainError {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        match self {
            DomainError::EmptyTitle => write!(f, "a task needs a title"),
            DomainError::TitleTooLong { max } => {
                write!(f, "a task title has at most {max} characters")
            }
            DomainError::AlreadyDone => write!(f, "the task is already done"),
        }
    }
}

impl std::error::Error for DomainError {}

impl Task {
    /// Creates an open task with a trimmed title of 1 to [`MAX_TITLE`] characters.
    pub fn new(id: u128, title: impl Into<String>) -> Result<Self, DomainError> {
        let title = title.into().trim().to_string();
        if title.is_empty() {
            return Err(DomainError::EmptyTitle);
        }
        if title.chars().count() > MAX_TITLE {
            return Err(DomainError::TitleTooLong { max: MAX_TITLE });
        }
        Ok(Self {
            id,
            title,
            done: false,
        })
    }

    /// Marks the task done; a task is completed only once.
    pub fn complete(&mut self) -> Result<(), DomainError> {
        if self.done {
            return Err(DomainError::AlreadyDone);
        }
        self.done = true;
        Ok(())
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = "Trimming and counting the characters of the title is linear in its length; `complete` is constant time. The checks run in `new`, so every `Task` that exists already respects them — the layers above never re-validate a title."

[[unit]]
id = "sv-u2-ports"
title = "Ports: what a use case asks of the world"
level = "basic"
difficulty = 2
intro = "The application layer never calls a database, a clock or a broker directly: it asks for them through ports."
concepts = '''
A use case needs things from the outside world: a fresh id, the current time, a transaction, a way
to announce what happened. Seiva gives each of those a **port** — a trait in the small crate
`seiva-ports` — and the application layer codes against the traits only.

| Port | What it does | In tests (`seiva-testing`) |
|---|---|---|
| `IdGenerator` | `new_id() -> Id` (16 bytes) | `SequenceIdGenerator` (1, 2, 3…) |
| `Clock` | `now() -> SystemTime` | `FixedClock` (a fixed instant, `advance`) |
| `EventPublisher` | `publish(topic, &[u8])` (async) | `RecordingEventPublisher` |
| `UnitOfWork` | `transaction(scope, work)` | `InMemoryUnitOfWork` |

**Why traits?** Because the composition root — not the use case — decides what is behind them. In
production `UnitOfWork` is a database transaction (DORM, or an SQL adapter) and `EventPublisher` writes
to a transactional outbox; in a unit test they are the in-memory doubles of `seiva-testing`, so the
test needs no server, broker or database. The use case does not change.

**Injecting by generics.** A function or a service takes the ports as type parameters:
`fn new_task<G: IdGenerator, C: Clock>(ids: &G, clock: &C, ...)`. The compiler builds one version per
concrete type — no dynamic dispatch, no reflection, nothing to configure at run time.

**`Id` and `u128`.** `IdGenerator::new_id()` returns `seiva_ports::Id`, a newtype over `[u8; 16]`. The
doubles write a counter big-endian into those bytes, so `u128::from_be_bytes(id.0)` turns it back into
the number (1, 2, 3…), which is what the `tasks` domain stores.

**`Scope`: the tenant, impossible to forget.** Every transaction runs under a `Scope`: either
`Scope::Tenant(TenantId)` or the deliberate, audited `Scope::Global`. `Scope::tenant("acme")` returns
`Option<Scope>` — `None` for an empty or blank name — so "no tenant" can never pass for a tenant.
A request without a tenant must fail closed: it gets an error, never `Scope::Global`.

**`SystemTime` to seconds.** `clock.now().duration_since(UNIX_EPOCH)` gives a `Duration`; `.as_secs()`
is the Unix time. With `FixedClock::at_unix_secs(n)` that is exactly `n`.
'''

[[unit.step]]
kind = "concept"
id = "sv-c2-ports"
title = "Ports and doubles"
points = 5
difficulty = 2
intro = "The four ports a use case uses most, and the test doubles that stand in for them."
body = '''
`seiva-ports` is deliberately tiny: traits and a few small types (`Id`, `Scope`, `TenantId`,
`BoxError`, `PortResult`). It has no runtime, no macros and no data layer, so an `application` crate
can depend on it without dragging in the framework.

`seiva-testing` has one in-memory double per port. Each double is cheap to clone and **shares its
recorded state**: keep one handle in the test, give a clone to the code under test, then read back
what happened (`uow.outcomes()`, `events.topics()`).

In this unit you call the ports directly; in the next one a use case is generic over them.
'''

