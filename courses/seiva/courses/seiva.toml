use std::sync::Mutex;

use seiva_ports::{EventPublisher, IdGenerator, Scope, UnitOfWork};
use seiva_testing::{InMemoryUnitOfWork, RecordingEventPublisher, SequenceIdGenerator};

struct Notes<G, U, E> {
    ids: G,
    uow: U,
    events: E,
    saved: Mutex<Vec<(u128, String)>>,
}

impl<G: IdGenerator, U: UnitOfWork, E: EventPublisher> Notes<G, U, E> {
    async fn create(&self, scope: Scope, title: &str) -> seiva_ports::PortResult<u128> {
        let id = u128::from_be_bytes(self.ids.new_id().0);
