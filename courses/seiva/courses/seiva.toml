"tests/create.rs" = '''
use std::sync::{Arc, Mutex};

use seiva_ports::Scope;
use seiva_testing::{InMemoryUnitOfWork, RecordingEventPublisher, SequenceIdGenerator, TxOutcome};
use student::application::TasksService;
use student::domain::{RepositoryError, Task, TaskRepository};

/// A repository double that can be told to fail.
#[derive(Clone, Default)]
struct Repo {
    tasks: Arc<Mutex<Vec<Task>>>,
    fail: bool,
}

impl TaskRepository for Repo {
    async fn save(&self, task: &Task) -> Result<(), RepositoryError> {
        if self.fail {
            return Err(RepositoryError("the disk is full".into()));
        }
        let mut tasks = self.tasks.lock().unwrap();
        tasks.retain(|t| t.id != task.id);
        tasks.push(task.clone());
        Ok(())
    }

    async fn find(&self, id: u128) -> Result<Option<Task>, RepositoryError> {
        Ok(self.tasks.lock().unwrap().iter().find(|t| t.id == id).cloned())
    }
}

type Svc = TasksService<Repo, SequenceIdGenerator, InMemoryUnitOfWork, RecordingEventPublisher>;

fn service(repo: Repo) -> Svc {
    TasksService {
        repository: repo,
        ids: SequenceIdGenerator::new(),
        uow: InMemoryUnitOfWork::new(),
        events: RecordingEventPublisher::new(),
    }
}

fn acme() -> Scope {
    Scope::tenant("acme").unwrap()
}

#[tokio::test]
async fn create_saves_and_publishes_in_one_committed_transaction() {
    let repo = Repo::default();
    let svc = service(repo.clone());
    let task = svc.create(acme(), "  write the spec ").await.unwrap();
    assert_eq!(task, Task { id: 1, title: "write the spec".into(), done: false });
    assert_eq!(repo.tasks.lock().unwrap().clone(), vec![task]);
    assert_eq!(svc.uow.outcomes(), [TxOutcome::Committed]);
    assert_eq!(svc.uow.scopes(), [acme()]);
    assert_eq!(svc.events.topics(), ["tasks.created"]);
    let payload: serde_json::Value = serde_json::from_slice(&svc.events.events()[0].payload).unwrap();
    assert_eq!(payload, serde_json::json!({ "id": "1", "title": "write the spec" }));
    let second = svc.create(acme(), "review").await.unwrap();
    assert_eq!(second.id, 2);
}

#[tokio::test]
async fn a_refused_command_opens_no_transaction() {
    let repo = Repo::default();
    let svc = service(repo.clone());
    let err = svc.create(acme(), "   ").await.unwrap_err();
    assert_eq!(err.to_string(), "a task needs a title");
    assert!(svc.uow.outcomes().is_empty());
    assert_eq!(svc.events.count(), 0);
    assert!(repo.tasks.lock().unwrap().is_empty());
}

#[tokio::test]
async fn a_failed_save_rolls_back_and_publishes_nothing() {
    let svc = service(Repo { fail: true, ..Repo::default() });
    let err = svc.create(acme(), "ship").await.unwrap_err();
    assert_eq!(err.to_string(), "the disk is full");
    assert_eq!(svc.uow.outcomes(), [TxOutcome::RolledBack]);
    assert_eq!(svc.events.count(), 0);
}
'''

