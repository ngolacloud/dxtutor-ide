[unit.step.gabarito]
solution = '''
use std::time::UNIX_EPOCH;

use seiva_ports::{Clock, IdGenerator, Scope};

/// A task that was just minted.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct NewTask {
    pub id: u128,
    pub title: String,
    /// Seconds since the Unix epoch.
    pub created_at: u64,
}

/// Mints a task: the next id, the trimmed title, and the time it was created.
pub fn new_task<G: IdGenerator, C: Clock>(ids: &G, clock: &C, title: &str) -> Result<NewTask, String> {
    let title = title.trim();
    if title.is_empty() {
        return Err("a task needs a title".to_string());
    }
    let id = u128::from_be_bytes(ids.new_id().0);
    let created_at = clock
        .now()
        .duration_since(UNIX_EPOCH)
        .map_err(|e| e.to_string())?
        .as_secs();
    Ok(NewTask {
        id,
        title: title.to_string(),
        created_at,
    })
}

/// The scope a request runs under: its tenant, or an error. Never `Scope::Global`.
pub fn scope_for(tenant: Option<&str>) -> Result<Scope, String> {
    tenant
        .and_then(Scope::tenant)
        .ok_or_else(|| "the caller has no tenant".to_string())
}
'''
time = "O(n)"
space = "O(n)"
justification = "Trimming the title is linear in its length; the ports are called once each. Checking the title before calling `new_id` keeps the generator untouched when the command is refused. `Option::and_then(Scope::tenant)` collapses \"no tenant\" and \"blank tenant\" into one `None`, which `ok_or_else` turns into an error — the fail-closed rule in one expression."

[[unit]]
id = "sv-u3-use-case"
title = "One use case, one transaction"
level = "intermediate"
difficulty = 3
intro = "The application layer: a service generic over the ports, where each write use case is one transaction."
concepts = '''
The **application** layer holds the use cases. In Seiva it is a service struct that is *generic
over the ports* — the repository port of the domain plus `IdGenerator`, `UnitOfWork` and
`EventPublisher` from `seiva-ports`:

```rust
pub struct TasksService<R, G, U, E> { pub repository: R, pub ids: G, pub uow: U, pub events: E }

impl<R, G, U, E> TasksService<R, G, U, E>
where R: TaskRepository + Sync, G: IdGenerator, U: UnitOfWork, E: EventPublisher { … }
```

It names no transport (no HTTP types) and no database. That is what lets it run, unchanged, inside a
monolith, a microservice or a unit test.

**The repository port belongs to the domain.** Classic DDD: the domain says *what* it needs to keep
its entities (`TaskRepository::save`, `find`), in its own error type (`RepositoryError`); the
infrastructure layer implements it. The port returns `impl Future<…> + Send`, so a use case can await
it inside a transaction on a multi-threaded runtime.

**One use case = one transaction.** `UnitOfWork::transaction(scope, || async { … })` runs the body and
**commits if it returns `Ok`, rolls back if it returns `Err`**. Everything the use case changes — the
saved task *and* the event — happens inside that body. With the DORM gateway the event goes into a
*transactional outbox* in the same database transaction, so "the task was saved but nobody was told"
(or the opposite) cannot happen.

**Order matters inside the body.** Save first, publish second. If the save fails, `?` returns early,
the transaction rolls back and nothing was published.

**Check the rule before opening the transaction.** `Task::new` can refuse the command; do that first,
so a refused command never opens (and rolls back) a transaction.

**Errors cross the boundary as `BoxError`.** Ports return `PortResult<T>` = `Result<T, BoxError>`, and
`BoxError` is `Box<dyn std::error::Error + Send + Sync>`. `DomainError` and `RepositoryError` implement
`Error`, so `?` (or `.map_err(BoxError::from)`) converts them, and their message survives.

**Events are bytes.** `EventPublisher::publish(topic, payload)` moves bytes; the module chooses the
envelope. Seiva's examples publish a small JSON object (`serde_json::to_vec(&json!({…}))`), with ids
as strings so no consumer loses precision. Topic names are `<module>.<past-tense verb>`:
`tasks.created`.
'''

[[unit.step]]
