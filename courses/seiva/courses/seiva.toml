# Seiva — the official dxtutor course for the Seiva backend framework (ngolacloud/seiva).
#
# A FRAMEWORK course graded in Rust. Every drill and challenge compiles against Seiva 0.2.0 and a
# few crates around it, declared ONCE in [build] below. Grading never touches the network: the
# Learning Track's «Prepare course» (or `dxt plugin prepare courses/seiva`) downloads these
# dependencies once into a course cache, with the human's approval, and builds them; after that
# every step compiles offline against that cache.
#
# SWITCHING TO CRATES.IO: when Seiva 0.2.0 is published there, change the ONE line under
# [build.vars] to
#
#   seiva = 'version = "0.2.0"'
#
# Nothing else changes (every Seiva dependency below cites ${seiva}). The course cache sees the
# new dependency set and asks to be prepared again.

id = "seiva-basics"
language = "rust"
category = "framework"
subject = "seiva"
title = "Seiva: Backends That Keep Their Shape"
level = "intermediate"
summary = "Build a Seiva module from the domain up: rules, ports, transactional use cases, a versioned contract, generated HTTP routes and the five-crate layout."

overview = '''
**Seiva** (Delonix Seiva) is a Rust backend framework for robust, high-criticality systems. A Seiva
backend is made of **modules that own their data**, and each module exposes **one versioned
contract** — a trait — from which everything a client sees is derived: the HTTP routes, the
permission checks, the OpenAPI 3.1 document and the gRPC proto. No reflection, no hidden magic: it is
all known at compile time, and the compiler enforces the architecture.

In this course you build one module, **`tasks`**, the way Seiva's own examples are built:

1. **the domain** — an entity whose constructor enforces its rules;
2. **the ports** — the traits a use case asks of the world (ids, time, transactions, events) and
   the in-memory doubles that stand in for them in tests;
3. **the use cases** — a service generic over the ports, one transaction per use case, events
   published inside it;
4. **the contract** — a `#[seiva::facade]` trait, wire DTOs, validation and permissions;
5. **HTTP** — `#[seiva::controller]` turns the facade into an axum router;
6. **the five crates** — the module split into domain, application, facade, infrastructure and
   interface, wired by a composition root and served end to end.

**What you need.** The Rust toolchain (`cargo`) and the basics of Rust: structs and enums,
`Result` and `?`, traits and generics, and `async`/`.await`. No database and no server: everything
runs on Seiva's in-memory adapters.

**Prepare the course once.** The exercises compile against **Seiva 0.2.0** (from its Git repository,
tag `v0.2.0`), `tokio`, `axum`, `tower` and `serde`. Grading never uses the network, so the first
time you open the course, use **Prepare course**: it shows the exact commands, and after you approve
them it downloads those dependencies into a cache of this course (not your `~/.cargo`) and builds
them once (about a minute and roughly 650 MB on disk). After that every step compiles offline in a
few seconds.

**Official documentation:** https://ngolacloud.github.io/seiva/ — the "Seiva at a glance" page, the
Architecture page and the shop tutorial go well with this course.
'''

[build]
prepare = true
# Each build of a step: a few seconds with the prepared cache (measured: 1–4 s on 22 cores; a
# rebuild of every dependency after a toolchain update, offline: about 25 s). The limit leaves room
# for slower machines.
timeout_secs = 240
dependencies = [
  'seiva = { ${seiva}, default-features = false }',
  'seiva-ports = { ${seiva} }',
  'seiva-testing = { ${seiva} }',
  'seiva-http = { ${seiva} }',
  'tokio = { version = "1", features = ["rt", "macros"] }',
  'axum = "0.8"',
  'tower = { version = "0.5", features = ["util"] }',
  'serde = { version = "1", features = ["derive"] }',
  'serde_json = "1"',
]

[build.vars]
# THE source of Seiva for the whole course (see the top of this file for the crates.io switch).
seiva = 'git = "https://github.com/ngolacloud/seiva", tag = "v0.2.0"'


[[unit]]
id = "sv-u1-domain"
title = "The domain: rules that cannot be skipped"
level = "basic"
difficulty = 1
intro = "A Seiva module starts with its domain: the entities and the rules they keep, in plain Rust."
concepts = '''
A Seiva backend is built from **modules**, and every module starts with its **domain**: the
entities of the business and the rules they must keep. In this course you build one module, `tasks`,
and its domain is small on purpose — a `Task` has an id, a title and a `done` flag.

**A rule lives in the constructor.** Seiva's examples never build an entity with a struct literal from
outside: they call `Task::new(...)`, which returns `Result<Task, DomainError>`. If the title is empty,
you do not get a `Task` at all — you get an error. That is the whole trick: a value of type `Task` is
*proof* that the rules held when it was made. Code that receives a `Task` never re-checks the title.

```rust
pub fn new(id: u128, title: impl Into<String>) -> Result<Self, DomainError> {
    let title = title.into().trim().to_string();
    if title.is_empty() {
        return Err(DomainError::EmptyTitle);
    }
    Ok(Self { id, title, done: false })
}
```

**Errors are part of the domain's language.** `DomainError` is an `enum` with one variant per rule
(`EmptyTitle`, `TitleTooLong { max }`, `AlreadyDone`). It implements `Display` (a message a person can
read) and `std::error::Error`, so the layers above can carry it as a boxed error and still print it.
State changes are rules too: `complete(&mut self)` refuses a task that is already done.

**The domain depends on nothing.** In a real Seiva module the domain is its own crate whose
`[dependencies]` table is empty: no framework, no HTTP, no database. The compiler then guarantees that
no rule ever reaches for a request or a SQL connection. Everything in this unit is plain Rust — that
is the point. Seiva arrives in the next unit, around the domain, never inside it.

**Ids are `u128`.** Seiva's identifiers are 128-bit values (`seiva_ports::Id` is 16 bytes); the domain
keeps them as `u128` and the wire turns them into strings, so no JavaScript client loses precision.

Official docs: https://ngolacloud.github.io/seiva/ (Architecture, and the `examples/notes` module of the
repository, which this unit follows).
'''

[[unit.step]]
kind = "concept"
id = "sv-c1-domain"
title = "Why the domain comes first"
points = 5
difficulty = 1
intro = "Before any framework code: what an entity is, and why its constructor can say no."
body = '''
Open any module of the Seiva repository (`examples/notes`, `examples/shop/orders`) and you find
the same five crates. The first one to read is always `domain`.

- An **entity** is a type whose values are always valid. You get one only through `new()`, which
  checks the rules and returns `Result<Entity, DomainError>`.
- A **rule** that a state change must respect (a task is completed once) is a method that can fail.
- The domain crate has **no dependencies**, so it can be tested with `cargo test` and nothing else.

In this unit you write the `tasks` domain in plain Rust. Everything after it — ports, use cases,
contract, HTTP — is built around it and never changes it.
'''

