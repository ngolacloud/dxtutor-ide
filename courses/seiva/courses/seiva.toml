use seiva_ports::{BoxError, EventPublisher, IdGenerator, PortResult, Scope, UnitOfWork};

// The repository port is the domain's; re-exported so the layers above import it from here.
pub use crate::domain::{RepositoryError, Task, TaskRepository};

/// The `tasks` use cases. Generic over the ports: the composition root decides what is
/// behind each one (in-memory doubles in a test, a database in production).
pub struct TasksService<R, G, U, E> {
    pub repository: R,
    pub ids: G,
    pub uow: U,
    pub events: E,
}

impl<R, G, U, E> TasksService<R, G, U, E>
where
    R: TaskRepository + Sync,
    G: IdGenerator,
    U: UnitOfWork,
    E: EventPublisher,
{
    /// Creates a task under `scope`: the rule is checked first (no transaction for a
    /// command the domain refuses), then the task is saved AND `tasks.created` is
    /// published inside ONE transaction, so both happen or neither does.
    pub async fn create(&self, scope: Scope, title: &str) -> PortResult<Task> {
        let id = u128::from_be_bytes(self.ids.new_id().0);
        let task = Task::new(id, title).map_err(BoxError::from)?;
        let event = serde_json::to_vec(&serde_json::json!({
            "id": task.id.to_string(),
            "title": task.title,
        }))
        .map_err(BoxError::from)?;
        self.uow
            .transaction(scope, || async {
                self.repository.save(&task).await?;
                self.events.publish("tasks.created", &event).await
            })
            .await?;
        Ok(task)
    }

    /// Completes the task `id` under `scope`: load it, apply the domain rule, save it and
    /// publish `tasks.completed` — all inside ONE transaction, so a missing task or a task
    /// that is already done rolls everything back and publishes nothing.
    pub async fn complete(&self, scope: Scope, id: u128) -> PortResult<Task> {
