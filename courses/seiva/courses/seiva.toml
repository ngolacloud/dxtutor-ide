title = "Inside a use case"
points = 5
difficulty = 3
intro = "The shape of a write use case in Seiva, step by step."
body = '''
A write use case has four moves, always in this order:

1. **Mint and validate** — take an id from `IdGenerator`, build the entity with `Task::new` (this can
   refuse the command, and then nothing else happens).
2. **Prepare the event** — serialise the payload *before* the transaction, so a serialisation error
   cannot leave a half-done transaction.
3. **One transaction** — `self.uow.transaction(scope, || async { save; publish })`.
4. **Return** what the caller needs (here the `Task`; the layer above turns it into a DTO).

The tests of this unit use the in-memory doubles: `InMemoryUnitOfWork::outcomes()` tells whether the
transaction committed or rolled back, `scopes()` under which tenant, and
`RecordingEventPublisher::topics()` what was announced.
'''

