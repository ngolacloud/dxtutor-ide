[unit.step.gabarito]
solution = '''
//! The contract of the `tasks` module: what other modules and the transports see.

// Facade methods are `async fn` in a public trait.
#![allow(async_fn_in_trait)]

use seiva::{facade, WireSchema};
use seiva_http::{Problem, Validate, ValidationError};
use serde::{Deserialize, Serialize};

/// The longest title a task may have, in characters.
pub const MAX_TITLE: usize = 80;

/// The body of `create`.
#[derive(Debug, Clone, Deserialize, Serialize, WireSchema)]
pub struct CreateTask {
    pub title: String,
}

impl Validate for CreateTask {
    fn validate(&self) -> Result<(), ValidationError> {
        let title = self.title.trim();
        if title.is_empty() {
            return Err(ValidationError::new("title must not be empty"));
        }
        if title.chars().count() > MAX_TITLE {
            return Err(ValidationError::new(format!(
                "title has at most {MAX_TITLE} characters"
            )));
        }
        Ok(())
    }
}

/// The body of `complete`.
#[derive(Debug, Clone, Deserialize, Serialize, WireSchema)]
pub struct CompleteTask {
    pub id: u64,
}

impl Validate for CompleteTask {
    fn validate(&self) -> Result<(), ValidationError> {
        Ok(())
    }
}

/// What the contract returns: never a domain type.
#[derive(Debug, Clone, PartialEq, Eq, Serialize, WireSchema)]
pub struct TaskDto {
    pub id: u64,
    pub title: String,
    pub done: bool,
}

/// The contract's error; the transports turn it into an RFC 9457 problem.
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum TaskError {
    NotFound(u64),
    Invalid(String),
}

impl From<TaskError> for Problem {
    fn from(error: TaskError) -> Self {
        match error {
            TaskError::NotFound(id) => Problem::not_found(format!("no task {id}")),
            TaskError::Invalid(why) => Problem::unprocessable_entity(why),
        }
    }
}

/// The `tasks` module's public contract, version 1.
#[facade(version = "v1")]
pub trait Tasks {
    #[requires("tasks.create")]
    async fn create(&self, cmd: CreateTask) -> Result<TaskDto, TaskError>;

    #[requires("tasks.read")]
    async fn get(&self, id: u64) -> Result<TaskDto, TaskError>;

    #[requires("tasks.complete")]
    async fn complete(&self, cmd: CompleteTask) -> Result<TaskDto, TaskError>;

    #[public]
    async fn list(&self) -> Result<Vec<TaskDto>, TaskError>;
}
'''
time = "O(n)"
space = "O(1)"
justification = "`validate` trims and counts the characters of the title once (linear in its length). The permissions are attributes read at compile time: the descriptor costs nothing at run time, and a method without `#[requires]` or `#[public]` would not compile — the contract cannot leave an endpoint open by accident."

[[unit]]
id = "sv-u6-http"
title = "From contract to HTTP: the controller"
level = "advanced"
difficulty = 6
intro = "`#[seiva::controller]` turns an implementation of the facade into an axum router — routes, guards and problems included."
concepts = '''
You never write a route in Seiva. You implement the facade and put `#[seiva::controller]` on the
`impl`; the macro generates a builder `<trait>_router(service) -> axum::Router` (`Tasks` →
`tasks_router`, `UserAccounts` → `user_accounts_router`).

**The routing convention** — the method name picks the verb and the path, the resource and the
version come from the descriptor:

| method | HTTP | path | input | success |
|---|---|---|---|---|
| `create` | `POST` | `/v1/tasks` | the DTO body | `201` |
| `get` | `GET` | `/v1/tasks/{id}` | the id from the path | `200` |
| `list` | `GET` | `/v1/tasks` | (an optional query) | `200` |
| any other | `POST` | `/v1/tasks/<method>` | the DTO body | `200` |

**What each generated handler does.** It takes the service from the router's state, extracts the
input — a body through `seiva_http::Valid<T>` (parse + `Validate`; failure = `422`), a path id
through `axum::extract::Path` — calls your method, and serialises the `Ok` value to JSON. An `Err` is
turned into a `Problem` (your `From<TaskError> for Problem`) and rendered as
`application/problem+json`.

**The permission guard.** Each route is wrapped in `seiva_http::permission_guard` with the method's
`requires` read from the descriptor. A caller without the permission gets a `403` problem *before*
your method runs; a `#[public]` method has no guard. Who the caller is comes from the request: the
authentication layer puts an `Arc<Principal>` in the request extensions (in tests you put it there
yourself: `.extension(Arc::new(Principal::new("ana", ["tasks.create"])))`).

**What the service must be.** The router keeps the service as its state, so it must be
`Clone + Send + Sync + 'static`. Shared mutable state goes behind `Arc<Mutex<…>>` (every clone sees
the same tasks). The `<Trait>Facade` descriptor type must be in scope where the controller is used
(import it next to the trait), and the crate needs `axum` and `seiva-http` as dependencies.

**Testing without a server.** An `axum::Router` is a `tower::Service`: `router.oneshot(request)`
sends one request in memory and returns the response. No port, no socket, no flakiness.

Docs: "Controllers and routing", "Validation" and "Request and response" in the Seiva documentation.
'''

[[unit.step]]
kind = "concept"
id = "sv-c6-http"
title = "Routes you do not write"
points = 5
difficulty = 6
intro = "How a facade implementation becomes routes, and what happens to a request on the way."
body = '''
A request to `POST /v1/tasks` goes through, in order:

1. the **permission guard** — does the `Principal` hold `tasks.create`? If not: `403`, and your code
   never runs;
2. the **extractor** — `Valid<CreateTask>` parses the JSON and calls `validate()`; unknown fields and
   invalid content are a `422`;
3. **your method** — `create(&self, cmd)`;
4. the **response** — `201` with the DTO as JSON, or the `Problem` your error maps to.

In this unit you implement the facade over an in-memory store and let the controller do the rest.
The hidden tests drive the router with `oneshot`, like Seiva's own controller tests.
'''

