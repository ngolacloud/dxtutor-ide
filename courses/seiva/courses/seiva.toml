"tasks-domain/src/lib.rs" = '''
//! tasks-domain: the task, its rules and the repository port. No dependencies at all:
//! the crate graph is what keeps the framework, the transport and the database out.

use std::fmt;
use std::future::Future;

/// The longest title a task may have, in characters.
pub const MAX_TITLE: usize = 80;

/// A task. Build it with [`Task::new`], so its rules always hold.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct Task {
    pub id: u128,
    pub title: String,
    pub done: bool,
}

/// A rule of the domain said no.
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum DomainError {
    EmptyTitle,
    TitleTooLong { max: usize },
    AlreadyDone,
}

impl fmt::Display for DomainError {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        match self {
            DomainError::EmptyTitle => write!(f, "a task needs a title"),
            DomainError::TitleTooLong { max } => {
                write!(f, "a task title has at most {max} characters")
            }
            DomainError::AlreadyDone => write!(f, "the task is already done"),
        }
    }
}

impl std::error::Error for DomainError {}

impl Task {
    /// Creates an open task with a trimmed title of 1 to [`MAX_TITLE`] characters.
    pub fn new(id: u128, title: impl Into<String>) -> Result<Self, DomainError> {
        let title = title.into().trim().to_string();
        if title.is_empty() {
            return Err(DomainError::EmptyTitle);
        }
        if title.chars().count() > MAX_TITLE {
            return Err(DomainError::TitleTooLong { max: MAX_TITLE });
        }
        Ok(Self {
            id,
            title,
            done: false,
        })
    }

    /// Marks the task done; a task is completed only once.
    pub fn complete(&mut self) -> Result<(), DomainError> {
        if self.done {
            return Err(DomainError::AlreadyDone);
        }
        self.done = true;
        Ok(())
    }
}

/// A repository operation failed. It speaks the domain's language, not the framework's.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct RepositoryError(pub String);

impl fmt::Display for RepositoryError {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        f.write_str(&self.0)
    }
}

impl std::error::Error for RepositoryError {}

/// Where tasks are kept: a port the DOMAIN defines and the infrastructure implements.
/// The futures are `Send`, so a use case can await them inside a transaction.
pub trait TaskRepository {
    /// Inserts the task, or replaces the one with the same id.
    fn save(&self, task: &Task) -> impl Future<Output = Result<(), RepositoryError>> + Send;
    /// The task with this id, if there is one.
    fn find(&self, id: u128) -> impl Future<Output = Result<Option<Task>, RepositoryError>> + Send;
    /// Every task, in the order they were first saved.
    fn list(&self) -> impl Future<Output = Result<Vec<Task>, RepositoryError>> + Send;
}
'''
