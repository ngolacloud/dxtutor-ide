#[tokio::test]
async fn saves_replaces_finds_and_lists_in_order() {
    let repo = InMemoryTaskRepository::new();
    let mut a = Task::new(1, "a").unwrap();
    repo.save(&a).await.unwrap();
    repo.save(&Task::new(2, "b").unwrap()).await.unwrap();
    a.complete().unwrap();
    repo.save(&a).await.unwrap();
    assert_eq!(repo.find(1).await.unwrap(), Some(a.clone()));
    assert_eq!(repo.find(3).await.unwrap(), None);
    let all = repo.list().await.unwrap();
    assert_eq!(all.iter().map(|t| t.id).collect::<Vec<_>>(), [1, 2]);
    assert!(all[0].done);
}
