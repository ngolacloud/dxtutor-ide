"src/application.rs" = '''
use seiva_ports::{BoxError, EventPublisher, IdGenerator, PortResult, Scope, UnitOfWork};

// The repository port is the domain's; re-exported so the layers above import it from here.
pub use crate::domain::{RepositoryError, Task, TaskRepository};

/// The `tasks` use cases. Generic over the ports: the composition root decides what is
/// behind each one (in-memory doubles in a test, a database in production).
pub struct TasksService<R, G, U, E> {
    pub repository: R,
    pub ids: G,
    pub uow: U,
    pub events: E,
}

impl<R, G, U, E> TasksService<R, G, U, E>
where
    R: TaskRepository + Sync,
    G: IdGenerator,
    U: UnitOfWork,
    E: EventPublisher,
{
    /// Creates a task under `scope`: the rule is checked first (no transaction for a
    /// command the domain refuses), then the task is saved AND `tasks.created` is
    /// published inside ONE transaction, so both happen or neither does.
    pub async fn create(&self, scope: Scope, title: &str) -> PortResult<Task> {
        let id = u128::from_be_bytes(self.ids.new_id().0);
        let task = Task::new(id, title).map_err(BoxError::from)?;
        let event = serde_json::to_vec(&serde_json::json!({
            "id": task.id.to_string(),
            "title": task.title,
        }))
        .map_err(BoxError::from)?;
        self.uow
            .transaction(scope, || async {
                self.repository.save(&task).await?;
                self.events.publish("tasks.created", &event).await
            })
            .await?;
        Ok(task)
    }

    /// Completes the task `id` under `scope`: load it, apply the domain rule, save it and
    /// publish `tasks.completed` — all inside ONE transaction, so a missing task or a task
    /// that is already done rolls everything back and publishes nothing.
    pub async fn complete(&self, scope: Scope, id: u128) -> PortResult<Task> {
        self.uow
            .transaction(scope, || async move {
                let mut task = self
                    .repository
                    .find(id)
                    .await?
                    .ok_or_else(|| BoxError::from(NotFound(id)))?;
                task.complete().map_err(BoxError::from)?;
                self.repository.save(&task).await?;
                let event = serde_json::to_vec(&serde_json::json!({ "id": task.id.to_string() }))
                    .map_err(BoxError::from)?;
                self.events.publish("tasks.completed", &event).await?;
                Ok(task)
            })
            .await
    }
}

/// No task has this id.
#[derive(Debug, Clone, PartialEq, Eq)]
pub struct NotFound(pub u128);

impl std::fmt::Display for NotFound {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "no task {}", self.0)
    }
}

impl std::error::Error for NotFound {}
'''

[[unit]]
id = "sv-u5-contract"
title = "The contract: a facade and its DTOs"
level = "intermediate"
difficulty = 5
intro = "One versioned trait is the module's public contract; routes, OpenAPI and permissions are derived from it."
concepts = '''
Everything other modules and clients see of `tasks` is its **facade**: a trait marked with
`#[seiva::facade(version = "v1")]`. Seiva's one big idea is that every transport is *derived* from
this contract, never hand-written: the HTTP routes (`#[seiva::controller]`, next unit), the OpenAPI
3.1 document, the permission checks and the proto3 service all read it.

```rust
#[facade(version = "v1")]
pub trait Tasks {
    #[requires("tasks.create")]
    async fn create(&self, cmd: CreateTask) -> Result<TaskDto, TaskError>;
    #[public]
    async fn list(&self) -> Result<Vec<TaskDto>, TaskError>;
}
```

**Fail-closed permissions.** Every method declares either `#[requires("permission")]` or `#[public]`.
Leaving both out is a *compile error*: an endpoint is never public by accident.

**The descriptor.** The macro keeps the trait and adds a zero-sized `TasksFacade` type implementing
`seiva::contract::Facade`. Its `DESCRIPTOR` is plain data, known at compile time: `name` ("Tasks"),
`version` ("v1") and `methods` — each with `name`, `requires` (`""` when public), `params` (name and
type as written) and `output`. `descriptor.resource_segment()` is the URL segment, the name lowercased
and pluralised (`Tasks` → `tasks`, `Inventory` → `inventories`). No reflection: this is how the
controller and the OpenAPI generator learn the contract.

**DTOs, never domain types.** The contract speaks in wire DTOs — `CreateTask`, `TaskDto` — not in
`Task`. They derive `serde` (`Deserialize` for bodies, `Serialize` for responses) and `WireSchema`
(`#[derive(WireSchema)]`, re-exported by `seiva`), which publishes their real shape into the OpenAPI
document. The domain can change without breaking a client, and the version (`v1`) lets `v2` live next
to it.

**Validation at the edge.** A body DTO implements `seiva_http::Validate`
(`fn validate(&self) -> Result<(), ValidationError>`). The HTTP layer runs it before the method is
called: an invalid body never reaches a use case and becomes a `422` problem.

**Errors as problems.** The facade's error type implements `From<TaskError> for Problem`
(`seiva_http::Problem`, an RFC 9457 problem): `Problem::not_found(...)`, `Problem::forbidden(...)`,
`Problem::unprocessable_entity(...)`. The module decides which status each error is.

Docs: "Facades" and "Wire schema" in the Seiva documentation.
'''

