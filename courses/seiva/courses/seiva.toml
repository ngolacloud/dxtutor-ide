The facade is the **inbound port** of the module — the one versioned, permission-guarded contract
other modules and the transports see. (The name is Seiva's term for that role; it is not the GoF
*Facade* pattern.)

`#[seiva::facade]` does not hide anything: it keeps your trait as written and adds the `<Trait>Facade`
descriptor. Every macro in Seiva has a documented hand-written equivalent — you could write the
`DESCRIPTOR` yourself (`seiva::contract::{FacadeDescriptor, MethodDescriptor, Param}`).

In this unit you write the `Tasks` contract and the validation of its `create` body. The tests read
the generated descriptor, exactly as the controller and the OpenAPI generator do.
'''

