use seiva_ports::{IdGenerator, Scope};
use seiva_testing::{FixedClock, SequenceIdGenerator};
use student::{new_task, scope_for, NewTask};

#[test]
fn mints_with_the_next_id_and_the_clock() {
    let ids = SequenceIdGenerator::starting_at(41);
    let clock = FixedClock::at_unix_secs(1_000);
    let t = new_task(&ids, &clock, "  plan  ").unwrap();
    assert_eq!(t, NewTask { id: 41, title: "plan".into(), created_at: 1_000 });
    clock.advance(std::time::Duration::from_secs(5));
    let u = new_task(&ids, &clock, "review").unwrap();
    assert_eq!((u.id, u.created_at), (42, 1_005));
}

#[test]
fn an_empty_title_takes_no_id() {
    let ids = SequenceIdGenerator::starting_at(7);
    let clock = FixedClock::at_unix_secs(0);
    assert!(new_task(&ids, &clock, "   ").is_err());
    // the generator did not move
    assert_eq!(u128::from_be_bytes(ids.new_id().0), 7);
}

#[test]
fn the_scope_fails_closed() {
    assert_eq!(scope_for(Some("acme")), Ok(Scope::tenant("acme").unwrap()));
    assert!(scope_for(None).is_err());
    assert!(scope_for(Some("  ")).is_err());
    assert!(!matches!(scope_for(None), Ok(Scope::Global)));
}
