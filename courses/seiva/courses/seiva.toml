    assert_eq!(d.method("create").unwrap().requires, "tasks.create");
    assert_eq!(d.method("get").unwrap().requires, "tasks.read");
    assert_eq!(d.method("complete").unwrap().requires, "tasks.complete");
    assert!(!d.method("list").unwrap().is_guarded());
    let create = d.method("create").unwrap();
    assert_eq!(create.params, [Param { name: "cmd", ty: "CreateTask" }]);
    assert_eq!(create.output, "Result<TaskDto, TaskError>");
