"tasks-api/tests/compose.rs" = '''
use axum::body::Body;
use axum::http::{Request, StatusCode};
use seiva_http::Principal;
use std::sync::Arc;
use tower::ServiceExt;

fn post(path: &str, body: &str, who: Option<Principal>) -> Request<Body> {
    let mut r = Request::builder()
        .method("POST")
        .uri(path)
        .header("content-type", "application/json");
    if let Some(p) = who {
        r = r.extension(Arc::new(p));
    }
    r.body(Body::from(body.to_string())).unwrap()
}

fn get(path: &str, who: Principal) -> Request<Body> {
    Request::builder()
        .uri(path)
        .extension(Arc::new(who))
        .body(Body::empty())
        .unwrap()
}

fn acme(perms: &[&str]) -> Principal {
    Principal::in_tenant("ana", "acme", perms.iter().copied())
}

async fn json(r: axum::response::Response) -> serde_json::Value {
    let bytes = axum::body::to_bytes(r.into_body(), usize::MAX).await.unwrap();
    serde_json::from_slice(&bytes).unwrap()
}

#[tokio::test]
async fn the_composed_module_creates_lists_and_completes() {
    let app = tasks_api::compose();
    let r = app
        .router
        .clone()
        .oneshot(post("/v1/tasks", r#"{"title":"  wire the module "}"#, Some(acme(&["tasks.create"]))))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::CREATED);
    let created = json(r).await;
    assert_eq!(created["id"], 1);
    assert_eq!(created["title"], "wire the module");
    assert_eq!(created["done"], false);

    let r = app.router.clone().oneshot(get("/v1/tasks", acme(&["tasks.read"]))).await.unwrap();
    assert_eq!(r.status(), StatusCode::OK);
    let all = json(r).await;
    assert_eq!(all.as_array().map(Vec::len), Some(1));

    let r = app
        .router
        .clone()
        .oneshot(post("/v1/tasks/complete", r#"{"id":1}"#, Some(acme(&["tasks.complete"]))))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::OK);
    assert_eq!(json(r).await["done"], true);
    assert_eq!(app.events.topics(), ["tasks.created", "tasks.completed"]);
}

#[tokio::test]
async fn the_guard_and_the_tenant_fail_closed() {
    let app = tasks_api::compose();
    // no permission: the guard refuses before the handler runs
    let r = app.router.clone().oneshot(post("/v1/tasks", r#"{"title":"x"}"#, None)).await.unwrap();
    assert_eq!(r.status(), StatusCode::FORBIDDEN);
    // the permission but no tenant: the interface refuses, nothing is written
    let no_tenant = Principal::new("bot", ["tasks.create"]);
    let r = app
        .router
        .clone()
        .oneshot(post("/v1/tasks", r#"{"title":"x"}"#, Some(no_tenant)))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::FORBIDDEN);
    assert!(app.events.topics().is_empty());
    // a blank title never reaches the use case
    let r = app
        .router
        .clone()
        .oneshot(post("/v1/tasks", r#"{"title":"   "}"#, Some(acme(&["tasks.create"]))))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::UNPROCESSABLE_ENTITY);
}

#[tokio::test]
async fn completing_a_missing_or_finished_task_is_refused() {
    let app = tasks_api::compose();
    let r = app
        .router
        .clone()
        .oneshot(post("/v1/tasks/complete", r#"{"id":9}"#, Some(acme(&["tasks.complete"]))))
        .await
        .unwrap();
    assert_eq!(r.status(), StatusCode::NOT_FOUND);
    app.router
        .clone()
        .oneshot(post("/v1/tasks", r#"{"title":"once"}"#, Some(acme(&["tasks.create"]))))
        .await
        .unwrap();
    let done = || post("/v1/tasks/complete", r#"{"id":1}"#, Some(acme(&["tasks.complete"])));
    assert_eq!(app.router.clone().oneshot(done()).await.unwrap().status(), StatusCode::OK);
    assert_eq!(
        app.router.clone().oneshot(done()).await.unwrap().status(),
        StatusCode::UNPROCESSABLE_ENTITY
    );
    assert_eq!(app.events.topics(), ["tasks.created", "tasks.completed"]);
}
