//! The contract of the `tasks` module: what other modules and the transports see.

// Facade methods are `async fn` in a public trait.
#![allow(async_fn_in_trait)]

use seiva::{facade, WireSchema};
use seiva_http::{Problem, Validate, ValidationError};
use serde::{Deserialize, Serialize};

/// The longest title a task may have, in characters.
pub const MAX_TITLE: usize = 80;

/// The body of `create`.
#[derive(Debug, Clone, Deserialize, Serialize, WireSchema)]
pub struct CreateTask {
    pub title: String,
}

impl Validate for CreateTask {
    fn validate(&self) -> Result<(), ValidationError> {
        let title = self.title.trim();
        if title.is_empty() {
            return Err(ValidationError::new("title must not be empty"));
        }
        if title.chars().count() > MAX_TITLE {
            return Err(ValidationError::new(format!(
                "title has at most {MAX_TITLE} characters"
            )));
        }
        Ok(())
    }
}

/// The body of `complete`.
#[derive(Debug, Clone, Deserialize, Serialize, WireSchema)]
pub struct CompleteTask {
    pub id: u64,
}

impl Validate for CompleteTask {
    fn validate(&self) -> Result<(), ValidationError> {
        Ok(())
    }
}

/// What the contract returns: never a domain type.
#[derive(Debug, Clone, PartialEq, Eq, Serialize, WireSchema)]
pub struct TaskDto {
    pub id: u64,
    pub title: String,
    pub done: bool,
}

/// The contract's error; the transports turn it into an RFC 9457 problem.
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum TaskError {
    NotFound(u64),
    Invalid(String),
}

impl From<TaskError> for Problem {
    fn from(error: TaskError) -> Self {
        match error {
            TaskError::NotFound(id) => Problem::not_found(format!("no task {id}")),
            TaskError::Invalid(why) => Problem::unprocessable_entity(why),
        }
    }
}

/// The `tasks` module's public contract, version 1.
#[facade(version = "v1")]
pub trait Tasks {
    #[requires("tasks.create")]
    async fn create(&self, cmd: CreateTask) -> Result<TaskDto, TaskError>;

    #[requires("tasks.read")]
    async fn get(&self, id: u64) -> Result<TaskDto, TaskError>;

    #[requires("tasks.complete")]
    async fn complete(&self, cmd: CompleteTask) -> Result<TaskDto, TaskError>;

    #[public]
    async fn list(&self) -> Result<Vec<TaskDto>, TaskError>;
}
