[[unit]]
id = "u20-recursion-dp"
concepts = '''
## The idea

**Recursion** solves a problem by reducing it to smaller instances of the same problem. Every recursive definition needs a **base case** that is answered directly and a **recursive case** that moves toward it. At run time, each pending call occupies a **stack frame**, so recursion depth costs memory.

Some recursions repeat themselves. Naive Fibonacci calls `fib(n-2)` from two different branches, and the repetition compounds into exponential time, roughly O(2ⁿ). **Dynamic programming** (DP) applies when a problem has two properties:

- **overlapping subproblems**: the same smaller question is asked again and again;
- **optimal substructure**: the best answer is built from the best answers to smaller questions.

DP solves each subproblem **once** and stores the answer. There are two styles:

- **Top-down memoisation**: keep the recursion, but cache results in a map or slice, and check the cache before computing.
- **Bottom-up tabulation**: fill a table from the smallest subproblem upward, with no recursion at all.

Both turn naive Fibonacci into O(n). The recipe is always the same: define the subproblem, write the **recurrence**, fix the base cases, choose the evaluation order. DP also explains why **greedy** strategies, which always take the locally best step, can fail. DP compares every choice at every subproblem instead of committing early.

## How Go does it

Recursion is ordinary function calls. A memo is usually a map. An array key is comparable, so `[2]int` works for two-dimensional subproblems. This counts the paths through a grid that move only right or down:

```go
func paths(r, c int, memo map[[2]int]int) int {
	if r == 0 || c == 0 {
		return 1
	}
	key := [2]int{r, c}
	if v, ok := memo[key]; ok {
		return v
	}
	v := paths(r-1, c, memo) + paths(r, c-1, memo)
	memo[key] = v
	return v
}
```

`paths(2, 2, map[[2]int]int{})` returns `6`. Maps behave like references, so every recursive call shares the same memo.

For bottom-up tables, `make([]int, n+1)` gives a slice of zeros with index `n` included. For two dimensions, make the outer slice and then `make` each row in a loop. A recursive anonymous function must be declared first (`var walk func(int) int`) and assigned afterwards. Writing `walk := func...` cannot refer to itself, and the compiler reports `undefined: walk`.

## What is special or tricky

- **Go does not optimise tail calls.** Goroutine stacks grow on demand, but runaway recursion still dies with `goroutine stack exceeds 1000000000-byte limit` followed by `fatal error: stack overflow`. A missing or unreachable base case is the usual cause.
- **Table bounds.** With `dp := make([]int, n+1)` and `n == 0`, touching `dp[1]` panics with `index out of range [1] with length 1`. Handle the small cases first.
- **Integer overflow is silent.** Fibonacci overflows `int` around n = 93, and the result just wraps negative. The same happens if you use `math.MaxInt` as "infinity" and then add to it. Guard such sentinels before doing arithmetic with them.
- **Base cases carry meaning.** An answer for 0 is usually not "nothing". It is the identity the recurrence builds on.

## What you will practise

You will write a recursive factorial, watch naive Fibonacci waste work, and rebuild it as a bottom-up table. The challenge asks you to design a DP table for an optimisation problem where the greedy choice is not always right.
'''
title = "Recursion & dynamic programming"
difficulty = 20
level = "advanced"
intro = """
Recursion solves a problem by solving smaller versions of itself. When those subproblems
overlap, plain recursion redoes the same work exponentially — and **dynamic programming** fixes
it by solving each subproblem once and storing the answer. You will write classic recursions,
watch naive Fibonacci blow up, rebuild it bottom-up, and finish with the coin-change problem.
"""

[[unit.step]]
kind = "concept"
id = "c20-recursion-dp"
title = "From recursion to memoized DP"
points = 5
difficulty = 20
run_command = ""
intro = """
A recursive function needs a base case (when to stop) and a recursive case (how to shrink the
problem). When subproblems repeat, caching their results — dynamic programming — removes the
exponential blow-up.
"""
body = """
## Recursion

Base case plus a smaller call:

```go
func fact(n int) int {
    if n <= 1 {
        return 1       // base case
    }
    return n * fact(n-1)   // recursive case
}
```

## The overlap problem

Naive Fibonacci recomputes the same values over and over:

```go
func fib(n int) int {
    if n < 2 { return n }
    return fib(n-1) + fib(n-2)   // exponential: fib(n-2) computed twice, and so on
}
```

## Dynamic programming (bottom-up)

Solve each subproblem once, smallest first, and store it in a table:

```go
if n == 0 {
    return 0 // base case first: dp[1] below would be out of range for n == 0
}
dp := make([]int, n+1)
dp[1] = 1
for i := 2; i <= n; i++ {
    dp[i] = dp[i-1] + dp[i-2]   // each entry filled once
}
return dp[n]
```

The exponential recursion becomes a linear loop. The recipe generalises: define the
subproblem, find the recurrence (how an answer builds from smaller ones), pick the base cases,
and fill the table from the bottom up.
"""

