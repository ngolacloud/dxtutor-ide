package student

import "sync"

func SumParallel(nums []int) int {
	const workers = 4
	if len(nums) == 0 {
		return 0
	}
	partials := make([]int, workers)
	var wg sync.WaitGroup
	wg.Add(workers)
	for w := 0; w < workers; w++ {
