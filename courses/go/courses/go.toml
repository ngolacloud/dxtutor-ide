package main

import (
    "fmt"
    "sync"
)

func main() {
    nums := []int{10, 20, 30, 40}
    results := make([]int, len(nums))
    var wg sync.WaitGroup
    for i, n := range nums {
        wg.Add(1)
        go func(idx, val int) {
            defer wg.Done()
            results[idx] = val * val
        }(i, n)
    }
    wg.Wait()
    fmt.Println(results)
}
'''
