[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
package student

func BalancedParens(s string) bool {
	pairs := map[rune]rune{')': '(', ']': '[', '}': '{'}
	var stack []rune
	for _, c := range s {
		switch c {
		case '(', '[', '{':
			stack = append(stack, c)
		case ')', ']', '}':
			if len(stack) == 0 || stack[len(stack)-1] != pairs[c] {
				return false
			}
			stack = stack[:len(stack)-1]
		}
	}
	return len(stack) == 0
}
'''
justification = """
Each character is visited once, so the scan is **O(n)**; the stack holds at most one entry
per unmatched opener, so worst-case space is **O(n)**. A closer is legal only when the stack
top is its matching opener — otherwise the string is unbalanced. Leftover openers at the end
(non-empty stack) also mean unbalanced. Non-bracket characters hit no `switch` case and are
ignored.
"""

[[unit]]
id = "u16-linked-list"
concepts = '''
## The idea

A **linked list** stores a sequence as a chain of **nodes**. Each node holds a value and a **reference** to the next node, and the last node's reference is empty. The list itself is just a reference to the first node, the **head**. Nothing is contiguous: the nodes can live anywhere in memory, connected only by pointers.

That layout trades one set of costs for another. Compared with an array or slice:

- **Insert or remove at the head: O(1).** You only rewire a pointer. A slice must shift every element to insert at the front, which is O(n).
- **Insert after a node you already hold: O(1)**, for the same reason.
- **Access by index, search, length: O(n).** You must walk from the head, because there is no arithmetic that jumps to element *i*. Length is O(n) unless you store a counter.
- **Append at the tail: O(n)**, unless you also keep a tail pointer.

Slices are also friendlier to CPU caches, so in everyday Go code they usually win. Linked lists still matter: they teach pointer-based structures, and trees and graphs are built from the same kind of nodes. A **doubly linked list** adds a `prev` pointer so you can walk both ways. The standard library ships one as `container/list`.

## How Go does it

A node type refers to itself through a **pointer**, `Next *Node`. The pointer's zero value, `nil`, marks both the end of the list and the empty list. `&Node{...}` allocates a node and gives you its address. Go's escape analysis places it on the heap when needed, and the garbage collector frees nodes that become unreachable, so there is no `free`.

Inserting after a known node is a single rewiring:

```go
func insertAfter(n *Node, v int) {
	n.Next = &Node{Val: v, Next: n.Next}
}
```

Because a function receives the head pointer **by value**, anything that may change the head returns the new one. Here is a recursive delete of the first match:

```go
func remove(head *Node, v int) *Node {
	if head == nil {
		return nil
	}
	if head.Val == v {
		return head.Next
	}
	head.Next = remove(head.Next, v)
	return head
}
```

The caller writes `head = remove(head, 7)`, and that one line covers every case: an empty list, a match at the head, or a match deeper down.

## What is special or tricky

- **`nil` dereference.** Reading `head.Val` on an empty list, or `n.Next.Val` at the last node, crashes with `panic: runtime error: invalid memory address or nil pointer dereference`. Check for `nil` before you follow a pointer.
- **A struct cannot contain itself by value.** Writing `Next Node` is a compile error ("invalid recursive type"). It must be `*Node`.
- **Reassigning a parameter does not affect the caller.** Setting `head = ...` inside a function changes only the local copy. Return the new head, or use a wrapper struct with a pointer receiver.
- **Order of rewiring matters.** If you overwrite `n.Next` before saving the old value, the rest of the list becomes unreachable. A composite literal like the one above reads the old pointer before replacing it.
- Methods with pointer receivers may be called on a `nil` pointer. That is legal Go, and a method can treat `nil` as "empty list".

## What you will practise

You will build a list by pushing to the front, pop the head, and count nodes by walking to `nil`. The challenge uses the list's front-insertion behaviour to transform a slice.
'''
