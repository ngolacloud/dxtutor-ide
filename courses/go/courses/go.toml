concepts = '''
## The idea

A **hash table** is an associative array: it maps **keys** to **values**. A **hash function** turns each key into a number that selects a bucket. Lookups, inserts and deletes then touch one bucket instead of scanning everything. That makes them **O(1) on average**. In the worst case, when many keys collide in one bucket, they degrade to O(n), but good hash functions make that rare. The price is memory and the loss of any meaningful **order**.

Several classic techniques rest on this:

- **Frequency counting** (a histogram): key = item, value = how many times it was seen.
- **Sets**: only the keys matter. They answer "have I seen this?" and drop duplicates.
- **Indexing what you have seen**: remembering earlier elements by value lets you answer later questions in O(1). This is the general trade of memory for time that turns many O(n²) searches into O(n).

## How Go does it

Go's built-in `map[K]V` is a hash table. Create one with `make(map[K]V)` or a literal. Reading a missing key returns the value type's **zero value**. The comma-ok form `v, ok := m[k]` tells "absent" apart from "present but zero". You also get `delete(m, k)` and `len(m)`, and `range` yields key and value pairs.

A set is `map[T]struct{}`, because the empty struct takes zero bytes. Here is the intersection of two sets:

```go
a := map[string]struct{}{"go": {}, "rust": {}, "zig": {}}
b := map[string]struct{}{"rust": {}, "zig": {}, "c": {}}
common := map[string]struct{}{}
for k := range a {
	if _, ok := b[k]; ok {
		common[k] = struct{}{}
	}
}
fmt.Println(len(common)) // 2
```

`map[T]bool` also works and reads nicely (`if seen[x]`), at the cost of a byte per entry.

Keys must be **comparable**: numbers, strings, pointers, arrays, and structs whose fields are all comparable. A small struct makes a good composite key:

```go
type point struct{ x, y int }

visited := map[point]bool{}
visited[point{1, 2}] = true
fmt.Println(visited[point{1, 2}], visited[point{0, 0}]) // true false
```

## What is special or tricky

- **A `nil` map can be read but not written.** `var m map[string]int` followed by `m["a"] = 1` panics with `assignment to entry in nil map`. Initialise with `make` or `{}`.
- **Slices, maps and functions cannot be keys.** `map[[]int]bool` is a compile error ("invalid map key type"). Use an array such as `[2]int`, a struct, or a string instead.
- **Iteration order is randomised on purpose.** For reproducible output, collect the keys, sort them (`sort.Strings`, `sort.Ints`), then iterate.
- **Maps behave like references.** Passing a map to a function lets the function modify the caller's map, with no pointer needed.
- **Map elements are not addressable.** `&m[k]` does not compile, and neither does assigning to a field of a struct stored in a map, `m[k].f = 1`. Read the value, modify it, and store it back.
- Deleting keys while ranging over the same map is allowed. Concurrent writes from several goroutines are not: they crash with `fatal error: concurrent map writes`.

## What you will practise

You will count word frequencies with sorted output, remove duplicates with a set, and test membership with comma-ok. The challenge asks you to use a map as a memory of earlier values, turning a quadratic search into a single pass.
'''
