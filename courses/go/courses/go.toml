[unit.step.gabarito]
time = "O(n log n) average"
space = "O(n)"
solution = '''
package student

type Node struct {
	Val   int
	Left  *Node
	Right *Node
}

func insert(root *Node, v int) *Node {
	if root == nil {
		return &Node{Val: v}
	}
	if v < root.Val {
		root.Left = insert(root.Left, v)
	} else if v > root.Val {
		root.Right = insert(root.Right, v)
	}
	return root
}

func inorder(root *Node, out *[]int) {
	if root == nil {
		return
	}
	inorder(root.Left, out)
	*out = append(*out, root.Val)
	inorder(root.Right, out)
}

func SortedFromInserts(items []int) []int {
	var root *Node
	for _, v := range items {
		root = insert(root, v)
	}
	out := []int{}
	inorder(root, &out)
	return out
}
'''
justification = """
Each insert costs the tree's height — **O(log n)** on average over `n` items, so building is
**O(n log n)**; the traversal is O(n). Space is **O(n)** for the nodes. Insert ignores a value
equal to the current node, so duplicates never enter the tree, and in-order traversal of a BST
is sorted — giving distinct, ascending output. `out` starts as `[]int{}` so an empty input
returns a non-nil empty slice.
"""

[[unit]]
id = "u19-sorting-searching"
concepts = '''
## The idea

**Searching** an unsorted sequence means checking every element: **linear search**, O(n). Sorting first makes **binary search** possible: compare with the middle element and discard the half that cannot contain the target. That costs **O(log n)**, so a million elements take about 20 comparisons. Its correctness rests on a **loop invariant**: if the target is present, it lies within the current range `[lo, hi]`.

**Sorting** algorithms differ in time, extra space and stability:

- **Insertion sort** grows a sorted prefix, sliding each new element into place. It is O(n²) in the worst case but O(n) on nearly sorted input, works **in place**, and is excellent for small slices.
- **Merge sort** is **divide and conquer**: split in half, sort each half recursively, then merge the two sorted halves in linear time. Its recurrence, T(n) = 2T(n/2) + O(n), solves to **O(n log n)** in every case. It needs O(n) extra space.
- A sort is **stable** if equal elements keep their original relative order. Stability matters when you sort records by one field after another.

No comparison-based sort can beat O(n log n) in the worst case, so merge sort is asymptotically optimal.

## How Go does it

Slicing makes "split in half" cheap. `v[:mid]` and `v[mid:]` are new headers over the **same** backing array: O(1), with nothing copied. That is both the power and the danger:

```go
v := []int{1, 2, 3, 4}
left := v[:2]
left = append(left, 99) // fits in v's spare capacity...
fmt.Println(v)          // [1 2 99 4]: v was overwritten
```

When a function must leave its input untouched, make a real copy (`copy` into a fresh `make`, or `slices.Clone` from Go 1.21) before writing.

In production code you rarely write sorts by hand. The standard library has `sort.Ints`, `sort.Slice(v, less)` and, since Go 1.21, the generic `slices` package:

```go
names := []string{"eva", "ana", "rui"}
slices.Sort(names) // [ana eva rui]
i, found := slices.BinarySearch(names, "eva")
fmt.Println(i, found) // 1 true
```

`slices.Sort` is not guaranteed stable. Use `slices.SortStableFunc` or `sort.SliceStable` when order among equal elements matters. Writing the algorithms yourself is still how you learn the invariants they rely on.

## What is special or tricky

- **Off-by-one errors.** Pick one convention and stick to it: closed `[lo, hi]` with `hi = len(v)-1` and `lo <= hi`, or half-open `[lo, hi)` with `hi = len(v)` and `lo < hi`. Mixing them skips elements or loops forever.
- **Midpoint overflow.** With huge indices, `(lo + hi) / 2` can overflow. `lo + (hi-lo)/2` cannot.
- **Binary search on unsorted data** does not fail loudly. It just returns wrong answers.
- **Every recursion needs a base case.** Without one, merge sort recurses until `fatal error: stack overflow`.
- **`<` versus `<=` decides stability** when merging: on ties, taking from the left half keeps equal elements in order.
- Sorting in place mutates the caller's slice, because the caller and the function share the backing array.

## What you will practise

You will binary-search a sorted slice, merge two sorted slices, and insertion-sort in place. The challenge asks you to build a full divide-and-conquer sort without the `sort` package, keeping the input untouched.
'''
title = "Sorting & searching by hand"
difficulty = 19
