[unit.step.gabarito]
time = "O(n)"
space = "O(n)"
solution = '''
package student

func TwoSum(nums []int, target int) (int, int, bool) {
	seen := map[int]int{}
	for j, v := range nums {
		if i, ok := seen[target-v]; ok {
			return i, j, true
		}
		if _, ok := seen[v]; !ok {
			seen[v] = j
		}
	}
	return 0, 0, false
}
'''
justification = """
One pass over `nums` (**O(n)**) with a map holding at most one index per value (**O(n)**
space). For each `v` at index `j`, the complement `target - v` is looked up in O(1); if it was
seen earlier its stored index is smaller than `j`, so returning `(i, j)` gives the smaller
index first. Storing only the first occurrence of each value keeps `i` minimal. Finding the
complement before inserting `v` prevents using one element twice.
"""

[[unit]]
id = "u18-binary-search-tree"
concepts = '''
## The idea

A **tree** is a hierarchical structure. A **root** node has children, those children have their own children, and nodes with no children are **leaves**. In a **binary tree**, every node has at most two children, left and right.

A **binary search tree** (BST) adds an **ordering invariant**: for every node, *all* values in its left subtree are smaller and *all* values in its right subtree are larger. The rule applies to whole subtrees, not just immediate children. Because of it, each comparison discards one subtree, just as binary search discards half a sorted array.

The cost of search and insert is **O(h)**, where *h* is the tree's **height**:

- **Balanced**: h is about log₂ n, so a million values need roughly 20 steps.
- **Degenerate**: inserting already sorted data builds a chain where every node has only a right child. Then h = n, and the tree is no faster than a linked list. Self-balancing trees (AVL, red-black) restructure themselves to guarantee O(log n).

The three depth-first **traversals** differ only in when the node itself is visited:

- **in-order** (left, node, right) produces values in sorted order;
- **pre-order** (node first) suits copying or serialising a tree;
- **post-order** (node last) suits computing sizes or heights from the children up.

A hash map beats a BST for plain lookups. A BST wins when you need **order**: minimum, maximum, sorted iteration, or every value within a range.

## How Go does it

A node holds two `*Node` pointers. `nil` means "empty subtree", so an empty tree is just a `nil` root. Recursion follows the shape of the data directly. Searching does not need recursion, though. A loop that moves a pointer down the tree is enough, and a `switch` with no condition keeps the three-way comparison readable:

```go
func contains(root *Node, v int) bool {
	for root != nil {
		switch {
		case v < root.Val:
			root = root.Left
		case v > root.Val:
			root = root.Right
		default:
			return true
		}
	}
	return false
}
```

Height is the natural post-order computation. The built-in `max` exists since Go 1.21:

```go
func height(root *Node) int {
	if root == nil {
		return 0
	}
	return 1 + max(height(root.Left), height(root.Right))
}
```

To gather values during a traversal, either pass a `*[]int` (as the drills do) or return the grown slice from each call. A plain `[]int` parameter would lose the elements that `append` adds after it reallocates.

## What is special or tricky

- **Pointer parameters are copies.** An `insert` that only assigns `root = &Node{...}` changes its local variable, and the caller's tree stays empty. That is why insert returns the subtree root, and the caller writes `root.Left = insert(root.Left, v)`. Forgetting that assignment silently drops the new node.
- **Decide your duplicate policy.** Send equal values right, count them, or ignore them. Inconsistent choices break the invariant or the expected output.
- Reading `root.Left.Val` when the left child is missing crashes with a `nil pointer dereference`. Check before you descend.
- Checking only parent against child does not prove a tree is a valid BST. The invariant is about whole subtrees.
- Go stacks grow on demand, so deep recursion on a degenerate tree is usually fine. Unbounded recursion still ends in `fatal error: stack overflow`.

## What you will practise

You will build a tree by hand, insert recursively, and read it back with an in-order walk. The challenge combines insertion and traversal into a small sorting tool.
'''
title = "Binary search trees"
difficulty = 18
