package student

import "sync"

func ParallelCount(nums []int) int {
	const workers = 4
	jobs := make(chan int)
	results := make(chan int)
	var wg sync.WaitGroup
	wg.Add(workers)
	for w := 0; w < workers; w++ {
		go func() {
			defer wg.Done()
			for n := range jobs {
				if n%2 == 0 {
					results <- 1
				} else {
					results <- 0
				}
			}
		}()
	}
	go func() {
		for _, n := range nums {
			jobs <- n
		}
		close(jobs)
	}()
	go func() {
		wg.Wait()
		close(results)
	}()
	total := 0
	for r := range results {
		total += r
	}
	return total
}
