name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dxt
        run: cargo install --git https://github.com/ngolacloud/dxtutor-ide tutor-cli --locked
      - name: Validate the plugin
        run: dxt plugin validate . --strict
