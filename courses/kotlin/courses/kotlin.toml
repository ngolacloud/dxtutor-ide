fun sumAll(vararg numbers: Int): Int {
    var total = 0
    for (n in numbers) total += n
    return total
}

fun factorial(n: Int): Long = if (n <= 1) 1L else n * factorial(n - 1)

fun report(name: String, vararg scores: Int): String {
    fun average(): Double = if (scores.isEmpty()) 0.0 else sumAll(*scores).toDouble() / scores.size
    return "$name: ${scores.size} scores, average ${average()}"
}

fun main() {
    println(sumAll())
    println(sumAll(1, 2, 3))
    println(sumAll(10, 20, 30, 40))
    println(factorial(5))
    println(factorial(20))
    println(report("Ada", 90, 85, 77))
