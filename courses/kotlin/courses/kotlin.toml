}
'''
tests = '''
test("ordinary leap years") {
    expect(isLeapYear(2024), "2024 is a leap year")
    expect(isLeapYear(1996), "1996 is a leap year")
}
test("ordinary common years") {
    expect(!isLeapYear(2023), "2023 is not a leap year")
    expect(!isLeapYear(2019), "2019 is not a leap year")
}
test("centuries are not leap years") {
    expect(!isLeapYear(1900), "1900 is not a leap year")
    expect(!isLeapYear(2100), "2100 is not a leap year")
}
test("every 400 years is a leap year") {
    expect(isLeapYear(2000), "2000 is a leap year")
    expect(isLeapYear(1600), "1600 is a leap year")
    expect(isLeapYear(0), "year 0 is a leap year")
}
test("every month of 2023") {
    val lengths = listOf(31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31)
    for (month in 1..12) equal(daysInMonth(2023, month), lengths[month - 1])
}
