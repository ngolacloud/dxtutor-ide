the last node's value (`blue`). Two details carry the lesson. The empty case: the first append
must set `head` as well as `tail`, or the walk would start from `null` and find nothing. And
`val last = tail`: writing `if (tail == null) … else tail.next = node` does not compile,
because `tail` is a mutable property and the compiler refuses to smart-cast it.
'''

