[unit.step.gabarito]
solution = '''
data class SortResult(val sorted: List<Int>, val inversions: Long)

fun sortAndCount(items: List<Int>): SortResult {
    val a = items.toIntArray()
    val buffer = IntArray(a.size)
    val inversions = sortRange(a, buffer, 0, a.size)
    return SortResult(a.toList(), inversions)
}

// Sorts a[lo until hi] in place and returns the inversions inside that range.
private fun sortRange(a: IntArray, buffer: IntArray, lo: Int, hi: Int): Long {
    if (hi - lo <= 1) return 0L
    val mid = (lo + hi) ushr 1
    var count = sortRange(a, buffer, lo, mid) + sortRange(a, buffer, mid, hi)
    var i = lo
    var j = mid
    var k = lo
    while (i < mid && j < hi) {
        if (a[i] <= a[j]) {
            buffer[k++] = a[i++]
        } else {
            // a[j] is smaller than a[i] and every item after it in the left half.
            count += mid - i
            buffer[k++] = a[j++]
        }
    }
    while (i < mid) buffer[k++] = a[i++]
    while (j < hi) buffer[k++] = a[j++]
    buffer.copyInto(a, destinationOffset = lo, startIndex = lo, endIndex = hi)
    return count
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
This is merge sort with one extra line. The recursion halves the range about log₂ n times, and
each level of the recursion merges n items in total, so the time is **O(n log n)** for random
and reversed input alike: under 2 million steps for 100,000 items, where a double loop over all
pairs would examine n(n−1)/2 ≈ 5·10⁹ of them.

The counting is correct because every inversion is of exactly one kind: both items in the left
half, both in the right half (counted by the recursive calls), or one in each. When the merge
takes `a[j]` from the right half because it is strictly smaller than `a[i]`, it is also
smaller than every remaining item of the left half, which is sorted. Each of those `mid - i`
items precedes `a[j]` in the original order, so each forms one inversion, and adding them in
one step keeps the merge linear. Using `<=` sends ties to the left, so equal items are never
counted. The total for a reversed list of 100,000 items is 4,999,950,000, beyond
`Int.MAX_VALUE` (about 2.1·10⁹), so the count is a `Long` throughout.

Space is **O(n)**: one working copy of the items and one merge buffer of the same size,
allocated once and reused by every merge, plus O(log n) stack frames for the recursion.
Working on `IntArray`s avoids boxing every number, and copying `items` first leaves the
caller's list untouched.
'''

[[unit]]
id = "kt-u34-recursion-dp"
title = "Recursion and dynamic programming"
level = "advanced"
difficulty = 34
intro = '''
A recursive function solves a problem by solving smaller copies of it, and dynamic
programming makes that fast when the same smaller copies keep coming back. You will recurse
over a nested structure, count the calls that a memo saves, fill a table bottom-up, and finish
with edit distance, the classic two-dimensional dynamic program.
'''
concepts = '''
## The idea

A **recursive** function calls itself on a smaller input. It needs a **base case** that
answers directly, and every call must make **progress** towards it. Recursion fits problems
whose data or definition is itself recursive: trees, nested lists, "the answer for n in terms
of the answer for n − 1".

Some recursive definitions solve the same subproblem many times. Naive Fibonacci computes
`fib(n − 2)` once for `fib(n)` and again inside `fib(n − 1)`, and the repetition compounds
until the number of calls grows like 1.6ⁿ. When subproblems **overlap** like this, **dynamic
programming** solves each one once:

- **Top-down (memoisation):** keep the recursion, but store each answer in a map the first
  time and return it from there afterwards.
- **Bottom-up (tabulation):** fill an array in an order where every entry's ingredients are
  already computed. No recursion at all.

The cost becomes *(number of distinct subproblems) × (work per subproblem)*.

## How Kotlin does it

A memo is a `HashMap`, and `getOrPut` reads or computes in one call:

```kotlin
val memo = HashMap<Int, Long>()
fun ways(n: Int): Long =
    if (n <= 1) 1L else memo.getOrPut(n) { ways(n - 1) + ways(n - 2) }
```

A table is an array: `LongArray(n + 1)` for one dimension, `Array(rows) { IntArray(cols) }`
for two. Kotlin also has **`tailrec`**: when the recursive call is the very last thing a
function does, the compiler turns it into a loop, so it cannot overflow the stack:

```kotlin
tailrec fun gcd(a: Int, b: Int): Int = if (b == 0) a else gcd(b, a % b)
```

`when` with `is` branches over a sealed type is the natural way to recurse over a recursive
data structure, and the compiler checks that every case is handled.

## What is special or tricky

- **Stack depth.** Each call uses a JVM stack frame. A few thousand levels is fine; hundreds of
  thousands throw `StackOverflowError`. Bottom-up tables, loops and `tailrec` avoid it.
- **`tailrec` must really be a tail call.** `1 + h(n - 1)` is not, because the addition
  happens after the call returns; the compiler warns *a function is marked as tail-recursive
  but no tail calls are found* and leaves the recursion in place.
- **Don't use `computeIfAbsent` recursively.** Java's `HashMap.computeIfAbsent` throws
  `ConcurrentModificationException` when the computation inserts into the same map. Kotlin's
  `getOrPut` is a plain get-then-put, so recursive memoisation with it is safe.
- **Overflow.** Path counts and Fibonacci numbers outgrow `Int` quickly. Use `Long` (and
  `0L`, `1L` literals) or `BigInteger`.

## What you will practise

You will sum a nested structure recursively, count the calls a memo saves, and count grid paths
with a table. The challenge is edit distance on strings of a few thousand characters, where
naive recursion would never finish.
'''

[[unit.step]]
kind = "concept"
id = "kt-u34-c1-recursion-memo"
title = "Base cases, overlap and the memo"
points = 5
difficulty = 34
intro = '''
A recursive definition is correct when every call reaches a base case. It is fast only when it
doesn't solve the same subproblem over and over, and that is exactly what a memo or a table
prevents.
'''
body = '''
## Base case and progress

```kotlin
fun sum(a: IntArray, i: Int = 0): Int =
    if (i == a.size) 0               // base case
    else a[i] + sum(a, i + 1)        // smaller problem: one element fewer
```

Every call moves `i` one step closer to `a.size`, so the recursion ends. Forget the base case
or the progress and the calls continue until `StackOverflowError`.

## Overlapping subproblems

```kotlin
fun fib(n: Int): Long = if (n < 2) n.toLong() else fib(n - 1) + fib(n - 2)
```

`fib(30)` makes about 2.7 million calls, yet there are only 31 different questions,
`fib(0)` to `fib(30)`. The same answers are recomputed again and again.

## Top-down: memoise

Store each answer the first time and look it up afterwards. Each `n` is computed once, so the
work drops to O(n):

```kotlin
val memo = HashMap<Int, Long>()
fun fastFib(n: Int): Long =
    if (n < 2) n.toLong() else memo.getOrPut(n) { fastFib(n - 1) + fastFib(n - 2) }
```

## Bottom-up: tabulate

Fill a table in an order where every entry's ingredients are ready. No recursion, so no stack
depth to worry about, and often you need only the last row or two:

```kotlin
val f = LongArray(n + 1)
if (n > 0) f[1] = 1
for (i in 2..n) f[i] = f[i - 1] + f[i - 2]
```

## The recipe

1. Define the subproblem precisely, for example "the answer for the first *i* items".
2. Write the recurrence: how an answer is built from smaller ones.
3. Identify the base cases.
4. Choose a fill order where everything a cell needs is already computed.
'''

