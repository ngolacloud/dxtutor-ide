  "...must delegate to the primary constructor with `this(...)`.",
  "Closes `User`.",
  "",
  "The entry point.",
  "All three arguments given. Prints `created Ada`.",
  "A named argument. `email` falls back to its default, `null`.",
  "Only the name. `age` and `email` use their defaults.",
  "A name and two numbers match only the secondary constructor, so the age is 2026 - 1990.",
  "Prints `ada@lovelace.org true`.",
  "Prints `tim@example.com false`.",
  "Prints `18 36`.",
  "Constructing an invalid user...",
  "...fails inside `init`, so no object is created.",
  "Catches the exception that `require` threw.",
  "Prints `rejected: name must not be blank`.",
