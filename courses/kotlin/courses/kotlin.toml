prompt = '''
Remove every 7 from the list 7 -> 1 -> 7 -> 2 -> 7 and print what is left.

**Why:** deletion is "make the previous node skip this one". A dummy node in front of the
head lets the same code delete the first node, a middle node, or the last node.
'''
target = '''
class Node(val value: Int, var next: Node? = null)

fun removeAll(head: Node?, target: Int): Node? {
    val dummy = Node(0, head)
    var prev = dummy
    while (true) {
        val next = prev.next ?: break
        if (next.value == target) {
            prev.next = next.next
        } else {
            prev = next
        }
    }
    return dummy.next
}

fun valuesOf(head: Node?): List<Int> {
    val out = mutableListOf<Int>()
    var node = head
    while (node != null) {
        out += node.value
        node = node.next
    }
    return out
}

fun main() {
    val head = removeAll(Node(7, Node(1, Node(7, Node(2, Node(7))))), 7)
    println(valuesOf(head))
}
'''
