[unit.step.gabarito]
solution = '''
import kotlin.reflect.KClass

class EventBus {
    private class Subscription(val type: KClass<*>, val deliver: (Any) -> Unit)

    private val subscriptions = mutableListOf<Subscription>()

    fun <E : Any> subscribe(type: KClass<E>, handler: (E) -> Unit): () -> Unit {
        @Suppress("UNCHECKED_CAST")
        val subscription = Subscription(type) { event -> handler(event as E) }
        subscriptions += subscription
        return { subscriptions.removeIf { it === subscription } }
    }

    fun publish(event: Any): Int {
        val matching = subscriptions.filter { it.type.isInstance(event) }
        matching.forEach { it.deliver(event) }
        return matching.size
    }
}

inline fun <reified E : Any> EventBus.on(noinline handler: (E) -> Unit): () -> Unit =
    subscribe(E::class, handler)
'''
time = "O(s) per publish"
space = "O(s)"
justification = '''
Let `s` be the number of subscriptions. `subscribe` appends to a list, **O(1)** amortised.
`publish` checks every subscription with `isInstance`, an O(1) class check, and collects the
matches, so it takes **O(s)** time plus the handlers' own work, and **O(s)** extra space for the
snapshot. Unsubscribing scans the list once, **O(s)**. The bus itself stores **O(s)** entries.

The interesting part is the types. Inside `subscribe` the handler has the type `(E) -> Unit`, but
one list cannot hold handlers of different `E`s under a single precise type, so each is wrapped
as `(Any) -> Unit` and stored next to its `KClass<E>`. The cast `event as E` is unchecked because
`E` is erased at run time; that is exactly why the `KClass` is kept, since `type.isInstance(event)`
performs the real check before the cast. `KClass` is the bridge from compile time to run time, and
`on<E>` builds it for the caller: being `inline` with a `reified` `E`, it sees the concrete class
at each call site. Filtering into a new list before delivering makes subscribing during a
`publish` safe; iterating the live list instead would throw `ConcurrentModificationException`. A
map from class to handlers would speed up exact matches, but it cannot answer "is this a subtype
of that" without walking the supertypes, and it would lose the global subscription order, so a
list is the simpler correct choice.
'''

[[unit]]
id = "kt-u19-sequences"
title = "Sequences: lazy pipelines"
level = "intermediate"
difficulty = 19
intro = '''
Collection operations such as `map` and `filter` are eager: each one builds a complete new list
before the next one starts. A `Sequence` is lazy: it pushes elements through the whole pipeline
one at a time and does only the work the final result needs. You will measure that difference,
generate infinite sequences, and build a pager that fetches data only on demand.
'''
concepts = '''
## The idea

Think of a chain like `orders.filter { … }.map { … }.first()`. With **eager** evaluation,
`filter` walks all the orders and builds a new list, `map` walks that list and builds another,
and only then does `first` take one element. With a million orders, two large intermediate lists
were built to answer a question about one. With **lazy** evaluation nothing happens until a result
is requested; then each element travels through `filter` and `map` before the next element is
even looked at, and the chain stops as soon as `first` is satisfied.

## How Kotlin does it

Collections (`List`, `Set`, `Map`) are eager. `Sequence<T>` offers the same operators, lazily.
You get one from `asSequence()`, `sequenceOf(…)`, `generateSequence`, `lineSequence()` or the
`sequence { }` builder.

```kotlin
val firstBig = (1..1_000_000).asSequence()
    .map { it * it }
    .first { it > 50 }          // squares only 8 numbers
```

The operators come in two kinds. **Intermediate** ones (`map`, `filter`, `take`, `onEach`,
`distinct`, …) return another `Sequence` and do no work yet. **Terminal** ones (`toList`, `first`,
`count`, `sum`, `forEach`, `groupBy`, …) pull elements through and produce a result. A sequence
without a terminal operation never runs at all.

Because work happens on demand, a sequence can be **infinite**:

```kotlin
val powers = generateSequence(1L) { it * 2 }      // 1, 2, 4, 8, … forever
val evens = sequence { var n = 0; while (true) { yield(n); n += 2 } }
```

`generateSequence(seed) { next }` ends when the function returns `null`. The `sequence { }`
builder uses `yield` and `yieldAll`; the block pauses at each `yield` until the consumer asks for
the next element.

Java's `Stream` is the closest relative, but a Java stream can be consumed only once, whereas most
Kotlin sequences can be iterated again, which re-runs the pipeline from the start.

## Pitfalls

- **Sequences are not automatically faster.** For a small list and one or two operations, an
  eager list is simpler and often quicker, since every lazy step adds an iterator call. Reach for
  a sequence when the data is large, the pipeline long, or the result short-circuits (`first`,
  `take`, `any`).
- **Side effects run at terminal time, and again on every iteration.** A `println` inside `map`
  prints when `toList` runs, not when `map` is called; iterate twice and it prints twice.
- **Infinite sequences need a limit.** `generateSequence(1) { it + 1 }.toList()` never ends and
  eventually dies with `OutOfMemoryError`. Put `take`, `takeWhile` or `first` before the end.
- Operations that need every element, such as `sorted()` or `groupBy`, consume the whole sequence
  before producing anything.

## What you will practise

You will count how often a mapping function runs on a list and on a sequence, build infinite
sequences with `generateSequence` and `sequence { }`, process a log lazily, and then write a pager
and an error scanner that touch only the data they need.
'''

[[unit.step]]
kind = "concept"
id = "kt-u19-c1-vertical"
title = "Horizontal versus vertical evaluation"
points = 5
difficulty = 19
intro = '''
An eager pipeline processes data stage by stage, while a lazy one processes it element by
element. Tracing the same small pipeline both ways shows where the savings come from.
'''
body = '''
## Eager: one stage at a time

A list pipeline runs **horizontally**: each operation processes *every* element and stores the
results in a new list before the next operation starts.

```kotlin
listOf(1, 2, 3, 4).map { it * 10 }.filter { it > 15 }.first()
// map:    1, 2, 3, 4       -> [10, 20, 30, 40]
// filter: 10, 20, 30, 40   -> [20, 30, 40]
// first:  20
```

Eight lambda calls and two intermediate lists, to answer with one number.

## Lazy: one element at a time

A sequence pipeline runs **vertically**: the terminal operation asks for one element, that element
passes through every stage, and only then is the next element requested.

```kotlin
listOf(1, 2, 3, 4).asSequence().map { it * 10 }.filter { it > 15 }.first()
// 1 -> map 10 -> filter rejects
// 2 -> map 20 -> filter accepts -> first returns 20, stop
```

Four lambda calls, no intermediate lists, and 3 and 4 are never touched.

## Why it matters

The saving grows with the input: a vertical pipeline over a million records that stops at the
tenth match reads only the records up to that match. Laziness also makes infinite sources possible,
because nothing ever asks for "all" the elements. The price is a small overhead per element and
per stage, so for short lists with no early exit, a plain list pipeline is perfectly fine.
'''

[[unit.step]]
kind = "drill"
id = "kt-u19-d1-count-the-work"
title = "Count the work: list versus sequence"
points = 10
difficulty = 19
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
The difference between eager and lazy evaluation is easiest to see by counting. A counter inside
`map` reveals how many elements each pipeline actually processed, and a trace of `filter` and
`map` calls shows the vertical, element-by-element order of a sequence.
'''
prompt = '''
Run the same `map` + `first` pipeline on a list and on a sequence, counting the `map` calls, then
trace the order of the `filter` and `map` calls in a sequence cut short by `take(2)`.

**Why:** counting calls is how you prove laziness in a test, and the trace is the mental model you
need to predict when your lambdas run.
'''
target = '''
fun main() {
    val ids = (1..10).toList()

    var eagerCalls = 0
    val eager = ids
        .map { eagerCalls++; it * it }
        .first { it > 10 }
    println("list: $eager after $eagerCalls map calls")

    var lazyCalls = 0
    val lazy = ids.asSequence()
        .map { lazyCalls++; it * it }
        .first { it > 10 }
    println("sequence: $lazy after $lazyCalls map calls")

