test("accented letters") { equal(displayName("élodie", "dupont"), "DUPONT, Élodie") }
test("masks a 16-digit card") { equal(maskCard("4111111111111111"), "************1111") }
test("one character to hide") { equal(maskCard("12345"), "*2345") }
test("short numbers stay as they are") {
    equal(maskCard("1234"), "1234")
    equal(maskCard("12"), "12")
    equal(maskCard(""), "")
}
test("keeps the length and the last four") {
    val masked = maskCard("5500 0000 0000 0004")
    equal(masked.length, 19)
    equal(masked, "***************0004")
}
'''

[unit.step.gabarito]
solution = '''
// Trim both parts and return "SURNAME, Firstname":
// surname all in capitals, first name with only its first letter in capitals.
fun displayName(first: String, last: String): String {
    val given = first.trim()
    val capitalised = given.take(1).uppercase() + given.drop(1).lowercase()
    return "${last.trim().uppercase()}, $capitalised"
}

// Replace every character except the last four with '*', keeping the length.
fun maskCard(number: String): String {
    return number.takeLast(4).padStart(number.length, '*')
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the total length of the input. Every operation used here (`trim`, `take`, `drop`,
`uppercase`, `lowercase`, `takeLast`, `padStart` and the template) walks over its input once
and copies characters into a new string, because strings are immutable. Each function chains
a fixed number of such passes, so the time is **O(n)**, and the strings it builds are at most
a constant number of copies of the input, so the space is **O(n)**.

The design choices make the edge cases disappear. `take(1)` and `drop(1)` return `""` on an
empty string instead of throwing, as `given[0]` would. For the mask, `takeLast(4)` keeps the
visible part (or the whole string when it is shorter), and `padStart(number.length, '*')`
fills exactly the hidden part with stars; when nothing needs hiding, the padding adds nothing.
'''

[[unit]]
id = "kt-u04-control-flow"
title = "if and when as expressions"
level = "basic"
difficulty = 4
intro = '''
Programs become interesting when they make decisions. This unit covers conditions and the
two decision tools Kotlin gives you, `if` and `when`, and the idea that makes them special in
Kotlin: both are **expressions** that produce a value, not just statements that choose which
code runs.
'''
concepts = '''
## The idea

A **condition** is an expression whose value is a `Boolean`: `true` or `false`. A program
uses conditions to choose between paths, which is called **control flow**. You build
conditions with comparison operators and combine them with logical operators:

- `==` and `!=` test equal and not equal (for strings they compare the contents);
- `<`, `<=`, `>` and `>=` compare order;
- `&&` (and), `||` (or) and `!` (not) combine or invert conditions.

`&&` and `||` **short-circuit**: in `a && b`, `b` is evaluated only if `a` is `true`, so
`count > 0 && total / count > 10` never divides by zero.

## How Kotlin does it: `if`

`if` runs a block when its condition is true, with an optional `else`. In Kotlin, `if` is
also an **expression**: it produces the value of the branch that ran. That is why Kotlin has
no `condition ? a : b` operator; you write:

```kotlin
val label = if (stock > 0) "available" else "sold out"
```

When a branch is a block in braces, its value is the value of its **last expression**.

## How Kotlin does it: `when`

`when` compares a value against several **branches** and runs the first one that matches. It
replaces Java's `switch`, without its fall-through and without `break`:

```kotlin
val kind = when (code) {
    200, 204 -> "ok"
    in 400..499 -> "client error"
    in 500..599 -> "server error"
    else -> "other"
}
```

A branch can list several values separated by commas, test membership in a **range** with
`in` or `!in`, or test a type with `is`. Without a subject, `when { ... }` evaluates each
branch's condition in order, a clean replacement for long `if`/`else if` chains:

```kotlin
val size = when {
    bytes < 1_000 -> "small"
    bytes < 1_000_000 -> "medium"
    else -> "large"
}
```

## What is special or tricky

- **An `if` used as a value needs an `else`.** `val m = if (a > 0) 1` fails with
  `'if' must have both main and 'else' branches when used as an expression.`
- **A `when` used as a value must be exhaustive.** Without an `else` the compiler reports
  `'when' expression must be exhaustive. Add an 'else' branch.` (In unit 13, sealed types and
  enums let the compiler check exhaustiveness without `else`.)
- **Order matters.** Branches are tried from the top, and the first match wins, so put
  specific cases before general ones: test `n % 15 == 0` before `n % 3 == 0`.
- **`=` is assignment, `==` is comparison.** Kotlin rejects `if (x = 5)` at compile time,
  because an assignment is not an expression.
- Prefer `val` plus an `if` or `when` expression over a `var` that is assigned in each
  branch. It is shorter, and the compiler proves that every path produces a value.

## What you will practise

You will use `if` both as a statement and as an expression, map values and ranges with
`when`, and replace an `if` chain with a subject-less `when`. The challenge asks you to
encode the Gregorian leap-year rule and the length of each month.
'''

[[unit.step]]
kind = "concept"
id = "kt-u04-c1-expressions"
title = "Decisions that produce values"
points = 5
difficulty = 4
intro = '''
In many languages a decision is a *statement*: it chooses what to do. In Kotlin, `if` and
`when` are *expressions*: they choose a value. Thinking in expressions removes temporary
variables and lets the compiler check that every path through the code produces a result.
'''
body = '''
## Statement or expression

```kotlin
fun main() {
    val hour = 14
    // As a statement: choose what to do.
    if (hour < 12) {
        println("Good morning")
    } else {
        println("Good afternoon")
    }
    // As an expression: choose a value.
    val period = if (hour < 12) "AM" else "PM"
    val meal = when (hour) {
        in 7..9 -> "breakfast"
        in 12..14 -> "lunch"
        in 19..21 -> "dinner"
        else -> "snack"
    }
    println("$hour h is $period, time for $meal")
}
```

Things to notice:

- **The statement form** runs one of two blocks; nothing is stored.
- **The expression form** gives `period` the value of whichever branch ran. Since `period`
  must always receive a value, the compiler insists on an `else`.
- **`when (hour)`** checks the branches from top to bottom; `in 12..14` matches when `hour` is
  between 12 and 14, both included. The first matching branch supplies the value, so this
  program prints `14 h is PM, time for lunch`.
- **`else`** catches everything the other branches did not.

## Why it matters

With expressions, each variable is assigned exactly once, where it is declared, so it can be
a `val`. The alternative (`var meal = ""` followed by assignments in every branch) is longer
and lets you forget a branch. When `if` or `when` is used as a value, forgetting a case is a
compile error instead of a silent bug.
'''

