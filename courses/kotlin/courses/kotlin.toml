[[unit.step]]
kind = "challenge"
id = "kt-u17-x1-import-orders"
title = "Import orders, report every bad line"
points = 30
difficulty = 17
entry = "parseOrder"
intro = '''
Importing a file written by people or by other systems means some lines will be wrong. A good
importer never crashes on the first bad line and never silently drops one: it parses each line
into a success or a described failure, keeps the good records, and reports the rest with line
numbers. `Result` models exactly that per-line outcome.
'''
instructions = '''
## Your turn

The starter provides two data classes:

```kotlin
data class Order(val id: String, val quantity: Int, val unitPriceCents: Long)

data class ImportReport(val orders: List<Order>, val errors: List<String>) {
    val totalCents: Long   // the sum of quantity * unitPriceCents
}
```

Implement two functions:

```kotlin
fun parseOrder(line: String): Result<Order>
fun importOrders(lines: List<String>): ImportReport
```

**`parseOrder`** reads a line of the form `id;quantity;unitPriceCents`, such as `A-17;3;1250`.
Split it on `;` and trim every field. It must **never throw**: every problem becomes a
`Result.failure` holding an `IllegalArgumentException` with exactly this message, checked in this
order:

| problem | message |
|---|---|
| not exactly 3 fields | `expected 3 fields, got N` |
| the id is empty | `blank id` |
| the quantity is not an `Int` | `bad quantity 'TEXT'` (the trimmed field) |
| the quantity is 0 or less | `quantity must be positive` |
| the price is not a `Long` | `bad price 'TEXT'` |
| the price is negative | `price must not be negative` |

A price of 0 is valid.

**`importOrders`** skips blank lines, parses the others, and returns the successful orders in
input order, plus one error per failed line formatted as `line N: message`, where `N` is the
1-based position in `lines` (blank lines count).

Examples:

- `parseOrder(" B-2 ; 10 ; 99 ")` → a success holding `Order("B-2", 10, 99)`
- `parseOrder("A;0;100").exceptionOrNull()?.message` → `"quantity must be positive"`
- `importOrders(listOf("A-1;2;500", "", "oops"))` → one order, and the errors
  `["line 3: expected 3 fields, got 1"]`

**Hint:** wrap the whole body of `parseOrder` in `runCatching { … }` and use `require` and
`requireNotNull` with message lambdas inside it. `toIntOrNull()` and `toLongOrNull()` return
`null` instead of throwing. In `importOrders`, `onSuccess` and `onFailure` route each result.

Hidden tests decide correctness.
'''
