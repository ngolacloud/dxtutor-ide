prompt = '''
Insert the keys 1 to 1023 in ascending order and in middle-first order, and print the height of
each tree.

**Why:** a BST is only as fast as it is short. Sorted input, a very common case, silently turns
O(log n) into O(n).
'''
target = '''
class Node(val key: Int) {
    var left: Node? = null
    var right: Node? = null
}

fun insert(root: Node?, key: Int): Node {
    val fresh = Node(key)
    if (root == null) return fresh
    var node: Node = root
    while (true) {
        val next = if (key < node.key) node.left else node.right
        if (next == null) {
            if (key < node.key) node.left = fresh else node.right = fresh
            return root
        }
        node = next
    }
}

fun height(node: Node?): Int =
    if (node == null) 0 else 1 + maxOf(height(node.left), height(node.right))

fun middleFirst(lo: Int, hi: Int, out: MutableList<Int>) {
    if (lo > hi) return
    val mid = (lo + hi) / 2
    out += mid
    middleFirst(lo, mid - 1, out)
    middleFirst(mid + 1, hi, out)
}

fun main() {
    var sorted: Node? = null
    for (k in 1..1023) sorted = insert(sorted, k)
    val order = mutableListOf<Int>()
    middleFirst(1, 1023, order)
    var balanced: Node? = null
    for (k in order) balanced = insert(balanced, k)
    println("sorted inserts: height ${height(sorted)}")
    println("middle-first inserts: height ${height(balanced)}")
}
