intro = '''
Recursive insertion mirrors the definition of a BST: an empty tree becomes a single node, and
any other tree sends the key to the left or right subtree. An in-order traversal then reads
the keys back in ascending order, whatever order they were inserted in.
'''
prompt = '''
Insert eight keys, one of them a duplicate, into a generic BST, then print the in-order
traversal and the top of the tree.

**Why:** "go left if smaller, right if larger" is the whole algorithm, and the in-order walk
proves the property holds everywhere.
'''
target = '''
class Node<T : Comparable<T>>(val key: T) {
    var left: Node<T>? = null
    var right: Node<T>? = null
}

fun <T : Comparable<T>> insert(root: Node<T>?, key: T): Node<T> {
    if (root == null) return Node(key)
    when {
        key < root.key -> root.left = insert(root.left, key)
        key > root.key -> root.right = insert(root.right, key)
    }
    return root
}

fun <T : Comparable<T>> inOrder(node: Node<T>?, out: MutableList<T>) {
    if (node == null) return
    inOrder(node.left, out)
    out += node.key
    inOrder(node.right, out)
}

fun main() {
    var root: Node<Int>? = null
    for (k in listOf(50, 30, 70, 20, 40, 60, 80, 30)) root = insert(root, k)
    val keys = mutableListOf<Int>()
    inOrder(root, keys)
    println(keys)
    println("root ${root?.key}, left ${root?.left?.key}, right ${root?.right?.key}")
}
'''
