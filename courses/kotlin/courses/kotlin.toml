[unit.step.gabarito]
solution = '''
import kotlinx.coroutines.flow.Flow
import kotlinx.coroutines.flow.flow

fun <T> Flow<T>.batched(size: Int): Flow<List<T>> {
    require(size >= 1) { "size must be at least 1, was $size" }
    return flow {
        var batch = ArrayList<T>(size)
        collect { value ->
            batch.add(value)
            if (batch.size == size) {
                emit(batch)
                batch = ArrayList(size)
            }
        }
        if (batch.isNotEmpty()) emit(batch)
    }
}
'''
time = "O(n)"
space = "O(size)"
justification = '''
Each of the `n` upstream values is appended to the current batch once, and each batch is
emitted once, so collecting the whole result costs **O(n)** time. The operator itself holds
only the batch being filled, at most `size` elements, so its extra space is **O(size)**; the
collector decides whether to keep the emitted lists (as `toList` does) or to process and drop
them.

The structure gives the other guarantees for free. `require` runs in the body of `batched`
itself, so a bad size fails immediately, while everything inside `flow { }` runs only when the
result is collected: laziness. The `batch` variable lives inside the builder, so every
collection gets a fresh one instead of sharing leftover values between runs. Emitting inside
the `collect` lambda delivers a batch the moment it fills up; when `take` has enough, that
`emit` call is where the cancellation arrives, so the source stops without producing another
value. Starting a new `ArrayList` after each emit, instead of calling `clear()`, keeps every
emitted list intact. If the source throws, the exception passes through `collect`, the final
`emit` is skipped, and the incomplete batch is dropped.
'''

[[unit]]
id = "kt-u25-channels"
title = "Channels: producers, consumers and worker pools"
level = "advanced"
difficulty = 25
intro = '''
A `Channel` is a queue that coroutines share: `send` suspends while the queue is full and
`receive` suspends while it is empty, so producers and consumers pace each other without locks.
You will pass values through a channel, chain `produce` stages into a pipeline, fan work out to
several workers and fan the results back in, and finish with a fixed-size worker pool that
returns its results in order.
'''
concepts = '''
## The idea

A flow describes a stream for one collector. Sometimes several coroutines must *communicate*:
one produces jobs, three process them, one gathers the results. Sharing a mutable list between
them would need locks. Go popularised another style, borrowed from Hoare's *Communicating
Sequential Processes*: **don't communicate by sharing memory; share memory by communicating.**
A **channel** is a concurrent queue with suspending ends, and each value sent into it is
received by exactly one coroutine.

## How Kotlin does it

```kotlin
val ch = Channel<Int>()              // rendezvous: no buffer at all
launch {
    for (i in 1..3) ch.send(i)       // suspends until someone receives
    ch.close()                       // no more values will come
}
for (x in ch) println(x)             // receives until closed and drained
```

- `send` suspends while the buffer is full; `receive` suspends while it is empty. That is
  **back-pressure** for free: a fast producer cannot run away from a slow consumer.
- The **capacity** chooses the buffer. `Channel()` is a *rendezvous* (sender and receiver must
  meet), `Channel(10)` buffers ten values, `Channel(Channel.UNLIMITED)` never suspends the
  sender, and `Channel(Channel.CONFLATED)` keeps only the latest value.
- `close()` is a signal, not a destruction: values already buffered are still delivered, then
  `for (x in ch)` ends. `receive` on a closed, empty channel throws
  `ClosedReceiveChannelException`, and `send` on a closed channel throws
  `ClosedSendChannelException`.
- `produce { send(x) }` launches a coroutine that owns a new channel, closes it when the block
  ends, and returns the receiving side as a `ReceiveChannel`. It is marked
  `@ExperimentalCoroutinesApi`, so code opts in with `@OptIn(ExperimentalCoroutinesApi::class)`.

Two patterns cover most uses. In a **fan-out**, several worker coroutines loop over the same
channel, and each value goes to whichever worker asks first, so the load balances itself. In a
**fan-in**, several coroutines send into one channel and a single consumer reads them all.
Workers finish in an unpredictable order, so tag each result with its index, or sort, when
order matters.

A channel resembles Java's `BlockingQueue`, except that a waiting coroutine suspends instead of
parking a whole thread.

## What is special or tricky

- **Forgetting `close()`** leaves the consumer's `for` loop waiting forever, so `runBlocking`
  never returns. With several producers, close the channel only after all of them have
  finished, for example after `joinAll()`.
- **A rendezvous channel used by a single coroutine hangs.** `ch.send(1)` followed by
  `ch.receive()` in the same coroutine suspends forever, because nobody else can receive.
- **Channels are hot.** Values sent before anyone listens wait in the buffer or hold up the
  sender, unlike a cold flow, which produces nothing until it is collected.
- **Cancelling the scope cancels producers and consumers alike**, and `produce` cancels its
  coroutine when the consumer cancels the channel, so stages don't leak.

## What you will practise

You will connect a producer and a consumer, chain two `produce` stages into a pipeline, and
fan jobs out to three workers whose results are fanned back in. The challenge asks you to build
a worker pool on channels: a fixed number of workers, every job processed exactly once, and the
results returned in input order.
'''

[[unit.step]]
kind = "concept"
id = "kt-u25-c1-channels"
title = "Channels as suspending queues"
points = 5
difficulty = 25
intro = '''
A channel is the coroutine version of a producer-consumer queue. Its two suspending operations
replace the locks and condition variables of classic thread code, and its capacity decides how
far a producer may run ahead of the consumers.
'''
body = '''
## Send, receive, close

```kotlin
val ch = Channel<String>(capacity = 2)
ch.send("a")              // fits in the buffer, no suspension
ch.send("b")              // buffer is now full
ch.close()                // the values already sent are still delivered
println(ch.receive())     // a
for (s in ch) println(s)  // b, then the loop ends
```

`send` suspends only when the buffer is full and `receive` only when it is empty. With the
default capacity of zero, a *rendezvous*, every `send` waits until a receiver takes the value
from it directly. That is the tightest coupling, and the one most likely to deadlock if a
single coroutine tries to do both sides.

## Every value goes to one receiver

A channel is a queue, not a broadcast. When three workers loop over the same channel, each
value is taken by exactly one of them, whichever is waiting first. That is why a channel
naturally distributes work, and why a hot broadcast to many listeners uses `SharedFlow`
instead.

## Closing is part of the protocol

A consumer cannot tell "no value yet" from "no value ever" unless the producer closes the
channel. The `for` loop over a channel ends only after `close()`, once the buffer is drained.
The rule of thumb is that the side that sends is the side that closes; `produce` does it for
you when its block finishes, even if the block fails.

## Pipelines

A function that takes a `ReceiveChannel` and returns another one is a pipeline stage. Stages
run concurrently, each one a coroutine, connected by channels:

```kotlin
numbers → squares → printer
```

Every stage processes one value while the next stage handles the previous one, like stations
on an assembly line.
'''

[[unit.step]]
kind = "drill"
