prompt = '''
Start three workers that read numbers from a `jobs` channel and send descriptions to a `results`
channel. Feed six numbers, close each channel at the right moment, and print the sorted results.

**Why:** fan-out and fan-in are the backbone of worker pools. Sorting makes the output
deterministic, because which worker handles which job depends on timing.
'''
target = '''
import kotlinx.coroutines.*
import kotlinx.coroutines.channels.Channel

fun main() = runBlocking {
    val jobs = Channel<Int>()
    val results = Channel<String>()

    val workers = List(3) {
        launch {
            for (n in jobs) {
                delay(n.toLong())
                results.send("$n squared is ${n * n}")
            }
        }
    }
    launch {
        for (n in 1..6) jobs.send(n)
        jobs.close()
    }
    launch {
        workers.joinAll()
        results.close()
    }

    val collected = mutableListOf<String>()
    for (line in results) collected += line
    collected.sorted().forEach(::println)
    println("${collected.size} results from ${workers.size} workers")
}
'''
