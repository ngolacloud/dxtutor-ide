instructions = '''
## Your turn

The starter provides a data class with mutable properties and safe defaults:

```kotlin
data class ConnectionSettings(
    var host: String = "localhost",
    var port: Int = 5432,
    var useTls: Boolean = false,
    var timeoutMs: Long = 5_000,
)
```

Implement:

```kotlin
fun settingsFrom(props: Map<String, String>, warnings: MutableList<String>): ConnectionSettings
```

Start from `ConnectionSettings()` and look at four keys of `props`. Trim every value before
checking it. A key that is absent changes nothing, and any other key is ignored (keys are
case-sensitive).

| key | valid when | on an invalid value, append to `warnings` |
|---|---|---|
| `host` | not blank after trimming | `host is blank` |
| `port` | a whole number in `1..65535` | `invalid port 'RAW'` |
| `tls` | `true` or `false`, ignoring case | `invalid tls 'RAW'` |
| `timeoutMs` | a whole number greater than 0 (it may exceed `Int.MAX_VALUE`) | `invalid timeoutMs 'RAW'` |

`RAW` is the value exactly as it appears in the map, before trimming. An invalid value keeps the
default. Check the keys in the order of the table, so the warnings are appended in that order,
after anything `warnings` already holds. Return a new object on every call.

Examples:

- `settingsFrom(mapOf("port" to " 6543 "), w)` → `ConnectionSettings(port = 6543)`, `w` unchanged
- `settingsFrom(mapOf("port" to "70000", "tls" to "yes"), w)` → the defaults, and `w` gains
  `invalid port '70000'` and `invalid tls 'yes'`
- `settingsFrom(mapOf("host" to "   "), w)` → the defaults, and `w` gains `host is blank`

**Hint:** `ConnectionSettings().apply { … }` lets you assign `port = …` directly. Inside it,
`props["port"]?.let { raw -> … }` handles a present key, and
`toIntOrNull()?.takeIf { it in 1..65535 }` turns a bad number into `null`.

Hidden tests decide correctness.
