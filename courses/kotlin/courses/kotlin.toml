[unit.step.gabarito]
solution = '''
class SinglyLinkedList<T> : Iterable<T> {
    class Node<T>(val value: T, var next: Node<T>? = null)

    var head: Node<T>? = null
    var tail: Node<T>? = null
    var size: Int = 0

    fun addFirst(value: T) {
        val node = Node(value, head)
        head = node
        if (tail == null) tail = node
        size++
    }

    fun addLast(value: T) {
        val node = Node(value)
        val last = tail
        if (last == null) head = node else last.next = node
        tail = node
        size++
    }

    fun removeFirst(): T {
        val first = head ?: throw NoSuchElementException("the list is empty")
        head = first.next
        first.next = null
        if (head == null) tail = null
        size--
        return first.value
    }

    operator fun get(index: Int): T {
        if (index !in 0 until size) throw IndexOutOfBoundsException("index $index, size $size")
        var node = head
        repeat(index) { node = node?.next }
        return node!!.value // index < size, so the node exists
    }

    fun reverse() {
        var prev: Node<T>? = null
        var node = head
        tail = head
        while (node != null) {
            val following = node.next
            node.next = prev
            prev = node
            node = following
        }
        head = prev
    }

    override fun iterator(): Iterator<T> = object : Iterator<T> {
        private var node = head

        override fun hasNext(): Boolean = node != null

        override fun next(): T {
            val current = node ?: throw NoSuchElementException("no more values")
            node = current.next
            return current.value
        }
    }
}
'''
time = "O(1) for addFirst/addLast/removeFirst; O(n) for get, reverse and a full iteration"
space = "O(1) extra for every operation (O(n) for the nodes themselves)"
justification = '''
`addFirst`, `addLast` and `removeFirst` each create or unlink one node and rewire at most two
references (`head`/`tail` and one `next`), so they are **O(1)**. `addLast` is O(1) only
because `tail` is kept: without it, every append would walk the chain, and the million
appends in the tests would cost about 5·10¹¹ steps instead of 10⁶. `get(index)` must walk
`index` nodes from the head, so it is **O(n)**; there is no arithmetic shortcut in a chain.

`reverse` visits each node exactly once and does a constant amount of work per node (save
`next`, flip it, advance two references), so it is **O(n)** time with **O(1)** extra space:
only `prev`, `node` and `following` are kept, whatever the length. The invariant makes it
correct: before each iteration `prev` heads the already-reversed prefix and `node` heads the
untouched suffix. Saving `node.next` first is essential, because flipping it would otherwise
cut off the suffix. When `node` reaches `null`, `prev` is the old last node, the new head, and
the old head (remembered in `tail`) already has `next == null`. A recursive version would also
be O(n) time, but it needs one stack frame per node and throws `StackOverflowError` long
before a million nodes. Copying the values into an array and rebuilding the list would break
the "reuse the nodes" contract and cost O(n) extra space.
'''

[[unit]]
id = "kt-u31-hash-maps"
title = "Hash tables, frequencies and sets"
level = "advanced"
difficulty = 31
intro = '''
A hash table turns a key into an array index, so finding a value takes O(1) on average
instead of a search. You will see how `hashCode()` and `mod` pick a bucket, build a small
chained map by hand, count frequencies and combine sets with the standard library, and finish
with a generic `HashTable<K, V>` that doubles its buckets as it fills.
'''
concepts = '''
## The idea

A **hash table** stores key/value pairs in an array of **buckets**. A **hash function** turns
each key into an integer, and that integer, reduced modulo the number of buckets, says which
bucket the key lives in. To find a key you hash it and look in one bucket, instead of
searching everything, so lookups, inserts and deletes take **O(1) on average**.

Different keys can land in the same bucket: a **collision**. The simplest fix is **separate
chaining**: each bucket holds a small list of entries, and you scan that list with `equals`.
The scans stay short only if the table is not too full. The **load factor**, entries divided
by buckets, is kept under a limit (Java's `HashMap` uses 0.75). When it is exceeded, the
table **resizes**: it allocates twice as many buckets and re-inserts every entry. A resize is
O(n), but it happens only after the size doubles, so inserts stay **O(1) amortised**.

## How Kotlin does it

Every object has `hashCode()` and `equals()`, inherited from `Any`. The contract: **equal
objects must have equal hash codes**. Strings and numbers follow it, and a `data class`
generates both from its properties, which is why data classes make good keys:

```kotlin
data class Point(val x: Int, val y: Int)
Point(1, 2) == Point(1, 2)                         // true
Point(1, 2).hashCode() == Point(1, 2).hashCode()   // true
```

The library tables are Java's: `hashMapOf()` gives a `HashMap`, while `mutableMapOf()` and
`mutableSetOf()` give a `LinkedHashMap`/`LinkedHashSet`, which also remember insertion order.
`map[key]` returns `V?`, `null` when the key is absent, and `getOrPut` and `getOrDefault`
cover the usual "insert if missing" patterns. `groupingBy { it }.eachCount()` counts
frequencies in one line, and sets have `union`, `intersect` and `subtract` as infix functions.

## What is special or tricky

- **Hash codes can be negative.** `-7 % 8` is `-7` in Kotlin, so `buckets[h % n]` throws
  `ArrayIndexOutOfBoundsException: Index -7 out of bounds for length 8`. Use `h.mod(n)`,
  which is always in `0 until n`.
- **Override both or neither.** A class that overrides `equals` but not `hashCode` puts equal
  keys in different buckets, and lookups silently miss. Prefer data classes.
- **Don't mutate a key.** A data class with a `var` changes its hash when the property changes,
  and the entry is stranded in its old bucket.
- **`map[key]` is nullable.** `counts[w] + 1` fails with *operator call is prohibited on a
  nullable receiver of type 'Int?'*. Write
  `(counts[w] ?: 0) + 1`, or `getValue` when absence is a bug.
- **Generic arrays need a class.** `Array<T>(n) { … }` inside a generic class fails with
  *cannot use 'T' as reified type parameter*. A `MutableList` of buckets avoids the problem.

## What you will practise

You will compute bucket indexes, write a tiny chained map, and count frequencies and combine
sets with the standard library. The challenge is a resizing `HashTable<K, V>` built from
scratch, tested on 100,000 keys and on keys that all collide.
'''

[[unit.step]]
kind = "concept"
id = "kt-u31-c1-buckets"
title = "Buckets, hashing and collisions"
points = 5
difficulty = 31
intro = '''
A hash table is an array plus a rule that turns any key into an index. Collisions are
inevitable, and how a table handles them, and how full it is allowed to get, decides whether
it stays O(1).
'''
body = '''
## From key to bucket

`hashCode()` turns a key into an `Int`, and `mod` folds it into the bucket range:

```kotlin
val index = key.hashCode().mod(buckets.size)
```

`mod` matters: hash codes can be negative, and `%` keeps the sign of its left operand, so a
negative remainder would be an invalid index. `"banana".hashCode()` is `-1396355227`;
`% 8` gives `-3`, while `.mod(8)` gives `5`.

## Chaining

Each bucket holds the entries whose keys landed there. Lookup hashes the key, picks one
bucket, and scans only that bucket, comparing keys with `==` (which calls `equals`):

```kotlin
val chain = buckets[key.hashCode().mod(buckets.size)]
val entry = chain.firstOrNull { it.key == key }
```

Two keys that are equal must produce the same hash code, or they land in different buckets
and the table cannot find them. That is the `equals`/`hashCode` contract, and data classes
honour it automatically.

## Load factor and resizing

With *n* entries in *m* buckets, an average chain has *n / m* entries. Keep that ratio under
a constant, say 0.75, and every chain stays short. When an insert pushes it over the limit,
allocate twice as many buckets and move every entry to its **new** bucket, because the index
depends on the bucket count. One resize is O(n), but the next one waits until the size has
doubled again, so the total cost of all resizes over *n* inserts is O(n): **O(1) amortised**
per insert.
'''

