intro = '''
`async` is `launch` with a result: it returns a `Deferred<T>`, a promise of a value. Two
`async` calls started back to back overlap their waiting, so the total time is roughly that
of the slowest one instead of the sum. A shared log makes the overlap visible.
'''
prompt = '''
Start two `async` price lookups with different delays, await both, and print the log of when
each one started and ended, followed by the total.

**Why:** "start all, then await all" is the core pattern of concurrent decomposition. The log
proves both lookups were waiting at the same time.
'''
target = '''
import kotlinx.coroutines.*

suspend fun price(item: String, ms: Long, log: MutableList<String>): Int {
    log += "$item start"
    delay(ms)
    log += "$item end"
    return item.length * 10
}

fun main() = runBlocking {
    val log = mutableListOf<String>()
    val apple = async { price("apple", 20, log) }
    val fig = async { price("fig", 5, log) }
    val total = apple.await() + fig.await()
    println(log)
    println("total = $total")
}
'''
