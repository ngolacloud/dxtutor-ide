prompt = '''
Declare three interfaces, two of which supply a default `move()`, implement them in `Duck` and
`Fish`, and walk a list of `Named` values using `is` checks and `filterIsInstance`.

**Why:** implementing several interfaces is how Kotlin models "can do this too", and
`super<Swimmer>.move()` shows how to resolve a clash between two inherited defaults.
