[[unit.step]]
kind = "challenge"
id = "kt-u20-x1-order-status"
title = "An order status state machine"
points = 30
difficulty = 20
entry = "OrderStatus"
intro = '''
Order processing is a state machine: an order may move from pending to paid, but never from
delivered back to pending. Modelling the states as an enum makes invalid states unrepresentable,
an exhaustive `when` encodes the legal transitions where the compiler can check them, and the
companion object is the natural home for turning user input into a state.
'''
instructions = '''
## Your turn

The starter declares the constants and their labels; keep them as they are:

```kotlin
enum class OrderStatus(val label: String) {
    PENDING("awaiting payment"), PAID("paid"), SHIPPED("in transit"),
    DELIVERED("delivered"), CANCELLED("cancelled");
    …
}
```

Implement these members:

```kotlin
val isFinal: Boolean
fun canMoveTo(next: OrderStatus): Boolean
fun moveTo(next: OrderStatus): OrderStatus

companion object {
    fun parse(text: String): OrderStatus?
    fun active(): List<OrderStatus>
}
```

Rules:

- **`isFinal`** is `true` for `DELIVERED` and `CANCELLED` only.
- **`canMoveTo(next)`** allows exactly these five transitions and nothing else, not even staying in
  the same state:

  | from | to |
  |---|---|
  | `PENDING` | `PAID` or `CANCELLED` |
  | `PAID` | `SHIPPED` or `CANCELLED` |
  | `SHIPPED` | `DELIVERED` |

- **`moveTo(next)`** returns `next` when the transition is allowed, and otherwise throws
  `IllegalStateException` with the message `cannot move from FROM to TO`, using the constant
  names, for example `cannot move from SHIPPED to PAID`.
- **`parse(text)`** trims `text` and returns the constant whose **name or label** matches it,
  ignoring case, or `null` when none does. `"In Transit"` and `"shipped"` both give `SHIPPED`.
- **`active()`** returns the statuses that are not final, in declaration order.

**Hint:** a `when (this)` with one branch per constant (several constants may share a branch,
separated by commas) makes `canMoveTo` exhaustive without an `else`. `check(cond) { message }`
throws `IllegalStateException`. Inside the companion, `entries` lists all the constants.

Hidden tests decide correctness.
'''
