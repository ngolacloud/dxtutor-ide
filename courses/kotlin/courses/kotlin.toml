[[unit.step]]
kind = "challenge"
id = "kt-u22-x1-fetch-all"
title = "Fetch every id once, concurrently"
points = 40
difficulty = 22
entry = "fetchAll"
intro = '''
Concurrent fetching is where coroutines earn their keep: twenty calls that each wait 20 ms
take about 20 ms together when they overlap, and 400 ms in a loop. Deduplicating requests
first is the other half of the job, because the cheapest call is the one you never make.
'''
instructions = '''
## Your turn

Implement `fetchAll`:

```kotlin
suspend fun fetchAll(ids: List<Int>, fetch: suspend (Int) -> String): Map<Int, String>
```

It returns a map from every id in `ids` to the result of `fetch(id)`.

Rules:

- Call `fetch` **exactly once per distinct id**, even when an id appears several times.
- Run the calls **concurrently**: start all of them before waiting for any. The hidden tests
  count how many calls are in flight at once.
- An empty list returns an empty map and calls `fetch` zero times.
- If a call throws, `fetchAll` must throw too (no `try`/`catch` needed: let it propagate).
- Ids can be any `Int`, including zero and negatives.

Examples:

- `fetchAll(listOf(1, 2)) { "user$it" }` returns `{1=user1, 2=user2}`.
- `fetchAll(listOf(7, 7, 7)) { "v$it" }` returns `{7=v7}` after one call.
- `fetchAll(emptyList()) { "x" }` returns `{}`.

**Hint:** inside a `suspend` function, open a scope with `coroutineScope { … }` so you can call
`async`. Remove duplicates first, start one `async` per id, then `awaitAll` and pair the ids
with their results.

Hidden tests decide correctness.
