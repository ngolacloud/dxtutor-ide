intro = '''
Combinators are higher-order functions that build new functions from old ones. Composition chains
transformations, a pipeline generalises it to any number of steps, and memoisation trades memory
for time by caching each result, the idea at the root of dynamic programming. All four of these
fit in a few lines once functions are values.
