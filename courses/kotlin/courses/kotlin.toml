// surrounding whitespace allowed), or null when it is missing or invalid.
fun parsePort(raw: String?): Int? {
    TODO("not implemented")
}

// Returns the first valid port among cli, then env, then default.
fun resolvePort(cli: String?, env: String?, default: Int): Int {
    TODO("not implemented")
}
'''
tests = '''
test("parses a plain port") {
    equal(parsePort("8080"), 8080)
    equal(parsePort("1"), 1)
    equal(parsePort("65535"), 65535)
}
test("ignores surrounding whitespace") {
    equal(parsePort("  443 "), 443)
    equal(parsePort("\t8080\n"), 8080)
}
test("null and blank input give null") {
    equal(parsePort(null), null)
    equal(parsePort(""), null)
    equal(parsePort("    "), null)
}
test("rejects text and decimals") {
    equal(parsePort("http"), null)
    equal(parsePort("80.5"), null)
    equal(parsePort("80 80"), null)
}
test("rejects ports out of range") {
    equal(parsePort("0"), null)
    equal(parsePort("-1"), null)
    equal(parsePort("65536"), null)
    equal(parsePort("99999999999"), null)
    equal(parsePort("9".repeat(1000)), null)
}
test("cli wins when it is valid") {
    equal(resolvePort("3000", "9000", 80), 3000)
    equal(resolvePort(" 3000 ", null, 80), 3000)
}
test("falls back to env, then to the default") {
    equal(resolvePort(null, "9000", 80), 9000)
    equal(resolvePort("abc", "9000", 80), 9000)
    equal(resolvePort(null, null, 80), 80)
    equal(resolvePort("0", "70000", 8080), 8080)
    equal(resolvePort("", "  ", 1), 1)
}
'''

[unit.step.gabarito]
solution = '''
fun parsePort(raw: String?): Int? {
    val n = raw?.trim()?.toIntOrNull() ?: return null
    return if (n in 1..65535) n else null
}

fun resolvePort(cli: String?, env: String?, default: Int): Int =
    parsePort(cli) ?: parsePort(env) ?: default
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the length of the longest input string. `trim()` scans the string once from each
end and copies the remaining characters into a new string, and `toIntOrNull()` reads each
digit once and stops at the first character that is not a digit, or as soon as the number
can no longer fit in an `Int`. The range check is O(1). So `parsePort` is **O(n)** in time
and **O(n)** in space, for the trimmed copy.

`resolvePort` calls `parsePort` at most twice. Elvis short-circuits, so `parsePort(env)` runs
only when the flag was missing or invalid. The total stays **O(n)** time and **O(n)** space.

The null-safe chain `raw?.trim()?.toIntOrNull() ?: return null` is what makes this short:
a missing input, a blank string and a non-number all collapse into the same `null`, which a
single Elvis handles. After that line, `n` is smart cast to a plain `Int`, and no `!!` is
ever needed.
'''

[[unit]]
id = "kt-u08-collections"
title = "Lists, sets and maps"
level = "intermediate"
difficulty = 8
intro = '''
Almost every program keeps groups of values: an ordered list of tasks, a set of tags, a map
from user ids to names. This unit introduces Kotlin's three core collections and the
distinction that shapes all of them: **read-only** interfaces versus **mutable** ones. The
challenge builds an index that maps each word to every position where it occurs.
'''
concepts = '''
## The idea

A **collection** holds many values behind one name. There are three shapes you will use every
day:

- A **list** keeps elements in order and allows duplicates. You reach an element by its index,
  from `0` to `size - 1`.
- A **set** keeps each element at most once. Its main job is a fast answer to "is this already
  here?".
- A **map** stores **key → value** pairs with unique keys, so you can look up a value by its
  key.

On the JVM these are the same `ArrayList`, `LinkedHashSet` and `LinkedHashMap` classes that
Java uses. What Kotlin adds is a cleaner set of types on top of them.

## How Kotlin does it

Every collection comes in two interfaces. `List<T>`, `Set<T>` and `Map<K, V>` are
**read-only**: they have `size`, `get`, `contains` and iteration, but no `add` or `remove`.
`MutableList<T>`, `MutableSet<T>` and `MutableMap<K, V>` extend them with the methods that
change the contents.

```kotlin
val days = listOf("Mon", "Tue")            // List<String>: read-only
val queue = mutableListOf("a", "b")        // MutableList<String>
queue.add("c")
val ages = mapOf("Ada" to 36, "Lin" to 29) // Map<String, Int>
println(ages["Ada"])                       // 36; a missing key gives null
```

`a to b` creates a pair, the building block of map literals. Indexing with `[]` works on lists
and maps alike. `map[key]` returns `V?`, because the key may be absent. Use
`getValue(key)` when absence is a bug, or `getOrDefault`/`getOrPut` when absence has a
meaning. Iterating a map gives entries, which you can destructure: `for ((k, v) in ages)`.

The `...Of` functions keep insertion order, so output is predictable. Builders create
collections from code: `List(5) { it * it }`, `buildList { add(1) }` and `buildMap { }`.

Unlike Java's `List.of`, a Kotlin read-only list is not guaranteed to be immutable.
**Read-only** means *you* cannot change it through this reference. Someone holding a
`MutableList` reference to the same object still can, and you will see the change. To get an
independent copy, call `toList()` or `toMutableList()`.

## Pitfalls and compiler errors

- `Unresolved reference 'add'`: you called `add` on a `List`, which is read-only. Declare it
  with `mutableListOf`.
- `val` does not freeze the contents. `val xs = mutableListOf(1)` can still be changed with
  `xs.add(2)`; only the reference is fixed.
- `list[10]` on a shorter list throws `IndexOutOfBoundsException`. `getOrNull(10)` returns
  `null` instead.
- `emptyList()` on its own fails with `Not enough information to infer type variable T`.
  Write `emptyList<String>()`, or give the variable a type.
- Changing a list while a `for` loop iterates over it throws
  `ConcurrentModificationException`.

## What you will practise

You will index, grow and shrink lists, deduplicate with sets, look up and update maps with
`getOrDefault` and `getOrPut`, and build collections with `List(n) { }` and `buildList`. The
challenge builds a word index with a map whose values are mutable lists.
'''

[[unit.step]]
kind = "concept"
id = "kt-u08-c1-read-only-vs-mutable"
title = "Read-only and mutable collections"
points = 5
difficulty = 8
intro = '''
An interface is a contract that describes what you may do with an object, not what the object
is. Kotlin gives each collection two contracts, one for reading and one for changing, so a
function's signature tells you whether it can modify what you pass in.
'''
body = '''
## Two views of the same data

```kotlin
val tasks: MutableList<String> = mutableListOf("write", "test")
val view: List<String> = tasks      // the same object, seen read-only

tasks.add("ship")
println(view)                       // [write, test, ship]
// view.add("oops")                 // error: Unresolved reference 'add'
```

`view` and `tasks` point to one `ArrayList`. The type of the reference decides which methods
you may call, not the object itself. That is why read-only and immutable are different words:
`view` cannot change the list, but it still sees every change made through `tasks`.

## Why this matters

Function signatures become documentation. `fun total(prices: List<Int>)` promises not to
modify your list. `fun fill(out: MutableList<Int>)` warns you that it will. When you return a
collection from a class, returning `List<T>` keeps callers from changing it behind your back.

## Choosing a collection

| Need | Use |
|---|---|
| order and duplicates | `listOf` / `mutableListOf` |
| uniqueness and fast `in` | `setOf` / `mutableSetOf` |
| lookup by key | `mapOf` / `mutableMapOf` |

Start read-only and switch to a mutable collection only where you really change things. A
common shape is to build with a mutable collection inside a function and return it typed as
read-only, so callers get a value they cannot change.
'''

