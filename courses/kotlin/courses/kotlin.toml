[unit.step.gabarito]
solution = '''
fun <A, B, C> compose(f: (B) -> C, g: (A) -> B): (A) -> C = { x -> f(g(x)) }

fun <T> pipeline(vararg steps: (T) -> T): (T) -> T {
    val chain = steps.toList()
    return { input -> chain.fold(input) { acc, step -> step(acc) } }
}

fun <T, R> memoize(f: (T) -> R): (T) -> R {
    val cache = HashMap<T, R>()
    return { x ->
        if (cache.containsKey(x)) {
            cache.getValue(x)
        } else {
            val result = f(x)
            cache[x] = result
            result
        }
    }
}

inline fun <T> countWhere(items: Iterable<T>, predicate: (T) -> Boolean): Int {
    var count = 0
    for (item in items) {
        if (predicate(item)) count++
    }
    return count
}
'''
time = "O(k)"
space = "O(d)"
justification = '''
`compose` only allocates one lambda, **O(1)**, and calling the result costs one call to `g` plus
one to `f`. `pipeline` copies its `k` steps once (O(k)) and each call of the result runs them in a
single `fold`: **O(k)** time per call. Folding over a list instead of nesting `compose` `k`
times matters for the 10,000-step test: nested compositions would recurse 10,000 frames deep on
every call, while the fold uses one frame and constant extra space.

`memoize` keeps a `HashMap` captured by the returned closure. A call does one `containsKey`
and at most one `get` and one `put`, each expected **O(1)** (plus hashing the argument), and
`f` runs only on the first call for each argument. With `d` distinct arguments the cache holds
`d` entries, so the space is **O(d)**. Checking `containsKey` rather than using `getOrPut` or
`cache[x] ?: ...` is what lets `null` results be cached: those shortcuts can't tell "stored
`null`" from "absent". Each `memoize` call creates its own map, so two memoised functions never
share a cache.

`countWhere` visits the `n` items once and calls the predicate once per item: **O(n)** time and
O(1) space. Because it is `inline`, the predicate lambda is pasted into the loop, so no function
object is allocated, the same reason the standard library's `count { }` is inline.
'''

# ── g4-prod ────────────────────────────────────────────────────────────

[[unit]]
id = "kt-u16-scope-functions"
title = "Scope functions: let, run, apply, also, with"
level = "intermediate"
difficulty = 16
intro = '''
Kotlin's five scope functions run a block of code in the context of one object, so configuring,
transforming or null-checking it reads as one compact expression. They differ in only two ways:
how the block refers to the object (`it` or `this`) and what the call returns. You will learn to
pick the right one on purpose, then use them to build a configuration object from untrusted text.
'''
concepts = '''
## The idea

Much everyday code does something *with one object* for a few lines: configure a freshly created
object, compute a value from it, log it on the way past, or act on it only if it is not null.
Repeating the variable name on every line is noisy, and a temporary variable that lives longer
than it needs to invites mistakes. A **scope function** takes an object and a lambda, runs the
lambda with the object in scope, and returns either the object or the lambda's result. It adds no
new capability; it makes the intent of a few lines visible at a glance.

## How Kotlin does it

There are five, and two questions tell them apart. *Inside the block, is the object `this` (a
receiver) or `it` (an argument)?* *Does the call return the object itself or the block's last
expression?*

| function | object is | returns | typical use |
|---|---|---|---|
| `let` | `it` | block result | null checks with `?.let`, transforming a value |
| `run` | `this` | block result | computing something from an object's members |
| `with(x)` | `this` | block result | the same, written as a plain function call |
| `apply` | `this` | the object | configuring a new object |
| `also` | `it` | the object | side effects: logging, validation |

```kotlin
val port = env["PORT"]?.let { it.toIntOrNull() } ?: 8080
val sb = StringBuilder().apply { append("a"); append("b") }
val user = loadUser().also { audit.add("loaded ${it.id}") }
```

`takeIf { predicate }` and `takeUnless` are close relatives: they return the object when the
predicate holds (or fails), and `null` otherwise, which chains naturally with `?.`.

Java has nothing built in for this; the nearest equivalents are builder classes and temporary
variables. In Kotlin these are ordinary `inline` functions from the standard library, so they cost
nothing at run time: the lambda's code is pasted into the caller.

## Pitfalls

- **Shadowed names.** Inside `apply`, an unqualified `name` means the object's property if it has
  one, even when a local `name` exists. Nested `let` blocks both call their parameter `it`; name
  them (`{ user -> … }`) instead.
- **Returning the wrong thing.** `mutableListOf(1).add(2)` gives a `Boolean`, while
  `mutableListOf(1).apply { add(2) }` gives the list. Using `let` where you meant `also` makes the
  block's `Unit` the result, and the compiler answers with *return type mismatch: expected
  'Request', actual 'Unit'*.
- **`?.let { } ?: x` is not an `if`/`else`.** The fallback also runs when the block itself returns
  `null`.
- **Don't nest them deeply.** Three scope functions in a row are usually harder to read than two
  plain `val`s.

## What you will practise

You will compare all five side by side, configure a request with `apply` and log it with `also`,
read optional settings with `?.let`, `run` and `takeIf`, and finally build a validated connection
configuration from a map of strings.
'''

[[unit.step]]
kind = "concept"
id = "kt-u16-c1-pick-one"
title = "Choosing a scope function"
points = 5
difficulty = 16
intro = '''
All five scope functions do the same basic thing: run a lambda with one object in scope. Two
questions, how the lambda refers to the object and what the call returns, are enough to choose
between them.
'''
body = '''
## Two questions decide

Every scope function runs a lambda with one object in scope. Ask:

1. **How do I refer to the object?** `run`, `with` and `apply` make it the receiver `this`, so you
   call its members directly: `apply { port = 8080 }`. `let` and `also` pass it as the argument
   `it`, which reads better when you hand it to another function: `also { log.add(it) }`.
2. **What do I get back?** `apply` and `also` return the object itself, so they slot into a chain
   without changing its type. `let`, `run` and `with` return the lambda's last expression.

```kotlin
val config = Config().apply { retries = 3 }      // Config
val doubled = config.let { it.retries * 2 }      // Int
val ok = config.run { retries > 0 }              // Boolean
config.also { println("using $it") }             // Config again
```

## A rule of thumb

- Creating and configuring an object? **`apply`**.
- Doing something extra without changing the value (log, check, add to a list)? **`also`**.
- Working with a value that may be null? **`?.let`**.
- Computing a result from an object's members? **`run`**, or **`with(obj)`** when the object is
  not nullable and you are not chaining.

When none of them makes the code clearer, a plain local `val` is the right answer.
'''

