prompt = '''
Write `Tag`, `Html` and `Ul` builder classes and an `html` entry function, then build a page
with a heading and a two-item list and print the rendered HTML.

**Why:** this is the design of kotlinx.html and of most Kotlin DSLs: the classes decide which
