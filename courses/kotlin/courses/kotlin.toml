[unit.step.gabarito]
solution = '''
// Total seconds in the duration; must not overflow for huge day counts.
fun totalSeconds(days: Int, hours: Int, minutes: Int, seconds: Int): Long {
    val secondsPerDay = 86_400L
    val secondsPerHour = 3_600L
    val secondsPerMinute = 60L
    return days * secondsPerDay + hours * secondsPerHour + minutes * secondsPerMinute + seconds
}

// The exact mean of a and b, keeping any .5.
fun average(a: Int, b: Int): Double {
    return (a.toDouble() + b) / 2
}

// Celsius to Fahrenheit: F = C * 9 / 5 + 32.
fun fahrenheit(celsius: Double): Double {
    return celsius * 9 / 5 + 32
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Each function performs a fixed handful of arithmetic operations, whatever the size of the
numbers, because `Int`, `Long` and `Double` have a fixed width; no loop and no allocation is
involved. So time and space are both **O(1)**.

The correctness argument is about types, not speed. In `totalSeconds`, the constants are
`Long`s (`86_400L`), so `days * secondsPerDay` is a `Long` multiplication and even
`Int.MAX_VALUE` days (about 1.9 × 10¹⁴ seconds) fits easily below `Long.MAX_VALUE`. Writing
`days * 86_400` would multiply two `Int`s and wrap around before the result ever became a
`Long`. In `average`, converting `a` to `Double` first makes the sum a `Double`, so
`Int.MAX_VALUE + Int.MAX_VALUE` cannot overflow and the division keeps its `.5`. A `Double`
represents every `Int` exactly, so the result is exact.
'''

[[unit]]
id = "kt-u03-strings"
title = "Strings and templates"
level = "basic"
difficulty = 3
intro = '''
Text is everywhere in software: names, messages, file paths, data read from the network.
This unit shows how Kotlin stores text in immutable `String`s, how **string templates**
put values straight into text, how raw strings keep multi-line text readable, and which
built-in operations you will reach for every day.
'''
concepts = '''
## The idea

A **string** is a sequence of characters. In Kotlin each character is a `Char`, and a
`String` is an ordered, numbered row of them, starting at **index 0**. Strings are
**immutable**: once created, a string never changes. Every operation that seems to modify
one, such as making it uppercase, actually builds and returns a *new* string and leaves the
original alone.

## How Kotlin does it

**Templates** put values into text without `+`. A `$` followed by a name inserts that
variable; `${...}` inserts the value of any expression:

```kotlin
val name = "Ada"
println("Hello, $name! Your name has ${name.length} letters.")
```

**Escapes** start with a backslash: `\n` is a newline, `\t` a tab, `\"` a double quote,
`\\` a backslash and `\$` a literal dollar sign.

**Raw strings** use three double quotes. They can span lines and treat backslashes
literally, which is ideal for file paths, regular expressions and blocks of text.
`trimIndent()` removes the common indentation, and `trimMargin()` strips everything up to a
`|` on each line:

```kotlin
val help = """
    Usage: tool [options]
      -v  verbose
""".trimIndent()
```

Everyday operations, all returning new values:

| Call | Result for `s = "Kotlin"` |
|---|---|
| `s.length` | `6` (a property: no parentheses) |
| `s[0]`, `s.last()` | `'K'`, `'n'` |
| `s.uppercase()`, `s.lowercase()` | `"KOTLIN"`, `"kotlin"` |
| `s.substring(1, 4)` | `"otl"` (start included, end excluded) |
| `s.take(3)`, `s.drop(3)`, `s.takeLast(2)` | `"Kot"`, `"lin"`, `"in"` |
| `s.indexOf("lin")` | `3` (or `-1` when absent) |
| `s.contains("ot")`, `s.startsWith("K")` | `true`, `true` |
| `s.padStart(8, '*')` | `"**Kotlin"` |

There are also `trim()`, `replace(old, new)`, `split(" ")`, `repeat(n)` and `reversed()`.

## Different from Java

In Kotlin, `==` compares the **contents** of two strings, so `a == b` is what you want. Java's
`==` compares object identity, a classic bug; Kotlin keeps identity for the rarely needed
`===`. Kotlin's `uppercase()` and `lowercase()` replace the older `toUpperCase()` and
`toLowerCase()`, which are deprecated.

## What is special or tricky

- **A template takes only a simple name after `$`.** `"$user.name"` inserts `user` followed
  by the text `.name`; write `"${user.name}"`. In a raw string, where `\$` does not work,
  write `${'$'}` for a literal dollar sign.
- **Indexes start at 0 and stop at `length - 1`.** `"abc"[3]` and `"abc".substring(2, 5)`
  throw `StringIndexOutOfBoundsException` when they run; `"".first()` throws
  `NoSuchElementException`. `take` and `takeLast` are forgiving: they never ask for more
  than the string has.
- **Calling a method does not change the string.** `s.trim()` on its own line does
  nothing useful; keep the result: `val clean = s.trim()`.

## What you will practise

You will build messages with templates and escapes, lay out text with raw strings, and chain
the common operations. The challenge asks you to format a customer's name and to mask a card
number, using only the built-in string functions.
'''

[[unit.step]]
kind = "concept"
id = "kt-u03-c1-strings"
title = "Strings, characters and templates"
points = 5
difficulty = 3
intro = '''
Underneath, a string is an array of characters with a length. Because Kotlin strings are
immutable, many parts of a program can share the same string safely, and every "change"
produces a new string instead. Templates are just a readable way of building such a new
string from pieces.
'''
body = '''
## Text with values inside

```kotlin
fun main() {
    val language = "Kotlin"
    val year = 2016
    println("$language 1.0 was released in $year.")
    println("That is ${2026 - year} years ago.")
    println("First letter: ${language[0]}, last: ${language.last()}")
    println(language.uppercase() + " " + language)
}
```

Things to notice:

- **`$language`** inserts the value of a variable directly into the text.
- **`${2026 - year}`** inserts the value of an *expression*; the braces mark where it
  starts and ends.
- **`language[0]`** reads the character at index 0, `'K'`. Indexes run from `0` to
  `length - 1`.
- **`language.uppercase()`** returns a new string, `"KOTLIN"`. The last `println` shows
  that `language` itself is unchanged, because strings are immutable.

## Calling functions on a value

Most string operations are written as `value.operation(arguments)`, for example
`name.padStart(10)` or `path.endsWith(".kt")`. These are **member functions**: functions that
belong to the type `String`. A few things, like `length`, are **properties** and are read
without parentheses. Because each call returns a new value, you can chain them:
`input.trim().lowercase().replace(" ", "-")` reads from left to right, one step at a time.
'''

