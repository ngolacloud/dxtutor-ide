entry = "Clamped"
intro = '''
Editor and application settings have ranges (a font size between 8 and 72) and usually need an
audit trail of what changed. Writing that logic in every setter duplicates it; a custom property
delegate writes it once and attaches it to any property with `by`. You will build such a delegate
and use it next to `Delegates.observable`.
'''
instructions = '''
## Your turn

Implement a reusable delegate and a settings class that uses it:

```kotlin
import kotlin.properties.ReadWriteProperty
import kotlin.reflect.KProperty

class Clamped(initial: Int, range: IntRange, log: MutableList<String>) : ReadWriteProperty<Any?, Int>

class EditorSettings {
    val history: MutableList<String>
    var theme: String
    var fontSize: Int
    var tabWidth: Int
}
```

**`Clamped`** stores one `Int`:

- `initial` must lie inside `range`; otherwise the constructor throws `IllegalArgumentException`.
- Reading returns the stored value.
- Writing first clamps the value into `range` (100 into `8..72` becomes 72, and -5 becomes 8). If
  the clamped value differs from the stored one, it stores it and appends `NAME: OLD -> NEW` to
  `log`, where `NAME` is the property's name. If it is equal, nothing is stored or logged.

**`EditorSettings`** starts with an empty `history`, and:

- `theme` is delegated to `Delegates.observable("light")` and appends `theme: OLD -> NEW` to
  `history` when the new theme differs from the old one;
- `fontSize` is delegated to `Clamped(14, 8..72, history)`;
- `tabWidth` is delegated to `Clamped(4, 1..8, history)`.

Example:

```kotlin
val s = EditorSettings()
s.fontSize = 100        // stored as 72
s.theme = "dark"
s.tabWidth = 4          // unchanged, so not recorded
s.history               // [fontSize: 14 -> 72, theme: light -> dark]
```

`Clamped` must work on any `Int` property, including a local variable:
`var volume: Int by Clamped(5, 0..10, log)` followed by `volume = 11` logs `volume: 5 -> 10`.

**Hint:** `value.coerceIn(range)` clamps, and `property.name` gives the name. In `EditorSettings`,
declare `history` before the delegated properties, because the delegates receive it when they are
created.

Hidden tests decide correctness.
'''
