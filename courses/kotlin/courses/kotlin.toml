[[unit.step]]
kind = "challenge"
id = "kt-u04-x1-calendar"
title = "Leap years and month lengths"
points = 20
difficulty = 4
entry = "daysInMonth"
intro = '''
The Gregorian calendar's leap-year rule is a classic exercise in ordered conditions: one
general rule with an exception, and an exception to the exception. Get the order wrong and
the year 1900 or 2000 comes out wrong. You will also meet `throw`, the way a function refuses
input that makes no sense.
'''
instructions = '''
## Your turn

Implement two functions:

```kotlin
fun isLeapYear(year: Int): Boolean
fun daysInMonth(year: Int, month: Int): Int
```

**`isLeapYear`** applies the Gregorian rule:

- a year divisible by 400 **is** a leap year;
- otherwise, a year divisible by 100 is **not**;
- otherwise, a year divisible by 4 **is**;
- every other year is not.

**`daysInMonth`** returns the number of days in `month` (1 = January, …, 12 = December) of
`year`. February has 29 days in a leap year and 28 otherwise; April, June, September and
November have 30; the rest have 31. When `month` is not between 1 and 12, the function must
**throw** an `IllegalArgumentException`:

```kotlin
throw IllegalArgumentException("month must be in 1..12, was $month")
```

`throw` is itself an expression, so it can be the result of a `when` branch.

Examples:

- `isLeapYear(2024)` → `true`, `isLeapYear(2023)` → `false`
- `isLeapYear(1900)` → `false`, `isLeapYear(2000)` → `true`
- `daysInMonth(2024, 2)` → `29`, `daysInMonth(2023, 2)` → `28`
- `daysInMonth(2023, 4)` → `30`, `daysInMonth(2023, 12)` → `31`
- `daysInMonth(2023, 13)` throws `IllegalArgumentException`

**Hint:** a subject-less `when` checks the leap-year conditions in exactly the order of the
rule. For the months, a `when (month)` with comma-separated values and a range keeps the
table short.

Hidden tests decide correctness.
'''
