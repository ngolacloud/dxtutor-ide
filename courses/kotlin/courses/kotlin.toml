[unit.step.gabarito]
solution = '''
import kotlinx.coroutines.channels.Channel
import kotlinx.coroutines.coroutineScope
import kotlinx.coroutines.joinAll
import kotlinx.coroutines.launch

suspend fun <T, R> workerPool(jobs: List<T>, workers: Int, work: suspend (T) -> R): List<R> {
    require(workers >= 1) { "workers must be at least 1, was $workers" }
    return coroutineScope {
        val queue = Channel<IndexedValue<T>>()
        val results = Channel<IndexedValue<R>>()
        launch {
            for (job in jobs.withIndex()) queue.send(job)
            queue.close()
        }
        val pool = List(workers) {
            launch {
                for ((index, job) in queue) results.send(IndexedValue(index, work(job)))
            }
        }
        launch {
            pool.joinAll()
            results.close()
        }
        val byIndex = HashMap<Int, R>(jobs.size)
        for ((index, value) in results) byIndex[index] = value
        List(jobs.size) { byIndex.getValue(it) }
    }
}
'''
time = "O(n + w)"
space = "O(n + w)"
justification = '''
With `n` jobs and `w` workers, every job passes through the jobs channel once, is processed
once, and its result passes through the results channel once; each channel operation is O(1),
so the bookkeeping is **O(n)**, plus **O(w)** to start and join the workers. The map of results
by index and the final list hold `n` entries, and each worker is a coroutine object, so the
space is **O(n + w)**. Neither channel buffers anything: they are rendezvous channels, so at any
moment at most `w` jobs are taken but unfinished.

Wall-clock time is where the pool matters: about `n / w` rounds of work when jobs take similar
time, because exactly `w` calls run at once. Fan-out balances the load automatically, since a
worker takes the next job only when it is free. Correctness hinges on the closing protocol: the
feeder closes `queue` after the last job, which ends every worker's loop, and `results` is
closed only after `joinAll()`, because it has `w` senders. Tagging each result with its index
makes the arrival order irrelevant, and `coroutineScope` turns one failing job into a cancelled
pool and a rethrown exception.
'''

