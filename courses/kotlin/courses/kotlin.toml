  "Starts the fast lookup before awaiting anything: now both run concurrently.",
  "Awaits both results; `await` suspends until each value is ready.",
  "Prints `[apple start, fig start, fig end, apple end]`.",
  "Prints `total = 80`.",
  "",
]
explanation = '''
Both lookups started before either finished: the log reads `apple start, fig start`, then
`fig end` after 5 ms and `apple end` after 20 ms, so the whole thing took about 20 ms instead
of 25. `apple.await()` was called first but simply waited for the slower result; the faster
one was already done when `fig.await()` ran. The total is 50 + 30 = 80. Had the code written
`async { … }.await()` on each line, the log would show `apple start, apple end, fig start,
fig end`: sequential work dressed up as concurrency.
'''

[[unit.step]]
kind = "drill"
id = "kt-u22-d3-await-all"
title = "awaitAll, Dispatchers.Default and ten thousand coroutines"
points = 10
difficulty = 22
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
Mapping a list to `async` blocks creates one coroutine per element; `awaitAll` gathers the
results in list order, whatever order they finished in. A **dispatcher** decides which threads
run a coroutine: `Dispatchers.Default` is a pool sized to the CPU cores, meant for computation.
'''
prompt = '''
Square four numbers concurrently with `async` and `awaitAll`, compute a large sum on
`Dispatchers.Default` with `withContext`, then launch ten thousand coroutines and join them.

**Why:** these are the three everyday moves: fan a list out to coroutines, move CPU-heavy work
off the current thread, and rely on coroutines being cheap enough to create by the thousand.
'''
target = '''
import kotlinx.coroutines.*

suspend fun square(n: Int): Int {
    delay(5L * (5 - n))
    return n * n
}

fun main() = runBlocking {
    val numbers = listOf(1, 2, 3, 4)
    val pending = numbers.map { n -> async { square(n) } }
    println(pending.awaitAll())

    val sum = withContext(Dispatchers.Default) {
        (1..1_000_000).sumOf { it.toLong() }
    }
    println("sum computed on Default: $sum")

    val jobs = List(10_000) { launch { delay(10) } }
    jobs.joinAll()
    println("${jobs.size} coroutines finished")
}
'''
