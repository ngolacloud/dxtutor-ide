tests = '''
test("paged walks the pages in order until the first empty one") {
    val pages = listOf(listOf(1, 2, 3), listOf(4, 5), listOf(6))
    equal(paged { p -> pages.getOrElse(p) { emptyList() } }.toList(), listOf(1, 2, 3, 4, 5, 6))
}
test("paged fetches nothing until the sequence is used") {
