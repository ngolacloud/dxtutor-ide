tests = '''
test("ranks by count and breaks ties alphabetically") {
    equal(topWords("the cat and the hat", 2), listOf("the" to 2, "and" to 1))
    equal(topWords("the cat and the hat", 4), listOf("the" to 2, "and" to 1, "cat" to 1, "hat" to 1))
