intro = '''
Sealed types can refer to themselves, which makes them the natural encoding of trees: a JSON
document is either a leaf (null, boolean, number, string) or a node that contains more JSON.
Functions over such trees follow the structure of the type, one branch per case and one recursive
call per child.
'''
prompt = '''
Declare a sealed `Json` with six alternatives, two of which contain more `Json`. Write a
recursive `render` and a `depth` function, then print a small document.

**Why:** recursion over a sealed tree is how compilers, serializers and UI frameworks walk their
data, and an exhaustive `when` makes sure no kind of node is forgotten.
'''
target = '''
sealed interface Json

data object JNull : Json
data class JBool(val value: Boolean) : Json
data class JNum(val value: Int) : Json
data class JStr(val value: String) : Json
data class JArr(val items: List<Json>) : Json
data class JObj(val fields: Map<String, Json>) : Json

fun render(j: Json): String = when (j) {
    JNull -> "null"
    is JBool -> j.value.toString()
    is JNum -> j.value.toString()
    is JStr -> "\"${j.value}\""
    is JArr -> j.items.joinToString(",", "[", "]") { render(it) }
    is JObj -> j.fields.entries.joinToString(",", "{", "}") { (k, v) -> "\"$k\":${render(v)}" }
}

fun depth(j: Json): Int = when (j) {
    is JArr -> 1 + (j.items.maxOfOrNull { depth(it) } ?: 0)
    is JObj -> 1 + (j.fields.values.maxOfOrNull { depth(it) } ?: 0)
    else -> 0
}

fun main() {
    val langs = JArr(listOf(JStr("kt"), JStr("go")))
    val doc = JObj(mapOf("name" to JStr("Ada"), "langs" to langs, "admin" to JBool(true), "boss" to JNull))
    println(render(doc))
    println("depth ${depth(doc)}")
}
