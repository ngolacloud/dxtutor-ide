    equal(daysInMonth(2024, 2), 29)
    equal(daysInMonth(1900, 2), 28)
    equal(daysInMonth(2000, 2), 29)
}
test("months in a leap year other than february") {
    equal(daysInMonth(2024, 1), 31)
    equal(daysInMonth(2024, 9), 30)
}
test("month 0 is rejected") { assertThrows<IllegalArgumentException> { daysInMonth(2024, 0) } }
