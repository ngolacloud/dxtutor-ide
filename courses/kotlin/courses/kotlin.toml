    var balanceCents: Long = initialCents
        private set

    // Successful deposits (+) and withdrawals (-), oldest first, as a snapshot.
    val transactions: List<Long>
        get() = TODO("not implemented")

    init {
        // TODO: reject a blank owner or a negative initial balance
    }

    // Adds a positive amount; throws IllegalArgumentException otherwise.
    fun deposit(cents: Long) {
        TODO("not implemented")
    }

    // Removes a positive amount if the balance allows it; returns whether it did.
    fun withdraw(cents: Long): Boolean {
        TODO("not implemented")
    }

    // Moves money to another account; returns false if the balance is too low.
    fun transferTo(other: BankAccount, cents: Long): Boolean {
        TODO("not implemented")
    }
}
'''
tests = '''
test("starts with the initial balance and no transactions") {
    val a = BankAccount("Ada", 1_000)
    equal(a.owner, "Ada")
    equal(a.balanceCents, 1_000L)
    equal(a.transactions, emptyList<Long>())
    equal(BankAccount("Lin").balanceCents, 0L)
}
test("rejects an invalid owner or initial balance") {
    assertThrows<IllegalArgumentException> { BankAccount("", 10) }
    assertThrows<IllegalArgumentException> { BankAccount("   ") }
    assertThrows<IllegalArgumentException> { BankAccount("Bob", -1) }
}
test("deposits and withdrawals update the balance and the history") {
    val a = BankAccount("Ada")
    a.deposit(500)
    equal(a.withdraw(200), true)
    a.deposit(1)
    equal(a.balanceCents, 301L)
    equal(a.transactions, listOf(500L, -200L, 1L))
}
test("a withdrawal larger than the balance changes nothing") {
    val a = BankAccount("Ada", 1_000)
    equal(a.withdraw(1_500), false)
    equal(a.balanceCents, 1_000L)
    equal(a.transactions, emptyList<Long>())
    equal(a.withdraw(1_000), true)
    equal(a.balanceCents, 0L)
}
test("amounts must be positive") {
    val a = BankAccount("Ada", 100)
    assertThrows<IllegalArgumentException> { a.deposit(0) }
    assertThrows<IllegalArgumentException> { a.deposit(-5) }
    assertThrows<IllegalArgumentException> { a.withdraw(0) }
    assertThrows<IllegalArgumentException> { a.withdraw(-5) }
    equal(a.balanceCents, 100L)
    equal(a.transactions, emptyList<Long>())
}
test("transfers move money between two accounts") {
    val a = BankAccount("Ada", 1_000)
    val b = BankAccount("Bob", 50)
    equal(a.transferTo(b, 400), true)
    equal(a.balanceCents, 600L)
    equal(b.balanceCents, 450L)
    equal(a.transactions, listOf(-400L))
    equal(b.transactions, listOf(400L))
    equal(b.transferTo(a, 451), false)
    equal(b.balanceCents, 450L)
    equal(a.balanceCents, 600L)
    equal(b.transactions, listOf(400L))
}
test("invalid transfers throw") {
    val a = BankAccount("Ada", 1_000)
    val b = BankAccount("Bob")
    assertThrows<IllegalArgumentException> { a.transferTo(a, 10) }
    assertThrows<IllegalArgumentException> { a.transferTo(b, 0) }
    equal(a.balanceCents, 1_000L)
    equal(b.balanceCents, 0L)
}
test("transactions is a snapshot") {
    val a = BankAccount("Ada")
    a.deposit(10)
    val first = a.transactions
    a.deposit(20)
    equal(first, listOf(10L))
    (a.transactions as? MutableList<Long>)?.clear()
    equal(a.transactions, listOf(10L, 20L))
}
test("many operations") {
    val a = BankAccount("Ada")
    for (i in 1..10_000) a.deposit(i.toLong())
    for (i in 1..10_000) a.withdraw(1)
    equal(a.balanceCents, 50_005_000L - 10_000L)
    equal(a.transactions.size, 20_000)
}
'''

[unit.step.gabarito]
solution = '''
class BankAccount(val owner: String, initialCents: Long = 0) {
    var balanceCents: Long = initialCents
        private set

    private val history = mutableListOf<Long>()

    val transactions: List<Long>
        get() = history.toList()

    init {
        require(owner.isNotBlank()) { "owner must not be blank" }
        require(initialCents >= 0) { "initial balance must not be negative" }
    }

    fun deposit(cents: Long) {
        require(cents > 0) { "deposit must be positive" }
        balanceCents += cents
        history.add(cents)
    }

    fun withdraw(cents: Long): Boolean {
        require(cents > 0) { "withdrawal must be positive" }
        if (cents > balanceCents) return false
        balanceCents -= cents
        history.add(-cents)
        return true
    }

    fun transferTo(other: BankAccount, cents: Long): Boolean {
        require(other !== this) { "cannot transfer to the same account" }
        if (!withdraw(cents)) return false
        other.deposit(cents)
        return true
    }
}
'''
time = "O(1) per operation, O(t) for transactions"
space = "O(t)"
justification = '''
Let `t` be the number of successful transactions so far.

- The constructor, `deposit`, `withdraw` and `transferTo` each do a constant number of
  comparisons and additions, plus at most one append to an `ArrayList` per account. An
  append is amortised O(1), because the array doubles when it fills up. So each operation is
  **O(1)** amortised.
- Reading `transactions` copies the history with `toList()`, which is **O(t)** time and
  O(t) extra space for the copy. That copy is the price of a real snapshot: returning
  `history` itself, typed as `List<Long>`, would be O(1), but a caller could cast it back to
  `MutableList` and clear it, which the hidden tests do.

The account stores one `Long` per transaction, so its memory is **O(t)**.

The invariants hold by construction. The balance starts non-negative, because `init`
checks it. Only `deposit` and `withdraw` change it, because of `private set`, and both reject
non-positive amounts. `withdraw` refuses to go below zero. `transferTo` reuses `withdraw`, so
it inherits that check, and calls `deposit` on the other account only after the withdrawal
has succeeded, so a failed transfer changes neither account. `other !== this` compares
identity, which is exactly what "the same account" means.
'''

[[unit]]
id = "kt-u11-data-classes"
title = "Data classes"
level = "intermediate"
difficulty = 11
intro = '''
Many classes exist only to hold values: a point, an order line, an API response. Kotlin's
`data class` asks the compiler to write their `equals`, `hashCode`, `toString`, `copy` and
destructuring functions for you. This unit shows what is generated, which rules it follows,
and where it can surprise you. The challenge merges duplicate lines of a shopping order.
'''
concepts = '''
## The idea

Some objects have an identity: two bank accounts with the same balance are still two
accounts. Others are pure **values**: two points `(1, 2)` are the same point, just as two
copies of the number 7 are the same number. Values should compare by content, print their
content, work as map keys, and be easy to copy with one field changed. In Java that means
writing `equals`, `hashCode` and `toString` by hand, or using a `record`.

## How Kotlin does it

Put `data` in front of a class, and the compiler generates the boilerplate from the
properties of the **primary constructor**:

```kotlin
data class Point(val x: Int, val y: Int)

val a = Point(1, 2)
println(a)                    // Point(x=1, y=2)
println(a == Point(1, 2))     // true: compares x and y
val b = a.copy(y = 5)         // Point(x=1, y=5); a is unchanged
val (x, y) = b                // destructuring via component1() and component2()
```

- **`equals`/`hashCode`** compare every primary-constructor property, so equal values land in
  the same bucket of a `HashSet` or `HashMap`.
- **`toString`** prints the class name and each property.
- **`copy(...)`** makes a new object, with named arguments overriding chosen fields. This is
  how you "change" an immutable value.
- **`componentN()`** functions make destructuring work: `val (x, y) = point`, and also in
  `for ((x, y) in points)` and in lambda parameters such as `{ (x, y) -> x + y }`.

The standard library ships two ready-made generic data classes. `Pair<A, B>` is what `a to b`
creates, with `first` and `second`, and `Triple<A, B, C>` adds `third`. They are handy for
returning two or three values from a function, but a named data class reads better once the
values have meaning: `user.age` says more than `pair.second`.

`==` calls `equals`, so it compares content. `===` compares **identity**, whether two
references point to the very same object.

## Pitfalls and compiler errors

- `Data class must have at least one primary constructor parameter`, and every such parameter
  must be a `val` or a `var`.
- Properties declared in the **class body** are ignored by `equals`, `hashCode`, `toString`
  and `copy`. Two objects that differ only there still compare equal.
- `copy` is **shallow**. A copied object shares any list it holds with the original, so
  prefer read-only `List` properties.
- Don't use `var` properties in an object that serves as a map key or set element. Change one
  after insertion and its hash changes, so the collection can no longer find it.
- Destructuring is **positional**. `val (y, x) = point` silently swaps your names, because
  only the order counts.

## What you will practise

You will compare data classes with `==` and `===`, copy them, use them in sets, destructure
them and `Pair`/`Triple` in declarations and loops, and see which properties take part in
equality. The challenge merges order lines with `copy` and a `Pair` used as a map key.
'''

[[unit.step]]
kind = "concept"
id = "kt-u11-c1-values-vs-identity"
title = "Values and identity"
points = 5
difficulty = 11
intro = '''
Equality and hashing form a contract: if `a == b`, then `a.hashCode()` must equal
`b.hashCode()`, or hash-based collections break. Data classes generate both functions from
the same list of properties, so the contract holds automatically.
'''
body = '''
## Two kinds of objects

An **entity** has an identity that outlives its data. A user who changes their name is still
the same user. A **value** is nothing but its data. The amount 5.00 EUR is the same amount
wherever it appears. Ordinary classes model entities, and `==` compares identity. Data classes
model values, and `==` compares content.

```kotlin
class Plain(val n: Int)
data class Value(val n: Int)

Plain(1) == Plain(1)      // false: two distinct objects
Value(1) == Value(1)      // true: same content
Value(1) === Value(1)     // false: still two objects in memory
```

## Why hashCode matters

A `HashSet` first uses `hashCode()` to pick a bucket, then `equals` to compare inside the
bucket. If two equal objects had different hash codes, they would land in different buckets,
and a lookup would miss. A data class derives both functions from the same properties, so
equal values always share a bucket:

```kotlin
val seen = hashSetOf(Value(1))
println(Value(1) in seen)  // true
```

## Immutability makes values safe

Declare the properties of a value with `val`, and "change" it with `copy`, which returns a new
object and leaves the old one alone. Immutable values can be shared, cached and used as keys
without fear, because nothing can change them behind your back. That is why most data classes
in real code have only `val` properties, and why `copy` exists at all.
'''

[[unit.step]]
kind = "drill"
id = "kt-u11-d1-data-basics"
title = "What a data class gives you"
points = 10
difficulty = 11
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
From a one-line declaration, the compiler generates structural `equals`, a matching
`hashCode`, a readable `toString` and `copy`. Structural equality means that two objects are
equal when all their fields are equal, and that is exactly what a hash set needs to recognise
a value it has seen before.
'''
prompt = '''
Declare a data class and an ordinary class with the same shape, then compare, print, hash,
copy and deduplicate them.

**Why:** seeing the same comparison give `true` for the data class and `false` for the plain
class makes it clear what the `data` keyword buys you.
'''
target = '''
data class Point(val x: Int, val y: Int)

class PlainPoint(val x: Int, val y: Int)

fun main() {
    val a = Point(1, 2)
    val b = Point(1, 2)
    println(a)
    println(a == b)
    println(a === b)
    println(a.hashCode() == b.hashCode())
    println(PlainPoint(1, 2) == PlainPoint(1, 2))

    val moved = a.copy(y = 10)
    println(moved)
    println(a)

    val visited = mutableSetOf(a, b, moved)
    println(visited.size)
    println(Point(1, 10) in visited)
}
'''
line_comments = [
