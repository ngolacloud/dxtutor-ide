  "Runs first: plain code inside the coroutine.",
  "Queues a new child coroutine and returns its `Job` at once, without running the block yet.",
  "Calls the suspend function; legal here because a coroutine body may suspend.",
  "",
  "Still the parent: the child is queued but has not started, yet it already counts as active.",
  "Suspends the parent until the child completes; this is when the child finally runs.",
  "Prints `joined: completed=true`.",
