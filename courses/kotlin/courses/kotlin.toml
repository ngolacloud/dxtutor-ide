[unit.step.gabarito]
solution = '''
import kotlin.math.abs

class Fraction(numerator: Long, denominator: Long = 1) : Comparable<Fraction> {
    val num: Long
    val den: Long

    init {
        require(denominator != 0L) { "denominator must not be zero" }
        val g = gcd(abs(numerator), abs(denominator))
        val sign = if (denominator < 0) -1 else 1
        num = sign * numerator / g
        den = sign * denominator / g
    }

    operator fun plus(other: Fraction) = Fraction(num * other.den + other.num * den, den * other.den)
    operator fun minus(other: Fraction) = Fraction(num * other.den - other.num * den, den * other.den)
    operator fun times(other: Fraction) = Fraction(num * other.num, den * other.den)

    operator fun div(other: Fraction): Fraction {
        if (other.num == 0L) throw ArithmeticException("division by zero")
        return Fraction(num * other.den, den * other.num)
    }

    operator fun unaryMinus() = Fraction(-num, den)

    // Both denominators are positive, so cross-multiplying keeps the order.
    override fun compareTo(other: Fraction): Int = (num * other.den).compareTo(other.num * den)

    override fun equals(other: Any?): Boolean =
        other is Fraction && num == other.num && den == other.den

    override fun hashCode(): Int = 31 * num.hashCode() + den.hashCode()

    override fun toString(): String = if (den == 1L) "$num" else "$num/$den"

    operator fun component1(): Long = num
    operator fun component2(): Long = den

    private companion object {
        tailrec fun gcd(a: Long, b: Long): Long = if (b == 0L) a else gcd(b, a % b)
    }
}

infix fun Int.over(denominator: Int): Fraction = Fraction(toLong(), denominator.toLong())
'''
time = "O(log(max(|num|, den))) per operation"
space = "O(1)"
justification = '''
Every operator does a constant number of multiplications and additions on `Long`s and then
calls the constructor, whose cost is dominated by Euclid's `gcd`. Euclid's algorithm needs
**O(log min(a, b))** steps, because the remainder at least halves every two steps, so each
operation is **O(log M)** where M is the size of the numbers involved, effectively constant
for 64-bit values. `compareTo`, `equals`, `hashCode` and the components are **O(1)**: they
read two fields.

Each fraction stores two `Long`s, so the space is **O(1)**.

Reducing in `init` is the key design decision. Because every fraction is canonical,
equality is a field-by-field comparison and `hashCode` is consistent with it without any
extra work. It also keeps the numbers small: adding 1/2 a thousand times without reducing
would multiply the denominators to 2^1000 and overflow a `Long` after 63 steps, whereas the
reduced result stays at 500/1. Cross-multiplication in `compareTo` is valid only because
both denominators are positive, which the canonical form guarantees.
'''

[[unit]]
id = "kt-u28-value-classes"
title = "Value classes and immutable updates"
level = "advanced"
difficulty = 28
intro = '''
A `String` that holds an email and a `String` that holds a product code look identical to the
compiler, so swapping them is a bug nobody catches. You will wrap such values in value
classes that validate themselves and usually cost nothing at run time, model immutable data
that changes only by making new copies, and finish with a small order model built the same way.
'''
concepts = '''
## The idea

**Primitive obsession** is modelling domain ideas with raw types: an account id is a `Long`,
an amount is a `Long`, an email is a `String`. A function such as
`transfer(from: Long, to: Long, cents: Long)` accepts its arguments in any order, and nothing
stops a negative amount or an email without an `@`. Wrapping each idea in its own type fixes
both problems: the compiler rejects a swapped argument, and the wrapper's constructor rejects
an invalid value, so an invalid one never exists anywhere in the program.

The classic objection is cost: one extra object per value. Kotlin's **value classes** remove
it. They are distinct types at compile time, but usually just the underlying value at run time.

## How Kotlin does it

```kotlin
@JvmInline
value class AccountId(val raw: Long) {
    init { require(raw > 0) { "account ids are positive, got $raw" } }
    val isTest: Boolean get() = raw >= 9_000_000
}
```

A value class has exactly one `val` in its primary constructor. It may have `init` blocks,
methods, computed properties and interfaces, but no other stored state, and it is final.
`@JvmInline` is required on the JVM. Equality compares the wrapped value, and `toString`
prints `AccountId(raw=42)`.

The compiler **boxes** the value (allocates a real wrapper) only when it must: when the type
is nullable (`AccountId?`), used as a generic argument (`List<AccountId>`) or seen as `Any`.
Functions that take value classes get mangled JVM names such as `transfer-x2Ab9`, so Java
code cannot call them easily. Java's records are always objects; Java's own value classes
are still being designed (Project Valhalla).

## Immutability and persistent updates

An immutable object never changes after construction: all properties are `val` and of
immutable types. To "change" one, you build a new one. Data classes make that cheap with
`copy`, which reuses every field you do not name. That is **structural sharing**: the old
and new versions share their unchanged parts, so keeping a history of versions is cheap.

```kotlin
data class Profile(val name: String, val tags: List<String>)
val updated = profile.copy(tags = profile.tags + "admin")   // profile is unchanged
```

## What is special or tricky

- No `@JvmInline`: **value classes without '@JvmInline' annotation are not yet supported**.
- Two properties: **value class must have exactly one primary constructor parameter**.
- `===` on a value class: **identity equality for arguments of types 'X' and 'X' is
  prohibited**, because a value has no identity.
- `List` is read-only, not immutable: it may be a `MutableList` that someone else still
  changes. Copy with `toList()` at the boundary when that matters.
- `copy` is shallow and goes through the constructor, so a data class's `init` checks run on
  copies too. A nested change needs nested copies.

## What you will practise

You will write a validating email type, unit types that the compiler keeps apart, and
persistent updates of nested data with `copy`. The challenge is an order model whose SKUs
and quantities are value classes and whose every change returns a new order.
'''

[[unit.step]]
kind = "concept"
id = "kt-u28-c1-wrappers"
title = "Wrapper types for free"
points = 5
difficulty = 28
intro = '''
A wrapper type moves a rule from comments and code reviews into the type system. A value
class gives you that wrapper without paying for an extra object on every use.
'''
body = '''
## Parse, don't validate

If every function that takes an email has to check it, one will forget. Instead, check
**once**, in the constructor, and give the result its own type:

```kotlin
@JvmInline
value class Email(val value: String) {
    init { require('@' in value) { "not an email: $value" } }
}
```

Any code that holds an `Email` knows it is valid, because the only way to make one runs the
check. Functions then ask for `Email`, not `String`, and a raw string no longer type-checks.

## What the compiler does

At run time an `Email` is usually just its `String`. Calls, fields and parameters use the
underlying value; the `init` block runs as a static check at each construction. When the
type has to be an object (`Email?`, `List<Email>`, `Any`), the compiler boxes it
automatically and unboxes it again later. You never write this code yourself, but it explains
why a value class can't have identity and why `===` is forbidden.

## Immutable values, new versions

Value classes are immutable by construction: one `val`, no other state. Larger immutable
records are data classes whose properties are all `val`. You change them with `copy`, which
builds a new object from the old one plus the fields you name. Nothing is ever modified in
place, so a value you handed to another function, a cache or another thread can never change
under its feet, and an undo history is just a list of old versions.
'''

