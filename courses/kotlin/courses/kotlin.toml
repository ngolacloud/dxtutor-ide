fun merge(left: List<Int>, right: List<Int>): List<Int> {
    val out = ArrayList<Int>(left.size + right.size)
    var i = 0
    var j = 0
    while (i < left.size && j < right.size) {
        if (left[i] <= right[j]) out += left[i++] else out += right[j++]
    }
    while (i < left.size) out += left[i++]
    while (j < right.size) out += right[j++]
    return out
}

fun mergeSort(items: List<Int>): List<Int> {
    if (items.size <= 1) return items
    val mid = items.size / 2
    return merge(mergeSort(items.subList(0, mid)), mergeSort(items.subList(mid, items.size)))
