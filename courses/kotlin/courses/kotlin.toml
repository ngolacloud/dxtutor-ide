intro = '''
Merging records that share a key is a **group-and-aggregate** operation, the same idea as SQL's
`GROUP BY`. A hash map keyed by a composite value, here a `Pair` of product code and price,
finds each record's group in O(1) on average, so one pass merges everything. Data classes make
both halves easy: the `Pair` key hashes by content, and `copy` builds the updated line without
