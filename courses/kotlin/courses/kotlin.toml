instructions = '''
## Your turn

The starter declares two data classes:

```kotlin
data class LineItem(val sku: String, val quantity: Int, val unitCents: Long)
data class OrderSummary(val distinctSkus: Int, val units: Int, val totalCents: Long)
```

Implement two functions:

```kotlin
fun mergeLines(lines: List<LineItem>): List<LineItem>
fun summarize(lines: List<LineItem>): OrderSummary
```

**`mergeLines`** combines lines that have the **same `sku` and the same `unitCents`** into one
line whose `quantity` is the sum of theirs.

- Lines with the same sku but a **different price** stay separate.
- Quantities can be negative (a correction). A merged line whose total quantity is `0` is
  dropped.
- The result keeps the order in which each (sku, price) group **first** appears.
- Don't modify the input lines; build new ones with `copy`.

**`summarize`** describes the **merged** order:

- `distinctSkus`: how many different skus remain, counting a sku once even if it has two
  prices;
- `units`: the sum of the quantities;
- `totalCents`: the sum of `quantity * unitCents`.

