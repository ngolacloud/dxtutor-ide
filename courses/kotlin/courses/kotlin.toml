[unit.step.gabarito]
solution = '''
data class Order(val id: String, val quantity: Int, val unitPriceCents: Long)

data class ImportReport(val orders: List<Order>, val errors: List<String>) {
    val totalCents: Long get() = orders.sumOf { it.quantity * it.unitPriceCents }
}

fun parseOrder(line: String): Result<Order> = runCatching {
    val fields = line.split(';').map { it.trim() }
    require(fields.size == 3) { "expected 3 fields, got ${fields.size}" }
    val (id, quantityText, priceText) = fields
    require(id.isNotEmpty()) { "blank id" }
    val quantity = requireNotNull(quantityText.toIntOrNull()) { "bad quantity '$quantityText'" }
    require(quantity > 0) { "quantity must be positive" }
    val price = requireNotNull(priceText.toLongOrNull()) { "bad price '$priceText'" }
    require(price >= 0) { "price must not be negative" }
    Order(id, quantity, price)
}

fun importOrders(lines: List<String>): ImportReport {
    val orders = mutableListOf<Order>()
    val errors = mutableListOf<String>()
    lines.forEachIndexed { index, line ->
        if (line.isBlank()) return@forEachIndexed
        parseOrder(line)
            .onSuccess { orders += it }
            .onFailure { errors += "line ${index + 1}: ${it.message}" }
    }
    return ImportReport(orders, errors)
}
'''
time = "O(n + m)"
space = "O(n + m)"
justification = '''
Let `n` be the number of lines and `m` their total length in characters. `parseOrder` splits and
trims one line, which is linear in its length, then does a constant number of checks and two
number parses, also linear in the field lengths. `importOrders` calls it once per non-blank line
and visits every line once, so the total time is **O(n + m)**. The report holds up to `n` orders
and `n` error strings whose sizes are bounded by the input, so the space is **O(n + m)**.

Wrapping the body in `runCatching` is what makes `parseOrder` total (it never throws): `require`
and `requireNotNull` stop at the first broken rule with a precise message, and `runCatching` turns
that exception into a `Result.failure` value. The order of the checks matters, because each one
may rely on the previous ones, for instance destructuring into three variables only once the field
count is known. Using `toIntOrNull` instead of `toInt` keeps the message under our control rather
than the JDK's. `importOrders` then treats failures as data: `onSuccess` and `onFailure` route
each outcome, and `forEachIndexed` supplies the line number, so one bad line never hides the
others.
'''

[[unit]]
id = "kt-u18-generics"
title = "Generics: type parameters, variance and reified"
level = "intermediate"
difficulty = 18
intro = '''
Generics let one class or function work with many types while the compiler still checks every
use; they are how `List<String>` and `Map<K, V>` are built. You will write generic functions and
classes, learn why a `List<Int>` can be passed as a `List<Number>` but a `MutableList<Int>`
cannot, and use `reified` type parameters to ask about a type at run time. The challenge is a
typed event bus.
'''
concepts = '''
## The idea

Without generics, a reusable container has two bad options: store everything as `Any` and cast on
the way out (unsafe), or write one class per element type (repetitive). A **type parameter** is a
placeholder, written `<T>`, that each use fills in. `Box<Int>` and `Box<String>` share one
implementation, and the compiler checks that only `Int`s go into the first.

## How Kotlin does it

Type parameters follow a class name or precede a function name, and are usually inferred:

```kotlin
class Box<T>(val value: T)
fun <T> listOfTwo(a: T, b: T): List<T> = listOf(a, b)
val pair = listOfTwo(1, 2)            // T is inferred as Int
```

An **upper bound** restricts what `T` may be and unlocks its members:
`fun <T : Comparable<T>> max(a: T, b: T)` may compare `a > b`.

**Variance** answers a subtle question: `Int` is a subtype of `Number`, but is `Box<Int>` a
subtype of `Box<Number>`? It depends on what the class does with `T`:

- **`out T` (covariant):** the class only *produces* `T`s, returning them. Then a `Source<Int>` is
  safely a `Source<Number>`. Kotlin's read-only `List<out E>` is declared this way.
- **`in T` (contravariant):** the class only *consumes* `T`s, taking them as arguments. Then a
  `Sink<Any>` can stand in for a `Sink<Number>`. Kotlin's `Comparable<in T>` is declared this way.
- **No modifier (invariant):** the class does both, like `MutableList<E>`, so neither direction is
  safe.

Kotlin writes the modifier on the declaration (**declaration-site variance**), so users never need
Java's wildcards such as `List<? extends Number>`. For one parameter of an invariant type you can
still write `MutableList<out Number>` (**use-site variance**).

On the JVM, type arguments are **erased**: at run time a `List<String>` is just a `List`. An
`inline` function can mark its type parameter **`reified`**; because the body is copied into each
call site, the real type is known there, so `x is T`, `T::class` and `filterIsInstance<T>()` work.

```kotlin
inline fun <reified T> Any?.isA(): Boolean = this is T
```

## Pitfalls

- `val nums: MutableList<Number> = mutableListOf<Int>()` fails with *initializer type mismatch:
  expected 'MutableList<Number>', actual 'MutableList<Int>'*. If it compiled, you could add a
  `Double` to a list of `Int`s.
- `x is T` or `T::class` without `reified` fails with *cannot check for instance of erased type
  'T'* or *cannot use 'T' as reified type parameter*.
- `reified` works only on `inline` functions, and only where the caller knows the concrete type.
- A class declared `<out T>` cannot take `T` as a parameter: *type parameter 'T' is declared as
  'out' but occurs in 'in' position*.

## What you will practise

You will write a generic `Box` with `map` and a bounded `largest`, producer and consumer
interfaces with `out` and `in`, reified helpers that filter and parse by type, and finally an
event bus that routes events to handlers by their class.
'''

[[unit.step]]
kind = "concept"
id = "kt-u18-c1-variance"
title = "Producers, consumers and erasure"
points = 5
difficulty = 18
intro = '''
Variance looks abstract until you ask one concrete question about a generic type: does it hand
`T`s out, take them in, or both? The answer decides whether a `Source<Int>` may be used as a
`Source<Number>`.
'''
body = '''
## Who uses T, and how?

Look at every place a type parameter appears in a class's public members.

- Only in **return types**? The class is a **producer** of `T`. Mark it `out T`, and a producer of
  a subtype is accepted wherever a producer of the supertype is expected:

```kotlin
interface Source<out T> { fun next(): T }
val nums: Source<Number> = intSource      // fine: every Int is a Number
```

- Only in **parameter types**? The class is a **consumer**. Mark it `in T`, and the direction
  flips: something that accepts any `Any` can certainly accept a `Number`.

```kotlin
interface Sink<in T> { fun put(item: T) }
val numbers: Sink<Number> = anySink       // fine
```

- In **both**? Leave it invariant. A `MutableList<Int>` is not a `MutableList<Number>`, because
  the second would accept `add(2.5)`.

A memory aid: **producer `out`, consumer `in`**.

## Erasure and reified

The JVM forgets type arguments after compilation, so a normal generic function cannot ask "is
this value a `T`?". Marking the function `inline` and its parameter `reified` copies the body
into the call site with the concrete type filled in, so `value is T` and `T::class` work there.
That is how the standard library's `filterIsInstance<String>()` is written.
'''

