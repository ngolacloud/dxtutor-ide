    val isFinal: Boolean
        get() = TODO("not implemented")

    // the allowed transitions are listed in the instructions
    fun canMoveTo(next: OrderStatus): Boolean {
        TODO("not implemented")
    }

    // return `next`, or throw IllegalStateException("cannot move from X to Y")
    fun moveTo(next: OrderStatus): OrderStatus {
        TODO("not implemented")
    }

    companion object {
        // match a name or a label, ignoring case and surrounding spaces; null if none
        fun parse(text: String): OrderStatus? {
            TODO("not implemented")
        }

        // every status that is not final, in declaration order
        fun active(): List<OrderStatus> {
            TODO("not implemented")
        }
    }
}
'''
tests = '''
test("the constants and labels are unchanged") {
    equal(OrderStatus.entries.map { it.name }, listOf("PENDING", "PAID", "SHIPPED", "DELIVERED", "CANCELLED"))
    equal(OrderStatus.SHIPPED.label, "in transit")
}
test("isFinal is true only for DELIVERED and CANCELLED") {
    equal(OrderStatus.entries.filter { it.isFinal }, listOf(OrderStatus.DELIVERED, OrderStatus.CANCELLED))
}
test("canMoveTo allows exactly the five transitions") {
    val allowed = OrderStatus.entries.flatMap { from ->
        OrderStatus.entries.filter { from.canMoveTo(it) }.map { "$from>$it" }
    }
    equal(allowed, listOf("PENDING>PAID", "PENDING>CANCELLED", "PAID>SHIPPED", "PAID>CANCELLED", "SHIPPED>DELIVERED"))
}
test("moveTo walks the happy path") {
    val end = OrderStatus.PENDING.moveTo(OrderStatus.PAID).moveTo(OrderStatus.SHIPPED).moveTo(OrderStatus.DELIVERED)
    equal(end, OrderStatus.DELIVERED)
}
test("moveTo rejects illegal transitions with IllegalStateException") {
    assertThrows<IllegalStateException> { OrderStatus.SHIPPED.moveTo(OrderStatus.CANCELLED) }
    assertThrows<IllegalStateException> { OrderStatus.DELIVERED.moveTo(OrderStatus.PENDING) }
    assertThrows<IllegalStateException> { OrderStatus.PAID.moveTo(OrderStatus.PAID) }
    val message = runCatching { OrderStatus.CANCELLED.moveTo(OrderStatus.PAID) }.exceptionOrNull()?.message
    equal(message, "cannot move from CANCELLED to PAID")
}
test("parse accepts names and labels in any case") {
    equal(OrderStatus.parse("PAID"), OrderStatus.PAID)
    equal(OrderStatus.parse("shipped"), OrderStatus.SHIPPED)
    equal(OrderStatus.parse("In Transit"), OrderStatus.SHIPPED)
    equal(OrderStatus.parse("  awaiting PAYMENT "), OrderStatus.PENDING)
    equal(OrderStatus.parse("Cancelled"), OrderStatus.CANCELLED)
}
test("parse returns null for anything else") {
    equal(OrderStatus.parse(""), null)
    equal(OrderStatus.parse("refunded"), null)
    equal(OrderStatus.parse("in-transit"), null)
}
test("active lists the non-final statuses in declaration order") {
    equal(OrderStatus.active(), listOf(OrderStatus.PENDING, OrderStatus.PAID, OrderStatus.SHIPPED))
}
'''

[unit.step.gabarito]
solution = '''
enum class OrderStatus(val label: String) {
    PENDING("awaiting payment"),
    PAID("paid"),
    SHIPPED("in transit"),
    DELIVERED("delivered"),
    CANCELLED("cancelled");

    val isFinal: Boolean
        get() = this == DELIVERED || this == CANCELLED

    fun canMoveTo(next: OrderStatus): Boolean = when (this) {
        PENDING -> next == PAID || next == CANCELLED
        PAID -> next == SHIPPED || next == CANCELLED
        SHIPPED -> next == DELIVERED
        DELIVERED, CANCELLED -> false
    }

    fun moveTo(next: OrderStatus): OrderStatus {
        check(canMoveTo(next)) { "cannot move from $name to ${next.name}" }
        return next
    }

    companion object {
        fun parse(text: String): OrderStatus? {
            val wanted = text.trim()
            return entries.firstOrNull {
                it.name.equals(wanted, ignoreCase = true) || it.label.equals(wanted, ignoreCase = true)
            }
        }

        fun active(): List<OrderStatus> = entries.filterNot { it.isFinal }
    }
}
'''
time = "O(1) per transition, O(k) for parse and active"
space = "O(k)"
justification = '''
Let `k` be the number of constants (5 here). `isFinal`, `canMoveTo` and `moveTo` do a fixed number
of comparisons, **O(1)**; the `when` compiles to a switch on the ordinal. `parse` trims the input
and compares it with each constant's name and label, which is **O(k)** comparisons of strings no
longer than the input, and `active()` filters `entries` in **O(k)**. The only extra space is the
list that `active()` returns, **O(k)**.

The design choice that matters is the exhaustive `when (this)`. Each constant appears in exactly
one branch and there is no `else`, so adding, say, `REFUNDED` would make the compiler reject
`canMoveTo` until someone decides its transitions. A `Map<OrderStatus, Set<OrderStatus>>` in the
companion would also work, but a forgotten key would only show up at run time. `moveTo` uses
`check` because an illegal transition means the *order* is in the wrong state for this operation,
which is exactly what `IllegalStateException` signals. `parse` lives in the companion because it
is about the type, not about one constant, and it returns `null` instead of throwing like
`valueOf`, so code handling user input can supply a fallback with `?:`.
'''

[[unit]]
id = "kt-u21-delegation"
title = "Delegation: lazy, observable and by"
level = "intermediate"
difficulty = 21
intro = '''
Delegation means handing a job to another object instead of doing it yourself. Kotlin builds it
into the language with the keyword `by`: a property can delegate its storage to `lazy`,
`observable` or a class of your own, and a class can delegate a whole interface to another object.
You will use the standard delegates and finish by writing a reusable delegate of your own.
'''
concepts = '''
## The idea

Many properties need the same extra behaviour around a plain read and write: compute the value on
first use, notify someone when it changes, reject invalid values, store it in a map. Writing that
logic by hand in every getter and setter copies it again and again. **Delegation** moves the logic
into a separate object, the *delegate*, and the property simply forwards its reads and writes to
it. The same idea works for whole classes: instead of inheriting from a class to reuse its
behaviour, a class can implement an interface by forwarding the calls to an object it holds, the
classic advice to favour composition over inheritance.

## How Kotlin does it

A **delegated property** is written `val` or `var`, a name, a type, then `by` and the delegate.
The standard library provides the common delegates:

```kotlin
val config: Config by lazy { loadConfig() }                  // computed once, on first read
var name: String by Delegates.observable("") { _, old, new -> println("$old -> $new") }
var age: Int by Delegates.vetoable(0) { _, _, new -> new >= 0 }   // refuses negatives
val title: String by fields                                   // reads fields["title"]
```

`lazy` is thread-safe by default; pass `LazyThreadSafetyMode.NONE` when only one thread will
touch the value. A property delegated to a `Map` uses the property's name as the key.

Any object with the right operator functions can be a delegate. For a `var`, implement
`ReadWriteProperty<Any?, T>` from `kotlin.properties`: its `getValue(thisRef, property)` and
`setValue(thisRef, property, value)` receive the owning object and a `KProperty` that describes the
property, including its `name`. Local variables can be delegated too.

**Class delegation** is written `class LoggingRepo(inner: Repo) : Repo by inner`. The compiler
generates every method of `Repo` as a call to `inner`, and you override only the ones you want to
change. In Java you would write each forwarding method by hand, or use a dynamic proxy.

## Pitfalls

- **`lazy` is only for `val`.** `var x by lazy { 1 }` fails with *type 'Lazy<Int>' has no method
  'setValue(…)', so it cannot serve as a delegate for var (read-write property)*.
- **Initialisation order.** Delegates are created in declaration order, like any property
  initialiser. A delegate that receives `history` must be declared after `history`; using it
  earlier fails with *variable 'history' must be initialized*.
- **Class delegation does not reroute internal calls.** When `inner` calls one of its own methods,
  it runs *its* version, not your override: delegation is not inheritance.
- **`observable` reacts after the change, `vetoable` decides before it.** Only `vetoable` can
  refuse a value.
- **One delegate per property.** Sharing a single delegate object between two properties makes
  them share one value.

## What you will practise

You will defer work with `lazy`, read properties out of a map, log changes with `observable`,
reject values with `vetoable`, wrap a repository with class delegation, and then write a `Clamped`
delegate that keeps settings in range and records every change.
'''

[[unit.step]]
kind = "concept"
id = "kt-u21-c1-by"
title = "What by actually does"
points = 5
difficulty = 21
intro = '''
`by` is not magic: the compiler stores the delegate in a hidden field and turns the property's
getter and setter into calls to the delegate's `getValue` and `setValue`. Seeing that translation
makes writing your own delegate straightforward.
'''
body = '''
## A property that forwards

When you write

```kotlin
class Page {
    var title: String by Delegates.observable("untitled") { _, old, new -> println("$old -> $new") }
}
```

the compiler keeps the delegate in a hidden field and turns the property into two forwarding
calls, roughly:

```kotlin
private val titleDelegate = Delegates.observable("untitled") { … }
var title: String
    get() = titleDelegate.getValue(this, ::title)
    set(value) = titleDelegate.setValue(this, ::title, value)
```

`this` is the owning object and `::title` is a `KProperty` that describes the property, so one
delegate class can serve many properties and still know which one it is working for, for example
to print its `name`.

## Writing your own

A delegate is any object with matching `getValue` and, for a `var`, `setValue` operator functions.
Implementing the interface `ReadWriteProperty<Any?, T>` gives you the right signatures:

```kotlin
class Trimmed(private var text: String = "") : ReadWriteProperty<Any?, String> {
    override fun getValue(thisRef: Any?, property: KProperty<*>) = text
    override fun setValue(thisRef: Any?, property: KProperty<*>, value: String) {
        text = value.trim()
    }
}

var name: String by Trimmed()
```

Every assignment to `name` now goes through `setValue` and is trimmed on the way in. `lazy { }`
follows the same pattern: it returns a `Lazy<T>` whose `getValue` runs the lambda on the first
read and caches the result.
'''

