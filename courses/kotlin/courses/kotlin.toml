target = '''
open class Tag(private val name: String) {
    private val children = mutableListOf<String>()

    protected fun <T : Tag> child(tag: T, block: T.() -> Unit) {
        tag.block()
        children += tag.render()
    }

    fun text(value: String) {
        children += value
    }

    fun render(): String = "<$name>${children.joinToString("")}</$name>"
}

class Html : Tag("html") {
    fun h1(block: Tag.() -> Unit) = child(Tag("h1"), block)
    fun ul(block: Ul.() -> Unit) = child(Ul(), block)
}

class Ul : Tag("ul") {
    fun li(label: String) = child(Tag("li")) { text(label) }
}

fun html(block: Html.() -> Unit): String = Html().apply(block).render()

fun main() {
    val page = html {
        h1 { text("Shopping") }
        ul {
            li("milk")
            li("bread")
        }
    }
    println(page)
}
'''
