[unit.step.gabarito]
solution = '''
@DslMarker
annotation class JsonDsl

// Anything that can write its JSON text into a shared buffer.
fun interface JsonNode {
    fun writeTo(out: StringBuilder)
}

private fun StringBuilder.appendQuoted(s: String) {
    append('"')
    for (c in s) {
        when (c) {
            '\\' -> append("\\\\")
            '"' -> append("\\\"")
            '\n' -> append("\\n")
            '\r' -> append("\\r")
            '\t' -> append("\\t")
            else -> append(c)
        }
    }
    append('"')
}

private fun scalar(value: Any?): JsonNode = when (value) {
    null -> JsonNode { it.append("null") }
    is Boolean, is Int, is Long -> JsonNode { it.append(value.toString()) }
    is Double -> {
        require(value.isFinite()) { "JSON cannot represent $value" }
        JsonNode { it.append(value.toString()) }
    }
    is String -> JsonNode { it.appendQuoted(value) }
    else -> throw IllegalArgumentException("unsupported JSON value: $value")
}

@JsonDsl
class JsonObjectBuilder : JsonNode {
    private val fields = LinkedHashMap<String, JsonNode>()

    fun put(key: String, value: Any?) {
        fields[key] = scalar(value)
    }

    fun obj(key: String, block: JsonObjectBuilder.() -> Unit) {
        fields[key] = JsonObjectBuilder().apply(block)
    }

    fun array(key: String, block: JsonArrayBuilder.() -> Unit) {
        fields[key] = JsonArrayBuilder().apply(block)
    }

    override fun writeTo(out: StringBuilder) {
        out.append('{')
        var first = true
        for ((key, node) in fields) {
            if (!first) out.append(',')
            first = false
            out.appendQuoted(key)
            out.append(':')
            node.writeTo(out)
        }
        out.append('}')
    }

    fun render(): String = buildString { writeTo(this) }
}

@JsonDsl
class JsonArrayBuilder : JsonNode {
    private val items = mutableListOf<JsonNode>()

    fun add(value: Any?) {
        items += scalar(value)
    }

    fun obj(block: JsonObjectBuilder.() -> Unit) {
        items += JsonObjectBuilder().apply(block)
    }

    fun array(block: JsonArrayBuilder.() -> Unit) {
        items += JsonArrayBuilder().apply(block)
    }

    override fun writeTo(out: StringBuilder) {
        out.append('[')
        items.forEachIndexed { i, node ->
            if (i > 0) out.append(',')
            node.writeTo(out)
        }
        out.append(']')
    }

    fun render(): String = buildString { writeTo(this) }
}

fun json(block: JsonObjectBuilder.() -> Unit): String = JsonObjectBuilder().apply(block).render()
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let n be the length of the rendered JSON. Building the tree does O(1) work per `put`, `add`,
`obj` or `array` call: a `LinkedHashMap` insertion or replacement is O(1) expected, and a list
append is amortized O(1). Each scalar is checked once and kept as a small `JsonNode`.

Rendering is a single depth-first walk that writes every character straight into **one**
`StringBuilder`, so each output character is appended once, giving **O(n)** time overall.
The space is **O(n)** for the tree and the output, plus O(d) call stack for a document
nested d levels deep.

The design choice matters for the bound. Rendering each child to its own `String` and then
concatenating it into the parent is simpler, but a value nested d levels deep is then copied
d times, which costs O(n·d) and degrades on deep documents. Replacing a repeated key through
`LinkedHashMap` keeps its original position for free, because re-inserting an existing key
does not change the map's iteration order.
'''

[[unit]]
id = "kt-u27-operators"
title = "Operator overloading and conventions"
level = "advanced"
difficulty = 27
intro = '''
In Kotlin, `a + b`, `grid[r, c]`, `x in range`, `v1 < v2` and `val (a, b) = p` are all
ordinary function calls with special names. You will give your own types arithmetic,
indexing, `invoke`, ordering, ranges and destructuring, and finish by writing an exact
`Fraction` type that behaves like a built-in number.
'''
concepts = '''
## The idea

Operators are just a short way of writing function calls. `price + tax` reads better than
`price.plus(tax)`, and for types that really are numbers, vectors, matrices, money or dates,
operators make code look like the maths it implements. The danger is the opposite case: an
operator whose meaning is not obvious makes code harder to read, not easier.

## How Kotlin does it

Kotlin has a fixed set of **conventions**. When the compiler sees an operator, it rewrites
it into a call to a function with a known name, and that function must be marked `operator`:

| You write | Kotlin calls |
|---|---|
| `a + b`, `a - b`, `a * b`, `a / b`, `a % b` | `a.plus(b)`, `minus`, `times`, `div`, `rem` |
| `-a`, `!a` | `a.unaryMinus()`, `a.not()` |
| `a[i]`, `a[i, j] = v` | `a.get(i)`, `a.set(i, j, v)` |
| `x in c` | `c.contains(x)` |
| `f(x)` where `f` is an object | `f.invoke(x)` |
| `a < b`, `a >= b` | `a.compareTo(b) < 0`, `>= 0` |
| `a..b` | `a.rangeTo(b)` |
| `val (x, y) = p` | `p.component1()`, `p.component2()` |
| `a += b` | `a.plusAssign(b)`, or `a = a.plus(b)` |

```kotlin
data class Point(val x: Int, val y: Int) {
    operator fun plus(o: Point) = Point(x + o.x, y + o.y)
}

println(Point(1, 2) + Point(3, 4))   // Point(x=4, y=6)
```

Operators can also be **extension functions**, so `operator fun Int.times(p: Point)` makes
`2 * p` work without touching `Int`. Implementing `Comparable<T>` gives you `<`, `>`, `<=`,
`>=`, `sorted()`, `max()` and `a..b` ranges with `in` all at once. Data classes already
generate `componentN`; any class can declare them by hand.

Java has no operator overloading at all: `BigDecimal` code is a chain of `add` and
`multiply` calls. In Kotlin the standard library adds `operator` extensions to `BigDecimal`
and `BigInteger`, so `a * b + c` works on them too.

## What is special or tricky

- Forget the modifier and you get **'operator' modifier is required on 'fun plus(o: P): P'**.
- `==` always calls `equals`, which you override; it is not declared with `operator`. `===`
  (identity) can never be overloaded.
- Keep `compareTo` consistent with `equals`: if `compareTo` returns 0, the two values should
  be equal, or sorted sets and maps will lose elements.
- If a `var` has both `plus` and `plusAssign`, `a += b` is ambiguous and fails with
  **ambiguity between assign operator candidates**. Immutable types should define only `plus`.
- You cannot invent new symbols or change precedence. For a word-like operation, use an
  `infix fun` such as `1 over 2` or `x shl 3`.

## What you will practise

You will give a vector type arithmetic and scalar multiplication, a grid indexing with
`[r, c]`, `in` and `invoke`, and a version type ordering, ranges and destructuring. The
challenge is an exact rational number type with every arithmetic and comparison operator.
'''

[[unit.step]]
kind = "concept"
id = "kt-u27-c1-conventions"
title = "Conventions, not magic"
points = 5
difficulty = 27
intro = '''
The compiler translates each operator into a call to a function with a fixed name. Knowing
that translation tells you exactly what you need to declare and what you get for free.
'''
body = '''
## The translation

`a + b` is compiled as `a.plus(b)`. The function may be a member of `a`'s class or an
extension, and it must be marked `operator`, which documents that it is meant to be used as
`+`. The argument and return types are up to you: `Vec * Int` can return a `Vec`, and
`Matrix * Vec` can return a `Vec` too.

## What comes for free

Some conventions are derived from others:

- `a += b` on a `var` becomes `a = a + b` when only `plus` exists. Immutable types should rely
  on this and never declare `plusAssign`.
- `a[i] += 1` becomes `a.set(i, a.get(i) + 1)`.
- `x !in c` is `!c.contains(x)`.
- `<`, `>`, `<=` and `>=` all come from one `compareTo`. Implement `Comparable<T>` and the
  standard library adds `sorted()`, `max()`, `coerceIn` and `a..b`, a `ClosedRange` whose
  `in` check uses your `compareTo`.

## Equality is special

`a == b` is translated to `a?.equals(b) ?: (b === null)`, so it is null-safe and calls the
`equals` you override. Data classes generate `equals`, `hashCode` and `componentN` from the
primary constructor. A hand-written class that needs value equality must override `equals`
**and** `hashCode` together, or hash sets and maps will treat equal values as different.

## A rule of taste

Overload an operator only when its meaning is the one a reader expects: `+` adds or
combines, `[]` looks something up, `in` tests membership. Everything else deserves a named
function.
'''

