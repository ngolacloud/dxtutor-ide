intro = '''
A BST search needs no recursion: one variable walks down the tree, and each comparison picks
a child. Counting the nodes visited shows that the cost is the depth of the key, or the depth
of the empty spot where it would be.
'''
prompt = '''
Build a small tree of strings by hand, then search for five keys with a loop, printing how many
nodes each search visited.

**Why:** the iterative search is O(h) time and O(1) space, and the step counts make the "one
path from root to leaf" cost visible.
