instructions = '''
## Your turn

Implement three extensions:

```kotlin
fun String.toSlug(): String
val String.wordCount: Int
fun String?.ellipsize(max: Int): String
```

**`toSlug`** turns a title into a URL slug:

- Letters and digits (`Char.isLetterOrDigit()`) are kept, in lower case. Accented letters count
  as letters.
- Every run of other characters (spaces, punctuation, symbols) becomes a **single** `-`.
- The slug never starts or ends with `-`. A string with no letters or digits gives `""`.

**`wordCount`** is the number of words, where words are separated by any amount of whitespace
(spaces, tabs, newlines). Blank or empty strings have 0 words.

**`ellipsize`** shortens text for a preview:

- It throws `IllegalArgumentException` when `max < 1` (use `require`), even on `null`.
- A `null` receiver gives `""`.
- A string of at most `max` characters is returned unchanged.
- A longer one is cut to its first `max - 1` characters followed by the single character `…`,
  so the result is exactly `max` characters long.

Examples:

- `"Hello, World!".toSlug()` is `"hello-world"`, and `"  Kotlin 2.0 -- released!  ".toSlug()`
  is `"kotlin-2-0-released"`.
- `" one  two\tthree\n".wordCount` is `3`.
- `"Extensions".ellipsize(5)` is `"Exte…"`, and `(null as String?).ellipsize(5)` is `""`.

**Hint:** for `toSlug`, walk the characters with a `StringBuilder` and remember whether a
separator is pending; write the `-` only when the next kept character arrives and the builder
isn't empty.

Hidden tests decide correctness.
'''
