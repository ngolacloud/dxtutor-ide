instructions = '''
## Your turn

Implement four higher-order functions. Read `<A, B, C>` and `<T>` as "any types"; generics are
covered properly in unit 18.

```kotlin
fun <A, B, C> compose(f: (B) -> C, g: (A) -> B): (A) -> C
fun <T> pipeline(vararg steps: (T) -> T): (T) -> T
fun <T, R> memoize(f: (T) -> R): (T) -> R
inline fun <T> countWhere(items: Iterable<T>, predicate: (T) -> Boolean): Int
```

Rules:

- `compose(f, g)` returns a function that applies `g` first, then `f`: `compose(f, g)(x)` is
  `f(g(x))`, as in mathematics.
- `pipeline(s1, s2, s3)` returns a function that applies the steps **left to right**:
  `s3(s2(s1(x)))`. With no steps it returns its input unchanged. It must cope with thousands of
  steps.
- `memoize(f)` returns a function that gives the same results as `f` but calls `f` **at most once
  per distinct argument**, answering repeated arguments from a cache. Results that are `null`
  must be cached too.
- `countWhere(items, predicate)` returns how many items satisfy `predicate`, calling it exactly
  once per item. Callers use a trailing lambda: `countWhere(words) { it.length > 3 }`.

Examples:

- `compose({ n: Int -> n * 2 }, { s: String -> s.length })("kotlin")` is `12`.
- `pipeline<Int>({ it + 1 }, { it * 2 }, { it - 3 })(5)` is `9`.
- `countWhere(listOf(3, -1, 4, -1, 5)) { it > 0 }` is `3`.

**Hint:** for `memoize`, a `HashMap` captured by the returned lambda is the cache. `getOrPut`
treats a stored `null` as missing, so check `containsKey` yourself.

Hidden tests decide correctness.
'''
