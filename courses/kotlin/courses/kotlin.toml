prompt = '''
Write a `SinglyLinkedList<T>` class that keeps `head`, `tail` and `size`, append three words,
and print the list, its size and its last value.

**Why:** a little extra bookkeeping turns two O(n) operations into O(1) ones, which is the
same trade-off `ArrayDeque` makes internally.
'''
target = '''
class Node<T>(val value: T) {
    var next: Node<T>? = null
}

class SinglyLinkedList<T> : Iterable<T> {
    private var head: Node<T>? = null
    var tail: Node<T>? = null
        private set
    var size = 0
        private set

    fun addLast(value: T) {
        val node = Node(value)
        val last = tail
        if (last == null) head = node else last.next = node
        tail = node
        size++
    }

    override fun iterator(): Iterator<T> = iterator {
        var node = head
        while (node != null) {
            yield(node.value)
            node = node.next
        }
    }
}

fun main() {
    val list = SinglyLinkedList<String>()
    for (word in listOf("red", "green", "blue")) list.addLast(word)
    println("${list.toList()} ${list.size} ${list.tail?.value}")
}
'''
