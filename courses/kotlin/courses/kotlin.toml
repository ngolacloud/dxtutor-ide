In `(a[b]{c})` every closer pops its own opener and the stack ends empty: `true`. In `([)]`
the `)` pops `[`, a mismatch: `false`. `((` leaves two openers on the stack: `false`. The
empty string has nothing to check and an empty stack: `true`. A leading `}` finds the stack
empty, `removeLastOrNull` returns `null`, which is not `{`: `false`. Each character costs O(1),
so the check is O(n) time and O(n) space in the worst case.
'''

[[unit.step]]
kind = "drill"
id = "kt-u29-d2-maze"
title = "Shortest path in a maze with a queue"
points = 10
difficulty = 29
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
Breadth-first search explores a graph in rings: first the start, then everything one step
away, then two steps, and so on. A FIFO queue produces exactly that order, so the first time
BFS reaches a cell, it has found the shortest path to it, counted in steps.
'''
prompt = '''
Find the length of the shortest path from the top-left to the bottom-right corner of a grid
maze, moving up, down, left or right through `.` cells, using an `ArrayDeque` as the queue.

**Why:** the queue's FIFO order is what makes BFS correct; replace it with a stack and you
get a depth-first search that finds *a* path, not the shortest one.
'''
target = '''
fun shortestPath(grid: List<String>): Int {
    val rows = grid.size
    val cols = grid[0].length
    val dist = Array(rows) { IntArray(cols) { -1 } }
    val queue = ArrayDeque<Pair<Int, Int>>()
    dist[0][0] = 0
    queue.addLast(0 to 0)
    while (queue.isNotEmpty()) {
        val (r, c) = queue.removeFirst()
        if (r == rows - 1 && c == cols - 1) return dist[r][c]
        for ((dr, dc) in listOf(1 to 0, -1 to 0, 0 to 1, 0 to -1)) {
            val nr = r + dr
            val nc = c + dc
            if (nr in 0 until rows && nc in 0 until cols && grid[nr][nc] == '.' && dist[nr][nc] == -1) {
                dist[nr][nc] = dist[r][c] + 1
                queue.addLast(nr to nc)
            }
        }
    }
    return -1
}

fun main() {
    val maze = listOf(
        "..#....",
        ".##.##.",
        "....#..",
        "#.#...#",
        "...#...",
    )
    println(shortestPath(maze))
    println(shortestPath(listOf(".#", "#.")))
}
'''
