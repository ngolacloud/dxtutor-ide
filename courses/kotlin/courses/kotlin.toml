[unit.step.gabarito]
solution = '''
fun <T> paged(fetchPage: (page: Int) -> List<T>): Sequence<T> = sequence {
    var page = 0
    while (true) {
        val items = fetchPage(page)
        if (items.isEmpty()) break
        yieldAll(items)
        page++
    }
}

fun firstErrors(log: Sequence<String>, n: Int): List<String> {
    require(n >= 0) { "n must not be negative, was $n" }
    return log
        .filter { it.startsWith("ERROR ") }
        .map { it.removePrefix("ERROR ").trim() }
        .take(n)
        .toList()
}
'''
time = "O(k) for paged, O(L) for firstErrors"
space = "O(p) for paged, O(n) for firstErrors"
justification = '''
**`paged`.** Let `k` be the number of items the consumer takes and `p` the page size. Inside the
`sequence { }` builder the loop suspends at `yieldAll` and resumes only when the consumer asks for
another item, so the pages fetched are exactly those needed to supply `k` items, about `k / p` of
them, plus the final empty page if the consumer reaches the end. Apart from the fetching itself,
the time is **O(k)**, and the extra memory is **O(p)**: only the current page is held, never the
whole result.

**`firstErrors`.** Let `L` be the number of lines up to and including the `n`th error. The
pipeline is vertical: each line is tested by `filter`, mapped only if it is an error, and counted
by `take(n)`, which stops pulling as soon as it has `n` elements. So the time is **O(L)** (times
the line length, for `startsWith` and `trim`), independent of the size of the whole log, and the
space is **O(n)** for the returned list. An eager version such as
`log.toList().filter { … }.take(n)` reads every line and keeps them all in memory, which is
O(total lines) in both time and space; on an endless log it never finishes, which is exactly what
the tests check.
'''

[[unit]]
id = "kt-u20-objects-enums"
title = "Objects, companions and enum classes"
level = "intermediate"
difficulty = 20
intro = '''
Some things exist exactly once in a program (a registry, a clock, a default configuration), and
some types have a small, fixed set of values (log levels, order states, price plans). Kotlin gives
both first-class syntax: `object` declares a singleton, a `companion object` holds what Java would
make `static`, and `enum class` defines a closed set of constants that can carry data and
behaviour.
'''
concepts = '''
## The idea

A **singleton** is a class with exactly one instance, created on first use and shared by
everyone. An **enumeration** is a type whose values are all listed once, at compile time, and never
grow: an order is pending, paid, shipped, delivered or cancelled, and nothing else. Both remove
whole classes of bugs: nobody can create a second registry by accident, and nobody can pass the
string `"shiped"` where a status is expected.

## How Kotlin does it

An **`object` declaration** defines a class and its single instance in one step. The instance is
created lazily, and thread-safely, the first time it is used.

```kotlin
object Clock {
    fun now(): Long = System.currentTimeMillis()
}
val started = Clock.now()
```

An **object expression** creates a one-off anonymous instance, typically to implement an
interface on the spot: `object : Comparator<String> { override fun compare(…) = … }`. It is
Kotlin's version of Java's anonymous inner class.

Kotlin has no `static` keyword. Members that belong to the class rather than to an instance go in
a **`companion object`**: factory functions, constants, parsing helpers. Callers use the class
name, as in `Temperature.ofCelsius(21.0)`. Together with a `private constructor`, a companion lets
the class decide how instances are created. `const val` marks a compile-time constant (a
primitive or a `String`).

**Enum classes** list their constants first. Constants can take constructor arguments, and the
class can have properties, methods and a companion:

```kotlin
enum class Level(val severity: Int) {
    DEBUG(10), INFO(20), ERROR(40);
    fun atLeast(other: Level) = severity >= other.severity
}
```

Every enum has `name` and `ordinal`, plus `entries` (all constants in declaration order, preferred
over the older `values()`) and `valueOf(name)`. Because the set of constants is closed, a `when`
over an enum can be **exhaustive** without an `else`, and the compiler tells you when a new
constant is not handled.

## Pitfalls

- **The semicolon.** When an enum has members after its constants, the list of constants must end
  with `;`.
- **`valueOf` is strict.** `Level.valueOf("info")` throws `IllegalArgumentException`: the name
  must match exactly. Write a lenient `parse` in the companion that returns `null` instead.
- **Non-exhaustive `when`.** A `when` expression that forgets a constant fails with *'when'
  expression must be exhaustive. Add the 'ERROR' branch or an 'else' branch.* Prefer listing the
  constants over `else`, so adding a constant forces you to revisit the code.
- **Singletons are global state.** Mutable state in an `object` is shared by the whole program and
  by every test; keep it small, or pass dependencies in instead.
- **Don't persist `ordinal`.** Reordering the constants changes it; store `name` or a property you
  control.

## What you will practise

You will write a singleton id generator and two object expressions, a class whose companion
provides factories and a constant behind a private constructor, an enum with properties and an
exhaustive `when`, and finally an order-status state machine with a lenient parser in its
companion.
'''

[[unit.step]]
kind = "concept"
id = "kt-u20-c1-one-instance"
title = "One instance, by declaration"
points = 5
difficulty = 20
intro = '''
`object`, `companion object` and `enum class` all declare instances directly instead of leaving
their creation to callers. That is what guarantees there is exactly one registry, one way to build
a validated value, or exactly five order states.
'''
body = '''
## object: the class and its instance in one

```kotlin
object Registry {
    private val services = mutableMapOf<String, Any>()
    fun register(name: String, service: Any) { services[name] = service }
}
```

`Registry` is both a type and its only value. You never call a constructor; you use the name. The
JVM creates the instance the first time any code touches it.

## companion object: members of the class itself

```kotlin
class User private constructor(val email: String) {
    companion object {
        const val MAX_EMAIL = 254
        fun of(email: String): User? =
            email.trim().lowercase().takeIf { '@' in it && it.length <= MAX_EMAIL }?.let(::User)
    }
}
```

The companion is an object nested in the class, so `User.of(…)` and `User.MAX_EMAIL` read like
Java statics. Because it lives inside the class, it may call the private constructor: the factory
is the only way to get a `User`, and it can validate, normalise, or return `null`.

## enum class: a closed set of values

```kotlin
enum class Direction(val dx: Int, val dy: Int) {
    NORTH(0, -1), EAST(1, 0), SOUTH(0, 1), WEST(-1, 0)
}
```

Each constant is a singleton instance of `Direction`, created once with its own arguments.
`Direction.entries` lists them in order, and a `when (direction)` that covers all four needs no
`else`.
'''

