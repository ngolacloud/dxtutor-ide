[unit.step.gabarito]
solution = '''
sealed interface Expr

data class Num(val value: Int) : Expr
data class Var(val name: String) : Expr
data class Neg(val arg: Expr) : Expr
data class Add(val left: Expr, val right: Expr) : Expr
data class Mul(val left: Expr, val right: Expr) : Expr
data class Div(val left: Expr, val right: Expr) : Expr

sealed interface EvalResult

data class Ok(val value: Int) : EvalResult
data class Err(val message: String) : EvalResult

fun eval(e: Expr, env: Map<String, Int>): EvalResult = when (e) {
    is Num -> Ok(e.value)
    is Var -> env[e.name]?.let { Ok(it) } ?: Err("unknown variable ${e.name}")
    is Neg -> when (val r = eval(e.arg, env)) {
        is Ok -> Ok(-r.value)
        is Err -> r
    }
    is Add -> binary(e.left, e.right, env) { a, b -> Ok(a + b) }
    is Mul -> binary(e.left, e.right, env) { a, b -> Ok(a * b) }
    is Div -> binary(e.left, e.right, env) { a, b ->
        if (b == 0) Err("division by zero") else Ok(a / b)
    }
}

private fun binary(
    left: Expr,
    right: Expr,
    env: Map<String, Int>,
    op: (Int, Int) -> EvalResult,
): EvalResult {
    val l = when (val r = eval(left, env)) {
        is Ok -> r.value
        is Err -> return r
    }
    val rv = when (val r = eval(right, env)) {
        is Ok -> r.value
        is Err -> return r
    }
    return op(l, rv)
}
'''
time = "O(n)"
space = "O(h)"
justification = '''
Let `n` be the number of nodes in the tree and `h` its height. `eval` visits each node at most
once and does constant work there: a map lookup (expected O(1) in a hash map), an arithmetic
operation, or a `when` over a result. So the time is **O(n)**. An error can only make it
faster, because the walk stops climbing as soon as `return r` hands the `Err` back up.

The extra space is the recursion stack: one frame per node on the current path from the root,
so **O(h)**. For a balanced tree that is O(log n); for the degenerate chain in the tests
(5,000 nested `Add`s) it is O(n). The results themselves are tiny `Ok` and `Err` objects that
are discarded as soon as their parent has used them.

`when (val r = eval(...))` binds the result and smart-casts it in each branch, and `is Err ->
return r` both propagates the error and leaves `l` typed as a plain `Int`. Because both `when`s
are exhaustive without `else`, adding a new `Expr` node such as `Mod` would stop this file from
compiling until it is handled. That is exactly the guarantee the sealed types buy.
'''

[[unit]]
id = "kt-u14-extensions"
title = "Extension functions and properties"
level = "intermediate"
difficulty = 14
intro = '''
Extensions let you add functions and properties to a type you don't own, such as `String`, `Int`
or `List`, and call them with ordinary dot syntax. Much of Kotlin's standard library is built this
way. You will write extension functions and properties, extend nullable and generic types, see
why extensions are resolved at compile time, and finish with a small toolkit of text helpers.
'''
concepts = '''
## The idea

Often you want an operation that "belongs" to a type you can't edit: `isPalindrome` on
`String`, or `secondOrNull` on a list. In Java the answer is a utility class full of static
methods, `StringUtils.isPalindrome(s)`, which reads inside out and hides the operation from
auto-completion. An **extension** gives the same static function a nicer call site: `s.isPalindrome()`.

Crucially, an extension does **not** modify the class. Nothing is inserted into `String`.
The compiler simply rewrites `s.isPalindrome()` as a call to a static function that receives `s`
as its first argument.

## How Kotlin does it

Prefix the function name with the type being extended, the **receiver type**. Inside the body,
`this` is the receiver, and it can be left implicit:

```kotlin
fun Int.isEven(): Boolean = this % 2 == 0
fun String.words(): List<String> = trim().split(" ")

println(10.isEven())        // true
```

**Extension properties** work the same way but have no backing field, so they need a getter:

```kotlin
val String.lastChar: Char
    get() = this[length - 1]
```

Receivers may be **nullable**, in which case the extension can be called on `null` and must
deal with it; `isNullOrEmpty()` in the standard library is one. They may also be **generic**:
`fun <T> List<T>.secondOrNull(): T?` works for every list.

An extension is visible where it is declared. A top-level one is usable in its file and package,
and elsewhere after an `import`. One declared inside a class or function is only visible there,
which is a good way to keep a helper local.

## Pitfalls and compiler errors

- **Extensions are resolved statically.** The receiver's *declared* type picks the function,
  not the object's run-time class. If `fun Shape.kind()` and `fun Circle.kind()` both exist, a
  `Circle` stored in a `val s: Shape` calls the `Shape` version. Extensions are not virtual.
- **Members win.** If the class already has a member with the same signature, the member is
  called and the extension is ignored, with only a warning ("Extension is shadowed by a member").
- **No access to private members.** An extension is outside the class, so it sees only what
  is public (or internal); you'll get "Cannot access 'x': it is private in 'Foo'".
- **"Extension property cannot be initialized because it has no backing field"**:
  `val String.n: Int = 0` is illegal; write a getter.
- Calling an extension on a nullable value whose receiver is not nullable is the usual
  "Only safe (?.) or non-null asserted (!!.) calls are allowed" error: use `s?.isPalindrome()`.

## What you will practise

You will add helpers to `String` and `Int`, write extension properties and an extension on a
nullable receiver, and observe static resolution and member precedence. The challenge asks for a
URL slug generator, a word-count property and a null-tolerant ellipsis function.
'''

[[unit.step]]
kind = "concept"
id = "kt-u14-c1-receivers"
title = "Receivers and static dispatch"
points = 5
difficulty = 14
intro = '''
An extension function is syntactic sugar over a static function whose first parameter is the
receiver. Knowing that one fact explains every rule about extensions: why they can't see private
members, why they can't be overridden, and why the declared type decides which one is called.
'''
body = '''
## What the compiler generates

You write:

```kotlin
fun String.shout(): String = uppercase() + "!"

println("hi".shout())
```

The compiler produces, in effect, a static method `shout(receiver: String)` on a class named
after the file (for `Main.kt`, `MainKt`), and turns the call into `shout("hi")`. Inside the body,
`this` is that receiver parameter, and calls such as `uppercase()` mean `this.uppercase()`.

## Consequences

- **The class is untouched.** You can extend `String`, which is `final`, and even `Int`.
- **Only public API is visible**, because the code really lives outside the class.
- **Dispatch is static.** Which extension runs is decided at compile time from the declared
  type of the expression, never from the object's run-time class. Member functions, by contrast,
  are dispatched dynamically, as you saw with `open` and `override`.
- **A member with the same signature always wins** over an extension.

## Properties and nullable receivers

```kotlin
val String.initial: Char
    get() = first()

fun String?.orDash(): String = if (isNullOrEmpty()) "-" else this
```

An extension property is a getter in disguise: it stores nothing. An extension on `String?`
can be called on `null` safely, because the null check happens inside it.

Extensions are a tool for **readability**. Add them when an operation reads naturally as
`value.operation()`, and keep them close to where they are used.
'''

