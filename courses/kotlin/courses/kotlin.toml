[unit.step.gabarito]
solution = '''
private val SKU_FORMAT = Regex("[A-Z]{3}-[0-9]{4}")

@JvmInline
value class Sku(val code: String) {
    init {
        require(SKU_FORMAT.matches(code)) { "invalid SKU: '$code'" }
    }
}

@JvmInline
value class Quantity(val count: Int) {
    init {
        require(count in 1..999) { "quantity must be 1..999, got $count" }
    }

    operator fun plus(other: Quantity): Quantity = Quantity(count + other.count)
}

data class Line(val sku: Sku, val qty: Quantity)

data class Order(val id: String, val lines: List<Line> = emptyList()) {
    init {
        require(id.isNotBlank()) { "order id must not be blank" }
    }

    fun add(sku: Sku, qty: Quantity): Order {
        val i = lines.indexOfFirst { it.sku == sku }
        if (i < 0) return copy(lines = lines + Line(sku, qty))
        val merged = lines.toMutableList()
        merged[i] = Line(sku, lines[i].qty + qty)
        return copy(lines = merged.toList())
    }

    fun remove(sku: Sku): Order =
        if (lines.none { it.sku == sku }) this else copy(lines = lines.filter { it.sku != sku })

    fun quantityOf(sku: Sku): Quantity? = lines.firstOrNull { it.sku == sku }?.qty

    val totalItems: Int
        get() = lines.sumOf { it.qty.count }
}
'''
time = "O(n) per operation, n = number of lines"
space = "O(n) per new version"
justification = '''
`Sku` and `Quantity` validate in **O(1)**: the regular expression checks a string of fixed
length and the range check is two comparisons.

Each `Order` operation is **O(n)** in the number of lines. `add` searches for the SKU with
`indexOfFirst` (O(n)) and then builds a new list, either `lines + line` or a modified copy,
which copies n references. `remove` scans and filters, `quantityOf` scans, and `totalItems`
sums every line: all O(n). The old version is never touched, so every update allocates a
new list of n references: **O(n) space per version**. The `Line`, `Sku` and `Quantity` values
themselves are shared between versions, not copied.

That cost is the price of a plain `List`. A persistent structure, such as a hash trie,
would make updates O(log n) by sharing most of the old structure, but for orders with a few
dozen lines the simple copy is faster in practice and far easier to reason about. Putting
the checks in `init` blocks means they also run through `copy` and through `Quantity`'s own
`plus`, so the merge-past-999 rule needs no extra code.
'''

[[unit]]
id = "kt-u29-stacks-queues"
title = "Stacks and queues"
level = "advanced"
difficulty = 29
intro = '''
Stacks hand back the newest item first and queues the oldest, and between them they power
undo, parsing, scheduling and graph search. You will use Kotlin's `ArrayDeque` as a stack to
match brackets and as a queue to find shortest paths in a maze, build a queue out of two
stacks, and finish with a growable circular deque written by hand.
'''
concepts = '''
## The idea

A **stack** is last-in, first-out (LIFO): you push onto the top and pop from the top, like a
pile of plates. Undo histories, the call stack of a running program, bracket matching and
depth-first search are stacks. A **queue** is first-in, first-out (FIFO): you add at the back
and remove from the front, like a line at a counter. Task schedulers, message buffers and
breadth-first search are queues. A **deque** (double-ended queue, said "deck") allows both
ends and can play either role.

## How Kotlin does it

`kotlin.collections.ArrayDeque<E>` is the go-to implementation of all three. It is a
**circular array**: the front can sit anywhere in the array and wraps around its end, so
adding or removing at either end is amortized O(1) and nothing is shifted.

```kotlin
val stack = ArrayDeque<Int>()
stack.addLast(1)
stack.addLast(2)
stack.removeLast()          // 2: the top of the stack

val line = ArrayDeque(listOf("first", "second"))
line.removeFirst()          // "first": the front of the queue
```

`removeFirst` and `removeLast` throw `NoSuchElementException` on an empty deque, while
`removeFirstOrNull`, `removeLastOrNull`, `firstOrNull` and `lastOrNull` return `null`.
Kotlin's `ArrayDeque` is also a `MutableList`, so `d[i]` is O(1), and unlike
`java.util.ArrayDeque` it accepts `null` elements.

A `MutableList` is also a fine stack, because adding and removing at the end is amortized
O(1). Popping with `list.removeAt(list.lastIndex)` works everywhere.

## Building them by hand

Underneath, a stack is an array plus a size: push writes slot `size` and increments it, pop
decrements it and reads that slot. A queue in an array needs **wraparound**: keep a `head`
index and a `size`; the back slot is `(head + size) % capacity`, and removing from the front
advances `head = (head + 1) % capacity`. Growing a full circular buffer means copying the
elements into a bigger array **in logical order**, because physically they may be split
around the end of the array.

## What is special or tricky

- **`removeAt(0)` is O(n).** A `MutableList` looks like a queue, but every removal at the
  front shifts all the other elements: 100,000 removals cost billions of moves.
- **Two `ArrayDeque`s.** With `import java.util.*`, the name `ArrayDeque` means the Java class
  (`push`/`pop`/`poll`, no `null`s), not Kotlin's. Avoid star-importing `java.util`.
- **Don't use `java.util.Stack`.** It is a synchronized legacy class.
- **`removeLast()` on a `MutableList`** compiles to a method that is new in JDK 21, which
  crashes on older Android versions. Prefer `removeAt(lastIndex)` or `removeLastOrNull()`.
- **Generic arrays.** `Array<T>(n)` needs a reified `T`; hand-written containers store an
  `arrayOfNulls<Any?>(n)` and cast on the way out with `@Suppress("UNCHECKED_CAST")`.
- **Loitering.** When you remove by hand, set the freed slot to `null`, or the array keeps the
  object alive.

## What you will practise

You will check balanced brackets with a stack, find the shortest path through a maze with a
queue, and build a queue from two stacks. The challenge is `RingDeque`, a circular deque that
grows by doubling and matches `ArrayDeque` operation for operation.
'''

[[unit.step]]
kind = "concept"
id = "kt-u29-c1-lifo-fifo"
title = "LIFO, FIFO and the ring"
points = 5
difficulty = 29
intro = '''
Stacks and queues are defined by **which end** you remove from, not by how they are stored.
A circular array gives both O(1) ends without ever shifting an element.
'''
body = '''
## Two disciplines

- **Stack (LIFO):** the element removed is always the one added most recently. Nesting is a
  stack: the innermost open bracket, function call or HTML tag must close first.
- **Queue (FIFO):** the element removed is always the one waiting longest. Fairness is a
  queue: requests, jobs and the frontier of a breadth-first search are served in arrival
  order.

## Why an array, and why a ring

An array-backed stack only touches the end of its array, so it never shifts anything. A
queue is harder: it adds at one end and removes at the other. If the front were always index
0, each removal would shift every remaining element, which costs O(n).

The fix is to let the front **move**. Keep `head`, the index of the first element, and
`size`. Removing from the front advances `head`; adding at the back writes slot
`(head + size) % capacity`. When an index passes the end of the array it wraps to 0, so the
array behaves like a ring:

```text
capacity 8, head 6, size 4:   [ c  d  .  .  .  .  a  b ]
                                 front is a at index 6, back is d at index 1
```

## Growing the ring

When `size == capacity`, allocate an array twice as large and copy the elements **in logical
order**, from `head` around to the back, into slots 0, 1, 2 and so on, then reset `head` to 0.
Doubling makes each element's share of the copying a constant, so adds stay amortized O(1).
This is how `ArrayDeque` works, and the challenge asks you to build exactly this.
'''

[[unit.step]]
kind = "drill"
