[unit.step.gabarito]
solution = '''
data class ConnectionSettings(
    var host: String = "localhost",
    var port: Int = 5432,
    var useTls: Boolean = false,
    var timeoutMs: Long = 5_000,
)

fun settingsFrom(props: Map<String, String>, warnings: MutableList<String>): ConnectionSettings =
    ConnectionSettings().apply {
        props["host"]?.trim()?.let { value ->
            if (value.isNotEmpty()) host = value else warnings += "host is blank"
        }
        props["port"]?.let { raw ->
            val parsed = raw.trim().toIntOrNull()?.takeIf { it in 1..65535 }
            if (parsed != null) port = parsed else warnings += "invalid port '$raw'"
        }
        props["tls"]?.let { raw ->
            when (raw.trim().lowercase()) {
                "true" -> useTls = true
                "false" -> useTls = false
                else -> warnings += "invalid tls '$raw'"
            }
        }
        props["timeoutMs"]?.let { raw ->
            val parsed = raw.trim().toLongOrNull()?.takeIf { it > 0 }
            if (parsed != null) timeoutMs = parsed else warnings += "invalid timeoutMs '$raw'"
        }
    }
'''
time = "O(L)"
space = "O(L)"
justification = '''
Let `L` be the total length of the four values that are looked at. The function performs exactly
four lookups in a hash map, each **O(1)** on average, however many unrelated keys the map holds:
keys it never asks for cost nothing. Each value that is present is trimmed, parsed and possibly
copied into a warning, which is linear in its length, so the total time is **O(L)**, independent
of the number of entries in `props`. The space is **O(L)** too: one `ConnectionSettings` object
plus at most four trimmed strings and four warnings.

`apply` makes the new object the receiver, so every assignment reads `port = parsed` with no
prefix, and the expression's value is the configured object itself. Each override sits in its own
`?.let`, which runs only when the key exists, and `takeIf` folds the range check into the same
null-aware chain as the parse, so "not a number" and "out of range" become the same `null`.
Because each rule is checked independently, one bad value never stops the others, and the
warnings come out in a fixed order no matter how the map happens to iterate.
'''

[[unit]]
id = "kt-u17-errors"
title = "Errors: exceptions, require/check and Result"
level = "intermediate"
difficulty = 17
intro = '''
Things go wrong in production code: input is malformed, a value is missing, an object is used in
the wrong state. Kotlin keeps the JVM's exceptions but drops checked exceptions, adds one-line
precondition checks, and offers `Result` for code that wants to treat failure as a value. You will
learn when to throw, when to return a failure, and how to keep the two apart.
'''
concepts = '''
## The idea

An **exception** is an object that describes a failure. Throwing it abandons the current
function and unwinds the call stack until some caller catches it. That is the right tool when the
caller cannot reasonably continue: a broken invariant, a programming mistake. But some failures
are *expected*: a user typed `12a` into a quantity field, a line of a CSV file has four columns.
For those, it is often clearer to return a value that says "this failed, and here is why", so the
caller has to look at it.

## How Kotlin does it

Kotlin uses the JVM's exception classes, and `throw` and `try`/`catch`/`finally` look like
Java's, with two differences that matter:

- **No checked exceptions.** Nothing forces you to catch or declare an `IOException`, and there is
  no `throws` clause. The flip side is that the compiler will not remind you what a function can
  throw, so document it.
- **`try` and `throw` are expressions.** A `try` evaluates to the value of the block that ran, and
  `throw` has the type `Nothing`, so it fits wherever a value is expected, for example after `?:`.

```kotlin
val n = try { text.toInt() } catch (e: NumberFormatException) { 0 }
val name = form["name"] ?: throw IllegalArgumentException("name is required")
```

The standard library adds **precondition functions** that throw with a lazily built message:

- `require(cond) { msg }` throws `IllegalArgumentException`: the *caller* passed a bad argument.
- `check(cond) { msg }` throws `IllegalStateException`: the *object* is in the wrong state.
- `requireNotNull(x)` and `checkNotNull(x)` return `x` as non-null or throw; `error(msg)` always
  throws `IllegalStateException`.

For failure as a value there is **`Result<T>`**. `runCatching { … }` runs a block and captures
either its value or the exception it threw. You then inspect it with `isSuccess`, `getOrNull()`,
`getOrDefault(x)`, `exceptionOrNull()`, transform it with `map`, react with `onSuccess` and
`onFailure`, or collapse both cases into one value with `fold`.

```kotlin
val result: Result<Int> = runCatching { "42".toInt() }
println(result.map { it * 2 }.getOrDefault(-1))   // 84
```

## Pitfalls

- **Catching too much.** `catch (e: Exception)` also swallows the bugs you wanted to see; catch
  the specific type. `runCatching` catches *every* `Throwable`, including `Error`s and coroutine
  cancellation, so use it at boundaries (parsing input, calling a service), not around whole
  programs.
- **Branches of a `try` must agree.** `val n: Int = try { s.toInt() } catch (e: Exception) { "none" }`
  fails with `initializer type mismatch: expected 'Int', actual 'Comparable<*> & Serializable'`:
  the compiler found the common supertype of `Int` and `String`.
- **`NumberFormatException` is an `IllegalArgumentException`.** A `catch` for the parent placed
  first also catches parse errors.
- **`finally` always runs**, even after a `return` inside `try`. Use it for cleanup, never to
  produce a value.

## What you will practise

You will guard a class with `require` and `check`, use `try` and `error` as expressions, collect
several outcomes with `runCatching` and `fold`, and then write an order importer that reports
every bad line instead of stopping at the first one.
'''

[[unit.step]]
kind = "concept"
id = "kt-u17-c1-throw-or-return"
title = "Throw, or return a failure?"
points = 5
difficulty = 17
intro = '''
Not every failure deserves the same treatment. A broken promise between two pieces of code should
stop the program loudly, while bad input is part of normal operation and should come back as a
value the caller can handle.
'''
body = '''
## Two kinds of failure

**Bugs and broken promises.** A negative deposit, a method called on a closed account, an index
past the end. The caller did something it should never do, and continuing would only spread the
damage. Throw, and throw early:

```kotlin
fun withdraw(cents: Long) {
    require(cents > 0) { "amount must be positive" }    // IllegalArgumentException
    check(isOpen) { "account is closed" }               // IllegalStateException
    balance -= cents
}
```

**Expected, everyday failures.** Untrusted input that does not parse, a record that is missing a
field. These are part of normal operation, and the caller usually wants to handle *many* of them:
skip the record, report it, carry on. Returning a `Result` makes that explicit in the type:

```kotlin
fun parseQuantity(text: String): Result<Int> = runCatching {
    val n = text.trim().toInt()
    require(n > 0) { "quantity must be positive" }
    n
}
```

Inside `runCatching` you still use `require` and friends: they throw, `runCatching` catches, and
the caller receives a `Result.failure` that holds the exception, message included.

## Reading a Result

`getOrNull()` gives the value or `null`, `exceptionOrNull()` gives the error or `null`, and
`fold(onSuccess, onFailure)` turns both cases into one value. None of them throws, except
`getOrThrow()`, which rethrows the stored exception: use it only where a failure really is
unexpected.
'''

