target = '''
data class Address(val city: String, val zip: String)

data class Customer(val name: String, val address: Address, val tags: List<String> = emptyList())

fun Customer.moveTo(city: String): Customer = copy(address = address.copy(city = city))

fun Customer.tag(t: String): Customer = if (t in tags) this else copy(tags = tags + t)

fun main() {
