entry = "toSlug"
intro = '''
Text normalisation is everyday systems work: URL slugs, word counts and truncated previews appear
in every web app. Each of these is a single linear scan over the characters, and writing them as
extensions makes call sites read like plain English: `title.toSlug()`.
