]
explanation = '''
The program printed `order placed`, then `launched: active=true`, then `tea is ready`, and
finally `joined: completed=true`. `launch` only queued the child, so the parent kept running
and printed the second line first. A job counts as active from the moment it is launched
until it completes. `join()` suspended the parent, which let the single `runBlocking` thread
run the child: it waited 20 ms in `delay`, printed its result and finished, and then the
parent resumed after `join`.
'''

