target = '''
interface Repository {
    fun find(id: Int): String?
    fun save(id: Int, value: String)
}

class MemoryRepository : Repository {
    private val rows = mutableMapOf<Int, String>()
    override fun find(id: Int): String? = rows[id]
    override fun save(id: Int, value: String) {
        rows[id] = value
    }
}

class LoggingRepository(private val inner: Repository) : Repository by inner {
    val calls = mutableListOf<String>()

    override fun save(id: Int, value: String) {
        calls += "save $id"
        inner.save(id, value)
    }
}

fun main() {
    val repo = LoggingRepository(MemoryRepository())
    repo.save(1, "ana")
    repo.save(2, "rui")
    println(repo.find(1))
    println(repo.find(3))
    println(repo.calls)
}
