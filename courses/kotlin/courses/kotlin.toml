intro = '''
On a rendezvous channel the sender and the receiver must meet. When one side arrives and the
other is already waiting, the value is handed over directly and the arriving side carries on;
otherwise it suspends. The printed interleaving shows exactly when each side waited.
'''
prompt = '''
Launch a kitchen coroutine that sends three dishes through a channel and closes it, and let the
main coroutine serve dishes with a `for` loop until the channel is closed.

**Why:** this is the smallest complete channel protocol: send, receive, close, and a consumer
loop that ends on its own.
'''
target = '''
import kotlinx.coroutines.channels.Channel
import kotlinx.coroutines.launch
import kotlinx.coroutines.runBlocking

fun main() = runBlocking {
    val orders = Channel<String>()
    launch {
        for (dish in listOf("soup", "pasta", "cake")) {
            println("kitchen sends $dish")
            orders.send(dish)
        }
        orders.close()
        println("kitchen closed")
