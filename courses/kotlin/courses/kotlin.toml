[[unit]]
id = "kt-u26-dsl-builders"
title = "DSLs and type-safe builders"
level = "advanced"
difficulty = 26
intro = '''
Gradle build scripts, Ktor routes, kotlinx.html pages and Jetpack Compose screens all read
like a description of the thing they build, yet they are plain, compiler-checked Kotlin. You
will learn the one feature behind them, the lambda with a receiver, use the standard library
builders, write an HTML builder and a configuration DSL, and finish with a JSON builder.
'''
concepts = '''
## The idea

A **domain-specific language** (DSL) is a small notation for one job: describing a web page,
a build, a route table, a document. An **internal** DSL is not a new language at all. It is
ordinary code in a host language, arranged so that it reads like a description instead of a
series of calls. Because it is real code, the compiler checks every name and type, the IDE
completes it, and you can mix in loops and `if`s wherever you like.

The shape is always the same **builder** pattern: create an object, let a block of code
configure it, then attach or render the result. Nesting blocks inside blocks gives you a
tree, which is why HTML, JSON and configuration files fit so well.

## How Kotlin does it

The key feature is the **function type with a receiver**, written `T.() -> Unit`. A lambda of
that type runs as if it were a member of `T`: inside it, `this` is a `T`, and `T`'s members can
be called without a qualifier.

```kotlin
fun greeting(block: StringBuilder.() -> Unit): String {
    val sb = StringBuilder()
    sb.block()                    // run the lambda with sb as `this`
    return sb.toString()
}

val text = greeting { append("Hi, "); append("Kotlin") }
```

The standard library ships builders made this way: `buildString`, `buildList`, `buildMap`
and `buildSet`, and the scope function `apply` is just `T.() -> Unit` plus `return this`.

A **type-safe builder** has one class per kind of node and one function per child the node
may contain. Each function creates the child, configures it with the caller's lambda and
attaches it:

```kotlin
class Menu(val title: String) {
    val items = mutableListOf<String>()
    fun item(name: String) { items += name }
}

fun menu(title: String, block: Menu.() -> Unit): Menu = Menu(title).apply(block)
```

Java has no lambdas with receivers, so Java builders chain calls (`.add(...).add(...)`) and
cannot nest blocks this naturally.

## Keeping scopes apart

Inside nested blocks, every outer receiver is still in scope, so a typo can silently call
the outer builder. Mark the builder classes with an annotation that is itself annotated
`@DslMarker`, and the compiler stops implicit calls to an outer receiver of the same DSL:

```text
error: 'var port: Int' cannot be called in this context with an implicit receiver.
```

You can still reach it on purpose with a labelled `this@server.port`.

## What is special or tricky

- `T.() -> Unit` and `(T) -> Unit` are different: the second one uses `it`, not `this`.
- If your function never calls `block`, the builder stays empty and nothing complains.
- A block's last expression is discarded when its type is `Unit`, so a bare `"text"` inside a
  block does nothing. Provide a function such as `text("...")` instead.
- Calling a builder function outside its block fails with **Unresolved reference**: it only
  exists on the receiver.

## What you will practise

You will write lambdas with receivers and use `buildString` and `buildList`, render a small
HTML tree, and protect a configuration DSL with `@DslMarker`. The challenge is a JSON
builder that renders compact, correctly escaped JSON from nested blocks.
'''

[[unit.step]]
kind = "concept"
id = "kt-u26-c1-receivers"
title = "Lambdas with a receiver"
points = 5
difficulty = 26
intro = '''
An ordinary lambda receives its context as a parameter; a lambda with a receiver receives it
as `this`. That single change is what turns a chain of calls into a nested, declarative
block.
'''
body = '''
## Two ways to pass the same object

```kotlin
val a: (StringBuilder) -> Unit = { it.append("x") }
val b: StringBuilder.() -> Unit = { append("x") }
```

Both take a `StringBuilder`. In `a` it arrives as the parameter `it`; in `b` it arrives as
the **receiver**, so `append` resolves to `this.append`. You call the second one either as
`sb.b()`, like an extension function, or as `b(sb)`. The general form is `A.(P) -> R`: a
receiver of type `A`, parameters `P`, and a result `R`.

## Builders are create, configure, attach

The standard library's `apply` is nothing more than this:

```kotlin
inline fun <T> T.apply(block: T.() -> Unit): T {
    block()
    return this
}
```

A builder function uses the same three steps. It **creates** a node, lets the caller's
lambda **configure** it, then **attaches** the node to its parent or renders it. Because
each block's receiver is the node being built, nested blocks build nested nodes, and the
shape of the code mirrors the shape of the output.

## Why it is type-safe

Inside a `Menu.() -> Unit` block, only `Menu`'s members are available without a
qualifier. A misspelt `iten("tea")` is a compile error, not a broken page at run time, and the
IDE completes exactly the children each node allows. `@DslMarker` tightens this further by
hiding the members of the outer receivers, so each block sees only its own node.
'''

