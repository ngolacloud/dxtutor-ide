prompt = '''
Write `TwoStackQueue<T>` with an inbox and an outbox, both popped only at their end with
`removeAt(lastIndex)`, then interleave enqueues and dequeues and dequeue from an empty queue.

**Why:** this is the classic amortized-analysis example, and the same trick appears in
functional languages, where immutable lists only support cheap access at one end.
'''
target = '''
class TwoStackQueue<T> {
    private val inbox = ArrayList<T>()
    private val outbox = ArrayList<T>()

    fun enqueue(value: T) {
        inbox.add(value)
    }

    fun dequeue(): T {
        if (outbox.isEmpty()) {
            while (inbox.isNotEmpty()) outbox.add(inbox.removeAt(inbox.lastIndex))
        }
        if (outbox.isEmpty()) throw NoSuchElementException("queue is empty")
        return outbox.removeAt(outbox.lastIndex)
    }

    val size: Int get() = inbox.size + outbox.size
}

fun main() {
    val q = TwoStackQueue<String>()
    q.enqueue("a")
    q.enqueue("b")
    q.enqueue("c")
    print(q.dequeue())
    q.enqueue("d")
    while (q.size > 0) print(q.dequeue())
    println()
    println(runCatching { q.dequeue() }.exceptionOrNull())
}
'''
