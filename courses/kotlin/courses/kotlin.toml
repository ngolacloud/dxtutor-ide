[[unit.step]]
kind = "challenge"
id = "kt-u05-x1-primes-collatz"
title = "Primes and the Collatz sequence"
points = 20
difficulty = 5
entry = "isPrime"
intro = '''
Two classic loop problems, each with a trap. Testing for primality by trial division is fast
only if you stop at the square root, and the obvious way of writing that stopping condition
overflows for the largest `Int`. The Collatz sequence is a `while` loop whose values can climb
far beyond `Int.MAX_VALUE` before they come back down to 1.
'''
instructions = '''
## Your turn

Implement two functions:

```kotlin
fun isPrime(n: Int): Boolean
fun collatzSteps(start: Long): Int
```

**`isPrime`** returns `true` when `n` is a prime number: greater than 1 and divisible only by 1
and by itself. Numbers below 2, including negatives, are not prime. `n` can be as large as
`Int.MAX_VALUE`, and the tests call the function on several large values, so it must not try
every number below `n`: if `n` has a divisor at all, it has one no larger than √n.

**`collatzSteps`** counts how many steps the Collatz sequence needs to go from `start` down to
1. One step turns an even number `n` into `n / 2` and an odd number into `3 * n + 1`.
`collatzSteps(1)` is `0`. The values in between can grow much larger than `start` (starting at
113,383 the sequence passes 2,482,111,348, beyond `Int.MAX_VALUE`), which is why it works with
`Long`. If `start` is less than 1, the sequence never reaches 1, so throw an
`IllegalArgumentException` instead of looping forever.

Examples:

- `isPrime(2)` → `true`, `isPrime(97)` → `true`, `isPrime(1)` → `false`, `isPrime(91)` → `false`
- `isPrime(2147483647)` → `true` (that is `Int.MAX_VALUE`)
- `collatzSteps(6)` → `8`, `collatzSteps(27)` → `111`
- `collatzSteps(0)` throws `IllegalArgumentException`

**Hint:** for `isPrime`, try divisors `d` while `d * d <= n`, but notice that `d * d` itself
can overflow an `Int` near the top of the range. The condition `d <= n / d` says the same thing
without multiplying. Return as soon as you know the answer.

Hidden tests decide correctness.
'''
