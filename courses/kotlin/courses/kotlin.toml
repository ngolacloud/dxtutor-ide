intro = '''
An abstract class is a template: it fixes the shared state and algorithm and leaves holes,
abstract members, that every concrete subclass must fill. An override that wants to extend
rather than replace the parent's behaviour calls it with `super`, which skips dynamic dispatch and
runs the parent's body directly.
'''
prompt = '''
Write an abstract `Shape` with an abstract `area()` and an `open` `describe()`, implement it in
`Rect` and `Triangle`, and let `Rect` decorate the parent's description through `super`.

**Why:** abstract members force every subclass to provide the missing piece, and `super` lets
an override build on the parent's logic instead of copying it.
'''
target = '''
abstract class Shape(val label: String) {
    abstract fun area(): Double

    open fun describe(): String = "$label with area ${area()}"
}

class Rect(val w: Double, val h: Double) : Shape("rect") {
    override fun area(): Double = w * h

    override fun describe(): String {
        val base = super.describe()
        return if (w == h) "$base (a square)" else base
    }
}

class Triangle(val base: Double, val height: Double) : Shape("triangle") {
    override fun area(): Double = base * height / 2
