instructions = '''
## Your turn

Implement `editDistance`:

```kotlin
fun editDistance(a: String, b: String): Int
```

Return the minimum number of single-character edits (insert a character, delete a character,
or substitute one character for another) needed to turn `a` into `b`. Characters are compared
exactly, so case matters.

Examples:

- `editDistance("kitten", "sitting")` returns `3` (k→s, e→i, insert g).
- `editDistance("", "abc")` returns `3`.
- `editDistance("flaw", "lawn")` returns `2` (delete f, insert n).
- `editDistance("same", "same")` returns `0`.

The hidden tests use strings of up to 3,000 characters. Naive recursion branches three ways
at every step and is exponential, so fill a table bottom-up.

**Hint:** let `d[i][j]` be the edit distance between the first `i` characters of `a` and the
first `j` characters of `b`. Row 0 and column 0 are easy (only insertions or only deletions).
For the other cells, think about the last character of each prefix: either they match, or the
last edit was an insertion, a deletion or a substitution. Each row depends only on the row
above it.

Hidden tests decide correctness.
'''
starter = '''
// The minimum number of single-character insertions, deletions and substitutions that turn
// a into b. Fill a table bottom-up.
fun editDistance(a: String, b: String): Int {
    TODO("not implemented")
}
'''
tests = '''
import kotlin.random.Random
fun reference(a: String, b: String): Int {
    val d = Array(a.length + 1) { IntArray(b.length + 1) }
    for (i in 0..a.length) d[i][0] = i
    for (j in 0..b.length) d[0][j] = j
    for (i in 1..a.length) for (j in 1..b.length) {
        val cost = if (a[i - 1] == b[j - 1]) 0 else 1
        d[i][j] = minOf(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost)
    }
    return d[a.length][b.length]
}
fun randomWord(rnd: Random, length: Int, alphabet: String): String =
    String(CharArray(length) { alphabet[rnd.nextInt(alphabet.length)] })
test("the examples") {
    equal(editDistance("kitten", "sitting"), 3)
    equal(editDistance("", "abc"), 3)
    equal(editDistance("flaw", "lawn"), 2)
    equal(editDistance("same", "same"), 0)
}
test("empty strings") {
    equal(editDistance("", ""), 0)
    equal(editDistance("abcd", ""), 4)
    equal(editDistance("", "x"), 1)
}
test("single edits and case") {
    equal(editDistance("cat", "cut"), 1)
    equal(editDistance("cat", "cats"), 1)
    equal(editDistance("cat", "at"), 1)
    equal(editDistance("Cat", "cat"), 1)
    equal(editDistance("abc", "xyz"), 3)
    equal(editDistance("ab", "ba"), 2)
}
test("symmetric and bounded") {
    val pairs = listOf("sunday" to "saturday", "intention" to "execution", "abc" to "", "a" to "aaaa")
    for ((x, y) in pairs) {
        equal(editDistance(x, y), editDistance(y, x))
        val d = editDistance(x, y)
        expect(d >= kotlin.math.abs(x.length - y.length), "the distance is at least the length difference")
        expect(d <= maxOf(x.length, y.length), "the distance is at most the longer length")
    }
    equal(editDistance("sunday", "saturday"), 3)
    equal(editDistance("intention", "execution"), 5)
}
test("random small strings match the reference") {
    val rnd = Random(11)
    repeat(300) {
        val x = randomWord(rnd, rnd.nextInt(0, 12), "abc")
        val y = randomWord(rnd, rnd.nextInt(0, 12), "abc")
        val got = editDistance(x, y)
        val want = reference(x, y)
        if (got != want) fail("editDistance(\"$x\", \"$y\") = $got, expected $want")
    }
}
test("long strings: 3,000 characters") {
    val rnd = Random(5)
    val x = randomWord(rnd, 2_000, "acgt")
    val y = randomWord(rnd, 1_800, "acgt")
    val want = reference(x, y)
    val start = System.nanoTime()
    equal(editDistance(x, y), want)
    equal(editDistance("a".repeat(3_000), "b".repeat(3_000)), 3_000)
    equal(editDistance("ab".repeat(1_500), "ab".repeat(1_500) + "c"), 1)
    val seconds = (System.nanoTime() - start) / 1e9
    expect(seconds < 2.0, "long inputs took ${seconds}s; the table should be O(len(a) * len(b))")
}
'''

[unit.step.gabarito]
solution = '''
fun editDistance(a: String, b: String): Int {
    // Keep the rows as short as possible: let `b` be the shorter string.
    if (b.length > a.length) return editDistance(b, a)
    var prev = IntArray(b.length + 1) { it }      // row 0: j insertions
    var cur = IntArray(b.length + 1)
    for (i in 1..a.length) {
        cur[0] = i                                // column 0: i deletions
        for (j in 1..b.length) {
            val cost = if (a[i - 1] == b[j - 1]) 0 else 1
            cur[j] = minOf(
                prev[j] + 1,                      // delete a[i - 1]
                cur[j - 1] + 1,                   // insert b[j - 1]
                prev[j - 1] + cost,               // substitute, or keep a match
            )
        }
        val done = prev
        prev = cur
        cur = done
    }
    return prev[b.length]
}
'''
time = "O(len(a) · len(b))"
space = "O(min(len(a), len(b)))"
justification = '''
There is one subproblem per pair of prefix lengths, `(len(a) + 1) × (len(b) + 1)` of them, and
each is filled in O(1) from three neighbours: the cell above (delete), the cell to the left
(insert) and the diagonal (substitute, free when the characters match). That gives
**O(len(a) · len(b))** time, about 3.6 million cheap steps for strings of 2,000 and 1,800
characters, while naive recursion branches three ways at every step and is exponential.

Row `i` depends only on row `i − 1`, so the solution keeps two `IntArray` rows and swaps them
instead of allocating the whole table. Swapping the arguments so that `b` is the shorter string
makes each row `min(len(a), len(b)) + 1` long, which gives **O(min(len(a), len(b)))** space.
The base cases are the first row (`j` insertions turn an empty prefix into `b`'s first `j`
characters) and the first column (`i` deletions). Filling the table bottom-up also avoids deep
recursion: a memoised top-down version would be just as fast asymptotically, but its call chain
can be `len(a) + len(b)` frames deep, and its map of boxed keys costs far more memory than two
arrays.
'''
