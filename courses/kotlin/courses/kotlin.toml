A hash table stores each key in a bucket chosen by its hash code **at insertion time**. If a
mutable key changes afterwards, its new hash code points to a different bucket, and the entry
is stranded: it is still in the table, but no lookup can reach it. The generated functions
also use only the primary-constructor properties, which decides what "equal" means for your
type.
