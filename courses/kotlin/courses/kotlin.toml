[unit.step.gabarito]
solution = '''
class Bst<T : Comparable<T>> {
    class Node<T>(var key: T) {
        var left: Node<T>? = null
        var right: Node<T>? = null
    }

    var root: Node<T>? = null
    var size: Int = 0

    fun insert(key: T): Boolean {
        val fresh = Node(key)
        var node: Node<T> = root ?: run {
            root = fresh
            size++
            return true
        }
        while (true) {
            val c = key.compareTo(node.key)
            if (c == 0) return false
            val next = if (c < 0) node.left else node.right
            if (next == null) {
                if (c < 0) node.left = fresh else node.right = fresh
                size++
                return true
            }
            node = next
        }
    }

    operator fun contains(key: T): Boolean {
        var node = root
        while (node != null) {
            val c = key.compareTo(node.key)
            if (c == 0) return true
            node = if (c < 0) node.left else node.right
        }
        return false
    }

    fun remove(key: T): Boolean {
        // Find the node and its parent with a loop.
        var parent: Node<T>? = null
        var node = root
        while (node != null) {
            val c = key.compareTo(node.key)
            if (c == 0) break
            parent = node
            node = if (c < 0) node.left else node.right
        }
        if (node == null) return false

        val left = node.left
        val right = node.right
        if (left != null && right != null) {
            // Two children: find the successor (leftmost node of the right subtree).
            var succParent: Node<T> = node
            var succ: Node<T> = right
            while (true) {
                val smaller = succ.left ?: break
                succParent = succ
                succ = smaller
            }
            node.key = succ.key
            // The successor has no left child: splice it out with its right child.
            if (succParent === node) node.right = succ.right else succParent.left = succ.right
        } else {
            // Zero or one child: the child (or null) takes the node's place.
            val child = left ?: right
            when {
                parent == null -> root = child
                parent.left === node -> parent.left = child
                else -> parent.right = child
            }
        }
        size--
        return true
    }

    fun height(): Int {
        // Level-order walk: count the levels, with no recursion.
        var level = ArrayList<Node<T>>()
        root?.let { level.add(it) }
        var h = 0
        while (level.isNotEmpty()) {
            h++
            val next = ArrayList<Node<T>>()
            for (n in level) {
                n.left?.let { next.add(it) }
                n.right?.let { next.add(it) }
            }
            level = next
        }
        return h
    }

    fun inOrder(): List<T> {
        val out = ArrayList<T>(size)
        val stack = ArrayDeque<Node<T>>()
        var node = root
        while (node != null || stack.isNotEmpty()) {
            while (node != null) {
                stack.addLast(node)
                node = node.left
            }
            val top = stack.removeLast()
            out.add(top.key)
            node = top.right
        }
        return out
    }
}
'''
time = "O(h) for insert, contains and remove (O(log n) on a random tree, O(n) on a chain); O(n) for height and inOrder"
space = "O(1) extra for insert, contains and remove; O(n) for height and inOrder"
justification = '''
`insert`, `contains` and `remove` each walk one path from the root downwards, doing constant
work per level, so they cost **O(h)**. In the two-children case `remove` continues down the
right subtree to the successor, but that is still the same downward path, and the successor
has no left child, so splicing it out is a single reference change. On the random tree of
100,000 keys h stays around 40, which is why 120,000 operations take milliseconds; on the
sorted chain h = n and each operation is O(n).

All three use loops with a fixed number of references (`parent`, `node`, `succ`), so their
extra space is **O(1)** and a 5,000-node chain cannot overflow the stack. A recursive version
that returns the new subtree root is shorter and equally correct, but it uses O(h) stack
frames. Copying the successor's key into the node keeps the shape and the order intact: the
successor is larger than everything in the left subtree and smaller than everything else in
the right one. Tracking the `parent` is what lets the root be deleted: when `parent` is
`null`, the child becomes the new `root`.

`height` and `inOrder` must visit every node, so they are **O(n)** time. The level-order walk
and the explicit stack hold O(n) nodes at most (O(h) for the stack), with no recursion.
'''

[[unit]]
id = "kt-u33-sorting-searching"
title = "Sorting and searching by hand"
level = "advanced"
difficulty = 33
intro = '''
The standard library sorts and searches for you, but knowing how it does so tells you what it
costs and when it breaks. You will write insertion sort, merge two sorted lists, implement
binary search without off-by-one errors, and finish by turning merge sort into an O(n log n)
inversion counter.
'''
concepts = '''
## The idea

**Sorting** puts items in order; **searching** finds one. They are linked: a sorted array can
be searched in O(log n) instead of O(n).

**Insertion sort** grows a sorted prefix one item at a time, shifting larger items right to
make room. It is O(n²) in the worst case (reversed input) but O(n) on nearly sorted input,
and it is very fast on small arrays, which is why real sorts use it for short runs.

**Merge sort** uses **divide and conquer**: split the list in half, sort each half
recursively, then **merge** the two sorted halves by repeatedly taking the smaller front item.
The recursion is log₂ n levels deep and each level merges n items, so it is **O(n log n)**
in every case. It is **stable**: equal items keep their original order, because the merge
takes from the left half on ties.

**Binary search** works on sorted data. Keep a range that must contain the answer, compare
with its middle, and discard half. After about log₂ n steps the range is empty: 17 steps for
100,000 items.

## How Kotlin does it

```kotlin
val xs = listOf(5, 2, 9)
xs.sorted()                         // a new list: [2, 5, 9]
xs.sortedByDescending { it }        // [9, 5, 2]
val words = mutableListOf("pear", "fig")
words.sortWith(compareBy({ it.length }, { it }))   // in place, by length then alphabetically
intArrayOf(1, 3, 5, 7).binarySearch(5)             // 2
```

On the JVM, `sorted()` on objects is TimSort (a stable merge/insertion hybrid), and
`IntArray.sort()` is a dual-pivot quicksort. `binarySearch` returns the index when found, or
`-(insertionPoint) - 1` when not, so a negative result still tells you where the item would go.

`IntArray` stores raw `int`s; `List<Int>` stores boxed `Integer` objects. For large numeric
work, `IntArray` is several times faster and smaller.

## What is special or tricky

- **Read-only lists have no `sort()`.** `listOf(3, 1).sort()` fails with *unresolved
  reference 'sort'*. Use `sorted()` for a new list, or sort a `MutableList` or array in place.
- **Overflow in the midpoint.** `(lo + hi) / 2` overflows when both are near `Int.MAX_VALUE`.
  Write `lo + (hi - lo) / 2` or `(lo + hi) ushr 1`.
- **Overflow in counts.** A count of pairs among 100,000 items can reach about 5·10⁹, more
  than an `Int` holds. Use `Long`, and write `0L` so the literal has the right type.
- **Off-by-one in binary search.** Pick one convention, such as the half-open range
  `[lo, hi)`, and keep it in the loop condition and in both updates.
- **Binary search needs sorted input.** On unsorted data it returns garbage, not an error.

## What you will practise

You will write insertion sort on an `IntArray` and count its shifts, merge sorted lists into a
merge sort, and write a lower-bound binary search. The challenge extends merge sort to count
inversions on 100,000 items, where an O(n²) solution is far too slow.
'''

[[unit.step]]
kind = "concept"
id = "kt-u33-c1-divide-conquer"
title = "Divide, conquer, merge"
points = 5
difficulty = 33
intro = '''
Divide and conquer solves a problem by splitting it into smaller copies of itself, solving
those, and combining the answers. Merge sort is its cleanest example, and binary search is the
same idea with only one half kept.
'''
body = '''
## Split, recurse, merge

```kotlin
fun mergeSort(items: List<Int>): List<Int> {
    if (items.size <= 1) return items                 // base case: already sorted
    val mid = items.size / 2
    val left = mergeSort(items.subList(0, mid))
    val right = mergeSort(items.subList(mid, items.size))
    return merge(left, right)
}
```

`merge` walks both sorted lists with two indexes, always taking the smaller front item, and
copies whatever is left at the end. Each item is copied once per merge, so merging is O(n).

## Why O(n log n)

Halving reaches size 1 after about log₂ n levels. At every level the merges together touch all
n items once. That is n work per level times log₂ n levels: **O(n log n)**. For 100,000
items that is under 2 million steps; an O(n²) sort needs about 5 billion.

## Stability

When the front items are equal, `merge` takes from the left half (`<=`, not `<`). Equal items
therefore keep their original order, which matters when you sort records by one field after
another.

## Binary search is the same idea

Compare the target with the middle of a sorted range and throw away the half that cannot
contain it. Only one half survives, so there is nothing to merge, and the cost is the number
of halvings: **O(log n)**.

## Counting while you merge

The merge step sees every pair of items that straddle the split point, in sorted order. That
makes it a natural place to compute things about such pairs, as the challenge does, without
ever looking at the pairs one by one.
'''

[[unit.step]]
