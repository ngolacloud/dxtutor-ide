prompt = '''
Generate the powers of two, a countdown that ends by itself, the Fibonacci numbers and a Collatz
trajectory, and cut each one down with `take`, `first` or `takeWhile`.

**Why:** many real streams have no natural end (ids, retries with back-off, the pages of an API).
Describing them as infinite sequences and limiting them where they are used keeps the two
concerns apart.
