[[unit]]
id = "kt-u07-null-safety"
title = "Null safety"
level = "intermediate"
difficulty = 7
intro = '''
In Kotlin, "may be missing" is part of a value's type. This unit shows how `String` and
`String?` differ, and how the safe call `?.`, the Elvis operator `?:`, smart casts and `let`
let you handle missing values without a single `NullPointerException`. The challenge reads a
port number from untrusted, possibly absent input, without using `!!` at all.
'''
concepts = '''
## The idea

Tony Hoare called the null reference his "billion-dollar mistake". In Java any reference can
quietly be `null`, and the first method call on it stops the program with a
`NullPointerException`. Kotlin moves that failure from run time to compile time. Every type
says whether it can hold `null`, and the compiler rejects code that would use a value that
might be missing.

## How Kotlin does it

`String` can never be null. `String?` is a different type that means "a String, or null".
A `String` fits wherever a `String?` is expected, but not the other way round.

```kotlin
var name: String = "Ada"
var nick: String? = null       // fine
// name = null                 // error: Null cannot be a value of a non-null type 'String'
```

You have four tools for working with a nullable value:

- **Safe call `?.`**: `nick?.length` gives the length, or `null` if `nick` is null. Calls
  chain, as in `user?.address?.city`.
- **Elvis `?:`**: `nick ?: "guest"` supplies a fallback when the left side is null. The right
  side may also be `return` or `throw`, which makes early exits short.
- **Smart casts**: after `if (nick != null)`, the compiler knows that `nick` is a `String`
  inside the branch, so a plain `nick.length` compiles. The same happens after an `is` check
  and after `?: return`.
- **Not-null assertion `!!`**: `nick!!.length` means "trust me". If you are wrong it throws
  `NullPointerException`, the very crash Kotlin was built to avoid. Treat every `!!` as a
  warning sign.

`let` runs a block only when the value is present: `nick?.let { println("hi $it") }`. Inside
the braces, `it` is the non-null value.

```kotlin
fun greeting(nick: String?): String {
    val n = nick?.trim() ?: return "Hello, guest"
    return if (n.isEmpty()) "Hello, guest" else "Hello, $n"
}
```

The standard library follows the same style. `toIntOrNull()`, `firstOrNull()`,
`getOrNull(i)` and `map[key]` return a nullable result instead of throwing, and
`filterNotNull()` and `mapNotNull { }` remove nulls from a collection.

Java has no such distinction. Values that come from Java APIs have **platform types**, shown
as `String!`. Kotlin lets you treat them either way and checks them only at run time, so
check them where they enter your code.

## Pitfalls and compiler errors

- `Only safe (?.) or non-null asserted (!!.) calls are allowed on a nullable receiver of type
  'String?'`: you called a method on a nullable value. Use `?.` or `?:`, or check for null
  first.
- `Type mismatch: inferred type is 'String?', but 'String' was expected`: you passed a
  nullable value where a non-null one is required. Supply a default with `?:`.
- Smart casts don't work on a `var` property of a class, because other code could change it
  between the check and the use (`Smart cast to 'String' is impossible`). Copy it into a
  local `val` first.
- `?.` always produces a nullable result: `nick?.length` is an `Int?`, not an `Int`.

## What you will practise

You will chain safe calls and Elvis fallbacks, let smart casts do the work after null and
type checks, and clean up lists of optional values with `let`, `mapNotNull` and
`toIntOrNull`. The challenge asks you to parse a port number from input that may be missing
or malformed.
'''

[[unit.step]]
kind = "concept"
id = "kt-u07-c1-nullable-types"
title = "String and String? are different types"
points = 5
difficulty = 7
intro = '''
A type is a set of values. `String?` is the set of all strings plus one extra value, `null`,
and the compiler tracks which of the two sets every expression belongs to. That is a static
guarantee: code that might dereference `null` fails to compile instead of failing in
production.
'''
body = '''
## Two types, not one

When you declare `val city: String`, the compiler promises that `city` always refers to a
real string. Add a question mark, `val city: String?`, and the value may also be `null`.
Because the types differ, the compiler can stop you before a mistake runs:

```kotlin
val city: String? = readCityOrNull()
println(city.length)          // error: only safe (?.) or non-null asserted (!!.) calls
println(city?.length)         // prints a number, or null
println(city?.length ?: 0)    // prints a number, or 0
```

## Narrowing a nullable value

Once you check that a value is not null, the compiler **smart casts** it to the non-null
type for as long as the check holds:

```kotlin
if (city != null) {
    println(city.uppercase())   // city is a String here
}
```

An early exit narrows it for the rest of the function:

```kotlin
val c = city ?: return
println(c.length)
```

## Where nulls come from

You rarely write `null` yourself. It comes from functions that may have no answer: a map
lookup with a missing key, `"abc".toIntOrNull()`, `list.firstOrNull()`. These functions
return a nullable type, so the compiler makes you decide what "no answer" means at the exact
place you use the result.

## The escape hatch

`value!!` turns `T?` into `T` and throws `NullPointerException` if the value is null. It
exists for the rare case where you know more than the compiler does. In everyday code, a
default with `?:` or an early `return` almost always expresses the intent better.
'''

