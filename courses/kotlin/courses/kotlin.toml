[unit.step.gabarito]
solution = '''
data class LineItem(val sku: String, val quantity: Int, val unitCents: Long)

data class OrderSummary(val distinctSkus: Int, val units: Int, val totalCents: Long)

fun mergeLines(lines: List<LineItem>): List<LineItem> {
    val groups = mutableMapOf<Pair<String, Long>, LineItem>()
    for (line in lines) {
        val key = line.sku to line.unitCents
        val seen = groups[key]
        groups[key] = if (seen == null) line else seen.copy(quantity = seen.quantity + line.quantity)
    }
    return groups.values.filter { it.quantity != 0 }
}

fun summarize(lines: List<LineItem>): OrderSummary {
    val merged = mergeLines(lines)
    return OrderSummary(
        distinctSkus = merged.map { it.sku }.toSet().size,
        units = merged.sumOf { it.quantity },
        totalCents = merged.sumOf { it.quantity * it.unitCents },
    )
}
'''
time = "O(n)"
space = "O(g)"
justification = '''
Let `n` be the number of input lines and `g` the number of distinct (sku, price) groups,
with `g ≤ n`. Treat sku lengths as bounded by a constant.

**`mergeLines`** makes one pass. For each line it builds a `Pair` key, hashes it (the
generated `hashCode` combines the sku's hash and the price's), and does one lookup and one
insert in a hash map, both O(1) on average. `copy` allocates one small object in O(1). The
final `filter` walks the `g` groups once. The total is **O(n)** time. The map holds one entry
per group, and the result has at most `g` lines, so the extra space is **O(g)**.

**`summarize`** calls `mergeLines`, O(n), and then makes three passes over the `g` merged
lines. Building the set of skus is O(g) on average. The total is still **O(n)** time and
**O(g)** space.

The data classes carry the correctness. `Pair` is a data class, so two keys built from equal
skus and prices are equal and share a hash code, which is what a composite key needs.
`LinkedHashMap`, the class behind `mutableMapOf`, preserves the order of first insertion, and
replacing a key's value does not move it. That is why a group that drops to zero and comes
back keeps its first position. `copy` never touches the input objects, so the caller's list
stays exactly as it was. Comparing every line against every other line would also work, but
it would cost O(n²).
'''

# ── g3-types ────────────────────────────────────────────────────────────

[[unit]]
id = "kt-u12-inheritance-interfaces"
title = "Inheritance and interfaces"
level = "intermediate"
difficulty = 12
intro = '''
Inheritance lets one class reuse and specialise another, and interfaces let unrelated classes
promise the same behaviour. Kotlin makes both explicit: classes are closed unless you mark them
`open`, and every override says `override`. You will build small hierarchies, call the parent with
`super`, combine interfaces, and finish with a payroll that works for any kind of worker.
'''
concepts = '''
## The idea

**Inheritance** says "a `Dog` is an `Animal`": the subclass gets the parent's properties and
methods, and may replace some of them. **Polymorphism** is the payoff. Code written against
`Animal` works with every subclass, and a call such as `animal.sound()` runs the version that
belongs to the object's real class, chosen at run time. This is called **dynamic dispatch**.

An **interface** is a contract without state: "anything that is `Payable` has a `monthlyPay()`".
A class extends at most one class but can implement many interfaces, which is how unrelated types
(an employee and a contractor) can be handled by the same code.

## How Kotlin does it

Kotlin classes and members are **final by default**. You must opt in with `open`, and every
replacement must say `override`. Java is the opposite: everything is open unless marked `final`.

```kotlin
open class Animal(val name: String) {
    open fun sound(): String = "..."
}

class Dog(name: String) : Animal(name) {
    override fun sound(): String = "Woof"
}
```

`: Animal(name)` both names the parent and calls its constructor. An `override` is itself open,
so a further subclass may override it again; write `final override` to stop that.

An **abstract** class can't be instantiated and may declare members without bodies; subclasses
must implement them. Interfaces may hold abstract properties and methods **with default bodies**:

```kotlin
interface Named {
    val name: String
    fun greet(): String = "Hi, I am $name"
}

class User(override val name: String) : Named
```

Inside an override, `super.method()` calls the parent's version. When two interfaces both supply
a default for the same method, Kotlin forces you to override it and pick with `super<Swimmer>.move()`.
Use `is` to test a type at run time; after a successful `is` check the compiler smart-casts.

## Pitfalls and compiler errors

- **"This type is final, so it cannot be inherited from"**: you forgot `open` on the parent class.
- **"'sound' hides member of supertype 'Animal' and needs 'override' modifier"**: overrides
  are never implicit.
- **"'sound' in 'Animal' is final and cannot be overridden"**: the parent method needs `open`.
- **"Cannot create an instance of an abstract class"**: instantiate a concrete subclass instead.
- **"Class 'X' is not abstract and does not implement abstract member"**: implement every
  abstract member or mark the class `abstract`.
- **"This type has a constructor, and thus must be initialized here"**: write `: Animal(name)`,
  with the parentheses, when the parent is a class. Interfaces have no constructor, so no
  parentheses.
- Don't call `open` methods from a constructor or `init` block: the subclass part of the object
  is not initialised yet, and its override may read properties that are still `null` or zero.

## What you will practise

You will override an `open` method and watch dispatch pick the right one, extend an abstract class
and reuse its logic through `super`, and combine several interfaces, resolving a clash between
two default methods. The challenge is a payroll: an interface, an abstract base class and three
concrete workers, summed by one function that accepts any `Payable`.
'''

[[unit.step]]
kind = "concept"
id = "kt-u12-c1-open-override"
title = "Final by default: open, override, abstract"
points = 5
difficulty = 12
intro = '''
Object-oriented languages decide at run time which method body to call, based on the object's
real class rather than the variable's declared type. Kotlin keeps this power but makes it
deliberate: a class must be `open` before anyone can extend it, and every override is spelled out.
'''
body = '''
## Opting in to inheritance

In Kotlin a class is **final** unless you write `open`. That default comes from a lesson the
Java world learned the hard way: a class that was never designed for extension breaks in
surprising ways when someone overrides its methods. So Kotlin makes extension a decision.

```kotlin
open class Account(val owner: String) {
    open fun fee(): Int = 5
    fun statement(): String = "$owner pays ${fee()}"
}

class Premium(owner: String) : Account(owner) {
    override fun fee(): Int = 0
}
```

Three rules are at work here:

- `open class` allows subclasses; `open fun` allows a method to be replaced.
- `override` is mandatory, and the signature must match the parent's exactly.
- `: Account(owner)` names the parent **and** calls its constructor.

## Dynamic dispatch

`statement()` is final, yet `Premium("Ada").statement()` prints `Ada pays 0`. The call to
`fee()` inside it is dispatched on the object's real class, so the override runs. This is
polymorphism: the parent defines the algorithm, the children fill in the details.

## Abstract classes and interfaces

An `abstract` class leaves some members without a body and can't be instantiated. An
`interface` holds no state but can declare properties and methods, with or without default
bodies. A class extends **one** class but can implement **many** interfaces:
`class Duck : Animal(), Swimmer, Flyer`.
'''

