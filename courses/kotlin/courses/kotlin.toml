[[unit.step]]
kind = "drill"
id = "kt-u10-d3-accessors-visibility"
title = "Custom setters and private state"
points = 10
difficulty = 10
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
An accessor is a method disguised as a field. A custom setter can **normalise** or reject a
value before it is stored, and `private set` gives the class sole control over writes. A
`private` collection behind a read-only property is the classic way to expose state without
letting callers corrupt it.
'''
prompt = '''
Build a `Playlist` whose `name` setter trims input and ignores blank values, whose play
counter can be read but not written from outside, and whose song list is private. Then play
it in a loop.

**Why:** controlling every write through a setter or a method is how a class keeps its
invariants, here "the name is never blank" and "plays only grows".
'''
target = '''
class Playlist(name: String) {
    var name: String = name.trim()
        set(value) {
            val cleaned = value.trim()
            if (cleaned.isNotEmpty()) field = cleaned
        }

    var plays = 0
        private set

    private val songs = mutableListOf<String>()

    val size: Int
        get() = songs.size

    fun add(song: String) {
        songs.add(song)
    }

    fun play(): String? {
        if (songs.isEmpty()) return null
        val song = songs[plays % songs.size]
        plays++
        return song
    }
}

fun main() {
    val p = Playlist("  Road trip ")
    p.name = "   "
    println("[${p.name}]")
    println(p.play())
    p.add("Song A")
    p.add("Song B")
    println(listOf(p.play(), p.play(), p.play()))
    println("${p.size} songs, ${p.plays} plays")
}
'''
line_comments = [
  "`name` is a plain constructor parameter, used to initialise the property below.",
  "The property starts out trimmed: `Road trip`.",
  "A custom setter runs on every assignment `p.name = ...`.",
  "`value` is the new value that the caller assigned.",
  "`field` is the backing field. Writing `name = cleaned` here would call this setter again, forever.",
  "Closes the setter.",
  "",
  "Anyone can read `plays`...",
  "...but only code inside the class can assign it.",
  "",
  "`private`: invisible outside the class, so callers cannot add or remove songs directly.",
  "",
  "A read-only, computed view of the private state.",
  "The getter reads the private list's size.",
  "",
  "The only way in: a public method that the class controls.",
  "Appends to the private list.",
  "Closes `add`.",
  "",
  "Returns the next song, or `null` for an empty playlist.",
  "Nothing to play, so it returns `null` and leaves `plays` unchanged.",
  "`%` wraps around, so the playlist loops.",
  "Allowed, because we are inside the class.",
  "Returns the song that was played.",
  "Closes `play`.",
  "Closes `Playlist`.",
  "",
  "The entry point.",
  "The initialiser trims the name.",
  "The setter ignores a blank name, so the old one stays.",
  "Prints `[Road trip]`.",
  "An empty playlist plays nothing: `null`.",
  "Adds through the public method.",
  "Adds a second song.",
  "Three plays loop around the two songs: `[Song A, Song B, Song A]`.",
  "Prints `2 songs, 3 plays`. Writing `p.plays = 0` here would not compile.",
  "Closes `main`.",
]
explanation = '''
The program printed `[Road trip]`, `null`, `[Song A, Song B, Song A]` and
`2 songs, 3 plays`. The blank name was silently rejected by the setter, which wrote to
`field` only for a valid value. `plays` could be read from `main` but only `play` could
change it, and `play` changed it only when a song was actually played. Callers could add
songs only through `add`, so the playlist's state was always the result of its own methods.
'''

[[unit.step]]
kind = "challenge"
id = "kt-u10-x1-bank-account"
title = "A bank account that stays valid"
points = 30
difficulty = 10
entry = "BankAccount"
intro = '''
A bank account is the textbook example of an invariant: the balance must never be negative,
and every change must be recorded. You enforce it with encapsulation: validate in `init`,
make the balance writable only from inside, and route every change through methods that check
their arguments. Each operation is O(1), apart from handing out a snapshot of the history.
'''
instructions = '''
## Your turn

Complete the class `BankAccount`. All amounts are in **cents**, as `Long`.

```kotlin
class BankAccount(val owner: String, initialCents: Long = 0) {
    var balanceCents: Long          // readable by anyone, writable only inside
    val transactions: List<Long>
    fun deposit(cents: Long)
    fun withdraw(cents: Long): Boolean
    fun transferTo(other: BankAccount, cents: Long): Boolean
}
```

- **Construction**: throw `IllegalArgumentException` if `owner` is blank or `initialCents`
  is negative. The balance starts at `initialCents`.
- **`deposit(cents)`**: `cents` must be positive (otherwise throw
  `IllegalArgumentException`). Adds it to the balance.
- **`withdraw(cents)`**: `cents` must be positive (otherwise throw). If the balance is too
  low, return `false` and change nothing. Otherwise subtract it and return `true`.
- **`transferTo(other, cents)`**: moves money to another account. Throw
  `IllegalArgumentException` if `other` is this same account or `cents` is not positive.
  Return `false` and change nothing if the balance is too low.
- **`transactions`**: every successful deposit as `+cents` and every successful withdrawal as
  `-cents`, oldest first. A transfer appears as a withdrawal in the sender's history and as a
  deposit in the receiver's. The initial balance is **not** a transaction. Return a
  **snapshot**: changing the returned list, or later operations on the account, must not
  change a list you already received.

Examples:

- `BankAccount("Ada", 1_000).withdraw(1_500)` → `false`, and the balance stays `1000`.
- After `deposit(500)` and `withdraw(200)`, `transactions` is `[500, -200]`.

**Hint:** keep the history in a `private val` mutable list, and return a copy of it with
`toList()`.

Hidden tests decide correctness.
'''
starter = '''
