[unit.step.gabarito]
solution = '''
import kotlinx.coroutines.CancellationException
import kotlinx.coroutines.async
import kotlinx.coroutines.awaitAll
import kotlinx.coroutines.coroutineScope
import kotlinx.coroutines.withTimeoutOrNull

suspend fun loadDashboard(
    widgets: Map<String, suspend () -> String>,
    timeoutMs: Long,
): Map<String, String> = coroutineScope {
    widgets.map { (name, load) ->
        async { name to loadWidget(load, timeoutMs) }
    }.awaitAll().toMap()
}

private suspend fun loadWidget(load: suspend () -> String, timeoutMs: Long): String =
    try {
        withTimeoutOrNull(timeoutMs) { load() } ?: "timeout"
    } catch (e: CancellationException) {
        throw e
    } catch (e: Exception) {
        "error: ${e.message}"
    }
'''
time = "O(n)"
space = "O(n)"
justification = '''
With `n` widgets the function starts `n` coroutines, awaits them and builds a map of `n`
entries: **O(n)** work and **O(n)** space for the `Deferred` handles, the pairs and the map,
not counting what the widgets themselves do. Because every widget runs concurrently, the
wall-clock time is about `min(timeoutMs, slowest widget)`, never the sum of the widgets.

Correctness rests on three boundaries. `withTimeoutOrNull` cancels the slow widget at its
deadline and reports `null`, which becomes `"timeout"`; cancellation is cooperative, so the
widget really stops at its next `delay`. The `try`/`catch` inside each `async` stops a widget's
exception before it reaches the scope, so one failure cannot cancel its siblings. Catching
`CancellationException` first and rethrowing it keeps the caller in control: when the caller's
own deadline fires, every `async` is cancelled through the job tree and `coroutineScope`
propagates the cancellation instead of returning a map of fake errors. Catching
`Exception` alone would also catch `TimeoutCancellationException` from a nested `withTimeout`
and break both rules.
'''

[[unit]]
id = "kt-u24-flows"
title = "Flow: cold asynchronous streams"
level = "advanced"
difficulty = 24
intro = '''
A `Flow` is an asynchronous sequence: values arrive one at a time, the producer may suspend
between them, and nothing happens until someone collects. You will build cold flows, chain
operators such as `map`, `filter` and `take`, handle errors and completion as part of the
stream, and write your own operator that groups a stream into batches.
'''
concepts = '''
## The idea

A `suspend` function returns one value. Many problems produce *several values over time*:
sensor readings, search suggestions as the user types, rows streamed from a database, progress
updates. A `List` cannot model them, because it must exist completely before you see its first
element. A `Sequence` (unit 19) is lazy, but it cannot suspend between elements. **`Flow<T>`**
is the coroutine answer: a lazy stream whose producer may suspend before each value.

Flows are **cold**. Building one runs no code; it only describes a recipe. Every call to a
terminal operator such as `collect` runs the recipe again, from the start, for that collector
alone. (Hot streams such as `StateFlow` and `SharedFlow` exist independently of their
collectors; they are beyond this unit.)

## How Kotlin does it

```kotlin
import kotlinx.coroutines.delay
import kotlinx.coroutines.flow.*

fun countdown(from: Int): Flow<Int> = flow {
    for (i in from downTo 1) {
        delay(5)
        emit(i)       // hands i to the collector and waits until it is processed
    }
}

suspend fun main() {
    countdown(3).map { it * 10 }.collect { println(it) }   // 30, 20, 10
}
```

- **Builders**: `flow { emit(x) }`, `flowOf(1, 2, 3)`, `list.asFlow()`, `(1..5).asFlow()`.
- **Intermediate operators** return a new flow and run nothing yet: `map`, `filter`, `take`,
  `onEach`, `transform` (emit zero or more values per input), `distinctUntilChanged`,
  `runningFold`.
- **Terminal operators** are `suspend` and start the work: `collect`, `toList`, `first`,
  `single`, `reduce`, `fold`, `count`.

By default `emit` and `collect` run in the same coroutine, with no buffer and no extra thread.
Each element travels through the whole chain before the producer computes the next one, just
like a sequence.

Errors and completion are part of the stream. `catch { e -> … }` handles exceptions thrown
**upstream** of it and may emit a fallback value; `onCompletion { cause -> … }` runs when the
flow ends, normally or not. `flowOn(Dispatchers.Default)` moves the upstream part of the chain
to another dispatcher.

## What is special or tricky

- **Nothing runs until a terminal operator.** `countdown(3).map { … }` on its own prints
  nothing, and a flow collected twice does all of its work twice.
- **`collect` is a suspend function**, so it needs a coroutine: `runBlocking`, another suspend
  function, or `suspend fun main`.
- **Emitting from another coroutine** inside `flow { }`, for example from a `launch`, breaks the
  flow's rules and fails with an `IllegalStateException` that mentions the *flow invariant*.
  `channelFlow` exists for producers that need concurrency.
- **`take(n)` cancels the producer** right after the n-th element, using an internal
  exception. A broad `try`/`catch` around `emit` would swallow that signal.
- **State belongs inside the builder.** A variable declared outside `flow { }` is shared by
  every collection of that flow.

## What you will practise

You will see coldness by collecting the same flow twice, chain operators into a pipeline,
recover from an upstream error with `catch`, and then write a `batched` operator that must stay
lazy, restartable and cancellable.
'''

[[unit.step]]
kind = "concept"
id = "kt-u24-c1-cold-streams"
title = "Cold streams, operators and collectors"
points = 5
difficulty = 24
intro = '''
A flow separates *describing* a stream from *running* it. The description is an ordinary value
you can pass around and decorate with operators; the run happens only inside a terminal
operator, and each run is independent, which is what "cold" means.
'''
body = '''
## Three kinds of calls

```kotlin
val temps: Flow<Int> = flow {          // 1. builder: describes a producer
    emit(18); delay(5); emit(21)
}
val alerts = temps
    .filter { it > 20 }                // 2. intermediate: returns a new Flow
    .map { "hot: $it" }
alerts.collect { println(it) }         // 3. terminal: suspends and runs everything
```

Lines 1 and 2 execute no producer code at all. Only `collect` starts the `flow { }` block, in
the collector's coroutine. Every `emit` call then hands one value down the chain, `filter`
and `map` process it, the collector's lambda runs, and only then does `emit` return so that
the producer can continue. Producer and consumer take turns, and there is no queue in between.

## Cold means per collector

Collect `alerts` twice and the `flow { }` block runs twice, from the start, once per
collection. That makes flows predictable and safe to retry. It also means expensive work is
repeated, which is why apps convert shared data into hot `StateFlow`s.

## Early exit

Operators such as `take(2)` and `first()` stop the flow early. They do it by cancelling the
producer from inside, so the `flow { }` block simply stops at its next `emit`: no extra values
are computed. Sequences behave the same way, and that is what makes flows usable on endless
sources.

## Writing your own operator

An operator is just an extension function that returns a new flow and collects the original
inside it:

```kotlin
fun Flow<Int>.doubled(): Flow<Int> = flow {
    collect { value -> emit(value * 2) }
}
```

The challenge asks for one that is a little more demanding.
'''

