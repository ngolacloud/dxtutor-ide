[unit.step.gabarito]
solution = '''
// True when year is a leap year in the Gregorian calendar.
fun isLeapYear(year: Int): Boolean {
    return when {
        year % 400 == 0 -> true
        year % 100 == 0 -> false
        else -> year % 4 == 0
    }
}

// Days in the given month (1 = January ... 12 = December) of that year.
// Throw IllegalArgumentException when month is not in 1..12.
fun daysInMonth(year: Int, month: Int): Int {
    return when (month) {
        2 -> if (isLeapYear(year)) 29 else 28
        4, 6, 9, 11 -> 30
        in 1..12 -> 31
        else -> throw IllegalArgumentException("month must be in 1..12, was $month")
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Both functions evaluate a fixed number of remainders and comparisons, independent of the
value of `year`, and allocate nothing (apart from the exception message on invalid input).
So the time and the space are **O(1)**.

Correctness comes from the order of the branches. The `when` in `isLeapYear` mirrors the rule
from the most specific case to the most general: the 400-year exception is tested before the
100-year exception, which is tested before the 4-year rule, so 2000 is caught by the first
branch and 1900 by the second. In `daysInMonth`, February and the four 30-day months come
first; `in 1..12` then catches the remaining valid months, and every other value falls
through to `else`, where `throw` ends the function. Because `throw` is an expression of type
`Nothing`, the compiler accepts it as a branch of a `when` that must produce an `Int`.
'''

[[unit]]
id = "kt-u05-loops"
title = "Ranges and loops"
level = "basic"
difficulty = 5
intro = '''
Computers shine at repetition: doing the same steps a thousand times without getting bored or
making mistakes. This unit introduces **ranges**, Kotlin's values that describe a run of
numbers, and the loops that use them: `for`, `while`, `do`-`while` and `repeat`, together with
`break` and `continue` for leaving a loop early.
'''
concepts = '''
## The idea

A **loop** repeats a block of code, the **body**. Each repetition is an **iteration**. There
are two kinds of loop: one that goes through a known sequence of values ("for each number from
1 to 10"), and one that keeps going while a condition holds ("while the number is not yet
1"). Choosing the right one makes the code say what you mean.

## How Kotlin does it

A **range** is a value describing consecutive numbers (or characters):

```kotlin
1..5            // 1, 2, 3, 4, 5      (both ends included)
0..<5           // 0, 1, 2, 3, 4      (end excluded; also written 0 until 5)
10 downTo 1     // 10, 9, ..., 1
0..20 step 5    // 0, 5, 10, 15, 20
'a'..'e'        // a, b, c, d, e
```

`x in 1..5` tests membership. A `for` loop visits each element of a range, string or
collection in order:

```kotlin
for (i in 1..3) println(i)
for (c in "abc") print(c)
for (i in text.indices) println("${text[i]} at $i")   // indices is 0..<length
```

A `while` loop checks its condition *before* each iteration and may run zero times;
`do { ... } while (condition)` checks *after*, so it always runs at least once.
`repeat(n) { ... }` runs a block `n` times.

`break` leaves the loop immediately; `continue` skips the rest of this iteration and moves on to
the next. Inside nested loops they affect the innermost one, unless you **label** the outer
loop and write `break@outer`.

## Different from Java

Kotlin has no `for (int i = 0; i < n; i++)`. You iterate over a range instead, which removes a
whole class of mistakes (a wrong comparison, forgetting `i++`). The loop variable is a fresh
`val` in each iteration, so you cannot accidentally modify it inside the body.

## What is special or tricky

- **`10..1` is empty.** A loop over it runs zero times, silently; counting down needs
  `10 downTo 1`.
- **Off-by-one errors.** `0..s.length` goes one step too far and `s[s.length]` throws
  `StringIndexOutOfBoundsException`. Use `0..<s.length` or simply `s.indices`.
- **`step` must be positive.** `step 0` or `step -1` throws `IllegalArgumentException` when the
  code runs; to go backwards, use `downTo` with a positive step.
- **`while` loops can run forever** if nothing in the body moves the condition towards `false`.
  Before writing one, ask what changes in every iteration and why it must eventually stop.
- **Watch arithmetic inside loop conditions.** Values computed in a loop can grow past
  `Int.MAX_VALUE` and wrap around, turning a correct-looking condition into a wrong one.

## What you will practise

You will walk ranges forwards, backwards and in steps, accumulate totals with `while`, and
control loops with `break`, `continue` and labels. The challenge asks you to test whether a
number is prime and to count the steps of the Collatz sequence, both on inputs large enough to
punish slow or overflowing code.
'''

[[unit.step]]
kind = "concept"
id = "kt-u05-c1-loops"
title = "Iteration and ranges"
points = 5
difficulty = 5
intro = '''
Every loop answers three questions: where does it start, what happens in one iteration, and
when does it stop. With a range, Kotlin answers the first and the last for you, which is why
`for` over a range is the safest loop. A `while` loop leaves the stopping rule to you.
'''
body = '''
## Two ways to repeat

```kotlin
fun main() {
    // A known sequence: for over a range.
    var sum = 0
    for (n in 1..4) {
        sum += n
    }
    println("1 + 2 + 3 + 4 = $sum")
    // Until a condition changes: while.
    var value = 100
    var halvings = 0
    while (value > 1) {
        value /= 2
        halvings++
    }
    println("100 halves to 1 in $halvings steps")
}
```

Things to notice:

- **`for (n in 1..4)`** runs the body four times, with `n` equal to 1, 2, 3 and 4. The range
  `1..4` includes both ends. `n` is a new read-only variable in each iteration.
- **`sum`** is an **accumulator**: a `var` declared before the loop and updated in every
  iteration. After the loop it holds `10`.
- **`while (value > 1)`** checks the condition before every iteration. The body halves `value`
  (integer division: 100, 50, 25, 12, 6, 3, 1), so the condition eventually becomes false,
  after 6 iterations.

## Which loop to choose

Use `for` when you can name the values to visit: a range, the characters of a string, the
elements of a list. Use `while` when you only know the condition for stopping, as in "keep
halving until we reach 1". Use `repeat(n)` when you need to do something `n` times and do not
care about the counter. In each case, make sure you can explain why the loop terminates.
'''

