[unit.step.gabarito]
solution = '''
import kotlin.properties.Delegates
import kotlin.properties.ReadWriteProperty
import kotlin.reflect.KProperty

class Clamped(initial: Int, private val range: IntRange, private val log: MutableList<String>) :
    ReadWriteProperty<Any?, Int> {

    private var current: Int

    init {
        require(initial in range) { "initial value $initial is outside $range" }
        current = initial
    }

    override fun getValue(thisRef: Any?, property: KProperty<*>): Int = current

    override fun setValue(thisRef: Any?, property: KProperty<*>, value: Int) {
        val next = value.coerceIn(range)
        if (next != current) {
            log += "${property.name}: $current -> $next"
            current = next
        }
    }
}

class EditorSettings {
    val history: MutableList<String> = mutableListOf()

    var theme: String by Delegates.observable("light") { property, old, new ->
        if (old != new) history += "${property.name}: $old -> $new"
    }
    var fontSize: Int by Clamped(14, 8..72, history)
    var tabWidth: Int by Clamped(4, 1..8, history)
}
'''
time = "O(1) per read or write"
space = "O(1) per delegate, O(c) for c recorded changes"
justification = '''
Every read is **O(1)**: `getValue` returns a stored field. Every write is **O(1)** as well:
`coerceIn` does two comparisons, and appending to the log is amortised O(1), plus building one
short string. Each `Clamped` instance holds one `Int` and two references, **O(1)** space, while the
history grows by one entry per real change, so after `c` changes it takes **O(c)** space.

The delegate keeps the rule (clamp, compare, record) in one class, and `by` attaches it to as many
properties as you like; `property.name` lets one implementation write the right name into the
log, which is why the same class serves `fontSize`, `tabWidth` and a local `volume`. Validating
`initial` with `require` in `init` means a delegate can never start in an invalid state. Recording
only real changes, compared after clamping, keeps the audit trail meaningful: writing 100 twice
records one change, not two. `EditorSettings` mixes a library delegate with a custom one:
`Delegates.observable` cannot clamp or skip a write, but it reports the old and new values, which
is all `theme` needs. Declaring `history` first matters because property initialisers, including
the creation of delegates, run from top to bottom.
'''

# ── g5-coroutines ────────────────────────────────────────────────────────────

[[unit]]
id = "kt-u22-coroutines"
title = "Coroutines: suspend, launch and async"
level = "advanced"
difficulty = 22
intro = '''
A coroutine is a computation that can pause without blocking its thread, so thousands of them
can wait on timers or the network at the same time. You will write `suspend` functions, start
coroutines with `launch` and `async`, wait for them with `join` and `await`, and finish by
fetching a list of records concurrently, each distinct record exactly once.
'''
concepts = '''
## The idea

A thread that waits for a network reply, a disk or a timer is a thread doing nothing, and
threads are expensive: each one reserves its own stack (often a megabyte), and an operating
system juggles only a few thousand of them comfortably. A **coroutine** is a much lighter unit
of work: a function call that can **suspend**, handing its thread back so that something else
can run, and later **resume** exactly where it left off. Waiting becomes cheap, so one program
can keep 100,000 coroutines in flight on a handful of threads.

Kotlin builds coroutines into the compiler. The keyword `suspend` marks a function that may
pause. The library `kotlinx.coroutines` supplies the rest: **builders** that start coroutines,
**dispatchers** that choose threads, and suspending primitives such as `delay`.

## How Kotlin does it

```kotlin
import kotlinx.coroutines.*

suspend fun loadUser(id: Int): String {
    delay(10)                 // suspends; the thread is free meanwhile
    return "user$id"
}

fun main() = runBlocking {
    val job = launch { println(loadUser(1)) }
    val name = async { loadUser(2) }
    println(name.await())
    job.join()
}
```

- `runBlocking` bridges ordinary code and coroutines: it blocks the calling thread until
  everything inside has finished. Use it in `main` and in tests, never inside a coroutine.
- `launch` starts a coroutine for its side effects and returns a `Job`; `join()` waits for it.
- `async` starts a coroutine that computes a value and returns a `Deferred<T>`; `await()`
  suspends until the value is ready. Starting two `async` blocks *before* awaiting either is
  what makes them run concurrently.
- `delay(ms)` is the suspending cousin of `Thread.sleep`: it pauses only this coroutine.
- A plain `suspend` function has no scope to launch into, so it opens one with
  `coroutineScope { … }`. Unit 23 is about that function.

Under the hood the compiler turns every `suspend` function into a small state machine and
passes it a hidden **continuation**, the callback that resumes it. Java has no such thing in
the language; its closest relatives are `CompletableFuture` chains and the virtual threads of
JDK 21.

## What is special or tricky

- **Calling a `suspend` function from ordinary code** stops the compiler with an error saying
  it can only be called from a coroutine or another suspend function. Make the caller
  `suspend`, or wrap the call in `runBlocking`.
- **`await` straight after `async` is sequential.** `async { a() }.await()` followed by
  `async { b() }.await()` runs one after the other. Start them all, then await them all.
- **`Thread.sleep` inside a coroutine blocks the thread** and freezes every coroutine that
  shares it. Use `delay`.
- **Exceptions travel upwards.** A coroutine that throws cancels its parent scope; unit 23
  shows how to contain a failure.
- `runBlocking` runs its coroutines on one thread, so they interleave only at suspension
  points. That makes small programs predictable, which is why the drills print in a fixed
  order.

## What you will practise

You will launch and join a job, run two `async` calls concurrently, map a list to `async`
calls with `awaitAll`, move CPU work to `Dispatchers.Default`, and start ten thousand
coroutines at once. The challenge asks you to fetch many ids concurrently while calling the
fetcher only once per distinct id.
'''

[[unit.step]]
kind = "concept"
id = "kt-u22-c1-suspend"
title = "Suspending is not blocking"
points = 5
difficulty = 22
intro = '''
A suspended coroutine holds no thread: it is just an object on the heap that remembers where
to continue. That single fact explains why coroutines are cheap, why `delay` differs from
`Thread.sleep`, and in which order the programs of this unit print their lines.
'''
body = '''
## Suspend and resume

A `suspend` function can pause at a **suspension point**: a call to another suspend function
such as `delay`, `join` or `await`. While it is paused it holds no thread, and the thread runs
other coroutines. When the awaited event happens (a timer fires, a result arrives), the
coroutine **resumes** on a thread picked by its **dispatcher**, with its local variables
intact.

```kotlin
fun main() = runBlocking {
    launch { delay(10); println("B") }
    println("A")
}
```

This prints `A`, then `B`. `launch` does not run its block on the spot: it queues the new
coroutine and immediately returns a `Job`. The body of `runBlocking` carries on, prints `A`,
reaches its end and then waits for its children. Only now does the queued coroutine start,
suspend inside `delay`, and print `B` ten milliseconds later.

## Two builders

| Builder | Returns | Wait with | Use it for |
|---|---|---|---|
| `launch` | `Job` | `join()` | side effects: logging, saving, updating |
| `async` | `Deferred<T>` | `await()` | a result you need later |

Both return at once. Concurrency comes from starting several coroutines before waiting for
any of them; `awaitAll()` waits for a whole list of `Deferred` values and returns the results
in the same order as the list.

## Coroutines are cheap

A coroutine is a small heap object plus the variables it captured, not an operating-system
thread. `List(100_000) { launch { delay(10) } }` finishes in a fraction of a second, while
100,000 threads would exhaust memory. That cheapness is the point: you write
sequential-looking code for each task and let the library multiplex all the waiting.
'''

[[unit.step]]
