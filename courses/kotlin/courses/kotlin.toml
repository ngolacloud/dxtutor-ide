target = '''
sealed interface Item
data class Num(val value: Int) : Item
data class Group(val items: List<Item>) : Item

fun group(vararg items: Item) = Group(items.toList())

fun total(item: Item): Int = when (item) {
    is Num -> item.value
    is Group -> item.items.sumOf { total(it) }
}

fun depth(item: Item): Int = when (item) {
    is Num -> 0
    is Group -> 1 + (item.items.maxOfOrNull { depth(it) } ?: 0)
}

fun main() {
    val data = group(Num(1), group(Num(2), Num(3)), group(group(Num(4)), group()), Num(5))
    println("total ${total(data)}, depth ${depth(data)}")
}
