target = '''
fun insertionSort(a: IntArray): Long {
    var shifts = 0L
    for (i in 1 until a.size) {
        val x = a[i]
        var j = i - 1
        while (j >= 0 && a[j] > x) {
            a[j + 1] = a[j]
