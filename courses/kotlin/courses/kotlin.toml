An empty order merges to an empty list and summarizes to `OrderSummary(0, 0, 0)`.

**Hint:** a `mutableMapOf<Pair<String, Long>, LineItem>()` keeps insertion order, and
`sku to unitCents` makes a key that compares by content.

Hidden tests decide correctness.
