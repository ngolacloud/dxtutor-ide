target = '''
class Version(val major: Int, val minor: Int) : Comparable<Version> {
    override fun compareTo(other: Version): Int =
        compareValuesBy(this, other, { it.major }, { it.minor })

    operator fun component1() = major
    operator fun component2() = minor

    override fun toString() = "$major.$minor"
}

fun main() {
    val supported = Version(1, 4)..Version(2, 1)
    val versions = listOf(Version(2, 0), Version(1, 10), Version(1, 2), Version(2, 3))
    println(versions.sorted())
