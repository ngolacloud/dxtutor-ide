}
test("digits and apostrophes separate words") {
    equal(topWords("don't stop 2 believing", 10), listOf("believing" to 1, "don" to 1, "stop" to 1, "t" to 1))
    equal(topWords("abc123abc", 10), listOf("abc" to 2))
}
test("empty and wordless text") {
    equal(topWords("", 3), emptyList<Pair<String, Int>>())
    equal(topWords("  42 -- !!", 3), emptyList<Pair<String, Int>>())
}
test("k of zero or less gives an empty list") {
