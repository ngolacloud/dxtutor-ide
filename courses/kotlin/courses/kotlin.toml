[[unit.step]]
kind = "drill"
id = "kt-u09-d3-fold-sort"
title = "Fold, sort and flatten"
points = 10
difficulty = 9
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
`fold` is the most general aggregation: it threads an **accumulator** through the list, so
`sum`, `max` and `joinToString` are all special cases of it. Sorting is a different kind of
operation: `sortedBy` and `sortedWith` use a stable O(n log n) merge sort (TimSort), so
elements that compare equal keep their original order. That stability is what makes
multi-key sorting predictable.
'''
prompt = '''
Aggregate a list with `fold` and `reduce`, sort pairs by one key and then by two keys with a
comparator, find a maximum safely, flatten sentences into words with `flatMap`, and count
values with `groupingBy`.

**Why:** "sum it up" and "sort by this, then by that" come up in every report, and `fold` and
comparators are the general tools behind both.
'''
target = '''
fun main() {
    val nums = listOf(4, 8, 15, 16, 23, 42)
    println(nums.fold(0) { acc, n -> acc + n })
    println(nums.reduce { acc, n -> maxOf(acc, n) })
    println(nums.fold("") { acc, n -> acc + n % 10 })

    val people = listOf("Lin" to 34, "Ada" to 36, "Bob" to 34, "Eve" to 29)
    println(people.sortedBy { it.second })
    val byAgeThenName = compareByDescending<Pair<String, Int>> { it.second }.thenBy { it.first }
    println(people.sortedWith(byAgeThenName))
    println(people.maxByOrNull { it.second }?.first)
    println(emptyList<Int>().maxOrNull())

    val sentences = listOf("to be or", "not to be")
    val words = sentences.flatMap { it.split(" ") }
    println(words)
    println(words.distinct())
    println(words.groupingBy { it }.eachCount())
}
'''
