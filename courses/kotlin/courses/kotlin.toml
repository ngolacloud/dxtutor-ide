[unit.step.gabarito]
solution = '''
class RingDeque<T : Any> {
    private var data = arrayOfNulls<Any?>(8)
    private var head = 0   // slot of the first element

    var size = 0
        private set

    fun isEmpty(): Boolean = size == 0

    fun addFirst(value: T) {
        growIfFull()
        head = (head - 1 + data.size) % data.size
        data[head] = value
        size++
    }

    fun addLast(value: T) {
        growIfFull()
        data[(head + size) % data.size] = value
        size++
    }

    fun removeFirst(): T {
        if (size == 0) throw NoSuchElementException("deque is empty")
        val value = at(head)
        data[head] = null
        head = (head + 1) % data.size
        size--
        return value
    }

    fun removeLast(): T {
        if (size == 0) throw NoSuchElementException("deque is empty")
        val last = (head + size - 1) % data.size
        val value = at(last)
        data[last] = null
        size--
        return value
    }

    fun firstOrNull(): T? = if (size == 0) null else at(head)

    fun lastOrNull(): T? = if (size == 0) null else at((head + size - 1) % data.size)

    operator fun get(index: Int): T {
        if (index < 0 || index >= size) throw IndexOutOfBoundsException("index $index, size $size")
        return at((head + index) % data.size)
    }

    private fun growIfFull() {
        if (size < data.size) return
        val bigger = arrayOfNulls<Any?>(data.size * 2)
        for (i in 0 until size) bigger[i] = data[(head + i) % data.size]   // unwrap in logical order
        data = bigger
        head = 0
    }

    @Suppress("UNCHECKED_CAST")
    private fun at(slot: Int): T = data[slot] as T
}
'''
time = "O(1) amortized per operation"
space = "O(n)"
justification = '''
Every operation except growth touches a constant number of slots and indices: a modulo, one
array read or write, and an update of `head` or `size`. That is **O(1)** at both ends, and
for `get`, because nothing is ever shifted: only the `head` index moves, and element `i` is
found by arithmetic, `(head + i) % capacity`.

Growth copies all n elements, which is O(n), but it happens only when the array is full, and
the capacity doubles each time. Reaching n elements costs copies of 8 + 16 + 32 + ... + n,
which is less than 2n in total, so the copying adds O(1) **amortized** per insertion. This
is the same argument that makes `ArrayList.add` amortized O(1).

Space is **O(n)**: the array is at most twice the largest number of elements it has held (it
never shrinks, like `ArrayDeque`). Copying in **logical** order, `data[(head + i) % size]`
for i from 0, is what keeps growth correct when the contents wrap around the end of the
array; a plain `copyOf` would keep the wrapped layout but break the modular indices once
the capacity changes. A `MutableList` with `removeAt(0)` would be O(n) per removal, so the
200,000-element test would take tens of billions of element moves instead of a few milliseconds.
Clearing removed slots avoids holding on to dead objects.
'''

