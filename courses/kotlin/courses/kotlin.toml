[unit.step.gabarito]
solution = '''
fun wordPositions(words: List<String>): Map<String, List<Int>> {
    val index = mutableMapOf<String, MutableList<Int>>()
    for (i in words.indices) {
        val word = words[i].trim().lowercase()
        if (word.isEmpty()) continue
        index.getOrPut(word) { mutableListOf() }.add(i)
    }
    return index
}
'''
time = "O(n · L)"
space = "O(n · L)"
justification = '''
Let `n` be the number of entries and `L` the length of the longest one. The loop visits each
entry once. `trim()` and `lowercase()` each look at every character and build a new string,
which is O(L). Hashing the word for `getOrPut` is also O(L), and the hash lookup itself is
O(1) on average. Appending the index to the word's list is amortised O(1), because an
`ArrayList` grows by a constant factor. Each entry therefore costs O(L), and the whole pass
costs **O(n · L)**. When words are short, which is the usual case, that is simply O(n).

The map holds at most one key per distinct word, and the lists hold exactly one `Int` per
non-blank entry. In the worst case every word is different, so the space is
**O(n · L)** for the keys plus O(n) for the positions.

Positions come out ascending without any sorting, because indexes are appended in the order
the loop visits them. `mutableMapOf` creates a `LinkedHashMap`, which is why the keys keep the
order of first occurrence. The function builds with mutable types and returns
`Map<String, List<Int>>`, so callers receive a read-only view.
'''

[[unit]]
id = "kt-u09-collection-operations"
title = "Collection operations"
level = "intermediate"
difficulty = 9
intro = '''
Kotlin's standard library has dozens of small functions that turn one collection into
another: `map`, `filter`, `groupBy`, `associate`, `fold`, `partition`, `zip` and more. This
unit teaches you to chain them into readable pipelines that replace most hand-written loops.
The challenge ranks the most frequent words in a text.
'''
concepts = '''
## The idea

Most loops over a collection do one of a handful of things. They **transform** each element,
**keep** some elements, **combine** everything into one value, or **sort and group** the
elements. Functional programming gives each of these jobs a name and turns it into a function
that takes a small function, a **lambda**, as its argument. Instead of writing how to loop,
you say what you want, and the pipeline reads from top to bottom like a recipe.

## How Kotlin does it

A lambda goes in braces. When it has one parameter you can leave the parameter out and call
it `it`. When the lambda is the last argument, it goes outside the parentheses:

```kotlin
val prices = listOf(12, 5, 30, 7)
val cheap = prices.filter { it < 10 }          // [5, 7]
val labels = prices.map { p -> "$p EUR" }      // [12 EUR, 5 EUR, 30 EUR, 7 EUR]
```

The main families are:

- **Transform**: `map`, `mapIndexed`, `mapNotNull`, `flatMap` (one element to many),
  `zip` (pair two lists element by element).
- **Select**: `filter`, `filterNot`, `take`, `drop`, `distinct`, `partition` (a pair of
  lists: the matches and the rest).
- **Aggregate**: `count`, `sum`, `sumOf { }`, `maxByOrNull { }`, `any`, `all`, `none`, and
  the general tools `fold(initial) { acc, x -> }` and `reduce`.
- **Organise**: `sortedBy { }`, `sortedWith(comparator)`, `groupBy { }` (key to list of
  elements), `associateBy`, `associateWith`, `associate`, and `groupingBy { }.eachCount()`
  for counting.

```kotlin
val words = listOf("apple", "bob", "avocado")
words.groupBy { it.first() }          // {a=[apple, avocado], b=[bob]}
words.associateWith { it.length }     // {apple=5, bob=3, avocado=7}
```

Each of these functions is **eager**: it runs at once and returns a new, read-only
collection. The original is never changed. Java needs `.stream()` and `.collect(...)` around
such a pipeline; in Kotlin the functions are called directly on the collection. (Unit 19
shows lazy sequences for very large pipelines.)

## Pitfalls and compiler errors

- `reduce` on an empty list throws `UnsupportedOperationException`. Use `fold` with a
  starting value, or `reduceOrNull`.
- `max()` and `first()` throw on an empty collection. Prefer `maxOrNull()`,
  `maxByOrNull { }` and `firstOrNull()` when the collection may be empty.
- Inside nested lambdas, `it` refers to the innermost one. Name the parameters
  (`{ word -> ... }`) to avoid confusion.
- `sortedWith(compareByDescending { ... }.thenBy { ... })` cannot infer the element type.
  Write it as `compareByDescending<Pair<String, Int>> { it.second }`.
- Every step creates a new collection, so a ten-step pipeline makes ten intermediate lists.
  That is fine for thousands of elements, but worth knowing.

## What you will practise

You will transform and filter lists, build maps with `groupBy` and `associate`, split them
with `partition`, combine them with `zip`, and reduce them with `fold`, then sort by several
keys. The challenge counts word frequencies and ranks them.
'''

[[unit.step]]
kind = "concept"
id = "kt-u09-c1-pipelines"
title = "Pipelines of small functions"
points = 5
difficulty = 9
intro = '''
A higher-order function takes another function as an argument. `map` and `filter` are
higher-order functions: they own the loop, and your lambda owns the decision. Separating the
two is what makes pipelines short and hard to get wrong.
'''
body = '''
## From a loop to a pipeline

Here is a typical loop that collects the names of adult users, in uppercase:

```kotlin
val result = mutableListOf<String>()
for (u in users) {
    if (u.age >= 18) {
        result.add(u.name.uppercase())
    }
}
```

And here is the same job as a pipeline:

```kotlin
val result = users
    .filter { it.age >= 18 }
    .map { it.name.uppercase() }
```

The pipeline has no mutable list, no index and no `add`. Each line does one thing, and the
result is a read-only `List<String>`.

## Lambdas

`{ it.age >= 18 }` is a function literal. Its parameter is `it`, and its result is the last
expression in the braces. You can name the parameter, `{ u -> u.age >= 18 }`, or take two
parameters, `{ acc, x -> acc + x }`. If the lambda is the last argument, it goes after the
parentheses, and if it is the only argument the parentheses disappear completely:
`users.filter { ... }`.

## Reading a pipeline

Read it from top to bottom, and keep track of the **type** at each step:
`List<User>` → `filter` → `List<User>` → `map` → `List<String>`. Most mistakes are type
mistakes, such as calling `sum()` on a list of strings, and the compiler reports them at the
step where they happen. When a chain gets long, break it across lines with one operation per
line, as above.
'''

