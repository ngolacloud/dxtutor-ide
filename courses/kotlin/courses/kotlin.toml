intro = '''
Brackets nest, and nesting is LIFO: the most recently opened bracket must be the first to
close. Push every opener; at every closer, pop and check that it matches. The text is
balanced if no check fails and the stack ends up empty.
'''
prompt = '''
Write `balanced` with an `ArrayDeque` used as a stack, and test it on five strings,
including an empty one and one that starts with a closer.

**Why:** matching nested structure is the canonical stack algorithm, at the core of every
parser, compiler and code editor.
'''
target = '''
fun balanced(text: String): Boolean {
    val pairs = mapOf(')' to '(', ']' to '[', '}' to '{')
    val open = ArrayDeque<Char>()
    for (c in text) {
        when (c) {
            '(', '[', '{' -> open.addLast(c)
            ')', ']', '}' -> if (open.removeLastOrNull() != pairs[c]) return false
        }
    }
    return open.isEmpty()
}

fun main() {
    for (s in listOf("(a[b]{c})", "([)]", "((", "", "}")) {
        println("\"$s\" -> ${balanced(s)}")
    }
}
'''
