target = '''
import kotlinx.coroutines.*
import kotlinx.coroutines.channels.*

@OptIn(ExperimentalCoroutinesApi::class)
fun CoroutineScope.numbers(limit: Int): ReceiveChannel<Int> = produce {
    for (n in 1..limit) send(n)
}

@OptIn(ExperimentalCoroutinesApi::class)
fun CoroutineScope.squares(input: ReceiveChannel<Int>): ReceiveChannel<Int> = produce {
    for (n in input) send(n * n)
}

fun main() = runBlocking {
    val pipeline = squares(numbers(5))
    for (sq in pipeline) print("$sq ")
    println()

