title = "Build an ordered worker pool"
points = 40
difficulty = 25
entry = "workerPool"
intro = '''
A worker pool bounds concurrency: a fixed number of workers share a queue of jobs, so a
thousand requests never become a thousand simultaneous connections. Building one from channels
combines fan-out, fan-in, closing protocols and the bookkeeping needed to return results in
their original order.
'''
instructions = '''
## Your turn

Implement `workerPool`:

```kotlin
suspend fun <T, R> workerPool(jobs: List<T>, workers: Int, work: suspend (T) -> R): List<R>
```

It applies `work` to every element of `jobs` using **exactly `workers` concurrent worker
coroutines**, and returns the results **in the order of `jobs`**.

Rules:

- `workers` must be at least 1; otherwise throw `IllegalArgumentException`.
- At most `workers` calls to `work` may run at the same time, and when there are enough jobs,
  exactly `workers` should run at once. The hidden tests count the calls in flight.
- Call `work` exactly once per element of `jobs`. Duplicates are separate jobs: `["a", "a"]`
  means two calls.
- An empty `jobs` list returns an empty list without calling `work`.
- If a call to `work` throws, `workerPool` throws that exception, and the other workers are
  cancelled.

Examples:

- `workerPool(listOf(1, 2, 3), 2) { it * 10 }` returns `[10, 20, 30]`.
- `workerPool(listOf("b", "a"), 5) { it.uppercase() }` returns `[B, A]`.
- `workerPool(emptyList<Int>(), 3) { it }` returns `[]`.

**Hint:** inside `coroutineScope`, send `jobs.withIndex()` into a jobs channel from one
coroutine and close it. Launch `workers` coroutines that loop over that channel and send
`index to result` pairs into a results channel, which a separate coroutine closes after
`joinAll()` on the workers. Read the results into a map by index and rebuild the list in order.

Hidden tests decide correctness.
'''
