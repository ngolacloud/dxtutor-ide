tests = '''
import java.util.concurrent.ConcurrentHashMap
import java.util.concurrent.atomic.AtomicInteger
import kotlinx.coroutines.delay
import kotlinx.coroutines.runBlocking
test("fetches every id") {
    runBlocking {
        equal(
            fetchAll(listOf(1, 2, 3)) { "user$it" },
            mapOf(1 to "user1", 2 to "user2", 3 to "user3"),
        )
    }
}
test("empty input makes no calls") {
    runBlocking {
        val calls = AtomicInteger(0)
        equal(fetchAll(emptyList()) { calls.incrementAndGet(); "x" }, emptyMap<Int, String>())
        equal(calls.get(), 0)
    }
}
test("a single id") {
    runBlocking { equal(fetchAll(listOf(42)) { "answer $it" }, mapOf(42 to "answer 42")) }
}
test("duplicates, zero and negatives are fetched once each") {
    runBlocking {
        val calls = ConcurrentHashMap<Int, Int>()
        val result = fetchAll(listOf(7, -3, 7, 7, 0, -3)) { id ->
            calls.merge(id, 1, Int::plus)
            delay(2)
            "v$id"
        }
        equal(result, mapOf(7 to "v7", -3 to "v-3", 0 to "v0"))
        equal(calls.toMap(), mapOf(7 to 1, -3 to 1, 0 to 1))
    }
}
test("all calls are in flight at the same time") {
    runBlocking {
        val active = AtomicInteger(0)
        val peak = AtomicInteger(0)
        val result = fetchAll((1..10).toList()) { id ->
            peak.accumulateAndGet(active.incrementAndGet()) { a, b -> maxOf(a, b) }
            delay(20)
            active.decrementAndGet()
            "r$id"
        }
        equal(result.size, 10)
        equal(result[10], "r10")
        equal(peak.get(), 10)
    }
}
test("finishing order does not change the mapping") {
    runBlocking {
        val result = fetchAll(listOf(1, 2, 3, 4)) { id ->
            delay(5L * (5 - id))
            "item$id"
        }
        equal(result, mapOf(1 to "item1", 2 to "item2", 3 to "item3", 4 to "item4"))
    }
}
test("a failing call fails the whole fetch") {
    assertThrows<IllegalStateException> {
        runBlocking {
            fetchAll(listOf(1, 2, 3)) { id ->
                delay(2)
                check(id != 2) { "server down" }
                "ok"
            }
        }
    }
}
test("large input with many duplicates") {
    runBlocking {
        val calls = AtomicInteger(0)
        val ids = (0 until 20_000).map { it % 5_000 }
        val result = fetchAll(ids) { calls.incrementAndGet(); "n$it" }
        equal(result.size, 5_000)
        equal(result[4_999], "n4999")
        equal(calls.get(), 5_000)
    }
}
'''

[unit.step.gabarito]
solution = '''
import kotlinx.coroutines.async
import kotlinx.coroutines.awaitAll
import kotlinx.coroutines.coroutineScope

suspend fun fetchAll(ids: List<Int>, fetch: suspend (Int) -> String): Map<Int, String> =
    coroutineScope {
        val unique = ids.distinct()
        val results = unique.map { id -> async { fetch(id) } }.awaitAll()
        unique.zip(results).toMap()
    }
'''
time = "O(n)"
space = "O(n)"
justification = '''
`distinct()` makes one pass over the `n` ids with a hash set, so deduplication is **O(n)**
time. Starting one `async` per distinct id, awaiting them and zipping the results into a map
are each linear in the number of distinct ids `d ≤ n`, giving **O(n)** CPU work overall. The
set, the list of `Deferred` handles, the results and the map each hold at most `n` entries, so
the space is **O(n)**; every coroutine is a small heap object, not a thread.

Wall-clock time is the interesting part. Because all `d` calls are started before the first
`awaitAll`, their waiting overlaps: the total is about the latency of the **slowest** call,
not the sum of all of them. A `for` loop that awaited each call before starting the next
would take `d` times as long. `coroutineScope` keeps the work structured: it does not return
until every child has finished, and if one `fetch` throws it cancels the others and rethrows
the exception to the caller.
'''

[[unit]]
id = "kt-u23-structured-concurrency"
title = "Structured concurrency: scopes, cancellation and timeouts"
level = "advanced"
difficulty = 23
intro = '''
In Kotlin every coroutine lives in a tree: it has a parent scope that waits for it, can cancel
it, and hears about its failures. You will group work with `coroutineScope`, cancel a job
cooperatively, bound work with `withTimeout`, and finish with a dashboard loader in which one
slow or broken widget cannot take the whole page down.
'''
concepts = '''
## The idea

Starting concurrent work is easy; ending it correctly is hard. Who waits for a background
task? Who stops it when the user leaves the screen? What happens to its siblings when it
fails? Code built from raw threads or futures answers these questions by hand, and leaks
whenever it forgets. **Structured concurrency** answers them with one rule: *every coroutine
starts inside a scope, and a scope does not finish until all of its children have finished.*
Concurrency then nests the way blocks of code do, and no task outlives the function that
started it.

## How Kotlin does it

`coroutineScope { … }` is a suspend function that opens a scope, runs its block, and then
waits for every coroutine launched inside it:

```kotlin
suspend fun loadBoth(): Pair<String, String> = coroutineScope {
    val a = async { fetch("a") }
    val b = async { fetch("b") }
    a.await() to b.await()
}
```

The tree gives three guarantees:

- **Waiting.** A parent completes only after its children; `runBlocking` and
  `coroutineScope` both wait.
- **Cancellation flows down.** Cancelling a `Job` cancels all of its children.
- **Failure flows up.** If a child throws, the scope cancels the other children and rethrows
  the exception to whoever called `coroutineScope`. (`supervisorScope` is the variant in which
  siblings survive.)

Cancellation is **cooperative**. `job.cancel()` only marks the job; the coroutine notices at
its next suspension point (`delay`, `await`, `yield`, a channel `receive`…), where a
`CancellationException` is thrown. A tight loop that never suspends must check `isActive` or
call `ensureActive()`. Because cancellation is an exception, `finally` blocks run, and that is
where you release resources.

Timeouts are cancellation driven by a clock. `withTimeout(ms) { … }` cancels its block when the
time is up and throws `TimeoutCancellationException`; `withTimeoutOrNull(ms) { … }` returns
`null` instead.

## What is special or tricky

- **Never swallow `CancellationException`.** A `catch (e: Exception)` around a suspend call
  also catches cancellation, and the coroutine carries on as if nothing had happened. Rethrow
  it, or catch narrower exception types.
- **`TimeoutCancellationException` is a `CancellationException`.** Thrown inside `launch`, it
  quietly ends that coroutine instead of crashing anything. When a timeout is a normal
  outcome, prefer `withTimeoutOrNull`.
- **`GlobalScope.launch` escapes the tree**: nobody waits for it or cancels it, and the
  compiler flags it as a delicate API that needs an explicit opt-in.
- **Suspending inside `finally` after cancellation** throws at once; wrap such cleanup in
  `withContext(NonCancellable) { … }`.
- Java's closest analogue is `StructuredTaskScope`, still a preview API in JDK 21.

## What you will practise

You will watch `coroutineScope` wait for its children, cancel a working coroutine and see its
`finally` run, and use both timeout functions while one failing child cancels its sibling. The
challenge combines all three: load several widgets concurrently, each with its own deadline,
and keep every failure contained.
'''

[[unit.step]]
kind = "concept"
id = "kt-u23-c1-job-tree"
title = "The job tree"
points = 5
difficulty = 23
intro = '''
Every coroutine has a `Job`, and jobs form a tree that mirrors how the code is nested. The tree
is not bookkeeping for its own sake: it is what lets the runtime wait for, cancel and report
failures of work you started, without you tracking any of it by hand.
'''
body = '''
## Parents and children

Calling `launch` or `async` inside a scope creates a child `Job` of that scope. Nested calls
build a tree:

```kotlin
runBlocking {                    // root
    launch {                     // child A
        launch { delay(10) }     // grandchild A1
    }
    async { 42 }                 // child B
}
```

`runBlocking` returns only when A, A1 and B have all completed, because a job is not complete
until its children are.

## Three rules

1. **A parent waits for its children.** No coroutine is left running behind your back.
2. **Cancelling a parent cancels its descendants.** Cancel the root and A, A1 and B all stop
   at their next suspension point.
3. **A failing child cancels its parent**, which then cancels the remaining children, and the
   exception surfaces where the scope was opened. One error ends the whole operation instead
   of leaving half of it running.

## Cooperative cancellation

`cancel()` does not kill a thread. It moves the job into the *cancelling* state, and the
coroutine finds out at its next suspension point, where a `CancellationException` is thrown.
`finally` blocks run as the exception unwinds. A loop that never suspends never notices, so
CPU-bound loops call `ensureActive()` or check `isActive` on every iteration.

## Job states

A job is *active* while it runs, *completing* while it waits for children, then *completed*;
cancellation adds *cancelling* and *cancelled*. `isActive`, `isCompleted` and `isCancelled`
read these states, and `cancelAndJoin()` cancels a job and waits until it has really stopped.
'''

