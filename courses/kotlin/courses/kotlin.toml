id = "kotlin-basics"
language = "kotlin"
title = "Kotlin: From Zero to Confident"
level = "beginner"
summary = "A serious, guided course in Kotlin that takes you from your very first program to the ideas that make modern Android and backend code concise and safe: null safety, data and sealed classes, extensions, coroutines and Flow. You read a short concept, build muscle memory by typing small, complete programs, then prove what you learned by writing real functions that hidden tests check."
overview = '''
## What Kotlin is

Kotlin is a modern, **statically typed** programming language created by JetBrains. It
compiles to bytecode for the **Java Virtual Machine** (JVM) and is fully interoperable with
Java: Kotlin code can call any Java library, and Java code can call Kotlin. It keeps Java's
mature runtime and ecosystem while removing much of its ceremony. This course teaches
**Kotlin 2.x on the JVM**.

## Where it is used

Kotlin is Google's preferred language for **Android** development. On the **server**, it is widely used with Spring, which
supports Kotlin directly, and with Ktor, JetBrains' own framework for web services.

## The mental model you will build

- **Expressions everywhere.** `if`, `when` and `try` produce values, so code reads as a
  description of results rather than a sequence of assignments.
- **Null safety in the type system.** `String` can never be null; `String?` can, and the
  compiler makes you handle that case before it can crash.
- **Immutability by default.** `val` over `var`, read-only collections, and copies instead of
  mutation.
- **Concise data modelling.** Data classes, sealed hierarchies and exhaustive `when` describe
  your domain in a few lines that the compiler checks.
- **Structured concurrency.** Coroutines make asynchronous code look sequential, with
  lifetimes and cancellation tied to a scope.

## How the course is organised

- **Basic:** your first program, variables and types, strings, `if`/`when`, loops and
  functions.
- **Intermediate:** null safety, collections and their operations, classes, data and sealed
  classes, extensions and higher-order functions, then a **production Kotlin** block: scope
  functions, errors and `Result`, generics and variance, sequences, objects and enums, and
  delegation.
- **Advanced:** coroutines, structured concurrency, Flow, channels, type-safe DSLs, operator
  overloading and value classes, then data structures and algorithms by hand: stacks and
  queues, linked lists, hash maps, binary search trees, sorting and searching, recursion and
  dynamic programming.

## How the steps work

Each unit opens with a reading text and has three kinds of step. A **concept** step explains
one idea with a short example. A **drill** asks you to type a complete program line by line;
each line has a note, and the program is compiled and run so you see its output. A
**challenge** asks you to write real functions; hidden tests check them on normal and edge
cases, and a reference solution with a complexity analysis unlocks once you pass.
'''

# ── g1-basic ────────────────────────────────────────────────────────────

[[unit]]
id = "kt-u01-hello"
title = "Hello & println"
level = "basic"
difficulty = 1
intro = '''
Your very first steps in Kotlin: what a program is, how the Kotlin compiler turns your
source file into something the Java Virtual Machine can run, and how `println` shows text
on the screen. By the end you will write a tiny greeting function and let the hidden tests
check it.
'''
concepts = '''
## The idea

A computer does not understand English; it follows instructions, one after another. A
**programming language** is a precise notation that people can read and that a tool can
turn into actions the machine carries out. Kotlin is a **compiled** language, and running
a Kotlin program takes two separate steps:

1. **Compile.** The Kotlin compiler, `kotlinc`, reads your whole source file (a plain text
   file ending in `.kt`) and translates it into **bytecode**, the instruction format of the
   **Java Virtual Machine** (JVM). The result is packed into a `.jar` file.
2. **Run.** The `java` program starts a JVM, loads that bytecode and executes it.

```text
kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar
```

`-include-runtime` packs the Kotlin standard library into the jar, and `-d` names the
output file. Because the compiler checks the entire program *before* anything runs, many
mistakes are reported as **compile errors** with a file, a line and a column, such as
`Main.kt:2:5: error: ...`, and nothing runs until they are fixed.

## How Kotlin does it

Every Kotlin program starts in a function called `main`:

```kotlin
fun main() {
    println("Hello, Kotlin!")
    println(2 + 3)
}
```

`fun` declares a **function**, `main` is its name, the empty parentheses mean it takes no
input, and the curly braces `{ }` hold its **body**, the statements that run in order from
top to bottom. When the closing brace is reached, the program ends. Unlike Java, you don't
need a class or `public static void main(String[] args)`, and you don't need semicolons at
the end of lines.

`println` writes its argument to **standard output** (the text the terminal shows) and then
ends the line; `print` writes without ending the line. Text between double quotes is a
**string**.

Comments are notes for humans. `//` comments out the rest of a line, and `/* ... */` can span
several lines. Kotlin, unlike Java, lets block comments **nest**, so you can comment out code
that already contains a block comment.

## What is special or tricky

- **Case matters.** It is `println`, never `Println`; the second spelling fails with
  `error: unresolved reference 'Println'.`
- **Strings use double quotes.** Single quotes hold exactly one character, like `'A'`;
  `'hello'` fails with `too many characters in a character literal`.
- **Statements live inside functions.** A `println` written outside `main` fails with
  `syntax error: Expecting a top level declaration`, and a missing `}` gives
  `Expecting '}'`.
- **Whole numbers divide as whole numbers.** `7 / 2` is `3`, not `3.5`; write `7.0 / 2`
  to get a decimal result.
- **`println` shows a value; it does not hand one back.** A function that should *produce*
  a result for other code uses `return`, which you will meet in the challenge and study
  properly in unit 6.

## What you will practise

You will type a first program with comments, mix `print` and `println`, and print the
results of small calculations. Then you will write your first function, one that builds a
greeting string from a name it receives.
'''

[[unit.step]]
kind = "concept"
id = "kt-u01-c1-programs"
title = "What a Kotlin program is"
points = 5
difficulty = 1
intro = '''
Before you write anything, picture what happens to your code. The compiler first checks and
translates the whole file into JVM bytecode; only then does the JVM run it, starting at
`main`. Anything you `println` travels to **standard output**, which the terminal shows on
screen.
'''
body = '''
## Compile first, then run

A Kotlin program is a plain text file, usually named something like `Main.kt`. It is not
run directly. First the compiler, `kotlinc`, reads the whole file, checks that every name
exists and every value has a sensible type, and translates it into bytecode for the Java
Virtual Machine. Then `java` runs that bytecode. If the compiler finds a mistake, it
reports it and nothing runs at all.

```kotlin
// This line is a comment: the compiler skips it.
fun main() {
    println("Hello, Kotlin!")
    println("Kotlin can count: " + (2 + 3))
}
```

Things to notice:

- **`fun main()`** is the **entry point**: the JVM starts running your code here.
- **`println(...)`** writes its argument to standard output and finishes the line.
- **`"Hello, Kotlin!"`** is a **string**, a piece of text between double quotes.
- **`2 + 3`** is an **expression**. Its value, `5`, is computed before it is used, and `+`
  between a string and a value glues them into one longer string.
- **`// ...`** starts a comment, a note for the people reading your code.

## What the tutor does

In each drill you type a small, complete program. When your code matches the target, the
tutor saves it as `Main.kt`, compiles it and runs it, so you see exactly what the program
prints. Compiling takes a few seconds, because the compiler itself runs on a fresh JVM. In
each challenge you write a function instead, and hidden tests call it with many different
inputs to check that it returns the right values.
'''

