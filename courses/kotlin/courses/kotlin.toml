    equal(topWords("b a b", 100), listOf("b" to 2, "a" to 1))
}
test("a large text") {
    val sb = StringBuilder()
    for (i in 0 until 200_000) {
        sb.append(if (i % 2 == 0) "alpha " else if (i % 3 == 0) "Beta, " else "gamma! ")
    }
