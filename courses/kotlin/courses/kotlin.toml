[[unit.step]]
kind = "challenge"
id = "kt-u09-x1-top-words"
title = "Rank the most frequent words"
points = 30
difficulty = 9
entry = "topWords"
intro = '''
Word frequency is the "hello world" of text analysis, and it combines the three phases of
most data pipelines: tokenise, aggregate with a hash map, then sort and take the top k.
Counting is linear, and sorting the distinct words costs O(u log u), so the total depends on
how many different words the text contains.
'''
instructions = '''
## Your turn

Implement `topWords`:

```kotlin
fun topWords(text: String, k: Int): List<Pair<String, Int>>
```

Return the `k` most frequent words in `text`, each paired with its count.

- A **word** is a maximal run of the letters `a` to `z` after the text is lowercased.
  Everything else separates words, so `"don't"` is the two words `don` and `t`, and digits
  never count.
- Matching is case-insensitive: `Go`, `go` and `GO` are all `go`.
- Sort by count, **highest first**. Break ties alphabetically, from A to Z.
- If there are fewer than `k` distinct words, return them all. If `k` is 0 or negative,
  return an empty list.

Examples:

- `topWords("the cat and the hat", 2)` → `[(the, 2), (and, 1)]`
- `topWords("Go, go! GO? stop.", 5)` → `[(go, 3), (stop, 1)]`
- `topWords("", 3)` → `[]`

**Hint:** `Regex("[a-z]+").findAll(...)` or `split(Regex("[^a-z]+"))` gives you the words.
Then `groupingBy { it }.eachCount()` counts them, and `sortedWith` with a two-key comparator
ranks them.

Hidden tests decide correctness.
'''
