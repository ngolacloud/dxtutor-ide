[[unit.step]]
kind = "drill"
id = "kt-u27-d2-grid"
title = "Indexing, in and invoke"
points = 10
difficulty = 27
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
`get` and `set` may take any number of index parameters, so a 2D grid can be indexed as
`g[r, c]` while storing its cells in one flat array (row-major order: `r * cols + c`).
`contains` powers `in`, and `invoke` lets an object be called like a function.
'''
prompt = '''
Write a `Grid` backed by one `IntArray` with `get`/`set` on two indices, `contains` and
`invoke`, then update cells, use `+=` on a cell and print rows.

**Why:** a flat array with computed indices is how images, game boards and matrices are
stored efficiently, and operators hide the index arithmetic from the caller.
'''
target = '''
class Grid(val rows: Int, val cols: Int) {
    private val cells = IntArray(rows * cols)

    operator fun get(r: Int, c: Int): Int = cells[r * cols + c]

    operator fun set(r: Int, c: Int, value: Int) {
        cells[r * cols + c] = value
    }

    operator fun contains(value: Int): Boolean = value in cells

    operator fun invoke(r: Int): List<Int> = List(cols) { c -> this[r, c] }
}

fun main() {
    val g = Grid(2, 3)
