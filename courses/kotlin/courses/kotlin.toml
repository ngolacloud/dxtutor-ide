    "Returns the number of steps, or -1 when the exit cannot be reached.",
    "Number of rows.",
    "Number of columns.",
    "Steps from the start to each cell; -1 means not discovered yet.",
    "The frontier of the search, as (row, column) pairs.",
    "The start is zero steps away.",
    "The search begins at the top-left corner.",
    "Runs until the frontier is exhausted.",
    "Takes the cell that has waited longest and destructures the pair.",
    "The first time the exit leaves the queue, its distance is the shortest.",
    "The four neighbours: down, up, right, left.",
    "Neighbour row.",
    "Neighbour column.",
    "Inside the grid, an open cell, and not seen before.",
    "One step further than the current cell.",
    "Joins the back of the queue.",
    "End of the if.",
    "End of the neighbours.",
    "End of the search.",
    "The queue ran dry without reaching the exit.",
    "End of shortestPath.",
    "",
    "The program's entry point.",
    "A maze: `.` is open, `#` is a wall.",
    "Row 0.",
    "Row 1.",
    "Row 2.",
    "Row 3.",
    "Row 4; the exit is its last cell.",
    "End of the maze.",
    "Prints `10`.",
    "The exit is walled off; prints `-1`.",
    "End of main.",
]
explanation = '''
The queue releases cells in the order they were discovered, so every cell 3 steps away
leaves before any cell 4 steps away. A cell's distance is therefore fixed, and minimal, the
first time it is discovered. The shortest route through the first maze goes down the left
column to row 2, along row 2 to column 3, then steps down and right through rows 3 and 4 to
the bottom-right corner: `10` steps. In the 2×2 maze both
neighbours of the start are walls, so the queue empties and the function returns `-1`. Each
cell enters the queue at most once, so BFS runs in O(rows·cols).
'''

[[unit.step]]
