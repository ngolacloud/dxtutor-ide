entry = "resolvePort"
intro = '''
Configuration arrives as text that may be missing, blank or simply wrong, and a robust
program validates it at the boundary and falls back in a defined order. Modelling "no valid
value" as `null` turns that whole precedence chain into a single expression of Elvis
operators. Each parse looks at every character once, so the work is linear in the length of
the input.
'''
instructions = '''
## Your turn

A server can take its port from a command-line flag, from an environment variable, or from a
built-in default. Implement two functions:

```kotlin
fun parsePort(raw: String?): Int?
fun resolvePort(cli: String?, env: String?, default: Int): Int
```

**`parsePort`** returns the port that `raw` describes, or `null` when it does not describe a
valid one:

- `null` in gives `null` out.
- Surrounding whitespace is ignored: `"  8080\n"` is `8080`.
- The rest must be a whole number in the range **1 to 65535**. Blank text, words, decimals,
  `0`, negatives and numbers too large to fit in an `Int` all give `null`.

**`resolvePort`** returns the first **valid** port in this order: `cli`, then `env`, then
`default`. An invalid flag does not stop the search; it is treated as if it were missing.

Examples:

- `parsePort(" 443 ")` → `443`
- `parsePort("65536")` → `null`
- `resolvePort("abc", "9000", 80)` → `9000`
- `resolvePort(null, "0", 80)` → `80`

Don't use `!!`; let `?.`, `?:` and smart casts do the work.

**Hint:** `trim()` and `toIntOrNull()` already do most of the parsing, and a chain such as
`a ?: b ?: c` picks the first non-null value.

Hidden tests decide correctness.
'''
starter = '''
