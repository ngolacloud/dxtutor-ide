The three legs add up to `Meters(value=1900.0)`, the longest is `Meters(value=1200.0)`, and
the speed is 1900 / 380 = `5.0` meters per second. `firstOrNull` finds the first leg longer
than 1000 meters, so the last line prints `1200.0`. Both classes wrap a `Double`, yet
`speed(Seconds(380.0), total)` is rejected at compile time. In `speed` the parameters are
plain `double`s on the JVM; only the list and the nullable `far` need boxed objects.
'''

