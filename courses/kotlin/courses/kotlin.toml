[unit.step.gabarito]
solution = '''
// Digits of n in groups of three, joined by separator: 1234567 -> "1,234,567".
// Negative numbers keep the minus sign: -1234 -> "-1,234". Must work for every Long.
fun groupDigits(n: Long, separator: String = ","): String {
    val digits = n.toString().removePrefix("-")
    val result = StringBuilder()
    if (n < 0) result.append('-')
    for (i in digits.indices) {
        if (i > 0 && (digits.length - i) % 3 == 0) result.append(separator)
        result.append(digits[i])
    }
    return result.toString()
}

// Cents as money: 123456 -> "$1,234.56", -5 -> "-$0.05".
// The sign comes first, then symbol, then the grouped whole part, a dot and two digits.
fun formatMoney(cents: Long, symbol: String = "$", separator: String = ","): String {
    val sign = if (cents < 0) "-" else ""
    val digits = cents.toString().removePrefix("-").padStart(3, '0')
    val whole = digits.dropLast(2).toLong()
    val fraction = digits.takeLast(2)
    return sign + symbol + groupDigits(whole, separator) + "." + fraction
}
'''
time = "O(d)"
space = "O(d)"
justification = '''
Let `d` be the number of digits of the input. `toString()` produces those `d` digits, the loop
visits each one once and appends at most one separator before it, and `StringBuilder` adds
each piece at the end of a growing buffer without recopying what is already there. So
`groupDigits` takes **O(d)** time and builds a result of **O(d)** characters. `formatMoney`
does a constant number of linear passes (`toString`, `padStart`, `dropLast`, `takeLast`, one
call to `groupDigits` and the final concatenation), so it is also **O(d)** in time and space.
Since a `Long` has at most 19 digits, `d` is tiny, and `d = O(log |n|)` in terms of the value.

Working on the text instead of on the value is what makes the extremes safe. The classic
approach, taking `abs(n)` and peeling digits with `% 10`, breaks on `Long.MIN_VALUE`, whose
absolute value overflows back to itself. The string of digits has no such limit, and
`dropLast(2).toLong()` on 19 digits leaves 17, which always fits.
'''

