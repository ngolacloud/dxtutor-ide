[unit.step.gabarito]
solution = '''
class HashTable<K : Any, V>(capacity: Int = 8) {
    class Entry<K, V>(val key: K, var value: V)

    var buckets: MutableList<MutableList<Entry<K, V>>> = MutableList(capacity) { mutableListOf() }
        private set
    var size: Int = 0
        private set
    val capacity: Int
        get() = buckets.size

    private fun chainOf(key: K): MutableList<Entry<K, V>> = buckets[key.hashCode().mod(buckets.size)]

    private fun entryOf(key: K): Entry<K, V>? = chainOf(key).firstOrNull { it.key == key }

    fun put(key: K, value: V) {
        val existing = entryOf(key)
        if (existing != null) {
            existing.value = value
            return
        }
        chainOf(key).add(Entry(key, value))
        size++
        if (size > 0.75 * capacity) grow()
    }

    private fun grow() {
        val old = buckets
        buckets = MutableList(old.size * 2) { mutableListOf() }
        for (chain in old) {
            for (entry in chain) chainOf(entry.key).add(entry)
        }
    }

    operator fun set(key: K, value: V) = put(key, value)

    operator fun get(key: K): V? = entryOf(key)?.value

    operator fun contains(key: K): Boolean = entryOf(key) != null

    fun remove(key: K): Boolean {
        val chain = chainOf(key)
        val i = chain.indexOfFirst { it.key == key }
        if (i < 0) return false
        chain[i] = chain[chain.lastIndex]
        chain.removeAt(chain.lastIndex)
        size--
        return true
    }
}
'''
time = "O(1) average (amortised for put); O(n) worst case when every key collides"
space = "O(n)"
justification = '''
`get`, `contains` and `remove` hash the key once and scan a single chain. Because the table
doubles whenever the load factor passes 0.75, the average chain length stays below a
constant, so these operations are **O(1) on average**. They degrade to O(n) only when every
key collides, as with the `Collide` keys in the tests, whose hash code is always 7.

`put` is O(1) plus an occasional resize. A resize to *2m* buckets rehashes all ~0.75·m entries
in O(m), but it happens only after the number of entries has doubled since the last one.
Summing the resize costs over *n* inserts gives a geometric series (… + n/4 + n/2 + n), which
is O(n) in total, so each insert is **O(1) amortised**. That is why 100,000 inserts finish in
milliseconds, while a table stuck at 8 buckets would scan chains of about 12,500 entries on
every operation.

Space is **O(n)**: the entries plus a bucket list kept within a constant factor of n (it never
shrinks on removal, so it is bounded by the peak size). Removing by moving the chain's last
entry into the hole and dropping the last slot keeps deletion O(1) within the chain, instead
of shifting the tail of the list. Using `mod` instead of `%` keeps negative hash codes,
including `Int.MIN_VALUE`, inside `0 until capacity`.
'''

[[unit]]
id = "kt-u32-binary-search-tree"
title = "Binary search trees"
level = "advanced"
difficulty = 32
intro = '''
A binary search tree keeps its keys in order by shape alone: smaller keys to the left, larger
keys to the right. You will insert keys and read them back sorted, search with a loop, watch
the height decide the cost, and finish with a generic `Bst<T : Comparable<T>>` that can delete
any key, including the root.
'''
concepts = '''
## The idea

A **binary tree** is made of nodes that each hold a key and up to two children, `left` and
`right`. A **binary search tree** (BST) adds one rule, the **BST property**: for every node,
every key in its left subtree is smaller and every key in its right subtree is larger.

That rule turns the tree into a decision procedure. To find a key, compare it with the root
and go left or right; each comparison discards a whole subtree. To insert, search for the key
and hang a new node where the search fell off the tree. An **in-order** traversal (left
subtree, node, right subtree) visits the keys in sorted order.

Every operation walks one path from the root down, so it costs **O(h)**, where *h* is the
**height**, the number of nodes on the longest root-to-leaf path. Shape is everything. Insert
keys in random order and *h* stays near 2·log₂ n, so a million keys need about 40 steps.
Insert them already sorted and every node gets only a right child: the tree degenerates into a
linked list with *h = n*. Self-balancing trees (red-black, AVL) rotate nodes to keep *h* in
O(log n); Java's `TreeMap` and `TreeSet`, which Kotlin uses through `sortedMapOf` and
`sortedSetOf`, are red-black trees.

## How Kotlin does it

A node is a small class with nullable children. To compare keys of a generic type, bound the
type parameter: `T : Comparable<T>` promises `compareTo`, and with it the operators `<`, `>`,
`<=` and `>=`:

```kotlin
class Node<T : Comparable<T>>(val key: T) {
    var left: Node<T>? = null
    var right: Node<T>? = null
}

fun <T : Comparable<T>> contains(root: Node<T>?, key: T): Boolean {
    var node = root
    while (node != null) {
        val c = key.compareTo(node.key)
        if (c == 0) return true
        node = if (c < 0) node.left else node.right
    }
    return false
}
```

`compareTo` returns a negative number, zero or a positive number; test its sign, never a
specific value like `-1`.

## What is special or tricky

- **The bound is checked at compile time.** `Bst<Any>` or a key class that is not
  `Comparable` fails with *argument type mismatch* or *type argument is not within its
  bounds*. Data classes are not comparable by default; implement `Comparable<YourType>`.
- **Smart casts and `var` properties.** `if (root != null) root.key` fails when `root` is a
  property. Copy it into a local `val` or `var`, as `contains` does with `node`.
- **Recursion follows the height.** Recursive insert or delete uses one stack frame per level:
  harmless at 40 levels, a `StackOverflowError` risk on a degenerate tree of a million nodes.
  Loops are safe at any height.
- **Duplicates need a policy.** These units keep keys unique: inserting an existing key
  changes nothing.

## What you will practise

You will insert keys and read them back with an in-order traversal, search iteratively while
counting steps, and compare the height of a balanced tree with a degenerate one. The challenge
is a full `Bst<T>` with insert, contains, height, in-order and deletion, checked on 100,000
random keys.
'''

[[unit.step]]
kind = "concept"
id = "kt-u32-c1-bst-property"
title = "The BST property and O(h)"
points = 5
difficulty = 32
intro = '''
Ordering the keys by position, smaller to the left and larger to the right, lets every
comparison throw away a whole subtree. The price is that cost now depends on the tree's
height, not just on how many keys it holds.
'''
body = '''
## The property

For every node, all keys in the left subtree are smaller and all keys in the right subtree are
larger. It must hold for the whole subtree, not only for the direct children. Inserting
`50, 30, 70, 20, 40, 60, 80` builds:

```text
        50
      /    \
    30      70
   /  \    /  \
  20  40  60  80
```

## Search and insert walk one path

At each node, compare and go left or right. A search ends at the key or at a missing child; an
insert hangs a new node exactly where the search fell off:

```kotlin
fun <T : Comparable<T>> insert(root: Node<T>?, key: T): Node<T> {
    if (root == null) return Node(key)
    if (key < root.key) root.left = insert(root.left, key)
    else if (key > root.key) root.right = insert(root.right, key)
    return root
}
```

Returning the subtree's root lets the caller reattach whatever comes back, which is how the
empty tree gets its first node.

## Height decides the cost

Both operations visit at most one node per level, so they cost **O(h)**. The tree above has
height 3 for 7 keys. Insert the same keys in sorted order and you get a chain of height 7. With
n keys, a balanced tree has height about log₂ n and a degenerate one has height n: for a
million keys, 20 steps against a million.

## In-order is sorted order

Visiting the left subtree, then the node, then the right subtree yields the keys in ascending
order, because the property puts everything smaller on the left. That makes a BST a sorted
collection that also supports fast inserts and deletes.
'''

[[unit.step]]
kind = "drill"
