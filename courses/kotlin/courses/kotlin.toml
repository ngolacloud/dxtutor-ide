}
test("a large input") {
    val words = List(100_000) { "w" + (it % 10) }
    val got = wordPositions(words)
    equal(got.size, 10)
    val w3 = got.getValue("w3")
    equal(w3.size, 10_000)
    equal(w3.first(), 3)
    equal(w3.last(), 99_993)
