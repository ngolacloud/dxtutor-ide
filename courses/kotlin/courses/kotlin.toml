target = '''
fun fibonacci(): Sequence<Long> = sequence {
    var a = 0L
    var b = 1L
    while (true) {
        yield(a)
        val next = a + b
        a = b
        b = next
    }
}

fun main() {
    val powersOfTwo = generateSequence(1) { it * 2 }
    println(powersOfTwo.take(10).toList())

    val countdown = generateSequence(5) { if (it > 0) it - 1 else null }
    println(countdown.joinToString(" "))

    println(fibonacci().take(12).toList())
    println(fibonacci().first { it > 1_000 })

    val collatz = generateSequence(27L) { if (it % 2 == 0L) it / 2 else 3 * it + 1 }
    println(collatz.takeWhile { it != 1L }.count())
}
