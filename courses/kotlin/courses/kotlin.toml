intro = '''
`runCatching` turns a block that might throw into a `Result`: a small value that holds either the
block's return value or the exception. Because a `Result` is just a value, you can store many of
them, transform them with `map`, and summarise them with `fold`, `getOrDefault` or
`exceptionOrNull`, without writing a single `try`.
'''
prompt = '''
Parse four amounts with `runCatching`, describe each outcome with `fold`, total the successes,
find the first error, and transform a success with `map`.

**Why:** batch work such as imports, migrations or calls to many services must keep going past
individual failures and report them afterwards; `Result` is the standard type for exactly that.
'''
target = '''
fun parseAmount(text: String): Int {
    val value = text.trim().toInt()
    require(value >= 0) { "negative amount: $value" }
    return value
}

fun main() {
    val inputs = listOf("120", "abc", "-5", " 30 ")
    val results = inputs.map { runCatching { parseAmount(it) } }

    for ((input, result) in inputs.zip(results)) {
        val text = result.fold(
            onSuccess = { "ok $it" },
            onFailure = { "failed: ${it.message}" },
        )
        println("'$input' -> $text")
    }

    val total = results.sumOf { it.getOrDefault(0) }
    println("total $total")
    val firstError = results.firstNotNullOfOrNull { it.exceptionOrNull() }
    println(firstError?.javaClass?.simpleName)
    println(runCatching { parseAmount("7") }.map { it * 100 }.getOrThrow())
}
'''
