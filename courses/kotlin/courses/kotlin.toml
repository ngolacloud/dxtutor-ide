import kotlinx.coroutines.delay
import kotlinx.coroutines.runBlocking
test("results keep the input order") {
    runBlocking {
        val result = workerPool((1..6).toList(), 3) { n ->
            delay(2L * (7 - n))
            n * 10
        }
