[[unit.step]]
kind = "drill"
id = "kt-u13-d2-state-machine"
title = "A download as a state machine"
points = 10
difficulty = 13
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
A finite-state machine is a set of states plus a transition function `(state, event) -> state`.
Encoding each state as its own subtype means each state carries exactly the data that makes sense
for it, so a finished download can't have a progress percentage and an idle one can't have an
error.
'''
prompt = '''
Model a download with a sealed class whose nested subtypes are `Idle`, `InProgress`, `Done` and
`Failed`. Write `render` and the transition function `next`, then drive the machine with a list
of events.

**Why:** a sealed state type plus a pure transition function is the standard way to model UI and
protocol state in Kotlin, and the compiler checks that every state is handled.
'''
target = '''
sealed class Download {
    data object Idle : Download()
    data class InProgress(val percent: Int) : Download()
    data class Done(val bytes: Long) : Download()
    data class Failed(val reason: String) : Download()
}

fun render(state: Download): String = when (state) {
    Download.Idle -> "waiting"
    is Download.InProgress -> "downloading ${state.percent}%"
    is Download.Done -> "finished, ${state.bytes} bytes"
    is Download.Failed -> "error: ${state.reason}"
}

fun next(state: Download, event: String): Download = when (state) {
    Download.Idle -> if (event == "start") Download.InProgress(0) else state
    is Download.InProgress -> when {
        event == "fail" -> Download.Failed("network")
        state.percent + 50 >= 100 -> Download.Done(2048)
        else -> Download.InProgress(state.percent + 50)
    }
    is Download.Done, is Download.Failed -> state
}

fun main() {
    var state: Download = Download.Idle
    println(render(state))
    for (event in listOf("start", "tick", "tick", "tick")) {
        state = next(state, event)
        println(render(state))
    }
}
'''
