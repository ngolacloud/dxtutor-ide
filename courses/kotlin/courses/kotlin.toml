prompt = '''
Write two `produce` stages, `numbers` and `squares`, connect them, and print what comes out.
Then fill a channel of capacity 2 without any receiver, close it, and drain it.

**Why:** pipelines are how channel programs are structured, and the buffered channel shows that
capacity decides when `send` has to suspend.
