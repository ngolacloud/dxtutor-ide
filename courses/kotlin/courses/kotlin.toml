instructions = '''
## Your turn

Implement two functions:

```kotlin
fun <T> paged(fetchPage: (page: Int) -> List<T>): Sequence<T>
fun firstErrors(log: Sequence<String>, n: Int): List<String>
```

**`paged`** turns a page-fetching function into one flat, lazy sequence of items:

- It yields the items of page 0, then page 1, then page 2, and so on, and ends at the first page
  that comes back empty. That empty page is fetched; the pages after it are not.
- It is **lazy**: creating the sequence fetches nothing, and a page is fetched only when one of its
  items is needed. With 3 items per page, `paged(api).take(5).toList()` fetches pages 0 and 1 only.
- Each new iteration starts again from page 0.

**`firstErrors`** returns the messages of the first `n` lines of `log` that start with `"ERROR "`
(ERROR followed by a space). The message is the rest of the line, trimmed. It must read **no more
lines than necessary**: with `n = 3` it stops right after the third error line, and with `n = 0`
