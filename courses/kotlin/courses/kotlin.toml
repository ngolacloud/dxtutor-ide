[unit.step.gabarito]
solution = '''
fun topWords(text: String, k: Int): List<Pair<String, Int>> {
    if (k <= 0) return emptyList()
    val counts = Regex("[a-z]+")
        .findAll(text.lowercase())
        .map { it.value }
        .groupingBy { it }
        .eachCount()
    return counts.toList()
        .sortedWith(compareByDescending<Pair<String, Int>> { it.second }.thenBy { it.first })
        .take(k)
}
'''
time = "O(n + u log u)"
space = "O(n)"
justification = '''
Let `n` be the length of the text and `u` the number of distinct words.

- `lowercase()` copies the text once: O(n).
- The regex scan visits each character once and yields every word. Hashing each word for
  `eachCount` costs time proportional to its length, so all the counting together is O(n).
- `toList()` turns the `u` map entries into pairs, O(u), and `sortedWith` sorts them in
  **O(u log u)** comparisons. Each comparison looks at a count and, only on a tie, at a word.
- `take(k)` copies at most `k ≤ u` pairs.

The total is **O(n + u log u)**. In normal text `u` is much smaller than `n`, so the counting
pass usually dominates. The space is **O(n)**: the lowercased copy, plus the map and the list
of `u` distinct words, whose total length is at most `n`.

When `k` is much smaller than `u`, a bounded heap (a `java.util.PriorityQueue` of size `k`)
would bring the ranking down to O(u log k). For a word list that fits in memory, the plain
sort is simpler and fast enough. Because the comparator orders by count and then by word,
the result is fully determined, even when many words share a count.
'''

[[unit]]
id = "kt-u10-classes"
title = "Classes and properties"
level = "intermediate"
difficulty = 10
intro = '''
A class bundles data and the operations that keep that data valid. Kotlin classes are much
shorter than Java's: the primary constructor, the fields and their getters fit in one line.
This unit covers primary and secondary constructors, `init` blocks, properties with custom
accessors, and visibility. The challenge is a bank account that cannot be put into an
invalid state.
'''
concepts = '''
## The idea

A **class** is a blueprint, and each **object** (or instance) built from it has its own
copy of the data. The class also decides which operations are allowed on that data. This is
**encapsulation**: code outside the class can use only what the class makes public, so the
class can guarantee its **invariants**, rules such as "the balance is never negative", that
must hold for every object at every moment.

## How Kotlin does it

```kotlin
class Account(val owner: String, var nickname: String = owner) {
    var balance: Long = 0
        private set                        // readable everywhere, writable only inside

    val isEmpty: Boolean
        get() = balance == 0L              // computed on every read, nothing stored

    init {
        require(owner.isNotBlank()) { "owner must not be blank" }
    }

    fun deposit(amount: Long) { balance += amount }
}

val a = Account("Ada")                     // no `new` keyword
```

- The **primary constructor** follows the class name. A parameter marked `val` or `var`
  becomes a **property**; a parameter without either is visible only in initialisers and
  `init` blocks.
- A **property** is a field together with its accessors. `a.balance` calls a getter and
  `a.nickname = "A"` calls a setter. You can write custom `get()` and `set(value)`, and
  inside a setter `field` refers to the stored value, called the **backing field**.
- **`init`** blocks run during construction, in source order together with the property
  initialisers. They are the place to validate arguments. `require(cond) { msg }` throws
  `IllegalArgumentException` when `cond` is false.
- A **secondary constructor**, `constructor(...) : this(...)`, must delegate to the primary
  one. Default arguments usually make it unnecessary.
- **Visibility**: `public` is the default; `private` means visible inside the class (or
  file); `protected` adds subclasses; `internal` means the same module. A property can have a
  narrower setter than getter, as with `private set` above.

Compared with Java, you write no field declarations, no getters and setters, and no
constructor body that copies arguments into fields. Kotlin classes are also `final` by
default; unit 12 shows `open`.

## Pitfalls and compiler errors

- `Property must be initialized or be abstract`: every property needs a value by the end of
  construction, from an initialiser or an `init` block.
- `Val cannot be reassigned`: you wrote to a `val` property after construction.
- `Cannot access 'balance': it is private in 'Account'`, or `The setter is private`: you
  touched a member from outside the class.
- Initialisation runs top to bottom. An `init` block that reads a property declared below it
  sees an uninitialised value (`0` or `null`), so keep validation after the properties it
  reads.
- Writing `balance = value` inside `balance`'s own setter calls the setter again, forever,
  until a `StackOverflowError`. Assign to `field` instead.

## What you will practise

You will write a class with computed properties and methods, validate constructor arguments
in `init`, add a secondary constructor, and control writes with custom setters and
`private set`. The challenge is a bank account whose balance stays valid whatever its callers
do.
'''

[[unit.step]]
kind = "concept"
id = "kt-u10-c1-classes-objects"
title = "Classes, objects and invariants"
points = 5
difficulty = 10
intro = '''
Object-oriented design rests on one idea: data and the code that is allowed to change it
belong together. A class that exposes its state only through methods can check every change,
so an invariant established once in the constructor stays true for the object's whole life.
'''
body = '''
## A class in one line

```kotlin
class Point(val x: Int, val y: Int)

val p = Point(3, 4)
println(p.x)        // 3
```

That single line declares a type, a constructor with two parameters, two read-only
properties, and their getters. `Point(3, 4)` creates an object; Kotlin has no `new` keyword.

## State and behaviour

Add a body with braces to give the class methods and more properties:

```kotlin
class Counter(private val max: Int) {
    var value = 0
        private set

    fun increment(): Boolean {
        if (value == max) return false
        value++
        return true
    }
}
```

Every `Counter` has its own `value`. Callers can read it, but `private set` means that only
`increment` can change it, and `increment` refuses to go past `max`. The rule
`0 <= value <= max` is an **invariant**: it holds after construction, and each method keeps
it true.

## Identity

Each call to a constructor creates a distinct object. Two `Point(3, 4)` objects hold the same
numbers, but for an ordinary class `==` compares **identity**, so they are not equal. Unit 11
shows data classes, which compare by content instead.

## Why bother

If `value` were a public `var`, any code anywhere could set it to `-7`, and every reader would
have to defend against that. Encapsulation moves the checks into one place, the class, and
leaves the rest of the program simpler.
'''

[[unit.step]]
kind = "drill"
id = "kt-u10-d1-class-basics"
title = "Properties, methods and identity"
points = 10
difficulty = 10
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
A property can be **stored**, with a backing field that holds a value, or **computed**, with
a getter that recalculates it on every read. From outside you cannot tell the two apart,
which is the **uniform access principle**: a class can switch between the two forms without
breaking any caller.
'''
prompt = '''
Write a `Rectangle` with two stored properties, a computed `area` and two methods, and a
`Counter` with a mutable property. Then use them and compare two rectangles with `==`.

**Why:** these are the parts of nearly every class you will write, and the final comparison
shows why an ordinary class does not compare by content.
'''
target = '''
class Rectangle(val width: Int, val height: Int) {
    val area: Int
        get() = width * height

    fun scaled(factor: Int): Rectangle = Rectangle(width * factor, height * factor)

    fun describe(): String = "${width}x$height (area $area)"
}

class Counter {
    var count = 0

    fun increment() {
        count++
    }
}

fun main() {
    val r = Rectangle(3, 4)
    println(r.describe())
    println(r.scaled(2).describe())

    val c = Counter()
    repeat(3) { c.increment() }
    c.count += 10
    println(c.count)

    println(r == Rectangle(3, 4))
    println(r == r)
}
'''
line_comments = [
  "The primary constructor declares two read-only properties, `width` and `height`.",
  "A computed property: it has no backing field...",
  "...and its getter runs on every read.",
  "",
  "A method that returns a new rectangle and leaves this one unchanged.",
  "",
  "`${width}x` needs braces because `widthx` would be read as one name. `$height` needs none.",
  "Closes `Rectangle`.",
  "",
  "A class without a primary constructor still gets a default one with no parameters.",
  "A stored, mutable property with an initial value.",
  "",
  "A method that changes the object's state.",
  "`count++` reads the property through its getter and writes it back through its setter.",
  "Closes `increment`.",
  "Closes `Counter`.",
  "",
  "The entry point.",
  "Calls the constructor. Kotlin has no `new` keyword.",
  "Prints `3x4 (area 12)`.",
  "Prints `6x8 (area 48)` for the scaled copy.",
  "",
  "A new counter, starting at 0.",
  "Calls the method three times.",
  "A public `var` can be changed from outside, which is often more than you want.",
  "Prints `13`.",
  "",
  "`==` on an ordinary class compares identity. This is a different object, so it prints `false`.",
  "The same object is always equal to itself: `true`.",
  "Closes `main`.",
]
explanation = '''
The program printed `3x4 (area 12)`, `6x8 (area 48)` and `13`, then `false` and `true`.
`area` looked like a stored value but was computed each time, and `scaled` returned a new
object. The counter showed both kinds of change: through a method, and directly through its
public `var`. The last two lines are the important ones. Without an `equals` of its own, a
class inherits identity comparison, so two rectangles with the same sides are still two
different objects.
'''

[[unit.step]]
kind = "drill"
id = "kt-u10-d2-init-constructors"
title = "Constructors, defaults and init"
points = 10
difficulty = 10
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
Construction is the one moment when an object can establish its invariants, so it is where
validation belongs. Kotlin runs property initialisers and `init` blocks from top to bottom,
and `require` throws `IllegalArgumentException` if an argument is bad. A constructor that
throws never produces an object, so an invalid object can never exist.
'''
prompt = '''
Write a `User` class with default arguments, a property derived from a plain constructor
parameter, an `init` block that validates and logs, and a secondary constructor. Then build
users in four ways and catch the error for a blank name.

**Why:** default and named arguments replace most of the overloaded constructors of Java, and
validating in `init` means no other code has to check again.
'''
target = '''
class User(val name: String, val age: Int = 18, email: String? = null) {
    val email: String = email ?: "${name.lowercase()}@example.com"
    val isAdult = age >= 18

    init {
        require(name.isNotBlank()) { "name must not be blank" }
        println("created $name")
    }

    constructor(name: String, birthYear: Int, currentYear: Int) :
        this(name, currentYear - birthYear)
}

fun main() {
    val ada = User("Ada", 36, "ada@lovelace.org")
    val tim = User("Tim", age = 9)
    val sam = User("Sam")
    val lin = User("Lin", 1990, 2026)
    println("${ada.email} ${ada.isAdult}")
    println("${tim.email} ${tim.isAdult}")
    println("${sam.age} ${lin.age}")
    try {
        User("   ")
    } catch (e: IllegalArgumentException) {
        println("rejected: ${e.message}")
    }
}
'''
