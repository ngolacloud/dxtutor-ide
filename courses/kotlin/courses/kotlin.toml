[[unit.step]]
kind = "challenge"
id = "kt-u13-x1-eval"
title = "Evaluate an expression tree"
points = 30
difficulty = 13
entry = "eval"
intro = '''
An abstract syntax tree (AST) is how interpreters and compilers represent a program: each node is
one construct, and evaluation is a recursive walk that follows the tree's shape. Returning a sealed
`Ok` or `Err` instead of throwing makes failure part of the type, so the caller can't forget to
handle it.
'''
instructions = '''
## Your turn

The starter declares the expression tree and the result type (don't change them):

```kotlin
sealed interface Expr
data class Num(val value: Int) : Expr
data class Var(val name: String) : Expr
data class Neg(val arg: Expr) : Expr
data class Add(val left: Expr, val right: Expr) : Expr
data class Mul(val left: Expr, val right: Expr) : Expr
data class Div(val left: Expr, val right: Expr) : Expr

sealed interface EvalResult
data class Ok(val value: Int) : EvalResult
data class Err(val message: String) : EvalResult
```

Implement:

```kotlin
fun eval(e: Expr, env: Map<String, Int>): EvalResult
```

Rules:

- `Num` evaluates to its value. `Var` looks its name up in `env`; a missing name gives
  `Err("unknown variable <name>")`.
- `Neg` negates its argument. `Add`, `Mul` and `Div` combine their two operands with Kotlin's
  `Int` operators; `Div` truncates toward zero, as `/` does.
- Dividing by zero (including by a sub-expression that evaluates to 0) gives
  `Err("division by zero")`.
- Errors propagate: if an operand evaluates to an `Err`, return that same `Err`. Evaluate the
  **left** operand first, so when both sides fail the left error wins.
- Use exhaustive `when` expressions over `Expr` and `EvalResult`, with no `else` branch, and
  don't throw exceptions.

Examples:

- `eval(Mul(Add(Num(2), Num(3)), Neg(Num(4))), emptyMap())` is `Ok(-20)`.
- `eval(Div(Num(7), Var("x")), mapOf("x" to 2))` is `Ok(3)`.
- `eval(Add(Var("a"), Div(Num(1), Num(0))), emptyMap())` is `Err("unknown variable a")`.

**Hint:** write a small private helper that evaluates both operands of a binary node and, when
both are `Ok`, applies an operation passed in as a lambda such as `{ a, b -> a + b }`.

Hidden tests decide correctness.
'''
