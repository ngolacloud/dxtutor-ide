    if (last !== list.tail) throw AssertionError("tail must be the last node reached from head")
    if (out.size != list.size) throw AssertionError("size is ${list.size} but the chain has ${out.size} nodes")
    return out
}
fun nodesOf(list: SinglyLinkedList<Int>): List<SinglyLinkedList.Node<Int>> {
