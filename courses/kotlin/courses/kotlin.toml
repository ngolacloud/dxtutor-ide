Rules:

- **`subscribe(type, handler)`** registers `handler` for every event that is an instance of
  `type`, **subtypes included**: a handler for `Number` receives `Int`s and `Double`s, and a
  handler for `Any` receives everything. It returns an *unsubscribe* function: calling it removes
