[unit.step.gabarito]
solution = '''
// True when n is prime: greater than 1 and divisible only by 1 and itself.
fun isPrime(n: Int): Boolean {
    if (n < 2) return false
    if (n % 2 == 0) return n == 2
    var d = 3
    while (d <= n / d) {
        if (n % d == 0) return false
        d += 2
    }
    return true
}

// Number of Collatz steps from start down to 1 (even: n / 2, odd: 3 * n + 1).
// Throw IllegalArgumentException when start is less than 1.
fun collatzSteps(start: Long): Int {
    if (start < 1) throw IllegalArgumentException("start must be at least 1, was $start")
    var n = start
    var steps = 0
    while (n != 1L) {
        n = if (n % 2 == 0L) n / 2 else 3 * n + 1
        steps++
    }
    return steps
}
'''
time = "O(√n) isPrime, O(s) collatzSteps"
space = "O(1)"
justification = '''
**`isPrime`.** If `n = a × b` with both factors greater than 1, the smaller factor is at most
√n, so finding no divisor up to √n proves that `n` is prime. After handling 2 separately, the
loop tries only odd divisors, about √n / 2 of them: **O(√n)** time, around 23,000 iterations
for `Int.MAX_VALUE` instead of two billion for the naive loop. Writing the bound as
`d <= n / d` matters: `d * d` overflows once `d` passes 46,340, turns negative, and makes the
naive condition stay true far past √n. Only a few `Int` variables are used: **O(1)** space.

**`collatzSteps`.** Each iteration performs a constant amount of work, so the time is
proportional to the number of steps `s` the sequence takes: **O(s)**. Nobody has proved that
the sequence always reaches 1 (that is the open Collatz conjecture), so no better bound in
terms of `start` is known, although `s` stays in the hundreds for every value you can test
here. Using `Long` keeps the intermediate peaks (more than 159 billion for 8,400,511) exact,
and rejecting `start < 1` up front guarantees the loop's precondition. Space is **O(1)**.
'''

[[unit]]
id = "kt-u06-functions"
title = "Functions"
level = "basic"
difficulty = 6
intro = '''
Functions are how you give a computation a name, reuse it, and test it on its own. This unit
covers declaring functions with typed parameters and return types, Kotlin's short
single-expression form, and the features that make calls readable and flexible: default
arguments, named arguments and `vararg`.
'''
concepts = '''
## The idea

A **function** is a named, reusable piece of computation. It receives inputs, called
**parameters**, and usually produces an output, its **return value**. The values you pass when
you call it are the **arguments**. Functions let you solve a problem once, give the solution a
meaningful name, and then think in terms of that name: `isLeapYear(year)` instead of three
remainders. They are also the unit that tests check, which is exactly what every challenge in
this course does.

## How Kotlin does it

```kotlin
fun area(width: Double, height: Double): Double {
    return width * height
}
```

`fun`, the name, the parameters in parentheses (each **with its type**), a colon, the return
type, and a body in braces that hands back a result with `return`. When the body is a single
expression, you can write it after `=`, and the return type can usually be inferred:

```kotlin
fun area(width: Double, height: Double) = width * height
```

A function that returns nothing useful has the return type `Unit` (Java's `void`), which you
normally leave out. Functions can live at the **top level** of a file; unlike Java, they do not
have to belong to a class.

**Default arguments** give a parameter a value to use when the caller leaves it out, and
**named arguments** let the caller say which parameter a value is for:

```kotlin
fun connect(host: String, port: Int = 443, secure: Boolean = true): String = "..."

connect("example.org")
connect("example.org", secure = false)
connect(port = 8080, host = "localhost")
```

Together they replace the long lists of overloads and the boolean-argument guessing games
that are common in Java. A `vararg` parameter accepts any number of arguments, which arrive
in the function as an array; to pass an existing array, spread it with `*`.

## What is special or tricky

- **Parameters are read-only.** Assigning to one fails with `'val' cannot be reassigned.`;
  copy it into a local `var` if you need to change it.
- **A block body must `return` its value.** Declaring `: Int` and forgetting the `return`
  gives `missing return statement`. A block body without a declared return type returns `Unit`,
  so `fun double(x: Int) { x * 2 }` computes a value and throws it away.
- **Arguments must match the parameter types**, with no automatic conversions: passing an
  `Int` where a `Long` parameter is expected only works for literals like `5`, not for an `Int`
  variable.
- **Recursive functions need an explicit return type**, because the compiler cannot infer a
  type from a body that refers to itself.
- **Default values are part of the contract.** Callers rely on them, so changing one silently
  changes every call that omitted that argument.

## What you will practise

You will write block-bodied and single-expression functions, call functions with defaults and
named arguments, and use `vararg`, local functions and recursion. The challenge asks you to
format amounts of money with digit grouping, a function whose defaults the tests exercise by
name.
'''

[[unit.step]]
kind = "concept"
id = "kt-u06-c1-functions"
title = "Parameters, results and calls"
points = 5
difficulty = 6
intro = '''
When you call a function, the program evaluates the arguments, binds them to the parameters,
runs the body, and jumps back to the caller with the result. Each call gets its own fresh set of
parameters and local variables, which is what lets a function call itself, a technique called
**recursion**.
'''
body = '''
## Anatomy of a function

```kotlin
fun bmi(weightKg: Double, heightM: Double): Double {
    val squared = heightM * heightM
    return weightKg / squared
}

fun describe(value: Double, unit: String = "kg/m²") = "$value $unit"

fun main() {
    val result = bmi(70.0, 1.75)
    println(describe(result))
    println(describe(unit = "(no unit)", value = 3.0))
}
```

Things to notice:

- **`weightKg: Double, heightM: Double`** are the parameters, each with a mandatory type.
  Inside the body they behave like `val`s.
- **`: Double`** after the parentheses is the return type; `return` ends the function and
  hands the value back to the caller.
- **`squared`** is a **local variable**: it exists only during this call.
- **`describe`** has a single-expression body after `=`. Its return type, `String`, is inferred
  from the template.
- **`unit: String = "kg/m²"`** has a default value, so `describe(result)` may leave it out.
- **`describe(unit = ..., value = ...)`** uses named arguments, so their order no longer
  matters, and the call explains itself.

## Calls are expressions

A call like `bmi(70.0, 1.75)` is an expression whose value is the returned result, so you can
store it, print it, or pass it straight into another call, as `println(describe(result))`
does. That composability is why small functions that *return* values are so much more useful
than functions that only print.
'''

