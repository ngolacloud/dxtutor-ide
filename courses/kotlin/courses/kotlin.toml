[unit.step.gabarito]
solution = '''
// Return a greeting of the form "Hello, <name>!".
// Return the text; don't print it.
fun greet(name: String): String {
    return "Hello, " + name + "!"
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Kotlin strings (which are JVM `String`s) are immutable, so joining them builds a brand-new
string: the fixed text `Hello, ` and `!` plus the `n` characters of `name` are copied into
it. Both the work and the memory grow in direct proportion to the length of `name`, so the
time is **O(n)** and the space is **O(n)**, where `n` is the length of the name. There is no
loop in your code; the copying happens once, inside the `+` operations. In unit 3 you will
write the same thing as a string template, `"Hello, $name!"`, which compiles to the same
kind of copy.
'''

[[unit]]
id = "kt-u02-variables"
title = "Variables, types and conversions"
level = "basic"
difficulty = 2
intro = '''
Programs remember things in **variables**, and every value in Kotlin has a **type** that the
compiler checks before the program runs. This unit covers `val` and `var`, the everyday
number, text and true/false types, how Kotlin infers types for you, and why it insists that
you convert between them explicitly.
'''
concepts = '''
## The idea

A **variable** is a name attached to a value, so that you can store a result and use it
later. A **type** says what kind of value it is (a whole number, a decimal number, a piece
of text, true or false) and therefore which operations make sense on it. Kotlin is
**statically typed**: the compiler knows the type of every variable and rejects code that
mixes types incorrectly *before* the program ever runs.

## How Kotlin does it

There are two kinds of variable:

```kotlin
val name = "Ada"      // val: read-only, assigned once
var age = 36          // var: can be reassigned
age = 37
```

Prefer `val`. A value that never changes is easier to reason about, and the compiler will
tell you if you try to change it. Use `var` only for things that really change, like a
counter.

You rarely write the type, because the compiler **infers** it from the value. You can still
write it after a colon when it helps the reader: `val price: Double = 9.99`.

The types you will use most:

| Type | Holds | Example |
|---|---|---|
| `Int` | whole numbers, 32 bits (about ±2.1 billion) | `42`, `1_000_000` |
| `Long` | whole numbers, 64 bits | `9_000_000_000L` |
| `Double` | decimal numbers, 64-bit floating point | `3.14` |
| `Boolean` | `true` or `false` | `true` |
| `Char` | one character | `'K'` |
| `String` | text | `"Kotlin"` |

Underscores in number literals are only for readability. In Kotlin these are all real
types with members you can call, such as `Int.MAX_VALUE`; there is no separate world of
"primitives" in your code, although the compiler still uses fast JVM primitives underneath.

## Conversions are always explicit

Java silently widens an `int` into a `long`; Kotlin never converts numbers for you. You call
a conversion function:

```kotlin
val count = 3
val big: Long = count.toLong()
val ratio = count.toDouble() / 2   // 1.5
val whole = 3.99.toInt()           // 3: the fraction is cut off, not rounded
val parsed = "42".toInt()          // text to number
```

## What is special or tricky

- `val x = 1` followed by `x = 2` fails with `'val' cannot be reassigned.`
- `val l: Long = count` fails with
  `initializer type mismatch: expected 'Long', actual 'Int'.` Convert with `toLong()`.
- **Integer division drops the fraction**: `7 / 2` is `3`. Convert one side to `Double`
  first when you need `3.5`.
- **Overflow wraps around silently.** `Int.MAX_VALUE + 1` is `-2147483648`, with no error.
  If a result can exceed about 2.1 billion, compute it as a `Long`.
- **Floating point is approximate.** `0.1 + 0.2` prints `0.30000000000000004`, so never use
  `Double` for exact money amounts.
- `"abc".toInt()` compiles but throws `NumberFormatException` when it runs.

## What you will practise

You will declare and update variables, print the limits of the number types, and convert
between numbers and text. The challenge asks for three small conversions whose hidden tests
use inputs large enough to break a careless `Int` version.
'''

[[unit.step]]
kind = "concept"
id = "kt-u02-c1-val-var"
title = "val, var and types"
points = 5
difficulty = 2
intro = '''
A variable is a named slot in the program's memory. The compiler records the type of every
slot and uses it to reject nonsense, such as adding a number to `true`, before your program
runs. Choosing between `val` and `var` tells both the compiler and the reader whether that
slot is allowed to change.
'''
body = '''
## Naming values

```kotlin
fun main() {
    val city = "Luanda"        // String, inferred
    val population = 9_000_000 // Int, inferred
    var visits = 0             // Int, and it can change
    visits = visits + 1
    visits += 1                // the same thing, shorter
    println(city + " " + population + " " + visits)
}
```

Things to notice:

- **`val`** creates a read-only variable: it receives a value once and keeps it. Most
  variables in good Kotlin code are `val`.
- **`var`** creates a variable you may assign again. `+=`, `-=`, `*=` and `++` are short
  forms for updating it.
- **No type is written**, yet each variable has one. The compiler **infers** `String` from
  `"Luanda"` and `Int` from `9_000_000`. Writing `val population: Int = 9_000_000` means the
  same thing.
- **The type is fixed forever.** After `var visits = 0`, the line `visits = "many"` is a
  compile error, because `visits` is an `Int`.

## Why types matter

Types decide what operators do. `7 / 2` is `3` because both are `Int`; `7.0 / 2` is `3.5`.
An `Int` can only hold about ±2.1 billion, so larger results need a `Long`. Kotlin never
changes a type behind your back: when you want a different type, you ask for it with a
conversion such as `toLong()`, `toDouble()` or `toInt()`. The drills show each of these in
action.
'''

