[unit.step.gabarito]
solution = '''
// Money is in cents (Long), so no rounding errors creep in.
interface Payable {
    fun monthlyPay(): Long
}

abstract class Employee(val name: String) : Payable {
    open fun title(): String = "Employee"

    fun badge(): String = "$name (${title()})"
}

open class Salaried(name: String, val annualSalary: Long) : Employee(name) {
    override fun monthlyPay(): Long = annualSalary / 12

    override fun title(): String = "Salaried"
}

class Hourly(name: String, val hourlyRate: Long, val hours: Int) : Employee(name) {
    init {
        require(hours >= 0) { "hours must not be negative, was $hours" }
    }

    override fun monthlyPay(): Long {
        val regular = minOf(hours, 160)
        val overtime = hours - regular
        return regular * hourlyRate + overtime * hourlyRate * 3 / 2
    }

    override fun title(): String = "Hourly"
}

class Manager(name: String, annualSalary: Long, val bonus: Long) : Salaried(name, annualSalary) {
    override fun monthlyPay(): Long = super.monthlyPay() + bonus

    override fun title(): String = "Manager"
}

fun totalPayroll(staff: List<Payable>): Long = staff.sumOf { it.monthlyPay() }
'''
time = "O(n)"
space = "O(1)"
justification = '''
Each `monthlyPay()` is a handful of arithmetic operations, so it is **O(1)**, and so are
`title()` and `badge()` apart from building a short string. `totalPayroll` calls `monthlyPay()`
once per element and keeps a single running `Long`, so for `n` workers the time is **O(n)** and the
extra space is **O(1)**.

The design is what earns the marks. The sum never asks "what kind of worker is this?": each
call is a virtual call that the JVM resolves through the object's class, which costs the same
constant time whatever the subclass. Adding a `Contractor` or an `Intern` later means writing one
new class, with no change to `totalPayroll`. `Manager` reuses `Salaried`'s formula through
`super.monthlyPay()`, so a change to the salaried rule automatically reaches managers.
`sumOf` with a `Long` selector also accumulates in `Long`, which is why 100,000 workers
earning 160,000 cents each total 16,000,000,000 without overflowing an `Int`.
'''

[[unit]]
id = "kt-u13-sealed-when"
title = "Sealed types and exhaustive when"
level = "intermediate"
difficulty = 13
intro = '''
A sealed type is a closed family: the compiler knows every possible subtype, so a `when` over it
can be checked for completeness. That turns "did I handle every case?" from a code-review
question into a compile error. You will model payments, a download's life cycle and a JSON tree,
then write an expression evaluator whose results are themselves a sealed type.
'''
concepts = '''
## The idea

Many values come in a **fixed set of shapes**. A payment is a card, a transfer or cash. A network
request is loading, succeeded or failed. Type theory calls this a **sum type** (or tagged union):
a value is exactly one of several alternatives, and each alternative carries its own data.

Ordinary inheritance is open, because anyone can add a subclass later, so code that inspects
the subclass must always keep a fallback. A **closed** hierarchy lets the compiler prove that
your code covers every case, and tell you exactly where to look when a new case is added.

## How Kotlin does it

Mark the parent `sealed`. All direct subtypes must be declared in the same package and module
(in practice, the same file), so the compiler knows the complete list:

```kotlin
sealed interface Payment
data class Card(val last4: String) : Payment
data class Transfer(val iban: String) : Payment
data object Cash : Payment
```

Use a `data class` for alternatives that carry data and a `data object` for those that don't:
there is only one `Cash`, and it prints as `Cash`. A `sealed class` works the same way but can
hold state and constructor parameters shared by all children; nest the children inside it if you
like (`Download.Idle`).

`when` used as an expression over a sealed type must be **exhaustive**, and with a sealed subject
it can be, without an `else`:

```kotlin
fun label(p: Payment): String = when (p) {
    is Card -> "card ${p.last4}"
    is Transfer -> "transfer"
    Cash -> "cash"
}
```

Each `is` branch smart-casts `p`, so `p.last4` compiles. Objects are matched by equality, with
no `is`. Java 17+ has the same idea with `sealed ... permits` and pattern-matching `switch`.

## Pitfalls and compiler errors

- **"'when' expression must be exhaustive. Add the 'is Transfer' branch or an 'else' branch"**:
  a case is missing. Add it; don't reach for `else`.
- **`else` switches off the safety net.** With `else`, a new subtype silently lands in the
  fallback instead of producing a compile error at every `when` that forgot it. Prefer listing
  the cases.
- **"Inheritor of sealed class or interface declared in package ... but it must be in package
  ..."**: subtypes must live next to the sealed parent.
- A `when` used as a **statement** (its value ignored) over a sealed subject is checked as well
  since Kotlin 1.7, so missing branches are errors there too.
- Writing `Cash` without `is` matches the single object; `is Cash` also works but reads as if
  there could be many.

## What you will practise

You will match payments with an exhaustive `when`, drive a download through a small state machine,
and render a recursive JSON tree. The challenge evaluates arithmetic expressions built from a
sealed `Expr` and reports either `Ok(value)` or `Err(message)`, with no exceptions involved.
'''

[[unit.step]]
kind = "concept"
id = "kt-u13-c1-closed-hierarchies"
title = "Closed hierarchies and exhaustiveness"
points = 5
difficulty = 13
intro = '''
A sum type says "a value is exactly one of these alternatives". When the compiler knows the full
list of alternatives, it can check every `when` for missing cases, much as a type checker catches
a missing argument. Sealed types are how Kotlin gives the compiler that list.
'''
body = '''
## Sealed means "the list is final"

```kotlin
sealed interface Shape
data class Circle(val r: Double) : Shape
data class Square(val side: Double) : Shape
```

Nobody outside this file and module can add a third kind of `Shape`. That restriction is
exactly what makes the next part possible.

## Exhaustive when

```kotlin
fun area(s: Shape): Double = when (s) {
    is Circle -> 3.14159 * s.r * s.r
    is Square -> s.side * s.side
}
```

There is no `else`, and none is needed: the compiler has checked that `Circle` and `Square` are
the only possibilities. Inside each branch `s` is smart-cast, so `s.r` and `s.side` are
available without a manual cast.

Now add `data class Triangle(...) : Shape`. Every `when` over `Shape` that lacks a
`Triangle` branch stops compiling, and the error message names the missing branch. With an
open class and an `else` fallback, the triangle would silently fall through and give a wrong
answer at run time.

## Modelling state

The same tool models **states**. Instead of a status string plus several nullable fields
that may or may not be filled, write one subtype per state, holding exactly the data that
state has:

```kotlin
sealed interface Load
data object Loading : Load
data class Loaded(val text: String) : Load
data class Failed(val error: String) : Load
```

A `Loaded` always has text and a `Loading` never does. Impossible states become impossible
to write.
'''

