interface Named {
    val name: String
    fun greet(): String = "Hi, I am $name"
}

interface Swimmer {
    fun move(): String = "swims"
}

interface Flyer {
    fun move(): String = "flies"
}

class Duck(override val name: String) : Named, Swimmer, Flyer {
    override fun move(): String = "${super<Swimmer>.move()} and ${super<Flyer>.move()}"
}

class Fish(override val name: String) : Named, Swimmer

fun main() {
    val zoo: List<Named> = listOf(Duck("Donald"), Fish("Nemo"))
