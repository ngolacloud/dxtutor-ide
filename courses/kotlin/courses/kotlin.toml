val memo = HashMap<Int, Long>()

fun naive(n: Int): Long {
    calls++
    return if (n < 2) n.toLong() else naive(n - 1) + naive(n - 2)
}

fun memoFib(n: Int): Long {
    calls++
    if (n < 2) return n.toLong()
    return memo.getOrPut(n) { memoFib(n - 1) + memoFib(n - 2) }
}

fun main() {
    val a = naive(30)
    println("naive fib(30) = $a in $calls calls")
    calls = 0
    val b = memoFib(30)
    println("memo  fib(30) = $b in $calls calls")
    println("memo  fib(90) = ${memoFib(90)}")
}
'''
line_comments = [
  "A top-level counter that both versions increment.",
  "The memo: `n` to `fib(n)`, shared by every call.",
  "",
  "Fibonacci straight from the definition.",
  "Counts this call.",
  "Base cases 0 and 1; otherwise two recursive calls that overlap heavily.",
  "",
  "",
  "The same recurrence, memoised.",
  "Counts this call.",
  "Base cases are not stored.",
  "Computes `fib(n)` only if it is not in the memo yet, then stores it.",
  "",
  "",
  "The program's entry point.",
  "About 2.7 million calls.",
  "Prints `naive fib(30) = 832040 in 2692537 calls`.",
  "Resets the counter.",
  "Each `n` is computed once.",
  "Prints `memo  fib(30) = 832040 in 59 calls`.",
  "Reuses the memo up to 30; prints `memo  fib(90) = 2880067194370816120`.",
  "",
]
explanation = '''
The naive version calls itself 2,692,537 times for `fib(30) = 832040`: one call per node of a
call tree that grows by a factor of about 1.6 per level. The memoised version makes 59 calls.
`memoFib(30)` walks down the chain 30, 29, …, 2, 1 (30 calls), and on the way back each
`memoFib(n - 2)` finds its answer in the memo or is a base case (29 more calls). `fib(90)`
then needs only the 60 new values, and its result, 2,880,067,194,370,816,120, fits in a
`Long` but would have overflowed an `Int` back at `fib(47)`. `getOrPut` is safe here even
though the recursion inserts into the map while computing; Java's `computeIfAbsent` would
throw `ConcurrentModificationException`.
'''

[[unit.step]]
kind = "drill"
id = "kt-u34-d3-grid-table"
title = "A bottom-up table: paths through a grid"
points = 10
difficulty = 34
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
The number of right-and-down paths to a cell is the number of paths to the cell above plus the
number to the cell on the left. Filling the table row by row guarantees both are ready before
they are needed.
'''
prompt = '''
Count the paths from the top-left to the bottom-right corner of a grid with walls, moving only
right or down, then count them on an open 34 × 34 grid.

**Why:** this is the bottom-up recipe in its purest form: a recurrence, base cases, and a fill
order, with no recursion and no memo.
'''
target = '''
fun countPaths(grid: List<String>): Long {
    val rows = grid.size
    val cols = grid[0].length
    val ways = Array(rows) { LongArray(cols) }
    for (r in 0 until rows) {
        for (c in 0 until cols) {
            if (grid[r][c] == '#') continue
            val up = if (r > 0) ways[r - 1][c] else 0L
            val left = if (c > 0) ways[r][c - 1] else 0L
            ways[r][c] = if (r == 0 && c == 0) 1L else up + left
        }
    }
    return ways[rows - 1][cols - 1]
}

fun main() {
    val walls = listOf(
        "....",
        ".#..",
        "...#",
        "#...",
    )
    println("walls: ${countPaths(walls)} paths")
    val open = List(34) { ".".repeat(34) }
    println("open 34x34: ${countPaths(open)} paths")
}
'''
line_comments = [
  "Counts right/down paths from the top-left to the bottom-right corner.",
  "The number of rows.",
  "The number of columns.",
  "`ways[r][c]` = paths that reach cell (r, c); a 2-D table of `Long`s, all zero.",
  "Row by row, top to bottom…",
  "…and left to right, so the cells above and to the left are always ready.",
  "A wall: no path can stand on it, so it stays 0.",
  "Paths arriving from above (none on the top row); `0L` keeps the type `Long`.",
  "Paths arriving from the left (none in the first column).",
  "The base case is the start cell; every other cell adds its two neighbours.",
  "",
  "",
  "The answer is in the bottom-right cell.",
  "",
  "",
  "The program's entry point.",
  "A 4 × 4 grid: `.` is open, `#` is a wall.",
  "Row 0.",
  "Row 1, with a wall in the middle.",
  "Row 2, with a wall at the end.",
  "Row 3, starting with a wall.",
  "",
  "Prints `walls: 3 paths`.",
  "An open grid, 34 cells on each side.",
  "Prints `open 34x34: 7219428434016265740 paths`, close to `Long.MAX_VALUE`.",
  "",
]
explanation = '''
Each open cell adds the counts of the cell above and the cell to its left, and walls stay at 0,
so they pass nothing on. For the 4 × 4 grid the last row fills as 0, 1, 3, 3, and the program
prints `walls: 3 paths`. On the open 34 × 34 grid every path is 33 moves right and 33 down in
some order, so the count is the binomial coefficient C(66, 33) = 7,219,428,434,016,265,740,
just below `Long.MAX_VALUE` (about 9.2·10¹⁸). An `Int` table would have overflowed silently.
Filling the table is O(rows × cols), and naive recursion would have explored every one of
those 7·10¹⁸ paths individually.
'''

