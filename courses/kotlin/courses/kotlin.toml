intro = '''
`launch` is fire-and-continue: it schedules a new coroutine and returns a `Job` handle without
waiting. The caller keeps running until it reaches a suspension point such as `join()`, which
is the moment the scheduler gets to run the queued coroutine.
'''
prompt = '''
Write a `suspend` function that waits with `delay`, call it from a launched coroutine, and use
the returned `Job` to observe and then wait for the coroutine.

**Why:** `launch` plus `join` is the smallest complete coroutine lifecycle: start, run
concurrently with the caller, finish, and let the caller wait for it.
'''
target = '''
import kotlinx.coroutines.*

suspend fun brew(drink: String, ms: Long): String {
    delay(ms)
    return "$drink is ready"
}

fun main() = runBlocking {
    println("order placed")
    val job = launch {
        println(brew("tea", 20))
    }
    println("launched: active=${job.isActive}")
    job.join()
    println("joined: completed=${job.isCompleted}")
}
'''
line_comments = [
