[unit.step.gabarito]
solution = '''
fun String.toSlug(): String {
    val out = StringBuilder(length)
    var pendingDash = false
    for (c in this) {
        if (c.isLetterOrDigit()) {
            if (pendingDash && out.isNotEmpty()) out.append('-')
            out.append(c.lowercaseChar())
            pendingDash = false
        } else {
            pendingDash = true
        }
    }
    return out.toString()
}

val String.wordCount: Int
    get() = split(Regex("\\s+")).count { it.isNotEmpty() }

fun String?.ellipsize(max: Int): String {
    require(max >= 1) { "max must be at least 1, was $max" }
    if (this == null) return ""
    return if (length <= max) this else take(max - 1) + "…"
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the length of the receiver. `toSlug` visits each character once and does O(1) work
per character (a classification, a lower-casing, at most two appends to a `StringBuilder`, whose
appends are amortised O(1)). So it runs in **O(n)** time, and the builder holds at most `n`
characters, **O(n)** space. The "pending dash" flag is what keeps it linear and correct: runs of
separators collapse into one `-` without any look-ahead, and leading or trailing separators
never produce a dash because a dash is written only *before* a kept character, into a non-empty
builder.

`wordCount` splits once with a regular expression (O(n)) and builds a list of up to `n / 2`
words, so O(n) time and space; the `isNotEmpty()` filter removes the empty piece that leading
whitespace creates. A hand-written scan counting "non-space after space" transitions would use
O(1) space, at the cost of a few more lines.

`ellipsize` does a constant amount of checking and then `take(max - 1)`, which copies at most
`max` characters: O(min(n, max)) time and space. Because the receiver is `String?`, the `null`
case is handled once, inside the extension, after `require` has checked the argument.
'''

[[unit]]
id = "kt-u15-higher-order"
title = "Higher-order functions and lambdas"
level = "intermediate"
difficulty = 15
intro = '''
In Kotlin functions are values: you can store them in variables, pass them as arguments and
return them from other functions. Functions that take or return functions are called higher-order,
and they are behind `map`, `filter`, `forEach` and most of the standard library. You will write
function types and lambdas, build closures, use `inline` and non-local returns, and finish by
writing your own combinators, including a cache that remembers results.
'''
concepts = '''
## The idea

A **higher-order function** takes a function as a parameter or returns one. Instead of writing
one loop that doubles, another that squares and a third that negates, you write `map` once and
pass it the operation. The behaviour becomes a value, so it can be chosen, combined and stored at
run time.

A **lambda** is a function literal: a function without a name, written where it is needed. When
a lambda uses a variable from the surrounding scope, it **captures** it, and the pair of code
plus captured variables is called a **closure**.

## How Kotlin does it

Function **types** are written `(parameters) -> result`: `(Int) -> Int`, `(String, Int) -> Boolean`,
`() -> Unit`. A lambda goes between braces, with parameters before the arrow. A single parameter
can be left unnamed and called `it`:

```kotlin
val square: (Int) -> Int = { n -> n * n }
val isShort: (String) -> Boolean = { it.length < 4 }
val twice = { f: (Int) -> Int, x: Int -> f(f(x)) }
```

The last expression in a lambda is its result; no `return` is needed. If a function's **last**
parameter is a function, the lambda may go after the parentheses as a **trailing lambda**, and
empty parentheses can be dropped: `list.filter { it > 0 }`, `repeat(3) { println(it) }`.

A **function reference** turns a named function into a value: `::double`, `String::length`.
Unlike Java, which needs functional interfaces such as `Function<A, B>`, Kotlin has real function
types, and a Kotlin lambda can capture and even modify a `var`.

Marking a higher-order function `inline` copies its body and the lambda's body into each call
site. That removes the allocation of a function object, and it allows a plain `return` inside the
lambda to return from the *enclosing* function, a **non-local return**. Most collection functions
in the standard library, `forEach`, `map` and `filter` among them, are `inline`.

## Pitfalls and compiler errors

- **`return` in a lambda**: in a non-inline lambda a bare `return` is an error ("'return' is not
  allowed here"). Use a labelled return, `return@forEach`, to leave just the lambda.
- **`it` only exists for one-parameter lambdas.** With two parameters, name them: `{ a, b -> a + b }`.
- **"Type mismatch: inferred type is (Int) -> Int but (String) -> Int was expected"**:
  the lambda's parameter types must match the function type.
- **Calling a nullable function** `f: ((Int) -> Int)?` needs `f?.invoke(3)`.
- **"Cannot infer a type for this parameter"**: give the lambda an explicit parameter type, or
  give the variable a function type.

## What you will practise

You will declare function types and pass lambdas and references, return closures that keep
private state, and write `inline` functions with trailing lambdas and non-local returns. The
challenge asks for four combinators: `compose`, `pipeline`, `memoize` and `countWhere`.
'''

[[unit.step]]
kind = "concept"
id = "kt-u15-c1-functions-as-values"
title = "Functions as values"
points = 5
difficulty = 15
intro = '''
The idea that functions are values comes from the lambda calculus of the 1930s, and it is the
heart of functional programming. Passing behaviour as an argument lets one algorithm, such as
"keep the elements that pass a test", serve every possible test.
'''
body = '''
## Function types and lambdas

A function type describes what goes in and what comes out:

```kotlin
val add: (Int, Int) -> Int = { a, b -> a + b }
val greet: (String) -> String = { "Hello, $it" }
val tick: () -> Unit = { println("tick") }
```

You call a function value like a function, `add(2, 3)`. The lambda's last expression is its
result, and `it` names the only parameter when there is just one.

## Passing and returning functions

```kotlin
fun applyTwice(x: Int, f: (Int) -> Int): Int = f(f(x))

applyTwice(3) { it * 10 }      // 300: a trailing lambda
applyTwice(3, ::inc)           // a reference to a named fun inc
```

Because `f` is the last parameter, the lambda can sit outside the parentheses. This trailing
lambda style is why Kotlin code such as `list.filter { it > 0 }` or `repeat(3) { ... }` reads
like built-in syntax.

A function can also **return** a function. The returned lambda keeps access to the variables it
uses, even after the outer function has finished. That is a closure:

```kotlin
fun adder(n: Int): (Int) -> Int = { it + n }
val plus5 = adder(5)
plus5(1)                       // 6
```

## inline

A lambda is normally compiled to an object. For a function marked `inline`, the compiler copies
the function body and the lambda into the call site instead, so there is no object to allocate.
Inside such a lambda, `return` leaves the enclosing function, while `return@label` leaves only
the lambda.
'''

