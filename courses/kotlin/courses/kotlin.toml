    val shifts = insertionSort(a)
    println("${a.contentToString()} shifts=$shifts")

    val reversed = IntArray(1000) { 1000 - it }
    println("reversed 1000: shifts=${insertionSort(reversed)} first=${reversed.first()}")
}
'''
