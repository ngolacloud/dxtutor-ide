**Hint:** the `sequence { }` builder with a `while` loop and `yieldAll(items)` is a natural fit for
`paged`. For `firstErrors`, chain `filter`, `map` and `take(n)` on the sequence and finish with
`toList()`.

Hidden tests decide correctness.
