  "`mutableListOf` gives a `MutableList`, which can change.",
  "Appends at the end: `[write, test, ship]`.",
  "Inserts at index 0 and shifts the others right: `[plan, write, test, ship]`.",
  "Removes the first element equal to `test`.",
  "Index assignment replaces the element at position 1.",
  "Prints `[plan, write code, ship]`.",
  "`indices` is the range of valid indexes, `0..2`.",
  "",
  "`toList()` copies the elements into a new, independent list.",
  "Empties the mutable list. The copy is not affected.",
  "Prints `0 left, snapshot keeps 3`.",
  "Closes `main`.",
]
explanation = '''
