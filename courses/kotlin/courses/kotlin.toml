    "Scans the text left to right.",
    "Only brackets matter; other characters match no branch.",
    "An opener goes on top of the stack.",
    "A closer pops the top; `null` (empty stack) or a different opener means unbalanced.",
    "End of when.",
    "End of the scan.",
    "Leftover openers were never closed.",
    "End of balanced.",
    "",
    "The program's entry point.",
