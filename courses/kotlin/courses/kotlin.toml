[[unit]]
id = "kt-u30-linked-list"
title = "Singly linked lists"
level = "advanced"
difficulty = 30
intro = '''
A linked list stores each value in its own node object that points to the next one, so a
sequence becomes a chain of references instead of one contiguous block of memory. You will
define a generic `Node<T>`, push and pop at the head, keep a tail reference for O(1) appends,
delete by rewiring, and finish with a `SinglyLinkedList<T>` class that reverses itself in place.
'''
concepts = '''
## The idea

A **linked list** stores a sequence as a chain of **nodes**. Each node holds a value and a **reference** to the next node, and the last node refers to nothing. The list itself is just a reference to the first node, the **head**. Nothing is contiguous: the nodes can live anywhere on the heap, connected only by references.

That layout trades one set of costs for another. Compared with an `ArrayList`, which is a dynamic array:

- **Insert or remove at the head: O(1).** You only rewire a reference. `list.add(0, x)` on an `ArrayList` shifts every element, which is O(n).
- **Insert after a node you already hold: O(1)**, for the same reason.
- **Access by index, search: O(n).** You must walk from the head, because no arithmetic jumps to element *i*.
- **Append at the tail: O(n)**, unless you also keep a reference to the last node.

In everyday Kotlin, `ArrayList` and `ArrayDeque` win: they are compact and friendly to CPU caches, and even `java.util.LinkedList` is rarely the best choice. Linked lists still matter. They teach reference-based structures, trees and graphs are built from the same kind of node, and "rewire two references" is the trick behind LRU caches and schedulers.

## How Kotlin does it

A node is a tiny generic class. The type `Node<T>?` says "a node or nothing", so `null` marks both the end of the list and the empty list, and the compiler makes you handle it:

```kotlin
class Node<T>(val value: T, var next: Node<T>? = null)
```

`next` is a `var` because rewiring is the whole point. There is no `free`: once nothing refers to a node, the garbage collector reclaims it. Inserting after a known node is one assignment, and the right-hand side runs first, so the new node captures the old `next` before it is overwritten:

```kotlin
fun <T> insertAfter(node: Node<T>, value: T) {
    node.next = Node(value, node.next)
}
```

A walk is a loop over a **local** `var` that follows `next` until `null`. Inside `while (node != null)` the compiler smart-casts `node` to `Node<T>`:

```kotlin
var node = head
while (node != null) {
    println(node.value)
    node = node.next
}
```

## What is special or tricky

- **Smart casts stop at mutable properties.** `if (head != null) head.value` fails with *smart cast to 'Node<T>' is impossible, because 'head' is a mutable property that could be mutated concurrently*. Copy the property into a local `val` first, or use `?.` and `?:`.
- **`!!` is Kotlin's null-pointer crash.** `head!!.value` throws `NullPointerException` on an empty list. Prefer `?: throw NoSuchElementException(...)` with a clear message.
- **Parameters are read-only.** `head = head.next` inside a function is *'val' cannot be reassigned*. Copy it to a local `var`, and return the new head or keep it in a property.
- **Order of rewiring matters.** Overwrite `node.next` before saving it and the rest of the list is unreachable. Save the successor in a local first.
- **Deep recursion overflows the stack.** A recursive walk uses one JVM stack frame per node, and a million nodes ends in `StackOverflowError`. Use loops.
- `==` compares values (it calls `equals`); `===` asks whether two references are the same node.

## What you will practise

You will build a list by pushing to the front, wrap it in a class with a tail reference and a size, and delete values with a dummy node. The challenge asks for a complete `SinglyLinkedList<T>` that reverses in place, reusing its nodes, on lists long enough to rule out recursion.
'''

[[unit.step]]
kind = "concept"
id = "kt-u30-c1-nodes"
title = "Nodes, references and null"
points = 5
difficulty = 30
intro = '''
A node holds a value and a reference to the next node, and `null` marks the end. The list
itself is nothing more than a reference to its first node, the head.
'''
body = '''
## The node

```kotlin
class Node<T>(val value: T, var next: Node<T>? = null)
```

`next` refers to another `Node<T>`, or is `null` when there is no next node. An empty list is a
head that is `null`, which is why the head's type is `Node<T>?`.

## Push to the front

Make a new node whose `next` is the current head, then move the head to it. No element moves,
so this is O(1) no matter how long the list is:

```kotlin
head = Node(v, head)
```

## Walk the list

Follow `next` from the head until you reach `null`. Because `node` is a local `var`, the check
`node != null` smart-casts it inside the loop:

```kotlin
var node = head
while (node != null) {
    println(node.value)
    node = node.next
}
```

## Pop the front

Popping is the mirror image of pushing: remember the value, then move the head one node on.
The old first node is no longer referenced, and the garbage collector frees it.

```kotlin
val first = head ?: throw NoSuchElementException("empty list")
head = first.next
```

Pushing to the front reverses insertion order: the last value pushed is the first one you meet
when walking. Appending to the end is the opposite story. Without a separate reference to the
last node you must walk the whole list to find it, which is O(n). Keeping a `tail` reference,
as the second drill does, makes appends O(1) again. Every linked-list operation is some
combination of these moves: create a node, follow `next`, and rewire `next`.
'''

