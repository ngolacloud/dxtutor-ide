- pages `[1, 2, 3]`, `[4, 5]`, `[]` → `paged` yields `1, 2, 3, 4, 5`
- `firstErrors(sequenceOf("INFO up", "ERROR  disk full ", "ERRORS x", "ERROR timeout"), 5)`
