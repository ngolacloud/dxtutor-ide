target = '''
class Node<T : Comparable<T>>(val key: T, val left: Node<T>? = null, val right: Node<T>? = null)

fun <T : Comparable<T>> find(root: Node<T>?, key: T): String {
    var node = root
    var steps = 0
    while (node != null) {
        steps++
        val c = key.compareTo(node.key)
        if (c == 0) return "found $key in $steps steps"
        node = if (c < 0) node.left else node.right
    }
    return "$key missing after $steps steps"
}

fun main() {
    val root = Node(
        "m",
        Node("f", Node("c"), Node("h")),
        Node("t", Node("p"), Node("w")),
    )
    for (key in listOf("m", "h", "w", "a", "q")) {
        println(find(root, key))
    }
}
