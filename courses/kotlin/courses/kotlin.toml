explanation = '''
The output was `waiting`, `downloading 0%`, `downloading 50%`, `finished, 2048 bytes` and
`finished, 2048 bytes` again. `start` left `Idle`, the first `tick` advanced to 50, the second
reached 100 and produced `Done`, and the last `tick` hit the branch for finished states, which
returns the state unchanged. Notice that no state carries fields it doesn't need: there is no
nullable `percent` or `reason` anywhere.
'''

