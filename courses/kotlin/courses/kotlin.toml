[[unit.step]]
kind = "drill"
id = "kt-u31-d2-chained-map"
title = "A tiny chained hash map"
points = 10
difficulty = 31
placeholder_policy = "on_demand"
run_command = "kotlinc Main.kt -include-runtime -d main.jar && java -jar main.jar"
intro = '''
Separate chaining stores every entry in the bucket its hash selects, as a short list. Insert,
update and lookup all start the same way: hash the key, pick one bucket, then scan only that
bucket.
'''
prompt = '''
Write a generic `ChainedMap<K, V>` with four buckets, insert five words, update one, and print
two lookups and the length of every chain.

**Why:** with only four buckets, collisions are guaranteed, and the chain lengths show
exactly what a hash table does about them.
'''
target = '''
class ChainedMap<K : Any, V>(capacity: Int) {
    private val buckets = List(capacity) { mutableListOf<Pair<K, V>>() }

    private fun bucketOf(key: K) = buckets[key.hashCode().mod(buckets.size)]

    fun put(key: K, value: V) {
        val bucket = bucketOf(key)
        val i = bucket.indexOfFirst { it.first == key }
        if (i >= 0) bucket[i] = key to value else bucket += key to value
    }

    operator fun get(key: K): V? = bucketOf(key).firstOrNull { it.first == key }?.second

    fun chainLengths(): List<Int> = buckets.map { it.size }
}

fun main() {
    val m = ChainedMap<String, Int>(4)
    for ((word, n) in listOf("one" to 1, "two" to 2, "three" to 3, "four" to 4, "five" to 5)) {
        m.put(word, n)
    }
    m.put("two", 22)
    println("two=${m["two"]} six=${m["six"]} chains=${m.chainLengths()}")
}
'''
line_comments = [
