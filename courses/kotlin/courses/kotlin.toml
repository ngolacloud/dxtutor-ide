Interfaces give a class extra types without extra state, so one object can be a `Named`, a
`Swimmer` and a `Flyer` at once. Default method bodies make interfaces convenient, but they raise
the classic "diamond" question: when two interfaces supply the same method, which body wins?
Kotlin refuses to guess and makes you choose.
