- `summarize(1, 2, 3)` → `(3, 6, 2.0)`
- `summarize(1, 1, 2)` → `(3, 4, 1.33)`
- `summarize(1, 1, 2, digits=1)` → `(3, 4, 1.3)`
- `summarize()` → `(0, 0, 0.0)`

Hidden tests decide correctness. Implement it, then submit.
