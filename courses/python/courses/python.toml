instructions = '''
## Your turn

Implement the function `summarize`:

```python
def summarize(*values: float, digits: int = 2) -> tuple[int, float, float]: ...
```

It accepts **any number** of numbers as separate arguments and returns a tuple
`(count, total, mean)`:

- `count` is how many values were passed;
- `total` is their sum;
- `mean` is `total / count`, **rounded** with `round(mean, digits)`;
- with no values at all, return `(0, 0, 0.0)`.

