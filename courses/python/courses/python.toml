[[unit]]
id = "py-u07-lists-tuples"
title = "Lists & tuples"
level = "intermediate"
difficulty = 7
intro = '''
Almost every real program keeps a collection of values in order: lines of a file, rows of a
report, moves of a game. Python's two workhorse sequences are the **list**, which you can
change in place, and the **tuple**, which never changes once built. This unit covers both,
the slicing syntax they share, sorting with a key, and unpacking, and ends with a leaderboard
function that ranks players.
'''
concepts = '''
## The idea

A **sequence** is an ordered collection where every element has a position, its **index**,
counted from 0. Under the hood a Python list is a **dynamic array**: one contiguous block of
references to objects. That layout makes reading `items[i]` an O(1) operation, because the
address is computed rather than searched for. Appending at the end is O(1) *amortised*: when
the block fills up, Python allocates a bigger one and copies the references over, but it grows
by a proportion, so the copies are rare. Inserting or deleting at the front is O(n), because
every element after that point has to shift.

The second big idea is **mutability**. A list can change after it is created; a tuple cannot.
A variable in Python is only a *name* attached to an object, so two names can point to the
same list. That is called **aliasing**, and it is the source of many surprising bugs.

## How Python does it

Lists use square brackets, tuples use commas (the parentheses are usually just for grouping):

```python
colours = ["red", "green"]
colours.append("blue")       # add at the end
colours.insert(1, "amber")   # shift the rest right
print(colours[-1])           # negative indices count from the end: blue
print(colours[1:3])          # a slice: a NEW list ['amber', 'green']

origin = (0, 0)              # a tuple
single = (5,)                # one-element tuple: the comma matters
```

A slice `seq[start:stop:step]` includes `start` and excludes `stop`; any part can be left
out, so `seq[:]` copies the whole sequence and `seq[::-1]` reverses it.

There are two ways to sort. `items.sort()` sorts a list **in place** and returns `None`;
`sorted(iterable)` builds a **new** list and leaves the original alone. Both accept
`key=`, a function that turns each element into the value to compare, and `reverse=True`.
Python's sort (Timsort) is **stable**: elements that compare equal keep their original
relative order. Tuples compare element by element, left to right, which makes them handy keys.

**Unpacking** spreads a sequence into names: `x, y = point`. A starred name collects the
leftovers: `head, *rest = items`.

## Pitfalls

- `b = a` does not copy a list; it adds a second name for the same list. Use `a.copy()`
  or `a[:]` when you need an independent list.
- `[[0] * 3] * 3` repeats the *same* inner list three times; changing one row changes all.
- `items = items.sort()` sets `items` to `None`, because `sort` returns nothing.
- A tuple is immutable, but a list stored inside a tuple can still change.
- `(5)` is just the number 5; a one-element tuple needs a trailing comma.

## What you will practise

You will grow and slice a list, watch aliasing happen (and avoid it), sort with a key and
unpack the results. The challenge asks you to rank a list of `(name, score)` pairs.
'''

[[unit.step]]
kind = "concept"
id = "py-u07-c1-sequences"
title = "Lists, tuples and mutability"
points = 5
difficulty = 7
intro = '''
A list is a dynamic array of references, so indexing is O(1) and appending at the end is
O(1) amortised. A tuple is a fixed, immutable sequence. Knowing which one you hold, and which
names share it, is what keeps collection code correct.
'''
body = '''
## Lists change, tuples do not

```python
nums = [3, 1, 2]
nums.append(4)        # [3, 1, 2, 4]
nums[0] = 9           # [9, 1, 2, 4]
last = nums.pop()     # removes and returns 4

pair = ("ana", 31)
name, age = pair      # unpacking
```

A **list** is for a collection that grows, shrinks or changes: `append`, `insert`, `pop`,
`remove` and item assignment all modify it in place. A **tuple** is for a fixed group of
values that belong together, such as a coordinate or a database row. Because a tuple cannot
change, Python lets you use it as a dictionary key, and you can pass it around without fear
that someone will modify it.

## Slicing makes copies

`seq[1:3]` returns a **new** sequence with the elements at indices 1 and 2. Negative indices
count from the end, so `seq[-1]` is the last element and `seq[::-1]` is a reversed copy.
Assigning to a slice of a list, `nums[1:3] = [7, 8, 9]`, replaces that range and can even
change the list's length.

## Names are not boxes

`b = a` makes `b` a second name for the *same* list. Change it through `b` and you see the
change through `a`. The `is` operator tells you whether two names refer to one object;
`a.copy()` gives you a separate list to change freely.

## Sorting

`sorted(seq, key=..., reverse=...)` returns a new list; `lst.sort(...)` sorts in place and
returns `None`. The sort is stable, so equal keys keep their input order.
'''

