    def test_equilateral(self):
        self.assertEqual(classify_triangle(3, 3, 3), "equilateral")
        self.assertEqual(classify_triangle(0.5, 0.5, 0.5), "equilateral")

    def test_isosceles_in_any_order(self):
        self.assertEqual(classify_triangle(3, 3, 5), "isosceles")
        self.assertEqual(classify_triangle(3, 5, 3), "isosceles")
        self.assertEqual(classify_triangle(5, 3, 3), "isosceles")

    def test_scalene(self):
        self.assertEqual(classify_triangle(3, 4, 5), "scalene")
        self.assertEqual(classify_triangle(7, 10, 5), "scalene")
        self.assertEqual(classify_triangle(2.5, 3.5, 4.5), "scalene")

    def test_flat_triangle_is_invalid(self):
        self.assertEqual(classify_triangle(1, 2, 3), "invalid")
        self.assertEqual(classify_triangle(3, 1, 2), "invalid")
        self.assertEqual(classify_triangle(2, 4, 2), "invalid")

    def test_impossible_lengths_are_invalid(self):
        self.assertEqual(classify_triangle(1, 1, 3), "invalid")
        self.assertEqual(classify_triangle(10, 1, 1), "invalid")
        self.assertEqual(classify_triangle(1, 10, 2), "invalid")

    def test_zero_and_negative_are_invalid(self):
        self.assertEqual(classify_triangle(0, 0, 0), "invalid")
        self.assertEqual(classify_triangle(-3, -3, -3), "invalid")
        self.assertEqual(classify_triangle(-3, 4, 5), "invalid")
        self.assertEqual(classify_triangle(3, 0, 3), "invalid")

    def test_large_sides(self):
        self.assertEqual(classify_triangle(10**9, 10**9, 10**9 + 1), "isosceles")
        self.assertEqual(classify_triangle(10**9, 10**9, 2 * 10**9), "invalid")
'''

[unit.step.gabarito]
solution = '''
def classify_triangle(a: float, b: float, c: float) -> str:
    """Return "invalid", "equilateral", "isosceles" or "scalene" for sides a, b, c."""
    if a <= 0 or b <= 0 or c <= 0:
        return "invalid"
    if a + b <= c or a + c <= b or b + c <= a:
        return "invalid"
    if a == b == c:
        return "equilateral"
    if a == b or b == c or a == c:
        return "isosceles"
    return "scalene"
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function always does the same small, fixed amount of work: at most three sign checks,
three additions with comparisons, and three equality tests, no matter what the lengths are.
There is no loop and no data structure that grows with the input, so both time and space
are **O(1)**. The interesting part is not speed but **order**: the validity checks must come
first, otherwise `(0, 0, 0)` would be reported as equilateral and `(1, 1, 3)` as isosceles.
Each `return` ends the function at once, so later checks may assume that the earlier ones
failed.
'''

