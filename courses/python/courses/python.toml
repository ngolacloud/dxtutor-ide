body = '''
## Open, execute, fetch

```python
import sqlite3

conn = sqlite3.connect(":memory:")
conn.execute("CREATE TABLE users (id INTEGER, name TEXT)")
conn.execute("INSERT INTO users VALUES (?, ?)", (1, "Ana"))

cur = conn.execute("SELECT name FROM users WHERE id = ?", (1,))
print(cur.fetchone())        # ('Ana',)
conn.close()
```

- **`sqlite3.connect(path)`** opens (or creates) a database file. `":memory:"` gives a
  throwaway database in RAM.
- **`conn.execute(sql, params)`** runs one statement and returns a **cursor**. It is a
  shortcut for `conn.cursor().execute(...)`.
- **`?` placeholders** are filled from the tuple, in order. The values travel separately
  from the SQL text, so they can never change what the statement means. Named
  placeholders such as `:name` take a dict instead.
- **`executemany(sql, rows)`** runs the same statement once per row of a list.

## Reading results

- `cur.fetchone()` returns the next row as a tuple, or `None` if there are no more.
- `cur.fetchall()` returns a list with all remaining rows.
- `for row in cur:` streams rows one at a time without building a list.

Rows are tuples, so they unpack naturally: `for title, year in cur:`. Set
`conn.row_factory = sqlite3.Row` to read columns by name as well, as in `row["title"]`.

Never build SQL with f-strings or `+`. A quote in the data breaks the statement, and a
crafted value rewrites it.
'''

