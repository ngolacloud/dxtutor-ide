[[unit.step]]
kind = "concept"
id = "py-u13-c1-dataclasses"
title = "Records with @dataclass"
points = 5
difficulty = 13
intro = '''
A decorator is a function that receives a class (or function) and returns an improved one.
`@dataclass` inspects the class's annotations at definition time and generates the
boilerplate methods. Type hints themselves are metadata: Python stores them in
`__annotations__` but does not check them when the code runs.
'''
body = '''
## From boilerplate to one decorator

Without help, a simple record needs three methods written by hand:

```python
class Item:
    def __init__(self, name, price):
        self.name = name
        self.price = price
    def __repr__(self):
        return f"Item(name={self.name!r}, price={self.price!r})"
    def __eq__(self, other):
        return (self.name, self.price) == (other.name, other.price)
```

With `@dataclass`, the field list **is** the definition:

```python
from dataclasses import dataclass

@dataclass
class Item:
    name: str
    price: float = 0.0
```

The generated `__init__` takes the fields in order, with their defaults. `__repr__` prints
every field, and `__eq__` compares all fields.

## Decorator options

| Option | Adds |
|---|---|
| `order=True` | `<`, `<=`, `>`, `>=`, comparing fields as a tuple |
| `frozen=True` | assignment raises `FrozenInstanceError`; instances become hashable |

Use `field(default_factory=list)` for a mutable default, so each instance gets its own list.

## Hints worth knowing

- `list[int]`, `dict[str, int]`, `tuple[int, int]` describe containers.
- `Optional[int]` (or `int | None`) means the value may be missing.
- A return hint such as `-> "Item"` in quotes refers to a class that is still being defined.

Hints describe intent. Validation, when you need it, is still your code's job.
'''

