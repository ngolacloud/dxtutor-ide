body = '''
## Turning WAL on

```python
conn = sqlite3.connect(path)
conn.execute("PRAGMA journal_mode=WAL").fetchone()   # ('wal',)
```

- WAL needs a **file**; `":memory:"` stays in `memory` mode.
- The setting is stored in the file, so later connections inherit it.
- In WAL mode readers do not block the writer, and the writer does not block readers.
  Writers still take turns: one at a time.

## Connections and threads

```python
import threading

def work(path):
    conn = sqlite3.connect(path, timeout=10.0)   # opened in this thread
    with conn:
        conn.execute("INSERT INTO hits VALUES (1)")
    conn.close()

threads = [threading.Thread(target=work, args=(path,)) for _ in range(4)]
```

- A connection may only be used by the thread that created it; another thread gets
  `ProgrammingError`.
- So each thread **opens its own connection** to the same database file.
- `timeout=` sets how many seconds a connection waits for a lock held by another writer
  before raising `OperationalError: database is locked`.

Start every thread first, then `join()` them all, and only then read the result: a
query made before the joins could see only part of the work.
'''

