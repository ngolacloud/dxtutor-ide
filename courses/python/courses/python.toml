instructions = '''
## Your turn

Build a tiny **thread pool** using only the `threading` module (the ready-made pools of
`concurrent.futures` come in the next unit). A fixed number of worker threads share the list
of items; each worker repeatedly claims the next unprocessed item, and the results come back
in input order.

```python
def thread_map(func: Callable[[T], R], items: list[T], workers: int) -> list[R]: ...
```

Requirements:

- Return the same list as `[func(x) for x in items]`, in the **same order** as `items`.
- Start **at most `workers` threads**, never one per item, so that at most `workers` calls
  run at the same time. With `workers` of 2 or more, slow I/O-bound calls must overlap.
- Each item is processed exactly once.
- If `workers < 1`, raise `ValueError`. An empty `items` returns `[]`.
- If any call raises, wait for the threads to finish, then re-raise the exception of the
  failing item with the **smallest index**.

Examples:

```python
thread_map(lambda x: x * x, [1, 2, 3, 4], workers=2)   # [1, 4, 9, 16]
thread_map(str.upper, ["a", "b"], workers=8)            # ['A', 'B']
```

- If `slow(x)` sleeps 0.1 s, `thread_map(slow, list(range(8)), 4)` takes about 0.2 s instead
  of 0.8 s.

**Hint:** start `workers` threads and let them claim indices from a shared counter guarded
by a `Lock`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
