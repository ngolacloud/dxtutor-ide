tests = '''
import random
import time


def insert(root, key):
    new = Node(key)
    if root is None:
        return new
    node = root
    while True:
        if key < node.key:
            if node.left is None:
                node.left = new
                return root
            node = node.left
        elif key > node.key:
            if node.right is None:
                node.right = new
                return root
            node = node.right
        else:
            return root


def build(keys):
    root = None
    for k in keys:
        root = insert(root, k)
    return root


def inorder(root):
    out, stack, node = [], [], root
    while stack or node is not None:
        while node is not None:
            stack.append(node)
            node = node.left
        node = stack.pop()
        out.append(node.key)
        node = node.right
    return out


def is_bst(root):
    stack = [(root, None, None)]
    while stack:
        node, lo, hi = stack.pop()
        if node is None:
            continue
        if (lo is not None and node.key <= lo) or (hi is not None and node.key >= hi):
            return False
        stack.append((node.left, lo, node.key))
        stack.append((node.right, node.key, hi))
    return True


BASE = [50, 30, 70, 20, 40, 60, 80]


class TestDeleteCases(unittest.TestCase):
    def test_delete_leaf(self):
        root = delete(build(BASE), 20)
        self.assertEqual(inorder(root), [30, 40, 50, 60, 70, 80])
        self.assertTrue(is_bst(root))
        self.assertEqual(root.key, 50)

    def test_delete_node_with_one_child(self):
        root = build(BASE + [65])
        root = delete(root, 60)
        self.assertEqual(inorder(root), [20, 30, 40, 50, 65, 70, 80])
        self.assertTrue(is_bst(root))
        root = build([10, 5, 3])
        root = delete(root, 5)
        self.assertEqual(inorder(root), [3, 10])
        self.assertIs(root.left.left, None)

    def test_delete_node_with_two_children(self):
        root = delete(build(BASE), 30)
        self.assertEqual(inorder(root), [20, 40, 50, 60, 70, 80])
        self.assertTrue(is_bst(root))

    def test_delete_root_with_two_children(self):
        root = delete(build(BASE), 50)
        self.assertEqual(inorder(root), [20, 30, 40, 60, 70, 80])
        self.assertTrue(is_bst(root))
        self.assertEqual(root.key, 60)

    def test_delete_root_with_one_child(self):
        root = build([1, 2, 3])
        root = delete(root, 1)
        self.assertEqual(root.key, 2)
        self.assertEqual(inorder(root), [2, 3])

    def test_missing_key(self):
        root = build(BASE)
        self.assertIs(delete(root, 99), root)
        self.assertIs(delete(root, 45), root)
        self.assertEqual(inorder(root), sorted(BASE))

    def test_empty_and_single(self):
        self.assertIsNone(delete(None, 5))
        self.assertIsNone(delete(Node(5), 5))

    def test_negative_keys(self):
        root = build([0, -10, 10, -20, -5, 5, 20])
        for k in [-10, 0, 20]:
            root = delete(root, k)
            self.assertTrue(is_bst(root))
        self.assertEqual(inorder(root), [-20, -5, 5, 10])


class TestDeleteAtScale(unittest.TestCase):
    def test_random_sequence(self):
        rng = random.Random(26)
        keys = list(range(300))
        rng.shuffle(keys)
        root = build(keys)
        alive = set(keys)
        order = keys[:]
        rng.shuffle(order)
        for i, k in enumerate(order):
            root = delete(root, k)
            alive.discard(k)
            if i % 15 == 0:
                self.assertTrue(is_bst(root))
                self.assertEqual(inorder(root), sorted(alive))
        self.assertIsNone(root)

    def test_large_tree(self):
        rng = random.Random(2026)
        keys = rng.sample(range(10_000_000), 100_000)
        root = build(keys)
        doomed = rng.sample(keys, 20_000) + [-1, 10_000_001]
        start = time.perf_counter()
        for k in doomed:
            root = delete(root, k)
        elapsed = time.perf_counter() - start
        self.assertLess(elapsed, 3.0, "each delete should cost O(h)")
        self.assertTrue(is_bst(root))
        self.assertEqual(inorder(root), sorted(set(keys) - set(doomed)))
