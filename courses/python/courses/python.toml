instructions = '''
## Your turn

Implement the function `mask_card`:

```python
def mask_card(number: str) -> str: ...
```

`number` is a card number typed by a person. It may contain **spaces** and **hyphens**
between groups of digits, and spaces at the start or end. First remove every space and
hyphen. Then replace every character **except the last four** with `*` and return the
result. If four or fewer characters remain, return them unchanged.

Examples:

- `mask_card("4111 1111 1111 1234")` → `"************1234"`
- `mask_card("5500-0000-0004")` → `"********0004"`
- `mask_card("123")` → `"123"`

**Hint:** `replace`, `len`, slicing and `*` on a string are all you need. No loop required.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
def mask_card(number: str) -> str:
    """Remove spaces and hyphens, then mask all but the last four characters with '*'."""
    raise NotImplementedError
'''
tests = '''
class TestMaskCard(unittest.TestCase):
    def test_spaces_between_groups(self):
        self.assertEqual(mask_card("4111 1111 1111 1234"), "************1234")

    def test_hyphens_between_groups(self):
        self.assertEqual(mask_card("5500-0000-0004"), "********0004")

    def test_plain_digits(self):
        self.assertEqual(mask_card("12345678"), "****5678")

    def test_mixed_separators_and_outer_spaces(self):
        self.assertEqual(mask_card("  3782-822463 10005 "), "***********0005")

    def test_short_numbers_unchanged(self):
        self.assertEqual(mask_card("123"), "123")
        self.assertEqual(mask_card("1 2-3"), "123")

    def test_exactly_four(self):
        self.assertEqual(mask_card("9876"), "9876")

    def test_five_masks_one(self):
        self.assertEqual(mask_card("54321"), "*4321")

    def test_empty(self):
        self.assertEqual(mask_card(""), "")
        self.assertEqual(mask_card(" - "), "")

    def test_long_number(self):
        digits = "1234567890" * 10
        self.assertEqual(mask_card(digits), "*" * 96 + "7890")
'''

[unit.step.gabarito]
solution = '''
def mask_card(number: str) -> str:
    """Remove spaces and hyphens, then mask all but the last four characters with '*'."""
    digits = number.replace(" ", "").replace("-", "")
    if len(digits) <= 4:
        return digits
    return "*" * (len(digits) - 4) + digits[-4:]
'''
time = "O(n)"
space = "O(n)"
justification = '''
Each `replace` scans the `n` characters of the input once and builds a new string, so
cleaning costs **O(n)** time and **O(n)** space. `len` is **O(1)**, because a string stores
its own length. The mask `"*" * k` and the slice `digits[-4:]` together produce a string of
the same length as `digits`, and the final `+` copies it once more: still a constant number
of linear passes, so **O(n)** time overall. Every intermediate string is at most `n`
characters long, so the space is **O(n)**. (The `if` is only for clarity: `"*" * k` with a
negative `k` is already the empty string.)
'''

