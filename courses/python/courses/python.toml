intro = '''
Real input is text, and a program must convert it before doing arithmetic. Your function
receives two numbers as strings, turns them into floats, divides them and rounds the result.
Each step is a separate, well-defined operation on a value of a known type.
'''
instructions = '''
## Your turn

Implement the function `km_per_litre`:

```python
def km_per_litre(distance_km: str, litres: str) -> float: ...
```

Both arguments are **text**, as if they had been read from a form. They may contain a
decimal point and may have spaces around them. Convert them to numbers, divide the distance
by the litres, and return the result **rounded to one decimal place** as a `float`.

Examples:

- `km_per_litre("450", "30")` → `15.0`
- `km_per_litre("123.4", "10")` → `12.3`
- `km_per_litre("100", "7.5")` → `13.3`

You may assume `litres` is never zero.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
def km_per_litre(distance_km: str, litres: str) -> float:
    """Return distance_km / litres, both given as text, rounded to 1 decimal place."""
    raise NotImplementedError
'''
tests = '''
class TestKmPerLitre(unittest.TestCase):
    def test_whole_numbers(self):
        self.assertEqual(km_per_litre("450", "30"), 15.0)

    def test_decimal_distance(self):
        self.assertEqual(km_per_litre("123.4", "10"), 12.3)

    def test_rounds_down_to_one_decimal(self):
        self.assertEqual(km_per_litre("100", "7.5"), 13.3)
        self.assertEqual(km_per_litre("1000", "3"), 333.3)

    def test_rounds_up_to_one_decimal(self):
        self.assertEqual(km_per_litre("200", "3"), 66.7)

    def test_returns_a_float(self):
        self.assertIsInstance(km_per_litre("450", "30"), float)

    def test_surrounding_spaces(self):
        self.assertEqual(km_per_litre(" 80 ", " 4 "), 20.0)

    def test_zero_distance(self):
        self.assertEqual(km_per_litre("0", "5"), 0.0)

    def test_large_values(self):
        self.assertEqual(km_per_litre("1234567.8", "1000"), 1234.6)
'''

[unit.step.gabarito]
solution = '''
def km_per_litre(distance_km: str, litres: str) -> float:
    """Return distance_km / litres, both given as text, rounded to 1 decimal place."""
    distance = float(distance_km)
    fuel = float(litres)
    return round(distance / fuel, 1)
'''
time = "O(n)"
space = "O(1)"
justification = '''
The only work that depends on the input is parsing: `float()` reads each string once,
character by character, so the time is **O(n)** where `n` is the total length of the two
texts. The division and `round` are single operations on fixed-size floats, **O(1)**. Apart
from two float objects and the result, nothing is stored, so the extra space is **O(1)**.
Note that `float()` already ignores surrounding whitespace, and that `int()` would have
failed on `"123.4"`, which is why the conversion must be to `float`.
'''

# ---------------------------------------------------------------------------
# Unit 3 — Strings & f-strings
# ---------------------------------------------------------------------------
[[unit]]
id = "py-u03-strings"
title = "Strings & f-strings"
level = "basic"
difficulty = 3
intro = '''
Text is everywhere: names, messages, file contents, web pages. This unit shows how Python
stores text as an immutable sequence of characters, how to pick pieces out of it with
indexing and slicing, how string methods transform it, and how f-strings format values
neatly. The unit ends with a function that masks a card number, the way receipts do.
'''
concepts = '''
## The idea

A **string** is a sequence of characters: letters, digits, spaces, punctuation, emoji.
Because it is a *sequence*, every character has a position, called its **index**, starting
at `0`. Strings are also **immutable**: once created, a string never changes. Every
operation that seems to modify one, like converting to upper case, actually builds and
returns a new string, leaving the original as it was.

## How Python does it

Indexing uses square brackets. Negative indexes count from the end, so `-1` is the last
character. A **slice** `s[start:stop]` takes the characters from `start` up to, but not
including, `stop`; either end may be left out, and an optional third number is the step.

```python
s = "Lisbon"
print(s[0], s[-1])   # L n
print(s[1:4])        # isb
print(s[::-1])       # nobsiL
print(len(s))        # 6
```

Strings come with dozens of **methods**, functions attached to the value and called with a
dot. A few you will use constantly: `strip()` removes surrounding whitespace, `upper()` and
`lower()` change case, `replace(old, new)` substitutes text, `find(sub)` returns a position
(or `-1`), `split()` breaks the text into a list of words and `sep.join(words)` glues a list
back together with `sep` between the pieces. The `in` operator tests for a substring:
`"bon" in s` is `True`.

An **f-string** (a string literal prefixed with `f`) evaluates expressions inside braces
and inserts their values. After a colon you can add a **format spec**: `.2f` for two
decimals, `>8` to right-align in eight columns, `,` for thousands separators.

```python
item, cost = "coffee", 1.5
print(f"{item:<8}|{cost:>6.2f}")   # coffee  |  1.50
```

## What is special or tricky

- **You cannot assign to a character.** `s[0] = "l"` raises `TypeError: 'str' object does
  not support item assignment`. Build a new string with slicing and `+` instead.
- **Methods return new strings.** `name.upper()` on its own line changes nothing; you must
  keep the result: `name = name.upper()`.
- **Indexing past the end fails, slicing does not.** `s[10]` raises `IndexError`, while
  `s[2:100]` just stops at the end.
- **`split()` and `split(" ")` differ.** With no argument, `split` treats any run of spaces,
  tabs or newlines as one separator and drops empty pieces; `split(" ")` splits on every
  single space and can produce empty strings.
- **Comparison is case-sensitive.** `"Ana" == "ana"` is `False`; compare `lower()` versions
  when case should not matter.

## What you will practise

You will clean and transform text with methods, slice a word in every direction, and format
a small report with f-strings. The challenge asks you to clean a card number typed by a person
and hide all but its last digits.
'''

[[unit.step]]
kind = "concept"
id = "py-u03-c1-sequences"
title = "Strings are immutable sequences"
points = 5
difficulty = 3
intro = '''
Under the hood a Python string is an ordered, read-only array of Unicode characters, which
is why reading the character at any index takes constant time. Immutability makes strings
safe to share between different parts of a program: nobody can change one behind your back.
'''
body = '''
## Positions and slices

Each character sits at an index. With `word = "Python"`:

| index | 0 | 1 | 2 | 3 | 4 | 5 |
|---|---|---|---|---|---|---|
| character | P | y | t | h | o | n |
| negative index | -6 | -5 | -4 | -3 | -2 | -1 |

`word[0]` is `"P"` and `word[-1]` is `"n"`. A slice such as `word[1:4]` returns `"yth"`:
it starts at index 1 and stops *before* index 4. Think of the indexes as pointing at the
gaps between characters, and the slice as everything between two gaps.

## Immutable means "make a new one"

```python
word = "Python"
loud = word.upper()
print(word, loud)        # Python PYTHON
fixed = "J" + word[1:]
print(fixed)             # Jython
```

`upper()` did not touch `word`; it returned a new string, which we named `loud`. To
"change" the first letter you build a new string from a new first letter and a slice of
the old one.

## Formatting with f-strings

```python
name, points = "Ada", 7.456
print(f"{name} has {points:.1f} points")   # Ada has 7.5 points
```

Anything inside the braces is a normal Python expression, evaluated when the line runs.
'''

