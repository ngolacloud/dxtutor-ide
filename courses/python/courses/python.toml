import random
import signal
import time
from contextlib import contextmanager


@contextmanager
def deadline(seconds):
    """Fail fast (instead of hanging) if the code under test is far too slow."""
    def too_slow(signum, frame):
        raise AssertionError("gave up after %d s: this input needs an O(n log n) algorithm" % seconds)
