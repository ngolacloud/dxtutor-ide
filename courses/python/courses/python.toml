for order_id in ids:
    (price,) = conn.execute(
        "SELECT price FROM orders WHERE id = ?", (order_id,)
    ).fetchone()
    total += price

# One query for the whole set
marks = ", ".join("?" for _ in ids)          # "?, ?, ?"
(total,) = conn.execute(
    f"SELECT COALESCE(SUM(price), 0) FROM orders WHERE id IN ({marks})", ids
).fetchone()
```

