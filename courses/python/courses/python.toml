[[unit]]
id = "py-udb2-transactions"
title = "Transactions: all or nothing"
level = "intermediate"
difficulty = 17
intro = '''
A transaction groups several statements so that either all of them take effect or none do.
Python's `sqlite3` opens transactions for you, `commit()` keeps the changes and `rollback()`
throws them away. With `with conn:` the commit or rollback happens automatically, and you use
it to build a money transfer that can never leave the books half-updated.
'''
concepts = '''
## The idea

Many real operations take more than one statement. Moving money means subtracting from one account *and* adding to another. If the program crashes, or a check fails, between the two, the money vanishes. A **transaction** makes a group of statements **atomic**: the database applies all of them or none of them.

Transactions bring the **ACID** guarantees: **A**tomicity (all or nothing), **C**onsistency (constraints hold at the end), **I**solation (other connections do not see half-finished work) and **D**urability (once committed, changes survive a crash). You start a transaction with `BEGIN`, end it with `COMMIT` to keep the changes, or `ROLLBACK` to undo everything since `BEGIN`.

## How Python does it

In its default mode `sqlite3` issues `BEGIN` for you, silently, just before the first `INSERT`, `UPDATE`, `DELETE` or `REPLACE`. From then on, changes stay pending until you call `conn.commit()` or `conn.rollback()`. `conn.in_transaction` tells you whether one is open.

```python
conn.execute("INSERT INTO log VALUES (?)", ("start",))
print(conn.in_transaction)   # True: Python opened one
conn.rollback()              # the insert is gone
```

The idiomatic tool is the connection as a **context manager**. `with conn:` commits when the block finishes normally and rolls back if an exception escapes it; the exception still propagates, so you can catch it outside.

```python
try:
    with conn:
        conn.execute("UPDATE stock SET qty = qty - 1 WHERE id = ?", (item,))
        conn.execute("INSERT INTO sales (item) VALUES (?)", (item,))
except sqlite3.Error:
    print("sale not recorded")   # both statements were undone
```

To abort for a business rule, such as "not enough stock", raise an exception inside the block. The rollback is what makes the earlier statements disappear.

`cursor.rowcount` reports how many rows an `UPDATE` or `DELETE` touched. Zero means the `WHERE` matched nothing, which SQL does not treat as an error.

## What is special or tricky

- `with conn:` does **not** close the connection. It only ends the transaction.
- Forgetting `commit()` is silent: closing the connection discards pending changes.
- Your own connection sees its uncommitted changes. Other connections do not, so a test that reads through the same connection can be fooled.
- A constraint violation such as a failed `CHECK` raises `sqlite3.IntegrityError`. Inside `with conn:` that rolls back every statement in the block, not only the failing one.
- Updating a missing row is not an error; check `rowcount` if the row must exist.
- Python 3.12 added `sqlite3.connect(..., autocommit=False)`, a stricter mode that keeps a transaction always open. This course uses the default mode, which is what most existing code relies on.

## What you will practise

You will commit and roll back by hand, watch `with conn:` undo work when an exception escapes, and see a constraint violation cancel a whole block. The challenge is a transfer that commits only when every rule holds.
'''

[[unit.step]]
kind = "concept"
id = "py-udb2-c1-commit-rollback"
title = "commit, rollback and with conn"
points = 5
difficulty = 17
intro = '''
Atomicity is the A in ACID: a transaction is applied whole or not at all. The database keeps
enough information (a journal) to undo every change made since `BEGIN`, which is how a
rollback can restore the previous state exactly.
'''
body = '''
## Pending until committed

```python
conn.execute("INSERT INTO notes VALUES (?)", ("draft",))   # Python runs BEGIN first
conn.in_transaction    # True
conn.commit()          # the row is now permanent and visible to others
conn.execute("DELETE FROM notes")
conn.rollback()        # the delete never happened
```

- In the default mode, `sqlite3` begins a transaction automatically before the first
  data-changing statement.
- **`commit()`** makes every pending change permanent; **`rollback()`** discards them.
- **`conn.in_transaction`** is `True` while changes are pending.

## The connection as a context manager

```python
with conn:
    conn.execute("UPDATE accounts SET balance = balance - 10 WHERE id = 1")
    conn.execute("UPDATE accounts SET balance = balance + 10 WHERE id = 2")
```

Leaving the block normally **commits**. Leaving it because of an exception **rolls
back** and re-raises the exception. This is the safest way to group statements: there is
no path out of the block that leaves a transaction half done.

To cancel on purpose, raise inside the block, then catch the exception outside it:

```python
try:
    with conn:
        ...
        if balance < 0:
            raise ValueError("insufficient funds")
except ValueError:
    ...   # already rolled back
```

`with conn:` never closes the connection. Call `conn.close()` when you are finished with it.
'''

