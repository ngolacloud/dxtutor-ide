class TestRetry(unittest.TestCase):
    def test_succeeds_after_failures(self):
        calls = []

        @retry(3)
        def flaky():
            calls.append(1)
            if len(calls) < 3:
                raise ConnectionError("try again")
            return "ok"

        self.assertEqual(flaky(), "ok")
        self.assertEqual(len(calls), 3)

    def test_first_success_calls_once(self):
        calls = []

        @retry(4)
        def fine():
            calls.append(1)
            return 42

        self.assertEqual(fine(), 42)
        self.assertEqual(len(calls), 1)

    def test_exhausted_reraises_last(self):
        calls = []

        @retry(2)
        def always():
            calls.append(1)
            raise ValueError(f"bad {len(calls)}")

        with self.assertRaises(ValueError) as ctx:
            always()
        self.assertEqual(str(ctx.exception), "bad 2")
        self.assertEqual(len(calls), 2)

    def test_times_one_means_no_retry(self):
        calls = []

        @retry(1)
        def always():
            calls.append(1)
            raise RuntimeError("nope")

        with self.assertRaises(RuntimeError):
            always()
        self.assertEqual(len(calls), 1)

    def test_other_exceptions_not_retried(self):
