from typing import Callable


def retry(times: int, exceptions: tuple[type[BaseException], ...] = (Exception,)) -> Callable:
    """Return a decorator that retries the wrapped function, up to `times` attempts in total.

    Only exceptions listed in `exceptions` cause a retry; after the last failed attempt,
    that attempt's exception is re-raised.
    """
    raise NotImplementedError
'''
