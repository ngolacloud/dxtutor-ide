[unit.step.gabarito]
solution = '''
from dataclasses import dataclass, replace


@dataclass(order=True, frozen=True)
class Version:
    """A semantic version MAJOR.MINOR.PATCH."""

    major: int
    minor: int
    patch: int

    @classmethod
    def parse(cls, text: str) -> "Version":
        """Parse 'MAJOR.MINOR.PATCH'; raise ValueError on anything else."""
        parts = text.strip().split(".")
        if len(parts) != 3 or not all(p.isascii() and p.isdigit() for p in parts):
            raise ValueError(f"not a MAJOR.MINOR.PATCH version: {text!r}")
        major, minor, patch = (int(p) for p in parts)
        return cls(major, minor, patch)

    def bump(self, part: str) -> "Version":
        """Return a new Version with 'major', 'minor' or 'patch' incremented."""
        if part == "major":
            return Version(self.major + 1, 0, 0)
        if part == "minor":
            return Version(self.major, self.minor + 1, 0)
        if part == "patch":
            return replace(self, patch=self.patch + 1)
        raise ValueError(f"unknown part: {part!r}")

    def __str__(self) -> str:
        """Return the 'MAJOR.MINOR.PATCH' text."""
        return f"{self.major}.{self.minor}.{self.patch}"
'''
time = "O(n) to parse; O(1) to compare, hash or bump"
space = "O(n) to parse; O(1) per Version"
justification = '''
`parse` strips and splits the text and checks each character once, so it is **O(n)** in
the length `n` of the input, and the temporary list of parts takes **O(n)** memory. The
numbers themselves are small, so converting them with `int` is linear in their digits too.

Every other operation works on exactly three integers. The generated `__eq__`, `__lt__` and
`__hash__` compare or hash the tuple `(major, minor, patch)`, and `bump` builds one new
three-field object, so each is **O(1)** in time and space. Comparing **integers** rather than
strings is what makes `1.10.0 > 1.9.9`: as strings, `"10" < "9"`. Being frozen is what makes
hashing safe, because a value that cannot change can never move to a different hash bucket.
'''

[[unit]]
id = "py-u14-generators"
title = "Iterators & generators"
level = "intermediate"
difficulty = 14
intro = '''
Every `for` loop in Python runs on one small protocol: `iter()` and `next()`. Generators let
you write your own iterators with a plain function and `yield`, producing values **lazily**,
one at a time, only when asked. You will look inside the protocol, watch a generator pause and
resume, chain lazy pipelines with `itertools`, and build a streaming moving average.
'''
concepts = '''
## The idea

Many computations produce a **sequence** of values: lines of a log file, rows from a
database, numbers from a sensor. The eager approach builds the whole list first and then
uses it. That costs memory proportional to the data and makes you wait for the last item
before seeing the first. It is impossible when the sequence is endless.

The lazy approach produces each value **on demand**. A consumer asks for the next item, the
producer computes just that one, and nothing else is held in memory. Chaining lazy stages
gives a **pipeline** where each item flows through every step before the next item is even
produced, and memory stays constant however long the stream is.

## How Python does it

An **iterable** is anything you can loop over (a list, a string, a file). Calling `iter()` on
it returns an **iterator**: an object with a `__next__` method that returns the next value
and raises `StopIteration` when there are no more. A `for` loop is exactly that: call
`iter()` once, then `next()` until `StopIteration`.

```python
it = iter("ok")
print(next(it), next(it))   # o k
print(next(it, "end"))      # end: the default instead of StopIteration
```

A **generator function** is a function containing `yield`. Calling it does **not** run the
body; it returns a generator object. Each `next()` runs the body until the next `yield`,
hands that value out and **pauses**, keeping every local variable intact.

```python
def evens(limit):
    n = 0
    while n < limit:
        yield n
        n += 2

print(list(evens(7)))       # [0, 2, 4, 6]
```

A **generator expression** is the lazy cousin of a list comprehension: `(x * x for x in data)`
computes nothing until you iterate it. The `itertools` module adds lazy building blocks:
`count()` (an endless counter), `islice()` (take a slice of any iterator),
`takewhile()`, `chain()` and many more.

## What is special or tricky

- **Iterators are single-use.** Once exhausted, a generator stays empty. Looping over it a
  second time silently does nothing. A list, by contrast, can be iterated again and again.
- **Generators have no `len()` and no indexing.** If your code calls `len(data)` or
  `data[i]`, it only works with sequences, not with streams. Code that only iterates works
  with both.
- **Nothing runs until you ask.** Errors inside a generator body appear at the first `next()`,
  not when the generator is created.
- **Never call `list()` on an infinite iterator.** Use `islice` or `takewhile` to take a
  bounded piece.
- **`return` inside a generator ends it**: the loop that consumes it simply stops.

## What you will practise

You will drive an iterator by hand and write a class-based one, trace exactly when a
generator's body runs, and compose a lazy pipeline with generator expressions and
`itertools`. The challenge asks for a generator that keeps a small amount of state while
consuming a stream that may never end.
'''

[[unit.step]]
kind = "concept"
id = "py-u14-c1-generators"
title = "The iterator protocol and yield"
points = 5
difficulty = 14
intro = '''
The iterator protocol is a contract of two methods: `__iter__` returns the iterator and
`__next__` returns the next value or raises `StopIteration`. A generator is the compiler
writing that object for you: its stack frame is saved at each `yield` and restored at the
next `next()`, which is why its locals survive between values.
'''
body = '''
## What a for loop really does

```python
for word in ["a", "b"]:
    print(word)
```

is roughly:

```python
it = iter(["a", "b"])
while True:
    try:
        word = next(it)
    except StopIteration:
        break
    print(word)
```

Any object that supports this protocol can be used in a `for`, in `list()`, `sum()`,
`max()`, unpacking and comprehensions.

## Generators: iterators from a function

```python
def countdown(n):
    while n > 0:
        yield n
        n -= 1

gen = countdown(3)      # nothing has run yet
print(next(gen))        # 3: runs until the first yield, then pauses
print(list(gen))        # [2, 1]: resumes and runs to the end
```

`yield` hands out a value and **suspends** the function. The next `next()` resumes right
after the `yield`, with `n` exactly as it was. When the function returns, the generator
raises `StopIteration` for you.

## Lazy versus eager

| Eager | Lazy |
|---|---|
| `[x * 2 for x in data]` | `(x * 2 for x in data)` |
| builds every item now | builds each item when asked |
| memory grows with the data | constant memory |
| reusable | single use |

Prefer lazy when the data is large, slow to produce or endless, and when you only need one
pass. Prefer a list when you need `len()`, indexing or several passes.
'''

