body = '''
## A queue does the locking

```python
import queue
import threading

q = queue.Queue()

def consumer():
    while (item := q.get()) is not None:   # None is the stop signal
        print("got", item)

t = threading.Thread(target=consumer)
t.start()
for x in (1, 2, 3):
    q.put(x)
q.put(None)
t.join()
```

`put` and `get` are thread-safe and block when they must, so the producer and the consumer
never share a variable. `Queue(maxsize=n)` makes producers wait whenever the queue is full.

## Futures

A **future** stands for a result that will exist later:

```python
from concurrent.futures import ThreadPoolExecutor

with ThreadPoolExecutor(max_workers=4) as pool:
    fut = pool.submit(pow, 2, 10)
    print(fut.result())        # 1024, waiting if needed
```

`result()` returns the value or re-raises the call's exception. `pool.map(fn, items)` gives
results in input order, while `as_completed(futures)` yields futures in the order they
finish.

## Shutting down

Leaving the `with` block waits for every submitted task. With a raw queue, either send one
sentinel per consumer or pair `task_done()` with `q.join()`.
'''

