'''
tests = '''
class TestSummarize(unittest.TestCase):
    def test_three_values(self):
        self.assertEqual(summarize(1, 2, 3), (3, 6, 2.0))

    def test_no_values(self):
        self.assertEqual(summarize(), (0, 0, 0.0))

    def test_default_rounds_to_two_digits(self):
        self.assertEqual(summarize(1, 1, 2), (3, 4, 1.33))
        self.assertEqual(summarize(2, 2, 1), (3, 5, 1.67))

    def test_digits_keyword(self):
        self.assertEqual(summarize(1, 1, 2, digits=1), (3, 4, 1.3))
        self.assertEqual(summarize(1, 1, 2, digits=0), (3, 4, 1.0))
        self.assertEqual(summarize(digits=3), (0, 0, 0.0))

    def test_single_value(self):
        self.assertEqual(summarize(7), (1, 7, 7.0))

    def test_negatives_and_floats(self):
        self.assertEqual(summarize(-2, 4.5, 0.5), (3, 3.0, 1.0))
        self.assertEqual(summarize(-1, -2), (2, -3, -1.5))

    def test_returns_a_tuple_of_three(self):
        result = summarize(4, 5)
        self.assertIsInstance(result, tuple)
        self.assertEqual(len(result), 3)

    def test_many_values(self):
        self.assertEqual(summarize(*range(1, 1001)), (1000, 500500, 500.5))

    def test_duplicates(self):
        self.assertEqual(summarize(5, 5, 5, 5), (4, 20, 5.0))
