# Unit 4 — if / elif / else, truthiness, match
# ---------------------------------------------------------------------------
[[unit]]
id = "py-u04-control-flow"
title = "Decisions: if, elif, else and match"
level = "basic"
difficulty = 4
intro = '''
So far every program ran each line exactly once. Real programs make decisions: they look
at data and choose what to do next. This unit covers comparisons and boolean logic, the
`if`/`elif`/`else` statement, Python's idea of truthiness, and the `match` statement. The
unit ends with a function that classifies triangles.
'''
concepts = '''
## The idea

A program becomes useful when it can react to its data: charge shipping only on small
orders, reject an invalid password, print a different grade for each score. This is called
**control flow**: the order in which statements run is no longer fixed, but depends on
**conditions**, expressions that are either true or false. Each condition is a question;
the answer picks a path through the code.

## How Python does it

Comparisons produce `bool` values: `==` (equal), `!=` (not equal), `<`, `<=`, `>`, `>=`.
You combine them with the words `and`, `or` and `not`. Python also lets you chain
comparisons the way mathematicians write them: `0 <= x < 10`.

The `if` statement runs a block only when its condition is true. `elif` ("else if") adds
more conditions, checked in order, and `else` catches everything that is left. Exactly one
branch runs, the first whose condition is true.

```python
temperature = 31
if temperature > 30:
    print("hot")
elif temperature > 15:
    print("mild")
else:
    print("cold")
```

The colon ends the condition and the **indented block** below it is the body. Python uses
indentation (four spaces by convention) instead of braces to mark where a block starts and
ends.

Any value can stand in for a condition. This is **truthiness**: `0`, `0.0`, `""`, `None`
and empty collections count as false; nearly everything else counts as true. So `if name:`
reads as "if a name was given".

For choosing among many fixed values, Python 3.10 added `match`. Each `case` is a
**pattern**; `|` means "or", and `_` matches anything.

```python
match day:
    case "sat" | "sun":
        kind = "weekend"
    case _:
        kind = "weekday"
```

## What is special or tricky

- **Order matters in an `elif` chain.** Python stops at the first true condition, so test
  the most specific case first. Checking `score >= 50` before `score >= 90` would label
  every top student as merely passing.
- **`=` is not `==`.** Writing `if x = 3:` is a `SyntaxError`, which at least fails loudly.
- **`and` and `or` short-circuit.** In `a and b`, `b` is never evaluated if `a` is false.
  They also return one of their operands, not necessarily `True` or `False`: `"" or "guest"`
  is `"guest"`, a handy way to supply defaults.
- **Test for `None` with `is`.** Write `if value is None:`, not `== None`.
- **Indentation must be consistent.** Mixing levels inside one block raises
  `IndentationError`.

## What you will practise

You will write a grading `elif` chain, explore truthiness and short-circuit defaults, and
map status codes to messages with `match`. The challenge asks you to classify three side
lengths, which forces you to think carefully about the order of your checks.
'''

[[unit.step]]
kind = "concept"
id = "py-u04-c1-conditions"
title = "Conditions choose the path"
points = 5
difficulty = 4
intro = '''
At the machine level, a decision is a **conditional jump**: the processor evaluates a test
and, depending on the result, continues at one place in the program or another. `if`,
`elif`, `else` and `match` are the readable form of those jumps, and indentation shows
which statements belong to each branch.
'''
body = '''
## Booleans and comparisons

A comparison asks a question and answers with `True` or `False`:

```python
age = 17
print(age >= 18)            # False
print(age != 0 and age < 120)   # True
print(13 <= age <= 19)      # True: a chained comparison
```

`and` is true only if both sides are true, `or` if at least one is, and `not` flips a
value.

## One branch runs

```python
if age >= 18:
    print("adult")
elif age >= 13:
    print("teenager")
else:
    print("child")
print("done")
```

Python checks the conditions from top to bottom and runs the block of the **first** one that
is true, then skips the rest of the chain and continues with `print("done")`. Both `elif`
and `else` are optional, and you may have as many `elif` lines as you need.

## Truthiness

An `if` does not need a real `bool`. Python asks the value whether it is "truthy". Zero,
empty strings, `None` and empty collections are falsy; other values are truthy:

```python
name = ""
if not name:
    print("please enter a name")
```

## Blocks are indented

Everything indented under the `if` line belongs to that branch. The first line that returns
to the outer indentation ends the block.
'''

