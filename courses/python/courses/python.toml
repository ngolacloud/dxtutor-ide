'''
tests = '''
import asyncio
import time


def make_fetch(delays, log=None):
    async def fetch(key):
        if log is not None:
            log.append(("start", key))
        await asyncio.sleep(delays[key])
        if log is not None:
            log.append(("end", key))
        return key.upper()
    return fetch


def run_fetch(delays, keys, timeout, log=None):
    return asyncio.run(fetch_all(make_fetch(delays, log), keys, timeout))


class TestFetchAllResults(unittest.TestCase):
    def test_all_calls_finish(self):
        got = run_fetch({"a": 0.01, "b": 0.02, "c": 0.0}, ["a", "b", "c"], 0.5)
        self.assertEqual(got, {"a": "A", "b": "B", "c": "C"})

    def test_keeps_key_order(self):
        keys = ["slow", "mid", "fast"]
        got = run_fetch({"slow": 0.03, "mid": 0.02, "fast": 0.01}, keys, 0.5)
        self.assertEqual(list(got), keys)
        self.assertEqual(got["fast"], "FAST")

    def test_empty_keys(self):
        self.assertEqual(run_fetch({}, [], 0.1), {})

    def test_timeout_maps_to_none(self):
        got = run_fetch({"fast": 0.01, "slow": 2.0}, ["fast", "slow"], 0.05)
        self.assertEqual(got, {"fast": "FAST", "slow": None})

    def test_other_exceptions_propagate(self):
        async def broken(key):
            await asyncio.sleep(0)
            raise KeyError(key)
        with self.assertRaises(KeyError):
            asyncio.run(fetch_all(broken, ["a", "b"], 0.5))


class TestFetchAllConcurrency(unittest.TestCase):
    def test_every_fetch_starts_before_any_finishes(self):
        log = []
        run_fetch({"a": 0.02, "b": 0.02, "c": 0.02}, ["a", "b", "c"], 0.5, log)
        self.assertEqual([kind for kind, _ in log[:3]], ["start", "start", "start"])

    def test_total_time_is_not_the_sum(self):
        delays = {f"k{i}": 0.05 for i in range(8)}
        start = time.perf_counter()
        got = run_fetch(delays, list(delays), 1.0)
        elapsed = time.perf_counter() - start
        self.assertEqual(got, {k: k.upper() for k in delays})
        self.assertLess(elapsed, 0.3)  # one after another would take 0.4 s

    def test_slow_calls_do_not_hold_up_the_answer(self):
        start = time.perf_counter()
        got = run_fetch({"x": 2.0, "y": 2.0, "z": 0.01}, ["x", "y", "z"], 0.05)
        elapsed = time.perf_counter() - start
        self.assertEqual(got, {"x": None, "y": None, "z": "Z"})
        self.assertLess(elapsed, 1.0)
'''

[unit.step.gabarito]
solution = '''
import asyncio
from collections.abc import Awaitable, Callable


async def fetch_all(
    fetch: Callable[[str], Awaitable[object]],
    keys: list[str],
    timeout: float,
) -> dict[str, object]:
    """Fetch every key concurrently; a call slower than `timeout` maps to None."""

    async def one(key: str) -> object:
        try:
            return await asyncio.wait_for(fetch(key), timeout)
        except TimeoutError:
            return None

    values = await asyncio.gather(*(one(key) for key in keys))
    return dict(zip(keys, values))
'''
time = "O(n)"
space = "O(n)"
justification = '''
For `n` keys the function creates `n` wrapper coroutines, `gather` turns them into `n` tasks, and
`zip` builds the result in one pass, so the CPU work and the memory are both **O(n)** (plus whatever
`fetch` itself costs). The point of asyncio is the **wall-clock** time: all calls wait at the same
moment, so the elapsed time is about `min(slowest call, timeout)` instead of the sum of the delays.
`wait_for` cancels each late call individually, which is why one hanging backend costs `timeout`
seconds and not forever. `gather` returns values in argument order, so zipping them with `keys`
keeps the order without any sorting.
'''

[[unit]]
id = "py-u22-parallelism"
title = "Parallelism: processes for CPU-bound work"
level = "advanced"
difficulty = 28
intro = '''
Threads in CPython take turns holding the GIL, so they speed up waiting but not computing. To keep
several CPU cores busy at once you run several *processes*, each with its own interpreter. You will
learn when that pays off, how `ProcessPoolExecutor` and `multiprocessing.Pool` hand work to other
processes, and the two rules that make it work: the `__main__` guard and picklable functions.
'''
concepts = '''
## The idea

Every program spends its time either **computing** or **waiting**. A task is **CPU-bound** when the
processor is the bottleneck: hashing, compressing, numeric loops, parsing data already in memory. It
is **I/O-bound** when it mostly waits for disks, networks or other programs. The difference decides
the tool:

- I/O-bound: overlap the waiting with threads (unit 25) or asyncio (unit 27). One core is enough.
- CPU-bound: you need several cores doing arithmetic at the same instant. That is **parallelism**,
  a stronger property than concurrency.

In CPython the **GIL** (Global Interpreter Lock) lets only one thread execute Python bytecode at a
time, so threads cannot speed up pure-Python computation. The standard way around it is to start
several **processes**. Each has its own interpreter, its own memory and its own GIL, and the
operating system can schedule them on different cores.

## How Python does it

`concurrent.futures.ProcessPoolExecutor` keeps a pool of worker processes behind the same interface
as the thread pool from unit 26: `submit` returns a `Future`, and `map` yields results in input
order.

```python
from concurrent.futures import ProcessPoolExecutor

def cube(n):
    return n ** 3

if __name__ == "__main__":
    with ProcessPoolExecutor(max_workers=2) as pool:
        print(list(pool.map(cube, [1, 2, 3])))   # [1, 8, 27]
```

The older `multiprocessing.Pool` offers `map`, `starmap` (for functions with several arguments) and
`imap`. Both send each argument to a worker, and each result back, by **pickling**: serialising
objects to bytes, because processes do not share memory.

## What is special or tricky

- **The `__main__` guard is mandatory.** On macOS and Windows (and on Linux by default from Python
  3.14) a worker starts by importing your script again. Pool-creating code at module level would run
  in every child, so it either spawns processes endlessly or fails with a `RuntimeError`. Keep it
  under `if __name__ == "__main__":`.
- **Workers must be picklable.** Functions are pickled *by name*, so they must be defined at the top
  level of a module. Lambdas and nested functions fail with errors such as
  `Can't pickle local object`.
- **Processes are expensive.** Starting one takes milliseconds, and every argument and result is
  copied. For tiny tasks the overhead beats the gain; give each worker a decent chunk of work (see
  the `chunksize` argument of `map`).
- **No shared globals.** A worker that changes a global changes its own copy; the parent never sees
  it. Return results instead.
- **Exceptions travel back.** An exception in a worker is pickled and raised again when you call
  `future.result()` or iterate over `map`.
- **More workers than cores do not help** CPU-bound work; `os.cpu_count()` is the natural ceiling.

## What you will practise

You will map a function over a process pool, use `starmap` for multi-argument work, and collect
futures as they complete. The challenge asks you to split a CPU-bound count across worker
processes and put the pieces back together in order.
'''

[[unit.step]]
kind = "concept"
id = "py-u22-c1-cpu-vs-io"
title = "Cores, the GIL and processes"
points = 5
difficulty = 28
run_command = ""
intro = '''
Parallelism means several computations happening at the same instant on different cores;
concurrency is the broader idea of structuring a program as tasks that make progress independently.
CPython's GIL gives threads concurrency but not parallel bytecode execution, which is why CPU-bound
Python code reaches for processes.
'''
body = '''
## Two kinds of slow

Ask what your program is waiting for. If one core sits at 100%, the work is **CPU-bound** and more
cores could help. If the CPU is mostly idle while you wait for the network or the disk, it is
**I/O-bound**: overlapping the waits helps, extra cores do not.

## Why threads are not enough

CPython's **Global Interpreter Lock** lets one thread run Python bytecode at a time. Threads still
help with I/O, because a thread releases the GIL while it waits, but four threads summing numbers
take about as long as one.

## Processes

A process has its own interpreter and its own GIL, so four processes can really compute at once on
four cores. The price:

- starting a process costs time and memory;
- arguments and results are **pickled** and copied between processes;
- nothing is shared by default.

```python
from concurrent.futures import ProcessPoolExecutor

def work(n):                     # top level, so it can be pickled by name
    return sum(range(n))

if __name__ == "__main__":
    with ProcessPoolExecutor(max_workers=2) as pool:
        print(list(pool.map(work, [10, 100])))   # [45, 4950]
```

**Rule of thumb:** use processes for heavy, independent chunks of computation, and threads or
asyncio for waiting. The speed-up is limited by the part of the program that stays serial
(Amdahl's law), so measure before and after.
'''

