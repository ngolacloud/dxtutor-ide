sorted by number, followed by the number that needs the most steps.

**Why:** `as_completed` lets you react to each result as soon as it exists. Because the finishing
order varies between runs, you must map results back to their inputs yourself.
'''
target = '''
from concurrent.futures import ProcessPoolExecutor, as_completed


def collatz_steps(n: int) -> int:
    steps = 0
    while n != 1:
        n = n // 2 if n % 2 == 0 else 3 * n + 1
        steps += 1
    return steps


def main() -> None:
    numbers = [27, 97, 871, 6171]
    with ProcessPoolExecutor(max_workers=2) as pool:
        futures = {pool.submit(collatz_steps, n): n for n in numbers}
        steps = {}
        for future in as_completed(futures):
            steps[futures[future]] = future.result()
    for n in sorted(steps):
        print(f"{n} needs {steps[n]} steps")
    print("longest:", max(steps, key=steps.get))


if __name__ == "__main__":
    main()
'''
