instructions = '''
## Your turn

Implement the function `group_anagrams`:

```python
def group_anagrams(words: list[str]) -> list[list[str]]: ...
```

Two words are **anagrams** when one is a rearrangement of the other's letters, using every
letter the same number of times (`"listen"` and `"silent"`, but not `"ab"` and `"aab"`).
Return a list of groups:

- each group is a list of words that are anagrams of each other;
