id = "python-basics"
language = "python"
title = "Python: From Zero to Confident"
level = "beginner"
summary = "A serious, guided course in Python that takes you from your very first line of code to the ideas professionals use every day. You read a short concept, build muscle memory by typing small, complete programs, then prove what you learned by writing real functions that hidden tests check."
overview = '''
## What Python is

Python is a general-purpose programming language created by Guido van Rossum and first
released in 1991. It is **interpreted** and **dynamically typed**: you write a plain text
file, and the `python3` interpreter runs it statement by statement, with no separate
compile step and no type declarations. Its syntax uses indentation instead of braces, which
keeps code short and readable, and it ships with a large standard library.

## Where it is used

Python is one of the most popular languages in the world. It is the leading language
for data science, machine learning and AI research, through libraries such as NumPy,
pandas, PyTorch and TensorFlow. It powers web back ends with frameworks such as Django and
Flask, automates system administration and DevOps work, drives scientific computing, and is
widely taught as a first language.

## The mental model

Everything in Python is an **object**, and every variable is a **name** bound to an object.
Values carry their types; names do not. Code runs from top to bottom, functions are values
you can pass around, and most work is done by combining small, well-named functions over
built-in data structures. By the end you will also know what happens underneath: what an
operation costs, how objects are shared, and when code can truly run in parallel.

## How the course is organised

- **Basic:** printing, variables and types, strings, decisions, loops and functions.
- **Intermediate:** lists, tuples, dictionaries and sets, comprehensions, exceptions, files,
  classes and dataclasses, generators, modules and testing, then a run of units on
  databases with `sqlite3`: parameterised queries, transactions, WAL mode, the N+1 problem,
  pagination and indexes.
- **Advanced:** decorators, closures and `functools`, dunder methods and protocols,
  threads, queues and pools, `asyncio`, multiprocessing, and classic data structures and
  algorithms: stacks and queues, linked lists, hash tables, binary search trees, sorting
  and searching, recursion and dynamic programming.

## How the steps work

Each unit opens with a short reading text. A **concept** step explains one idea in focus.
In a **drill** you type a small, complete program line by line, with a comment for every
line; when it matches, the tutor runs it and explains the output. In a **challenge** you
write a real function from a signature and examples, and hidden tests decide whether it is
correct. After you pass, you see a reference solution with its time and space complexity.
'''

# ── g1-basic ────────────────────────────────────────────────────────────

[[unit]]
id = "py-u01-hello"
title = "Hello & print"
level = "basic"
difficulty = 1
intro = '''
Your very first steps in Python: what a program is, how the Python interpreter runs a
script from top to bottom, and how `print` shows text on the screen. By the end you will
write a tiny greeting function and let the hidden tests check it.
'''
concepts = '''
## The idea

A computer does not understand English; it follows instructions, one after another. A
**programming language** is a precise notation that people can read and that a tool can
turn into actions the machine carries out. Python is an **interpreted** language: a
program called the **Python interpreter** (`python3`) reads your source file and executes
it statement by statement, from the first line to the last. There is no separate compile
step that you have to run yourself.

A Python program is a plain text file whose name ends in `.py`, often called a
**script**. You run it from a terminal with `python3 main.py`. Every program also needs a
way to talk to the outside world, and the simplest channel is **standard output**
(stdout): a stream of text that the terminal displays.

## How Python does it

The built-in function `print` writes its arguments to standard output and then ends the
line. You call a function by writing its name followed by parentheses that hold the
**arguments**.

```python
print("first line")
print("the answer is", 42)
print()
```

Text in quotes is a **string**; single and double quotes mean the same thing. When you
give `print` several arguments, it puts a space between them. A `print()` with no
arguments prints an empty line.

Two optional **keyword arguments** change that behaviour. `sep` is what goes *between*
the arguments (a space by default) and `end` is what goes *after* the last one (a
newline, written `"\n"`, by default).

```python
print("a", "b", "c", sep="-")   # a-b-c
print("no newline", end="")
print(" ...continued")
```

Anything after a `#` on a line is a **comment**. Python ignores it; it is a note for the
humans who read your code.

## What is special or tricky

- **Indentation is syntax.** Top-level statements must start at the left margin. A stray
  space at the start of a line causes `IndentationError: unexpected indent`.
- **Case matters.** It is `print`, never `Print`; the second spelling raises
  `NameError: name 'Print' is not defined`.
- **Quotes must match.** `"hello'` is a `SyntaxError`, because the string never closes.
- **`print` shows a value; it does not hand one back.** A function that should *produce*
  a result for other code uses `return`, which you will meet in the challenge and study
  properly in unit 6.
- **Strings join with `+`, but only with other strings.** `"Good " + "morning"` gives
  `"Good morning"`, while `"age " + 42` raises a `TypeError`. Unit 2 shows how to convert
  between types.
- **An error stops the script.** Python runs lines until one fails, prints a
  **traceback** naming the file and the line, and stops there. Read a traceback from the
  bottom up: the last line says what went wrong.

## What you will practise

You will type a first script with comments, shape output with `sep` and `end`, and print
the results of small calculations. Then you will write your first function, one that
builds a greeting string from a name it receives.
'''

[[unit.step]]
kind = "concept"
id = "py-u01-c1-programs"
title = "What a Python program is"
points = 5
difficulty = 1
intro = '''
Before you write anything, picture what happens when you run a script. The Python
interpreter loads your `.py` file, executes its statements one after another from the top,
and stops when it runs out of lines. Anything you `print` travels to **standard output**,
which the terminal shows on screen.
'''
body = '''
## A script runs from top to bottom

A Python program is a plain text file, usually named something like `main.py`. When you
type `python3 main.py` in a terminal, the **interpreter** opens the file and executes each
statement in order, starting at the first line. When it runs out of lines, the program
ends. You are not forced to write a special `main` function: the file itself is the
program.

```python
# This line is a comment: Python skips it.
print("Hello, Python!")
print("Python can count:", 2 + 3)
```

Things to notice:

- **`print(...)`** is a built-in function. It writes its arguments to standard output and
  finishes the line.
- **`"Hello, Python!"`** is a **string**, a piece of text between quotes.
- **`2 + 3`** is an **expression**. Python works out its value, `5`, before `print`
  receives it, so the second line shows `Python can count: 5`.
- **`# ...`** starts a comment, a note for the people reading your code.

## What the tutor does

In each drill you type a small, complete program. When your code matches the target, the
tutor saves it as `main.py` and runs `python3 main.py`, so you see exactly what the
program prints. In each challenge you write a function instead, and hidden tests call it
with many different inputs to check that it returns the right values.
'''

