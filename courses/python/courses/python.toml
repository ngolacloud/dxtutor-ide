entry = "greet"
run_command = "python3 -m unittest"
intro = '''
Now you apply what you learned, with one new idea: a **function** that hands a value back
with `return` instead of printing it. A function that returns can be reused anywhere, and
that is exactly how the hidden tests check it: they call it and compare the result.
'''
instructions = '''
## Your turn

Implement the function `greet`:

```python
def greet(name: str) -> str: ...
```

It takes a name and **returns** (does not print) a string that reads `Hello, {name}!`.

Examples:

- `greet("World")` → `"Hello, World!"`
- `greet("Ada Lovelace")` → `"Hello, Ada Lovelace!"`
- `greet("")` → `"Hello, !"`

**Hint:** build the result by joining strings with `+`, and hand it back with `return`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
def greet(name: str) -> str:
    """Return a greeting of the form "Hello, {name}!"."""
    raise NotImplementedError
'''
tests = '''
import io
import contextlib


class TestGreet(unittest.TestCase):
    def test_world(self):
        self.assertEqual(greet("World"), "Hello, World!")

    def test_python(self):
        self.assertEqual(greet("Python"), "Hello, Python!")

    def test_returns_a_string(self):
        self.assertIsInstance(greet("Ada"), str)

    def test_empty_name(self):
        self.assertEqual(greet(""), "Hello, !")

    def test_name_with_spaces(self):
        self.assertEqual(greet("Ada Lovelace"), "Hello, Ada Lovelace!")

    def test_accented_name(self):
        self.assertEqual(greet("João"), "Hello, João!")

    def test_returns_instead_of_printing(self):
        buffer = io.StringIO()
        with contextlib.redirect_stdout(buffer):
            result = greet("Grace")
        self.assertEqual(result, "Hello, Grace!")
        self.assertEqual(buffer.getvalue(), "")
'''

[unit.step.gabarito]
solution = '''
def greet(name: str) -> str:
    """Return a greeting of the form "Hello, {name}!"."""
    return "Hello, " + name + "!"
'''
time = "O(n)"
space = "O(n)"
justification = '''
Python strings are immutable, so joining them builds a brand-new string: the fixed text
`Hello, ` and `!` plus the `n` characters of `name` are copied into it. Both the work and
the memory grow in direct proportion to the length of `name`, so the time is **O(n)** and
the space is **O(n)**, where `n` is the length of the name. There is no loop in your code;
the copying happens once, inside the `+` operations.
'''

