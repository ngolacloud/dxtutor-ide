# Unit 24: dunder methods and protocols
# ───────────────────────────────────────────────────────────────────────────
[[unit]]
id = "py-u18-dunder-protocols"
title = "Dunder methods and protocols"
level = "advanced"
difficulty = 24
intro = '''
Why does `len()` work on lists, strings and dicts, and why can `+` add numbers and join
lists? Python's **data model** maps every operator and built-in to a specially named
"dunder" method, so your own classes can take part. You will give a class a readable
`repr`, arithmetic operators and the container protocol, and compare two ways to describe
an interface: abstract base classes and `typing.Protocol`. The unit ends with a `Money`
value type that behaves like a built-in.
'''
concepts = '''
## The idea

Many languages reserve operators for built-in types. Python takes the opposite view: syntax
is a thin layer over method calls. `a + b` asks `a` for its `__add__`, `len(x)` calls
`x.__len__()`, and `for item in x` calls `x.__iter__()`. These **dunder** (double underscore)
methods make up the *data model*, a set of protocols any class can implement. A class that
supports the right ones works with operators, built-ins and the standard library as if it
were native. This is **duck typing**: what matters is what an object can do, not what it is.

## How Python does it

**Representation.** `__repr__` returns an unambiguous, developer-facing string, ideally one
that would rebuild the object. `__str__` is the friendly form that `print` uses; without it,
Python falls back to `__repr__`.

**Operators.** `__add__`, `__sub__`, `__mul__` and friends. When the left operand can't
handle the right one, its method should **return `NotImplemented`**, a special constant, not
an exception. Python then tries the right operand's *reflected* method, such as `__radd__`,
and raises `TypeError` only if both decline.

```python
class Meters:
    def __init__(self, n):
        self.n = n
    def __add__(self, other):
        if not isinstance(other, Meters):
            return NotImplemented
        return Meters(self.n + other.n)
    def __repr__(self):
        return f"Meters({self.n})"
```

**Comparison and hashing.** `__eq__` defines `==`; `__lt__`, `__le__` and the rest define
ordering, and `functools.total_ordering` derives the missing ones from `__eq__` plus one of
them. Equal objects **must** have equal hashes, so a class that defines `__eq__` gets
`__hash__ = None` (unhashable) unless it defines `__hash__` too.

**Containers.** `__len__`, `__getitem__`, `__contains__` and `__iter__`. With `__getitem__`
alone a class already supports indexing, `for` loops and `in`. `__bool__`, or failing that
`__len__`, decides truthiness.

**Interfaces.** An **abstract base class** (`abc.ABC` with `@abstractmethod`) is *nominal*:
subclasses must inherit from it, and Python refuses to instantiate one that leaves an
abstract method unimplemented. A **`typing.Protocol`** is *structural*: any class with the
matching methods satisfies it, no inheritance needed. Type checkers verify it statically,
and `@runtime_checkable` enables `isinstance` checks.

## Pitfalls

- Raising `TypeError` inside an operator method, instead of returning `NotImplemented`,
  blocks the other operand's reflected method.
- Defining `__eq__` without `__hash__` makes instances unusable as dict keys or set members.
- Hashing on fields that change later breaks dicts and sets: the object is filed under its
  old hash and can't be found. Hash only values that never change.
- `__repr__` must return a `str` and `__len__` a non-negative `int`, or the built-ins raise.
- `isinstance` with a runtime-checkable Protocol only checks that the methods exist, not
  their signatures.

## What you will practise

You will overload arithmetic on a vector, make a class indexable and iterable through
`__getitem__`, and contrast an ABC with a Protocol. The challenge asks you to build a
currency-safe `Money` type.
'''

[[unit.step]]
kind = "concept"
id = "py-u18-c1-data-model"
title = "The data model"
points = 5
difficulty = 24
intro = '''
Every operator and many built-ins are dispatched to dunder methods on the operands. A class
opts into a behaviour by defining the matching method. Returning `NotImplemented` lets
Python try the other operand before giving up.
'''
body = '''
## Syntax is method calls

| You write | Python calls |
|---|---|
| `repr(x)`, `str(x)` | `x.__repr__()`, `x.__str__()` |
| `a + b` | `a.__add__(b)`, then `b.__radd__(a)` |
| `a == b`, `a < b` | `a.__eq__(b)`, `a.__lt__(b)` |
| `len(x)`, `x[i]` | `x.__len__()`, `x.__getitem__(i)` |
| `v in x` | `x.__contains__(v)` |
| `bool(x)` | `x.__bool__()`, else `x.__len__()` |
| `hash(x)` | `x.__hash__()` |

## Declining politely

An operator method that doesn't understand its argument returns `NotImplemented`. Python
then asks the other operand, and raises `TypeError` only when both decline:

```python
def __mul__(self, k):
    if not isinstance(k, int):
        return NotImplemented
    return Vec(self.x * k, self.y * k)

__rmul__ = __mul__     # 3 * v works as well as v * 3
```

## Equality and hashing

If `a == b`, then `hash(a) == hash(b)` must hold. Defining `__eq__` alone makes the class
unhashable; add a `__hash__` built from the same fields, for example
`hash((self.x, self.y))`.

## Interfaces

`abc.ABC` with `@abstractmethod` forces subclasses to implement methods before they can be
instantiated. `typing.Protocol` describes the methods an object needs, and any class that
has them fits, without inheriting from anything.
'''

