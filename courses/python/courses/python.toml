title = "Captured variables"
points = 5
difficulty = 23
intro = '''
When an inner function uses a variable of its enclosing function, Python keeps that variable
alive in a cell for as long as the inner function exists. Reading it is automatic; rebinding
it needs `nonlocal`. The `functools` helpers package common closure patterns.
'''
body = '''
## A function that remembers

```python
def make_adder(n):
    def add(x):
        return x + n      # n comes from the enclosing call
    return add

add5 = make_adder(5)
print(add5(10))                           # 15
print(add5.__closure__[0].cell_contents)  # 5
```

`make_adder` has already returned, yet `add5` still knows `n`. The inner function captured it
in a **cell**, which lives as long as `add5` does.

## Rebinding needs nonlocal

Inside a function, assigning to a name makes it local. To change a captured variable,
declare it:

```python
def make_total():
    total = 0
    def add(x):
        nonlocal total
        total += x
        return total
    return add
```

Without `nonlocal`, `total += x` raises `UnboundLocalError`.

## Late binding

Closures capture variables, not values. All the lambdas in `[lambda: i for i in range(3)]`
return `2`, the value `i` has when they are finally called. Freeze the value with a default
argument: `lambda i=i: i`.

## functools helpers

`@lru_cache` remembers results keyed by the arguments, turning repeated work into dictionary
lookups. `partial(f, x)` returns a callable with `x` already filled in.
'''

