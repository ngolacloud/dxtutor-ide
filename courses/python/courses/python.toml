- The set-based version sends **one**. The f-string only inserts the right number of
  `?` marks; the ids themselves are still bound as parameters, never pasted into the SQL.
- When the data you need is in a related table, a **`JOIN`** brings it back in the same
  statement instead of one lookup per row.

## Measure, don't guess

```python
statements = []
conn.set_trace_callback(statements.append)
...                                   # the code you want to inspect
conn.set_trace_callback(None)
print(len(statements))
```

The trace callback receives every statement the connection executes. Counting them is
the simplest way to catch an N+1 loop hidden inside a helper function, and a test can
assert on that count.
'''

