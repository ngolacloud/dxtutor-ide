[[unit]]
id = "py-u20-queues-pools"
title = "Queues and thread pools"
level = "advanced"
difficulty = 26
intro = '''
Locks around shared variables quickly become hard to reason about. A safer design lets
threads hand work to each other through a **thread-safe queue**, and lets a **pool** manage
the threads for you. You will connect producers to consumers with `queue.Queue`, shut workers
down cleanly, and use `concurrent.futures.ThreadPoolExecutor` to submit jobs and collect
their results. The unit ends with a concurrent fetcher that skips duplicate work and keeps
going when some jobs fail.
'''
concepts = '''
## The idea

The **producer/consumer** pattern separates the code that creates work from the code that
does it. Producers put items into a shared buffer and consumers take them out. Because the
buffer does all the synchronisation, neither side touches shared variables or locks
directly. A **bounded** buffer adds **back-pressure**: when consumers fall behind, the buffer
fills up and producers block until there is room, so memory can't grow without limit.

Starting a thread per task is wasteful and unbounded. A **thread pool** keeps a fixed set of
worker threads alive and feeds them tasks from an internal queue. Submitting a task gives
back a **future** (a *promise* in other languages): a placeholder for a result that doesn't
exist yet.

## How Python does it

`queue.Queue` is a FIFO with the locking built in. `put(item)` adds and `get()` removes; both
block when the queue is full or empty, and both accept a `timeout`. `Queue(maxsize=n)` makes
it bounded. `queue.LifoQueue` and `queue.PriorityQueue` share the same interface.

```python
import queue

q = queue.Queue(maxsize=2)
q.put("a")
q.put("b")
print(q.full(), q.get(), q.qsize())   # True a 1
```

There are two common ways to stop consumers:

- **A sentinel**, or poison pill: the producer puts a special value such as `None`, one per
  consumer, and each consumer exits when it receives one.
- **`task_done()` and `join()`**: a consumer calls `q.task_done()` after finishing each item,
  and `q.join()` blocks until every item that was put has been marked done. The consumers are
  then usually daemon threads.

`concurrent.futures.ThreadPoolExecutor(max_workers=n)` is the high-level pool. Use it in a
`with` block, which waits for all tasks and shuts the pool down at the end:

- `pool.submit(fn, *args)` schedules one call and returns a `Future`. `future.result()` waits
  for it, then returns the value or **re-raises** the exception the call raised.
- `pool.map(fn, iterable)` returns results **in input order**, and raises the first error
  when you reach that result.
- `concurrent.futures.as_completed(futures)` yields futures **as they finish**, so the
  fastest results are handled first. Keep a dict from each future to its input to know which
  is which.

## Pitfalls

- **Forgetting `task_done()`** makes `q.join()` wait forever; calling it more times than
  items were put raises `ValueError`.
- **One sentinel for several consumers.** Only one consumer stops; the rest block in `get()`
  forever. Send one per consumer.
- **Swallowed exceptions.** An exception inside a submitted task is stored in its future. If
  nobody calls `result()`, it disappears silently.
- `qsize()` and `empty()` are snapshots: another thread may change the queue right after.
  Don't use them to decide whether a `get()` will succeed.
- More threads don't help CPU-bound work, because of the GIL.

## What you will practise

You will connect a producer and a consumer with a sentinel, run a pool of workers with
`task_done`/`join`, and compare `map` with `submit` plus `as_completed`. The challenge asks
you to build a fetcher on top of a thread pool.
'''

