def add_order_index(conn: sqlite3.Connection) -> None:
    """Create the index that serves the two hot `orders` queries.

    Both queries must SEARCH, and the customer + status query must be answered
    from a covering index. Safe to call more than once.
    """
    raise NotImplementedError
'''
tests = '''
import sqlite3

Q_BOTH = "SELECT total FROM orders WHERE customer_id = ? AND status = ?"
Q_CUSTOMER = "SELECT total FROM orders WHERE customer_id = ?"
SCHEMA = "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, status TEXT, total INTEGER)"


def plan(conn, sql, params):
    return " | ".join(row[3] for row in conn.execute("EXPLAIN QUERY PLAN " + sql, params))


class AddOrderIndexTest(unittest.TestCase):
    def setUp(self):
        self.conn = sqlite3.connect(":memory:")
        self.conn.execute(SCHEMA)
        statuses = ["paid", "open", "void"]
        self.conn.executemany(
            "INSERT INTO orders (customer_id, status, total) VALUES (?, ?, ?)",
            [(i % 50, statuses[i % 3], i * 7 % 1000) for i in range(2000)],
        )
        self.conn.commit()

    def tearDown(self):
        self.conn.close()

    def results(self):
        return (
            sorted(r[0] for r in self.conn.execute(Q_BOTH, (7, "paid"))),
            sorted(r[0] for r in self.conn.execute(Q_CUSTOMER, (7,))),
        )

    def test_two_column_query_uses_covering_index(self):
        add_order_index(self.conn)
        detail = plan(self.conn, Q_BOTH, (7, "paid"))
        self.assertIn("SEARCH", detail)
        self.assertIn("USING COVERING INDEX", detail)

    def test_customer_only_query_searches(self):
        add_order_index(self.conn)
        detail = plan(self.conn, Q_CUSTOMER, (7,))
        self.assertTrue(detail.startswith("SEARCH"), detail)
        self.assertIn("INDEX", detail)

    def test_calling_twice_is_safe(self):
        add_order_index(self.conn)
        add_order_index(self.conn)
        self.assertIn("USING COVERING INDEX", plan(self.conn, Q_BOTH, (1, "open")))

    def test_results_are_unchanged(self):
        before = self.results()
        add_order_index(self.conn)
        self.assertEqual(self.results(), before)
        (count,) = self.conn.execute("SELECT COUNT(*) FROM orders").fetchone()
        self.assertEqual(count, 2000)

    def test_index_is_committed(self):
        add_order_index(self.conn)
        self.assertFalse(self.conn.in_transaction)
        names = self.conn.execute(
            "SELECT name FROM sqlite_master WHERE type = 'index' AND tbl_name = 'orders'"
        ).fetchall()
        self.assertGreaterEqual(len(names), 1)

    def test_empty_table(self):
        conn = sqlite3.connect(":memory:")
        conn.execute(SCHEMA)
        add_order_index(conn)
        self.assertIn("USING COVERING INDEX", plan(conn, Q_BOTH, (1, "paid")))
        self.assertTrue(plan(conn, Q_CUSTOMER, (1,)).startswith("SEARCH"))
        conn.close()
'''

