[[unit]]
id = "py-u12-classes"
title = "Classes & objects"
level = "intermediate"
difficulty = 12
intro = '''
So far your data and the functions that work on it have lived apart. A **class** bundles
them: it describes a kind of object, its state (attributes) and its behaviour (methods).
You will write `__init__`, use `self`, tell class attributes from instance attributes, and
reuse code through inheritance and `super()`. The unit ends with a small bank account that
protects its own balance.
'''
concepts = '''
## The idea

Real programs model things: accounts, players, invoices, sensors. Each thing has **state**
(a balance, a score) and **behaviour** (deposit, move, pay). Keeping the two together is the
core of **object-oriented programming**. A **class** is the blueprint; an **object** (an
**instance**) is one concrete thing built from it. Ten `Player` objects share one class but
each has its own score.

Bundling state with behaviour gives you **encapsulation**: the object is responsible for
keeping its own data valid, so the rest of the program goes through its methods instead of
poking at raw values. **Inheritance** lets a new class start from an existing one and change
or extend only what differs.

## How Python does it

You define a class with `class`, and its methods with `def` inside it. The special method
`__init__` runs right after a new object is created; its job is to set the starting
attributes.

```python
class Thermostat:
    unit = "C"                      # class attribute: shared by every instance

    def __init__(self, target):
        self.target = target        # instance attribute: one per object

    def warmer(self, degrees=1):
        self.target += degrees
        return self.target

home = Thermostat(20)
home.warmer(2)                      # same as Thermostat.warmer(home, 2)
print(home.target, home.unit)       # 22 C
```

`self` is simply the object the method was called on. Python passes it automatically:
`home.warmer(2)` becomes `Thermostat.warmer(home, 2)`. Attributes are created by assigning
to `self.name`, normally inside `__init__`.

A subclass names its parent in parentheses. It inherits every method, can **override** some,
and calls the parent's version with `super()`:

```python
class Animal:
    def __init__(self, name):
        self.name = name

    def speak(self):
        return f"{self.name} makes a sound"

class Cat(Animal):
    def speak(self):
        return super().speak() + ": meow"

print(Cat("Tom").speak())           # Tom makes a sound: meow
```

`isinstance(obj, Animal)` is true for a `Cat`, and `issubclass(Cat, Animal)` is true too.

## What is special or tricky

- **Forgetting `self`.** Every method needs `self` as its first parameter, and attributes are
  always reached through it. Writing `target += 1` instead of `self.target += 1` creates or
  touches a local variable, not the object.
- **Mutable class attributes are shared.** A list written at class level (`items = []`) is
  one list for all instances. Create per-object containers in `__init__`.
- **Nothing is truly private.** A leading underscore (`self._cache`) is a convention that says
  "internal, don't touch". Python trusts you rather than enforcing it.
- **Call `super().__init__(...)`** when a subclass defines its own `__init__`, or the
  parent's attributes are never set.
- **Methods can raise.** Rejecting bad input with `ValueError` inside a method keeps an
  object from ever entering an invalid state.

## What you will practise

You will write a first class with `__init__` and a method, watch class and instance
attributes behave differently, and build a small inheritance chain with `super()`. The
challenge asks you to design a class that guards its own state and a subclass that extends
it.
'''

[[unit.step]]
kind = "concept"
id = "py-u12-c1-classes"
title = "Classes, instances and self"
points = 5
difficulty = 12
intro = '''
A class is a user-defined type. Calling it like a function allocates a new object in memory
and runs `__init__` on it, so every instance starts life in a known state. Methods are plain
functions stored on the class; Python binds them to the instance, which is why `self`
appears as their first parameter.
'''
body = '''
## Defining and using a class

```python
class Lamp:
    def __init__(self, room):
        self.room = room
        self.on = False

    def toggle(self):
        self.on = not self.on
        return self.on

kitchen = Lamp("kitchen")
kitchen.toggle()
print(kitchen.room, kitchen.on)    # kitchen True
```

- **`class Lamp:`** creates a new type. By convention class names use `CapWords`.
- **`Lamp("kitchen")`** builds a fresh object and calls `__init__(new_object, "kitchen")`.
- **`self.room = room`** stores an **instance attribute** on that object.
- **`kitchen.toggle()`** is shorthand for `Lamp.toggle(kitchen)`: the object becomes `self`.

## Class attributes vs instance attributes

A name assigned directly in the class body is a **class attribute**, stored once on the class
and visible from every instance. A name assigned through `self` belongs to one object.
Attribute lookup checks the instance first, then the class, then its parents.

## Inheritance

```python
class SmartLamp(Lamp):
    def toggle(self):
        state = super().toggle()
        print("logged:", state)
        return state
```

`SmartLamp` inherits `__init__` from `Lamp` and **overrides** `toggle`, reusing the parent's
logic through `super()`. Python searches for a method along the **method resolution order**
(`SmartLamp.__mro__`): the class itself, then its parents, ending at `object`.
'''

