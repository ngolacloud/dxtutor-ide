        self.assertEqual(group_anagrams(["abb", "aab"]), [["abb"], ["aab"]])

    def test_empty_input(self):
        self.assertEqual(group_anagrams([]), [])

    def test_duplicates_are_kept(self):
        self.assertEqual(
