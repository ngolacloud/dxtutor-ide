'''

[unit.step.gabarito]
solution = '''
class BankAccount:
    """An account whose balance can never go negative."""

    def __init__(self, owner: str, balance: int = 0) -> None:
        if balance < 0:
            raise ValueError("starting balance cannot be negative")
        self.owner = owner
        self.balance = balance
        self._history: list[tuple[str, int]] = []

    def deposit(self, amount: int) -> int:
        """Add a positive amount and return the new balance."""
        if amount <= 0:
            raise ValueError("deposit must be positive")
        self.balance += amount
        self._history.append(("deposit", amount))
        return self.balance

    def withdraw(self, amount: int) -> int:
        """Remove a positive amount no larger than the balance; return the new balance."""
        if amount <= 0:
            raise ValueError("withdrawal must be positive")
        if amount > self.balance:
            raise ValueError("insufficient funds")
        self.balance -= amount
        self._history.append(("withdraw", amount))
        return self.balance

    def history(self) -> list[tuple[str, int]]:
        """Return a copy of the (kind, amount) operations, oldest first."""
        return list(self._history)


class SavingsAccount(BankAccount):
    """A BankAccount that can earn interest."""

    def __init__(self, owner: str, balance: int = 0, rate_percent: int = 0) -> None:
        super().__init__(owner, balance)
        self.rate_percent = rate_percent

    def add_interest(self) -> int:
        """Deposit balance * rate_percent // 100 and return the new balance."""
        interest = self.balance * self.rate_percent // 100
        if interest <= 0:
            return self.balance
        return self.deposit(interest)
'''
time = "O(1) per operation; O(h) for history()"
space = "O(h)"
justification = '''
`deposit`, `withdraw` and `add_interest` each do a constant number of comparisons, one
addition or subtraction and one `list.append`, which is amortised **O(1)**. `history()`
copies the list, so it costs **O(h)**, where `h` is the number of recorded operations.

The object keeps one tuple per successful operation, so its memory is **O(h)**. Returning a
copy instead of the internal list is a deliberate trade: it spends `O(h)` time and memory
per call to keep callers from editing the record behind the account's back. Validating
**before** mutating is what makes every rejected operation leave the state untouched.
'''

[[unit]]
id = "py-u13-dataclasses"
title = "Dataclasses & type hints"
level = "intermediate"
difficulty = 13
intro = '''
Many classes exist only to hold a few named fields, and writing their `__init__`,
`__repr__` and `__eq__` by hand is tedious and error-prone. The `@dataclass` decorator
generates them from **type hints**. You will annotate code with `typing` and `Optional`,
make dataclasses comparable, sortable and immutable, and finish with a semantic version type.
'''
concepts = '''
## The idea

A lot of data in a program is a **record**: a fixed set of named fields, such as a point
`(x, y)`, a user `(id, name, email)` or a card `(rank, suit)`. Records should be easy to
create, print, compare and sort. Writing that machinery by hand for every record repeats the
same code and invites bugs, for example adding a field and forgetting to compare it.

**Type hints** are the other half of the story. They state what kind of value a variable,
parameter or field is meant to hold. They document intent, power editor completion and let a
**static type checker** such as `mypy` find mistakes before you run anything.

## How Python does it

Annotations use a colon for variables and parameters and an arrow for return values.
Built-in collections take their element type in square brackets.

```python
def average(scores: list[float]) -> float:
    return sum(scores) / len(scores)

nickname: str | None = None        # same as Optional[str]
```

`Optional[X]` from `typing` (or `X | None`, Python 3.10+) means "an `X`, or `None`". It is
the honest signature for a lookup that may find nothing.

The `@dataclass` decorator reads the annotated class attributes and writes `__init__`,
`__repr__` and `__eq__` for you:

```python
from dataclasses import dataclass, field

@dataclass
class Point:
    x: float
    y: float = 0.0
    labels: list[str] = field(default_factory=list)

p = Point(1.5)
print(p)                     # Point(x=1.5, y=0.0, labels=[])
print(p == Point(1.5, 0.0))  # True: fields are compared, not identity
```

Options on the decorator add more behaviour. `order=True` generates `<`, `<=`, `>` and `>=`,
comparing the fields as a tuple in declaration order. `frozen=True` forbids assignment after
creation and, together with the generated `__eq__`, makes instances hashable, so they can be
dictionary keys or set members. A `@classmethod` receives the class as `cls` and is the
usual way to write an alternative constructor, such as one that parses text.

## What is special or tricky

- **Hints are not enforced at runtime.** `Point("a", "b")` runs without complaint. Only a type
  checker (or your own validation) catches it.
- **Mutable defaults need `field(default_factory=...)`.** Writing `labels: list[str] = []`
  raises `ValueError` when the class is defined, because one list would be shared by every
  instance.
- **Fields with defaults come last.** A field without a default after one with a default is a
  `TypeError`.
- **Field order is the sort order.** With `order=True`, the first field decides, then the
  second breaks ties, and so on. Declare fields in the order you want them compared.
- **Frozen means immutable fields, not deep immutability.** A frozen dataclass holding a list
  still lets you append to that list.
- **Check `None` with `is None`**, not `== None`.

## What you will practise

You will create dataclasses with defaults, write a function that honestly returns
