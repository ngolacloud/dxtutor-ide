[[unit.step]]
kind = "concept"
id = "py-u06-c1-def-return"
title = "Defining and calling functions"
points = 5
difficulty = 6
intro = '''
When you call a function, Python creates a fresh **frame** on the **call stack** to hold
its parameters and local variables. The body runs, `return` sends a value back to the exact
spot of the call, and the frame is discarded. That is why local variables never leak out
and why each call starts clean.
'''
body = '''
## Anatomy of a function

```python
def area(width, height=1):
    """Return the area of a rectangle."""
    result = width * height
    return result

print(area(3, 4))      # 12
print(area(5))         # 5, height defaulted to 1
```

- **`def area(...)`** creates a function object and binds it to the name `area`.
- **`width, height=1`** are parameters; `height` has a default value.
- **The docstring** documents what the function does; tools such as `help(area)` show it.
- **`return result`** ends the call and hands `result` back to the caller.

## Arguments

When you call `area(3, 4)`, Python binds `width = 3` and `height = 4` in a brand-new local
scope, runs the body, and replaces the call expression with the returned value. You can also
name the arguments: `area(height=4, width=3)` means the same thing and is often clearer.

## Return versus print

```python
def shout(word):
    print(word.upper())

value = shout("hi")    # prints HI
print(value)           # None
```

`print` shows something on the screen; `return` gives a value to the code that called the
function. A function without `return` gives back `None`. Prefer returning values and leave
the printing to the caller: such functions can be combined, reused and tested.
'''

