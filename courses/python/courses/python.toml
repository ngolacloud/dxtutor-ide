tests = '''
import time


def build(values):
    head = None
    for v in reversed(values):
        head = Node(v, head)
    return head


def nodes_of(head, limit):
    out = []
    while head is not None:
        out.append(head)
        if len(out) > limit:
            raise AssertionError("the list has a cycle: an old next was not cleared")
        head = head.next
    return out


def values_of(head, limit):
    return [n.val for n in nodes_of(head, limit)]


class TestReverseList(unittest.TestCase):
    def test_empty(self):
        self.assertIsNone(reverse_list(None))

    def test_single_node(self):
        n = Node(5)
        r = reverse_list(n)
        self.assertIs(r, n)
        self.assertIsNone(r.next)
        self.assertEqual(r.val, 5)

    def test_three(self):
        r = reverse_list(build([1, 2, 3]))
        self.assertEqual(values_of(r, 10), [3, 2, 1])

    def test_two(self):
        r = reverse_list(build(["a", "b"]))
        self.assertEqual(values_of(r, 10), ["b", "a"])

    def test_duplicates_and_negatives(self):
        r = reverse_list(build([-1, 0, -1, 2, 2]))
        self.assertEqual(values_of(r, 20), [2, 2, -1, 0, -1])

    def test_reuses_the_same_nodes(self):
        head = build([10, 20, 30, 40])
        original = nodes_of(head, 10)
        vals = [n.val for n in original]
        r = reverse_list(head)
        self.assertIs(r, original[-1], "the new head must be the old last node")
        got = nodes_of(r, 10)
        self.assertEqual(len(got), 4)
        for a, b in zip(got, reversed(original)):
            self.assertIs(a, b, "nodes must be rewired, not recreated")
        self.assertEqual([n.val for n in original], vals, "node values must not change")

    def test_old_head_becomes_tail(self):
        head = build([1, 2, 3, 4, 5])
        reverse_list(head)
        self.assertIsNone(head.next)

    def test_reverse_twice_restores(self):
        head = build(list(range(7)))
        once = reverse_list(head)
        self.assertEqual(values_of(once, 20), list(range(6, -1, -1)))
        r = reverse_list(once)
        self.assertIs(r, head)
        self.assertEqual(values_of(r, 20), list(range(7)))

    def test_large_list(self):
        n = 100_000
        head = build(list(range(n)))
        start = time.perf_counter()
        r = reverse_list(head)
        elapsed = time.perf_counter() - start
        self.assertEqual(values_of(r, n + 1), list(range(n - 1, -1, -1)))
        self.assertLess(elapsed, 2.0, "reversal should be a single O(n) pass")
'''

[unit.step.gabarito]
solution = '''
from __future__ import annotations


class Node:
    """A singly linked list node (provided: do not change it)."""

    __slots__ = ("val", "next")

    def __init__(self, val, next: Node | None = None):
        self.val = val
        self.next = next


def reverse_list(head: Node | None) -> Node | None:
    """Reverse the list in place and return its new head."""
    prev = None
    node = head
    while node is not None:
        following = node.next
        node.next = prev
        prev = node
        node = following
    return prev
'''
time = "O(n)"
space = "O(1)"
justification = '''
The loop visits each node exactly once and does a constant amount of work per node (save
`next`, flip it, advance two references), so the time is **O(n)**. Only three references are
kept (`prev`, `node`, `following`) regardless of the list's length, so the extra space is
**O(1)**: the nodes themselves are reused, not copied.

The invariant is what makes it correct: before each iteration, `prev` heads the already
reversed prefix and `node` heads the untouched suffix. Saving `node.next` first is essential,
because flipping it would otherwise cut off the suffix. When `node` reaches `None`, `prev` is
the old last node, the new head. A recursive version would also be O(n) time, but it uses
O(n) stack frames and hits `RecursionError` long before 100,000 nodes; copying the values
into a Python list and writing them back would break the "reuse the nodes" contract and
cost O(n) extra space.
'''

[[unit]]
id = "py-u25-hash-maps-sets"
title = "Hash tables, frequencies and sets"
level = "advanced"
difficulty = 31
intro = '''
Python's `dict` and `set` answer "is this key here?" in constant time on average because they
are hash tables. In this unit you open the box: you will turn keys into bucket indexes, build
a tiny chained hash map, count frequencies and combine sets, and then write a hash map from
scratch that grows itself as it fills up.
'''
concepts = '''
## The idea

A **hash table** stores key/value pairs in an array of **buckets**. A **hash function** turns a key into an integer, and `hash(key) % len(buckets)` picks a bucket. Looking up a key means hashing it, jumping straight to one bucket and scanning the few entries there. That costs **O(1) on average**, however many keys the table holds.

Two different keys can land in the same bucket. That is a **collision**, and there are two classic ways to handle it:

- **Separate chaining**: each bucket is a small list of entries, and a lookup scans that list.
- **Open addressing**: all entries live in one array, and a collision probes other slots. CPython's `dict` works this way.

Speed depends on the **load factor**, α = entries / buckets. As α grows, chains get longer and lookups slow down. So a hash table **resizes**: when α passes a threshold (0.75 is common for chaining), it allocates about twice as many buckets and **rehashes** every entry, because `hash % new_size` gives different indexes. One resize costs O(n), but doubling makes resizes rare, so inserts are **O(1) amortised**, the same argument that makes `list.append` cheap. The worst case, where every key collides, is O(n) per lookup, which is why the hash function must spread keys well.

## How Python does it

`hash(x)` returns an integer for any **hashable** object. Small ints hash to themselves, so `hash(42) == 42`. Strings are hashed with a random per-process seed (**hash randomisation**, a defence against collision attacks), so `hash("cat")` changes from one run to the next. Never print or store it.

The contract is **if `a == b` then `hash(a) == hash(b)`**. Mutable built-ins are unhashable (`TypeError: unhashable type: 'list'`) because their hash would change when they change. Use a tuple or a `frozenset` as a key instead.

`collections.Counter` is a dict specialised for counting:

```python
from collections import Counter

counts = Counter("the cat and the hat".split())
print(counts["the"], counts["dog"])   # 2 0 (missing keys count as 0)
```

A `set` is a hash table with keys and no values. It gives O(1) membership and set algebra: `a | b` (union), `a & b` (intersection), `a - b` (difference) and `a ^ b` (symmetric difference).

## What is special or tricky

- **Defining `__eq__` removes `__hash__`.** A class that defines `__eq__` gets `__hash__ = None` and becomes unhashable, unless you also define `__hash__` over the same fields that `__eq__` compares.
- **Don't mutate a key after inserting it.** It stays in the bucket of its old hash, so lookups can no longer find it.
- **`x in a_list` is O(n); `x in a_set` is O(1) on average.** Turning a list into a set before many lookups is a classic speed-up.
- **Set order is arbitrary**, and for strings it changes between runs. Sort before printing. Dicts, by contrast, remember insertion order.
- `1`, `1.0` and `True` are equal and hash the same, so a dict treats them as one key.
- `[[]] * 8` repeats one list object eight times. Build buckets with `[[] for _ in range(8)]`.

## What you will practise

You will compute bucket indexes with a deterministic string hash, build a chained map with `put` and `get`, and count frequencies and combine sets. The challenge is a complete `HashMap` class with chaining, removal and automatic resizing, tested on 100,000 keys.
'''

[[unit.step]]
kind = "concept"
id = "py-u25-c1-buckets"
title = "Buckets, hashing and collisions"
points = 5
difficulty = 31
intro = '''
A hash table is an array plus a function that maps any key to an array index. When two keys
map to the same index, the table must still keep both, and that is what collision handling is
for.
'''
body = '''
## From key to index

A hash function turns a key into an integer, and the remainder picks a bucket:

```python
index = hash(key) % len(buckets)
```

The same key always produces the same index (within one run), so `put` and `get` agree on
where to look.

## Chaining

With separate chaining, each bucket is a list of `(key, value)` pairs:

```python
buckets = [[] for _ in range(8)]
buckets[hash("ana") % 8].append(("ana", 31))
```

A lookup hashes the key, goes to that one bucket and compares keys with `==` inside it. Keys
that collide simply share a bucket.

## Load factor and resizing

With *n* entries in *m* buckets, the average chain length is the load factor α = n / m. If
*m* stays fixed while *n* grows, chains grow too, and the "constant-time" table slides
towards O(n). The fix is to grow: once α passes a threshold, allocate a bigger bucket array
(typically double) and reinsert every entry, recomputing each index with the new size.

That rehash is O(n), but after doubling it cannot happen again until the table holds twice as
many keys. Spread over all the inserts, each insert pays O(1) on average (**amortised**).

## Equality and hashing go together

Inside a bucket, keys are compared with `==`. That is why Python requires equal objects to
have equal hashes: two equal keys must land in the same bucket, or the table would store them
twice.
'''

