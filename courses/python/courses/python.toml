[unit.step.gabarito]
solution = '''
import csv


def total_by_category(src: str, dst: str) -> int:
    """Sum the amount column of the CSV at src per category."""
    totals: dict[str, int] = {}
    with open(src, newline="", encoding="utf-8") as f:
        for row in csv.DictReader(f):
            category = row["category"]
            totals[category] = totals.get(category, 0) + int(row["amount"])
    with open(dst, "w", newline="", encoding="utf-8") as f:
        writer = csv.writer(f)
        writer.writerow(["category", "total"])
        for category in sorted(totals):
            writer.writerow([category, totals[category]])
    return len(totals)
'''
time = "O(n + k log k)"
space = "O(k)"
justification = '''
Let `n` be the number of data rows and `k` the number of distinct categories. `DictReader`
streams the input one row at a time, and each row costs one O(1) average dict update, so the
reading pass is **O(n)**. Sorting the categories costs **O(k log k)**, and writing them is
O(k), giving **O(n + k log k)** overall (with `k ≤ n`, that is at most O(n log n)). Only the
totals dict is kept in memory, never the whole file, so the extra space is **O(k)**. Both
files are opened with `with`, so they are closed even if a row holds a bad amount and `int`
raises; and since `open(src)` runs first, a missing source fails before `dst` is touched.
'''

