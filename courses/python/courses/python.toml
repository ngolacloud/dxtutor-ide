[unit.step.gabarito]
solution = '''
import sqlite3


def next_page(
    conn: sqlite3.Connection, after: tuple[int, int] | None, size: int
) -> list[tuple[int, int]]:
    """Return the next `size` events after the cursor, as (ts, id) tuples."""
    if size <= 0:
        return []
    if after is None:
        cur = conn.execute(
            "SELECT ts, id FROM events ORDER BY ts, id LIMIT ?",
            (size,),
        )
    else:
        ts, event_id = after
        cur = conn.execute(
            "SELECT ts, id FROM events WHERE (ts, id) > (?, ?) ORDER BY ts, id LIMIT ?",
            (ts, event_id, size),
        )
    return cur.fetchall()
'''
time = "O(log n + k) with an index on (ts, id)"
space = "O(k)"
justification = '''
With an index on `(ts, id)`, SQLite seeks to the cursor in **O(log n)** and reads the next
**k** = `size` entries in order, so a page costs **O(log n + k)** however deep it is. The
test table has no such index, so there SQLite scans all **n** rows and keeps the best k in
a bounded sorter, **O(n log k)**; that is why production keyset paging always comes with
an index on the sort key. The page itself is **O(k)** space.

Comparing the pair `(ts, id)` makes the order total: the primary key breaks every tie, so
each row has exactly one position and the cursor names it unambiguously. Comparing `ts`
alone would skip the rest of a tie group at a page boundary, and comparing `id` alone
would ignore the time order.
'''

