[unit.step.gabarito]
solution = '''
class SettingsError(ValueError):
    """Raised when a settings text is malformed. `lineno` is 1-based."""

    def __init__(self, lineno: int, message: str) -> None:
        super().__init__(f"line {lineno}: {message}")
        self.lineno = lineno


def parse_settings(text: str) -> dict[str, int]:
    """Parse 'key = value' lines into a dict of ints."""
    settings: dict[str, int] = {}
    for lineno, raw in enumerate(text.splitlines(), start=1):
        line = raw.strip()
        if not line or line.startswith("#"):
            continue
        key, sep, value = line.partition("=")
        key, value = key.strip(), value.strip()
        if not sep:
            raise SettingsError(lineno, "expected 'key = value'")
        if not key:
            raise SettingsError(lineno, "empty key")
        if key in settings:
            raise SettingsError(lineno, f"duplicate key {key!r}")
        try:
            settings[key] = int(value)
        except ValueError as err:
            raise SettingsError(lineno, f"not an integer: {value!r}") from err
    return settings
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the length of the text. `splitlines` and the per-line `strip`, `partition` and
`int` calls each touch every character a constant number of times, and the duplicate check is
a dict membership test, O(1) on average per key. The whole parse is therefore **O(n)**. The
list of lines and the resulting dict together hold at most O(n) characters, so the space is
**O(n)**. `partition` splits at the first `=` only and reports whether a separator was found,
which covers the "no `=`" rule cleanly. Wrapping just the `int()` call in `try` keeps the
handler precise, and `raise ... from err` keeps the original `ValueError` as `__cause__`.
'''

