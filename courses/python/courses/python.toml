[unit.step.gabarito]
solution = '''
from concurrent.futures import ThreadPoolExecutor, as_completed
from typing import Callable, TypeVar

T = TypeVar("T")


def fetch_all(
    urls: list[str], fetch: Callable[[str], T], workers: int = 4
) -> tuple[dict[str, T], dict[str, Exception]]:
    """Fetch every distinct URL concurrently; return (results, errors) keyed by URL."""
    if workers < 1:
        raise ValueError("workers must be at least 1")
    results: dict[str, T] = {}
    errors: dict[str, Exception] = {}
    unique = list(dict.fromkeys(urls))
    with ThreadPoolExecutor(max_workers=workers) as pool:
        futures = {pool.submit(fetch, url): url for url in unique}
        for future in as_completed(futures):
            url = futures[future]
            try:
                results[url] = future.result()
            except Exception as exc:
                errors[url] = exc
    return results, errors
'''
time = "O(n) work, about ceil(u/w) · c wall time"
space = "O(n)"
justification = '''
Let `n` be the number of URLs, `u` the number of distinct ones, `w` the number of workers and
`c` the cost of one fetch. `dict.fromkeys` removes duplicates in **O(n)** while keeping the
first-seen order. Submitting `u` tasks and handling `u` completed futures are **O(1)** each,
so the bookkeeping is **O(n)** and exactly `u` fetches run. The pool never runs more than `w`
fetches at once, so for I/O-bound fetches the wall-clock time is about `ceil(u / w) · c`.
The deduplicated list, the futures dict and the two result dicts hold at most `n` entries
together, so the space is **O(n)**. Only the main thread writes to `results` and `errors`, as
`as_completed` hands it each finished future, so no lock is needed; `future.result()` either
returns the value or re-raises the task's exception, which is caught per URL so one failure
never cancels the others.
'''

# ── g6-async ────────────────────────────────────────────────────────────

[[unit]]
id = "py-u21-asyncio"
title = "asyncio: async/await, gather & timeouts"
level = "advanced"
difficulty = 27
intro = '''
Many programs spend most of their time waiting: for the network, for a disk, for a timer. `asyncio`
lets one thread juggle many of those waits by switching between coroutines whenever one of them
pauses. You will write coroutines with `async def`, run several at once with `asyncio.gather`, and
put a deadline on slow work with timeouts. The unit ends with a concurrent fetcher where every call
has its own deadline.
'''
concepts = '''
## The idea

Threads (unit 25) let the operating system switch between tasks at any moment, which is why they
need locks. **Cooperative multitasking** makes the opposite deal: a task runs until it *chooses* to
pause, usually because it is waiting for I/O. A scheduler called the **event loop** keeps the paused
tasks and resumes each one when the thing it waits for is ready. There is one thread and no
pre-emption, so a task is never interrupted halfway through updating plain Python data.

This fits **I/O-bound** work perfectly: a hundred network calls that each wait 50 ms can all wait
*at the same time* and finish in about 50 ms instead of 5 s. It does nothing for **CPU-bound** work,
because a task that never pauses never lets the others run.

## How Python does it

`async def` defines a **coroutine function**. Calling it does not run the body; it returns a
**coroutine object**, a paused computation. `await` runs an awaitable until it completes, and while
that awaitable waits, the event loop is free to run other tasks. `asyncio.run(main())` creates a
loop, runs one coroutine to completion and closes the loop.

```python
import asyncio

async def tick(label):
    await asyncio.sleep(0.01)    # pause here; the loop may run others
    return label.upper()

print(asyncio.run(tick("ok")))   # OK
```

To run coroutines concurrently, wrap them in **tasks**. `asyncio.create_task(coro)` schedules one
straight away, and `asyncio.gather(*aws)` runs many and returns their results **in argument order**,
not in finishing order.

Deadlines come from `asyncio.wait_for(aw, timeout)`, which cancels the awaitable and raises
`TimeoutError` when it is too slow, or from the block `async with asyncio.timeout(seconds):`
(Python 3.11+). Cancellation arrives as a `CancelledError` raised at the `await` where the task
was paused.

## What is special or tricky

- **Forgetting `await`.** `tick("ok")` on its own builds a coroutine and throws it away; Python
  warns `coroutine 'tick' was never awaited`.
- **Blocking calls freeze everything.** `time.sleep(1)` or a heavy loop inside a coroutine stalls
  the whole loop, because nobody pauses. Use `await asyncio.sleep`, async libraries, or
  `asyncio.to_thread` for blocking code.
- **Two `await`s in a row are sequential.** `await a(); await b()` starts `b` only after `a` is
  done. Concurrency needs tasks or `gather`.
- **`asyncio.run` does not nest.** Call it once, at the top of the program; inside coroutines you
  `await`.
- **Exceptions in `gather`.** By default the first exception propagates to the caller; pass
  `return_exceptions=True` to receive exceptions as values instead.
- **Don't swallow `CancelledError`.** Catching it and carrying on silently breaks timeouts.

## What you will practise

You will run a first coroutine, watch `gather` overlap three waits while keeping the results in
order, and stop a slow coroutine with a timeout. The challenge asks you to fetch many keys
concurrently, each call under its own deadline.
'''

[[unit.step]]
kind = "concept"
id = "py-u21-c1-event-loop"
title = "Coroutines, tasks and the event loop"
points = 5
difficulty = 27
run_command = ""
intro = '''
An event loop is a scheduler that lives in a single thread. It keeps a queue of ready tasks, runs
one until it awaits something that is not ready yet, then moves on to the next. This is cooperative
multitasking: tasks give up control voluntarily at `await` points, which is why they rarely need
locks.
'''
body = '''
## Three words

- A **coroutine** is what an `async def` function returns when you call it: a paused computation.
  Nothing in its body has run yet.
- A **task** wraps a coroutine and schedules it on the event loop, so it makes progress while
  other code is waiting.
- The **event loop** runs one task until it reaches an `await` on something that is not ready,
  then switches to another task that is.

```python
import asyncio

async def job(name, delay):
    await asyncio.sleep(delay)
    return name

async def main():
    t = asyncio.create_task(job("a", 0.02))
    b = await job("b", 0.01)   # task a keeps running while we wait
    a = await t
    print(a, b)

asyncio.run(main())
```

## Sequential versus concurrent

Two `await`s in a row take the **sum** of their waits. Two tasks waiting at the same time take the
**longest** wait. That is the whole performance story of asyncio: it overlaps waiting time. It
only works if every slow operation is *awaitable*; a blocking call such as `time.sleep` keeps the
loop busy, and nothing else moves.

## Results and deadlines

`asyncio.gather` returns a list in the order you passed the awaitables, whatever order they finish
in. `asyncio.wait_for(aw, timeout)` cancels the work and raises `TimeoutError` if it does not
finish in time.
'''

