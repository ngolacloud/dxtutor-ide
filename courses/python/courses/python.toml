[unit.step.gabarito]
solution = '''
from functools import total_ordering


@total_ordering
class Money:
    """An amount of money, stored as whole cents in a single currency."""

    def __init__(self, cents: int, currency: str) -> None:
        self.cents = cents
        self.currency = currency

    def __repr__(self) -> str:
        return f"Money({self.cents!r}, {self.currency!r})"

    def __str__(self) -> str:
        sign = "-" if self.cents < 0 else ""
        units, cents = divmod(abs(self.cents), 100)
        return f"{sign}{units}.{cents:02d} {self.currency}"

    def _same_currency(self, other: "Money") -> None:
        if self.currency != other.currency:
            raise ValueError(f"cannot mix {self.currency} and {other.currency}")

    def __add__(self, other):
        if not isinstance(other, Money):
            return NotImplemented
        self._same_currency(other)
        return Money(self.cents + other.cents, self.currency)

    def __radd__(self, other):
        if isinstance(other, int) and other == 0:
            return self
        return NotImplemented

    def __sub__(self, other):
        if not isinstance(other, Money):
            return NotImplemented
        self._same_currency(other)
        return Money(self.cents - other.cents, self.currency)

    def __mul__(self, n):
        if not isinstance(n, int):
            return NotImplemented
        return Money(self.cents * n, self.currency)

    __rmul__ = __mul__

    def __eq__(self, other):
        if not isinstance(other, Money):
            return NotImplemented
        return (self.cents, self.currency) == (other.cents, other.currency)

    def __hash__(self) -> int:
        return hash((self.cents, self.currency))

    def __lt__(self, other):
        if not isinstance(other, Money):
            return NotImplemented
        self._same_currency(other)
        return self.cents < other.cents

    def __bool__(self) -> bool:
        return self.cents != 0
'''
time = "O(1) per operation"
space = "O(1) per operation"
justification = '''
Every operation works on two machine-sized fields: an addition, a comparison, a `divmod` or
a tuple hash. None of them loops, so each is **O(1)** in time (treating the cent count as a
fixed-size integer), and each creates at most one new `Money`, so the space is **O(1)** too.
`sum()` over `n` items therefore costs **O(n)**: it starts from `0`, which `__radd__`
accepts, then performs `n - 1` additions. Returning `NotImplemented` for foreign types is
what lets Python try the reflected method and produce its own `TypeError`; raising
`ValueError` only for a currency mismatch keeps that one domain error distinct.
`@total_ordering` derives `<=`, `>` and `>=` from `__lt__` and `__eq__`, and since each of
them calls `__lt__`, the currency check covers them all. `__hash__` hashes exactly the fields
`__eq__` compares, which keeps the hash contract.
'''

