solution = '''
import sqlite3


def add_order_index(conn: sqlite3.Connection) -> None:
    """Create the index that serves the two hot `orders` queries."""
    with conn:
        conn.execute(
            "CREATE INDEX IF NOT EXISTS idx_orders_customer_status_total "
            "ON orders (customer_id, status, total)"
        )
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Building the index sorts all **n** rows by `(customer_id, status, total)`: **O(n log n)**
time, and the new B-tree stores one entry per row: **O(n)** space. After that, each hot
query is a seek of **O(log n)** plus the **k** matching entries, instead of an **O(n)**
scan.

The column order is the design. `customer_id` comes first, so the customer-only query can
seek on the leftmost prefix; `status` second, so the two-column query seeks on both
equalities; `total` last, so the index already holds the selected column and the table is
never visited. Putting `status` first would still cover the first query, but turn the
second into a `SCAN`. `IF NOT EXISTS` makes the call idempotent.
'''

