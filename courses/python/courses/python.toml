# Unit 23: closures and functools
# ───────────────────────────────────────────────────────────────────────────
[[unit]]
id = "py-u17-closures-functools"
title = "Closures and functools"
level = "advanced"
difficulty = 23
intro = '''
A function defined inside another function remembers the variables around it, even after
the outer function has returned. That pairing of code and captured state is a **closure**,
and it is the machinery behind decorators, callbacks and factories. You will update captured
state with `nonlocal`, dodge the late-binding trap, and let `functools.lru_cache` and
`functools.partial` handle memoisation and pre-filled arguments. The unit ends with a
moving average kept inside a closure.
'''
concepts = '''
## The idea

A **closure** is a function bundled with the environment it was created in. The idea comes
from the lambda calculus and was made central by Scheme: a function's *free variables*, the
ones it uses but doesn't define, are closed over and stay alive as long as the function
does. That gives you private, persistent state without writing a class. A factory function
sets up some variables, defines an inner function that uses them, and returns it.

## How Python does it

Python looks names up with the **LEGB** rule: Local, Enclosing function, Global, Built-in.
An inner function can read variables of the enclosing function freely. CPython stores each
captured variable in a **cell** object shared by both functions; you can see the cells in
`func.__closure__`.

Reading is free, but assigning is not: any assignment inside a function makes that name
local to it. To rebind a variable of the enclosing function, declare it `nonlocal`:

```python
def make_greeter(greeting):
    count = 0
    def greet(name):
        nonlocal count          # rebind the enclosing variable
        count += 1
        return f"{greeting}, {name} (#{count})"
    return greet

hello = make_greeter("Hello")
hello("Ana")    # 'Hello, Ana (#1)'
hello("Rui")    # 'Hello, Rui (#2)'
```

Each call to `make_greeter` creates a fresh `count`, so two greeters never share state.
Mutating a captured list or dict, as in `items.append(x)`, needs no `nonlocal`, because the
name itself is not rebound.

The `functools` module builds on closures:

- `functools.lru_cache(maxsize=128)` **memoises** a function: it keeps a dictionary from
  arguments to results and evicts the least recently used entry when full. `maxsize=None`
  (or `functools.cache`) never evicts. `cache_info()` reports hits and misses, and
  `cache_clear()` empties the cache.
- `functools.partial(func, *args, **kwargs)` returns a new callable with some arguments
  already filled in. `partial(int, base=2)` is a parser for binary strings.

## Pitfalls

- **Late binding.** A closure captures the *variable*, not its value at creation time, so
  lambdas created in a loop all see the loop variable's final value. Freeze the current value
  with a default argument (`lambda i=i: i`) or with `partial`.
- **`UnboundLocalError`.** Writing `count += 1` without `nonlocal` makes `count` local to the
  inner function, and reading it before the assignment fails.
- **`lru_cache` needs hashable arguments.** Passing a list raises `TypeError: unhashable
  type`. Memoise only pure functions: a cached function that reads the clock or a mutable
  global returns stale answers.
- An unbounded cache on a method keeps every `self` it has seen alive, which leaks memory.

## What you will practise

You will build independent counters with `nonlocal`, trigger the late-binding trap and fix it
two ways, and speed up a recursive function with `lru_cache` before pre-filling arguments
with `partial`. The challenge asks you to keep a sliding window of values inside a closure.
'''

