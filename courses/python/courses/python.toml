    def inspect(self):
        conn = sqlite3.connect(self.path, timeout=1.0)
        try:
            mode = conn.execute("PRAGMA journal_mode").fetchone()[0]
            stats = conn.execute(
                "SELECT COUNT(*), COUNT(DISTINCT n), COALESCE(MIN(n), 0), COALESCE(MAX(n), 0) FROM nums"
            ).fetchone()
            return mode, stats
        finally:
            conn.close()

    def test_four_workers(self):
        self.assertEqual(parallel_sum(self.path, 100, 4), 5050)
        mode, stats = self.inspect()
        self.assertEqual(mode, "wal")
        self.assertEqual(stats, (100, 100, 1, 100))

    def test_single_worker(self):
        self.assertEqual(parallel_sum(self.path, 10, 1), 55)
        self.assertEqual(self.inspect()[1], (10, 10, 1, 10))

    def test_more_workers_than_numbers(self):
        self.assertEqual(parallel_sum(self.path, 3, 8), 6)
        self.assertEqual(self.inspect()[1], (3, 3, 1, 3))

    def test_nothing_to_insert(self):
        self.assertEqual(parallel_sum(self.path, 0, 4), 0)
        mode, stats = self.inspect()
        self.assertEqual(mode, "wal")
        self.assertEqual(stats, (0, 0, 0, 0))

    def test_uneven_split(self):
        self.assertEqual(parallel_sum(self.path, 7, 3), 28)
        self.assertEqual(self.inspect()[1], (7, 7, 1, 7))

    def test_larger_input(self):
        self.assertEqual(parallel_sum(self.path, 3000, 6), 3000 * 3001 // 2)
        mode, stats = self.inspect()
        self.assertEqual(mode, "wal")
        self.assertEqual(stats, (3000, 3000, 1, 3000))
'''

[unit.step.gabarito]
solution = '''
import sqlite3
import threading


def _insert_stripe(path: str, start: int, step: int, upto: int) -> None:
    conn = sqlite3.connect(path, timeout=10.0)
    try:
        with conn:
            conn.executemany(
                "INSERT INTO nums (n) VALUES (?)",
                ((n,) for n in range(start, upto + 1, step)),
            )
    finally:
        conn.close()


def parallel_sum(path: str, upto: int, workers: int) -> int:
    """Insert 1..upto into nums(n) using `workers` threads and return the sum."""
    conn = sqlite3.connect(path, timeout=10.0)
    try:
        conn.execute("PRAGMA journal_mode=WAL")
        conn.execute("CREATE TABLE IF NOT EXISTS nums (n INTEGER)")
        conn.commit()
        threads = [
            threading.Thread(target=_insert_stripe, args=(path, w + 1, workers, upto))
            for w in range(workers)
        ]
        for t in threads:
            t.start()
        for t in threads:
            t.join()
        (total,) = conn.execute("SELECT COALESCE(SUM(n), 0) FROM nums").fetchone()
        return total
    finally:
        conn.close()
'''
time = "O(n + w)"
space = "O(w)"
justification = '''
Every number in `1..n` is inserted exactly once, and the final `SUM` reads each row once,
so the database work is **O(n)**; starting and joining **w** threads adds **O(w)**. The
inserts themselves are serialised by SQLite's single-writer lock, so threads do not make
the writing faster here: the point is that they can share the file safely.

Each worker streams its stripe through a generator, so Python holds only the **w**
threads and their connections at a time: **O(w)** extra space (the rows live in the
database). Worker `w` writes `w + 1, w + 1 + workers, …`, and these stripes partition
`1..n`, which is why the tests' count, distinct count and sum all match.
'''

# ---------------------------------------------------------------------------
# 19 · The N+1 query problem
# ---------------------------------------------------------------------------
[[unit]]
id = "py-udb4-n-plus-one"
title = "The N+1 query problem"
level = "intermediate"
difficulty = 19
intro = '''
A loop that runs one query per item is the N+1 anti-pattern: one query fetches a list, then N
more fetch something for each element. Each query pays a round trip, so the cost grows with N.
You will count the statements with `set_trace_callback`, fold the work into one `IN (...)`
query and one `JOIN`, and then load related rows with exactly one query.
'''
concepts = '''
## The idea

Every statement sent to a database has a fixed cost on top of the actual work: the request travels to the server, the SQL is parsed and planned, and the result travels back. That is a **round trip**. Over a network it often costs around a millisecond, far more than finding a few rows in an index.

The **N+1 problem** appears when code first runs one query to get a list (the "1"), then loops over the list and runs one more query per item (the "N"). With 3 items nobody notices. With 10 000 items, a page that runs 10 001 queries takes seconds, and the database spends most of its time on overhead. It often hides inside helper functions or ORM attributes that load related records lazily, so each query looks innocent on its own.

The fix is to think in **sets**. SQL is built to process many rows per statement: `WHERE id IN (...)` filters by a list, `JOIN` combines related tables, and aggregates such as `SUM` and `COUNT` (with `GROUP BY`) summarise inside the database. One statement, one round trip, whatever N is.

## How Python does it

`sqlite3` never batches or hides your queries: each `execute` is one statement. So the shape of your Python code *is* the shape of your database traffic, and an `execute` inside a `for` loop is the warning sign.

You can make the traffic visible. `conn.set_trace_callback(fn)` calls `fn` with the text of every statement the connection runs, with the bound values filled in; `set_trace_callback(None)` turns it off.

```python
seen = []
conn.set_trace_callback(seen.append)
for post in posts:                       # N+1: one lookup per post
    conn.execute("SELECT name FROM authors WHERE id = ?", (post.author_id,))
conn.set_trace_callback(None)
print(len(seen))                         # as many statements as posts
```

When the list comes from Python, an `IN` clause needs one `?` per element, and the values go in the parameters. The SQL text then depends on how long the list is, but the values still never enter it. When the related data lives in another table, a `JOIN` fetches both sides in a single statement, and iterating its cursor in Python is fine: those rows were all produced by that one query.

## What is special or tricky

- A placeholder binds one scalar. Passing a list to `IN (?)` raises `ProgrammingError: Error binding parameter 1: type 'list' is not supported`.
- SQLite accepts an empty `IN ()`, but most databases reject it. Decide what an empty input means, and usually skip the query entirely.
- SQLite limits the number of parameters in one statement (32 766 in current versions, only 999 before 3.32). For very long lists, send the ids in chunks or as one JSON value read with `json_each`.
- `SUM` over zero matching rows returns `NULL`, which arrives in Python as `None`. `COALESCE(SUM(x), 0)` gives 0 instead.
- SQLite runs in-process, so its round trips are cheap. Code that feels fast on a laptop can crawl against a database server across a network; the habit matters more than the local timing.

## What you will practise

You will run the N+1 loop on purpose and count its statements, then fold the same work into one `IN (...)` query and into one `JOIN`. The challenge checks that you load related rows with exactly one statement.
'''

