[[unit]]
id = "py-u19-threads"
title = "Threads, the GIL and locks"
level = "advanced"
difficulty = 25
intro = '''
A thread is a separate flow of control inside the same process, sharing all of its memory.
That sharing makes threads cheap to coordinate and easy to break: two threads updating the
same variable can lose updates. You will start and join threads, protect shared state with
a `Lock`, and see where CPython's Global Interpreter Lock helps and where it limits you. The
unit ends with a small thread pool you build yourself.
'''
concepts = '''
## The idea

**Concurrency** means several tasks are in progress at once; **parallelism** means they
literally execute at the same instant on different cores. A **thread** is the operating
system's unit of concurrency: it has its own stack and instruction pointer, but shares the
heap with every other thread in the process. Shared memory is fast, and it brings the central
hazard of concurrent programming, the **race condition**: a result that depends on how the
scheduler happens to interleave the threads. The classic fix is **mutual exclusion**, a lock
that lets only one thread at a time into a *critical section*.

## How Python does it

The `threading` module wraps OS threads:

```python
import threading

def work(name):
    print("hello from", name)

t = threading.Thread(target=work, args=("t1",))
t.start()    # begins running work("t1") concurrently
t.join()     # waits until it has finished
```

`join(timeout)` gives up waiting after a while, and a thread created with `daemon=True`
doesn't keep the program alive when the main thread exits.

`counter += 1` looks like one step but is three: load the value, add one, store it back. If
another thread runs between the load and the store, an update is lost. A `threading.Lock`
closes that gap. Used as a context manager, it is released even when an exception is raised:

```python
with lock:
    balance = balance - amount   # no other thread can interleave here
```

`threading.RLock` can be re-acquired by the thread that already holds it, and
`threading.Event` lets one thread signal others.

**The GIL.** CPython's standard build has a Global Interpreter Lock: only one thread executes
Python bytecode at a time, and the interpreter switches between threads every few
milliseconds.

- **I/O-bound work scales.** A thread waiting on the network, the disk or `time.sleep`
  releases the GIL, so other threads run meanwhile.
- **CPU-bound pure-Python work doesn't.** Four threads crunching numbers take about as long
  as one. Processes are the tool for that, in a later unit.
- **The GIL is not your lock.** It protects the interpreter's internals, not your program's
  invariants. Python 3.13 also offers an optional free-threaded build without a GIL, where
  correct locking matters even more.

## Pitfalls

- **Forgetting `join`.** Reading results before the threads finish gives partial data.
- **`target=work()`.** That calls `work` right away, in the current thread. Pass the function
  itself and its arguments as `args=(...)`, with a trailing comma for a single argument.
- **Deadlock.** Two threads that take two locks in opposite orders can each wait forever for
  the other. Acquire locks in one agreed order and keep critical sections short.
- **Interleaved output.** Prints from several threads mix unpredictably. Collect results and
  print after joining when order matters.
- A thread's return value is discarded, so results must go into a shared structure.

## What you will practise

You will split work across joined threads, keep a shared counter correct with a `Lock`, and
measure sleeping threads overlapping. The challenge asks you to build `thread_map`, a bounded
thread pool that returns results in order.
'''

[[unit.step]]
kind = "concept"
id = "py-u19-c1-threads"
title = "Start, join, lock"
points = 5
difficulty = 25
intro = '''
A `threading.Thread` runs a function concurrently with the rest of the program, and `join`
waits for it to finish. Threads share memory, so read-modify-write updates need a `Lock`.
The GIL decides which kinds of work threads can actually speed up.
'''
body = '''
## Start and join

```python
import threading

results = [0] * 3

def square(i):
    results[i] = i * i            # each thread writes its own slot

threads = [threading.Thread(target=square, args=(i,)) for i in range(3)]
for t in threads:
    t.start()
for t in threads:
    t.join()                      # wait for all of them
print(results)                    # [0, 1, 4]
```

Start them all first, then join them all. Joining right after each start would run them one
at a time.

## Shared state needs a lock

`n += 1` is a read, an add and a write. Two threads can both read `5` and both write `6`,
losing an increment. A `threading.Lock` turns the sequence into a critical section that only
one thread can be inside:

```python
lock = threading.Lock()

def bump():
    global n
    with lock:        # acquire; released automatically, even on error
        n += 1
```

## The GIL in one paragraph

In standard CPython only one thread runs Python bytecode at a time. A thread that waits for
the network, the disk or `time.sleep` releases the GIL, so threads speed up waiting, not
computing.
'''

