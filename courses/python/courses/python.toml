  "Creates the generator object; no line of the body has run yet.",
  "Prints `created generator` before anything from the body.",
  "The first `next` prints `start` and `yielding 1`, then this line prints `first: 1`.",
  "The loop resumes the same generator from where it paused.",
  "Prints `loop got 2` and `loop got 3`, each after its `yielding` line; then `done`.",
  "A fresh generator consumed by `sum`: its lines appear, then `3` is printed.",
]
explanation = '''
`created generator` appeared before `start`: calling `numbers(3)` ran nothing. Each `next()`
ran the body up to one `yield`, so every `yielding n` line comes just before the value is
