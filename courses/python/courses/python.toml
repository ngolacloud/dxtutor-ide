target = '''
import itertools


def read_lines():
    yield "10 apples"
    yield "# comment"
    yield "4 pears"
    yield ""
    yield "7 plums"


def parse(lines):
    for line in lines:
        if line and not line.startswith("#"):
            qty, name = line.split()
            yield name, int(qty)


big = (name for name, qty in parse(read_lines()) if qty > 5)
print(list(big))
squares = (n * n for n in itertools.count(1))
print(list(itertools.islice(squares, 5)))
small = itertools.takewhile(lambda sq: sq < 20, (n * n for n in itertools.count(1)))
print(list(small))
print(list(itertools.chain("ab", [1, 2])))
'''
