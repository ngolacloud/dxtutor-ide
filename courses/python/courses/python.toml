[unit.step.gabarito]
solution = '''
class HashMap:
    """A hash map with separate chaining that doubles its buckets as it fills."""

    def __init__(self, capacity: int = 8) -> None:
        self.buckets: list[list[tuple]] = [[] for _ in range(capacity)]
        self.size = 0

    def _bucket(self, key) -> list[tuple]:
        return self.buckets[hash(key) % len(self.buckets)]

    def put(self, key, value) -> None:
        bucket = self._bucket(key)
        for i, (k, _) in enumerate(bucket):
            if k == key:
                bucket[i] = (key, value)
                return
        bucket.append((key, value))
        self.size += 1
        if self.size > 0.75 * len(self.buckets):
            self._resize(2 * len(self.buckets))

    def _resize(self, new_capacity: int) -> None:
        new_buckets: list[list[tuple]] = [[] for _ in range(new_capacity)]
        for bucket in self.buckets:
            for key, value in bucket:
                new_buckets[hash(key) % new_capacity].append((key, value))
        self.buckets = new_buckets

    def get(self, key, default=None):
        for k, v in self._bucket(key):
            if k == key:
                return v
        return default

    def remove(self, key) -> None:
        bucket = self._bucket(key)
        for i, (k, _) in enumerate(bucket):
            if k == key:
                bucket[i] = bucket[-1]
                bucket.pop()
                self.size -= 1
                return
        raise KeyError(key)

    def __len__(self) -> int:
        return self.size

    def __contains__(self, key) -> bool:
        return any(k == key for k, _ in self._bucket(key))
'''
time = "O(1) average per operation (amortised for put)"
space = "O(n)"
justification = '''
`get`, `remove` and `__contains__` hash the key once and scan a single bucket. Because the
table doubles whenever the load factor passes 0.75, the average chain length stays below a
constant, so these operations are **O(1) on average** (O(n) only in the degenerate case where
every key collides, as with the `Collide` test keys).

`put` is O(1) plus an occasional resize. A resize to *2m* buckets rehashes all ~0.75·m
entries in O(m), but it happens only after the number of entries has doubled since the last
one. Summing the resize costs over n inserts gives a geometric series (… + n/4 + n/2 + n),
which is O(n) in total, so each insert is **O(1) amortised**. That is why 100,000 inserts
finish quickly, while a table stuck at 8 buckets would scan chains of thousands of entries on
every operation.

Space is **O(n)**: the entries themselves plus a bucket array kept within a constant factor
of n (it never shrinks on removal, so it is bounded by the peak size). Removing by swapping
the last entry into the hole and popping keeps deletion O(1) within the bucket.
'''

[[unit]]
id = "py-u26-binary-search-tree"
title = "Binary search trees"
level = "advanced"
difficulty = 32
intro = '''
A binary search tree keeps keys in order by putting smaller keys to the left and larger keys
to the right of every node, so each comparison discards a whole subtree. You will insert keys
and read them back sorted, search with a loop, measure height to see why balance matters, and
finish with the trickiest operation of all: deletion.
'''
concepts = '''
## The idea

A **binary tree** is made of nodes that each have at most two children, `left` and `right`. A **binary search tree** (BST) adds one ordering rule, the **BST property**: for every node, all keys in its left subtree are smaller than its key, and all keys in its right subtree are larger. Duplicates are either rejected or always sent to the same side.

That rule turns search into a walk down the tree. Compare the target with the root, go left if it is smaller and right if it is larger, and stop on a match or at an empty child. Each step descends one level, so search, insert and delete all cost **O(h)**, where *h* is the tree's **height**.

The height depends on the order of insertion. Random order gives a tree whose height is O(log n), a few dozen levels for 100,000 keys. Sorted order is the disaster case: each new key becomes the right child of the previous one, the tree degenerates into a linked list, and *h* = *n*. **Self-balancing** trees (AVL, red-black) rotate nodes to keep the height O(log n) whatever the order. Java's `TreeMap` and C++'s `std::map` are built that way. Python's standard library has no balanced tree; for ordered data people use a sorted list with `bisect`, or a third-party package.

An **in-order traversal** (left subtree, then the node, then the right subtree) visits the keys in sorted order. That is the BST's advantage over a hash table: ordered iteration, minimum and maximum, range queries and "next larger key" all come cheaply.

## How Python does it

A node is a small class, and `None` means "no child":

```python
class Node:
    def __init__(self, key):
        self.key = key
        self.left = None
        self.right = None
```

Recursion fits trees naturally, because every subtree is itself a tree:

```python
def size(node):
    if node is None:
        return 0
    return 1 + size(node.left) + size(node.right)
```

Operations that change the shape are usually written as functions that return the (possibly new) root of a subtree, so the parent can reattach it: `node.left = insert(node.left, key)`. Generators make traversals pleasant: `yield from inorder(node.left)` passes along every key of the left subtree.

## What is special or tricky

- **Recursion depth.** CPython's limit is about 1000 frames. Recursive code on a degenerate tree built from 5,000 sorted keys raises `RecursionError`. Searching and inserting are easy to write as loops.
- **Keys must be comparable.** Mixing `int` and `str` keys fails with `TypeError: '<' not supported between instances of 'str' and 'int'`.
- **Validity is about whole subtrees.** Checking only that each node is greater than its left child and smaller than its right child is not enough: a key deep in the left subtree must also be smaller than the root.
- **Deleting a node with two children** can't just splice it out. Something must take its place, and it must keep the order intact.

## What you will practise

You will insert keys and print them in order, search with a loop while counting steps, and compare the height of a balanced tree with that of a degenerate one. The challenge is deletion, with all three cases, checked on a tree of 100,000 keys.
'''

[[unit.step]]
kind = "concept"
id = "py-u26-c1-bst-property"
title = "The BST property and O(h)"
points = 5
difficulty = 32
intro = '''
One ordering rule, applied at every node, is what turns a tree into a search structure. It
makes each comparison throw away a whole subtree, so the cost of an operation is the height
of the tree rather than the number of keys.
'''
body = '''
## The rule

For every node: keys in the left subtree are **smaller**, keys in the right subtree are
**larger**.

```
        50
      /    \
    30      70
   /  \    /  \
  20  40  60  80
```

## Search is a walk

To find 60: 60 > 50, go right; 60 < 70, go left; found. Three comparisons, and each one
ruled out half of what was left. To learn that 45 is absent, walk 50, 30, 40 and fall off
an empty right child.

```python
node = root
while node is not None and node.key != target:
    node = node.left if target < node.key else node.right
```

## Insert follows the same walk

Walk as if searching. Where the walk falls off the tree, hang the new node. The tree only
ever grows at the bottom.

## In order means sorted

Visiting left subtree, node, right subtree prints 20 30 40 50 60 70 80. The tree is a
sorted sequence that you can search in O(h) and update without shifting elements.

## Height decides everything

Every operation costs O(h). With 7 keys in the balanced shape above, h = 3. Insert the same
keys in sorted order and each one becomes the right child of the last: h = 7, and the "tree"
is a linked list. Balanced trees keep h = O(log n); a plain BST gives no such guarantee.
'''

