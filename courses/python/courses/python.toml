[unit.step.gabarito]
solution = '''
import sqlite3


def post_authors(conn: sqlite3.Connection, post_ids: list[int]) -> dict[int, str]:
    """Map each post id in `post_ids` to its author's name with ONE query."""
    if not post_ids:
        return {}
    marks = ", ".join("?" * len(post_ids))
    rows = conn.execute(
        "SELECT p.id, a.name FROM posts AS p "
        "JOIN authors AS a ON a.id = p.author_id "
        f"WHERE p.id IN ({marks})",
        list(post_ids),
    )
    return dict(rows)
'''
time = "O(k log n)"
space = "O(k)"
justification = '''
For **k** requested ids, SQLite looks each one up in the `posts` primary-key B-tree and
then finds the author through the `authors` primary key: two **O(log n)** seeks per id,
so **O(k log n)** in total. Building the placeholder string and the dict is **O(k)**, and
the result holds at most k entries: **O(k)** space.

The point is the number of round trips: exactly **one**, whatever k is. The N+1 version
does the same index work but pays the fixed cost of a statement k + 1 times. The inner
`JOIN` drops orphan posts for free, and `dict(rows)` collapses duplicate ids.
'''

# ---------------------------------------------------------------------------
# 20 · Pagination: OFFSET vs keyset
# ---------------------------------------------------------------------------
[[unit]]
id = "py-udb5-pagination"
title = "Pagination: OFFSET vs keyset"
level = "intermediate"
difficulty = 20
intro = '''
Long lists are shown a page at a time. `LIMIT`/`OFFSET` is easy but gets slower as the offset
grows and shifts when rows change. Keyset pagination remembers where the last page ended and
continues from there with `WHERE key > ?`. You will build both and then a keyset pager that
handles ties in the sort column.
'''
concepts = '''
## The idea

No one wants a page that loads a million rows. **Pagination** returns a result in slices. The simplest way is **`LIMIT n OFFSET k`**: sort, skip `k` rows, return the next `n`. Page 3 of size 20 is `LIMIT 20 OFFSET 40`.

It has two problems. **Cost**: the database cannot jump to row 40 001; it produces and throws away every skipped row, so deep pages get slower and slower, **O(offset + n)**. **Stability**: offsets count positions, not rows. If a row before the current page is deleted while someone pages through, everything shifts left by one and the reader silently skips a row; an insert makes them see a row twice.

**Keyset pagination** (also called *cursor* or *seek* pagination) remembers the sort key of the last row the client received and asks for rows *after* it: `WHERE id > ? ORDER BY id LIMIT ?`. With an index on the key, the database seeks straight to that point, **O(log N + n)** no matter how deep the page is, and inserts or deletes elsewhere cannot shift it.

The price: you can only go to the next (or previous) page, not jump to page 37, and the key must define a **total order**. If the sort column has duplicates, such as many rows with the same timestamp, "after this value" is ambiguous: rows that share the last value can be skipped or repeated. The fix is to sort by the column *plus* a unique tie-breaker, usually the primary key, and to compare on both.

## How Python does it

A page is one query with the size and the cursor bound as parameters, and `fetchall()` because a page is small. A generator wraps the loop nicely: it yields one page at a time and remembers the cursor between pages.

```python
def page(conn, last_id, size):
    return conn.execute(
        "SELECT id, name FROM items WHERE id > ? ORDER BY id LIMIT ?",
        (last_id, size),
    ).fetchall()

first = page(conn, 0, 20)
second = page(conn, first[-1][0], 20)   # the cursor is the last id seen
```

APIs usually hand the cursor to the client as an opaque token (often base64 of the last key) so clients cannot invent offsets.

## What is special or tricky

- Without `ORDER BY`, pages have no defined order; the same row can appear on two pages.
- In SQLite a **negative** `LIMIT` means "no limit". Passing a size of `-1` returns the whole table, so validate the size first.
- `OFFSET` is still fine for small, mostly static lists and for "page 3 of 7" navigation.
- The keyset query must sort by exactly the columns it compares, in the same direction.
- An index on the sort columns is what makes keyset fast; without one the database still sorts the whole table.

## What you will practise

You will fetch an OFFSET page and watch a delete shift it, fetch keyset pages that are not affected, and walk a whole table with a generator. The challenge is a keyset pager over a column with ties.
'''

[[unit.step]]
kind = "concept"
id = "py-udb5-c1-paging"
title = "OFFSET versus keyset"
points = 5
difficulty = 20
intro = '''
Pagination trades random access for speed. An offset is a position, so the database has to
count up to it. A keyset cursor is a value, so an ordered index can seek to it directly, in
logarithmic time.
'''
body = '''
## OFFSET: skip and count

```python
conn.execute(
    "SELECT id FROM items ORDER BY id LIMIT ? OFFSET ?",
    (size, (page - 1) * size),
)
```

- Easy, and lets the user jump to any page number.
- The database still walks every skipped row, so page 5 000 costs much more than page 1.
- Offsets are positions: deleting a row on an earlier page shifts every later page, and a
  reader skips a row without noticing.

## Keyset: continue after the last key

```python
conn.execute(
    "SELECT id FROM items WHERE id > ? ORDER BY id LIMIT ?",
    (last_id, size),
)
```

- The client keeps the key of the last row it received and sends it back.
- With an index on the key, the database seeks straight to it: deep pages are as fast as
  the first one.
- Changes before the cursor do not move it, so rows are never skipped or repeated.
- You can only go forward (or backward with `<` and `DESC`), not to page 37.

## Rules for keyset

1. `ORDER BY` exactly the key you compare on.
2. The key must be **unique**. If the column you sort by can repeat, add the primary key
   as a tie-breaker, both in `ORDER BY` and in the comparison.
3. Stop when a page comes back empty, or shorter than the page size.
'''

