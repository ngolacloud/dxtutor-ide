        self.assertEqual(result, [4, 2, 7])
        self.assertEqual(nums, [4, 2, 7])

    def test_k_equals_length(self):
        self.assertEqual(window_max([2, 9, 1, 9], 4), [9])

    def test_k_too_large_or_empty(self):
        self.assertEqual(window_max([1, 2], 5), [])
