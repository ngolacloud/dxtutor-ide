[unit.step.gabarito]
solution = '''
from collections import deque


def window_max(nums: list[int], k: int) -> list[int]:
    """Return the maximum of every window of k consecutive elements of nums."""
    if k < 1:
        raise ValueError("k must be at least 1")
    candidates: deque[int] = deque()
    result: list[int] = []
    for i, value in enumerate(nums):
        while candidates and nums[candidates[-1]] <= value:
            candidates.pop()
        candidates.append(i)
        if candidates[0] <= i - k:
            candidates.popleft()
        if i >= k - 1:
            result.append(nums[candidates[0]])
    return result
'''
time = "O(n)"
space = "O(k)"
justification = '''
The `for` loop visits each of the `n` elements once. The inner `while` can look busy, but every index
is **appended once and popped at most once** (from the back by a larger newcomer, or from the front
when it leaves the window), so across the whole run the deque does at most `2n` operations. That
amortised argument gives **O(n)** total time, compared with **O(n·k)** for rescanning each window.
The deque holds indices in strictly decreasing order of value, all inside the current window, so it
never has more than `k` entries: **O(k)** extra space, not counting the output list of
`n - k + 1` maxima.
'''

