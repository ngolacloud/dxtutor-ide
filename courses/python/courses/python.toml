[unit.step.gabarito]
solution = '''
import functools
from typing import Callable


def retry(times: int, exceptions: tuple[type[BaseException], ...] = (Exception,)) -> Callable:
    """Return a decorator that retries the wrapped function, up to `times` attempts in total."""
    if times < 1:
        raise ValueError("times must be at least 1")

    def decorator(func: Callable) -> Callable:
        @functools.wraps(func)
        def wrapper(*args, **kwargs):
            for attempt in range(1, times + 1):
                try:
                    return func(*args, **kwargs)
                except exceptions:
                    if attempt == times:
                        raise
        return wrapper

    return decorator
'''
time = "O(t · f)"
space = "O(1)"
justification = '''
Let `t` be `times` and `f` the cost of one call to the original function. Building the
decorator and applying it is **O(1)**: it only creates two closures. Each call to the
decorated function makes at most `t` attempts and stops at the first success, so the worst
case is **O(t · f)**. The wrapper keeps nothing but the loop counter, so the extra space is
**O(1)**. `except exceptions:` accepts a tuple, which handles subclasses through `isinstance`
rules, and the bare `raise` re-raises the current exception with its original traceback.
The attempt counter lives inside the wrapper call, not in the closure, so every call starts
with a fresh budget.
'''

