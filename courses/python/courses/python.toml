deposits `balance * rate_percent // 100` and returns the new balance. When that interest is
`0`, nothing is recorded and the balance is returned unchanged.

Examples:

- `a = BankAccount("Ana", 50)`, then `a.deposit(25)` → `75`, then `a.withdraw(70)` → `5`
- `a.history()` → `[("deposit", 25), ("withdraw", 70)]`
- `a.withdraw(6)` → raises `ValueError`, and `a.balance` stays `5`
- `SavingsAccount("Rui", 1000, 5).add_interest()` → `1050`

