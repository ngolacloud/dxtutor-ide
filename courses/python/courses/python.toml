[unit.step.gabarito]
solution = '''
"""Word statistics: count words and rank the most frequent ones."""

import string
from collections import Counter

__all__ = ["word_count", "top_words"]


def _words(text: str) -> list[str]:
    """Split text into normalised words, dropping empty pieces."""
    words = []
    for piece in text.split():
        word = piece.strip(string.punctuation).lower()
        if word:
            words.append(word)
    return words


def word_count(text: str) -> dict[str, int]:
    """Map each normalised word in text to its number of occurrences."""
    return dict(Counter(_words(text)))


def top_words(text: str, n: int) -> list[tuple[str, int]]:
    """Return the n most frequent (word, count) pairs; ties alphabetical."""
    if n < 0:
        raise ValueError("n must not be negative")
    ranked = sorted(word_count(text).items(), key=lambda pair: (-pair[1], pair[0]))
    return ranked[:n]


if __name__ == "__main__":
    print(top_words("the cat and the hat and the bat", 2))
'''
time = "O(L + u log u)"
space = "O(L)"
justification = '''
Let `L` be the length of the text and `u` the number of distinct words. Splitting,
stripping and lower-casing touch every character a constant number of times, and counting
with a `Counter` (a hash map) costs **O(1)** on average per word, so building the counts is
**O(L)**. Ranking sorts the `u` distinct pairs with the key `(-count, word)`, which costs
**O(u log u)** comparisons. The total is **O(L + u log u)**.

The list of normalised words and the strings in it take **O(L)** memory, and the counts and
the sorted list take **O(u)**, which is at most `O(L)`. When `n` is much smaller than `u`,
`heapq.nsmallest(n, ...)` with the same key would cut the ranking to **O(u log n)**. Sorting
by a tuple key is what makes ties deterministic: equal counts fall back to alphabetical order.
'''

