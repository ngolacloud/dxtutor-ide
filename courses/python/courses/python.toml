        with deadline(15):
            one_off = edit_distance("a" * 1000, "a" * 999 + "b")
            shifted = edit_distance("ab" * 500, "ba" * 500)
            disjoint = edit_distance("x" * 600, "y" * 700)
        elapsed = time.perf_counter() - start
        self.assertEqual(one_off, 1)
        self.assertEqual(shifted, 2)
        self.assertEqual(disjoint, 700)
        self.assertLess(elapsed, 10.0, "an O(len(a) * len(b)) table should be enough")
