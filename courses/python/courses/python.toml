entry = "moving_average"
run_command = "python3 -m unittest"
intro = '''
A **sliding window** keeps only the last `k` items of a stream. Updating a running total as
one value enters and one leaves makes each step O(1) instead of re-summing the whole window.
Written as a generator, the computation works on streams of any length, including endless
ones, using memory proportional to the window, not to the data.
'''
instructions = '''
## Your turn

Implement the generator function `moving_average`:

```python
def moving_average(values: Iterable[float], window: int) -> Iterator[float]: ...
```

It yields the average of each run of `window` consecutive values, as a `float`, starting as
soon as the first `window` values have been seen.

- It must be **lazy**: it returns an iterator and reads `values` one item at a time, so it
  works on generators and on infinite iterators such as `itertools.count()`.
- If there are fewer than `window` values, it yields nothing.
- If `window` is less than 1, it raises `ValueError` (it is fine if the error appears when
  iteration starts).

Examples:

- `list(moving_average([1, 2, 3, 4, 5], 2))` → `[1.5, 2.5, 3.5, 4.5]`
- `list(moving_average([2, 4, 6, 8], 3))` → `[4.0, 6.0]`
- `list(moving_average([1, 2], 5))` → `[]`
- `list(islice(moving_average(count(1), 3), 2))` → `[2.0, 3.0]`

**Hint:** you cannot call `len()` or slice a generator. Keep the current window and its sum
as you go; `collections.deque` is handy for dropping the oldest value.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
from collections.abc import Iterable, Iterator


def moving_average(values: Iterable[float], window: int) -> Iterator[float]:
    """Lazily yield the average of every `window` consecutive values."""
    raise NotImplementedError
'''
tests = '''
import itertools


class MovingAverageTests(unittest.TestCase):
    def test_window_of_two(self):
        self.assertEqual(list(moving_average([1, 2, 3, 4, 5], 2)), [1.5, 2.5, 3.5, 4.5])

    def test_window_of_three(self):
        self.assertEqual(list(moving_average([2, 4, 6, 8], 3)), [4.0, 6.0])

    def test_window_one_yields_floats(self):
        result = list(moving_average([3, -1, 0], 1))
        self.assertEqual(result, [3.0, -1.0, 0.0])
        self.assertTrue(all(isinstance(x, float) for x in result))

    def test_too_few_values_and_empty(self):
        self.assertEqual(list(moving_average([1, 2], 5)), [])
        self.assertEqual(list(moving_average([], 1)), [])
        self.assertEqual(list(moving_average([7, 7, 7], 3)), [7.0])

    def test_negative_numbers(self):
        self.assertEqual(list(moving_average([-4, -2, 0, 2], 2)), [-3.0, -1.0, 1.0])

    def test_returns_an_iterator(self):
        result = moving_average([1, 2, 3], 2)
        self.assertIs(iter(result), result)
        self.assertEqual(next(result), 1.5)

    def test_accepts_a_generator(self):
        gen = (x for x in range(1, 6))
        self.assertEqual(list(moving_average(gen, 5)), [3.0])

    def test_works_on_an_endless_stream(self):
        def endless():
            for x in itertools.count(1):
                if x > 1000:
                    raise AssertionError("read far more values than needed: is it lazy?")
                yield x

        stream = moving_average(endless(), 3)
        self.assertEqual(list(itertools.islice(stream, 4)), [2.0, 3.0, 4.0, 5.0])

    def test_reads_lazily(self):
        pulled = []

        def source():
            for x in [10, 20, 30, 40]:
                pulled.append(x)
                yield x

        stream = moving_average(source(), 2)
        self.assertEqual(next(stream), 15.0)
        self.assertEqual(pulled, [10, 20])

    def test_floats(self):
        result = list(moving_average([0.1, 0.2, 0.3, 0.4], 2))
        self.assertEqual(len(result), 3)
        for got, want in zip(result, [0.15, 0.25, 0.35]):
            self.assertAlmostEqual(got, want)

    def test_large_input(self):
        n, k = 20000, 100
        result = list(moving_average(range(n), k))
        self.assertEqual(len(result), n - k + 1)
        self.assertEqual(result[0], (k - 1) / 2)
        self.assertEqual(result[-1], (n - k + n - 1) / 2)

    def test_invalid_window(self):
        for bad in (0, -3):
            with self.subTest(window=bad):
                with self.assertRaises(ValueError):
                    list(moving_average([1, 2, 3], bad))
'''

[unit.step.gabarito]
solution = '''
from collections import deque
from collections.abc import Iterable, Iterator


def moving_average(values: Iterable[float], window: int) -> Iterator[float]:
    """Lazily yield the average of every `window` consecutive values."""
    if window < 1:
        raise ValueError("window must be at least 1")
    recent: deque[float] = deque()
    total = 0.0
    for value in values:
        recent.append(value)
        total += value
        if len(recent) > window:
            total -= recent.popleft()
        if len(recent) == window:
            yield total / window
'''
time = "O(n)"
space = "O(k)"
justification = '''
The generator reads each of the `n` input values exactly once. For every value it does a
constant amount of work: one `append`, one addition, at most one `popleft` and subtraction
(both **O(1)** on a `deque`), and one division. The total time is therefore **O(n)**,
independent of the window size `k`. Re-summing the window for every output would cost
**O(n·k)** instead.

The only state kept between values is the deque, which never holds more than `k + 1` items,
and the running total, so the extra memory is **O(k)**. Because the function is a generator,
the input is never materialised as a list, which is why it also works on an infinite stream.
'''

[[unit]]
id = "py-u15-modules-testing"
title = "Modules, packages & unittest"
level = "intermediate"
difficulty = 15
intro = '''
Real programs are split across files, and real code is checked by tests rather than by eye.
This unit shows how Python finds and runs **modules** and **packages**, what the
`if __name__ == "__main__":` guard is for, and how to write automated tests with the built-in
`unittest` framework. You will finish by writing a small module with a clean public interface.
'''
concepts = '''
## The idea

As a program grows, one file stops being manageable. Splitting code into **modules** gives
each part a name, a clear job and its own **namespace**, so two files can both define
`load()` without clashing. A module exposes a small **public interface** and keeps its helpers
private, which is the same encapsulation idea you met with classes, one level up.

Splitting code only pays off if you can change one part without breaking another. That is
the job of **automated tests**: small programs that call your code with known inputs and
check the outputs. A suite that runs in a second lets you refactor with confidence, and it
documents, in executable form, what the code promises to do.

## How Python does it

Every `.py` file is a module; its name is the file name without `.py`. A folder of modules
with an `__init__.py` file is a **package**, and dots name the path: `shop.billing` is
`shop/billing.py`.

```python
import math                        # the whole module, used as math.sqrt
import statistics as stats         # an alias
from collections import Counter    # one name copied into this namespace
from shop.billing import total     # a name from a module inside a package
```

The first `import` of a module **runs the whole file once** and caches the result in
`sys.modules`, so later imports are free. Inside every module, `__name__` holds its name,
except in the file you launched, where it is `"__main__"`. That gives the classic guard:

```python
def main() -> None:
    print("running as a script")

if __name__ == "__main__":
    main()
```

The guarded code runs with `python3 tool.py` but not on `import tool`. A module can also list
its public names in `__all__`; `from module import *` then imports exactly those names.
Without `__all__`, it imports every name that does not start with an underscore.

`unittest` organises tests as methods on a `unittest.TestCase` subclass. Every method whose
name starts with `test` is one test, and assertion methods report precisely what went wrong:

```python
import unittest

class MathTests(unittest.TestCase):
    def test_floor_division(self):
        self.assertEqual(7 // 2, 3)

    def test_bad_conversion(self):
        with self.assertRaises(ValueError):
            int("seven")
```

Run a test file with `python3 -m unittest test_math`, or discover every `test_*.py` file with
`python3 -m unittest`.

## What is special or tricky

- **Top-level code runs on import.** A stray `print` or a slow computation at module level
  happens every time someone imports the file. Put it under the `__main__` guard.
- **Don't name your file after a library module.** A local `random.py` or `json.py` hides the
  real one from every `import` in that folder.
- **Circular imports** (`a` imports `b`, which imports `a`) fail with half-initialised
  modules. Move the shared code into a third module.
- **A leading underscore means private.** `_helper` is still importable by name, but
  `import *` skips it and readers know not to depend on it.
- **Test names must start with `test`**, or the runner silently skips them.

## What you will practise

You will import standard modules in several forms, write a file that is both a module and a
script, and run a `unittest` suite from code. The challenge asks you to write a module with
a declared public interface, private helpers and no side effects on import.
'''

[[unit.step]]
kind = "concept"
id = "py-u15-c1-modules"
title = "Modules, __name__ and tests"
points = 5
difficulty = 15
intro = '''
A module is a namespace backed by a file. Python's import system finds the file on
`sys.path`, executes it once, and caches the resulting module object in `sys.modules`. The
special variable `__name__` tells a file whether it is being imported or run directly, which
is how one file can be both a library and a program.
'''
body = '''
## One file, two roles

Suppose `temperature.py` contains:

```python
def to_fahrenheit(celsius: float) -> float:
    return celsius * 9 / 5 + 32

if __name__ == "__main__":
    print(to_fahrenheit(100))
```

- `python3 temperature.py` runs the file as the **main program**: `__name__` is `"__main__"`,
  so it prints `212.0`.
- `import temperature` in another file runs it as a **module**: `__name__` is
  `"temperature"`, so nothing is printed and the caller just gets the function.

## Packages

```text
shop/
    __init__.py      runs when the package is first imported
    billing.py       import shop.billing
    stock.py         from shop import stock
```

Inside a package, `from . import stock` imports a sibling module (a **relative import**).
`python3 -m shop.billing` runs a module of a package as a script.

## Public and private

Names starting with `_` are internal by convention. `__all__ = ["to_fahrenheit"]` declares the
public interface and controls what `from temperature import *` brings in.

## A test, end to end

```python
import unittest
from temperature import to_fahrenheit

class ConversionTests(unittest.TestCase):
    def test_boiling_point(self):
        self.assertEqual(to_fahrenheit(100), 212.0)
```

`python3 -m unittest` discovers files named `test_*.py`, runs every `test*` method, and
reports dots for passes, `F` for failed assertions and `E` for unexpected exceptions.
'''

