from typing import Callable, TypeVar

T = TypeVar("T")
R = TypeVar("R")


def thread_map(func: Callable[[T], R], items: list[T], workers: int) -> list[R]:
    """Apply func to every item on at most `workers` threads, keeping the input order."""
    raise NotImplementedError
'''
tests = '''
import threading
import time


class TestThreadMapResults(unittest.TestCase):
    def test_order_preserved(self):
        self.assertEqual(thread_map(lambda x: x * x, [1, 2, 3, 4, 5], 2), [1, 4, 9, 16, 25])

    def test_order_with_uneven_durations(self):
        def slow_first(x):
            time.sleep((5 - x) * 0.01)
            return x * 10

        self.assertEqual(thread_map(slow_first, list(range(6)), 3), [0, 10, 20, 30, 40, 50])

    def test_empty_and_single(self):
        self.assertEqual(thread_map(lambda x: x, [], 3), [])
        self.assertEqual(thread_map(str.upper, ["a"], 4), ["A"])

    def test_more_workers_than_items(self):
        self.assertEqual(thread_map(str.upper, ["a", "b"], 8), ["A", "B"])

    def test_each_item_exactly_once(self):
        seen = []
        lock = threading.Lock()

        def record(x):
            with lock:
                seen.append(x)
            return -x

        items = list(range(200))
        self.assertEqual(thread_map(record, items, 7), [-x for x in items])
        self.assertEqual(sorted(seen), items)

    def test_invalid_workers(self):
        with self.assertRaises(ValueError):
            thread_map(lambda x: x, [1, 2], 0)
        with self.assertRaises(ValueError):
            thread_map(lambda x: x, [1, 2], -1)

    def test_smallest_index_error_reraised(self):
        def boom(x):
            if x in (3, 7):
                time.sleep(0.03 if x == 3 else 0.0)
                raise ValueError(f"bad {x}")
            return x

        with self.assertRaises(ValueError) as ctx:
            thread_map(boom, list(range(10)), 4)
        self.assertEqual(str(ctx.exception), "bad 3")


class TestThreadMapConcurrency(unittest.TestCase):
    def test_io_bound_calls_overlap(self):
        def slow(x):
            time.sleep(0.1)
            return x + 1

        start = time.perf_counter()
        result = thread_map(slow, list(range(8)), 4)
        elapsed = time.perf_counter() - start
        self.assertEqual(result, list(range(1, 9)))
        self.assertLess(elapsed, 0.6)

    def test_bounded_concurrency_and_threads(self):
        baseline = threading.active_count()
        state = {"active": 0, "peak": 0, "threads": 0}
        lock = threading.Lock()

        def track(x):
            with lock:
                state["active"] += 1
                state["peak"] = max(state["peak"], state["active"])
                state["threads"] = max(state["threads"], threading.active_count() - baseline)
            time.sleep(0.02)
            with lock:
                state["active"] -= 1
            return x

        self.assertEqual(thread_map(track, list(range(12)), 3), list(range(12)))
        self.assertLessEqual(state["peak"], 3)
        self.assertGreaterEqual(state["peak"], 2)
        self.assertLessEqual(state["threads"], 3)
'''

[unit.step.gabarito]
solution = '''
import threading
from typing import Callable, TypeVar

T = TypeVar("T")
R = TypeVar("R")


def thread_map(func: Callable[[T], R], items: list[T], workers: int) -> list[R]:
    """Apply func to every item on at most `workers` threads, keeping the input order."""
    if workers < 1:
        raise ValueError("workers must be at least 1")
    n = len(items)
    results: list = [None] * n
    errors: dict[int, Exception] = {}
    next_index = 0
    lock = threading.Lock()

    def worker() -> None:
        nonlocal next_index
        while True:
            with lock:
                if next_index >= n:
                    return
                i = next_index
                next_index += 1
            try:
                results[i] = func(items[i])
            except Exception as exc:
                with lock:
                    errors[i] = exc

    threads = [threading.Thread(target=worker) for _ in range(min(workers, n))]
    for t in threads:
        t.start()
    for t in threads:
        t.join()
    if errors:
        raise errors[min(errors)]
    return results
'''
time = "O(n) work, about n/w · c wall time"
space = "O(n + w)"
justification = '''
Let `n` be the number of items, `w` the number of workers and `c` the cost of one call.
Every index is claimed exactly once under the lock, and claiming is **O(1)**, so the total
work is **O(n)** calls plus **O(n)** bookkeeping. When calls are I/O-bound and release the
GIL, up to `w` of them wait at the same time, so the wall-clock time is about
`ceil(n / w) · c` instead of `n · c`. The results list holds `n` slots and there are at most
`min(w, n)` threads, so the space is **O(n + w)**. Writing each result into slot `i` keeps
the input order without sorting, and only the counter and the error dict are shared
mutable state, which is why only they are touched under the lock.
'''

