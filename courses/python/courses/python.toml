[[unit]]
id = "py-udb3-wal-pool"
title = "WAL mode & connections"
level = "intermediate"
difficulty = 18
intro = '''
A database shared by several threads needs two things: a journal mode that lets readers and a
writer work at the same time, and a connection per thread. SQLite's Write-Ahead Logging (WAL)
gives the first; Python's `sqlite3` expects the second. You switch a file database to WAL,
watch a reader ignore an unfinished write, and have several threads insert through their own
connections to an exact total.
'''
concepts = '''
## The idea

A database must stay correct while several clients use it at once. SQLite's classic **rollback journal** copies the original pages aside before a write, then changes the database file in place. While a writer commits, nobody can read, and while readers are active, the writer must wait.

**Write-Ahead Logging (WAL)** inverts this. A writer appends new versions of pages to a separate `-wal` file and leaves the main file alone. Each reader takes a **snapshot**: it sees the database as of the last commit when its read began, ignoring later appends. So readers never block the writer and the writer never blocks readers. There is still only **one writer at a time**; a second writer waits for the lock. From time to time a **checkpoint** copies the WAL back into the main file.

WAL is a property of the database **file**, and it persists: once set, every later connection uses it. An in-memory database has no file, so it cannot use WAL.

## How Python does it

You switch modes with a pragma, which returns the mode now in force:

```python
conn = sqlite3.connect("app.db", timeout=5.0)
mode = conn.execute("PRAGMA journal_mode=WAL").fetchone()[0]   # 'wal'
```

A `sqlite3.Connection` belongs to the thread that created it. By default (`check_same_thread=True`) using it from another thread raises `ProgrammingError: SQLite objects created in a thread can only be used in that same thread`. The idiom is **one connection per thread**: each worker opens its own connection to the same file and closes it when done. The standard library has no connection pool (unlike Go's `*sql.DB`); frameworks and libraries such as SQLAlchemy provide one, but underneath they apply the same rule.

When a writer finds the database locked, it does not fail at once. The `timeout` argument of `connect` (default 5 seconds) is the **busy timeout**: how long SQLite keeps retrying before raising `sqlite3.OperationalError: database is locked`.

```python
def worker(path, rows):
    conn = sqlite3.connect(path, timeout=10.0)   # this thread's own connection
    with conn:
        conn.executemany("INSERT INTO log VALUES (?)", rows)
    conn.close()
```

## What is special or tricky

- `PRAGMA journal_mode=WAL` on `":memory:"` quietly returns `'memory'`. Always check the returned mode.
- WAL creates two companion files, `app.db-wal` and `app.db-shm`. Copy or delete all three together, and avoid WAL on network file systems, where its shared memory does not work.
- Writes are still serialised. Keep transactions short so other writers do not hit the timeout.
- A pending write is invisible to other connections until it commits, in any mode.
- Don't pass `check_same_thread=False` just to silence the error: then you must do all the locking yourself.
- Test code that creates database files should use `tempfile` so the files are always cleaned up.

## What you will practise

You will turn on WAL and list the files it creates, read while a write is still pending, and run four threads that each insert a share of the numbers through their own connection. The challenge combines all three.
'''

