        self.assertEqual(edit_distance("", ""), 0)
        self.assertEqual(edit_distance("", "abc"), 3)
        self.assertEqual(edit_distance("abc", ""), 3)

    def test_identical(self):
        self.assertEqual(edit_distance("same", "same"), 0)
        self.assertEqual(edit_distance("a", "a"), 0)

    def test_substitution_costs_one(self):
        self.assertEqual(edit_distance("a", "b"), 1)
        self.assertEqual(edit_distance("abc", "abd"), 1)
        self.assertEqual(edit_distance("abcd", "wxyz"), 4)

    def test_symmetric_and_case_sensitive(self):
        self.assertEqual(edit_distance("Sunday", "saturday"), 4)
        self.assertEqual(edit_distance("saturday", "Sunday"), 4)
        self.assertEqual(edit_distance("ABC", "abc"), 3)

    def test_against_reference(self):
        rng = random.Random(28)
        for _ in range(200):
            a = "".join(rng.choice("abc") for _ in range(rng.randint(0, 9)))
            b = "".join(rng.choice("abc") for _ in range(rng.randint(0, 9)))
            self.assertEqual(edit_distance(a, b), reference(a, b), (a, b))


