[[unit.step]]
kind = "challenge"
id = "py-u05-x1-is-prime"
title = "Implement is_prime"
points = 20
difficulty = 5
entry = "is_prime"
run_command = "python3 -m unittest"
intro = '''
A number greater than 1 is **prime** when no number other than 1 and itself divides it. The
naive test tries every candidate divisor, but divisors come in pairs `d * q == n`, and the
smaller one of each pair is never larger than the square root of `n`. Stopping the loop there
turns a billion iterations into about thirty thousand.
'''
instructions = '''
## Your turn

Implement the function `is_prime`:

```python
def is_prime(n: int) -> bool: ...
```

It returns `True` if `n` is a prime number and `False` otherwise. Numbers below 2 (including
0, 1 and every negative number) are not prime.

Examples:

- `is_prime(2)` → `True`
- `is_prime(91)` → `False` (91 = 7 × 13)
- `is_prime(1)` → `False`

**Performance:** the tests include numbers around one billion, which must be answered in well
under a second. Trying every divisor up to `n` is far too slow; think about when you can stop
looking. Use only loops and arithmetic (no libraries needed).

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
def is_prime(n: int) -> bool:
    """Return True if n is a prime number, False otherwise."""
    raise NotImplementedError
'''
tests = '''
def _slow_is_prime(n):
    if n < 2:
        return False
    for d in range(2, n):
        if n % d == 0:
            return False
    return True


class TestIsPrime(unittest.TestCase):
    def test_small_primes(self):
        for p in (2, 3, 5, 7, 11, 13, 97):
            self.assertIs(is_prime(p), True, p)

    def test_small_composites(self):
        for c in (4, 6, 8, 9, 15, 21, 91, 100):
            self.assertIs(is_prime(c), False, c)

    def test_zero_one_and_negatives(self):
        for n in (0, 1, -1, -2, -7, -13):
            self.assertIs(is_prime(n), False, n)

    def test_squares_of_primes(self):
        for n in (4, 25, 49, 121, 169, 961, 10201):
            self.assertIs(is_prime(n), False, n)

    def test_matches_brute_force_up_to_500(self):
        for n in range(-5, 500):
            self.assertEqual(is_prime(n), _slow_is_prime(n), n)

    def test_large_prime(self):
        self.assertIs(is_prime(1_000_000_007), True)
        self.assertIs(is_prime(999_999_937), True)

    def test_large_composites(self):
        self.assertIs(is_prime(1_000_000_001), False)
        self.assertIs(is_prime(999_999_929 * 3), False)
        self.assertIs(is_prime(31_607 * 31_607), False)
'''

[unit.step.gabarito]
solution = '''
def is_prime(n: int) -> bool:
    """Return True if n is a prime number, False otherwise."""
    if n < 2:
        return False
    d = 2
    while d * d <= n:
        if n % d == 0:
            return False
        d += 1
    return True
'''
time = "O(√n)"
space = "O(1)"
justification = '''
If `n` has a divisor `d` with `d * q == n`, then `d` and `q` cannot both be larger than
`√n`, or their product would exceed `n`. So if no divisor exists up to `√n`, none exists at
all, and the loop can stop as soon as `d * d > n`. In the worst case (when `n` is prime) the
loop runs about `√n` times, each iteration doing a constant amount of arithmetic, so the time
is **O(√n)**: about 31,623 iterations for `n` near one billion, instead of a billion for the
naive version. A composite number usually exits much earlier, at its smallest divisor. Only
`n` and `d` are stored, so the space is **O(1)**. (Testing `d * d <= n` instead of computing
a square root avoids floating-point rounding issues altogether.)
'''

# ---------------------------------------------------------------------------
# Unit 6 — Functions
# ---------------------------------------------------------------------------
[[unit]]
id = "py-u06-functions"
title = "Functions"
level = "basic"
difficulty = 6
intro = '''
Functions let you name a piece of logic, give it inputs, and reuse it anywhere. This unit
covers `def` and `return`, default values, keyword arguments, variable numbers of arguments
with `*args` and `**kwargs`, and returning several values at once as a tuple. The unit ends
with a function that summarises any number of values in one call.
'''
concepts = '''
## The idea

As programs grow, the same steps appear again and again. A **function** packages those
steps under a name. You define it once and **call** it as often as you like, each time with
different inputs, called **arguments**. A function can hand a result back to its caller with
`return`. Functions are the basic unit of reuse and of testing: a function that takes inputs
and returns outputs, without printing or changing anything else, is easy to reason about and
easy to check, which is exactly what the hidden tests in every challenge do.

## How Python does it

`def` starts a definition: the name, the **parameters** in parentheses, a colon, and an
indented body. The first line of the body may be a **docstring** describing the function.

```python
def bmi_category(value):
    """Describe a body-mass-index value in one word."""
    if value < 18.5:
        return "low"
    return "normal or above"
```

Parameters can have **default values**, which are used when the caller leaves them out.
Callers may pass arguments by position or by name (**keyword arguments**), and named
arguments can come in any order.

```python
def power(base, exponent=2):
    return base ** exponent

power(3)                     # 9
power(2, 10)                 # 1024
power(exponent=3, base=2)    # 8
```

A parameter written `*args` collects any extra positional arguments into a **tuple**, and
`**kwargs` collects extra keyword arguments into a **dictionary**. The names are only
convention; the stars do the work. Any parameter that comes after `*args` (or after a bare
`*`) can only be passed by keyword.

To return several values, separate them with commas: `return low, high` builds a tuple, and
the caller can **unpack** it with `low, high = f()`.

## What is special or tricky

- **No `return` means `None`.** A function that only prints returns `None`, so
  `x = show()` leaves `x` as `None`.
- **`return` ends the function immediately.** Code after it in the same branch never runs.
- **Parameters are local.** Variables created inside a function disappear when it returns
  and cannot be seen from outside.
- **Never use a mutable default.** `def add(item, bucket=[])` shares one list between all
  calls; use `bucket=None` and create the list inside.
- **Order of parameters.** Regular parameters first, then `*args`, then keyword-only ones,
  then `**kwargs`. Required parameters must come before those with defaults.
- **Defining is not calling.** `def` only creates the function; nothing in its body runs
  until you call it with parentheses.

## What you will practise

You will define functions with defaults and keyword arguments, collect arguments with `*`
