class Shape(ABC):
    @abstractmethod
    def area(self) -> float: ...

class Square(Shape):
    def __init__(self, side):
        self.side = side

    def area(self):
        return self.side ** 2

@runtime_checkable
class HasArea(Protocol):
    def area(self) -> float: ...

class Circle:
    def area(self):
        return round(3.14159 * 2 ** 2, 2)

try:
    Shape()
except TypeError as err:
    print("TypeError:", err)
for item in (Square(3), Circle()):
    print(type(item).__name__, item.area(), isinstance(item, Shape), isinstance(item, HasArea))
'''
