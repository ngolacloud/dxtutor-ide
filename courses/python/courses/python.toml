entry = "mask_card"
run_command = "python3 -m unittest"
intro = '''
Receipts and screens never show a full card number: they hide all but the last four digits.
Your function cleans the text, measures it, and builds a new string from a repeated mask
character and a slice. Because strings are immutable, the answer is always a fresh string
assembled from pieces.
