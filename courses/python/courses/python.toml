[unit.step.gabarito]
solution = '''
def edit_distance(a: str, b: str) -> int:
    """Return the fewest insertions, deletions and substitutions turning a into b."""
    if len(a) < len(b):
        a, b = b, a  # the distance is symmetric; keep the rows short
    previous = list(range(len(b) + 1))
    for i, ca in enumerate(a, start=1):
        current = [i] + [0] * len(b)
        for j, cb in enumerate(b, start=1):
            current[j] = min(
                previous[j] + 1,               # delete ca
                current[j - 1] + 1,            # insert cb
                previous[j - 1] + (ca != cb),  # substitute, or keep a match for free
            )
        previous = current
    return previous[-1]
'''
time = "O(len(a) * len(b))"
space = "O(min(len(a), len(b)))"
justification = '''
There is one subproblem per pair of prefix lengths, `(len(a) + 1) × (len(b) + 1)` of them,
and each is filled in O(1) from three neighbours: the cell above (delete), the cell to the
left (insert) and the diagonal (substitute, free when the characters match). That gives
**O(len(a) · len(b))** time, about a million cheap steps for two 1,000-character strings,
while naive recursion branches three ways at every step and is exponential.

Row `i` depends only on row `i − 1`, so the solution keeps two rows instead of the whole
table. Swapping the strings so that `b` is the shorter one makes each row
`min(len(a), len(b)) + 1` long, which gives **O(min(len(a), len(b)))** space. The base cases
are the first row (`j` insertions turn an empty prefix into `b[:j]`) and the first column
(`i` deletions). Filling the table bottom-up also avoids the recursion limit that a memoised
top-down version would hit, since its call chain can be about `len(a) + len(b)` deep.
'''
