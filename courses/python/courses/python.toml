[unit.step.gabarito]
solution = '''
def sort_and_count(items: list[int]) -> tuple[list[int], int]:
    """Return (a new sorted copy of items, the number of inversions in items)."""

    def solve(a: list[int]) -> tuple[list[int], int]:
        if len(a) <= 1:
            return list(a), 0
        mid = len(a) // 2
        left, inv_left = solve(a[:mid])
        right, inv_right = solve(a[mid:])
        merged: list[int] = []
        inversions = inv_left + inv_right
        i = j = 0
        while i < len(left) and j < len(right):
            if left[i] <= right[j]:
                merged.append(left[i])
                i += 1
            else:
                merged.append(right[j])
                j += 1
                inversions += len(left) - i
        merged.extend(left[i:])
        merged.extend(right[j:])
        return merged, inversions

    return solve(list(items))
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
This is merge sort with one extra line. The recursion splits the list in half about log₂ n
times, and each level of the recursion merges n items in total, so the time is
**O(n log n)**, for random and reversed input alike. A brute-force double loop would examine
n(n−1)/2 ≈ 5·10⁹ pairs for 100,000 items.

The counting is correct because every inversion is of exactly one kind: both items in the
left half, both in the right half (counted by the recursive calls), or one in each. When the
merge takes `right[j]` because it is strictly smaller than `left[i]`, it is also smaller than
every remaining item `left[i:]`, since the left half is sorted. Each of those `len(left) - i`
items precedes `right[j]` in the original order, so each forms one inversion, and adding them
in one step keeps the merge linear. Using `<=` sends ties to the left, so equal items are
never counted.

Space is **O(n)**: the merged lists at any moment hold O(n) items, and the recursion is only
O(log n) deep. The slices allocate O(n log n) memory over the whole run, but at most O(n) is
alive at once.
'''

[[unit]]
id = "py-u28-recursion-dp"
title = "Recursion and dynamic programming"
level = "advanced"
difficulty = 34
intro = '''
Recursion solves a problem by solving smaller copies of itself, and dynamic programming makes
that fast when the same copies come up again and again. You will recurse over nested data,
count how much work naive Fibonacci wastes compared with a memo, fill a two-dimensional table
bottom-up, and finish by computing the edit distance between two strings.
'''
concepts = '''
## The idea

**Recursion** solves a problem by reducing it to smaller instances of the same problem. Every recursive definition needs a **base case** that is answered directly and a **recursive case** that moves towards it. At run time each pending call occupies a **stack frame**, so recursion depth costs memory.

Some recursions repeat themselves. Naive Fibonacci computes `fib(n - 2)` from two different branches, and the repetition compounds into exponential time, about O(1.6ⁿ). **Dynamic programming** (DP) applies when a problem has two properties:

- **overlapping subproblems**: the same smaller question is asked again and again;
- **optimal substructure**: the best answer is built from the best answers to smaller questions.

DP solves each subproblem **once** and stores the answer. There are two styles:

- **Top-down memoisation** keeps the recursion but caches results, checking the cache before computing.
- **Bottom-up tabulation** fills a table from the smallest subproblems upward, with no recursion at all.

The recipe is always the same: define the subproblem in words ("the answer for the first *i* items"), write the **recurrence** that builds it from smaller ones, fix the base cases, and choose an evaluation order in which every dependency is ready. The cost is the number of subproblems times the work per subproblem.

## How Python does it

Recursion is ordinary function calls, with one catch: CPython limits the depth (1000 frames by default) and raises `RecursionError: maximum recursion depth exceeded` beyond it. `sys.setrecursionlimit` can raise the limit, but very deep recursion can then crash the interpreter itself. Python does no tail-call optimisation, so for deep problems a bottom-up loop is the robust choice.

For memoisation, use a dict or the `functools.cache` decorator:

```python
from functools import cache

@cache
def paths(r, c):
    if r == 0 or c == 0:
        return 1
    return paths(r - 1, c) + paths(r, c - 1)

print(paths(2, 2))   # 6
```

Arguments of a cached function must be hashable, so pass tuples, not lists. For tables, build every row separately:

```python
rows, cols = 3, 4
table = [[0] * cols for _ in range(rows)]
```

Python's ints have arbitrary precision, so `fib(1000)` is exact and never overflows. Huge numbers just make arithmetic slower.

## What is special or tricky

- **`[[0] * cols] * rows` is a trap.** It repeats one inner list `rows` times, so writing `table[0][0]` changes every row.
- **A missing or unreachable base case** recurses until `RecursionError`.
- **Mutable default arguments as a memo** (`def f(n, memo={})`) are shared by every call. That works by accident and surprises you later. Pass the memo explicitly, or use `@cache`.
- **`@cache` keeps every result forever.** On large inputs that costs memory; `paths.cache_clear()` empties it.
- **Top-down DP on long inputs** can hit the recursion limit even though the number of subproblems is small. Bottom-up avoids that.
- **Rolling rows.** When each row of a table depends only on the previous row, keep two rows: O(cols) space instead of O(rows × cols).

## What you will practise

You will recurse over nested lists, count the calls made by naive and memoised Fibonacci, and fill a grid table bottom-up. The challenge asks for the edit distance between two strings of up to 1,000 characters, too large for naive recursion and too deep for top-down recursion with the default limit.
'''

[[unit.step]]
kind = "concept"
id = "py-u28-c1-recursion-memo"
title = "Base cases, overlap and the memo"
points = 5
difficulty = 34
intro = '''
A recursive function needs a base case (when to stop) and a recursive case (how to shrink the
problem). When subproblems repeat, storing their answers removes the exponential blow-up;
that is all dynamic programming is.
'''
body = '''
## Recursion

A base case plus a smaller call:

```python
def fact(n):
    if n <= 1:
        return 1            # base case
    return n * fact(n - 1)  # recursive case
```

## The overlap problem

Naive Fibonacci asks the same questions over and over:

```python
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)
```

`fib(5)` calls `fib(3)` twice and `fib(2)` three times. The call tree roughly doubles at
every level, so the work grows exponentially even though there are only n + 1 different
questions.

## Memoisation (top-down)

Keep the recursion and remember each answer the first time it is computed:

```python
def fib(n, memo):
    if n < 2:
        return n
    if n not in memo:
        memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
    return memo[n]
```

Now each `fib(k)` is computed once: O(n) time.

## Tabulation (bottom-up)

Fill a list from the smallest case upward, so every value needed is already there:

```python
dp = [0, 1] + [0] * (n - 1)
for i in range(2, n + 1):
    dp[i] = dp[i - 1] + dp[i - 2]
```

No recursion means no recursion limit. The general recipe: define the subproblem, write the
recurrence, set the base cases, and fill the table in an order where every dependency comes
first.
'''

