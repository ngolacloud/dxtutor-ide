[[unit]]
id = "py-u08-dicts-sets"
title = "Dicts & sets"
level = "intermediate"
difficulty = 8
intro = '''
Lists find things by position; dictionaries find things by **key**, and they do it in
constant time on average, thanks to hashing. Sets use the same machinery to answer "have I
seen this before?" instantly. This unit covers creating and reading dicts, counting and
grouping, set algebra and membership, and ends with a function that groups anagrams.
'''
concepts = '''
## The idea

Searching a list for a value means looking at the elements one by one, which is O(n). A
**hash table** does better. It runs each key through a **hash function** that turns it into a
number, and uses that number to pick a slot in an internal array. Looking a key up means
hashing it again and going straight to its slot, so lookups, inserts and deletes take O(1) time
on average. Two keys can land in the same slot (a **collision**); the table resolves that
internally and grows when it gets too full, so the average cost stays constant.

A **dictionary** maps keys to values. A **set** is the same structure with keys only: it
stores unique elements and answers membership questions quickly. The price is that keys must
be **hashable**: their hash can never change. Numbers, strings and tuples of hashable values
qualify; lists, dicts and sets do not, because they can change.

## How Python does it

```python
ages = {"ana": 31, "rui": 27}   # a dict literal
ages["eva"] = 22                # insert or overwrite
print(ages["ana"])              # 31; a missing key raises KeyError
print(ages.get("zeca"))         # None instead of an error
print(ages.get("zeca", 0))      # or a default of your choice
print("rui" in ages)            # membership tests the keys: True

for name, age in ages.items():  # keys, values and items are views
    print(name, age)
```

Since Python 3.7, a dict **remembers insertion order**, so iterating over it is
deterministic. `setdefault(key, default)` returns the value for `key`, inserting `default`
first if the key is missing, which is handy when each value is a list you keep appending to.
`collections.Counter` is a dict subclass made for counting, and `collections.defaultdict`
creates missing values for you.

Sets use braces without colons, or `set(iterable)`:

```python
tags = {"python", "sql"}
tags.add("git")
print(len(set([1, 1, 2, 3, 3])))   # 3: duplicates collapse
print({1, 2} | {2, 3}, {1, 2} & {2, 3}, {1, 2} - {2, 3})
```

`|` is union, `&` intersection, `-` difference and `^` symmetric difference.

## Pitfalls

- `{}` is an empty **dict**, not an empty set. Write `set()` for an empty set.
- `d[key]` raises `KeyError` for a missing key; use `get` or `in` when absence is normal.
- Sets have no order you can rely on, and the order of strings can change between runs.
  Sort a set before printing it if you need stable output.
- You cannot use a list as a key or put it in a set. Convert it to a tuple first.
- Changing a dict's size while you loop over it raises `RuntimeError`; loop over
  `list(d)` if you must delete.

## What you will practise

You will read and update an inventory, count words with `get`, group with `setdefault`, and
combine sets. The challenge asks you to group words that are anagrams of each other.
'''

[[unit.step]]
kind = "concept"
id = "py-u08-c1-hashing"
title = "Dicts and sets: lookup by hash"
points = 5
difficulty = 8
intro = '''
A hash table turns a key into an array index with a hash function, so finding a key does not
depend on how many keys there are: O(1) on average. Python's `dict` and `set` are both hash
tables, and they are behind much of the language itself.
'''
body = '''
## Dictionaries map keys to values

```python
prices = {"tea": 2, "cake": 5}
prices["coffee"] = 3          # add a new key
prices["tea"] += 1            # update an existing one
print(prices.get("juice", 0)) # 0: a safe read with a default
del prices["cake"]            # remove a key
```

Reading `prices["juice"]` would raise `KeyError`; `get` returns `None` or the default you
pass. The `in` operator checks the **keys**, in constant time. Loop over `prices.items()` to
get `(key, value)` pairs, in the order the keys were inserted.

## Counting and grouping

Two patterns appear constantly. **Counting**: `counts[x] = counts.get(x, 0) + 1` adds one to
a key's tally, starting from zero. **Grouping**: `groups.setdefault(key, []).append(item)`
creates an empty list the first time a key appears and appends to it every time. The key can
be anything you compute from the item, such as its first letter or its length.

## Sets keep unique elements

```python
seen = set()
seen.add("home")
seen.add("home")              # no effect: already present
print("home" in seen)         # True, in O(1) on average
```

A set is ideal for removing duplicates and for fast membership tests. The operators `|`,
`&`, `-` and `^` compute union, intersection, difference and symmetric difference.

## Keys must be hashable

Strings, numbers and tuples can be keys; lists cannot, because a key whose contents change
would end up in the wrong slot.
'''

