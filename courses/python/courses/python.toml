[[unit]]
id = "py-u05-loops"
title = "Loops: for, range and while"
level = "basic"
difficulty = 5
intro = '''
Computers shine at repetition: doing the same steps a thousand times without getting bored
or making mistakes. This unit covers the `for` loop over sequences and `range`, the
`while` loop, `break` and `continue`, and the helpers `enumerate` and `zip`. The unit ends
with a classic algorithm, testing whether a number is prime, where choosing when to stop
the loop is the whole trick.
'''
concepts = '''
## The idea

A **loop** repeats a block of code. There are two basic shapes. **Definite** iteration goes
through a known collection of items, one at a time: every letter of a word, every number
from 1 to 100. **Indefinite** iteration repeats while some condition stays true, when you
cannot know in advance how many rounds it will take. Each round is called an **iteration**,
and the number of iterations is usually what decides how long a program takes to run.

## How Python does it

The `for` loop walks over any **iterable** (a string, a list, a range...) and binds a
variable to each item in turn:

```python
for letter in "abc":
    print(letter)
```

`range(stop)` produces the integers `0, 1, ..., stop - 1`. `range(start, stop)` starts
elsewhere, and `range(start, stop, step)` skips or counts down. The stop value is always
excluded, just like in a slice.

The `while` loop checks its condition before every iteration and stops when it becomes
false. Something inside the body must eventually make it false.

```python
n = 1
while n < 100:
    n = n * 2
print(n)   # 128
```

Two statements change the flow inside any loop: `break` leaves the loop immediately, and
`continue` skips the rest of the current iteration and moves on to the next one.

Two built-ins make `for` loops tidier. `enumerate(items)` gives you `(index, item)` pairs,
so you never need a manual counter, and `zip(a, b)` walks two sequences side by side.

```python
for i, colour in enumerate(["red", "green"], start=1):
    print(i, colour)    # 1 red, then 2 green
```

## What is special or tricky

- **Off-by-one errors.** `range(1, 10)` stops at 9. If you need 10, write `range(1, 11)`.
- **Infinite loops.** A `while` whose condition never becomes false runs forever. Make sure
  every iteration moves towards the exit; press Ctrl+C to stop a runaway script.
- **Augmented assignment.** `total += n` is shorthand for `total = total + n`. Python has no
  `++` operator.
- **`zip` stops at the shortest input.** Extra items in the longer sequence are silently
  ignored.
- **Loops can have `else`.** A `for` or `while` may end with an `else:` block that runs only
  if the loop finished *without* hitting `break`. It is useful for searches, but rare.
- **Don't modify a list while looping over it.** Build a new one instead (unit 9 shows the
  idiomatic way).

## What you will practise

You will add numbers with `for` and `range`, follow a `while` loop until a sequence reaches
1, skip and stop with `continue` and `break`, and pair items with `enumerate` and `zip`. The
challenge asks you to decide primality efficiently, which means thinking about where a loop
can stop early.
'''

[[unit.step]]
kind = "concept"
id = "py-u05-c1-iteration"
title = "Repeating with for and while"
points = 5
difficulty = 5
intro = '''
A loop is how a finite program performs an amount of work that depends on its input. In
algorithm analysis we usually count loop iterations: a loop that runs once per item is
**linear**, O(n), and a loop that can stop early may do far less work than its worst case.
'''
body = '''
## for: one iteration per item

```python
total = 0
for n in range(1, 4):
    total += n
    print(n, total)
```

The loop runs three times. `n` is bound to `1`, then `2`, then `3`, and each time the
indented body runs. After the last item the loop ends and the program continues below it.
The output is `1 1`, `2 3` and `3 6`.

`range` never builds the numbers in advance; it hands them out one at a time, so
`range(1_000_000)` costs no extra memory.

## while: repeat until a condition fails

```python
count = 3
while count > 0:
    print(count)
    count -= 1
print("lift-off")
```

Before each iteration Python tests `count > 0`. The body decrements `count`, so after three
rounds the test fails and the loop ends. Forget the `count -= 1` and the loop never stops.

## break and continue

```python
for word in ["ok", "skip", "ok", "stop", "never"]:
    if word == "skip":
        continue
    if word == "stop":
        break
    print(word)
```

This prints `ok` twice: `continue` jumps to the next word, and `break` leaves the loop for
good, so `"never"` is never reached.

## Which loop?

Use `for` when you are walking through items or a known range of numbers. Use `while` when
the number of iterations depends on something you discover along the way.
'''

