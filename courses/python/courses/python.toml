[[unit]]
id = "py-u11-files"
title = "Files & context managers"
level = "intermediate"
difficulty = 11
intro = '''
Everything a program computes is lost when it exits, unless it is written somewhere that
lasts. Files are the simplest such place. This unit covers opening, reading and writing text
files safely with `with`, navigating paths with `pathlib`, and reading and writing CSV, and
ends with a function that summarises one CSV file into another.
'''
concepts = '''
## The idea

A **file** is a named sequence of bytes kept by the operating system. To use one, a program
asks the OS to **open** it and receives a **file handle**, a small resource the OS tracks on
its behalf. Handles are limited, and data you write is often held in a memory **buffer** and
only reaches the disk when the buffer is **flushed**, which happens at the latest when the
file is **closed**. Forgetting to close a file can therefore leak handles or lose data.

Text adds one more layer. Bytes become characters through an **encoding**; UTF-8 is the
modern default and handles any language. Lines end with `\n` on Linux and macOS and `\r\n`
on Windows, and Python translates these for you in text mode.

The general pattern "acquire a resource, use it, always release it" is what a **context
manager** captures. It guarantees the release step runs, even if an exception interrupts the
work in between.

## How Python does it

`open(path, mode, encoding=...)` returns a file object. The mode says what you intend: `"r"`
reads (the default), `"w"` writes and **truncates** the file first, `"a"` appends to the end,
and `"x"` creates a new file and fails if it already exists. The `with` statement closes the
file for you when the block ends, however it ends:

```python
with open("log.txt", "a", encoding="utf-8") as f:
    f.write("started\n")       # write() does not add a newline
# here the file is closed, even if write() had raised
```

A file object is an **iterator over its lines**, so `for line in f:` reads one line at a
time without loading the whole file. Each line keeps its trailing `\n`. `f.read()` returns
everything as one string.

`pathlib.Path` models paths as objects. The `/` operator joins parts, and methods such as
`exists()`, `mkdir()`, `glob()`, `read_text()` and `write_text()` cover common tasks in one
call. `.name`, `.stem`, `.suffix` and `.parent` pick a path apart.

For tabular data, the `csv` module handles quoting, so a field such as `"Porto, PT"` with a
comma inside survives the round trip. `csv.writer` writes rows, and `csv.DictReader` reads
each row as a dict keyed by the header line. Every value comes back as a string.

## Pitfalls

- Opening with `"w"` erases the existing content immediately. Use `"a"` to add.
- Always pass `encoding="utf-8"`; otherwise the default depends on the machine.
- Open CSV files with `newline=""`, as the `csv` documentation requires, or you may get blank
  rows on some systems.
- Splitting CSV lines on `","` by hand breaks on quoted fields. Use the `csv` module.
- Do not hard-code paths like `/tmp/x`. The `tempfile` module creates scratch files and
  directories safely and removes them afterwards.

## What you will practise

You will write, append and read a text file in a temporary directory, explore files with
`pathlib`, and round-trip a CSV file. The challenge asks you to total a CSV by category.
'''

[[unit.step]]
kind = "concept"
id = "py-u11-c1-files"
title = "Files, paths and with"
points = 5
difficulty = 11
intro = '''
An open file is an operating-system resource with a buffer in front of it, so it must be
closed to release the handle and flush the data. A context manager pairs every acquisition
with a guaranteed release, which is exactly what the `with` statement provides.
'''
body = '''
## Open, use, close: with

```python
with open(path, "w", encoding="utf-8") as f:
    f.write("one\n")
    print("two", file=f)     # print can target a file too
# f is closed here
```

`with` calls the object's `__enter__` method at the start and its `__exit__` method at the
end of the block, whether the block finishes normally, returns early or raises. For a file,
`__exit__` flushes and closes it. You will find the same pattern on locks, database
connections and temporary directories.

## Modes

| mode | meaning |
|---|---|
| `"r"` | read (default); the file must exist |
| `"w"` | write; creates the file or **empties** it first |
| `"a"` | append to the end; creates the file if needed |
| `"x"` | create; fails if the file already exists |

## Reading

`for line in f:` reads lazily, one line at a time, each ending with `\n`.
`f.read()` returns the whole content; `f.readlines()` returns a list of lines.

## pathlib

`Path(tmp) / "notes.txt"` builds a path with `/`. `p.write_text(s)` and `p.read_text()` open,
use and close the file in one call; `p.exists()`, `p.mkdir()` and `p.glob("*.log")` ask the
file system questions.

## Scratch space

`tempfile.TemporaryDirectory()` is itself a context manager: it creates a fresh directory
and deletes it, with everything inside, when the `with` block ends. Use it for experiments and
tests so you never touch real files.
'''

