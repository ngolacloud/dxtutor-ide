[[unit]]
id = "py-u10-exceptions"
title = "Exceptions"
level = "intermediate"
difficulty = 10
intro = '''
Things go wrong: files go missing, users type letters where numbers belong, networks drop.
Python reports these situations with **exceptions**, objects that interrupt normal flow and
travel up the call stack until something handles them. This unit covers `try`, `except`,
`else` and `finally`, raising your own errors, chaining them, and defining custom exception
classes, and ends with a settings parser that reports exactly what is wrong.
'''
concepts = '''
## The idea

A function can fail in two broad ways. It can return a special value such as `None` or `-1`,
and trust every caller to check it. Or it can **raise an exception**: stop immediately and
hand an error object to whoever is prepared to deal with it. Exceptions cannot be silently
ignored, and they separate the normal path of the code from the error path.

When an exception is raised, Python **unwinds the call stack**: it abandons the current
function, then its caller, and so on, until it finds a matching handler. If none exists, the
program stops and prints a **traceback**, the list of calls that led to the error. Python
leans on this heavily; its style is often called **EAFP**, "easier to ask forgiveness than
permission": try the operation and handle the failure, instead of checking every condition
first.

## How Python does it

```python
try:
    number = int(text)
except ValueError as err:   # runs only if int() raised ValueError
    print("not a number:", err)
else:                       # runs only if the try block raised nothing
    print("got", number)
finally:                    # always runs, error or not
    print("checked", text)
```

`except` clauses are tried top to bottom, and each matches its class **and every subclass**.
Several types can share one clause: `except (KeyError, IndexError):`.

You raise an exception with `raise`, passing an instance (or a class) of an exception type:

```python
if age < 0:
    raise ValueError(f"age cannot be negative: {age}")
```

Inside a handler, a bare `raise` re-raises the current exception. `raise NewError(...) from
err` raises a different exception while recording the original as its `__cause__`, so the
traceback tells the whole story.

All ordinary exceptions derive from `Exception`. Built-in ones form a hierarchy: `KeyError`
and `IndexError` are both `LookupError`s, for example. You create your own by subclassing:

```python
class PaymentError(Exception):
    """Base class for payment problems."""
```

A custom class can add attributes, such as an error code, so handlers can react precisely.

## Pitfalls

- A bare `except:` or a broad `except Exception:` also catches bugs such as `NameError`,
  hiding them. Catch the narrowest type you can actually handle.
- Keep the `try` block small, so you know which line the handler is about.
- `finally` runs even when the `try` block executes `return`, and it is the place for
  cleanup that must always happen.
- Order matters: put specific classes before their base classes, or the specific handler
  never runs.
- Do not use exceptions for ordinary control flow you could test cheaply.

## What you will practise

You will follow `try`/`except`/`else`/`finally` through success and failure, raise and chain
errors, and build a small exception hierarchy. The challenge asks you to parse settings text
and raise a precise custom error.
'''

[[unit.step]]
kind = "concept"
id = "py-u10-c1-exceptions"
title = "Raising and handling exceptions"
points = 5
difficulty = 10
intro = '''
An exception is a non-local exit: raising one abandons the current function and unwinds the
call stack frame by frame until a matching `except` clause catches it. Handlers are matched
by class, so exception hierarchies let code catch broad or narrow families of errors.
'''
body = '''
## The four clauses

```python
try:
    value = data[key]
except KeyError:
    value = default
else:
    print("found it")
finally:
    print("lookup finished")
```

- **`try`** wraps the code that might fail. Keep it short.
- **`except SomeError`** runs when that error, or a subclass of it, is raised. Add
  `as err` to get the exception object and its message.
- **`else`** runs only when the `try` block finished without an exception. Code here is not
  protected by the handlers, which keeps them precise.
- **`finally`** always runs: after success, after a handled error, even after a `return` or
  an unhandled error. It is where cleanup belongs.

## Raising

`raise ValueError("message")` creates an exception object and throws it. Pick the built-in
type that matches the problem: `ValueError` for a bad value, `TypeError` for a wrong type,
`KeyError` for a missing key. Inside an `except` block, a bare `raise` re-raises the same
exception after, say, logging it. `raise AppError("...") from err` translates a low-level
error into one that makes sense to your caller and keeps the original as `__cause__`.

## Custom exceptions

```python
class InventoryError(Exception):
    pass

class OutOfStock(InventoryError):
    pass
```

Subclassing `Exception` gives your module its own vocabulary of failures. Callers can catch
`OutOfStock` specifically, or every `InventoryError` at once. Override `__init__` to store
extra details as attributes.
'''

