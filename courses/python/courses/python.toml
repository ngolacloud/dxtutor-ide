entry = "transpose"
run_command = "python3 -m unittest"
intro = '''
A matrix stored as a list of rows is **row-major**: reading along a row is easy, reading down
a column is not. Transposing swaps the roles, so element `(r, c)` moves to `(c, r)` and an
R × C matrix becomes C × R. A nested comprehension can describe the new rows directly.
'''
instructions = '''
## Your turn

Implement the function `transpose`:

```python
def transpose(matrix: list[list[int]]) -> list[list[int]]: ...
```

`matrix` is a list of rows, and every row has the same length. Return a **new** matrix whose
rows are the columns of `matrix`: the element at `matrix[r][c]` must end up at
`result[c][r]`. The result must be a list of **lists** (not tuples), and `matrix` must not be
modified. An empty matrix, or a matrix whose rows are empty, transposes to `[]`.

Examples:

- `transpose([[1, 2, 3], [4, 5, 6]])` → `[[1, 4], [2, 5], [3, 6]]`
- `transpose([[7], [8], [9]])` → `[[7, 8, 9]]`
- `transpose([])` → `[]`

**Hint:** the outer comprehension walks over column indices; the inner one picks that
column's value out of every row.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
def transpose(matrix: list[list[int]]) -> list[list[int]]:
    """Return a new matrix whose rows are the columns of matrix."""
    raise NotImplementedError
'''
tests = '''
class TransposeTest(unittest.TestCase):
    def test_rectangular(self):
        self.assertEqual(transpose([[1, 2, 3], [4, 5, 6]]), [[1, 4], [2, 5], [3, 6]])

    def test_square(self):
        self.assertEqual(transpose([[1, 2], [3, 4]]), [[1, 3], [2, 4]])

    def test_single_column_and_single_row(self):
        self.assertEqual(transpose([[7], [8], [9]]), [[7, 8, 9]])
        self.assertEqual(transpose([[7, 8, 9]]), [[7], [8], [9]])

    def test_empty(self):
        self.assertEqual(transpose([]), [])
        self.assertEqual(transpose([[], []]), [])

    def test_returns_lists_not_tuples(self):
        result = transpose([[1, 2], [3, 4]])
        self.assertTrue(all(type(row) is list for row in result))

    def test_input_not_modified_and_rows_independent(self):
        matrix = [[1, 2], [3, 4], [5, 6]]
        result = transpose(matrix)
        self.assertEqual(matrix, [[1, 2], [3, 4], [5, 6]])
        result[0][0] = 99
        self.assertEqual(result[1], [2, 4, 6])
        self.assertEqual(matrix[0][0], 1)

    def test_negatives(self):
        self.assertEqual(transpose([[-1, 0], [0, -1]]), [[-1, 0], [0, -1]])

    def test_large(self):
        rows, cols = 300, 200
        matrix = [[r * cols + c for c in range(cols)] for r in range(rows)]
        result = transpose(matrix)
        self.assertEqual(len(result), cols)
        self.assertEqual(len(result[0]), rows)
        self.assertEqual(result[199][299], matrix[299][199])
        self.assertEqual(result[5][7], matrix[7][5])
'''

[unit.step.gabarito]
solution = '''
def transpose(matrix: list[list[int]]) -> list[list[int]]:
    """Return a new matrix whose rows are the columns of matrix."""
    if not matrix:
        return []
    return [[row[c] for row in matrix] for c in range(len(matrix[0]))]
'''
time = "O(R · C)"
space = "O(R · C)"
justification = '''
For an R × C matrix, the outer comprehension runs once per column (C times) and the inner one
reads one value from each of the R rows, so every element is touched exactly once: **O(R · C)**
time. The result holds the same R · C values in C new lists, so the extra space is also
**O(R · C)**; no smaller output is possible, because the answer itself has that many cells.
The guard for an empty matrix is needed because `matrix[0]` does not exist there; a matrix of
empty rows has zero columns, so the outer comprehension produces `[]` on its own.
`zip(*matrix)` is a neat alternative, but it yields tuples, which is why the rows are built
as lists here.
'''

