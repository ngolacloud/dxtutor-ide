- delays `{"a": 0.01, "b": 0.02}`, timeout `0.5` → `{"a": "A", "b": "B"}`
- delays `{"fast": 0.01, "slow": 1.0}`, timeout `0.05` → `{"fast": "FAST", "slow": None}`, after
  about 0.05 seconds rather than 1 second
- `keys = []` → `{}`

The tests run it with `asyncio.run(fetch_all(...))`. The total time must be close to the slowest
single call (capped by the timeout), not the sum of all calls.

**Hint:** write a small inner coroutine that handles one key and turns its `TimeoutError` into
`None`, then run one of those per key at the same time.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
