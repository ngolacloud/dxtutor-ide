[unit.step.gabarito]
solution = '''
import sqlite3


class TransferRejected(Exception):
    """Raised inside the transaction to make `with conn:` roll it back."""


def transfer(conn: sqlite3.Connection, src: int, dst: int, amount: int) -> bool:
    """Move `amount` from account `src` to account `dst` atomically."""
    if amount <= 0 or src == dst:
        return False
    try:
        with conn:
            debit = conn.execute(
                "UPDATE accounts SET balance = balance - ? WHERE id = ? AND balance >= ?",
                (amount, src, amount),
            )
            if debit.rowcount != 1:
                raise TransferRejected("missing source or insufficient funds")
            credit = conn.execute(
                "UPDATE accounts SET balance = balance + ? WHERE id = ?",
                (amount, dst),
            )
            if credit.rowcount != 1:
                raise TransferRejected("missing destination")
    except TransferRejected:
        return False
    return True
'''
time = "O(log n)"
space = "O(1)"
justification = '''
Each `UPDATE` finds its row through the `INTEGER PRIMARY KEY`, a B-tree lookup of
**O(log n)** for **n** accounts, and there are at most two of them, so the transfer costs
**O(log n)**. Only a couple of cursors are kept, so the extra space is **O(1)**.

Correctness comes from the transaction, not from the order of the checks: the debit's
`WHERE balance >= ?` makes the funds check part of the same atomic statement, and a
missing destination is detected through `rowcount` after the debit has already run.
Raising inside `with conn:` turns either failure into a rollback, so the debit can never
be committed on its own.
'''

