intro = '''
A generator is a **coroutine-like** function: it runs in slices between the caller's
requests. Printing from inside the body makes the interleaving visible, showing that
creating the generator runs nothing and each `next()` runs exactly up to the following
`yield`.
'''
prompt = '''
Write a generator that announces what it is doing, then consume it partly with `next()` and
partly with a `for` loop. Watch the order of the lines in the output.

**Why:** seeing the body pause and resume is the clearest way to understand laziness.
'''
target = '''
def numbers(limit):
    print("  start")
    n = 1
    while n <= limit:
        print(f"  yielding {n}")
        yield n
        n += 1
    print("  done")


gen = numbers(3)
print("created", type(gen).__name__)
print("first:", next(gen))
for value in gen:
    print("loop got", value)
print(sum(numbers(2)))
'''
