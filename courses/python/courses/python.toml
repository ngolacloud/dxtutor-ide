[unit.step.gabarito]
solution = '''
from collections import deque
from typing import Callable


def make_moving_average(window: int) -> Callable[[float], float]:
    """Return add(value), which records value and returns the mean of the last `window` values."""
    if window < 1:
        raise ValueError("window must be at least 1")
    recent: deque[float] = deque()
    total = 0.0

    def add(value: float) -> float:
        nonlocal total
        recent.append(value)
        total += value
        if len(recent) > window:
            total -= recent.popleft()
        return total / len(recent)

    return add
'''
time = "O(1) per call"
space = "O(w)"
justification = '''
Let `w` be the window size. Each call does a constant amount of work: one `append`, one
addition, at most one `popleft` and one subtraction (both **O(1)** on a `deque`, unlike
`list.pop(0)`), and one division. So a call is **O(1)** no matter how large the window is,
whereas re-summing would cost **O(w)** per call. The deque never holds more than `w` values
and the running total is one number, so the space is **O(w)**. `total` is a float that gets
rebound, which is why it needs `nonlocal`; the deque is only mutated, so it doesn't.
'''

