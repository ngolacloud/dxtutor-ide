id = "py-udb3-c1-wal"
title = "WAL and one connection per thread"
points = 5
difficulty = 18
intro = '''
WAL is a form of multiversion concurrency control: a reader works from a consistent snapshot
while a writer prepares the next version. Concurrency across threads also needs isolation
