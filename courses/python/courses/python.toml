[unit.step.gabarito]
solution = '''
def group_anagrams(words: list[str]) -> list[list[str]]:
    """Group words that are anagrams of each other."""
    groups: dict[str, list[str]] = {}
    for word in words:
        key = "".join(sorted(word))
        groups.setdefault(key, []).append(word)
    return list(groups.values())
'''
time = "O(n · k log k)"
space = "O(n · k)"
justification = '''
Sorting a word's letters gives a **canonical form**: every rearrangement of the same letters
produces the same string, and a different multiset of letters produces a different one, so
`"ab"` and `"aab"` stay apart. For `n` words of length at most `k`, building each key costs
**O(k log k)**, and the dict lookup and append cost O(k) to hash the key, so the whole pass is
**O(n · k log k)**. The dict stores every word once plus one key per group, so the space is
**O(n · k)**. Because a dict keeps insertion order, `groups.values()` already lists the groups
by their first word, with no extra sorting.
'''

# ─────────────────────────────────────────────────────────────────────────────
# Unit 9 — Comprehensions
# ─────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "py-u09-comprehensions"
title = "Comprehensions"
level = "intermediate"
difficulty = 9
intro = '''
"Build a new collection by transforming and filtering an old one" is so common that Python
gives it its own syntax: the **comprehension**. This unit covers list, dict and set
comprehensions, the `any` and `all` functions, and generator expressions that produce values
lazily instead of storing them. It ends with a matrix transpose written as a comprehension.
'''
concepts = '''
## The idea

Many loops follow the same shape: start with an empty collection, walk over some input, maybe
skip some items, and add a transformed version of each remaining item. Mathematicians write
this as **set-builder notation**: { x² | x ∈ S, x even }, "the squares of the even elements
of S". Python borrows the idea directly. A **comprehension** states *what* the result
contains in one expression, instead of spelling out *how* to build it step by step.

A related idea is **laziness**. Sometimes you do not need all the results at once; you only
need to feed them, one at a time, into something like `sum` or `max`. A **generator** produces
each value on demand and forgets it afterwards, so it uses a constant amount of memory no
matter how many values it yields.

## How Python does it

```python
nums = [1, 2, 3, 4, 5, 6]
evens_squared = [n * n for n in nums if n % 2 == 0]   # [4, 16, 36]
```

Read it as: *the value `n * n`, for each `n` in `nums`, if `n` is even*. The same shape works
with braces for sets and with `key: value` for dicts:

```python
words = ["tea", "coffee", "tea"]
unique = {w for w in words}                 # {'tea', 'coffee'}
lengths = {w: len(w) for w in words}        # {'tea': 3, 'coffee': 6}
grid = [[0] * 3 for _ in range(2)]          # two independent rows
```

Several `for` clauses nest from left to right, like nested loops written in the same order.
An `if` at the end filters; a conditional expression at the front, `a if cond else b`,
chooses a value for every item.

With parentheses instead of brackets you get a **generator expression**, which computes
values only when asked. When it is the only argument of a function, the extra parentheses can
be dropped: `sum(n * n for n in nums)`. `any(...)` returns `True` as soon as one value is
truthy and `all(...)` returns `False` as soon as one is falsy; both stop early
(**short-circuit**), so pairing them with a generator avoids work.

## Pitfalls

- A generator can be consumed **only once**. A second `sum` over the same generator gets
  nothing and returns 0.
- `(x for x in data)` is a generator, not a tuple. Use `tuple(...)` if you want a tuple.
- `any([])` is `False` and `all([])` is `True` ("every element of nothing" is vacuously
  true).
- Comprehensions are for building values. If you only want side effects, such as printing,
  write a plain `for` loop.
- Long comprehensions with several `for` and `if` clauses are hard to read; split them or use
  a loop when clarity suffers.
- The loop variable of a comprehension does not leak into the surrounding code.

## What you will practise

You will rewrite loops as list comprehensions, build dicts and sets the same way, and use
`any`, `all` and generator expressions. The challenge asks you to transpose a matrix.
'''

[[unit.step]]
kind = "concept"
id = "py-u09-c1-comprehensions"
title = "Comprehensions and generator expressions"
points = 5
difficulty = 9
intro = '''
A comprehension is a declarative description of a collection: map an expression over an
iterable and optionally filter it. A generator expression describes the same sequence but
computes it lazily, one value at a time, in O(1) memory.
'''
body = '''
## From loop to comprehension

```python
squares = []
for n in range(5):
    squares.append(n * n)

squares = [n * n for n in range(5)]    # the same list: [0, 1, 4, 9, 16]
```

The comprehension has three parts: the **expression** (`n * n`), the **loop** (`for n in
range(5)`) and an optional **filter** (`if ...`). It always builds a new list and never
changes the input.

## Four shapes

- `[expr for x in it]` builds a **list**.
- `{expr for x in it}` builds a **set**, dropping duplicates.
- `{k: v for x in it}` builds a **dict**.
- `(expr for x in it)` builds a **generator**, which yields values lazily.

`[x for row in matrix for x in row]` contains two loops that run in the order you read them,
outer first. `["big" if n > 9 else "small" for n in nums]` uses a conditional expression to
choose a value for every element instead of filtering.

## Lazy evaluation

A generator does not store its values; it remembers where it stopped and produces the next
value when asked. `sum(n * n for n in range(1_000_000))` adds a million squares without ever
holding a million-element list. The flip side is that a generator is exhausted after one pass.

## any and all

`any(cond for x in it)` answers "is at least one true?" and `all(cond for x in it)` answers
"are they all true?". Both stop at the first item that settles the answer.
'''

