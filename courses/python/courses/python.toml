[unit.step.gabarito]
solution = '''
def summarize(*values: float, digits: int = 2) -> tuple[int, float, float]:
    """Return (count, total, mean rounded to `digits`) for any number of values."""
    count = len(values)
    if count == 0:
        return 0, 0, 0.0
    total = 0
    for value in values:
        total += value
    return count, total, round(total / count, digits)
'''
time = "O(n)"
space = "O(n)"
justification = '''
`len(values)` is **O(1)**, because a tuple stores its length. The loop visits each of the
`n` values once and does one addition per value, so the total costs **O(n)** time; the
division and `round` are constant-time. The extra space is dominated by the `values` tuple
itself: calling a `*args` function packs all `n` arguments into a new tuple, which is
**O(n)**. Apart from that, the function keeps only three numbers. The `count == 0` check is
what keeps the empty call from raising `ZeroDivisionError`. (The built-in `sum(values)` does
the same loop in C and is the idiomatic shortcut.)
'''

