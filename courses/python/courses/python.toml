entry = "retry"
run_command = "python3 -m unittest"
intro = '''
Transient failures (a dropped connection, a busy lock) often go away if you simply try
again. A retry decorator separates that policy from the business logic. It is a decorator
factory whose wrapper loops over attempts, catches only the exceptions it was told to, and
re-raises the last one when it runs out of attempts.
'''
instructions = '''
## Your turn

Network calls, file locks and flaky services fail now and then, and trying again often
works. Write a **decorator factory** `retry` that re-runs a function when it raises.

```python
def retry(times: int, exceptions: tuple[type[BaseException], ...] = (Exception,)) -> Callable: ...
```

Rules:

- `times` is the **total** number of attempts, including the first. If `times < 1`, raise
  `ValueError` as soon as `retry(...)` is called, before any function is decorated.
- Calling the decorated function calls the original with the same positional and keyword
  arguments, and returns its result as soon as one attempt succeeds.
- Only exceptions that are instances of a type in `exceptions` (subclasses included) trigger
  another attempt. Any other exception propagates at once, with no retry.
- If every attempt fails, re-raise the exception from the **last** attempt.
- Each call to the decorated function gets a fresh set of `times` attempts.
- The decorated function keeps the original's `__name__` and `__doc__`.

Examples:

```python
calls = []

@retry(3)
def flaky():
    calls.append(1)
    if len(calls) < 3:
        raise ConnectionError("try again")
    return "ok"

flaky()    # "ok", after 3 attempts
```

- `@retry(2)` on a function that always raises `ValueError` calls it twice, then raises the
  second `ValueError`.
- `@retry(5, exceptions=(KeyError,))` on a function that raises `TypeError` calls it once and
  lets the `TypeError` through.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
