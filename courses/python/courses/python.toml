[[unit]]
id = "py-udb1-connect-query"
title = "Databases: connect & query"
level = "intermediate"
difficulty = 16
intro = '''
Real programs keep their state in a database. Python ships a complete SQL database in its
standard library: the `sqlite3` module. Here you open a database, create a table, insert rows
with `?` placeholders, and read them back with `fetchone`, `fetchall` and a plain `for` loop.
'''
concepts = '''
## The idea

A relational database stores data in **tables**: rows of records that all share the same named columns. You talk to it in **SQL**, a declarative language: you describe *what* you want (`SELECT name FROM users WHERE age > 30`) and the database's query planner decides *how* to get it. Statements come in two families: those that change things and return no rows (`CREATE TABLE`, `INSERT`, `UPDATE`, `DELETE`), and queries that return a **result set** of rows.

SQLite is an **embedded** database: there is no server process. The whole engine is a library inside your program, and a database is a single file or, with the special name `":memory:"`, a scratch database in RAM that disappears when the connection closes.

The most important habit is how values get into SQL. Gluing input into the query text, as in `f"... WHERE name = '{name}'"`, lets the input change the *structure* of the query: a name like `x' OR '1'='1` turns a lookup into "return every row". That is **SQL injection**. A **placeholder** (`?`) fixes the shape of the statement first and sends the values separately, as data that is never parsed as SQL.

## How Python does it

`sqlite3` follows **DB-API 2.0** (PEP 249), the interface every Python database driver shares. `sqlite3.connect(path)` returns a `Connection`. `conn.execute(sql, params)` runs one statement and returns a `Cursor`, an object positioned over the result set. Values for `?` placeholders go in a tuple, in order; named placeholders (`:name`) take a dict. `executemany` runs one statement once per item of a sequence.

```python
import sqlite3

conn = sqlite3.connect(":memory:")
conn.execute("CREATE TABLE books (title TEXT, year INTEGER)")
conn.execute("INSERT INTO books VALUES (?, ?)", ("Dune", 1965))
cur = conn.execute("SELECT title FROM books WHERE year < ?", (2000,))
print(cur.fetchone())   # ('Dune',)
```

A cursor gives rows three ways: `fetchone()` returns the next row or `None`, `fetchall()` returns a list of every remaining row, and iterating the cursor yields rows one at a time. Each row is a tuple unless you set `conn.row_factory = sqlite3.Row`, which also allows access by column name.

## What is special or tricky

- Parameters must be a sequence. `(2000)` is just the integer 2000 and raises `ProgrammingError: parameters are of unsupported type`; write `(2000,)`.
- A bare string *is* a sequence: `execute("... = ?", "Ana")` fails with `Incorrect number of bindings supplied. The current statement uses 1, and there are 3 supplied.`
- `fetchone()` returns `None` when nothing matches, so `row[0]` then raises `TypeError`. Check before you index.
- Placeholders stand for values only. `SELECT * FROM ?` cannot choose a table or a column.
- Without `ORDER BY`, SQL promises no row order at all.
- Writes happen inside a transaction that Python opens for you. Until you call `conn.commit()`, other connections cannot see them; the next unit is about that.

## What you will practise

You will open an in-memory database, insert rows with placeholders, look up a single row, and loop over a result set. The challenge asks you to filter by a value that may contain quotes, safely.
'''

