[[unit]]
id = "py-udb6-indexes"
title = "Indexes & EXPLAIN QUERY PLAN"
level = "intermediate"
difficulty = 21
intro = '''
An index is a sorted copy of some columns that turns a full-table scan into a quick seek.
`EXPLAIN QUERY PLAN` shows the strategy SQLite picked, so you can check that an index is
really used. You will watch a `SCAN` become a `SEARCH`, meet covering and composite indexes,
and design one index that serves two queries.
'''
concepts = '''
## The idea

Without help, the only way to answer `WHERE email = ?` is to read every row and test it: a **full table scan**, **O(n)**. An **index** is an extra data structure, a **B-tree** kept sorted by one or more columns, with each entry pointing back to its row. Finding a key in a B-tree takes **O(log n)**, so with a million rows the database looks at a handful of pages instead of all of them.

Indexes are not free. Every `INSERT`, `UPDATE` and `DELETE` must update each index on the table, and each index takes disk space. You add indexes for the queries that need them, not for every column.

Two refinements matter in practice:

- A **composite index** sorts by several columns, like a phone book sorted by last name, then first name. It helps queries that constrain a **leftmost prefix** of its columns: last name alone, or last and first, but not first name alone.
- A **covering index** contains every column a query needs. SQLite can then answer from the index alone, without visiting the table rows at all.

## How Python does it

You create indexes with ordinary SQL, `CREATE INDEX name ON table (columns)`; `IF NOT EXISTS` makes the statement safe to run twice. To see what the planner will do, prefix a query with `EXPLAIN QUERY PLAN`. The query does not run; you get rows of `(id, parent, notused, detail)`, and the human-readable `detail` text is what you read:

```python
for row in conn.execute("EXPLAIN QUERY PLAN SELECT * FROM t WHERE v = ?", (5,)):
    print(row[3])
```

| detail | meaning |
|---|---|
| `SCAN t` | reads the whole table |
| `SEARCH t USING INDEX idx (v=?)` | seeks in `idx`, then reads matching rows |
| `SEARCH t USING COVERING INDEX idx (v=?)` | seeks in `idx` and needs nothing else |
| `SEARCH t USING INTEGER PRIMARY KEY (rowid=?)` | seeks by the row id itself |
| `SCAN t USING COVERING INDEX idx` | reads the whole index instead of the table |

The last line is a trap: it says "index", but it is still a scan of every entry.

## What is special or tricky

- An `INTEGER PRIMARY KEY` is the table's own B-tree key; it needs no extra index.
- Wrapping the column in a function, as in `WHERE lower(email) = ?`, hides it from a plain index. Store normalised data or create an index on the expression.
- `LIKE '%term'` with a leading wildcard cannot use an ordinary index.
- Column order in a composite index decides which queries it serves.
- On a tiny or empty table the planner may still prefer an index; plans can change after `ANALYZE` gathers statistics. Check plans on realistic data.
- The `detail` text is meant for humans and can change between SQLite versions, so test for key phrases, not whole lines.

## What you will practise

You will see a scan, add an index and see a search, then compare covering and non-covering plans on a composite index. The challenge asks you to design one index that serves two queries.
'''

[[unit.step]]
kind = "concept"
id = "py-udb6-c1-index"
title = "Why indexes matter"
points = 5
difficulty = 21
intro = '''
A B-tree keeps keys sorted in wide, shallow nodes, so even millions of keys are only a few
levels deep. Searching it is O(log n) instead of the O(n) of reading every row, and the
query planner chooses between the two for each query.
'''
body = '''
## Scan versus search

```python
conn.execute("CREATE TABLE users (id INTEGER PRIMARY KEY, email TEXT, name TEXT)")
q = "SELECT name FROM users WHERE email = ?"

conn.execute("EXPLAIN QUERY PLAN " + q, ("a@x",)).fetchall()
# [(2, 0, 0, 'SCAN users')]

conn.execute("CREATE INDEX idx_users_email ON users (email)")
conn.execute("EXPLAIN QUERY PLAN " + q, ("a@x",)).fetchall()
# [(2, 0, 0, 'SEARCH users USING INDEX idx_users_email (email=?)')]
```

- **`SCAN`** means every row is read: cost grows with the table.
- **`SEARCH ... USING INDEX`** means a B-tree seek: cost grows with log n.
- The last column of each plan row, `detail`, is the readable part.

## Composite and covering

An index on `(a, b)` is sorted by `a`, then by `b` within equal `a`. It serves
conditions on `a`, or on `a` and `b`, but not on `b` alone: the leftmost-prefix rule.

When every column a query reads is in the index (the row id always is), SQLite never
touches the table and the plan says **`USING COVERING INDEX`**.

## The cost

Each index is updated on every write and stored on disk. Index the columns your
important queries filter, join or sort on, and confirm with `EXPLAIN QUERY PLAN` that the
planner really uses it.
'''

