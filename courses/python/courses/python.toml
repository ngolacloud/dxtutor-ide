[unit.step.gabarito]
solution = '''
from __future__ import annotations


class Node:
    """A binary search tree node (provided: do not change it)."""

    def __init__(self, key, left: Node | None = None, right: Node | None = None):
        self.key = key
        self.left = left
        self.right = right


def delete(root: Node | None, key) -> Node | None:
    """Remove key from the BST rooted at root and return the new root."""
    if root is None:
        return None
    if key < root.key:
        root.left = delete(root.left, key)
    elif key > root.key:
        root.right = delete(root.right, key)
    else:
        if root.left is None:
            return root.right
        if root.right is None:
            return root.left
        successor = root.right
        while successor.left is not None:
            successor = successor.left
        root.key = successor.key
        root.right = delete(root.right, successor.key)
    return root
'''
time = "O(h), O(log n) on a balanced tree"
space = "O(h)"
justification = '''
The function walks one path from the root down to the node holding `key`, doing constant work
per level, so finding the node costs **O(h)**. In the two-children case it walks further down
the right subtree to the successor and then deletes the successor, which has no left child
and is therefore removed by the cheap one-child splice. Both walks lie on downward paths, so
the total is still **O(h)**. On a random or balanced tree h = O(log n), which is why 20,000
deletions from 100,000 keys finish in a fraction of a second; on a degenerate chain h = n.

Extra space is **O(h)** for the recursion stack (an iterative version with a parent reference
would use O(1)). Returning the subtree root from every call is what makes the root itself
deletable without a special case: the caller reattaches whatever comes back. Copying the
successor's key into the node keeps the tree's shape and order intact, since the successor is
larger than everything on the left and smaller than everything else on the right.
'''

[[unit]]
id = "py-u27-sorting-searching"
title = "Sorting and searching by hand"
level = "advanced"
difficulty = 33
intro = '''
`sorted()` and `bisect` are excellent, but knowing how they work is what lets you reason
about cost and adapt the ideas to new problems. You will write insertion sort, the merge step
that powers merge sort, and a binary search that never goes off by one, then use divide and
conquer to sort a list and count how disordered it was, in O(n log n).
'''
concepts = '''
## The idea

**Sorting** puts items in order; **searching** finds one. The two are linked: once data is sorted, a lookup takes O(log n) steps instead of O(n).

Simple sorts such as insertion, selection and bubble sort compare neighbours or rescan the unsorted part, and cost **O(n²)** comparisons in the worst case. Insertion sort is still useful: it runs in O(n) on nearly sorted input and is fast on tiny lists, which is why Python's own sort uses it for short runs.

**Merge sort** uses **divide and conquer**. Split the list in half, sort each half recursively, then **merge** the two sorted halves by repeatedly taking the smaller front item. There are about log₂ n levels of splitting and each level does O(n) merging work, so merge sort is **O(n log n)** in every case, with O(n) extra space. It is also **stable**: equal items keep their original relative order, provided the merge takes from the left half on ties. Stability matters when you sort records by one field after another.

**Binary search** works on a sorted sequence. Keep an interval that must contain the answer, compare with its middle element, and discard the half that can't hold it. A million items need only about 20 steps.

No comparison sort can beat O(n log n) in the worst case: there are n! possible orderings, and each comparison can at best halve the candidates, so you need about log₂(n!) ≈ n log₂ n comparisons.

## How Python does it

`sorted(iterable, key=..., reverse=...)` returns a new list, and `list.sort()` sorts in place and returns `None`. Both use **Timsort**, a stable hybrid of merge sort and insertion sort: O(n log n) in the worst case and O(n) on data that is already sorted. The `key` function is called once per item.

The `bisect` module does binary search on sorted lists:

```python
from bisect import bisect_left, insort

scores = [10, 20, 20, 30]
print(bisect_left(scores, 20))   # 1, the first index where 20 could go
insort(scores, 25)               # scores is now [10, 20, 20, 25, 30]
```

`insort` finds the slot in O(log n), but inserting into a list still shifts O(n) items.

Slicing copies. `items[:mid]` builds a new list, so a merge sort written with slices allocates memory at every level. It is clear and still O(n log n) time, and passing indexes instead avoids the copies.

## What is special or tricky

- **Off-by-one errors** are the classic binary-search bug. Pick one convention, such as the half-open interval `[lo, hi)` with `while lo < hi`, and keep it everywhere. Python ints never overflow, so `(lo + hi) // 2` is safe here, unlike in C or Java.
- **`list.sort()` returns `None`.** `items = items.sort()` throws your list away.
- **Stability lives in one character.** Merging with `<` instead of `<=` takes equal items from the right half first and breaks stability.
- **Recursion depth is fine here.** Merge sort recurses only about log₂ n deep, roughly 17 levels for 100,000 items.
- Comparing items of different types, as in `3 < "a"`, raises `TypeError`.

## What you will practise

You will write insertion sort, merge two sorted lists, and implement a half-open binary search next to `bisect_left`. The challenge sorts a list while counting its **inversions**, the pairs that are out of order, on inputs of 100,000 items where an O(n²) double loop is far too slow.
'''

[[unit.step]]
kind = "concept"
id = "py-u27-c1-divide-conquer"
title = "Divide, conquer, merge"
points = 5
difficulty = 33
intro = '''
Divide and conquer splits a problem into halves, solves each half recursively, and combines
the answers. For sorting, the combining step is a linear-time merge, and it is what gives
merge sort its guaranteed O(n log n).
'''
body = '''
## Merge sort in three lines of thought

1. A list of zero or one items is already sorted (base case).
2. Otherwise split it in the middle and sort both halves (recursive case).
3. Merge the two sorted halves into one sorted list.

## Why it is O(n log n)

Draw the recursion as a tree. The top level merges n items. The next level does two merges
of n/2 items each, still n in total. Each level halves the piece size, so there are about
log₂ n levels, each doing O(n) work: O(n log n) overall, whatever the input looks like.

## The merge

Two sorted lists can be merged by looking only at their front items. Take the smaller one,
advance in that list, and repeat. When one list runs out, append the rest of the other. Each
item is moved once, so merging is O(len(left) + len(right)).

## Binary search

On a sorted list, keep a half-open interval `[lo, hi)` that must contain the answer:

```python
lo, hi = 0, len(a)
while lo < hi:
    mid = (lo + hi) // 2
    if a[mid] < target:
        lo = mid + 1
    else:
        hi = mid
```

Every step halves the interval, so it takes O(log n) steps. When the loop ends, `lo` is the
first position whose item is not less than `target`. That is exactly `bisect_left`.
'''

