[unit.step.gabarito]
solution = '''
from concurrent.futures import ProcessPoolExecutor
from math import isqrt


def count_primes(lo: int, hi: int) -> int:
    """Count the primes p with lo <= p < hi."""
    count = 0
    for n in range(max(lo, 2), hi):
        if all(n % d for d in range(2, isqrt(n) + 1)):
            count += 1
    return count


def count_primes_parallel(ranges: list[tuple[int, int]], max_workers: int = 2) -> list[int]:
    """Count primes in every (lo, hi) range using worker processes, in input order."""
    if max_workers < 1:
        raise ValueError("max_workers must be at least 1")
    los = [lo for lo, _ in ranges]
    his = [hi for _, hi in ranges]
    with ProcessPoolExecutor(max_workers=max_workers) as pool:
        return list(pool.map(count_primes, los, his))
'''
time = "O(N·√M / P)"
space = "O(R)"
justification = '''
Let `N` be the total count of numbers across all ranges, `M` the largest number, `R` the number of
ranges and `P` the number of workers. Trial division tests each number against at most `√M`
divisors, so the total work is **O(N·√M)**, exactly what a serial loop would do. Because the ranges
are independent, `P` processes share that work, so with balanced chunks the wall-clock time drops
towards **O(N·√M / P)**, plus a constant cost to start the processes and pickle `R` small tuples
and integers. The parent stores only the inputs and one count per range, so the extra memory is
**O(R)**. `map` returns results in submission order, so no sorting is needed to keep the output
aligned with `ranges`.
'''

[[unit]]
id = "py-u23-stacks-queues"
title = "Stacks & queues: list and deque"
level = "advanced"
difficulty = 29
intro = '''
A stack and a queue are the two simplest rules for holding work you will come back to: last in,
first out, and first in, first out. They power undo buttons, parsers, schedulers and graph searches.
You will build both with a Python `list` and `collections.deque`, learn why `list.pop(0)` is a
trap, and finish with a classic linear-time deque algorithm.
'''
concepts = '''
## The idea

Many algorithms produce work faster than they consume it, so they need somewhere to park items. The
order in which items come back out defines the data structure:

- A **stack** is **LIFO**, last in, first out, like a pile of plates. You *push* on top and *pop*
  from the top. Stacks model anything nested: function calls (the call stack), undo history,
  matching brackets, depth-first search.
- A **queue** is **FIFO**, first in, first out, like a line at a counter. You *enqueue* at the back
  and *dequeue* from the front. Queues model fairness and distance: print jobs, schedulers,
  breadth-first search.

A **deque** (double-ended queue, pronounced "deck") adds and removes at **both** ends, so it can act
as either one.

## How Python does it

A `list` is a dynamic array, which makes it a fine stack: `append` and `pop()` work at the end in
amortised **O(1)** time.

```python
stack = []
stack.append("a")
stack.append("b")
print(stack.pop(), stack[-1])   # b a
```

For a queue, use `collections.deque`. `append`, `popleft`, `appendleft` and `pop` are all O(1).

```python
from collections import deque

line = deque(["ann", "bo"])
line.append("cy")
print(line.popleft(), list(line))   # ann ['bo', 'cy']
```

`deque(maxlen=n)` keeps only the last `n` items, discarding from the opposite end as new ones
arrive, which is perfect for "recent history" buffers. `rotate(k)` shifts items around the ring,
and `len`, iteration and `in` work as they do on lists.

## What is special or tricky

- **`list.pop(0)` and `list.insert(0, x)` are O(n).** Every remaining element shifts one slot. A
  queue built on them quietly turns an O(n) algorithm into O(n²).
- **Popping from an empty container raises.** `[].pop()` raises `IndexError: pop from empty list`
  and `deque().popleft()` raises `IndexError: pop from an empty deque`. Test `if stack:` first;
  empty containers are falsy.
- **Peek without removing** with `stack[-1]` or `queue[0]`.
- **Indexing the middle of a deque is O(n).** A deque is a linked list of fixed-size blocks, fast
  only at the ends. Use a list when you need random access.
- **Thread-safe hand-off is a different job.** Between threads use `queue.Queue` (unit 26), which
  can block and wait; a `deque` offers atomic `append` and `popleft` but no waiting.
- `heapq` gives a **priority queue**, which hands out the smallest item first instead of the oldest.

## What you will practise

You will check brackets with a list used as a stack, run a fair round-robin scheduler with a
`deque`, and explore a graph level by level with breadth-first search. The challenge works at both
ends of a deque to answer questions about a sliding window in linear time.
'''

[[unit.step]]
kind = "concept"
id = "py-u23-c1-lifo-fifo"
title = "LIFO, FIFO and the cost of each end"
points = 5
difficulty = 29
run_command = ""
intro = '''
Stacks and queues are abstract data types: they are defined by their operations and the order they
guarantee, not by how they store items. Choosing the right concrete structure underneath is what
keeps every operation O(1) instead of O(n).
'''
body = '''
## Two disciplines

| Structure | Rule | Add | Remove | Typical use |
|---|---|---|---|---|
| stack | LIFO | push on top | pop from top | undo, parsing, DFS |
| queue | FIFO | enqueue at back | dequeue from front | scheduling, BFS |

## Why the end matters

A Python `list` stores its items in one contiguous array. Working at the **end** is cheap: nothing
else moves. Working at the **front** is expensive: removing item 0 shifts every other item one slot
to the left.

```python
items = list(range(5))
items.pop()      # O(1): nothing moves
items.pop(0)     # O(n): four items shift left
```

So a list is a good stack and a bad queue. `collections.deque` stores items in a chain of blocks
and keeps pointers to both ends, so adding or removing at either end is O(1).

```python
from collections import deque

q = deque()
q.append("job1")       # enqueue at the back
q.append("job2")
print(q.popleft())     # job1: first in, first out
print(len(q), q[0])    # 1 job2: peek at the front
```

## Bounded history

`deque(maxlen=3)` keeps at most three items. Appending a fourth silently drops the oldest from the
other end, which makes "the last N events" a one-liner.
'''

