    finally:
        signal.alarm(0)
        signal.signal(signal.SIGALRM, old)


def brute(items):
    n = len(items)
    return sum(1 for i in range(n) for j in range(i + 1, n) if items[i] > items[j])


def fenwick_count(items):
    ranks = {v: r for r, v in enumerate(sorted(set(items)), 1)}
    tree = [0] * (len(ranks) + 1)
    seen = inv = 0
    for v in items:
        r = ranks[v]
        k, not_greater = r, 0
        while k > 0:
            not_greater += tree[k]
            k -= k & -k
        inv += seen - not_greater
        k = r
        while k < len(tree):
            tree[k] += 1
            k += k & -k
        seen += 1
    return inv


