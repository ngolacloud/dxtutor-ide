[[unit]]
id = "py-u02-variables"
title = "Variables & types"
level = "basic"
difficulty = 2
intro = '''
Programs work with data, and variables are how you keep hold of it. In this unit you learn
how Python names values, which basic types it offers (`int`, `float`, `str`, `bool` and
`None`), and how to convert from one type to another. The unit ends with a function that
turns text into numbers and computes with them.
'''
concepts = '''
## The idea

A program works with data: counts, prices, names, yes/no answers. A **variable** is a name
you attach to a value so you can use it later. In Python every value is an **object** that
lives in memory and carries its own **type**, and the type decides what you can do with
it: you can divide numbers, but not sentences. The variable itself is only a label that
points at an object.

## How Python does it

Assignment uses a single `=`: the name goes on the left, an expression on the right.
Python evaluates the right-hand side first, then binds the name to the result.

```python
count = 3          # int: a whole number
price = 2.5        # float: a number with a fractional part
city = "Luanda"    # str: text
ready = True       # bool: True or False
result = None      # NoneType: "no value here"
print(type(price)) # <class 'float'>
```

Python is **dynamically typed**: names have no declared type, only values do. The same
name can later point at a value of a different type, and the built-in `type(x)` tells you
the type of the value `x` points at right now.

The arithmetic operators are `+`, `-`, `*` and `/`, plus three you may not know: `//` is
**floor division** (divide and round down), `%` is the **remainder** and `**` is the
**power**. Note that `/` always produces a `float`, even when the division is exact.

The type names double as **conversion functions**: `int(...)`, `float(...)`, `str(...)`
and `bool(...)` each build a new value of that type from the value you pass in.

```python
age_text = "41"
age = int(age_text)
print(age + 1)          # 42
print("age " + str(age))
```

## What is special or tricky

- **`=` assigns, `==` compares.** `x = 5` stores; `x == 5` asks a question (unit 4).
- **Text that looks like a number is still text.** `"2" + "3"` is `"23"`, and `"2" + 3`
  raises `TypeError`. Convert first.
- **`int()` is strict about text.** `int("3.7")` raises `ValueError`; `float("3.7")` works.
  On a float, `int()` cuts off the fraction towards zero: `int(-3.7)` is `-3`.
- **Floats are binary approximations.** `0.1 + 0.2` prints `0.30000000000000004`. Use
  `round(x, n)` when you want `n` decimal places.
- **Integers never overflow.** `2 ** 100` gives the exact 31-digit answer.
- **Truthiness surprises.** `bool(0)`, `bool("")` and `bool(None)` are `False`, but
  `bool("False")` is `True`: any non-empty string counts as true.
- **`None` is not zero.** It is its own value meaning "nothing", and `None + 1` fails.
- **Names are case-sensitive** (`total` and `Total` differ), cannot start with a digit, and
  by convention use `snake_case`.

## What you will practise

You will create one variable of each basic type and inspect it with `type()`, explore the
arithmetic operators and float rounding, and convert between text and numbers. The
challenge asks you to read two numbers that arrive as text and compute a result from them.
'''

[[unit.step]]
kind = "concept"
id = "py-u02-c1-names-values"
title = "Names point at values"
points = 5
difficulty = 2
intro = '''
In many languages a variable is a box of a fixed size with a fixed type. Python works
differently: values are objects in memory that know their own type, and a variable is a
name bound to one of those objects. Assigning again simply moves the name to another object.
'''
body = '''
## Binding a name

```python
score = 10
print(score, type(score))   # 10 <class 'int'>
score = score + 5
print(score)                # 15
score = "fifteen"
print(type(score))          # <class 'str'>
```

Read `score = score + 5` from right to left: Python first computes `score + 5` using the
current value (`15`), then makes `score` point at that new result. Assignment is not an
equation, it is an instruction.

The last assignment shows **dynamic typing**: the name `score` now points at a string.
Python allows it, because the type belongs to the value, not to the name. That freedom is
convenient, but it also means a typo or an unexpected value only shows up when the line
actually runs.

## The five basic types

| Type | Example | Meaning |
|---|---|---|
| `int` | `42`, `-7`, `1_000_000` | whole numbers of any size |
| `float` | `3.14`, `2.0`, `1e-3` | numbers with a fractional part |
| `str` | `"hi"`, `'Luanda'` | text |
| `bool` | `True`, `False` | yes or no |
| `NoneType` | `None` | the absence of a value |

## Converting

To change a value's type you build a new value: `int("42")` is `42`, `str(42)` is
`"42"`, `float(3)` is `3.0`. The original value is left untouched.
'''

