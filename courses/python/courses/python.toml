[[unit]]
id = "py-u16-decorators"
title = "Decorators"
level = "advanced"
difficulty = 22
intro = '''
Functions in Python are ordinary objects: you can pass them around, return them and wrap
them. A **decorator** uses that to add behaviour such as logging, timing, caching or retrying
around a function without touching its body. You will write plain decorators, keep their
metadata intact with `functools.wraps`, and build decorators that take arguments. The unit
ends with a `retry` decorator of the kind real network code uses.
'''
concepts = '''
## The idea

Some concerns cut across many functions: log every call, time it, check permissions, cache
results, retry on failure. Copying that code into each function mixes it with the real work
and repeats it everywhere. Functional programming offers a cleaner tool, the **higher-order
function**: a function that takes a function and returns a new one, which does a little
extra before and after calling the original. This is the *decorator pattern*. The wrapped
function keeps its interface, so callers can't tell the difference.

## How Python does it

Functions are first-class objects, so a decorator is just a callable that takes a function
and returns a replacement. The `@` line is syntax sugar for a reassignment:

```python
def log_calls(func):
    def wrapper(*args, **kwargs):
        print("->", func.__name__, args)
        return func(*args, **kwargs)
    return wrapper

@log_calls          # same as: square = log_calls(square)
def square(x):
    return x * x
```

The inner `wrapper` accepts `*args, **kwargs`, so it can stand in for any signature, and it
**returns** the original's result.

The replacement is a different function object, so by default it reports the name
`wrapper` and has no docstring. `functools.wraps(func)` is itself a decorator: it copies
`__name__`, `__qualname__`, `__doc__`, `__module__` and `__dict__` onto the wrapper and sets
`__wrapped__` to point back at the original. Tracebacks, `help()`, debuggers and test tools
all rely on that.

A decorator that takes arguments, like `@repeat(3)`, is a **decorator factory**: `repeat(3)`
runs first and returns the real decorator, which then receives the function. That gives
three nested levels: the factory takes the options, the decorator takes the function, and
the wrapper takes each call's arguments. Inner levels see the outer variables through
closures.

Decorators can be stacked. They apply bottom-up: the one closest to `def` wraps first, so
the top one ends up outermost and runs first on every call.

## Pitfalls

- **Forgetting to return.** A wrapper that calls `func(...)` but doesn't return its value
  silently turns every result into `None`.
- **Forgetting `@wraps`.** Everything still runs, but every decorated function is named
  `wrapper`, which makes logs and tracebacks confusing.
- **Decoration runs once, at definition time.** Code in the decorator body, outside the
  wrapper, runs when the module loads. Per-call work belongs inside the wrapper.
- **`@factory` versus `@factory()`.** Writing `@repeat` without parentheses passes the
  function in as `n`, and the error only shows up later, far from the cause.
- Methods work too: `self` simply arrives as the first element of `*args`.

## What you will practise

You will write a logging decorator, compare a wrapper with and without `functools.wraps`,
and stack two decorators built by a factory. The challenge asks you to write a decorator
factory that re-runs a failing function.
'''

[[unit.step]]
kind = "concept"
id = "py-u16-c1-wrapping"
title = "Wrapping a function"
points = 5
difficulty = 22
intro = '''
In Python a function is a value like any other, so it can be an argument and a return value.
A decorator is a function that takes a function and returns a new one wrapped around it. The
`@` syntax applies it once, at definition time.
'''
body = '''
## Functions are values

```python
def greet(name):
    return f"hi {name}"

say = greet          # no call: say now names the same function
print(say("ana"))    # hi ana
```

Because a function is a value, another function can receive it, build a new function
around it and return that.

## The decorator shape

```python
import functools

def announce(func):
    @functools.wraps(func)
    def wrapper(*args, **kwargs):
        print("before")
        result = func(*args, **kwargs)
        print("after")
        return result
    return wrapper
```

Writing `@announce` above a `def f` means `f = announce(f)`. The decorator runs **once**, when
the function is defined; `wrapper` runs on **every call**. `*args, **kwargs` forward any
arguments, and returning `result` keeps the original's return value. `functools.wraps` copies
the original's name and docstring onto the wrapper.

## Decorators with arguments

`@every(5)` calls `every(5)` first, and that call must return a decorator. So a
parametrised decorator has three layers: the factory takes the options, the decorator takes
the function, and the wrapper takes each call's arguments. Every inner layer sees the
variables of the layers around it through a closure.

## Stacking

With two decorators above one `def`, the lower one wraps first and the upper one wraps the
result, so the upper one runs first when the function is called.
'''

