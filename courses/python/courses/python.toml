```

Return the minimum number of single-character edits (insert a character, delete a character,
or substitute one character for another) needed to turn `a` into `b`.

Examples:

- `edit_distance("kitten", "sitting")` returns `3` (k→s, e→i, insert g).
- `edit_distance("", "abc")` returns `3`.
- `edit_distance("flaw", "lawn")` returns `2` (delete f, insert n).
- `edit_distance("same", "same")` returns `0`.

