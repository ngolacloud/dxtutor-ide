entry = "leaderboard"
run_command = "python3 -m unittest"
intro = '''
Ranking is sorting with a carefully chosen key. Because tuples compare element by element, a
key can encode "first by this, then by that" in a single value. A good function also leaves
its input untouched, which means building a new list instead of sorting in place.
'''
instructions = '''
## Your turn

Implement the function `leaderboard`:

```python
def leaderboard(scores: list[tuple[str, int]], n: int) -> list[tuple[str, int]]: ...
```

`scores` is a list of `(name, score)` pairs. Return a **new** list with the top `n` pairs:

- higher scores come first;
- when two players have the same score, order them by name, **alphabetically**;
- if `n` is larger than the number of pairs, return all of them; if `n` is 0 or negative,
  return an empty list;
- do **not** modify `scores`.

Examples:

- `leaderboard([("eva", 82), ("rui", 95), ("ana", 82)], 2)` → `[("rui", 95), ("ana", 82)]`
- `leaderboard([("bo", 1), ("al", 1)], 5)` → `[("al", 1), ("bo", 1)]`
- `leaderboard([("x", 3)], 0)` → `[]`

**Hint:** a single sort can handle both rules if its key is a tuple. Think about how to make
"higher score first" and "name A to Z" point the same way.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
def leaderboard(scores: list[tuple[str, int]], n: int) -> list[tuple[str, int]]:
    """Return the top n (name, score) pairs: score descending, ties by name ascending.

    The input list must not be modified.
    """
    raise NotImplementedError
'''
tests = '''
class LeaderboardTest(unittest.TestCase):
    def test_basic_ranking(self):
        scores = [("eva", 82), ("rui", 95), ("ana", 82), ("joao", 70)]
        self.assertEqual(
            leaderboard(scores, 3), [("rui", 95), ("ana", 82), ("eva", 82)]
        )

    def test_ties_are_alphabetical(self):
        scores = [("zoe", 10), ("bob", 10), ("amy", 10), ("max", 20)]
        self.assertEqual(
            leaderboard(scores, 4),
            [("max", 20), ("amy", 10), ("bob", 10), ("zoe", 10)],
        )

    def test_n_larger_than_list(self):
        self.assertEqual(leaderboard([("bo", 1), ("al", 1)], 5), [("al", 1), ("bo", 1)])

    def test_n_zero_or_negative(self):
        scores = [("x", 3), ("y", 2), ("z", 1)]
        self.assertEqual(leaderboard(scores, 0), [])
        self.assertEqual(leaderboard(scores, -1), [])

    def test_empty_input(self):
        self.assertEqual(leaderboard([], 3), [])

    def test_input_not_modified(self):
        scores = [("b", 1), ("a", 5), ("c", 3)]
        snapshot = list(scores)
        result = leaderboard(scores, 2)
        self.assertEqual(scores, snapshot)
        self.assertIsNot(result, scores)

    def test_negative_scores(self):
        scores = [("a", -5), ("b", 0), ("c", -1)]
        self.assertEqual(leaderboard(scores, 3), [("b", 0), ("c", -1), ("a", -5)])

    def test_large_input(self):
        scores = [(f"p{i:05d}", (i * 37) % 100) for i in range(20000)]
        by_name = sorted(scores)
        expected = sorted(by_name, key=lambda p: p[1], reverse=True)[:50]
        self.assertEqual(leaderboard(scores, 50), expected)
'''

[unit.step.gabarito]
solution = '''
def leaderboard(scores: list[tuple[str, int]], n: int) -> list[tuple[str, int]]:
    """Return the top n (name, score) pairs: score descending, ties by name ascending."""
    if n <= 0:
        return []
    ranked = sorted(scores, key=lambda pair: (-pair[1], pair[0]))
    return ranked[:n]
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
The work is dominated by one call to `sorted`, which performs **O(n log n)** comparisons on
`n` pairs. The key `(-score, name)` turns both rules into one ascending order: negating the
score makes higher scores sort first, and the name breaks ties alphabetically. Slicing the
first `n` items costs at most O(n). `sorted` builds a new list of `n` references (plus the `n`
key tuples), so the extra space is **O(n)**, and the caller's list is never modified. The
guard for `n <= 0` matters because `ranked[:-1]` would quietly drop only the last item
instead of returning nothing.
'''

# ─────────────────────────────────────────────────────────────────────────────
# Unit 8 — Dicts & sets
