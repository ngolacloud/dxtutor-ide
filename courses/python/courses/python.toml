tests = '''
import sqlite3


EVENTS = [
    (1, 300), (2, 100), (3, 200), (4, 100),
    (5, 200), (6, 100), (7, 400), (8, 200),
]
ORDERED = sorted((ts, eid) for eid, ts in EVENTS)


class NextPageTest(unittest.TestCase):
    def setUp(self):
        self.conn = sqlite3.connect(":memory:")
        self.conn.execute(
            "CREATE TABLE events (id INTEGER PRIMARY KEY, ts INTEGER NOT NULL, name TEXT)"
        )
        self.conn.executemany(
            "INSERT INTO events VALUES (?, ?, ?)",
            [(eid, ts, f"event {eid}") for eid, ts in EVENTS],
        )

    def tearDown(self):
        self.conn.close()

    def walk(self, size):
        seen, cursor = [], None
        for _ in range(100):
            page = next_page(self.conn, cursor, size)
            if not page:
                return seen
            self.assertLessEqual(len(page), size)
            seen.extend(page)
            cursor = page[-1]
        self.fail("pagination never ended")

    def test_first_page(self):
        self.assertEqual(next_page(self.conn, None, 3), [(100, 2), (100, 4), (100, 6)])

    def test_page_boundary_inside_a_tie(self):
        self.assertEqual(next_page(self.conn, (100, 4), 2), [(100, 6), (200, 3)])
        self.assertEqual(next_page(self.conn, (200, 3), 3), [(200, 5), (200, 8), (300, 1)])

    def test_walk_all_pages(self):
        for size in (1, 2, 3, 5, 8, 50):
            with self.subTest(size=size):
                self.assertEqual(self.walk(size), ORDERED)

    def test_after_the_last_row(self):
        self.assertEqual(next_page(self.conn, (400, 7), 5), [])
        self.assertEqual(next_page(self.conn, (300, 1), 5), [(400, 7)])

    def test_non_positive_size(self):
        self.assertEqual(next_page(self.conn, None, 0), [])
        self.assertEqual(next_page(self.conn, None, -1), [])
        self.assertEqual(next_page(self.conn, (100, 2), -5), [])

    def test_insert_before_the_cursor_does_not_repeat_rows(self):
        first = next_page(self.conn, None, 4)
        self.conn.execute("INSERT INTO events VALUES (9, 50, 'late arrival')")
        second = next_page(self.conn, first[-1], 4)
        self.assertEqual(first + second, ORDERED)

    def test_empty_table(self):
        self.conn.execute("DELETE FROM events")
        self.assertEqual(next_page(self.conn, None, 3), [])

    def test_returns_tuples(self):
        page = next_page(self.conn, None, 2)
        self.assertTrue(all(type(row) is tuple for row in page))
