[[unit]]
id = "py-u24-linked-list"
title = "Singly linked lists"
level = "advanced"
difficulty = 30
intro = '''
A linked list stores each value in its own node object that points to the next one, so a
sequence becomes a chain of references instead of one contiguous block of memory. You will
define a `Node` class, push and pop at the head, keep a tail reference for O(1) appends,
delete by rewiring, and finish by reversing a list in place without creating a single new node.
'''
concepts = '''
## The idea

A **linked list** stores a sequence as a chain of **nodes**. Each node holds a value and a **reference** to the next node, and the last node refers to nothing. The list itself is just a reference to the first node, the **head**. Nothing is contiguous: the nodes can live anywhere in memory, connected only by references.

That layout trades one set of costs for another. Compared with a Python `list`, which is a dynamic array:

- **Insert or remove at the head: O(1).** You only rewire a reference. `list.insert(0, x)` must shift every element, which is O(n).
- **Insert after a node you already hold: O(1)**, for the same reason.
- **Access by index, search, length: O(n).** You must walk from the head, because no arithmetic jumps to element *i*. Length is O(n) unless you store a counter.
- **Append at the tail: O(n)**, unless you also keep a reference to the last node.

In everyday Python, `list` and `collections.deque` win: they are written in C and are friendly to CPU caches. Linked lists still matter. They teach reference-based structures, trees and graphs are built from the same kind of node, and "rewire two references" is the trick behind LRU caches and schedulers.

## How Python does it

Every Python variable is already a reference, so a node is just a small class. `None` marks both the end of the list and the empty list:

```python
class Node:
    __slots__ = ("val", "next")

    def __init__(self, val, next=None):
        self.val = val
        self.next = next
```

`__slots__` drops the per-instance `__dict__`, which saves a lot of memory when you have 100,000 nodes. There is no `free`: once nothing refers to a node, the garbage collector reclaims it.

Inserting after a known node is one assignment:

```python
def insert_after(node, val):
    node.next = Node(val, node.next)
```

The right-hand side runs first, so the new node captures the old `node.next` before it is overwritten. A walk is a loop that follows `next` until `None`:

```python
def contains(head, target):
    node = head
    while node is not None:
        if node.val == target:
            return True
        node = node.next
    return False
```

## What is special or tricky

- **`AttributeError: 'NoneType' object has no attribute 'val'`** is Python's null-pointer crash. It happens when you follow `next` past the last node, or read `head.val` on an empty list. Check `is not None` first.
- **Rebinding a parameter does not affect the caller.** `head = head.next` inside a function changes only the local name. Return the new head, or keep it in an object attribute.
- **Order of rewiring matters.** Overwrite `node.next` before saving it and the rest of the list is unreachable. With tuple assignment, Python evaluates the whole right side first but assigns the targets left to right, so a target such as `node.next` uses whatever `node` is at that moment. Until you are sure, save a temporary and use separate lines.
- **Recursion and long lists do not mix.** CPython's default recursion limit is about 1000, so a recursive walk over 100,000 nodes raises `RecursionError`. Use loops.
- Use `is` for node identity and `==` for values.

## What you will practise

You will build a list by pushing to the front, wrap it in a class with a tail reference and a size, and delete values with a dummy node. The challenge asks you to reverse a list in place, reusing its nodes, on lists long enough to rule out recursion.
'''

