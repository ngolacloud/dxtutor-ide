instructions = '''
## Your turn

Implement the coroutine function `fetch_all`:

```python
async def fetch_all(
    fetch: Callable[[str], Awaitable[object]],
    keys: list[str],
    timeout: float,
) -> dict[str, object]:
```

`fetch` is an async function: `await fetch(key)` returns the value for one key (think of it as a
network call). Your function must:

- call `fetch` for **every** key, **concurrently**;
- give **each** call its own deadline of `timeout` seconds;
- return a dict mapping every key to its value, or to `None` if that call did not finish in time;
- keep the dict's keys in the same order as `keys` (you may assume the keys are unique);
- let any other exception raised by `fetch` propagate to the caller.

