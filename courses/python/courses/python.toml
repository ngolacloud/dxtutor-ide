[unit.step.gabarito]
solution = '''
import sqlite3


def names_in_city(conn: sqlite3.Connection, city: str) -> list[str]:
    """Return the sorted names of the people who live in `city`."""
    cur = conn.execute(
        "SELECT name FROM people WHERE city = ? ORDER BY name",
        (city,),
    )
    return [name for (name,) in cur]
'''
time = "O(n + k log k)"
space = "O(k)"
justification = '''
The table has no index on `city`, so SQLite scans all **n** rows once to test the
`WHERE` condition: **O(n)**. The **k** matching names are then sorted for `ORDER BY`,
which costs **O(k log k)**. The returned list holds the k names, so the extra space is
**O(k)**. Binding the city as a parameter costs nothing extra and keeps the statement's
structure fixed, whatever characters the city contains.
'''

