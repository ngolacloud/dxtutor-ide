## Your turn

`src/types.ts` (read-only) defines `Todo` and `Filter`. Write two files.

**`src/filters.ts`**, pure functions, no signals:

- `visible(todos, filter)` returns the todos the filter shows: all of them for `"all"`, the
  not-done ones for `"active"`, the done ones for `"done"`. It never changes its input.
- `remaining(todos)` returns how many todos are not done.

**`src/store.ts`**: `createTodoStore(initial: Todo[] = [])`, created inside a **`createRoot`**,
