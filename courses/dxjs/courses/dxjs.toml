  mount(Counter, a, { start: 0, step: () => 1 });
  mount(Counter, b, { start: 0, step: () => 1 });
  fire(a.querySelector("button.inc")!, "click");
  assert.equal(a.querySelector("output")!.textContent, "1");
  assert.equal(b.querySelector("output")!.textContent, "0");
});

test("disposing removes the counter", () => {
  const host = body();
  const dispose = mount(Counter, host, { start: 0, step: () => 1 });
  dispose();
  assert.equal(host.querySelector("div.counter"), null);
});
'''
"todo-list.test.ts" = '''
import { body, fire } from "@dxtutor/dom";
import { test } from "node:test";
import assert from "node:assert/strict";
import { signal } from "@dxjs/core";
import { mount } from "@dxjs/component";
import { TodoList } from "./src/todo-list.ts";

type Todo = { id: number; text: string; done: boolean };

function setup(start: Todo[]) {
  const todos = signal<Todo[]>(start);
  const toggled: number[] = [];
  const removed: number[] = [];
  const host = body();
  const dispose = mount(TodoList, host, {
    todos: () => todos(),
    onToggle: (id: number) => toggled.push(id),
    onRemove: (id: number) => removed.push(id),
  });
  const rows = () => [...host.querySelectorAll("ul.todos > li")] as HTMLLIElement[];
  return { todos, toggled, removed, host, dispose, rows };
}

const two: Todo[] = [
  { id: 1, text: "write a signal", done: false },
  { id: 2, text: "build a store", done: true },
];

test("one row per todo, in order, with data-id, text and done class", () => {
  const { rows } = setup(two);
  assert.deepEqual(rows().map((li) => li.getAttribute("data-id")), ["1", "2"]);
  assert.deepEqual(rows().map((li) => li.querySelector("span")!.textContent), ["write a signal", "build a store"]);
  assert.equal(rows()[0].classList.contains("done"), false);
  assert.equal(rows()[1].classList.contains("done"), true);
});

test("the checkbox property matches done", () => {
  const { rows } = setup(two);
  const boxes = rows().map((li) => li.querySelector("input[type=checkbox]") as HTMLInputElement);
  assert.deepEqual(boxes.map((b) => b.checked), [false, true]);
});

test("change and click report through the callbacks", () => {
  const { rows, toggled, removed } = setup(two);
  fire(rows()[0].querySelector("input")!, "change");
  fire(rows()[1].querySelector("button.remove")!, "click");
  assert.deepEqual(toggled, [1]);
  assert.deepEqual(removed, [2]);
});

test("a toggled todo updates its row in place; the others keep theirs", () => {
  const { todos, rows } = setup(two);
  const [first, second] = rows();
  todos.update((ts) => ts.map((t) => (t.id === 1 ? { ...t, done: true } : t)));
  const now = rows()[0];
  assert.equal(now.getAttribute("data-id"), "1");
  assert.equal(now, first, "the row is keyed by id: same node");
  assert.equal(now.classList.contains("done"), true);
  assert.equal((now.querySelector("input") as HTMLInputElement).checked, true);
  assert.equal(rows()[1], second, "the untouched row keeps its node");
  todos.update((ts) => ts.map((t) => (t.id === 1 ? { ...t, done: false } : t)));
  assert.equal(rows()[0], first);
  assert.equal(rows()[0].hasAttribute("class"), false);
  assert.equal((rows()[0].querySelector("input") as HTMLInputElement).checked, false);
  assert.equal(rows().length, 2);
});

test("a kept row's bindings still update after the list changed", () => {
  const { todos, rows } = setup(two);
  const [first, second] = rows();
  todos.update((ts) => [...ts, { id: 3, text: "ship it", done: false }]); // the list changes
  todos.update((ts) => ts.filter((t) => t.id !== 3)); // and changes back
  todos.update((ts) => ts.map((t) => (t.id === 1 ? { ...t, done: true, text: "wrote a signal" } : t)));
  assert.equal(rows()[0], first, "row 1 was kept");
  assert.equal(first.classList.contains("done"), true, "its class follows the todo");
  assert.equal((first.querySelector("input") as HTMLInputElement).checked, true, "so does its checkbox");
  assert.equal(first.querySelector("span")!.textContent, "wrote a signal", "and its text");
  todos.update((ts) => ts.map((t) => (t.id === 2 ? { ...t, done: false } : t)));
  assert.equal(rows()[1], second, "row 2 was kept");
  assert.equal(second.hasAttribute("class"), false, "and its class follows the todo");
});

test("rows are keyed: inserts and removals keep the other nodes", () => {
  const { todos, rows } = setup(two);
  const [a, b] = rows();
  todos.update((ts) => [{ id: 3, text: "new", done: false }, ...ts]);
  assert.deepEqual(rows().map((li) => li.getAttribute("data-id")), ["3", "1", "2"]);
  assert.equal(rows()[1], a);
  todos.update((ts) => ts.filter((t) => t.id !== 1));
  assert.deepEqual(rows().map((li) => li.getAttribute("data-id")), ["3", "2"]);
  assert.equal(rows()[1], b);
});

test("text is escaped", () => {
  const { rows } = setup([{ id: 1, text: "<b>bold</b>", done: false }]);
  assert.equal(rows()[0].querySelector("b"), null);
  assert.equal(rows()[0].querySelector("span")!.textContent, "<b>bold</b>");
});

test("disposing removes the list", () => {
  const { host, dispose } = setup(two);
  dispose();
  assert.equal(host.querySelector("ul"), null);
});
'''

