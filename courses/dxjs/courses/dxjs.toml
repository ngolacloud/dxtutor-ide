intro = '''
The smallest useful computed: a product of two signals. Each write to either input is followed
by a read of the total, which recomputes it from the current values.
'''
prompt = '''
Derive `total` from `price` and `qty`, then change each input and print the total again.

**Why:** a computed defined once stays correct after any change to its inputs; you never
update it yourself.
'''
target = '''
import { signal, computed } from "@dxjs/core";

const price = signal(100);
const qty = signal(2);
const total = computed(() => price() * qty());

console.log("total:", total());
qty.set(3);
console.log("total:", total());
price.update((p) => p + 10);
console.log("total:", total());
'''
line_comments = [
  "Imports `signal` and `computed` from the core package.",
  "",
  "The unit price, a signal.",
  "The quantity, another signal.",
  "`total` is defined by its formula; it tracks `price` and `qty` because the formula reads them.",
  "",
  "The first read runs the formula: prints `total: 200`.",
  "Changes the quantity; the computed is marked stale but does not run yet.",
  "Reading it again recomputes: prints `total: 300`.",
  "Raises the price by 10.",
  "Recomputes with the new price: prints `total: 330`.",
]
explanation = '''
The program printed `total: 200`, `total: 300` and `total: 330`. You never assigned `total`:
it was always the product of the current price and quantity.
'''

[[unit.step]]
kind = "drill"
id = "dxjs-u02-d2-lazy"
title = "Lazy and memoised"
points = 10
difficulty = 2
placeholder_policy = "shown"
run_command = "node --experimental-transform-types main.ts"
intro = '''
A counter of how many times the formula ran makes laziness and caching visible: no run until
the first read, one run per change, and none for repeated reads.
'''
prompt = '''
Count the runs of a computed's formula. Read it before and after a change and print the count
each time.

**Why:** knowing exactly when a computed runs is what lets you put expensive derivations in
one without worrying.
'''
target = '''
import { signal, computed } from "@dxjs/core";

let runs = 0;
const items = signal(["tea", "bread", "milk"]);
const count = computed(() => {
  runs++;
  return items().length;
});

console.log("runs before any read:", runs);
console.log("count:", count(), "runs:", runs);
console.log("count:", count(), "runs:", runs);
items.update((xs) => [...xs, "eggs"]);
console.log("runs after the write:", runs);
console.log("count:", count(), "runs:", runs);
'''
line_comments = [
  "Imports the two primitives.",
  "",
  "A plain variable counting how many times the formula runs. It is not reactive.",
  "A signal holding a shopping list.",
  "A computed with a formula that also counts its own runs.",
  "Increments the run counter (fine for a demonstration; real formulas stay pure).",
  "Returns the length of the list, which makes `items` a dependency.",
  "Closes the formula.",
  "",
  "Nothing has read `count` yet, so the formula never ran: prints `0`.",
  "The first read runs the formula once: prints `count: 3 runs: 1`.",
  "A second read returns the cached value; the formula does not run: still `runs: 1`.",
  "Adds an item; the computed is marked stale but stays lazy.",
  "Still `1`: nothing recomputes until the value is read.",
  "This read recomputes once: prints `count: 4 runs: 2`.",
]
explanation = '''
The output was `runs before any read: 0`, `count: 3 runs: 1` twice, `runs after the write: 1`
and `count: 4 runs: 2`. The formula ran only when a read needed a fresh value: never ahead of
time, and never twice for the same inputs.
'''

[[unit.step]]
kind = "challenge"
id = "dxjs-u02-x1-cart"
title = "A shopping cart of computeds"
points = 20
difficulty = 2
entry = "createCart"
intro = '''
A cart is the classic derived-state problem: the lines are the only real state, and subtotal,
VAT, total and item count all follow from them. Each becomes a computed, chained where one
builds on another.
'''
instructions = '''
## Your turn

Implement `createCart(vatPercent)`. Prices are whole **cents**.

```ts
export type Line = { name: string; priceCents: number; qty: number };

export function createCart(vatPercent: number): {
  lines: () => Line[];
  add(name: string, priceCents: number, qty?: number): void;   // qty defaults to 1
  remove(name: string): void;
  subtotal: () => number;   // sum of priceCents * qty
  vat: () => number;        // Math.round(subtotal * vatPercent / 100)
  total: () => number;      // subtotal + vat
  count: () => number;      // sum of qty
}
```

- The lines live in **one signal**; `subtotal`, `vat`, `total` and `count` are **computeds**.
- `add` with a name already in the cart increases that line's `qty` (keeping its first price);
  otherwise it appends a new line. Every change writes a **new** array.
- `remove` drops the line with that name.

Example with `createCart(14)`: `add("tea", 250, 2)` and `add("milk", 99)` → subtotal `599`,
vat `84` (599 × 14 / 100 = 83.86), total `683`, count `3`.
'''
starter = '''
import { signal, computed } from "@dxjs/core";

export type Line = { name: string; priceCents: number; qty: number };

// The lines are the only state; everything else is derived.
export function createCart(vatPercent: number) {
  throw new Error("not implemented");
}
'''
