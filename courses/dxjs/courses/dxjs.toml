[[unit.step]]
kind = "challenge"
id = "dxjs-u04-x1-watch"
title = "watch: new value, previous value"
points = 25
difficulty = 4
entry = "watch"
intro = '''
`watch` turns any reactive expression into a change listener: it skips the first value and
then calls back with the new and the previous value on every change. The callback is foreign
code, so it must run untracked.
'''
instructions = '''
## Your turn

Implement `watch`:

```ts
export function watch<T>(
  source: () => T,
  callback: (value: T, previous: T) => void,
): () => void
```

- Follow `source` (it can read any signals and computeds) with an effect.
- Do **not** call `callback` for the initial value. On each later change call
  `callback(newValue, previousValue)`.
- A write that leaves `source()` equal to before (same signal value) causes no call.
- Run `callback` with **`untrack`**: signals it reads must not become dependencies of the
  watcher.
- Return the disposer: after calling it, no more callbacks.

Example: `watch(() => count(), (v, p) => log.push(p + "→" + v))`, then `count.set(1)` and
`count.set(5)` → log is `["0→1", "1→5"]`.
'''
starter = '''
import { effect, untrack } from "@dxjs/core";

// Call back with (value, previous) on every change of source, but not for the first value.
export function watch<T>(source: () => T, callback: (value: T, previous: T) => void): () => void {
  throw new Error("not implemented");
}
'''
tests = '''
import { signal as signalForTest, batch as batchForTest } from "@dxjs/core";

dxt.test("does not call back for the initial value", () => {
  const n = signalForTest(0);
  const calls: number[] = [];
  watch(() => n(), (v) => calls.push(v));
  dxt.equal(calls, []);
});

dxt.test("calls back with the new and the previous value", () => {
  const n = signalForTest(0);
  const log: string[] = [];
  watch(() => n(), (v, p) => log.push(p + "→" + v));
  n.set(1);
  n.set(5);
  dxt.equal(log, ["0→1", "1→5"]);
});

dxt.test("an equal write causes no call", () => {
  const n = signalForTest(3);
  let calls = 0;
  watch(() => n(), () => calls++);
  n.set(3);
  dxt.equal(calls, 0);
});

dxt.test("watches any expression, once per batch", () => {
  const a = signalForTest(1);
  const b = signalForTest(2);
  const log: string[] = [];
  watch(() => a() + b(), (v, p) => log.push(p + "→" + v));
  batchForTest(() => {
    a.set(10);
    b.set(20);
  });
  dxt.equal(log, ["3→30"]);
});

dxt.test("signals read by the callback are not tracked", () => {
  const n = signalForTest(0);
  const other = signalForTest("x");
  const seen: string[] = [];
  watch(() => n(), (v) => seen.push(v + other()));
  n.set(1);
  other.set("y");
  other.set("z");
  dxt.equal(seen, ["1x"]);
  n.set(2);
  dxt.equal(seen, ["1x", "2z"]);
});

dxt.test("the disposer stops the callbacks", () => {
  const n = signalForTest(0);
  let calls = 0;
  const stop = watch(() => n(), () => calls++);
  n.set(1);
  stop();
  n.set(2);
  dxt.equal(calls, 1);
});
'''

[unit.step.gabarito]
solution = '''
import { effect, untrack } from "@dxjs/core";

// Call back with (value, previous) on every change of source, but not for the first value.
export function watch<T>(source: () => T, callback: (value: T, previous: T) => void): () => void {
  let first = true;
  let previous: T;
  return effect(() => {
    const value = source();
    if (first) {
      first = false;
      previous = value;
      return;
    }
    const old = previous;
    previous = value;
    untrack(() => callback(value, old));
  });
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Each change costs one evaluation of `source` plus the callback, so the watcher adds **O(1)**
work and keeps one previous value, **O(1)** space. Two details make it correct: the effect's
first run only records the starting value, and `untrack` around the callback keeps its reads
out of the dependency set, so the watcher wakes only when `source` changes. An equal write
never reaches the effect at all, because the signal filters it out.
'''

[[unit]]
id = "dxjs-u05-owners"
title = "The owner tree and teardown"
level = "intermediate"
difficulty = 5
intro = '''
Every effect and computed belongs to an owner, and disposing the owner tears down everything
inside it, in order. `createRoot` gives you an owner of your own: the shape of a store.
'''
concepts = '''
## The idea

Reactive code creates things that keep running: effects that listen, subscriptions that
deliver, timers that fire. If nothing ever stops them, a long-running app leaks memory and
does work for screens nobody sees. dxjs answers with **ownership**: every effect or computed
is owned by the scope that was active when it was created, and disposing a scope disposes
everything it owns, recursively. Teardown is deterministic, never left to chance.

## How dxjs does it

```ts
import { createRoot, effect, onCleanup } from "@dxjs/core";

const dispose = createRoot((dispose) => {
  effect(() => console.log("tick", ticks()));   // owned by the root
  onCleanup(() => console.log("bye"));          // runs when the root is disposed
  return dispose;
});

dispose();   // disposes the effect, then runs the cleanups
```

- `createRoot(fn)` creates a scope with no parent, runs `fn(dispose)` inside it and returns
  what `fn` returns. Reads inside `fn` itself are not tracked.
- `onCleanup(fn)` registers teardown on the **current owner**: a root, an effect or a
  computed. Outside any owner it does nothing.
- An effect is itself an owner. Effects created *inside* an effect are disposed before each
  re-run of the outer one, so nested work is always rebuilt fresh, never duplicated.
- Components (later units) run inside a root that `mount` creates, which is why unmounting
  stops everything they started.

## What is special or tricky

- **A store is a root.** When a module creates long-lived state with effects, wrap it in
  `createRoot` and hand out its `dispose`. Tests and hot reload can then throw it away.
- **Order of teardown:** owned children first, then the owner's own cleanups.
- **`onCleanup` must run inside the owner.** Registering it later, from a callback, attaches
  it to whatever owner is current at that moment (often none).
- **Disposed means gone.** A disposed effect never runs again, even if its signals change.

## What you will practise

You will dispose a root with an effect and a cleanup, watch nested effects being replaced
when their parent re-runs, and then connect a price feed whose subscription and alerts all
stop with one `dispose`.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u05-c1-ownership"
title = "Who owns this effect?"
points = 5
difficulty = 5
intro = '''
The owner of an effect is simply the reactive scope that was running when the effect was
created. That one rule builds a tree, and the tree decides what gets cleaned up and when.
'''
body = '''
## A tree of scopes

```ts
createRoot((dispose) => {           // root
  effect(() => {                    // ├─ outer effect
    const r = room();
    effect(() => listen(r));        // │  └─ inner effect (rebuilt on every outer run)
  });
  computed(() => expensive());      // └─ computed
  return dispose;
});
```

- Disposing the root disposes the outer effect (and so the inner one) and the computed.
- When `room` changes, the outer effect first disposes its children, so the old inner
  effect stops before the new one starts.

## Cleanups

Return a function from an effect or call `onCleanup(fn)` in any owner. Cleanups run when the
owner re-runs (effects) or is disposed, after its children are gone.
'''

