dxt.test("non-Error values are turned into strings", () => {
  const n = signalForTest(0);
  const g = guard(() => {
    effectForTest(() => {
      if (n() === 1) throw "plain text";
    });
  });
  n.set(1);
  dxt.equal(g.error(), "plain text");
});

dxt.test("a computed that throws is caught through the effect reading it", () => {
  const n = signalForTest(2);
  const g = guard(() => {
    const inverse = computedForTest(() => {
      if (n() === 0) throw new Error("division by zero");
      return 1 / n();
    });
    effectForTest(() => {
      inverse();
    });
  });
  n.set(0);
  dxt.equal(g.error(), "division by zero");
});

dxt.test("error is reactive and siblings keep working", () => {
  const n = signalForTest(1);
  const seen: number[] = [];
  const g = guard(() => {
    effectForTest(() => {
      if (n() === 2) throw new Error("two");
    });
    effectForTest(() => {
      seen.push(n());
    });
  });
  const shown = computedForTest(() => g.error() ?? "fine");
  dxt.equal(shown(), "fine");
  n.set(2);
  dxt.equal(shown(), "two");
  n.set(3);
  dxt.equal(seen, [1, 2, 3]);
});

dxt.test("dispose stops everything run created", () => {
  const n = signalForTest(0);
  const seen: number[] = [];
  const g = guard(() => {
    effectForTest(() => {
      seen.push(n());
    });
  });
  g.dispose();
  n.set(1);
  dxt.equal(seen, [0]);
});
'''

[unit.step.gabarito]
solution = '''
import { signal, onError, createRoot } from "@dxjs/core";

// Run reactive setup under an error boundary and report the last error.
export function guard(run: () => void) {
  return createRoot((dispose) => {
    const error = signal<string | null>(null);
    onError((e) => error.set(e instanceof Error ? e.message : String(e)));
    run();
    return { error: () => error(), dispose };
  });
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
`guard` adds one root, one handler and one signal: **O(1)** time and space on top of whatever
`run` builds. Correctness comes from the order: the handler is registered on the root *before*
`run()`, so every effect created by `run` has the root as its owner and its errors walk up to
that handler. The write that triggered a failing effect returns normally, the error becomes
state, and `dispose()` tears the whole subtree down at once.
'''

[[unit]]
id = "dxjs-u07-store"
title = "A store in modules"
level = "intermediate"
difficulty = 7
intro = '''
Put the pieces together into the shape real dxjs apps use: plain functions for the rules, a
store module that owns the signals and derives everything else, and types shared by both.
'''
concepts = '''
## The idea

A UI that grows needs a home for its state that is not a component. A **store** is a module
that owns some signals, derives what can be derived, and offers a small set of operations to
change them. Everything else (the view, other stores, tests) uses those operations and reads
the derived values. The rules themselves (which todos a filter shows, how many are left) are
**plain functions** with no reactivity at all, easy to test on their own.

## How dxjs does it

```ts
// src/filters.ts: pure rules
export function remaining(todos: Todo[]): number {
  return todos.filter((t) => !t.done).length;
}

// src/store.ts: state + derivations + operations
import { signal, computed, createRoot } from "@dxjs/core";
import { remaining } from "./filters.ts";

export function createTodoStore(initial: Todo[] = []) {
  return createRoot((dispose) => {
    const todos = signal(initial);
    const left = computed(() => remaining(todos()));
    return {
      todos: () => todos(),
      remaining: left,
      add(text: string) { /* … todos.update(…) … */ },
      dispose,
    };
  });
}
```

- **One signal per independent piece of state** (the list, the current filter). Everything
  derivable is a `computed` that calls a pure function.
- **Reads out, writes in:** expose accessors and computeds, keep `.set`/`.update` private.
- **A root per store**, with its `dispose` returned, so the store can be thrown away cleanly.
- **Types in their own module**, imported with `import type`, which Node strips entirely.

## Modules in Node

In this course Node runs your `.ts` files directly, as ES modules, so imports between your
files spell the extension: `import { visible } from "./filters.ts"`. A type-only import must
say `import type { Todo } from "./types.ts"`, because the file exports no runtime value.

## What is special or tricky

- **A computed returns the same object until its inputs change.** `store.visible()` called
  twice gives the *same* array, which lets views skip work. A plain function would build a
  new array on every call.
- **Ids are state too.** Keep a counter in the store; derive the first id from the initial data
  so new items never collide with existing ones.
- **Validate at the edge.** `add("   ")` should not create an empty todo: trim and refuse.

## What you will practise

You will build a small store with a root and a computed, then write a todo store across three
files: pure filters, the store itself, and shared types (read-only).
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u07-c1-store"
title = "Rules, state and operations"
points = 5
difficulty = 7
intro = '''
A store separates three things that are easy to mix up: the rules (pure functions), the state
(signals) and the ways to change it (operations). Keeping them apart is what makes each one
small and testable.
'''
body = '''
## Three layers

| Layer | Lives in | Example |
|---|---|---|
| Rules | plain functions | `visible(todos, filter)` |
| State | signals inside the store | `todos`, `filter` |
| Derived | computeds over the rules | `shown = computed(() => visible(todos(), filter()))` |
| Operations | methods of the store | `add`, `toggle`, `remove`, `setFilter` |

The view never computes anything itself: it reads `store.visible()` and `store.remaining()`,
and calls `store.toggle(id)` when the user clicks. Swapping the view, or testing the store
without any view, needs no change to the store.

## One owner

`createRoot` gives the store an owner. Today the store only has computeds; tomorrow it might
persist to storage with an effect. Either way, `store.dispose()` stops it.
'''

