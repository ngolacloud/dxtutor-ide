"src/app.ts" = '''
import { signal } from "@dxjs/core";
import { html } from "@dxjs/dom";
import { component } from "@dxjs/component";
import type { createTodoStore } from "./store.ts";
import type { Filter } from "./types.ts";
import { TodoList } from "./todo-list.ts";

type TodoStore = ReturnType<typeof createTodoStore>;

const FILTERS: Array<[Filter, string]> = [
  ["all", "All"],
  ["active", "Active"],
  ["done", "Done"],
];

// The app: a form, the list, and a footer with the count, the filters and "Clear done".
export const App = component((props: { store: TodoStore }) => {
  const store = props.store;
  const draft = signal("");
  const submit = (e: Event) => {
    e.preventDefault();
    if (store.add(draft())) draft.set("");
  };
  const left = () => {
    const n = store.remaining();
    return n === 1 ? "1 item left" : n + " items left";
  };
  return html`
    <form class="new-todo" @submit=${submit}>
      <input
        placeholder="What needs doing?"
        .value=${() => draft()}
        @input=${(e: Event) => draft.set((e.target as HTMLInputElement).value)}
      />
      <button>Add</button>
    </form>
    ${TodoList({
      todos: () => store.visible(),
      onToggle: (id) => store.toggle(id),
      onRemove: (id) => store.remove(id),
    })}
    <footer>
      <span class="remaining">${left}</span>
      ${FILTERS.map(
        ([filter, label]) => html`<button
          class="filter"
          data-filter=${filter}
          aria-pressed=${() => String(store.filter() === filter)}
          @click=${() => store.setFilter(filter)}
        >${label}</button>`,
      )}
      <button class="clear" ?disabled=${() => !store.todos().some((t) => t.done)} @click=${() => store.clearDone()}>
        Clear done
      </button>
    </footer>`;
});
'''
"src/main.ts" = '''
import { mount } from "@dxjs/component";
import { createTodoStore } from "./store.ts";
import type { Todo } from "./types.ts";
import { App } from "./app.ts";

// Create the store, mount the app, and return one function that tears both down.
export function start(host: Element, initial: Todo[] = []): () => void {
  const store = createTodoStore(initial);
  const unmount = mount(App, host, { store });
  return () => {
    unmount();
    store.dispose();
  };
}
'''
