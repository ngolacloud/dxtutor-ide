body = '''
## Stored vs derived

| Stored (signals) | Derived (computeds) |
|---|---|
| `values` | `errors = validate(values)` |
| touched fields | `isValid = no errors` |
| | `dirty = some value differs from initial` |

## Showing an error at the right time

```ts
const showEmailError = () => form.touched("email")() && form.error("email")();
```

Before the user leaves the field, nothing is shown; after a blur or a submit attempt, the
current message is, and it disappears as soon as the value becomes valid, because both parts
are reactive reads.
'''

