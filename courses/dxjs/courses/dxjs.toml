[[unit.step]]
kind = "challenge"
id = "dxjs-u03-x1-channel"
title = "Follow a chat channel"
points = 20
difficulty = 3
entry = "followChannel"
intro = '''
A subscription that depends on reactive state is the textbook effect: subscribe for the current
value, and when the value changes, release the old subscription before taking the new one. The
cleanup function is what makes that switch leak-free.
'''
instructions = '''
## Your turn

Implement `followChannel`:

```ts
export interface Bus {
  subscribe(channel: string, onMessage: (text: string) => void): () => void;
}

export function followChannel(
  channel: () => string,
  bus: Bus,
  onMessage: (channel: string, text: string) => void,
): () => void
```

- Subscribe to `bus` for the channel `channel()` returns, **right away**. Each message
  `text` on it calls `onMessage(thatChannel, text)`.
- When `channel()` changes, **unsubscribe from the old channel first**, then subscribe to the
  new one. At any time there is exactly one subscription.
- Return a function that stops following: it unsubscribes, and later channel changes do
  nothing.

Use one `effect` whose cleanup is the function `bus.subscribe` returned.
'''
starter = '''
import { effect } from "@dxjs/core";

export interface Bus {
  subscribe(channel: string, onMessage: (text: string) => void): () => void;
}

// Keep exactly one subscription, always for the current channel.
export function followChannel(
  channel: () => string,
  bus: Bus,
  onMessage: (channel: string, text: string) => void,
): () => void {
  throw new Error("not implemented");
}
'''
tests = '''
import { signal as signalForTest } from "@dxjs/core";

function fakeBus() {
  const subs = new Map<string, Set<(text: string) => void>>();
  const log: string[] = [];
  return {
    log,
    subscribe(channel: string, fn: (text: string) => void) {
      log.push("sub " + channel);
      if (!subs.has(channel)) subs.set(channel, new Set());
      subs.get(channel)!.add(fn);
      return () => {
        log.push("unsub " + channel);
        subs.get(channel)!.delete(fn);
      };
    },
    send(channel: string, text: string) {
      for (const fn of [...(subs.get(channel) ?? [])]) fn(text);
    },
    active() {
      return [...subs].filter(([, s]) => s.size > 0).map(([c, s]) => c + ":" + s.size);
    },
  };
}

dxt.test("subscribes to the current channel right away", () => {
  const bus = fakeBus();
  followChannel(signalForTest("general"), bus, () => {});
  dxt.equal(bus.active(), ["general:1"]);
});

dxt.test("delivers messages with their channel", () => {
  const bus = fakeBus();
  const got: string[] = [];
  followChannel(signalForTest("general"), bus, (c, t) => got.push(c + ": " + t));
  bus.send("general", "hello");
  bus.send("random", "not for us");
  dxt.equal(got, ["general: hello"]);
});

dxt.test("switching unsubscribes the old channel before subscribing the new one", () => {
  const bus = fakeBus();
  const room = signalForTest("general");
  const got: string[] = [];
  followChannel(room, bus, (c, t) => got.push(c + ": " + t));
  room.set("random");
  dxt.equal(bus.log, ["sub general", "unsub general", "sub random"]);
  dxt.equal(bus.active(), ["random:1"]);
  bus.send("general", "old");
  bus.send("random", "new");
  dxt.equal(got, ["random: new"]);
});

dxt.test("writing the same channel does not resubscribe", () => {
  const bus = fakeBus();
  const room = signalForTest("general");
  followChannel(room, bus, () => {});
  room.set("general");
  dxt.equal(bus.log, ["sub general"]);
});

dxt.test("the returned function stops following", () => {
  const bus = fakeBus();
  const room = signalForTest("general");
  const stop = followChannel(room, bus, () => {});
  stop();
  dxt.equal(bus.active(), []);
  room.set("random");
  dxt.equal(bus.log, ["sub general", "unsub general"]);
});
'''

[unit.step.gabarito]
solution = '''
import { effect } from "@dxjs/core";

export interface Bus {
  subscribe(channel: string, onMessage: (text: string) => void): () => void;
}

// Keep exactly one subscription, always for the current channel.
export function followChannel(
  channel: () => string,
  bus: Bus,
  onMessage: (channel: string, text: string) => void,
): () => void {
  return effect(() => {
    const name = channel();
    return bus.subscribe(name, (text) => onMessage(name, text));
  });
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Each channel change costs one unsubscribe and one subscribe, **O(1)** work on top of the bus's
own; the effect keeps one closure and one cleanup, **O(1)** space. Returning the unsubscribe
function as the effect's cleanup is the whole trick: dxjs runs it before every re-run and on
dispose, so the old subscription is always released first and none can leak. The effect's
disposer doubles as the "stop following" function.
'''

# ── intermediate ─────────────────────────────────────────────────────────────────────

[[unit]]
id = "dxjs-u04-batch-untrack"
title = "Batch and untrack"
level = "intermediate"
difficulty = 4
intro = '''
Two tools for precise control: `batch` groups several writes into one consistent update, and
`untrack` (or `.peek()`) reads a value without subscribing to it.
'''
concepts = '''
## The idea

By default every write is delivered at once: write two signals in a row and an effect that
reads both runs twice, the first time seeing a half-updated state (the new first name with
the old last name). Most of the time you want the opposite: make all the changes, *then* let
the world react once. And sometimes a computation needs a value without wanting to depend
on it.

## How dxjs does it

**`batch(fn)`** runs `fn` and delays every effect until it finishes:

```ts
batch(() => {
  first.set("Alan");
  last.set("Turing");
});   // effects run here, once, and see both new values
```

- Batches nest: only the outermost one flushes.
- `batch` returns what `fn` returns.
- Computeds are still correct *inside* the batch: reading one recomputes it on demand.

**`untrack(fn)`** runs `fn` with tracking switched off and returns its result. Signals read
inside it do not become dependencies of the surrounding computed or effect:

```ts
effect(() => {
  const size = untrack(() => pageSize());   // read, but not a dependency
  search(query(), size);                     // re-runs on query changes only
});
```

`signal.peek()` is the shorthand for one signal: `pageSize.peek()`.

## What is special or tricky

- **A callback is a hidden read.** When an effect calls code you do not control (a user
  callback, a logger), every signal that code reads becomes a dependency of your effect.
  Wrap such calls in `untrack` so your effect re-runs only for its own reasons.
- **`untrack` is not "read once".** The value is current at the time of the read; the effect
  simply will not wake up when it changes.
- **Batch writes that belong together.** Moving money between two accounts, replacing a list
  and its selection, resetting a form: one batch per logical change keeps every observer
  consistent.
- **Event handlers in dxjs are not batched for you.** Wrap multi-signal updates yourself.

## What you will practise

You will count effect runs with and without a batch, read a value without depending on it,
and then write `watch`, a helper that calls back with the new and previous value of any
reactive expression, without letting the callback's own reads leak into the subscription.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u04-c1-consistent"
title = "One logical change, one update"
points = 5
difficulty = 4
intro = '''
Batching is about consistency more than speed: observers should only ever see states that make
sense, never the halfway point between two writes.
'''
body = '''
## The halfway state

```ts
const from = signal(100);
const to = signal(0);
effect(() => console.log("total", from() + to()));

from.update((n) => n - 30);   // prints "total 70"  ← money vanished!
to.update((n) => n + 30);     // prints "total 100"
```

With `batch(() => { from.update(...); to.update(...); })` the effect runs once, after both
writes, and prints `total 100`: no observer ever sees the 30 in flight.

## Reading without subscribing

```ts
const total = computed(() => price() * untrack(() => rate()));
```

`total` recomputes when `price` changes. A change to `rate` alone does not invalidate it; the
next recomputation, caused by `price`, will pick up the current rate.
'''

