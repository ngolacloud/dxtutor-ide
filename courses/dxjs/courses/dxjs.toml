body = '''
## Who owns what

| Piece | Owns | Talks to |
|---|---|---|
| `store.ts` | the todos and the filter (signals), the rules (computeds) | nobody |
| `todo-list.ts` | nothing | its props: `todos()`, `onToggle`, `onRemove` |
| `app.ts` | the draft text | the store, through its operations and computeds |
| `main.ts` | the store instance and the mounted view | `createTodoStore`, `mount` |

## Events in, state out

1. The user types: `@input` writes `draft`.
2. The user presses Enter: `@submit` calls `store.add(draft())` and clears `draft`.
3. `store.add` writes the todos signal.
4. The computeds `visible` and `remaining` change; the list effect adds one row and the count
   text updates. Nothing else runs.
'''

