[[unit.step]]
kind = "drill"
id = "dxjs-u08-d2-optimistic"
title = "Write the cache, then invalidate"
points = 10
difficulty = 8
placeholder_policy = "shown"
run_command = "node --experimental-transform-types main.ts"
intro = '''
A user is loaded, overwritten optimistically with `setData`, and then reloaded with
`invalidate`. A version counter in the fake server shows which answer you are looking at.
'''
