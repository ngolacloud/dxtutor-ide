[[unit]]
id = "dxjs-u01-signals"
title = "Signals: reactive values"
level = "basic"
difficulty = 1
intro = '''
The one primitive everything else in dxjs is built on: a signal, a cell that holds a value and
knows who is reading it. You will read and write signals, update them from their previous
value, and keep their contents immutable.
'''
concepts = '''
## The idea

A user interface is state plus a picture of that state. When the state changes, the picture
must follow. Frameworks such as React re-run whole components and compare trees to find what
changed. dxjs takes the opposite road: it records **exactly who read which value**, so a change
can go straight to the few places that depend on it. The thing that holds such a value is a
**signal**.

## How dxjs does it

`signal(initial)` from `@dxjs/core` returns a function:

```ts
import { signal } from "@dxjs/core";

const count = signal(0);
count();                      // read: 0
count.set(5);                 // write a value
count.update((n) => n + 1);   // write from the previous value: 6
count((n) => n * 2);          // calling with a function is an update too: 12
count(3);                     // calling with a value is a set
count.peek();                 // read WITHOUT subscribing (more on this later)
```

Reading is a call with no arguments. When that read happens inside a computed or an effect,
the signal remembers the reader and will notify it on the next change. Every write returns
the new value.

A write that does not change the value does **nothing**: by default a signal compares the old
and new value with `Object.is`. You can change that with an option:
`signal(v, { equals: false })` notifies on every write, and
`signal(v, { equals: (a, b) => a.id === b.id })` uses your own comparison.

## What is special or tricky

- **Never mutate what a signal holds.** `todos().push(item)` changes the array in place, the
  signal still holds the *same* array, `Object.is` says nothing changed, and nobody is told.
  Write a new value instead: `todos.update((list) => [...list, item])`.
- **A function stored in a signal must go through `.set`.** `s(fn)` treats `fn` as an
  updater; `s.set(fn)` stores it.
- **Types are only for you.** In this course Node strips TypeScript types before running, so
  a type-only import must say so: `import type { Signal } from "@dxjs/core"`. The library
  itself exports only values.
- **Expose reads, keep writes private.** Returning `() => count()` instead of `count` lets
  other code read the value but not change it.

## What you will practise

You will type programs that read and write signals and update a list immutably. Then you
will build a counter whose state lives in a signal, exposing only a read-only accessor.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u01-c1-signal"
title = "A signal is a reactive cell"
points = 5
difficulty = 1
intro = '''
Before typing, picture a signal as a box with a list of readers written on its side. Reading
the box inside a reactive scope adds your name to the list; writing a new value tells everyone
on the list.
'''
body = '''
## Read by calling, write with set or update

```ts
import { signal } from "@dxjs/core";

const name = signal("Ana");
console.log(name());          // Ana
name.set("Grace");
console.log(name());          // Grace
name.update((n) => n.toUpperCase());
console.log(name());          // GRACE
```

Things to notice:

- **`signal("Ana")`** returns a *function*. The value lives inside it; you never touch a
  `.value` field.
- **`name()`** reads. Outside any computed or effect, a read is just a read.
- **`.set(v)`** replaces the value; **`.update(fn)`** computes it from the previous one.
- A write of an **equal** value (by `Object.is`) is ignored, so nobody is disturbed.

## Values, not places

A signal holds a value, and a change is a *new* value. With arrays and objects that means
building a copy with the change: `[...list, item]`, `list.filter(...)`, `{ ...todo, done: true }`.
That is what lets the signal see that something changed at all.
'''

