| Member | Meaning |
|---|---|
| `todos()` | the current list |
| `filter()` | the current filter, `"all"` at first |
| `visible()` | a **computed**: `visible(todos(), filter())` |
| `remaining()` | a **computed**: `remaining(todos())` |
