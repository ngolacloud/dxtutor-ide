[unit.step.gabarito]
solution = '''
import { query } from "@dxjs/query";
import type { Query, QueryClient } from "@dxjs/query";

export type User = { id: number; name: string };

export interface UserApi {
  get(id: number): Promise<User>;
  rename(id: number, name: string): Promise<User>;
}

// Users cached by id; renames are optimistic and roll back on failure.
export function createUserDirectory(client: QueryClient, api: UserApi) {
  return {
    user(id: number): Query<User> {
      return query(client, ["users", id], () => api.get(id), { staleTime: 30_000 });
    },
    async rename(id: number, name: string): Promise<void> {
      const previous = client.getData<User>(["users", id]);
      if (previous) client.setData(["users", id], { ...previous, name });
      try {
        await api.rename(id, name);
      } catch (e) {
        if (previous) client.setData(["users", id], previous);
        throw e;
      }
      await client.invalidate(["users", id]);
    },
  };
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
`user(id)` is a cache lookup by key; `rename` does a constant number of cache operations plus
one invalidation, which scans the client's `n` cache entries for the `["users", id]` prefix:
**O(n)** time, **O(1)** extra space. The order of operations is the point: the optimistic write
happens before the request so the UI updates instantly, the rollback restores the exact object
that was cached, and the targeted invalidation reloads one user, because the prefix
`["users", 1]` does not match `["users", 10]`.
'''

[[unit]]
id = "dxjs-u09-forms"
title = "Forms with @dxjs/forms"
level = "intermediate"
difficulty = 9
intro = '''
A form is state too: values, which fields were touched, what is wrong, whether it changed.
`@dxjs/forms` keeps the values in a signal and derives errors, validity and dirtiness as
computeds, with your validation rules as a plain function.
'''
concepts = '''
## The idea

Forms collect many small decisions: show an error only after the user left the field, enable
"Save" only when the form is valid and changed, reset after saving. Spread across event
handlers, these rules contradict each other. `@dxjs/forms` (the dxjs answer to
react-hook-form) models the whole form as signals and computeds, so every rule is a derived
value and the view only reads.

## How dxjs does it

```ts
import { createForm } from "@dxjs/forms";

const form = createForm({
  initial: { email: "", password: "" },
  validate: (v) => (v.email.includes("@") ? {} : { email: "Enter a valid email" }),
});

form.values();                 // { email: "", password: "" }  (reactive)
form.setValue("email", "ana@dxjs.dev");
form.errors();                 // {}            computed from validate(values)
form.isValid();                // true          no errors
form.dirty();                  // true          a value differs from the initial one
form.touched("email")();       // false         until blur or a submit attempt
form.error("email")();         // undefined     one field's message
```

- `validate(values)` is a **plain function** returning `{ field: message }` for the fields that
  are wrong (an empty object when all is well). Bring your own, or adapt a zod schema with
  `zodValidate(schema)` (duck-typed: any object with `safeParse` works).
- `form.field(name)` returns `{ value, onInput, onBlur }` to bind an input: `onInput` reads
  `event.target.value`, `onBlur` marks the field touched.
- `form.handleSubmit(onValid)` returns a submit handler. It calls `event.preventDefault()`
  when given an event, marks **every** field touched, and calls `onValid(values)` only if the
  form is valid.
- `form.reset()` restores the initial values and clears touched.

## What is special or tricky

- **Errors exist from the start**; showing them is a view decision. The usual rule is
  `touched(name)() && error(name)()`.
- **Keep validation pure and separate.** A `validateSignup(values)` function in its own module
  is trivial to test and reusable on the server.
- **Transform on the way out.** Normalise what you send (lowercase an email, drop a
  confirmation field) inside `onValid`, not in the form's state.
- **`touched(name)` and `error(name)` return accessors:** call them again to read.

## What you will practise

You will drive a login form through invalid, valid, submit and reset. Then, across two files,
you will write signup validation rules and the form that uses them.
'''

[[unit.step]]
