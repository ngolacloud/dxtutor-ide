id = "dxjs-basics"
language = "typescript"
category = "framework"
subject = "dxjs"
title = "Dxjs: Reactive UIs from Signals Up"
level = "intermediate"
summary = "Learn dxjs, NgolaCloud's fine-grained reactive UI engine, the way it is built: from a single signal to computeds, effects, batching and the owner tree, then cached queries, forms, safe html templates and components, and finally a small app. Every exercise runs against the real dxjs 1.3.0."
overview = '''
## What dxjs is

dxjs is a **fine-grained reactive UI engine** written in TypeScript. It has no Virtual DOM,
no re-render cycle and no build step in development. A dxjs component is a *constructor*: it
runs **once**, builds the DOM, and wires every dynamic spot to a **signal**. When a signal
changes, only the bindings that read it run again: one text node, one attribute, one list
row. Nothing is diffed.

It was designed to run under a strict Content-Security-Policy: no `eval`, no inline event
handlers, and data is always escaped on the way into the page. A full reactive app
(core + dom + component) is about 2.8 KB gzip.

## Where it is used

dxjs powers the NgolaCloud consoles, such as the Seiva Console Admin. The official
documentation is at [ngolacloud.github.io/dxjs](https://ngolacloud.github.io/dxjs/). Its
packages are published as tarballs on the
[GitHub releases](https://github.com/ngolacloud/dxjs/releases), not on npm.

## The mental model

Everything in this course grows from four primitives in `@dxjs/core`:

- a **signal** holds a value; call it to read, `.set` or `.update` to write;
- a **computed** derives a value from signals and caches it;
- an **effect** runs a side effect now and again whenever what it read changes;
- an **owner** (a root, a component, an effect) disposes everything created inside it.

The rule that keeps an app reactive is short: **keep the read lazy**. Pass a function that
reads a signal, `() => count()`, not the value `count()`.

## How the course is organised

- **Basic:** signals, computeds and effects.
- **Intermediate:** batching and untracking, the owner tree, context and error boundaries,
  a store in modules, cached queries with `@dxjs/query` and forms with `@dxjs/forms`.
- **Advanced:** `html` templates and `render` from `@dxjs/dom`, components with
  `@dxjs/component`, and a small todo app that puts it all together.

## How grading works

You write TypeScript, which Node.js runs directly by stripping the types, so you need
**Node.js 22.18 or newer**. The course brings dxjs 1.3.0 with it (the official `cdn/dxjs.js`
bundle, built from the release), so `import { signal } from "@dxjs/core"` works offline,
exactly as in a real project. The DOM units also get a browser-like DOM for Node from
[happy-dom](https://github.com/capricorn86/happy-dom), the same one dxjs's own tests use.
Challenges are judged by hidden tests; project steps by hidden `node:test` files.

You should already know basic TypeScript (functions, objects, arrays, `async`/`await`). The
official TypeScript course covers all of it.
'''

