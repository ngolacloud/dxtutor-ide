- `+`/`-` add/subtract `step()` read **at click time** (the prop can change).

**`src/todo-list.ts`**: `TodoList` with props
`{ todos: () => Todo[]; onToggle: (id: number) => void; onRemove: (id: number) => void }`:

```html
<ul class="todos">
  <li data-id="1" class="done"><input type="checkbox"> <span>text</span> <button class="remove">×</button></li>
  …
</ul>
```

- one `<li>` per todo, in order, rendered with `list` and keyed by **`t.id`**: a row keeps its
  DOM node for as long as its todo is in the list, through toggles, inserts and removals;
- the `<li>` has the class `done` when the todo is done (and no `class` when not), and the
  checkbox's `checked` **property** matches `done`, and both **follow the todo**: a toggled todo
  (a new object with the same id) updates its kept row in place (a row is rendered once per key,
  so bind them to the current todo, see the reading text);
- the checkbox's `change` event calls `onToggle(id)`, the button's `click` calls `onRemove(id)`;
- the text is shown as text (escaped).
