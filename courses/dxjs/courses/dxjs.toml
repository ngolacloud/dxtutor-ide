entry = "connectFeed"
intro = '''
A store with a subscription and an effect: prices arrive from outside, an alert rule watches
them, and a single `dispose` must stop both. `createRoot` gives the store its owner, and
`onCleanup` ties the subscription to it.
'''
instructions = '''
## Your turn

Implement `connectFeed`:

```ts
export interface Feed {
  subscribe(onPrice: (price: number) => void): () => void;
}

export function connectFeed(
  feed: Feed,
  threshold: () => number,
  onAlert: (price: number) => void,
): {
  latest: () => number | undefined;   // the last price, undefined before the first
  history: () => number[];            // the last 5 prices, oldest first
  dispose: () => void;
}
```

- Create everything inside **`createRoot`** and return its `dispose`.
- Subscribe to `feed` at once; each price is appended to the history (keep only the **last 5**,
  as a new array each time). Register the unsubscribe with **`onCleanup`**.
- Run an **effect** that calls `onAlert(price)` whenever the latest price is strictly above
  `threshold()`. It re-checks when a new price arrives or when the threshold changes.
- `latest()` and `history()` are reactive reads.
- After `dispose()`: the feed has no subscriber left, and threshold changes trigger no alert.
'''
starter = '''
import { signal, effect, onCleanup, createRoot } from "@dxjs/core";

export interface Feed {
  subscribe(onPrice: (price: number) => void): () => void;
}

// One root owns the subscription and the alert effect; one dispose stops both.
export function connectFeed(feed: Feed, threshold: () => number, onAlert: (price: number) => void) {
  throw new Error("not implemented");
}
'''
tests = '''
import { signal as signalForTest, computed as computedForTest } from "@dxjs/core";

function fakeFeed() {
  const listeners = new Set<(price: number) => void>();
  return {
    subscribe(fn: (price: number) => void) {
      listeners.add(fn);
      return () => {
        listeners.delete(fn);
      };
    },
    emit(price: number) {
      for (const fn of [...listeners]) fn(price);
    },
    count: () => listeners.size,
  };
}

dxt.test("starts empty and subscribed", () => {
  const feed = fakeFeed();
  const c = connectFeed(feed, () => 1000, () => {});
  dxt.equal([c.latest(), c.history(), feed.count()], [undefined, [], 1]);
});

dxt.test("keeps the latest price and the last five", () => {
  const feed = fakeFeed();
  const c = connectFeed(feed, () => 1000, () => {});
  for (const p of [1, 2, 3, 4, 5, 6, 7]) feed.emit(p);
  dxt.equal(c.latest(), 7);
  dxt.equal(c.history(), [3, 4, 5, 6, 7]);
});

dxt.test("latest and history are reactive", () => {
  const feed = fakeFeed();
  const c = connectFeed(feed, () => 1000, () => {});
  const label = computedForTest(() => c.latest() + " of " + c.history().length);
  dxt.equal(label(), "undefined of 0");
  feed.emit(42);
  dxt.equal(label(), "42 of 1");
});

dxt.test("alerts when the price is above the threshold", () => {
  const feed = fakeFeed();
  const limit = signalForTest(100);
  const alerts: number[] = [];
  connectFeed(feed, limit, (p) => alerts.push(p));
  feed.emit(90);
  feed.emit(120);
  dxt.equal(alerts, [120]);
  limit.set(130);
  dxt.equal(alerts, [120]);
  limit.set(110);
  dxt.equal(alerts, [120, 120]);
  feed.emit(100);
  dxt.equal(alerts, [120, 120]);
});

dxt.test("dispose unsubscribes and stops the alerts", () => {
  const feed = fakeFeed();
  const limit = signalForTest(100);
  const alerts: number[] = [];
  const c = connectFeed(feed, limit, (p) => alerts.push(p));
  feed.emit(150);
  c.dispose();
  dxt.equal(feed.count(), 0);
  limit.set(10);
  feed.emit(500);
  dxt.equal(alerts, [150]);
  dxt.equal(c.latest(), 150);
});
'''

[unit.step.gabarito]
solution = '''
import { signal, effect, onCleanup, createRoot } from "@dxjs/core";

export interface Feed {
  subscribe(onPrice: (price: number) => void): () => void;
}

// One root owns the subscription and the alert effect; one dispose stops both.
export function connectFeed(feed: Feed, threshold: () => number, onAlert: (price: number) => void) {
  return createRoot((dispose) => {
    const history = signal<number[]>([]);
    const latest = (): number | undefined => {
      const h = history();
      return h.length ? h[h.length - 1] : undefined;
    };
    onCleanup(feed.subscribe((price) => history.update((h) => [...h, price].slice(-5))));
    effect(() => {
      const price = latest();
      if (price !== undefined && price > threshold()) onAlert(price);
    });
    return { latest, history: () => history(), dispose };
  });
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Each price copies a history of at most five numbers and runs the alert check once: **O(1)**
time and **O(1)** space per price, whatever the length of the feed. The root is what makes
teardown a single call: the subscription's unsubscribe is a cleanup of the root and the alert
effect is owned by it, so `dispose()` releases both, in order, and nothing keeps running for a
store nobody uses.
'''

[[unit]]
id = "dxjs-u06-context-errors"
title = "Context and error boundaries"
level = "intermediate"
difficulty = 6
intro = '''
Two owner-tree features for real apps: context passes shared things (a locale, an API client)
down without threading them through every call, and `onError` contains failures so one broken
effect does not take the rest with it.
'''
concepts = '''
## The idea

Some values are needed everywhere: the current locale, the API client, the theme. Passing them
as arguments through every function ("prop drilling") is tedious and brittle. And in a big
app, something will throw: a malformed response, a bug in one widget. Without a boundary, an
exception in one effect surfaces at whatever write triggered it.

## How dxjs does it: context

```ts
import { createContext, provide, inject } from "@dxjs/core";

const Locale = createContext("en");          // a key with a default value

provide(Locale, "pt-AO", () => {
  inject(Locale);                            // "pt-AO" while this function runs
});
inject(Locale);                              // "en" (the default)
```

- `createContext(defaultValue)` makes a context; `inject(ctx)` returns the innermost
  provided value, or the default.
- `provide(ctx, value, fn)` makes `value` visible **while `fn` runs synchronously**, then
  restores the previous value. Provides nest.
- dxjs components run once, during construction, so the idiom is: `inject` at the top of a
  component and close over the result. A callback that runs *later* is outside `provide`.

## How dxjs does it: error boundaries

```ts
createRoot(() => {
  onError((e) => status.set("failed: " + String(e)));   // register FIRST
  effect(() => {
    if (bad()) throw new Error("boom");
  });
});
```

- `onError(handler)` registers a handler on the current owner.
- When an effect or computed throws, dxjs walks **up the owner tree** to the nearest owner with
  a handler and calls it (untracked). The write that triggered the effect does not throw.
- With no handler anywhere, the error is rethrown to the caller, after every other queued
  effect has still run.
- A handled throw disposes whatever the failed run had created, so nothing half-built lingers.

## What is special or tricky

- **Register the boundary before the work** it should guard.
- **The handler is notified, it does not render.** The idiom is to record the error in a
  signal and let the display read that signal.
- **A throw during the very first run** of an effect is caught too, if the boundary is in place.
- **Context is not reactive.** To share changing state, provide a signal and read it.

## What you will practise

You will greet in the provided locale with nested `provide`s, contain a parse error with a
boundary, and then write `guard`, a reusable boundary that records the last error.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u06-c1-scope"
title = "Resolved by construction, caught by ownership"
points = 5
difficulty = 6
intro = '''
Context and error boundaries both lean on structure: context on the call stack during
construction, boundaries on the owner tree. Knowing which structure each uses tells you where
they work.
'''
body = '''
## Context follows the call

`provide` pushes a value, runs your function, and pops it. Whatever `inject` runs inside that
call sees the value; anything that runs later (an event handler, a timer) does not. So read the
context at construction time and keep the result:

```ts
function makeGreeter() {
  const locale = inject(Locale);                 // read once, now
  return (name: string) => locale + ": " + name; // the closure keeps it
}
```

## Errors follow the owners

An error in an effect looks for a handler on the effect, then its owner, then that owner's
owner, up to the root. The first handler found wins; siblings keep working.
'''

