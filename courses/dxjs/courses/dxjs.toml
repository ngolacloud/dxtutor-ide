import { test } from "node:test";
import assert from "node:assert/strict";
import { effect } from "@dxjs/core";
import { createTodoStore } from "./src/store.ts";

test("starts with the initial todos and the all filter", () => {
  const s = createTodoStore([{ id: 7, text: "x", done: true }]);
  assert.deepEqual(s.todos(), [{ id: 7, text: "x", done: true }]);
  assert.equal(s.filter(), "all");
  assert.equal(s.remaining(), 0);
});

test("add trims, appends and returns the todo", () => {
  const s = createTodoStore();
  const t = s.add("  buy milk  ");
  assert.deepEqual(t, { id: 1, text: "buy milk", done: false });
  assert.deepEqual(s.todos(), [{ id: 1, text: "buy milk", done: false }]);
});

test("add refuses empty text", () => {
  const s = createTodoStore();
  const before = s.todos();
  assert.equal(s.add("   "), null);
  assert.equal(s.todos(), before);
});

test("ids continue after the largest initial id and keep increasing", () => {
  const s = createTodoStore([
    { id: 4, text: "a", done: false },
    { id: 9, text: "b", done: false },
  ]);
  assert.equal(s.add("c")!.id, 10);
  s.remove(10);
  assert.equal(s.add("d")!.id, 11);
});

test("toggle flips done with new objects in a new array", () => {
  const s = createTodoStore([{ id: 1, text: "a", done: false }]);
  const before = s.todos();
  s.toggle(1);
  assert.equal(s.todos()[0].done, true);
  assert.equal(before[0].done, false);
  assert.notEqual(s.todos(), before);
  s.toggle(1);
  assert.equal(s.todos()[0].done, false);
});

test("remove and clearDone", () => {
  const s = createTodoStore([
    { id: 1, text: "a", done: true },
    { id: 2, text: "b", done: false },
    { id: 3, text: "c", done: true },
  ]);
  s.remove(2);
  assert.deepEqual(s.todos().map((t) => t.id), [1, 3]);
  s.add("d");
  s.clearDone();
  assert.deepEqual(s.todos().map((t) => t.text), ["d"]);
});

test("the filter drives visible", () => {
  const s = createTodoStore([
    { id: 1, text: "a", done: true },
    { id: 2, text: "b", done: false },
  ]);
  s.setFilter("active");
  assert.equal(s.filter(), "active");
  assert.deepEqual(s.visible().map((t) => t.id), [2]);
  s.setFilter("done");
  assert.deepEqual(s.visible().map((t) => t.id), [1]);
});

test("visible is a computed: the same array until something changes", () => {
  const s = createTodoStore([{ id: 1, text: "a", done: false }]);
  s.setFilter("active");
  const first = s.visible();
  assert.equal(s.visible(), first);
  s.add("b");
  assert.notEqual(s.visible(), first);
});

test("remaining is reactive", () => {
  const s = createTodoStore();
  const seen: number[] = [];
  const stop = effect(() => {
    seen.push(s.remaining());
  });
  s.add("a");
  s.add("b");
  s.toggle(1);
  stop();
  assert.deepEqual(seen, [0, 1, 2, 1]);
});

test("dispose is the root's disposer", () => {
  const s = createTodoStore();
  assert.equal(typeof s.dispose, "function");
  s.dispose();
});
'''

[unit.step.project.solution]
"src/filters.ts" = '''
import type { Filter, Todo } from "./types.ts";

// The todos a filter shows: all of them, only the not-done ("active") or only the done ones.
export function visible(todos: Todo[], filter: Filter): Todo[] {
  if (filter === "active") return todos.filter((t) => !t.done);
  if (filter === "done") return todos.filter((t) => t.done);
  return todos;
}

// How many todos are not done yet.
export function remaining(todos: Todo[]): number {
  return todos.filter((t) => !t.done).length;
}
'''
"src/store.ts" = '''
import { signal, computed, createRoot } from "@dxjs/core";
import type { Filter, Todo } from "./types.ts";
import { visible, remaining } from "./filters.ts";

// A store: two signals, two computeds over the pure rules, and the operations.
export function createTodoStore(initial: Todo[] = []) {
  return createRoot((dispose) => {
    const todos = signal<Todo[]>(initial);
    const filter = signal<Filter>("all");
    let nextId = initial.reduce((max, t) => Math.max(max, t.id), 0) + 1;
    return {
      todos: () => todos(),
      filter: () => filter(),
      visible: computed(() => visible(todos(), filter())),
      remaining: computed(() => remaining(todos())),
      add(text: string): Todo | null {
        const clean = text.trim();
        if (!clean) return null;
        const todo = { id: nextId++, text: clean, done: false };
        todos.update((ts) => [...ts, todo]);
        return todo;
      },
      toggle(id: number) {
        todos.update((ts) => ts.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
      },
      remove(id: number) {
        todos.update((ts) => ts.filter((t) => t.id !== id));
      },
      clearDone() {
        todos.update((ts) => ts.filter((t) => !t.done));
      },
      setFilter(f: Filter) {
        filter.set(f);
      },
      dispose,
    };
  });
}
'''

[[unit]]
id = "dxjs-u08-query"
title = "Cached queries with @dxjs/query"
level = "intermediate"
difficulty = 8
intro = '''
Server data as signals: `@dxjs/query` caches each request by key, shares one request between
readers, serves cached data while it refreshes, and refetches what you invalidate.
'''
concepts = '''
## The idea

Data from a server is not like local state. Several parts of the screen want the same user at
once; it may already be cached; it can go stale; after a change you must refresh it. Writing
that by hand in every component leads to duplicated requests and inconsistent screens.
`@dxjs/query` (the dxjs answer to react-query) puts it in one place: a **query client** that
caches results by **key**.

## How dxjs does it

```ts
import { createQueryClient, query } from "@dxjs/query";

const client = createQueryClient();

// inside a component (or any owner):
const todos = query(client, ["todos"], () => api.get("/todos"), { staleTime: 5000 });
todos.data();        // the value, reactive (undefined until the first load)
todos.isLoading();   // true until the first load finishes
todos.isFetching();  // true while any request for this key is in flight
todos.error();       // the last error, or undefined
todos.refetch();     // force a new request now

client.invalidate(["todos"]);          // mark stale and refetch live ones (prefix match)
client.setData(["todos"], optimistic);  // write the cache directly; readers update
client.getData(["todos"]);              // read the cache without subscribing
```

- **Keys** are strings or arrays: `["users", 1]`. Object keys are serialised in a stable order.
- **Dedupe:** concurrent queries for one key share a single in-flight request.
- **Stale-while-revalidate:** cached data is shown at once while a background refetch runs.
  `staleTime` (ms, default `0`) says how long data counts as fresh; a new reader of fresh data
  does not trigger a request.
- **Invalidate by prefix:** `invalidate(["users"])` matches `["users", 1]`, `["users", 2]`…
  but `invalidate(["users", 1])` does not match `["users", 10]`.
- A query is an **observer** of its key. Created inside an owner, it is released when the
  owner is disposed, and `invalidate` refetches only keys that still have observers.

## What is special or tricky

- **The fetcher is any `() => Promise<T>`:** `fetch`, a dxjs transport client, or a fake in tests.
- **Optimistic updates** write the expected result with `setData` before the server answers,
  then `invalidate` to get the truth. If the request fails, put the previous data back.
- **Results arrive asynchronously.** Right after `query(...)` the data is `undefined`; it
  appears once the promise settles.
- **Errors do not throw at you:** a failed fetch sets `error()` and keeps the old data.

## What you will practise

You will watch two readers share one request, update a cache optimistically and then
invalidate it, and build a user directory with optimistic renames that roll back on failure.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u08-c1-cache"
title = "A cache keyed by what you asked for"
points = 5
difficulty = 8
intro = '''
A query client is a map from keys to entries, and each entry is made of signals: data, error and
fetching. Reading a query is reading those signals, which is why server data updates the UI the
same way local state does.
'''
body = '''
## One entry per key

```ts
const a = query(client, ["user", 1], () => fetchUser(1));
const b = query(client, ["user", 1], () => fetchUser(1));
```

`a` and `b` observe the **same** entry: one request, one cached value, both update together.
A third query for `["user", 2]` is another entry.

## Fresh or stale

An entry remembers when it last loaded. Within `staleTime` it is fresh: a new reader just
gets the cache. After that, a new reader gets the cached value immediately *and* triggers a
background refetch. `invalidate` makes entries stale at once.

## The optimistic write

```ts
const before = client.getData<User>(["user", 1]);
client.setData(["user", 1], { ...before, name: "Ana" });   // the UI shows it now
await api.rename(1, "Ana");                                  // the server catches up
await client.invalidate(["user", 1]);                        // reload the truth
```
'''

