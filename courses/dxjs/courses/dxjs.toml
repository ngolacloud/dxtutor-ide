tests = '''
import { createRoot as createRootForTest } from "@dxjs/core";
import { createQueryClient as createClientForTest } from "@dxjs/query";

const settle = () => new Promise((resolve) => setTimeout(resolve, 0));

function fakeApi() {
  const db = new Map<number, string>([
