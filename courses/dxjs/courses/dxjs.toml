[unit.step.project.solution]
"src/validate.ts" = '''
export type Signup = { email: string; password: string; confirm: string };

export type SignupErrors = Partial<Record<keyof Signup, string>>;

const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

// One message per field that is wrong; nothing for the fields that are right.
export function validateSignup(values: Signup): SignupErrors {
  const errors: SignupErrors = {};
  if (!EMAIL.test(values.email)) errors.email = "Enter a valid email";
  if (values.password.length < 8) errors.password = "Use at least 8 characters";
  if (values.confirm !== values.password) errors.confirm = "Passwords do not match";
  return errors;
}
'''
"src/signup.ts" = '''
import { createForm } from "@dxjs/forms";
import { validateSignup } from "./validate.ts";
import type { Signup } from "./validate.ts";

// The signup form, and a submit handler that saves normalised data.
export function createSignupForm(onSave: (data: { email: string; password: string }) => void) {
  const form = createForm<Signup>({
    initial: { email: "", password: "", confirm: "" },
    validate: validateSignup,
  });
  const submit = form.handleSubmit((values) => {
    onSave({ email: values.email.toLowerCase(), password: values.password });
  });
  return { form, submit };
}
'''

# ── advanced ─────────────────────────────────────────────────────────────────────────

[[unit]]
id = "dxjs-u10-html"
title = "html templates and render"
level = "advanced"
difficulty = 10
intro = '''
From state to the page: `html` tagged templates from `@dxjs/dom` compile once and bind each
dynamic spot to a signal through a safe sink. Text, attributes, properties, booleans and events,
all escaped and CSP-safe.
'''
concepts = '''
## The idea

The DOM is where reactivity pays off. Instead of producing a new tree on each change and
diffing it, dxjs builds the DOM **once** from a template and then updates only the exact text
node or attribute a signal feeds. And because values never go through a string-to-HTML path,
user data cannot inject markup: escaping is not something you remember, it is how the
renderer works.

## How dxjs does it

```ts
import { signal } from "@dxjs/core";
import { html, render } from "@dxjs/dom";

const name = signal("Ana");
const dispose = render(html`<p class="greeting">Hello, ${() => name()}!</p>`, host);
name.set("Grace");   // only the text node changes
dispose();           // removes the nodes and stops every binding
```

`html` is a tagged template: the static parts are compiled once into a `<template>`, and each
`${…}` becomes a binding. What a binding does depends on where it sits:

| Where | Example | Sink |
|---|---|---|
| text | `<p>${() => name()}</p>` | a text node (escaped) |
| attribute | `<div class=${() => cls()}>` | `setAttribute` (escaped; URLs sanitised) |
| `.prop` | `<input .value=${() => draft()}>` | an element property |
| `?attr` | `<button ?disabled=${() => busy()}>` | toggles a boolean attribute |
| `@event` | `<button @click=${onClick}>` | `addEventListener`, never an inline handler |
| `ref` | `<input ref=${(el) => (input = el)}>` | hands you the element once |

`render(view, host)` appends the result to `host` and returns a disposer.

## What is special or tricky

- **Keep the read lazy.** `${() => n()}` is a binding that updates; `${n()}` reads once while
  building and is frozen forever. When something does not update, you forgot the arrow.
- **An interpolation must be the whole attribute value.** `class="a ${x}"` is refused; write
  `class=${() => "a " + x()}`.
- **No inline handlers, ever.** An `onclick=` attribute is dropped; `@click` is the only event
  path. `javascript:` URLs in `href`/`src` are neutralised.
- **Raw HTML properties are refused:** `.innerHTML=${…}` does nothing.
- **Under Node there is no DOM.** In this course, `import "@dxtutor/dom"` installs a browser-like
  DOM (happy-dom) first, the same setup dxjs's own tests use. In a browser you skip that line.

## What you will practise

You will render a reactive greeting and dispose it, compare a live binding with a frozen one
and see injected markup stay text, and then build a like button with text, attribute, boolean
and event bindings.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u10-c1-bindings"
title = "One template, many surgical bindings"
points = 5
difficulty = 10
intro = '''
A template is compiled once per call site and cloned for each use; after that, the only work a
change causes is the update of the bindings that read the changed signal.
'''
body = '''
## What happens when you render

```ts
render(html`<li class=${() => cls()}>${() => label()}</li>`, host);
```

1. The first time this call site runs, dxjs turns the static strings into a `<template>` with
   markers where the `${…}` were. That is the only `innerHTML` it ever uses, and only on your
   static literal.
2. The template is cloned, and each marker becomes a binding: here an attribute effect for
   `class` and a text effect for the label.
3. `cls.set("done")` re-runs only the attribute effect; the text is untouched.

## Escaped by construction

A text binding creates a text node; an attribute binding calls `setAttribute`. Neither parses
HTML, so `"<img onerror=…>"` is shown as those characters. There is nothing to sanitise
because nothing is ever interpreted.
'''

