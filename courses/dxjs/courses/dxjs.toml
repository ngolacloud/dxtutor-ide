tests = '''
import { body, fire } from "@dxtutor/dom";
import { signal as signalForTest } from "@dxjs/core";
import { render as renderForTest } from "@dxjs/dom";

function setup(start: number, max: number) {
  const likes = signalForTest(start);
  const host = body();
  const dispose = renderForTest(likeButton(likes, max), host);
  const button = host.querySelector("button.like") as HTMLButtonElement;
  return { likes, host, dispose, button };
}

dxt.test("renders one like button with the count and the title", () => {
  const { host, button } = setup(0, 3);
  dxt.equal(host.querySelectorAll("button").length, 1);
  dxt.equal(button.textContent!.trim(), "♥ 0");
  dxt.equal(button.getAttribute("title"), "0 of 3");
  dxt.equal(button.hasAttribute("disabled"), false);
});

dxt.test("a click adds a like to the signal and the view", () => {
  const { likes, button } = setup(0, 3);
  fire(button, "click");
  dxt.equal(likes(), 1);
  dxt.equal(button.textContent!.trim(), "♥ 1");
  dxt.equal(button.getAttribute("title"), "1 of 3");
});

dxt.test("writes from outside update the view (no frozen reads)", () => {
  const { likes, button } = setup(0, 10);
  likes.set(7);
  dxt.equal(button.textContent!.trim(), "♥ 7");
  dxt.equal(button.getAttribute("title"), "7 of 10");
});

dxt.test("disabled at the maximum, enabled below it", () => {
  const { likes, button } = setup(2, 3);
  fire(button, "click");
  dxt.equal(button.hasAttribute("disabled"), true);
  likes.set(1);
  dxt.equal(button.hasAttribute("disabled"), false);
});

dxt.test("never goes above the maximum", () => {
  const { likes, button } = setup(3, 3);
  fire(button, "click");
  fire(button, "click");
  dxt.equal(likes(), 3);
  dxt.equal(button.textContent!.trim(), "♥ 3");
});

dxt.test("uses an event listener, not an inline handler", () => {
  const { button } = setup(0, 3);
  dxt.equal(button.getAttribute("onclick"), null);
  dxt.equal(button.getAttribute("@click"), null);
});

dxt.test("the disposer removes the button and stops the bindings", () => {
  const { likes, host, dispose } = setup(0, 3);
  dispose();
  dxt.equal(host.querySelector("button"), null);
  likes.set(2);
  dxt.equal(host.innerHTML, "");
});
'''

[unit.step.gabarito]
solution = '''
import { html } from "@dxjs/dom";
import type { TemplateResult } from "@dxjs/dom";
import type { Signal } from "@dxjs/core";

// One button: text, title, disabled and click, all driven by the likes signal.
export function likeButton(likes: Signal<number>, max: number): TemplateResult {
  return html`<button
    class="like"
    title=${() => likes() + " of " + max}
    ?disabled=${() => likes() >= max}
    @click=${() => likes.update((n) => Math.min(n + 1, max))}
  >♥ ${() => likes()}</button>`;
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The template is compiled once per call site; each like then costs one write and three small
binding updates (text, title, disabled), **O(1)** time, with a fixed number of bindings,
**O(1)** space. Every dynamic part is a function, so each one re-runs on its own when `likes`
changes and none is frozen. The click handler clamps with `Math.min`, so the maximum holds even
for a click that reaches a disabled button.
'''

[[unit]]
id = "dxjs-u11-components"
title = "Components and keyed lists"
level = "advanced"
difficulty = 11
intro = '''
Components package a piece of view with its state: functions that run once, take props as
accessors, and are mounted with a disposer. Keyed lists keep each row's DOM node across inserts,
removals and reorders.
'''
concepts = '''
## The idea

A **component** in dxjs is a plain function that builds a view once. It is not re-run when
data changes; its bindings are. That makes components cheap and predictable: a `console.log`
in the body prints once per mount, ever. State that belongs to the component is a signal
created in the body; state that belongs to the caller arrives as **props that are
accessors**, so the caller can keep feeding new values.

## How dxjs does it

```ts
import { signal } from "@dxjs/core";
import { html, list } from "@dxjs/dom";
import { component, mount, onMount } from "@dxjs/component";

const Badge = component((props: { count: () => number; onPick: (n: number) => void }) => {
  onMount(() => () => console.log("unmounted"));   // runs after insertion; may return a cleanup
  return html`<button @click=${() => props.onPick(props.count())}>${() => props.count()}</button>`;
});

const dispose = mount(Badge, host, { count: () => total(), onPick: pick });
```

- `component(fn)` is an identity helper that types `fn` as a component.
- `mount(Component, host, props)` runs it inside a new root, renders the view into `host`, runs
  the `onMount` callbacks, and returns a disposer that tears it all down.
- A component can be used inside another template by calling it: `${Badge({ … })}`.
- `onCleanup`, `createContext`, `provide` and `inject` are re-exported by `@dxjs/component`.

**Keyed lists:** `list(items, key, render)` renders a collection, reconciled by key:

```ts
html`<ul>${list(() => todos(), (t) => t.id, (t) => html`<li>${t.text}</li>`)}</ul>`
```

A new key renders a new row; a key that disappears disposes its row; a key that stays keeps its
**DOM node**, in the new order. No list is rebuilt, and rows that stay keep their focus.

## What is special or tricky

- **A row renders once per key, then its bindings keep it current.** When a todo with the same
  id comes back as a new object (`{ ...t, done: true }`), `render` is *not* called again: the
  row keeps its node, and the `t` it was built with is the old object. So key rows by identity
  only (`(t) => t.id`) and bind what can change with arrows that read live state, for example
  the current todo looked up by id in a `computed` map:

  ```ts
  const byId = computed(() => new Map(todos().map((t) => [t.id, t])));
  list(() => todos(), (t) => t.id, (t) => {
    const todo = computed(() => byId().get(t.id) ?? t);   // this row's live todo
    return html`<li class=${() => (todo().done ? "done" : null)}>${() => todo().text}</li>`;
  });
  ```

- **Kept rows update on their own.** Each row is built inside its own root, which lives exactly
  as long as the row: its bindings survive every insert, removal and reorder of the list, and are
  disposed with the row. (dxjs 1.2.0 tied them to the list's effect, so they stopped updating
  after the list's first change; 1.3.0 fixed it.)
- **Pass accessors, not values.** `count: () => total()` stays live; `count: total()` freezes the
  child at construction.
- **Outputs are callbacks.** A child never writes its parent's signals directly; it calls
  `props.onToggle(id)`.
- **Always keep the disposer** `mount` returns: tests, route changes and hot reload need it.

## What you will practise

You will mount a component with `onMount` and dispose it, watch a keyed list keep a row's node,
and then write a counter and a todo list component in two files.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u11-c1-run-once"
title = "Components run once; bindings run many times"
points = 5
difficulty = 11
intro = '''
The key difference from React-style frameworks: a dxjs component body is a constructor, so all
reactivity must live in the bindings and computeds it creates, not in re-running the body.
'''
body = '''
## The body is a constructor

```ts
const Counter = component(() => {
  console.log("constructed");        // prints ONCE per mount
  const n = signal(0);
  return html`<button @click=${() => n.update((x) => x + 1)}>${() => n()}</button>`;
});
```

There is no dependency array, no memo and no re-render: the arrow in `${() => n()}` *is* the
subscription.

## Rows keep their identity

`list(source, key, render)` remembers one DOM row per key. Appending a todo adds one `<li>`;
removing one deletes one node; reordering moves nodes. A row is rendered once per key, so the
key is the todo's `id` alone, and what can change inside the row (done, text) is bound with
arrows. Toggling a todo keeps its node and updates only that row's class and checkbox, even after
other rows were added or removed: each row owns its bindings for as long as it lives.
'''

