"app.test.ts" = '''
import { body, fire, typeInto } from "@dxtutor/dom";
import { test } from "node:test";
import assert from "node:assert/strict";
import { start } from "./src/main.ts";

type Todo = { id: number; text: string; done: boolean };

function app(initial: Todo[] = []) {
  const host = body();
  const stop = start(host, initial);
  const $ = <E extends Element>(sel: string) => host.querySelector(sel) as E;
  const rows = () => [...host.querySelectorAll("ul.todos > li")] as HTMLLIElement[];
  const texts = () => rows().map((li) => li.querySelector("span")!.textContent);
  const add = (text: string) => {
    typeInto($("form.new-todo input"), text);
    fire($("form.new-todo"), "submit");
  };
  const filter = (name: string) => fire($(`button.filter[data-filter="${name}"]`), "click");
  return { host, stop, $, rows, texts, add, filter };
}

const three: Todo[] = [
  { id: 1, text: "read the docs", done: true },
  { id: 2, text: "write a store", done: false },
  { id: 3, text: "ship the app", done: false },
];

test("renders the form, the list and the footer in order", () => {
  const { host, texts } = app(three);
  const order = [...host.children].map((el) => el.tagName.toLowerCase());
  assert.deepEqual(order.filter((t) => ["form", "ul", "footer"].includes(t)), ["form", "ul", "footer"]);
  assert.ok(host.querySelector("form.new-todo input"));
  assert.equal(host.querySelector("form.new-todo button")!.textContent!.trim(), "Add");
  assert.deepEqual(texts(), ["read the docs", "write a store", "ship the app"]);
});

test("submitting adds a todo and clears the input", () => {
  const { $, add, texts } = app();
  add("  learn dxjs  ");
  assert.deepEqual(texts(), ["learn dxjs"]);
  assert.equal($<HTMLInputElement>("form.new-todo input").value, "");
});

test("empty text adds nothing and keeps what was typed", () => {
  const { $, add, rows } = app();
  add("   ");
  assert.equal(rows().length, 0);
  assert.equal($<HTMLInputElement>("form.new-todo input").value, "   ");
});

test("the remaining count follows the todos", () => {
  const { $, add, rows } = app(three);
  const left = () => $("span.remaining").textContent!.trim();
  assert.equal(left(), "2 items left");
  fire(rows()[1].querySelector("input")!, "change");
  assert.equal(left(), "1 item left");
  fire(rows()[2].querySelector("input")!, "change");
  assert.equal(left(), "0 items left");
  add("one more");
  assert.equal(left(), "1 item left");
});

test("toggling and removing go through the store", () => {
  const { rows, texts } = app(three);
  fire(rows()[1].querySelector("input")!, "change");
  assert.equal(rows()[1].classList.contains("done"), true);
  fire(rows()[0].querySelector("button.remove")!, "click");
  assert.deepEqual(texts(), ["write a store", "ship the app"]);
});

test("filter buttons switch the list and show which one is pressed", () => {
  const { $, filter, texts } = app(three);
  const pressed = () =>
    ["all", "active", "done"].map((f) => $(`button.filter[data-filter="${f}"]`).getAttribute("aria-pressed"));
  assert.deepEqual(
    ["all", "active", "done"].map((f) => $(`button.filter[data-filter="${f}"]`).textContent!.trim()),
    ["All", "Active", "Done"],
  );
  assert.deepEqual(pressed(), ["true", "false", "false"]);
  filter("active");
  assert.deepEqual(texts(), ["write a store", "ship the app"]);
  assert.deepEqual(pressed(), ["false", "true", "false"]);
  filter("done");
  assert.deepEqual(texts(), ["read the docs"]);
  filter("all");
  assert.deepEqual(texts(), ["read the docs", "write a store", "ship the app"]);
});

test("clear done removes the done todos and is disabled when there are none", () => {
  const { $, texts } = app(three);
  const clear = () => $<HTMLButtonElement>("button.clear");
  assert.equal(clear().textContent!.trim(), "Clear done");
  assert.equal(clear().hasAttribute("disabled"), false);
  fire(clear(), "click");
  assert.deepEqual(texts(), ["write a store", "ship the app"]);
  assert.equal(clear().hasAttribute("disabled"), true);
});

test("typed text is shown as text", () => {
  const { add, rows } = app();
  add("<img src=x onerror=alert(1)>");
  assert.equal(rows()[0].querySelector("img"), null);
  assert.equal(rows()[0].querySelector("span")!.textContent, "<img src=x onerror=alert(1)>");
});

test("the function start returns tears the whole app down", () => {
  const { host, stop } = app(three);
  stop();
  assert.equal(host.children.length, 0);
});
