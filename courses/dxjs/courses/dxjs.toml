target = '''
import { signal, computed, batch, createRoot } from "@dxjs/core";

type Item = { name: string; qty: number };

function createBasket() {
  return createRoot((dispose) => {
    const items = signal<Item[]>([]);
    const units = computed(() => items().reduce((sum, i) => sum + i.qty, 0));
    const add = (name: string, qty: number) => items.update((xs) => [...xs, { name, qty }]);
    const clear = () => batch(() => items.set([]));
    return { items, units, add, clear, dispose };
  });
}

const basket = createBasket();
basket.add("tea", 2);
basket.add("bread", 1);
console.log("units:", basket.units());
basket.clear();
console.log("units after clear:", basket.units());
basket.dispose();
'''
