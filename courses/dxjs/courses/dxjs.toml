[[unit.step]]
kind = "challenge"
id = "dxjs-u06-x1-guard"
title = "A reusable error boundary"
points = 25
difficulty = 6
entry = "guard"
intro = '''
Wrapping work in a root with a boundary, and exposing the error as a reactive value, is a
pattern worth naming. `guard` runs any reactive setup under a boundary and reports the last
error it caught.
'''
instructions = '''
## Your turn

Implement `guard`:

```ts
export function guard(run: () => void): {
  error: () => string | null;   // the last error's message, or null
  dispose: () => void;
}
```

- Create a **root**, register an **`onError`** handler in it, then call `run()` inside the root,
  so every effect and computed `run` creates is owned by it.
- When something under the root throws, `error()` becomes the message: `e.message` for an
  `Error`, `String(e)` for anything else. Until then it is `null`. It is a reactive read.
- A throw must not escape the write that triggered it, and the other effects keep working.
- `dispose()` disposes the root: nothing created by `run` runs afterwards.
'''
starter = '''
import { signal, onError, createRoot } from "@dxjs/core";

// Run reactive setup under an error boundary and report the last error.
export function guard(run: () => void) {
  throw new Error("not implemented");
}
'''
tests = '''
