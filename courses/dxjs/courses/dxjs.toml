[[unit.step]]
kind = "challenge"
id = "dxjs-u01-x1-counter"
title = "A counter with a private signal"
points = 20
difficulty = 1
entry = "createCounter"
intro = '''
Now you build something reusable. A function that creates state and returns a small object of
operations is the simplest **store**. Keeping the signal private, and handing out a read-only
accessor, means only the store's own operations can change the value.
'''
instructions = '''
## Your turn

Implement `createCounter`:

```ts
export function createCounter(start = 0, step = 1): {
  count: () => number;
  increment(): void;
  decrement(): void;
  reset(): void;
}
```

- The current value lives in a **signal** created inside `createCounter`, starting at `start`.
- `count()` returns the current value. It must be a **read-only accessor** (`() => value()`),
  not the signal itself: calling `count(99)` must not change anything.
- `increment()` adds `step`, `decrement()` subtracts `step`, `reset()` goes back to `start`.
- Two counters never share state.

Examples:

- `createCounter()` then `increment()` twice → `count()` is `2`
- `createCounter(10, 5)` then `decrement()` → `count()` is `5`

Hidden tests also check that `count()` is a real signal read: a computed that reads it must
update when the counter changes.
'''
starter = '''
import { signal } from "@dxjs/core";

// Return a counter whose value lives in a private signal.
export function createCounter(start = 0, step = 1) {
  throw new Error("not implemented");
}
'''
tests = '''
import { computed as computedForTest } from "@dxjs/core";

dxt.test("starts at 0 by default", () => {
  dxt.equal(createCounter().count(), 0);
});

dxt.test("starts where you say", () => {
  dxt.equal(createCounter(10).count(), 10);
});

dxt.test("increments and decrements by one", () => {
  const c = createCounter();
  c.increment();
  c.increment();
  c.decrement();
  dxt.equal(c.count(), 1);
});

dxt.test("uses the step", () => {
  const c = createCounter(5, 5);
  c.increment();
  dxt.equal(c.count(), 10);
  c.decrement();
  c.decrement();
  dxt.equal(c.count(), 0);
});

dxt.test("reset goes back to the start value", () => {
  const c = createCounter(3);
  c.increment();
  c.increment();
  c.reset();
  dxt.equal(c.count(), 3);
});

dxt.test("two counters are independent", () => {
  const a = createCounter();
  const b = createCounter();
  a.increment();
  dxt.equal([a.count(), b.count()], [1, 0]);
});

dxt.test("count is a real signal read", () => {
  const c = createCounter();
  const doubled = computedForTest(() => c.count() * 2);
  dxt.equal(doubled(), 0);
  c.increment();
  dxt.equal(doubled(), 2);
});

dxt.test("count is a read-only accessor", () => {
  const c = createCounter(3);
  (c.count as unknown as (v: number) => number)(99);
  dxt.equal(c.count(), 3);
  dxt.check(!("set" in c.count), "count should not be the signal itself");
});
'''

[unit.step.gabarito]
solution = '''
import { signal } from "@dxjs/core";

// Return a counter whose value lives in a private signal.
export function createCounter(start = 0, step = 1) {
  const count = signal(start);
  return {
    count: () => count(),
    increment: () => {
      count.update((n) => n + step);
    },
    decrement: () => {
      count.update((n) => n - step);
    },
    reset: () => {
      count.set(start);
    },
  };
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Every operation is a single read or write of one signal, so each costs **O(1)** time; the
counter keeps one number and a fixed set of closures, **O(1)** space. A write notifies only
the computeds and effects that read `count()`, so the cost of a change is proportional to its
readers, not to the size of the app. Returning `() => count()` instead of the signal hides
`.set` and `.update`: only the store's own operations can change the value.
'''

[[unit]]
id = "dxjs-u02-computed"
title = "Computed: derived state"
level = "basic"
difficulty = 2
intro = '''
Values that follow from other values: a total from prices, a count from a list. A computed
derives them from signals, caches the result and recomputes only when something it read
changed.
'''
concepts = '''
## The idea

Much of an app's state is not stored, it is **derived**: the total of a cart, the number of
unfinished todos, whether a form is valid. If you store derived values by hand, you must
remember to update them every time their inputs change, and sooner or later one is stale.
The reactive answer is to *define* the value by its formula and let the system keep it
correct.

## How dxjs does it

`computed(fn)` returns a read-only accessor. `fn` reads signals (or other computeds) and
returns the derived value:

```ts
import { signal, computed } from "@dxjs/core";

const price = signal(100);
const qty = signal(2);
const total = computed(() => price() * qty());

total();        // 200
qty.set(3);
total();        // 300
```

Three properties matter:

- **Automatic dependencies.** The computed tracks whatever `fn` read during its last run. No
  dependency list to maintain.
- **Lazy.** Creating a computed runs nothing. `fn` runs on the first read, and after a change
  only when someone reads the value again.
- **Memoised.** Between changes, reading the computed returns the cached value without
  running `fn`. If a recomputation produces an equal value (by `Object.is`, or your `equals`
  option), readers of the computed are not disturbed.

Computeds can read other computeds, forming a graph. dxjs updates that graph
**glitch-free**: when two paths lead from one signal to a reader (a "diamond"), the reader
never sees a mix of old and new values.

## What is special or tricky

- **A computed has no setter.** If you feel the need to write to one, the value is not
  derived: it belongs in a signal.
- **Keep `fn` pure.** It may run at any read, or not at all. Logging, fetching or writing
  signals inside it is a bug; side effects belong in effects (next unit).
- **Read inside the formula.** `computed(() => price() * qty())` tracks both signals. Reading
  them *outside* and capturing the numbers would freeze the result.
- **Money in integers.** Floating point cannot represent `0.1` exactly; prices in this course
  are whole cents, and only the final rounding uses `Math.round`.

## What you will practise

You will derive a total, watch a computed run lazily and only once per change, and then
build a shopping cart whose subtotal, VAT, total and item count are all computeds.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u02-c1-derived"
title = "Define a value by its formula"
points = 5
difficulty = 2
intro = '''
A computed is a signal you do not write: it is the result of a formula over other signals,
kept up to date for you, and only worked out when somebody actually needs it.
'''
body = '''
## A formula that stays true

```ts
const items = signal([{ priceCents: 250, qty: 2 }, { priceCents: 100, qty: 1 }]);
const subtotal = computed(() =>
  items().reduce((sum, line) => sum + line.priceCents * line.qty, 0),
);
const vat = computed(() => Math.round(subtotal() * 0.14));
const total = computed(() => subtotal() + vat());
```

- `total` depends on `subtotal` and `vat`; `vat` depends on `subtotal`; `subtotal` on `items`.
- Changing `items` marks the whole chain as possibly stale, but **nothing runs** until you
  read `total()`.
- Reading `total()` twice in a row computes it once.

## Lazy and cached

The computed keeps the last value and the list of signals it read. A write to one of them
marks it stale; the next read recomputes it. If nobody reads it, the formula never runs, so
an unused computed costs nothing.
'''

[[unit.step]]
