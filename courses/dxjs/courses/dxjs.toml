  const g = guard(() => {});
  dxt.equal(g.error(), null);
});

dxt.test("catches an effect that throws later", () => {
  const n = signalForTest(1);
  const g = guard(() => {
    effectForTest(() => {
      if (n() < 0) throw new Error("negative: " + n());
