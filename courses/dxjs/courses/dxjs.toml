"src/counter.ts" = '''
import { signal } from "@dxjs/core";
import { html } from "@dxjs/dom";
import { component } from "@dxjs/component";

// A counter with its own state; the step is an accessor read at click time.
export const Counter = component((props: { start: number; step: () => number }) => {
  const value = signal(props.start);
  return html`<div class="counter">
    <button class="dec" @click=${() => value.update((n) => n - props.step())}>-</button>
    <output>${() => value()}</output>
    <button class="inc" @click=${() => value.update((n) => n + props.step())}>+</button>
  </div>`;
});
'''
"src/todo-list.ts" = '''
import { computed } from "@dxjs/core";
import { html, list } from "@dxjs/dom";
import { component } from "@dxjs/component";
import type { Todo } from "./types.ts";

type Props = {
  todos: () => Todo[];
  onToggle: (id: number) => void;
  onRemove: (id: number) => void;
};

// A keyed list of todos: one row per id, whose bindings follow the current todo.
export const TodoList = component((props: Props) => {
  const byId = computed(() => new Map(props.todos().map((t) => [t.id, t])));
  return html`<ul class="todos">
    ${list(
      () => props.todos(),
      (t) => t.id,
      (t) => {
        const todo = computed(() => byId().get(t.id) ?? t);
        return html`<li data-id=${t.id} class=${() => (todo().done ? "done" : null)}>
          <input type="checkbox" .checked=${() => todo().done} @change=${() => props.onToggle(t.id)} />
          <span>${() => todo().text}</span>
          <button class="remove" @click=${() => props.onRemove(t.id)}>×</button>
        </li>`;
      },
    )}
  </ul>`;
});
'''

[[unit]]
id = "dxjs-u12-app"
title = "A small app: the todo list"
level = "advanced"
difficulty = 12
intro = '''
Everything together: the store from unit 7 and the list from unit 11 become a real app with a
form, filters, a live count and a "clear done" button, mounted with one call and torn down with
one disposer.
'''
concepts = '''
## The idea

An app is a composition: a **store** holds the state and the rules, **components** turn it into
DOM and turn events back into store operations, and a small **entry point** wires them to a
host element. Each piece only knows its neighbours through their public surface: the view calls
`store.add(text)`, never `todos.update(...)`; the list reports `onToggle(id)`, never touches the
store. That is what lets each piece be tested, replaced or reused.

## How dxjs does it

```ts
// src/main.ts: the entry point
export function start(host: Element) {
  const store = createTodoStore();
  const unmount = mount(App, host, { store });
  return () => { unmount(); store.dispose(); };   // one call tears everything down
}

// src/app.ts: the composition
export const App = component((props: { store: TodoStore }) => {
  const draft = signal("");                         // view-only state lives in the view
  return html`
    <form @submit=${(e: Event) => { e.preventDefault(); if (props.store.add(draft())) draft.set(""); }}>
      <input .value=${() => draft()} @input=${(e: Event) => draft.set((e.target as HTMLInputElement).value)} />
    </form>
    ${TodoList({ todos: () => props.store.visible(), onToggle: props.store.toggle, onRemove: props.store.remove })}`;
});
```

- **Controlled input:** `.value=${() => draft()}` writes the property from the signal, and
  `@input` writes the signal from the element. Clearing `draft` clears the box.
- **`@submit` with `preventDefault()`** handles Enter and the button alike, without reloading.
- **Composition by calling:** `${TodoList({ … })}` renders a child component in place.
- **Static arrays of templates** (`${FILTERS.map((f) => html`…`)}`) render once; reactive
  bindings inside them stay live because that array never changes.
- **Derived UI state** (the count text, whether "Clear done" is enabled, which filter button is
  pressed) is read straight from the store's computeds in bindings.

## What is special or tricky

- **State that only the view needs** (the text being typed) is a signal in the component, not
  in the store.
- **Ownership composes:** `mount` creates a root for the view; the store has its own. The
  entry point disposes both, view first.
- **Accessibility is markup:** `aria-pressed` on toggle buttons, real `<button>`s and a
  `<form>` cost nothing and make the app usable from the keyboard.

## What you will practise

You will mount a form with a controlled input and submit it, and then finish the todo app: the
`App` component and the `start` entry point, on top of the store and the list you already wrote
(provided read-only).
'''

[[unit.step]]
