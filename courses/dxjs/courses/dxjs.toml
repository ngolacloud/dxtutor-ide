[unit.step.gabarito]
solution = '''
import { signal, computed } from "@dxjs/core";

export type Line = { name: string; priceCents: number; qty: number };

// The lines are the only state; everything else is derived.
export function createCart(vatPercent: number) {
  const lines = signal<Line[]>([]);
  const subtotal = computed(() => lines().reduce((sum, l) => sum + l.priceCents * l.qty, 0));
  const vat = computed(() => Math.round((subtotal() * vatPercent) / 100));
  const total = computed(() => subtotal() + vat());
  const count = computed(() => lines().reduce((sum, l) => sum + l.qty, 0));
  return {
    lines: () => lines(),
    add(name: string, priceCents: number, qty = 1) {
      lines.update((ls) =>
        ls.some((l) => l.name === name)
          ? ls.map((l) => (l.name === name ? { ...l, qty: l.qty + qty } : l))
          : [...ls, { name, priceCents, qty }],
      );
    },
    remove(name: string) {
      lines.update((ls) => ls.filter((l) => l.name !== name));
    },
    subtotal,
    vat,
    total,
    count,
  };
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
With `n` lines, `subtotal` and `count` each walk the list once, **O(n)**, and `vat` and `total`
are **O(1)** on top of them. Thanks to memoisation each runs at most once per change, however
many times it is read. `add` and `remove` build a new array, **O(n)** time and space, which is
what lets the signal see the change: the old array is never touched.
'''

[[unit]]
id = "dxjs-u03-effects"
title = "Effects: reacting to change"
level = "basic"
difficulty = 3
intro = '''
Where reactivity meets the outside world: logging, the network, the DOM, a subscription. An
effect runs now and again whenever what it read changes, cleans up after itself, and stops
when you dispose it.
'''
concepts = '''
## The idea

Signals and computeds are pure: they hold and derive values. Sooner or later a value must
*leave* the reactive world: be written to the page, saved, sent, logged. Doing that by hand
after every write is the bug-prone path dxjs exists to avoid. An **effect** is code that runs
because something changed.

## How dxjs does it

```ts
import { signal, effect, onCleanup } from "@dxjs/core";

const room = signal("general");
const stop = effect(() => {
  const name = room();                 // tracked: the effect re-runs when room changes
  const unsubscribe = chat.join(name);
  return () => unsubscribe();          // cleanup, before the next run and on dispose
});

room.set("random");                    // cleanup for "general", then a run for "random"
stop();                                // cleanup, and no more runs
```

- `effect(fn)` runs `fn` **immediately**, tracking every signal and computed it reads.
- A later write to one of them runs the effect again, **synchronously**, right after the
  write (or at the end of a `batch`, next unit).
- `fn` may return a **cleanup** function. dxjs calls it before the next run and when the
  effect is disposed. `onCleanup(fn)` inside the effect registers one too.
- `effect` returns a **disposer**: call it and the effect stops for good.

Dependencies are **dynamic**: each run tracks only what that run read. If a branch did not
read a signal this time, changes to it do not wake the effect until a run reads it again.

## What is special or tricky

- **Effects are for side effects.** If you are computing a value, use a computed. An effect
  that writes a signal it also reads can loop forever (dxjs stops at a million iterations).
- **Writes of equal values are invisible.** `temperature.set(22)` twice runs the effect once.
- **Always undo what you did.** Every subscription, listener or timer an effect starts must
  be released in its cleanup, or each re-run leaks one more.
- **Dispose what you start.** An effect created outside any owner lives until you call its
  disposer. Inside components dxjs does this for you (later units).

## What you will practise

You will log a signal's changes and stop the effect, watch dependencies change between runs,
and then follow a chat channel chosen by a signal: subscribe, switch and unsubscribe.
'''

[[unit.step]]
kind = "concept"
id = "dxjs-u03-c1-effect"
title = "Run, re-run, clean up, stop"
points = 5
difficulty = 3
intro = '''
An effect has a short life cycle: a first run when created, a re-run after each relevant change
(with the previous run's cleanup first), and a final cleanup when disposed.
'''
body = '''
## The life cycle in order

```ts
const id = signal(1);
const stop = effect(() => {
  const current = id();
  console.log("open", current);
  return () => console.log("close", current);
});
id.set(2);
stop();
```

prints `open 1`, `close 1`, `open 2`, `close 2`:

1. **Create:** the effect runs at once and remembers that it read `id`.
2. **Change:** `id.set(2)` first runs the cleanup of the previous run, then the effect again.
3. **Dispose:** `stop()` runs the last cleanup and detaches the effect from its signals.

## Only what was read

The tracked set is rebuilt on every run. An `if` that skips a read this time also skips the
subscription, which is exactly right: a value you did not use cannot change your result.
'''

