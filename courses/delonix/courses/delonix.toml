[[unit]]
id = "dlx-u5-config"
title = "Config and Secret: values outside the workload"
level = "intermediate"
difficulty = 5
intro = "Settings go in a Config, sensitive values in a Secret — and real secret values never go in the manifest."
concepts = '''
Delonix has two Kinds for values a workload reads at start, both in `core.delonix.io/v1beta1`:

- **`Config`** — cleartext settings. `spec.data` holds `KEY: value` pairs (shown as they are by
  `describe` and by `manifest render`);
- **`Secret`** — sensitive values, kept **encrypted at rest** in the engine's secret store and handed
  to workloads at start.

Both can take their values from three places, which can be combined:

| Field | Where the values come from |
|---|---|
| `stringData` (Secret) / `data` (Config) | written inline in the manifest |
| `fromEnvFile: ./db.env` | a `KEY=value` file, resolved against the manifest's folder **at apply time** |
| `fromEnv` | the environment of the process running `apply` (a list of names, or a map key → variable) |

**A Secret's value does not belong in the manifest.** `stringData` is plaintext in a file that ends
up in Git, in reviews and in CI logs. Use `fromEnvFile` with a file that is listed in `.gitignore`,
or `fromEnv` fed by your CI's secret store. `delonix manifest render` prints Secret values as
`<redacted>` — but that protects the screen, not the repository.

**Consuming them.** In Delonix 0.2.1 a workload receives Configs and Secrets by name through the
`Container` Kind: `config: [<names>]` and `secret: [<names>]` inject every key as an environment
variable, and `configFiles: true` / `secretFiles: true` deliver them as files instead — secrets in
a read-only tmpfs at `/run/secrets`, so they never appear in the process environment or in
`inspect`. The `Container` Kind still works but is on sunset in favour of `Application` (next unit),
whose spec in 0.2.1 has no field for them yet; other Kinds name a Secret where they need one
(`Image.pullSecret`, a CIFS `Volume`'s `passwordSecret`).

Official docs: https://ngolacloud.github.io/delonix/kinds.html (Config, Secret) and
https://ngolacloud.github.io/delonix/commands/secret.html
'''

[[unit.step]]
kind = "concept"
id = "dlx-c5-config"
title = "Three sources for a value"
points = 5
difficulty = 5
intro = '''
Inline, from a file, from the environment — and which one a secret may use.
'''
body = '''
- **Config** values may be inline: they are not secret.
- **Secret** values come from `fromEnvFile` or `fromEnv`, so the manifest carries only *where* the
  value is, never the value.
- A workload asks for them **by name** (`secret: [db]`), and `secretFiles: true` keeps them out of its
  environment.

The challenge turns a manifest that leaks a password into one that does not.
'''

