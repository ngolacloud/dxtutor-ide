[[unit]]
id = "dlx-u8-compose-health"
title = "Compose: health, start order and profiles"
level = "advanced"
difficulty = 8
intro = "Healthchecks and `depends_on` conditions start services in the right order; profiles keep tools out of the default run."
concepts = '''
`depends_on: [db]` only orders **creation**: `api` may start while Postgres is still initialising and
fail its first connection. The long form waits for a **condition**:

```yaml
depends_on:
  db:
    condition: service_healthy   # or service_started, service_completed_successfully
```

`service_healthy` needs a **healthcheck** on `db`:

```yaml
healthcheck:
  test: ["CMD-SHELL", "pg_isready -U shop -d shop"]   # or ["CMD", "prog", "arg"]
  interval: 5s       # Go-style durations: 500ms, 5s, 1m30s
  timeout: 3s
  retries: 10
  start_period: 30s  # failures during start-up do not count
```

`service_completed_successfully` waits for a one-off service (a migration) to exit with 0.

**Restart policies.** `restart: no` (default), `always`, `on-failure` or `unless-stopped` — the
last restarts the service except after you stopped it yourself.

**Profiles.** A service with `profiles: [tools]` is **not** part of a plain `up` (or `config`); it
starts only with `--profile tools`, or when an active service depends on it. Debugging tools and
admin UIs go there.

**Not repeating yourself.** Top-level keys starting with `x-` are extension fields that compose
ignores, and YAML anchors let services share them: `x-app: &app {...}` then `<<: *app` in each
service, overriding what differs. Delonix applies the `<<` merge before reading the file, so it sees
the keys each service really ends up with.

Durations, conditions and anchors are where compose files go wrong quietly: a misspelt condition or
an anchor that drops a key still produces a valid-looking file. Read the resolved project.

Official docs: https://ngolacloud.github.io/delonix/commands/compose.html
'''

[[unit.step]]
kind = "concept"
id = "dlx-c8-compose-health"
title = "Order is not readiness"
points = 5
difficulty = 8
intro = '''
Why depends_on alone is not enough, and what a healthcheck adds.
'''
body = '''
- `depends_on: [db]` → `db` is **created** first.
- `depends_on: {db: {condition: service_healthy}}` → `api` waits until `db`'s **healthcheck** passes.
- `profiles: [tools]` → the service exists only when asked for.

The resolved project of `compose config` lists only the active services — a profiled one is absent
unless requested.
'''

