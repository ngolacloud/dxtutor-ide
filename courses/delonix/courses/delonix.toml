'''
body = '''
For `delonix compose config -f compose.yaml -p shop` the output lists every service with its
container name, image, network, ports and volumes — for example:

```
service web:
  container: shop-web
  image: nginx:1.27-alpine
  network: shop_default
  ports: ["8080:80"]
```

If the file has a key Delonix does not read, or uses an undeclared volume or network, `config` says
so and stops.
'''

