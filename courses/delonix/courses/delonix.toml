[[unit]]
id = "dlx-u4-networks"
title = "Networks, labels and Services"
level = "intermediate"
difficulty = 4
intro = "Put Pods on their own network, label them, and give a set of them one DNS name with a Service."
concepts = '''
Without a `network`, a Pod shares the **host** network: its ports are the machine's ports, and two
Pods cannot both listen on 8080. A **`Network`** document (`networking.delonix.io/v1beta1`) creates
a user network — `driver: bridge` for a network on this machine, with an optional `subnet`
(`10.89.0.0/24`) and `gateway` — and a Pod joins it with **`spec.network: <name>`**. Pods on the same
network reach each other by address and by DNS name.

**Namespaces isolate.** `metadata.namespace` (default `default`) is, in Delonix, a network isolation
boundary for workloads: resources of different namespaces do not reach each other unless a
`Dependency` opens the way.

**Labels and Services.** Labels (`metadata.labels`) work as in Kubernetes: free key/value pairs that
selectors match. A **`Service`** (`networking.delonix.io/v1beta1`) gives the set of workloads matched
by `spec.selector.matchLabels` (every label must match) one name:
`<name>.<namespace>.delonix.internal`.

- `type: DNS` (the default) publishes every matched workload as an `A` record, in rotating order —
  no virtual IP, no proxy;
- `type: VirtualIP` holds one address from the node's VIP pool and forwards each connection to a
  ready backend;
- `port` is the **container** port every matched workload listens on — never a host port.

A Service whose selector matches nothing is refused by `delonix manifest validate` (nobody would
answer). Membership is live: relabel or add a workload and the Service follows within seconds.

Official docs: https://ngolacloud.github.io/delonix/kinds.html (Network, Service) and
https://ngolacloud.github.io/delonix/commands/network.html
'''

[[unit.step]]
kind = "concept"
id = "dlx-c4-networks"
