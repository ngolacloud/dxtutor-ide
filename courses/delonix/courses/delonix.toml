[[unit.step]]
kind = "challenge"
id = "dlx-p1-fix"
title = "Make the engine accept it"
points = 30
difficulty = 2
intro = '''
A manifest the engine refuses — find and fix every reason.
'''
instructions = '''
`manifest.yaml` declares one Pod, but Delonix 0.2.1 refuses it. Fix it so that `delonix manifest
render` loads it, and so that:

- the apiVersion is the **current** compute group version, `compute.delonix.io/v1beta1`;
- the Pod is named `hello`;
- its one container is named `hello`, runs `alpine:3.20` and the command `["sleep", "infinity"]`;
- the container declares port `8080` (an integer).

Read the error that `delonix manifest render -f manifest.yaml` prints in the grading output: it names
each problem.
'''

[unit.step.project]
main = "manifest.yaml"
explanation = '''
Delonix refused this manifest three ways: an apiVersion that does not exist (`compute.delonix.io/v1`
— the group is at `v1beta1`, and the legacy single version is `delonix.io/v1`), an unknown field
(`imgae`) that would otherwise be silently lost, and wrong types (`command` must be a list,
`containerPort` an integer). `manifest render` reports each of them before anything touches the
machine.
'''

[unit.step.project.starter]
"manifest.yaml" = '''
apiVersion: compute.delonix.io/v1
kind: Pod
metadata:
  name: hello
spec:
  containers:
    - name: hello
      imgae: alpine:3.20
      command: sleep infinity
      ports:
        - containerPort: "8080"
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["delonix", "manifest", "render", "-f", "manifest.yaml"]
save = "rendered.yaml"
message = "delonix manifest render must load the manifest (no unknown field, every type right)."

[[check]]
file = "manifest.yaml"
path = "apiVersion"
equals = "compute.delonix.io/v1beta1"
message = "Use the current version of the compute group: compute.delonix.io/v1beta1."

[[check]]
file = "manifest.yaml"
path = "kind"
equals = "Pod"
message = "It declares a Pod."

[[check]]
file = "manifest.yaml"
path = "metadata.name"
equals = "hello"
message = "The Pod is named hello."

[[check]]
file = "manifest.yaml"
path = "spec.containers[0]"
only_keys = ["name", "image", "command", "ports"]
message = "The container has name, image, command and ports (check the spelling: unknown fields are refused)."

[[check]]
file = "manifest.yaml"
path = "spec.containers[0].image"
equals = "alpine:3.20"
message = "The container runs alpine:3.20."

[[check]]
file = "manifest.yaml"
path = "spec.containers[0].command"
equals = ["sleep", "infinity"]
message = "command is a list: [\"sleep\", \"infinity\"]."

[[check]]
file = "manifest.yaml"
path = "spec.containers[0].ports[0].containerPort"
equals = 8080
message = "containerPort is the integer 8080."

[[check]]
file = "rendered.yaml"
path = "spec.restartPolicy"
exists = true
message = "The rendered Pod shows its defaults (restartPolicy included)."
'''

[unit.step.project.solution]
"manifest.yaml" = '''
apiVersion: compute.delonix.io/v1beta1
kind: Pod
metadata:
  name: hello
spec:
  containers:
    - name: hello
      image: alpine:3.20
      command: ["sleep", "infinity"]
      ports:
        - containerPort: 8080
'''

[[unit]]
id = "dlx-u2-pods"
title = "Pods: containers, commands, ports and environment"
level = "basic"
difficulty = 2
intro = "The Pod spec in detail, and the defaults the engine fills in when you leave fields out."
concepts = '''
A Delonix **Pod** (`compute.delonix.io/v1beta1`) is a real multi-container pod: its containers share
one network namespace, so they reach each other on `localhost`. The spec follows Kubernetes closely,
with a few engine extensions.

**Containers** (`spec.containers`, required, at least one):

- `name` — optional in Delonix (a missing name becomes `c0`, `c1`… by position), but name them: it is
  how you read logs and refer to them;
- `image` — required; pin a tag;
- `command` / `args` — override the image's ENTRYPOINT / CMD, as lists of strings;
- `workingDir`, `env` (a list of `{name, value}` with string values), `ports` (`containerPort`, an
  integer up to 65535, optional `hostPort`, `protocol`, `hostIP`), `volumeMounts`, `resources`
  (`requests`/`limits` with `cpu` and `memory` strings), `securityContext`, `tty`.

**Pod-level fields:**

- `restartPolicy` — `Always`, `OnFailure` or `Never` (the Kubernetes names; Delonix's own spellings
  are accepted too). Left out, the rendered manifest shows the engine default, `no`: the Pod is not
  restarted;
- `network` — a Delonix extension: the network the Pod's namespace joins. Left out, it is `host`
  (the machine's own network). Unit 4 puts Pods on their own network;
- `volumes` (unit 3), `hostname`, `hostAliases`, `shareProcessNamespace`, `detach` (default `true`)
  and `expose` (register an HTTP port in the engine's L7 proxy).

**Defaults are visible.** `delonix manifest render` prints every field the engine will use,
including the ones you did not write. Reading a render is the quickest way to learn a Kind — and the
checks of this unit read it too. Note that render checks the *shape* of each document; a value such
as `restartPolicy: Sometimes` has the right type (a string), so the engine only refuses it later —
the course checks the allowed values itself.

Official docs: https://ngolacloud.github.io/delonix/kinds.html (Pod)
'''

[[unit.step]]
kind = "concept"
id = "dlx-c2-pods"
title = "What the engine fills in"
points = 5
difficulty = 2
intro = '''
Pod fields, and how to read the defaults in a render.
'''
body = '''
Write only what you mean; the engine fills in the rest, and `manifest render` shows it:

| You leave out | The render shows |
|---|---|
| `restartPolicy` | `no` |
| `network` | `host` |
| `detach` | `true` |
| `ports`, `env`, `args` | `[]` |

If a default is not what you want — a Pod that should restart, or that should not share the host
network — write the field explicitly.
'''

