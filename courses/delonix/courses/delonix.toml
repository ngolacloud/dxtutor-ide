[[unit]]
id = "dlx-u6-applications"
title = "Applications and Jobs"
level = "intermediate"
difficulty = 6
intro = "Application runs N copies of a Pod; Job runs one to completion — both are lowered to Pods, and render shows it."
concepts = '''
Writing three Pods by hand to run three copies of a web server is repetitive and error-prone.
Delonix has two higher-level Kinds that **lower** to Pods when the manifest is loaded:

- **`Application`** (`compute.delonix.io/v1beta1`) — a Pod spec plus `replicas` (default 1). It
  lowers to `replicas` Pods named **`<name>-0`, `<name>-1`, …**, each carrying the Application's
  `metadata.labels` and namespace. The Application document itself does not survive the load: the
  Pods are what run. It is the recommended way forward for long-running workloads (the older
  `Container` Kind still works, with a sunset warning);
- **`Job`** — a Pod spec for **run-to-completion** work (a migration, a backup). It lowers to one
  Pod with the Job's name and `restartPolicy` defaulted to **`OnFailure`**, so a failed run is
  retried and a successful one is left alone.

**See the lowering.** `delonix manifest render` prints the manifest *after* lowering: an
Application with `replicas: 3` comes out as three Pod documents, a Job as one Pod with
`restartPolicy: OnFailure`. That is how you check what will really run — and what the checks of the
challenge read.

**Labels flow down.** Because each instance carries the Application's labels, a `Service` selecting
`app: web` matches all replicas — scaling is changing one number, and the Service follows.

There is also `Workload`, which lowers to a container or a VM (`spec.type`) — useful when a manifest
must switch between the two — and `Stack`, which groups a whole project into one document (the
capstone unit).

Official docs: https://ngolacloud.github.io/delonix/kinds.html (Application, Job)
'''

