[[unit.step]]
kind = "challenge"
id = "dlx-p9-stack"
title = "Ship the shop as one Stack"
points = 50
difficulty = 10
intro = '''
Fold a scattered manifest into a namespaced Stack; the checks read the expansion.
'''
instructions = '''
`manifest.yaml` must become **one** `Stack` document named `shop` in the namespace `shop` with:

- `networks`: `shop-net` (`driver: bridge`);
- `volumes`: `pg-data` (`driver: local`);
- `secrets`: `db`, whose values come from `fromEnvFile: ./db.env`;
- `applications`: `web` (labels `app: web`, **2** replicas, on `shop-net`, container `web`
  `nginx:1.27-alpine` port `80`) and `db` (labels `app: db`, 1 replica, on `shop-net`, container
  `postgres` `postgres:16-alpine` mounting a Pod volume `data` with `source: pg-data` at
  `/var/lib/postgresql/data`);
- `jobs`: `migrate` on `shop-net`, container `migrate` `migrate/migrate:v4.17.0` with the command
  `["migrate", "-path", "/migrations", "up"]`;
- `services`: `web` selecting `app: web` on port `80`.

The checks render the manifest and inspect what the Stack expands to.
'''

[unit.step.project]
main = "manifest.yaml"
explanation = '''
One document now describes the whole project, isolated in `shop`. The render is the review: a
Secret that carries no value, a Network, a Volume, a Service, and the Pods the Applications and the
Job lower to — every one in `shop`, every reference resolving inside the Stack.
'''

[unit.step.project.starter]
"manifest.yaml" = '''
# Fold these documents into ONE Stack named shop, in the namespace shop.
apiVersion: networking.delonix.io/v1beta1
kind: Network
metadata:
  name: shop-net
spec:
  driver: bridge
---
apiVersion: compute.delonix.io/v1beta1
kind: Application
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  network: shop-net
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["delonix", "manifest", "render", "-f", "manifest.yaml"]
save = "rendered.yaml"
message = "delonix manifest render must load the manifest (no unknown field, every type right)."

[[check]]
file = "manifest.yaml"
doc_count = 1
message = "The manifest is one document: the Stack."

[[check]]
file = "manifest.yaml"
path = "kind"
equals = "Stack"
message = "That document is a Stack (core.delonix.io/v1beta1)."

[[check]]
file = "manifest.yaml"
path = "metadata"
equals = { name = "shop", namespace = "shop" }
message = "The Stack is shop, in the namespace shop."

[[check]]
file = "manifest.yaml"
path = "spec"
only_keys = ["networks", "volumes", "secrets", "applications", "jobs", "services"]
message = "Use the groups networks, volumes, secrets, applications, jobs and services."

[[check]]
file = "rendered.yaml"
doc_count = 8
message = "The Stack expands to 8 documents: a Secret, a Network, a Volume, a Service and four Pods (web-0, web-1, db-0, migrate) — check every group."

[[check]]
file = "rendered.yaml"
doc = { kind = "Pod", namespace = "shop" }
doc_count = 4
message = "Four Pods in shop: web-0, web-1, db-0 and migrate."

[[check]]
file = "rendered.yaml"
doc = { namespace = "shop" }
doc_count = 8
message = "Every expanded document is in the namespace shop (inherited from the Stack)."

[[check]]
file = "rendered.yaml"
doc = { kind = "Secret", name = "db" }
path = "spec.fromEnvFile"
equals = "./db.env"
message = "The Secret db reads ./db.env — no inline value."

[[check]]
file = "rendered.yaml"
doc = { kind = "Pod", name = "db-0" }
path = "spec.volumes[name=data].source"
among = { doc = { kind = "Volume" }, path = "metadata.name" }
message = "db-0's volume data has source: pg-data, a Volume of the Stack."

[[check]]
file = "rendered.yaml"
doc = { kind = "Pod", name = "db-0" }
path = "spec.containers[name=postgres].volumeMounts[name=data].mountPath"
equals = "/var/lib/postgresql/data"
message = "postgres mounts data at /var/lib/postgresql/data."

[[check]]
file = "rendered.yaml"
doc = { kind = "Pod", name = "web-0" }
path = "spec.network"
equals = "shop-net"
message = "The web instances join shop-net."

[[check]]
file = "rendered.yaml"
doc = { kind = "Pod", name = "migrate" }
path = "spec.network"
equals = "shop-net"
message = "The migrate job joins shop-net."

[[check]]
file = "rendered.yaml"
doc = { kind = "Pod", name = "migrate" }
path = "spec.restartPolicy"
equals = "OnFailure"
message = "The job migrate becomes a Pod with restartPolicy: OnFailure."

[[check]]
file = "rendered.yaml"
doc = { kind = "Service", name = "web" }
path = "spec.selector.matchLabels"
selects = { doc = { kind = "Pod", name = "web-1" }, path = "metadata.labels" }
message = "The Service web selects the web instances (app: web)."

[[check]]
file = "rendered.yaml"
doc = { kind = "Service", name = "web" }
path = "spec.port"
equals = 80
message = "The Service web uses the container port 80."
'''

[unit.step.project.solution]
"manifest.yaml" = '''
apiVersion: core.delonix.io/v1beta1
kind: Stack
metadata:
  name: shop
  namespace: shop
spec:
  networks:
    - name: shop-net
      spec:
        driver: bridge
  volumes:
    - name: pg-data
      spec:
        driver: local
  secrets:
    - name: db
      spec:
        fromEnvFile: ./db.env
  applications:
    - name: web
      labels:
        app: web
      spec:
        replicas: 2
        network: shop-net
        containers:
          - name: web
            image: nginx:1.27-alpine
            ports:
              - containerPort: 80
    - name: db
      labels:
        app: db
      spec:
        replicas: 1
        network: shop-net
        containers:
          - name: postgres
            image: postgres:16-alpine
            volumeMounts:
              - name: data
                mountPath: /var/lib/postgresql/data
        volumes:
          - name: data
            source: pg-data
  jobs:
    - name: migrate
      spec:
        network: shop-net
        containers:
          - name: migrate
            image: migrate/migrate:v4.17.0
            command: ["migrate", "-path", "/migrations", "up"]
  services:
    - name: web
      spec:
        selector:
          matchLabels:
            app: web
        port: 80
'''
