[[unit]]
id = "dlx-u7-compose"
title = "Compose files, natively"
level = "intermediate"
difficulty = 7
intro = "Delonix runs docker-compose files without Docker; `delonix compose config` validates one and prints the project it resolves to."
concepts = '''
Many projects already describe their services in a **`docker-compose.yml`** (or `compose.yaml`).
Delonix reads that format natively — no Docker daemon involved: `delonix compose up -d` creates the
services, `ps`, `logs` and `down` manage them, and **`delonix compose config`** validates the file and
prints the resolved project **without creating anything** (the equivalent of `docker compose
config`). The course grades your compose files with `config`.

**What gets created, and its names.** The project name comes from `-p`, else the file's top-level
`name:`, else the directory. For a project `shop`:

- each service becomes a container named **`shop-<service>`** (or its `container_name`);
- the implicit network is **`shop_default`**; a declared network `back` becomes `shop_back`;
- a named volume `db-data` becomes **`shop_db-data`**.

**Declare before you use.** A service that mounts a named volume or joins a network that is not
declared under the top-level `volumes:` / `networks:` is refused. A `depends_on` cycle is refused.
Every service needs `image` or `build`.

**Refused rather than ignored.** Delonix reads a defined list of service keys (`image`, `build`,
`environment`, `env_file`, `ports`, `volumes`, `command`, `entrypoint`, `depends_on`, `healthcheck`,
`restart`, `networks`, `labels`, `profiles`, `deploy`, `expose`, `secrets`, `configs`, …). A key
outside it — a typo or a feature it does not implement — stops the command with the list of what it
does read; `include:` and `extends.file` (multi-file projects) are refused outright. That is
deliberate: a silently ignored key is a deployment that does not do what its file says.

**Ports.** `"8080:80"` publishes container port 80 on host port 8080; `"127.0.0.1:8080:80"` only on
localhost. A bare `"80"` asks for a random free host port — `config` would then pick one on your
machine, so this course always writes the host port.

Official docs: https://ngolacloud.github.io/delonix/commands/compose.html
'''

[[unit.step]]
kind = "concept"
id = "dlx-c7-compose"
title = "A compose file, read by the engine"
