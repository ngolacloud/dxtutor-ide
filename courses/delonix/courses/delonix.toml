[[unit.step]]
kind = "challenge"
id = "dlx-p5-secrets"
title = "Stop leaking the password"
points = 40
difficulty = 6
intro = '''
Move a password out of the manifest and deliver it as a file.
'''
instructions = '''
`manifest.yaml` declares a Config, a Secret with an inline password, and the `api` Container that
uses them. Fix it so that:

- the Config `api-settings` keeps its inline `data` (`LOG_LEVEL: info`);
- the Secret `api-db` has **no** `stringData`: its values come from `fromEnvFile: ./db.env`;
- the `api` Container asks for the Config `api-settings` and the Secret `api-db` **by name**
  (`config:` and `secret:`), and receives the secret as files (`secretFiles: true`);
- the Container no longer carries the password in its own `env`.
'''

[unit.step.project]
main = "manifest.yaml"
explanation = '''
The manifest now holds no sensitive value anywhere: the Secret says where its values are
(`./db.env`, kept out of Git), and the Container names the Secret instead of copying the password.
With `secretFiles: true` the value reaches the process as a file in a RAM-only `/run/secrets`, so it
never shows in the environment, in `inspect` or in a crash dump of `environ`.
'''

[unit.step.project.starter]
"manifest.yaml" = '''
apiVersion: core.delonix.io/v1beta1
kind: Config
metadata:
  name: api-settings
spec:
  data:
    LOG_LEVEL: info
---
apiVersion: core.delonix.io/v1beta1
kind: Secret
metadata:
  name: api-db
spec:
  stringData:
    DB_PASSWORD: change-me
---
apiVersion: compute.delonix.io/v1beta1
kind: Container
metadata:
  name: api
spec:
  image: python:3.12-slim
  command: ["python", "-m", "http.server", "8000"]
  env:
    - DB_PASSWORD=change-me
'''

[unit.step.project.tests]
