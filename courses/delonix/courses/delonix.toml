[[unit]]
id = "dlx-u3-storage"
title = "Volumes and mounts"
level = "basic"
difficulty = 3
intro = "Data that must outlive a container lives in a named Volume; a Pod declares volumes and each container mounts them."
concepts = '''
A container's filesystem disappears with it. Data that must survive — a database, uploads — goes in a
**volume**. In a Delonix manifest that takes three pieces that must agree by **name**:

1. a **`Volume`** document (`storage.delonix.io/v1beta1`) — a named volume the engine manages.
   `driver: local` (the default) keeps it on this machine's disk; other drivers mount network shares
   (`nfs`, `cifs`, `webdav`) or raw devices;
2. the Pod's **`spec.volumes`** — each entry has a `name` (local to the Pod) and **one source**:
   - `source: <volume-name>` — a Delonix extension: the named `Volume` (or Storage) directly;
   - `emptyDir: {}` — scratch space for the Pod's life; Delonix always backs it with tmpfs (RAM);
   - `hostPath: {path: /some/dir}` — a directory of the machine (use sparingly: it ties the Pod to the
     host's layout);
   - `persistentVolumeClaim: {claimName: …}` — the Kubernetes spelling, for manifests shared with
     Kubernetes;
3. each container's **`volumeMounts`** — `name` (one of the Pod's volumes), `mountPath` (an absolute
   path in the container) and optionally `readOnly: true`.

**Why names, twice?** The Pod-level name lets several containers mount the same volume at different
paths, and lets you swap the source (a local Volume in development, an NFS share in production)
without touching the containers.

**Who checks the references?** `manifest render` checks each document's shape, not that a mount's
`name` exists or that a `source` names a declared Volume. `delonix manifest validate` resolves them
against the manifest *and* the machine; the course checks them itself, from your files only.

Official docs: https://ngolacloud.github.io/delonix/kinds.html (Volume, Pod) and
https://ngolacloud.github.io/delonix/commands/volume.html
'''

[[unit.step]]
kind = "concept"
id = "dlx-c3-storage"
title = "Three names that must agree"
points = 5
difficulty = 3
intro = '''
Volume document, Pod volume, container mount.
'''
body = '''
```
Volume  metadata.name: db-data
   ▲
Pod     spec.volumes[].source: db-data      name: data
                                               ▲
        containers[].volumeMounts[].name: data  mountPath: /var/lib/postgresql/data
```

Get one name wrong and the Pod either fails to start or writes to a scratch directory that vanishes —
the worst kind of bug, because it looks like it works.
'''

