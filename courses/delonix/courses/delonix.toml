# Delonix Engine — the official dxtutor course for Delonix manifests and compose files (offline part).
#
# A TOOL course. The learner writes YAML; every challenge is a project step whose hidden
# `checks.toml` declares structural checks and the host-free Delonix commands
# `delonix manifest render -f <file>` and `delonix compose config -f <file> -p <project>`
# (tutor_core::toolcheck has the allow-list; both were proven host-free from the Delonix source at
# the commit of the 0.2.0 binary, edba10a1c, and measured with strace — again with the 0.2.1 binary,
# whose only change to them is the depends_on validation of #1060). Grading runs them with a
# clean environment and a temporary HOME and DELONIX_ROOT; it never touches the engine.
# Written for Delonix 0.2.1 (the README still says "0.1.x line" in places).

id = "delonix-basics"
language = "yaml"
category = "tool"
subject = "delonix"
title = "Delonix Engine: Manifests and Compose Files"
level = "beginner"
summary = "Declare workloads for the Delonix Engine: Pods, volumes, networks and Services, Config and Secret, Applications and Jobs, compose files and a whole project in one Stack — graded offline with the engine's own host-free commands."

overview = '''
The **Delonix Engine** is a daemonless, rootless-first container and microVM engine written in Rust
(Apache-2.0). It runs OCI containers, real multi-container pods and microVMs without a resident
daemon, and its main interface is a declarative **manifest**: Kubernetes-style YAML documents that
`delonix apply` makes true on the machine. It also runs existing **docker-compose** files natively.

This course teaches you to write both — and to read what the engine will do with them — **offline**.
Every challenge is graded by hidden checks on your YAML plus the engine's own *host-free* commands:

- `delonix manifest render -f <file>` — loads the manifest exactly as `apply` would (unknown fields
  refused, types checked, Applications and Stacks expanded) and prints it with every default filled
  in, without reading or changing the engine's state;
- `delonix compose config -f <file> -p <project>` — validates a compose file and prints the project it
  resolves to, without creating anything.

Nothing in this course creates a container, a network or a volume on your machine.

What you will learn:

1. **manifests** — API groups, the four fields, and why unknown fields are refused;
2. **Pods** — containers, commands, ports, environment and the defaults render reveals;
3. **volumes** — named Volumes, Pod volumes and mounts that must agree by name;
4. **networks and Services** — Pods on their own network, labels and a DNS name for a set of them;
5. **Config and Secret** — values outside the workload, and secrets outside the manifest;
6. **Applications and Jobs** — Kinds that lower to Pods;
7. **compose files** — what `delonix compose` reads, names and refuses;
8. **compose health and order** — healthchecks, conditions, anchors and profiles;
9. **a capstone** — a whole project in one namespaced Stack.

**Version.** The course is written for **Delonix 0.2.1** — what `delonix --version` reports. The
project's README still speaks of the "0.1.x line" in places; where the two differ, the course follows
the 0.2.1 binary. Install it from https://ngolacloud.github.io/delonix/ (the installer is
`https://github.com/ngolacloud/delonix/releases/latest/download/install.sh`).

Official documentation: https://ngolacloud.github.io/delonix/ — the Kinds reference
(`kinds.html`) and the command pages (`commands/manifest.html`, `commands/compose.html`,
`commands/stack.html`).
'''

[[unit]]
id = "dlx-u1-manifests"
title = "Manifests: the engine reads what you declare"
level = "basic"
difficulty = 1
intro = "A Delonix manifest is a set of Kubernetes-style documents; `delonix manifest render` shows exactly how the engine reads it."
concepts = '''
The **Delonix Engine** is a daemonless, rootless-first container and microVM engine written in Rust.
You can drive it command by command (`delonix run`, `delonix volume create`…), but its real interface
is the **manifest**: a YAML file, usually `delonix-manifest.yaml`, whose documents declare what
should exist. `delonix apply -f` converges the machine to it; `delonix plan` shows what an apply would
change and changes nothing.

Every document has the four fields you may know from Kubernetes:

```yaml
apiVersion: compute.delonix.io/v1beta1   # the API group of the Kind, and its version
kind: Pod                                # what this document declares
metadata:
  name: web                              # required; labels, annotations and namespace are optional
spec: {}                                 # the desired state, specific to the Kind
```

**API groups.** Each Kind lives in a group: `compute.delonix.io` (Pod, Application, Job…),
`storage.delonix.io` (Volume…), `networking.delonix.io` (Network, Service…), `core.delonix.io`
(Config, Secret, Stack…). The current version of every group is **`v1beta1`**. The old single
version `delonix.io/v1` still loads (a promise of the CLI stability policy), and the old `v1alpha1`
groups load with a deprecation warning — `delonix manifest convert` rewrites them.

**Unknown fields are refused, not ignored.** A misspelt field (`imgae:`) makes every command that
applies, plans or renders a manifest stop with "nothing was applied — field(s) not understood",
naming the field. A field with the wrong type (`containerPort: "80"`) is refused too.

**The host-free verbs.** `delonix manifest` groups the commands that only read the file:
`render` prints the manifest as the engine will read it, with **every default filled in**;
`schema` prints the JSON Schema of a Kind; `convert` rewrites old apiVersions. These are what this
course runs to grade you — offline, without touching the engine's state. (`delonix manifest
validate` also resolves references against what already exists on the machine, so the course does
not use it for grading; run it yourself when you want that check.) `delonix explain <Kind>` gives a
field reference.

**Version.** This course is written for **Delonix 0.2.1** (the binary reports `delonix 0.2.1`). The
project's README still describes the "0.1.x line" in places; where they differ, the course follows
what the 0.2.1 binary does.

Official docs: https://ngolacloud.github.io/delonix/ (the Kinds reference, `kinds.html`, and the
`manifest` command page, `commands/manifest.html`).
'''

[[unit.step]]
kind = "concept"
id = "dlx-c1-manifests"
title = "Declare, then let the engine converge"
points = 5
difficulty = 1
intro = '''
What a Delonix manifest is, and the host-free commands that read one.
'''
body = '''
A manifest is a **wish list** for one machine: networks, volumes, workloads, secrets. You write it;
the engine makes it true.

- `delonix manifest render -f delonix-manifest.yaml` — how the engine reads your file, defaults
  included. Nothing on the machine is read or changed.
- `delonix plan -f …` — what an apply would change.
- `delonix apply -f …` — make it so.

In this course every challenge is checked with `delonix manifest render` (or `delonix compose
config` for compose files) plus checks on the YAML you wrote.
'''

