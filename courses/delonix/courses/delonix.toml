- `spec.network: shop-net` — the Pod gets its own address on `shop-net`.
- `metadata.labels: {app: api}` — what the Pod *is*.
- A `Service` with `selector.matchLabels: {app: api}` and `port: 8000` — `api.default.delonix.internal`
  answers with every matching Pod.

The checks of this unit follow the references: the network a Pod names must be declared, and the
Service's selector must match a Pod's labels.
'''

