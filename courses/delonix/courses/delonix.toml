impossible. `depends_on` with `service_healthy` waits for `pg_isready`, not just for the container
to exist. And `adminer` no longer starts with every `up`: it is in the resolved project only when the
`tools` profile is asked for.
'''

[unit.step.project.starter]
"compose.yaml" = '''
name: shop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
  api:
    image: ghcr.io/example/shop-api:2.4.1
    ports:
      - "8000:8000"
    depends_on: [db]
  worker:
    image: ghcr.io/example/shop-api:2.4.0
    command: ["python", "-m", "shop.worker"]
  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["delonix", "compose", "config", "-f", "compose.yaml", "-p", "shop"]
save = "resolved.yaml"
message = "delonix compose config must accept the file and resolve the project."

[[check]]
file = "compose.yaml"
path = "services.db.healthcheck"
equals = { test = ["CMD-SHELL", "pg_isready -U shop -d shop"], interval = "5s", timeout = "3s", retries = 10 }
message = "db's healthcheck: test [CMD-SHELL, pg_isready -U shop -d shop], interval 5s, timeout 3s, retries 10."

[[check]]
file = "compose.yaml"
path = "x-app"
contains = { image = "ghcr.io/example/shop-api:2.4.1", restart = "unless-stopped" }
message = "x-app holds the shared image and restart: unless-stopped."

[[check]]
file = "compose.yaml"
path = "services.api.depends_on.db.condition"
equals = "service_healthy"
message = "api waits for db with condition: service_healthy."

[[check]]
file = "compose.yaml"
path = "services.worker.depends_on.db.condition"
equals = "service_healthy"
message = "worker waits for db with condition: service_healthy."

[[check]]
file = "compose.yaml"
path = "services.worker.image"
same_as = { path = "x-app.image" }
message = "worker's image must be x-app's image: write the tag once, in x-app, and merge it with <<: *app."

[[check]]
file = "compose.yaml"
path = "services.api.restart"
equals = "unless-stopped"
message = "api restarts unless-stopped (from x-app)."

[[check]]
file = "compose.yaml"
path = "services.worker.restart"
equals = "unless-stopped"
message = "worker restarts unless-stopped (from x-app)."

[[check]]
file = "compose.yaml"
path = "services.adminer.profiles"
equals = ["tools"]
message = "adminer belongs to the profile tools."

[[check]]
file = "resolved.yaml"
path = "[\"service adminer\"]"
exists = false
message = "Without --profile tools, adminer is not part of the resolved project."

[[check]]
file = "resolved.yaml"
path = "[\"service worker\"].image"
equals = "ghcr.io/example/shop-api:2.4.1"
message = "The resolved worker runs ghcr.io/example/shop-api:2.4.1."

[[check]]
file = "resolved.yaml"
path = "[\"service api\"].ports"
equals = ["8000:8000"]
message = "The resolved api publishes 8000:8000."
'''

[unit.step.project.solution]
"compose.yaml" = '''
name: shop

x-app: &app
  image: ghcr.io/example/shop-api:2.4.1
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    <<: *app
    ports:
      - "8000:8000"
  worker:
    <<: *app
    command: ["python", "-m", "shop.worker"]
  adminer:
    image: adminer:4
    profiles: [tools]
    ports:
      - "8081:8080"
'''

[[unit]]
id = "dlx-u9-stack"
title = "Capstone: a whole project in one Stack"
level = "advanced"
difficulty = 9
intro = "A Stack groups every document of a project by Kind, under one namespace — and render expands it back."
concepts = '''
As a project grows, its manifest becomes a long list of documents that all repeat the same
namespace. A **`Stack`** (`core.delonix.io/v1beta1`) is one document that holds them, grouped by
Kind:

```yaml
apiVersion: core.delonix.io/v1beta1
kind: Stack
metadata:
  name: shop
  namespace: shop            # every child inherits it
spec:
  networks:     [{name: shop-net, spec: {driver: bridge}}]
  volumes:      [{name: pg-data,  spec: {driver: local}}]
  secrets:      [{name: db,       spec: {fromEnvFile: ./db.env}}]
  applications: [{name: web, labels: {app: web}, spec: {replicas: 2, …}}]
  jobs:         [{name: migrate,  spec: {…}}]
  services:     [{name: web, spec: {selector: {matchLabels: {app: web}}, port: 80}}]
```

Each group item has a `name`, optional `labels`, `annotations` and `namespace`, and the `spec` the
Kind would have on its own. The group names are the Kind's plural in camelCase: `secrets`,
`configs`, `networks`, `volumes`, `pods`, `applications`, `jobs`, `services`, … A misspelt group is an
unknown field — refused like any other.

**Namespace.** The Stack's `metadata.namespace` is propagated to every child that does not set its
own. A Stack without a namespace puts everything in the shared `default` namespace, where every
other workload can reach it — the engine warns, and `delonix stack init` writes a namespace for new
stacks.

**Render shows the parts.** A Stack does not survive the load: it expands into its children (and an
`applications` item then lowers to its Pods, a `jobs` item to its Pod). `delonix manifest render`
prints that final list — which is what `apply` creates, in dependency order. Reading that render is
the review of the whole project; the checks of this capstone do the same.

`delonix stack apply` (or `delonix apply`) converges it; `delonix stack destroy` removes what the
stack created; `plan`, `diff` and `drift` compare it with the machine. Those touch the engine — this
course stops at the manifest.

Official docs: https://ngolacloud.github.io/delonix/commands/stack.html and
https://ngolacloud.github.io/delonix/kinds.html (Stack)
'''

[[unit.step]]
kind = "concept"
id = "dlx-c9-stack"
title = "One document, every Kind"
points = 5
difficulty = 9
intro = '''
Groups, the inherited namespace, and the expansion render shows.
'''
body = '''
A Stack is a container of documents, not a new kind of resource: after loading, only its children
exist. Two rules make a good Stack:

1. a `metadata.namespace`, so the project is isolated from `default`;
2. references between children (a Service's selector, an Application's network, a volume's source)
   that resolve inside the Stack.
'''

[[unit.step]]
kind = "drill"
id = "dlx-d9-stack"
title = "A small Stack"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
A network, a volume and a Pod in one document.
'''
prompt = '''
Type the Stack.
'''
target = '''
apiVersion: core.delonix.io/v1beta1
kind: Stack
metadata:
  name: lab
  namespace: lab
spec:
  networks:
    - name: lab-net
      spec: {driver: bridge}
  volumes:
    - name: lab-data
      spec: {driver: local}
  pods:
    - name: notes
      labels: {app: notes}
      spec:
        network: lab-net
        containers:
          - name: notes
            image: alpine:3.20
            command: ["sleep", "infinity"]
'''
line_comments = [
  "Stack is in the core group.",
  "One document for a whole project.",
  "Identity…",
  "…the stack's name…",
  "…and the namespace every child inherits.",
  "The groups:",
  "Networks:",
  "a network named lab-net…",
  "…with the spec a Network document would have.",
  "Volumes:",
  "a volume…",
  "…on local disk.",
  "Pods:",
  "a Pod named notes…",
  "…with labels at the item level…",
  "…and a Pod spec:",
  "on lab-net,",
  "with…",
  "…one container…",
  "…pinned,",
  "…that just waits.",
]
explanation = "Rendered, this is three documents — a Network, a Volume and a Pod — each with `namespace: lab`."

[[unit.step]]
kind = "drill"
