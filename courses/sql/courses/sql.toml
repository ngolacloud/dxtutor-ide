[[unit.step]]
kind = "drill"
id = "sql-u22-d3-guard"
title = "Guard a rule with RAISE"
points = 10
difficulty = 28
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A BEFORE trigger sees the proposed row before it is written, so it can veto it. `RAISE(ABORT)`
fails the whole statement and undoes it; `RAISE(IGNORE)` drops just the current row and lets
the statement continue. `changes()` reports how many rows the last write actually modified,
which makes the skipped rows visible.
'''
prompt = '''
Create a stock table with a trigger that silently ignores any update that would make a
quantity negative, then run updates and print `changes()` after each.

**Why:** an `ABORT` would stop this script at the first violation, so the drill uses `IGNORE`
to show the per-row decision; the challenge then uses `ABORT` for real.
'''
target = '''
CREATE TABLE stock (sku TEXT PRIMARY KEY, qty INTEGER NOT NULL);

CREATE TRIGGER stock_never_negative
BEFORE UPDATE OF qty ON stock
WHEN NEW.qty < 0
BEGIN
  SELECT RAISE(IGNORE);
END;

INSERT INTO stock VALUES ('pen', 5), ('ink', 1);
UPDATE stock SET qty = qty - 3 WHERE sku = 'pen';
SELECT changes() AS changed;
UPDATE stock SET qty = qty - 3 WHERE sku = 'pen';
SELECT changes() AS changed;
UPDATE stock SET qty = qty - 2;
SELECT changes() AS changed;
SELECT sku, qty FROM stock ORDER BY sku;
'''
line_comments = [
  "A stock table keyed by sku.",
  "",
  "A guard trigger.",
  "Runs before the new quantity is written.",
  "Only when the proposed quantity is negative.",
  "Starts the body.",
  "`RAISE` is called through a SELECT; IGNORE skips this row without an error.",
  "Ends the trigger.",
  "",
  "Five pens and one bottle of ink.",
  "5 - 3 = 2: allowed.",
  "Prints 1: one row changed.",
  "2 - 3 = -1: the trigger skips the row.",
  "Prints 0: nothing changed, and no error was raised.",
  "Pens go 2 to 0 (allowed); ink would go 1 to -1 (skipped).",
  "Prints 1: only the pen row changed.",
  "Shows the final quantities.",
]
explanation = '''
The output was:

```text
changed
1
changed
0
changed
1
sku|qty
ink|1
pen|0
```

The guard decided row by row: in the last UPDATE the pen row went through and the ink row was
dropped. `IGNORE` is quiet, which suits imports that should skip bad rows; when the caller
must know, use `RAISE(ABORT, 'message')`, which raises an error and undoes the statement.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u22-x1-inventory"
title = "Keep stock consistent with orders"
points = 40
difficulty = 28
entry = "inventory_triggers"
run_command = "python3 -m unittest"
intro = '''
Build a small inventory system whose rules live entirely in the database. Orders take stock,
cancelled orders give it back, impossible orders are rejected atomically, and every stock
movement leaves a log entry, whichever statement caused it.
'''
instructions = '''
## Your turn

Write a **script** of `CREATE TRIGGER` statements. These tables already exist (with data):

```sql
CREATE TABLE products  (id INTEGER PRIMARY KEY, name TEXT NOT NULL, stock INTEGER NOT NULL);
CREATE TABLE orders    (id INTEGER PRIMARY KEY, product_id INTEGER NOT NULL,
                        qty INTEGER NOT NULL CHECK (qty > 0));
CREATE TABLE stock_log (id INTEGER PRIMARY KEY, product_id INTEGER NOT NULL,
                        old_stock INTEGER NOT NULL, new_stock INTEGER NOT NULL);
```

Your triggers must make these rules hold:

1. **Inserting an order** subtracts its `qty` from the product's `stock`.
2. An order whose `qty` is **greater than the product's stock**, or whose product **does not
   exist**, is rejected with an error whose message contains `insufficient stock`. A rejected
   statement changes nothing: no order, no stock change, no log row. This includes a
   multi-row `INSERT` in which only a later row is impossible.
3. **Deleting an order** adds its `qty` back to the product's stock.
4. **Every change of a product's `stock` value**, whether caused by an order or by a direct
   `UPDATE products …`, inserts a row into `stock_log` with the product id, the old stock
   and the new stock. Updates that leave `stock` unchanged (renaming a product, or setting
   the same value) log nothing.

Orders are never updated. The tests run your script, then insert, delete and update rows and
inspect the three tables.

Example, starting from `pen` with stock 10:

```text
INSERT INTO orders (product_id, qty) VALUES (1, 4);   -- stock 6, log (1, 10, 6)
INSERT INTO orders (product_id, qty) VALUES (1, 7);   -- error: insufficient stock
DELETE FROM orders;                                   -- stock 10, log (1, 6, 10)
```

Hidden tests decide correctness.
'''
starter = '''
-- inventory_triggers: write your CREATE TRIGGER statements below
-- Hint: a BEFORE INSERT trigger with RAISE(ABORT, 'insufficient stock') guards rule 2;
-- AFTER INSERT / AFTER DELETE triggers on orders move the stock; an AFTER UPDATE OF stock
-- trigger on products, with a WHEN that compares OLD and NEW, writes the log.
'''
tests = '''
SETUP = """
CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT NOT NULL, stock INTEGER NOT NULL);
CREATE TABLE orders (id INTEGER PRIMARY KEY, product_id INTEGER NOT NULL,
                     qty INTEGER NOT NULL CHECK (qty > 0));
CREATE TABLE stock_log (id INTEGER PRIMARY KEY, product_id INTEGER NOT NULL,
                        old_stock INTEGER NOT NULL, new_stock INTEGER NOT NULL);
INSERT INTO products VALUES (1, 'pen', 10), (2, 'ink', 3), (3, 'pad', 0);
"""


class InventoryTest(unittest.TestCase):
    def setUp(self):
        self.conn = script(SETUP)

    def tearDown(self):
        self.conn.close()

    def stock(self, pid):
        return self.conn.execute("SELECT stock FROM products WHERE id = ?", (pid,)).fetchone()[0]

    def log(self):
        return self.conn.execute(
            "SELECT product_id, old_stock, new_stock FROM stock_log ORDER BY id"
        ).fetchall()

    def order(self, pid, qty):
        self.conn.execute("INSERT INTO orders (product_id, qty) VALUES (?, ?)", (pid, qty))

    def test_order_takes_stock_and_logs(self):
        self.order(1, 4)
        self.assertEqual(self.stock(1), 6)
        self.assertEqual(self.log(), [(1, 10, 6)])

    def test_delete_gives_stock_back(self):
        self.order(1, 4)
        self.order(2, 1)
        self.conn.execute("DELETE FROM orders WHERE product_id = 1")
        self.assertEqual(self.stock(1), 10)
        self.assertEqual(self.stock(2), 2)
        self.assertEqual(self.log(), [(1, 10, 6), (2, 3, 2), (1, 6, 10)])

    def test_insufficient_stock_is_rejected(self):
        with self.assertRaises(sqlite3.IntegrityError) as ctx:
            self.order(2, 4)
        self.assertIn("insufficient stock", str(ctx.exception))
        self.assertEqual(self.stock(2), 3)
        self.assertEqual(self.conn.execute("SELECT COUNT(*) FROM orders").fetchone()[0], 0)
        self.assertEqual(self.log(), [])

    def test_exact_stock_is_allowed(self):
        self.order(2, 3)
        self.assertEqual(self.stock(2), 0)
        with self.assertRaises(sqlite3.IntegrityError):
            self.order(2, 1)
        with self.assertRaises(sqlite3.IntegrityError):
            self.order(3, 1)
        self.assertEqual(self.log(), [(2, 3, 0)])

    def test_unknown_product_is_rejected(self):
        with self.assertRaises(sqlite3.IntegrityError) as ctx:
            self.order(99, 1)
        self.assertIn("insufficient stock", str(ctx.exception))
        self.assertEqual(self.conn.execute("SELECT COUNT(*) FROM orders").fetchone()[0], 0)

    def test_multi_row_insert_is_atomic(self):
        with self.assertRaises(sqlite3.IntegrityError):
            self.conn.execute(
                "INSERT INTO orders (product_id, qty) VALUES (1, 2), (2, 1), (2, 5)"
            )
        self.assertEqual((self.stock(1), self.stock(2)), (10, 3))
        self.assertEqual(self.conn.execute("SELECT COUNT(*) FROM orders").fetchone()[0], 0)
        self.assertEqual(self.log(), [])

    def test_direct_updates_are_logged_only_when_stock_changes(self):
        self.conn.execute("UPDATE products SET name = 'notepad' WHERE id = 3")
        self.conn.execute("UPDATE products SET stock = stock WHERE id = 1")
        self.conn.execute("UPDATE products SET stock = stock + 5 WHERE id = 3")
        self.conn.execute("UPDATE products SET stock = 20, name = 'pens' WHERE id = 1")
        self.assertEqual(self.log(), [(3, 0, 5), (1, 10, 20)])

    def test_a_day_of_trading(self):
        self.conn.execute("INSERT INTO products VALUES (4, 'cup', 2)")
        for pid, qty in [(4, 1), (1, 9), (4, 1), (1, 1)]:
            self.order(pid, qty)
        with self.assertRaises(sqlite3.IntegrityError):
            self.order(4, 1)
        self.conn.execute("DELETE FROM orders WHERE qty = 1 AND product_id = 4")
        self.assertEqual((self.stock(1), self.stock(4)), (0, 2))
        self.assertEqual(self.conn.execute("SELECT COUNT(*) FROM orders").fetchone()[0], 2)
        self.assertEqual(len(self.log()), 6)
'''

[unit.step.gabarito]
solution = '''
-- inventory_triggers: stock rules enforced by the database
CREATE TRIGGER orders_check_stock
BEFORE INSERT ON orders
WHEN NEW.qty > COALESCE((SELECT stock FROM products WHERE id = NEW.product_id), 0)
BEGIN
  SELECT RAISE(ABORT, 'insufficient stock');
END;

CREATE TRIGGER orders_take_stock
AFTER INSERT ON orders
BEGIN
  UPDATE products SET stock = stock - NEW.qty WHERE id = NEW.product_id;
END;

CREATE TRIGGER orders_return_stock
AFTER DELETE ON orders
BEGIN
  UPDATE products SET stock = stock + OLD.qty WHERE id = OLD.product_id;
END;

CREATE TRIGGER products_stock_log
AFTER UPDATE OF stock ON products
WHEN OLD.stock IS NOT NEW.stock
BEGIN
  INSERT INTO stock_log (product_id, old_stock, new_stock)
  VALUES (NEW.id, OLD.stock, NEW.stock);
END;
'''
time = "O(log n) per row"
space = "O(1) per row"
justification = '''
Every trigger body touches rows only through primary keys. For each inserted order, the
BEFORE trigger's subquery is one **O(log n)** seek in the `products` B-tree; the AFTER trigger's
UPDATE is another seek plus an in-place write; that UPDATE fires the log trigger, which
appends one row to `stock_log` (an **O(log n)** insert at the end of its rowid B-tree). A
delete costs the same. So each affected row adds a constant number of index operations,
**O(log n)**, and **O(1)** extra space; a statement touching r rows costs **O(r log n)**.

The guard uses `ABORT`, not `FAIL` or `IGNORE`: `ABORT` makes SQLite roll back everything the
current statement did, including the stock already taken by earlier rows of a multi-row
INSERT and the log rows those caused. `COALESCE(…, 0)` turns a missing product into stock 0,
so any order for it (qty is always > 0) is rejected. `IS NOT` in the log trigger ignores
no-op updates, and `UPDATE OF stock` keeps renames from firing the trigger at all.
'''

[[unit]]
id = "sql-u23-query-optimization"
title = "Query optimization"
level = "advanced"
difficulty = 29
intro = '''
An index only helps if the query is written so the planner can use it. A function wrapped
around a column, arithmetic on the wrong side, or a missing column in the index can turn a
millisecond seek into a full scan. You will read `EXPLAIN QUERY PLAN`, rewrite predicates so
they are sargable, and design covering indexes that also remove sorts.
'''
concepts = '''
## The idea

A B-tree index keeps the values of some columns **sorted**, each with a pointer (the rowid)
back to its table row. Sorted data supports one fast operation: find a value, or the start
of a range, in **O(log n)** steps, then read forward. The planner can use that only when the
`WHERE` clause compares the **bare indexed column** with something it can compute before the
search starts. Such a predicate is called **sargable** (from "Search ARGument ABLE").

`created_at >= '2024-03-01'` is sargable. `date(created_at) = '2024-03-01'` is not: the index
is sorted by `created_at`, not by `date(created_at)`, so the engine must compute the function
for every row, which is a **scan**, **O(n)**.

Once the index has found the rows, SQLite usually goes back to the table to fetch the other
columns, one extra seek per row. If the index already contains **every column the query
needs**, it is a **covering index** and the table is never touched. And if the index order
matches the `ORDER BY`, rows come out already sorted and no sort step is needed.

## How SQLite shows it

`EXPLAIN QUERY PLAN` in front of a query prints the plan instead of running it:

```sql
EXPLAIN QUERY PLAN SELECT * FROM users WHERE email = 'ana@example.com';
-- SEARCH users USING INDEX idx_users_email (email=?)
```

- `SCAN t` reads every row. `SCAN t USING COVERING INDEX i` reads every *index* entry,
  smaller but still all of them.
- `SEARCH t USING INDEX i (col=?)` seeks; the part in parentheses shows which index
  columns the seek uses (`=`, then at most one range `>`/`<`).
- `USING COVERING INDEX` means no table lookups.
- `USE TEMP B-TREE FOR ORDER BY` means a separate sort, **O(k log k)**.

## Common rewrites

```sql
WHERE price * 2 > 100            →  WHERE price > 50
WHERE substr(code, 1, 3) = 'ABC' →  WHERE code >= 'ABC' AND code < 'ABD'
WHERE lower(email) = ?           →  an expression index: CREATE INDEX … ON users(lower(email))
```

For a composite index, put the **equality** columns first, then the **range** column, then
any extra columns needed only for covering. The seek can use the columns left to right and
stops at the first range.

## What is special or tricky

- A rewrite must return exactly the same rows. `date(ts) BETWEEN '2024-03-01' AND
  '2024-03-31'` keeps all of March 31, but `ts BETWEEN '2024-03-01' AND '2024-03-31'` drops
  everything after midnight that day. Use a half-open range.
- Without `ANALYZE` statistics, SQLite guesses; on real data, run `ANALYZE` and check again.
- Every index slows down writes and takes space. Index for the queries you actually run.
- PostgreSQL uses `EXPLAIN (ANALYZE)` and covers with `INCLUDE (…)`; MySQL shows `Using
  index` for a covering index.

## What you will practise

You will compare plans before and after sargable rewrites, use an expression index, and
watch a covering index remove both table lookups and a sort. The challenge asks you to
design an index and rewrite a slow report so that its plan is a single covering seek.
'''

[[unit.step]]
kind = "concept"
id = "sql-u23-c1-sargable"
title = "Sargable predicates and covering indexes"
points = 5
difficulty = 29
intro = '''
The planner chooses between a scan, which touches all n rows, and a seek, which descends a
B-tree in O(log n) and then reads only the k matching entries. It can only seek when the
predicate constrains the index key itself, so the shape of your `WHERE` decides the cost
class of the query.
'''
body = '''
## Same rows, different cost

```sql
CREATE INDEX idx_orders_created ON orders(created_at);

-- not sargable: the function hides the column, so every row is checked
SELECT id, total FROM orders WHERE strftime('%Y', created_at) = '2024';

-- sargable: the same rows, found with a range seek on the index
SELECT id, total FROM orders
WHERE created_at >= '2024-01-01' AND created_at < '2025-01-01';
```

The rule of thumb: **leave the indexed column alone** on one side of the comparison and move
all the work to the other side, where it is computed once.

## Reading a plan

```text
SEARCH orders USING INDEX idx_orders_created (created_at>? AND created_at<?)
```

`SEARCH` means a seek and `(created_at>? AND created_at<?)` shows the range it uses. For
each index entry found, SQLite then fetches `total` from the table by rowid.

## Covering

```sql
CREATE INDEX idx_orders_created_total ON orders(created_at, total);
```

Now the index alone holds `created_at`, `total` and the rowid (`id`), so the plan says
`USING COVERING INDEX` and the table is never read. Because the index is sorted by
`created_at`, an `ORDER BY created_at` on the same query needs no extra sort either.

## Column order

In a composite index, equality columns come first, then one range column, then extra columns
for covering. An index on `(kind, created_at)` serves `kind = ? AND created_at > ?`; an index
on `(created_at, kind)` can seek only on the `created_at` range, then filters `kind` entry by
entry.
'''

