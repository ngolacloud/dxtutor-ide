INSERT INTO orders VALUES (1, 'paid'), (2, 'open'), (3, 'open'), (4, 'paid');
BEGIN;
DELETE FROM orders;
SELECT COUNT(*) AS inside FROM orders;
ROLLBACK;
SELECT COUNT(*) AS after_rollback FROM orders;
SELECT id, status FROM orders WHERE status = 'open' ORDER BY id;
'''
line_comments = [
  "Creates a table of orders.",
  "Seeds four orders, committed immediately.",
  "Opens a transaction before the risky change.",
  "Meant to delete open orders, but the WHERE is missing: every row goes.",
  "Inside the transaction this connection sees its own change: 0 rows.",
