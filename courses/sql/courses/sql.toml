[[unit.step]]
kind = "drill"
id = "sql-u27-d3-dedupe"
title = "Keep the newest, delete the rest"
points = 10
difficulty = 33
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Deduplication is a ranking problem: partition by the normalised key, order by the survival rule,
and every row ranked after the first is a loser. The `DELETE` then removes a set of ids computed by
one window query, rather than looping over the groups.
'''
prompt = '''
Store contacts with the same email typed three ways, show the duplicate groups, delete every copy
except the most recently updated one, and normalise the email of what remains.
'''
target = '''
CREATE TABLE contacts (id INTEGER PRIMARY KEY, email TEXT, name TEXT, updated_at TEXT);
INSERT INTO contacts VALUES
  (1, 'ana@example.com', 'Ana', '2026-01-05'), (2, 'ANA@example.com ', 'Ana S.', '2026-03-01'),
  (3, 'rui@example.com', 'Rui', '2026-02-02'), (4, 'ana@example.com', 'Ana Silva', '2026-02-10'),
  (5, 'zoe@example.com', 'Zoe', '2026-01-20');
SELECT lower(trim(email)) AS email_key, COUNT(*) AS copies, group_concat(id) AS ids
FROM contacts GROUP BY email_key HAVING COUNT(*) > 1;
DELETE FROM contacts
WHERE id IN (
  SELECT id FROM (
    SELECT id, ROW_NUMBER() OVER (
             PARTITION BY lower(trim(email))
             ORDER BY updated_at DESC, id DESC) AS rn
    FROM contacts)
  WHERE rn > 1);
SELECT changes() AS deleted;
UPDATE contacts SET email = lower(trim(email));
SELECT id, email, name FROM contacts ORDER BY id;
'''
