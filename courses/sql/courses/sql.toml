[[unit.step]]
kind = "challenge"
id = "sql-u20-x1-sku-report"
title = "Sales report from order documents"
points = 40
difficulty = 26
entry = "sku_report"
run_command = "python3 -m unittest"
intro = '''
Put the three moves together. Each order is a JSON document with a status and an array of
line items. You filter documents by a field, unnest their items into rows, aggregate per
product, and build a JSON array per group, all in one statement.
'''
instructions = '''
## Your turn

Write **ONE query** (a single `SELECT`) over this table:

```sql
CREATE TABLE orders (id INTEGER PRIMARY KEY, doc TEXT NOT NULL);
```

Each `doc` is a JSON object like:

```json
{"customer": "ana", "status": "paid",
 "items": [{"sku": "PEN", "qty": 2, "price": 150}, {"sku": "INK", "qty": 1, "price": 400}]}
```

`price` is in cents (an integer). Using **only orders whose `status` is `"paid"`**, return one
row per `sku` with these columns, in this order:

| column | meaning |
|---|---|
| `sku` | the item's sku |
| `units` | total `qty` sold |
| `revenue` | total of `qty * price` |
| `customers` | a JSON array of the **distinct** customer names that bought it, in alphabetical order, such as `["ana","bo"]` |

Sort by `revenue` descending, then `sku` ascending.

- An order with no `status`, or any status other than `"paid"`, is ignored.
- An order with an empty `items` array, or no `items` key at all, contributes nothing.
- An empty table gives no rows.

Example: two paid orders, ana `[PEN×2 @150, INK×1 @400]` and bo `[PEN×1 @150]`, plus a
pending order from cy `[INK×5 @400]`, give:

```text
sku | units | revenue | customers
PEN | 3     | 450     | ["ana","bo"]
INK | 1     | 400     | ["ana"]
```

Hidden tests decide correctness.
'''
starter = '''
-- sku_report: write your query below
-- Hint: unnest each paid order's items with json_each(o.doc, '$.items'), compare the status
-- with ->> (not ->), then GROUP BY the sku and use json_group_array(DISTINCT ... ORDER BY ...).
'''
tests = '''
import json

SCHEMA = "CREATE TABLE orders (id INTEGER PRIMARY KEY, doc TEXT NOT NULL);"


def order(oid, customer, status, items, with_items=True):
    doc = {"customer": customer}
    if status is not None:
        doc["status"] = status
    if with_items:
        doc["items"] = [{"sku": s, "qty": q, "price": p} for s, q, p in items]
    text = json.dumps(doc).replace("'", "''")
    return f"INSERT INTO orders VALUES ({oid}, '{text}');"


def run(*inserts):
    cols, rows = query(SCHEMA + "\n".join(inserts))
    return cols, [(r[0], r[1], r[2], json.loads(r[3])) for r in rows]


class SkuReportTest(unittest.TestCase):
    def test_example_from_instructions(self):
        cols, rows = run(
            order(1, "ana", "paid", [("PEN", 2, 150), ("INK", 1, 400)]),
            order(2, "bo", "paid", [("PEN", 1, 150)]),
            order(3, "cy", "pending", [("INK", 5, 400)]),
        )
        self.assertEqual(cols, ["sku", "units", "revenue", "customers"])
        self.assertEqual(rows, [
            ("PEN", 3, 450, ["ana", "bo"]),
            ("INK", 1, 400, ["ana"]),
        ])

    def test_order_by_revenue_then_sku(self):
        _, rows = run(
            order(1, "zoe", "paid", [("B", 1, 500), ("A", 5, 100), ("C", 2, 50)]),
            order(2, "amy", "paid", [("D", 1, 900)]),
        )
        self.assertEqual(rows, [
            ("D", 1, 900, ["amy"]),
            ("A", 5, 500, ["zoe"]),
            ("B", 1, 500, ["zoe"]),
            ("C", 2, 100, ["zoe"]),
        ])

    def test_only_paid_orders_count(self):
        _, rows = run(
            order(1, "ana", "paid", [("PEN", 1, 100)]),
            order(2, "bo", "cancelled", [("PEN", 9, 100)]),
            order(3, "cy", None, [("PEN", 9, 100)]),
            order(4, "di", "PAID ", [("PEN", 9, 100)]),
        )
        self.assertEqual(rows, [("PEN", 1, 100, ["ana"])])

    def test_distinct_sorted_customers(self):
        _, rows = run(
            order(1, "maria", "paid", [("TEA", 1, 300)]),
            order(2, "joão", "paid", [("TEA", 2, 300)]),
            order(3, "maria", "paid", [("TEA", 1, 300), ("TEA", 1, 300)]),
            order(4, "ann", "paid", [("TEA", 1, 300)]),
        )
        self.assertEqual(rows, [("TEA", 6, 1800, ["ann", "joão", "maria"])])

    def test_empty_and_missing_items(self):
        _, rows = run(
            order(1, "ana", "paid", []),
            order(2, "bo", "paid", [], with_items=False),
            order(3, "o'hara", "paid", [("CUP", 4, 250)]),
        )
        self.assertEqual(rows, [("CUP", 4, 1000, ["o'hara"])])

    def test_empty_table(self):
        cols, rows = run()
        self.assertEqual(cols, ["sku", "units", "revenue", "customers"])
        self.assertEqual(rows, [])

    def test_larger_data_set(self):
        inserts, expected = [], {}
        names = ["ana", "bo", "cy", "di"]
        for i in range(1, 41):
            status = "paid" if i % 3 else "refunded"
            items = [(f"S{(i + k) % 5}", 1 + (i + k) % 4, 100 * (1 + (i + k) % 5)) for k in range(i % 3)]
            inserts.append(order(i, names[i % 4], status, items))
            if status == "paid":
                for sku, qty, price in items:
                    e = expected.setdefault(sku, [0, 0, set()])
                    e[0] += qty
                    e[1] += qty * price
                    e[2].add(names[i % 4])
        want = sorted(
            ((s, u, r, sorted(c)) for s, (u, r, c) in expected.items()),
            key=lambda t: (-t[2], t[0]),
        )
        _, rows = run(*inserts)
        self.assertEqual(rows, want)
'''

[unit.step.gabarito]
solution = '''
-- sku_report: one row per sku sold in paid orders
SELECT i.value ->> '$.sku' AS sku,
       SUM(i.value ->> '$.qty') AS units,
       SUM((i.value ->> '$.qty') * (i.value ->> '$.price')) AS revenue,
       json_group_array(DISTINCT o.doc ->> '$.customer'
                        ORDER BY o.doc ->> '$.customer') AS customers
FROM orders AS o, json_each(o.doc, '$.items') AS i
WHERE o.doc ->> '$.status' = 'paid'
GROUP BY sku
ORDER BY revenue DESC, sku;
'''
time = "O(n·d + m log m)"
space = "O(m)"
justification = '''
SQLite **scans** all **n** orders, because no index can see inside the JSON text, and parses
each document (size **d**) to read `$.status`: **O(n·d)**. For each paid order, `json_each`
walks the `items` array; that lateral join is a nested loop whose inner side is the array, so
it produces the **m** item rows in time proportional to their number.

`GROUP BY sku` then sorts those m rows in a temporary B-tree (**O(m log m)**), and each
group's `json_group_array(DISTINCT … ORDER BY …)` sorts and deduplicates its own names; the
groups add up to m entries, so this stays within the same bound. The final `ORDER BY` sorts
only the g ≤ m groups. Space is the temporary sorter: **O(m)**.

Filtering with `->>` is what makes the comparison work: `->` would yield `"paid"` with quotes
and match nothing. In a real system with many orders, an expression index on
`doc ->> '$.status'` would turn the scan into a seek.
'''

[[unit]]
id = "sql-u21-dates"
title = "Dates and times"
level = "advanced"
difficulty = 27
intro = '''
Almost every real table has a timestamp, and almost every report groups by day, week or
month. SQLite has no date type, but it has a small, precise set of date functions that work
on ISO-8601 text. You will parse and format dates, do calendar arithmetic with modifiers,
and bucket events into periods, including the periods that have no events at all.
'''
concepts = '''
## The idea

A **point in time** can be written many ways: `2024-03-15 14:30:00`, a count of seconds
since 1970 (a **Unix timestamp**), or a fractional count of days since 4714 BC (a **Julian
day number**). Each is good at something. Text in ISO-8601 order (year, month, day, hour…)
sorts and compares correctly as plain strings, which is why it is the most common choice.
Numbers make **differences** easy: subtract two timestamps and you get a duration.

Reports also need **calendar** operations, which are not simple arithmetic: "the first day
of the month", "one month later", "the Monday of this week". Months have different lengths
and years have leap days, so these belong to a date library, not to hand-written maths.

## How SQLite does it

SQLite stores dates as `TEXT`, `REAL` (Julian day) or `INTEGER` (Unix time); it has no
`DATE` column type. Five functions read any of those forms and return a new one:

```sql
SELECT date('2024-03-15 14:30:00');                  -- 2024-03-15
SELECT strftime('%Y-%m', '2024-03-15');              -- 2024-03
SELECT unixepoch('2024-03-15');                      -- 1710460800
SELECT julianday('2024-03-20') - julianday('2024-03-15');  -- 5.0
```

`date`, `time`, `datetime`, `julianday`, `unixepoch` and `strftime(format, …)` all accept
**modifiers** after the time value, applied left to right:

```sql
SELECT date('2024-03-15', '+10 days');               -- 2024-03-25
SELECT date('2024-03-15', 'start of month', '+1 month', '-1 day');  -- 2024-03-31
SELECT datetime(1710460800, 'unixepoch');            -- 2024-03-15 00:00:00
```

Other modifiers include `start of year`, `start of day`, `weekday N` (move forward to the
next weekday N, 0 = Sunday) and `localtime`/`utc`.

## What is special or tricky

- Input must be well formed: `date('2024-3-5')` is `NULL`, because SQLite needs two-digit
  months and days. Bad text never raises an error; it quietly becomes NULL.
- `+1 month` adds to the month number and then normalises: `2024-01-31` plus one month is
  `2024-03-02`, because February 31 does not exist. Go to `start of month` first when you
  step through months.
- Everything is UTC unless you add `localtime`, which depends on the machine running the
  query. The special value `'now'` also changes on every run, so tests and reports should
  use fixed dates.
- `WHERE date(ts) = '2024-03-15'` computes a function per row and cannot use an index on
  `ts`. The half-open range `ts >= '2024-03-15' AND ts < '2024-03-16'` gives the same rows
  and can.
- PostgreSQL has real `date`/`timestamp` types, `date_trunc('month', ts)` and
  `ts + interval '1 month'` (which clamps to the end of the month); MySQL has `DATE_FORMAT`
  and `DATE_ADD`.

## What you will practise

You will format and convert dates, walk the calendar with modifiers, and bucket visits by
day, week and month. The challenge builds a monthly revenue report that includes the empty
months.
'''

[[unit.step]]
kind = "concept"
id = "sql-u21-c1-time-values"
title = "Time as text, days and seconds"
points = 5
difficulty = 27
intro = '''
A timestamp is just a number on a time line, and each storage format is a different unit
for that number. Converting between them is cheap arithmetic inside the engine; the hard
part, the calendar, is handled by the modifiers.
'''
body = '''
## One instant, three spellings

```sql
SELECT '2024-03-15 00:00:00'         AS iso_text,
       julianday('2024-03-15')       AS julian_days,   -- 2460384.5
       unixepoch('2024-03-15')       AS unix_seconds;  -- 1710460800
```

- **ISO text** is readable, and because the fields go from largest to smallest, string
  comparison is chronological comparison. That only holds if every value is zero-padded
  and uses the same separator.
- **Julian days** are fractional days, so subtracting two of them gives a duration in days.
- **Unix seconds** are integers, so subtracting gives seconds, and `/ 60` gives minutes.

## Truncate to bucket

Grouping by a period means mapping every timestamp to the start of its period:

```sql
SELECT date(ts)                        -- the day
SELECT date(ts, 'start of month')      -- the month (2024-03-01)
SELECT strftime('%Y-%m', ts)           -- a month label (2024-03)
```

All rows in the same period map to the same value, so `GROUP BY` on that value buckets them.
A week has no built-in "start of week" modifier, but `date(ts, '-6 days', 'weekday 1')`
gives the Monday on or before `ts`: step back six days, then forward to the next Monday.

## Empty periods

`GROUP BY` can only produce groups for values that exist. A month with no sales has no rows,
so it simply disappears from the report. To show it with a zero, generate the list of
periods first (a recursive CTE works well) and `LEFT JOIN` the data to it.
'''

