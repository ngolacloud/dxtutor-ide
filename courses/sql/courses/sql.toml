[[unit.step]]
kind = "drill"
id = "sql-udb1-d2-rollback"
title = "Roll back a mistake"
points = 10
difficulty = 16
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A rollback replays the journal backwards: every page the transaction touched goes back to its
state at `BEGIN`. That makes a transaction a safety net for risky changes: look at the effect
first, and only then decide to keep it.
'''
