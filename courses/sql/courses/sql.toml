[[unit.step]]
kind = "challenge"
id = "sql-u14-x1-normalize-enrollments"
title = "Normalize the enrollments sheet"
points = 30
difficulty = 14
entry = "normalize_enrollments"
run_command = "python3 -m unittest"
intro = '''
Put normalization to work on real data: decompose a flat table along its dependencies, then
migrate its rows without losing or duplicating a fact. The hidden tests check the schema and
its keys, and that joining your tables rebuilds the original data exactly.
'''
instructions = '''
## Your turn: write a script

A spreadsheet of course enrollments was imported as one flat table, which already exists:

```sql
CREATE TABLE flat_enrollments (
  student_email TEXT NOT NULL,
  student_name  TEXT NOT NULL,
  course_code   TEXT NOT NULL,
  course_title  TEXT NOT NULL,
  grade         INTEGER          -- NULL while the course is in progress
);
```

The data is consistent: an email always comes with the same name, a course code always with
the same title, and a student appears at most once per course. Two different students may
share a name.

Write a **script** that:

1. Creates exactly these tables, with these columns in this order:
   - `students(id, email, name)`: `id` is `INTEGER PRIMARY KEY`; `email` is required and
     unique; `name` is required.
   - `courses(code, title)`: `code` is a required text primary key; `title` is required.
   - `enrollments(student_id, course_code, grade)`: `student_id` is required and references
     `students(id)`; `course_code` is required and references `courses(code)`; `grade` is
     optional; the primary key is `(student_id, course_code)`.
2. Copies the data in: one `students` row per student, one `courses` row per course, one
   `enrollments` row per row of `flat_enrollments`.
3. Leaves `flat_enrollments` unchanged.

Example. From:

```text
('ana@uni.ao', 'Ana', 'DB1', 'Databases', 17)
('ana@uni.ao', 'Ana', 'PY1', 'Python',    NULL)
('bo@uni.ao',  'Bo',  'DB1', 'Databases', 14)
```

you get 2 students (`ana@uni.ao`, `bo@uni.ao`, ids of your choice), 2 courses (`DB1`, `PY1`)
and 3 enrollments (Ana in DB1 with 17, Ana in PY1 with `NULL`, Bo in DB1 with 14).

Hidden tests decide correctness.
'''
starter = '''
-- normalize_enrollments: write your script below (three CREATE TABLEs, then three INSERT … SELECTs).
-- Hint: deduplicate with SELECT DISTINCT, and look up new ids by joining on a unique column.
'''
tests = '''
FLAT = """
CREATE TABLE flat_enrollments (
  student_email TEXT NOT NULL,
  student_name  TEXT NOT NULL,
  course_code   TEXT NOT NULL,
  course_title  TEXT NOT NULL,
  grade         INTEGER
);
"""

EXAMPLE = FLAT + """
INSERT INTO flat_enrollments VALUES
  ('ana@uni.ao', 'Ana', 'DB1', 'Databases', 17),
  ('ana@uni.ao', 'Ana', 'PY1', 'Python', NULL),
  ('bo@uni.ao', 'Bo', 'DB1', 'Databases', 14);
"""

BIGGER = FLAT + """
INSERT INTO flat_enrollments VALUES
  ('ana@uni.ao', 'Ana', 'DB1', 'Databases', 17),
  ('ana.s@uni.ao', 'Ana', 'DB1', 'Databases', 12),
  ('ana.s@uni.ao', 'Ana', 'DB2', 'Databases', NULL),
  ('bo@uni.ao', 'Bo', 'GO1', 'Go', 15),
  ('cy@uni.ao', 'Cy', 'GO1', 'Go', NULL),
  ('cy@uni.ao', 'Cy', 'DB2', 'Databases', 19),
  ('cy@uni.ao', 'Cy', 'DB1', 'Databases', 11),
  ('di@uni.ao', 'Di', 'RS1', 'Rust', NULL);
"""

REBUILD = """
SELECT s.email, s.name, c.code, c.title, e.grade
FROM enrollments AS e
JOIN students AS s ON s.id = e.student_id
JOIN courses AS c ON c.code = e.course_code
"""

FLAT_ROWS = "SELECT * FROM flat_enrollments"


def key(row):
    return tuple((v is None, v) for v in row)


class NormalizeTest(unittest.TestCase):
    def run_on(self, setup):
        conn = script(setup)
        self.addCleanup(conn.close)
        return conn

    def test_tables_and_columns(self):
        conn = self.run_on(EXAMPLE)
        for table, cols in [
            ("students", ["id", "email", "name"]),
            ("courses", ["code", "title"]),
            ("enrollments", ["student_id", "course_code", "grade"]),
        ]:
            self.assertEqual([r[1] for r in conn.execute(f"PRAGMA table_info({table})")], cols, table)

    def test_example(self):
        conn = self.run_on(EXAMPLE)
        self.assertEqual(sorted(conn.execute("SELECT email, name FROM students")),
                         [("ana@uni.ao", "Ana"), ("bo@uni.ao", "Bo")])
        self.assertEqual(sorted(conn.execute("SELECT code, title FROM courses")),
                         [("DB1", "Databases"), ("PY1", "Python")])
        self.assertEqual(conn.execute("SELECT count(*) FROM enrollments").fetchone()[0], 3)

    def test_join_rebuilds_the_flat_table(self):
        conn = self.run_on(BIGGER)
        rebuilt = sorted(conn.execute(REBUILD).fetchall(), key=key)
        original = sorted(conn.execute(FLAT_ROWS).fetchall(), key=key)
        self.assertEqual(rebuilt, original)

    def test_each_fact_is_stored_once(self):
        conn = self.run_on(BIGGER)
        self.assertEqual(conn.execute("SELECT count(*) FROM students").fetchone()[0], 5)
        self.assertEqual(conn.execute("SELECT count(*) FROM courses").fetchone()[0], 4)
        self.assertEqual(conn.execute("SELECT count(*) FROM enrollments").fetchone()[0], 8)
        self.assertEqual(conn.execute("SELECT count(*) FROM flat_enrollments").fetchone()[0], 8)

    def test_keys_reject_duplicates_and_nulls(self):
        conn = self.run_on(EXAMPLE)
        bo = conn.execute("SELECT id FROM students WHERE email = 'bo@uni.ao'").fetchone()[0]
        for sql in [
            "INSERT INTO students (email, name) VALUES ('bo@uni.ao', 'Bob')",
            "INSERT INTO students (email, name) VALUES (NULL, 'Nobody')",
            "INSERT INTO students (email, name) VALUES ('x@uni.ao', NULL)",
            "INSERT INTO courses VALUES ('DB1', 'Databases again')",
            "INSERT INTO courses VALUES (NULL, 'No code')",
            "INSERT INTO courses VALUES ('XX1', NULL)",
            f"INSERT INTO enrollments VALUES ({bo}, 'DB1', 20)",
            "INSERT INTO enrollments VALUES (NULL, 'DB1', 20)",
            f"INSERT INTO enrollments VALUES ({bo}, NULL, 20)",
        ]:
            with self.assertRaises(sqlite3.IntegrityError, msg=sql):
                conn.execute(sql)
        conn.execute(f"INSERT INTO enrollments VALUES ({bo}, 'PY1', NULL)")
        new_id = conn.execute("INSERT INTO students (email, name) VALUES ('cy@uni.ao', 'Cy')").lastrowid
        self.assertIsNotNone(new_id)

    def test_foreign_keys_are_declared(self):
        conn = self.run_on(EXAMPLE)
        fks = {(r[2], r[3]): r[4] for r in conn.execute("PRAGMA foreign_key_list(enrollments)")}
        self.assertEqual(set(fks), {("students", "student_id"), ("courses", "course_code")})
        self.assertIn(fks[("students", "student_id")], ("id", None))
        self.assertIn(fks[("courses", "course_code")], ("code", None))

    def test_empty_flat_table(self):
        conn = self.run_on(FLAT)
        for table in ("students", "courses", "enrollments"):
            self.assertEqual(conn.execute(f"SELECT count(*) FROM {table}").fetchone()[0], 0, table)
'''

[unit.step.gabarito]
solution = '''
CREATE TABLE students (
  id    INTEGER PRIMARY KEY,
  email TEXT NOT NULL UNIQUE,
  name  TEXT NOT NULL
);

CREATE TABLE courses (
  code  TEXT NOT NULL PRIMARY KEY,
  title TEXT NOT NULL
);

CREATE TABLE enrollments (
  student_id  INTEGER NOT NULL REFERENCES students(id),
  course_code TEXT NOT NULL REFERENCES courses(code),
  grade       INTEGER,
  PRIMARY KEY (student_id, course_code)
);

INSERT INTO students (email, name)
SELECT DISTINCT student_email, student_name FROM flat_enrollments;

INSERT INTO courses (code, title)
SELECT DISTINCT course_code, course_title FROM flat_enrollments;

-- Join back on the email (unique), never on the name (two students may share one).
INSERT INTO enrollments (student_id, course_code, grade)
SELECT s.id, f.course_code, f.grade
FROM flat_enrollments AS f
JOIN students AS s ON s.email = f.student_email;
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
With **n** rows in `flat_enrollments`:

- Each `SELECT DISTINCT` scans the flat table once and removes duplicates with a temporary
  B-tree: **O(n log n)**. Each inserted row also goes into the table's key index (the
  `UNIQUE` email index, the `code` primary key), **O(log n)** per row.
- The enrollment `INSERT … SELECT` scans the flat table and, for each row, finds the student
  with one seek on the email's `UNIQUE` index, **O(log n)**, then inserts into the
  `(student_id, course_code)` primary-key index, another **O(log n)**. No course lookup is
  needed, because the course code is the key itself.

Total **O(n log n)**, and **O(n)** extra space for the temporary B-trees and the indexes.

Joining back on `email` is what makes the migration correct: it is unique, so each flat row
finds exactly one student. Joining on `student_name` would match both students named Ana and
insert each of their rows twice, which the primary key would then reject. The `NOT NULL` on
`code` matters too, since a text primary key in SQLite otherwise accepts `NULL`.
'''

[[unit]]
id = "sql-u15-null-logic"
title = "NULL and three-valued logic"
level = "intermediate"
difficulty = 15
intro = '''
`NULL` means "no value", and comparing anything with it gives neither true nor false but
**unknown**. This unit makes SQL's three-valued logic explicit: how `NULL` flows through
comparisons, `AND`/`OR`/`NOT`, `IN` and `NOT IN`, and how `IS`, `COALESCE` and `NULLIF`
let you say what a missing value should mean.
'''
concepts = '''
## The idea

`NULL` means "no value here": unknown, missing or not applicable. It is not zero and not the
empty string. Because the value is unknown, a comparison with it can be neither true nor
false; it is **unknown**, and SQL represents unknown as `NULL` too. So every condition in SQL
evaluates to TRUE, FALSE or UNKNOWN: **three-valued logic**.

The rules follow from asking "could the unknown value change the answer?":

- `NULL = 5`, `NULL <> 5` and even `NULL = NULL` are UNKNOWN.
- `UNKNOWN AND FALSE` is FALSE, whatever the unknown is; `UNKNOWN AND TRUE` is UNKNOWN.
- `UNKNOWN OR TRUE` is TRUE; `UNKNOWN OR FALSE` is UNKNOWN.
- `NOT UNKNOWN` is UNKNOWN.

`WHERE`, `ON`, `HAVING` and `CASE WHEN` keep a row or take a branch only when the condition
is **TRUE**. UNKNOWN is treated like FALSE there, which is why rows with `NULL` vanish from
both `WHERE x = 5` and `WHERE x <> 5`. (`CHECK` is the exception: it rejects only FALSE.)

## How SQL expresses it

```sql
SELECT name FROM people WHERE phone IS NULL;              -- test for missing
SELECT name, COALESCE(nickname, name) AS shown FROM people;
SELECT total / NULLIF(visits, 0) AS per_visit FROM stats;
```

- `IS NULL` and `IS NOT NULL` are the only correct tests for a missing value.
- `COALESCE(a, b, …)` returns its first non-`NULL` argument: a default.
- `NULLIF(a, b)` returns `NULL` when `a = b`, else `a`: it turns a sentinel such as `0` or `''`
  back into `NULL`.
- A **null-safe comparison** treats two `NULL`s as equal. SQLite writes it `a IS b` and
  `a IS NOT b`; SQLite 3.39+ and PostgreSQL also accept the standard
  `IS [NOT] DISTINCT FROM`; MySQL uses `a <=> b`.
- SQLite has no separate boolean type: TRUE is `1`, FALSE is `0`, UNKNOWN is `NULL`.

## Pitfalls

- `WHERE x = NULL` is never true, so it silently returns no rows. Write `IS NULL`.
- **`NOT IN` with a `NULL` in the list returns nothing.** `5 NOT IN (1, NULL)` means
  `5 <> 1 AND 5 <> NULL`, that is TRUE AND UNKNOWN, which is UNKNOWN. When the list comes
  from a subquery over a nullable column, use `NOT EXISTS`, which only asks whether a
  matching row exists.
- Arithmetic and concatenation propagate `NULL`: `price + NULL` and `'a' || NULL` are both
  `NULL`.
- Replacing `NULL` with a sentinel to compare columns, as in `COALESCE(x, 0) <> COALESCE(y, 0)`,
  invents a value: if `0` can also be real, "missing" and "zero" now look the same.
- Aggregates skip `NULL`s, while `GROUP BY` and `DISTINCT` put all `NULL`s in one group.

## What you will practise

You will print the truth tables, fall into the `NOT IN` trap and climb out with
`NOT EXISTS`, and use `COALESCE`, `NULLIF` and `IS NOT` on missing values. The challenge
compares two price lists in which `NULL` means "no price yet", and only a null-safe
comparison gets every row right.
'''

[[unit.step]]
kind = "concept"
id = "sql-u15-c1-unknown"
title = "TRUE, FALSE and UNKNOWN"
points = 5
difficulty = 15
intro = '''
Relational predicates are evaluated in a three-valued logic, a system Codd added to the
relational model to represent missing information. The engine evaluates the `WHERE`
predicate for every row it visits and passes on only the rows where the result is TRUE.
'''
body = '''
## Three answers, not two

```sql
SELECT 1 = 1,         -- 1    TRUE
       1 = 2,         -- 0    FALSE
       1 = NULL,      -- NULL UNKNOWN
       NULL = NULL,   -- NULL two unknowns are not known to be equal
       NULL IS NULL;  -- 1    IS asks "is it missing?"
```

| a | b | a AND b | a OR b |
|---|---|---|---|
| TRUE | UNKNOWN | UNKNOWN | TRUE |
| FALSE | UNKNOWN | FALSE | UNKNOWN |
| UNKNOWN | UNKNOWN | UNKNOWN | UNKNOWN |

`NOT UNKNOWN` is still UNKNOWN.

## Where it bites

A `WHERE` clause keeps a row only when its condition is TRUE, and discards both FALSE and
UNKNOWN:

```sql
SELECT count(*) FROM t WHERE x = 5;       -- rows where x is 5
SELECT count(*) FROM t WHERE x <> 5;      -- rows where x is known and not 5
SELECT count(*) FROM t WHERE x IS NULL;   -- the rows both queries above missed
```

The first two counts don't add up to `count(*)` when `x` has `NULL`s. Every time you write
`<>`, `NOT` or `NOT IN`, decide what should happen to the rows where the value is missing,
and say it with `IS NULL`, `IS NOT NULL` or `COALESCE`.
'''

[[unit.step]]
kind = "drill"
id = "sql-u15-d1-truth-table"
title = "Print the truth tables"
points = 10
difficulty = 15
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
In SQLite a predicate is just an expression whose value is 1, 0 or `NULL`, so you can select
it like any column. Printing the logic directly shows how UNKNOWN propagates, and three
counts over the same table show the rows that `=` and `<>` both drop.
'''
prompt = '''
Select seven logical expressions involving `NULL`, then count the rows of a small table where
`x = 5`, where `x <> 5`, where `x IS NULL`, and in total.
'''
target = '''
SELECT
  NULL = NULL AS eq,
  NULL IS NULL AS is_null,
  NULL <> 1 AS ne,
  NULL AND 0 AS and_false,
  NULL AND 1 AS and_true,
  NULL OR 1 AS or_true,
  NOT NULL AS not_unknown;
CREATE TABLE t (x INTEGER);
INSERT INTO t VALUES (5), (7), (NULL);
SELECT
  (SELECT count(*) FROM t WHERE x = 5) AS eq5,
  (SELECT count(*) FROM t WHERE x <> 5) AS ne5,
  (SELECT count(*) FROM t WHERE x IS NULL) AS missing,
  (SELECT count(*) FROM t) AS total;
'''
line_comments = [
  "One row of logical results, no table needed.",
  "Two unknowns: not known to be equal, so NULL.",
  "IS tests for missing: 1.",
  "Unknown compared with 1: still NULL.",
  "Unknown AND false is false whatever the unknown is: 0.",
  "Unknown AND true depends on the unknown: NULL.",
  "Unknown OR true is true whatever the unknown is: 1.",
  "Negating unknown gives unknown: NULL.",
  "A one-column table…",
  "…with 5, 7 and a missing value.",
  "Four counts side by side, each a scalar subquery.",
  "Rows where x = 5 is TRUE.",
  "Rows where x <> 5 is TRUE; the NULL row is UNKNOWN, so it is not counted.",
  "Rows where x is missing.",
  "All rows.",
]
explanation = '''
It printed:

```text
eq|is_null|ne|and_false|and_true|or_true|not_unknown
NULL|1|NULL|0|NULL|1|NULL
eq5|ne5|missing|total
1|1|1|3
```

`AND` with a FALSE side and `OR` with a TRUE side give a definite answer however the unknown
turns out; everything else stays `NULL`. In the table, `x = 5` and `x <> 5` add up to 2, not
3: the `NULL` row is in neither, and only `IS NULL` finds it.
'''

[[unit.step]]
kind = "drill"
id = "sql-u15-d2-not-in-trap"
title = "The NOT IN trap"
points = 10
difficulty = 15
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
`x NOT IN (list)` is a chain of `x <> item` joined by `AND`, so one `NULL` item makes every
comparison UNKNOWN and the anti-join returns nothing. `NOT EXISTS` is a true anti-join: for
each outer row the engine probes for a matching inner row, and a `NULL` inner value simply
fails to match.
'''
prompt = '''
Find customers without orders three ways: with `NOT IN` over a column that contains a `NULL`,
with `NOT EXISTS`, and with `NOT IN` after filtering the `NULL`s out.
'''
target = '''
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);
CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER);
INSERT INTO customers VALUES (1, 'Ana'), (2, 'Bo'), (3, 'Cy');
INSERT INTO orders VALUES (10, 1), (11, NULL);
SELECT count(*) AS not_in FROM customers
WHERE id NOT IN (SELECT customer_id FROM orders);
SELECT name AS not_exists FROM customers AS c
WHERE NOT EXISTS (SELECT 1 FROM orders AS o WHERE o.customer_id = c.id)
ORDER BY c.id;
SELECT name AS filtered FROM customers
WHERE id NOT IN (SELECT customer_id FROM orders WHERE customer_id IS NOT NULL)
ORDER BY id;
'''
line_comments = [
  "Three customers will go here.",
  "Orders; customer_id may be missing.",
  "Ana, Bo and Cy.",
  "Ana has an order, and one order has no customer at all.",
  "Counts the customers…",
  "…whose id is not in the list (1, NULL): every comparison with NULL is UNKNOWN.",
  "The anti-join: customers…",
  "…for whom no order with their id exists; the NULL order matches nobody.",
  "In id order.",
  "NOT IN again…",
  "…with the NULLs removed from the list first.",
  "In id order.",
]
explanation = '''
It printed:

```text
not_in
0
not_exists
Bo
Cy
filtered
Bo
Cy
```

The first query found nobody: for Bo, `2 NOT IN (1, NULL)` is `2 <> 1 AND 2 <> NULL`, which
is TRUE AND UNKNOWN, so UNKNOWN, and the row is dropped. `NOT EXISTS` asks a different
question (is there a matching row?) that `NULL` cannot poison. Filtering the `NULL`s out also
works, but `NOT EXISTS` is the habit that never fails.
'''

[[unit.step]]
kind = "drill"
id = "sql-u15-d3-coalesce-nullif"
title = "COALESCE, NULLIF and IS NOT"
points = 10
difficulty = 15
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
`COALESCE` and `NULLIF` are small scalar functions evaluated once per row, and together they
convert between `NULL` and sentinel values in both directions. `IS NOT` is the null-safe form
of `<>`: it always returns 1 or 0, never UNKNOWN, so no row is silently dropped.
'''
prompt = '''
Show each team's display name, points with a default, and points per game without dividing by
zero, then compare `<>` with `IS NOT` on a column that has a `NULL`.
'''
target = '''
CREATE TABLE stats (team TEXT, nickname TEXT, points INTEGER, games INTEGER);
INSERT INTO stats VALUES
  ('Lions', 'The Pride', 30, 10),
  ('Owls', NULL, 12, 0),
  ('Bees', '', NULL, 4);
SELECT team,
       COALESCE(NULLIF(nickname, ''), team) AS shown,
       COALESCE(points, 0) AS pts,
       points / NULLIF(games, 0) AS per_game
FROM stats
ORDER BY team;
SELECT count(*) AS ne FROM stats WHERE nickname <> 'The Pride';
SELECT count(*) AS is_not FROM stats WHERE nickname IS NOT 'The Pride';
'''
line_comments = [
  "Team stats where nickname and points can be missing.",
  "Starts a multi-row INSERT.",
  "A complete row.",
  "No nickname, and no games played yet.",
  "An empty-string nickname, and points not recorded.",
  "For each team…",
  "…NULLIF turns '' into NULL, then COALESCE falls back to the team name…",
  "…a missing score is shown as 0…",
  "…and 0 games becomes NULL, so the division gives NULL instead of an error.",
  "From the stats table…",
  "…in team order.",
  "Teams whose nickname is not The Pride, compared with <>: the NULL row is UNKNOWN.",
  "The same question with the null-safe IS NOT: the NULL row counts.",
]
explanation = '''
It printed:

```text
team|shown|pts|per_game
Bees|Bees|0|NULL
Lions|The Pride|30|3
Owls|Owls|12|NULL
ne
1
is_not
2
```

`NULLIF(nickname, '')` treated the empty string like a missing nickname, so both Bees and
Owls fell back to the team name. SQLite already returns `NULL` for a division by zero, but
PostgreSQL raises an error, so `NULLIF(games, 0)` keeps the query portable. Finally `<>`
skipped the Owls, whose nickname is `NULL`, while `IS NOT` counted them.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u15-x1-price-changes"
title = "What changed in the price list?"
points = 30
difficulty = 15
entry = "price_changes"
run_command = "python3 -m unittest"
intro = '''
Comparing two snapshots of a table is a join on the key followed by a filter on "the value
differs", and that filter is where three-valued logic bites. The hidden tests use prices that
are missing on one side, on both sides, and zero, so only a null-safe comparison passes.
'''
instructions = '''
## Your turn: write ONE query

Two snapshots of a price list exist. A `NULL` price means "not priced yet"; `0` is a real
price (a free item):

```sql
CREATE TABLE prices_old (sku TEXT PRIMARY KEY, price INTEGER);
CREATE TABLE prices_new (sku TEXT PRIMARY KEY, price INTEGER);
```

Write **one query** that lists every sku present in **both** tables whose price changed,
with these columns, in this order:

| column | value |
|---|---|
| `sku` | the sku |
| `old_price` | the price in `prices_old` (may be `NULL`) |
| `new_price` | the price in `prices_new` (may be `NULL`) |
| `kind` | `'priced'` if the old price is `NULL`; `'unpriced'` if the new price is `NULL`; `'changed'` otherwise |

- Two `NULL`s mean "still not priced": that is **not** a change.
- Skus that appear in only one table are left out.
- Order the rows by `sku`.

Example:

```text
prices_old: (A, 100) (B, NULL) (C, 50) (D, NULL) (E, 0)
prices_new: (A, 120) (B, 80)   (C, NULL) (D, NULL) (E, 0) (F, 10)

sku|old_price|new_price|kind
A|100|120|changed
B|NULL|80|priced
C|50|NULL|unpriced
```

Hidden tests decide correctness.
'''
starter = '''
-- price_changes: write your query below (one SELECT, ordered by sku).
-- Hint: price <> price is UNKNOWN when either side is NULL. Which comparison is null-safe?
'''
tests = '''
SCHEMA = """
CREATE TABLE prices_old (sku TEXT PRIMARY KEY, price INTEGER);
CREATE TABLE prices_new (sku TEXT PRIMARY KEY, price INTEGER);
"""

EXAMPLE = SCHEMA + """
INSERT INTO prices_old VALUES ('A', 100), ('B', NULL), ('C', 50), ('D', NULL), ('E', 0);
INSERT INTO prices_new VALUES ('A', 120), ('B', 80), ('C', NULL), ('D', NULL), ('E', 0), ('F', 10);
"""

COLUMNS = ["sku", "old_price", "new_price", "kind"]


class PriceChangesTest(unittest.TestCase):
    def test_columns(self):
        cols, _ = query(EXAMPLE)
        self.assertEqual(cols, COLUMNS)

    def test_example(self):
        _, rows = query(EXAMPLE)
        self.assertEqual(rows, [
            ("A", 100, 120, "changed"),
            ("B", None, 80, "priced"),
            ("C", 50, None, "unpriced"),
        ])

    def test_two_nulls_are_not_a_change(self):
        _, rows = query(SCHEMA + """
            INSERT INTO prices_old VALUES ('N1', NULL), ('N2', NULL), ('S', 5);
            INSERT INTO prices_new VALUES ('N1', NULL), ('N2', 7), ('S', 5);
        """)
        self.assertEqual(rows, [("N2", None, 7, "priced")])

    def test_zero_is_a_real_price(self):
        _, rows = query(SCHEMA + """
            INSERT INTO prices_old VALUES ('free1', NULL), ('free2', 0), ('free3', 0), ('m', -1);
            INSERT INTO prices_new VALUES ('free1', 0), ('free2', NULL), ('free3', 0), ('m', NULL);
        """)
        self.assertEqual(rows, [
            ("free1", None, 0, "priced"),
            ("free2", 0, None, "unpriced"),
            ("m", -1, None, "unpriced"),
        ])

    def test_skus_in_one_table_only_are_left_out(self):
        _, rows = query(SCHEMA + """
            INSERT INTO prices_old VALUES ('gone', 10), ('gone2', NULL), ('both', 1);
            INSERT INTO prices_new VALUES ('fresh', 10), ('fresh2', NULL), ('both', 2);
        """)
        self.assertEqual(rows, [("both", 1, 2, "changed")])

    def test_rows_are_ordered_by_sku(self):
        _, rows = query(SCHEMA + """
            INSERT INTO prices_old VALUES ('z', 1), ('m', NULL), ('b', 3), ('k', 4);
            INSERT INTO prices_new VALUES ('b', 30), ('k', 4), ('m', 2), ('z', NULL);
        """)
        self.assertEqual(rows, [
            ("b", 3, 30, "changed"),
            ("m", None, 2, "priced"),
            ("z", 1, None, "unpriced"),
        ])

    def test_no_changes_and_empty_tables(self):
        _, rows = query(SCHEMA + """
            INSERT INTO prices_old VALUES ('a', 1), ('b', NULL);
            INSERT INTO prices_new VALUES ('a', 1), ('b', NULL);
        """)
        self.assertEqual(rows, [])
        _, rows = query(SCHEMA)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
SELECT o.sku,
       o.price AS old_price,
       n.price AS new_price,
       CASE
         WHEN o.price IS NULL THEN 'priced'
         WHEN n.price IS NULL THEN 'unpriced'
         ELSE 'changed'
       END AS kind
FROM prices_old AS o
JOIN prices_new AS n ON n.sku = o.sku
WHERE o.price IS NOT n.price
ORDER BY o.sku;
'''
time = "O(n log m)"
space = "O(1)"
justification = '''
With **n** rows in `prices_old` and **m** in `prices_new`, `EXPLAIN QUERY PLAN` shows:

```text
SCAN o USING INDEX sqlite_autoindex_prices_old_1
SEARCH n USING INDEX sqlite_autoindex_prices_new_1 (sku=?)
```

A `TEXT PRIMARY KEY` gets an automatic unique index. SQLite walks `prices_old` through that
index, which already yields rows in `sku` order, so the `ORDER BY` needs **no sort**. For
each row it does one seek into `prices_new`'s index, **O(log m)**: a nested-loop join that
costs **O(n log m)** in total. The filter and the `CASE` are evaluated per joined row and
streamed out, so the query holds **O(1)** extra memory.

Correctness hinges on the filter. `o.price <> n.price` is UNKNOWN whenever one side is `NULL`,
so it would drop exactly the "priced" and "unpriced" rows. `o.price IS NOT n.price` is the
null-safe form: TRUE when one side is `NULL` and the other isn't, FALSE when both are `NULL`.
Rewriting it as `COALESCE(o.price, 0) <> COALESCE(n.price, 0)` would treat "not priced" and
"free" as equal, which the zero-price test catches. The inner `JOIN` drops skus found in only
one table, and the `CASE` tests `IS NULL`, never `= NULL`.
'''

