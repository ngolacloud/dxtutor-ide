[[unit.step]]
kind = "drill"
id = "sql-u23-d3-covering"
title = "Covering indexes and free sorting"
points = 10
difficulty = 29
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
After a seek, each matching index entry carries only the indexed columns and the rowid, so
reading any other column costs a second B-tree lookup into the table. A covering index stores
every needed column, removing those lookups. Because index entries are sorted, an `ORDER BY`
that follows the index order also needs no temporary B-tree.
'''
prompt = '''
With an index on `customer_id` only, look at the plans for a sum and for a sorted list of one
customer's totals. Add an index on `(customer_id, total)` and look at the same plans again;
then select a column the new index does not hold.

**Why:** reading the words `COVERING` and `TEMP B-TREE` in a plan tells you, without timing
anything, whether a query touches the table and whether it sorts.
'''
target = '''
CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER,
                     status TEXT, total INTEGER);
CREATE INDEX idx_orders_customer ON orders(customer_id);

EXPLAIN QUERY PLAN SELECT SUM(total) FROM orders WHERE customer_id = 7;
EXPLAIN QUERY PLAN
SELECT total FROM orders WHERE customer_id = 7 ORDER BY total;

CREATE INDEX idx_orders_customer_total ON orders(customer_id, total);

EXPLAIN QUERY PLAN SELECT SUM(total) FROM orders WHERE customer_id = 7;
EXPLAIN QUERY PLAN
SELECT total FROM orders WHERE customer_id = 7 ORDER BY total;
EXPLAIN QUERY PLAN
SELECT status FROM orders WHERE customer_id = 7 ORDER BY total;
'''
