instructions = '''
## Your turn

Write **one query** (a single `SELECT` statement) against these tables:

```sql
CREATE TABLE courses (id INTEGER PRIMARY KEY, title TEXT);
CREATE TABLE enrollments (
  id INTEGER PRIMARY KEY,
  course_id INTEGER,
  student TEXT,
  status TEXT        -- 'active', 'dropped' or 'completed'
);
```

Return **one row per course**, every course included, with the number of its enrollments whose
status is `'active'`. A course with no active enrollment shows `0`. Two different courses may
share a title; they are still two rows. Enrollments that point at a missing course are ignored.

Return exactly these columns, in this order:

| column | meaning |
|---|---|
| `title` | the course title |
| `active_students` | how many of its enrollments are active (0 if none) |

Sort by `active_students` from highest to lowest, and break ties by `title` in alphabetical
order.

Example. Courses SQL, Go, Rust and Zig; SQL has two active students and one who dropped, Go has
one dropped student, Rust has one active student and Zig has no enrollments:

```text
title|active_students
SQL|2
Rust|1
Go|0
Zig|0
```

Hidden tests decide correctness.
'''
starter = '''
-- course_activity: write your query below
-- Hint: start from courses, LEFT JOIN the active enrollments, and count a column that is NULL when nothing matched.
'''
tests = '''
SCHEMA = """
CREATE TABLE courses (id INTEGER PRIMARY KEY, title TEXT);
CREATE TABLE enrollments (
  id INTEGER PRIMARY KEY,
  course_id INTEGER,
  student TEXT,
  status TEXT
);
"""

BASE = SCHEMA + """
INSERT INTO courses VALUES (1, 'SQL'), (2, 'Go'), (3, 'Rust'), (4, 'Zig');
INSERT INTO enrollments (course_id, student, status) VALUES
  (1, 'ana', 'active'), (1, 'bo', 'active'), (1, 'cy', 'dropped'),
  (2, 'dee', 'dropped'),
  (3, 'eve', 'active');
"""


class CourseActivityTest(unittest.TestCase):
    def test_columns(self):
        cols, _ = query(BASE)
        self.assertEqual(cols, ["title", "active_students"])

    def test_example(self):
        _, rows = query(BASE)
        self.assertEqual(rows, [("SQL", 2), ("Rust", 1), ("Go", 0), ("Zig", 0)])

    def test_only_inactive_enrollments_count_as_zero(self):
        setup = SCHEMA + """
        INSERT INTO courses VALUES (1, 'Algebra'), (2, 'Biology');
        INSERT INTO enrollments (course_id, student, status) VALUES
          (1, 'ana', 'completed'), (1, 'bo', 'dropped'), (2, 'cy', 'active');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("Biology", 1), ("Algebra", 0)])

    def test_no_enrollments_at_all(self):
        setup = SCHEMA + "INSERT INTO courses VALUES (1, 'Zig'), (2, 'Ada'), (3, 'Lua');"
        _, rows = query(setup)
        self.assertEqual(rows, [("Ada", 0), ("Lua", 0), ("Zig", 0)])

    def test_repeated_titles_stay_separate(self):
        setup = SCHEMA + """
        INSERT INTO courses VALUES (1, 'Intro'), (2, 'Intro'), (3, 'Deep');
        INSERT INTO enrollments (course_id, student, status) VALUES
          (1, 'ana', 'active'), (1, 'bo', 'active'), (1, 'cy', 'active'),
          (2, 'dee', 'active'), (3, 'eve', 'active'), (3, 'fay', 'active');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("Intro", 3), ("Deep", 2), ("Intro", 1)])

    def test_orphan_enrollments_ignored(self):
        setup = SCHEMA + """
        INSERT INTO courses VALUES (1, 'SQL');
        INSERT INTO enrollments (course_id, student, status) VALUES
          (1, 'ana', 'active'), (99, 'bo', 'active'), (NULL, 'cy', 'active');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("SQL", 1)])

    def test_no_courses(self):
        setup = SCHEMA + "INSERT INTO enrollments (course_id, student, status) VALUES (1, 'ana', 'active');"
        _, rows = query(setup)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
SELECT c.title, COUNT(e.id) AS active_students
FROM courses AS c
LEFT JOIN enrollments AS e
  ON e.course_id = c.id AND e.status = 'active'
GROUP BY c.id
ORDER BY active_students DESC, c.title;
'''
time = "O((n + m) log m)"
space = "O(n + m)"
justification = '''
SQLite keeps `courses` (**n** rows) as the outer loop, because it is the preserved side, and
**scans** it in primary-key order. `enrollments` (**m** rows) has no index on `course_id`, so
the planner builds an **automatic index** on `(course_id, status)` before the loop starts
(`SEARCH e USING AUTOMATIC PARTIAL COVERING INDEX (course_id=? AND status=?) LEFT-JOIN` in the
plan, plus a Bloom filter to skip hopeless probes): O(m log m) time and O(m) space. Each course
then costs one O(log m) seek plus a step per active enrollment. Because both `ON` conditions
are part of the index key, dropped enrollments are never even visited, and a course whose
probe finds nothing still gets its padded row.

Because the courses arrive in `id` order, `GROUP BY c.id` needs no sort: each group closes as
soon as the next course begins. Only `ORDER BY` sorts the n result rows, O(n log n). Total
**O((n + m) log m)** time (taking n ≤ m) and **O(n + m)** space. A permanent index on
`enrollments(course_id)` would remove the per-query index build.
'''

[[unit]]
id = "sql-u10-subqueries"
title = "Subqueries: IN, EXISTS and correlation"
level = "intermediate"
difficulty = 10
intro = '''
Every query returns a table, so a query can feed another query. You will use a subquery as a
single value, as a list to test membership against, and as a yes-or-no "does a row exist?",
and then write correlated subqueries that are evaluated once per outer row, paying attention
to what each shape costs.
'''
concepts = '''
## The idea

A **subquery** is a `SELECT` nested inside another statement. Because the result of a query is
itself a relation, it can stand wherever SQL expects a value, a list or a table. Subqueries let
you write a question in the shape you would say it aloud: *products more expensive than the
average*, *customers who have never ordered*.

## Three shapes

A **scalar subquery** returns one column and at most one row, and can be used anywhere a value
is expected:

```sql
SELECT name, price - (SELECT AVG(price) FROM products) AS vs_avg
FROM products;
```

`x IN (subquery)` tests membership in a one-column result:

```sql
SELECT name FROM customers
WHERE id IN (SELECT customer_id FROM orders WHERE total > 100);
```

`EXISTS (subquery)` is true when the subquery returns at least one row. The selected columns do
not matter, so `SELECT 1` is the convention, and `NOT EXISTS` is its negation.

## Correlated subqueries

A subquery that refers to a column of the outer query is **correlated**. Logically it is
evaluated again for every outer row:

```sql
SELECT o.id FROM orders AS o
WHERE o.total > (SELECT AVG(o2.total) FROM orders AS o2
                 WHERE o2.customer_id = o.customer_id);
```

Here the inner average is each customer's own. In relational algebra, `EXISTS` is a
**semi-join** (keep the rows of A that have a match in B) and `NOT EXISTS` an **anti-join**.
Unlike a join, a semi-join never repeats the outer row, however many matches there are.

## Pitfalls and SQLite specifics

- **Too many rows.** In PostgreSQL a scalar subquery that returns two rows is an error. SQLite
  silently uses the first one. Pin a scalar subquery to one row: an aggregate, a primary-key
  lookup, or `ORDER BY ... LIMIT 1`. A scalar subquery that returns no row yields `NULL`.
- **`NOT IN` and `NULL`.** If the subquery's list contains a `NULL`, `x NOT IN (...)` is never
  true, so the query returns nothing at all. `NOT EXISTS` has no such trap; prefer it for
  "has no ..." questions. Unit 15 explains the logic behind this.
- **Cost.** SQLite runs an uncorrelated subquery once and reuses the result, and it
  materialises an `IN (subquery)` list into a temporary index, so each membership test is a
  seek. A correlated subquery runs per outer row: with an index on the correlated column each
  run is a seek, but without one SQLite rescans the inner table every time, which is O(n·m).
  `EXPLAIN QUERY PLAN` shows `CORRELATED SCALAR SUBQUERY` followed by how each run reads the
  inner table: `SCAN` (a full pass) or `SEARCH ... USING INDEX` (a seek).

## What you will practise

You will compare rows with a scalar subquery, answer "who ordered" and "who never ordered" with
`IN` and `NOT EXISTS`, and compute per-row values with correlated subqueries. The challenge
finds the top earners of every department, ties included.
'''

[[unit.step]]
kind = "concept"
id = "sql-u10-c1-nesting"
title = "Queries as values"
points = 5
difficulty = 10
intro = '''
Closure is a property of relational algebra: every operator takes relations and returns a
relation, so queries nest freely. What changes the cost is correlation: a subquery that does
not depend on the outer row can be computed once, while one that does runs per row.
'''
body = '''
## Where a subquery can go

```sql
-- as a value, compared with each row
SELECT name FROM products
WHERE price > (SELECT AVG(price) FROM products);

-- as a list, for membership
SELECT name FROM customers
WHERE id IN (SELECT customer_id FROM orders);

-- as a test, for existence
SELECT name FROM customers AS c
WHERE NOT EXISTS (SELECT 1 FROM orders AS o WHERE o.customer_id = c.id);
```

The first two are **uncorrelated**: they never mention the outer query, so SQLite computes them
once. The third is **correlated**: `c.id` comes from the outer row, so conceptually the inner
query runs once per customer.

## Subquery or join?

`IN` and `EXISTS` keep each outer row **at most once**. A join with `orders` would repeat a
customer once per order, and you would need `DISTINCT` to undo the duplicates. When you only
want to know *whether* related rows exist, a subquery says it more directly and does less work:
`EXISTS` can stop at the first match.

When you need columns from the other table in the output, a join is the right tool. A
correlated scalar subquery in the `SELECT` list also works for one value per row, but each one
is a separate lookup.
'''

