id = "sql-u02-d3-affinity"
title = "Type affinity in action"
points = 10
difficulty = 2
placeholder_policy = "shown"
run_command = "sqlite3 < main.sql"
intro = '''
SQLite decides the storage class of each value as it is stored, guided by the column's
**affinity**. Text that looks like a number is converted for numeric columns, numbers become
text in text columns, and values that cannot be converted are kept as they are. This is
flexible typing: the column suggests a type, the value carries the actual one.
'''
prompt = '''
Insert values of different types into typed columns and use `typeof` to see what SQLite
actually stored.

**Why:** affinity explains results that would be errors in other databases. Knowing what
was really stored saves you from comparing a number with a piece of text later on.
'''
target = '''
CREATE TABLE readings (
  label TEXT,
  amount INTEGER,
  ratio REAL,
  note TEXT
);

INSERT INTO readings VALUES ('a', 42, 0.5, 'plain');
INSERT INTO readings VALUES ('b', '42', '0.5', 42);
INSERT INTO readings VALUES ('c', 'forty-two', 1, NULL);

SELECT label,
       amount, typeof(amount) AS amount_type,
       ratio, typeof(ratio) AS ratio_type,
       note, typeof(note) AS note_type
FROM readings
ORDER BY label;
'''
