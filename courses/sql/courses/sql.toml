  "Text that looks like a number becomes a number in numeric columns; the number 42 becomes text in `note`.",
  "`'forty-two'` cannot become a number, so it stays text; the integer `1` becomes the real `1.0`.",
  "",
  "A query can span several lines; it ends only at the `;`.",
  "Each stored value next to its type.",
  "The same for the `REAL` column.",
  "And for the `TEXT` column.",
