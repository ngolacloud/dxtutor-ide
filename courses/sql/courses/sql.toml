[[unit.step]]
kind = "drill"
id = "sql-u09-d3-count-zero"
title = "Count with zero, and ON versus WHERE"
points = 10
difficulty = 9
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Grouping after a `LEFT JOIN` gives one row per left row, and `COUNT(column)` turns padded rows
into zeros. Where you put a filter on the right table decides whether those rows survive: in
`ON` it shapes the matches, in `WHERE` it runs after the padding and deletes them.
'''
prompt = '''
Count each customer's paid orders and their total, keeping customers with none at zero. Then run
the same filter in `WHERE` and see which customers survive.

**Why:** this is the single most common outer-join bug in production reports.
'''
target = '''
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);
CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, status TEXT, total INTEGER);
INSERT INTO customers VALUES (1, 'Ana'), (2, 'Bo'), (3, 'Cy');
INSERT INTO orders VALUES
  (10, 1, 'paid', 25), (11, 1, 'paid', 15), (12, 3, 'refunded', 40);

SELECT c.name,
       COUNT(o.id) AS paid_orders,
       COALESCE(SUM(o.total), 0) AS paid_total
FROM customers AS c
LEFT JOIN orders AS o ON o.customer_id = c.id AND o.status = 'paid'
GROUP BY c.id
ORDER BY c.id;

SELECT c.name, COUNT(*) AS rows_kept
FROM customers AS c
LEFT JOIN orders AS o ON o.customer_id = c.id
WHERE o.status = 'paid'
GROUP BY c.id
ORDER BY c.id;
'''
