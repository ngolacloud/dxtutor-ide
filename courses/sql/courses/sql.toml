0
after_rollback
4
id|status
2|open
3|open
```

The `DELETE` really ran: inside the transaction the table was empty. `ROLLBACK` restored it
from the journal. A good habit for manual fixes is `BEGIN`, the change, a `SELECT` to check it,
and then `COMMIT` or `ROLLBACK`.
'''

