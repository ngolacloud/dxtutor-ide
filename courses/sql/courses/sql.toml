run_command = "sqlite3 < main.sql"
intro = '''
Gaps are the complement of islands, and `LEAD` finds them without generating the missing values:
each row compares itself with the next one in order. One ordered pass suffices, so the cost does
not depend on how wide the gaps are, only on how many rows exist.
'''
prompt = '''
Store a few invoice numbers, read each one's successor with `LEAD`, and list every missing range
with its first number, last number and count.
'''
target = '''
CREATE TABLE invoices (num INTEGER PRIMARY KEY, total INTEGER);
INSERT INTO invoices VALUES
  (1001, 50), (1002, 75), (1005, 20), (1006, 90), (1007, 10), (1010, 35);
WITH nexts AS (
  SELECT num, LEAD(num) OVER (ORDER BY num) AS next_num
  FROM invoices
)
SELECT num + 1 AS gap_start, next_num - 1 AS gap_end, next_num - num - 1 AS missing
FROM nexts
WHERE next_num - num > 1
ORDER BY gap_start;
'''
line_comments = [
  "Invoices keyed by their number.",
  "Seeds six invoices...",
  "...with 1003–1004 and 1008–1009 missing.",
  "A CTE that pairs every invoice number with the next one.",
  "`LEAD(num)` is the following row's number in `num` order; NULL on the last row.",
  "Reads every invoice.",
  "Ends the CTE.",
  "The gap starts after this number and ends before the next one.",
  "Reads the pairs.",
  "Keeps only pairs that are not adjacent; the last row's NULL comparison drops it too.",
  "Lists the gaps in order.",
]
explanation = '''
It printed:

```
gap_start|gap_end|missing
1003|1004|2
1008|1009|2
```

The last invoice, 1010, has no successor, so `next_num` is NULL, `next_num - num > 1` is NULL,
and `WHERE` drops it. A gap of a million numbers costs the same as a gap of two: the query never
generates the missing values, it only compares neighbours.
'''

[[unit.step]]
kind = "drill"
id = "sql-u25-d3-uptime"
title = "Up and down periods"
points = 10
difficulty = 31
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
When a run is defined by an unchanged value rather than by consecutive numbers, the label comes
from a running total: 1 where the value changes, 0 where it doesn't, summed in order. Two window
passes and one `GROUP BY` turn a stream of samples into periods.
'''
prompt = '''
Store a health check per minute, flag every row whose status differs from the previous one, add
the flags up into a run id, and report each up or down period.
'''
target = '''
CREATE TABLE checks (ts TEXT PRIMARY KEY, status TEXT);
INSERT INTO checks VALUES
  ('2026-05-04 10:00', 'up'), ('2026-05-04 10:01', 'up'),
  ('2026-05-04 10:02', 'down'), ('2026-05-04 10:03', 'down'),
  ('2026-05-04 10:04', 'down'), ('2026-05-04 10:05', 'up'),
  ('2026-05-04 10:06', 'down'), ('2026-05-04 10:07', 'up');
WITH flagged AS (
  SELECT ts, status,
         CASE WHEN status IS LAG(status) OVER (ORDER BY ts) THEN 0 ELSE 1 END AS is_start
  FROM checks
),
runs AS (
  SELECT ts, status, SUM(is_start) OVER (ORDER BY ts) AS run_id
  FROM flagged
)
SELECT run_id, status, MIN(ts) AS since, MAX(ts) AS until, COUNT(*) AS samples
FROM runs
GROUP BY run_id, status
ORDER BY run_id;
'''
line_comments = [
  "One health check per timestamp.",
  "Seeds eight minutes of checks...",
  "...up, up...",
  "...down, down...",
  "...down, up...",
  "...down, up.",
  "First CTE: mark the rows where a new run starts.",
  "Selects each check with its status...",
  "...and 0 when the status IS the previous row's, else 1 (the first row compares with NULL).",
  "Reads the checks.",
  "Ends the first CTE.",
  "Second CTE: turn the flags into run numbers.",
  "A running sum: it goes up by 1 at every change and stays flat inside a run.",
  "Reads the flagged rows.",
  "Ends the second CTE.",
  "Each run's status, first and last sample, and length.",
  "Reads the numbered rows.",
  "One group per run; `status` is constant inside a run.",
  "Lists the runs in time order.",
]
explanation = '''
It printed:

```
run_id|status|since|until|samples
1|up|2026-05-04 10:00|2026-05-04 10:01|2
2|down|2026-05-04 10:02|2026-05-04 10:04|3
3|up|2026-05-04 10:05|2026-05-04 10:05|1
4|down|2026-05-04 10:06|2026-05-04 10:06|1
5|up|2026-05-04 10:07|2026-05-04 10:07|1
```

Grouping by `status` alone would have merged all the down minutes into one row. The run id
keeps the second outage apart from the first. A window `SUM` with `ORDER BY` uses a frame that
ends at the current row, which is exactly a running total.
'''

[[unit.step]]
