[[unit.step]]
kind = "challenge"
id = "sql-u16-x1-region-leaders"
title = "Customers above their region's average"
points = 40
difficulty = 22
entry = "above_region_average"
run_command = "python3 -m unittest"
intro = '''
A three-stage report: per-customer totals, a per-region average of those totals, and a
comparison of the two. Each stage is a grouping or a join of the previous one, and the
middle stage only gives the right number if the first one keeps customers who bought
nothing.
'''
instructions = '''
## Your turn

Write **ONE query** (a single statement, which may start with `WITH`).

```sql
CREATE TABLE customers (
  id     INTEGER PRIMARY KEY,
  name   TEXT NOT NULL,
  region TEXT NOT NULL
);
CREATE TABLE orders (
  id          INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL REFERENCES customers(id),
  amount      INTEGER NOT NULL,
  status      TEXT NOT NULL      -- 'paid' or 'cancelled'
);
```

- A customer's **total** is the sum of the amounts of their **paid** orders, and **0** when
  they have none (no orders at all, or only cancelled ones).
- A region's **average** is the average of the totals of **every** customer in the region,
  zeros included.
- Return the customers whose total is **strictly greater** than their region's average.

Columns, in this order: `region`, `name`, `total`, `region_avg` (the region's average
rounded to 2 decimals with `ROUND(x, 2)`; compare against the unrounded value).
Order by `region`, then `total` descending, then `name`.

## Example

| customer | region | paid orders | cancelled |
|---|---|---|---|
| ana | north | 100, 50 | |
| bo | north | 30 | 500 |
| cy | north | | |
| gus | west | 40 | |
| hal | west | | 90 |

North totals are 150, 30 and 0 (average 60); west totals are 40 and 0 (average 20).

```
region|name|total|region_avg
north|ana|150|60.0
west|gus|40|20.0
```

Hidden tests use other data: regions where everyone ties, empty tables, and customers with
no paid orders. Hidden tests decide correctness.
'''
starter = '''
-- above_region_average: write your query below
-- Hint: stage 1 = totals per customer (LEFT JOIN, paid only, COALESCE),
--       stage 2 = average per region, then join the two and filter.
'''
tests = '''
SCHEMA = """
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT NOT NULL, region TEXT NOT NULL);
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL REFERENCES customers(id),
  amount INTEGER NOT NULL,
  status TEXT NOT NULL
);
"""

EXAMPLE = SCHEMA + """
INSERT INTO customers VALUES
  (1, 'ana', 'north'), (2, 'bo', 'north'), (3, 'cy', 'north'),
  (4, 'gus', 'west'), (5, 'hal', 'west');
INSERT INTO orders VALUES
  (1, 1, 100, 'paid'), (2, 1, 50, 'paid'), (3, 2, 30, 'paid'),
  (4, 2, 500, 'cancelled'), (5, 4, 40, 'paid'), (6, 5, 90, 'cancelled');
"""


class AboveRegionAverageTest(unittest.TestCase):
    def test_columns(self):
        cols, _ = query(EXAMPLE)
        self.assertEqual(cols, ["region", "name", "total", "region_avg"])

    def test_example(self):
        _, rows = query(EXAMPLE)
        self.assertEqual(rows, [("north", "ana", 150, 60.0), ("west", "gus", 40, 20.0)])

    def test_customers_without_paid_orders_count_as_zero(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES (1, 'gus', 'west'), (2, 'hal', 'west'), (3, 'ivy', 'west');
        INSERT INTO orders VALUES (1, 1, 40, 'paid'), (2, 3, 70, 'cancelled');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("west", "gus", 40, 13.33)])

    def test_cancelled_orders_are_ignored(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES (1, 'ana', 'east'), (2, 'bo', 'east');
        INSERT INTO orders VALUES
          (1, 1, 10, 'paid'), (2, 2, 5, 'paid'), (3, 2, 1000, 'cancelled');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("east", "ana", 10, 7.5)])

    def test_ties_with_the_average_are_excluded(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES (1, 'ana', 'south'), (2, 'bo', 'south'), (3, 'cy', 'south');
        INSERT INTO orders VALUES (1, 1, 20, 'paid'), (2, 2, 20, 'paid'), (3, 3, 20, 'paid');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [])

    def test_average_is_per_region_not_global(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES
          (1, 'ana', 'a'), (2, 'bo', 'a'), (3, 'cy', 'b'), (4, 'dee', 'b');
        INSERT INTO orders VALUES
          (1, 1, 1000, 'paid'), (2, 2, 900, 'paid'), (3, 3, 12, 'paid'), (4, 4, 10, 'paid');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("a", "ana", 1000, 950.0), ("b", "cy", 12, 11.0)])

    def test_order_by_region_total_desc_then_name(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES
          (1, 'zoe', 'b'), (2, 'amy', 'b'), (3, 'max', 'b'), (4, 'kim', 'a'), (5, 'lee', 'a');
        INSERT INTO orders VALUES
          (1, 1, 50, 'paid'), (2, 2, 50, 'paid'), (3, 3, 80, 'paid'),
          (4, 4, 9, 'paid'), (5, 5, 1, 'paid'), (6, 2, 7, 'cancelled');
        """
        _, rows = query(setup)
        self.assertEqual(
            rows,
            [("a", "kim", 9, 5.0), ("b", "max", 80, 60.0)],
        )
        setup2 = SCHEMA + """
        INSERT INTO customers VALUES
          (1, 'zoe', 'b'), (2, 'amy', 'b'), (3, 'max', 'b'), (4, 'ned', 'b');
        INSERT INTO orders VALUES
          (1, 1, 50, 'paid'), (2, 2, 50, 'paid'), (3, 3, 90, 'paid');
        """
        _, rows = query(setup2)
        self.assertEqual(
            rows,
            [("b", "max", 90, 47.5), ("b", "amy", 50, 47.5), ("b", "zoe", 50, 47.5)],
        )

    def test_empty_tables(self):
        _, rows = query(SCHEMA)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
WITH totals AS (
  SELECT c.id, c.name, c.region,
         COALESCE(SUM(o.amount), 0) AS total
  FROM customers AS c
  LEFT JOIN orders AS o
    ON o.customer_id = c.id AND o.status = 'paid'
  GROUP BY c.id, c.name, c.region
),
region_avg AS (
  SELECT region, AVG(total) AS avg_total
  FROM totals
  GROUP BY region
)
SELECT t.region, t.name, t.total, ROUND(r.avg_total, 2) AS region_avg
FROM totals AS t
JOIN region_avg AS r ON r.region = t.region
WHERE t.total > r.avg_total
ORDER BY t.region, t.total DESC, t.name;
'''
time = "O(c log c + o log o)"
space = "O(c)"
justification = '''
With **c** customers and **o** orders, stage 1 scans `customers` and, for each one, finds its
orders through the `LEFT JOIN`. Without an index on `orders.customer_id`, SQLite builds a
temporary **automatic index** on it (O(o log o)) so each customer becomes a seek instead of
a full scan. The `GROUP BY` sorts or streams the c groups: **O(c log c)**.

`totals` is used twice, so SQLite materializes it once (**O(c)** space) rather than
recomputing the join. Stage 2 groups those c rows by region, and the final join matches each
total with its region's single average row, followed by one sort of the output.

The correctness hinges on stage 1. The `status = 'paid'` test sits in the `ON` clause, so a
customer with only cancelled orders still produces one row with NULLs that `COALESCE` turns
into 0. Put it in `WHERE`, or use an inner join, and those customers vanish, which raises
the region average and silently changes who is above it.
'''

[[unit]]
id = "sql-u17-recursive-ctes"
title = "Recursive CTEs"
level = "advanced"
difficulty = 23
intro = '''
Some questions have no fixed number of steps: every day of a month, everyone below a manager
at any depth, every station reachable from here. `WITH RECURSIVE` answers them by letting a
CTE read its own previous rows until nothing new appears. You will generate a sequence, walk
a tree, walk a graph with a cycle, and then compute shortest hop counts without looping
forever.
'''
concepts = '''
## The idea

A plain query can join a table to itself once, or twice, but the number of joins is fixed
when you write it. A question such as "who reports to Ada, directly or indirectly?" needs as
many joins as the organisation is deep, and that depth is in the data, not in the query.

A **recursive CTE** solves this by iteration. It starts from some seed rows, then repeatedly
derives new rows from the rows it produced in the previous round, until a round produces
nothing. In relational terms it computes a **fixed point**, a transitive closure.

## How SQL expresses it

```sql
WITH RECURSIVE counter(n) AS (
  SELECT 1                       -- anchor: the seed rows
  UNION ALL
  SELECT n + 1 FROM counter      -- recursive member: reads the CTE
  WHERE n < 10                   -- stopping condition
)
SELECT n FROM counter;
```

The body is two queries joined by `UNION ALL` (or `UNION`). The **anchor** runs once. The
**recursive member** mentions the CTE's own name, and each time it runs, that name stands
only for the rows produced in the previous step, not the whole result so far.

## How SQLite runs it

SQLite keeps a **queue**. The anchor's rows go into it. Then, while the queue is not empty,
SQLite takes one row out, adds it to the result, and runs the recursive member with that
single row as the content of the CTE; whatever comes out is appended to the queue. With
`UNION ALL` every row is kept. With `UNION`, a row identical to one already produced is
discarded, which is what stops a walk around a cycle.

The recursion ends only when the recursive member returns no rows. That is your job: a
`WHERE` on a counter or depth, a join that runs out of children, or `UNION` on rows that
eventually repeat. A `LIMIT` on the outer query also stops SQLite once enough rows exist.

## What is special or tricky

- Forget the stopping condition and the query **never ends**. SQLite has no depth limit;
  MySQL stops at `cte_max_recursion_depth` (1000 by default).
- `UNION` compares whole rows. A row that carries a growing column, such as a depth or a
  path, is always new, so `UNION` alone no longer protects you from cycles.
- The recursive member may not use aggregates or window functions, and may reference the
  CTE only once.
- SQLite accepts `WITH` without `RECURSIVE` for a self-referencing CTE; PostgreSQL and MySQL
  require the keyword, so always write it.
- Carry along what you need later: a depth counter, a path string, a running product.

## What you will practise

You will fill the gaps in a calendar with a generated sequence, list an org chart with
depths and paths, and find every node reachable in a graph that contains a cycle. The
challenge asks for the shortest number of hops to every reachable station.
'''

[[unit.step]]
kind = "concept"
id = "sql-u17-c1-anchor"
title = "Anchor, recursive member, stop"
points = 5
difficulty = 23
intro = '''
A recursive CTE is a loop the database runs for you: a work queue seeded by the anchor and
refilled by the recursive member. Its cost is the number of rows that pass through that
queue, so the stopping condition decides both termination and performance.
'''
body = '''
## The three parts

```sql
WITH RECURSIVE fact(n, f) AS (
  SELECT 1, 1                          -- 1. anchor
  UNION ALL
  SELECT n + 1, f * (n + 1)            -- 2. recursive member
  FROM fact
  WHERE n < 6                          -- 3. stopping condition
)
SELECT n, f FROM fact;                 -- 1 1, 2 2, 3 6, ... 6 720
```

1. The **anchor** does not mention `fact`. It produces the starting rows.
2. The **recursive member** reads `fact`, which means "the row just taken from the queue".
   Each output row can carry state forward: here `f` is the running factorial.
3. The **stopping condition** makes the recursive member return nothing eventually. When
   `n` reaches 6, the `WHERE` rejects it and the queue drains.

## Walking a table

Most recursive CTEs walk real data. The anchor selects the starting rows, and the recursive
member joins the CTE to a table to take one step:

```sql
WITH RECURSIVE below(id) AS (
  SELECT id FROM staff WHERE boss_id IS NULL
  UNION ALL
  SELECT s.id FROM staff AS s JOIN below AS b ON s.boss_id = b.id
)
SELECT COUNT(*) FROM below;
```

Here the stop is natural: the leaves have no subordinates, so the join returns no rows.

## UNION ALL or UNION

`UNION ALL` keeps every row and is cheaper. `UNION` drops rows already seen, so a walk over
a graph with cycles ends once no new nodes appear. Pick `UNION` whenever the data could loop
back on itself.
'''

[[unit.step]]
kind = "drill"
id = "sql-u17-d1-calendar"
title = "Fill the gaps in a calendar"
