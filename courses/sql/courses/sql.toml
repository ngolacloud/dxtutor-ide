[[unit.step]]
kind = "challenge"
id = "sql-u04-x1-leaderboard"
title = "Build a leaderboard"
points = 20
difficulty = 4
entry = "leaderboard"
run_command = "python3 -m unittest"
intro = '''
A leaderboard is a **top-N query**: sort by a compound key, then keep the first `N` rows.
With a `LIMIT`, SQLite does not need to sort the whole table; it keeps the best `N` rows seen
so far and discards anything worse. Every tie must be broken explicitly, or the top `N` is
not well defined.
'''
instructions = '''
## Your turn

Write **one query** for this table of game runs:

```sql
CREATE TABLE runs (
  player  TEXT,
  score   INTEGER,  -- never NULL
  seconds INTEGER   -- time taken; NULL when the player did not finish
);
```

Return the **top 3 runs** with the columns `player`, `score` and `seconds`, in that order,
sorted by these rules:

1. the highest `score` first;
2. among equal scores, the fewest `seconds` first, and runs without a time (`NULL`) after
   every timed run with that score;
3. if still tied, by `player` from A to Z.

Return fewer than 3 rows when the table has fewer. A player may appear more than once.

Example:

```text
player|score|seconds
Ana|80|NULL
Bo|80|95
Caio|70|40
Dara|80|130
```

gives:

```text
player|score|seconds
Bo|80|95
Dara|80|130
Ana|80|NULL
```

The **order of the rows matters** here, and the hidden tests check it.
'''
starter = '''
-- leaderboard: write your query below
-- Hint: ORDER BY with three keys (one DESC), think about where NULL goes, then LIMIT.
'''
tests = '''
SCHEMA = "CREATE TABLE runs (player TEXT, score INTEGER, seconds INTEGER);"


def leaderboard(rows):
    conn = connect(SCHEMA)
    conn.executemany("INSERT INTO runs VALUES (?, ?, ?)", rows)
    cur = conn.execute(STUDENT_SQL)
    cols = [d[0] for d in cur.description or []]
    result = [tuple(r) for r in cur.fetchall()]
    conn.close()
    return cols, result


class LeaderboardTest(unittest.TestCase):
    def test_column_names(self):
        cols, _ = leaderboard([("Ana", 10, 5)])
        self.assertEqual(cols, ["player", "score", "seconds"])

    def test_example(self):
        _, rows = leaderboard([("Ana", 80, None), ("Bo", 80, 95), ("Caio", 70, 40), ("Dara", 80, 130)])
        self.assertEqual(rows, [("Bo", 80, 95), ("Dara", 80, 130), ("Ana", 80, None)])

    def test_highest_scores_first(self):
        _, rows = leaderboard([("Ana", 50, 100), ("Bo", 80, 120), ("Caio", 70, 90), ("Dara", 60, 60)])
        self.assertEqual(rows, [("Bo", 80, 120), ("Caio", 70, 90), ("Dara", 60, 60)])

    def test_equal_scores_fewer_seconds_first(self):
        _, rows = leaderboard([("Ana", 80, 130), ("Bo", 80, 95), ("Caio", 80, 110), ("Dara", 10, 5)])
        self.assertEqual(rows, [("Bo", 80, 95), ("Caio", 80, 110), ("Ana", 80, 130)])

    def test_unfinished_runs_after_timed_runs(self):
        _, rows = leaderboard([("Ana", 80, None), ("Bo", 80, 200), ("Caio", 70, 10)])
        self.assertEqual(rows, [("Bo", 80, 200), ("Ana", 80, None), ("Caio", 70, 10)])

    def test_full_ties_by_player_name(self):
        _, rows = leaderboard([("Zoe", 90, 60), ("Ana", 90, 60), ("Mia", 90, 60), ("Bea", 90, 60)])
        self.assertEqual(rows, [("Ana", 90, 60), ("Bea", 90, 60), ("Mia", 90, 60)])

    def test_unfinished_ties_by_player_name(self):
        _, rows = leaderboard([("Yan", 50, None), ("Eli", 50, None), ("Ivo", 40, 1)])
        self.assertEqual(rows, [("Eli", 50, None), ("Yan", 50, None), ("Ivo", 40, 1)])

    def test_same_player_several_runs(self):
        _, rows = leaderboard([("Ana", 90, 50), ("Ana", 95, 70), ("Bo", 90, 40), ("Bo", 20, 1)])
        self.assertEqual(rows, [("Ana", 95, 70), ("Bo", 90, 40), ("Ana", 90, 50)])

    def test_fewer_than_three_runs(self):
        _, rows = leaderboard([("Solo", 7, None)])
        self.assertEqual(rows, [("Solo", 7, None)])

    def test_empty_table(self):
        _, rows = leaderboard([])
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
-- leaderboard: write your query below
SELECT player, score, seconds
FROM runs
ORDER BY score DESC, seconds ASC NULLS LAST, player ASC
LIMIT 3;
'''
time = "O(n log k)"
space = "O(k)"
justification = '''
There is no index on `runs`, so SQLite scans all `n` rows once and feeds them to a **sorter**
using the three-key comparison. Because the query has `LIMIT 3`, SQLite's sorter keeps only
the best `k = 3` rows seen so far: each new row is compared with the worst row kept and is
either thrown away or swapped in. That costs **O(log k)** per row, so **O(n log k)** in total,
which for a fixed `k` is linear in the table size. Without the `LIMIT`, it would be a full
sort, **O(n log n)** time and **O(n)** memory.

Only `k` rows are ever held, so the space is **O(k)**. `NULLS LAST` matters only for the
`seconds` key: in ascending order SQLite would otherwise put unfinished runs before the
fastest ones. The final `player` key makes the order total, so the same data always gives the
same top three.
'''

[[unit]]
id = "sql-u05-functions"
title = "Functions, CAST and CASE"
level = "basic"
difficulty = 5
intro = '''
Raw columns are rarely exactly what you want to show. You will clean and reshape text with
string functions, round and format numbers, convert between types with `CAST`, and make
decisions inside a query with `CASE`. All of these work on one row at a time.
'''
concepts = '''
## The idea

A **scalar function** takes one or more values from a single row and returns one value:
`upper('tea')` gives `'TEA'`, `round(2.567, 1)` gives `2.6`. Used in a `SELECT` list, it runs
once for every row of the result, producing a new computed column. This is different from
the **aggregate** functions of the next unit, which combine many rows into one value.

`CASE` is SQL's way of choosing between values, like an if/else. It is an **expression**, not
a statement: it produces a value, so it can appear anywhere a value can, in `SELECT`,
`WHERE` or `ORDER BY`.

## Text and numbers

```sql
SELECT upper(name), lower(email), length(name),
       trim('  padded  '),                  -- 'padded'
       substr('database', 1, 4),            -- 'data' (positions start at 1)
       instr('ana@example.com', '@'),       -- 4, or 0 when not found
       replace('2026-11-23', '-', '/');     -- '2026/11/23'
SELECT abs(-7), round(3.14159, 2), 17 % 5, max(3, 9, 4);
SELECT CAST('42' AS INTEGER) + 1, CAST(7 AS REAL) / 2, printf('%.2f', 1234 / 100.0);
```

`CAST(value AS type)` converts explicitly to `INTEGER`, `REAL` or `TEXT`. `printf` (also
called `format` since SQLite 3.38) builds text from a pattern: `%.2f` is a number with two
decimals, `%05d` an integer padded with zeros to five digits.

## Decisions with CASE

```sql
SELECT name,
       CASE
         WHEN grade >= 18 THEN 'excellent'
         WHEN grade >= 10 THEN 'pass'
         ELSE 'fail'
       END AS result
FROM students;
```

The engine tries the `WHEN` conditions from top to bottom and uses the first that is true.
The short form `CASE status WHEN 'paid' THEN ... END` compares one value with each `WHEN`.

## What is special or tricky

- **The first true branch wins.** Put the most specific condition first: testing
  `grade >= 10` before `grade >= 18` would label every excellent student `'pass'`.
- **No `ELSE` means `NULL`** when no branch matches.
- **`NULL` in, `NULL` out.** Most functions return `NULL` when an argument is `NULL`:
  `length(NULL)` is `NULL`, not 0.
- **`CAST` in SQLite is forgiving.** `CAST('12abc' AS INTEGER)` is `12` and
  `CAST('abc' AS INTEGER)` is `0`. PostgreSQL raises an error for both.
- **`round` returns a real.** `round(2.5)` is `3.0`; in SQLite, halves round away from zero.
- **Names differ between databases.** SQLite's `substr` and `instr` are `substring` and
  `strpos` in PostgreSQL and `SUBSTRING` and `LOCATE` in MySQL. `printf` is SQLite's;
  PostgreSQL uses `to_char` or `format`.
- **`upper` and `lower` only know A to Z** in a standard SQLite build: `upper('ção')` leaves
  the accented letters unchanged.

## What you will practise

You will apply string functions, round, cast and format numbers, and classify rows with both
forms of `CASE`. In the challenge you turn raw customer rows into tidy display cards, with a
name, an email domain, a formatted balance and a tier.
'''

[[unit.step]]
kind = "concept"
id = "sql-u05-c1-scalar"
title = "Computing new columns"
points = 5
difficulty = 5
intro = '''
In relational algebra, computing new columns from existing ones is an extended
**projection**: each input row produces exactly one output row, with values derived from that
row alone. Because no row needs to know about any other, the engine computes them in a
single streaming pass.
'''
body = '''
## One row in, one row out

```sql
CREATE TABLE people (first TEXT, last TEXT, born INTEGER);
INSERT INTO people VALUES ('ada', 'Lovelace', 1815), ('alan', 'Turing', 1912);

SELECT upper(substr(first, 1, 1)) || substr(first, 2) || ' ' || last AS full_name,
       2000 - born AS age_in_2000,
       CASE WHEN born < 1900 THEN '19th century' ELSE '20th century' END AS era
FROM people
ORDER BY born;
```

```text
full_name|age_in_2000|era
Ada Lovelace|185|19th century
Alan Turing|88|20th century
```

Things to notice:

- **Functions nest.** `upper(substr(first, 1, 1))` takes the first letter and capitalises
  it; `||` then glues the rest of the name back on.
- **Every row is computed on its own.** The engine reads a row, evaluates the three
  expressions with that row's values, outputs the result and moves on.
- **`CASE ... END` is a value.** Here it produces a label, and `AS era` names the column it
  fills.
- **The table is unchanged.** `SELECT` only computes an answer; the stored rows still say
  `'ada'` in lower case. Changing stored data is the job of `UPDATE`, in a later unit.

## Why do it in SQL?

You could fetch the raw rows and reshape them in application code. Doing it in the query
keeps the logic next to the data, sends back exactly the columns the screen needs, and lets
the same rule be reused by every program that talks to the database.
'''

[[unit.step]]
kind = "drill"
id = "sql-u05-d1-text"
title = "String functions"
points = 10
difficulty = 5
placeholder_policy = "shown"
run_command = "sqlite3 < main.sql"
intro = '''
Text functions work on characters, so their cost grows with the length of the text: `length`,
`upper` and `replace` each walk the string once. Positions in SQL start at **1**, not 0, and
SQLite's `length` counts characters, not bytes.
'''
prompt = '''
Change case, measure and trim text, cut pieces out with `substr`, find a character with
`instr`, and combine them to extract the domain of an email address.

**Why:** cleaning and splitting text is everyday work, and nesting `substr` with `instr` is
the standard way to cut a string at a separator in SQLite.
'''
target = '''
SELECT upper('sqlite') AS up, lower('SQLite') AS low, length('dxtutor') AS len;
SELECT '[' || trim('   padded   ') || ']' AS trimmed, '[' || ltrim('   left') || ']' AS ltrimmed;
SELECT substr('database', 1, 4) AS first4, substr('database', 5) AS rest;
SELECT instr('ana@example.com', '@') AS at_pos, instr('no at sign', '@') AS missing;
SELECT replace('2026-11-23', '-', '/') AS slashed;

-- Everything after the @, in lower case.
SELECT lower(substr('Ana@Example.COM', instr('Ana@Example.COM', '@') + 1)) AS domain;
'''
line_comments = [
  "`upper` and `lower` change the case of the letters; `length` counts characters.",
  "`trim` removes spaces from both ends, `ltrim` only from the left; the brackets show where the text ends.",
  "`substr(text, start, count)` cuts out `count` characters from position `start`; without a count it runs to the end.",
  "`instr` returns the position of the first match, or 0 when there is none.",
  "`replace` swaps every occurrence of one piece of text for another.",
  "",
  "A comment introducing a nested expression.",
  "`instr` finds the `@` at position 4, `substr` takes everything from position 5, and `lower` normalises it.",
]
explanation = '''
The output was:

```text
up|low|len
SQLITE|sqlite|7
trimmed|ltrimmed
[padded]|[left]
first4|rest
data|base
at_pos|missing
4|0
slashed
2026/11/23
domain
example.com
```

Positions start at 1, so `substr('database', 1, 4)` is `data`, and `instr` reported the `@`
as the fourth character. Nesting the functions extracted and normalised the domain in one
expression, the same technique you will use in the challenge.
'''

[[unit.step]]
kind = "drill"
id = "sql-u05-d2-numbers"
title = "Numbers, CAST and printf"
points = 10
difficulty = 5
placeholder_policy = "shown"
