[[unit.step]]
kind = "challenge"
id = "sql-udb1-x1-transfer"
title = "Write an atomic transfer"
points = 30
difficulty = 16
entry = "transfer"
intro = '''
A transfer touches three rows in two tables, and three different rules can stop it halfway.
Only a transaction makes the outcome all or nothing whichever statement fails. The hidden tests
make each statement fail in turn and check that nothing was left behind.
'''
instructions = '''
## Your turn

Write a **script** (several statements) that moves **40** from account **1** to account **2**
and records it in `transfers` with the reference `'T-1001'`. The database has:

```sql
PRAGMA foreign_keys = ON;
CREATE TABLE accounts (
  id INTEGER PRIMARY KEY,
  owner TEXT NOT NULL,
  balance INTEGER NOT NULL CHECK (balance >= 0)
);
CREATE TABLE transfers (
  ref TEXT PRIMARY KEY,
  from_id INTEGER NOT NULL REFERENCES accounts (id),
  to_id INTEGER NOT NULL REFERENCES accounts (id),
  amount INTEGER NOT NULL CHECK (amount > 0)
);
```

The work is three changes: debit account 1, credit account 2, and insert the row
`('T-1001', 1, 2, 40)` into `transfers`.

- When every rule holds, all three changes must be **committed**: no transaction may be left
  open when your script ends.
- Any of the rules can fail: account 1 may hold less than 40 (the `CHECK` fails), the
  reference may already exist (the `PRIMARY KEY` fails), or either account may not exist (the
  `FOREIGN KEY` fails). Then your script stops with that error, the tests issue `ROLLBACK` just
  as an application would, and **nothing** may have changed in either table.

Example: with balances `1 → 100` and `2 → 20`, the script leaves `1 → 60`, `2 → 60` and one row
in `transfers`. With `1 → 30`, both tables end exactly as they started.

Hidden tests decide correctness.
'''
starter = '''
-- transfer: write your script below
-- Hint: three changes (debit, credit, record) that must succeed or fail together.
'''
tests = '''
SCHEMA = """
PRAGMA foreign_keys = ON;
CREATE TABLE accounts (
  id INTEGER PRIMARY KEY,
  owner TEXT NOT NULL,
  balance INTEGER NOT NULL CHECK (balance >= 0)
);
CREATE TABLE transfers (
  ref TEXT PRIMARY KEY,
  from_id INTEGER NOT NULL REFERENCES accounts (id),
  to_id INTEGER NOT NULL REFERENCES accounts (id),
  amount INTEGER NOT NULL CHECK (amount > 0)
);
"""


def snapshot(conn):
    accounts = conn.execute("SELECT id, owner, balance FROM accounts ORDER BY id").fetchall()
    transfers = conn.execute("SELECT * FROM transfers ORDER BY ref").fetchall()
    return accounts, transfers


class TransferTest(unittest.TestCase):
    def run_script(self, data):
        """Run the student's script on SCHEMA + data, rolling back on error like an app."""
        conn = connect(SCHEMA + data)
        before = snapshot(conn)
        failed = False
        try:
            conn.executescript(STUDENT_SQL)
        except sqlite3.Error:
            failed = True
            if conn.in_transaction:
                conn.execute("ROLLBACK")
        self.addCleanup(conn.close)
        return conn, before, failed

    def test_success_moves_money_and_records_it(self):
        conn, _, failed = self.run_script(
            "INSERT INTO accounts VALUES (1, 'Ana', 100), (2, 'Bo', 20), (3, 'Cy', 5);"
        )
        self.assertFalse(failed, "the script raised an error on valid data")
        accounts, transfers = snapshot(conn)
        self.assertEqual(accounts, [(1, "Ana", 60), (2, "Bo", 60), (3, "Cy", 5)])
        self.assertEqual(transfers, [("T-1001", 1, 2, 40)])

    def test_success_is_committed(self):
        conn, _, _ = self.run_script("INSERT INTO accounts VALUES (1, 'Ana', 100), (2, 'Bo', 20);")
        self.assertFalse(conn.in_transaction, "the transaction was left open: COMMIT it")
        self.assertEqual(snapshot(conn)[0], [(1, "Ana", 60), (2, "Bo", 60)])

    def test_exact_balance_is_allowed(self):
        conn, _, failed = self.run_script("INSERT INTO accounts VALUES (1, 'Ana', 40), (2, 'Bo', 0);")
        self.assertFalse(failed)
        self.assertEqual(snapshot(conn)[0], [(1, "Ana", 0), (2, "Bo", 40)])
        self.assertFalse(conn.in_transaction)

    def test_insufficient_funds_changes_nothing(self):
        conn, before, failed = self.run_script(
            "INSERT INTO accounts VALUES (1, 'Ana', 30), (2, 'Bo', 20);"
        )
        self.assertEqual(snapshot(conn), before)

    def test_duplicate_reference_changes_nothing(self):
        conn, before, failed = self.run_script(
            "INSERT INTO accounts VALUES (1, 'Ana', 100), (2, 'Bo', 20), (3, 'Cy', 70);"
            "INSERT INTO transfers VALUES ('T-1001', 3, 1, 10);"
        )
        self.assertTrue(failed, "a reused reference must make the script fail")
        self.assertEqual(snapshot(conn), before)

    def test_missing_destination_changes_nothing(self):
        conn, before, failed = self.run_script(
            "INSERT INTO accounts VALUES (1, 'Ana', 100), (3, 'Cy', 20);"
        )
        self.assertTrue(failed, "a missing account must make the script fail")
        self.assertEqual(snapshot(conn), before)

    def test_missing_source_changes_nothing(self):
        conn, before, failed = self.run_script(
            "INSERT INTO accounts VALUES (2, 'Bo', 20), (3, 'Cy', 100);"
        )
        self.assertTrue(failed, "a missing account must make the script fail")
        self.assertEqual(snapshot(conn), before)
'''

[unit.step.gabarito]
solution = '''
-- transfer: all three changes in one transaction
BEGIN;
UPDATE accounts SET balance = balance - 40 WHERE id = 1;
UPDATE accounts SET balance = balance + 40 WHERE id = 2;
INSERT INTO transfers (ref, from_id, to_id, amount) VALUES ('T-1001', 1, 2, 40);
COMMIT;
'''
time = "O(log n)"
space = "O(1)"
justification = '''
Each `UPDATE` finds its account through the `INTEGER PRIMARY KEY`, a B-tree seek of
**O(log n)** for **n** accounts. The `INSERT` seeks the `transfers` primary-key B-tree to check
the reference and place the row, and the two foreign keys are checked with one more primary-key
seek each into `accounts`. A constant number of seeks gives **O(log n)** time; the journal holds
only the handful of pages touched, so the extra space is **O(1)**.

Correctness comes from `BEGIN` ... `COMMIT`, not from the order of the statements. Without it,
each statement commits on its own: whichever of the debit or the insert runs first is already
permanent when the other one fails. Inside the transaction, a failing statement stops the
script before `COMMIT`, the earlier changes are still pending, and the `ROLLBACK` erases them.
'''

[[unit]]
id = "sql-udb2-indexes"
title = "Indexes and query plans"
level = "intermediate"
difficulty = 17
intro = '''
An index turns "read every row" into "jump straight to the right rows". You will ask SQLite how
it plans to run a query with `EXPLAIN QUERY PLAN`, watch a `SCAN` become a `SEARCH`, and learn
why the order of the columns in a composite index decides which queries it can serve. The
challenge is to index a table so that three real queries stop scanning and sorting.
'''
concepts = '''
## The idea

SQLite stores a table as a **B-tree** ordered by its `rowid` (the `INTEGER PRIMARY KEY`). Finding a row by id is a **seek**: a walk from the root to a leaf, **O(log n)**. Finding rows by any other column means reading the whole table and testing each row, a **full scan**, **O(n)**.

An **index** is a second B-tree holding the indexed column values, sorted, each paired with the rowid of its row. To answer `WHERE email = ?`, SQLite seeks the index to the first matching entry, reads the matches in order, and uses each rowid to fetch the row from the table. The price is paid on writes: every `INSERT`, `UPDATE` of an indexed column or `DELETE` must also update every index, and each index takes disk space.

## How SQL expresses it

```sql
CREATE INDEX users_email ON users (email);
EXPLAIN QUERY PLAN SELECT city FROM users WHERE email = 'bo@x.io';
-- SEARCH users USING INDEX users_email (email=?)
```

`EXPLAIN QUERY PLAN` shows the strategy without running the query. Read the `detail` column:

- `SCAN t`: every row of `t` is read.
- `SEARCH t USING INDEX i (col=?)`: a seek on index `i`, then a lookup of each row in the table.
- `SEARCH t USING COVERING INDEX i (...)`: the index alone holds every column the query needs, so the table is never touched.
- `USE TEMP B-TREE FOR ORDER BY`: the rows are sorted after being found, **O(k log k)** for k rows.

A **composite index** on `(a, b)` is sorted by `a`, then by `b` within equal `a`, like a phone book sorted by surname, then first name. It serves `WHERE a = ?`, `WHERE a = ? AND b > ?` and `WHERE a = ? ORDER BY b`. It cannot seek on `b` alone, just as the phone book cannot find everyone called "Ana". The rule: **equality columns first, then the range or sort column**.

`PRIMARY KEY` and `UNIQUE` constraints create indexes automatically (named `sqlite_autoindex_...`). PostgreSQL and MySQL spell the command `EXPLAIN` (PostgreSQL's `EXPLAIN ANALYZE` also runs the query and reports real timings), and their output looks different, but the ideas are the same.

## What is special or tricky

- An index on a column that is wrapped in a function (`WHERE lower(email) = ?`) cannot be used for the seek; unit 29 returns to this.
- Without statistics, SQLite guesses. Run `ANALYZE` on real data so the planner can choose between indexes.
- Indexing a column with few distinct values (a boolean, a status with three values) often helps little: each value still matches a large share of the table.
- Too many indexes slow every write. Index for the queries you actually run, and prefer one well-ordered composite index to several single-column ones.

## What you will practise

You will compare plans before and after an index, see which queries a composite index serves, and make an index covering. The challenge asks for at most two indexes that make three queries seek without a sort.
'''

[[unit.step]]
kind = "concept"
id = "sql-udb2-c1-plans"
title = "Reading a query plan"
points = 5
difficulty = 17
intro = '''
A B-tree of n entries has height about log n, so a seek touches a handful of pages even for
millions of rows, while a scan touches all of them. The planner's job is to pick, for each
table in a query, the cheapest of these access paths.
'''
body = '''
## Ask the planner

```sql
EXPLAIN QUERY PLAN
SELECT total FROM orders WHERE customer_id = 7 ORDER BY created_at;
```

Each result row describes one step; the `detail` column is what you read:

| `detail` | What SQLite does | Cost for k matches in n rows |
|---|---|---|
| `SCAN orders` | reads every row | O(n) |
| `SEARCH orders USING INDEX i (customer_id=?)` | seeks the index, then fetches each row | O(log n + k log n) |
| `SEARCH ... USING COVERING INDEX i (...)` | seeks the index, never reads the table | O(log n + k) |
| `SEARCH ... USING INTEGER PRIMARY KEY (rowid=?)` | seeks the table itself | O(log n) |
| `USE TEMP B-TREE FOR ORDER BY` | sorts the result | O(k log k) extra |

## Composite indexes

```sql
CREATE INDEX orders_cust_date ON orders (customer_id, created_at);
```

Entries are sorted by `customer_id`, then by `created_at`. All the orders of customer 7 sit
together, already in date order. So this index serves:

- `WHERE customer_id = 7`
- `WHERE customer_id = 7 AND created_at >= '2024-06-01'` (a range inside the group)
- `WHERE customer_id = 7 ORDER BY created_at` (no sort needed)

It cannot seek `WHERE created_at >= '2024-06-01'` alone: matching dates are scattered across
every customer's group. Put the columns compared with `=` first, then the one used for a range
or for sorting.
'''

[[unit.step]]
