entry = "account_statement"
run_command = "python3 -m unittest"
intro = '''
A statement is two window aggregates over the same partition and order: an unbounded
running sum and a three-row sliding average. Transactions can share a timestamp, so the
order needs a tie-breaker and the frame must be `ROWS`; the hidden tests contain such ties.
'''
instructions = '''
## Your turn

Write **ONE query** (a single statement).

```sql
CREATE TABLE transactions (
  id      INTEGER PRIMARY KEY,
  account TEXT NOT NULL,
  ts      TEXT NOT NULL,      -- 'YYYY-MM-DD HH:MM', sorts correctly as text
  amount  INTEGER NOT NULL    -- deposits are positive, withdrawals negative
);
```

Produce a statement with one row per transaction. Within each account, transactions happen
in order of `ts`, and transactions with the **same** `ts` happen in order of `id`.

- `balance`: the sum of the account's amounts up to and including this transaction (the
  account starts at 0). Two transactions with the same `ts` must get different balances.
- `avg3`: the average amount of this transaction and the **two before it** in the same
  account (fewer at the start), rounded with `ROUND(x, 2)`.

Columns, in this order: `account`, `id`, `ts`, `amount`, `balance`, `avg3`.
Order by `account`, then `ts`, then `id`.

## Example

Rows `(1, 'A', '2024-01-01 09:00', 100)`, `(2, 'A', '2024-01-03 09:00', -30)`,
`(3, 'B', '2024-01-02 09:00', 50)`, `(4, 'A', '2024-01-02 09:00', 20)` and
`(5, 'A', '2024-01-03 09:00', 10)`:

```
account|id|ts|amount|balance|avg3
A|1|2024-01-01 09:00|100|100|100.0
A|4|2024-01-02 09:00|20|120|60.0
A|2|2024-01-03 09:00|-30|90|30.0
A|5|2024-01-03 09:00|10|100|0.0
B|3|2024-01-02 09:00|50|50|50.0
```

Hidden tests decide correctness.
'''
starter = '''
-- account_statement: write your query below
-- Hint: SUM(...) OVER and AVG(...) OVER, both partitioned by account, ordered by
--       ts and id, each with an explicit ROWS BETWEEN ... AND CURRENT ROW frame.
'''
tests = '''
SCHEMA = """
CREATE TABLE transactions (
  id INTEGER PRIMARY KEY,
  account TEXT NOT NULL,
  ts TEXT NOT NULL,
  amount INTEGER NOT NULL
);
"""


def txs(*rows):
    if not rows:
        return SCHEMA
    values = ", ".join("(%d, '%s', '%s', %d)" % r for r in rows)
    return SCHEMA + "INSERT INTO transactions VALUES %s;" % values


EXAMPLE = txs(
    (1, "A", "2024-01-01 09:00", 100),
    (2, "A", "2024-01-03 09:00", -30),
    (3, "B", "2024-01-02 09:00", 50),
    (4, "A", "2024-01-02 09:00", 20),
    (5, "A", "2024-01-03 09:00", 10),
)


class AccountStatementTest(unittest.TestCase):
    def assertStatement(self, rows, expected):
        got = [r[:5] + (round(r[5], 2),) for r in rows]
        self.assertEqual(got, expected)

    def test_columns(self):
        cols, _ = query(EXAMPLE)
        self.assertEqual(cols, ["account", "id", "ts", "amount", "balance", "avg3"])

    def test_example(self):
