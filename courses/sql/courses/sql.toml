entry = "medal_table"
run_command = "python3 -m unittest"
intro = '''
A podium is top-N per group where ties change the answer: two athletes can share silver,
and then nobody gets bronze. Only one of the three ranking functions models that rule, and
the hidden tests use ties that make the other two give different rows.
'''
instructions = '''
## Your turn

Write **ONE query** (a single statement, which may start with `WITH`).

```sql
CREATE TABLE results (
  event   TEXT NOT NULL,
  athlete TEXT NOT NULL,
  score   REAL            -- higher is better; NULL = did not finish
);
```

Award medals in each event using the standard competition rules:

- Places are by `score`, highest first. Athletes with equal scores **share** a place, and
  the following places are **skipped**: scores 10, 9, 9, 8 give places 1, 2, 2, 4.
- An athlete gets a medal when their place is **3 or better**. So 10, 9, 9, 8 awards
  three medals (8 gets place 4), while 10, 9, 8, 8 awards four (both 8s share bronze).
- Athletes with a `NULL` score did not finish and never get a medal or a place.
- Each event is ranked independently.

Columns, in this order: `event`, `place`, `athlete`, `score`.
Order by `event`, then `place`, then `athlete`.

## Example

| event | athlete | score |
|---|---|---|
| jump | ana | 8.1 |
| jump | bo | 7.9 |
| jump | cy | 7.9 |
| jump | dee | 7.5 |
| sprint | eli | 9.8 |
| sprint | fay | NULL |

```
event|place|athlete|score
jump|1|ana|8.1
jump|2|bo|7.9
jump|2|cy|7.9
sprint|1|eli|9.8
```

Hidden tests decide correctness.
'''
starter = '''
-- medal_table: write your query below
-- Hint: rank inside each event in a CTE, then keep place <= 3 in the outer query.
--       Which ranking function skips places after a tie?
'''
tests = '''
SCHEMA = "CREATE TABLE results (event TEXT NOT NULL, athlete TEXT NOT NULL, score REAL);"


def results(*rows):
    if not rows:
        return SCHEMA
    values = ", ".join(
        "('%s', '%s', %s)" % (e, a, "NULL" if s is None else repr(s)) for e, a, s in rows
    )
    return SCHEMA + "INSERT INTO results VALUES %s;" % values


class MedalTableTest(unittest.TestCase):
    def test_columns(self):
        cols, _ = query(results(("jump", "ana", 8.0)))
        self.assertEqual(cols, ["event", "place", "athlete", "score"])

    def test_example(self):
        _, rows = query(results(
            ("jump", "ana", 8.1), ("jump", "bo", 7.9), ("jump", "cy", 7.9),
            ("jump", "dee", 7.5), ("sprint", "eli", 9.8), ("sprint", "fay", None),
        ))
        self.assertEqual(rows, [
            ("jump", 1, "ana", 8.1), ("jump", 2, "bo", 7.9), ("jump", 2, "cy", 7.9),
            ("sprint", 1, "eli", 9.8),
        ])

    def test_tie_on_bronze_awards_four_medals(self):
        _, rows = query(results(
            ("swim", "a", 10.0), ("swim", "b", 9.0), ("swim", "c", 8.0), ("swim", "d", 8.0),
            ("swim", "e", 7.0),
        ))
        self.assertEqual(rows, [
            ("swim", 1, "a", 10.0), ("swim", 2, "b", 9.0),
            ("swim", 3, "c", 8.0), ("swim", 3, "d", 8.0),
        ])

    def test_tie_on_gold_skips_silver(self):
        _, rows = query(results(
            ("row", "p", 10.0), ("row", "q", 10.0), ("row", "r", 9.0), ("row", "s", 8.0),
            ("row", "t", 7.0),
        ))
        self.assertEqual(rows, [
            ("row", 1, "p", 10.0), ("row", 1, "q", 10.0), ("row", 3, "r", 9.0),
        ])

    def test_three_way_tie_for_gold(self):
        _, rows = query(results(
            ("bike", "z", 5.0), ("bike", "y", 5.0), ("bike", "x", 5.0), ("bike", "w", 4.0),
        ))
        self.assertEqual(rows, [
            ("bike", 1, "x", 5.0), ("bike", 1, "y", 5.0), ("bike", 1, "z", 5.0),
        ])

    def test_did_not_finish_never_medals(self):
        _, rows = query(results(
            ("ski", "a", 3.0), ("ski", "b", None), ("ski", "c", 2.0), ("ski", "d", None),
        ))
        self.assertEqual(rows, [("ski", 1, "a", 3.0), ("ski", 2, "c", 2.0)])
        _, rows = query(results(("ski", "a", None), ("ski", "b", None)))
        self.assertEqual(rows, [])

    def test_events_are_ranked_independently(self):
        _, rows = query(results(
            ("b", "low1", 1.0), ("a", "hi1", 100.0), ("b", "low2", 2.0),
            ("a", "hi2", 90.0), ("a", "hi3", 80.0), ("a", "hi4", 70.0), ("c", "solo", 0.5),
        ))
        self.assertEqual(rows, [
            ("a", 1, "hi1", 100.0), ("a", 2, "hi2", 90.0), ("a", 3, "hi3", 80.0),
            ("b", 1, "low2", 2.0), ("b", 2, "low1", 1.0), ("c", 1, "solo", 0.5),
        ])

    def test_empty_table(self):
        _, rows = query(SCHEMA)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
WITH placed AS (
  SELECT event, athlete, score,
         RANK() OVER (PARTITION BY event ORDER BY score DESC) AS place
  FROM results
  WHERE score IS NOT NULL
)
SELECT event, place, athlete, score
FROM placed
WHERE place <= 3
ORDER BY event, place, athlete;
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
SQLite first applies `WHERE score IS NOT NULL` while scanning the **n** results, then sorts
the survivors by `(event, score DESC)` for the window: **O(n log n)**. It walks the sorted
rows once, keeping a counter that restarts at each new event and only advances `RANK` when
the score changes, so the ranking itself is **O(n)**. The outer filter `place <= 3` streams
over the ranked rows, and the final `ORDER BY event, place, athlete` is one more sort of at
most n rows. The sorter holds up to n rows: **O(n)** space.

The choice of function is the whole problem. `ROW_NUMBER` hands out exactly three medals
and arbitrarily drops one of two tied bronze athletes; `DENSE_RANK` turns 10, 10, 9, 8 into
places 1, 1, 2, 3 and wrongly gives 8 a bronze. Filtering NULLs in `WHERE` matters too:
`ORDER BY score DESC` puts NULLs last but still ranks them, so a two-finisher event would
award bronze to someone who did not finish.
'''

[[unit]]
id = "sql-u19-window-aggregates"
title = "Window functions: running totals, frames, LAG and LEAD"
level = "advanced"
difficulty = 25
intro = '''
Bank balances, moving averages and day-over-day changes all look at "the rows so far" or
"the row before". Aggregates such as `SUM` and `AVG` become window functions with `OVER`,
and a **frame** says exactly which rows each one sees. You will build a running total, a
moving average and a change column, and then produce an account statement whose tied
timestamps punish a vague frame.
'''
concepts = '''
## The idea

A ranking looks at where a row sits in its partition. Many reports need something else: a
value computed from the rows **around** the current one. The balance after each transaction
is the sum of every transaction so far; a three-day moving average is the mean of today and
the two days before; a growth column compares a row with the previous one.

Every aggregate you already know (`SUM`, `AVG`, `COUNT`, `MIN`, `MAX`) can be used as a
window function, and two navigation functions read neighbouring rows directly: `LAG` (an
earlier row) and `LEAD` (a later one).

## How SQL expresses it

```sql
SUM(amount) OVER (
  PARTITION BY account
  ORDER BY ts, id
  ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
)
```

The last line is the **frame**: which rows of the partition, relative to the current one,
the aggregate sees. Common frames:

- `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`: from the first row up to this one, a
  running total.
- `ROWS BETWEEN 2 PRECEDING AND CURRENT ROW`: this row and the two before, a moving window
  of three rows (fewer at the start).
- `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING`: the whole partition.

`ROWS` counts physical rows. `RANGE` works on **values** of the `ORDER BY` key: all rows
with the same key (**peers**) are inside or outside together. `GROUPS` (SQLite 3.28+,
PostgreSQL 11+, not MySQL) counts groups of peers.

`LAG(x)` returns `x` from the previous row of the partition, `LAG(x, 2)` from two rows back,
and `LAG(x, 1, 0)` returns 0 instead of NULL when there is no such row. `LEAD` mirrors it.

## How SQLite runs it

SQLite sorts the rows by partition and order keys, then slides the frame along them. For
`SUM`, `COUNT` and `AVG` it adds the row entering the frame and removes the one leaving it,
so a running total or a moving window is linear after the sort.

## What is special or tricky

- With an `ORDER BY` and no frame, the default is `RANGE BETWEEN UNBOUNDED PRECEDING AND
  CURRENT ROW`. Rows that tie on the order key are peers, so they all get the **same**
  running total, the one after the last of them. Write the frame explicitly.
- Running totals need a **unique** order. Ordering by a timestamp alone leaves ties in an
  unspecified order; add a tie-breaker such as the id.
- Without `ORDER BY` in `OVER`, the frame is the whole partition: every row gets the grand
  total.
- `LAST_VALUE(x) OVER (ORDER BY ...)` with the default frame returns the current row, not
  the last one, because the frame ends at the current row.

## What you will practise

You will compare the default frame with an explicit `ROWS` frame on tied dates, compute a
moving average with a named window, and use `LAG` and `LEAD`. The challenge is a per-account
statement with a running balance and a three-transaction average.
'''

[[unit.step]]
kind = "concept"
id = "sql-u19-c1-frames"
title = "Frames: which rows each row sees"
points = 5
difficulty = 25
intro = '''
A window aggregate is a sliding computation over a sorted partition. With an explicit
frame the engine can update it incrementally (add the entering row, subtract the leaving
one), so a running total costs one sort plus a linear pass instead of a sum per row.
'''
body = '''
## Anatomy of a window aggregate

```sql
AVG(price) OVER (
  PARTITION BY product                       -- independent series
  ORDER BY day, id                           -- a unique order: day, then id
  ROWS BETWEEN 6 PRECEDING AND CURRENT ROW   -- this row and the 6 before it
)
```

Read it from the inside out: split the rows by product, sort each product's rows by day,
and for every row average the price of that row and up to six earlier ones.

## The default frame trap

If you write only `SUM(amount) OVER (ORDER BY day)`, SQL fills in
`RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`. `RANGE` treats rows with the same `day`
as one block, so two payments on the same day both show the total **after** both of them:

| day | amount | `RANGE` (default) | `ROWS` |
|---|---|---|---|
| 1 | 10 | 10 | 10 |
| 2 | 20 | 35 | 30 |
| 2 | 5 | 35 | 35 |

A bank statement wants the `ROWS` column, and that also needs a tie-breaker in `ORDER BY`
(`day, id`) so that the order of the two day-2 rows is defined.

## Looking at neighbours

```sql
SELECT day, n,
       n - LAG(n) OVER (ORDER BY day) AS change,
       LEAD(n, 1, 0) OVER (ORDER BY day) AS next_day
FROM visits;
```

`LAG` and `LEAD` ignore the frame; they count rows from the current one within the
partition. The first row has no previous row, so `LAG` gives NULL unless you pass a default.
'''

[[unit.step]]
kind = "drill"
id = "sql-u19-d1-running-total"
title = "Running total: RANGE versus ROWS"
points = 10
difficulty = 25
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
The same `SUM` with two frames. `RANGE` groups peers, rows with equal sort keys, and treats
them as one step; `ROWS` advances one physical row at a time. Both are a single sorted
pass, but only `ROWS` with a unique order produces one distinct balance per row.
'''
prompt = '''
Store four payments with two on the same day, and compute the running total twice: with
the default frame ordered by day, and with an explicit `ROWS` frame ordered by day and id.
'''
target = '''
CREATE TABLE payments (id INTEGER PRIMARY KEY, day INTEGER, amount INTEGER);
INSERT INTO payments VALUES
  (1, 1, 10), (2, 2, 20), (3, 2, 5), (4, 3, 40);
SELECT id, day, amount,
       SUM(amount) OVER (ORDER BY day) AS by_range,
       SUM(amount) OVER (
         ORDER BY day, id
         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
       ) AS by_rows
FROM payments
ORDER BY day, id;
'''
line_comments = [
  "One row per payment.",
  "Starts a multi-row INSERT.",
  "Payments 2 and 3 happen on the same day.",
  "Keeps every payment row.",
  "Default frame: RANGE up to the current row, so same-day rows are peers.",
  "A second window aggregate, with everything spelled out:",
  "a unique order, the id breaking ties within a day,",
  "and a ROWS frame from the first row to the current one.",
  "Closes the OVER clause and names the column.",
  "Reads the table.",
  "Outputs in the same order as the window, so the totals read top to bottom.",
]
explanation = '''
It printed:

```
id|day|amount|by_range|by_rows
1|1|10|10|10
2|2|20|35|30
3|2|5|35|35
4|3|40|75|75
```

On day 2, `by_range` shows 35 twice: both payments are peers, so both see the sum up to the
end of day 2. `by_rows` shows the balance after each payment, 30 and then 35. The two
columns agree again as soon as the tie is over.
'''

