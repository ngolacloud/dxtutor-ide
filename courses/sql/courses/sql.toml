        conn.execute("INSERT INTO customers VALUES (4, 'Di')")
        conn.execute("INSERT INTO orders VALUES (5, 4, 'paid', 12), (6, 2, 'paid', 3)")
        conn.execute("UPDATE orders SET status = 'paid' WHERE id = 3")
        self.assertEqual(self.read(conn), [(1, "Ana", 3, 100), (2, "Bo", 1, 3),
                                           (3, "Cy", 0, 0), (4, "Di", 1, 12)])

    def test_no_orders_at_all(self):
        conn = self.open(SCHEMA + "INSERT INTO customers VALUES (5, 'Eve'), (6, 'Fay');")
        self.assertEqual(self.read(conn), [(5, "Eve", 0, 0), (6, "Fay", 0, 0)])

    def test_empty_schema(self):
        self.assertEqual(self.read(self.open(SCHEMA)), [])

    def test_composes_with_other_queries(self):
        conn = self.open(EXAMPLE)
        rows = conn.execute(
            "SELECT name FROM customer_revenue WHERE revenue = 0 ORDER BY name").fetchall()
        self.assertEqual(rows, [("Bo",), ("Cy",)])

    def test_data_is_untouched(self):
        conn = self.open(EXAMPLE)
