[[unit.step]]
kind = "challenge"
id = "sql-udb6-x1-sync-products"
title = "Write the sync_products script"
points = 30
difficulty = 21
entry = "sync_products"
intro = '''
An import job copies a supplier's feed into the catalogue every hour, and sometimes runs twice
or out of order. The merge must be idempotent, keep each product's identity and stock, and never
let older data overwrite newer. The hidden tests run your script once, twice, and on several feeds.
'''
instructions = '''
## Your turn

Write a **script** that merges the staging table `incoming` into `products`:

```sql
CREATE TABLE products (
  id INTEGER PRIMARY KEY,
  sku TEXT NOT NULL UNIQUE,
  name TEXT NOT NULL,
  price INTEGER NOT NULL,
  stock INTEGER NOT NULL DEFAULT 0,
  updated_at TEXT NOT NULL
);
CREATE TABLE incoming (
  sku TEXT NOT NULL,
  name TEXT NOT NULL,
  price INTEGER NOT NULL,
  updated_at TEXT NOT NULL
);
```

Rules:

- A `sku` that is not in `products` yet is **inserted** with its `name`, `price` and
  `updated_at` (its `id` is assigned automatically and its `stock` is 0).
- A `sku` that already exists is **updated** (`name`, `price`, `updated_at`) only when the
  incoming `updated_at` is **strictly newer** than the stored one. Otherwise it is left alone.
- `id` and `stock` of existing products never change, and products missing from `incoming` stay
  as they are. Leave `incoming` itself unchanged.
- `incoming` may list the same `sku` more than once: the newest row wins.
- Running the script a second time must change nothing.

Example: `products` holds `(1, 'PEN', 'Pen', 120, 40, '2024-06-01')`, and `incoming` holds
`('PEN', 'Blue pen', 150, '2024-06-03')`, `('INK', 'Ink', 300, '2024-06-02')` and
`('PEN', 'Old pen', 99, '2024-05-20')`. Afterwards:

```
id|sku|name|price|stock|updated_at
1|PEN|Blue pen|150|40|2024-06-03
2|INK|Ink|300|0|2024-06-02
```

Hidden tests decide correctness.
'''
starter = '''
-- sync_products: write your script below
-- Hint: INSERT ... SELECT ... WHERE true ON CONFLICT (sku) DO UPDATE ... WHERE <newer>
'''
tests = '''
SCHEMA = """
CREATE TABLE products (
  id INTEGER PRIMARY KEY,
  sku TEXT NOT NULL UNIQUE,
  name TEXT NOT NULL,
  price INTEGER NOT NULL,
  stock INTEGER NOT NULL DEFAULT 0,
  updated_at TEXT NOT NULL
);
CREATE TABLE incoming (
  sku TEXT NOT NULL,
  name TEXT NOT NULL,
  price INTEGER NOT NULL,
  updated_at TEXT NOT NULL
);
"""

EXAMPLE = SCHEMA + """
INSERT INTO products VALUES (1, 'PEN', 'Pen', 120, 40, '2024-06-01');
INSERT INTO incoming VALUES ('PEN', 'Blue pen', 150, '2024-06-03'),
                            ('INK', 'Ink', 300, '2024-06-02'),
                            ('PEN', 'Old pen', 99, '2024-05-20');
"""


def products(conn):
    return conn.execute("SELECT * FROM products ORDER BY id").fetchall()


class SyncProductsTest(unittest.TestCase):
    def run_sync(self, setup):
        conn = script(setup)
        self.addCleanup(conn.close)
        return conn

    def test_example(self):
        conn = self.run_sync(EXAMPLE)
        self.assertEqual(products(conn), [(1, "PEN", "Blue pen", 150, 40, "2024-06-03"),
                                          (2, "INK", "Ink", 300, 0, "2024-06-02")])

    def test_running_twice_changes_nothing(self):
        conn = self.run_sync(EXAMPLE)
        once = products(conn)
        conn.executescript(STUDENT_SQL)
        self.assertEqual(products(conn), once)

    def test_stale_and_equal_rows_are_ignored(self):
        conn = self.run_sync(SCHEMA + """
            INSERT INTO products VALUES (7, 'MUG', 'Mug', 800, 3, '2024-06-10'),
                                        (9, 'CAP', 'Cap', 500, 8, '2024-06-10');
            INSERT INTO incoming VALUES ('MUG', 'Old mug', 700, '2024-06-09'),
                                        ('CAP', 'Same day cap', 450, '2024-06-10');
        """)
        self.assertEqual(products(conn), [(7, "MUG", "Mug", 800, 3, "2024-06-10"),
                                          (9, "CAP", "Cap", 500, 8, "2024-06-10")])

    def test_update_keeps_id_and_stock(self):
        conn = self.run_sync(SCHEMA + """
            INSERT INTO products VALUES (5, 'BAG', 'Bag', 1000, 12, '2024-01-01'),
                                        (6, 'BOX', 'Box', 200, 0, '2024-01-01');
            INSERT INTO incoming VALUES ('BAG', 'Big bag', 1200, '2024-02-01');
        """)
        self.assertEqual(products(conn), [(5, "BAG", "Big bag", 1200, 12, "2024-02-01"),
                                          (6, "BOX", "Box", 200, 0, "2024-01-01")])

    def test_duplicates_newest_wins_in_any_order(self):
        for rows in (
            "('NEW', 'v1', 1, '2024-03-01'), ('NEW', 'v3', 3, '2024-03-03'), "
            "('NEW', 'v2', 2, '2024-03-02')",
            "('NEW', 'v3', 3, '2024-03-03'), ('NEW', 'v1', 1, '2024-03-01')",
        ):
            conn = self.run_sync(SCHEMA + "INSERT INTO incoming VALUES " + rows + ";")
            self.assertEqual(products(conn), [(1, "NEW", "v3", 3, 0, "2024-03-03")])

    def test_empty_incoming_changes_nothing(self):
        conn = self.run_sync(SCHEMA + "INSERT INTO products VALUES "
                             "(3, 'PEN', 'Pen', 120, 40, '2024-06-01');")
        self.assertEqual(products(conn), [(3, "PEN", "Pen", 120, 40, "2024-06-01")])

    def test_incoming_is_left_unchanged(self):
        conn = self.run_sync(EXAMPLE)
        self.assertEqual(conn.execute("SELECT COUNT(*) FROM incoming").fetchone(), (3,))
'''

