  "The plan of the rewritten query.",
  "Selects the same columns...",
  "...with a half-open range on the bare column: on or after the 15th, before the 16th.",
  "",
  "Now runs the rewritten query for real.",
  "The same range.",
  "Sorted by id for a deterministic result.",
]
explanation = '''
