[[unit.step]]
kind = "drill"
id = "sql-u07-d3-group-expression"
title = "Group by an expression"
points = 10
difficulty = 7
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
The grouping key does not have to be a stored column. Any expression computed per row works,
and the engine evaluates it once per row before sorting by it, so bucketing costs no more than
grouping by a column, although no ordinary index on `price` can deliver the rows in band order.
'''
prompt = '''
Sort products into three price bands with a `CASE` expression and report, per band, how many
products it holds and its cheapest price, cheapest band first.

**Why:** reports often group by a derived value (a band, a month, a first letter), not by a
column that already exists.
'''
target = '''
CREATE TABLE products (name TEXT, price REAL);
INSERT INTO products VALUES
  ('pen', 1.5), ('notebook', 4.0), ('stapler', 6.5),
  ('mug', 8.0), ('lamp', 25.0), ('chair', 120.0),
  ('desk', 300.0);

SELECT CASE
         WHEN price < 5 THEN 'budget'
         WHEN price < 100 THEN 'standard'
         ELSE 'premium'
       END AS band,
