id = "sql-basics"
language = "sql"
title = "SQL: From Zero to Confident"
level = "beginner"
summary = "A serious, guided course in SQL that takes you from your very first SELECT to the queries data engineers and backend developers write every day: joins, subqueries, transactions, indexes, CTEs and window functions. You read a short concept, build muscle memory by typing small, complete scripts, then prove what you learned by writing real queries that hidden tests check."
overview = '''
## What SQL is

A **relational database** stores data in tables: named columns, and one row per item. **SQL**
is the language for defining those tables, changing their rows and, above all, asking
questions about them. It is **declarative**: you describe the result you want, and the
database engine decides how to compute it.

SQL is everywhere data is kept. Practically every backend keeps its users and orders in a
relational database such as PostgreSQL, MySQL or SQLite. Analysts query data
warehouses with SQL, and data engineers use it to clean, transform and load data between
systems. SQLite itself is built into phones, browsers and many desktop applications.

## Why SQLite

This course runs on **SQLite**, a complete database that lives in a single file or in
memory, with no server to install. Every exercise starts from a fresh database,
so experiment freely. The core of SQL (`SELECT`, joins, grouping, subqueries,
transactions, CTEs, window functions) works the same way in PostgreSQL and MySQL, and the
units point out where they differ, so what you learn here carries over.

## The mental model

You will learn to think in **sets of rows** rather than loops: a query takes whole tables,
filters, combines and summarises them, and returns a new set. You state *what* you want; the
engine chooses a **query plan**, deciding whether to scan a table, use an **index**, sort or
join. You will learn to read those plans and to estimate their cost in rows touched.

## How the course is organised

- **Basic**: `SELECT`, tables and types, filtering, sorting, functions, `CASE` and
  aggregates.
- **Intermediate**: `GROUP BY`, joins and outer joins, subqueries, set operations, changing
  data, constraints, schema design, `NULL` logic, then database engineering: transactions,
  indexes and query plans, the N+1 problem, pagination, views and upserts.
- **Advanced**: CTEs and recursive CTEs, window functions, JSON, dates, triggers, query
  optimisation, hierarchies, gaps and islands, pivoting, data cleaning and an analytics
  case study.

## How the steps work

Each unit opens with a **concept** to read. **Drills** follow: you type a short, complete
script line by line, guided by a note on every line, and the tutor runs it and shows you the
output. Each unit ends with a **challenge**: you write your own SQL, and hidden tests run it
against several different databases, including empty tables, ties and `NULL`s, before
revealing a reference solution with its cost explained.
'''

# ── g1-basic ────────────────────────────────────────────────────────────

[[unit]]
id = "sql-u01-hello"
title = "Hello, SQL"
level = "basic"
difficulty = 1
intro = '''
Your very first steps in SQL: what a database and a query are, and how SQLite runs a script
of statements from top to bottom. You will ask SQLite to calculate values, give the columns
of each answer a name with `AS`, and write comments. By the end you will write a query that
hidden tests run against their own data.
'''
concepts = '''
## The idea

A **database** is a program that stores data safely and answers questions about it. A
**relational** database keeps its data in **tables**: grids with named **columns** across
the top and one **row** for each item, a little like a spreadsheet. **SQL** (Structured
Query Language, often pronounced "sequel") is the language you use to ask those questions.

SQL is **declarative**. You do not tell the database *how* to find an answer step by step;
you describe *what* answer you want, and the database engine works out a plan to produce
it. That division of labour is the heart of SQL, and it is why one short query can replace
pages of loops in other languages.

Every answer SQL gives back has the shape of a table too: a list of column names and zero or
more rows of values. This is called a **result set**, and it holds even for the smallest
question.

## How SQL does it

The statement that asks a question is `SELECT`. After the word `SELECT` you list the values
you want, separated by commas, and you end the statement with a semicolon.

```sql
SELECT 'Hello';
SELECT 2 + 3 AS answer, 'blue' AS colour;
```

The first statement returns one row with one column. The second returns one row with two
columns, named `answer` and `colour` thanks to `AS`. Without `AS`, a column is named after
the text of its expression, such as `2 + 3`.

- Text goes between **single quotes**: `'blue'`. A quote inside text is written twice:
  `'It''s'`.
- Numbers are written plainly: `42` is an **integer** (a whole number) and `4.2` is a
  **real** (a number with a fractional part).
- `NULL` means "no value" or "unknown". It is not zero and not empty text.
- `--` starts a comment that runs to the end of the line; `/* ... */` can span lines.

A `.sql` file is a **script**: a sequence of statements, each ended by `;`. The engine runs
them one at a time, from the top, and stops at the first error. In this course the engine is
**SQLite**, a complete database that lives in a single file, or, for exercises, in memory.

## What is special or tricky

- **Keywords ignore case; text does not.** `select` and `SELECT` mean the same, but `'Ana'`
  and `'ana'` are different values. This course writes keywords in capitals so they stand
  out.
- **Single quotes are for text, double quotes are for names** of tables and columns. For
  historical reasons SQLite may accept `"hello"` as text when no column has that name; other
  databases reject it. Always write text as `'hello'`.
- **Integer division drops the fraction.** `7 / 2` is `3`, because both sides are integers.
  Write `7 / 2.0` to get `3.5`. PostgreSQL behaves the same way; MySQL returns `3.5000`.
- **Text joins with `||`, not `+`.** `'Good ' || 'day'` gives `'Good day'`. MySQL uses
  `CONCAT(...)` instead.
- **Anything combined with NULL is NULL.** `1 + NULL` is `NULL`: if one input is unknown,
  the result is unknown too.

## What you will practise

You will type a first script with comments, compute arithmetic and text expressions, and
inspect the type of values with `typeof`. In the challenge you take a small step ahead: you
read the values of a tiny table and turn each row into a receipt line.
'''

[[unit.step]]
kind = "concept"
id = "sql-u01-c1-statements"
title = "What a SQL script is"
points = 5
difficulty = 1
intro = '''
Before you type anything, picture what happens when a script runs. The engine reads the
text, cuts it into statements at each `;`, and for each one parses it, plans it and executes
it. Every `SELECT` produces a result set, a small table that the tutor prints for you.
'''
body = '''
## One statement, one result set

A SQL script is a plain text file, usually ending in `.sql`. Here is a complete one:

```sql
-- A greeting, then a small calculation.
SELECT 'Hello, SQL!' AS greeting;
SELECT 6 * 7 AS answer;
```

SQLite finds the first complete statement (everything up to its `;`), runs it, shows its
result, and moves on to the next. The output looks like this:

```text
greeting
Hello, SQL!
answer
42
```

Each result starts with a **header line** holding the column names, followed by one line
per row. When a result has several columns, the names and the values are separated by `|`,
and a missing value is shown as `NULL`. This is how the `sqlite3` command-line tool prints
results when headers are turned on.

Things to notice:

- **`SELECT`** asks for values; **commas** separate the columns of the answer.
- **`AS greeting`** names a column. Good names are short, lowercase, with `_` between words.
- **`;`** ends a statement. If the last statement has no `;`, the run reports an incomplete
  statement.
- **An error stops the script.** SQLite reports the line where the failing statement starts
  and runs nothing after it.

## What the tutor does

In each drill you type a complete script. Once it matches, the tutor runs it on a brand-new,
empty database held in memory, so you see exactly what it prints. In each challenge you
write SQL of your own, and hidden tests run it against several different databases and
compare the answers.
'''

