[[unit.step]]
kind = "challenge"
id = "sql-u12-x1-apply-delivery"
title = "Apply a delivery"
points = 30
difficulty = 12
entry = "apply_delivery"
run_command = "python3 -m unittest"
intro = '''
A real maintenance script: several writes whose order matters. Each statement sees the
effects of the previous one, so restocking before retiring changes which rows are retired.
The hidden tests run your script against several data sets and inspect every table after it.
'''
instructions = '''
## Your turn: write a script

Write a **script** (several statements) that applies today's delivery to the shop's stock and
retires sold-out discontinued products. These tables already exist:

```sql
CREATE TABLE products (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  stock INTEGER NOT NULL,
  discontinued INTEGER NOT NULL DEFAULT 0   -- 1 = no longer sold
);
CREATE TABLE deliveries (product_id INTEGER, qty INTEGER);
CREATE TABLE retired (id INTEGER PRIMARY KEY, name TEXT NOT NULL, retired_on TEXT NOT NULL);
```

Do this, in this order:

1. **Restock.** Add every delivered quantity to its product's `stock`. A product can appear
   in several `deliveries` rows: add them all. Products with no delivery keep their stock.
   Deliveries for a `product_id` that is not in `products` are ignored.
2. **Retire.** Every product with `discontinued = 1` and `stock = 0` *after the restock* is
   copied into `retired` (same `id` and `name`, `retired_on = '2026-11-23'`) and then deleted
   from `products`. Rows already in `retired` stay.
3. **Clear.** Empty `deliveries`.

Don't create or drop tables, and don't change any other row.

Example. Before:

```text
products:   (1, 'bolt', 5, 0)  (2, 'nut', 0, 1)  (3, 'washer', 0, 1)  (4, 'gear', 0, 0)
deliveries: (1, 10)  (1, 5)  (3, 4)
```

After:

```text
products:   (1, 'bolt', 20, 0)  (3, 'washer', 4, 1)  (4, 'gear', 0, 0)
retired:    (2, 'nut', '2026-11-23')
deliveries: empty
```

The washer survives because its delivery arrived first; the gear is sold out but still sold.
Hidden tests decide correctness.
'''
starter = '''
-- apply_delivery: write your script below (restock, then retire, then clear).
-- Hint: an UPDATE must skip products with no delivery, or their stock becomes NULL.
'''
tests = '''
SCHEMA = """
CREATE TABLE products (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  stock INTEGER NOT NULL,
  discontinued INTEGER NOT NULL DEFAULT 0
);
CREATE TABLE deliveries (product_id INTEGER, qty INTEGER);
CREATE TABLE retired (id INTEGER PRIMARY KEY, name TEXT NOT NULL, retired_on TEXT NOT NULL);
"""

EXAMPLE = SCHEMA + """
INSERT INTO products VALUES (1, 'bolt', 5, 0), (2, 'nut', 0, 1), (3, 'washer', 0, 1), (4, 'gear', 0, 0);
INSERT INTO deliveries VALUES (1, 10), (1, 5), (3, 4);
"""


def run(setup):
    conn = script(setup)
    products = conn.execute(
        "SELECT id, name, stock, discontinued FROM products ORDER BY id").fetchall()
    retired = conn.execute("SELECT id, name, retired_on FROM retired ORDER BY id").fetchall()
    pending = conn.execute("SELECT count(*) FROM deliveries").fetchone()[0]
    conn.close()
    return products, retired, pending


class ApplyDeliveryTest(unittest.TestCase):
    def test_example(self):
        products, retired, pending = run(EXAMPLE)
        self.assertEqual(products, [(1, "bolt", 20, 0), (3, "washer", 4, 1), (4, "gear", 0, 0)])
        self.assertEqual(retired, [(2, "nut", "2026-11-23")])
        self.assertEqual(pending, 0)

    def test_several_deliveries_are_summed(self):
        products, retired, _ = run(SCHEMA + """
            INSERT INTO products VALUES (7, 'cog', 1, 0), (8, 'pin', 2, 0);
            INSERT INTO deliveries VALUES (7, 2), (8, 1), (7, 3), (7, 4);
        """)
        self.assertEqual(products, [(7, "cog", 10, 0), (8, "pin", 3, 0)])
        self.assertEqual(retired, [])

    def test_products_without_delivery_keep_their_stock(self):
        products, retired, _ = run(SCHEMA + """
            INSERT INTO products VALUES (1, 'a', 3, 0), (2, 'b', 8, 1), (3, 'c', 0, 0);
            INSERT INTO deliveries VALUES (1, 1);
        """)
        self.assertEqual(products, [(1, "a", 4, 0), (2, "b", 8, 1), (3, "c", 0, 0)])
        self.assertEqual(retired, [])

    def test_unknown_product_is_ignored(self):
        products, retired, pending = run(SCHEMA + """
            INSERT INTO products VALUES (1, 'a', 2, 0);
            INSERT INTO deliveries VALUES (99, 5), (1, 1);
        """)
        self.assertEqual(products, [(1, "a", 3, 0)])
        self.assertEqual(retired, [])
        self.assertEqual(pending, 0)

    def test_restock_happens_before_retiring(self):
        products, retired, _ = run(SCHEMA + """
            INSERT INTO products VALUES (1, 'old', 0, 1), (2, 'older', 0, 1), (3, 'kept', 0, 0);
            INSERT INTO deliveries VALUES (1, 6);
        """)
        self.assertEqual(products, [(1, "old", 6, 1), (3, "kept", 0, 0)])
        self.assertEqual(retired, [(2, "older", "2026-11-23")])

    def test_no_deliveries_still_retires(self):
        products, retired, pending = run(SCHEMA + """
            INSERT INTO products VALUES (1, 'a', 0, 1), (2, 'b', 0, 0), (3, 'c', 5, 1);
        """)
        self.assertEqual(products, [(2, "b", 0, 0), (3, "c", 5, 1)])
        self.assertEqual(retired, [(1, "a", "2026-11-23")])
        self.assertEqual(pending, 0)

    def test_earlier_retirements_are_kept(self):
        products, retired, _ = run(SCHEMA + """
            INSERT INTO retired VALUES (50, 'ancient', '2020-01-01');
            INSERT INTO products VALUES (5, 'x', 0, 1), (6, 'y', 1, 1);
            INSERT INTO deliveries VALUES (6, 2);
        """)
        self.assertEqual(products, [(6, "y", 3, 1)])
        self.assertEqual(retired, [(5, "x", "2026-11-23"), (50, "ancient", "2020-01-01")])
'''

[unit.step.gabarito]
solution = '''
-- 1. Restock: total each product's deliveries, then add them in one pass.
UPDATE products
SET stock = stock + d.qty
FROM (SELECT product_id, SUM(qty) AS qty FROM deliveries GROUP BY product_id) AS d
WHERE d.product_id = products.id;

-- 2. Retire: copy first, then delete exactly the same rows.
INSERT INTO retired (id, name, retired_on)
SELECT id, name, '2026-11-23' FROM products
WHERE discontinued = 1 AND stock = 0;

DELETE FROM products WHERE discontinued = 1 AND stock = 0;

-- 3. Clear the processed deliveries.
DELETE FROM deliveries;
'''
time = "O(n + m log m)"
space = "O(m)"
justification = '''
With **n** products and **m** delivery rows:

- **Restock.** SQLite materializes the derived table `d`: one scan of `deliveries` and a
  temporary B-tree for the `GROUP BY`, **O(m log m)**. It then scans `d` and finds each
  product with a seek on the `INTEGER PRIMARY KEY`, **O(log n)** per group. Unknown product
  ids find nothing and are skipped, and products without deliveries are never visited, so no
  stock can become `NULL`. Summing first means each product is written once, however many
  deliveries it had.
- **Retire.** The `INSERT … SELECT` and the `DELETE` each scan `products` once, **O(n)**, since
  there is no index on `(discontinued, stock)`. Both use the same condition, and nothing
  changes stock in between, so they touch exactly the same rows.
- **Clear.** A `DELETE` without `WHERE` uses SQLite's truncate optimization: it drops the
  table's pages instead of deleting row by row.

Total **O(n + m log m)** (the seeks add **O(m log n)**, small next to the scan in practice).
The only extra memory is the grouped deliveries, **O(m)**. A correlated version,
`SET stock = stock + (SELECT SUM(qty) …) WHERE id IN (SELECT product_id FROM deliveries)`, is
also correct, but without an index on `deliveries.product_id` it rescans `deliveries` for
every restocked product: **O(m²)** in the worst case.
'''

[[unit]]
id = "sql-u13-constraints"
title = "Constraints: letting the database say no"
level = "intermediate"
difficulty = 13
intro = '''
A constraint is a rule the database checks on every write, so bad data is refused at the
door instead of cleaned up later. You will use `PRIMARY KEY`, `NOT NULL`, `UNIQUE`, `CHECK`
and `FOREIGN KEY`, switch foreign keys on in SQLite, and choose what deleting a parent row
does to its children.
'''
concepts = '''
## The idea

A constraint is a rule about the data that the database itself enforces on every write. Your
application may check that an email is present before inserting a user, but so must every
other program, script and person with a SQL prompt. A constraint checks once, in one place,
for all of them, and a write that breaks it fails with an error instead of storing bad data.
Constraints also document the schema: `NOT NULL UNIQUE` says more than any comment.

## How SQL expresses it

```sql
CREATE TABLE accounts (
  id       INTEGER PRIMARY KEY,
  handle   TEXT NOT NULL UNIQUE,
  balance  INTEGER NOT NULL DEFAULT 0 CHECK (balance >= 0),
  owner_id INTEGER REFERENCES people(id) ON DELETE CASCADE
);
```

- `PRIMARY KEY` identifies each row. In SQLite, `INTEGER PRIMARY KEY` is the rowid itself and
  is filled in automatically when you leave it out.
- `NOT NULL` forbids missing values; `DEFAULT` supplies one when the column is omitted.
- `UNIQUE` forbids two rows with equal values, and is enforced with an index. A table
  constraint such as `UNIQUE (a, b)` or `PRIMARY KEY (a, b)` applies to the combination.
- `CHECK (expr)` rejects a row when `expr` is false.
- `REFERENCES parent(col)`, a **foreign key**, requires the value to exist in the parent
  table. `ON DELETE CASCADE` deletes the children with their parent, `ON DELETE SET NULL`
  clears the reference, and the default refuses to delete a parent that still has children.

A violation raises an error that names the rule, such as
`UNIQUE constraint failed: accounts.handle` (in Python, `sqlite3.IntegrityError`). The whole
statement is undone, so a multi-row `INSERT` that fails on its third row stores none of them.

## What is special about SQLite

- **Foreign keys are off by default**, for backward compatibility. Every connection must run
  `PRAGMA foreign_keys = ON;`, or each `REFERENCES` clause is silently ignored. PostgreSQL
  and MySQL (InnoDB) always enforce them.
- The pragma has no effect inside an open transaction, so run it first.
- A `PRIMARY KEY` that is not `INTEGER PRIMARY KEY` still accepts `NULL` (a historical bug
  kept for compatibility). Add `NOT NULL` to text and composite keys.
- Column types are only affinities, so a `CHECK` (or a `STRICT` table) is how you keep text
  out of a number column.

## Pitfalls

- `NULL` passes a `CHECK`. The rule rejects a row only when the expression is **false**, and
  `NULL >= 0` is unknown. Pair `CHECK` with `NOT NULL` when the value is required.
- `UNIQUE` allows any number of `NULL`s, because two `NULL`s are never equal.
- `ON DELETE CASCADE` is powerful: deleting one customer can remove thousands of rows. Use it
  for children that make no sense alone (order lines), not for records you must keep.

## What you will practise

You will watch `NOT NULL`, `UNIQUE` and `CHECK` reject rows, catch an orphan row that slips in
while foreign keys are off, and see `CASCADE` and `SET NULL` at work. The challenge asks you
to write a shop's schema, and the hidden tests try to break every rule in it.
'''

[[unit.step]]
kind = "concept"
id = "sql-u13-c1-invariants"
title = "Constraints are checked on every write"
points = 5
difficulty = 13
intro = '''
An invariant is a statement that must stay true however the data changes. Declaring it as a
constraint moves the check into the storage engine, which verifies each new or changed row
before it is written, using an index whenever the rule compares against other rows.
'''
body = '''
## Rules the engine checks for you

```sql
CREATE TABLE products (
  sku   TEXT NOT NULL PRIMARY KEY,
  name  TEXT NOT NULL,
  price INTEGER NOT NULL CHECK (price > 0)
);
INSERT INTO products VALUES ('A1', 'lamp', 0);
-- Error: CHECK constraint failed: price > 0
```

Every `INSERT` and `UPDATE` checks the new row against the table's constraints before it is
stored. If one fails, the statement is undone and an error is raised, so the table never
holds a row that breaks a rule.

- `NOT NULL` and `CHECK` look at the row alone, so they cost almost nothing.
- `PRIMARY KEY` and `UNIQUE` must compare with the other rows. The engine keeps a B-tree index
  on those columns and does one **index seek** per write, `O(log n)`, instead of scanning.
- A foreign key looks up the parent row through its key on every insert, and looks for
  children on every parent delete. That second lookup scans the child table unless the
  child's foreign key column has an index.

## Foreign keys in SQLite

```sql
PRAGMA foreign_keys = ON;
```

Without this line SQLite parses `REFERENCES` but never checks it. It is a per-connection
setting, so it belongs at the top of every script and right after every connection your
program opens.
'''

[[unit.step]]
kind = "drill"
id = "sql-u13-d1-reject"
title = "Watch the rules say no"
points = 10
difficulty = 13
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A rejected write normally stops a script with an error. `INSERT OR IGNORE` asks SQLite to
skip a row that breaks a `NOT NULL`, `UNIQUE`, `PRIMARY KEY` or `CHECK` rule instead, which
lets you see each rule fire: `changes()` then reports 0 rows written.
'''
prompt = '''
Create a `users` table with `NOT NULL`, `UNIQUE` and `CHECK` rules, try three invalid inserts
with `INSERT OR IGNORE` and count what each one wrote, then insert a user with no age and list
the table.
'''
target = '''
CREATE TABLE users (
  id INTEGER PRIMARY KEY,
  email TEXT NOT NULL UNIQUE,
  age INTEGER CHECK (age >= 13)
);
INSERT INTO users (email, age) VALUES ('ana@example.com', 30);
INSERT OR IGNORE INTO users (email, age) VALUES ('ana@example.com', 41);
SELECT changes() AS dup_email;
INSERT OR IGNORE INTO users (email, age) VALUES (NULL, 25);
SELECT changes() AS no_email;
INSERT OR IGNORE INTO users (email, age) VALUES ('kid@example.com', 9);
SELECT changes() AS too_young;
INSERT INTO users (email, age) VALUES ('bo@example.com', NULL);
SELECT id, email, age FROM users ORDER BY id;
'''
line_comments = [
  "Starts the table definition.",
  "The rowid key, filled in automatically.",
  "Every user needs an email, and no two users may share one.",
  "Age is optional, but when present it must be at least 13.",
  "Ends the definition.",
  "A valid user: stored as id 1.",
  "Same email again: UNIQUE rejects it, and OR IGNORE skips the row instead of failing.",
  "0 rows written.",
  "No email: NOT NULL rejects it.",
  "0 rows written.",
  "Age 9: the CHECK is false, so the row is rejected.",
  "0 rows written.",
  "Age NULL: the CHECK is unknown, not false, so the row is accepted.",
  "Lists what was actually stored.",
]
explanation = '''
It printed:

```text
dup_email
0
no_email
0
too_young
0
id|email|age
1|ana@example.com|30
2|bo@example.com|NULL
```

Each rule rejected its row; without `OR IGNORE` the first rejection would have stopped the
script with `UNIQUE constraint failed: users.email`. The last insert shows the classic gap:
`NULL >= 13` is unknown, and a `CHECK` only rejects a row when its condition is false. Add
`NOT NULL` when the value is required.
'''

[[unit.step]]
kind = "drill"
id = "sql-u13-d2-foreign-keys"
title = "Foreign keys: off, then on"
points = 10
difficulty = 13
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Referential integrity means every foreign key value matches a row in its parent table. SQLite
only enforces it after `PRAGMA foreign_keys = ON`; until then an orphan row goes in silently.
`PRAGMA foreign_key_check` audits a database after the fact by probing each child value
against the parent's key.
'''
prompt = '''
With foreign keys still off, insert a book whose author doesn't exist, find it with
`PRAGMA foreign_key_check`, remove it, then switch enforcement on and confirm it.
'''
target = '''
CREATE TABLE authors (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
CREATE TABLE books (
  id INTEGER PRIMARY KEY,
  title TEXT NOT NULL,
  author_id INTEGER NOT NULL REFERENCES authors(id)
);
INSERT INTO authors VALUES (1, 'Le Guin');
INSERT INTO books VALUES (1, 'The Dispossessed', 1);
INSERT INTO books VALUES (2, 'Ghost Book', 99);
PRAGMA foreign_key_check;
DELETE FROM books WHERE id = 2;
PRAGMA foreign_keys = ON;
PRAGMA foreign_keys;
SELECT b.title, a.name FROM books AS b JOIN authors AS a ON a.id = b.author_id;
'''
line_comments = [
  "The parent table.",
  "Starts the child table.",
  "Its own key.",
  "A required title.",
  "A foreign key: each book's author_id should exist in authors.",
  "Ends the definition.",
  "One author.",
  "A valid book by author 1.",
  "Author 99 does not exist, yet this succeeds: foreign keys are off by default.",
  "Audits every foreign key and lists the rows that break one.",
  "Removes the orphan.",
  "Turns enforcement on for this connection, before any transaction.",
  "Reads the setting back: 1 means on.",
  "Every remaining book now has its author.",
]
explanation = '''
It printed:

```text
table|rowid|parent|fkid
books|2|authors|0
foreign_keys
1
title|name
The Dispossessed|Le Guin
```

The orphan went in without a word, because the pragma was off. `foreign_key_check` found it:
row 2 of `books` points at a missing `authors` row through foreign key number 0. With the
pragma on, the same insert would fail with `FOREIGN KEY constraint failed`. That is why the
pragma goes at the very top of a script.
'''

[[unit.step]]
kind = "drill"
id = "sql-u13-d3-on-delete"
title = "CASCADE and SET NULL"
points = 10
difficulty = 13
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Deleting a parent row raises a question for its children. The `ON DELETE` action is the
answer the engine applies automatically: for each deleted parent it finds the children
(an index seek if the foreign key column is indexed, a scan if not) and deletes them or sets
their reference to `NULL`.
'''
prompt = '''
Build teams, players and badges with `ON DELETE SET NULL` and `ON DELETE CASCADE`, delete one
team and one player, and count what is left for each player.
'''
target = '''
PRAGMA foreign_keys = ON;
CREATE TABLE teams (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
CREATE TABLE players (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  team_id INTEGER REFERENCES teams(id) ON DELETE SET NULL
);
CREATE TABLE badges (
  player_id INTEGER NOT NULL REFERENCES players(id) ON DELETE CASCADE,
  badge TEXT NOT NULL,
  PRIMARY KEY (player_id, badge)
);
INSERT INTO teams VALUES (1, 'Lions'), (2, 'Owls');
INSERT INTO players VALUES (1, 'Ana', 1), (2, 'Bo', 2), (3, 'Cy', 2);
INSERT INTO badges VALUES (1, 'mvp'), (2, 'rookie'), (2, 'captain'), (3, 'mvp');
DELETE FROM teams WHERE id = 2;
DELETE FROM players WHERE id = 2;
SELECT p.name, p.team_id, count(b.badge) AS badges
FROM players AS p LEFT JOIN badges AS b ON b.player_id = p.id
GROUP BY p.id
ORDER BY p.id;
'''
line_comments = [
  "Enforcement on first, or none of the ON DELETE actions run.",
  "Teams are the parents of players.",
  "Starts the players table.",
  "Its own key.",
  "A required name.",
  "A player outlives their team: deleting the team clears team_id.",
  "Ends the players table.",
  "Starts the badges table.",
  "A badge makes no sense without its player: deleting the player deletes the badges.",
  "The badge name.",
  "A composite key: a player can hold each badge once.",
  "Ends the badges table.",
  "Two teams.",
  "Ana plays for the Lions, Bo and Cy for the Owls.",
  "Four badges; Bo holds two of them.",
  "Deletes the Owls: Bo's and Cy's team_id become NULL.",
  "Deletes Bo: both of Bo's badges go with him.",
  "Counts each remaining player's badges…",
  "…keeping players with none, thanks to the LEFT JOIN…",
  "…one row per player…",
  "…in id order.",
]
explanation = '''
It printed:

```text
name|team_id|badges
Ana|1|1
Cy|NULL|1
```

Deleting the Owls did not delete Cy: `SET NULL` cleared Cy's `team_id`. Deleting Bo removed
Bo's two badges too (`CASCADE`), so no orphan badge is left. Without `PRAGMA foreign_keys`,
both deletes would have run with no side effects at all.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u13-x1-shop-schema"
title = "A schema that refuses bad data"
points = 30
difficulty = 13
entry = "shop_schema"
run_command = "python3 -m unittest"
intro = '''
Design by constraint: every business rule below becomes a column or table constraint, so the
engine enforces it on every write. The hidden tests insert valid data, then try to break each
rule and expect `sqlite3.IntegrityError` every time.
'''
instructions = '''
## Your turn: write a script

Write a **script** that creates the schema of a small shop. The database starts empty. Your
script must begin with `PRAGMA foreign_keys = ON;` (the tests insert through the same
connection, so the setting must come from your script).

Create these three tables, with these columns in this order:

**`customers(id, email, name)`**

- `id`: `INTEGER PRIMARY KEY`.
- `email`: text, required, no two customers share one.
- `name`: text, required.

**`orders(id, customer_id, status, total_cents)`**

- `id`: `INTEGER PRIMARY KEY`.
- `customer_id`: required, references `customers(id)`. Deleting a customer deletes their
  orders.
- `status`: text, required, `'new'` when not given, and only `'new'`, `'paid'` or `'shipped'`.
- `total_cents`: integer, required, never negative (0 is allowed).

**`order_items(order_id, sku, qty)`**

- `order_id`: required, references `orders(id)`. Deleting an order deletes its items.
- `sku`: text, required.
- `qty`: integer, required, at least 1.
- The pair `(order_id, sku)` is the primary key: an order lists each sku once.

Examples of what must happen afterwards:

```sql
INSERT INTO customers (email, name) VALUES ('ana@example.com', 'Ana');      -- ok, id 1
INSERT INTO orders (customer_id, total_cents) VALUES (1, 2500);             -- ok, status 'new'
INSERT INTO orders (customer_id, total_cents) VALUES (99, 100);             -- IntegrityError
INSERT INTO orders (customer_id, status, total_cents) VALUES (1, 'lost', 5);-- IntegrityError
DELETE FROM customers WHERE id = 1;          -- also deletes the order and its items
```

Hidden tests decide correctness.
'''
starter = '''
-- shop_schema: write your script below (the PRAGMA first, then three CREATE TABLEs).
-- Hint: NULL passes a CHECK, and a non-integer primary key accepts NULL unless you say NOT NULL.
'''
tests = '''
VALID = """
INSERT INTO customers (id, email, name) VALUES (1, 'ana@example.com', 'Ana'), (2, 'bo@example.com', 'Bo');
INSERT INTO orders (id, customer_id, total_cents) VALUES (10, 1, 2500), (11, 2, 0), (12, 1, 700);
INSERT INTO order_items (order_id, sku, qty) VALUES (10, 'LAMP', 1), (10, 'BULB', 4), (11, 'LAMP', 2), (12, 'CORD', 1);
"""


class ShopSchemaTest(unittest.TestCase):
    def setUp(self):
        self.conn = script()
        self.conn.executescript(VALID)

    def tearDown(self):
        self.conn.close()

    def bad(self, sql):
        with self.assertRaises(sqlite3.IntegrityError, msg=sql):
            self.conn.execute(sql)

    def rows(self, sql):
        return self.conn.execute(sql).fetchall()

    def test_columns_in_order(self):
        for table, cols in [
            ("customers", ["id", "email", "name"]),
            ("orders", ["id", "customer_id", "status", "total_cents"]),
            ("order_items", ["order_id", "sku", "qty"]),
        ]:
            self.assertEqual([r[1] for r in self.rows(f"PRAGMA table_info({table})")], cols, table)

    def test_valid_rows_and_default_status(self):
        self.assertEqual(
            self.rows("SELECT id, customer_id, status, total_cents FROM orders ORDER BY id"),
            [(10, 1, "new", 2500), (11, 2, "new", 0), (12, 1, "new", 700)],
        )
        self.conn.execute("UPDATE orders SET status = 'paid' WHERE id = 10")
        self.conn.execute("UPDATE orders SET status = 'shipped' WHERE id = 11")
        new_id = self.conn.execute(
            "INSERT INTO customers (email, name) VALUES ('cy@example.com', 'Cy')").lastrowid
        self.assertEqual(new_id, 3)

    def test_customer_rules(self):
        self.bad("INSERT INTO customers (email, name) VALUES ('ana@example.com', 'Other Ana')")
        self.bad("INSERT INTO customers (email, name) VALUES (NULL, 'Nobody')")
        self.bad("INSERT INTO customers (email, name) VALUES ('cy@example.com', NULL)")
        self.bad("UPDATE customers SET email = 'ana@example.com' WHERE id = 2")
        self.assertEqual(self.rows("SELECT count(*) FROM customers"), [(2,)])

    def test_order_status_rules(self):
        self.bad("INSERT INTO orders (customer_id, status, total_cents) VALUES (1, 'lost', 100)")
        self.bad("INSERT INTO orders (customer_id, status, total_cents) VALUES (1, NULL, 100)")
        self.bad("UPDATE orders SET status = 'cancelled' WHERE id = 10")
        self.bad("UPDATE orders SET status = 'NEW' WHERE id = 10")

    def test_order_total_rules(self):
        self.bad("INSERT INTO orders (customer_id, total_cents) VALUES (1, -1)")
        self.bad("INSERT INTO orders (customer_id, total_cents) VALUES (1, NULL)")
        self.bad("INSERT INTO orders (customer_id) VALUES (1)")

    def test_foreign_keys_are_enforced(self):
        self.assertEqual(self.rows("PRAGMA foreign_keys"), [(1,)])
        self.bad("INSERT INTO orders (customer_id, total_cents) VALUES (99, 100)")
        self.bad("INSERT INTO orders (customer_id, total_cents) VALUES (NULL, 100)")
        self.bad("INSERT INTO order_items (order_id, sku, qty) VALUES (99, 'LAMP', 1)")
        self.bad("UPDATE orders SET customer_id = 42 WHERE id = 10")

    def test_order_item_rules(self):
        self.bad("INSERT INTO order_items (order_id, sku, qty) VALUES (10, 'LAMP', 3)")
        self.bad("INSERT INTO order_items (order_id, sku, qty) VALUES (11, 'BULB', 0)")
        self.bad("INSERT INTO order_items (order_id, sku, qty) VALUES (11, 'BULB', NULL)")
        self.bad("INSERT INTO order_items (order_id, sku, qty) VALUES (11, NULL, 1)")
        self.bad("INSERT INTO order_items (order_id, sku, qty) VALUES (NULL, 'BULB', 1)")
        self.conn.execute("INSERT INTO order_items (order_id, sku, qty) VALUES (11, 'BULB', 1)")
        self.assertEqual(self.rows("SELECT count(*) FROM order_items"), [(5,)])

    def test_deleting_a_customer_cascades(self):
        self.conn.execute("DELETE FROM customers WHERE id = 1")
        self.assertEqual(self.rows("SELECT id FROM orders ORDER BY id"), [(11,)])
        self.assertEqual(self.rows("SELECT order_id, sku, qty FROM order_items"), [(11, "LAMP", 2)])
        self.conn.execute("DELETE FROM orders WHERE id = 11")
        self.assertEqual(self.rows("SELECT count(*) FROM order_items"), [(0,)])
        self.assertEqual(self.rows("SELECT name FROM customers"), [("Bo",)])
'''

[unit.step.gabarito]
solution = '''
PRAGMA foreign_keys = ON;

CREATE TABLE customers (
  id    INTEGER PRIMARY KEY,
  email TEXT NOT NULL UNIQUE,
  name  TEXT NOT NULL
);

CREATE TABLE orders (
  id          INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL REFERENCES customers(id) ON DELETE CASCADE,
  status      TEXT NOT NULL DEFAULT 'new' CHECK (status IN ('new', 'paid', 'shipped')),
  total_cents INTEGER NOT NULL CHECK (total_cents >= 0)
);

CREATE TABLE order_items (
  order_id INTEGER NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
  sku      TEXT NOT NULL,
  qty      INTEGER NOT NULL CHECK (qty > 0),
  PRIMARY KEY (order_id, sku)
);

-- Not required by the tests: lets a customer delete find their orders without a scan.
CREATE INDEX orders_customer ON orders (customer_id);
'''
time = "O(log n) per write"
space = "O(n)"
justification = '''
Creating the schema is constant work; the cost that matters is what each **write** pays for
its constraints, with **n** rows in a table:

- `NOT NULL` and `CHECK` evaluate expressions on the new row only: **O(1)**.
- `email UNIQUE` and the composite `PRIMARY KEY (order_id, sku)` are backed by B-tree indexes,
  so each insert does one **O(log n)** seek to look for a duplicate, then inserts into the
  index. That is also the **O(n)** extra space: one index entry per row.
- A foreign key on insert seeks the parent by its primary key: **O(log n)**.
- On a parent delete, SQLite must find the children. `order_items` is keyed by
  `(order_id, sku)`, so its children of an order are a range seek. `orders.customer_id` has no
  index of its own, so without `orders_customer` every customer delete would **scan** all
  orders, **O(n)**; with it, the cascade is a seek plus one delete per child.

Two details make the tests pass: `NOT NULL` next to every `CHECK` (a `NULL` total or status
would otherwise pass), and `NOT NULL` on `order_id` and `sku`, because a composite primary key
in an ordinary SQLite table accepts `NULL`. The `PRAGMA` comes first, because without it every
`REFERENCES` and `ON DELETE` clause is ignored.
'''

[[unit]]
id = "sql-u14-normalization"
title = "Schema design: normal forms and relationships"
level = "intermediate"
difficulty = 14
intro = '''
A good schema stores each fact exactly once and connects facts through keys. This unit covers
the first three normal forms, how to model one-to-many and many-to-many relationships, and
how to migrate a flat, repetitive table into a normalized schema with `INSERT … SELECT`.
'''
concepts = '''
## The idea

Normalization is the discipline of storing **each fact once**. When the same fact is copied
into many rows, such as a customer's city repeated on every order, the copies can disagree.
Change the city on one order and forget the others (an **update anomaly**), and the database
now holds two answers. You also cannot record a customer who has not ordered yet (an
**insert anomaly**), and deleting their last order erases the customer too (a **delete
anomaly**).

The normal forms are a checklist for finding those copies:

- **1NF**: every column holds one atomic value. No comma-separated lists, and no
  `phone1, phone2, phone3` columns.
- **2NF**: every non-key column depends on the **whole** key. In a table keyed by
  `(student_id, course_code)`, the course title depends only on `course_code`, so it belongs
  in a `courses` table.
- **3NF**: non-key columns depend on the key and **nothing but the key**. If `zip` determines
  `city`, then `city` in an `orders` table depends on the order only through `zip`, and it
  moves to its own table.

## How SQL expresses it

Relationships are modelled with keys:

- **One-to-many**: the "many" side holds a foreign key to the "one" side. An order has one
  customer and a customer has many orders, so `orders.customer_id` references `customers.id`.
- **Many-to-many**: neither side can hold a single foreign key, so a **join table** holds one
  row per pair, with a composite primary key so a pair cannot appear twice. Facts about the
  pair itself, such as a role or a grade, live in that table.

```sql
CREATE TABLE memberships (
  user_id  INTEGER NOT NULL REFERENCES users(id),
  group_id INTEGER NOT NULL REFERENCES groups(id),
  role     TEXT NOT NULL DEFAULT 'member',
  PRIMARY KEY (user_id, group_id)
);
```

Reading the data back is a join through the keys: the flat view becomes a query, not a
table. Moving existing flat data into such a schema is `INSERT … SELECT DISTINCT`: first the
entity tables, deduplicated, then the link rows, joining back on a natural key (an email, a
code) to look up the new ids.

## Pitfalls

- A list in a column looks convenient until you query it. `tags LIKE '%sql%'` also matches
  `nosql`, cannot use an index, and cannot be joined or counted.
- Repeated columns (`tag1`, `tag2`, `tag3`) cap the count and turn "which rows have tag X"
  into a three-way `OR`.
- Joining back on a column that is not unique, such as a person's name, multiplies rows. Join
  on a key.
- A join table without its composite key lets the same pair be inserted twice, and every
  count over it is then wrong.
- Normalization is a default, not a religion. Reports, caches and event logs are often
  denormalized on purpose for read speed. What matters is knowing which copy is the source of
  truth.

## What you will practise

You will replace a comma-separated list with a row per value, split a flat table into a
one-to-many pair, and query a many-to-many relationship through its join table. The
challenge asks you to create a normalized schema with given table and column names, and to
migrate a flat table into it.
'''

[[unit.step]]
kind = "concept"
id = "sql-u14-c1-one-fact"
title = "One fact, one place"
points = 5
difficulty = 14
intro = '''
A functional dependency says that one column determines another: a customer id determines
the customer's city. Normalization splits a table along its dependencies, so every value is
stored in the one table whose key determines it, and joins on keys put the rows back
together.
'''
body = '''
## Spot the copies

```text
order_id | customer | customer_city | product | product_price
1        | Ana      | Luanda        | lamp    | 2500
2        | Ana      | Luanda        | bulb    | 300
3        | Bo       | Porto         | lamp    | 2500
```

Ana's city is stored twice and the lamp's price twice. Each copy is a chance to disagree:
update one row and the table now holds two cities for Ana.

## Split by what each fact depends on

Ask of every column: *which key determines this value?*

- `customer_city` depends on the customer, so it goes to `customers(id, name, city)`.
- `product_price` depends on the product, so it goes to `products(id, name, price)`.
- What depends on the order itself stays: `orders(id, customer_id, product_id)`.

```sql
SELECT o.id, c.name, c.city, p.name, p.price
FROM orders AS o
JOIN customers AS c ON c.id = o.customer_id
JOIN products AS p ON p.id = o.product_id;
```

The flat table is now a query. Each fact has exactly one row, so an update touches exactly
one place. Rebuilding the flat view costs one primary-key seek per lookup: for n orders,
SQLite scans `orders` and does two `O(log n)` seeks per row.
'''

[[unit.step]]
