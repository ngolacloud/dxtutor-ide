  "...ids 1 to 4...",
  "...and 5 to 7.",
  "Page 1: skip nothing, take three.",
  "Page 2: skip three, take three.",
  "Page 3: skip six; only one row is left.",
  "How many pages of three: the row count divided by 3, rounded up with integer division.",
]
explanation = '''
