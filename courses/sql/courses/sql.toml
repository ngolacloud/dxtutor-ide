[[unit.step]]
kind = "challenge"
id = "sql-u26-x1-revenue-matrix"
title = "The quarterly revenue matrix"
points = 40
difficulty = 32
entry = "revenue_matrix"
intro = '''
A finance-style report: filter a date range correctly, pivot months into columns, keep regions
with no sales, and append a totals row that always sorts last. The hidden tests check boundaries
to the second, a region named after `TOTAL` in sort order, and 20 000 orders.
'''
instructions = '''
## Your turn

Write **one query** (a single statement; `WITH` and `UNION ALL` are fine) over these tables:

```sql
CREATE TABLE regions (name TEXT PRIMARY KEY);
CREATE TABLE orders (
  id         INTEGER PRIMARY KEY,
  region     TEXT NOT NULL,
  ordered_at TEXT NOT NULL,     -- 'YYYY-MM-DD HH:MM:SS'
  status     TEXT NOT NULL,     -- 'paid', 'pending' or 'refunded'
  amount     INTEGER NOT NULL   -- in cents
);
```

Build the revenue matrix for the **first quarter of 2026**, from `2026-01-01 00:00:00` up to and
including `2026-03-31 23:59:59`. Only **paid** orders count.

Columns, exactly: `region`, `jan`, `feb`, `mar`, `total`.

- One row per region in `regions`, sorted by name, **including regions with no orders** (all
  zeros). Orders whose region is not in `regions` are ignored.
- Every cell is an integer: write `0`, never `NULL`.
- `total` is `jan + feb + mar` for the row.
- After the regions, one final row whose `region` is `'TOTAL'`, holding the sum of each column. It
  is always the **last** row.

Example, with regions `North` and `South`:

```
(1, 'North', '2026-01-15 10:00:00', 'paid', 1000)
(2, 'North', '2026-03-31 23:30:00', 'paid', 500)
(3, 'North', '2026-02-02 09:00:00', 'refunded', 700)
(4, 'North', '2026-04-01 00:00:00', 'paid', 900)
```

```
region|jan|feb|mar|total
North|1000|0|500|1500
South|0|0|0|0
TOTAL|1000|0|500|1500
```

Hidden tests decide correctness.
'''
starter = '''
-- revenue_matrix: write your query below
-- Hint: filter paid Q1 orders first (watch the last day's times), LEFT JOIN them to the regions,
-- pivot with conditional sums, then UNION ALL a totals row and sort with an explicit key.
'''
tests = '''
SCHEMA = """
CREATE TABLE regions (name TEXT PRIMARY KEY);
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  region TEXT NOT NULL,
  ordered_at TEXT NOT NULL,
  status TEXT NOT NULL,
  amount INTEGER NOT NULL
);
"""

EXAMPLE = SCHEMA + """
INSERT INTO regions VALUES ('North'), ('South');
INSERT INTO orders VALUES
  (1, 'North', '2026-01-15 10:00:00', 'paid', 1000),
  (2, 'North', '2026-03-31 23:30:00', 'paid', 500),
  (3, 'North', '2026-02-02 09:00:00', 'refunded', 700),
  (4, 'North', '2026-04-01 00:00:00', 'paid', 900);
"""

COLUMNS = ["region", "jan", "feb", "mar", "total"]


def expected(regions, orders):
    cells = {r: [0, 0, 0] for r in regions}
    for region, ts, status, amount in orders:
        if status == "paid" and region in cells and "2026-01-01" <= ts < "2026-04-01":
            cells[region][int(ts[5:7]) - 1] += amount
    rows = [(r, *v, sum(v)) for r, v in sorted(cells.items())]
    totals = tuple(sum(row[i] for row in rows) for i in range(1, 5))
    return rows + [("TOTAL", *totals)]


class RevenueMatrixTest(unittest.TestCase):
    def check(self, setup):
        cols, rows = query(setup)
        self.assertEqual(cols, COLUMNS)
        regions = [r for (r,) in query(setup, "SELECT name FROM regions")[1]]
        orders = query(setup, "SELECT region, ordered_at, status, amount FROM orders")[1]
        self.assertEqual(rows, expected(regions, orders))
        for row in rows:
            for cell in row[1:]:
                self.assertIs(type(cell), int, row)
        return rows

    def test_example(self):
        rows = self.check(EXAMPLE)
        self.assertEqual(rows, [
            ("North", 1000, 0, 500, 1500),
            ("South", 0, 0, 0, 0),
            ("TOTAL", 1000, 0, 500, 1500),
        ])

    def test_quarter_boundaries(self):
        self.check(EXAMPLE + """
            INSERT INTO orders (region, ordered_at, status, amount) VALUES
              ('South', '2025-12-31 23:59:59', 'paid', 1),
              ('South', '2026-01-01 00:00:00', 'paid', 20),
              ('South', '2026-01-31 23:59:59', 'paid', 300),
              ('South', '2026-02-01 00:00:00', 'paid', 4000),
              ('South', '2026-03-31 23:59:59', 'paid', 50000),
              ('South', '2026-04-01 00:00:01', 'paid', 600000);
        """)

    def test_only_paid_orders(self):
        self.check(EXAMPLE + """
            INSERT INTO orders (region, ordered_at, status, amount) VALUES
              ('South', '2026-02-10 10:00:00', 'pending', 70),
              ('South', '2026-02-11 10:00:00', 'refunded', 80),
              ('South', '2026-02-12 10:00:00', 'paid', 90);
        """)

    def test_total_row_is_last(self):
        rows = self.check(EXAMPLE + """
            INSERT INTO regions VALUES ('Zambezi'), ('Atlantic');
            INSERT INTO orders (region, ordered_at, status, amount) VALUES
              ('Zambezi', '2026-03-03 12:00:00', 'paid', 250);
        """)
        self.assertEqual(rows[-1][0], "TOTAL")
        self.assertEqual(rows[-2][0], "Zambezi")

    def test_unknown_regions_are_ignored(self):
        self.check(EXAMPLE + """
            INSERT INTO orders (region, ordered_at, status, amount) VALUES
              ('Mars', '2026-01-20 10:00:00', 'paid', 99999);
        """)

    def test_no_orders_at_all(self):
        rows = self.check(SCHEMA + "INSERT INTO regions VALUES ('East'), ('West');")
        self.assertEqual(rows[-1], ("TOTAL", 0, 0, 0, 0))

    def test_no_regions(self):
        rows = self.check(SCHEMA)
        self.assertEqual(rows, [("TOTAL", 0, 0, 0, 0)])

    def test_many_orders(self):
        self.check(SCHEMA + """
            INSERT INTO regions VALUES ('North'), ('South'), ('East'), ('West'), ('Zambezi');
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 20000)
            INSERT INTO orders (region, ordered_at, status, amount)
            SELECT CASE i % 6 WHEN 0 THEN 'North' WHEN 1 THEN 'South' WHEN 2 THEN 'East'
                              WHEN 3 THEN 'West' WHEN 4 THEN 'Zambezi' ELSE 'Mars' END,
                   datetime('2025-12-01', '+' || (i * 37 % 150) || ' days',
                            '+' || (i * 7919 % 86400) || ' seconds'),
                   CASE WHEN i % 7 = 0 THEN 'refunded' WHEN i % 11 = 0 THEN 'pending' ELSE 'paid' END,
                   i * 7919 % 10000 + 1
            FROM n;
        """)
'''

[unit.step.gabarito]
solution = '''
WITH paid AS (
  SELECT region, strftime('%m', ordered_at) AS month, amount
  FROM orders
  WHERE status = 'paid'
    AND ordered_at >= '2026-01-01' AND ordered_at < '2026-04-01'
),
matrix AS (
  SELECT r.name AS region,
         COALESCE(SUM(p.amount) FILTER (WHERE p.month = '01'), 0) AS jan,
         COALESCE(SUM(p.amount) FILTER (WHERE p.month = '02'), 0) AS feb,
         COALESCE(SUM(p.amount) FILTER (WHERE p.month = '03'), 0) AS mar,
         COALESCE(SUM(p.amount), 0) AS total
  FROM regions AS r
  LEFT JOIN paid AS p ON p.region = r.name
  GROUP BY r.name
)
SELECT region, jan, feb, mar, total
FROM (
  SELECT 0 AS sort_key, region, jan, feb, mar, total FROM matrix
  UNION ALL
  SELECT 1, 'TOTAL', COALESCE(SUM(jan), 0), COALESCE(SUM(feb), 0),
         COALESCE(SUM(mar), 0), COALESCE(SUM(total), 0)
  FROM matrix
)
ORDER BY sort_key, region;
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Let **n** be the number of orders and **r** the number of regions. `orders` has no index that
helps, so SQLite reads it once. `EXPLAIN QUERY PLAN` shows what it does with that scan: the
`paid` CTE is flattened into the join, and SQLite builds an **automatic index** on
`orders(status, region)` for the duration of the query, then walks `regions` in primary-key order
and **seeks** each region's orders in that index. Building it is one scan plus a sort,
**O(n log n)** time and **O(n)** temporary space; the seeks touch every matching order once.

Comparing the text timestamps with `>= '2026-01-01'` and `< '2026-04-01'` is a half-open range: it
includes every second of 31 March, which `BETWEEN '2026-01-01' AND '2026-03-31'` would miss, and it
would become an index range scan if `ordered_at` were indexed.

The `LEFT JOIN` starts from `regions`, so a region without orders still gets a group, and every
`FILTER` sum of a group is updated in the same pass. `matrix` is materialised once (it is used
twice) and holds only **r** rows; the totals row re-reads those r rows rather than the orders, and
the final sort is O(r log r). The `sort_key` column, not the region name, keeps `TOTAL` last:
sorting by name alone would put `Zambezi` after it.

'''

# ── Unit 33 · Data cleaning ──────────────────────────────────────────────────────────

[[unit]]
id = "sql-u27-data-cleaning"
title = "Cleaning messy data"
level = "advanced"
difficulty = 33
intro = '''
Real tables arrive with stray spaces, mixed case, blank strings pretending to be values, dates in
three formats and the same customer typed in twice. This unit profiles a table before changing
it, normalises text, finds the rows that break the rules, and merges duplicates safely, with the
foreign keys still intact afterwards.
'''
concepts = '''
## The idea

Data cleaning is a sequence of small, checkable steps: **profile** the table to see what is wrong,
**normalise** values so equal things look equal, **validate** to find the rows that break the
rules, and **deduplicate** what is now visibly the same. Do it in SQL, in the database, and every
step works on the whole set at once and can sit inside a transaction.

## Profile first

Count before you change anything. A few aggregates tell you how dirty a column is:

```sql
SELECT COUNT(*)                              AS rows_total,
       COUNT(email)                          AS with_email,
       COUNT(DISTINCT email)                 AS distinct_raw,
       COUNT(DISTINCT lower(trim(email)))    AS distinct_clean
FROM customers;
```

When `distinct_clean` is smaller than `distinct_raw`, some values differ only by case or spaces.

## Normalising text

SQLite gives you `trim`, `lower`, `upper`, `replace`, `substr` and `length`; that covers most of the
job. `NULLIF(trim(x), '')` turns blank strings into real NULLs, so `COUNT` and `IS NULL` mean what
you expect. There is no built-in regular-expression function: the `REGEXP` operator exists only when
the application registers one, and `lower` and `NOCASE` only fold ASCII letters, so `'Á'` stays
`'Á'`. PostgreSQL has `regexp_replace` and full Unicode case mapping.

## Finding bad rows

SQLite's column types are **affinities**, not rules: a column declared `INTEGER` happily stores
`'12,50'` as text when the value doesn't look like a number. `typeof(x)` reveals what was actually
stored. Dates are text, so check them by round-tripping: `date(x) IS NOT x` is true when `x` is not
a valid `'YYYY-MM-DD'` (SQLite even normalises `'2026-02-30'` to `'2026-03-02'`). `GLOB` matches
shell-style patterns, case-sensitively: `email GLOB '?*@?*.?*'` is a cheap sanity check.

## Deduplicating

Duplicates are rows that are equal **after normalisation**. Pick a survivor per group with a
deterministic rule, then remove the rest:

```sql
SELECT id, ROW_NUMBER() OVER (
         PARTITION BY lower(trim(email)) ORDER BY id) AS rn
FROM customers;   -- rn = 1 is the survivor
```

Other tables may point at the losers. Re-point those references to the survivor **before** deleting,
or a foreign key will either stop you (`FOREIGN KEY constraint failed`) or, without enforcement,
leave orphans. SQLite 3.33+ supports `UPDATE … FROM`, the same join-update PostgreSQL has, to apply
a mapping table in one statement.

## Pitfalls

- **Clean a copy of the logic, not by hand.** One `UPDATE` with an expression is repeatable; editing
  rows one by one is not.
- **Make it idempotent.** A cleanup script that runs twice must leave the same result: `CREATE
  TEMP TABLE` without a matching `DROP` fails on the second run.
- **Wrap it in a transaction.** `BEGIN … COMMIT` means a failure halfway leaves the data untouched.
- **Then stop it recurring.** A `CHECK`, a `UNIQUE` index on the normalised expression, or a trigger
  keeps the table clean afterwards.

## What you will practise

You will normalise messy contact fields, label the rows that break the rules, delete duplicates
keeping the newest, and write a merge script that re-points orders before deleting the duplicate
customers.
'''

[[unit.step]]
kind = "concept"
id = "sql-u27-c1-profile"
title = "Profile, normalise, validate, deduplicate"
points = 5
difficulty = 33
intro = '''
Cleaning is a pipeline of set-based transformations, each a full scan or a grouping over the
table. Doing it in SQL keeps every step declarative, repeatable and atomic, instead of a loop in
application code that reads and writes one row at a time.
'''
body = '''
## The four questions

| step | question | SQL tool |
|---|---|---|
| profile | how dirty is it? | `COUNT`, `COUNT(DISTINCT …)`, `GROUP BY … HAVING COUNT(*) > 1` |
| normalise | do equal things look equal? | `trim`, `lower`, `replace`, `NULLIF(…, '')` |
| validate | which rows break the rules? | `typeof`, `date(x) IS NOT x`, `GLOB`, `CASE` |
| deduplicate | which copy survives? | `ROW_NUMBER() OVER (PARTITION BY key ORDER BY rule)` |

## Find the duplicates by their clean key

```sql
SELECT lower(trim(email)) AS email_key, COUNT(*) AS copies,
       group_concat(id) AS ids
FROM customers
WHERE email IS NOT NULL
GROUP BY email_key
HAVING COUNT(*) > 1;
```

Grouping by an expression is one scan plus a sort (or a temporary B-tree) on that expression:
O(n log n). An **expression index**, `CREATE INDEX customers_email_key ON
customers(lower(trim(email)))`, lets SQLite read the groups in order instead, and a `UNIQUE`
expression index stops new duplicates for good.

## Survivors must be deterministic

"Keep one" is not a rule. "Keep the lowest id" or "keep the most recently updated, then the
highest id" is. Write the rule in the window's `ORDER BY`, with a unique tie-breaker at the end, so
the same data always gives the same survivor.
'''

[[unit.step]]
kind = "drill"
