intro = '''
`WHERE` runs before grouping and removes rows; `HAVING` runs after grouping and removes whole
groups by looking at their aggregates. Filtering in `WHERE` whenever you can is also cheaper:
the rows it drops never reach the sort that builds the groups.
'''
