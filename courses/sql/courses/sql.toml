intro = '''
First normal form asks for atomic values. A comma-separated list is opaque to the engine: it
can only be searched with a pattern match on every row, a full scan with false positives.
One row per value turns the list into data that can be filtered exactly, indexed and grouped.
'''
prompt = '''
Search a comma-separated `tags` column with `LIKE` and see the false match, then store the
same tags one per row in a `post_tags` table and query it exactly and with `GROUP BY`.
'''
target = '''
