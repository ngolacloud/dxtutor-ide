[[unit.step]]
kind = "challenge"
id = "sql-u08-x1-city-revenue"
title = "Revenue per city"
points = 30
difficulty = 8
entry = "city_revenue"
intro = '''
A real report usually crosses several tables and then aggregates. Here you join four of them
and group the joined rows by a column that lives at the far end of the chain. Getting the join
conditions right matters: a wrong key gives plausible but wrong numbers.
'''
instructions = '''
## Your turn

Write **one query** (a single `SELECT` statement) against these tables:

```sql
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, city TEXT);
CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT, price INTEGER);
CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER);
CREATE TABLE order_items (order_id INTEGER, product_id INTEGER, qty INTEGER);
```

Each order belongs to a customer, and each order item says how many units (`qty`) of a product
an order contains. The value of an item is `qty * price`.

Compute the **revenue of each city**: the total value of every item of every order placed by a
customer who lives in that city. Only cities with at least one sold item appear. Items whose
order, customer or product does not exist are ignored.

Return exactly these columns, in this order:

| column | meaning |
|---|---|
| `city` | the customer's city |
| `revenue` | the sum of `qty * price` for that city |

Sort by `revenue` from highest to lowest, and break ties by `city` in alphabetical order.

Example. Ana (Lisbon) ordered 5 pens at 2 and 1 book at 10; Bo (Porto) ordered 3 books; Cy
(Lisbon) ordered 10 pens. The result is:

```text
city|revenue
Lisbon|40
Porto|30
```

Hidden tests decide correctness.
'''
starter = '''
-- city_revenue: write your query below
-- Hint: chain customers -> orders -> order_items -> products, then GROUP BY city.
'''
tests = '''
SCHEMA = """
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, city TEXT);
CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT, price INTEGER);
CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER);
CREATE TABLE order_items (order_id INTEGER, product_id INTEGER, qty INTEGER);
"""

BASE = SCHEMA + """
INSERT INTO customers VALUES (1, 'Ana', 'Lisbon'), (2, 'Bo', 'Porto'),
  (3, 'Cy', 'Lisbon'), (4, 'Di', 'Faro');
INSERT INTO products VALUES (1, 'pen', 2), (2, 'book', 10), (3, 'lamp', 25);
INSERT INTO orders VALUES (100, 1), (101, 2), (102, 3), (103, 1);
INSERT INTO order_items VALUES (100, 1, 5), (100, 2, 1), (101, 2, 3), (102, 1, 10);
"""


class CityRevenueTest(unittest.TestCase):
    def test_columns(self):
        cols, _ = query(BASE)
        self.assertEqual(cols, ["city", "revenue"])

    def test_example(self):
        _, rows = query(BASE)
        self.assertEqual(rows, [("Lisbon", 40), ("Porto", 30)])

    def test_quantity_multiplies_price(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES (1, 'Ana', 'Lisbon'), (2, 'Bo', 'Porto');
        INSERT INTO products VALUES (1, 'pen', 2), (2, 'desk', 100);
        INSERT INTO orders VALUES (1, 1), (2, 2);
        INSERT INTO order_items VALUES (1, 1, 60), (2, 2, 1);
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("Lisbon", 120), ("Porto", 100)])

    def test_ids_do_not_line_up(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES (7, 'Ana', 'Braga'), (8, 'Bo', 'Evora');
        INSERT INTO products VALUES (7, 'mug', 4), (8, 'tea', 3), (500, 'kit', 50);
        INSERT INTO orders VALUES (500, 8), (501, 7), (502, 8);
        INSERT INTO order_items VALUES (500, 7, 2), (501, 8, 1), (502, 500, 1), (502, 7, 1);
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("Evora", 62), ("Braga", 3)])

    def test_ties_and_orphans(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES (1, 'Ana', 'Porto'), (2, 'Bo', 'Faro'), (3, 'Cy', 'Aveiro');
        INSERT INTO products VALUES (1, 'pen', 5);
        INSERT INTO orders VALUES (1, 1), (2, 2), (3, 3), (4, 99);
        INSERT INTO order_items VALUES (1, 1, 2), (2, 1, 2), (3, 1, 1),
          (4, 1, 100), (1, 42, 100), (77, 1, 100);
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("Faro", 10), ("Porto", 10), ("Aveiro", 5)])

    def test_no_sales(self):
        setup = SCHEMA + """
        INSERT INTO customers VALUES (1, 'Ana', 'Lisbon');
        INSERT INTO products VALUES (1, 'pen', 2);
        INSERT INTO orders VALUES (1, 1);
        """
        _, rows = query(setup)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
SELECT c.city, SUM(oi.qty * p.price) AS revenue
FROM customers AS c
JOIN orders AS o ON o.customer_id = c.id
JOIN order_items AS oi ON oi.order_id = o.id
JOIN products AS p ON p.id = oi.product_id
GROUP BY c.city
ORDER BY revenue DESC, c.city;
'''
time = "O(k log n)"
space = "O(k)"
justification = '''
The order you write the joins in is not the order SQLite runs them. Here the planner picks the
one table it has no index into, `order_items` (**k** rows), as the outer loop and **scans** it
once. For each item it **seeks** its order, that order's customer and the item's product
through their `INTEGER PRIMARY KEY`s: three O(log n) B-tree lookups, so the join produces its
rows in **O(k log n)**. Without those primary keys, each lookup would have to scan a table or
build an automatic index first.

The joined rows are then sorted by `city` into a temporary B-tree for `GROUP BY`, O(k log k),
and the few resulting cities are sorted once more for `ORDER BY`. Overall **O(k log n)** time
(k and n of the same order) and **O(k)** space for the grouping sorter. Each item is
multiplied by its own product's price before summing, which is why `SUM(oi.qty * p.price)` is
right and `SUM(p.price)` silently ignores quantities.
'''

[[unit]]
id = "sql-u09-outer-joins"
title = "Outer joins and the rows that do not match"
level = "intermediate"
difficulty = 9
intro = '''
An inner join silently drops every row without a partner, yet those rows are often the answer:
customers who never ordered, products never sold, courses nobody took. You will keep them with
`LEFT JOIN`, find them with an anti-join, count them as zero, and see how a single condition
in the wrong clause turns an outer join back into an inner one.
'''
concepts = '''
## The idea

An inner join answers "which pairs match?". An **outer join** also keeps the rows that matched
nothing. `A LEFT JOIN B` returns every row of the inner join **plus** each row of A that found
no partner in B, with `NULL` filled into all of B's columns. A is the **preserved** side: none
of its rows can disappear.

## How SQL expresses it

```sql
SELECT c.name, o.id AS order_id
FROM customers AS c
LEFT JOIN orders AS o ON o.customer_id = c.id;
```

A customer with two orders still appears twice. A customer with none appears once, with
`order_id` = `NULL`. Two everyday patterns follow from those padded rows.

- **The anti-join**: rows of A with no match in B. Join, then keep only the padded rows with
  `WHERE b.id IS NULL`. Test a column that can never be `NULL` in a real match, such as B's
  primary key.
- **Counting with zero**: `COUNT(o.id)` counts only non-`NULL` values, so a padded row
  contributes 0, while `COUNT(*)` counts it as 1. In the same way `SUM` over nothing but padded
  rows is `NULL`; `COALESCE(SUM(o.total), 0)` turns it into 0.

## ON versus WHERE

For an inner join it makes no difference whether a condition sits in `ON` or in `WHERE`. For an
outer join it does. `ON` decides which B rows *match*, and unmatched A rows are kept regardless.
`WHERE` runs *after* the join and filters the padded rows too:

```sql
SELECT c.name, o.id
FROM customers AS c
LEFT JOIN orders AS o ON o.customer_id = c.id
WHERE o.status = 'paid';     -- the padded rows have status NULL: all gone
```

`NULL = 'paid'` is not true, so every customer without a paid order vanishes: the `LEFT JOIN`
has quietly become an inner join. When you mean "match only the paid orders, but keep every
customer", put the condition in `ON`: `ON o.customer_id = c.id AND o.status = 'paid'`.

## SQLite specifics and cost

SQLite has always supported `LEFT JOIN`, and `RIGHT JOIN` and `FULL OUTER JOIN` since version
3.39 (2022); PostgreSQL has them too, while MySQL still lacks `FULL OUTER JOIN`. A
`RIGHT JOIN` is a `LEFT JOIN` with the tables swapped, and most code bases stick to `LEFT`.

SQLite runs a `LEFT JOIN` as a nested loop with the preserved table outside: for each left row
it probes the right table and, if no probe succeeds, emits one padded row. An index on the
right table's join column makes each probe an O(log m) seek; without one SQLite usually builds
an automatic index on the spot, which costs O(m log m) before the loop starts.

## What you will practise

You will look at the padded rows, find unmatched rows with an anti-join, count with zero, and
watch `WHERE` undo a `LEFT JOIN`. The challenge is a per-course report that must keep the
courses nobody is actively taking.
'''

[[unit.step]]
kind = "concept"
id = "sql-u09-c1-preserved"
title = "Keeping the unmatched rows"
points = 5
difficulty = 9
intro = '''
An outer join is an inner join plus the left rows the inner join would have thrown away, padded
with `NULL`. The engine needs no extra pass: while it probes the right table for each left row,
it only has to remember whether any probe matched.
'''
body = '''
## Inner versus left

```sql
-- inner: only customers that have orders
SELECT c.name, o.id FROM customers AS c
JOIN orders AS o ON o.customer_id = c.id;

-- left: every customer, orders where they exist
SELECT c.name, o.id FROM customers AS c
LEFT JOIN orders AS o ON o.customer_id = c.id;
```

If Bo has no orders, the first query has no row for Bo and the second has exactly one:
`Bo|NULL`.

## Three things the padded rows give you

- **Completeness.** Reports that must list every customer, product or day, even the empty
  ones, start from the complete table and `LEFT JOIN` the facts onto it.
- **The anti-join.** `WHERE o.id IS NULL` after the join keeps only the padded rows: the
  customers with no orders at all.
- **Zero counts.** `COUNT(o.id)` skips `NULL`, so a padded row counts as 0. `COUNT(*)` would
  count it as 1.

## Where the condition goes

Conditions on the **right-hand** table that decide what counts as a match belong in `ON`. In
`WHERE` they run after the padding and remove the very rows you wanted to keep. Conditions on
the **left-hand** table can go in `WHERE` as usual.
'''

