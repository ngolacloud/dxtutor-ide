intro = '''
Each round of the recursion is one join between the rows found in the previous round and
`staff`, so a tree of depth d needs d rounds and visits every employee exactly once. The
depth and the path are state carried from parent to child.
'''
prompt = '''
Build a small org chart where each employee has a `boss_id`, then walk it from the top with
a recursive CTE that carries the depth and the chain of names, and list it ordered by path.
'''
target = '''
CREATE TABLE staff (id INTEGER PRIMARY KEY, name TEXT, boss_id INTEGER);
INSERT INTO staff VALUES
  (1, 'Ada', NULL), (2, 'Ben', 1), (3, 'Cleo', 1),
  (4, 'Dan', 2), (5, 'Eve', 4), (6, 'Fay', 3);
WITH RECURSIVE chain(id, name, depth, path) AS (
  SELECT id, name, 0, name
  FROM staff
  WHERE boss_id IS NULL
  UNION ALL
  SELECT s.id, s.name, c.depth + 1, c.path || ' > ' || s.name
  FROM staff AS s
  JOIN chain AS c ON s.boss_id = c.id
)
SELECT depth, path
FROM chain
ORDER BY path;
'''
line_comments = [
  "Each employee points to their boss; the top has none.",
  "Starts a multi-row INSERT.",
  "Ada runs the company; Ben and Cleo report to her.",
  "Dan reports to Ben, Eve to Dan, and Fay to Cleo.",
  "The CTE carries four columns, including the depth and the path so far.",
  "The anchor row: the root at depth 0, its path is just its name.",
  "Reads the staff table...",
  "...keeping only the employee with no boss.",
  "Adds the rows of each following round.",
  "A child: one level deeper, with its name appended to the parent's path.",
  "Reads the staff table again...",
  "...matching employees whose boss was found in the previous round.",
  "Closes the CTE; the leaves have no children, so the walk stops by itself.",
  "Shows the depth and the full chain of command.",
  "Reads the walked tree.",
  "Sorting by path lists each subtree right under its root.",
]
explanation = '''
It printed:

```
depth|path
0|Ada
1|Ada > Ben
2|Ada > Ben > Dan
3|Ada > Ben > Dan > Eve
1|Ada > Cleo
2|Ada > Cleo > Fay
```

No explicit stop was needed: when the round reached Eve and Fay, the join found nobody whose
boss was one of them. Ordering by the path string gives a depth-first listing: a parent's
path is a prefix of its children's, and a prefix sorts before anything that extends it.
'''

[[unit.step]]
kind = "drill"
id = "sql-u17-d3-graph"
title = "Reach every node despite a cycle"
points = 10
difficulty = 23
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Reachability is the transitive closure of the edge relation. In a graph with a cycle a walk
can go around forever; with `UNION`, a node already produced is discarded instead of being
queued again, so each node is expanded at most once and the walk is linear in the edges.
'''
prompt = '''
Store a directed graph where a, b and c form a cycle, then list every node reachable from
`a` using a recursive CTE with `UNION`.
'''
target = '''
CREATE TABLE links (src TEXT, dst TEXT);
INSERT INTO links VALUES
  ('a', 'b'), ('b', 'c'), ('c', 'a'),
  ('c', 'd'), ('e', 'f');
WITH RECURSIVE reach(node) AS (
  SELECT 'a'
  UNION
  SELECT l.dst
  FROM links AS l
  JOIN reach AS r ON l.src = r.node
)
SELECT node
FROM reach
ORDER BY node;
'''
line_comments = [
  "One row per directed edge.",
  "Starts a multi-row INSERT.",
  "a → b → c → a is a cycle.",
  "c also leads to d; e → f is a separate island.",
  "The CTE holds a single column: a node we can reach.",
  "The anchor: the start node itself.",
  "UNION, not UNION ALL: a node that was already produced is dropped.",
  "The recursive member: the destination of an edge...",
  "...from the links table...",
  "...whose source is a node reached in an earlier step.",
  "Closes the CTE; the walk ends when no new node appears.",
  "Lists the reachable nodes.",
  "Reads the closure.",
  "Alphabetical order.",
]
explanation = '''
It printed:

```
node
a
b
c
d
```

When the walk came back to `a` through `c → a`, `UNION` saw that `a` was already in the
result and dropped it, so it was never expanded again. With `UNION ALL` the same query never
finishes. `e` and `f` are not reachable from `a`, so they are absent.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u17-x1-hops"
title = "Shortest hops from station A"
points = 40
difficulty = 23
entry = "hops_from_a"
run_command = "python3 -m unittest"
intro = '''
Shortest paths in an unweighted graph are a breadth-first search. A recursive CTE can do
one if each queued row carries a hop count and the walk is bounded, and `MIN` per station
then picks the shortest. The hidden tests contain cycles and abort any query that does not
stop.
'''
instructions = '''
## Your turn

Write **ONE query** (a single statement, starting with `WITH RECURSIVE`).

```sql
CREATE TABLE routes (
  src TEXT NOT NULL,   -- departure station
  dst TEXT NOT NULL    -- arrival station (one-way)
);
```

Each row is a direct, one-way connection. Starting from station `'A'`, return every
**other** station you can reach, with the **minimum number of hops** (connections taken) to
get there.

- The network may contain cycles, self-loops and duplicate routes. Your query must stop.
- `'A'` itself is never in the result, even if a cycle leads back to it.
- Stations that cannot be reached from `'A'` are not in the result.
- Paths can be long: do not hard-code a maximum depth such as 10.

Columns, in this order: `station`, `hops`. Order by `hops`, then `station`.

## Example

Routes `A→B`, `B→C`, `A→C`, `C→D`, `D→A`, `E→F`:

```
station|hops
B|1
C|1
D|2
```

`C` is 1 hop away through `A→C`, even though `A→B→C` also exists. `D→A` closes a cycle and
`E`, `F` are unreachable. Hidden tests decide correctness.
'''
starter = '''
-- hops_from_a: write your query below
-- Hint: carry (station, hops) in a recursive CTE, bound the walk so cycles stop,
--       then take MIN(hops) per station.
'''
tests = '''
SCHEMA = "CREATE TABLE routes (src TEXT NOT NULL, dst TEXT NOT NULL);"


def routes(*pairs):
    values = ", ".join("('%s', '%s')" % p for p in pairs)
    return SCHEMA + ("INSERT INTO routes VALUES %s;" % values if pairs else "")


class HopsFromATest(unittest.TestCase):
    def run_student(self, setup):
        conn = connect(setup)
        budget = [0]

        def guard():
            budget[0] += 1
            return 1 if budget[0] > 20000 else 0

        conn.set_progress_handler(guard, 1000)
        try:
            cur = conn.execute(STUDENT_SQL)
            cols = [d[0] for d in cur.description or []]
            rows = [tuple(r) for r in cur.fetchall()]
        except sqlite3.OperationalError as e:
            if "interrupt" in str(e):
                self.fail("the query did not stop: is there a stopping condition for cycles?")
            raise
        finally:
            conn.close()
        return cols, rows

    def test_columns(self):
        cols, _ = self.run_student(routes(("A", "B")))
        self.assertEqual(cols, ["station", "hops"])

    def test_example(self):
        _, rows = self.run_student(
            routes(("A", "B"), ("B", "C"), ("A", "C"), ("C", "D"), ("D", "A"), ("E", "F"))
        )
        self.assertEqual(rows, [("B", 1), ("C", 1), ("D", 2)])

    def test_shortcut_beats_long_path(self):
        _, rows = self.run_student(
            routes(("A", "B"), ("B", "C"), ("C", "D"), ("D", "E"), ("A", "E"))
        )
        self.assertEqual(rows, [("B", 1), ("E", 1), ("C", 2), ("D", 3)])

    def test_cycles_self_loops_and_duplicates_stop(self):
        _, rows = self.run_student(
            routes(("A", "A"), ("A", "B"), ("A", "B"), ("B", "B"), ("B", "C"), ("C", "B"),
                   ("C", "A"), ("X", "A"))
        )
        self.assertEqual(rows, [("B", 1), ("C", 2)])

    def test_dense_cycle(self):
        nodes = "ABCDEF"
        pairs = [(s, d) for s in nodes for d in nodes if s != d]
        _, rows = self.run_student(routes(*pairs))
        self.assertEqual(rows, [(n, 1) for n in "BCDEF"])

    def test_long_chain_has_no_fixed_depth(self):
        names = ["A"] + ["S%03d" % i for i in range(1, 41)]
        pairs = list(zip(names, names[1:])) + [(names[-1], "A")]
        _, rows = self.run_student(routes(*pairs))
        self.assertEqual(rows, [(n, i) for i, n in enumerate(names) if i > 0])

    def test_unreachable_stations_are_left_out(self):
        _, rows = self.run_student(routes(("B", "C"), ("C", "A"), ("D", "E"), ("A", "Z")))
        self.assertEqual(rows, [("Z", 1)])

    def test_no_routes_from_a(self):
        _, rows = self.run_student(routes(("B", "C"), ("C", "A")))
        self.assertEqual(rows, [])
        _, rows = self.run_student(SCHEMA)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
WITH RECURSIVE walk(station, hops) AS (
  SELECT 'A', 0
  UNION
  SELECT r.dst, w.hops + 1
  FROM walk AS w
  JOIN routes AS r ON r.src = w.station
  WHERE w.hops < (SELECT COUNT(*) FROM routes)
)
SELECT station, MIN(hops) AS hops
FROM walk
WHERE station <> 'A'
GROUP BY station
ORDER BY hops, station;
'''
time = "O(E² log(V·E))"
space = "O(V·E)"
justification = '''
A shortest path never repeats a route, so it uses at most **E** hops (E = number of routes,
V = number of stations). The bound `w.hops < (SELECT COUNT(*) FROM routes)` therefore never
cuts off an answer, and it guarantees termination even on cycles: hops only grow, and the
recursive member stops producing rows once they reach E.

`UNION` dedupes whole `(station, hops)` rows, so each station is queued at most once per hop
count: at most **V·(E + 1)** rows, which is the **O(V·E)** space. At each hop level every
queued station follows its outgoing routes once, so a level costs at most E join steps, and
there are at most E + 1 levels: **O(E²)** candidate rows. Each one is looked up in the
B-tree SQLite keeps to enforce `UNION` (a **log** factor), and the join on `src` uses an
automatic index SQLite builds on `routes(src)`. The final `GROUP BY` and sort are cheaper.

A plain BFS would expand each station only once (O(V + E)), but SQL's `UNION` cannot drop a
station that comes back with a larger hop count, because the row differs. Tracking the
visited path in a string avoids repeats too, yet it enumerates every simple path, which is
exponential on dense graphs.
'''

[[unit]]
id = "sql-u18-window-ranking"
title = "Window functions: ranking"
level = "advanced"
difficulty = 24
intro = '''
`GROUP BY` answers questions about groups but throws the individual rows away. Window
functions keep every row and add a value computed over a set of related rows, such as its
position in a ranking. You will compare `ROW_NUMBER`, `RANK` and `DENSE_RANK` on tied data,
rank inside partitions, and then solve the classic top-N-per-group problem with ties.
'''
concepts = '''
## The idea

"Who is the top seller in each region?" is awkward with `GROUP BY`: the grouping gives you
the maximum per region, but not the row that holds it, so you end up joining the result back
to the table. What you really want is to keep every row and **annotate** it with its
position among its peers.

A **window function** does exactly that. For each row it looks at a **window**, a set of
rows related to the current one, and computes a value from it. Unlike an aggregate with
`GROUP BY`, the rows are not collapsed: the output has as many rows as the input.

## How SQL expresses it

A window function is followed by `OVER (...)`, which describes the window:

```sql
SELECT name, dept, salary,
       RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS pos
FROM staff;
```

- `PARTITION BY` splits the rows into independent groups; the ranking restarts in each one.
  Without it, the whole result is one partition.
- `ORDER BY` inside `OVER` decides the order used for ranking. It does **not** sort the
  output; you still need an outer `ORDER BY` for that.

The three ranking functions differ only on **ties** (rows with equal sort keys):

| points | `ROW_NUMBER()` | `RANK()` | `DENSE_RANK()` |
|---|---|---|---|
| 90 | 1 | 1 | 1 |
| 90 | 2 | 1 | 1 |
| 85 | 3 | 3 | 2 |

`ROW_NUMBER` numbers rows 1, 2, 3 regardless of ties. `RANK` gives tied rows the same
number and then **skips** (1, 1, 3), as in a sports ranking. `DENSE_RANK` gives the same
number without gaps (1, 1, 2).

A `WINDOW` clause names a window once so several functions can share it:
`... OVER w ... WINDOW w AS (PARTITION BY dept ORDER BY salary DESC)`.

## How SQLite runs it

Window functions are evaluated **after** `WHERE`, `GROUP BY` and `HAVING`, and before the
final `ORDER BY` and `LIMIT`. SQLite sorts the rows by the partition and window order, then
walks them once, resetting the counter at each new partition. SQLite supports window
functions since 3.25 (2018), MySQL since 8.0, PostgreSQL for much longer.

## What is special or tricky

- Because windows are computed after `WHERE`, you **cannot filter on them** in the same
  query: `WHERE RANK() OVER (...) <= 3` is an error. Compute the rank in a CTE or subquery,
  then filter outside.
- `ROW_NUMBER` with ties is **not deterministic**: which tied row gets 1 is up to the engine.
  Add a tie-breaker column to the window's `ORDER BY` when the numbers must be stable.
- Choose the function by the question: "exactly N rows" is `ROW_NUMBER`, "places in a
  competition" is `RANK`, "the top N distinct values" is `DENSE_RANK`.
- In `ORDER BY ... DESC`, SQLite puts NULLs last, so NULL values still receive a rank.

## What you will practise

You will place the three functions side by side on tied scores, rank employees inside each
department, and keep the top two products per category. The challenge awards medals, where
ties decide who stands on the podium.
'''

[[unit.step]]
kind = "concept"
id = "sql-u18-c1-over"
title = "OVER, PARTITION BY and ties"
points = 5
difficulty = 24
intro = '''
A window function is a computation over a sorted partition of the result, not over a
group. The engine sorts once by (partition keys, order keys) and then streams the rows,
which is why a ranking costs O(n log n) like any sort.
'''
body = '''
## Aggregate versus window

```sql
-- one row per department
SELECT dept, MAX(salary) FROM staff GROUP BY dept;

-- one row per employee, with the department's ranking attached
SELECT name, dept, salary,
       DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) AS pos
FROM staff;
```

The first query collapses each department to a single row. The second keeps every employee
and adds a column; an employee with `pos = 1` earns the department's top salary, and you
still know their name.

## Reading an OVER clause

- `PARTITION BY dept`: rank each department separately. Optional.
- `ORDER BY salary DESC`: the order that defines first, second, third. Required for ranking
  to mean anything.
- No `PARTITION BY`: the whole result is one partition.

## Picking the right function

Given salaries 120, 120, 100 in one department:

- `ROW_NUMBER()` → 1, 2, 3. Unique numbers; the two 120s get 1 and 2 in an unspecified
  order unless you add a tie-breaker such as `ORDER BY salary DESC, name`.
- `RANK()` → 1, 1, 3. Ties share a place, and the next place is skipped.
- `DENSE_RANK()` → 1, 1, 2. Ties share a place, no gaps.

## Filtering on a rank

A rank exists only after `WHERE` has run, so filter in an outer query:

```sql
WITH ranked AS (
  SELECT *, RANK() OVER (ORDER BY salary DESC) AS pos FROM staff
)
SELECT * FROM ranked WHERE pos <= 3;
```
'''

