`json_each` is a table-valued function, and writing it after a comma in `FROM` makes a
lateral join: for every post, SQLite walks that post's array and emits one row per element.
A post with an empty array contributes no rows, exactly like an inner join with no match.
Once the elements are rows, `GROUP BY` and `EXISTS` work on them as on any table.
