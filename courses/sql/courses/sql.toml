[[unit.step]]
kind = "drill"
id = "sql-udb6-d2-excluded"
title = "Merge with DO UPDATE and excluded"
points = 10
difficulty = 21
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
`DO UPDATE` runs an `UPDATE` on the conflicting row instead of inserting. The pseudo-table
`excluded` holds the values that were proposed, so the new row can be combined with the stored
one: here, adding counts together, in one atomic statement per event.
'''
prompt = '''
Count page views with an upsert that inserts a new path with its count or adds the count to an
existing path, then print the totals.
'''
target = '''
CREATE TABLE page_views (
  path TEXT PRIMARY KEY,
  views INTEGER NOT NULL
);
INSERT INTO page_views (path, views) VALUES ('/home', 1)
ON CONFLICT (path) DO UPDATE SET views = views + excluded.views;
INSERT INTO page_views (path, views) VALUES ('/home', 1)
ON CONFLICT (path) DO UPDATE SET views = views + excluded.views;
INSERT INTO page_views (path, views) VALUES ('/about', 1), ('/home', 5)
ON CONFLICT (path) DO UPDATE SET views = views + excluded.views;
SELECT path, views FROM page_views ORDER BY views DESC;
'''
line_comments = [
  "Creates a counter table.",
  "One row per path.",
  "How many views so far.",
  "Ends the table definition.",
  "The first view of /home: no conflict, so the row is inserted with 1...",
  "...and this DO UPDATE clause is not used.",
  "A second view of /home: the key exists...",
  "...so the stored 1 plus the proposed 1 becomes 2.",
  "A batch: /about is new, /home arrives with 5 views...",
  "...so /about is inserted and /home goes from 2 to 7.",
  "Prints the counters, most viewed first.",
]
explanation = '''
It printed:

```
path|views
/home|7
/about|1
```

In `SET views = views + excluded.views`, `views` is the value already stored and
`excluded.views` the value that was proposed. Note that this upsert is **not** idempotent:
replaying an event counts it twice. Counters that must survive retries record a unique event id
and use `DO NOTHING` on it.
'''

