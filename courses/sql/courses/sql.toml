intro = '''
Aggregating into JSON is the inverse of unnesting: a group of rows collapses into one array
or object. The aggregate sees rows in whatever order the plan produces them, so an
`ORDER BY` inside the call is what makes the array deterministic. With a `LEFT JOIN`, a group
with no matches still exists and holds one row of NULLs, which needs a `FILTER`.
'''
prompt = '''
Join customers to orders, build each customer's array of order totals, build one JSON object
per customer (including a customer with no orders), and map names to ids with
`json_group_object`.

**Why:** many APIs return nested JSON. Building it in one query avoids a loop of per-customer
queries in application code.
'''
target = '''
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT);
CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, total INTEGER);
INSERT INTO customers VALUES (1, 'Ana'), (2, 'Bo'), (3, 'Cy');
INSERT INTO orders VALUES (10, 1, 40), (11, 1, 15), (12, 2, 99);

SELECT c.name, json_group_array(o.total ORDER BY o.id) AS totals
FROM customers AS c
JOIN orders AS o ON o.customer_id = c.id
GROUP BY c.id
ORDER BY c.name;

SELECT json_object(
         'customer', c.name,
         'orders', COUNT(o.id),
         'ids', json_group_array(o.id ORDER BY o.id) FILTER (WHERE o.id IS NOT NULL)
       ) AS doc
FROM customers AS c
LEFT JOIN orders AS o ON o.customer_id = c.id
GROUP BY c.id
ORDER BY c.id;

SELECT json_group_object(name, id ORDER BY id) AS by_name FROM customers;
'''
