  "Keeps rows whose price is greater than 5; `ORDER BY name` sorts the output alphabetically.",
  "Both conditions must hold: a tea *and* cheaper than 4.",
  "`<>` means not equal: everything except coffee.",
  "No parentheses: `AND` binds first, so this means tea, OR (coffee AND price above 8).",
