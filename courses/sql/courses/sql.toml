[[unit.step]]
kind = "drill"
id = "sql-u19-d3-lag-lead"
title = "Compare with yesterday and tomorrow"
points = 10
difficulty = 25
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
`LAG` and `LEAD` read a value at a fixed offset in the sorted partition. Since the rows are
already sorted for the window, each lookup is constant time, which replaces the self-join
on "previous key" you would otherwise write and its extra index seek per row.
'''
prompt = '''
Store daily visit counts and show, for each day, the previous day's count, the change from
it, and the next day's count with 0 when there is none.
'''
target = '''
CREATE TABLE visits (day INTEGER PRIMARY KEY, n INTEGER);
INSERT INTO visits VALUES (1, 120), (2, 150), (3, 90), (4, 160);
SELECT day, n,
       LAG(n) OVER w AS prev,
       n - LAG(n) OVER w AS change,
       LEAD(n, 1, 0) OVER w AS next
FROM visits
WINDOW w AS (ORDER BY day)
ORDER BY day;
'''
line_comments = [
  "One count per day.",
  "Four days of visits.",
  "Keeps every day.",
  "The count one row earlier; NULL on the first row.",
  "Today minus yesterday; NULL minus anything is NULL.",
  "The count one row later, or the default 0 on the last row.",
  "Reads the table.",
  "One shared window, ordered by day.",
  "In day order.",
]
explanation = '''
It printed:

```
day|n|prev|change|next
1|120|NULL|NULL|150
2|150|120|30|90
3|90|150|-60|160
4|160|90|70|0
```

`LAG` and `LEAD` count rows, not days: if day 3 were missing, day 4's `prev` would be day
2's count. When gaps matter, generate the full calendar first (a recursive CTE) and join the
data to it.
'''

