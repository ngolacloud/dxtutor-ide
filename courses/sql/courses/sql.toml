[[unit]]
id = "sql-udb1-transactions"
title = "Transactions: all or nothing"
level = "intermediate"
difficulty = 16
intro = '''
A transaction groups several statements so that either all of them take effect or none do.
You will open one with `BEGIN`, keep its work with `COMMIT`, throw it away with `ROLLBACK`,
and undo only part of it with a `SAVEPOINT`. The challenge is a money transfer script that can
never leave the books half-updated.
'''
concepts = '''
## The idea

Many real operations need more than one statement. Moving money subtracts from one account, adds to another and records the transfer in a third table. If the second statement fails after the first one succeeded, money vanishes. A **transaction** makes the group **atomic**: the database applies all of it or none of it.

Transactions bring the **ACID** guarantees: **A**tomicity (all or nothing), **C**onsistency (constraints hold when it ends), **I**solation (other connections never see half-finished work) and **D**urability (once committed, the changes survive a crash). The database keeps a journal of what it changed, which is how it can put every page back exactly as it was.

## How SQL expresses it

```sql
BEGIN;
UPDATE stock SET qty = qty - 1 WHERE item = 'pen';
INSERT INTO sales (item) VALUES ('pen');
COMMIT;          -- or ROLLBACK; to discard both
```

Without `BEGIN`, SQLite runs in **autocommit** mode: every statement is its own little transaction, committed the moment it finishes. `BEGIN` switches that off until `COMMIT` keeps the changes or `ROLLBACK` throws them all away. Your own statements see the pending changes; other connections do not, until the commit.

A **savepoint** is a named mark inside a transaction. `ROLLBACK TO name` undoes everything after the mark but keeps the transaction open, and `RELEASE name` forgets the mark and keeps the work. Savepoints nest, so they are how SQL expresses "try this step, and undo just this step if it goes wrong".

SQLite allows one writer at a time. Plain `BEGIN` (which means `BEGIN DEFERRED`) takes the write lock only at the first write; `BEGIN IMMEDIATE` takes it at once, which avoids "database is locked" errors in a transaction that reads first and writes later. PostgreSQL also accepts `START TRANSACTION`, and MySQL commits implicitly before most DDL, whereas SQLite and PostgreSQL can roll back a `CREATE TABLE`.

## What is special or tricky

- When a statement fails a constraint, SQLite undoes **that statement only**. The transaction stays open with the earlier statements' changes still pending. Someone must then issue `ROLLBACK`: the application, or the connection closing.
- Outside a transaction there is nothing to roll back: the statements before the failing one are already committed.
- An `UPDATE` that matches no row is not an error. A transaction does not check your business rules; constraints do.
- `BEGIN` inside an open transaction fails with "cannot start a transaction within a transaction". Use savepoints to nest.
- Keep transactions short. While one holds the write lock, every other writer waits.

## What you will practise

You will commit a transfer, roll back a `DELETE` that forgot its `WHERE`, and undo part of a transaction with a savepoint. The challenge is a transfer script whose every failure, whichever statement causes it, leaves the database untouched.
'''

[[unit.step]]
kind = "concept"
id = "sql-udb1-c1-begin-commit"
title = "BEGIN, COMMIT, ROLLBACK and SAVEPOINT"
points = 5
difficulty = 16
intro = '''
Atomicity is the A in ACID. Before changing a page, the database records how to undo the
change (in a rollback journal or a write-ahead log), so a rollback, or recovery after a
crash, can restore the state at `BEGIN` exactly.
'''
body = '''
## The life of a transaction

```sql
BEGIN;                                   -- autocommit is off from here
UPDATE accounts SET balance = balance - 30 WHERE id = 1;
UPDATE accounts SET balance = balance + 30 WHERE id = 2;
COMMIT;                                  -- both changes become permanent
```

- **`BEGIN`** opens the transaction. Changes are pending, visible only to this connection.
- **`COMMIT`** makes every pending change permanent and visible to everyone.
- **`ROLLBACK`** discards every change since `BEGIN`, as if none of it had run.

Without `BEGIN`, each statement commits on its own the moment it succeeds.

## Undoing part of the work

```sql
BEGIN;
INSERT INTO cart VALUES ('book', 1);
SAVEPOINT extras;
INSERT INTO cart VALUES ('gift wrap', 1);
ROLLBACK TO extras;      -- the gift wrap is gone, the book stays
RELEASE extras;          -- drop the mark
COMMIT;
```

`ROLLBACK TO` rewinds to the mark **without** ending the transaction, so you still finish with
`COMMIT` (or a full `ROLLBACK`).

## When a statement fails

A constraint violation (`CHECK`, `UNIQUE`, `FOREIGN KEY`, `NOT NULL`) cancels only the
statement that broke it. Inside a transaction, the earlier statements are still pending and
the transaction is still open, so the client rolls it back and nothing is left behind.
Outside one, the earlier statements were already committed, and there is nothing to undo.
'''

