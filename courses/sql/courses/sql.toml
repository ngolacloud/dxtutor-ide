[[unit.step]]
kind = "challenge"
id = "sql-u10-x1-top-earners"
title = "Top earners per department"
points = 30
difficulty = 10
entry = "top_earners"
intro = '''
"The maximum of each group, and the rows that hold it" is a classic that `GROUP BY` alone cannot
answer, because grouping keeps one row per group and ties need several. A correlated subquery
compares every row with its own group's maximum; the hidden tests check ties and departments
where nobody has a salary.
'''
instructions = '''
## Your turn

Write **one query** (a single `SELECT` statement) against this table:

```sql
CREATE TABLE employees (
  id INTEGER PRIMARY KEY,
  name TEXT,
  department TEXT,
  salary INTEGER     -- may be NULL
);
```

For every department, return the employees whose salary equals the **highest salary in their
own department**. If several employees share the top salary, return all of them. An employee
whose salary is `NULL` never qualifies, so a department where every salary is `NULL` returns
nobody.

Return exactly these columns, in this order:

| column | meaning |
|---|---|
| `department` | the department |
| `name` | the employee's name |
| `salary` | their salary |

Sort by `department`, then by `name`, both alphabetically.

Example. With Ana (eng, 100), Bo (eng, 120), Cy (eng, 120), Di (ops, 90) and Ed (ops, `NULL`):

```text
department|name|salary
eng|Bo|120
eng|Cy|120
ops|Di|90
```

Hidden tests decide correctness.
'''
starter = '''
-- top_earners: write your query below
-- Hint: compare each salary with a subquery that finds the maximum of the same department.
'''
tests = '''
SCHEMA = """
CREATE TABLE employees (
  id INTEGER PRIMARY KEY,
  name TEXT,
  department TEXT,
  salary INTEGER
);
"""


def staff(*people):
    rows = ", ".join(
        "('%s', '%s', %s)" % (n, d, "NULL" if s is None else s) for n, d, s in people
    )
    if not rows:
        return SCHEMA
    return SCHEMA + "INSERT INTO employees (name, department, salary) VALUES " + rows + ";"


BASE = staff(
    ("Ana", "eng", 100), ("Bo", "eng", 120), ("Cy", "eng", 120),
    ("Di", "ops", 90), ("Ed", "ops", None),
    ("Fe", "sales", None), ("Gil", "sales", None),
    ("Ho", "hr", 50),
)


class TopEarnersTest(unittest.TestCase):
    def test_columns(self):
        cols, _ = query(BASE)
        self.assertEqual(cols, ["department", "name", "salary"])

    def test_ties_and_order(self):
        _, rows = query(BASE)
        self.assertEqual(
            rows,
            [("eng", "Bo", 120), ("eng", "Cy", 120), ("hr", "Ho", 50), ("ops", "Di", 90)],
        )

    def test_maximum_is_per_department(self):
        setup = staff(
            ("Zoe", "a", 10), ("Yan", "a", 5),
            ("Xu", "b", 1000), ("Wes", "b", 999),
            ("Val", "c", 7),
        )
        _, rows = query(setup)
        self.assertEqual(rows, [("a", "Zoe", 10), ("b", "Xu", 1000), ("c", "Val", 7)])

    def test_everyone_tied(self):
        setup = staff(("Cy", "lab", 3), ("Al", "lab", 3), ("Bea", "lab", 3))
        _, rows = query(setup)
        self.assertEqual(rows, [("lab", "Al", 3), ("lab", "Bea", 3), ("lab", "Cy", 3)])

    def test_null_salaries_never_qualify(self):
        setup = staff(("Al", "x", None), ("Bo", "x", None), ("Cy", "y", None), ("Di", "y", 1))
        _, rows = query(setup)
        self.assertEqual(rows, [("y", "Di", 1)])

    def test_empty_table(self):
        _, rows = query(SCHEMA)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
SELECT e.department, e.name, e.salary
FROM employees AS e
WHERE e.salary = (
  SELECT MAX(e2.salary)
  FROM employees AS e2
  WHERE e2.department = e.department
)
ORDER BY e.department, e.name;
'''
time = "O(n²)"
space = "O(n)"
justification = '''
SQLite **scans** `employees` once (**n** rows) and, for each row, runs the correlated subquery
for that row's department (`CORRELATED SCALAR SUBQUERY 1` in the plan). There is no index on
`department`, so every run reads the whole table again to find that department's `MAX`: n runs
of O(n) each, **O(n²)** time. SQLite does not build an automatic index for a correlated scalar
subquery, so the quadratic loop is real; on 100 000 employees it means ten billion row visits.
The final `ORDER BY` sorts the qualifying rows into a temporary B-tree, O(n log n) time and
**O(n)** space.

The fix is an index, not a different query: with
`CREATE INDEX emp_dept_salary ON employees(department, salary)`, each `MAX` becomes a single O(log n) seek to the last entry of the department, and
the whole query drops to **O(n log n)**. `MAX` ignores `NULL`, and `NULL = NULL` is not true,
so an employee without a salary never qualifies and an all-`NULL` department returns nobody.
The tempting `SELECT department, name, MAX(salary) ... GROUP BY department` relies on SQLite's
bare columns: it returns one arbitrary holder of the maximum and loses the ties.
'''

[[unit]]
id = "sql-u11-set-operations"
title = "Set operations: UNION, INTERSECT and EXCEPT"
level = "intermediate"
difficulty = 11
intro = '''
Joins put tables side by side; set operations stack result sets on top of each other. You will
combine queries with `UNION` and `UNION ALL`, find common and missing rows with `INTERSECT` and
`EXCEPT`, and sort a compound result, learning which operators remove duplicates and what that
costs the engine.
'''
concepts = '''
## The idea

A query result is a set of rows, so the operations of set theory apply to it. Given two queries
that return the same number of columns:

- **union** gives the rows in either result;
- **intersection** gives the rows in both;
- **difference** gives the rows in the first but not the second.

Where a join widens the result with more columns, a set operation lengthens or shortens it while
keeping the columns. Relational algebra writes them A ∪ B, A ∩ B and A − B.

## How SQL expresses it

```sql
SELECT city FROM customers
UNION
SELECT city FROM suppliers
ORDER BY city;
```

- The queries must be **union-compatible**: the same number of columns. The column names come
  from the **first** `SELECT`; the others are matched by position, not by name.
- `UNION`, `INTERSECT` and `EXCEPT` return **distinct** rows. `UNION ALL` keeps every row,
  duplicates included.
- One `ORDER BY` and one `LIMIT` apply to the **whole** compound, and they go at the very end.
  In SQLite an `ORDER BY` term must name a result column (by its name from the first `SELECT`,
  or by its position, such as `ORDER BY 1`).
- Duplicate removal treats two `NULL`s as equal, unlike `=`. A `NULL` in both inputs survives
  an `INTERSECT`, and a `NULL` on the right of `EXCEPT` removes one on the left.

## SQLite specifics and pitfalls

- **`UNION` is not free.** To remove duplicates SQLite inserts every row into a temporary
  B-tree, or sorts both sides and merges them, O(n log n) either way. `UNION ALL` simply runs one query after the other and streams the rows,
  O(n). When the inputs cannot overlap, or duplicates are meaningful (two equal payments are
  still two payments), use `UNION ALL`.
- **Precedence.** SQLite evaluates a chain of set operators strictly left to right, so
  `A UNION B EXCEPT C` means `(A UNION B) EXCEPT C`. The SQL standard and PostgreSQL bind
  `INTERSECT` tighter than `UNION` and `EXCEPT`, and SQLite does not accept parentheses around
  the parts of a compound. When the order matters, write it in the order you mean, or use a
  subquery.
- **Dialects.** PostgreSQL also has `INTERSECT ALL` and `EXCEPT ALL`; SQLite does not. Oracle
  spells `EXCEPT` as `MINUS`, and MySQL only gained `INTERSECT` and `EXCEPT` in 8.0.31.
- **Types are not checked.** SQLite happily stacks a text column on an integer column. Keep the
  columns meaningfully aligned yourself.

## What you will practise

You will compare `UNION` with `UNION ALL`, find the rows two tables share and the rows only one
of them has, and merge two event tables into one labelled, sorted timeline. The challenge
builds a mailing list from several sources minus the people who unsubscribed.
'''

[[unit.step]]
kind = "concept"
id = "sql-u11-c1-stacking"
title = "Stacking result sets"
points = 5
difficulty = 11
intro = '''
Set operations treat whole query results as sets. The distinct versions must recognise equal
rows, which the engine does by inserting rows into a temporary index; the `ALL` version just
concatenates, which is why it is the cheaper default when duplicates cannot occur.
'''
body = '''
## Four operators

```sql
SELECT email FROM customers
UNION ALL               -- every row of both, duplicates kept
SELECT email FROM suppliers;

SELECT email FROM customers
UNION                   -- every distinct row of either
SELECT email FROM suppliers;

SELECT email FROM customers
INTERSECT               -- distinct rows present in both
SELECT email FROM suppliers;

SELECT email FROM customers
EXCEPT                  -- distinct rows of the first, missing from the second
SELECT email FROM suppliers;
```

## The rules of the stack

- Each `SELECT` must return the **same number of columns**. They are matched by position, and
  the names of the result come from the first `SELECT`.
- `WHERE`, `GROUP BY` and `HAVING` belong to each individual `SELECT`.
- `ORDER BY` and `LIMIT` belong to the **whole** compound and appear once, at the end.
- `UNION ALL` is the only operator that keeps duplicates and the only one that never needs to
  compare rows, so it is the fastest.

## Set operation or join?

A join answers "which rows relate to which", combining columns. A set operation answers "which
rows appear in which result", combining rows. `INTERSECT` and `EXCEPT` often express a
"present in both" or "missing from" question more directly than a join, and they compare whole
rows, `NULL`s included.
'''

[[unit.step]]
kind = "drill"
id = "sql-u11-d1-union"
title = "UNION versus UNION ALL"
points = 10
difficulty = 11
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
`UNION ALL` is plain concatenation: SQLite runs the first query, then the second, and streams
both. `UNION` must also recognise rows it has already produced: it collects them in a temporary
B-tree or, as here with an `ORDER BY`, sorts each side and merges the two sorted streams,
skipping repeats.
'''
prompt = '''
Collect the cities of customers and suppliers twice: once without duplicates and once with
every row kept, sorting both results.

**Why:** choosing between the two is a decision about meaning (are repeats real?) and about cost.
'''
target = '''
CREATE TABLE customers (name TEXT, city TEXT);
CREATE TABLE suppliers (company TEXT, city TEXT);
INSERT INTO customers VALUES ('Ana', 'Lisbon'), ('Bo', 'Porto'), ('Cy', 'Lisbon');
INSERT INTO suppliers VALUES ('Acme', 'Porto'), ('Bolt', 'Faro');

SELECT city FROM customers
UNION
SELECT city FROM suppliers
ORDER BY city;

SELECT city FROM customers
UNION ALL
SELECT city FROM suppliers
ORDER BY city;
'''
line_comments = [
  "Customers, each with a city.",
  "Suppliers, with a differently named first column but also a city.",
  "Two customers live in Lisbon, one in Porto.",
  "One supplier in Porto, one in Faro.",
  "",
  "The first query of the compound names the result column.",
  "UNION keeps each distinct row once.",
  "The second query must also return one column.",
  "One ORDER BY, at the end, sorts the whole compound.",
  "",
  "The same two queries...",
  "...combined with UNION ALL, which keeps every row.",
  "Suppliers again.",
  "Sorts the five rows.",
]
explanation = '''
The two queries printed:

```text
city
Faro
Lisbon
Porto
city
Faro
Lisbon
Lisbon
Porto
Porto
```

`UNION` collapsed the second Lisbon (from two customers) and the second Porto (from a customer
and a supplier), because it removes duplicates across **and** within its inputs. `UNION ALL`
returned all five rows. Both results are named `city` after the first `SELECT`.
'''

[[unit.step]]
kind = "drill"
id = "sql-u11-d2-intersect-except"
title = "INTERSECT and EXCEPT"
points = 10
difficulty = 11
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
`INTERSECT` and `EXCEPT` either build a temporary index from one side and probe it with the
other, or sort both sides and merge them, emitting distinct rows. They compare whole rows with
"is the same as" rather than `=`, so two `NULL`s count as equal.
'''
prompt = '''
Given the students of two terms, find those enrolled in both terms and those enrolled only in
spring. One student's name is missing in each term.

**Why:** "in both lists" and "in this list but not that one" are everyday reconciliation tasks.
'''
target = '''
CREATE TABLE spring (student TEXT);
CREATE TABLE autumn (student TEXT);
INSERT INTO spring VALUES ('ana'), ('bo'), ('cy'), ('cy'), (NULL);
INSERT INTO autumn VALUES ('bo'), ('cy'), ('di'), (NULL);

SELECT student AS both_terms FROM spring
INTERSECT
SELECT student FROM autumn
ORDER BY 1;

SELECT student AS spring_only FROM spring
EXCEPT
SELECT student FROM autumn
ORDER BY 1;
'''
line_comments = [
  "The spring term's enrollments.",
  "The autumn term's enrollments.",
  "Cy is listed twice in spring, and one row has no name.",
  "Autumn also has a row with no name.",
  "",
  "The alias here names the result column.",
  "INTERSECT keeps distinct rows found in both inputs.",
  "The autumn side.",
  "Sorts by the first result column; NULL sorts first.",
  "",
  "Students of spring...",
  "...minus every row that also appears in autumn.",
  "The autumn side.",
  "Sorts by the first result column.",
]
explanation = '''
The two queries printed:

```text
both_terms
NULL
bo
cy
spring_only
ana
```

Cy appeared twice in spring but once in the result: both operators return distinct rows. The
nameless rows matched each other, so `NULL` is in the intersection and was removed by
`EXCEPT`, even though `NULL = NULL` is not true in a `WHERE` clause. Set operations ask whether
two rows are *the same*, not whether they are *equal*.
'''

[[unit.step]]
kind = "drill"
id = "sql-u11-d3-timeline"
title = "A labelled, sorted timeline"
points = 10
difficulty = 11
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A literal column tags each part of a compound with its source, and the final `ORDER BY` sorts
the stacked rows as one result. Wrapping the compound in a subquery lets you aggregate over it;
with `UNION ALL` no row is lost, and no deduplication is paid for.
'''
prompt = '''
Merge invoices and refunds into one timeline with a `kind` label and refunds as negative
amounts, then compute the balance by summing the same stack.

**Why:** combining several event tables into one feed or ledger is the most common real use of
`UNION ALL`.
'''
target = '''
CREATE TABLE invoices (id INTEGER PRIMARY KEY, day TEXT, amount INTEGER);
CREATE TABLE refunds (id INTEGER PRIMARY KEY, day TEXT, amount INTEGER);
INSERT INTO invoices (day, amount) VALUES ('2026-03-01', 120), ('2026-03-04', 80);
INSERT INTO refunds (day, amount) VALUES ('2026-03-02', 30);

SELECT day, 'invoice' AS kind, amount
FROM invoices
UNION ALL
SELECT day, 'refund', -amount
FROM refunds
ORDER BY day;

SELECT SUM(amount) AS balance
FROM (
  SELECT amount FROM invoices
  UNION ALL
  SELECT -amount FROM refunds
);
'''
line_comments = [
  "Money coming in.",
  "Money going back out, with the same shape.",
  "Two invoices.",
  "One refund, between them in time.",
  "",
  "A literal column labels every invoice row.",
  "The first source.",
  "Keeps every row: invoices and refunds never duplicate each other.",
  "The same three columns; the refund amount is negated.",
  "The second source.",
  "Sorts the merged rows by day.",
  "",
  "Aggregates over the whole stack.",
  "The compound becomes a subquery in FROM...",
  "...the invoice amounts...",
  "...stacked with UNION ALL, so equal amounts are not merged...",
  "...on top of the negated refunds.",
  "Closes the subquery.",
]
explanation = '''
The two queries printed:

```text
day|kind|amount
2026-03-01|invoice|120
2026-03-02|refund|-30
2026-03-04|invoice|80
balance
170
```

The `kind` column came from literals, named after the first `SELECT`, and `ORDER BY day`
interleaved the two sources. In the balance query `UNION` would have been a bug: two invoices
of the same amount would collapse into one row and vanish from the sum.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u11-x1-mailing-list"
title = "Build the mailing list"
points = 30
difficulty = 11
entry = "mailing_list"
intro = '''
A mailing list is a set problem: everyone from two sources, each address once, minus the people
who opted out. The hidden tests use overlapping sources, differently capitalised addresses and
missing emails, so the choice of operator, its order, and the normalisation all matter.
'''
instructions = '''
## Your turn

Write **one query** (a single compound `SELECT` statement) against these tables:

```sql
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, email TEXT);
CREATE TABLE suppliers (id INTEGER PRIMARY KEY, company TEXT, email TEXT);
CREATE TABLE unsubscribes (email TEXT);
```

Build the newsletter's mailing list:

- take the emails of all customers **and** all suppliers;
- compare emails **case-insensitively**: convert every address to lower case with `lower()`,
  and return it in lower case;
- skip rows whose `email` is `NULL`;
- remove every address that appears in `unsubscribes` (also compared in lower case);
- return each address **once**.

Return exactly one column, `email`, sorted alphabetically.

Example. Customers `ana@x.io`, `BO@x.io` and one with no email; suppliers `sales@acme.io` and
`bo@x.io`; unsubscribes `ANA@X.IO`:

```text
email
bo@x.io
sales@acme.io
```

Hidden tests decide correctness.
'''
starter = '''
-- mailing_list: write your query below
-- Hint: combine the two sources with a set operator that removes duplicates, then subtract the unsubscribes.
'''
tests = '''
SCHEMA = """
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, email TEXT);
CREATE TABLE suppliers (id INTEGER PRIMARY KEY, company TEXT, email TEXT);
CREATE TABLE unsubscribes (email TEXT);
"""

BASE = SCHEMA + """
INSERT INTO customers (name, email) VALUES
  ('Ana', 'ana@x.io'), ('Bo', 'BO@x.io'), ('Cy', NULL), ('Di', 'di@y.io');
INSERT INTO suppliers (company, email) VALUES
  ('Acme', 'sales@acme.io'), ('Bolt', 'bo@x.io'), ('Core', NULL);
INSERT INTO unsubscribes VALUES ('DI@y.io');
"""


class MailingListTest(unittest.TestCase):
    def test_columns(self):
        cols, _ = query(BASE)
        self.assertEqual(cols, ["email"])

    def test_base_list(self):
        _, rows = query(BASE)
        self.assertEqual(rows, [("ana@x.io",), ("bo@x.io",), ("sales@acme.io",)])

    def test_duplicates_collapse(self):
        setup = SCHEMA + """
        INSERT INTO customers (name, email) VALUES
          ('A', 'z@z.io'), ('B', 'z@z.io'), ('C', 'Z@Z.IO'), ('D', 'a@a.io');
        INSERT INTO suppliers (company, email) VALUES ('E', 'z@z.io'), ('F', 'a@a.io');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("a@a.io",), ("z@z.io",)])

    def test_unsubscribes_are_case_insensitive(self):
        setup = SCHEMA + """
        INSERT INTO customers (name, email) VALUES ('A', 'Mia@Mail.io'), ('B', 'lu@mail.io');
        INSERT INTO suppliers (company, email) VALUES ('C', 'ops@corp.io');
        INSERT INTO unsubscribes VALUES ('mia@mail.io'), ('OPS@CORP.IO'), ('nobody@else.io');
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("lu@mail.io",)])

    def test_nulls_are_skipped(self):
        setup = SCHEMA + """
        INSERT INTO customers (name, email) VALUES ('A', NULL), ('B', 'b@b.io');
        INSERT INTO suppliers (company, email) VALUES ('C', NULL);
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("b@b.io",)])

    def test_suppliers_only(self):
        setup = SCHEMA + """
        INSERT INTO suppliers (company, email) VALUES ('C', 'c@c.io'), ('B', 'b@b.io');
        INSERT INTO unsubscribes VALUES (NULL);
        """
        _, rows = query(setup)
        self.assertEqual(rows, [("b@b.io",), ("c@c.io",)])

    def test_everything_empty(self):
        _, rows = query(SCHEMA)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
SELECT lower(email) AS email FROM customers WHERE email IS NOT NULL
UNION
SELECT lower(email) FROM suppliers WHERE email IS NOT NULL
EXCEPT
SELECT lower(email) FROM unsubscribes
ORDER BY email;
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Each of the three `SELECT`s is a full **scan** of its table, because nothing can be seeked:
the comparison is on `lower(email)`, a computed value. That is **O(n)** reads in total for
n = customers + suppliers + unsubscribes.

SQLite evaluates the compound left to right, as `(customers UNION suppliers) EXCEPT
unsubscribes`, and because the compound has an `ORDER BY` it uses a **merge** strategy (the
plan shows `MERGE (EXCEPT)` above `MERGE (UNION)`). Each side's lower-cased addresses are
sorted into a temporary B-tree, O(n log n) in total. The union then walks the two sorted
streams side by side and emits each address once, skipping repeats; the except walks that
result against the sorted unsubscribes and drops the matches. Both merges are linear, and
their output is already in `email` order, so the final `ORDER BY` costs nothing extra.

Total **O(n log n)** time, dominated by the sorts, and **O(n)** space for the sorted copies.
`UNION ALL` would be cheaper but wrong here, because an address present in both sources (or
twice in one) must appear once.
'''

# ── g3-data ────────────────────────────────────────────────────────────

[[unit]]
id = "sql-u12-modifying-data"
title = "Changing data: UPDATE, DELETE and INSERT … SELECT"
level = "intermediate"
difficulty = 12
intro = '''
Until now every statement only read data. This unit changes it: `UPDATE` rewrites columns in
the rows a `WHERE` picks, `DELETE` removes them, and `INSERT … SELECT` copies the result of a
query into a table. You will see what each write did with `RETURNING` and `changes()`, and
build the habits that keep a write away from the wrong rows.
'''
concepts = '''
## The idea

A write statement is a query with a side effect. `UPDATE` and `DELETE` first find rows exactly
as a `SELECT` with the same `WHERE` would, and then change or remove every row they found.
That is the whole danger: the `WHERE` clause is the only thing between "fix one price" and
"fix every price". A missing or wrong condition raises no error; it silently does the wrong
thing to many rows.

`INSERT … SELECT` works the other way round. Instead of a `VALUES` list, any query supplies
the rows to insert. It is how you copy, archive or backfill data in one statement instead of
a loop.

## How SQL expresses it

```sql
UPDATE products SET price = price + 100, on_sale = 0 WHERE category = 'tools';
DELETE FROM sessions WHERE expires_at < '2026-01-01';
INSERT INTO price_history (product_id, price)
SELECT id, price FROM products WHERE category = 'tools';
```

- `SET` can assign several columns. Every expression on the right sees the row's **old**
  values, so `SET a = b, b = a` swaps two columns.
- An `UPDATE` can read another table with a correlated subquery, or with `UPDATE … FROM`
  (SQLite 3.33+ and PostgreSQL; MySQL writes `UPDATE t JOIN u ON …` instead):

```sql
UPDATE products SET price = d.price
FROM discounts AS d
WHERE d.product_id = products.id;
```

- `RETURNING` (SQLite 3.35+ and PostgreSQL, not MySQL) makes `INSERT`, `UPDATE` and `DELETE`
  return the affected rows like a `SELECT`. `SELECT changes()` returns how many rows the last
  write touched.

## Doing it safely

1. **Preview first.** Run `SELECT … WHERE <condition>` and read the rows. Then turn it into
   `UPDATE … SET` or `DELETE`, keeping the `WHERE` byte for byte.
2. **Check the count.** `changes()` or `RETURNING` tells you whether 3 rows changed when you
   expected 3, or 30 000.
3. **Mind the order.** In a script, each statement sees the effects of the ones before it.
   Copy rows to an archive *before* deleting them, and delete exactly the rows you copied.
4. **Group the steps.** A script that fails halfway leaves half its work done. Transactions
   (unit 16) make several statements succeed or fail together.

## Pitfalls

- A scalar subquery in `SET` that finds no row yields `NULL`, so
  `SET stock = stock + (SELECT qty …)` turns stock into `NULL` for every row without a match.
  Restrict the `WHERE` to rows that have one, or wrap the subquery in `COALESCE`.
- A scalar subquery that finds *several* rows silently uses the first one. Aggregate with
  `SUM` when several can match.
- `DELETE FROM t` with no `WHERE` empties the table. That is sometimes exactly what you want,
  which is why the database never warns you.
- The order of rows from `RETURNING` is not guaranteed, and it cannot take an `ORDER BY`.

## What you will practise

You will update rows and count them, delete with `RETURNING` to see what left, and archive
rows with `INSERT … SELECT` before deleting them. The challenge is a small stock-keeping
script that applies a delivery and retires discontinued products, in the right order.
'''

[[unit.step]]
kind = "concept"
id = "sql-u12-c1-writes"
title = "Writes are queries with a side effect"
points = 5
difficulty = 12
intro = '''
The engine runs `UPDATE` and `DELETE` as a search followed by a change: the same planner that
picks a table scan or an index seek for a `SELECT` decides how to find the rows to write. So
both the cost and the risk of a write live in its `WHERE` clause.
'''
body = '''
## Find the rows, then change them

Every `UPDATE` and `DELETE` runs in two phases. First the engine finds the matching rows,
exactly like a `SELECT` with the same `WHERE` (an index seek if an index fits, a full table
scan otherwise). Then it changes or removes each row it found.

```sql
-- 1. preview
SELECT id, name, price FROM products WHERE stock = 0;
-- 2. the same WHERE, now as a write
UPDATE products SET price = price / 2 WHERE stock = 0
RETURNING id, name, price;
```

- With `RETURNING`, the write hands back the affected rows with their **new** values (for a
  `DELETE`, the rows that were removed).
- Without it, `SELECT changes()` reports how many rows the last `INSERT`, `UPDATE` or
  `DELETE` touched.

## Copy with a query

```sql
INSERT INTO archive (id, name)
SELECT id, name FROM products WHERE discontinued = 1;
```

`INSERT … SELECT` inserts every row the query produces, so one statement copies a thousand
rows. The column list after the table name says where each selected value goes, by position,
so the names in the `SELECT` don't have to match.

## The rule to remember

The `WHERE` is the only safety net. Leave it out and the write applies to every row in the
table, with no error and no warning. Preview with a `SELECT`, then write with the same
condition.
'''

[[unit.step]]
kind = "drill"
id = "sql-u12-d1-update"
title = "UPDATE, then UPDATE … FROM"
points = 10
difficulty = 12
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
An `UPDATE` visits the rows its `WHERE` selects and rewrites them in place, row by row in the
table's B-tree. `UPDATE … FROM` joins another table first: for each row of the source, SQLite
seeks the target row by its primary key, so the cost follows the size of the source.
'''
prompt = '''
Preview the well-stocked products, discount them by 10% and count the rows changed, then copy
new prices in from a second table with `UPDATE … FROM`, and print the final prices.
'''
target = '''
CREATE TABLE products (id INTEGER PRIMARY KEY, name TEXT, price INTEGER, stock INTEGER);
CREATE TABLE new_prices (product_id INTEGER, price INTEGER);
INSERT INTO products VALUES
  (1, 'hammer', 1200, 40),
  (2, 'saw', 2500, 3),
  (3, 'glue', 300, 25);
INSERT INTO new_prices VALUES (2, 2300);
SELECT id, name, price FROM products WHERE stock > 20 ORDER BY id;
UPDATE products SET price = price * 90 / 100 WHERE stock > 20;
SELECT changes() AS discounted;
UPDATE products SET price = np.price
FROM new_prices AS np
WHERE np.product_id = products.id;
SELECT id, name, price FROM products ORDER BY id;
'''
line_comments = [
  "Creates the products table; prices are whole cents.",
  "A second table holding replacement prices, keyed by product id.",
  "Starts a multi-row INSERT.",
  "A hammer with 40 in stock.",
  "A saw with only 3 in stock.",
  "Glue with 25 in stock; the semicolon ends the INSERT.",
  "One new price: the saw goes down to 2300.",
  "The preview: the same WHERE the UPDATE will use, run as a SELECT.",
  "Rewrites the price of every row with more than 20 in stock; integer maths keeps whole cents.",
  "changes() reports how many rows the last write touched.",
  "UPDATE … FROM: the price comes from another table…",
  "…named np in this statement…",
  "…matched to each product by id; products without a match are left alone.",
  "Prints the final state, in id order.",
]
explanation = '''
It printed:

```text
id|name|price
1|hammer|1200
3|glue|300
discounted
2
id|name|price
1|hammer|1080
2|saw|2300
3|glue|270
```

The preview listed exactly the two rows the `UPDATE` then changed, and `changes()` confirmed
it. `UPDATE … FROM` only touched the saw, because only the saw had a matching row in
`new_prices`; that join condition plays the role of the `WHERE`.
'''

[[unit.step]]
kind = "drill"
id = "sql-u12-d2-delete-returning"
title = "DELETE … RETURNING"
points = 10
difficulty = 12
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A `DELETE` evaluates its `WHERE` for each candidate row and removes the ones where it is
true. A `NOT EXISTS` subquery inside that `WHERE` is an anti-join, probed once per candidate.
`RETURNING` hands the removed rows back, so you can log what left without a second query.
'''
prompt = '''
Count the users who have not logged in since 2025, then delete only those who never placed
an order, returning their id and email, and list who is left.
'''
target = '''
CREATE TABLE users (id INTEGER PRIMARY KEY, email TEXT, last_login TEXT);
CREATE TABLE orders (id INTEGER PRIMARY KEY, user_id INTEGER, total INTEGER);
INSERT INTO users VALUES
  (1, 'ana@example.com', '2026-10-30'),
  (2, 'bo@example.com', '2024-01-15'),
  (3, 'cy@example.com', '2023-06-02');
INSERT INTO orders VALUES (10, 3, 4500);
SELECT count(*) AS stale FROM users WHERE last_login < '2025-01-01';
DELETE FROM users
WHERE last_login < '2025-01-01'
  AND NOT EXISTS (SELECT 1 FROM orders AS o WHERE o.user_id = users.id)
RETURNING id, email;
SELECT id, email FROM users ORDER BY id;
'''
line_comments = [
  "Users with the date of their last login as ISO text, which sorts like a date.",
  "Orders point at users through user_id.",
  "Starts a multi-row INSERT.",
  "Ana logged in recently.",
  "Bo has not logged in since January 2024.",
  "Cy has not either, but Cy has an order.",
  "Cy's order: a reason to keep Cy.",
  "The preview: two users are stale.",
  "The DELETE names its table…",
  "…keeps the stale condition…",
  "…and adds an anti-join: only users with no order at all.",
  "RETURNING prints the deleted rows as a result set.",
  "Lists the survivors.",
]
explanation = '''
It printed:

```text
stale
2
id|email
2|bo@example.com
id|email
1|ana@example.com
3|cy@example.com
```

The preview found two stale users, but the `NOT EXISTS` condition protected Cy, who has an
order. `RETURNING` showed exactly the one row that left. When several rows are deleted,
their `RETURNING` order is unspecified, which is why this drill deletes just one.
'''

