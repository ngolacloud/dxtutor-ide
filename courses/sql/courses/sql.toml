entry = "longest_streak"
intro = '''
Streaks combine everything in this unit: reduce timestamps to distinct days, label the islands
per user, measure them, then keep the best one per user (top-1 per group). The hidden tests
include duplicates, month and year boundaries, ties, and tens of thousands of logins.
'''
instructions = '''
## Your turn

Write **one query** (a single statement; `WITH` is fine) over this table:

```sql
CREATE TABLE logins (
  user_id      INTEGER NOT NULL,
  logged_in_at TEXT NOT NULL      -- 'YYYY-MM-DD HH:MM:SS'
);
```

A **streak** is a run of consecutive calendar days on which a user logged in at least once.
Several logins on the same day count as one day. For every user who appears in `logins`, return
their **longest** streak, with exactly these columns:

| column | meaning |
|---|---|
| `user_id` | the user |
| `streak_start` | the first day of the streak, `'YYYY-MM-DD'` |
| `streak_end` | the last day of the streak, `'YYYY-MM-DD'` |
| `days` | the number of days in the streak |

- When a user has several streaks of the same length, return the **earliest** one.
- Sort by `user_id`.

Example:

```
(1, '2026-01-30 08:00:00'), (1, '2026-01-31 09:15:00'), (1, '2026-01-31 22:40:00'),
(1, '2026-02-01 07:30:00'), (1, '2026-02-03 12:00:00'), (2, '2026-03-10 18:00:00')
```

```
user_id|streak_start|streak_end|days
1|2026-01-30|2026-02-01|3
2|2026-03-10|2026-03-10|1
```

Hidden tests decide correctness.
'''
starter = '''
-- longest_streak: write your query below
-- Hint: first reduce the logins to DISTINCT (user, day) pairs; then
-- julianday(day) - ROW_NUMBER() OVER (PARTITION BY user ORDER BY day) labels each streak.
'''
tests = '''
from datetime import date

SCHEMA = """
CREATE TABLE logins (user_id INTEGER NOT NULL, logged_in_at TEXT NOT NULL);
"""

EXAMPLE = SCHEMA + """
INSERT INTO logins VALUES
  (1, '2026-01-30 08:00:00'), (1, '2026-01-31 09:15:00'), (1, '2026-01-31 22:40:00'),
  (1, '2026-02-01 07:30:00'), (1, '2026-02-03 12:00:00'), (2, '2026-03-10 18:00:00');
"""

COLUMNS = ["user_id", "streak_start", "streak_end", "days"]


def expected(logins):
    days = {}
    for user, ts in logins:
        days.setdefault(user, set()).add(date.fromisoformat(ts[:10]))
    out = []
    for user in sorted(days):
        best = start = prev = None
        for d in sorted(days[user]):
            if prev is None or (d - prev).days != 1:
                start = d
            length = (d - start).days + 1
            if best is None or length > best[2]:
                best = (start, d, length)
            prev = d
        out.append((user, best[0].isoformat(), best[1].isoformat(), best[2]))
    return out


class LongestStreakTest(unittest.TestCase):
    def check(self, setup):
        cols, rows = query(setup)
        self.assertEqual(cols, COLUMNS)
        logins = query(setup, "SELECT user_id, logged_in_at FROM logins")[1]
        self.assertEqual(rows, expected(logins))
        return rows

    def test_example(self):
        rows = self.check(EXAMPLE)
        self.assertEqual(rows, [(1, "2026-01-30", "2026-02-01", 3), (2, "2026-03-10", "2026-03-10", 1)])

    def test_same_day_logins_count_once(self):
        rows = self.check(SCHEMA + """
            INSERT INTO logins VALUES
              (7, '2026-04-01 08:00:00'), (7, '2026-04-01 09:00:00'), (7, '2026-04-01 10:00:00'),
              (7, '2026-04-02 08:00:00'), (7, '2026-04-02 23:59:59'), (7, '2026-04-03 00:00:00');
        """)
        self.assertEqual(rows, [(7, "2026-04-01", "2026-04-03", 3)])

    def test_ties_keep_the_earliest(self):
        rows = self.check(SCHEMA + """
            INSERT INTO logins VALUES
              (3, '2026-05-20 10:00:00'), (3, '2026-05-21 10:00:00'),
              (3, '2026-05-01 10:00:00'), (3, '2026-05-02 10:00:00'),
              (3, '2026-05-10 10:00:00');
        """)
        self.assertEqual(rows, [(3, "2026-05-01", "2026-05-02", 2)])

    def test_year_boundary(self):
        rows = self.check(SCHEMA + """
            INSERT INTO logins VALUES
              (4, '2025-12-30 21:00:00'), (4, '2025-12-31 21:00:00'),
              (4, '2026-01-01 01:00:00'), (4, '2026-01-02 01:00:00'),
              (4, '2026-01-10 01:00:00'), (4, '2026-01-11 01:00:00');
        """)
        self.assertEqual(rows, [(4, "2025-12-30", "2026-01-02", 4)])

    def test_sorted_by_user(self):
        self.check(SCHEMA + """
            INSERT INTO logins VALUES
              (30, '2026-02-01 10:00:00'), (20, '2026-02-01 10:00:00'),
              (10, '2026-02-01 10:00:00'), (20, '2026-02-02 10:00:00');
        """)

    def test_empty(self):
        cols, rows = query(SCHEMA)
        self.assertEqual(cols, COLUMNS)
        self.assertEqual(rows, [])

    def test_many_logins(self):
        self.check(SCHEMA + """
            WITH RECURSIVE n(i) AS (SELECT 0 UNION ALL SELECT i + 1 FROM n WHERE i < 59999),
            p(u, d, i) AS (SELECT i % 300 + 1, (i / 300) % 120, i FROM n)
            INSERT INTO logins
            SELECT u, datetime('2025-12-01', '+' || d || ' days',
                               '+' || (i * 7919 % 86400) || ' seconds')
            FROM p
            WHERE (d * d * u + d * 7 + u * 13) % 10 < 7;
        """)
'''

[unit.step.gabarito]
solution = '''
WITH active_days AS (
  SELECT DISTINCT user_id, date(logged_in_at) AS day
  FROM logins
),
labelled AS (
  SELECT user_id, day,
         julianday(day) - ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY day) AS grp
  FROM active_days
),
streaks AS (
  SELECT user_id, MIN(day) AS streak_start, MAX(day) AS streak_end, COUNT(*) AS days
  FROM labelled
  GROUP BY user_id, grp
),
ranked AS (
  SELECT user_id, streak_start, streak_end, days,
         ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY days DESC, streak_start) AS rn
  FROM streaks
)
SELECT user_id, streak_start, streak_end, days
FROM ranked
WHERE rn = 1
ORDER BY user_id;
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Let **n** be the number of logins. There is no index on `logins`, so SQLite **scans** the table
once and deduplicates `(user_id, day)` pairs in a temporary B-tree: **O(n log n)**. The
`ROW_NUMBER()` window needs those pairs ordered by `(user_id, day)`; the B-tree that removed the
duplicates may already deliver that order, otherwise it is another O(n log n) sort.

Grouping by `(user_id, grp)` is one more sort or temporary index over at most n rows, and the
second window ranks the streaks per user, which is at most as many rows again. Every step reads
each row a constant number of times, so the total stays **O(n log n)** time and **O(n)**
temporary space, however long the streaks are.

`DISTINCT` is not decoration: two logins on the same day would get different row numbers and
split one streak into two islands. `julianday` makes the arithmetic correct across month and
year boundaries, which subtracting day-of-month numbers would not. Ordering the ranking by
`days DESC, streak_start` makes the tie rule explicit instead of leaving it to the sorter.
'''

# ── Unit 32 · Pivoting ───────────────────────────────────────────────────────────────

[[unit]]
id = "sql-u26-pivoting"
title = "Pivoting and reports"
level = "advanced"
difficulty = 32
intro = '''
Reports are wide: one row per product, one column per month. Tables are long: one row per sale.
This unit turns long data into wide reports with conditional aggregation, counts by category with
`FILTER`, turns wide tables back into long rows, and builds a quarterly matrix with a totals row.
'''
concepts = '''
## The idea

A **pivot** rotates values of one column into column headers. Sales stored as
`(product, month, amount)` rows become a grid with a row per product and a column per month.
Relational tables are long on purpose (adding a month adds rows, not columns), but people read
grids, so reports pivot at the very end.

## How SQL expresses it

Standard SQL has no general `PIVOT` operator, and SQLite has none at all. You pivot with
**conditional aggregation**: group by the row label, and give every output column its own
aggregate that only looks at the rows that belong to it.

```sql
SELECT product,
       SUM(CASE WHEN month = 1 THEN amount ELSE 0 END) AS jan,
       SUM(CASE WHEN month = 2 THEN amount ELSE 0 END) AS feb
FROM sales
GROUP BY product;
```

The table is read **once**: each row goes to one group and feeds every `CASE`, and only the
matching one adds a non-zero amount. SQLite 3.30+ also has the standard `FILTER` clause, which
says the same thing more directly: `SUM(amount) FILTER (WHERE month = 1)`. Because SQLite
comparisons return 0 or 1, `SUM(status = 'closed')` counts matching rows, a handy shortcut that
PostgreSQL rejects (it has no implicit boolean-to-integer cast).

The opposite move, **unpivoting**, turns columns back into rows. Join every row to a small list of
column labels and pick the matching column with `CASE`. In SQLite a `VALUES` list can be that
table; its columns are named `column1`, `column2`, …, because SQLite does not accept a column
list after the alias:

```sql
SELECT b.dept, q.column1 AS quarter
FROM budget AS b CROSS JOIN (VALUES (1), (2), (3), (4)) AS q;
```

## Totals rows

SQLite has no `ROLLUP` (PostgreSQL and MySQL do: `GROUP BY ROLLUP (region)` adds subtotal rows).
Write the total as a second `SELECT` glued on with `UNION ALL`, and give every row a sort key, so
the total lands last whatever its label:

```sql
SELECT 0 AS k, name, score FROM players
UNION ALL
SELECT 1, 'Everyone', SUM(score) FROM players
ORDER BY k, name;
```

## Pitfalls

- **Missing cells.** `SUM(CASE WHEN … THEN amount END)` with no `ELSE` returns NULL for an empty
  cell, and `SUM` over no rows is NULL too. Use `ELSE 0`, or wrap in `COALESCE(…, 0)`. SQLite's
  `TOTAL()` returns 0.0, but always as a floating-point number.
- **Missing rows.** A region with no sales has no group. Start from the dimension table and
  `LEFT JOIN` the facts, so every label gets a row.
- **Columns are fixed.** The column list is part of the SQL text. A pivot whose columns depend on
  the data ("one per customer") must generate the SQL in application code, or return long rows and
  let the client draw the grid.
- **Filter before you pivot.** Date ranges and statuses belong in `WHERE`, where they can use an
  index and shrink the input, not inside every `CASE`.

## What you will practise

You will pivot sales by quarter, count tickets per status with `FILTER`, unpivot a wide budget
table, and build a quarterly revenue matrix with zero-filled cells and a totals row.
'''

[[unit.step]]
kind = "concept"
id = "sql-u26-c1-conditional"
title = "Conditional aggregation"
points = 5
difficulty = 32
intro = '''
A pivot is a `GROUP BY` whose aggregates each see a different slice of the group. One scan feeds
every column at once, which is why conditional aggregation beats a separate query or self-join
per column.
'''
body = '''
## One scan, many columns

```sql
SELECT agent,
       COUNT(*)                                   AS total,
       COUNT(*) FILTER (WHERE status = 'open')    AS open,
       SUM(CASE WHEN status = 'closed' THEN 1 ELSE 0 END) AS closed
FROM tickets
GROUP BY agent;
```

For each row SQLite finds its group (by sorting, or with a temporary index on `agent`) and updates
all the aggregates of that group. The `FILTER` and the `CASE` decide which aggregates the row
actually changes. The cost is one pass plus the grouping, whatever the number of columns.

The naive alternative, one subquery per column
(`(SELECT COUNT(*) FROM tickets t2 WHERE t2.agent = t.agent AND status = 'open')`), reads the
table again for every cell.

## Three spellings

| spelling | empty cell | portable |
|---|---|---|
| `SUM(CASE WHEN c THEN x ELSE 0 END)` | 0 | everywhere |
| `SUM(x) FILTER (WHERE c)` | NULL | PostgreSQL, SQLite 3.30+ |
| `SUM(c)` (count of true) | 0 | SQLite, MySQL |

## Percentages

Integer division truncates: `3 / 4` is 0 in SQLite and PostgreSQL. Multiply by `100.0` first, so
the arithmetic is done in floating point, and round at the end: `ROUND(100.0 * closed / total, 1)`.
'''

