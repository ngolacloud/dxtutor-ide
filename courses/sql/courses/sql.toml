intro = '''
A many-to-many relationship is a set of pairs, which is exactly what a join table stores.
Querying from either side is a join on the pair's key columns, and a `LEFT JOIN` keeps the
entities that take part in no pair, so `count` can report zero.
'''
prompt = '''
Create students, courses and an `enrollments` join table with a grade per pair, then count the
students and best grade per course and the courses per student.
'''
target = '''
CREATE TABLE students (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
CREATE TABLE courses (code TEXT NOT NULL PRIMARY KEY, title TEXT NOT NULL);
CREATE TABLE enrollments (
  student_id INTEGER NOT NULL REFERENCES students(id),
  course_code TEXT NOT NULL REFERENCES courses(code),
  grade INTEGER,
  PRIMARY KEY (student_id, course_code)
);
INSERT INTO students VALUES (1, 'Ana'), (2, 'Bo'), (3, 'Cy');
INSERT INTO courses VALUES ('DB1', 'Databases'), ('PY1', 'Python'), ('GO1', 'Go');
INSERT INTO enrollments VALUES (1, 'DB1', 17), (1, 'PY1', NULL), (2, 'DB1', 14);
SELECT c.code, c.title, count(e.student_id) AS students, max(e.grade) AS best
FROM courses AS c LEFT JOIN enrollments AS e ON e.course_code = c.code
GROUP BY c.code
ORDER BY c.code;
SELECT s.name, count(e.course_code) AS courses
FROM students AS s LEFT JOIN enrollments AS e ON e.student_id = s.id
GROUP BY s.id
ORDER BY s.id;
'''
