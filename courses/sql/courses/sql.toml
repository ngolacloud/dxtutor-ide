[[unit.step]]
kind = "drill"
id = "sql-u01-d3-types"
title = "Values, types and NULL"
points = 10
difficulty = 1
placeholder_policy = "shown"
run_command = "sqlite3 < main.sql"
intro = '''
Every value in SQLite belongs to one of five **storage classes**: `NULL`, `INTEGER`, `REAL`,
`TEXT` and `BLOB` (raw bytes). The engine looks at these types when it evaluates operators,
converting text to numbers where an operator needs a number. Comparisons produce `1` for true
and `0` for false, or `NULL` when the answer is unknown.
'''
prompt = '''
Use `typeof` to inspect values, watch SQLite convert between text and numbers, and compare
`= NULL` with `IS NULL`.

**Why:** knowing the type of a value explains most surprises, and the difference between
`= NULL` and `IS NULL` will matter in every query that filters data.
'''
target = '''
-- typeof() names the type of any value.
SELECT typeof(42) AS a, typeof(4.2) AS b, typeof('42') AS c, typeof(NULL) AS d;
SELECT typeof(7 / 2) AS int_div, typeof(7 / 2.0) AS real_div;

-- SQLite converts between text and numbers when an operator needs it.
SELECT '42' + 1 AS added, '42' || 1 AS joined;

-- NULL cannot be compared with =.
SELECT NULL = NULL AS equals, NULL IS NULL AS is_null;
SELECT 1 = 1 AS true_is, 1 = 2 AS false_is;
'''
line_comments = [
  "A comment: `typeof` is a built-in function that returns the type of its argument as text.",
  "A whole number is `integer`, a decimal is `real`, anything quoted is `text`, and `NULL` is `null`.",
  "Integer division keeps the `integer` type; dividing by `2.0` produces a `real`.",
  "",
  "A comment introducing automatic conversion.",
  "`+` needs numbers, so the text `'42'` becomes `42` and the sum is `43`; `||` needs text, so `1` becomes `'1'`.",
  "",
  "A comment introducing comparisons with NULL.",
  "Comparing with `NULL` using `=` gives `NULL` (unknown), while `IS NULL` answers a clear yes: `1`.",
  "SQLite has no separate boolean type: a true comparison is `1` and a false one is `0`.",
]
explanation = '''
The output was:

```text
a|b|c|d
integer|real|text|null
int_div|real_div
integer|real
added|joined
43|421
equals|is_null
NULL|1
true_is|false_is
1|0
```

`typeof` showed the storage class of each value. The same `'42'` became a number for `+` and
stayed text for `||`, giving `43` and `421`. `NULL = NULL` is not true but unknown (`NULL`),
which is why SQL has the separate test `IS NULL`.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u01-x1-receipt"
title = "Build a receipt line"
points = 20
difficulty = 1
entry = "receipt"
run_command = "python3 -m unittest"
intro = '''
Now you apply expressions to real rows. Adding `FROM item` makes the engine run your `SELECT`
once per row of the table, so each expression is evaluated with that row's values. This is a
**projection**: every input row produces one output row with the columns you compute.
'''
instructions = '''
## Your turn

Write **one query** (a single `SELECT` statement) that reads this table:

```sql
CREATE TABLE item (name TEXT, quantity INTEGER, unit_cents INTEGER);
```

Each row is one line of a shopping receipt: what was bought, how many, and the price of one
unit in **cents**. Prices are stored in whole cents so that no rounding ever happens.

This is your first `FROM`: putting `FROM item` at the end of the `SELECT` makes it run once
for every row of `item`, and inside your expressions a column name such as `quantity` stands
for that row's value. Unit 2 covers tables properly.

Return one row per item with exactly these columns, in this order:

| column | value |
|---|---|
| `label` | the name, a space, `x` and the quantity, e.g. `pen x3` |
| `total_cents` | the quantity times the unit price |
| `euros` | the whole euros of the total (an integer) |
| `cents` | the cents left over after the whole euros (an integer) |

Example: the row `('pen', 3, 125)` gives:

```text
label|total_cents|euros|cents
pen x3|375|3|75
```

Row order does not matter. Hidden tests run your query against several different tables,
including an empty one.
'''
starter = '''
-- receipt: write your query below
-- Hint: name every column with AS; integer division (/) and remainder (%) split the cents.
'''
tests = '''
SCHEMA = "CREATE TABLE item (name TEXT, quantity INTEGER, unit_cents INTEGER);"


def receipt(rows):
    conn = connect(SCHEMA)
    conn.executemany("INSERT INTO item VALUES (?, ?, ?)", rows)
    cur = conn.execute(STUDENT_SQL)
    cols = [d[0] for d in cur.description or []]
    result = [tuple(r) for r in cur.fetchall()]
    conn.close()
    return cols, result


class ReceiptTest(unittest.TestCase):
    def test_column_names(self):
        cols, _ = receipt([("pen", 3, 125)])
        self.assertEqual(cols, ["label", "total_cents", "euros", "cents"])

    def test_example_row(self):
        _, rows = receipt([("pen", 3, 125)])
        self.assertEqual(rows, [("pen x3", 375, 3, 75)])

    def test_whole_euros(self):
        _, rows = receipt([("notebook", 2, 250)])
        self.assertEqual(rows, [("notebook x2", 500, 5, 0)])

    def test_less_than_one_euro(self):
        _, rows = receipt([("clip", 1, 45)])
        self.assertEqual(rows, [("clip x1", 45, 0, 45)])

    def test_euros_and_cents_are_integers(self):
        _, rows = receipt([("ink", 7, 199)])
        self.assertEqual(rows, [("ink x7", 1393, 13, 93)])
        self.assertIsInstance(rows[0][2], int)
        self.assertIsInstance(rows[0][3], int)

    def test_one_line_per_item(self):
        _, rows = receipt([("pen", 3, 125), ("paper clips", 10, 3), ("desk lamp", 1, 2999)])
        expected = [
            ("pen x3", 375, 3, 75),
            ("paper clips x10", 30, 0, 30),
            ("desk lamp x1", 2999, 29, 99),
        ]
        self.assertEqual(sorted(rows), sorted(expected))

    def test_zero_quantity(self):
        _, rows = receipt([("gift card", 0, 5000)])
        self.assertEqual(rows, [("gift card x0", 0, 0, 0)])

    def test_empty_table(self):
        cols, rows = receipt([])
        self.assertEqual(cols, ["label", "total_cents", "euros", "cents"])
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
-- receipt: write your query below
SELECT name || ' x' || quantity AS label,
       quantity * unit_cents AS total_cents,
       quantity * unit_cents / 100 AS euros,
       quantity * unit_cents % 100 AS cents
FROM item;
'''
time = "O(n)"
space = "O(1)"
justification = '''
SQLite answers this with a single **full table scan**: it walks the `n` rows of `item` once,
and for each row evaluates four small expressions (a text join, a multiplication, an integer
division and a remainder). Each expression costs constant time for numbers of normal size, so
the whole query is **O(n)**.

There is no sort and no index involved, and rows are handed to the caller one at a time as
they are produced. Apart from the result itself, the engine needs only a fixed amount of
working memory, so the extra space is **O(1)**. `*`, `/` and `%` share the same precedence and
are evaluated left to right, which is why `quantity * unit_cents / 100` multiplies first.
'''

[[unit]]
id = "sql-u02-tables"
title = "Tables, rows and columns"
level = "basic"
difficulty = 2
intro = '''
Data in a relational database lives in tables. You will create your first tables with
`CREATE TABLE`, fill them with `INSERT`, and read them back with `SELECT`. Along the way you
meet SQLite's flexible type system, called type affinity, and see how it differs from
stricter databases.
'''
concepts = '''
## The idea

A **table** is a named collection of rows that all share the same columns. Picture a `books`
table: each **column** is one property (title, author, year) and each **row** is one book.

```text
id | title       | author         | year
1  | Dune        | Frank Herbert  | 1965
2  | Neuromancer | William Gibson | 1984
```

Unlike a spreadsheet, every column has a fixed name and a declared type, and the rows have
**no built-in order**: a table is a *set* of rows, and you ask for an order when you need one.
The description of your tables and their columns is the **schema**; the rows are the
**data**. SQL has statements for both: `CREATE TABLE` defines the schema, `INSERT` adds data.

## How SQL does it

```sql
CREATE TABLE books (
  id     INTEGER PRIMARY KEY,
  title  TEXT,
  year   INTEGER,
  rating REAL DEFAULT 0.0
);
INSERT INTO books (title, year) VALUES ('Dune', 1965), ('Dracula', 1897);
SELECT * FROM books;
SELECT title, year FROM books;
```

- `CREATE TABLE name (column type, ...)` lists the columns in order.
- `INTEGER PRIMARY KEY` is special in SQLite: the column becomes the row's unique id, and when
  an `INSERT` leaves it out, SQLite picks the next number (one more than the largest so far).
- `DEFAULT 0.0` is the value used when an `INSERT` does not mention the column. Without a
  default, a missing column gets `NULL`.
- `INSERT INTO table (columns) VALUES (...), (...)` adds one row per parenthesised list.
- `SELECT * FROM books` returns every column in declared order; listing names picks columns.

## Types and affinity

SQLite stores every value in one of five storage classes: `NULL`, `INTEGER`, `REAL`, `TEXT`
or `BLOB`. A column's declared type only gives it an **affinity**, a preference. An `INTEGER`
column turns the text `'42'` into the number `42`, because it looks like a number, but it
keeps `'abc'` as text rather than refusing it. PostgreSQL, and MySQL in its default strict
mode, would reject `'abc'` with an error. If you want that strictness in SQLite (3.37 and
later), add the word `STRICT` after the closing parenthesis of `CREATE TABLE`.

SQLite accepts type names from other databases, such as `VARCHAR(50)` or `BIGINT`, and maps
them to an affinity; the length in `VARCHAR(50)` is not enforced.

## What is special or tricky

- **Name the columns in `INSERT`.** `INSERT INTO books VALUES (...)` without a list must give
  every column, in order. It breaks as soon as someone adds a column.
- **`SELECT *` is for exploring.** In application code, list the columns you need.
- **No `ORDER BY`, no promised order.** Rows often come back in id order, but nothing
  guarantees it. The drills add `ORDER BY id` (unit 4 explains it) so the output is stable.
- **`CREATE TABLE` fails if the table exists.** `CREATE TABLE IF NOT EXISTS` skips it
  quietly, and `DROP TABLE books` deletes a table together with all its rows.

## What you will practise

You will create a table and read it back, insert several rows at once while letting
defaults and automatic ids fill the gaps, and watch type affinity convert values. In the
challenge you write a script that creates and stocks a `products` table, and the tests
inspect its schema and its rows.
'''

[[unit.step]]
kind = "concept"
id = "sql-u02-c1-schema"
title = "Schema and data"
points = 5
difficulty = 2
intro = '''
A database keeps two kinds of information: the **schema**, which describes the tables, and
the **data**, the rows inside them. SQLite stores each table as a B-tree, a sorted structure
on disk keyed by the row id, so finding a row by its id is fast even in a huge table.
'''
body = '''
## Two kinds of statements

SQL statements fall into families. The two you meet now are:

- **DDL** (data definition language) changes the *shape* of the database:
  `CREATE TABLE`, `DROP TABLE`, `ALTER TABLE`.
- **DML** (data manipulation language) works with the *rows*: `INSERT` adds them, `SELECT`
  reads them, and later `UPDATE` and `DELETE` change and remove them.

```sql
CREATE TABLE pets (
  id      INTEGER PRIMARY KEY,
  name    TEXT,
  species TEXT
);
INSERT INTO pets (name, species) VALUES ('Rex', 'dog'), ('Tom', 'cat');
SELECT * FROM pets ORDER BY id;
```

```text
id|name|species
1|Rex|dog
2|Tom|cat
```

Things to notice:

- **The schema comes first.** You cannot insert into a table that does not exist yet; the
  script would stop with `no such table: pets`.
- **The id filled itself in.** Because `id` is an `INTEGER PRIMARY KEY` and the `INSERT` did
  not mention it, SQLite numbered the rows `1` and `2`.
- **A row is one whole item.** One `INSERT` list, `('Rex', 'dog')`, became one row with a value
  in every column.

## Think of a table as a set

The rows of a table have no meaningful order and, with a primary key, no duplicates: each id
appears once. Everything you do in SQL works on whole sets of rows at a time, which is what
lets the engine choose how to do the work efficiently.
'''

