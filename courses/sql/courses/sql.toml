run_command = "sqlite3 < main.sql"
intro = '''
A `GROUP BY` can only report days that have rows. Generating the full range first and then
outer-joining the data turns missing days into zeros. The sequence costs one queue step per
day, and each step is a single addition.
'''
prompt = '''
Store visits for a few days of a week, generate days 1 to 7 with a recursive CTE, and
left-join the visits so every day appears, with 0 for days that had none.
'''
target = '''
CREATE TABLE visits (day INTEGER PRIMARY KEY, n INTEGER);
INSERT INTO visits VALUES (1, 4), (2, 7), (4, 3), (7, 5);
WITH RECURSIVE days(day) AS (
  SELECT 1
  UNION ALL
  SELECT day + 1
  FROM days
  WHERE day < 7
)
SELECT d.day, COALESCE(v.n, 0) AS visits
FROM days AS d
LEFT JOIN visits AS v ON v.day = d.day
ORDER BY d.day;
'''
