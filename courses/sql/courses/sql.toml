INSERT INTO posts VALUES (10, 1, 'Hello'), (11, 1, 'Joins'), (12, 2, 'SQL tips');
INSERT INTO comments VALUES (100, 10, 'nice'), (101, 10, 'thanks'), (102, 10, '+1'),
                            (103, 12, 'useful');
"""


def n_plus_one(setup):
    """The reference answer, computed the slow way: one query per author."""
    conn = connect(setup)
    out = []
    for author_id, name in conn.execute("SELECT id, name FROM authors ORDER BY name, id").fetchall():
        (posts,) = conn.execute(
            "SELECT COUNT(*) FROM posts WHERE author_id = ?", (author_id,)).fetchone()
        (comments,) = conn.execute(
            "SELECT COUNT(*) FROM comments WHERE post_id IN "
            "(SELECT id FROM posts WHERE author_id = ?)", (author_id,)).fetchone()
        out.append((name, posts, comments))
    conn.close()
    return out


class AuthorStatsTest(unittest.TestCase):
