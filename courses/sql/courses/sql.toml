[[unit]]
id = "sql-u24-hierarchies"
title = "Hierarchies and trees"
level = "advanced"
difficulty = 30
intro = '''
Org charts, category trees, folders and threaded comments all store a hierarchy in flat rows.
This unit models them as an adjacency list, one parent id per row, and walks them with
`WITH RECURSIVE`: down to every descendant, with a depth and a readable path, and finally
rolled up into per-subtree totals.
'''
concepts = '''
## The idea

A hierarchy is a tree: every node has at most one parent, and the nodes without a parent are
the **roots**. The simplest relational encoding is the **adjacency list**: each row stores the
key of its parent.

```sql
CREATE TABLE categories (
  id        INTEGER PRIMARY KEY,
  parent_id INTEGER REFERENCES categories(id),  -- NULL for a root
  name      TEXT NOT NULL
);
```

Inserting, moving or deleting a node touches one row, which is why most schemas start here.
The price is paid when reading. "Every product under Electronics" is not one join, because
you don't know the depth of the tree when you write the query: a join reaches exactly one
level, and the tree has as many levels as the data says.

## How SQL expresses it

`WITH RECURSIVE` turns the level-by-level walk into one statement. The **anchor** selects the
starting rows; the **recursive member** joins the rows found so far to their children; SQLite
repeats it until a round adds nothing.

```sql
WITH RECURSIVE sub(id, name, depth) AS (
  SELECT id, name, 0 FROM categories WHERE id = 1
  UNION ALL
  SELECT c.id, c.name, s.depth + 1
  FROM categories AS c JOIN sub AS s ON c.parent_id = s.id
)
SELECT * FROM sub;
```

Anything you can compute from the parent's row travels along: a `depth` counter, a **path**
built with `||` (`s.path || ' > ' || c.name`), or the id of the node where the walk started.
Walking **up** is the mirror image: start at a node and join to the row whose `id` equals the
current `parent_id`.

Each round is a join between the newest rows and the table. With an index on `parent_id`,
every child lookup is an index seek, so walking a subtree of k nodes costs about O(k log n);
without the index, every round scans the whole table.

## Pitfalls

- **Cycles.** Bad data (A's parent is B, B's parent is A) makes `UNION ALL` loop forever.
  Guard with a depth limit (`WHERE s.depth < 50`) or carry a path of ids and stop when the
  next id is already in it. `UNION` stops only when a whole row repeats, and a growing
  `depth` column never repeats.
- **Orphans.** A row whose `parent_id` points at a deleted node is unreachable from every
  root. Walking down from the roots silently skips it; a foreign key prevents it.
- **Order.** A recursive CTE promises no row order. Sort by a path to draw the tree, or by
  `depth` to list it level by level.
- **Roll-ups need pairs.** "Total salary under each manager" needs every (ancestor,
  descendant) pair, not just the parent links. A recursive CTE can generate those pairs, and
  then an ordinary `GROUP BY` sums them.

## Other databases and other models

PostgreSQL and MySQL 8 use the same `WITH RECURSIVE` syntax. PostgreSQL 14 adds `SEARCH` and
`CYCLE` clauses, and MySQL stops at `cte_max_recursion_depth` (1000 by default). When reads
dominate, schemas sometimes store a **materialized path** (`'/1/4/9/'`, so a subtree is a
prefix search) or a **closure table** with every ancestor pair, trading harder writes for
reads that are a single index range.

## What you will practise

You will list a manager's whole team with depths, draw an indented category tree ordered by
path, roll salaries up to every manager, and write an org-chart report that combines all three.
'''

[[unit.step]]
kind = "concept"
id = "sql-u24-c1-walk"
title = "Walking down, walking up"
points = 5
difficulty = 30
intro = '''
A recursive CTE is a loop that the database runs for you: each round joins the newest rows to
the table again. The direction of the join decides whether you walk towards the leaves or
towards the root, and which index serves each step.
'''
body = '''
## Two joins, two directions

```sql
-- down: everyone under node 2
WITH RECURSIVE down(id) AS (
  SELECT id FROM nodes WHERE parent_id = 2
  UNION ALL
  SELECT n.id FROM nodes AS n JOIN down AS d ON n.parent_id = d.id
)
SELECT id FROM down;

-- up: the chain from node 9 to its root
WITH RECURSIVE up(id, parent_id) AS (
  SELECT id, parent_id FROM nodes WHERE id = 9
  UNION ALL
  SELECT n.id, n.parent_id FROM nodes AS n JOIN up ON n.id = up.parent_id
)
SELECT id FROM up;
```

- Walking **down**, the join is `child.parent_id = found.id`. Each round finds the next level,
  and one node can have many children, so a round can return many rows.
- Walking **up**, the join is `parent.id = found.parent_id`. Each round finds exactly one row,
  by primary key, and the walk ends at the root: its `parent_id` is NULL, so the join finds
  nothing.
- Every column you start in the anchor and extend in the recursive member travels along:
  `depth + 1`, `path || ' > ' || name`, or the id where the walk began.

## Cost

Walking down probes `parent_id` once per node found, so that column needs an index. Walking up
probes the primary key, which is always indexed: d ancestors cost d seeks, O(d log n).
'''

