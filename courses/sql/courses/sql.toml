[[unit.step]]
kind = "drill"
id = "sql-u24-d2-outline"
title = "An indented tree, ordered by path"
points = 10
difficulty = 30
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A recursive CTE returns rows in no particular order, so drawing a tree needs a sort key that
keeps every child right after its parent. A path of names from the root does exactly that,
because a parent's path is a prefix of all its descendants' paths, and sorting puts a prefix
first.
'''
prompt = '''
Build a category tree with two roots, walk it from the roots while building a `path` and a
`depth`, and print an indented outline sorted by path.
'''
target = '''
CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, name TEXT);
INSERT INTO categories VALUES
  (1, NULL, 'Electronics'), (2, 1, 'Phones'), (3, 1, 'Laptops'),
  (4, 2, 'Android'), (5, 2, 'iPhone'), (6, NULL, 'Books'), (7, 6, 'Fiction');
WITH RECURSIVE tree(id, name, depth, path) AS (
  SELECT id, name, 0, name FROM categories WHERE parent_id IS NULL
  UNION ALL
  SELECT c.id, c.name, t.depth + 1, t.path || ' > ' || c.name
  FROM categories AS c
  JOIN tree AS t ON c.parent_id = t.id
)
SELECT printf('%*s%s', depth * 2, '', name) AS outline, path
FROM tree
ORDER BY path;
'''
line_comments = [
  "Categories point at their parent; roots have a NULL `parent_id`.",
  "Seeds two trees...",
  "...Electronics with Phones and Laptops below it...",
  "...Android and iPhone under Phones, and a second root, Books, with Fiction.",
  "The CTE carries a depth and the path of names from the root.",
  "Anchor: every root, at depth 0, whose path is just its own name.",
  "Adds each new level to the rows already found.",
  "A child is one level deeper, and its path extends its parent's path.",
  "Reads the categories...",
  "...whose parent was found in the previous round.",
  "Ends the CTE.",
  "`printf('%*s', n, '')` pads with n spaces: two per level, then the name.",
  "Reads the finished walk.",
  "Sorts by path, so every child lands right after its parent.",
]
explanation = '''
It printed:

```
outline|path
Books|Books
  Fiction|Books > Fiction
Electronics|Electronics
  Laptops|Electronics > Laptops
  Phones|Electronics > Phones
    Android|Electronics > Phones > Android
    iPhone|Electronics > Phones > iPhone
```

Sorting by the path groups each subtree under its root, and siblings come out alphabetically.
The comparison is binary, so `iPhone` sorts after `Android` (and would sort after any capital
letter); a production outline would also carry a `position` column to control sibling order.
'''

[[unit.step]]
kind = "drill"
id = "sql-u24-d3-rollup"
title = "Roll salaries up the tree"
points = 10
difficulty = 30
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A per-subtree total needs the transitive closure as a relation: one row for every (boss,
member) pair, including each person paired with themselves. A recursive CTE generates the
pairs, and then the problem is an ordinary join and `GROUP BY`; the pair count is the sum of
all subtree sizes.
'''
prompt = '''
Generate every (boss, member) pair from the `manager_id` links, then report each person's
number of reports (direct and indirect) and the total salary of their subtree.
'''
target = '''
CREATE TABLE employees (id INTEGER PRIMARY KEY, name TEXT, manager_id INTEGER, salary INTEGER);
INSERT INTO employees VALUES
  (1, 'Ana', NULL, 9000), (2, 'Bruno', 1, 6000), (3, 'Carla', 1, 6500),
  (4, 'Dario', 2, 4000), (5, 'Eva', 2, 4200), (6, 'Filipe', 4, 3000);
WITH RECURSIVE pairs(boss, member) AS (
  SELECT id, id FROM employees
  UNION ALL
  SELECT p.boss, e.id
  FROM pairs AS p
  JOIN employees AS e ON e.manager_id = p.member
)
SELECT b.name, COUNT(*) - 1 AS reports, SUM(m.salary) AS team_cost
FROM pairs AS p
JOIN employees AS b ON b.id = p.boss
JOIN employees AS m ON m.id = p.member
GROUP BY b.id, b.name
ORDER BY team_cost DESC, b.name;
'''
line_comments = [
  "Employees with their manager and salary.",
  "Seeds six people...",
  "...Ana at the top, Bruno and Carla under her...",
  "...Dario and Eva under Bruno, and Filipe under Dario.",
  "`pairs` will hold every (boss, member) pair of the closure.",
  "Anchor: everyone is a member of their own subtree.",
  "Adds the pairs found in each round.",
  "The boss stays the same while the member moves one level down.",
  "Reads the pairs found so far...",
  "...and finds the members' direct reports.",
  "Ends the CTE: Ana has 6 pairs, Bruno 4, Dario 2, the others 1.",
  "Subtracts the self pair to count reports, and sums every member's salary.",
  "Starts from the closure.",
  "Looks up the boss's name.",
  "Looks up each member's salary.",
  "One group per boss.",
  "Biggest teams first; the name breaks ties.",
]
explanation = '''
It printed:

```
name|reports|team_cost
Ana|5|32700
Bruno|3|17200
Dario|1|7000
Carla|0|6500
Eva|0|4200
Filipe|0|3000
```

The closure has 15 rows for 6 people: each person appears once per ancestor plus once for
themselves. That is n × (average depth + 1) pairs, which is why roll-ups over a deep tree cost
more than over a flat one. Grouping by `b.id, b.name` (and not only by `p.boss`) also keeps the
query valid in PostgreSQL.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u24-x1-org-chart"
title = "The org-chart report"
points = 40
difficulty = 30
entry = "org_chart"
intro = '''
A real report combines the walks: depth and path from the roots, and the size of every subtree.
The hidden tests use forests, orphans, a 500-level chain and a 3 000-person company, so the
query has to be set-based: a few recursive rounds that each touch a level, not one query per
employee.
'''
instructions = '''
## Your turn

Write **one query** (a single statement; `WITH` is fine) over this table:

```sql
CREATE TABLE employees (
  id         INTEGER PRIMARY KEY,
  name       TEXT NOT NULL,
  manager_id INTEGER            -- NULL for a top-level employee
);
CREATE INDEX employees_manager ON employees(manager_id);
```

Return one row per employee who is **reachable from a top-level employee** (a row with
`manager_id IS NULL`), with exactly these columns:

| column | meaning |
|---|---|
| `id` | the employee's id |
| `name` | the employee's name |
| `depth` | 0 for a top-level employee, 1 for their direct reports, and so on |
| `chain` | the names from the top-level employee down to this one, joined by `' > '` |
| `reports` | how many people are below this employee, directly or indirectly |

- There can be several top-level employees.
- Employees whose manager does not exist (and everyone below them) are **left out**.
- Sort by `chain`, then by `id`.

Example:

```
(1, 'Ana', NULL), (2, 'Bruno', 1), (3, 'Carla', 1),
(4, 'Dario', 2), (5, 'Eva', 2), (6, 'Filipe', 4), (7, 'Gil', 3)
```

```
id|name|depth|chain|reports
1|Ana|0|Ana|6
2|Bruno|1|Ana > Bruno|3
4|Dario|2|Ana > Bruno > Dario|1
6|Filipe|3|Ana > Bruno > Dario > Filipe|0
5|Eva|2|Ana > Bruno > Eva|0
3|Carla|1|Ana > Carla|1
7|Gil|2|Ana > Carla > Gil|0
```

Hidden tests decide correctness.
'''
starter = '''
-- org_chart: write your query below
-- Hint: walk down from the roots carrying depth and chain; then pair every employee in that
-- walk with each member of their subtree (themselves included) and count the pairs.
'''
tests = '''
SCHEMA = """
CREATE TABLE employees (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  manager_id INTEGER
);
CREATE INDEX employees_manager ON employees(manager_id);
"""

EXAMPLE = SCHEMA + """
INSERT INTO employees VALUES
  (1, 'Ana', NULL), (2, 'Bruno', 1), (3, 'Carla', 1),
  (4, 'Dario', 2), (5, 'Eva', 2), (6, 'Filipe', 4), (7, 'Gil', 3);
"""

COLUMNS = ["id", "name", "depth", "chain", "reports"]


def expected(people):
    names = {i: n for i, n, _ in people}
    kids = {}
    for i, _, m in people:
        kids.setdefault(m, []).append(i)
    rows = []

    def walk(i, depth, chain):
        count = 0
        for c in kids.get(i, []):
            count += 1 + walk(c, depth + 1, chain + " > " + names[c])
        rows.append((i, names[i], depth, chain, count))
        return count

    for root in kids.get(None, []):
        walk(root, 0, names[root])
    return sorted(rows, key=lambda r: (r[3], r[0]))


def people_of(setup):
    return query(setup, "SELECT id, name, manager_id FROM employees ORDER BY id")[1]


class OrgChartTest(unittest.TestCase):
    def check(self, setup):
        cols, rows = query(setup)
        self.assertEqual(cols, COLUMNS)
        self.assertEqual(rows, expected(people_of(setup)))
        return rows

    def test_example(self):
        rows = self.check(EXAMPLE)
        self.assertEqual(rows[0], (1, "Ana", 0, "Ana", 6))
        self.assertEqual(rows[3], (6, "Filipe", 3, "Ana > Bruno > Dario > Filipe", 0))

    def test_counts_indirect_reports(self):
        rows = self.check(EXAMPLE)
        by_id = {r[0]: r[4] for r in rows}
        self.assertEqual(by_id[2], 3, "Bruno has Dario, Eva and Filipe below him")

    def test_several_roots(self):
        self.check(EXAMPLE + """
            INSERT INTO employees VALUES
              (10, 'Zara', NULL), (11, 'Yuri', 10), (12, 'Xana', 11), (13, 'Bea', NULL);
        """)

    def test_orphans_are_left_out(self):
        rows = self.check(EXAMPLE + """
            INSERT INTO employees VALUES (20, 'Hugo', 99), (21, 'Iris', 20), (22, 'Joao', 7);
        """)
        ids = {r[0] for r in rows}
        self.assertNotIn(20, ids)
        self.assertNotIn(21, ids)
        self.assertIn(22, ids)

    def test_same_names_sort_by_id(self):
        self.check(SCHEMA + """
            INSERT INTO employees VALUES
              (5, 'Rui', NULL), (3, 'Rui', 5), (9, 'Rui', 5), (4, 'Ana', 9), (8, 'Ana', 3),
              (1, 'Ana', 9), (6, 'Ana', 3);
        """)

    def test_empty_table(self):
        cols, rows = query(SCHEMA)
        self.assertEqual(cols, COLUMNS)
        self.assertEqual(rows, [])

    def test_deep_chain(self):
        setup = SCHEMA + """
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 500)
            INSERT INTO employees SELECT i, 'p' || i, NULLIF(i - 1, 0) FROM n;
        """
        rows = self.check(setup)
        self.assertEqual(rows[0][4], 499)
        self.assertEqual(rows[-1][2], 499)

    def test_large_company(self):
        setup = SCHEMA + """
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 3000)
            INSERT INTO employees
            SELECT i, 'e' || ((i * 7919) % 997),
                   CASE WHEN i % 1000 = 1 THEN NULL
                        WHEN i % 500 = 7 THEN i + 5000
                        ELSE (i + 1) / 3 END
            FROM n;
        """
        rows = self.check(setup)
        self.assertGreater(len(rows), 2000)
        self.assertLess(len(rows), 3000)
'''

[unit.step.gabarito]
solution = '''
WITH RECURSIVE
  tree(id, name, depth, chain) AS (
    SELECT id, name, 0, name
    FROM employees
    WHERE manager_id IS NULL
    UNION ALL
    SELECT e.id, e.name, t.depth + 1, t.chain || ' > ' || e.name
    FROM employees AS e
    JOIN tree AS t ON e.manager_id = t.id
  ),
  subtree(top, member) AS (
    SELECT id, id FROM tree
    UNION ALL
    SELECT s.top, e.id
    FROM subtree AS s
    JOIN employees AS e ON e.manager_id = s.member
  ),
  sizes AS (
    SELECT top, COUNT(*) - 1 AS reports
    FROM subtree
    GROUP BY top
  )
SELECT t.id, t.name, t.depth, t.chain, z.reports
FROM tree AS t
JOIN sizes AS z ON z.top = t.id
ORDER BY t.chain, t.id;
'''
time = "O(n·d·log n)"
space = "O(n·d)"
justification = '''
Let **n** be the number of employees and **d** the average depth. The `tree` walk adds one
level per round and finds each reachable employee once, through an **index seek** on
`employees_manager`: **O(n log n)**.

`subtree` is the closure: it holds one row per (employee, member of their subtree) pair, which
is n × (d + 1) rows, and each is produced by one seek on the same index. That gives
**O(n·d·log n)** time and **O(n·d)** space for the materialised CTE. Grouping the pairs sorts
or hashes them by `top`, which is within the same bound, and the final join to `sizes` uses an
automatic index that SQLite builds on the materialised result. The `ORDER BY` is one sort of
n rows.

Starting the closure from `tree`, not from the whole table, is what drops orphans: a row that
cannot reach a root is never an anchor. It also keeps the walk safe, because nothing reachable
from a root can lie on a cycle. Counting with a correlated subquery that re-walks each
employee's subtree would repeat the same work n times and be quadratic on a flat company.
'''

# ── Unit 31 · Gaps and islands ───────────────────────────────────────────────────────

[[unit]]
id = "sql-u25-gaps-islands"
title = "Gaps and islands"
level = "advanced"
difficulty = 31
intro = '''
Consecutive login days, unbroken runs of a sensor status, missing invoice numbers: "gaps and
islands" questions ask where a sequence runs without a break and where it breaks. This unit
teaches the two window-function tricks that answer almost all of them in one pass: subtract a
row number to label runs, or flag each change with `LAG` and add the flags up.
'''
concepts = '''
## The idea

Take the sorted values 1, 2, 3, 7, 8, 12. They form three **islands**, maximal runs without a
break (1–3, 7–8 and 12), separated by two **gaps** (4–6 and 9–11). The same shape hides in many
questions: how long is each user's login streak, which invoice numbers are missing, for how
long was a server down, which free seats sit together.

Procedural code would walk the sorted list, remember the previous value and start a new group
whenever the next value is not the previous one plus 1. SQL has no "previous row" variable, but
window functions give every row a view of its neighbours, so the whole job stays one set-based
statement.

## Trick 1: value minus row number

Number the rows in order with `ROW_NUMBER()`. Inside an island both the value and the row
number go up by exactly 1 per row, so their difference stays constant; across a gap the value
jumps further than the row number and the difference changes. The difference labels the island:

```sql
SELECT n, n - ROW_NUMBER() OVER (ORDER BY n) AS grp
FROM numbers;   -- 1, 2, 3 -> 0;  7, 8 -> 3;  12 -> 6
```

A `GROUP BY grp` then gives each island's `MIN`, `MAX` and `COUNT`. For dates, subtract from a
day number: `julianday(day) - ROW_NUMBER() OVER (...)`. With `PARTITION BY user_id`, every user
gets their own numbering and their own islands.

## Trick 2: flag the changes, then add up the flags

When "consecutive" means "the same status as the row before" rather than "the previous value
plus 1", compare each row with `LAG(...)`, the value of the previous row, and write 1 where a
new run starts and 0 otherwise. A running `SUM` of the flags numbers the runs: it goes up by
one at each change and stays flat inside a run.

```sql
SELECT ts, CASE WHEN status IS LAG(status) OVER (ORDER BY ts)
                THEN 0 ELSE 1 END AS is_start
FROM checks;
```

## Gaps

A gap sits between a row and the next one when they are not adjacent. `LEAD(n)` reads the next
value, so `WHERE next_n - n > 1` keeps the rows just before a gap, and the gap runs from `n + 1`
to `next_n - 1`.

## Pitfalls

- **Duplicates break trick 1.** Two logins on the same day get different row numbers but the
  same day, so the difference shifts in the middle of an island. Remove them first with
  `DISTINCT`, or number with `DENSE_RANK()`.
- **Text dates are not numbers.** `'2026-02-01' - 1` is not January 31st (SQLite reads the
  leading `2026` and gives 2025). Convert with `julianday()` or `unixepoch()` before doing
  arithmetic on dates.
- **NULL and `=`.** `status = LAG(status)` is NULL on the first row, and whenever a side is
  NULL. SQLite's `IS` (`IS NOT DISTINCT FROM` in PostgreSQL) treats two NULLs as equal and
  never returns NULL.
- **Cost.** Each window needs its rows sorted by the partition and order keys: one
  O(n log n) sort, or none when an index already delivers that order. The rest is a linear
  pass and a `GROUP BY`.

## What you will practise

You will label islands of free seats, list the missing ranges of invoice numbers, turn a stream
of health checks into up and down periods, and find every user's longest login streak.
'''

[[unit.step]]
kind = "concept"
id = "sql-u25-c1-row-number"
title = "Why value minus row number works"
points = 5
difficulty = 31
intro = '''
The trick turns a sequential question ("is this row adjacent to the previous one?") into a
grouping key that each row can compute from its own values and its position. Once every row
carries the key, an ordinary `GROUP BY` collapses each island into one row.
'''
body = '''
## Watch the difference

| n | ROW_NUMBER() | n - ROW_NUMBER() |
|---|---|---|
| 1 | 1 | 0 |
| 2 | 2 | 0 |
| 3 | 3 | 0 |
| 7 | 4 | 3 |
| 8 | 5 | 3 |
| 12 | 6 | 6 |

Inside an island the value and the row number grow in step, so the difference is constant.
After a gap of k missing values the difference grows by k, and it never comes back down, so
two different islands can never share a label.

```sql
WITH labelled AS (
  SELECT n, n - ROW_NUMBER() OVER (ORDER BY n) AS grp FROM numbers
)
SELECT MIN(n) AS first, MAX(n) AS last, COUNT(*) AS size
FROM labelled GROUP BY grp;
```

## The rules that keep it correct

- The values must be **distinct** within each partition. Deduplicate first.
- The step must be **1** in the unit you subtract. For dates, use whole day numbers
  (`julianday(date(ts))`), never the text.
- The label only means something **inside its partition**: group by `user_id, grp`, not by
  `grp` alone.

## Cost

`ROW_NUMBER()` needs the rows sorted by `(partition, order)` keys: one O(n log n) sort, or a
plain index scan when an index has those columns in that order. The `GROUP BY` that follows
reads the labelled rows once more.
'''

