'''

[unit.step.gabarito]
solution = '''
-- customer_revenue: one row per customer, paid orders only
CREATE VIEW customer_revenue AS
SELECT c.id AS customer_id,
       c.name AS name,
       COUNT(o.id) AS paid_orders,
       COALESCE(SUM(o.total), 0) AS revenue
FROM customers AS c
LEFT JOIN orders AS o
  ON o.customer_id = c.id
 AND o.status = 'paid'
GROUP BY c.id;
'''
time = "O(c + o log o)"
space = "O(c)"
justification = '''
Creating the view only stores its text: **O(1)**. The cost is paid on every read. For **c**
customers and **o** orders, `orders.customer_id` has no index, so SQLite builds a temporary
*automatic partial index* on `(customer_id, status)` holding only the paid orders
(**O(o log o)**), then, for each customer in rowid order, seeks that customer's paid orders in it. Every order is visited once, and the grouping by `c.id` is
free because the customers are already read in id order: **O(c + o log o)** time, with
**O(c)** for the result rows.

The status test sits in the `ON` clause on purpose. In the `WHERE` clause it would run after
the join and throw away the `NULL`-extended rows of customers without paid orders, turning the
`LEFT JOIN` back into an inner join. `COUNT(o.id)` counts only matched orders, and `COALESCE`
turns the `NULL` sum of an empty group into 0. Being a view, it is recomputed on each read, so
it is always current.
'''

[[unit]]
id = "sql-udb6-upsert"
title = "Upserts and idempotent writes"
level = "intermediate"
difficulty = 21
intro = '''
"Insert this row, or update it if it already exists" is one of the most common writes, and
doing it in two statements is both slow and racy. You will use `INSERT ... ON CONFLICT` to skip
duplicates, to merge new values into existing rows, and to let only newer data win. The challenge
is a sync script that can safely run twice.
'''
concepts = '''
## The idea

Data often arrives more than once: a client retries a request after a timeout, a nightly import reprocesses yesterday's file, two servers report the same event. The safe way to write it is **idempotently**: running the write twice leaves the database exactly as running it once.

The naive approach checks first: `SELECT` to see whether the row exists, then `INSERT` or `UPDATE`. That is two round trips, and between them another connection can insert the same key, so the `INSERT` fails anyway. An **upsert** decides inside the database, in one atomic statement.

## How SQL expresses it

```sql
INSERT INTO page_views (path, views) VALUES ('/home', 1)
ON CONFLICT (path) DO UPDATE SET views = views + excluded.views;
```

- `ON CONFLICT (path)` names the **conflict target**: columns covered by a `PRIMARY KEY` or `UNIQUE` constraint (or unique index). Without such a constraint there is no conflict to detect, and SQLite rejects the clause.
- `DO NOTHING` skips the row that would have collided. The existing row is unchanged.
- `DO UPDATE SET ...` updates the existing row instead. Inside it, plain column names refer to the **existing** row, and `excluded.col` to the row you tried to insert.
- `DO UPDATE ... WHERE condition` updates only when the condition holds, for example `WHERE excluded.updated_at > page_views.updated_at` ("newer data wins").

The syntax comes from PostgreSQL, and SQLite has supported it since 3.24. MySQL spells it `INSERT ... ON DUPLICATE KEY UPDATE col = VALUES(col)`. With `INSERT ... SELECT`, SQLite's parser needs help: write `WHERE true` after the `FROM`, because otherwise it reads `ON CONFLICT` as the `ON` of a join.

## Older shortcuts and their traps

- `INSERT OR IGNORE` skips a row that breaks **any** constraint: `UNIQUE`, but also `NOT NULL` and `CHECK`. Bad data disappears silently.
- `INSERT OR REPLACE` (and `REPLACE INTO`) **deletes** the existing row and inserts a new one. Columns you did not list fall back to their defaults, the row can get a new rowid, and anything that pointed at the old id now points at nothing. It is not an update.

## What is special or tricky

- Each row of a multi-row insert is checked in turn, so two rows with the same key in one statement conflict with each other: the second one goes through the `DO UPDATE` path.
- A `DO UPDATE` that changes nothing when the values are equal keeps the write idempotent; one that adds (`views = views + 1`) is not idempotent, and needs a unique event id to stay safe on retries.
- `RETURNING` works with upserts too, and returns the row as it ends up.

## What you will practise

You will skip duplicates with `DO NOTHING`, count with `DO UPDATE` and `excluded`, and keep only newer data with a guarded update. The challenge merges a staging table into a product catalogue without losing columns or ids.
'''

[[unit.step]]
kind = "concept"
id = "sql-udb6-c1-on-conflict"
title = "INSERT ... ON CONFLICT"
points = 5
difficulty = 21
intro = '''
A unique constraint is enforced with a B-tree index, so the database finds a conflicting row
with the same seek it needs to insert. An upsert turns that check into a decision taken in one
statement, under the write lock, which leaves no gap for a race.
'''
body = '''
## Three outcomes in one statement

```sql
CREATE TABLE products (
  sku TEXT PRIMARY KEY,
  price INTEGER NOT NULL,
  updated_at TEXT NOT NULL
);

INSERT INTO products (sku, price, updated_at)
VALUES ('PEN', 150, '2024-06-02')
ON CONFLICT (sku) DO UPDATE
SET price = excluded.price,
    updated_at = excluded.updated_at
WHERE excluded.updated_at > products.updated_at;
```

For the row being inserted, SQLite seeks the `sku` index:

1. **No row with that key**: the row is inserted.
2. **A row exists and the `WHERE` holds**: the existing row is updated with the new values.
3. **A row exists and the `WHERE` fails**: nothing happens. Stale data is ignored.

`excluded` is the row you tried to insert; `products.price`, or plain `price`, is the row
already stored.

## Idempotent by design

Run the statement above twice: the second time the dates are equal, the `WHERE` fails, and
nothing changes. That is what makes retries and re-imports safe.

## Not the same as REPLACE

```sql
INSERT OR REPLACE INTO products (sku, price, updated_at) VALUES ('PEN', 150, '2024-06-02');
```

`REPLACE` deletes the old row and inserts a new one: columns you did not list are reset to
their defaults and the rowid can change. An upsert updates the row in place and touches only
the columns in `SET`.
'''

