[[unit.step]]
kind = "drill"
id = "sql-u06-d3-null"
title = "Aggregates, NULL and empty sets"
points = 10
difficulty = 6
placeholder_policy = "shown"
run_command = "sqlite3 < main.sql"
intro = '''
`NULL` values never enter the accumulators of `SUM`, `AVG`, `MIN` or `MAX`. When no value
enters at all, the accumulator stays empty and the result is `NULL`, while `COUNT` simply
reports 0. `COALESCE` and SQLite's `total` are the usual ways to turn an empty sum into zero.
'''
prompt = '''
Compare `AVG` with a hand-made average that treats `NULL` as zero, then aggregate a `WHERE`
that matches nothing and repair the empty sum with `COALESCE` and `total`.

**Why:** a dashboard that shows an empty value instead of 0, or an average that silently
ignores missing data, comes straight from these rules.
'''
target = '''
CREATE TABLE scores (player TEXT, points INTEGER);
INSERT INTO scores VALUES ('Ana', 10), ('Bo', NULL), ('Caio', 20);

SELECT AVG(points) AS avg_known, SUM(points) * 1.0 / COUNT(*) AS avg_all_rows FROM scores;
SELECT SUM(points) AS total_points, MIN(points) AS lowest FROM scores;

-- No row matches 'Zed'.
SELECT COUNT(*) AS n, SUM(points) AS s, MAX(points) AS m FROM scores WHERE player = 'Zed';
SELECT COALESCE(SUM(points), 0) AS s_or_zero, total(points) AS total_fn FROM scores WHERE player = 'Zed';
'''
line_comments = [
  "Players and their points; one player has no score yet.",
  "Three rows, one with `NULL` points.",
  "",
  "`AVG` divides 30 by the 2 known values; dividing by `COUNT(*)` treats the missing score as 0. `* 1.0` makes the division real.",
  "`SUM` and `MIN` ignore the `NULL` row.",
  "",
  "A comment: the next queries filter out every row.",
  "Still one result row: `COUNT` gives 0, but `SUM` and `MAX` have nothing to work on and give `NULL`.",
  "`COALESCE` swaps the `NULL` for 0; `total` returns `0.0` for an empty set.",
]
explanation = '''
The output was:

```text
avg_known|avg_all_rows
15.0|10.0
total_points|lowest
30|10
n|s|m
0|NULL|NULL
s_or_zero|total_fn
0|0.0
```

`AVG` gave `15.0` because it averaged only the two known scores, while dividing by every row
gave `10.0`. Which one is right depends on what `NULL` means in your data. Over an empty set,
`COUNT` said 0 but `SUM` and `MAX` said `NULL`, and `COALESCE` or `total` turned the sum into
a zero.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u06-x1-order-stats"
title = "Summarise the orders"
points = 20
difficulty = 6
entry = "order_stats"
run_command = "python3 -m unittest"
intro = '''
A summary row is a set of aggregates computed together in a single scan of the filtered
rows. The tricky part is not the speed but the semantics: which aggregate skips `NULL`, which
one counts duplicates, and what each one returns when no row qualifies.
'''
instructions = '''
## Your turn

Write **one query** for this table:

```sql
CREATE TABLE orders (
  id           INTEGER PRIMARY KEY,
  customer     TEXT,     -- never NULL
  amount_cents INTEGER,  -- NULL when the order has not been priced yet
  status       TEXT,     -- never NULL, e.g. 'paid', 'shipped', 'cancelled'
  shipped_at   TEXT      -- NULL until the order ships
);
```

Ignore every order whose `status` is `'cancelled'`. Over the remaining orders, return
**exactly one row** with these columns, in this order:

| column | value |
|---|---|
| `orders` | how many orders there are |
| `shipped` | how many of them have a `shipped_at` |
| `customers` | how many different customers placed them |
| `revenue_cents` | the total of the known amounts, or `0` when there is none |
| `largest_cents` | the largest known amount, or `NULL` when there is none |
| `average_cents` | the average of the known amounts rounded with `round(...)` to a whole number, or `NULL` when there is none |

Unpriced orders still count as orders, but they are left out of the revenue, largest and
average.

Example:

```text
id|customer|amount_cents|status|shipped_at
1|ana|1000|shipped|2026-11-02
2|bo|2500|paid|NULL
3|ana|NULL|paid|NULL
4|caio|9000|cancelled|NULL
```

gives:

```text
orders|shipped|customers|revenue_cents|largest_cents|average_cents
3|1|2|3500|2500|1750.0
```

Hidden tests also run your query on a table with no orders at all.
'''
starter = '''
-- order_stats: write your query below
-- Hint: filter with WHERE, then pick the right COUNT for each column; an empty SUM is NULL.
'''
tests = '''
SCHEMA = """
CREATE TABLE orders (
  id INTEGER PRIMARY KEY, customer TEXT, amount_cents INTEGER, status TEXT, shipped_at TEXT
);
"""

COLUMNS = ["orders", "shipped", "customers", "revenue_cents", "largest_cents", "average_cents"]


def stats(rows):
    conn = connect(SCHEMA)
    conn.executemany("INSERT INTO orders VALUES (?, ?, ?, ?, ?)", rows)
    cur = conn.execute(STUDENT_SQL)
    cols = [d[0] for d in cur.description or []]
    result = [tuple(r) for r in cur.fetchall()]
    conn.close()
    return cols, result


EXAMPLE = [
    (1, "ana", 1000, "shipped", "2026-11-02"),
    (2, "bo", 2500, "paid", None),
    (3, "ana", None, "paid", None),
    (4, "caio", 9000, "cancelled", None),
]


class OrderStatsTest(unittest.TestCase):
    def test_column_names(self):
        cols, _ = stats(EXAMPLE)
        self.assertEqual(cols, COLUMNS)

    def test_example(self):
        _, rows = stats(EXAMPLE)
        self.assertEqual(rows, [(3, 1, 2, 3500, 2500, 1750)])

    def test_cancelled_orders_are_ignored(self):
        _, rows = stats([
            (1, "ana", 100, "paid", None),
            (2, "bo", 99999, "cancelled", "2026-01-01"),
            (3, "caio", 300, "cancelled", None),
        ])
        self.assertEqual(rows, [(1, 0, 1, 100, 100, 100)])

    def test_shipped_counts_only_known_dates(self):
        _, rows = stats([
            (1, "ana", 100, "shipped", "2026-11-01"),
            (2, "ana", 200, "shipped", "2026-11-03"),
            (3, "ana", 300, "paid", None),
            (4, "ana", 400, "paid", None),
        ])
        self.assertEqual(rows, [(4, 2, 1, 1000, 400, 250)])

    def test_average_skips_unpriced_orders_and_rounds(self):
        _, rows = stats([
            (1, "ana", 1000, "paid", None),
            (2, "bo", 2000, "paid", None),
            (3, "caio", 2001, "paid", None),
            (4, "dara", None, "paid", None),
        ])
        self.assertEqual(rows, [(4, 0, 4, 5001, 2001, 1667)])

    def test_no_orders_at_all(self):
        _, rows = stats([])
        self.assertEqual(rows, [(0, 0, 0, 0, None, None)])

    def test_only_cancelled_orders(self):
        _, rows = stats([(1, "ana", 500, "cancelled", None)])
        self.assertEqual(rows, [(0, 0, 0, 0, None, None)])

    def test_only_unpriced_orders(self):
        _, rows = stats([(1, "ana", None, "paid", None), (2, "bo", None, "shipped", "2026-11-20")])
        self.assertEqual(rows, [(2, 1, 2, 0, None, None)])
'''

[unit.step.gabarito]
solution = '''
-- order_stats: write your query below
SELECT COUNT(*) AS orders,
       COUNT(shipped_at) AS shipped,
       COUNT(DISTINCT customer) AS customers,
       COALESCE(SUM(amount_cents), 0) AS revenue_cents,
       MAX(amount_cents) AS largest_cents,
       round(AVG(amount_cents)) AS average_cents
FROM orders
WHERE status <> 'cancelled';
'''
time = "O(n log d)"
space = "O(d)"
justification = '''
SQLite scans the `n` rows of `orders` once, tests the `WHERE` condition on each, and feeds
the surviving rows to all six accumulators at the same time. `COUNT`, `SUM`, `MAX` and `AVG`
each update a fixed-size state per row, which is **O(1)** work and memory.

`COUNT(DISTINCT customer)` is the exception. To know whether a customer was already counted,
SQLite inserts each value into a temporary B-tree and only counts it when it is new. With
`d` different customers, each lookup costs **O(log d)**, so the query costs **O(n log d)**
time (at most **O(n log n)**) and **O(d)** memory for that B-tree.

The semantics carry the rest: `COUNT(shipped_at)` and `AVG` skip `NULL`s, the `WHERE` runs
before any aggregate, and `COALESCE` turns the empty `SUM` into `0` while `MAX` and `AVG`
correctly stay `NULL`.
'''

