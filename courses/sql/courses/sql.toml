intro = '''
This time you write the schema yourself. The tests read SQLite's own description of your
table with `PRAGMA table_info`, which lists each column's name, declared type, default and
primary-key flag, and then insert rows of their own to check that the defaults and automatic
ids behave as specified.
'''
instructions = '''
## Your turn

Write a **script** (several statements) that runs on an empty database and:

1. creates a table named `products` with these columns, in this order:

| column | type | rule |
|---|---|---|
| `id` | `INTEGER` | the primary key, so SQLite numbers rows automatically |
| `name` | `TEXT` | |
| `price_cents` | `INTEGER` | |
| `in_stock` | `INTEGER` | defaults to `1` when an `INSERT` leaves it out |

2. inserts these three products, in this order, letting SQLite choose the ids:

| name | price_cents | in_stock |
|---|---|---|
| `Green tea` | 450 | *(leave it to the default)* |
| `Espresso beans` | 1290 | 0 |
| `Honey` | 675 | *(leave it to the default)* |

Afterwards, `SELECT * FROM products ORDER BY id` must print:

```text
id|name|price_cents|in_stock
1|Green tea|450|1
2|Espresso beans|1290|0
3|Honey|675|1
```

The hidden tests also insert rows of their own, so the default and the automatic id must
really be part of the table, not just of your `INSERT`s.
'''
starter = '''
-- products: write your script below
-- Hint: CREATE TABLE products (...); then one INSERT per product, naming the columns you fill.
'''
tests = '''
EXPECTED_ROWS = [
    (1, "Green tea", 450, 1),
    (2, "Espresso beans", 1290, 0),
    (3, "Honey", 675, 1),
]


class ProductsTableTest(unittest.TestCase):
    def setUp(self):
        self.conn = script()

    def tearDown(self):
        self.conn.close()

    def columns(self):
        return self.conn.execute("PRAGMA table_info(products)").fetchall()

    def test_column_names_and_types(self):
        info = [(row[1], row[2].upper()) for row in self.columns()]
        self.assertEqual(
            info,
            [("id", "INTEGER"), ("name", "TEXT"), ("price_cents", "INTEGER"), ("in_stock", "INTEGER")],
        )

    def test_id_is_the_primary_key(self):
        self.assertEqual([row[1] for row in self.columns() if row[5]], ["id"])

    def test_rows(self):
        rows = self.conn.execute(
            "SELECT id, name, price_cents, in_stock FROM products ORDER BY id"
        ).fetchall()
        self.assertEqual(rows, EXPECTED_ROWS)

    def test_in_stock_defaults_to_one(self):
        self.conn.execute("INSERT INTO products (name, price_cents) VALUES ('Oat milk', 199)")
        row = self.conn.execute("SELECT in_stock FROM products WHERE name = 'Oat milk'").fetchone()
        self.assertEqual(row, (1,))

    def test_new_rows_get_the_next_id(self):
        self.conn.execute("INSERT INTO products (name, price_cents) VALUES ('Oat milk', 199)")
        row = self.conn.execute("SELECT id FROM products WHERE name = 'Oat milk'").fetchone()
        self.assertEqual(row, (4,))

    def test_price_text_is_stored_as_integer(self):
        self.conn.execute("INSERT INTO products (name, price_cents) VALUES ('Rye bread', '320')")
        row = self.conn.execute(
            "SELECT price_cents, typeof(price_cents) FROM products WHERE name = 'Rye bread'"
        ).fetchone()
        self.assertEqual(row, (320, "integer"))

    def test_exactly_three_products(self):
        (count,) = self.conn.execute("SELECT count(*) FROM products").fetchone()
        self.assertEqual(count, 3)
'''

[unit.step.gabarito]
solution = '''
-- products: write your script below
CREATE TABLE products (
  id          INTEGER PRIMARY KEY,
  name        TEXT,
  price_cents INTEGER,
  in_stock    INTEGER DEFAULT 1
);

INSERT INTO products (name, price_cents) VALUES ('Green tea', 450);
INSERT INTO products (name, price_cents, in_stock) VALUES ('Espresso beans', 1290, 0);
INSERT INTO products (name, price_cents) VALUES ('Honey', 675);
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
`CREATE TABLE` is a constant amount of work: SQLite writes one row describing the table into
its catalogue, `sqlite_schema`. Each `INSERT` then adds one entry to the table's **B-tree**,
which is ordered by the row id. Finding where the entry goes costs **O(log n)** for a table
of `n` rows, so inserting `n` rows costs **O(n log n)** in the worst case. Because new ids
are always the largest so far, SQLite in practice appends to the right-most page, which makes
each insert close to constant time.

Leaving `id` out costs nothing extra: SQLite reads the largest id from the right edge of the
B-tree and adds one. The table stores every row once, so the space is **O(n)**.
'''

[[unit]]
id = "sql-u03-filtering"
title = "Filtering rows with WHERE"
level = "basic"
difficulty = 3
intro = '''
Most questions are about some of the rows, not all of them. You will keep only the rows you
want with `WHERE`, combine conditions with `AND`, `OR` and `NOT`, and use the shortcuts `IN`,
`BETWEEN` and `LIKE`. You will also meet the most common trap in SQL: testing for `NULL` with
`=`.
'''
concepts = '''
## The idea

"Which books came out before 1980?" "Which orders have not shipped yet?" Questions like these
pick out some rows of a table. In SQL you write the rule as a **condition** after `WHERE`.
The engine checks the condition against each row and keeps only the rows for which it is
**true**. In relational algebra this operation is called **selection**: a new, smaller set
of rows taken from the original one.

Without help, the engine has to look at every row to apply the condition; this is called a
**full table scan**. Later, in the unit on indexes, you will see how an index lets it jump
straight to the matching rows.

## How SQL does it

The comparison operators are `=`, `<>` (or `!=`), `<`, `<=`, `>` and `>=`. You combine
conditions with `AND`, `OR` and `NOT`.

```sql
SELECT title FROM books WHERE year < 1980;
SELECT title FROM books WHERE year >= 1960 AND genre <> 'poetry';
SELECT title FROM books WHERE NOT (genre = 'sf' OR genre = 'fantasy');
```

A few shortcuts make common conditions shorter and clearer:

```sql
SELECT title FROM books WHERE genre IN ('sf', 'fantasy');     -- one of a list
SELECT title FROM books WHERE year BETWEEN 1960 AND 1979;     -- a range, both ends included
SELECT title FROM books WHERE title LIKE 'The %';             -- a text pattern
SELECT title FROM books WHERE rating IS NULL;                 -- missing value
```

In a `LIKE` pattern, `%` matches any run of characters (even none) and `_` matches exactly one
character. `NOT IN`, `NOT BETWEEN`, `NOT LIKE` and `IS NOT NULL` turn each test around.

## What is special or tricky

- **`= NULL` never matches.** A comparison with `NULL` gives `NULL` (unknown), and `WHERE`
  keeps only rows where the condition is true. Write `IS NULL` or `IS NOT NULL`. For the same
  reason, `status <> 'paid'` does *not* return rows whose status is `NULL`.
- **`AND` binds tighter than `OR`.** `a OR b AND c` means `a OR (b AND c)`. When you mix them,
  add parentheses, even when you think they are not needed.
- **`BETWEEN` includes both ends** and expects the smaller value first: `BETWEEN 10 AND 1`
  matches nothing.
- **Text comparison is exact.** `name = 'ana'` does not match `'Ana'`. But `LIKE` in SQLite
  ignores case for the letters A to Z, so `'ana%'` matches `'Ana Silva'`. In PostgreSQL,
  `LIKE` is case-sensitive and `ILIKE` ignores case.
- **Compare like with like.** Compare numbers with numbers and text with text. Text is ordered
  character by character by code, so `'B' < 'a'` and `'10' < '9'`.

## What you will practise

You will filter with comparisons and see operator precedence change a result, use `IN`,
`BETWEEN` and their `NOT` forms, match text with `LIKE`, and watch `= NULL` return nothing.
In the challenge you combine four conditions to find the products a shop should restock.
'''

[[unit.step]]
kind = "concept"
id = "sql-u03-c1-where"
title = "WHERE keeps the true rows"
points = 5
difficulty = 3
intro = '''
Selection is the simplest operation of relational algebra: from a set of rows, keep those
that satisfy a predicate. SQLite implements it as a loop over the table that evaluates the
`WHERE` expression for each row and passes on the rows where it is true, without ever
storing the rejected ones.
'''
body = '''
## One condition, checked row by row

Take this table and query:

```text
products
name      | price | stock
Tea       | 4     | 12
Coffee    | 9     | NULL
Honey     | 6     | 0
```

```sql
SELECT name FROM products WHERE price > 5 AND stock < 10;
```

For each row, SQLite works out the condition:

- `Tea`: `4 > 5` is false, so the whole `AND` is false. Dropped.
- `Coffee`: `9 > 5` is true, but `NULL < 10` is unknown, so the `AND` is unknown. Dropped.
- `Honey`: `6 > 5` is true and `0 < 10` is true. **Kept.**

The answer is one row, `Honey`.

## Three possible answers

That second row shows something important. In SQL a condition has **three** possible
outcomes: true, false or unknown (`NULL`). `WHERE` keeps only the rows where it is **true**;
false and unknown are both dropped. If you also wanted products whose stock is unknown, you
would have to ask for them explicitly:

```sql
SELECT name FROM products WHERE price > 5 AND (stock < 10 OR stock IS NULL);
```

## The order of the clauses

You write `SELECT ... FROM ... WHERE ...`, but the engine logically starts with `FROM` (which
table), then applies `WHERE` (which rows), and only then computes the `SELECT` list (which
columns). That is why a `WHERE` condition can use any column of the table, even one you do
not select.
'''

