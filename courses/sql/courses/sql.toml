kind = "drill"
id = "sql-u01-d2-expressions"
title = "Arithmetic and text expressions"
points = 10
difficulty = 1
placeholder_policy = "shown"
run_command = "sqlite3 < main.sql"
intro = '''
An **expression** is anything that produces a value: `7 * 5`, `'a' || 'b'`, `1 + NULL`. The
engine evaluates each expression once per result row, following precedence rules just like
school arithmetic. The type of the inputs decides the operation: two integers divide as
integers, while one real number makes the whole division real.
'''
prompt = '''
Compute arithmetic with and without parentheses, compare integer and real division, join
text with `||`, and see what happens when `NULL` takes part in a calculation.

**Why:** most bugs in early SQL come from these rules: `7 / 2` being `3`, `+` not joining
text, and `NULL` swallowing a whole calculation.
'''
target = '''
-- Arithmetic follows the usual rules of precedence.
SELECT 7 + 5 AS plus, 7 - 5 AS minus, 7 * 5 AS times;
SELECT 2 + 3 * 4 AS no_parens, (2 + 3) * 4 AS with_parens;

-- Dividing two integers drops the fraction.
SELECT 7 / 2 AS int_division, 7 / 2.0 AS real_division, 7 % 2 AS remainder;

-- Text is joined with ||, and a quote inside text is doubled.
SELECT 'Good ' || 'morning' || '!' AS greeting;
SELECT 'It''s ' || 21 || ' degrees' AS weather;
SELECT 1 + NULL AS unknown;
'''
line_comments = [
  "A comment introducing the first group of statements.",
  "Three columns from the basic operators: `+` adds, `-` subtracts, `*` multiplies.",
  "`*` binds tighter than `+`, so the first is `2 + 12`; parentheses force `5 * 4` instead.",
  "",
  "A comment introducing the division examples.",
  "Integer `/` truncates to `3`; with `2.0` the division is real and gives `3.5`; `%` is the remainder, `1`.",
  "",
  "A comment introducing text expressions.",
  "`||` joins (concatenates) text values into one.",
  "`''` inside quotes is one literal quote; the number `21` is turned into text so it can be joined.",
  "Any arithmetic involving `NULL` gives `NULL`: an unknown input makes an unknown result.",
]
explanation = '''
The output was:

```text
plus|minus|times
12|2|35
no_parens|with_parens
14|20
int_division|real_division|remainder
3|3.5|1
greeting
Good morning!
weather
It's 21 degrees
unknown
NULL
```

Precedence gave `14` without parentheses and `20` with them. Integer division dropped the
