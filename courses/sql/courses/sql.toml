instructions = '''
## Your turn

Write a **script** that creates a **view** named `customer_revenue` on this schema:

```sql
CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL REFERENCES customers (id),
  status TEXT NOT NULL,          -- 'paid', 'open' or 'refunded'
  total INTEGER NOT NULL
);
```

The view has one row per customer, **every** customer included, with exactly these columns:

| column | meaning |
|---|---|
| `customer_id` | the customer's id |
| `name` | the customer's name |
| `paid_orders` | how many of their orders have status `'paid'` (0 if none) |
| `revenue` | the sum of the totals of those paid orders (0 if none) |

- Orders that are `'open'` or `'refunded'` count for nothing.
- It must be a view, not a table: the tests insert new orders and customers afterwards and
  expect to see them.
- Do not put an `ORDER BY` in the view, and do not change any data.

Example: Ana (1) has paid orders of 30 and 50 and an open one of 20, Bo (2) has only a refunded
order, Cy (3) has none. Then `SELECT * FROM customer_revenue ORDER BY customer_id` gives:

```
customer_id|name|paid_orders|revenue
1|Ana|2|80
2|Bo|0|0
3|Cy|0|0
```

Hidden tests decide correctness.
'''
