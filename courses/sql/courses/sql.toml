INSERT INTO customers VALUES (1, 'Ana'), (2, 'Bo'), (3, 'Cy');
INSERT INTO orders VALUES
  (1, 1, 'paid', 30), (2, 1, 'paid', 50), (3, 1, 'open', 20), (4, 2, 'refunded', 15);
"""

COLUMNS = ["customer_id", "name", "paid_orders", "revenue"]


class CustomerRevenueTest(unittest.TestCase):
    def open(self, setup):
        conn = script(setup)
        self.addCleanup(conn.close)
        return conn

    def read(self, conn):
        cur = conn.execute("SELECT * FROM customer_revenue")
        self.assertEqual([d[0] for d in cur.description], COLUMNS)
        return sorted(tuple(r) for r in cur.fetchall())

    def test_is_a_view(self):
        conn = self.open(EXAMPLE)
        kinds = conn.execute(
            "SELECT type FROM sqlite_schema WHERE name = 'customer_revenue'").fetchall()
        self.assertEqual(kinds, [("view",)])

