  "Two posts and their tag lists.",
  "Looks for posts tagged sql with a pattern, which also matches inside nosql.",
  "The 1NF design: posts hold only what depends on the post.",
  "Starts the table of (post, tag) pairs.",
  "Which post…",
  "…carries which single tag.",
  "A post has each tag once.",
  "Ends the definition.",
  "The same two posts.",
  "One row per tag: post 1 has two, post 2 has one.",
  "Joins posts to their tag rows…",
