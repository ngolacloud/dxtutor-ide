  ('ana@x.io', 'Luanda'), ('bo@x.io', 'Porto'), ('cy@x.io', 'Luanda');
EXPLAIN QUERY PLAN SELECT city FROM users WHERE email = 'bo@x.io';
CREATE INDEX users_email ON users (email);
EXPLAIN QUERY PLAN SELECT city FROM users WHERE email = 'bo@x.io';
EXPLAIN QUERY PLAN SELECT email FROM users WHERE id = 2;
