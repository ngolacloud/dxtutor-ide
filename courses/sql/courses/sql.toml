```
id|title
1|one
2|two
3|three
id|title
4|four
5|five
6|six
id|title
7|seven
pages
3
```

Each page is the same ordered query with a different window. To serve page 3, SQLite walked
past rows 1 to 6 and discarded them; on a table of millions, a page deep in the list reads
millions of rows to return twenty.
'''

[[unit.step]]
