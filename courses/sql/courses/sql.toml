INSERT INTO posts_flat VALUES (1, 'Intro to SQL', 'sql,beginner'), (2, 'Mongo tips', 'nosql');
SELECT id, title FROM posts_flat WHERE tags LIKE '%sql%' ORDER BY id;
CREATE TABLE posts (id INTEGER PRIMARY KEY, title TEXT NOT NULL);
CREATE TABLE post_tags (
  post_id INTEGER NOT NULL REFERENCES posts(id),
  tag TEXT NOT NULL,
  PRIMARY KEY (post_id, tag)
);
INSERT INTO posts VALUES (1, 'Intro to SQL'), (2, 'Mongo tips');
INSERT INTO post_tags VALUES (1, 'sql'), (1, 'beginner'), (2, 'nosql');
SELECT p.id, p.title
FROM posts AS p JOIN post_tags AS t ON t.post_id = p.id
WHERE t.tag = 'sql'
ORDER BY p.id;
SELECT tag, count(*) AS posts FROM post_tags GROUP BY tag ORDER BY tag;
'''
line_comments = [
