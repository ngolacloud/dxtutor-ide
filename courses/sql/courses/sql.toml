[[unit.step]]
kind = "challenge"
id = "sql-u21-x1-monthly-revenue"
title = "Monthly revenue with empty months"
points = 40
difficulty = 27
entry = "monthly_revenue"
run_command = "python3 -m unittest"
intro = '''
A report that skips empty months lies by omission: a chart drawn from it connects March to
May as if April never happened. Generate the calendar first, then attach the data. This
combines a recursive CTE, safe month stepping, range joins and an outer join that counts
zeros.
'''
instructions = '''
## Your turn

Write **ONE query** (one statement; a `WITH RECURSIVE … SELECT` is fine) over:

```sql
CREATE TABLE payments (
  id INTEGER PRIMARY KEY,
  paid_at TEXT NOT NULL,     -- 'YYYY-MM-DD HH:MM:SS', UTC
  amount INTEGER NOT NULL    -- cents
);
```

Return **one row per calendar month**, from the month of the earliest payment to the month
of the latest payment, **including months with no payments**. Columns, in this order:

| column | meaning |
|---|---|
| `month` | the month as `'YYYY-MM'` |
| `payments` | the number of payments that month (0 if none) |
| `revenue` | the sum of `amount` that month (0 if none, never NULL) |

Order by `month`. An empty table gives no rows. Do not use `'now'`.

Example:

```text
paid_at                 amount
2024-01-31 10:00:00     500
2024-03-02 09:00:00     200
2024-03-31 23:59:59     100
```

gives:

```text
month   | payments | revenue
2024-01 | 1        | 500
2024-02 | 0        | 0
2024-03 | 2        | 300
```

Hidden tests decide correctness.
'''
starter = '''
-- monthly_revenue: write your query below
-- Hint: WITH RECURSIVE months(m) AS (...) starting at date(MIN(paid_at), 'start of month'),
-- stepping with date(m, '+1 month'); then LEFT JOIN payments on a half-open range per month.
'''
tests = '''
SCHEMA = """
CREATE TABLE payments (id INTEGER PRIMARY KEY, paid_at TEXT NOT NULL, amount INTEGER NOT NULL);
"""


def run(*payments):
    values = ", ".join(f"('{ts}', {amount})" for ts, amount in payments)
    setup = SCHEMA + (f"INSERT INTO payments (paid_at, amount) VALUES {values};" if payments else "")
    return query(setup)


class MonthlyRevenueTest(unittest.TestCase):
    def test_example_from_instructions(self):
        cols, rows = run(
            ("2024-01-31 10:00:00", 500),
            ("2024-03-02 09:00:00", 200),
            ("2024-03-31 23:59:59", 100),
        )
        self.assertEqual(cols, ["month", "payments", "revenue"])
        self.assertEqual(rows, [("2024-01", 1, 500), ("2024-02", 0, 0), ("2024-03", 2, 300)])

    def test_rows_are_inserted_out_of_order(self):
        _, rows = run(
            ("2024-05-10 08:00:00", 40),
            ("2024-02-01 00:00:00", 10),
            ("2024-05-01 00:00:00", 2),
            ("2024-02-29 23:00:00", 5),
        )
        self.assertEqual(rows, [
            ("2024-02", 2, 15), ("2024-03", 0, 0), ("2024-04", 0, 0), ("2024-05", 2, 42),
        ])

    def test_year_boundary(self):
        _, rows = run(
            ("2023-11-30 12:00:00", 7),
            ("2024-02-01 00:00:00", 3),
        )
        self.assertEqual(rows, [
            ("2023-11", 1, 7), ("2023-12", 0, 0), ("2024-01", 0, 0), ("2024-02", 1, 3),
        ])

    def test_month_edges(self):
        _, rows = run(
            ("2024-04-30 23:59:59", 1),
            ("2024-05-01 00:00:00", 10),
            ("2024-05-31 23:59:59", 100),
            ("2024-06-01 00:00:00", 1000),
        )
        self.assertEqual(rows, [("2024-04", 1, 1), ("2024-05", 2, 110), ("2024-06", 1, 1000)])

    def test_single_payment(self):
        _, rows = run(("2025-08-17 13:45:00", 999))
        self.assertEqual(rows, [("2025-08", 1, 999)])

    def test_empty_table(self):
        cols, rows = run()
        self.assertEqual(cols, ["month", "payments", "revenue"])
        self.assertEqual(rows, [])

    def test_two_full_years(self):
        payments = [(f"{y}-{m:02d}-15 12:00:00", m) for y in (2022, 2023) for m in (1, 6, 12)]
        _, rows = run(*payments)
        self.assertEqual(len(rows), 24)
        self.assertEqual(rows[0], ("2022-01", 1, 1))
        self.assertEqual(rows[-1], ("2023-12", 1, 12))
        self.assertEqual(sum(r[1] for r in rows), 6)
        self.assertEqual(sum(r[2] for r in rows), 38)
        self.assertEqual([r[0] for r in rows], sorted(r[0] for r in rows))
'''

[unit.step.gabarito]
solution = '''
-- monthly_revenue: every month between the first and last payment
WITH RECURSIVE
  bounds AS (
    SELECT date(MIN(paid_at), 'start of month') AS first_month,
           date(MAX(paid_at), 'start of month') AS last_month
    FROM payments
  ),
  months(m) AS (
    SELECT first_month FROM bounds WHERE first_month IS NOT NULL
    UNION ALL
    SELECT date(m, '+1 month') FROM months, bounds WHERE m < last_month
  )
SELECT strftime('%Y-%m', m) AS month,
       COUNT(p.id) AS payments,
       COALESCE(SUM(p.amount), 0) AS revenue
FROM months
LEFT JOIN payments AS p
  ON p.paid_at >= m AND p.paid_at < date(m, '+1 month')
GROUP BY m
ORDER BY m;
'''
time = "O(n + k·n)"
space = "O(k)"
justification = '''
`MIN` and `MAX` read the **n** payments once (**O(n)**; with an index on `paid_at` each
would be a single **O(log n)** seek). The recursive CTE then produces **k** months, one row
per step, held in a small queue: **O(k)** time and space. Starting from `start of month`
makes every step land on the first of a month, so no month is skipped.

The `LEFT JOIN` has no usable index here, so SQLite runs it as a nested loop: for each of the
k months it scans the payments and keeps those in the half-open range, **O(k·n)**. With an
index on `paid_at`, the range condition becomes a seek (`SEARCH payments USING INDEX …
(paid_at>? AND paid_at<?)`) and the total drops to **O(k log n + n)**. Because the range
compares raw text, it works whatever the time of day, including `23:59:59` on the last day.

`COUNT(p.id)` counts only matched rows, so an empty month shows 0, and `COALESCE` turns the
empty `SUM` (NULL) into 0. Grouping by `m` already orders the k groups by month, so the final `ORDER BY` adds no sort.
'''

[[unit]]
id = "sql-u22-triggers"
title = "Triggers"
level = "advanced"
difficulty = 28
intro = '''
A trigger is SQL that the database runs by itself whenever a row is inserted, updated or
deleted. It is the tool for rules that must hold no matter which program writes the data:
audit logs, counters kept in sync, and invariants a `CHECK` cannot express. You will write
each kind, and learn how `RAISE` stops a write and rolls back its effects.
'''
concepts = '''
## The idea

Constraints such as `NOT NULL` or `CHECK` can only look at the row being written. Some rules
need more: "every change to a balance is recorded", "a post's `comment_count` equals the
number of its comments", "an order cannot take more stock than exists". You could enforce
these in application code, but then every program, script and manual fix has to remember
them. A **trigger** moves the rule into the database, next to the data, so it runs for every
write from every client.

A trigger is an **event-condition-action** rule: *when* a given event happens on a table,
*if* a condition holds, *do* some statements. The action runs inside the same transaction as
the statement that fired it, so either both take effect or neither does.

## How SQLite does it

```sql
CREATE TRIGGER name
{BEFORE | AFTER} {INSERT | UPDATE [OF col, …] | DELETE} ON table
[FOR EACH ROW] [WHEN condition]
BEGIN
  statement; statement; …
END;
```

- SQLite triggers are always **row-level**: the body runs once per affected row (`FOR EACH
  ROW` is the only kind, so it is optional).
- Inside the body, `NEW.col` is the row after the change (INSERT, UPDATE) and `OLD.col` the
  row before it (UPDATE, DELETE).
- `UPDATE OF balance` fires only when the statement's `SET` names `balance`.
- `RAISE(ABORT, 'message')` stops the statement with an error and undoes everything it did,
  including earlier rows and other triggers' work. `RAISE(IGNORE)` silently skips the
  current row. `RAISE(FAIL, …)` stops but keeps the rows already changed.

```sql
CREATE TRIGGER no_empty_names BEFORE INSERT ON users
WHEN trim(NEW.name) = ''
BEGIN
  SELECT RAISE(ABORT, 'name is empty');
END;
```

`RAISE` is called inside a `SELECT`, and the `WHEN` clause decides whether the body runs.
`INSTEAD OF` triggers exist too, only on views, to make a view writable.

## What is special or tricky

- Triggers are invisible at the call site. An `INSERT` that suddenly fails or writes other
  tables surprises whoever did not know the trigger existed; name them clearly.
- A trigger's own writes can fire other triggers (nesting works), but a trigger does not
  re-fire itself unless `PRAGMA recursive_triggers = ON`.
- Each fired row costs extra statements. A bulk update of a million rows runs the body a
  million times.
- PostgreSQL triggers call a separate function (usually PL/pgSQL) and can also be
  statement-level; MySQL triggers are row-level, and signal errors with `SIGNAL`.

## What you will practise

You will write an audit-log trigger, keep a derived counter in sync on insert and delete,
and guard a rule with `RAISE`. The challenge keeps product stock consistent with orders.
'''

[[unit.step]]
kind = "concept"
id = "sql-u22-c1-event-condition-action"
title = "Event, condition, action"
points = 5
difficulty = 28
intro = '''
A trigger is a stored rule that the engine weaves into the execution of every matching
write. For each affected row it evaluates the condition and, if it holds, runs the action
statements inside the same transaction, so a failed action undoes the original write.
'''
body = '''
## BEFORE or AFTER

```sql
CREATE TRIGGER items_touch AFTER UPDATE ON items
WHEN NEW.price IS NOT OLD.price
BEGIN
  UPDATE items SET version = version + 1 WHERE id = NEW.id;
END;
```

- A **BEFORE** trigger runs before the row is written. It is the natural place to *reject*
  a write with `RAISE`, because nothing has happened yet.
- An **AFTER** trigger runs once the row is in place. It is the place for *consequences*:
  writing an audit row, updating a counter in another table.

## OLD and NEW

`NEW` is the row as it will be after the change and `OLD` the row as it was. An INSERT has
only `NEW`, a DELETE only `OLD`, an UPDATE both. Comparing them in `WHEN` lets a trigger
ignore updates that changed nothing relevant. Use `IS NOT` rather than `<>` when the column
can be NULL, because `NULL <> 5` is NULL, not true.

## Three classic uses

1. **Audit log**: AFTER UPDATE/DELETE, insert `OLD` and `NEW` values into a history table.
2. **Derived data**: AFTER INSERT/DELETE on a child table, adjust a count or total on the
   parent, so reads do not have to aggregate.
3. **Invariants**: BEFORE INSERT/UPDATE, look at other rows and `RAISE(ABORT, …)` if the
   write would break a rule.

## Atomicity

The statement and all the trigger work it causes form one unit. If any trigger raises
`ABORT`, SQLite rolls back every change made by that statement, so a half-applied write
never becomes visible.
'''

[[unit.step]]
kind = "drill"
id = "sql-u22-d1-audit"
title = "An audit log with AFTER UPDATE"
points = 10
difficulty = 28
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
An audit trigger turns every qualifying change into an extra INSERT into a history table.
The engine evaluates the `WHEN` condition once per updated row with `OLD` and `NEW` bound,
so a multi-row UPDATE produces one log entry per row that really changed.
'''
prompt = '''
Create an accounts table and a log table, add a trigger that records every real change of a
balance, then run several updates, some of which should not be logged.

**Why:** auditing in the database captures changes from every client, including the manual
fix someone runs at 2 a.m. in a console.
'''
target = '''
CREATE TABLE accounts (id INTEGER PRIMARY KEY, owner TEXT, balance INTEGER);
CREATE TABLE account_log (account_id INTEGER, old_balance INTEGER, new_balance INTEGER);

CREATE TRIGGER accounts_audit
AFTER UPDATE OF balance ON accounts
FOR EACH ROW
WHEN OLD.balance IS NOT NEW.balance
BEGIN
  INSERT INTO account_log VALUES (OLD.id, OLD.balance, NEW.balance);
END;

INSERT INTO accounts VALUES (1, 'Ana', 100), (2, 'Bo', 50);
UPDATE accounts SET balance = balance - 30 WHERE id = 1;
UPDATE accounts SET balance = balance + 0 WHERE id = 2;
UPDATE accounts SET owner = 'Bob' WHERE id = 2;
UPDATE accounts SET balance = balance + 10;

SELECT * FROM account_log ORDER BY rowid;
'''
line_comments = [
  "The table being audited.",
  "The history table: one row per balance change.",
  "",
  "Names the trigger; the name is how you later drop or find it.",
  "Fires after an UPDATE whose SET clause mentions `balance`.",
  "Runs once per updated row (the only mode SQLite has).",
  "Skips updates that left the balance unchanged.",
  "Starts the trigger body.",
  "Records the account and its balance before and after.",
  "Ends the body; the statement is complete only here.",
  "",
  "Two accounts. INSERT does not fire an UPDATE trigger.",
  "A real change for Ana: 100 to 70. Logged.",
  "Names `balance` but changes nothing, so `WHEN` is false. Not logged.",
  "Changes only the owner: `UPDATE OF balance` does not fire at all.",
  "Updates both rows: the trigger runs twice and logs both changes.",
  "",
  "Shows the log in insertion order.",
]
explanation = '''
The output was:

```text
account_id|old_balance|new_balance
1|100|70
1|70|80
2|50|60
```

Three log rows for five writes: the no-op update was filtered by `WHEN`, and the rename never
fired the trigger because it did not touch `balance`. The last UPDATE changed two rows and
produced two log entries, because SQLite triggers are row-level.
'''

[[unit.step]]
kind = "drill"
id = "sql-u22-d2-derived"
title = "Keep a derived counter in sync"
points = 10
difficulty = 28
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A stored counter trades write cost for read cost: every comment insert or delete pays one
extra indexed UPDATE on the parent, and in exchange reading the count is a single column
lookup instead of a `COUNT(*)` over the child table. Triggers make that trade safe, because
no writer can forget the second half.
'''
prompt = '''
Give posts a `comment_count` column, keep it correct with one trigger on INSERT and one on
DELETE of comments, then compare the stored count with a live `COUNT(*)`.

**Why:** denormalised counters are everywhere (likes, replies, stock), and they drift the
moment one code path forgets to update them.
