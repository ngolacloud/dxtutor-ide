        self.assertEqual(rows, [("Ana", 0, 0), ("Bo", 0, 0)])

    def test_no_authors(self):
        self.assertEqual(self.check(SCHEMA), [])

    def test_larger_data(self):
        self.check(SCHEMA + """
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 300)
            INSERT INTO authors SELECT i, 'author ' || (i % 40) FROM n;
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 900)
            INSERT INTO posts SELECT i, (i * 7) % 250 + 1, 'post' FROM n;
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 2000)
            INSERT INTO comments SELECT i, (i * 11) % 700 + 1, 'c' FROM n;
        """)
'''

[unit.step.gabarito]
solution = '''
-- author_stats: one statement for every author
SELECT a.name AS author,
       COUNT(DISTINCT p.id) AS posts,
       COUNT(c.id) AS comments
FROM authors AS a
LEFT JOIN posts AS p ON p.author_id = a.id
LEFT JOIN comments AS c ON c.post_id = p.id
GROUP BY a.id
ORDER BY a.name, a.id;
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Let **n** be the total number of rows in the three tables. Neither foreign key is indexed, so
SQLite builds a temporary **automatic index** on `posts.author_id` and on `comments.post_id`
(**O(n log n)** each) and then runs the joins as nested loops of seeks into them:
for each author, a seek to their posts; for each post, a seek to its comments. That visits
every author, post and comment once, at **O(log n)** per seek. Grouping by `a.id` and the final
sort on `(name, id)` add **O(n log n)**. The automatic indexes and the groups take **O(n)** space.

The joined rows repeat each post once per comment, which is why posts are counted with
`COUNT(DISTINCT p.id)`, while each comment appears exactly once, so `COUNT(c.id)` is exact. Both
skip the `NULL`s a `LEFT JOIN` produces, which gives 0 for authors without posts or comments.

The N+1 version does similar index work but pays the fixed cost of a statement **2N + 1**
times, and without indexes each of its counts is a full scan: **O(n)** per author.
'''

[[unit]]
id = "sql-udb4-pagination"
title = "Pagination: OFFSET versus keyset"
level = "intermediate"
difficulty = 19
intro = '''
Long lists are served a page at a time. `LIMIT ... OFFSET` is the obvious way, but the database
still walks every skipped row, and pages shift when new rows arrive. You will see both problems,
then page with a **keyset**: "the rows after the last one I showed", which needs a unique, stable
order. The challenge is a feed query that pages correctly through ties and new inserts.
'''
concepts = '''
## The idea

A feed, a search result or an admin table can hold millions of rows; a page shows twenty. Pagination needs two things: a **total order** (every row has one definite position) and a way to say **where the page starts**.

## OFFSET pagination

```sql
SELECT id, title FROM posts ORDER BY id DESC LIMIT 20 OFFSET 40;   -- page 3
```

Simple, and it can jump to any page number. But `OFFSET 40` does not seek: SQLite produces the first 40 rows of the order and throws them away. Page *p* costs **O(p × size)**, so deep pages get slower and slower. Worse, the offset counts positions, not rows: if a new post arrives between two requests, every row moves down one place and the next page repeats a row; a deletion makes it skip one.

## Keyset pagination

Instead of a position, remember the **sort key of the last row shown** (the cursor) and ask for the rows that come after it:

```sql
SELECT id, created_at, title FROM events
WHERE (created_at, id) < ('2024-05-02', 4)
ORDER BY created_at DESC, id DESC
LIMIT 20;
```

With an index whose order matches the `ORDER BY`, this is a **seek** to the cursor followed by reading 20 entries: **O(log n + size)** for any page, the first or the ten-thousandth. New rows before the cursor do not shift anything, because the cursor names a row, not a position.

The comparison `(created_at, id) < (?, ?)` is a **row value**: it compares `created_at` first and uses `id` only to break a tie, exactly like the `ORDER BY`. SQLite (3.15+) and PostgreSQL support it, and both can use an index for it. Where row values are missing, write it out: `created_at < ? OR (created_at = ? AND id < ?)`.

## What is special or tricky

- **The order must be unique.** Sorting by `created_at` alone leaves rows with the same timestamp in an arbitrary order, which can differ between two queries. Add a **tie-breaker**, usually the primary key, to the `ORDER BY` and to the cursor.
- **Match the directions.** `<` goes with `DESC` and `>` with `ASC`, and a row value works only if every column sorts in the same direction.
- **A cursor on the timestamp alone skips rows.** `WHERE created_at < ?` jumps over the rest of a group of rows that share the last timestamp.
- Keyset pagination cannot jump to page 37 or count pages cheaply; it fits "load more" and infinite scroll. OFFSET is fine for small tables and shallow pages.
- `NULL`s in a sort column break the comparisons (they are neither less nor greater). Keep sort columns `NOT NULL`.

## What you will practise

You will page with `OFFSET`, watch an insert shift the pages, and page through ties with a row-value keyset. The challenge is a reusable next-page query with named parameters.
'''

[[unit.step]]
kind = "concept"
id = "sql-udb4-c1-keyset"
title = "Keyset pagination"
points = 5
difficulty = 19
intro = '''
`OFFSET k` is a linear skip: the engine must produce k rows to discard them, because a B-tree
cannot jump to "the k-th entry". A keyset condition is a comparison on the sort key, which a
B-tree answers with a logarithmic seek.
'''
body = '''
## The two ways side by side

```sql
-- OFFSET: page 3 of 20 rows
SELECT id, created_at, title FROM events
ORDER BY created_at DESC, id DESC
LIMIT 20 OFFSET 40;

-- Keyset: the 20 rows after the last row of page 2
SELECT id, created_at, title FROM events
WHERE (created_at, id) < (:last_created_at, :last_id)
ORDER BY created_at DESC, id DESC
LIMIT 20;
```

| | OFFSET | Keyset |
|---|---|---|
| Cost of page p | O(p × size): skipped rows are read | O(log n + size) with a matching index |
| New rows arrive | rows repeat or are skipped | unaffected |
| Jump to page 37 | yes | no, only "next" |

## The recipe

1. Pick an order that is **unique**: the business column, then the primary key as a tie-breaker.
2. Return that key with every row. The client keeps the last row's key as the **cursor**.
3. Ask for the rows strictly after the cursor in the same order: `<` for `DESC`, `>` for `ASC`.
4. An index on the sort column (the rowid is appended to every index entry) lets SQLite seek
   to the cursor and read the page in order, with no sort.

`:last_id` is a **named parameter**: the application binds a value to it, just as with `?`.
'''

[[unit.step]]
kind = "drill"
id = "sql-udb4-d1-offset"
title = "Pages with LIMIT and OFFSET"
points = 10
difficulty = 19
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
`LIMIT n OFFSET k` takes the ordered result, discards the first k rows and returns the next n.
The order must be total (here by the primary key), or the same row could appear on two pages.
The discarded rows are still produced, so the cost grows with k.
'''
prompt = '''
Create seven posts and print them three per page with `LIMIT 3` and offsets 0, 3 and 6.
'''
