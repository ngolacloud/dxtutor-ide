[[unit.step]]
kind = "challenge"
id = "sql-udb4-x1-next-page"
title = "Write next_page"
points = 30
difficulty = 19
entry = "next_page"
intro = '''
A production feed query must be correct for every cursor: in the middle of a group of ties, at
the very end, and while new rows keep arriving. The hidden tests walk the whole feed page by
page, with different page sizes, and compare it with the full ordered list.
'''
instructions = '''
## Your turn

Write **ONE query** that returns the next page of a newest-first feed:

```sql
CREATE TABLE events (
  id INTEGER PRIMARY KEY,
  created_at TEXT NOT NULL,     -- 'YYYY-MM-DD HH:MM', many events share one
  title TEXT NOT NULL
);
CREATE INDEX events_created ON events (created_at);
```

The feed order is **newest first**: `created_at` descending, and for equal `created_at`,
`id` descending. Your query receives three **named parameters**:

| parameter | meaning |
|---|---|
| `:cursor_at` | the `created_at` of the last event the user has seen |
| `:cursor_id` | the `id` of that event |
| `:size` | how many events to return |

Return the at most `:size` events that come **after** the cursor in the feed order, in that
order, with the columns `id`, `created_at`, `title`.

The first page is requested with the cursor `('9999-12-31', 0)`, which comes before every
real event in the feed order. Do not use `OFFSET`; the cursor names a row, not a position.

Example, with events `(1, '2024-05-01 10:00', 'a')`, `(2, '2024-05-02 09:00', 'b')`,
`(3, '2024-05-02 09:00', 'c')`, `(4, '2024-05-03 08:00', 'd')` and
`:cursor_at = '2024-05-02 09:00'`, `:cursor_id = 3`, `:size = 2`:

```
id|created_at|title
2|2024-05-02 09:00|b
1|2024-05-01 10:00|a
```

Hidden tests decide correctness.
'''
starter = '''
-- next_page: write your query below
-- Hint: compare (created_at, id) with (:cursor_at, :cursor_id) and order the same way.
'''
tests = '''
SCHEMA = """
CREATE TABLE events (
  id INTEGER PRIMARY KEY,
  created_at TEXT NOT NULL,
  title TEXT NOT NULL
);
CREATE INDEX events_created ON events (created_at);
"""

DATA = SCHEMA + """
INSERT INTO events VALUES
  (1, '2024-05-01 10:00', 'a'), (2, '2024-05-02 09:00', 'b'),
  (3, '2024-05-02 09:00', 'c'), (4, '2024-05-03 08:00', 'd'),
  (5, '2024-05-02 09:00', 'e'), (6, '2024-04-30 23:59', 'f'),
  (7, '2024-05-03 08:00', 'g'), (8, '2024-05-02 09:00', 'h'),
  (9, '2024-05-01 10:00', 'i'), (10, '2024-05-04 12:00', 'j');
"""

EXAMPLE = SCHEMA + """
INSERT INTO events VALUES
  (1, '2024-05-01 10:00', 'a'), (2, '2024-05-02 09:00', 'b'),
  (3, '2024-05-02 09:00', 'c'), (4, '2024-05-03 08:00', 'd');
"""

FIRST = ("9999-12-31", 0)


def feed(conn):
    return conn.execute(
        "SELECT id, created_at, title FROM events ORDER BY created_at DESC, id DESC"
    ).fetchall()


class NextPageTest(unittest.TestCase):
    def open(self, setup):
        conn = connect(setup)
        self.addCleanup(conn.close)
        return conn

    def page(self, conn, cursor, size):
        cur = conn.execute(STUDENT_SQL, {"cursor_at": cursor[0], "cursor_id": cursor[1],
                                         "size": size})
        self.assertIsNotNone(cur.description, "the script must be one SELECT")
        self.assertEqual([d[0] for d in cur.description], ["id", "created_at", "title"])
        return [tuple(r) for r in cur.fetchall()]

    def walk(self, conn, size):
        out, cursor = [], FIRST
        for _ in range(100):
            rows = self.page(conn, cursor, size)
            self.assertLessEqual(len(rows), size)
            out.extend(rows)
            if len(rows) < size:
                break
            cursor = (rows[-1][1], rows[-1][0])
        return out

    def test_example(self):
        conn = self.open(EXAMPLE)
        self.assertEqual(self.page(conn, ("2024-05-02 09:00", 3), 2),
                         [(2, "2024-05-02 09:00", "b"), (1, "2024-05-01 10:00", "a")])

    def test_first_page(self):
        conn = self.open(DATA)
        self.assertEqual(self.page(conn, FIRST, 3), feed(conn)[:3])

    def test_cursor_inside_ties(self):
        conn = self.open(DATA)
        self.assertEqual([r[0] for r in self.page(conn, ("2024-05-02 09:00", 8), 3)], [5, 3, 2])

    def test_walk_whole_feed(self):
        conn = self.open(DATA)
        for size in (1, 2, 3, 4, 10, 11):
            self.assertEqual(self.walk(conn, size), feed(conn), "page size %d" % size)

    def test_walk_many_ties(self):
        conn = self.open(SCHEMA + """
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 500)
            INSERT INTO events
            SELECT i, '2024-06-' || printf('%02d', 1 + (i * 37) % 9) || ' 12:00', 't' || i FROM n;
        """)
        self.assertEqual(self.walk(conn, 7), feed(conn))

    def test_after_last_event_is_empty(self):
        conn = self.open(DATA)
        self.assertEqual(self.page(conn, ("2024-04-30 23:59", 6), 5), [])
        self.assertEqual(self.page(self.open(SCHEMA), FIRST, 5), [])

    def test_new_events_do_not_shift_pages(self):
        conn = self.open(DATA)
        first = self.page(conn, FIRST, 4)
        conn.execute("INSERT INTO events VALUES (11, '2024-05-05 00:00', 'new'), "
                     "(12, '2024-05-03 08:00', 'late')")
        cursor = (first[-1][1], first[-1][0])
        expected = [r for r in feed(conn) if (r[1], r[0]) < cursor][:4]
        self.assertEqual(self.page(conn, cursor, 4), expected)

    def test_reads_the_index_in_order(self):
        conn = self.open(DATA)
        plan = [row[3] for row in conn.execute(
            "EXPLAIN QUERY PLAN " + STUDENT_SQL,
            {"cursor_at": "2024-05-02 09:00", "cursor_id": 3, "size": 2})]
        self.assertFalse(any("TEMP B-TREE" in d for d in plan), plan)
'''

[unit.step.gabarito]
solution = '''
-- next_page: keyset pagination, newest first
SELECT id, created_at, title
FROM events
WHERE (created_at, id) < (:cursor_at, :cursor_id)
ORDER BY created_at DESC, id DESC
LIMIT :size;
'''
time = "O(log n + k)"
space = "O(k)"
justification = '''
The index `events_created` holds `(created_at, rowid)` entries in sorted order, which is exactly
the feed order read backwards. SQLite seeks the index to the cursor in **O(log n)**, then walks
backwards and stops after **k** = `:size` entries, fetching each row by rowid. Because the
index delivers the rows already ordered, there is no sort step, and the cost of a page does
not depend on how deep in the feed it is: **O(log n + k)** for page 1 or page 10 000, with
**O(k)** for the result.

The row value `(created_at, id) < (?, ?)` compares the date first and the id only on a tie, the
same rule as the `ORDER BY`, so a cursor inside a group of equal timestamps continues with the
rest of that group. The `OFFSET` equivalent would read and discard every earlier row, **O(p × k)**
for page p, and would repeat or skip rows whenever the feed changes between requests.
'''

[[unit]]
id = "sql-udb5-views"
title = "Views"
level = "intermediate"
difficulty = 20
intro = '''
A view is a query with a name, stored in the schema and used like a table. It holds no rows of
its own: every time you read it, its query runs again on the current data. You will create and
query views, see the planner look straight through one, and compare views with CTEs. The
challenge is a reporting view that every dashboard can share.
'''
concepts = '''
## The idea

Some queries are written again and again: "paid orders", "revenue per customer", "active users". Copying the same joins and filters into every report is how definitions drift apart, until two dashboards disagree on what "revenue" means. A **view** gives the query a name and stores it in the database, so everyone reads the same definition.

```sql
CREATE VIEW paid_orders AS
SELECT id, customer_id, total
FROM orders
WHERE status = 'paid';

SELECT customer_id, SUM(total) FROM paid_orders GROUP BY customer_id;
```

A view is a **virtual table**. The database stores its `SELECT`, not its result. Reading the view runs the query on the tables as they are right now, so a view is never stale, and it takes no space beyond its definition.

## How SQL expresses it

- `CREATE VIEW name AS SELECT ...` defines it; `CREATE VIEW IF NOT EXISTS` skips it when it already exists; `DROP VIEW name` removes the definition (never any data).
- The view's columns are the `SELECT`'s output names, so give every computed column an alias (`COUNT(o.id) AS orders`). You can also list them: `CREATE VIEW v (a, b) AS ...`.
- A view is used anywhere a table can be read: in `FROM`, in a `JOIN`, in a subquery, or inside another view.
- Views appear in `sqlite_schema` with `type = 'view'`.

The planner does not run the view first and then filter its result. Where it can, SQLite **flattens** the view into the outer query, so `SELECT * FROM paid_orders WHERE customer_id = 7` is planned as if you had written the `WHERE` against `orders`, and an index on `orders.customer_id` is used.

## Views versus CTEs

A CTE (`WITH name AS (...) SELECT ...`, unit 22) is also a named query, but it exists only inside the one statement that defines it. Use a CTE to make a single query readable; use a view when many queries, people or tools need the same definition. Neither stores data.

## What is special or tricky

- In SQLite, views are **read-only**: `INSERT`, `UPDATE` and `DELETE` on a view fail unless you write `INSTEAD OF` triggers (unit 28). PostgreSQL and MySQL can update simple views directly.
- SQLite has no **materialized** views, which store the result and must be refreshed. PostgreSQL has `CREATE MATERIALIZED VIEW` and `REFRESH MATERIALIZED VIEW`; in SQLite you would maintain a summary table yourself.
- Don't rely on an `ORDER BY` inside a view: order the query that reads it.
- Dropping or renaming a column a view uses breaks the view; the error appears only when the view is read.
- A view on a view on a view is still one big query. Readable names do not make it cheap.

## What you will practise

You will create a view and see it follow new data, read a query plan through a view, and write the same report as a CTE. The challenge is a revenue view that keeps every customer.
'''

[[unit.step]]
kind = "concept"
id = "sql-udb5-c1-views"
title = "A stored query, not stored rows"
points = 5
difficulty = 20
intro = '''
In relational algebra a view is a derived relation: an expression over base relations that
can be used wherever a relation can. The engine substitutes the expression into the query that
reads it, then optimises the whole thing as one.
'''
body = '''
## Defining and reading a view

```sql
CREATE VIEW customer_orders AS
SELECT c.name, o.id AS order_id, o.total
FROM customers AS c
JOIN orders AS o ON o.customer_id = c.id;

SELECT name, SUM(total) AS spent
FROM customer_orders
GROUP BY name;
```

- The view stores the `SELECT`. Every read reruns it on the current data.
- It behaves like a table in `FROM`, joins and subqueries.
- The column names come from the `SELECT`: alias every expression.

## What it costs

A view adds no work by itself. SQLite inlines (flattens) the view's query into the outer one
and plans them together, so a filter on the view can use the indexes of the base tables. A
view is exactly as fast as the query you would have written by hand, no faster: it caches
nothing.

## View or CTE?

| | View | CTE (`WITH`) |
|---|---|---|
| Lives in | the schema, until `DROP VIEW` | one statement |
| Shared by | every query and every user | that statement only |
| Good for | a shared definition, a stable interface | readability inside one query |

Neither stores rows. When you need stored results (a slow report read a thousand times), use a
summary table, or a materialized view in databases that have one.
'''

