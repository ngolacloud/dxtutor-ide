time = "O(m log n)"
space = "O(1)"
justification = '''
SQLite scans the **m** rows of `incoming` once. For each one it seeks the unique index on
`products.sku` (**O(log n)** for **n** products), then either inserts the row, which adds an
entry to the table B-tree and to the `sku` index, or updates the row it found in place, each
**O(log n)**. Total **O(m log n)**, and rows are streamed one at a time, so the extra space is
**O(1)**.

The `WHERE` on `DO UPDATE` is what makes the merge order-independent and idempotent: a
duplicate `sku` inside `incoming` conflicts with the row inserted moments earlier and wins
only if it is newer, and a second run finds equal timestamps and does nothing. Because the
row is updated in place and `SET` lists only `name`, `price` and `updated_at`, `id` and `stock`
survive. `INSERT OR REPLACE` would delete and reinsert the row, resetting `stock` to 0, giving it
a new `id`, and letting stale data win. `WHERE true` only resolves the parser ambiguity between
`ON CONFLICT` and a join's `ON`.
'''

# ── g5-advanced ────────────────────────────────────────────────────────────

[[unit]]
id = "sql-u16-ctes"
title = "Common table expressions (WITH)"
level = "advanced"
difficulty = 22
intro = '''
Real reports are built in stages: total per customer, then an average of those totals, then
the customers above it. A common table expression (`WITH name AS (...)`) gives each stage a
name, so a long query reads top to bottom like a recipe instead of inside out. You will write
a single CTE, chain several, reuse one twice, and then build a multi-stage report with them.
'''
concepts = '''
## The idea

A query's result is itself a table, and SQL lets you query a table. So far you nested one
query inside another as a **subquery**, which works but reads inside out: to understand the
outer query you first have to find and decode the inner one, often several levels deep.

A **common table expression** (CTE) pulls the inner query out to the top and gives it a
name. The rest of the statement uses that name like an ordinary table. Each CTE is a step of
the computation with a label, which is exactly how you would describe the report out loud:
"first total each customer, then average those totals, then keep whoever beats the average".

## How SQL expresses it

A CTE is introduced by `WITH`, before the main statement. Several CTEs are separated by
commas, and each one may refer to the ones defined **before** it.

```sql
WITH paid AS (
  SELECT * FROM orders WHERE status = 'paid'
),
per_day AS (
  SELECT day, COUNT(*) AS n FROM paid GROUP BY day
)
SELECT day, n FROM per_day ORDER BY day;
```

You can name the columns in a list after the CTE name, `WITH monthly(month, revenue) AS
(...)`, which is handy when the inner columns are expressions. A CTE can be referenced more
than once, for example joined to itself, which a subquery cannot do without being written
twice. `WITH` also works in front of `INSERT`, `UPDATE` and `DELETE`.

A CTE lives for **one statement** only. Unlike a view (`CREATE VIEW`), nothing is stored in
the schema; after the semicolon the name is gone.

## How SQLite runs it

A CTE is not a temporary table that is always computed first. SQLite's planner treats a CTE
used once like a subquery and usually **flattens** it into the outer query, so filters and
indexes still apply. A CTE used several times may be **materialized**: computed once into a
temporary structure and read back. Since SQLite 3.35 you can force either choice with
`AS MATERIALIZED (...)` or `AS NOT MATERIALIZED (...)`, the same syntax as PostgreSQL 12+.
MySQL supports CTEs from 8.0.

## What is special or tricky

- A CTE with the same name as a real table **hides** that table inside the statement.
- `ORDER BY` inside a CTE does not order the final result. Sort in the outer query.
- Old PostgreSQL versions (before 12) always materialized CTEs, so they acted as an
  "optimization fence". Advice written for those versions does not apply to SQLite.
- A CTE whose aggregate should include rows with no matches still needs a `LEFT JOIN` and
  `COALESCE`, exactly like a plain query: naming a stage does not change its semantics.

## What you will practise

You will name one subquery, chain a CTE that depends on another, and join a CTE to itself
to compare each month with the one before. The challenge is a three-stage report whose
middle stage is easy to get subtly wrong.
'''

[[unit.step]]
kind = "concept"
id = "sql-u16-c1-with"
title = "Naming the stages of a query"
points = 5
difficulty = 22
intro = '''
In relational algebra every operator returns a relation, so operators compose. A CTE is a
named intermediate relation: the planner still sees one statement and is free to inline
it, so naming a stage costs nothing by default.
'''
body = '''
## A subquery versus a CTE

The same question written both ways: which customers spent more than 50?

```sql
-- inside out
SELECT customer, total
FROM (SELECT customer, SUM(amount) AS total
      FROM orders GROUP BY customer)
WHERE total > 50;

-- top to bottom
WITH totals AS (
  SELECT customer, SUM(amount) AS total
  FROM orders
  GROUP BY customer
)
SELECT customer, total
FROM totals
WHERE total > 50;
```

Both return the same rows and SQLite plans them the same way. The second reads in the order
the work happens, and the stage now has a name you can reuse.

## Chaining

```sql
WITH a AS (...),
     b AS (SELECT ... FROM a),
     c AS (SELECT ... FROM a JOIN b ON ...)
SELECT ... FROM c;
```

- One `WITH`, then comma-separated definitions. Never repeat `WITH`.
- Each CTE may use the ones above it, not the ones below.
- The main statement follows the last definition, with no comma before it.
- A one-row CTE (an average, a maximum) can be combined with every row of another using
  `CROSS JOIN`, which avoids repeating a scalar subquery in several places.

## When to reach for one

Use a CTE when a query has more than one logical step, when the same derived table is
needed twice, or when you want to test a stage on its own by selecting from it directly.
For a single, short filter, a plain `WHERE` is still clearer.
'''

