    def test_moving_average_slides(self):
        _, rows = query(txs(
            (5, "M", "2024-02-05 00:00", 1),
            (1, "M", "2024-02-01 00:00", 10),
            (3, "M", "2024-02-03 00:00", 40),
            (2, "M", "2024-02-02 00:00", 20),
