INSERT INTO budget VALUES ('Ops', 100, 120, NULL, 90), ('Sales', 200, 180, 210, 260);
WITH long AS (
  SELECT b.dept, q.column1 AS quarter,
         CASE q.column1 WHEN 1 THEN b.q1 WHEN 2 THEN b.q2
                        WHEN 3 THEN b.q3 ELSE b.q4 END AS amount
  FROM budget AS b
