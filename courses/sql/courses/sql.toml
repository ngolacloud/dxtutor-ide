[[unit.step]]
kind = "challenge"
id = "sql-u03-x1-restock"
title = "Find the products to restock"
points = 20
difficulty = 3
entry = "restock"
run_command = "python3 -m unittest"
intro = '''
A single `WHERE` clause can carry several conditions joined with `AND`. The engine still does
one pass over the table, evaluating the combined predicate for each row, so adding
conditions makes the result smaller without adding a second scan. The hard part is getting
the logic right, especially around `NULL` and `OR`.
'''
instructions = '''
## Your turn

Write **one query** for this table:

```sql
CREATE TABLE products (
  id          INTEGER PRIMARY KEY,
  name        TEXT,
  category    TEXT,
  price_cents INTEGER,
  stock       INTEGER   -- NULL when nobody has counted it yet
);
```

Return the `id` and `name` (in that order) of every product that a shop should restock. A
product must be restocked when **all** of these hold:

- its `category` is `tea`, `coffee` or `cocoa`;
- its `stock` is below 10, **or** its stock is unknown (`NULL`);
- its `price_cents` is between 200 and 2000, both included;
- its `name` does not start with `Sample` (in any letter case: `sample` counts too).

Example:

```text
id|name|category|price_cents|stock
1|Green tea|tea|450|3
2|Espresso beans|coffee|1290|25
3|Sample cocoa|cocoa|300|0
4|Honey|pantry|675|2
5|Matcha|tea|2400|1
6|Decaf|coffee|980|NULL
```

gives:

```text
id|name
1|Green tea
6|Decaf
```

Row order does not matter. Hidden tests run your query against several different tables.
'''
starter = '''
-- restock: write your query below
-- Hint: one WHERE with AND between the four rules; mind NULL and the parentheses around OR.
'''
tests = '''
SCHEMA = """
CREATE TABLE products (
  id INTEGER PRIMARY KEY, name TEXT, category TEXT, price_cents INTEGER, stock INTEGER
);
"""


def restock(rows):
    conn = connect(SCHEMA)
    conn.executemany("INSERT INTO products VALUES (?, ?, ?, ?, ?)", rows)
    cur = conn.execute(STUDENT_SQL)
    cols = [d[0] for d in cur.description or []]
    result = sorted(tuple(r) for r in cur.fetchall())
    conn.close()
    return cols, result


EXAMPLE = [
    (1, "Green tea", "tea", 450, 3),
    (2, "Espresso beans", "coffee", 1290, 25),
    (3, "Sample cocoa", "cocoa", 300, 0),
    (4, "Honey", "pantry", 675, 2),
    (5, "Matcha", "tea", 2400, 1),
    (6, "Decaf", "coffee", 980, None),
]


class RestockTest(unittest.TestCase):
    def test_column_names(self):
        cols, _ = restock(EXAMPLE)
        self.assertEqual(cols, ["id", "name"])

    def test_example(self):
        _, rows = restock(EXAMPLE)
        self.assertEqual(rows, [(1, "Green tea"), (6, "Decaf")])

    def test_price_bounds_are_inclusive(self):
        _, rows = restock([
            (1, "Cheap tea", "tea", 199, 1),
            (2, "Low tea", "tea", 200, 1),
            (3, "High tea", "tea", 2000, 1),
            (4, "Dear tea", "tea", 2001, 1),
        ])
        self.assertEqual(rows, [(2, "Low tea"), (3, "High tea")])

    def test_stock_below_ten_or_unknown(self):
        _, rows = restock([
            (1, "Mocha", "coffee", 500, 9),
            (2, "Latte", "coffee", 500, 10),
            (3, "Ristretto", "coffee", 500, None),
            (4, "Lungo", "coffee", 500, 0),
            (5, "Doppio", "coffee", 500, 40),
        ])
        self.assertEqual(rows, [(1, "Mocha"), (3, "Ristretto"), (4, "Lungo")])

    def test_only_tea_coffee_and_cocoa(self):
        _, rows = restock([
            (1, "Dark cocoa", "cocoa", 800, 2),
            (2, "Jam", "pantry", 500, None),
            (3, "Mug", "kitchen", 900, 1),
            (4, "Oolong", "tea", 700, None),
        ])
        self.assertEqual(rows, [(1, "Dark cocoa"), (4, "Oolong")])

    def test_samples_are_left_out_in_any_case(self):
        _, rows = restock([
            (1, "Sample tea", "tea", 300, 1),
            (2, "sample coffee", "coffee", 300, None),
            (3, "Tea sampler", "tea", 300, 1),
            (4, "SAMPLE cocoa", "cocoa", 300, 1),
        ])
        self.assertEqual(rows, [(3, "Tea sampler")])

    def test_nothing_to_restock(self):
        _, rows = restock([(1, "Espresso beans", "coffee", 1290, 25)])
        self.assertEqual(rows, [])

    def test_empty_table(self):
        _, rows = restock([])
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
-- restock: write your query below
SELECT id, name
FROM products
WHERE category IN ('tea', 'coffee', 'cocoa')
  AND (stock < 10 OR stock IS NULL)
  AND price_cents BETWEEN 200 AND 2000
  AND name NOT LIKE 'Sample%';
'''
time = "O(n)"
space = "O(1)"
justification = '''
The table has no index on any of these columns, so SQLite plans a **full table scan**: it
visits each of the `n` rows once and evaluates the whole `WHERE` expression for it. Each test
is cheap: `IN` checks a three-value list, `BETWEEN` is two comparisons, and `NOT LIKE
'Sample%'` only has to compare the first six characters. As soon as one `AND` branch is false
the rest is skipped. That gives **O(n)** time.

Matching rows are streamed to the caller as they are found, and rejected rows are never
stored, so beyond the result the engine uses **O(1)** extra memory. The parentheses around
`stock < 10 OR stock IS NULL` are essential: without them, `AND` would bind first and a
product from any category with an unknown stock would slip through.
'''

[[unit]]
id = "sql-u04-sorting"
title = "Sorting, limiting and DISTINCT"
level = "basic"
difficulty = 4
intro = '''
A table has no order of its own, so when order matters you have to ask for it. You will sort
results with `ORDER BY` on one or more columns, decide where `NULL` goes, keep only the first
rows with `LIMIT` and `OFFSET`, and remove duplicate rows with `DISTINCT`.
'''
concepts = '''
## The idea

Rows in a table form a **set**: there is no first or last row. Rows often *seem* to come back
in insertion order, but that is an accident of how the data happens to be stored, and it can
change when the table grows or the engine picks a different plan. When the order of a result
matters, for a report, a leaderboard or a page of results, you must say so explicitly with
`ORDER BY`.

Sorting is real work. To sort `n` rows the engine typically needs about `n log n`
comparisons and enough memory to hold the rows while it sorts them, unless an index already
keeps them in the right order. Asking only for the first few rows with `LIMIT` lets SQLite
keep just those few while it reads.

## How SQL does it

```sql
SELECT name, grade FROM students ORDER BY grade DESC;            -- highest first
SELECT name, grade FROM students ORDER BY grade DESC, name ASC;  -- ties broken by name
SELECT name FROM students ORDER BY grade DESC LIMIT 3;           -- the top three
SELECT name FROM students ORDER BY name LIMIT 10 OFFSET 20;      -- rows 21 to 30
SELECT DISTINCT class FROM students ORDER BY class;              -- each class once
```

- `ASC` (ascending, the default) goes from small to large; `DESC` goes the other way.
- Several sort keys separated by commas act as **tie-breakers**: the second key only decides
  between rows that are equal on the first.
- You can sort by a column you do not select, by an expression, or by an alias from the
  `SELECT` list.
- `LIMIT n` keeps at most `n` rows; `OFFSET m` skips the first `m` rows before that.
- `DISTINCT` removes duplicate rows from the result.
- `NULLS FIRST` and `NULLS LAST` (SQLite 3.30 and later) say where missing values go.

## What is special or tricky

- **Ties make order unpredictable.** `ORDER BY grade DESC` alone may list two students with
  the same grade in any order, and the order can differ from one run to the next. With
  `LIMIT`, a tie can even change *which* rows you get. Add a unique tie-breaker.
- **Where does `NULL` go?** SQLite and MySQL treat `NULL` as smaller than every value, so it
  comes first in `ASC` and last in `DESC`. PostgreSQL does the opposite. Write `NULLS FIRST`
  or `NULLS LAST` when it matters (MySQL lacks this syntax; `ORDER BY x IS NULL, x` works
  everywhere).
- **Text sorts by character code.** Upper-case letters come before lower-case ones, so
  `'Zoe'` sorts before `'adam'`. `ORDER BY name COLLATE NOCASE` ignores the case of A to Z.
- **`DISTINCT` applies to the whole row**, not to the first column: `SELECT DISTINCT a, b`
  removes only rows where both `a` and `b` repeat.
- **`OFFSET` is not free.** The engine still produces and throws away the skipped rows, so
  deep pages get slower; a later unit shows keyset pagination. In the SQL standard, `LIMIT`
  is written `FETCH FIRST n ROWS ONLY`.

## What you will practise

You will sort by several keys in both directions, place `NULL` values deliberately, take one
page of results with `LIMIT` and `OFFSET`, and remove duplicates with `DISTINCT`. In the
challenge you build a game leaderboard whose tie-breaking rules the tests check carefully.
'''

[[unit.step]]
kind = "concept"
id = "sql-u04-c1-order"
title = "The logical order of a query"
points = 5
difficulty = 4
intro = '''
A query is written in one order and evaluated in another. Knowing the logical order of the
clauses tells you what each clause can see: `WHERE` filters rows before the `SELECT` list
exists, while `ORDER BY` runs near the end and can use the names you gave in `SELECT`.
'''
body = '''
## Written order versus logical order

You write the clauses of a query in this order:

```sql
SELECT DISTINCT name, grade * 5 AS percent
FROM students
WHERE class = 'A'
ORDER BY percent DESC, name
LIMIT 3;
```

The engine logically works through them in a different order:

1. **`FROM`**: which table the rows come from.
2. **`WHERE`**: which of those rows to keep.
3. **`SELECT`**: which columns and expressions to compute for each kept row.
4. **`DISTINCT`**: drop rows that are now exact duplicates.
5. **`ORDER BY`**: sort what is left.
6. **`LIMIT` / `OFFSET`**: cut out the requested slice.

Consequences you will meet again and again:

- `ORDER BY percent` works, because the alias `percent` exists by the time sorting happens.
- `WHERE percent > 50` does **not** work, because `WHERE` runs before the `SELECT` list is
  computed. Repeat the expression instead: `WHERE grade * 5 > 50`.
- `LIMIT` comes last, so "the top three" means "sort everything, then keep three". Without
  `ORDER BY`, `LIMIT 3` just keeps whichever three rows the engine produced first.

## The engine may take shortcuts

The logical order describes the *meaning* of a query, not the work the engine must do.
SQLite is free to choose any plan that gives the same result. For example, with `LIMIT 3` it
keeps only the best three rows seen so far while reading, instead of sorting the whole table.
'''

