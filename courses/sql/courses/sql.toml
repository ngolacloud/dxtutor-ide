title = "Decisions with CASE"
points = 10
difficulty = 5
placeholder_policy = "shown"
run_command = "sqlite3 < main.sql"
intro = '''
`CASE` evaluates its `WHEN` conditions in order and stops at the first true one, exactly like
an if / else-if chain. The searched form tests any condition; the simple form compares one
value against a list. When nothing matches and there is no `ELSE`, the result is `NULL`.
'''
prompt = '''
Label orders by size with a searched `CASE`, translate their status with a simple `CASE`
that has no `ELSE`, and see what happens to a `NULL` status.

**Why:** turning numbers and codes into categories is one of the most common jobs in
reporting queries, and `CASE` is how SQL does it.
'''
target = '''
CREATE TABLE orders (id INTEGER PRIMARY KEY, amount INTEGER, status TEXT);
INSERT INTO orders VALUES (1, 15, 'paid'), (2, 120, 'paid'), (3, 60, 'refunded'), (4, 0, NULL);

SELECT id,
       amount,
       CASE
         WHEN amount >= 100 THEN 'large'
         WHEN amount >= 50 THEN 'medium'
         ELSE 'small'
       END AS size,
       CASE status
         WHEN 'paid' THEN 'ok'
         WHEN 'refunded' THEN 'money back'
       END AS outcome
FROM orders
ORDER BY id;
'''
line_comments = [
  "Orders with an amount and a status.",
  "Four orders; the last one has no status.",
  "",
  "Starts a query; each `CASE` below adds one computed column.",
  "The amount itself, for comparison.",
  "A searched `CASE`: each `WHEN` holds a full condition.",
  "Tried first: 100 or more is large.",
  "Only reached when the first test failed, so this means 50 to 99.",
  "Everything else is small.",
  "`END` closes the `CASE`, and `AS size` names the column.",
  "A simple `CASE`: compares `status` with each value below.",
  "When the status equals `'paid'`.",
  "When it equals `'refunded'`. There is no `ELSE`...",
  "...so a status that matches nothing, including `NULL`, gives `NULL`.",
  "The table to read.",
  "Rows in id order.",
]
explanation = '''
The output was:

```text
id|amount|size|outcome
1|15|small|ok
2|120|large|ok
3|60|medium|money back
4|0|small|NULL
```

Order 2 matched the first branch and never reached the second, which is why the order of the
`WHEN` lines matters. Order 4 has a `NULL` status: `NULL = 'paid'` is not true, no branch
matched, and with no `ELSE` the outcome was `NULL`.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u05-x1-customer-cards"
title = "Format customer cards"
points = 20
difficulty = 5
entry = "customer_cards"
run_command = "python3 -m unittest"
intro = '''
This is a pure projection with an ordering: every customer row becomes one display row built
from nested functions and a `CASE`. Because the table is ordered by its `INTEGER PRIMARY
KEY`, SQLite can read the rows already in id order and needs no separate sort step.
'''
instructions = '''
## Your turn

Write **one query** for this table:

```sql
CREATE TABLE customers (
  id            INTEGER PRIMARY KEY,
  first_name    TEXT,
  last_name     TEXT,
  email         TEXT,     -- always contains exactly one @
  balance_cents INTEGER   -- never NULL; negative when the customer owes money
);
```

Return one row per customer, **ordered by `id`**, with exactly these columns:

| column | value |
|---|---|
| `id` | the customer id |
| `name` | the first name without surrounding spaces, one space, then the last name without surrounding spaces and in capitals |
| `domain` | the part of the email after the `@`, in lower case |
| `balance` | the balance in euros as **text** with exactly two decimals, e.g. `12.50` or `-3.99` |
| `tier` | `gold` if the balance is at least 100000 cents; otherwise `silver` if at least 10000 cents; otherwise `debt` if it is negative; otherwise `basic` |

Example:

```text
id|first_name|last_name|email|balance_cents
2|  Ana |silva|Ana@Example.COM|1250
1|Bruno|Costa  |bruno@mail.org|-399
```

gives:

```text
id|name|domain|balance|tier
1|Bruno COSTA|mail.org|-3.99|debt
2|Ana SILVA|example.com|12.50|basic
```
'''
starter = '''
-- customer_cards: write your query below
-- Hint: trim, upper, lower, substr and instr build the text; printf('%.2f', ...) formats money; CASE picks the tier.
'''
tests = '''
SCHEMA = """
CREATE TABLE customers (
  id INTEGER PRIMARY KEY, first_name TEXT, last_name TEXT, email TEXT, balance_cents INTEGER
);
"""


def cards(rows):
    conn = connect(SCHEMA)
    conn.executemany("INSERT INTO customers VALUES (?, ?, ?, ?, ?)", rows)
    cur = conn.execute(STUDENT_SQL)
    cols = [d[0] for d in cur.description or []]
    result = [tuple(r) for r in cur.fetchall()]
    conn.close()
    return cols, result


EXAMPLE = [
    (2, "  Ana ", "silva", "Ana@Example.COM", 1250),
    (1, "Bruno", "Costa  ", "bruno@mail.org", -399),
]


def tier_of(cents):
    _, rows = cards([(1, "A", "B", "a@b.c", cents)])
    return rows[0][4]


class CustomerCardsTest(unittest.TestCase):
    def test_column_names(self):
        cols, _ = cards(EXAMPLE)
        self.assertEqual(cols, ["id", "name", "domain", "balance", "tier"])

    def test_example_in_id_order(self):
        _, rows = cards(EXAMPLE)
        self.assertEqual(rows, [
            (1, "Bruno COSTA", "mail.org", "-3.99", "debt"),
            (2, "Ana SILVA", "example.com", "12.50", "basic"),
        ])

    def test_balance_keeps_two_decimals(self):
        _, rows = cards([
            (1, "A", "B", "a@b.c", 0),
            (2, "A", "B", "a@b.c", 5),
            (3, "A", "B", "a@b.c", 100000),
            (4, "A", "B", "a@b.c", -1),
            (5, "A", "B", "a@b.c", 123456),
        ])
        self.assertEqual([r[3] for r in rows], ["0.00", "0.05", "1000.00", "-0.01", "1234.56"])

    def test_tier_boundaries(self):
        self.assertEqual(tier_of(100000), "gold")
        self.assertEqual(tier_of(250000), "gold")
        self.assertEqual(tier_of(99999), "silver")
        self.assertEqual(tier_of(10000), "silver")
        self.assertEqual(tier_of(9999), "basic")
        self.assertEqual(tier_of(0), "basic")
        self.assertEqual(tier_of(-1), "debt")

    def test_names_are_trimmed_and_last_name_capitalised(self):
        _, rows = cards([(7, "   Maria   ", "  dos santos ", "m@x.pt", 0)])
        self.assertEqual(rows[0][1], "Maria DOS SANTOS")

    def test_domain_in_lower_case(self):
        _, rows = cards([
            (1, "A", "B", "Someone@Mail.Example.ORG", 0),
            (2, "A", "B", "x@sub.domain.ao", 0),
        ])
        self.assertEqual([r[2] for r in rows], ["mail.example.org", "sub.domain.ao"])

    def test_rows_follow_id_order(self):
        _, rows = cards([
            (30, "C", "C", "c@c.c", 0),
            (10, "A", "A", "a@a.a", 0),
            (20, "B", "B", "b@b.b", 0),
        ])
        self.assertEqual([r[0] for r in rows], [10, 20, 30])

    def test_empty_table(self):
        _, rows = cards([])
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
-- customer_cards: write your query below
SELECT id,
       trim(first_name) || ' ' || upper(trim(last_name)) AS name,
       lower(substr(email, instr(email, '@') + 1)) AS domain,
       printf('%.2f', balance_cents / 100.0) AS balance,
       CASE
         WHEN balance_cents >= 100000 THEN 'gold'
         WHEN balance_cents >= 10000 THEN 'silver'
         WHEN balance_cents < 0 THEN 'debt'
         ELSE 'basic'
       END AS tier
FROM customers
ORDER BY id;
'''
time = "O(n)"
space = "O(1)"
justification = '''
`id` is the `INTEGER PRIMARY KEY`, which in SQLite *is* the key of the table's B-tree. To
satisfy `ORDER BY id`, the planner simply walks that B-tree from left to right, so rows
arrive already sorted and **no sort step** is needed. Each of the `n` rows is visited once and
its five output values are computed from that row alone, so the total time is **O(n)** (each
string function is linear in the length of its text, which is small and bounded here).

Rows are streamed out as they are computed, so beyond the result the engine keeps **O(1)**
extra memory. Dividing by `100.0` rather than `100` matters: integer division would drop the
cents before `printf` ever saw them, turning `1250` into `12.00`. The `CASE` lists the tiers
from the highest threshold down, because the first true branch wins.
'''

[[unit]]
id = "sql-u06-aggregates"
title = "Aggregates: summarising many rows"
level = "basic"
difficulty = 6
intro = '''
So far every query returned one row per row of the table. Aggregate functions do the
opposite: they fold many rows into a single answer, such as how many, how much in total, the
average, the smallest or the largest. You will also learn exactly how they treat `NULL`,
which decides whether your totals are right.
'''
concepts = '''
## The idea

Many questions are about a whole collection rather than one item: "How many orders did we
get?", "What is our revenue?", "What is the cheapest product?". An **aggregate function**
takes a column (or an expression) across many rows and returns one value. A query whose
`SELECT` list holds only aggregates returns **exactly one row**, even when the table is
empty.

The engine computes an aggregate in a single pass. It keeps a small **accumulator** (a
running count, a running sum, the smallest value seen so far) and updates it for every row,
so the cost is one scan of the rows and almost no memory.

## How SQL does it

```sql
SELECT COUNT(*)              AS orders,     -- number of rows
       COUNT(shipped_at)     AS shipped,    -- rows where shipped_at is not NULL
       COUNT(DISTINCT city)  AS cities,     -- different non-NULL values
       SUM(amount)           AS revenue,
       AVG(amount)           AS average,
       MIN(amount)           AS smallest,
       MAX(amount)           AS largest
FROM orders
WHERE status <> 'cancelled';
```

- `WHERE` runs **first** and decides which rows the aggregates see.
- An aggregate can take any expression: `SUM(quantity * price)` totals a computed value.
- `MIN` and `MAX` work on text and dates too, comparing them the same way as `ORDER BY`.

## Aggregates and NULL

Every aggregate except `COUNT(*)` **skips `NULL` values**:

- `COUNT(*)` counts rows; `COUNT(column)` counts rows where that column is not `NULL`.
- `AVG(x)` is the sum of the non-`NULL` values divided by *their* number. A missing value is
  left out, not treated as zero.
- Over zero rows (an empty table, or a `WHERE` that matches nothing), `COUNT` returns `0`, but
  `SUM`, `AVG`, `MIN` and `MAX` return `NULL`: there is nothing to add up.
- `COALESCE(SUM(x), 0)` replaces that `NULL` with 0. `COALESCE` returns its first non-`NULL`
  argument; unit 15 studies it properly. SQLite also offers `total(x)`, which returns `0.0`
  for an empty set, but it always returns a real number and is not standard SQL.

## What is special or tricky

- **Don't mix aggregates with plain columns** (yet). `SELECT name, MAX(price) FROM products`
  is an error in PostgreSQL. SQLite accepts it and takes `name` from the row that holds the
  maximum, a SQLite-specific behaviour. To get one answer per group, use `GROUP BY` (next
  unit).
- **`WHERE` cannot test an aggregate.** `WHERE COUNT(*) > 5` is an error; that is what
  `HAVING` is for, also in the next unit.
- **`AVG` returns a real.** In SQLite, `AVG` of the integers 1 and 2 is `1.5`.
- **`COUNT(DISTINCT a, b)` does not exist** in SQLite: `DISTINCT` inside an aggregate takes
  exactly one argument.

## What you will practise

You will compute the five classic aggregates, compare `COUNT(*)`, `COUNT(column)` and
`COUNT(DISTINCT column)` on data with gaps, and watch `SUM` and `AVG` meet `NULL` and empty
sets. In the challenge you produce a one-row statistics summary that must stay correct even
when there are no orders at all.
'''

[[unit.step]]
kind = "concept"
id = "sql-u06-c1-fold"
title = "From many rows to one"
points = 5
difficulty = 6
intro = '''
An aggregate is a **fold**: start from an initial state, combine it with each row in turn,
and read a final value at the end. Because each step only needs the state and the current
row, the engine aggregates a table of any size in one pass and constant memory.
'''
body = '''
## Watching an aggregate work

```text
sales
product | qty
tea     | 2
coffee  | NULL
tea     | 3
```

```sql
SELECT COUNT(*) AS n, COUNT(qty) AS with_qty, SUM(qty) AS units, AVG(qty) AS avg_qty
FROM sales;
```

SQLite reads the rows one by one and updates four accumulators:

| after row | `COUNT(*)` | `COUNT(qty)` | sum | values in the average |
|---|---|---|---|---|
| `tea, 2` | 1 | 1 | 2 | 1 |
| `coffee, NULL` | 2 | 1 | 2 | 1 |
| `tea, 3` | 3 | 2 | 5 | 2 |

```text
n|with_qty|units|avg_qty
3|2|5|2.5
```

Things to notice:

- **`COUNT(*)` counted the row with `NULL`**; `COUNT(qty)` did not.
- **`AVG` is 5 / 2, not 5 / 3**: the `NULL` row is left out of the average entirely.
- **One row came back**, although the table has three. All the rows went into one answer.

## Filter first, then fold

`WHERE` decides which rows reach the accumulators:

```sql
SELECT COUNT(*) AS n, SUM(qty) AS units FROM sales WHERE product = 'juice';
```

```text
n|units
0|NULL
```

No row matched, yet there is still **one** result row: the count is `0`, and the sum is
`NULL` because nothing was added. Remember that pair; it is behind many wrong totals.
'''

