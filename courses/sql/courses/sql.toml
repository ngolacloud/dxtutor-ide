  "Three customers.",
  "Inserts three orders...",
  "...two paid ones for Ana and a refund for Cy.",
  "",
  "One row per customer.",
  "COUNT(o.id) skips the NULL of a padded row, so no orders gives 0.",
  "SUM over only NULLs is NULL; COALESCE turns it into 0.",
  "Customers are the preserved side.",
  "Only paid orders count as a match; every customer is kept anyway.",
  "One group per customer; name depends on the primary key, so it is safe to select.",
  "Sorts by customer id.",
  "",
  "The same filter, moved to WHERE.",
  "Customers again.",
  "Matches every order, of any status.",
  "Runs after the join: padded rows and Cy's refund both fail this test.",
  "Groups what survived.",
  "Sorts by customer id.",
]
explanation = '''
The two queries printed:

```text
name|paid_orders|paid_total
Ana|2|40
Bo|0|0
Cy|0|0
name|rows_kept
Ana|2
```

With the status test in `ON`, Cy's refund simply did not match, so Cy got a padded row and a
count of 0, just like Bo. With the test in `WHERE`, Bo's padded row and Cy's refund row both
had a status that is not `'paid'` (`NULL` and `'refunded'`), so only Ana was left: the outer
join had become an inner join.
'''

[[unit.step]]
