## Your turn

Write **ONE query** (a single `SELECT`) for this schema:

```sql
CREATE TABLE authors  (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
CREATE TABLE posts    (id INTEGER PRIMARY KEY, author_id INTEGER NOT NULL, title TEXT NOT NULL);
