        self.assertStatement(rows, [
            ("X", 4, "2024-05-01 12:00", 3, 3, 3.0),
            ("X", 6, "2024-05-01 12:00", 5, 8, 4.0),
            ("X", 9, "2024-05-01 12:00", 7, 15, 5.0),
            ("X", 1, "2024-05-02 08:00", 1, 16, 4.33),
