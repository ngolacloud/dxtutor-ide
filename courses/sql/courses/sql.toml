'''
line_comments = [
  "Creates a table of users.",
  "The id is the rowid: the table itself is a B-tree ordered by it.",
  "Emails, not indexed yet.",
  "A city per user.",
  "Ends the table definition.",
  "Inserts three users; the ids are assigned 1, 2 and 3.",
  "The rows being inserted.",
  "Asks how SQLite would find a user by email: there is no index, so it scans.",
  "Builds a B-tree of emails, each paired with its rowid.",
  "Asks again: now the plan seeks the new index.",
  "A lookup by primary key seeks the table B-tree directly.",
  "Runs the query itself; the plan does not change the answer.",
]
explanation = '''
It printed:

```
id|parent|notused|detail
2|0|0|SCAN users
id|parent|notused|detail
3|0|0|SEARCH users USING INDEX users_email (email=?)
