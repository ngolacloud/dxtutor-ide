[[unit.step]]
kind = "drill"
id = "sql-udb5-d3-cte"
title = "The same report as a CTE"
points = 10
difficulty = 20
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A CTE is a named subquery whose scope is one statement. For the planner it is the same kind of
object as a view, a derived table, but it leaves nothing behind in the schema, so it suits
a one-off query.
'''
prompt = '''
Write the revenue per customer as a query with a `WITH` clause, then show that no view was
