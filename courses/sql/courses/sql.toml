INSERT INTO posts VALUES
  (1, 'one'), (2, 'two'), (3, 'three'), (4, 'four'),
  (5, 'five'), (6, 'six'), (7, 'seven');
SELECT id, title FROM posts ORDER BY id LIMIT 3 OFFSET 0;
SELECT id, title FROM posts ORDER BY id LIMIT 3 OFFSET 3;
SELECT id, title FROM posts ORDER BY id LIMIT 3 OFFSET 6;
SELECT (COUNT(*) + 2) / 3 AS pages FROM posts;
'''
