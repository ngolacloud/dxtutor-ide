intro = '''
Numeric functions and conversions are cheap, constant-time operations per value. What
matters is the type of the result: `round` and division by a real produce reals, `CAST`
changes the storage class, and `printf` produces **text**, which is right for display but no
longer a number you can calculate with.
'''
prompt = '''
Use `abs`, `round` and the scalar `max` and `min`, convert values with `CAST`, and format
numbers as text with `printf`.

**Why:** money and measurements need rounding and formatting, and knowing which operations
return integers, reals or text prevents subtle mistakes.
'''
target = '''
SELECT abs(-7) AS absolute, round(3.14159, 2) AS rounded, round(2.5) AS half;
SELECT max(3, 9, 4) AS biggest, min(3, 9, 4) AS smallest;

-- Explicit conversions.
SELECT CAST('42' AS INTEGER) + 1 AS from_text, CAST(7 AS REAL) / 2 AS real_div;
SELECT CAST(9.99 AS INTEGER) AS truncated, CAST(123 AS TEXT) || '!' AS as_text;
SELECT CAST('12abc' AS INTEGER) AS lenient, typeof(CAST(5 AS TEXT)) AS kind;

-- printf builds text from a pattern.
SELECT printf('%.2f', 1234 / 100.0) AS euros, printf('%05d', 42) AS padded;
'''
line_comments = [
  "`abs` drops the sign; `round(x, 2)` keeps two decimals; `round(2.5)` rounds half away from zero, giving the real `3.0`.",
  "With several arguments, `max` and `min` pick the largest and smallest of them.",
  "",
  "A comment introducing `CAST`.",
  "Text becomes an integer before the addition; casting 7 to a real makes the division real.",
  "Casting a real to an integer drops the fraction (it does not round); a number cast to text can be joined.",
  "SQLite reads the leading digits of `'12abc'` and ignores the rest; `typeof` confirms the cast made text.",
  "",
  "A comment introducing `printf`.",
  "`%.2f` prints exactly two decimals; `%05d` pads an integer with zeros to five digits. Both results are text.",
]
explanation = '''
The output was:

```text
absolute|rounded|half
7|3.14|3.0
biggest|smallest
9|3
from_text|real_div
43|3.5
truncated|as_text
9|123!
lenient|kind
12|text
euros|padded
12.34|00042
```

`round(2.5)` gave the real `3.0`, while `CAST(9.99 AS INTEGER)` simply cut the fraction off
and gave `9`. `CAST('12abc' AS INTEGER)` quietly returned `12`, where PostgreSQL would raise an
error. `printf` turned `12.34` into the text `'12.34'`, exactly two decimals, ready to show.
'''

[[unit.step]]
kind = "drill"
