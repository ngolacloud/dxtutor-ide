  (4, 'four'), (5, 'five'), (6, 'six');
SELECT id, title FROM posts ORDER BY id DESC LIMIT 3;
INSERT INTO posts VALUES (7, 'breaking news');
SELECT id, title FROM posts ORDER BY id DESC LIMIT 3 OFFSET 3;
SELECT id, title FROM posts WHERE id < 4 ORDER BY id DESC LIMIT 3;
'''
