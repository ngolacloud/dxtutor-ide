[[unit.step]]
kind = "challenge"
id = "sql-u27-x1-merge-customers"
title = "Merge duplicate customers"
points = 40
difficulty = 33
entry = "merge_customers"
intro = '''
A real cleanup is several statements that must happen in the right order: normalise, map each
duplicate to its survivor, move the child rows, then delete. Foreign keys are enforced, the script
must survive being run twice, and the largest hidden test merges thousands of customers.
'''
instructions = '''
## Your turn

Write a **script** (several statements) that cleans these tables in place:

```sql
PRAGMA foreign_keys = ON;
CREATE TABLE customers (
  id    INTEGER PRIMARY KEY,
  name  TEXT NOT NULL,
  email TEXT
);
CREATE TABLE orders (
  id          INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL REFERENCES customers(id),
  amount      INTEGER NOT NULL
);
CREATE INDEX orders_customer ON orders(customer_id);
```

1. **Normalise** every email: lower case, no leading or trailing spaces. An email that is empty
   after trimming becomes `NULL`.
2. Customers with the **same normalised email** are duplicates. In each group, the customer with
   the **smallest id** survives.
3. Move every order of a duplicate to its survivor, then **delete** the duplicates. Foreign keys are
   enforced: a customer who still has orders cannot be deleted.
4. Customers whose email is `NULL` are never merged.
5. The script must be **safe to run twice**: the second run changes nothing and raises no error.

Names, amounts and order ids are left unchanged.

Example:

```
customers: (1, 'Ana', ' ana@example.com'), (2, 'Ana S.', 'ANA@example.com'),
           (3, 'Rui', ''), (4, 'Rui M.', NULL)
orders:    (10, 2, 500), (11, 1, 300), (12, 4, 50)
```

After the script:

```
customers: (1, 'Ana', 'ana@example.com'), (3, 'Rui', NULL), (4, 'Rui M.', NULL)
orders:    (10, 1, 500), (11, 1, 300), (12, 4, 50)
```

Hidden tests decide correctness.
'''
starter = '''
-- merge_customers: write your script below
-- Hint: normalise first; build a (duplicate id, survivor id) mapping; move the orders with it,
-- then delete the duplicates. Clean up anything you create so a second run works too.
'''
tests = '''
SCHEMA = """
PRAGMA foreign_keys = ON;
CREATE TABLE customers (
  id INTEGER PRIMARY KEY,
  name TEXT NOT NULL,
  email TEXT
);
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL REFERENCES customers(id),
  amount INTEGER NOT NULL
);
CREATE INDEX orders_customer ON orders(customer_id);
"""

EXAMPLE = SCHEMA + """
INSERT INTO customers VALUES
  (1, 'Ana', ' ana@example.com'), (2, 'Ana S.', 'ANA@example.com'),
  (3, 'Rui', ''), (4, 'Rui M.', NULL);
INSERT INTO orders VALUES (10, 2, 500), (11, 1, 300), (12, 4, 50);
"""


def state(conn):
    customers = conn.execute("SELECT id, name, email FROM customers ORDER BY id").fetchall()
    orders = conn.execute("SELECT id, customer_id, amount FROM orders ORDER BY id").fetchall()
    return customers, orders


def expected(setup):
    conn = connect(setup)
    customers, orders = state(conn)
    conn.close()
    clean = {}
    survivor = {}
    first = {}
    for cid, name, email in customers:
        e = (email or "").strip().lower() or None
        clean[cid] = (cid, name, e)
        if e is None:
            survivor[cid] = cid
        else:
            survivor[cid] = first.setdefault(e, cid)
    kept = [clean[c] for c in sorted(clean) if survivor[c] == c]
    moved = [(oid, survivor[cid], amount) for oid, cid, amount in orders]
    return kept, moved


class MergeCustomersTest(unittest.TestCase):
    def check(self, setup):
        conn = script(setup)
        got = state(conn)
        self.assertEqual(conn.execute("PRAGMA foreign_key_check").fetchall(), [])
        conn.close()
        self.assertEqual(got, expected(setup))
        return got

    def test_example(self):
        customers, orders = self.check(EXAMPLE)
        self.assertEqual(customers, [(1, "Ana", "ana@example.com"), (3, "Rui", None), (4, "Rui M.", None)])
        self.assertEqual(orders, [(10, 1, 500), (11, 1, 300), (12, 4, 50)])

    def test_smallest_id_survives(self):
        self.check(SCHEMA + """
            INSERT INTO customers VALUES
              (7, 'Zoe', 'ZOE@x.io'), (3, 'Zoe B.', 'zoe@x.io '), (9, 'Zoe C.', '  Zoe@X.io');
            INSERT INTO orders VALUES (1, 9, 10), (2, 7, 20), (3, 3, 30), (4, 9, 40);
        """)

    def test_null_and_blank_emails_are_not_merged(self):
        customers, _ = self.check(SCHEMA + """
            INSERT INTO customers VALUES
              (1, 'A', NULL), (2, 'B', NULL), (3, 'C', '   '), (4, 'D', '');
            INSERT INTO orders VALUES (1, 1, 5), (2, 2, 6), (3, 3, 7), (4, 4, 8);
        """)
        self.assertEqual(len(customers), 4)

    def test_clean_data_only_normalises(self):
        self.check(SCHEMA + """
            INSERT INTO customers VALUES (1, 'A', 'A@X.COM'), (2, 'B', ' b@x.com'), (3, 'C', 'c@x.com');
            INSERT INTO orders VALUES (1, 1, 5), (2, 2, 6);
        """)

    def test_safe_to_run_twice(self):
        conn = script(EXAMPLE)
        conn.executescript(STUDENT_SQL)
        got = state(conn)
        conn.close()
        self.assertEqual(got, expected(EXAMPLE))

    def test_many_customers(self):
        setup = SCHEMA + """
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 3000)
            INSERT INTO customers
            SELECT i, 'customer ' || i,
                   CASE i % 4
                     WHEN 0 THEN 'USER' || (i * 7 % 1000) || '@EXAMPLE.COM'
                     WHEN 1 THEN '  user' || (i * 7 % 1000) || '@example.com '
                     WHEN 2 THEN 'user' || (i * 7 % 1000) || '@example.com'
                     ELSE CASE WHEN i % 3 = 0 THEN NULL ELSE ' ' END
                   END
            FROM n;
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 12000)
            INSERT INTO orders SELECT i, i * 7919 % 3000 + 1, i % 500 + 1 FROM n;
        """
        customers, orders = self.check(setup)
        emails = [e for _, _, e in customers if e is not None]
        self.assertEqual(len(emails), len(set(emails)))
        self.assertEqual(sum(a for _, _, a in orders), sum(i % 500 + 1 for i in range(1, 12001)))
'''

[unit.step.gabarito]
solution = '''
BEGIN;

UPDATE customers SET email = NULLIF(lower(trim(email)), '');

CREATE TEMP TABLE merge_map AS
  SELECT c.id AS dup_id, k.keep_id
  FROM customers AS c
  JOIN (SELECT email, MIN(id) AS keep_id
        FROM customers
        WHERE email IS NOT NULL
        GROUP BY email) AS k
    ON k.email = c.email
  WHERE c.id <> k.keep_id;

UPDATE orders
SET customer_id = m.keep_id
FROM merge_map AS m
WHERE m.dup_id = orders.customer_id;

DELETE FROM customers WHERE id IN (SELECT dup_id FROM merge_map);

DROP TABLE merge_map;

COMMIT;
'''
time = "O(n log n + m log n)"
space = "O(n)"
justification = '''
Let **n** be the number of customers and **m** the number of orders.

- The normalising `UPDATE` is one **scan** of `customers` with a constant-time expression per row:
  O(n) (plus rewriting the rows).
- Building `merge_map` groups the customers by email (a temporary B-tree, **O(n log n)**) and joins
  them back by email through an automatic index: O(n log n). The map has at most n rows.
- The `UPDATE … FROM` walks the map and, for each duplicate, finds its orders through the
  **`orders_customer` index**: an index seek per duplicate plus one write per moved order,
  O(m log n) at worst. Without that index, SQLite would scan `orders` for every duplicate.
- The `DELETE` seeks each duplicate by primary key. With `foreign_keys = ON`, SQLite also checks
  that no order still points at the deleted id, another seek in `orders_customer`; that check is
  why the orders must move first.

Everything runs inside `BEGIN … COMMIT`, so a failure halfway leaves the original data untouched,
and the temporary map is dropped at the end, so a second run finds nothing to merge and succeeds.
Space is the map and the temporary B-trees: **O(n)**.
'''

# ── Unit 34 · Analytics case study ───────────────────────────────────────────────────

[[unit]]
id = "sql-u28-analytics"
title = "Analytics case study"
level = "advanced"
difficulty = 34
intro = '''
The last unit puts the whole course to work on the questions product teams ask every week: how
many people were active each day, how many made it through the sign-up funnel, and how many came
back a month later. You will compute daily actives, an ordered funnel, cohort offsets and,
finally, a retention triangle, all from one event log.
'''
concepts = '''
## The idea

Most product analytics start from an **event log**: one row per thing a user did, with who, what
and when. Every metric is then a query over that log. **Daily active users** count distinct users
per day. A **funnel** counts how many users reach each step of a flow, in order. A **cohort** groups
users by when they started (usually their sign-up month), and **retention** asks what share of a
cohort is still active one, two, three months later.

## How SQL expresses it

Nothing new is needed; the skill is in combining what you know. Dates bucket with `date()` and
`strftime()`. Users are counted with `COUNT(DISTINCT user_id)`, because one user produces many
events. A calendar from a recursive CTE gives zero-activity days a row. Ordered funnels chain one
CTE per step, each joined to the previous step's time. Month offsets come from month numbers:

```sql
SELECT (strftime('%Y', occurred_at) * 12 + strftime('%m', occurred_at))
     - (strftime('%Y', signed_up_at) * 12 + strftime('%m', signed_up_at)) AS month_offset
FROM events JOIN users ON users.id = events.user_id;
```

SQLite converts the text returned by `strftime` into numbers for the arithmetic. PostgreSQL would
use `date_trunc('month', …)` and `age()`, and MySQL `TIMESTAMPDIFF(MONTH, …)`, which counts
*complete* months rather than calendar-month boundaries, a different metric.

## Fix the dates

A report must give the same numbers every time it runs on the same data. Never compute a window
from `'now'` deep inside a query: put the report's dates in one place, a `params` CTE or bound
parameters, and use half-open ranges (`>= start AND < end`) so the last day's events are not lost
to their time of day.

```sql
WITH params AS (SELECT '2026-06-01' AS start_day, '2026-07-01' AS end_day)
SELECT COUNT(DISTINCT user_id)
FROM events, params
WHERE occurred_at >= start_day AND occurred_at < end_day;
```

## Pitfalls

- **Events are not users.** `COUNT(*)` counts clicks; most metrics want `COUNT(DISTINCT user_id)`.
- **Order matters in funnels.** A user who bought before viewing the product did not go through
  the funnel. Compare each step's time with the previous step's.
- **Unobserved is not zero.** For a cohort that signed up last month, "retention after three months"
  is unknown, not 0%. Return `NULL` for periods after the report date.
- **Denominators.** A percentage of a cohort divides by the cohort's size, including users who never
  came back. Use `100.0 *` to avoid integer division, and round only at the end.
- **Time zones.** Store UTC; a "day" in a report is a choice of time zone.

## What you will practise

You will count daily actives on a gap-free calendar, measure an ordered three-step funnel, compute
cohort month offsets, and build a retention triangle with `NULL` for periods that have not happened
yet.
'''

[[unit.step]]
kind = "concept"
id = "sql-u28-c1-metrics"
title = "Metrics from an event log"
points = 5
difficulty = 34
intro = '''
Analytics queries are aggregations over a large, append-only fact table, usually after a
deduplication step: many events collapse to one row per user and period. The cost is dominated by
one scan of the log and the sort or hash that groups it.
'''
body = '''
## The shape of the data

```sql
CREATE TABLE users  (id INTEGER PRIMARY KEY, signed_up_at TEXT);
CREATE TABLE events (user_id INTEGER, name TEXT, occurred_at TEXT);
```

`users` is a **dimension**: one row per user, with attributes such as the sign-up time. `events`
is a **fact table**: it only grows, and every metric is computed from it.

## Three building blocks

| metric | core expression |
|---|---|
| active users per day | `COUNT(DISTINCT user_id)` grouped by `date(occurred_at)` |
| reached a step | `MIN(occurred_at)` per user for that step, later than the previous step |
| active in month k of a cohort | `DISTINCT (user_id, month_offset)`, then count per cohort and k |

The middle step is often the same: reduce the log to **one row per user and period** (or per user
and step) with `DISTINCT` or `GROUP BY`, then count those rows. Counting raw events instead
inflates every number by how chatty the users are.

## Cost

An event log is the largest table you have, so read it once. Filter it with a half-open range on
`occurred_at` (an index on that column turns the filter into a range scan), deduplicate, and only
then join to the small `users` table. Joining every event to its user first multiplies the work
before reducing it.
'''

[[unit.step]]
kind = "drill"
id = "sql-u28-d1-dau"
title = "Daily actives on a calendar"
points = 10
difficulty = 34
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Grouping the events alone can only produce days that have events. A generated calendar, the
recursive CTE from earlier, is the outer side of a `LEFT JOIN`, so quiet days survive with zeros;
the half-open range per day keeps events at any time of day in the right bucket.
'''
prompt = '''
Store a few events, generate the days from 1 to 5 June 2026, and report each day's distinct active
users and event count, including a day with no activity.
'''
target = '''
CREATE TABLE events (user_id INTEGER, name TEXT, occurred_at TEXT);
INSERT INTO events VALUES
  (1, 'login', '2026-06-01 08:00:00'), (1, 'view', '2026-06-01 08:05:00'),
  (2, 'login', '2026-06-01 21:30:00'), (1, 'login', '2026-06-03 09:00:00'),
  (3, 'login', '2026-06-03 10:00:00'), (3, 'view', '2026-06-04 23:59:59'),
  (2, 'login', '2026-06-05 00:00:00');
WITH RECURSIVE calendar(day) AS (
  SELECT '2026-06-01'
  UNION ALL
  SELECT date(day, '+1 day') FROM calendar WHERE day < '2026-06-05'
)
SELECT c.day, COUNT(DISTINCT e.user_id) AS dau, COUNT(e.user_id) AS events
FROM calendar AS c
LEFT JOIN events AS e
  ON e.occurred_at >= c.day AND e.occurred_at < date(c.day, '+1 day')
GROUP BY c.day
ORDER BY c.day;
'''
line_comments = [
  "The event log: who did what, and when.",
  "Seeds seven events...",
  "...user 1 twice and user 2 once on 1 June...",
  "...nobody on 2 June, users 1 and 3 on 3 June...",
  "...user 3 one second before midnight on 4 June...",
  "...and user 2 exactly at midnight on 5 June.",
  "A calendar of days, built recursively.",
  "Starts on the first day of the report.",
  "Adds one row per round...",
  "...the next day, until the last day of the report.",
  "Ends the CTE: five days, whether or not anything happened.",
  "Distinct users per day, and raw events for comparison.",
  "Every calendar day is kept...",
  "...with its events, if any.",
  "An event belongs to the day if it is at or after midnight and before the next midnight.",
  "One group per day.",
  "In date order.",
]
explanation = '''
It printed:

```
day|dau|events
2026-06-01|2|3
2026-06-02|0|0
2026-06-03|2|2
2026-06-04|1|1
2026-06-05|1|1
```

User 1 produced two events on 1 June but counts once in `dau`. On 2 June the `LEFT JOIN` found no
events, so `COUNT(e.user_id)` counted only NULLs and returned 0. The event at `23:59:59` stayed on
4 June and the one at `00:00:00` went to 5 June, exactly as the half-open range says.
'''

[[unit.step]]
kind = "drill"
id = "sql-u28-d2-funnel"
title = "An ordered funnel"
points = 10
difficulty = 34
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
A funnel is a chain of semi-joins: each step keeps only the users of the previous step who did
the next action later. One CTE per step, each joining the previous step's users to the log, keeps
the order rule explicit, and every step can only shrink the set.
'''
prompt = '''
Store view, cart and purchase events, compute each user's first view, their first cart after it,
and their first purchase after that, and count the users who reached each step.
'''
target = '''
CREATE TABLE events (user_id INTEGER, name TEXT, occurred_at TEXT);
INSERT INTO events VALUES
  (1, 'view', '2026-06-01 10:00'), (1, 'cart', '2026-06-01 10:05'), (1, 'purchase', '2026-06-01 10:09'),
  (2, 'view', '2026-06-01 11:00'), (2, 'cart', '2026-06-01 11:02'),
  (3, 'cart', '2026-06-01 12:00'), (3, 'view', '2026-06-01 12:01'),
  (4, 'view', '2026-06-02 09:00'), (4, 'view', '2026-06-02 09:30');
WITH viewed AS (
  SELECT user_id, MIN(occurred_at) AS t FROM events WHERE name = 'view' GROUP BY user_id
), carted AS (
  SELECT v.user_id, MIN(e.occurred_at) AS t
  FROM viewed AS v JOIN events AS e
    ON e.user_id = v.user_id AND e.name = 'cart' AND e.occurred_at > v.t
  GROUP BY v.user_id
), bought AS (
  SELECT c.user_id, MIN(e.occurred_at) AS t
  FROM carted AS c JOIN events AS e
    ON e.user_id = c.user_id AND e.name = 'purchase' AND e.occurred_at > c.t
  GROUP BY c.user_id
)
SELECT 1 AS n, 'view' AS step, COUNT(*) AS users FROM viewed
UNION ALL SELECT 2, 'cart', COUNT(*) FROM carted
UNION ALL SELECT 3, 'purchase', COUNT(*) FROM bought
ORDER BY n;
'''
line_comments = [
  "The event log.",
  "Seeds four users' journeys...",
  "...user 1 goes all the way...",
  "...user 2 stops at the cart...",
  "...user 3 adds to the cart before viewing...",
  "...and user 4 views twice.",
  "Step 1: each user's first view.",
  "One row per user who ever viewed.",
  "Step 2: the first cart that came after that view...",
  "...per user who viewed.",
  "Joins only this user's cart events...",
  "...that happened after their first view.",
  "One row per user who reached the cart in order.",
  "Step 3: the first purchase after that cart...",
  "...per user who carted.",
  "Joins only this user's purchase events...",
  "...after their cart.",
  "One row per user who completed the funnel.",
  "Ends the chain of CTEs.",
  "Counts the users at each step, with a number to keep the steps in order.",
  "Adds the cart step...",
  "...and the purchase step.",
  "Sorts by step number, not by name or count.",
]
explanation = '''
It printed:

```
n|step|users
1|view|4
2|cart|2
3|purchase|1
```

User 3 has a cart event, but it came before their first view, so the join condition
`e.occurred_at > v.t` rejected it. User 4's two views count once. Half of the viewers reached the
cart and half of those bought: the drop-off between steps is what a product team acts on.
'''

[[unit.step]]
kind = "drill"
id = "sql-u28-d3-cohorts"
title = "Cohorts and month offsets"
points = 10
difficulty = 34
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Retention is a two-key aggregation: the cohort (a property of the user) and the offset (a property
of each event relative to that user). Computing the offset from month numbers makes it a plain
integer, so the long table of (cohort, offset, users) is one join and one `GROUP BY`.
'''
prompt = '''
Store users and their activity, compute each event's month offset from the user's sign-up month,
and count the distinct active users per cohort and offset.
'''
target = '''
CREATE TABLE users (id INTEGER PRIMARY KEY, signed_up_at TEXT);
CREATE TABLE events (user_id INTEGER, occurred_at TEXT);
INSERT INTO users VALUES (1, '2026-01-15'), (2, '2026-01-28'), (3, '2026-02-03'), (4, '2026-01-03');
INSERT INTO events VALUES
  (1, '2026-01-20'), (1, '2026-02-02'), (1, '2026-02-25'), (2, '2026-03-01'),
  (3, '2026-02-10'), (3, '2026-03-09'), (4, '2026-02-14');
WITH activity AS (
  SELECT u.id, strftime('%Y-%m', u.signed_up_at) AS cohort,
         (strftime('%Y', e.occurred_at) * 12 + strftime('%m', e.occurred_at))
         - (strftime('%Y', u.signed_up_at) * 12 + strftime('%m', u.signed_up_at)) AS month_offset
  FROM users AS u
  JOIN events AS e ON e.user_id = u.id
)
SELECT cohort, month_offset, COUNT(DISTINCT id) AS active_users
FROM activity
GROUP BY cohort, month_offset
ORDER BY cohort, month_offset;
'''
line_comments = [
  "The users dimension, with sign-up dates.",
  "The activity log.",
  "Three January sign-ups (1, 2 and 4) and one in February (3).",
  "Seeds the activity...",
  "...user 1 in January and twice in February, user 2 in March...",
  "...user 3 in February and March, user 4 in February.",
  "One row per event, labelled with its user's cohort and offset.",
  "The cohort is the sign-up month, as `'YYYY-MM'`.",
  "The event's month number (year × 12 + month)...",
  "...minus the sign-up month number: 0 is the sign-up month itself.",
  "Every user...",
  "...joined to each of their events.",
  "Ends the CTE.",
  "Counts each user once per cohort and offset, however many events they had.",
  "Reads the labelled events.",
  "One group per (cohort, offset) cell.",
  "In cohort order, then offset.",
]
explanation = '''
It printed:

```
cohort|month_offset|active_users
2026-01|0|1
2026-01|1|2
2026-01|2|1
2026-02|0|1
2026-02|1|1
```

User 1's two February events count once in the `2026-01`, offset 1 cell, next to user 4. Offsets
count calendar-month boundaries: user 2 signed up on 28 January and was active on 1 March, which is
offset 2 even though only 32 days passed. That is the usual definition for monthly cohorts; make
sure the people reading the report agree with it.
'''

[[unit.step]]
kind = "challenge"
id = "sql-u28-x1-retention"
title = "The retention triangle"
points = 40
difficulty = 34
entry = "retention"
intro = '''
The capstone: a cohort retention report as of a fixed date, pivoted into one row per cohort, with
percentages over the full cohort and `NULL` where the future has not happened yet. The hidden tests
probe boundaries to the second, repeat activity, silent users and thousands of events.
'''
instructions = '''
## Your turn

Write **one query** (a single statement; `WITH` is fine) over these tables:

```sql
CREATE TABLE users (
  id           INTEGER PRIMARY KEY,
  signed_up_at TEXT NOT NULL        -- 'YYYY-MM-DD HH:MM:SS'
);
CREATE TABLE events (
  user_id     INTEGER NOT NULL,
  name        TEXT NOT NULL,
  occurred_at TEXT NOT NULL         -- 'YYYY-MM-DD HH:MM:SS'
);
```

The report is **as of 2026-04-30** (inclusive): events from `2026-05-01 00:00:00` on are ignored.

- A user's **cohort** is their sign-up month, `'YYYY-MM'`. Only users who signed up from
  `2026-01-01 00:00:00` to `2026-03-31 23:59:59` are in the report.
- A user is **active in month k** of their cohort when they have at least one event (of any name)
  in the k-th calendar month after the sign-up month (k = 1 is the next calendar month).
- `mk` is the percentage of the cohort's users active in month k, `ROUND(100.0 * active / size, 1)`.
  It is `NULL` when that month is after April 2026.

Columns, exactly: `cohort`, `size`, `m1`, `m2`, `m3`. One row per cohort that has at least one user,
sorted by `cohort`.

Example:

```
users:  (1, '2026-01-05 10:00:00'), (2, '2026-01-20 10:00:00'), (3, '2026-01-31 23:00:00'),
        (4, '2026-02-10 10:00:00'), (5, '2026-03-31 22:00:00'), (6, '2025-12-30 10:00:00')
events: (1, '2026-02-01 09:00:00'), (1, '2026-02-15 09:00:00'), (1, '2026-04-02 09:00:00'),
        (2, '2026-01-21 09:00:00'), (2, '2026-02-28 09:00:00'), (2, '2026-03-03 09:00:00'),
        (4, '2026-03-01 09:00:00'), (4, '2026-05-02 09:00:00'), (5, '2026-04-30 23:59:59'),
        (6, '2026-01-10 09:00:00')        (all named 'visit')
```

```
cohort|size|m1|m2|m3
2026-01|3|66.7|33.3|33.3
2026-02|1|100.0|0.0|NULL
2026-03|1|100.0|NULL|NULL
```

Hidden tests decide correctness.
'''
starter = '''
-- retention: write your query below
-- Hint: put the report dates in a params CTE; reduce events to DISTINCT (user, month offset);
-- count per cohort with FILTER, and return NULL for months after April 2026.
'''
tests = '''
SCHEMA = """
CREATE TABLE users (id INTEGER PRIMARY KEY, signed_up_at TEXT NOT NULL);
CREATE TABLE events (user_id INTEGER NOT NULL, name TEXT NOT NULL, occurred_at TEXT NOT NULL);
"""

EXAMPLE = SCHEMA + """
INSERT INTO users VALUES
  (1, '2026-01-05 10:00:00'), (2, '2026-01-20 10:00:00'), (3, '2026-01-31 23:00:00'),
  (4, '2026-02-10 10:00:00'), (5, '2026-03-31 22:00:00'), (6, '2025-12-30 10:00:00');
INSERT INTO events VALUES
  (1, 'visit', '2026-02-01 09:00:00'), (1, 'visit', '2026-02-15 09:00:00'),
  (1, 'visit', '2026-04-02 09:00:00'), (2, 'visit', '2026-01-21 09:00:00'),
  (2, 'visit', '2026-02-28 09:00:00'), (2, 'visit', '2026-03-03 09:00:00'),
  (4, 'visit', '2026-03-01 09:00:00'), (4, 'visit', '2026-05-02 09:00:00'),
  (5, 'visit', '2026-04-30 23:59:59'), (6, 'visit', '2026-01-10 09:00:00');
"""

COLUMNS = ["cohort", "size", "m1", "m2", "m3"]
AS_OF = 2026 * 12 + 4


def month(ts):
    return int(ts[:4]) * 12 + int(ts[5:7])


def expected(users, events):
    cohort = {u: ts for u, ts in users if "2026-01-01" <= ts < "2026-04-01"}
    active = {}
    for u, _, ts in events:
        if u in cohort and ts < "2026-05-01":
            active.setdefault(u, set()).add(month(ts) - month(cohort[u]))
    rows = []
    for label in sorted({ts[:7] for ts in cohort.values()}):
        members = [u for u, ts in cohort.items() if ts[:7] == label]
        row = [label, len(members)]
        for k in (1, 2, 3):
            if month(label + "-01") + k > AS_OF:
                row.append(None)
            else:
                n = sum(1 for u in members if k in active.get(u, ()))
                row.append(round(100.0 * n / len(members), 1))
        rows.append(tuple(row))
    return rows


class RetentionTest(unittest.TestCase):
    def assertRowsClose(self, got, want):
        self.assertEqual(len(got), len(want), got)
        for g, w in zip(got, want):
            self.assertEqual(g[:2], w[:2], (g, w))
            for a, b in zip(g[2:], w[2:]):
                if b is None:
                    self.assertIsNone(a, (g, w))
                else:
                    self.assertIsNotNone(a, (g, w))
                    self.assertAlmostEqual(a, b, delta=0.051, msg=(g, w))

    def check(self, setup):
        cols, rows = query(setup)
        self.assertEqual(cols, COLUMNS)
        users = query(setup, "SELECT id, signed_up_at FROM users")[1]
        events = query(setup, "SELECT user_id, name, occurred_at FROM events")[1]
        self.assertRowsClose(rows, expected(users, events))
        return rows

    def test_example(self):
        rows = self.check(EXAMPLE)
        self.assertRowsClose(rows, [
            ("2026-01", 3, 66.7, 33.3, 33.3),
            ("2026-02", 1, 100.0, 0.0, None),
            ("2026-03", 1, 100.0, None, None),
        ])

    def test_unobserved_months_are_null(self):
        rows = self.check(SCHEMA + """
            INSERT INTO users VALUES (1, '2026-03-02 10:00:00'), (2, '2026-03-20 10:00:00');
            INSERT INTO events VALUES
              (1, 'visit', '2026-05-03 10:00:00'), (1, 'visit', '2026-06-03 10:00:00'),
              (2, 'visit', '2026-05-01 00:00:00');
        """)
        self.assertRowsClose(rows, [("2026-03", 2, 0.0, None, None)])

    def test_silent_cohort_is_zero_not_null(self):
        rows = self.check(SCHEMA + """
            INSERT INTO users VALUES (1, '2026-01-10 10:00:00'), (2, '2026-01-11 10:00:00');
            INSERT INTO events VALUES (1, 'login', '2026-01-12 10:00:00');
        """)
        self.assertRowsClose(rows, [("2026-01", 2, 0.0, 0.0, 0.0)])

    def test_repeat_activity_counts_once(self):
        self.check(SCHEMA + """
            INSERT INTO users VALUES (1, '2026-02-01 00:00:00'), (2, '2026-02-02 00:00:00'),
                                     (3, '2026-02-03 00:00:00');
            INSERT INTO events VALUES
              (1, 'a', '2026-03-01 00:00:00'), (1, 'b', '2026-03-02 00:00:00'),
              (1, 'c', '2026-03-03 00:00:00'), (1, 'd', '2026-04-04 00:00:00'),
              (2, 'a', '2026-04-30 23:59:59');
        """)

    def test_signup_boundaries(self):
        rows = self.check(SCHEMA + """
            INSERT INTO users VALUES
              (1, '2025-12-31 23:59:59'), (2, '2026-01-01 00:00:00'),
              (3, '2026-03-31 23:59:59'), (4, '2026-04-01 00:00:00');
            INSERT INTO events VALUES
              (1, 'visit', '2026-01-15 00:00:00'), (2, 'visit', '2026-02-15 00:00:00'),
              (3, 'visit', '2026-04-15 00:00:00'), (4, 'visit', '2026-04-15 00:00:00');
        """)
        self.assertEqual([r[0] for r in rows], ["2026-01", "2026-03"])

    def test_empty(self):
        cols, rows = query(SCHEMA)
        self.assertEqual(cols, COLUMNS)
        self.assertEqual(rows, [])

    def test_many_users_and_events(self):
        self.check(SCHEMA + """
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 3000)
            INSERT INTO users
            SELECT i, datetime('2025-12-01', '+' || (i * 37 % 150) || ' days',
                               '+' || (i * 7919 % 86400) || ' seconds')
            FROM n;
            WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 30000)
            INSERT INTO events
            SELECT u.id, 'visit', datetime(u.signed_up_at, '+' || (n.i * 7919 % 130) || ' days')
            FROM n JOIN users AS u ON u.id = n.i % 3000 + 1
            WHERE (n.i * n.i + u.id) % 5 <> 0;
        """)
'''

[unit.step.gabarito]
solution = '''
WITH params AS (
  SELECT '2026-01-01' AS first_signup, '2026-04-01' AS signup_end,
         '2026-05-01' AS cutoff, 2026 * 12 + 4 AS as_of_month
),
cohorts AS (
  SELECT u.id AS user_id,
         strftime('%Y-%m', u.signed_up_at) AS cohort,
         strftime('%Y', u.signed_up_at) * 12 + strftime('%m', u.signed_up_at) AS cohort_month
  FROM users AS u, params AS p
  WHERE u.signed_up_at >= p.first_signup AND u.signed_up_at < p.signup_end
),
active AS (
  SELECT DISTINCT e.user_id,
         strftime('%Y', e.occurred_at) * 12 + strftime('%m', e.occurred_at) AS active_month
  FROM events AS e, params AS p
  WHERE e.occurred_at < p.cutoff
),
offsets AS (
  SELECT c.cohort, a.active_month - c.cohort_month AS k
  FROM cohorts AS c
  JOIN active AS a ON a.user_id = c.user_id
),
sizes AS (
  SELECT cohort, MIN(cohort_month) AS cohort_month, COUNT(*) AS size
  FROM cohorts
  GROUP BY cohort
),
counts AS (
  SELECT s.cohort, s.cohort_month, s.size,
         COUNT(o.k) FILTER (WHERE o.k = 1) AS a1,
         COUNT(o.k) FILTER (WHERE o.k = 2) AS a2,
         COUNT(o.k) FILTER (WHERE o.k = 3) AS a3
  FROM sizes AS s
  LEFT JOIN offsets AS o ON o.cohort = s.cohort
  GROUP BY s.cohort, s.cohort_month, s.size
)
SELECT c.cohort, c.size,
       CASE WHEN c.cohort_month + 1 <= p.as_of_month THEN ROUND(100.0 * c.a1 / c.size, 1) END AS m1,
       CASE WHEN c.cohort_month + 2 <= p.as_of_month THEN ROUND(100.0 * c.a2 / c.size, 1) END AS m2,
       CASE WHEN c.cohort_month + 3 <= p.as_of_month THEN ROUND(100.0 * c.a3 / c.size, 1) END AS m3
FROM counts AS c, params AS p
ORDER BY c.cohort;
'''
time = "O(e log e + u log u)"
space = "O(e + u)"
justification = '''
Let **e** be the number of events and **u** the number of users.

- `active` **scans** `events` once, drops everything after the cut-off, and deduplicates
  `(user_id, active_month)` pairs in a temporary B-tree: **O(e log e)** time, at most e rows. This
  is the step that turns "chatty" users into one row per user and month, so repeat events can
  never inflate a percentage.
- `cohorts` scans `users` once with the half-open sign-up range: O(u).
- `offsets` joins the deduplicated activity to the cohorts on `user_id`. `cohorts` has no index of
  its own, so SQLite builds an automatic index on one side and probes it from the other:
  O(e log u) at most, and the output has at most one row per (user, month).
- `sizes` and `counts` group by cohort, a handful of groups, and all three `FILTER` counts are
  updated in one pass over the offsets. The `LEFT JOIN` from `sizes` keeps a cohort whose users
  never came back, with counts of 0.

Everything after the first scan works on reduced data, so the total is **O(e log e + u log u)** time
and **O(e + u)** space for the temporary B-trees. The report's dates live only in `params`, and the
`NULL` for months after April comes from comparing month numbers, not from missing data: a month
that has not happened yet is unknown, not 0%.
'''
