[[unit]]
id = "sql-u07-group-by"
title = "Grouping rows: GROUP BY and HAVING"
level = "intermediate"
difficulty = 7
intro = '''
An aggregate over a whole table answers one question; `GROUP BY` answers it once per category.
You will split rows into groups by a column or by an expression, compute aggregates for each
group, and filter whole groups with `HAVING`, learning where each clause sits in the order
SQL evaluates a query.
'''
concepts = '''
## The idea

In the previous unit, `SUM(amount)` folded a whole table into a single row. Real questions are
rarely that coarse: *revenue per customer*, *orders per day*, *average price per category*.
**Grouping** splits the rows into buckets that share the same value of some key, then runs the
aggregates once per bucket. The result has exactly **one row per group**.

In relational algebra this is the grouping operator γ: it takes a relation, a list of grouping
keys and a list of aggregates, and returns a new relation. The individual rows that went in
are gone; only the keys and the aggregated values come out.

## How SQL expresses it

```sql
SELECT category, COUNT(*) AS items, AVG(price) AS avg_price
FROM products
WHERE price > 0
GROUP BY category
HAVING COUNT(*) >= 3;
```

A query is written in one order but evaluated, logically, in another:

1. `FROM` names the source of the rows.
2. `WHERE` filters **individual rows**.
3. `GROUP BY` forms the groups.
4. `HAVING` filters **whole groups**, so it may use aggregates.
5. `SELECT` computes the output columns.
6. `ORDER BY` and `LIMIT` shape the final result.

That order explains the rules. `WHERE` cannot mention `COUNT(*)`, because no group exists yet;
`HAVING` can. A condition on a plain column belongs in `WHERE`: it discards rows before they
are grouped, which is cheaper and clearer.

You can group by an **expression** as well as a column: `GROUP BY substr(day, 1, 7)` buckets
dates by month, and a `CASE` expression buckets prices into bands. Several keys
(`GROUP BY region, product`) make one group per distinct combination. All `NULL` keys fall
into a single group.

## SQLite specifics and pitfalls

- **Bare columns.** Standard SQL and PostgreSQL reject `SELECT customer, city, COUNT(*) ...
  GROUP BY customer`, because `city` is neither a key nor aggregated. SQLite accepts it and
  returns the `city` of an arbitrary row in the group (MySQL does the same unless
  `ONLY_FULL_GROUP_BY` is on). Treat it as a bug: put every non-aggregated column in
  `GROUP BY`.
- **Aliases.** SQLite lets you write `GROUP BY band` or `HAVING items >= 3` with an output
  alias. PostgreSQL accepts the alias in `GROUP BY` but not in `HAVING`; repeat the
  aggregate there if your SQL must be portable.
- **Order is not free.** `GROUP BY` does not promise any output order. SQLite often returns
  groups sorted by key because it sorted to group them, but only `ORDER BY` guarantees it.
- **Cost.** Without a helpful index, SQLite sorts the rows by the key into a temporary B-tree
  (`USE TEMP B-TREE FOR GROUP BY` in the query plan), roughly O(n log n). With an index on the
  key it reads the rows already in group order and streams the groups out.

## What you will practise

You will count and sum per category, separate row filters from group filters, and bucket rows
by a computed expression. The challenge asks for a per-customer report that combines all three.
'''

[[unit.step]]
kind = "concept"
id = "sql-u07-c1-groups"
title = "Rows in, groups out"
points = 5
difficulty = 7
intro = '''
Grouping changes the shape of the data: many input rows become one output row per key. To do
it, the engine has to bring rows with the same key together, either by sorting them or by
reading an index that already keeps them in key order.
'''
body = '''
## One row per group

```sql
SELECT category, COUNT(*) AS items, MAX(price) AS top_price
FROM products
GROUP BY category
ORDER BY category;
```

Picture SQLite reading `products`, sorting the rows by `category`, and then walking the sorted
list. Every time the category changes, it closes the current group, emits one row with its
count and maximum, and starts the next group.

So every column in the `SELECT` list must be one of two things:

- a **grouping key** (`category`), which has exactly one value per group;
- an **aggregate** (`COUNT(*)`, `MAX(price)`), which folds the group's rows into one value.

## WHERE before, HAVING after

```sql
SELECT category, COUNT(*) AS items
FROM products
WHERE price > 0          -- drops rows before grouping
GROUP BY category
HAVING COUNT(*) >= 3;    -- drops groups after aggregating
```

Ask of each condition: *is it about one row, or about the whole group?* Row conditions go in
`WHERE`, where they also shrink the work the grouping step has to do. Conditions on aggregates
can only go in `HAVING`, because the aggregate does not exist until the group is complete.
'''

