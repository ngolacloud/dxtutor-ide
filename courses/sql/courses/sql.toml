points = 10
difficulty = 33
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Normalisation is a projection: each output column is a pure function of the input row, so SQLite
evaluates it in one scan with no sorting or joining. Choosing the function well is the real work:
which differences are noise (case, spaces, dashes) and which are data.
'''
prompt = '''
Store a few sign-ups typed in by hand and select them back with a lower-case trimmed email, a
capitalised city, and a phone made of digits only, turning blanks into NULL.
'''
target = '''
CREATE TABLE signups (id INTEGER PRIMARY KEY, email TEXT, city TEXT, phone TEXT);
INSERT INTO signups VALUES
  (1, '  Ana@Example.COM ', 'lisbon', '912-345-678'),
  (2, 'rui@example.com', ' Porto  ', ''),
  (3, NULL, 'LISBON', ' 91 234 5678 '),
  (4, '', 'porto', NULL);
SELECT id,
       NULLIF(lower(trim(email)), '') AS email,
       upper(substr(trim(city), 1, 1)) || lower(substr(trim(city), 2)) AS city,
       NULLIF(replace(replace(trim(phone), '-', ''), ' ', ''), '') AS phone
FROM signups
ORDER BY id;
'''
