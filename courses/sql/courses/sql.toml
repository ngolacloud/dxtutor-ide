[[unit.step]]
kind = "challenge"
id = "sql-u23-x1-march-purchases"
title = "Make a slow report seek"
points = 40
difficulty = 29
entry = "march_purchases"
run_command = "python3 -m unittest"
intro = '''
Tune a real report end to end. You choose an index (column order matters), rewrite the
filter so it is sargable without changing its result, and wrap the query in a view. The tests
compare your rows with the slow original on several data sets and read the query plan to
prove it is a single covering seek with no sort.
'''
instructions = '''
## Your turn

Write a **script** with exactly two statements: one `CREATE INDEX` and one `CREATE VIEW`.
This table already exists (with data, and an index on `user_id` that does not help here):

```sql
CREATE TABLE events (
  id INTEGER PRIMARY KEY,
  user_id INTEGER NOT NULL,
  kind TEXT NOT NULL,          -- 'purchase', 'view', 'refund', ...
  created_at TEXT NOT NULL,    -- 'YYYY-MM-DD HH:MM:SS'
  amount INTEGER NOT NULL
);
CREATE INDEX idx_events_user ON events(user_id);
```

This report is correct but slow:

```sql
SELECT created_at, amount FROM events
WHERE kind = 'purchase'
  AND date(created_at) BETWEEN '2024-03-01' AND '2024-03-31'
ORDER BY created_at, amount;
```

1. Create **one index** on `events`, named as you like.
2. Create a view named **`march_purchases`** with the columns `created_at` and `amount`
   (in that order) that returns **exactly the same rows** as the report, using a
   **sargable** filter. Leave the `ORDER BY` out of the view.

The tests run `SELECT created_at, amount FROM march_purchases ORDER BY created_at, amount`
and check that:

- its rows equal the slow report's rows, on several data sets (watch the last day of March);
- its `EXPLAIN QUERY PLAN` is one `SEARCH events USING COVERING INDEX …` line whose seek uses
  both `kind=?` and a range on `created_at`, with no `SCAN` and no `USE TEMP B-TREE`.

Example: purchases at `2024-02-29 23:59:59`, `2024-03-31 18:00:00` and `2024-04-01 00:00:00`
and a view at `2024-03-10 10:00:00` give only the `2024-03-31 18:00:00` row.

Hidden tests decide correctness.
'''
starter = '''
-- march_purchases: write your CREATE INDEX and CREATE VIEW below
-- Hint: put the equality column first, then the range column, then the column you only
-- read. In the view, compare the bare created_at with a half-open range for March.
'''
tests = '''
SCHEMA = """
CREATE TABLE events (id INTEGER PRIMARY KEY, user_id INTEGER NOT NULL, kind TEXT NOT NULL,
                     created_at TEXT NOT NULL, amount INTEGER NOT NULL);
CREATE INDEX idx_events_user ON events(user_id);
"""

SLOW = """
SELECT created_at, amount FROM events
WHERE kind = 'purchase'
  AND date(created_at) BETWEEN '2024-03-01' AND '2024-03-31'
ORDER BY created_at, amount
"""

FAST = "SELECT created_at, amount FROM march_purchases ORDER BY created_at, amount"


def setup_for(events):
    values = ", ".join(f"({u}, '{k}', '{t}', {a})" for u, k, t, a in events)
    insert = f"INSERT INTO events (user_id, kind, created_at, amount) VALUES {values};" if events else ""
    return SCHEMA + insert


EDGES = [
    (1, "purchase", "2024-02-29 23:59:59", 5),
    (1, "purchase", "2024-03-01 00:00:00", 10),
    (2, "purchase", "2024-03-15 12:00:00", 30),
    (2, "purchase", "2024-03-15 12:00:00", 20),
    (3, "view", "2024-03-10 10:00:00", 0),
    (3, "refund", "2024-03-12 09:00:00", -30),
    (4, "purchase", "2024-03-31 18:00:00", 70),
    (4, "purchase", "2024-03-31 23:59:59", 80),
    (5, "purchase", "2024-04-01 00:00:00", 90),
    (5, "purchase", "2023-03-15 08:00:00", 15),
]


class MarchPurchasesTest(unittest.TestCase):
    def compare(self, events):
        conn = script(setup_for(events))
        try:
            fast = conn.execute(FAST)
            cols = [d[0] for d in fast.description]
            rows = fast.fetchall()
            slow = conn.execute(SLOW).fetchall()
        finally:
            conn.close()
        self.assertEqual(cols, ["created_at", "amount"])
        self.assertEqual(rows, slow)
        return rows

    def plan(self):
        conn = script(setup_for(EDGES))
        try:
            return [r[3] for r in conn.execute("EXPLAIN QUERY PLAN " + FAST)]
        finally:
            conn.close()

    def test_edges_of_march(self):
        rows = self.compare(EDGES)
        self.assertEqual(rows, [
            ("2024-03-01 00:00:00", 10),
            ("2024-03-15 12:00:00", 20),
            ("2024-03-15 12:00:00", 30),
            ("2024-03-31 18:00:00", 70),
            ("2024-03-31 23:59:59", 80),
        ])

    def test_empty_table(self):
        self.assertEqual(self.compare([]), [])

    def test_no_purchases_in_march(self):
        self.assertEqual(self.compare([
            (1, "view", "2024-03-05 10:00:00", 0),
            (1, "purchase", "2024-02-05 10:00:00", 9),
            (1, "purchase", "2025-03-05 10:00:00", 9),
        ]), [])

    def test_many_events(self):
        kinds = ["purchase", "view", "refund", "purchase"]
        events = []
        for i in range(300):
            day = 1 + (i * 7) % 31
            month = 2 + i % 3
            if month == 2 and day > 29:
                day = 29
            if month == 4 and day > 30:
                day = 30
            ts = f"2024-{month:02d}-{day:02d} {i % 24:02d}:{(i * 13) % 60:02d}:00"
            events.append((i % 9, kinds[i % 4], ts, i))
        rows = self.compare(events)
        self.assertGreater(len(rows), 30)

    def test_plan_is_a_covering_seek(self):
        plan = self.plan()
        self.assertEqual(len(plan), 1, plan)
        detail = plan[0]
        self.assertTrue(detail.startswith("SEARCH events USING COVERING INDEX"), plan)
        self.assertIn("kind=?", detail)
        self.assertIn("created_at>", detail)
        self.assertIn("created_at<", detail)

    def test_plan_has_no_scan_and_no_sort(self):
        plan = self.plan()
        self.assertFalse(any(d.startswith("SCAN") for d in plan), plan)
        self.assertFalse(any("TEMP B-TREE" in d for d in plan), plan)
'''

[unit.step.gabarito]
solution = '''
-- march_purchases: equality, then range, then the column we only read
CREATE INDEX idx_events_kind_created ON events(kind, created_at, amount);

CREATE VIEW march_purchases AS
SELECT created_at, amount
FROM events
WHERE kind = 'purchase'
  AND created_at >= '2024-03-01'
  AND created_at < '2024-04-01';
'''
time = "O(log n + k)"
space = "O(1)"
justification = '''
The slow report wraps `created_at` in `date()`, so its best plan seeks on `kind` alone and
then evaluates `date()` on every purchase ever made; without the right index it scans all
**n** events and sorts the result, **O(n + k log k)**.

With the index on `(kind, created_at, amount)`, the view's filter is fully sargable: SQLite
descends the B-tree once to the first entry with `kind = 'purchase'` and `created_at >=
'2024-03-01'` (**O(log n)**) and reads entries forward until `created_at` reaches
`'2024-04-01'`, touching only the **k** matching entries. The plan line is `SEARCH events
USING COVERING INDEX idx_events_kind_created (kind=? AND created_at>? AND created_at<?)`.

The index holds `created_at` and `amount`, so the table is never read (**covering**). Within
one `kind`, entries are sorted by `created_at`, then `amount`, which is exactly the
`ORDER BY`, so no temporary B-tree is built: **O(log n + k)** time and **O(1)** extra space.
The half-open range keeps all of March 31, which `created_at BETWEEN '2024-03-01' AND
'2024-03-31'` would lose. An index on `(created_at, kind, amount)` would seek only on the
date range and need a sort for the `amount` tie-breaker.
'''

