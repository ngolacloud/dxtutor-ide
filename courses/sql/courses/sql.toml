'''

[[unit.step]]
kind = "drill"
id = "sql-udb2-d3-covering"
title = "A covering index"
points = 10
difficulty = 17
placeholder_policy = "on_demand"
run_command = "sqlite3 < main.sql"
intro = '''
Every index entry stores its key columns and the rowid. When those already include every
column the query reads, SQLite answers from the index alone and skips the per-row lookup into
the table: a covering index. Extra key columns can also hand over the rows already sorted.
'''
prompt = '''
Index orders by `status`, ask for the plan of a sorted report on one status, then replace the
index with one on `(status, total)` and ask again.
'''
target = '''
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  status TEXT NOT NULL,
  total INTEGER NOT NULL
);
CREATE INDEX orders_status ON orders (status);
EXPLAIN QUERY PLAN
SELECT status, total FROM orders WHERE status = 'open' ORDER BY total;
DROP INDEX orders_status;
CREATE INDEX orders_status_total ON orders (status, total);
EXPLAIN QUERY PLAN
SELECT status, total FROM orders WHERE status = 'open' ORDER BY total;
EXPLAIN QUERY PLAN
SELECT SUM(total) AS open_total FROM orders WHERE status = 'open';
'''
line_comments = [
  "Creates a table of orders.",
  "The rowid.",
  "The order status.",
  "The order total.",
  "Ends the table definition.",
  "A single-column index on status.",
  "First plan:",
  "the open orders by total: the index finds them, but the totals must be fetched and sorted.",
  "Removes the single-column index.",
  "Indexes status and total together.",
  "Second plan:",
  "the same query: the entries hold both columns, already sorted by total.",
  "Third plan:",
  "an aggregate over the same columns is answered from the index too.",
]
explanation = '''
It printed:

```
id|parent|notused|detail
4|0|0|SEARCH orders USING INDEX orders_status (status=?)
14|0|0|USE TEMP B-TREE FOR ORDER BY
id|parent|notused|detail
3|0|0|SEARCH orders USING COVERING INDEX orders_status_total (status=?)
id|parent|notused|detail
3|0|0|SEARCH orders USING COVERING INDEX orders_status_total (status=?)
```

With `(status)` alone, SQLite seeked the index, fetched every matching row from the table to
read its `total`, and sorted them. With `(status, total)`, the entries for `'open'` are already
ordered by total and contain everything the query reads: no table lookups and no sort.
'''

[[unit.step]]
kind = "challenge"
id = "sql-udb2-x1-order-indexes"
title = "Index the orders table"
points = 30
difficulty = 17
entry = "order_indexes"
intro = '''
Index design starts from the queries, not from the columns. Each query here needs a different
access path, and one composite index can serve two of them if its columns are in the right
order. The hidden tests read `EXPLAIN QUERY PLAN` after your script has run.
'''
instructions = '''
## Your turn

Write a **script** of `CREATE INDEX` statements (**at most two indexes**) for this table, which
already holds a few thousand rows:

```sql
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL,
  status TEXT NOT NULL,         -- 'open', 'paid' or 'shipped'
  created_at TEXT NOT NULL,     -- 'YYYY-MM-DD'
  total INTEGER NOT NULL
);
```

The application runs these three queries (with different values each time):

```sql
-- 1. a customer's history, oldest first
SELECT id, total FROM orders WHERE customer_id = 42 ORDER BY created_at;
-- 2. recent orders in one status
SELECT id, customer_id, total FROM orders
WHERE status = 'open' AND created_at >= '2024-06-01';
-- 3. how many orders a customer has
SELECT COUNT(*) FROM orders WHERE customer_id = 42;
```

After your script runs, `EXPLAIN QUERY PLAN` must show:

1. query 1: a `SEARCH` on `customer_id=?` and **no** `USE TEMP B-TREE FOR ORDER BY`;
2. query 2: a `SEARCH` that uses **both** `status=?` and `created_at>?`;
3. query 3: a `SEARCH ... USING COVERING INDEX` on `customer_id=?`.

Do not change or delete any data. Index names are up to you.

Example: a plan line such as `SEARCH orders USING INDEX my_index (status=? AND created_at>?)`
passes rule 2; `SEARCH orders USING INDEX my_index (status=?)` does not.

Hidden tests decide correctness.
'''
starter = '''
-- order_indexes: write your CREATE INDEX statements below (at most two)
-- Hint: equality columns first, then the column used for a range or for ORDER BY.
'''
tests = '''
SCHEMA = """
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL,
  status TEXT NOT NULL,
  created_at TEXT NOT NULL,
  total INTEGER NOT NULL
);
"""

DATA = """
WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 3000)
INSERT INTO orders
SELECT i, i % 97,
       CASE i % 3 WHEN 0 THEN 'open' WHEN 1 THEN 'paid' ELSE 'shipped' END,
       date('2024-01-01', '+' || (i * 7 % 366) || ' days'),
       i * 13 % 500
FROM n;
"""

Q1 = "SELECT id, total FROM orders WHERE customer_id = 42 ORDER BY created_at"
Q2 = ("SELECT id, customer_id, total FROM orders "
      "WHERE status = 'open' AND created_at >= '2024-06-01'")
Q3 = "SELECT COUNT(*) FROM orders WHERE customer_id = 42"


def plan(conn, sql):
    return [row[3] for row in conn.execute("EXPLAIN QUERY PLAN " + sql)]


class OrderIndexesTest(unittest.TestCase):
    def setUp(self):
        self.conn = script(SCHEMA + DATA)
        self.addCleanup(self.conn.close)

    def test_history_seeks_without_sorting(self):
        details = plan(self.conn, Q1)
        self.assertTrue(
            any(d.startswith("SEARCH orders") and "customer_id=?" in d for d in details), details)
        self.assertFalse(any("TEMP B-TREE" in d for d in details), details)

    def test_status_range_uses_both_columns(self):
        details = plan(self.conn, Q2)
        self.assertTrue(
            any(d.startswith("SEARCH orders") and "status=?" in d and "created_at>?" in d
                for d in details), details)

    def test_count_is_covered(self):
        details = plan(self.conn, Q3)
        self.assertTrue(
            any(d.startswith("SEARCH orders USING COVERING INDEX") and "customer_id=?" in d
                for d in details), details)

    def test_at_most_two_indexes(self):
        (count,) = self.conn.execute(
            "SELECT COUNT(*) FROM sqlite_schema WHERE type = 'index' AND tbl_name = 'orders'"
        ).fetchone()
        self.assertGreaterEqual(count, 1)
        self.assertLessEqual(count, 2)

    def test_data_is_untouched(self):
        reference = connect(SCHEMA + DATA)
        self.addCleanup(reference.close)
        summary = "SELECT COUNT(*), SUM(total), SUM(customer_id), MAX(created_at) FROM orders"
        self.assertEqual(self.conn.execute(summary).fetchone(),
                         reference.execute(summary).fetchone())
        self.assertEqual(sorted(self.conn.execute(Q1).fetchall()),
                         sorted(reference.execute(Q1).fetchall()))

    def test_plans_hold_on_an_empty_table(self):
        conn = script(SCHEMA)
        self.addCleanup(conn.close)
        self.assertFalse(any("TEMP B-TREE" in d for d in plan(conn, Q1)))
        self.assertTrue(any("created_at>?" in d for d in plan(conn, Q2)))
        self.assertTrue(any("COVERING INDEX" in d for d in plan(conn, Q3)))
'''

[unit.step.gabarito]
solution = '''
-- order_indexes: one composite index per access path
CREATE INDEX orders_customer_created ON orders (customer_id, created_at);
CREATE INDEX orders_status_created ON orders (status, created_at);
'''
time = "O(log n + k)"
space = "O(n)"
justification = '''
`(customer_id, created_at)` serves two queries. For query 1, SQLite seeks the first entry of
customer 42 in **O(log n)** and walks its **k** entries, which are already in date order, so the
`ORDER BY` costs nothing; each entry's rowid then fetches `total` from the table. For query 3,
counting entries needs no table column at all, so the same index is **covering**: **O(log n + k)**
with no table access.

`(status, created_at)` puts the equality column first and the range column second. Query 2
seeks to `('open', '2024-06-01')` and reads forward until the status changes, touching only
the k matching entries. With `created_at` first, the open orders would be interleaved with every
other status; with `status` alone, SQLite would read every open order of the year and filter
the dates afterwards.

Without the indexes every query is a full **O(n)** scan, and query 1 adds an
**O(k log k)** sort. Each index costs **O(n)** space and adds an **O(log n)** update to every
insert, which is why two well-ordered indexes beat one per column.
'''

[[unit]]
id = "sql-udb3-n-plus-one"
title = "The N+1 query problem"
level = "intermediate"
difficulty = 18
intro = '''
One query fetches a list, then N more fetch something for each item: that is the N+1
anti-pattern, and each of those queries pays a full round trip. You will write the N+1 shape on
purpose, then fold it into one `JOIN`, one `IN (subquery)` and one `LEFT JOIN ... GROUP BY`. The
challenge is a report that replaces N per-author queries with a single statement.
'''
concepts = '''
## The idea

Every statement sent to a database has a fixed cost on top of the real work: the request travels to the server, the SQL is parsed and planned, and the result travels back. That is a **round trip**, often around a millisecond over a network, far more than reading a few rows from an index.

The **N+1 problem** appears when an application runs one query to get a list (the "1"), then loops over it and runs one more query per item (the "N"):

```sql
SELECT id, name FROM authors;                       -- 1
SELECT COUNT(*) FROM posts WHERE author_id = 1;     -- + one per author...
SELECT COUNT(*) FROM posts WHERE author_id = 2;
```

With three authors nobody notices. With ten thousand, a page runs 10 001 statements, and the database spends its time on overhead. ORMs make it easy to write by accident: reading `post.author` inside a loop quietly fires a query per post. In the database's log it is unmistakable: the same statement, again and again, with a different value each time.

## How SQL expresses it

SQL is built to process **sets**. Whatever the loop computes per item, one statement can compute for all items:

- **`JOIN`** brings each row's related data with it: every post with its author's name.
- **`WHERE id IN (SELECT ...)`** fetches all the parents of a set of rows in one go.
- **`LEFT JOIN ... GROUP BY`** computes a per-parent aggregate (counts, sums) for every parent at once, including the ones with no children.

```sql
SELECT p.title, a.name
FROM posts AS p
JOIN authors AS a ON a.id = p.author_id;
```

Inside the engine the work is still "for each post, find its author", a nested loop of primary-key seeks, but it happens in one statement and one round trip.

## What is special or tricky

- **Keep the parents with no children.** A plain `JOIN` drops an author without posts, while the N+1 loop would have reported 0. Use `LEFT JOIN`, and count a child column, `COUNT(p.id)`, because `COUNT(*)` counts the all-`NULL` row a `LEFT JOIN` produces for a childless parent.
- **`SUM` of nothing is `NULL`.** `COALESCE(SUM(x), 0)` turns it into 0.
- **Fan-out.** Joining a parent to a child and a grandchild repeats each child once per grandchild. Count the child with `COUNT(DISTINCT p.id)`, and never sum a child column over such a join.
- **Index the foreign key.** One query is only fast if each parent's children can be found by a seek. Without an index on `posts.author_id`, SQLite may build a temporary one for the duration of the query (an `AUTOMATIC` index in the plan).
- SQLite runs inside the application, so its round trips are cheap. Code that feels fast against a local file can crawl against a database server; the set-based habit matters more than the local timing.

## What you will practise

You will run the N+1 shape and count its statements, replace a lookup per row with a `JOIN` and an `IN`, and replace a count per row with a `LEFT JOIN ... GROUP BY`. The challenge is a per-author report in one statement.
'''

[[unit.step]]
kind = "concept"
id = "sql-udb3-c1-sets"
title = "One statement, not N"
points = 5
difficulty = 18
intro = '''
A database call has a fixed part (round trip, parse, plan) and a variable part (the rows it
touches). N+1 pays the fixed part N + 1 times; a set-based query pays it once and lets the
engine do the looping, where a step costs microseconds instead of a network hop.
'''
body = '''
## Three rewrites

**A lookup per row** (for each post, fetch its author) becomes a `JOIN`:

```sql
SELECT p.id, p.title, a.name
FROM posts AS p
JOIN authors AS a ON a.id = p.author_id;
```

**The parents of a set** (the authors of the posts in a list) becomes an `IN` with a subquery:

```sql
SELECT id, name FROM authors
WHERE id IN (SELECT author_id FROM posts WHERE created_at >= '2024-01-01');
```

**An aggregate per row** (for each author, count the posts) becomes a grouped `LEFT JOIN`:

```sql
SELECT a.name, COUNT(p.id) AS posts
FROM authors AS a
LEFT JOIN posts AS p ON p.author_id = a.id
GROUP BY a.id;
```

## Same answer, edge cases included

The rewrite must return exactly what the loop returned, so check the cases the loop handled
implicitly:

- a parent with no children (`LEFT JOIN`, `COUNT(p.id)`, `COALESCE(SUM(...), 0)`);
- a child whose parent is missing (an inner `JOIN` drops it, as the failed lookup would);
- two levels of children, where a join repeats rows (`COUNT(DISTINCT ...)`).

One statement also gives one consistent snapshot: rows cannot change between the "1" and the
"N" queries.
'''

