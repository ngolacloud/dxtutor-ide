[[unit.step]]
kind = "challenge"
id = "sql-u07-x1-repeat-buyers"
title = "Report the repeat buyers"
points = 30
difficulty = 7
entry = "repeat_buyers"
intro = '''
Put the whole pipeline together: filter rows, group them, filter groups and sort the result.
The hidden tests run your query against several data sets, so each clause has to do its job
in the right place, not just produce the right numbers once.
'''
instructions = '''
## Your turn

Write **one query** (a single `SELECT` statement) against this table:

```sql
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  customer TEXT,
  status TEXT,      -- 'paid', 'refunded' or 'pending'
  amount INTEGER
);
```

List every customer with **at least two paid orders**. Only orders whose `status` is `'paid'`
count, both for the number of orders and for the money.

Return exactly these columns, in this order:

| column | meaning |
|---|---|
| `customer` | the customer's name |
| `paid_orders` | how many paid orders they have |
| `revenue` | the sum of `amount` over their paid orders |

Sort by `revenue` from highest to lowest, and break ties by `customer` in alphabetical order.

Example. With these orders:

```text
ana  paid      30
ana  paid      20
ana  refunded  90
bo   paid      70
cy   paid      10
cy   paid      40
```

the result is:

```text
customer|paid_orders|revenue
ana|2|50
cy|2|50
```

Bo has only one paid order, and Ana's refund counts for nothing. Hidden tests decide
correctness.
'''
starter = '''
-- repeat_buyers: write your query below
-- Hint: filter rows with WHERE, group them by customer, then filter groups with HAVING.
'''
tests = '''
SCHEMA = """
CREATE TABLE orders (
  id INTEGER PRIMARY KEY,
  customer TEXT,
  status TEXT,
  amount INTEGER
);
"""


def with_orders(*orders):
    values = ", ".join("('%s', '%s', %d)" % o for o in orders)
    if not values:
        return SCHEMA
    return SCHEMA + "INSERT INTO orders (customer, status, amount) VALUES " + values + ";"


BASE = with_orders(
    ("ana", "paid", 30), ("ana", "paid", 20), ("ana", "refunded", 90),
    ("bo", "paid", 70),
    ("cy", "paid", 10), ("cy", "paid", 15), ("cy", "paid", 25),
    ("dee", "paid", 100), ("dee", "pending", 5),
    ("eve", "paid", 40), ("eve", "paid", 40),
)


class RepeatBuyersTest(unittest.TestCase):
    def test_columns(self):
        cols, _ = query(BASE)
        self.assertEqual(cols, ["customer", "paid_orders", "revenue"])

    def test_rows_in_order(self):
        _, rows = query(BASE)
        self.assertEqual(rows, [("eve", 2, 80), ("ana", 2, 50), ("cy", 3, 50)])

    def test_only_paid_orders_count(self):
        setup = with_orders(
            ("fay", "paid", 10), ("fay", "refunded", 10), ("fay", "refunded", 10),
            ("gus", "paid", 5), ("gus", "paid", 5), ("gus", "pending", 100),
        )
        _, rows = query(setup)
        self.assertEqual(rows, [("gus", 2, 10)])

    def test_exactly_two_is_enough(self):
        setup = with_orders(
            ("hal", "paid", 1), ("hal", "paid", 2),
            ("ivy", "paid", 500),
        )
        _, rows = query(setup)
        self.assertEqual(rows, [("hal", 2, 3)])

    def test_ties_broken_by_name(self):
        setup = with_orders(
            ("zed", "paid", 10), ("zed", "paid", 10),
            ("amy", "paid", 15), ("amy", "paid", 5),
            ("max", "paid", 1), ("max", "paid", 19),
            ("kim", "paid", 50), ("kim", "paid", 50),
        )
        _, rows = query(setup)
        self.assertEqual(
            rows,
            [("kim", 2, 100), ("amy", 2, 20), ("max", 2, 20), ("zed", 2, 20)],
        )

    def test_empty_table(self):
        _, rows = query(SCHEMA)
        self.assertEqual(rows, [])

    def test_nobody_qualifies(self):
        setup = with_orders(("ana", "paid", 10), ("ana", "pending", 10), ("bo", "refunded", 3))
        _, rows = query(setup)
        self.assertEqual(rows, [])
'''

[unit.step.gabarito]
solution = '''
SELECT customer,
       COUNT(*) AS paid_orders,
       SUM(amount) AS revenue
FROM orders
WHERE status = 'paid'
GROUP BY customer
HAVING COUNT(*) >= 2
ORDER BY revenue DESC, customer;
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
With no index on `status` or `customer`, SQLite **scans** all **n** rows of `orders` once and
tests `status = 'paid'` on each, **O(n)**. The surviving rows are sorted by `customer` into a
temporary B-tree (`USE TEMP B-TREE FOR GROUP BY`), **O(n log n)**, and then walked in order:
each group's `COUNT` and `SUM` are accumulated in constant space and checked by `HAVING` when
the group closes. The **g** groups that survive are sorted again for `ORDER BY`
(`USE TEMP B-TREE FOR ORDER BY`), **O(g log g)** with g ≤ n.

Total: **O(n log n)** time, and **O(n)** space for the sorter in the worst case. Putting the
status test in `WHERE` rather than in `HAVING` keeps refunded and pending rows out of the sort
altogether. An index on `(status, customer)` would let SQLite seek straight to the paid rows,
already in customer order, and skip the first sort.
'''

[[unit]]
id = "sql-u08-joins"
title = "Combining tables with INNER JOIN"
level = "intermediate"
difficulty = 8
intro = '''
Well-designed databases spread facts across tables and link them with keys; joins put them
back together. You will pair rows of two tables on a join condition, chain joins through a
link table, and join a table to itself, while learning how SQLite turns each join into a
loop of index lookups.
'''
concepts = '''
## The idea

Normalised data is split up: customers live in one table, orders in another, and
`orders.customer_id` holds the `id` of the customer who placed each order. A **join**
reassembles the pieces. Logically, an inner join takes the **Cartesian product** of two tables
(every row on the left paired with every row on the right) and keeps only the pairs that satisfy
a **join condition**. In relational algebra that is a selection σ applied to the product
A × B, written A ⋈ B.
A row with no partner on the other side simply does not appear.

## How SQL expresses it

```sql
SELECT o.id AS order_id, c.name, o.total
FROM orders AS o
JOIN customers AS c ON c.id = o.customer_id;
```

- `JOIN` and `INNER JOIN` mean the same thing.
- **Table aliases** (`o`, `c`) keep the query short. Qualify every column with its alias:
  when both tables have an `id`, a bare `id` fails with `ambiguous column name: id`.
- `ON` takes any boolean expression. Equality between a foreign key and a primary key (an
  **equi-join**) is by far the most common. `USING (customer_id)` is shorthand when both
  columns share a name.
- Joins chain: `FROM a JOIN b ON ... JOIN c ON ...` adds one table at a time to the rows built
  so far. A many-to-many relationship always needs a link table in the middle.
- A **self-join** lists the same table twice under two aliases, for example an employee row
  and the row of that employee's manager.

## Pitfalls

- **A missing condition.** In SQLite, `JOIN` without `ON` is a cross join: 1 000 customers
  and 10 000 orders give ten million rows. PostgreSQL makes that a syntax error, but the old
  comma form `FROM a, b` silently does the same in every database.
- **Fan-out.** Joining along a one-to-many link repeats the "one" side once per match. A
  customer with three orders appears three times, so summing a customer column after the join
  counts it three times. Aggregate at the right level.
- **Vanishing rows.** An inner join drops rows that have no partner, including rows whose key
  is `NULL`, because `NULL = 1` is never true. The next unit's outer joins keep them.

## How SQLite runs a join

SQLite executes every join as **nested loops**: for each row of the outer table it looks for
matching rows in the inner one. When the inner table has an index on the join column (a
primary key counts), each lookup is a B-tree seek, O(log m), so the join costs about
O(n log m) instead of O(n·m). Without a usable index SQLite often builds a temporary
**automatic index** for the query. The planner chooses the loop order; `EXPLAIN QUERY PLAN`
shows it, with `SEARCH ... USING INTEGER PRIMARY KEY` for a seek and `SCAN` for a full pass.

## What you will practise

You will join two tables, cross a many-to-many link table, and join a table to itself. The
challenge joins four tables and aggregates the result to compute revenue per city.
'''

[[unit.step]]
kind = "concept"
id = "sql-u08-c1-pairs"
title = "Pairs that match"
points = 5
difficulty = 8
intro = '''
A join is defined as "all pairs, then filter", but no engine builds all pairs. SQLite walks
one table and, for each row, seeks the matching rows of the other through an index, so a key
lookup replaces the quadratic product.
'''
body = '''
## From the product to the join

Take two customers and three orders. Their Cartesian product has 2 × 3 = 6 pairs:

```sql
SELECT c.name, o.id
FROM customers AS c
CROSS JOIN orders AS o;      -- every customer next to every order
```

Most of those pairs are nonsense: Ana next to an order Bo placed. The join condition keeps
only the meaningful ones:

```sql
SELECT c.name, o.id AS order_id
FROM customers AS c
JOIN orders AS o ON o.customer_id = c.id
ORDER BY o.id;
```

Now each order appears exactly once, next to the customer who placed it. A customer with no
orders, or an order whose `customer_id` matches nobody, is not in the result.

## Reading a join

- The **left** and **right** tables are symmetric in an inner join: swapping them changes
  nothing but the column order you choose in `SELECT`.
- The `ON` clause describes *how rows relate*; `WHERE` then filters the joined rows. For inner
  joins the two are interchangeable, but keeping relationships in `ON` and filters in `WHERE`
  makes the query easier to read.
- Each additional `JOIN` adds one more table to the pairs built so far.
'''

