[[unit]]
id = "sql-u20-json"
title = "JSON inside SQL"
level = "advanced"
difficulty = 26
intro = '''
Real data does not always arrive in neat columns: API payloads, event properties and settings
often land in a database as JSON documents. SQLite can read, unnest and build JSON with plain
SQL. You will pull fields out with `->>`, turn arrays into rows with `json_each`, and fold rows
back into JSON with `json_group_array`.
'''
concepts = '''
## The idea

A relational table wants one value per cell. A **JSON document** is the opposite: one text
value that holds a whole tree of keys, arrays and nested objects. Storing documents is handy
when the shape varies from row to row (event properties, a webhook body, user preferences),
but to filter, join or sum by what is inside, the database has to look *into* the text.

SQL handles this with two moves. **Extraction** reads one value at a path, such as
`$.customer.name` or `$.items[0].qty`. **Unnesting** turns an array inside one row into many
rows, so that ordinary `WHERE`, `JOIN` and `GROUP BY` can work on its elements. The reverse
move, **aggregation into JSON**, folds many rows back into one array or object, which is
exactly what an API response wants.

## How SQLite does it

SQLite stores JSON as ordinary `TEXT` (3.45 also has a binary `JSONB` blob format) and parses
it when a JSON function needs it.

```sql
SELECT '{"user": {"name": "Ana"}, "n": [3, 4]}' ->> '$.user.name';  -- Ana (SQL text)
SELECT '{"user": {"name": "Ana"}, "n": [3, 4]}' -> '$.n';           -- [3,4] (JSON text)
SELECT json_extract('{"n": [3, 4]}', '$.n[1]');                     -- 4
```

- `->>` returns an **SQL value** (text, integer, real or NULL); `->` returns **JSON text**, so
  a string comes back *with its quotes*. `json_extract` behaves like `->>` for scalars.
- `json_each(doc, path)` is a **table-valued function**: placed in `FROM`, it yields one row
  per element, with columns `key`, `value`, `type` and more. Joined to a table, it runs once
  per outer row, like a correlated subquery that returns rows.
- `json_group_array(x)` and `json_group_object(k, v)` are aggregates that build JSON;
  `json_object` and `json_array` build it from scalars. Since 3.44 an aggregate can take its
  own `ORDER BY`, as in `json_group_array(x ORDER BY x)`.

```sql
SELECT value FROM json_each('["a", "b"]');   -- two rows: a, b
SELECT json_group_array(value ORDER BY value DESC) FROM json_each('[1, 3, 2]');  -- [3,2,1]
```

## What is special or tricky

- `doc -> '$.status' = 'paid'` is never true: the left side is `"paid"` with quotes. Compare
  with `->>`.
- A missing path gives `NULL`, not an error, so typos fail silently. Invalid JSON text, on
  the other hand, raises `malformed JSON`; `json_valid(doc)` checks it first.
- Every lookup parses the document again. Filtering on a JSON field scans the table unless
  you add an **index on the expression**, such as `CREATE INDEX … ON t(doc ->> '$.user')`.
- PostgreSQL has real `json`/`jsonb` types with the same `->`/`->>` operators (`->>`
  always returns text) and `jsonb_array_elements` instead of `json_each`; MySQL has
  `JSON_EXTRACT`, `->>` and `JSON_TABLE`.

## What you will practise

You will extract scalars and sub-documents, unnest arrays into rows and count them, and
build JSON arrays and objects from grouped rows. The challenge turns order documents into a
per-product sales report.
'''

[[unit.step]]
kind = "concept"
id = "sql-u20-c1-documents"
title = "Documents inside rows"
points = 5
difficulty = 26
intro = '''
A JSON column is a tree serialized into one text cell. The engine cannot use it as a value
until it parses it, and every path lookup walks the parsed tree. Unnesting with `json_each`
is a lateral join: for each outer row it generates a small set of rows from that row's data.
'''
body = '''
## Three moves

```sql
CREATE TABLE events (id INTEGER PRIMARY KEY, doc TEXT);
INSERT INTO events VALUES (1, '{"user": "ana", "tags": ["new", "vip"]}');

SELECT doc ->> '$.user' FROM events;               -- extract: ana
SELECT e.id, t.value                                -- unnest: (1, new), (1, vip)
FROM events AS e, json_each(e.doc, '$.tags') AS t;
SELECT json_group_array(id) FROM events;            -- build: [1]
```

- **Extract** with `->>` when you want an SQL value to compare, sort or add up. Use `->`
  only when you want the JSON itself, for example to pass a sub-object along.
- **Unnest** with `json_each` in `FROM`. Writing `events AS e, json_each(e.doc, …)` is a
  join in which the right side depends on the left row, so every event produces as many
  rows as its array has elements, and none if the array is empty or missing.
- **Build** with `json_group_array`, `json_group_object` and `json_object`. They are the
  mirror image of unnesting: many rows in, one JSON value out.

## Paths

A path starts at `$`, the whole document. `.name` steps into an object key and `[2]` into an
array position, counting from 0; `[#-1]` is the last element. The shorthand `doc ->> 'user'`
means `$.user`.

## Cost

Each call parses the text (SQLite caches recent parses within a statement), then walks the
path. A filter such as `WHERE doc ->> '$.user' = 'ana'` must therefore read and parse every
row: a full scan, unless an index exists on that exact expression.
'''

