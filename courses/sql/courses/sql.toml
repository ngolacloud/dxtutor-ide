'''

[unit.step.gabarito]
solution = '''
SELECT account, id, ts, amount,
       SUM(amount) OVER running AS balance,
       ROUND(AVG(amount) OVER last3, 2) AS avg3
FROM transactions
WINDOW running AS (
         PARTITION BY account ORDER BY ts, id
         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
       ),
       last3 AS (
         PARTITION BY account ORDER BY ts, id
         ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
       )
ORDER BY account, ts, id;
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Both windows have the same `PARTITION BY account ORDER BY ts, id`, so SQLite sorts the
**n** transactions **once** (**O(n log n)**; an index on `(account, ts, id)` would let it
read them already in order) and evaluates both aggregates in the same pass. For the running
`SUM` it adds each row to an accumulator; for the three-row `AVG` it adds the entering row
and removes the one leaving the frame. Each step is O(1), so the windows are **O(n)** after
the sort. The final `ORDER BY` matches the window order, so it needs no second sort. The
sorter buffers the rows: **O(n)** space.

The details that make it correct: `id` in the window's `ORDER BY` makes the order total, so
tied timestamps have a defined sequence, and the explicit `ROWS` frame gives each tied row
its own balance. With the default `RANGE` frame and `ORDER BY ts`, every transaction at the
same minute would show the balance after all of them.
'''

