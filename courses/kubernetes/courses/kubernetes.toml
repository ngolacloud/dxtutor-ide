metadata:
  name: db-credentials
type: Opaque
stringData:
  username: shop
  password: change-me
'''
line_comments = [
  "Core API.",
  "Sensitive data — encoded, not encrypted.",
  "Identity.",
  "Referenced by secretKeyRef.",
  "The generic Secret type.",
  "Plain-text input; the API server stores it base64-encoded in `data`.",
  "A non-secret part of the credential.",
