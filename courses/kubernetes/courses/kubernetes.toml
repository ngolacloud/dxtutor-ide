equals = 4
message = "The Deployment runs 4 replicas (replicas: [{name: web, count: 4}])."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "spec.template.spec.containers[name=web].image"
equals = "nginx:1.27.3"
message = "images: [{name: nginx, newTag: 1.27.3}] gives nginx:1.27.3."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "metadata.labels.env"
equals = "prod"
message = "Every object carries env: prod in its metadata."

[[check]]
file = "rendered.yaml"
