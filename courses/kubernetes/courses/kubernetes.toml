[[unit]]
id = "k8s-u11-capstone"
title = "Capstone: ship the API to production"
level = "advanced"
difficulty = 11
intro = "Everything together: generated configuration, a patch with probes and resources, and an overlay — built and checked offline."
concepts = '''
This last unit puts the pieces together the way a real repository does. The base describes the API
once; the production overlay says what production needs on top of it:

- **generated configuration** — a `configMapGenerator` with `behavior: merge` overrides the base's
  values. The generated ConfigMap gets a **content hash** suffix (`api-config-7g2kf8h5m9`), and
  Kustomize rewrites every reference to it (`envFrom`, `valueFrom`, volumes). Change a value and the
  name changes, so the Deployment's template changes and the Pods roll — a ConfigMap edit can never
  silently leave old Pods with old settings;
- **a strategic-merge patch** — a partial Deployment in its own file (`patches: [{path: ...}]`) that
  adds probes and resources to the container named `api`. Lists of containers are merged **by
  name**, so the patch only needs the fields it adds;
- **the overlay's own transformations** — namespace, prefix, image tag, replicas, labels.

**Reviewing a build.** Before anything reaches a cluster, look at the output of `kubectl kustomize`:
the namespace on every object, the final names, the image tags, and every reference pointing at an
object that exists in the output. That review is what the hidden checks of the challenge automate —
and what a CI job should do on every pull request, with tools such as kubeconform or
`kubectl apply --dry-run=server` against a real cluster added on top.

**Where to go next.** The same manifests can be applied to a local cluster (kind) to see the
probes, the rollout and the quota at work; that is the hands-on part that comes after this offline
course. For production delivery, GitOps tools (Argo CD, Flux) apply an overlay from Git continuously.

Official docs: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/ and
https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/configmapgenerator/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c11-capstone"
title = "A review you can automate"
points = 5
difficulty = 11
intro = '''
What to verify in a build before it ever reaches a cluster.
'''
body = '''
For every build of an overlay, verify:

1. every namespaced object is in the right namespace;
2. names carry the prefix, and references (ConfigMaps, Services) point at names in the output;
3. images are pinned to the intended tags;
4. containers have probes and resources.

The challenge's checks do exactly this on the output of `kubectl kustomize`.
'''

[[unit.step]]
kind = "drill"
id = "k8s-d11-generator"
title = "Generated configuration"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
A configMapGenerator that merges new values over the base.
'''
prompt = '''
