[[unit]]
id = "k8s-u18-rollback"
title = "Rollback: a bad release, undone"
level = "advanced"
difficulty = 18
intro = "A release that never becomes ready: detect it quickly, keep serving with the old Pods, and roll back."
concepts = '''
Sooner or later a release is broken: the new Pods crash, or start but never pass their readiness
probe. What happens next depends on choices you made in the Deployment *before* the release.

**A bad rollout stalls safely — if you let it.** With `maxUnavailable: 0`, the controller removes an
old Pod only after a new one is Ready. New Pods that never become Ready therefore never replace
anything: the old Pods keep serving at full capacity and the rollout simply stops making progress.
With the default `maxUnavailable: 25%`, a quarter of the old Pods would be removed first and the
service would run with less capacity until someone noticed.

**Detecting it: the progress deadline.** `progressDeadlineSeconds` (default 600, ten minutes) is how
long a rollout may go without progress before the Deployment's condition `Progressing` turns
`False` with `reason: ProgressDeadlineExceeded`. `kubectl rollout status` then fails with
"exceeded its progress deadline" — the signal a pipeline uses to stop and roll back. A short deadline
detects a bad release in seconds instead of minutes. The controller does **not** roll back by
itself; it only reports.

**Rolling back.** `kubectl rollout undo deployment/web` makes the previous revision's Pod template the
current one again (as a new revision number) and rolls out back to it — instantly, because the old
ReplicaSet still exists, scaled down or, here, still running. `--to-revision=N` picks an older one;
`kubectl rollout history` lists them. How many old ReplicaSets are kept is `revisionHistoryLimit`
(default 10); with 0, there is nothing to roll back to.

**Afterwards, fix the source.** `rollout undo` changes the live object only: the next `kubectl apply`
of the broken manifest would break it again. Revert the change in Git, too.

Official docs: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-back-a-deployment
and https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#failed-deployment
'''

[[unit.step]]
kind = "concept"
id = "k8s-c18-rollback"
title = "Stall, detect, undo"
points = 5
difficulty = 1
intro = '''
The three settings that turn a bad release into a non-event.
'''
body = '''
| Setting | Without it | With it |
|---|---|---|
| `maxUnavailable: 0` | old Pods are removed before the new ones are Ready | capacity never drops |
| `progressDeadlineSeconds: 20` | 10 minutes before anyone is told | `ProgressDeadlineExceeded` after 20 s |
| `revisionHistoryLimit` ≥ 1 | nothing to roll back to | `rollout undo` is instant |

```sh
kubectl rollout status deployment/web     # error: … exceeded its progress deadline
kubectl rollout undo deployment/web       # back to the previous revision
kubectl rollout status deployment/web     # successfully rolled out
```
'''

