  "Core API.",
  "Non-sensitive configuration.",
  "Identity.",
  "Pods refer to it by this name.",
  "Not `spec`: a ConfigMap keeps its content in `data`.",
  "A key and its string value.",
  "Quoted: `data` values must be strings.",
  "A key can hold a whole file; `|` keeps the newlines.",
