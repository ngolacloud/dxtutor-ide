only_keys = ["name", "image", "command", "args", "ports", "env"]
message = "Use only name, image, command, args, ports and env in the container (check the spelling)."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].command"
equals = ["python", "-m", "http.server"]
message = "command is the program: [\"python\", \"-m\", \"http.server\"]."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].args"
equals = ["8000"]
message = "args is a list of strings: [\"8000\"]."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].ports"
len = 1
message = "Declare exactly one port."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].ports[0].containerPort"
is = "integer"
message = "containerPort is an integer, not a quoted string."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].ports[0].containerPort"
equals = 8000
message = "The container listens on port 8000."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].ports[0].name"
equals = "http"
message = "Name the port http."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].env"
len = 2
message = "Two environment variables: APP_ENV and PORT."

[[check]]
