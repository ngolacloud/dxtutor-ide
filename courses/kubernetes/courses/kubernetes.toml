'''
target = '''
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
'''
line_comments = [
  "Services are core objects.",
  "A stable name in front of Pods.",
  "Identity.",
  "Other Pods will reach it as `web`.",
  "Desired state.",
  "The default: reachable only inside the cluster.",
  "A plain label map (no matchLabels in a Service).",
  "Every Pod with app=web becomes an endpoint.",
  "One or more ports.",
  "Port names are required when there is more than one port.",
  "What clients connect to.",
  "The container port, referenced by its name.",
]
explanation = "If the Deployment later moves its container from 80 to 8080 but keeps the name `http`, this Service still works."

