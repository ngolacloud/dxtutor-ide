[[unit]]
id = "k8s-u8-namespaces"
title = "Namespaces and quotas"
level = "intermediate"
difficulty = 8
intro = "Namespaces divide one cluster into named spaces with their own names, policies and quotas."
concepts = '''
A **Namespace** is a scope for names: two Services called `web` can coexist in `shop` and in
`blog`. Most objects are **namespaced** (Pods, Deployments, Services, ConfigMaps, Secrets,
Ingresses); a few are **cluster-scoped** (Namespaces themselves, Nodes, PersistentVolumes,
ClusterRoles, StorageClasses) and must not carry `metadata.namespace`.

**Where an object goes.** `metadata.namespace` in the manifest wins; without it, `kubectl` uses the
namespace of your current context (often `default`), or `-n <ns>`. Writing the namespace in every
manifest of an application makes the files self-describing, and tools such as Kustomize can set it
for a whole directory (unit 10).

**References stay inside the namespace.** A Pod can only use ConfigMaps, Secrets and
ServiceAccounts of its own namespace, and a Service selects Pods of its own namespace. Across
namespaces, Pods talk through DNS: `api.shop.svc.cluster.local` (or simply `api.shop`).

**Quotas and defaults.** A `ResourceQuota` caps the total a namespace may use — for example
`requests.cpu: "4"`, `limits.memory: 8Gi`, `pods: "20"` (values in `hard` are quantities, written as
strings). When a quota on CPU or memory exists, every new Pod in the namespace must declare those
resources, or it is refused; a `LimitRange` can provide defaults so that it does not have to.

Namespaces are also the unit for RBAC (Roles and RoleBindings) and NetworkPolicies. They are not a
security boundary by themselves — they are the place where such boundaries are attached.

Official docs: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/ and
https://kubernetes.io/docs/concepts/policy/resource-quotas/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c8-namespaces"
title = "One cluster, many spaces"
points = 5
difficulty = 8
intro = '''
Which objects live in a namespace, how references work, and what a quota adds.
'''
body = '''
- Namespaced objects carry `metadata.namespace`; cluster-scoped ones must not.
- References (a Pod → its ConfigMap, a Service → its Pods) never leave the namespace.
- A `ResourceQuota` turns a namespace into a budget.

In the challenge you put a whole application into its own namespace, in one file with several
documents — so the checks pick each document by kind and name.
'''

