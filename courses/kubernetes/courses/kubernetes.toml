[[unit.step]]
kind = "challenge"
id = "k8s-p5-config"
title = "Wire configuration into a Deployment"
points = 40
difficulty = 6
intro = '''
Write a ConfigMap and point the Deployment's container at it and at a Secret.
'''
instructions = '''
You are given `secret.yaml` (read-only, placeholders only). Complete the two other files:

**`configmap.yaml`** — a ConfigMap named `app-config` with `LOG_LEVEL: info` and
`FEATURE_SEARCH: "true"` (a string).

**`deployment.yaml`** — in the `api` container:

- `envFrom` loads **every** key of `app-config`;
- an `env` variable `DB_USER` comes from the key `username` of the Secret `db-credentials`;
- an `env` variable `DB_PASSWORD` comes from the key `password` of the same Secret.

Use `valueFrom.secretKeyRef` for the two Secret values; do not copy any value into the Deployment.
'''

[unit.step.project]
main = "deployment.yaml"
readonly = ["secret.yaml"]
explanation = '''
The Deployment now holds only *references*. Rotating the password means changing the Secret (from a
secret manager, not from Git) and restarting the Pods; the Deployment file never changes and never
contains a credential. `envFrom` turns every ConfigMap key into a variable of the same name.
'''

[unit.step.project.starter]
"secret.yaml" = '''
# Placeholders only: real values are injected at deploy time, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  username: shop
  password: change-me
'''
"configmap.yaml" = '''
