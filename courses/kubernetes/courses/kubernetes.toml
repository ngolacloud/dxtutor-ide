# ── On a real cluster (live units, Learn P3b) ─────────────────────────────────────────────

[[unit]]
id = "k8s-u12-rollout"
title = "On a real cluster: a Deployment rolls out"
level = "advanced"
difficulty = 12
intro = "Your manifests meet a real API server, scheduler and kubelet: watch a Deployment roll out, then upgrade it."
concepts = '''
Until now every manifest was checked by reading it. From this unit on, your files are **applied to a
real cluster** and the checks look at what Kubernetes actually did.

**The practice cluster.** It is a one-node Kubernetes v1.36.4 made with **kind** ("Kubernetes in
Docker", here on rootless **Podman**): the node is a container that runs the control plane — API
server, scheduler, controller manager, etcd — and a kubelet with containerd. dxtutor keeps it apart
from everything else on your machine: its own Podman storage, its own kubeconfig (yours is never
read), and an internal network, so it cannot download images while grading — the images the units
use were downloaded once, by digest, when you prepared the course, and loaded into the node.

**A fresh namespace per check.** Every time you check a live step, the grader creates a namespace
(`dxt-<step>-<random>`), applies your files there with `kubectl apply -f`, waits for what the step
asks, reads the result with `kubectl get … -o json`, and deletes the namespace. So leave
`metadata.namespace` out of your manifests: the namespace is the grader's choice.

**What happens on apply.** The API server validates the Deployment and stores it. The Deployment
controller creates a **ReplicaSet** for the Pod template; the ReplicaSet creates the Pods; the
scheduler puts each Pod on the node; the kubelet pulls (here: finds) the image and starts the
containers; when the readiness probe passes, the Pod is **Ready** and counts as *available*.
`kubectl rollout status deployment/web` waits for exactly that: every desired replica updated and
available.

**An upgrade is a new ReplicaSet.** Change anything in the Pod template — the image tag, say — and
the Deployment creates a *second* ReplicaSet and moves replicas from the old one to the new one,
within the limits of the strategy: `maxSurge` extra Pods at most, `maxUnavailable` fewer available
Pods at most. The old ReplicaSet stays, scaled to 0, so that a rollback is instant. Each change of the
template is a **revision** (`kubectl rollout history`); the annotation
`deployment.kubernetes.io/revision` on the Deployment says which one is live.

**Readiness gates the rollout.** With `maxUnavailable: 0`, a new Pod must be Ready before an old one
is removed. A readiness probe is what tells Kubernetes "ready": without one, a Pod counts as ready
as soon as its container starts, even if the program inside needs seconds to listen.

Official docs: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/ and
https://kind.sigs.k8s.io/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c12-cluster"
title = "Apply, then look"
points = 5
difficulty = 1
intro = '''
How a live check works, and what you can do on your own machine to follow it.
'''
body = '''
A live check is the loop every Kubernetes engineer runs by hand:

```sh
kubectl apply -f deployment.yaml          # tell the API server what you want
kubectl rollout status deployment/web     # wait until the cluster has it
kubectl get deployment web -o json        # look at what is really there
```

The grader runs the same commands — only commands from a short allow-list, always against the
practice cluster and a namespace of its own — and checks fields of the JSON it gets back, such as
`status.readyReplicas`.

Before the cluster is touched, the same structural checks as in the offline units read your YAML: a
mistake you could see without a cluster is reported at once, and the live part only runs when they
pass.

The first live check creates the cluster (about a minute); later checks reuse it.
'''

[[unit.step]]
