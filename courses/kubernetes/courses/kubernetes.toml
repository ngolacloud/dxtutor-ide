[[unit.step]]
kind = "challenge"
id = "k8s-p17-limits"
title = "Fit the quota, stop the hog"
points = 45
difficulty = 18
intro = '''
A quota is waiting in the namespace. Your Deployment must fit it, and a memory hog must be killed by
its limit.
'''
instructions = '''
The namespace already has a hidden ResourceQuota `team-quota`: at most `pods: 4`, `requests.memory:
320Mi` and `limits.memory: 320Mi`.

1. In `api.yaml`, the Deployment `api` (2 replicas, image `nginx:1.27.5-alpine`) must get
   **Guaranteed** Pods: give its container `api` requests and limits of `cpu: 100m` and
   `memory: 96Mi`.
2. In `hog.yaml`, the Pod `hog` (with `restartPolicy: Never`) runs a program that tries to use
   200 MiB of memory. Give its container `hog` requests of `cpu: 50m`, `memory: 32Mi` and limits of
   `cpu: 100m`, `memory: 64Mi`, so the kernel stops it.

Together: 2 × 96Mi + 64Mi = 256Mi of limits, within the quota.

**Live.** The check applies the quota, your Deployment (it must roll out: every Pod admitted by the
quota) and the hog, then waits until the hog is terminated, and reads the Pods: the `api` Pods are
`Guaranteed`, and the hog was `OOMKilled` without a restart. (Prepare the course once; this needs
Podman.)
'''

[unit.step.project]
main = "api.yaml"
explanation = '''
The quota admitted the two `api` Pods (192Mi of limits) and the hog (64Mi) because each stated its
memory requests and limits and the total stayed under 320Mi; the starter's three 128Mi replicas would
have hit `exceeded quota` on the third Pod. The kernel killed the hog as soon as it went over 64 MiB:
its container's state says `OOMKilled`, exit code 137, and with `restartPolicy: Never` it stays
`Failed` instead of restarting.
'''

