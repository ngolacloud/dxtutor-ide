'''
body = '''
```sh
kubectl get endpointslices -l kubernetes.io/service-name=web -o json
```

returns something like:

```json
{"items": [{
  "ports": [{"name": "http", "port": 80, "protocol": "TCP"}],
  "endpoints": [
    {"addresses": ["10.244.0.7"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "web-7c9…"}},
    {"addresses": ["10.244.0.8"], "conditions": {"ready": true}, "targetRef": {"kind": "Pod", "name": "web-7c9…"}}
  ]
}]}
```

Count the endpoints: if there are more than the Deployment's replicas, the selector is catching
Pods you did not mean. In this unit's challenge, a stranger Pod shares one of your labels — the
check counts the endpoints to see whether your Service keeps it out.
'''

