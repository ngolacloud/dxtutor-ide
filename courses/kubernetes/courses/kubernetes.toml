[[unit]]
id = "k8s-u10-kustomize"
title = "Kustomize: one base, many environments"
level = "advanced"
difficulty = 10
intro = "Kustomize builds environment-specific manifests from a shared base, without templates — and kubectl runs it locally."
concepts = '''
The same application runs in several environments that differ in a few places: the namespace, the
number of replicas, the image tag, a label. Copying the manifests per environment drifts; templates
(`{{ .Values.x }}`) make YAML that is no longer YAML. **Kustomize** takes a third path: plain manifests
plus a `kustomization.yaml` that says how to *transform* them. It is built into kubectl:
`kubectl kustomize <dir>` prints the result, `kubectl apply -k <dir>` applies it. Building is
entirely **local** — which is why this course can grade it offline.

A typical layout:

```
base/            deployment.yaml, service.yaml, kustomization.yaml
overlays/prod/   kustomization.yaml   (resources: ["../../base"] + changes)
```

The fields you use most in an overlay (Kustomize v5):

| Field | Effect |
|---|---|
| `resources` | files or directories to include (a base is a directory with its own kustomization) |
| `namespace` | sets `metadata.namespace` on every namespaced object |
| `namePrefix` / `nameSuffix` | renames every object — and updates references to them (a Deployment's ConfigMap, an Ingress backend) |
| `labels` | adds labels; with `includeSelectors: true` also to selectors (the deprecated `commonLabels` always did, which breaks immutable selectors) |
| `images` | changes an image's `newName`, `newTag` or `digest` wherever it is used |
| `replicas` | sets `count` for a named workload |
| `patches` | strategic-merge or JSON patches, from a file (`path`) or inline (`patch`) |
| `configMapGenerator` / `secretGenerator` | generate objects with a content hash in the name, so changing a value rolls the Pods |

`bases`, `commonLabels`, `patchesStrategicMerge` and `vars` are deprecated in v5: use `resources`,
`labels`, `patches` and `replacements`. Remote bases (`github.com/...`) and Helm charts exist, but they
fetch from the network; this course uses local files only.

Official docs: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/ and the
reference at https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c10-kustomize"
title = "Transform, do not template"
points = 5
difficulty = 10
intro = '''
A base that never changes, and overlays that say only what differs.
'''
body = '''
An overlay lists the base in `resources` and then only the **differences**: namespace, prefix, image
tag, replicas, labels, patches. `kubectl kustomize overlays/prod` prints the final YAML — the
challenges of this unit run exactly that command, offline, and check its output.

Names change with `namePrefix`, and Kustomize rewrites the references to them; label selectors are
left alone unless you ask (`includeSelectors: true`), because a Deployment's selector cannot change.
'''

[[unit.step]]
kind = "drill"
id = "k8s-d10-base"
title = "A base kustomization"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
The kustomization of a base just lists its files.
'''
prompt = '''
Type the base `kustomization.yaml`.
'''
target = '''
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: shop
    includeSelectors: false
'''
line_comments = [
  "Kustomize's own schema (not a cluster API).",
  "Tells kubectl how to build this directory.",
  "The files and directories to include, in order.",
  "A plain Kubernetes manifest.",
  "Another one.",
  "Labels to add to every object…",
  "…as a list of label sets…",
  "…here one recommended label.",
  "Do NOT touch selectors (they are immutable once created).",
]
explanation = "`kubectl kustomize base` prints both manifests with the extra label in their metadata."

[[unit.step]]
kind = "drill"
id = "k8s-d10-overlay"
title = "An overlay"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
Production: a namespace, a prefix, a tag and more replicas.
'''
prompt = '''
Type the overlay's `kustomization.yaml`.
'''
target = '''
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: prod
namePrefix: prod-
images:
  - name: nginx
    newTag: 1.27.3
replicas:
  - name: web
    count: 3
'''
line_comments = [
  "Kustomize schema.",
  "An overlay is a kustomization too.",
  "What to start from:",
  "the base directory, by relative path.",
  "Every namespaced object goes into prod.",
  "web becomes prod-web — and references follow.",
  "Image changes:",
  "wherever the image nginx is used…",
  "…use the tag 1.27.3.",
  "Replica counts:",
  "the workload named web (its name in the base)…",
  "…runs 3 replicas.",
]
explanation = "The base is untouched; a staging overlay would be the same file with other values."

[[unit.step]]
kind = "challenge"
id = "k8s-p10-overlay"
title = "The production overlay"
points = 45
difficulty = 11
intro = '''
Write an overlay; the checks build it with kubectl kustomize and read the result.
'''
instructions = '''
`base/` (read-only) has a Deployment and a Service named `web`. Write
`overlays/prod/kustomization.yaml` so that `kubectl kustomize overlays/prod` produces:

- every object in the namespace **`prod`**, named with the prefix **`prod-`**;
- the image `nginx` with the tag **`1.27.3`**;
- **4** replicas of the Deployment;
- the label **`env: prod`** on every object's metadata, **without** touching selectors.

Use the base as a resource (relative path); do not copy its files.
'''
run_command = "kubectl kustomize overlays/prod"

[unit.step.project]
main = "overlays/prod/kustomization.yaml"
readonly = ["base/deployment.yaml", "base/service.yaml", "base/kustomization.yaml"]
explanation = '''
`labels` with `includeSelectors: false` adds `env: prod` to the metadata only; the deprecated
`commonLabels` would also have changed the Deployment's selector — refused by the API server on an
existing Deployment, because selectors are immutable. Note that `replicas` names the workload by its
**base** name (`web`), before the prefix is applied.
'''

