[[unit]]
id = "k8s-u5-config"
title = "ConfigMaps and Secrets"
level = "intermediate"
difficulty = 5
intro = "Configuration lives outside the image: plain settings in ConfigMaps, sensitive values in Secrets."
concepts = '''
The same image should run in development and in production; what changes is **configuration**.
Kubernetes keeps it in two kinds of object:

- a **ConfigMap** holds non-sensitive settings: `data` is a map of string keys to **string** values
  (`LOG_LEVEL: info`, `WORKERS: "4"`), up to 1 MiB in total;
- a **Secret** holds sensitive values (passwords, tokens, keys). In `data` the values are base64; in
  `stringData` you write them as plain text and the API server encodes them. `type: Opaque` is the
  generic type.

**A Secret is not encrypted by being a Secret.** Base64 is an encoding, not encryption: anyone who can
read the object can read the value. Protect Secrets with RBAC, enable encryption at rest in the
cluster, and **never commit real values to Git** — keep manifests with placeholders, and inject real
values from a secret manager (Vault, External Secrets, Sealed Secrets) at deploy time. This course
only ever uses obvious placeholders such as `change-me`.

**Consuming them in a Pod:**

```yaml
env:
  - name: LOG_LEVEL
    valueFrom:
      configMapKeyRef: {name: app-config, key: LOG_LEVEL}
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef: {name: db-credentials, key: password}
envFrom:
  - configMapRef: {name: app-config}      # every key becomes a variable
volumes:
  - name: config
    configMap: {name: app-config}          # every key becomes a file
```

Names and keys must match exactly; a missing ConfigMap or key keeps the Pod from starting (unless
`optional: true`). Environment variables are read once, at start; files mounted from a ConfigMap are
updated in place (eventually) when the ConfigMap changes.

Official docs: https://kubernetes.io/docs/concepts/configuration/configmap/ and
https://kubernetes.io/docs/concepts/configuration/secret/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c5-config"
title = "Configuration outside the image"
points = 5
difficulty = 5
intro = '''
ConfigMaps for settings, Secrets for sensitive values — and why a Secret is not a safe by itself.
'''
body = '''
Think of three layers:

1. the **image** — the same everywhere;
2. a **ConfigMap** — settings that change per environment;
3. a **Secret** — values that must not leak, referenced by name and key.

The Pod points at them with `configMapKeyRef`, `secretKeyRef`, `envFrom` or a volume. Every reference
is a *name* and a *key*, and both must exist. The real secret values never belong in a repository:
the files you write here use placeholders only.
'''

