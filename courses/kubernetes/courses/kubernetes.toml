[[unit]]
id = "k8s-u16-config-live"
title = "Configuration, mounted"
level = "advanced"
difficulty = 16
intro = "A ConfigMap reaches the program twice: as a file in a volume and as an environment variable."
concepts = '''
In the ConfigMaps unit you wrote configuration as data. Here a program **reads** it, and the logs
prove what it saw.

**Two ways in.** A container can receive a ConfigMap

- as **files**, through a `configMap` volume mounted at a path: each key becomes a file whose content
  is the value (`items` picks keys and file names; without it, every key becomes a file);
- as **environment variables**: one by one with `env[].valueFrom.configMapKeyRef`, or every key at
  once with `envFrom[].configMapRef`.

**When changes arrive.** Mounted files are updated by the kubelet some time after the ConfigMap
changes (up to about a minute, unless the volume uses `subPath`, which never updates). Environment
variables are read once, when the container starts: a change needs a new Pod — which is why
Kustomize's generated ConfigMaps put a hash in the name, so that a change rolls the Deployment.

**Missing configuration.** A Pod that references a ConfigMap (or a key) that does not exist does not
start: its container waits in `CreateContainerConfigError` until it appears, unless the reference
says `optional: true`. Apply the ConfigMap with, or before, the workload.

**Secrets work the same way** (`secret` volumes, `secretKeyRef`, `secretRef`), with the values stored
base64-encoded and, in a real cluster, with access controlled by RBAC and ideally encrypted at rest.
Never commit a real secret to a manifest.

**Reading what the program saw.** A Job that prints its configuration and exits makes the check
simple: wait for `Complete`, then `kubectl logs job/<name>`.

Official docs: https://kubernetes.io/docs/concepts/configuration/configmap/ and
https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c16-config"
title = "Files and variables"
points = 5
difficulty = 1
intro = '''
The same ConfigMap, consumed in two ways.
'''
body = '''
```yaml
volumes:
  - name: config
    configMap:
      name: app-config
      items:
        - key: app.conf      # this key…
          path: app.conf     # …becomes /etc/app/app.conf
containers:
  - name: app
    volumeMounts:
      - name: config
        mountPath: /etc/app
        readOnly: true
    env:
      - name: MODE
        valueFrom:
          configMapKeyRef:
            name: app-config
            key: MODE
```

The program sees a file `/etc/app/app.conf` and a variable `$MODE`. In the challenge it prints
both, and the check reads its logs.
'''

