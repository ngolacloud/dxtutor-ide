[[unit.step]]
kind = "challenge"
id = "k8s-p11-capstone"
title = "Production, end to end"
points = 50
difficulty = 12
intro = '''
An overlay with generated config and a patch, verified on the built output.
'''
instructions = '''
`base/` (read-only) has the `api` Deployment, its Service and a generated ConfigMap `api-config`
(`LOG_LEVEL=debug`). Complete the production overlay in `overlays/prod/`:

**`kustomization.yaml`** — namespace `shop`, prefix `prod-`, image `ghcr.io/example/shop-api` with
tag `2.5.0`, **3** replicas of `api`, a `configMapGenerator` that **merges** `LOG_LEVEL=warn` into
`api-config`, and the patch file below.

**`probes.yaml`** — a strategic-merge patch for the Deployment `api` that gives its container `api`:

- a `readinessProbe` and a `livenessProbe`, both `httpGet` on port `http`, paths `/ready` and
  `/healthz`;
- `resources` with `requests` `cpu: 250m`, `memory: 256Mi` and `limits` `memory: 512Mi`.

The checks build `overlays/prod` with `kubectl kustomize` and inspect the result.
'''
run_command = "kubectl kustomize overlays/prod"

[unit.step.project]
main = "overlays/prod/kustomization.yaml"
readonly = ["base/deployment.yaml", "base/service.yaml", "base/kustomization.yaml"]
explanation = '''
Because the ConfigMap's name carries a hash of its content, `LOG_LEVEL=warn` produces a new name and
the Deployment's `envFrom` is rewritten to it: applying the overlay rolls the Pods with the new
setting. The patch merges into the container *named* `api`, so the base's image, port and `envFrom`
stay, and the probes and resources are added.
'''

[unit.step.project.starter]
"base/deployment.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/shop-api:2.4.1
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
'''
"base/service.yaml" = '''
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
'''
"base/kustomization.yaml" = '''
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: api-config
    literals:
      - LOG_LEVEL=debug
'''
"overlays/prod/kustomization.yaml" = '''
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: shop
# TODO: namePrefix, images, replicas, configMapGenerator (merge) and patches
'''
"overlays/prod/probes.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          # TODO: readinessProbe, livenessProbe and resources
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["kubectl", "kustomize", "overlays/prod"]
save = "rendered.yaml"
message = "kubectl kustomize overlays/prod must build."

[[check]]
file = "rendered.yaml"
doc_count = 3
message = "The build has three objects: the ConfigMap, the Service and the Deployment."

[[check]]
file = "rendered.yaml"
doc = { kind = "ConfigMap" }
path = "metadata.name"
matches = '^prod-api-config-[a-z0-9]{10}$'
message = "The generated ConfigMap is prod-api-config-<hash>."

[[check]]
file = "rendered.yaml"
doc = { kind = "ConfigMap" }
path = "data"
equals = { LOG_LEVEL = "warn" }
message = "behavior: merge overrides LOG_LEVEL with warn."

[[check]]
file = "rendered.yaml"
doc = { kind = "ConfigMap" }
path = "metadata.namespace"
equals = "shop"
message = "The ConfigMap is in shop."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "metadata"
contains = { name = "prod-api", namespace = "shop" }
message = "The Deployment is prod-api in shop."

[[check]]
file = "rendered.yaml"
doc = { kind = "Service" }
path = "metadata"
contains = { name = "prod-api", namespace = "shop" }
message = "The Service is prod-api in shop."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "spec.replicas"
equals = 3
message = "3 replicas of api."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "spec.template.spec.containers[name=api].image"
equals = "ghcr.io/example/shop-api:2.5.0"
message = "The image is ghcr.io/example/shop-api:2.5.0."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "spec.template.spec.containers[name=api].envFrom[*].configMapRef.name"
among = { doc = { kind = "ConfigMap" }, path = "metadata.name" }
message = "envFrom must point at the generated ConfigMap in the output (Kustomize rewrites the name)."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "spec.template.spec.containers[name=api].readinessProbe.httpGet"
equals = { path = "/ready", port = "http" }
message = "readinessProbe: httpGet /ready on port http."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "spec.template.spec.containers[name=api].livenessProbe.httpGet"
equals = { path = "/healthz", port = "http" }
message = "livenessProbe: httpGet /healthz on port http."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "spec.template.spec.containers[name=api].resources"
equals = { requests = { cpu = "250m", memory = "256Mi" }, limits = { memory = "512Mi" } }
message = "resources: requests cpu 250m / memory 256Mi, limits memory 512Mi."

[[check]]
file = "rendered.yaml"
doc = { kind = "Deployment" }
path = "spec.template.spec.containers[name=api].ports[name=http].containerPort"
equals = 8000
message = "The patch must merge into the base container (by name), keeping its port."

[[check]]
file = "rendered.yaml"
doc = { kind = "Service" }
path = "spec.selector"
selects = { doc = { kind = "Deployment" }, path = "spec.template.metadata.labels" }
message = "The Service still selects the Deployment's Pods."
'''

[unit.step.project.solution]
"overlays/prod/kustomization.yaml" = '''
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: shop
namePrefix: prod-
images:
  - name: ghcr.io/example/shop-api
    newTag: 2.5.0
replicas:
  - name: api
    count: 3
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
patches:
  - path: probes.yaml
'''
"overlays/prod/probes.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
'''
