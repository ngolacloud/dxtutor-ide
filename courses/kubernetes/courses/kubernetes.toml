  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - port: 80
'''

[[unit]]
id = "k8s-u9-ingress"
title = "Ingress: HTTP routes into the cluster"
level = "advanced"
difficulty = 9
intro = "An Ingress routes external HTTP(S) requests, by host and path, to Services."
concepts = '''
A Service makes Pods reachable *inside* the cluster. To route outside HTTP traffic — by **host name**
and **URL path** — to several Services behind one address, you write an **Ingress**
(`networking.k8s.io/v1`):

```yaml
spec:
  ingressClassName: nginx            # which controller handles it
  tls:
    - hosts: [shop.example.com]
      secretName: shop-tls           # a kubernetes.io/tls Secret with the certificate
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api            # a Service in the SAME namespace
                port: {number: 8000} # or {name: http}
```

- An Ingress does nothing without an **Ingress controller** running in the cluster (ingress-nginx,
  Traefik, HAProxy, a cloud load balancer…). `ingressClassName` says which one should handle it.
- **`pathType`** is required: `Exact` (only that path), `Prefix` (that path and everything below it,
  matched element by element: `/api` matches `/api` and `/api/orders`, not `/apiv2`) or
  `ImplementationSpecific`.
- When several paths match, the **longest** wins, so `/api` beats `/` for `/api/orders`.
- The backend Service and port must exist, in the **same namespace** as the Ingress; the port is the
  *Service* port (not the container port).
- **TLS**: each entry lists hosts and the name of a Secret of type `kubernetes.io/tls`. Tools such as
  cert-manager create that Secret for you; it is never written by hand into Git.

The Gateway API (`gateway.networking.k8s.io`) is the newer, more expressive successor; the Ingress
remains the most widely deployed and is stable.

Official docs: https://kubernetes.io/docs/concepts/services-networking/ingress/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c9-ingress"
title = "Host, path, backend"
points = 5
difficulty = 9
intro = '''
How an Ingress maps a request to a Service.
'''
body = '''
For each request the controller looks at the **host** header, then the longest matching **path**, and
sends it to that rule's **backend**: a Service name and a Service port.

Three things to verify when you write one: the backend Service exists in the same namespace, the
port is one the Service exposes, and every path has a `pathType`.
'''

