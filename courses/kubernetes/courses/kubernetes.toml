  "The selector: app=web.",
  "The Pod template the controller stamps out.",
  "Metadata of each Pod.",
  "Their labels…",
  "…which satisfy the selector.",
  "The Pod spec, exactly as in a bare Pod.",
  "Containers.",
  "One container.",
  "Pinned image.",
]
explanation = "The Pods get generated names like `web-7d4b9c-x2k8p`: the Deployment name, the ReplicaSet hash and a random suffix."

[[unit.step]]
kind = "challenge"
id = "k8s-p3-deployment"
title = "A Deployment that rolls safely"
points = 35
difficulty = 4
intro = '''
Selector, template labels, replicas and a rolling-update strategy that never drops below capacity.
'''
instructions = '''
Complete `deployment.yaml`: a Deployment named `web` in `apps/v1` that

- runs **3** replicas;
- selects its Pods with the labels `app: web` and `tier: frontend` (in `matchLabels`);
- gives its Pod template those two labels plus `version: "1.27"` (a string label, not in the
  selector, so the selector stays the same across versions);
- runs one container `web` with the image `nginx:1.27` and a port named `http` on `80`;
- rolls out with `strategy.type: RollingUpdate`, `maxUnavailable: 0` and `maxSurge: 1`.
'''

[unit.step.project]
main = "deployment.yaml"
explanation = '''
With `maxUnavailable: 0` and `maxSurge: 1`, a rollout starts one new Pod, waits until it is ready,
removes one old Pod, and repeats — capacity never drops. The starter's selector (`app: frontend`) did
not match its template (`app: web`): the API server would have refused the Deployment.
'''

[unit.step.project.starter]
"deployment.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
'''

[unit.step.project.tests]
"checks.toml" = '''
[[check]]
file = "deployment.yaml"
path = "apiVersion"
equals = "apps/v1"
message = "Deployments are in apps/v1."

[[check]]
file = "deployment.yaml"
path = "kind"
equals = "Deployment"
message = "The kind is Deployment."

[[check]]
file = "deployment.yaml"
path = "spec.replicas"
equals = 3
message = "Run 3 replicas."

[[check]]
file = "deployment.yaml"
path = "spec.selector.matchLabels"
equals = { app = "web", tier = "frontend" }
message = "The selector is exactly app: web and tier: frontend."

[[check]]
file = "deployment.yaml"
path = "spec.selector.matchLabels"
selects = { path = "spec.template.metadata.labels" }
message = "The template's labels must satisfy the selector, or the API server refuses the Deployment."

[[check]]
file = "deployment.yaml"
path = "spec.template.metadata.labels.version"
equals = "1.27"
message = "Add the label version: \"1.27\" to the template (quoted: label values are strings)."

[[check]]
file = "deployment.yaml"
path = "spec.selector.matchLabels.version"
exists = false
message = "Keep version out of the selector: a selector cannot change after creation."

[[check]]
file = "deployment.yaml"
path = "spec.template.spec.containers[name=web].image"
equals = "nginx:1.27"
message = "The web container runs nginx:1.27."

[[check]]
file = "deployment.yaml"
path = "spec.template.spec.containers[name=web].ports[name=http].containerPort"
equals = 80
message = "Declare the port http on 80."

[[check]]
file = "deployment.yaml"
path = "spec.strategy.type"
equals = "RollingUpdate"
message = "Use the RollingUpdate strategy."

[[check]]
file = "deployment.yaml"
path = "spec.strategy.rollingUpdate.maxUnavailable"
equals = 0
message = "maxUnavailable: 0 — never drop below 3 ready Pods during a rollout."

[[check]]
file = "deployment.yaml"
path = "spec.strategy.rollingUpdate.maxSurge"
equals = 1
message = "maxSurge: 1 — start one extra Pod at a time."
'''

[unit.step.project.solution]
"deployment.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
      tier: frontend
  template:
    metadata:
      labels:
        app: web
        tier: frontend
        version: "1.27"
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
'''

[[unit]]
id = "k8s-u4-services"
title = "Services: a stable name in front of Pods"
level = "intermediate"
difficulty = 4
intro = "Pods come and go with new IPs; a Service gives a set of Pods one stable name and port."
concepts = '''
Pods are disposable: a rollout replaces them, and every new Pod gets a new IP. Clients need something
stable. A **Service** (`v1`) is that stable front: a name and a virtual IP that forward to **whatever
Pods currently match its selector**.

```yaml
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: web}        # plain map — not matchLabels!
  ports:
    - name: http
      port: 80                # the port clients use on the Service
      targetPort: http        # the Pod's port: a number or a container port NAME
```

- **`spec.selector`** is a plain map of labels (a Service has no `matchLabels`). It must match the
  labels of the Pod **template**, not of the Deployment object.
- **`port`** is what clients connect to; **`targetPort`** is where the Pods listen. Using the
  container port's *name* (`http`) lets you change the number in the Deployment without touching the
  Service. If `targetPort` is left out it equals `port`.
- Inside the cluster, DNS resolves `web` (same namespace) or `web.<namespace>.svc.cluster.local`.

**Types.** `ClusterIP` (the default) is reachable only inside the cluster. `NodePort` additionally
opens the same port on every node, in the range 30000–32767 (`nodePort`, or let Kubernetes choose).
`LoadBalancer` asks the cloud provider for an external load balancer. `ExternalName` is just a DNS
alias. A Service with more than one port must name every port.

A Service whose selector matches no Pod is valid but answers nobody — its Endpoints stay empty. That
mismatch is the most common Kubernetes networking bug, and exactly what the checks of this unit look
for across files.

Official docs: https://kubernetes.io/docs/concepts/services-networking/service/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c4-services"
title = "Selectors, ports and targetPorts"
points = 5
difficulty = 4
intro = '''
How a Service finds its Pods, and the two ports you must not confuse.
'''
body = '''
Three things must line up between a Service and a Deployment:

1. The Service's **`selector`** must be satisfied by the Deployment's **template labels**.
2. The Service's **`targetPort`** must be a port the container really declares — by number or, better,
   by name.
3. Clients use the Service's **`port`**, which can differ from the container port (80 → 8080 is common).

In this unit the checks read two files at once: the Deployment and your Service.
'''

[[unit.step]]
kind = "drill"
id = "k8s-d4-clusterip"
title = "A ClusterIP Service"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
The default kind of Service, targeting a named port.
'''
prompt = '''
