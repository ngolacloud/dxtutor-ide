    - name: web
      image: nginx:1.27
'''
line_comments = [
  "Core API.",
  "A Pod.",
  "Identity, and now meaning.",
  "The name says WHICH object; labels say WHAT it is.",
  "A map of labels.",
  "The application this Pod belongs to.",
  "Its role in the system.",
  "A recommended label: the key has a prefix with dots and a slash.",
  "Desired state.",
  "Containers.",
  "One container.",
