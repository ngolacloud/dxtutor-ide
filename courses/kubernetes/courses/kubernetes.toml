[[unit]]
id = "k8s-u15-jobs"
title = "Jobs: work that finishes"
level = "advanced"
difficulty = 15
intro = "Not everything runs forever: a Job runs Pods until enough of them succeed, retries the failures, and stops."
concepts = '''
A Deployment keeps Pods running forever: if one exits, it is restarted. Batch work — a migration, a
report, a backup, a batch of images to resize — must instead **run to completion and stop**. That is
a **Job** (`batch/v1`).

**Completions and parallelism.** A Job is done when `completions` Pods have exited successfully (exit
code 0). `parallelism` says how many may run at the same time. `completions: 3, parallelism: 2` runs
two Pods, then a third as soon as one finishes.

**Retries.** A Pod that exits with an error counts as a failure; the Job creates a new Pod (with an
exponential back-off) until `backoffLimit` failures, and then gives up with the condition `Failed`.
`activeDeadlineSeconds` bounds the whole Job's run time.

**restartPolicy.** A Job's Pod template must say `restartPolicy: Never` (each retry is a new Pod — the
failed ones stay for their logs) or `OnFailure` (the kubelet restarts the container in the same Pod).
`Always`, the Pod default, is refused for a Job.

**Finished.** When the Job succeeds, its condition `Complete` becomes `True` and `status.succeeded`
counts the successful Pods. `kubectl wait --for=condition=Complete job/x` waits for that;
`kubectl logs job/x` prints the output of one of its Pods. Finished Jobs stay until you delete them,
or until `ttlSecondsAfterFinished` passes.

**CronJob** (`batch/v1`) creates a Job on a schedule (`"*/5 * * * *"`), with `concurrencyPolicy` and
the history limits; its `jobTemplate` is a Job spec.

Official docs: https://kubernetes.io/docs/concepts/workloads/controllers/job/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c15-jobs"
title = "Done means exit code 0"
points = 5
difficulty = 1
intro = '''
How a Job decides it is finished.
'''
body = '''
```yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: report
spec:
  completions: 3       # three successful Pods…
  parallelism: 2       # …at most two at a time
  backoffLimit: 2      # give up after two failed Pods
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.37.0
          command: ["sh", "-c", "echo done"]
```

`kubectl get job report` shows `COMPLETIONS 0/3`, `1/3`, … `3/3`. Then the `Complete` condition is
`True`, `status.succeeded` is 3, and the Pods stay (in `Completed` state) with their logs.
'''

