[[unit]]
id = "k8s-u14-probes-live"
title = "Probes at work: a slow start and a recovery"
level = "advanced"
difficulty = 14
intro = "Watch the kubelet run your probes: survive a slow start, drop out of traffic while busy, come back without a restart."
concepts = '''
In the probes unit you wrote probes; here the kubelet runs them, every `periodSeconds`, and acts on
the result. The three probes answer three different questions, and mixing them up is one of the most
common causes of outages.

**startupProbe — "has it finished starting?"** While it has not succeeded, the other two probes do
not run. It gets `failureThreshold × periodSeconds` seconds in total; if it never succeeds in that
time, the container is killed and restarted. Use it for programs that need a while to start (load a
model, warm a cache, run migrations), instead of a long `initialDelaySeconds` on the liveness probe.

**livenessProbe — "is it stuck?"** After startup, each failure counts; `failureThreshold` failures in
a row and the kubelet **kills and restarts** the container (`restartCount` goes up). It should only
fail when a restart would help — a deadlock, not a busy moment. A liveness probe that runs during a
slow start without a startup probe kills the container before it ever starts: a *crash loop* you
created yourself (`CrashLoopBackOff`).

**readinessProbe — "should it get traffic now?"** Failing it never restarts anything: the Pod's
`Ready` condition becomes `False`, it is taken out of every Service's endpoints, and when the probe
passes again it is put back. Overloaded, waiting for a dependency, draining before shutdown: those
are readiness failures.

**Probe handlers.** `httpGet` (status 200–399 passes), `tcpSocket` (the port accepts a connection),
`grpc`, and `exec` (a command inside the container; exit code 0 passes). `exec` probes cost a
process each time; keep them cheap.

**Watching it.** `kubectl wait --for=condition=Ready pod/x` waits until the Pod is Ready;
`--for=condition=Ready=false` waits until it is not. `status.containerStatuses[].restartCount`
counts restarts — after a recovery that only readiness handled, it is still 0.

Official docs: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c14-probes"
title = "Three probes, three reactions"
points = 5
difficulty = 1
intro = '''
What the kubelet does when each probe fails.
'''
body = '''
| Probe fails… | the kubelet… | you see |
|---|---|---|
| startup, beyond `failureThreshold × periodSeconds` | kills and restarts the container | `restartCount` +1 |
| liveness, `failureThreshold` times in a row | kills and restarts the container | `restartCount` +1 |
| readiness | marks the Pod not Ready; Services stop sending traffic | `READY 0/1`, no restart |

In the challenge the program takes about 12 seconds to start, is busy (not ready) for about 10
seconds a little later, and recovers by itself. The right probes make Kubernetes wait for the start,
stop traffic while it is busy, and send it again afterwards — **without a single restart**.
'''

