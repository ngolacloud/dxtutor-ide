[[unit]]
id = "k8s-u13-endpoints"
title = "Services with endpoints"
level = "advanced"
difficulty = 13
intro = "A Service is only as good as its selector: see which Pods it really sends traffic to."
concepts = '''
A Service has no Pods of its own. It has a **selector**, and the control plane keeps a list of the
Pods that match it — the Service's **endpoints** — up to date as Pods come and go. Traffic sent to the
Service's stable virtual IP (or its DNS name, `web.<namespace>.svc`) is spread over those endpoints.

**EndpointSlices.** Since Kubernetes 1.21 the endpoints live in **EndpointSlice** objects
(`discovery.k8s.io/v1`), labelled `kubernetes.io/service-name: <service>`. Each slice lists
addresses with a `conditions.ready` flag, and the ports, already resolved: a Service whose
`targetPort` is the *name* `http` gets the *number* each Pod declares for its port named `http`. The
older `Endpoints` object is deprecated (v1.33+). Read the slices with
`kubectl get endpointslices -l kubernetes.io/service-name=web -o json`.

**Only Ready Pods receive traffic.** A Pod that matches the selector but fails its readiness probe
is listed with `ready: false` and gets no traffic. That is how a rolling update hands traffic over
safely, and why readiness probes matter.

**A selector is a filter, not a name.** It selects *every* Pod in the namespace whose labels
include all of its key/value pairs — Pods of the Deployment you meant, and also any other Pod that
happens to carry the same labels: a debugging Pod, an old version, another team's worker. Two labels
(`app: web`, `tier: frontend`) are safer than one. The selector of a Service can be changed later
(unlike a Deployment's), but every change moves traffic at once.

**Named ports.** Point `targetPort` at the container port's **name**. If a new version moves the
program from port 80 to 8080, only the Pod template changes; the Service keeps working.

Official docs: https://kubernetes.io/docs/concepts/services-networking/service/ and
https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c13-endpoints"
title = "Who is behind the Service?"
points = 5
difficulty = 1
intro = '''
