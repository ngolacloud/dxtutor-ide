  name: web
spec:
  ingressClassName: nginx
  rules:
    - host: blog.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
'''
line_comments = [
  "Ingresses are in the networking group.",
  "HTTP routing into the cluster.",
  "Identity.",
  "The name.",
  "Desired state.",
  "The controller that should implement it.",
  "Routing rules.",
