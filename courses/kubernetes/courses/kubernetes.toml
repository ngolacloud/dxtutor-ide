instructions = '''
The `api` container listens on the port named `http` (8000) and serves `GET /healthz` (process
health) and `GET /ready` (ready for traffic). Add to it:

- a **`startupProbe`**: `httpGet` on `/healthz`, port `http`, `periodSeconds: 5` and
  `failureThreshold: 24` (two minutes to start);
- a **`livenessProbe`**: `httpGet` on `/healthz`, port `http`, `periodSeconds: 10`,
  `timeoutSeconds: 2`;
- a **`readinessProbe`**: `httpGet` on `/ready`, port `http`, `periodSeconds: 5`,
  `failureThreshold: 2`.

Refer to the port by its **name** in all three, and use only the fields listed (no
`initialDelaySeconds`: the startup probe covers slow starts).
'''

