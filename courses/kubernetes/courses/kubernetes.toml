[[unit]]
id = "k8s-u4-services"
title = "Services: a stable name in front of Pods"
level = "intermediate"
difficulty = 4
intro = "Pods come and go with new IPs; a Service gives a set of Pods one stable name and port."
concepts = '''
Pods are disposable: a rollout replaces them, and every new Pod gets a new IP. Clients need something
stable. A **Service** (`v1`) is that stable front: a name and a virtual IP that forward to **whatever
Pods currently match its selector**.

```yaml
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: web}        # plain map — not matchLabels!
  ports:
    - name: http
      port: 80                # the port clients use on the Service
      targetPort: http        # the Pod's port: a number or a container port NAME
```

- **`spec.selector`** is a plain map of labels (a Service has no `matchLabels`). It must match the
  labels of the Pod **template**, not of the Deployment object.
- **`port`** is what clients connect to; **`targetPort`** is where the Pods listen. Using the
  container port's *name* (`http`) lets you change the number in the Deployment without touching the
  Service. If `targetPort` is left out it equals `port`.
- Inside the cluster, DNS resolves `web` (same namespace) or `web.<namespace>.svc.cluster.local`.

**Types.** `ClusterIP` (the default) is reachable only inside the cluster. `NodePort` additionally
opens the same port on every node, in the range 30000–32767 (`nodePort`, or let Kubernetes choose).
`LoadBalancer` asks the cloud provider for an external load balancer. `ExternalName` is just a DNS
alias. A Service with more than one port must name every port.

A Service whose selector matches no Pod is valid but answers nobody — its Endpoints stay empty. That
mismatch is the most common Kubernetes networking bug, and exactly what the checks of this unit look
for across files.

Official docs: https://kubernetes.io/docs/concepts/services-networking/service/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c4-services"
title = "Selectors, ports and targetPorts"
points = 5
difficulty = 4
intro = '''
How a Service finds its Pods, and the two ports you must not confuse.
'''
body = '''
Three things must line up between a Service and a Deployment:

1. The Service's **`selector`** must be satisfied by the Deployment's **template labels**.
2. The Service's **`targetPort`** must be a port the container really declares — by number or, better,
   by name.
3. Clients use the Service's **`port`**, which can differ from the container port (80 → 8080 is common).

In this unit the checks read two files at once: the Deployment and your Service.
'''

