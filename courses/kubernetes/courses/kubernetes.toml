kind: ConfigMap
metadata:
  name: app-config
data: {}
'''
"deployment.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          command: ["python", "-m", "http.server", "8000"]
          env:
            - name: DB_PASSWORD
              value: change-me
'''

