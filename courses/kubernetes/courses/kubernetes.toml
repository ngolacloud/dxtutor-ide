[[unit.step]]
kind = "challenge"
id = "k8s-p3-deployment"
title = "A Deployment that rolls safely"
points = 35
difficulty = 4
intro = '''
Selector, template labels, replicas and a rolling-update strategy that never drops below capacity.
'''
instructions = '''
Complete `deployment.yaml`: a Deployment named `web` in `apps/v1` that

- runs **3** replicas;
- selects its Pods with the labels `app: web` and `tier: frontend` (in `matchLabels`);
- gives its Pod template those two labels plus `version: "1.27"` (a string label, not in the
  selector, so the selector stays the same across versions);
- runs one container `web` with the image `nginx:1.27` and a port named `http` on `80`;
- rolls out with `strategy.type: RollingUpdate`, `maxUnavailable: 0` and `maxSurge: 1`.
'''

[unit.step.project]
main = "deployment.yaml"
explanation = '''
With `maxUnavailable: 0` and `maxSurge: 1`, a rollout starts one new Pod, waits until it is ready,
removes one old Pod, and repeats — capacity never drops. The starter's selector (`app: frontend`) did
not match its template (`app: web`): the API server would have refused the Deployment.
'''

[unit.step.project.starter]
"deployment.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
'''

