# Kubernetes — the official dxtutor course for Kubernetes manifests.
#
# A TOOL course. The learner writes YAML; every challenge is a project step whose hidden
# `checks.toml` declares structural checks and, for Kustomize, the offline command
# `kubectl kustomize <dir>` (tutor_core::toolcheck has the allow-list). Units 1–11 are graded
# OFFLINE: commands run with an empty, temporary KUBECONFIG and HOME and never talk to a cluster.
# Units 12–18 are LIVE (Learn P3b, tutor_core::livecheck): the learner's manifests are applied to a
# fresh namespace of the course's practice cluster — kind v0.33.0 on rootless Podman, Kubernetes
# v1.36.4, its own storage and kubeconfig, on an internal network (tutor_eval::kindbox) — and
# verified with read-only kubectl queries. The images below are the only ones a live step may use:
# «Prepare course» downloads them once, by digest, with kind and the node image.
# Written against kubectl v1.36 (Kustomize v5.8).

id = "kubernetes-basics"
language = "yaml"
category = "tool"
subject = "kubernetes"
title = "Kubernetes: Manifests That Mean What They Say"
level = "beginner"
summary = "Write Kubernetes manifests that the API server accepts and that do what you meant: Pods, Deployments, Services, configuration, probes, resources, namespaces, Ingress and Kustomize — graded offline, then run for real in a practice cluster (kind on rootless Podman)."

overview = '''
**Kubernetes** runs containers on a cluster of machines and keeps them running. You do not start
containers yourself: you describe the state you want in **manifests** — YAML documents for Pods,
Deployments, Services and many other kinds — and Kubernetes' controllers make the cluster match,
continuously. Knowing how to write those manifests correctly is the core skill of everyone who
ships software to Kubernetes, from developers to platform engineers.

This course teaches that skill **offline**. You write real manifests; hidden checks read your YAML the
way a careful reviewer would — the right fields with the right types, selectors that really match
their Pods, references to objects that exist — and the Kustomize units build your overlays with
`kubectl kustomize`, locally. No cluster is needed and none is ever contacted: grading runs with an
empty, temporary kubeconfig, so your own contexts are never read.

What you will learn, in order:

1. **objects** — `apiVersion`, `kind`, `metadata`, `spec`, and the YAML that carries them;
2. **Pods** — containers, commands, ports and environment, with every type right;
3. **Deployments** — labels, selectors, replicas and safe rolling updates;
4. **Services** — a stable name and port in front of changing Pods;
5. **ConfigMaps and Secrets** — configuration outside the image, without ever committing a secret;
6. **probes** — readiness, liveness and startup;
7. **resources** — requests, limits and quality of service;
8. **namespaces** — scopes, references and quotas;
9. **Ingress** — HTTP routes by host and path, with TLS;
10. **Kustomize** — one base, many environments;
11. **a capstone** — generated configuration, patches and an overlay, reviewed automatically;
12. **on a real cluster** — a Deployment that rolls out and is upgraded;
13. **Services with endpoints** — a selector that picks exactly the right Pods;
14. **probes at work** — a slow start survived, a readiness failure recovered;
15. **Jobs** — work that runs to completion;
16. **configuration mounted** — a ConfigMap as files and as environment;
17. **limits enforced** — a quota, Guaranteed Pods and an out-of-memory kill;
18. **rollback** — a bad release detected and undone without losing capacity.

**What you need.** kubectl (https://kubernetes.io/docs/tasks/tools/) for the Kustomize units and the
live units — the course was written against **kubectl v1.36**, whose built-in Kustomize is v5.8. The
offline units need nothing but the editor; the live units also need Podman (below).

Official documentation: https://kubernetes.io/docs/ — the concepts pages linked in each unit match
the API versions used here (`v1`, `apps/v1`, `networking.k8s.io/v1`).

**On a real cluster (units 12–18).** The last seven units run your manifests for real, in the
course's own **practice cluster**: a one-node Kubernetes v1.36.4 made with **kind** on **rootless
Podman**. Each check applies your files to a fresh namespace, waits for what you asked for — a
rollout, Pods ready, a Job complete, a Service with endpoints, a container killed for using too much
memory — and reads the result with `kubectl get`. Prepare the course once («Prepare course»: it
downloads kind, the node image and the three images the units use, about 1 GB); the cluster is then
created when you first check a live step (about a minute), uses about 900 MB of memory, and is
deleted after 20 minutes without use or with «Delete cluster». It never uses your kubeconfig or your
containers, and it cannot download anything while grading. Live units need **Podman 4.9+** (rootless,
cgroup v2); without it, units 1–11 still work.
'''

[build]
prepare = true
dependencies = [
  "docker.io/library/nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10",
  "docker.io/library/nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284",
  "docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec",
]

[[unit]]
id = "k8s-u1-objects"
title = "Objects: apiVersion, kind, metadata, spec"
level = "basic"
difficulty = 1
intro = "Everything you give Kubernetes is an object written in YAML, with the same four top-level fields."
concepts = '''
Kubernetes is a **declarative** system. You do not tell it "start three containers"; you hand it a
description of the state you want — *three replicas of this container, reachable under this name* —
and its controllers work, continuously, to make the cluster match. That description is a set of
**objects**, and you write each one as a YAML document.

Every object, whatever it is, starts with the same four fields:

| Field | What it says |
|---|---|
| `apiVersion` | which API group and version defines this kind: `v1` (the core group), `apps/v1`, `networking.k8s.io/v1` |
| `kind` | what the object is: `Pod`, `Deployment`, `Service`, `ConfigMap`… |
| `metadata` | who it is: `name` (required), `namespace`, `labels`, `annotations` |
| `spec` | what you want: the desired state, different for every kind |

A fifth field, `status`, is written by Kubernetes itself (what is actually running); you never write
it in a manifest.

**Names.** `metadata.name` must be unique for its kind inside a namespace. Most kinds want a
DNS-1123 name: lowercase letters, digits and `-`, starting and ending with a letter or digit
(`web`, `api-v2`). Uppercase letters and underscores are refused by the API server.

**YAML is the syntax, the API is the meaning.** YAML is just nested maps (`key: value`), lists
(`- item`) and scalars. Indentation is structure: two spaces per level is the Kubernetes
convention, and tabs are not allowed. Keys are case-sensitive — `apiversion` is not
`apiVersion`, and the API server rejects a field it does not know when it validates strictly. Several
objects can live in one file, separated by a line with `---`.

**Offline in this course.** Your manifests are graded on your machine, without a cluster: the hidden
checks read the YAML you wrote, and later units run `kubectl kustomize`, which builds manifests
locally. Nothing here ever talks to a cluster or reads your kubeconfig. (Even `kubectl apply
--dry-run=client` asks the API server for its schema, so it is not used.) The course was written
against **kubectl v1.36** and its built-in Kustomize v5.8.

Official docs: https://kubernetes.io/docs/concepts/overview/working-with-objects/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c1-objects"
title = "A manifest is a wish, written down"
points = 5
difficulty = 1
intro = '''
What a Kubernetes object is, and the four fields every one of them has.
'''
body = '''
Open any Kubernetes manifest and you will find the same skeleton:

```yaml
apiVersion: v1        # the API that defines the kind
kind: Pod             # what this object is
metadata:
  name: hello         # who it is
spec: {}              # what you want (depends on the kind)
```

- `apiVersion` + `kind` together say **which schema** the rest of the document follows.
- `metadata.name` identifies the object; it is the handle every command uses
  (`kubectl get pod hello`).
- `spec` is the **desired state**. Kubernetes compares it with what is running and acts on the
  difference — that loop is what "declarative" means.

In this unit you write your first objects and learn to read the errors a typo produces.
'''

[[unit.step]]
kind = "drill"
id = "k8s-d1-namespace"
title = "The smallest object: a Namespace"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
A Namespace has no spec worth writing: the four-field skeleton is almost all of it.
'''
prompt = '''
Type the manifest. A Namespace is a cluster-wide object that groups other objects; it needs only a name.
'''
target = '''
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    team: payments
'''
line_comments = [
  "`v1` is the core API group: Namespaces, Pods, Services and ConfigMaps live there.",
  "The kind: this document describes a Namespace.",
  "Identity of the object.",
  "A DNS-1123 name: lowercase letters, digits and `-`.",
  "Labels are free key/value pairs you attach to any object…",
  "…so tools and selectors can find objects by meaning, not by name.",
]
explanation = "A Namespace is cluster-scoped, so it has no `metadata.namespace` itself. Other objects name it in their own `metadata.namespace`."

[[unit.step]]
kind = "drill"
id = "k8s-d1-pod"
title = "A first Pod"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
The Pod is the unit Kubernetes runs: one or more containers scheduled together.
'''
prompt = '''
Type the manifest of a Pod with one container that prints a line and then sleeps.
'''
target = '''
apiVersion: v1
kind: Pod
metadata:
  name: hello
spec:
  containers:
    - name: hello
      image: busybox:1.36
      command: ["sh", "-c", "echo hello && sleep 3600"]
'''
line_comments = [
  "Pods are in the core group.",
  "The smallest thing Kubernetes schedules onto a node.",
  "Identity.",
  "The Pod's name, unique in its namespace.",
  "The desired state of the Pod.",
  "A list: a Pod can run several containers that share network and volumes.",
  "Each container has a name, unique inside the Pod.",
  "The image, pinned to a version tag — never rely on `latest`.",
  "`command` replaces the image's ENTRYPOINT; a YAML flow list is the same as a block list.",
]
explanation = "`kubectl apply -f pod.yaml` would create it on a cluster; here, the check is that the YAML is well formed and has the four fields."

[[unit.step]]
kind = "challenge"
id = "k8s-p1-pod"
title = "Fix the broken Pod"
points = 30
difficulty = 2
intro = '''
A manifest with the kind of typos that make the API server refuse it.
'''
instructions = '''
`pod.yaml` was written in a hurry. The API server would refuse it. Fix it so that:

- the top-level fields are exactly `apiVersion`, `kind`, `metadata` and `spec` (YAML keys are
  case-sensitive);
- it is a `Pod` in the core API (`v1`) named `hello`;
- it has exactly one container, named `hello`, running the image `busybox:1.36`;
- the container runs `sh -c "echo hello && sleep 3600"` as its `command` (a list of three strings).
'''

[unit.step.project]
main = "pod.yaml"
explanation = '''
Four kinds of mistake were hiding here: a key with the wrong case (`apiversion`, `Name`), a kind
with the wrong case (`pod`), a name that is not a DNS-1123 label (`Hello`), and a `command` written as
one string instead of a list — Kubernetes would try to run a program literally named
`sh -c "echo hello && sleep 3600"`. A container without a `name` is refused too.
'''

[unit.step.project.starter]
"pod.yaml" = '''
# Fix every mistake: the API server would refuse this manifest.
apiversion: v1
kind: pod
metadata:
  Name: Hello
spec:
  containers:
    - image: busybox
      command: sh -c "echo hello && sleep 3600"
'''

[unit.step.project.tests]
"checks.toml" = '''
[[check]]
file = "pod.yaml"
doc_count = 1
message = "pod.yaml must contain exactly one object."

[[check]]
file = "pod.yaml"
only_keys = ["apiVersion", "kind", "metadata", "spec"]
message = "The top-level fields are apiVersion, kind, metadata and spec (keys are case-sensitive)."

[[check]]
file = "pod.yaml"
path = "apiVersion"
equals = "v1"
message = "Pods are defined by the core API: apiVersion: v1."

[[check]]
file = "pod.yaml"
path = "kind"
equals = "Pod"
message = "The kind is written Pod, with a capital P."

[[check]]
file = "pod.yaml"
path = "metadata"
only_keys = ["name", "namespace", "labels", "annotations"]
message = "metadata knows name, namespace, labels and annotations (lowercase)."

[[check]]
file = "pod.yaml"
path = "metadata.name"
equals = "hello"
message = "The Pod is named hello (names are lowercase DNS-1123 labels)."

[[check]]
file = "pod.yaml"
path = "spec.containers"
len = 1
message = "The Pod has exactly one container."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].name"
equals = "hello"
message = "Every container needs a name; this one is hello."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].image"
equals = "busybox:1.36"
message = "Pin the image to a tag: busybox:1.36."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].command"
equals = ["sh", "-c", "echo hello && sleep 3600"]
message = "command is a list of strings: [\"sh\", \"-c\", \"echo hello && sleep 3600\"]."
'''

[unit.step.project.solution]
"pod.yaml" = '''
apiVersion: v1
kind: Pod
metadata:
  name: hello
spec:
  containers:
    - name: hello
      image: busybox:1.36
      command: ["sh", "-c", "echo hello && sleep 3600"]
'''

[[unit]]
id = "k8s-u2-pods"
title = "Pods: containers, ports, commands and environment"
level = "basic"
difficulty = 2
intro = "What goes inside a Pod's spec: the containers, what they run, the ports they listen on and their environment."
concepts = '''
A **Pod** is a group of one or more containers that are always scheduled together, on the same node,
sharing one network namespace (they reach each other on `localhost`) and the volumes the Pod
declares. Most Pods run one main container; extra ones are helpers (a log shipper, a proxy).

**`spec.containers`** is a list. Each entry has:

- `name` — unique inside the Pod, used by `kubectl logs <pod> -c <name>`;
- `image` — the OCI image, ideally pinned to a tag (`nginx:1.27`) or a digest;
- `command` and `args` — override the image's `ENTRYPOINT` and `CMD`. `command` is the program,
  `args` its arguments; both are **lists of strings**. Leave them out to run what the image
  declares;
- `ports` — a list of `containerPort` entries (an integer, 1–65535), optionally with a `name`
  (≤ 15 lowercase characters) and a `protocol` (`TCP` by default). Declaring a port is documentation
  plus a name others can refer to; it does not open or publish anything by itself;
- `env` — a list of `{name, value}` pairs. Values are **strings**: write `"8000"`, not `8000`,
  because the API refuses a number where it expects a string;
- `workingDir` — the directory the process starts in.

**Types matter.** YAML guesses types: `8000` is an integer, `"8000"` a string, `true` a boolean,
`1.10` a float. Kubernetes fields have fixed types, so `containerPort: "8000"` and
`value: 8000` are both refused. Quote environment values that look like numbers or booleans.

**`restartPolicy`** applies to every container in the Pod: `Always` (the default), `OnFailure` or
`Never`. A bare Pod is rarely what you deploy — if its node dies, nobody recreates it. Controllers
such as Deployments (next unit) create Pods for you. You still need to know the Pod spec well,
because every controller embeds one as its *template*.

Official docs: https://kubernetes.io/docs/concepts/workloads/pods/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c2-pods"
title = "Inside a Pod spec"
points = 5
difficulty = 2
intro = '''
The fields of a container that you will write in almost every manifest.
'''
body = '''
A container entry answers four questions:

1. **What image?** `image: python:3.12-slim`
2. **What process?** `command: ["python", "-m", "http.server"]` and `args: ["8000"]`
3. **Which ports?** `ports: [{name: http, containerPort: 8000}]`
4. **What environment?** `env: [{name: APP_ENV, value: "dev"}]`

Every value has a type the API checks: ports are integers, environment values are strings, `command`
and `args` are lists. YAML's type guessing is the most common source of rejected manifests — this unit
trains your eye for it.
'''

[[unit.step]]
kind = "drill"
id = "k8s-d2-ports-env"
title = "Ports and environment"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
A web server with a named port and two environment variables.
'''
prompt = '''
Type the Pod. Notice which values are quoted and which are not.
'''
target = '''
apiVersion: v1
kind: Pod
metadata:
  name: web
spec:
  containers:
    - name: web
      image: nginx:1.27
      ports:
        - name: http
          containerPort: 80
      env:
        - name: TZ
          value: Africa/Luanda
        - name: WORKERS
          value: "4"
'''
line_comments = [
  "Core API.",
  "A Pod.",
  "Identity.",
  "The name.",
  "Desired state.",
  "The list of containers.",
  "The main container.",
  "nginx, pinned to 1.27.",
  "The ports this container listens on.",
  "A port name (≤ 15 characters) that Services and probes can refer to.",
  "An integer, never a quoted string.",
  "Environment variables, as a list of name/value pairs.",
  "The variable's name.",
  "Its value: always a string.",
  "A second variable…",
  "…whose value looks like a number, so it MUST be quoted.",
]
explanation = "Without the quotes, `4` would be an integer and the API server would refuse the Pod: environment values are strings."

[[unit.step]]
kind = "drill"
id = "k8s-d2-command"
title = "Command and args"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
Overriding what the image runs.
'''
prompt = '''
Type the Pod. `command` replaces the image ENTRYPOINT and `args` its CMD.
'''
target = '''
apiVersion: v1
kind: Pod
metadata:
  name: files
spec:
  restartPolicy: OnFailure
  containers:
    - name: server
      image: python:3.12-slim
      command: ["python", "-m", "http.server"]
      args: ["8000"]
      workingDir: /srv
'''
line_comments = [
  "Core API.",
  "A Pod.",
  "Identity.",
  "The name.",
  "Desired state.",
  "Restart the container only when it exits with an error.",
  "The containers.",
  "One container.",
  "The official slim Python image.",
  "The program and its fixed arguments.",
  "The arguments appended after `command` — a string, inside a list.",
  "The process starts in /srv, so it serves that folder.",
]
explanation = "Kubernetes runs `python -m http.server 8000` in `/srv`. With only `args`, the image's own ENTRYPOINT would get them."

[[unit.step]]
kind = "challenge"
id = "k8s-p2-api-pod"
title = "An API Pod"
points = 30
difficulty = 3
intro = '''
Write a Pod from a short specification, with every type right.
'''
instructions = '''
Write `pod.yaml`: a Pod named `api` with one container named `api` that

- runs the image `python:3.12-slim`;
- runs the command `python -m http.server` with the argument `8000` (use `command` for the program
  and `args` for `8000`);
- declares one port named `http` on container port `8000`;
- has the environment variables `APP_ENV` = `dev` and `PORT` = `8000` (a string!);
- uses `restartPolicy: Always`.

Use only the container fields named above.
'''

[unit.step.project]
main = "pod.yaml"
explanation = '''
The two traps were the types: `containerPort` must be an integer and every environment `value` a
string, so `PORT` needs quotes. `command` and `args` are both lists; Kubernetes runs them joined:
`python -m http.server 8000`.
'''

[unit.step.project.starter]
"pod.yaml" = '''
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  containers:
    - name: api
      image: python:3.12-slim
      # TODO: command, args, ports and env
'''

[unit.step.project.tests]
"checks.toml" = '''
[[check]]
file = "pod.yaml"
path = "metadata.name"
equals = "api"
message = "The Pod is named api."

[[check]]
file = "pod.yaml"
path = "spec.restartPolicy"
equals = "Always"
message = "Set restartPolicy: Always."

[[check]]
file = "pod.yaml"
path = "spec.containers"
len = 1
message = "One container."

[[check]]
file = "pod.yaml"
path = "spec.containers[0]"
only_keys = ["name", "image", "command", "args", "ports", "env"]
message = "Use only name, image, command, args, ports and env in the container (check the spelling)."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].command"
equals = ["python", "-m", "http.server"]
message = "command is the program: [\"python\", \"-m\", \"http.server\"]."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].args"
equals = ["8000"]
message = "args is a list of strings: [\"8000\"]."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].ports"
len = 1
message = "Declare exactly one port."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].ports[0].containerPort"
is = "integer"
message = "containerPort is an integer, not a quoted string."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].ports[0].containerPort"
equals = 8000
message = "The container listens on port 8000."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].ports[0].name"
equals = "http"
message = "Name the port http."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].env"
len = 2
message = "Two environment variables: APP_ENV and PORT."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].env[name=APP_ENV].value"
equals = "dev"
message = "APP_ENV is dev."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].env[*].value"
is = "string"
message = "Environment values are strings: quote numbers such as \"8000\"."

[[check]]
file = "pod.yaml"
path = "spec.containers[0].env[name=PORT].value"
equals = "8000"
message = "PORT is the string \"8000\"."
'''

[unit.step.project.solution]
"pod.yaml" = '''
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  restartPolicy: Always
  containers:
    - name: api
      image: python:3.12-slim
      command: ["python", "-m", "http.server"]
      args: ["8000"]
      ports:
        - name: http
          containerPort: 8000
      env:
        - name: APP_ENV
          value: dev
        - name: PORT
          value: "8000"
'''

[[unit]]
id = "k8s-u3-deployments"
title = "Labels, selectors and Deployments"
level = "basic"
difficulty = 3
intro = "Labels give objects meaning; a Deployment uses a selector over them to keep N copies of a Pod template running."
concepts = '''
**Labels** are key/value pairs in `metadata.labels`: `app: web`, `tier: frontend`, `env: prod`. They
carry no behaviour by themselves; they exist so that **selectors** can pick objects by meaning. A
selector `app=web,tier=frontend` matches every object that has *both* labels (a logical AND); extra
labels on the object do not matter. The recommended common labels use a prefix:
`app.kubernetes.io/name`, `app.kubernetes.io/part-of`… — keys with dots and slashes, which you
must quote in some tools but which are plain keys in YAML.

A **Deployment** (`apps/v1`) manages stateless Pods for you. Its spec has three parts that must agree:

```yaml
spec:
  replicas: 3                 # how many Pods
  selector:
    matchLabels: {app: web}   # which Pods belong to this Deployment
  template:                   # how to make one Pod
    metadata:
      labels: {app: web}      # MUST satisfy the selector
    spec: {containers: [...]}
```

The **selector must match the template's labels** — the API server refuses a Deployment whose
template would create Pods it does not select. The selector is also **immutable** after creation, so
choose labels that identify the application, not the version (put `version: v2` on the template
only if the selector does not include it).

Behind the scenes the Deployment creates a **ReplicaSet** per template version and moves Pods from
the old one to the new one when you change the template (a *rolling update*). The `strategy` field
controls it: `RollingUpdate` (default) with `maxSurge` and `maxUnavailable` (numbers or
percentages, default 25%), or `Recreate` (stop all, then start all). Changing only `replicas` scales
without a new ReplicaSet.

Official docs: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/ and
https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c3-deployments"
title = "From one Pod to a managed set"
points = 5
difficulty = 3
intro = '''
Why you almost never create bare Pods, and the one rule every Deployment must keep.
'''
body = '''
A Deployment is a **controller**: it watches the cluster and creates or deletes Pods until the number
of Pods matching its selector equals `replicas`. If a node dies, the Pods on it are recreated
elsewhere; if you change the image, a new ReplicaSet rolls out gradually.

The rule to remember: **`spec.selector.matchLabels` ⊆ `spec.template.metadata.labels`**. Every
label in the selector must appear, with the same value, on the template. The template can carry more
labels than the selector, never fewer.
'''

