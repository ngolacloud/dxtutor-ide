`app.yaml` holds the shop's objects. Make it a self-contained, namespaced application:

- add, as the **first** document, a `Namespace` named `shop`;
- put the existing `ConfigMap`, `Deployment` and `Service` (all named `web`) in the namespace `shop`
  (and keep the Namespace itself without a namespace — it is cluster-scoped);
- add a `ResourceQuota` named `budget` in `shop` with `hard` limits `requests.cpu: "2"`,
  `requests.memory: 2Gi` and `pods: "10"`;
- the Deployment's container already loads the ConfigMap — keep that reference working.

The file must end up with exactly five documents.
'''

[unit.step.project]
main = "app.yaml"
explanation = '''
A Namespace has to exist before anything is created in it, so it goes first. With the quota on
`requests.cpu` and `requests.memory`, a Pod without requests would now be refused in `shop` — which is
why the container's requests matter. The `envFrom` reference works because the ConfigMap and the
Deployment share the namespace.
'''

[unit.step.project.starter]
"app.yaml" = '''
apiVersion: v1
kind: ConfigMap
metadata:
  name: web
data:
  GREETING: hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          envFrom:
            - configMapRef:
                name: web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
'''

[unit.step.project.tests]
"checks.toml" = '''
[[check]]
file = "app.yaml"
doc_count = 5
message = "app.yaml has exactly five documents: Namespace, ResourceQuota, ConfigMap, Deployment and Service."

[[check]]
file = "app.yaml"
doc = { kind = "Namespace", name = "shop" }
path = "metadata.namespace"
exists = false
message = "A Namespace is cluster-scoped: it has no metadata.namespace."

[[check]]
file = "app.yaml"
doc = { kind = "ConfigMap", name = "web" }
path = "metadata.namespace"
equals = "shop"
message = "The ConfigMap web lives in shop."

[[check]]
file = "app.yaml"
doc = { kind = "Deployment", name = "web" }
path = "metadata.namespace"
equals = "shop"
message = "The Deployment web lives in shop (not default)."

[[check]]
file = "app.yaml"
doc = { kind = "Service", name = "web" }
path = "metadata.namespace"
equals = "shop"
message = "The Service web lives in shop."

[[check]]
file = "app.yaml"
doc = { kind = "Deployment", name = "web", namespace = "shop" }
path = "spec.template.spec.containers[*].envFrom[*].configMapRef.name"
among = { doc = { kind = "ConfigMap", namespace = "shop" }, path = "metadata.name" }
message = "The Deployment loads a ConfigMap of its own namespace by name."

[[check]]
file = "app.yaml"
doc = { kind = "ResourceQuota" }
path = "metadata"
equals = { name = "budget", namespace = "shop" }
message = "The ResourceQuota is budget, in shop."

[[check]]
file = "app.yaml"
doc = { kind = "ResourceQuota", name = "budget" }
