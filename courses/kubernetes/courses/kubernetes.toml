[[unit.step]]
kind = "challenge"
id = "k8s-p14-probes"
title = "Survive the start, recover from the rush"
points = 45
difficulty = 15
intro = '''
The kubelet runs your probes for real: the Pod must start, drop out of traffic, recover — and never
restart.
'''
instructions = '''
`pod.yaml` has a Pod `worker` whose container `app` (image `busybox:1.37.0`) behaves like a real
program: it needs about **12 seconds** to start (then it creates `/tmp/healthy` and `/tmp/ready`),
runs for 15 seconds, is **busy for about 10 seconds** (it removes `/tmp/ready`), and then is ready
again. `/tmp/healthy` stays as long as the program runs. Keep its `command`; add three probes, all
`exec` with `cat` and `periodSeconds: 2`:

- a `startupProbe` on `/tmp/healthy` with `failureThreshold: 20` (40 seconds to start);
- a `livenessProbe` on `/tmp/healthy` with `failureThreshold: 1`;
- a `readinessProbe` on `/tmp/ready` with `failureThreshold: 1`.

**Live.** The check applies the Pod and waits for it to become Ready, then not Ready (the busy
moment), then Ready again, and reads it: no restart at all. (Prepare the course once; this needs
Podman.)
'''

[unit.step.project]
main = "pod.yaml"
explanation = '''
The startup probe held the liveness probe back for the 12-second start; without it, a liveness probe
that fails once would have killed the program over and over (`CrashLoopBackOff`). When `/tmp/ready`
disappeared, only the readiness probe failed: the Pod became not Ready — a Service would have stopped
sending it traffic — and came back by itself. `restartCount` stayed 0 because liveness looks at a
different file.
'''

