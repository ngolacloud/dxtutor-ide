[[unit]]
id = "k8s-u17-limits-live"
title = "Limits, enforced"
level = "advanced"
difficulty = 17
intro = "A quota refuses what does not fit, Guaranteed Pods get what they asked for, and a container over its memory limit is killed."
concepts = '''
Requests and limits were numbers in the resources unit. In a real cluster three different
components act on them.

**The scheduler reads requests.** A Pod goes on a node only if the node's free *allocatable*
CPU and memory cover the Pod's requests. Requests are a reservation, not a cap.

**The kernel enforces limits.** The kubelet writes the limits into the container's cgroup. Over its
**CPU** limit, a container is *throttled* (it runs slower). Over its **memory** limit, the kernel's
out-of-memory killer **kills** it: the container's last state says `reason: OOMKilled`, exit code
137. Memory is not compressible; a memory limit is a hard wall.

**The API server enforces quotas.** A **ResourceQuota** in a namespace caps the total of what its
Pods may request and limit (`requests.memory`, `limits.memory`, `requests.cpu`, `pods`, …). When a
quota covers a resource, every new Pod must state it — a Pod without `limits.memory` is refused — and
a Pod that would push the total over the quota is refused at creation (`exceeded quota`). For a
Deployment, the ReplicaSet simply cannot create the extra Pods, and the rollout never finishes. A
**LimitRange** can give defaults to Pods that state nothing.

**Quality of service.** From requests and limits, each Pod gets a class: **Guaranteed** (every
container has requests equal to limits for CPU and memory), **Burstable** (some requests or limits),
**BestEffort** (none). Under memory pressure, the kubelet evicts BestEffort Pods first and
Guaranteed ones last. `status.qosClass` says which.

**Terminated Pods leave the quota.** A Pod that failed or completed no longer counts against it.

Official docs: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/ and
https://kubernetes.io/docs/concepts/policy/resource-quotas/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c17-limits"
title = "Who enforces what"
points = 5
difficulty = 1
intro = '''
The scheduler, the kernel and the API server each enforce a different number.
'''
body = '''
| Number | Enforced by | Over it… |
|---|---|---|
| `requests` | the scheduler | the Pod stays `Pending` until a node has room |
| `limits.cpu` | the kernel (cgroup) | the container is throttled |
| `limits.memory` | the kernel (cgroup) | the container is killed: `OOMKilled`, exit 137 |
| a ResourceQuota | the API server | the Pod is refused: `exceeded quota` |

In the challenge a quota is already in the namespace when your files arrive. Your Deployment must
fit it with Guaranteed Pods, and a deliberately greedy Pod must be stopped by its memory limit.
'''

