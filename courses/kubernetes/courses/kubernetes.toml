[[unit]]
id = "k8s-u6-probes"
title = "Health checks: liveness, readiness and startup probes"
level = "intermediate"
difficulty = 6
intro = "Probes tell Kubernetes when a container is ready for traffic, when it is stuck, and when it has finished starting."
concepts = '''
A running process is not necessarily a working service. The kubelet asks each container three
different questions, each configured as a **probe**:

| Probe | Question | On failure |
|---|---|---|
| `readinessProbe` | Can it take traffic *now*? | Removed from the Service's endpoints (not restarted) |
| `livenessProbe` | Is it stuck beyond repair? | The container is **restarted** |
| `startupProbe` | Has it finished starting? | Liveness and readiness wait until it succeeds; after `failureThreshold` failures, restart |

Each probe has one **handler**: `httpGet` (`path`, `port`; success is a status 200–399), `tcpSocket`
(`port` accepts a connection), `exec` (`command` exits 0) or `grpc`. The `port` can be a number or a
container port **name**.

Timing fields (all integers, in seconds except the thresholds):

- `initialDelaySeconds` (default 0) — wait before the first probe;
- `periodSeconds` (default 10) — how often;
- `timeoutSeconds` (default 1) — how long one probe may take;
- `failureThreshold` (default 3) — consecutive failures before acting;
- `successThreshold` (default 1; must be 1 for liveness and startup).

**Good habits.** Readiness checks dependencies the container needs to answer requests; liveness
checks only the process itself (a liveness probe that calls the database restarts every Pod when the
database blips — a cascading failure). For a slow starter, prefer a `startupProbe` with
`failureThreshold × periodSeconds` covering the worst start time, instead of a long
`initialDelaySeconds` on liveness.

Official docs: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c6-probes"
title = "Three questions the kubelet asks"
points = 5
difficulty = 6
intro = '''
Readiness, liveness and startup: what each one does when it fails.
'''
body = '''
- **Not ready** → no traffic, but the container keeps running.
- **Not alive** → the container is killed and restarted.
- **Not started yet** → the other two probes wait.

A probe is a handler (`httpGet`, `tcpSocket`, `exec`, `grpc`) plus timing. Getting the handler's
port right — ideally by the container port's name — and keeping liveness cheap are what matter most.
'''

