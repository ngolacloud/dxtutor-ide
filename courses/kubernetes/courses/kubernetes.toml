path = "spec.containers[0].env[name=PORT].value"
equals = "8000"
message = "PORT is the string \"8000\"."
'''

[unit.step.project.solution]
"pod.yaml" = '''
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  restartPolicy: Always
  containers:
    - name: api
      image: python:3.12-slim
      command: ["python", "-m", "http.server"]
      args: ["8000"]
      ports:
        - name: http
          containerPort: 8000
      env:
        - name: APP_ENV
          value: dev
        - name: PORT
          value: "8000"
'''

[[unit]]
id = "k8s-u3-deployments"
title = "Labels, selectors and Deployments"
level = "basic"
difficulty = 3
intro = "Labels give objects meaning; a Deployment uses a selector over them to keep N copies of a Pod template running."
concepts = '''
**Labels** are key/value pairs in `metadata.labels`: `app: web`, `tier: frontend`, `env: prod`. They
carry no behaviour by themselves; they exist so that **selectors** can pick objects by meaning. A
selector `app=web,tier=frontend` matches every object that has *both* labels (a logical AND); extra
labels on the object do not matter. The recommended common labels use a prefix:
`app.kubernetes.io/name`, `app.kubernetes.io/part-of`… — keys with dots and slashes, which you
must quote in some tools but which are plain keys in YAML.

A **Deployment** (`apps/v1`) manages stateless Pods for you. Its spec has three parts that must agree:

```yaml
spec:
  replicas: 3                 # how many Pods
  selector:
    matchLabels: {app: web}   # which Pods belong to this Deployment
  template:                   # how to make one Pod
    metadata:
      labels: {app: web}      # MUST satisfy the selector
    spec: {containers: [...]}
```

The **selector must match the template's labels** — the API server refuses a Deployment whose
template would create Pods it does not select. The selector is also **immutable** after creation, so
choose labels that identify the application, not the version (put `version: v2` on the template
only if the selector does not include it).

Behind the scenes the Deployment creates a **ReplicaSet** per template version and moves Pods from
the old one to the new one when you change the template (a *rolling update*). The `strategy` field
controls it: `RollingUpdate` (default) with `maxSurge` and `maxUnavailable` (numbers or
percentages, default 25%), or `Recreate` (stop all, then start all). Changing only `replicas` scales
without a new ReplicaSet.

Official docs: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/ and
https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c3-deployments"
title = "From one Pod to a managed set"
points = 5
difficulty = 3
intro = '''
Why you almost never create bare Pods, and the one rule every Deployment must keep.
'''
body = '''
A Deployment is a **controller**: it watches the cluster and creates or deletes Pods until the number
of Pods matching its selector equals `replicas`. If a node dies, the Pods on it are recreated
elsewhere; if you change the image, a new ReplicaSet rolls out gradually.

The rule to remember: **`spec.selector.matchLabels` ⊆ `spec.template.metadata.labels`**. Every
label in the selector must appear, with the same value, on the template. The template can carry more
labels than the selector, never fewer.
'''

[[unit.step]]
kind = "drill"
id = "k8s-d3-labels"
