[[unit.step]]
kind = "challenge"
id = "k8s-p18-rollback"
title = "Ship a bad release without an outage"
points = 50
difficulty = 19
intro = '''
A broken release hits your Deployment in the practice cluster. It must stall with full capacity, be
detected within seconds, and be rolled back.
'''
instructions = '''
Write `deployment.yaml`: a Deployment `web` with **3** replicas of Pods labelled `app: web`, one
container `web` (image `nginx:1.27.5-alpine`, a port named `http` on `80`) with a `readinessProbe`
(`httpGet` of `/` on `http`, `periodSeconds: 2`, `failureThreshold: 1`), and the settings that make a
bad release safe:

- `strategy.type: RollingUpdate` with `maxUnavailable: 0` and `maxSurge: 1`;
- `progressDeadlineSeconds: 20`;
- `revisionHistoryLimit: 3`.

**Live.** The check applies your Deployment and waits for it. Then a hidden `kustomization.yaml`
makes the "bad release" from your file — the image `nginx:1.28.0-alpine` and a readiness probe on
`/healthz`, a page nginx does not have (404) — and applies it. `kubectl rollout status` must fail with
"exceeded its progress deadline" while all 3 old Pods stay available. Then the check runs
`kubectl rollout undo deployment/web` and waits: the Deployment must be back on
`nginx:1.27.5-alpine` with 3 Ready Pods. (Prepare the course once; this needs Podman.)
'''

[unit.step.project]
main = "deployment.yaml"
explanation = '''
The bad release created one new Pod (`maxSurge: 1`) that never passed its probe, so no old Pod was
removed (`maxUnavailable: 0`): `availableReplicas` stayed 3 the whole time. After 20 seconds without
progress the `Progressing` condition became `False` (`ProgressDeadlineExceeded`) and `rollout status`
failed. `rollout undo` brought back the previous template as a new revision (3) and removed the
broken Pod. Remember: the next `kubectl apply` of the broken manifest would break it again — revert it
in Git too.
'''

[unit.step.project.starter]
"deployment.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27.5-alpine
          ports:
            - name: http
              containerPort: 80
'''

[unit.step.project.tests]
"kustomization.yaml" = '''
# Hidden: the bad release, made from the learner's Deployment (only the image and the probe path change).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
images:
  - name: nginx
    newTag: 1.28.0-alpine
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        template:
          spec:
            containers:
              - name: web
                readinessProbe:
                  httpGet:
                    path: /healthz
'''
"checks.toml" = '''
