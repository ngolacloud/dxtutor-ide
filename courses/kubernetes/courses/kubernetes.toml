[[unit]]
id = "k8s-u7-resources"
title = "Requests, limits and quality of service"
level = "intermediate"
difficulty = 7
intro = "Requests reserve capacity for scheduling; limits cap what a container may use; together they decide its QoS class."
concepts = '''
Every container can declare `resources`:

```yaml
resources:
  requests: {cpu: 250m, memory: 256Mi}   # what the scheduler reserves
  limits:   {cpu: "1", memory: 512Mi}    # the most it may use
```

- **Requests** are used by the **scheduler**: a Pod goes only to a node with enough *unreserved*
  capacity for the sum of its containers' requests. They are a reservation, not a cap.
- **Limits** are enforced by the kernel (cgroups). Over its **CPU** limit a container is *throttled*
  (it runs slower); over its **memory** limit it is **OOM-killed** and restarted.

**Units.** CPU is in cores: `1`, `0.5` or `500m` (millicores; `1000m` = one core). Memory is in
bytes with binary suffixes `Ki`, `Mi`, `Gi` (`256Mi` = 256 × 2²⁰ bytes) or decimal ones `k`, `M`, `G`.
Beware: `256m` of memory means 0.256 *bytes* — a classic typo. Quote values that YAML could read as a
number, such as `"1"`.

**Quality of Service.** From requests and limits Kubernetes derives a class used when a node runs out
of memory:

- **Guaranteed** — every container has CPU and memory limits, and requests equal to them;
- **Burstable** — at least one request or limit, but not Guaranteed;
- **BestEffort** — nothing declared; first to be evicted.

A common, safe default for web services: requests for CPU and memory, a memory limit equal to (or a
little above) the memory request, and no CPU limit or a generous one (CPU limits can throttle
latency-sensitive services). Databases and other critical singletons are often made Guaranteed.
Namespace-level `LimitRange` and `ResourceQuota` objects can impose defaults and totals.

Official docs: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
'''

[[unit.step]]
kind = "concept"
id = "k8s-c7-resources"
title = "Reserve, then cap"
points = 5
difficulty = 7
intro = '''
What the scheduler does with requests and the kernel with limits.
'''
body = '''
- `requests` → **where** a Pod can run (scheduling).
- `limits` → **how much** it may use (enforcement: CPU throttling, memory OOM-kill).
- Requests = limits for every resource of every container → **Guaranteed**.

Units are the usual source of bugs: `500m` CPU is half a core, `512Mi` memory is 512 mebibytes, and
`512m` memory is a fraction of a byte.
'''

