[[unit.step]]
kind = "challenge"
id = "k8s-p12-rollout"
title = "Roll out, then upgrade"
points = 40
difficulty = 13
intro = '''
Your Deployment is applied to the practice cluster, rolled out, upgraded to a new image and rolled
out again.
'''
instructions = '''
Write `deployment.yaml`: a Deployment named `web` (`apps/v1`, no namespace) that

- runs **3** replicas of Pods labelled `app: web` (the selector's `matchLabels` and the template);
- runs one container `web` with the image `nginx:1.27.5-alpine` and a port named `http` on `80`;
- has a `readinessProbe` that does an `httpGet` of `/` on the port `http`;
- upgrades with `strategy.type: RollingUpdate`, `maxUnavailable: 0` and `maxSurge: 1`, and keeps
  `revisionHistoryLimit: 5`.

**Live.** The check applies your file to a fresh namespace of the practice cluster and waits for the
rollout. Then it upgrades the image to `nginx:1.28.0-alpine` — a hidden `kustomization.yaml` changes
only the tag of your Deployment, so your strategy and probe stay — applies that, and waits again. It
reads the Deployment and its ReplicaSets: 3 ready Pods on the new image, revision 2, and the old
ReplicaSet kept at 0 replicas. (Prepare the course once; this needs Podman.)
'''

[unit.step.project]
main = "deployment.yaml"
explanation = '''
The upgrade created a second ReplicaSet and, one Pod at a time (`maxSurge: 1`), started a new Pod,
waited until its readiness probe passed, and only then removed an old one (`maxUnavailable: 0`). The
first ReplicaSet is still there with 0 replicas: `kubectl rollout undo` would scale it back up
instantly. The Deployment's `deployment.kubernetes.io/revision` annotation went from 1 to 2.
'''

[unit.step.project.starter]
"deployment.yaml" = '''
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27.5-alpine
'''

