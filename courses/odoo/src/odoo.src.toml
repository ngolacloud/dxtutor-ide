</record>
'''
line_comments = [
  "A view record with an external id.",
  "The model of the parent view.",
  "The view it extends.",
  "The extension's own arch.",
  "The anchor in the parent arch.",
  "The new field, hidden unless the tax is 0%.",
  "End of the anchor.",
