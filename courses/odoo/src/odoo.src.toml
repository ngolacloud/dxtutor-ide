'''
line_comments = [
  "fields declares columns; models holds the base classes.",
  "",
  "",
  "The Python class name does not matter to Odoo.",
  "Extend the existing model in place.",
  "",
  "The new field, prefixed with the module's namespace.",
  "The comodel: the model the field points to.",
  "A reason in use cannot be deleted.",
  "",
]
explanation = "Odoo adds the column `l10n_ao_exemption_reason_id` to `account_tax` when the module installs."

