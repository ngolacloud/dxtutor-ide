# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "od-u1-anatomy"
title = "Module anatomy"
level = "basic"
difficulty = 1
intro = "A module is a Python package with a manifest; Odoo finds it on its addons path."
concepts = '''
An Odoo **module** (also called an *addon*) is a folder on Odoo's **addons path** with two
mandatory files:

- `__manifest__.py` — a Python dictionary literal describing the module (read with
  `ast.literal_eval`: no code runs there);
- `__init__.py` — the Python package; it imports the module's Python sub-packages (`models`,
  `wizard`…).

```
l10n_ao/
├── __init__.py
├── __manifest__.py
├── models/        Python classes: new models and extensions of existing ones
├── views/         XML: screens, actions, menus
├── security/      access rights (CSV) and groups
├── data/          records loaded at install (XML, CSV)
├── wizard/        transient models for dialogs
└── tests/         the module's tests
```

**The manifest keys a native localization uses:**

| Key | Meaning |
|---|---|
| `name` | the display name ("Angola - Accounting") |
| `category` | a path such as `Accounting/Localizations/Account Charts`; Odoo creates the categories |
| `countries` | ISO codes (`['ao']`): Odoo offers and auto-installs the module for companies of these countries |
| `depends` | modules that must be installed first (`account`) |
| `auto_install` | a list of dependencies (`['account']`): install automatically once they are installed |
| `data` | data files loaded at install and update, in order |
| `author`, `license` | who wrote it; native modules are `LGPL-3` |
| `version` | the module's own version, prefixed by Odoo with the series (`1.0` → `18.0.1.0`) |

**Per version.** In Odoo 18 a missing `author` is silently empty; **since Odoo 19** it logs the
warning `Missing author key in manifest`. **Odoo 20's** native manifests dropped `version`
altogether (the default `1.0` applies). A version written for another series (`19.0.1.0` in Odoo
18) makes the module uninstallable.

**Installing.** `odoo -d <database> -i l10n_ao` installs a module (and its dependencies) in a
database; `-u l10n_ao` updates it after a change; `--stop-after-init` exits when done. The grader
of this course adds `--test-tags` to run tests.

Official docs: https://www.odoo.com/documentation/18.0/developer/reference/backend/module.html
(and `/19.0/`, `/20.0/`).
'''

[[unit.step]]
kind = "concept"
id = "od-c1-addons-path"
title = "Where Odoo finds modules"
points = 5
difficulty = 1
intro = '''
The addons path, the module list and the database.
'''
body = '''
Odoo looks for modules in the folders of its **addons path** (`--addons-path` or `addons_path` in
`odoo.conf`); the official Docker image reads `/mnt/extra-addons`, which is where the grader puts
your files. A module found there is not yet *installed*: installing writes its models into the
database, loads its data files and records it in `ir.module.module` (state `installed`, version,
author, licence, category, countries). The same Odoo can serve several databases, each with its
own set of installed modules.
'''

