# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "od-u2-models"
title = "Models and fields"
level = "basic"
difficulty = 2
intro = "A model is a Python class; Odoo makes the table, the columns and the constraints."
concepts = '''
A **model** is a Python class inheriting `models.Model`; its `_name` (`l10n_ao.tax.exemption.reason`)
becomes a table (`l10n_ao_tax_exemption_reason`) and its **fields** become columns:

```python
from odoo import api, fields, models
from odoo.exceptions import ValidationError

class L10nAoTaxExemptionReason(models.Model):
    _name = 'l10n_ao.tax.exemption.reason'
    _description = "Angolan Tax Exemption Reason"
    _order = 'code'

    code = fields.Char(required=True, size=3)
    name = fields.Char(string="Mention", required=True)
    tax_type = fields.Selection([('iva', "IVA"), ('is', "Imposto do Selo")], default='iva')
    active = fields.Boolean(default=True)
```

| Field | Column | Notes |
|---|---|---|
| `Char`, `Text`, `Html` | text | `size`, `translate=True` |
| `Integer`, `Float`, `Monetary` | numbers | `digits`, `currency_field` |
| `Boolean`, `Date`, `Datetime` | | `active` hides archived records |
| `Selection` | text | a list of `(value, label)` |
| `Many2one` | a foreign key | `ondelete='restrict'`/`'cascade'` |
| `One2many`, `Many2many` | the inverse / a relation table | |

**Extending a model.** `_inherit = 'account.tax'` (without `_name`) adds fields and methods to an
existing model — the core of every localization. Prefix what you add with the module's
"namespace": `l10n_ao_exemption_reason_id`.

**Display name and search.** Since Odoo 17 the record's label is the computed field
`display_name` (`@api.depends(...) def _compute_display_name(self)`), not `name_get()`;
`_rec_names_search = ['code', 'name']` makes the quick search look in both fields.

**Constraints.** `@api.constrains('field', …)` runs after create and write and raises
`ValidationError`. SQL constraints are enforced by PostgreSQL:

| Odoo 18 | Odoo 19 and 20 |
|---|---|
| `_sql_constraints = [('code_uniq', 'unique(code)', 'message')]` | `_code_uniq = models.Constraint('UNIQUE(code)', 'message')` |

In 19 and 20 the old list is *ignored* with the warning
`Model attribute '_sql_constraints' is no longer supported` — a silent loss of the constraint if
you miss the log. **Messages** to the user go through `self.env._("...")` (all three versions).

**The exemption codes.** An Angolan invoice that charges no IVA must print the reason and the legal
rule (Decreto Presidencial n.º 71/25, art. 10.º, n.º 1, f)); AGT publishes the codes in Decreto
Executivo n.º 683/25, Anexo I — Tabela 4 (IVA: M10–M24, M30–M38, M80–M86, M90–M93, M00, M02,
M04) and Tabela 5 (Imposto do Selo: S01–S03). In SAF-T AO a line at 0% must carry both the code and
the mention.

Official docs: https://www.odoo.com/documentation/18.0/developer/reference/backend/orm.html
(and `/19.0/`, `/20.0/`).
'''

[[unit.step]]
kind = "drill"
id = "od-d2-inherit"
title = "Extending account.tax"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = '''
`_inherit` without `_name`: add a field to an existing model.
'''
prompt = '''
Type the extension of `account.tax`.
'''
target = '''
from odoo import fields, models


class AccountTax(models.Model):
    _inherit = 'account.tax'

    l10n_ao_exemption_reason_id = fields.Many2one(
        'l10n_ao.tax.exemption.reason',
        ondelete='restrict',
