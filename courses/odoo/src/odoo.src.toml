    <field name="name">Assign Exemption Reason (AO)</field>
    <field name="res_model">l10n_ao.exemption.reason.assign</field>
    <field name="view_mode">form</field>
    <field name="target">new</field>
    <field name="binding_model_id" ref="account.model_account_tax"/>
    <field name="binding_view_types">list</field>
    <field name="group_ids" eval="[(4, ref('account.group_account_manager'))]"/>
</record>
'''
