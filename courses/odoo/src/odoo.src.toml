# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "od-u3-views"
title = "Views, actions and menus"
level = "basic"
difficulty = 2
intro = "XML records describe the screens; Odoo validates them at install."
concepts = '''
A **view** is a record of `ir.ui.view` whose `arch` is XML: `list`, `form`, `search`, `kanban`…
An **action** (`ir.actions.act_window`) opens a model with some views; a **menu** item points to an
action.

```xml
<record id="l10n_ao_tax_exemption_reason_view_list" model="ir.ui.view">
    <field name="name">l10n_ao.tax.exemption.reason.list</field>
    <field name="model">l10n_ao.tax.exemption.reason</field>
    <field name="arch" type="xml">
        <list>
            <field name="code"/>
            <field name="name"/>
        </list>
    </field>
</record>
```

**Syntax by version — read in each version's source and confirmed by installing:**

| | Odoo 18 | Odoo 19 | Odoo 20 |
|---|---|---|---|
| list view root | `<list>` (`<tree>` fails: *Invalid view type: 'tree'*) | `<list>` | `<list>` |
| action `view_mode` | `list,form` | `list,form` | `list,form` |
| conditions | `invisible="amount != 0"` (Python expression) | same | same |
| `attrs=`, `states=` | removed (since 17) | removed | removed |
| groups on an action | `groups_id` | `group_ids` | `group_ids` |

**Inheriting a view.** `inherit_id` names the parent and the arch uses positions:
`<field name="tax_group_id" position="after">…</field>` (also `before`, `inside`, `replace`,
`attributes`, or an `xpath`). Pick an anchor that exists in every version you support:
`tax_group_id` is in the tax form of 18, 19 and 20.

**Expressions.** `invisible`, `readonly` and `required` take Python expressions over the fields of
the record (`country_code != 'AO' or amount != 0`). The fields they use must be in the view (the
tax form already has `country_code`, invisible).

**Search views.** `<filter name="iva" domain="[('tax_type', '=', 'iva')]"/>` adds a filter;
`context="{'group_by': 'tax_type'}"` makes a group-by, written inside a plain `<group>`.

Official docs: https://www.odoo.com/documentation/18.0/developer/reference/user_interface/view_architectures.html
(and `/19.0/`, `/20.0/`).
'''

[[unit.step]]
kind = "drill"
id = "od-d3-inherit-view"
title = "Inheriting the tax form"
points = 10
difficulty = 2
placeholder_policy = "shown"
