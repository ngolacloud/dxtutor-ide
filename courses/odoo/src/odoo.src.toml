# Odoo — the official dxtutor course for Odoo (Learn P3c).
#
# A FRAMEWORK course graded in the evaluation language `odoo-module`: every challenge installs the
# learner's modules in a real Odoo 18, 19 or 20, next to a real PostgreSQL, in the private rootless
# Podman sandbox of the Learning Track (tutor_eval::odoo_check), and runs their tests. The running
# example is `l10n_ao`, an Angolan localization built the way Odoo's native ones are; the legal
# values come from a cited fact sheet (see courses/odoo/README.md). Grading never pulls: «Prepare
# course» pulls the three Odoo images and PostgreSQL, by digest, once.

id = "odoo-basics"
language = "odoo-module"
category = "framework"
subject = "odoo"
title = "Odoo: Modules and an Angolan Localization, 18 to 20"
level = "intermediate"
summary = "Write Odoo modules the native way — manifest, models, views, security, wizards, data, chart templates, taxes, fiscal positions, HR — by building l10n_ao, the Angolan localization, for Odoo 18, 19 and 20, graded in a real Odoo."

overview = '''
**Odoo** is an open-source ERP written in Python on PostgreSQL: accounting, sales, inventory, HR
and hundreds of other *modules*, each a folder of Python, XML and CSV files that Odoo loads into a
database. Writing Odoo means writing modules — and a *localization* is the module that teaches Odoo
a country: its chart of accounts, its taxes, its tax number, its provinces, its public holidays.

Odoo has no localization for **Angola**. In this course you build one, `l10n_ao`, step by step,
following the mandatory patterns of Odoo's native localizations (`l10n_mz`, `l10n_pt`, `l10n_br`):
the manifest, a model, views, access rights, a wizard, data files, the **PGC** chart template
(Plano Geral de Contabilidade), the **taxes** (IVA with its exemption codes, cativação, Imposto do
Selo, withholdings — Imposto Industrial, IAC, Predial), **fiscal positions**, the **NIF**, and then
`l10n_ao_hr`: the INSS number, the **IRT** and **INSS** computation and the **public holidays**,
plus an Enterprise payroll structure.

**Three versions, side by side.** Odoo publishes a major version every year and changes things
that matter between them: `<tree>` became `<list>` in 18; 19 removed `_sql_constraints`, renamed
`groups_id` to `group_ids`, moved the employee contract into `hr.version` and turned the fiscal
position mapping around; 20 replaced `ir.model.access` with `ir.access`, removed account groups and
`base_vat`, and dropped `version` from manifests. Every challenge exists for **Odoo 18.0, 19.0 and
20.0** — do the track of the version you use. Each is graded in that exact version, and its
instructions and solution say what differs. `courses/odoo/VERSIONS.md` (in the course's repository)
lists every difference this course relies on, each one read in that version's source.

**A design rule of the module: values are data.** Every tax rate, account, threshold, IRT bracket,
INSS rate, allowance limit and holiday is a **record** the person responsible edits in Odoo, seeded
from the law with its source and loaded with `noupdate="1"` so that edits survive updates. Python
holds only *rules*. A value the law does not settle is shipped empty and labelled «to be
confirmed», and the code refuses to compute without it, naming it — never a silent 0.

**What is not in the module, on purpose.** No accounting reports, no SAF-T AO export, no invoice
signature (RSA hash chain), no electronic invoicing with AGT, no certified numbering: those belong
to an AGT-certified invoicing layer, a separate product with legal obligations on its producer
(Decreto Executivo n.º 74/19, Decreto Presidencial n.º 312/18 and n.º 71/25, Decreto Executivo
n.º 683/25). The course says where each would plug in.

**How grading works — honestly.** A challenge's files are installed in a real Odoo with
`odoo -i <modules> --test-tags <tags> --stop-after-init`, next to a PostgreSQL, in the private
rootless Podman sandbox dxtutor creates for the Learning Track: its own storage (your Docker and
your own Podman images are never used), no network, memory, CPU and process limits, and every
container removed afterwards. Hidden tests (a small `dxt_check` module) check what you built, and
the Odoo log must be free of warnings — a native module installs cleanly. Grading never pulls: the
images below are downloaded once, pinned by digest, when you choose **Prepare course** (about
7 GB). A grading run takes from half a minute to a few minutes, mostly Odoo installing `account`.
The Enterprise payroll step runs only with your own Odoo Enterprise addons
(`DXTUTOR_ODOO_ENTERPRISE_18`/`_19`, mounted read-only); dxtutor never downloads Enterprise code.

**What you need.** Python and Odoo experience is not required, but reading Python is. Grading needs
**Podman 4.4 or newer**, rootless, on **Linux** with a systemd user session, and about 3 GB of free
memory while a step runs.

The prepared images: `docker.io/library/odoo:18.0-20261124`, `odoo:19.0-20261123`,
`odoo:20.0-20261123` and `docker.io/library/postgres:17.12` (Odoo 20 needs PostgreSQL 16 or newer).

**The legal facts.** Every rate, account, code, province and holiday comes from a fact sheet that
cites the Diário da República (Decreto n.º 82/01 — PGC; Decreto Presidencial n.º 180/19 — IVA
accounts; Código do IVA as republished by Lei n.º 14/23; Lei n.º 14/25 — OGE 2026; Decreto
Presidencial n.º 227/18 — INSS; Lei n.º 10/11 and n.º 11/18 — holidays; Lei n.º 14/24 and
n.º 8/25 — provinces; Decreto Presidencial n.º 245/21 — NIF; Decreto Executivo n.º 683/25 —
exemption codes). It is a course, not legal advice: check the law in force before using the module.

Official documentation: https://www.odoo.com/documentation/18.0/developer.html,
https://www.odoo.com/documentation/19.0/developer.html and
https://www.odoo.com/documentation/20.0/developer.html — and, for localizations,
`/developer/howtos/accounting_localization.html` under each.
'''

