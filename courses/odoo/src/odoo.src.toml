# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "od-u4-security"
title = "Security: access rights"
level = "intermediate"
difficulty = 3
intro = "No access line, no access; and Odoo 20 changed the format."
concepts = '''
Every model must say who may **read, write, create and delete** its records; a model without access
lines is closed to everyone but the superuser (Odoo 18 and 19 log a warning naming it, with a
suggested line). Rights are granted to **groups** (`base.group_user` for internal users,
`account.group_account_manager`, `hr.group_hr_manager`…) and are additive.

**Odoo 18 and 19 — `ir.model.access`**, file `security/ir.model.access.csv`:

```
id,name,model_id:id,group_id:id,perm_read,perm_write,perm_create,perm_unlink
access_reason_user,reason user,model_l10n_ao_tax_exemption_reason,base.group_user,1,0,0,0
access_reason_manager,reason manager,model_l10n_ao_tax_exemption_reason,account.group_account_manager,1,1,1,1
```

Row-level filters are separate `ir.rule` records (XML).

**Odoo 20 — `ir.access`**, file `security/ir.access.csv` (read in `base/models/ir_access.py`):

```
id,name,model_id,group_id/id,operation,domain
access_reason_user,reason user,l10n_ao.tax.exemption.reason,base.group_user,r,
access_reason_manager,reason manager,l10n_ao.tax.exemption.reason,account.group_account_manager,crud,
```

- `model_id` is the model **name**, not an external id;
- `operation` is a subset of `crud` (create, read, update, delete);
- a line **with** a group is a *permission*; a line **without** a group is a *restriction* (what a
  global record rule was), and `domain` filters the rows. One model replaces both
  `ir.model.access` and `ir.rule`.

An `ir.model.access.csv` makes an Odoo 20 install fail with `KeyError: 'ir.model.access'`; an
`ir.access.csv` means nothing to 18 or 19. **Odoo 19** also changed groups themselves
(`res.groups` gained privileges; users' `groups_id` is now `group_ids`).

**Transient models** (wizards) need access lines too.

Official docs: https://www.odoo.com/documentation/18.0/developer/reference/backend/security.html
(and `/19.0/`, `/20.0/`).
'''

[[unit.step]]
kind = "concept"
id = "od-c4-testing-rights"
title = "Testing rights as another user"
points = 5
difficulty = 2
intro = '''
`with_user` and `new_test_user`.
'''
body = '''
Tests run as the superuser, who bypasses access rights. To check rights, create users and act as
them:

```python
from odoo.exceptions import AccessError
from odoo.tests.common import new_test_user

user = new_test_user(self.env, 'ao_internal', groups='base.group_user')
reason.with_user(user).read(['code'])          # allowed
with self.assertRaises(AccessError):
    reason.with_user(user).write({'name': 'x'})  # refused
```

`new_test_user` exists in Odoo 18, 19 and 20 and hides the `groups_id`/`group_ids` rename.
'''

#@challenge s04

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "od-u5-wizards"
title = "Wizards"
level = "intermediate"
difficulty = 3
intro = "A TransientModel, a dialog and the Action menu."
concepts = '''
A **wizard** is a dialog backed by a `models.TransientModel`: its records are temporary and Odoo
removes them regularly. The usual shape:

```python
class L10nAoExemptionReasonAssign(models.TransientModel):
    _name = 'l10n_ao.exemption.reason.assign'
    _description = "Assign an Angolan Exemption Reason to Taxes"

    reason_id = fields.Many2one('l10n_ao.tax.exemption.reason', required=True)
    tax_ids = fields.Many2many('account.tax', default=lambda self: self._default_tax_ids())

    def _default_tax_ids(self):
        if self.env.context.get('active_model') == 'account.tax':
            return self.env['account.tax'].browse(self.env.context.get('active_ids', []))
        return self.env['account.tax']

    def action_assign(self):
        self.ensure_one()
        ...
        return {'type': 'ir.actions.act_window_close'}
```

- **opened from a list**: the action's `binding_model_id` (`account.model_account_tax`) and
  `binding_view_types` (`list`) put it in the *Action* menu; the selection arrives as
  `active_model` / `active_ids` in the context;
- **as a dialog**: the action's `target` is `new`; the form's `<footer>` holds the buttons —
  `type="object"` calls a method, `special="cancel"` closes;
- **restricted**: the action's groups (`groups_id` in 18, `group_ids` in 19 and 20) hide it from
  others; the access lines of the transient model refuse them anyway;
- **errors**: `UserError` for what the user did wrong, and change nothing when refusing.

Official docs: https://www.odoo.com/documentation/18.0/developer/reference/backend/actions.html
(and `/19.0/`, `/20.0/`).
'''

