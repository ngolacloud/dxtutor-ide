# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u7-networks"
title = "Networks"
level = "intermediate"
difficulty = 7
intro = "How containers reach each other: the default bridge, user-defined networks with DNS, shared namespaces, and published ports."
concepts = '''
Every container has its own **network namespace** — its own interfaces and its own `localhost`. Docker
connects containers with **networks**:

| Network | What containers get |
|---|---|
| `bridge` (the default) | a private address; they reach each other only by IP, not by name |
| a user-defined bridge (`docker network create shop`) | addresses **and DNS**: containers find each other by name |
| `--network container:<name>` | the other container's namespace: one shared `localhost` |
| `--network host` | the host's network directly (no isolation; avoid) |
| `--network none` | only a loopback interface |

On a user-defined network, `docker run --network shop --name api …` makes `api` resolvable from every
container on `shop`, so a client uses `http://api:8080`. Docker Compose creates one such network per
project, which is why services find each other by service name. `docker network create --internal`
makes a network with no route out.

**Publishing ports.** `-p 8080:8080` forwards a host port to the container; `-p 127.0.0.1:8080:8080`
only on the loopback interface. `EXPOSE` publishes nothing: it documents the port (and `-P` publishes all
exposed ports to random host ports). A server must listen on `0.0.0.0` inside the container — bound to
`127.0.0.1`, it is unreachable from published ports and other containers.

**Sidecars.** Two containers sharing one namespace (`--network container:app`) talk over `localhost`:
the pattern behind Kubernetes Pods — a log shipper, a proxy, or a health probe next to the app.

**In the grader** there are no user-defined networks and no published ports: rootless networks share
one namespace per user and would collide with your own, and published ports would open on your machine.
The checks use `--network none` and `--network container:<name>`. Try the user-defined network version
on your own Docker.

Official docs: https://docs.docker.com/engine/network/
'''

[[unit.step]]
kind = "concept"
id = "dk-c7-networks"
title = "Names need a user-defined network"
points = 5
difficulty = 1
intro = '''
Why `http://api:8080` works in Compose but not on the default bridge.
'''
body = '''
Docker's embedded DNS server answers container names only on **user-defined** networks. On the default
`bridge`, `api` resolves to nothing; in a shared namespace there is no DNS at all, but `localhost` is
the other container. So the right URL depends on the deployment — keep it in an environment variable.
'''

