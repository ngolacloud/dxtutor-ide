# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u6-volumes"
title = "Volumes"
level = "intermediate"
difficulty = 6
intro = "Containers are replaced; data in a volume stays — if the user who writes it owns it."
concepts = '''
A container's writable layer is deleted with the container. Data that must survive an upgrade (you
replace the container with one from a new image), a crash or a `docker rm` goes in a **volume**:

```sh
docker volume create notes
docker run --rm -v notes:/var/lib/notes notes add "buy milk"
docker run --rm -v notes:/var/lib/notes notes list
```

| Kind | Syntax | Lives in |
|---|---|---|
| named volume | `-v notes:/var/lib/notes` | Docker's storage (`docker volume ls`) |
| bind mount | `-v /home/me/notes:/var/lib/notes` | that host folder |
| tmpfs | `--tmpfs /tmp` | memory, gone when the container stops |

The long form `--mount type=volume,source=notes,target=/var/lib/notes` says the same with names instead
of positions. Named volumes are portable and managed by Docker; bind mounts tie the container to one
machine's folders (great for development, risky in production). The grader only uses named volumes.

**`VOLUME` in a Dockerfile** marks a path as data. A container started without a volume there gets a new
**anonymous** volume, so its writes never land in the container layer; `docker run --rm` deletes that
anonymous volume with the container. Only a named volume carries data from one container to the next.

**Ownership — Docker's rule.** When an empty named volume is mounted for the first time, Docker copies
into it what the image has at that path, **with its ownership**. If the image has no such folder, the
volume's root belongs to **root**. Either way, a non-root process can only write there if the image
created the folder and gave it to that user:

```dockerfile
RUN mkdir -p /var/lib/notes && chown 1001:1001 /var/lib/notes
USER 1001
VOLUME /var/lib/notes
```

(Podman, which grades this course, differs in one case: when the path does not exist in the image it
gives the new volume to the container's user. The `mkdir` + `chown` above works in both.)

`-v notes:/var/lib/notes:ro` mounts read-only — for a container that only reads another's data.

Official docs: https://docs.docker.com/engine/storage/volumes/
'''

[[unit.step]]
kind = "concept"
id = "dk-c6-volumes"
title = "Upgrade by replacing the container"
points = 5
difficulty = 1
intro = '''
Why a container should keep nothing that matters in its own layer.
'''
body = '''
Upgrading a containerised service is: pull the new image, remove the old container, start a new one.
Everything in the old container's writable layer is gone. With the data in a named volume, the new
container mounts the same volume and finds it all — that is the whole upgrade.
'''

[[unit.step]]
kind = "drill"
id = "dk-d6-volume"
title = "A data folder ready for a volume"
