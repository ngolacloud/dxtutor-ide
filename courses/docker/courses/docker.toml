'''

[unit.step.project.solution]
"Dockerfile" = '''
FROM python:3.15.2-alpine3.24
WORKDIR /app
COPY messages.txt compile_messages.py ./
RUN python -m venv /opt/tools \
 && /opt/tools/bin/python compile_messages.py \
 && rm -rf /opt/tools
COPY . .
USER 10001
CMD ["python", "app.py"]
'''
".dockerignore" = '''
drafts/
Dockerfile
.dockerignore
'''
