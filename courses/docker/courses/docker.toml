# Docker — the official dxtutor course for Docker (Learn P3a).
#
# A TOOL course graded LIVE. The learner writes Dockerfiles (and a compose file) in Docker's syntax;
# the hidden `checks.toml` of each challenge writes its commands as `docker …`, but they run in the
# same private rootless Podman sandbox as the Podman course (tutor_core::podcmd: Podman's
# Docker-compatible `build`/`run`), never through a Docker daemon. `docker build` always builds
# Docker-format images, as Docker does. Grading never pulls: «Prepare course» pulls the three base
# images below, by digest, once. Written against the Docker documentation for Docker Engine 29
# and graded with Podman 4.9.3 (Buildah 1.33).

id = "docker-basics"
language = "dockerfile"
category = "tool"
subject = "docker"
title = "Docker: Dockerfiles That Ship"
level = "beginner"
summary = "Write Dockerfiles and run containers the way production expects: layers, instructions, ENTRYPOINT and CMD, multi-stage builds, non-root users, volumes, networks, Compose, health checks, size and caching — Docker syntax, graded live in a rootless sandbox."

overview = '''
**Docker** made containers mainstream: a **Dockerfile** describes how to build an image, `docker build`
turns it into layers, and `docker run` starts containers from it on any machine with a container
engine. The Dockerfile format and the `docker` command line became the common language of
containers — Podman, Buildah, Kubernetes builders and CI systems all read the same files.

This course teaches you to write Dockerfiles that build small, safe images, and to run them the way
production expects: as a non-root user, with data in volumes, health checks that mean something,
Compose files a reviewer can trust, and builds that reuse their cache. Every challenge is graded
**live**: your Dockerfile is built and run, and hidden checks look at what came out — the output, the
image configuration, the files inside the image, a port answering, a volume keeping its data.

What you will learn, in order:

1. **images and layers** — what an image is, tags and digests, where layers come from;
2. **Dockerfile instructions** — `FROM`, `WORKDIR`, `COPY`, `RUN`, `ENV`, `ARG`, `LABEL`;
3. **ENTRYPOINT and CMD** — exec form, overriding at run time, detached containers and logs;
4. **multi-stage builds** — compile with the SDK, ship only the binary;
5. **users and least privilege** — a fixed non-root UID, read-only code, no capabilities;
6. **volumes** — data that outlives the container, and who owns it;
7. **networks** — namespaces, the default bridge, user-defined networks and DNS;
8. **Compose** — a multi-service application in one `compose.yaml`;
9. **health checks** — `HEALTHCHECK` and what `docker ps` does with it;
10. **image size and caching** — layer order, `.dockerignore`, clean up in the same layer.

**How grading works — honestly.** The course teaches **Docker**: its Dockerfile syntax, its
`docker` commands and its documentation. But grading **does not use Docker**: a Docker daemon runs as
root, and handing it your exercises would make the grader root-equivalent on your machine. Instead,
dxtutor grades in a **private rootless Podman sandbox**, using Podman's Docker-compatible `build` and
`run` (the check reports show the commands as `docker …`). The sandbox has its own image storage (your
own Docker and Podman images and containers are never read or touched), resource limits, no Linux
capabilities, `--network none`, and removes everything it created afterwards. It **never pulls an
image**: the base images below are downloaded once, pinned by digest, when you choose **Prepare
course** (you approve the exact commands first).

Where Docker and the grader differ, the unit says so. The main differences: Docker builds with
**BuildKit**, the grader with **Buildah** (BuildKit-only features such as `RUN --mount=type=secret` with
`docker build --secret`, or Dockerfile heredocs, are not graded); `docker image inspect` and Podman's
inspect lay out a few fields differently; and the sandbox publishes no ports and creates no
user-defined networks (a check reaches a service from a second container that shares its network
namespace). Compose files are checked by reading them, not by `docker compose up`.

**What you need.** To grade: **Podman 4.4 or newer**, rootless, on **Linux** with a systemd user session
(https://podman.io/docs/installation; validated against **Podman 4.9.3**). Docker itself is not needed
for grading — install Docker Engine (https://docs.docker.com/engine/install/) to try the commands on
your own. On macOS and Windows Podman runs in a VM, which the grader does not drive: the lessons
apply, grading does not run there.

The prepared base images: `alpine:3.24.4`, `python:3.15.2-alpine3.24` and `golang:1.27.4-alpine3.24`
(all from Docker Hub, `docker.io/library/…`).

Official documentation: https://docs.docker.com/ — the Dockerfile reference
(https://docs.docker.com/reference/dockerfile/) and the pages linked in each unit.
'''

[build]
prepare = true
timeout_secs = 300
dependencies = [
  "docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf",
  "docker.io/library/python:3.15.2-alpine3.24@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd",
  "docker.io/library/golang:1.27.4-alpine3.24@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280",
]

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u1-images"
title = "Images and layers"
level = "basic"
difficulty = 1
intro = "An image is a stack of read-only layers plus a configuration; a container is that image running, with a writable layer on top."
concepts = '''
An **image** is a stack of **layers** — each one the filesystem changes of one build step — plus a
**configuration**: the command to run, environment variables, working directory, user, exposed ports
and labels. A **container** is an instance of an image: Docker stacks the layers read-only, adds a
thin writable layer, and starts the configured process. Many containers can run from one image; when
a container is removed, its writable layer goes with it.

**Where layers come from.** In a Dockerfile, `RUN`, `COPY` and `ADD` create layers. `FROM` brings the
base image's layers. `CMD`, `ENTRYPOINT`, `ENV`, `WORKDIR`, `LABEL`, `USER` and `EXPOSE` only change
the configuration. `docker history <image>` lists the steps and their sizes; `docker image inspect
<image>` prints the configuration and the layer digests (`RootFS.Layers`) as JSON.

**Names, tags and digests.** `alpine:3.24.4` is short for `docker.io/library/alpine:3.24.4`: registry
`docker.io` (Docker Hub), repository `library/alpine` (the official images), tag `3.24.4`. A tag can be
moved by its publisher; a **digest** (`alpine@sha256:…`) names one exact image forever. Pin at least an
exact tag in a Dockerfile — never `latest` — and a digest where reproducibility matters.

**Pull, build, run.** `docker pull` downloads an image, `docker build -t name .` builds one from the
Dockerfile in `.` (the **build context**), `docker run --rm name` starts a container and removes it
when it exits, `docker images` lists what you have.

| Command | What it does |
|---|---|
| `docker build -t banner .` | build `./Dockerfile` and tag the image `banner` |
| `docker run --rm banner` | run it once |
| `docker history banner` | the steps (and layers) that made it |
| `docker image inspect banner` | its configuration, as JSON |

**In this course** the same commands run on Podman's Docker-compatible CLI, in a private sandbox, with
the base images already prepared (nothing is pulled while grading).

Official docs: https://docs.docker.com/get-started/docker-concepts/building-images/understanding-image-layers/
and https://docs.docker.com/reference/cli/docker/image/inspect/
'''

[[unit.step]]
kind = "concept"
id = "dk-c1-images"
title = "What docker build produces"
points = 5
difficulty = 1
intro = '''
Layers for the files, configuration for the rest.
'''
body = '''
```dockerfile
FROM alpine:3.24.4                      # Alpine's layer
COPY banner.txt /usr/share/banner.txt   # + one layer
CMD ["cat", "/usr/share/banner.txt"]    # configuration only
```

`docker build -t banner .` produces an image with two layers and a configuration whose `Cmd` is
`["cat", "/usr/share/banner.txt"]`. `docker run --rm banner` prints the banner and removes the
container.

In the challenge you build that image and inspect it the way the grader does.
'''

[[unit.step]]
kind = "drill"
