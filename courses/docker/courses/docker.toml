  "The default command, in exec form (a JSON list).",
]
explanation = "`docker build -t hello .` then `docker run --rm hello` prints `hello, docker`."

[[unit.step]]
kind = "drill"
id = "dk-d1-layers"
title = "Which lines add layers"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
Files change in layers; the rest is configuration.
'''
prompt = '''
Type the Dockerfile and notice which instructions create a layer.
'''
target = '''
