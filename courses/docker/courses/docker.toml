    restart: unless-stopped
    networks:
      - front
      - back
  cache:
    image: redis:8.12.0-alpine3.23
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - cache-data:/data
    networks:
      - back

networks:
  front: {}
  back:
    internal: true

volumes:
  cache-data: {}
'''

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u9-health"
title = "Health checks"
level = "advanced"
difficulty = 9
intro = "HEALTHCHECK turns 'the process runs' into 'the service answers', and Docker shows it in docker ps."
concepts = '''
A container is `Up` while its process runs — even if the application inside has hung. A
**`HEALTHCHECK`** runs a command in the container on a schedule; exit code 0 means healthy, 1 unhealthy:

```dockerfile
HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \
  CMD wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1
```

| Option | Default | Meaning |
|---|---|---|
| `--interval` | 30s | between checks |
| `--timeout` | 30s | a slower check fails |
| `--start-period` | 0s | failures during start-up do not count |
| `--start-interval` | 5s | check interval during the start period (Docker Engine 25+) |
| `--retries` | 3 | consecutive failures before `unhealthy` |

`docker ps` shows `(healthy)`, `(unhealthy)` or `(health: starting)`; `docker inspect --format
'{{json .State.Health}}' web` shows the last results. Compose waits on it (`condition: service_healthy`)
and Swarm replaces unhealthy tasks; plain `docker run` only reports it (`--restart` reacts to exits, not
to health). Kubernetes ignores `HEALTHCHECK` and uses probes — but point them at the same endpoint.

**Good checks** test the service the way a client does (an HTTP request to a cheap endpoint), have a
timeout shorter than the interval, and only use tools that exist in the image (busybox `wget` on Alpine;
a `scratch` image needs its own binary to support a check command, e.g. `CMD ["/app", "healthcheck"]`).
`HEALTHCHECK NONE` disables a check inherited from the base image.

**The grader** builds Docker-format images (as `docker build` does), so the `HEALTHCHECK` is kept. It
runs the check itself with `healthcheck run` instead of waiting for the timer. One display difference:
Docker's `docker image inspect` shows the check under `Config.Healthcheck`, while the inspect the grader
reads (Podman's) shows it at the top level, `Healthcheck`. (`--start-interval` is the newest option;
the challenge does not use it.)

Official docs: https://docs.docker.com/reference/dockerfile/#healthcheck
'''

[[unit.step]]
kind = "concept"
id = "dk-c9-health"
title = "What docker ps can tell you"
points = 5
difficulty = 1
intro = '''
The difference a health check makes in the status column.
'''
body = '''
| Without HEALTHCHECK | With HEALTHCHECK |
|---|---|
| `Up 3 minutes` | `Up 3 minutes (healthy)` |
| `Up 3 minutes` (hung) | `Up 3 minutes (unhealthy)` |

Only the second column lets Compose, Swarm, a load balancer script or a human tell a working service
from a stuck one.
'''

