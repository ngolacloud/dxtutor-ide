# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u8-compose"
title = "Docker Compose"
level = "advanced"
difficulty = 8
intro = "Describe a multi-container application in compose.yaml: services, builds, dependencies, health, volumes, networks and hardening."
concepts = '''
**Docker Compose** (`docker compose`, the v2 plugin) runs an application described in `compose.yaml`:

```yaml
services:
  api:
    build: ./api
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://cache:6379/0
    depends_on:
      cache:
        condition: service_healthy
  cache:
    image: redis:8.12.0-alpine3.23
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
```

`docker compose up -d` builds what needs building, creates a network for the project (services resolve
each other by **service name**: `cache`), creates the volumes, and starts the services in dependency
order; `docker compose ps`, `logs`, `down` (`-v` also removes the volumes) manage them.

| Key | Meaning |
|---|---|
| `build` / `image` | build from a folder, or run a pinned image |
| `ports` | `"HOST:CONTAINER"`, quoted |
| `environment` | variables (a mapping or a list); `${VAR}` comes from the shell or `.env` |
| `depends_on.<svc>.condition` | `service_started`, `service_healthy`, `service_completed_successfully` |
| `healthcheck` | the same as `HEALTHCHECK`, per service |
| `volumes` / `networks` | named volumes and networks, declared at the top level too |
| `restart` | `no`, `on-failure`, `unless-stopped`, `always` |
| `read_only`, `user`, `cap_drop`, `security_opt` | the hardening flags of `docker run` |

**Production habits:** pin image tags; publish only the services users reach (the cache gets no
`ports`); put internal services on an `internal: true` network; run as a non-root `user` with a
`read_only` root filesystem and `cap_drop: [ALL]`; persist data in named volumes; wait for health, not
for "started".

**In this course** the compose file is graded by **reading it** — every service, dependency, network,
volume and hardening option, the way a reviewer would. `docker compose up` is not run: the grader never
uses Docker, and would publish ports and create networks on your machine. The api service's image is
built and started for real. With Podman, the same file runs with `podman compose`.

Official docs: https://docs.docker.com/compose/ and https://docs.docker.com/reference/compose-file/
'''

[[unit.step]]
kind = "concept"
id = "dk-c8-compose"
title = "Started is not ready"
points = 5
difficulty = 1
intro = '''
Why `depends_on` alone does not stop an API from crashing at startup.
'''
body = '''
`depends_on: [cache]` only orders the starts: the API starts as soon as the cache **process** started —
often before Redis accepts connections — and fails its first request. `depends_on: {cache: {condition:
service_healthy}}` waits until the cache's health check passes. Pair every dependency that takes time to
start with a health check.
'''

