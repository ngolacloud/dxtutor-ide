[[unit]]
id = "dk-u10-size"
title = "Image size and build cache"
level = "advanced"
difficulty = 10
intro = "Order instructions for the cache, keep the context lean with .dockerignore, and clean up in the layer that made the mess."
concepts = '''
**Cache rules.** Each instruction is cached by its text, its parent layer and — for `COPY`/`ADD` — the
checksums of the files it copies. The first instruction whose inputs changed runs again, **and so does
everything after it**. Order the Dockerfile from rarely-changing to often-changing: base, system
packages, dependency manifests, the dependency install, then the code. `docker build` prints `CACHED`
(BuildKit) for reused steps; the grader's builder prints `--> Using cache`.

**`.dockerignore`.** The build context — every file under `.` — is sent to the builder, and `COPY . .`
copies all of it. Exclude what the image does not need: `.git`, `node_modules`, test data, local
`.env` files, notes. It speeds up builds, avoids cache misses from irrelevant changes, and keeps
secrets out of images. (Patterns are relative to the context root: `drafts/`, `**/*.log`.)

**Layers only grow.** A file created in one `RUN` and deleted in the next is still in the first layer.
Clean up in the same instruction that made the mess:

```dockerfile
RUN python -m venv /opt/tools \
 && /opt/tools/bin/python compile_messages.py \
 && rm -rf /opt/tools
```

For package managers: `apk add --no-cache`, `apt-get … && rm -rf /var/lib/apt/lists/*`,
`pip install --no-cache-dir`. For build toolchains: a multi-stage build (unit 4).

**BuildKit extras** — cache mounts (`RUN --mount=type=cache,target=/root/.cache/pip`), `COPY --link`,
remote cache export — speed up builds further. The grader's builder supports cache mounts but this
course does not rely on them.

`docker image ls` and `docker history --no-trunc` show where the size is; `docker image inspect --format
'{{.Size}}'` gives the bytes.

Official docs: https://docs.docker.com/build/cache/ and https://docs.docker.com/build/building/best-practices/
'''

[[unit.step]]
kind = "concept"
id = "dk-c10-size"
title = "A rebuild should cost what changed"
points = 5
difficulty = 1
intro = '''
The cost of one changed line, by instruction order.
'''
body = '''
If changing one line of application code re-runs the dependency install, the Dockerfile is in the
wrong order. Copy the dependency manifest first, install, then copy the code: the slow step stays cached
until the dependencies change. A `.dockerignore` makes sure that "the code" means only the code.
'''

[[unit.step]]
kind = "drill"
