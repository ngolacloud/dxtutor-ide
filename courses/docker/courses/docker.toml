[[unit.step]]
kind = "challenge"
id = "dk-p9-health"
title = "A health check that tells the truth"
points = 50
difficulty = 5
intro = '''
Fix a health check that tests the wrong thing, and tune its timing.
'''
instructions = '''
`server.py` serves `/` and a health endpoint `/healthz` on port **3000** (which answers 503 while the
file `/tmp/maintenance` exists). The starter's health check only checks that a file exists — it would
say "healthy" while the service fails. Fix the `Dockerfile`
so that:

- the `HEALTHCHECK` fetches `http://127.0.0.1:3000/healthz` (busybox `wget`), with `--interval=30s`,
  `--timeout=5s`, `--start-period=10s` and `--retries=3`;
- the service runs as UID 10001, `EXPOSE`s 3000 and runs `python server.py` from `/app`.

The grader builds it, starts it, runs the health check until it passes and expects `healthy`; then
puts the server in maintenance (from then on `/healthz` answers 503) and expects the check to fail.
'''

[unit.step.project]
main = "Dockerfile"
readonly = ["server.py"]
explanation = '''
A check must exercise the service: an HTTP request to `/healthz` fails as soon as the service reports
a problem (or stops answering, thanks to the timeout), while `test -f` kept passing. The grader reads the timings in nanoseconds from the image
(`Interval: 30000000000`).
'''

[unit.step.project.starter]
"Dockerfile" = '''
FROM python:3.15.2-alpine3.24
WORKDIR /app
COPY server.py .
USER 10001
EXPOSE 3000
HEALTHCHECK CMD test -f /app/server.py
CMD ["python", "server.py"]
'''
"server.py" = '''
import http.server
import os


class Handler(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        if self.path == "/healthz" and os.path.exists("/tmp/maintenance"):
            body, status = b"maintenance\n", 503
        elif self.path == "/healthz":
            body, status = b"ok\n", 200
        elif self.path == "/":
            body, status = b"hello\n", 200
        else:
            body, status = b"not found\n", 404
        self.send_response(status)
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

    def log_message(self, fmt, *args):
        pass


http.server.ThreadingHTTPServer(("0.0.0.0", 3000), Handler).serve_forever()
'''

