[[unit.step]]
kind = "challenge"
id = "dk-p6-notes"
title = "Notes that survive the container"
points = 40
difficulty = 4
intro = '''
Make a non-root command-line tool keep its data in a named volume.
'''
instructions = '''
`notes.py` stores notes in `/var/lib/notes/notes.txt`: `notes.py add TEXT…` appends one, `notes.py list`
prints them numbered. Write the `Dockerfile` so that:

- it starts from `python:3.15.2-alpine3.24` and copies `notes.py` to `/app/notes.py`;
- it runs as a non-root user with UID **1001**;
- `/var/lib/notes` exists in the image, is **owned by UID 1001**, and is declared with `VOLUME`;
- the entrypoint is `python /app/notes.py` and the default argument is `list`.

The grader creates a named volume `notes`, adds two notes in two separate containers, and lists them
in a third.
'''

[unit.step.project]
main = "Dockerfile"
readonly = ["notes.py"]
explanation = '''
The starter's `mkdir` left `/var/lib/notes` owned by root, and a new volume copies that ownership, so
UID 1001 could not write. `chown 1001` in the image fixes it; `VOLUME` documents the path and keeps
writes out of the container layer even without `-v`.
'''

[unit.step.project.starter]
"Dockerfile" = '''
FROM python:3.15.2-alpine3.24
RUN mkdir -p /var/lib/notes
COPY notes.py /app/notes.py
USER 1001
ENTRYPOINT ["python", "/app/notes.py"]
CMD ["list"]
'''
"notes.py" = '''
import sys
from pathlib import Path

store = Path("/var/lib/notes/notes.txt")
args = sys.argv[1:] or ["list"]
if args[0] == "add" and len(args) > 1:
    with store.open("a") as f:
        f.write(" ".join(args[1:]) + "\n")
    print("added")
elif args[0] == "list":
    lines = store.read_text().splitlines() if store.exists() else []
    for n, line in enumerate(lines, 1):
        print(f"{n}. {line}")
    print(f"{len(lines)} notes")
else:
    sys.exit("usage: notes add TEXT... | notes list")
'''

