- it runs as UID 1001, with `python /app/probe.py` by default.

The grader builds both images, starts `app`, runs the probe beside it (it must print `probe ok: pong`)
and runs the probe alone (it must fail: in its own namespace nothing listens).
'''

[unit.step.project]
main = "probe/Dockerfile"
readonly = ["app/Dockerfile", "app/app.py", "probe/probe.py"]
