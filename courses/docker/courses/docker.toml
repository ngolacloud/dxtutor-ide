'''

[unit.step.project.starter]
"probe/Dockerfile" = '''
FROM python:3.15.2-alpine3.24
COPY probe.py /app/probe.py
ENV TARGET=http://app:8080/ping
CMD ["python", "/app/probe.py"]
'''
"probe/probe.py" = '''
import os
import sys
import urllib.request

target = os.environ.get("TARGET", "")
try:
    with urllib.request.urlopen(target, timeout=3) as response:
        print("probe ok:", response.read().decode().strip())
except (OSError, ValueError) as error:
    sys.exit(f"probe failed for {target!r}: {error}")
'''
"app/Dockerfile" = '''
FROM python:3.15.2-alpine3.24
COPY app.py /app/app.py
USER 1001
EXPOSE 8080
CMD ["python", "/app/app.py"]
'''
"app/app.py" = '''
import http.server


class Handler(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        ok = self.path == "/ping"
        body = b"pong\n" if ok else b"not found\n"
        self.send_response(200 if ok else 404)
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)


http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
'''

