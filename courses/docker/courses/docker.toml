[[unit.step]]
kind = "challenge"
id = "dk-p3-slug"
title = "A slug generator in a container"
points = 30
difficulty = 3
intro = '''
Package a small command-line tool so the image behaves exactly like the command.
'''
instructions = '''
`slug.py` turns its arguments into a URL slug (`Hello World` → `hello-world`), or prints its usage with
no arguments or `--help`. Write the `Dockerfile` so that:

- it starts from `python:3.15.2-alpine3.24` and copies `slug.py` to `/app/slug.py`;
- the **entrypoint** is `python /app/slug.py`, in exec form, and the **default arguments** are `--help`;
- `docker run --rm slug Hello Docker World` prints `hello-docker-world`;
- `docker run --rm --entrypoint python slug -c "…"` can still run Python directly.

The grader also runs it detached (`docker run -d --name job slug Ship It`) and reads `docker logs job`.
'''

[unit.step.project]
main = "Dockerfile"
readonly = ["slug.py"]
explanation = '''
`ENTRYPOINT` + `CMD` in exec form: the arguments of `docker run` replace only `CMD`. The starter's
shell-form `ENTRYPOINT` ignored every argument.
'''

[unit.step.project.starter]
"Dockerfile" = '''
FROM python:3.15.2-alpine3.24
COPY slug.py /app/slug.py
ENTRYPOINT python /app/slug.py
'''
"slug.py" = '''
import re
import sys

args = sys.argv[1:]
if not args or args == ["--help"]:
    print("usage: slug TEXT...")
    sys.exit(0)
print(re.sub(r"[^a-z0-9]+", "-", " ".join(args).lower()).strip("-"))
'''

