USER 1001
VOLUME /srv/uploads
CMD ["python", "/app/upload.py"]
'''
line_comments = [
  "The base image.",
  "A non-root user…",
  "…the uploads folder…",
  "…owned by that user (copied into a new volume on first use).",
  "The code, owned by root.",
  "Run as the user.",
  "Declare the data path.",
  "The program.",
]
explanation = "`docker run -v uploads:/srv/uploads img` keeps the uploads across containers and image upgrades."

