  "The dependency list.",
  "Compilers as a removable virtual package, without apk's index cache…",
  "…build and install the packages, without pip's cache…",
  "…remove the compilers…",
  "…and the list: nothing temporary reaches the layer.",
]
explanation = "Split into four RUN lines, the compilers would stay in the image even after `apk del`."

[[unit.step]]
kind = "challenge"
id = "dk-p10-messages"
title = "A lean, cache-friendly build"
points = 60
difficulty = 5
intro = '''
Reorder a slow build, keep drafts out of the context, and stop a throw-away tool from bloating the image.
'''
instructions = '''
`compile_messages.py` turns `messages.txt` into `messages.json`, using a throw-away virtual environment
in `/opt/tools`; `app.py` prints a greeting from `messages.json`. Fix the `Dockerfile` and
`.dockerignore` so that:

- the slow step (create the venv, run `compile_messages.py` with its Python, delete the venv) is **one**
  `RUN`, so the image stays under **65 MB** (the base is ~56 MB; the venv alone would add ~14 MB);
- that step comes **before** the rest of the code is copied and only needs `messages.txt` and
  `compile_messages.py`: after a change to `app.py`, the grader rebuilds and expects that step to come
  from the cache;
- `COPY . .` (the rest, into `/app`) stays, but `.dockerignore` keeps `drafts/` out of the image;
- the program runs as UID 10001 with `python app.py` in `/app`.
'''

[unit.step.project]
main = "Dockerfile"
readonly = ["app.py", "compile_messages.py", "messages.txt", "drafts/ideas.md"]
explanation = '''
Deleting the venv in a later `RUN` hides it but keeps its bytes; deleting it in the same `RUN` keeps it
out of every layer. Copying only the step's inputs first means `app.py` changes invalidate just the
final `COPY . .`. `.dockerignore` removes `drafts/` from the context, so `COPY . .` cannot copy it.
'''

[unit.step.project.starter]
"Dockerfile" = '''
FROM python:3.15.2-alpine3.24
WORKDIR /app
COPY . .
RUN python -m venv /opt/tools && /opt/tools/bin/python compile_messages.py
RUN rm -rf /opt/tools
USER 10001
CMD ["python", "app.py"]
'''
".dockerignore" = '''
# Files and folders the build does not need (one pattern per line).
'''
"app.py" = '''
import json
from pathlib import Path

messages = json.loads(Path("/app/messages.json").read_text())
print(messages["greeting"], f"({len(messages)} messages)")
'''
"compile_messages.py" = '''
import json
from pathlib import Path

pairs = (line.split("=", 1) for line in Path("messages.txt").read_text().splitlines() if "=" in line)
messages = {key.strip(): value.strip() for key, value in pairs}
Path("messages.json").write_text(json.dumps(messages))
print("compiled", len(messages), "messages")
'''
"messages.txt" = '''
greeting = Hello from a lean image
farewell = Goodbye
error = Something went wrong
'''
"drafts/ideas.md" = '''
# Drafts — not for the image

- rename the greeting
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["docker", "build", "-t", "messages", "."]
message = "The Dockerfile must build."

[[run]]
cmd = ["docker", "run", "--rm", "messages"]
output_contains = ["Hello from a lean image (3 messages)"]
message = "The program prints the greeting from /app/messages.json."

[[run]]
