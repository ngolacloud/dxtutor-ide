COPY slug.py /app/slug.py
ENTRYPOINT ["python", "/app/slug.py"]
CMD ["--help"]
'''

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u4-multistage"
title = "Multi-stage builds"
level = "intermediate"
difficulty = 4
intro = "Build with the whole SDK in one stage, ship only the result from another."
concepts = '''
A Dockerfile can have several `FROM` lines. Each starts a **stage**; only the last one becomes the
image, and a stage copies files from an earlier one with `COPY --from=<name>`:

```dockerfile
FROM golang:1.27.4-alpine3.24 AS builder
ARG VERSION=dev
WORKDIR /src
COPY . .
RUN CGO_ENABLED=0 go build -ldflags="-X main.version=${VERSION}" -o /out/app .

FROM scratch
COPY --from=builder /out/app /app
ENTRYPOINT ["/app"]
```

The `golang` image is about 270 MB; the shipped image is the binary, a couple of megabytes. Nothing from
the build stage — compiler, sources, caches, anything used while building — reaches the final image
unless it is copied.

**Stage names and targets.** Name stages (`AS builder`) and copy by name. `docker build --target builder
.` stops at a stage: useful to debug the build, or to run the test suite in a `test` stage in CI.
Build arguments declared in a stage (`ARG VERSION`) are visible only in that stage.

**Choosing the final base.** `scratch` is empty — perfect for a static binary (`CGO_ENABLED=0` in Go).
A program that needs a C library, CA certificates or time-zone data needs a small base instead: `alpine`,
or a distroless image. Whatever you choose, the build tools stay behind.

**Injecting a version.** Go's linker sets a package variable at build time: `-ldflags "-X
main.version=1.2.3"`. With an `ARG`, `docker build --build-arg VERSION=1.2.3` stamps the binary.

BuildKit (Docker) builds independent stages in parallel and skips stages the target does not need;
Buildah (the grader) builds them in order. The result is the same image.

Official docs: https://docs.docker.com/build/building/multi-stage/
'''

[[unit.step]]
kind = "concept"
id = "dk-c4-multistage"
title = "The SDK is not part of the product"
points = 5
difficulty = 1
intro = '''
What a single-stage image ships that a multi-stage one does not.
'''
body = '''
A single-stage `FROM golang` image ships the compiler, the module cache, your source code and an
operating system, to run one binary. Every one of those is something to download, store, scan and
patch. A multi-stage build ships the binary — and the build stage still exists, for `--target` and for
CI.
'''

[[unit.step]]
kind = "drill"
id = "dk-d4-stages"
title = "Builder and runtime"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = '''
Two named stages and a COPY --from.
'''
prompt = '''
Type the multi-stage Dockerfile of a static Go service.
'''
target = '''
FROM golang:1.27.4-alpine3.24 AS builder
WORKDIR /src
COPY go.mod main.go ./
RUN CGO_ENABLED=0 go build -o /out/service .

FROM scratch
COPY --from=builder /out/service /service
USER 65532:65532
ENTRYPOINT ["/service"]
'''
line_comments = [
  "The build stage, named builder.",
  "Work in /src.",
  "The module file and the code.",
  "A static binary.",
  "",
  "An empty final image.",
  "Only the binary crosses over.",
  "Not root, by number (scratch has no /etc/passwd).",
  "Run it directly.",
]
explanation = "`docker build --target builder .` stops after the first stage."

[[unit.step]]
kind = "drill"
id = "dk-d4-test-stage"
title = "A test stage for CI"
points = 10
difficulty = 3
placeholder_policy = "shown"
intro = '''
Run the tests in a stage of their own; the product image does not include them.
'''
prompt = '''
Type the Dockerfile with build, test and runtime stages.
'''
target = '''
FROM golang:1.27.4-alpine3.24 AS builder
WORKDIR /src
COPY . .
RUN CGO_ENABLED=0 go build -o /out/app .

FROM builder AS test
RUN go test ./...

FROM alpine:3.24.4
COPY --from=builder /out/app /usr/local/bin/app
CMD ["app"]
'''
line_comments = [
  "Build stage.",
  "Work in /src.",
  "The sources.",
  "Build the binary.",
  "",
  "A stage built FROM another stage…",
  "…that runs the tests: `docker build --target test .` in CI.",
  "",
  "The runtime stage.",
  "Only the binary.",
  "The default command.",
]
explanation = "Building the final image does not need the `test` stage; BuildKit skips it, and `--target test` runs it."

[[unit.step]]
kind = "challenge"
id = "dk-p4-version"
title = "A stamped binary in a tiny image"
points = 40
difficulty = 4
intro = '''
Rewrite a single-stage Go image as a multi-stage build that stamps the version into the binary.
'''
instructions = '''
`main.go` prints `app <version>`, where `version` is a package variable (`dev` unless set at link
time). Rewrite the `Dockerfile` as a **multi-stage** build:

- a stage named **`builder`** from `golang:1.27.4-alpine3.24` that builds a **static** binary from
  `go.mod` and `main.go`, with a build argument **`VERSION`** (default `dev`) passed to the linker:
  `-ldflags "-X main.version=${VERSION}"`;
- a final stage **`FROM scratch`** with only the binary, at `/app`, run with `ENTRYPOINT ["/app"]`;
- `docker build --build-arg VERSION=1.2.3 -t app .` then `docker run --rm app` prints `app 1.2.3`;
- the image is under **5 MB**, with a single layer.

The grader also builds `--target builder` and runs `go version` in it.
'''

[unit.step.project]
main = "Dockerfile"
readonly = ["go.mod", "main.go"]
explanation = '''
`ARG VERSION` belongs to the builder stage, where the linker uses it; the final stage needs nothing but
the binary. `CGO_ENABLED=0` makes the binary static, so it runs in `scratch`.
'''

[unit.step.project.starter]
"Dockerfile" = '''
FROM golang:1.27.4-alpine3.24
WORKDIR /src
COPY go.mod main.go ./
RUN go build -o /usr/local/bin/app .
CMD ["app"]
'''
"go.mod" = '''
module example.com/app

go 1.27
'''
"main.go" = '''
package main

import "fmt"

var version = "dev"

func main() {
	fmt.Println("app", version)
}
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["docker", "build", "-t", "app", "--build-arg", "VERSION=1.2.3", "."]
message = "The Dockerfile must build (with --build-arg VERSION=1.2.3)."

[[run]]
cmd = ["docker", "run", "--rm", "app"]
output_contains = ["app 1.2.3"]
message = "The binary prints the version passed with --build-arg (ARG VERSION + -ldflags \"-X main.version=${VERSION}\")."

[[run]]
cmd = ["docker", "image", "inspect", "app"]
save = "image.json"
message = "The image must exist."

[[check]]
file = "image.json"
path = "[0].Size"
at_most = 5000000
message = "The final image is under 5 MB: only the binary, FROM scratch."

[[check]]
file = "image.json"
path = "[0].RootFS.Layers"
len = 1
message = "The final image has one layer."

[[check]]
file = "image.json"
path = "[0].Config.Entrypoint"
equals = ["/app"]
message = "ENTRYPOINT is [\"/app\"]."

[[run]]
cmd = ["docker", "run", "--rm", "--mount", "type=image,source=app,target=/img", "alpine:3.24.4", "sh", "-c", "test -x /img/app && test ! -e /img/usr/local/go && test ! -e /img/src"]
message = "Only the binary is in the image: no Go toolchain, no sources."

[[run]]
cmd = ["docker", "build", "-t", "app-builder", "--target", "builder", "."]
message = "The first stage is named builder (docker build --target builder)."

[[run]]
cmd = ["docker", "run", "--rm", "app-builder", "go", "version"]
output_contains = ["go1.27.4"]
message = "The builder stage is the Go 1.27.4 SDK."
'''

[unit.step.project.solution]
"Dockerfile" = '''
FROM golang:1.27.4-alpine3.24 AS builder
ARG VERSION=dev
WORKDIR /src
COPY go.mod main.go ./
RUN CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o /out/app .

FROM scratch
COPY --from=builder /out/app /app
ENTRYPOINT ["/app"]
'''

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u5-users"
title = "Users and least privilege"
level = "intermediate"
difficulty = 5
intro = "Run as a fixed non-root user that cannot change its own code, with no extra capabilities."
concepts = '''
Without `USER`, a container's process runs as **root** inside the container. With the Docker daemon in
its default (rootful) mode, that root is also UID 0 on the host kernel, kept in check only by
namespaces, capabilities and seccomp — a container escape lands as root on the host. Run your services
as an unprivileged user.

```dockerfile
RUN addgroup -S -g 1001 web && adduser -S -D -H -u 1001 -G web web
USER 1001:1001
```

**Numeric UIDs.** `USER 1001:1001` needs no `/etc/passwd` entry and lets Kubernetes verify
`runAsNonRoot`. Creating the matching user (as above, with Alpine's busybox tools; `useradd` on Debian)
keeps tools that print user names happy.

**Read-only code.** `COPY` makes files owned by root unless `--chown` says otherwise. Keep it that way
for the code and static files: the service can read them but not change them. Give the user write
access only to where it writes — a volume, a cache folder, `/tmp`.

**Low ports.** Binding a port below 1024 needs the `NET_BIND_SERVICE` capability. Listen on 8080 and let
`-p 80:8080` (or the platform) map it.

**Capabilities and read-only root.** `docker run --cap-drop=ALL` removes Docker's default capabilities;
`--cap-add` gives back one at a time; `--read-only` makes the root filesystem read-only (add `--tmpfs
/tmp` if the program needs scratch space); `--security-opt no-new-privileges` stops setuid binaries from
gaining privileges. A non-root image that writes only to its volumes runs under all of them — the
grader always drops every capability.

**Rootless Docker** (https://docs.docker.com/engine/security/rootless/) runs the daemon itself without
root; Podman, which grades this course, is rootless by default. Both limit the damage of a compromised
container, neither replaces a non-root `USER`.

Official docs: https://docs.docker.com/reference/dockerfile/#user and
https://docs.docker.com/engine/security/
'''

[[unit.step]]
kind = "concept"
id = "dk-c5-users"
title = "Least privilege, three layers deep"
points = 5
difficulty = 1
intro = '''
User, files and capabilities: three independent limits.
'''
body = '''
| Limit | In the Dockerfile | At run time |
|---|---|---|
| not root | `USER 1001:1001` | `--user 1001:1001` |
| code cannot be changed | `COPY` without `--chown` | `--read-only` |
| no special powers | (nothing to add) | `--cap-drop=ALL`, `no-new-privileges` |

Each one blocks a different step of an attack. An image built for the first two makes the third free.
'''

[[unit.step]]
kind = "drill"
id = "dk-d5-user"
title = "A static site served by a non-root user"
