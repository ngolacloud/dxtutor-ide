RUN go mod download
COPY . .
RUN CGO_ENABLED=0 go build -o /out/app .
'''
line_comments = [
  "The build stage.",
  "Work in /src.",
  "Only the module files first…",
  "…so the download is cached until they change.",
  "Then the code, which changes on every commit.",
  "The build reuses the downloaded modules.",
]
