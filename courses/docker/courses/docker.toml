`app/` is a finished service that answers `pong` on `/ping`, port 8080. `probe/probe.py` fetches the URL
in `TARGET` and prints `probe ok: <answer>`. Write `probe/Dockerfile` so that:

- it starts from `python:3.15.2-alpine3.24` and copies `probe.py` to `/app/probe.py`;
