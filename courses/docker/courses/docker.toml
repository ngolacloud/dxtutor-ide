message = "Arguments to docker run are appended to the ENTRYPOINT (exec form)."

[[run]]
cmd = ["docker", "run", "--rm", "--entrypoint", "python", "slug", "-c", "print('entrypoint replaced')"]
output_contains = ["entrypoint replaced"]
message = "--entrypoint replaces the entrypoint."

[[run]]
