  "A standard OCI label: configuration only.",
  "The working directory (created if missing): configuration.",
  "A file from the build context: a layer.",
  "A build-time command: its file changes are a layer.",
  "The default command: configuration.",
]
explanation = "`docker history` shows COPY and RUN with a size; the others are 0 B."

[[unit.step]]
kind = "challenge"
id = "dk-p1-banner"
title = "A banner image"
points = 30
difficulty = 2
intro = '''
Build an image that prints a banner, and inspect it like the grader does.
'''
instructions = '''
`banner.txt` holds a banner. Write the `Dockerfile` so that:

- it starts from `alpine:3.24.4`;
- it copies `banner.txt` to `/usr/share/banner.txt`;
- `docker run --rm banner` prints the file with `cat /usr/share/banner.txt`, in **exec form**;
- it has the label `org.opencontainers.image.description` set to `A banner`;
- the image has exactly **two layers** (Alpine's and the copy).

The grader runs `docker build -t banner .`, `docker run --rm banner` and `docker image inspect banner`.
'''

[unit.step.project]
main = "Dockerfile"
readonly = ["banner.txt"]
explanation = '''
Only `COPY` adds a layer here; `LABEL` and `CMD` are configuration (`Config.Labels`, `Config.Cmd`).
The exec form runs `cat` directly instead of through `/bin/sh -c`.
'''

[unit.step.project.starter]
"Dockerfile" = '''
# Build an image that prints banner.txt (see the instructions).
FROM alpine:3.24.4
'''
"banner.txt" = '''
=== Docker course: your first image works ===
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["docker", "build", "-t", "banner", "."]
message = "The Dockerfile must build."

[[run]]
cmd = ["docker", "run", "--rm", "banner"]
output_contains = ["=== Docker course: your first image works ==="]
message = "Running the image must print the banner."

[[run]]
cmd = ["docker", "run", "--rm", "--mount", "type=image,source=banner,target=/img", "alpine:3.24.4", "cat", "/img/usr/share/banner.txt"]
output_contains = ["your first image works"]
message = "The file must be in the image at /usr/share/banner.txt."

[[run]]
cmd = ["docker", "image", "inspect", "banner"]
save = "image.json"
message = "The image must exist."

[[check]]
file = "image.json"
path = "[0].Config.Cmd"
equals = ["cat", "/usr/share/banner.txt"]
message = "CMD runs [\"cat\", \"/usr/share/banner.txt\"], in exec form."

[[check]]
file = "image.json"
path = '[0].Config.Labels["org.opencontainers.image.description"]'
equals = "A banner"
message = "The label org.opencontainers.image.description is \"A banner\"."

[[check]]
file = "image.json"
path = "[0].RootFS.Layers"
len = 2
message = "The image has two layers: Alpine's and the one COPY adds."
'''

[unit.step.project.solution]
"Dockerfile" = '''
FROM alpine:3.24.4
LABEL org.opencontainers.image.description="A banner"
COPY banner.txt /usr/share/banner.txt
CMD ["cat", "/usr/share/banner.txt"]
'''

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u2-instructions"
title = "Dockerfile instructions"
level = "basic"
difficulty = 2
intro = "FROM, WORKDIR, COPY, RUN, ENV, ARG and LABEL — and the difference between build time and run time."
concepts = '''
A Dockerfile is a list of instructions, run top to bottom. They are case-insensitive (written in
capitals by convention); a line ending in `\` continues on the next; `#` starts a comment.

| Instruction | What it does |
|---|---|
| `FROM image` | the base image (only `ARG` may come before it) |
| `WORKDIR /app` | the working directory for the next instructions and for the container |
| `COPY src dest` | copies from the **build context** into the image |
| `RUN command` | runs at build time; its changes become a layer |
| `ENV KEY=value` | an environment variable for later instructions and for containers |
| `ARG NAME=default` | a build-time variable, set with `docker build --build-arg NAME=value` |
| `LABEL key=value` | metadata; `org.opencontainers.image.*` are the standard keys |

**Build context.** `docker build .` sends the folder `.` to the builder; `COPY` only reads inside it.
A `.dockerignore` file excludes paths (unit 10).

**ARG versus ENV.** An `ARG` exists only while building. To keep its value at run time, copy it into an
`ENV`: `ARG APP_VERSION=0.1.0` then `ENV APP_VERSION=$APP_VERSION`. An `ARG` declared before `FROM` is
only usable in `FROM` lines unless re-declared after it. Never pass secrets with `--build-arg`: `docker
history` shows them. (BuildKit has `RUN --mount=type=secret` for that; the grader, built on Buildah,
does not grade it.) BuildKit invalidates its cache from the first step that uses a changed argument;
Buildah 1.33, which grades, can reuse a cached `ENV`/`LABEL` step instead, so the grader builds without
the cache once build arguments are involved.

**Run-time overrides.** `docker run -e KEY=value` sets or overrides a variable; arguments after the
image replace `CMD`; `-w` changes the working directory. The image is unchanged: the same image runs in
development and in production with different settings.

**BuildKit and the grader.** Docker builds with BuildKit, which honours a `# syntax=docker/dockerfile:1`
first line by downloading that Dockerfile frontend. The grader builds with Buildah, which ignores the
line — you may keep it. The instructions in this course behave the same in both.

Official docs: https://docs.docker.com/reference/dockerfile/ and
https://docs.docker.com/build/concepts/context/
'''

[[unit.step]]
kind = "concept"
id = "dk-c2-instructions"
title = "Build time and run time"
points = 5
difficulty = 1
intro = '''
Which values exist while building, which while running, and which in both.
'''
body = '''
| | while building | in the running container | change it with |
|---|---|---|---|
| `ARG X=1` | yes | no | `docker build --build-arg X=2` |
| `ENV X=1` | yes (after the line) | yes | `docker run -e X=2` |
| `ARG X=1` + `ENV X=$X` | yes | yes | either |
| `LABEL v=$X` | written once | in the metadata | rebuild |

Use `ARG` for what varies per build (a version, a base tag), `ENV` for configuration with a default.
'''

[[unit.step]]
kind = "drill"
id = "dk-d2-python"
title = "A Python application image"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
The everyday shape of an application image.
'''
prompt = '''
Type the Dockerfile of a small Python program.
'''
target = '''
FROM python:3.15.2-alpine3.24
ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
WORKDIR /app
COPY main.py .
CMD ["python", "main.py"]
'''
line_comments = [
  "The official Python image on Alpine, at an exact version.",
  "No .pyc files at run time, output not buffered (better logs).",
  "The application folder.",
  "The program, into /app.",
  "Run it.",
]
explanation = "Two ENV variables on one line: `ENV A=1 B=2` sets both in one instruction."

[[unit.step]]
kind = "drill"
id = "dk-d2-arg-env"
title = "A build argument that survives"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = '''
Copy an ARG into an ENV to keep it at run time.
'''
prompt = '''
Type the Dockerfile. The version is chosen at build time and visible at run time.
'''
target = '''
FROM alpine:3.24.4
ARG APP_VERSION=0.1.0
ENV APP_VERSION=$APP_VERSION
LABEL org.opencontainers.image.version=$APP_VERSION
CMD ["sh", "-c", "echo running $APP_VERSION"]
'''
line_comments = [
  "The base image.",
  "A build argument with a default.",
  "Kept as an environment variable for containers.",
  "Recorded in the metadata too.",
  "The shell expands the variable at run time.",
]
explanation = "`docker build --build-arg APP_VERSION=0.2.0 -t app .` and `docker run --rm app` prints `running 0.2.0`."

[[unit.step]]
kind = "challenge"
id = "dk-p2-quotes"
title = "A versioned quote service"
points = 30
difficulty = 2
intro = '''
Write the Dockerfile of a script whose version is chosen at build time and whose language is chosen at run time.
'''
instructions = '''
`quotes.py` prints `quotes <APP_VERSION> (<QUOTE_LANG>): <a quote>`, reading both from the environment.
Write the `Dockerfile` so that:

- it starts from `python:3.15.2-alpine3.24`, works in `/app` and copies `quotes.py` there;
- a build argument **`APP_VERSION`** (default `0.1.0`) is available to the running program as the
  environment variable `APP_VERSION` and recorded in the label `org.opencontainers.image.version`;
- `QUOTE_LANG` is `en` by default and can be changed with `docker run -e QUOTE_LANG=pt`;
- the default command is `python quotes.py`, in exec form.

The grader also builds it with `--build-arg APP_VERSION=0.2.0` and runs that image.
'''

[unit.step.project]
main = "Dockerfile"
readonly = ["quotes.py"]
explanation = '''
`ARG APP_VERSION` alone would be gone when the container runs; `ENV APP_VERSION=$APP_VERSION` keeps
the value chosen at build time. `ENV QUOTE_LANG=en` is a run-time default that `-e` overrides.
'''

[unit.step.project.starter]
"Dockerfile" = '''
FROM python:3.15.2-alpine3.24
ARG APP_VERSION=0.1.0
COPY quotes.py /quotes.py
CMD ["python", "/quotes.py"]
'''
"quotes.py" = '''
import os

QUOTES = {
    "en": "Simple is better than complex.",
    "pt": "O simples é melhor do que o complexo.",
}
version = os.environ.get("APP_VERSION", "unknown")
lang = os.environ.get("QUOTE_LANG", "")
print(f"quotes {version} ({lang or 'none'}): {QUOTES.get(lang, '?')}")
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["docker", "build", "-t", "quotes", "."]
message = "The Dockerfile must build."

[[run]]
cmd = ["docker", "run", "--rm", "quotes"]
output_contains = ["quotes 0.1.0 (en): Simple is better than complex."]
message = "By default the program sees APP_VERSION=0.1.0 (ARG kept with ENV) and QUOTE_LANG=en."

[[run]]
cmd = ["docker", "run", "--rm", "-e", "QUOTE_LANG=pt", "quotes"]
output_contains = ["quotes 0.1.0 (pt)"]
message = "docker run -e QUOTE_LANG=pt changes the language."

[[run]]
cmd = ["docker", "image", "inspect", "quotes"]
save = "image.json"
message = "The image must exist."

[[check]]
file = "image.json"
path = "[0].Config.WorkingDir"
equals = "/app"
message = "The working directory is /app."

[[check]]
file = "image.json"
path = "[0].Config.Cmd"
equals = ["python", "quotes.py"]
message = "CMD is [\"python\", \"quotes.py\"], run from /app."

[[check]]
file = "image.json"
path = '[0].Config.Labels["org.opencontainers.image.version"]'
equals = "0.1.0"
message = "The label org.opencontainers.image.version records APP_VERSION."

[[run]]
cmd = ["docker", "build", "-t", "quotes:0.2.0", "--build-arg", "APP_VERSION=0.2.0", "."]
message = "The image must build with --build-arg APP_VERSION=0.2.0."

[[run]]
cmd = ["docker", "run", "--rm", "quotes:0.2.0"]
output_contains = ["quotes 0.2.0 (en)"]
message = "The version chosen at build time reaches the running program."
'''

[unit.step.project.solution]
"Dockerfile" = '''
FROM python:3.15.2-alpine3.24
ARG APP_VERSION=0.1.0
ENV APP_VERSION=$APP_VERSION \
    QUOTE_LANG=en
LABEL org.opencontainers.image.version=$APP_VERSION
WORKDIR /app
COPY quotes.py .
CMD ["python", "quotes.py"]
'''

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "dk-u3-entrypoint"
title = "ENTRYPOINT, CMD and running containers"
level = "basic"
difficulty = 3
intro = "The program a container starts, how docker run changes it, and how to follow a container in the background."
concepts = '''
**`ENTRYPOINT`** is the program a container runs; **`CMD`** is its default arguments. Arguments given to
`docker run IMAGE …` replace `CMD` and are appended to `ENTRYPOINT`. With

```dockerfile
ENTRYPOINT ["python", "/app/slug.py"]
CMD ["--help"]
```

`docker run slug` runs `python /app/slug.py --help` and `docker run slug "Hello World"` runs
`python /app/slug.py "Hello World"`: the image is used like a command. `docker run --entrypoint sh -it
slug` replaces the entrypoint to explore the image.

**Exec form, please.** In exec form (`["prog", "arg"]`) the program is process 1 and receives the
`SIGTERM` that `docker stop` sends. In shell form (`CMD prog arg`) Docker runs `/bin/sh -c "prog arg"`:
the shell is process 1, signals may never reach your program (`docker stop` then waits 10 seconds and
kills it), and a shell-form `ENTRYPOINT` ignores both `CMD` and the arguments of `docker run`.

**Background containers.** `docker run -d --name worker IMAGE` returns at once. Then:

| Command | What it does |
|---|---|
| `docker ps` / `docker ps -a` | running / all containers |
| `docker logs worker` (`-f` to follow) | stdout and stderr, also after it stopped |
| `docker exec -it worker sh` | another process inside the running container |
| `docker stop worker` · `docker rm worker` | SIGTERM then SIGKILL · delete it |

`--rm` deletes the container when it exits; without it, a stopped container (and its logs) stays until
`docker rm`.

Official docs: https://docs.docker.com/reference/dockerfile/#entrypoint and
https://docs.docker.com/reference/cli/docker/container/run/
'''

[[unit.step]]
kind = "concept"
id = "dk-c3-entrypoint"
title = "How the command line is assembled"
points = 5
difficulty = 1
intro = '''
ENTRYPOINT + (CMD or the arguments of docker run).
'''
body = '''
| Dockerfile | `docker run img` | `docker run img a b` |
|---|---|---|
| `CMD ["ls", "-l"]` | `ls -l` | `a b` |
| `ENTRYPOINT ["ls"]` + `CMD ["-l"]` | `ls -l` | `ls a b` |
| `ENTRYPOINT ls -l` (shell form) | `/bin/sh -c "ls -l"` | `/bin/sh -c "ls -l"` — `a b` ignored |

The last row is why shell-form entrypoints surprise people.
'''

