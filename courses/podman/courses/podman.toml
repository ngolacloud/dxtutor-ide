[[unit.step]]
kind = "challenge"
id = "pm-p8-shop"
title = "Describe the shop in compose.yaml"
points = 50
difficulty = 5
intro = '''
Write the compose file of a web service and its PostgreSQL database, the way production wants it.
'''
instructions = '''
The shop has a web service (`web/`, finished) and a PostgreSQL database. Write `compose.yaml` with:

- a service **`web`** built from `./web`, named `localhost/shop-web:1.0`, publishing `"8080:8080"`, with
  `DATABASE_HOST: db` in its `environment` (a mapping), starting only when `db` is **healthy**
  (`depends_on` with `condition: service_healthy`), on the networks `frontend` and `backend`;
- a service **`db`** from the image `docker.io/library/postgres:17.12-alpine3.24`, only on `backend`,
  publishing **no** port, with its data in the named volume `db-data` at `/var/lib/postgresql/data`, a
  health check `["CMD", "pg_isready", "-U", "postgres"]`, and its password from a **secret**: the
  secret `db_password` (from the file `./db_password.txt`) and `POSTGRES_PASSWORD_FILE:
  /run/secrets/db_password` — never `POSTGRES_PASSWORD` in the file;
- top-level `networks` (`frontend`, and `backend` with `internal: true`), `volumes` (`db-data`) and
  `secrets`.

The grader reads the file and also builds and starts the web image from `./web`.
'''

[unit.step.project]
main = "compose.yaml"
readonly = ["web/Containerfile", "web/app.py"]
explanation = '''
`depends_on` with `service_healthy` uses the database's health check, so the web service never starts
against a database that is still initialising. The `backend` network is internal and the database
publishes no port: only `web` can reach it. The password lives in a secret file, mounted at
`/run/secrets/db_password`, which the PostgreSQL image reads through `POSTGRES_PASSWORD_FILE`.
'''

[unit.step.project.starter]
"compose.yaml" = '''
# The shop: a web service built from ./web and a PostgreSQL database.
services:
  web:
    image: localhost/shop-web:1.0
'''
"web/Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
WORKDIR /app
COPY app.py .
USER 10001
EXPOSE 8080
CMD ["python", "app.py"]
'''
"web/app.py" = '''
import http.server
import os
import sys

DATABASE_HOST = os.environ.get("DATABASE_HOST", "")

if "--check" in sys.argv:
    print(f"config ok: database at {DATABASE_HOST or '(unset)'}")
    sys.exit(0 if DATABASE_HOST else 1)


class Handler(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        body = f"shop is up, database at {DATABASE_HOST}\n".encode()
        self.send_response(200)
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)


http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
'''

