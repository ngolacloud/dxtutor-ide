USER 10001
CMD ["python", "app.py"]
'''
line_comments = [
  "The base image.",
  "The application folder.",
  "Only the dependency list first…",
  "…so this slow step is reused until the list changes; no pip cache in the layer.",
  "The code last: it changes on every commit.",
  "Non-root.",
  "The server.",
]
explanation = "With a `.containerignore` next to it, `COPY . .` copies only what the app needs."

[[unit.step]]
kind = "drill"
id = "pm-d10-cleanup"
title = "Clean up in the same layer"
points = 10
difficulty = 3
placeholder_policy = "shown"
intro = '''
Download, use and delete inside one RUN, so the bytes never reach a layer.
'''
prompt = '''
Type the Containerfile. The archive is unpacked and removed in a single step.
'''
target = '''
FROM docker.io/library/alpine:3.24.4
COPY site.tar.gz /tmp/site.tar.gz
RUN mkdir -p /srv/site \
 && tar -xzf /tmp/site.tar.gz -C /srv/site \
 && rm /tmp/site.tar.gz
'''
line_comments = [
  "The base image.",
  "The archive lands in its own layer here — see the explanation.",
  "One RUN: make the folder…",
  "…unpack…",
  "…and delete the archive in the same layer.",
]
explanation = "The COPY layer still holds the archive. To avoid even that, unpack it in a build stage and COPY --from the result, or use `ADD site.tar.gz /srv/site/`, which unpacks a local archive itself."

[[unit.step]]
kind = "challenge"
id = "pm-p10-words"
title = "A lean, cache-friendly build"
points = 60
difficulty = 5
intro = '''
Reorder a slow build, keep junk out of the context, and stop a temporary toolchain from bloating the image.
'''
instructions = '''
The build creates `index.json` from `words.txt` with `build_index.py`, inside a throw-away virtual
environment in `/opt/build`, and `app.py` prints a summary from the index. Fix the `Containerfile` and
`.containerignore` so that:

- the slow step (create the venv, run `build_index.py` with its Python, delete the venv) is **one**
  `RUN`, so the venv never ends up in a layer — the image stays under **65 MB** (the base is ~56 MB; the venv
  alone would add ~14 MB);
- that step comes **before** the application code is copied, and only needs `words.txt` and
  `build_index.py`: after a change to `app.py` the grader rebuilds and expects that step to come from
  the cache (`--> Using cache`);
- `COPY . .` (the rest of the code, into `/app`) stays, but `.containerignore` keeps `notes/` out of the
  image;
- the program runs as UID 10001 with `python app.py` in `/app`.
'''

[unit.step.project]
main = "Containerfile"
readonly = ["app.py", "build_index.py", "words.txt", "notes/todo.md"]
explanation = '''
Layers only add bytes, so the venv must be created and deleted in the same `RUN`. Copying only the
index's inputs before that step means a change to `app.py` invalidates just the final `COPY . .`.
`.containerignore` removes `notes/` from the build context, so `COPY . .` cannot copy it.
'''

[unit.step.project.starter]
"Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
WORKDIR /app
COPY . .
RUN python -m venv /opt/build && /opt/build/bin/python build_index.py
RUN rm -rf /opt/build
USER 10001
CMD ["python", "app.py"]
'''
".containerignore" = '''
# Files and folders the build does not need (one pattern per line).
'''
"app.py" = '''
import json
from pathlib import Path

index = json.loads(Path("/app/index.json").read_text())
print(f"{index['words']} words, longest: {index['longest']}")
'''
"build_index.py" = '''
import json
import sys
from pathlib import Path

words = [w.strip() for w in Path("words.txt").read_text().splitlines() if w.strip()]
index = {"words": len(words), "longest": max(words, key=len), "python": sys.version.split()[0]}
Path("index.json").write_text(json.dumps(index))
print("indexed", len(words), "words")
'''
"words.txt" = '''
container
image
layer
volume
network
rootless
namespace
healthcheck
registry
digest
compose
podman
'''
"notes/todo.md" = '''
# Private notes — must never end up in the image

- ask the team about the registry credentials
'''

