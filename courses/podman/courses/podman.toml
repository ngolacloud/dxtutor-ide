'''
target = '''
FROM docker.io/library/python:3.15.2-alpine3.24
RUN addgroup -S -g 10001 app && adduser -S -D -H -u 10001 -G app app
WORKDIR /app
COPY app.py .
RUN mkdir data && chown 10001:10001 data
USER 10001:10001
CMD ["python", "app.py"]
'''
line_comments = [
  "The base image.",
  "A system group and user, both 10001, no password, no home.",
  "The application folder.",
  "The code, owned by root: readable, not writable, by the user.",
  "The one folder the user may write to.",
  "Everything from here on runs as 10001.",
  "Started as 10001.",
]
explanation = "`podman run --rm img id -u` prints 10001; writing to /app fails, writing to /app/data works."

[[unit.step]]
