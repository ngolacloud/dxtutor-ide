# Podman — the official dxtutor course for Podman (Learn P3a).
#
# A TOOL course graded LIVE. The learner writes Containerfiles (and a compose file); every
# challenge is a project step whose hidden `checks.toml` builds and runs the learner's image in a
# private rootless Podman sandbox (tutor_core::podcmd has the allow-list; tutor_eval::sandbox the
# sandbox): its own storage and configuration, limits, no capabilities, no network, labels on
# everything and nothing left behind. Grading never pulls: «Prepare course» pulls the three base
# images below, by digest, once. Written against Podman 4.9.3 (Buildah 1.33).

id = "podman-basics"
language = "dockerfile"
category = "tool"
subject = "podman"
title = "Podman: Images and Containers, Rootless"
level = "beginner"
summary = "Build images and run containers with Podman, rootless: layers, Containerfile instructions, ENTRYPOINT and CMD, multi-stage builds, least privilege, volumes, networks, compose, health checks, size and caching — graded live in a private sandbox."

overview = '''
**Podman** builds and runs OCI containers without a daemon and, by default, without root: every
container is a child process of your own user, inside a user namespace. Its command line is
compatible with Docker's (`podman run`, `podman build`, `podman images`…), it builds with
**Buildah** underneath, and it adds what Docker does not have — **pods**, rootless by default, and
`podman kube play` for Kubernetes YAML.

This course teaches you to write **Containerfiles** (the same format as a Dockerfile) that build
small, safe images, and to run them the way production expects: as a non-root user, with data in
volumes, health checks that mean something, and builds that reuse their cache. Every challenge is
graded **live**: your Containerfile is built and run by Podman, and hidden checks look at what came
out — the output, the image configuration (`podman image inspect`), the files inside the image, a
port answering, a volume keeping its data.

What you will learn, in order:

1. **images and layers** — what an image is, tags and digests, fully qualified names;
2. **Containerfile instructions** — `FROM`, `WORKDIR`, `COPY`, `RUN`, `ENV`, `ARG`, `LABEL`;
3. **ENTRYPOINT and CMD** — exec form, overriding at run time, detached containers and logs;
4. **multi-stage builds** — compile in one stage, ship only the binary;
5. **users and least privilege** — a fixed non-root UID, read-only code, no capabilities;
6. **volumes** — data that outlives the container, and who owns it;
7. **networks** — namespaces, `localhost` in a pod, user-defined networks and DNS;
8. **compose** — a multi-service application described in one file;
9. **health checks** — `HEALTHCHECK`, and why Podman needs `--format docker` for it;
10. **image size and caching** — layer order, `.containerignore`, clean up in the same layer.

**How grading works — honestly.** Grading runs in a **private rootless Podman sandbox** that
dxtutor creates for the Learning Track: its own image storage and configuration (your own Podman
images and containers are never read or touched, and the Docker daemon is never used), resource
limits (memory, processes, CPU), no Linux capabilities, `--network none`, and every container,
volume and image it creates is labelled and removed afterwards. Grading **never pulls an image**:
the base images below are downloaded once, pinned by digest, when you choose **Prepare course**
(you approve the exact commands first). After that, everything is offline.

The sandbox cannot do everything your own Podman can: it publishes no ports on your machine (a check
reaches a service from a second container that shares its network namespace), and it creates no
user-defined networks (in rootless Podman they share one network namespace per user, so they would
collide with yours). Compose files are checked by reading them, not by `podman compose up`. Each unit
says where this matters.

**What you need.** **Podman 4.4 or newer**, rootless, on **Linux** with a systemd user session
(https://podman.io/docs/installation). The course was written and validated against **Podman 4.9.3**.
On macOS and Windows Podman runs inside a virtual machine (`podman machine`), which this grader does
not drive: the lessons still apply, grading does not run there.

The prepared base images: `docker.io/library/alpine:3.24.4`, `docker.io/library/python:3.15.2-alpine3.24`
and `docker.io/library/golang:1.27.4-alpine3.24`.

Official documentation: https://docs.podman.io/en/v4.9.3/ — the man pages of `podman build`,
`podman run` and the other commands used here are linked in each unit.
'''

[build]
prepare = true
timeout_secs = 300
dependencies = [
  "docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf",
  "docker.io/library/python:3.15.2-alpine3.24@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd",
  "docker.io/library/golang:1.27.4-alpine3.24@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280",
]

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "pm-u1-images"
title = "Images and layers"
level = "basic"
difficulty = 1
intro = "An image is a stack of read-only layers plus a configuration; a container is that image running, with one writable layer on top."
concepts = '''
An **image** is two things: a stack of **layers** (each one a tarball of filesystem changes) and a
small **configuration** (the command to run, the environment, the working directory, the user, the
exposed ports, labels). A **container** is a process started from an image: Podman stacks the image's
layers read-only, adds one empty writable layer on top, and runs the configured command. Delete the
container and its writable layer goes with it; the image is unchanged and can start many containers.

**Where layers come from.** Every `RUN`, `COPY` and `ADD` instruction of a Containerfile adds a layer.
`FROM` starts from the base image's layers. The other instructions — `CMD`, `ENTRYPOINT`, `ENV`,
`WORKDIR`, `LABEL`, `USER`, `EXPOSE` — only change the configuration and add no filesystem layer.
`podman history <image>` lists the steps that made an image, with their sizes, and
`podman image inspect <image>` prints the configuration and the layer digests (`RootFS.Layers`) as JSON.

**Names, tags and digests.** A full image name is `registry/repository:tag`, for example
`docker.io/library/alpine:3.24.4`. The tag is a movable label: the publisher can point `3.24` at a new
build tomorrow. A **digest** (`@sha256:…`) is the hash of the image manifest itself: it can never
point at anything else. Production pins by digest (or at least by an exact tag); this course's base
images are pinned by digest when you prepare it.

**Short names.** Docker silently turns `alpine` into `docker.io/library/alpine:latest`. Podman is more
careful: it looks the short name up in `registries.conf`, and in "enforcing" mode asks you which
registry you meant. Writing the registry in full (`FROM docker.io/library/alpine:3.24.4`) removes the
ambiguity, and it is what this course does.

**Rootless.** Podman needs no daemon and no root. Your images live in your home folder
(`~/.local/share/containers/storage`), and "root" inside a container is your own user, mapped through
a user namespace. Grading uses a separate, private storage of the same kind.

| Command | What it does |
|---|---|
| `podman build -t hello .` | build the Containerfile in `.` and name the image `hello` |
| `podman run --rm hello` | start a container from it, remove it when it exits |
| `podman images` | list the local images |
| `podman history hello` | the steps (and layers) that made `hello` |
| `podman image inspect hello` | its configuration, as JSON |

Official docs: https://docs.podman.io/en/v4.9.3/markdown/podman-build.1.html and
https://docs.podman.io/en/v4.9.3/markdown/podman-image-inspect.1.html
'''

[[unit.step]]
kind = "concept"
id = "pm-c1-images"
title = "Layers and a configuration"
points = 5
difficulty = 1
intro = '''
What `podman build` produces, and what `podman run` does with it.
'''
body = '''
A Containerfile is a recipe. Each line is an **instruction**, executed in order:

```dockerfile
FROM docker.io/library/alpine:3.24.4   # start from these layers
COPY motd.txt /etc/motd                # + one layer: the file
CMD ["cat", "/etc/motd"]               # configuration only: what runs
```

`podman build -t motd .` turns it into an image with **two layers** (Alpine's, and the one with
`/etc/motd`) and a configuration whose command is `cat /etc/motd`. `podman run --rm motd` starts a
container from that image, prints the file and removes the container.

In this unit you write that image and look inside it the way the grader does: by running it, by
reading its configuration with `podman image inspect`, and by counting its layers.
'''

[[unit.step]]
kind = "drill"
id = "pm-d1-hello"
title = "The smallest useful Containerfile"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
A base image and a command: enough for `podman run` to do something.
'''
prompt = '''
Type the Containerfile. It starts from Alpine Linux, pinned to an exact tag, and prints a greeting.
'''
target = '''
FROM docker.io/library/alpine:3.24.4
CMD ["echo", "hello, podman"]
'''
line_comments = [
  "The base image, written in full: registry, repository and an exact tag.",
  "The default command, in exec form: a JSON list, no shell involved.",
]
explanation = "`podman build -t hello .` then `podman run --rm hello` prints `hello, podman`. The image has Alpine's single layer: CMD adds configuration, not files."

[[unit.step]]
kind = "drill"
id = "pm-d1-layers"
title = "One layer per file change"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
Which instructions add layers, and which only change the configuration.
'''
prompt = '''
Type the Containerfile. Note which lines add a layer to the image.
'''
target = '''
FROM docker.io/library/alpine:3.24.4
LABEL org.opencontainers.image.title="notes"
WORKDIR /srv
COPY notes.txt notes.txt
RUN wc -l notes.txt > count.txt
CMD ["cat", "/srv/count.txt"]
'''
line_comments = [
  "Alpine's layers are the starting point.",
  "A label: metadata in the configuration, no layer.",
  "Sets the working directory (and creates it): configuration.",
  "Copies a file from the build context: a new layer.",
  "Runs a command at build time; its file changes become a layer.",
  "The default command: configuration again.",
]
explanation = "`podman history` would show COPY and RUN as the steps with a size; LABEL, WORKDIR and CMD are 0 bytes."

[[unit.step]]
kind = "challenge"
id = "pm-p1-motd"
title = "Your first image"
points = 30
difficulty = 2
intro = '''
Build an image that prints a message of the day, and see it the way Podman does.
'''
instructions = '''
`motd.txt` holds a message of the day. Write the `Containerfile` so that:

- it starts from `docker.io/library/alpine:3.24.4`;
- it copies `motd.txt` to `/etc/motd` in the image;
- running the image (`podman run --rm motd`) prints the file with `cat /etc/motd`, in **exec form**;
- it has the label `org.opencontainers.image.title` set to `motd`;
- the image has exactly **two layers**: Alpine's and yours (only the copy adds one).

The grader builds it with `podman build -t motd .`, runs it, and reads `podman image inspect motd`.
'''

[unit.step.project]
main = "Containerfile"
readonly = ["motd.txt"]
explanation = '''
`COPY` is the only instruction here that changes files, so it is the only one that adds a layer;
`LABEL` and `CMD` go into the configuration (`Config.Labels`, `Config.Cmd`). The exec form
`["cat", "/etc/motd"]` runs `cat` directly — the shell form `CMD cat /etc/motd` would run
`/bin/sh -c "cat /etc/motd"` instead.
'''

[unit.step.project.starter]
"Containerfile" = '''
# Build an image that prints motd.txt (see the instructions).
FROM docker.io/library/alpine:3.24.4
'''
"motd.txt" = '''
Welcome to the Podman course! Everything here runs rootless.
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["podman", "build", "-t", "motd", "."]
message = "The Containerfile must build."

[[run]]
cmd = ["podman", "run", "--rm", "motd"]
output_contains = ["Welcome to the Podman course!"]
message = "Running the image must print the message of the day."

[[run]]
cmd = ["podman", "run", "--rm", "--mount", "type=image,source=motd,target=/img", "docker.io/library/alpine:3.24.4", "cat", "/img/etc/motd"]
output_contains = ["Welcome to the Podman course!"]
message = "The file must be in the image at /etc/motd."

[[run]]
cmd = ["podman", "image", "inspect", "motd"]
save = "image.json"
message = "The image must exist."

[[check]]
file = "image.json"
path = "[0].Config.Cmd"
equals = ["cat", "/etc/motd"]
message = "CMD runs [\"cat\", \"/etc/motd\"], in exec form."

[[check]]
file = "image.json"
path = '[0].Config.Labels["org.opencontainers.image.title"]'
equals = "motd"
message = "The label org.opencontainers.image.title is motd."

[[check]]
file = "image.json"
path = "[0].RootFS.Layers"
len = 2
message = "The image has two layers: Alpine's and the one COPY adds."
'''

[unit.step.project.solution]
"Containerfile" = '''
FROM docker.io/library/alpine:3.24.4
LABEL org.opencontainers.image.title="motd"
COPY motd.txt /etc/motd
CMD ["cat", "/etc/motd"]
'''

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "pm-u2-instructions"
title = "Containerfile instructions"
level = "basic"
difficulty = 2
intro = "FROM, WORKDIR, COPY, RUN, ENV, ARG and LABEL: the instructions almost every image uses."
concepts = '''
A Containerfile is read top to bottom. Instructions are written in capitals by convention (they are
case-insensitive), one per line; a long line continues with `\` at its end, and `#` starts a comment.

| Instruction | What it does |
|---|---|
| `FROM image` | the base image; the first instruction (only `ARG` may come before it) |
| `WORKDIR /app` | the working directory of the next instructions and of the container; created if missing |
| `COPY src dest` | copies files from the **build context** into the image; relative `dest` is under `WORKDIR` |
| `RUN command` | runs a command at build time and keeps its file changes as a layer |
| `ENV KEY=value` | an environment variable for the next instructions **and** for the running container |
| `ARG NAME=default` | a build-time variable (`--build-arg NAME=value`); gone in the running container |
| `LABEL key=value` | metadata in the configuration; the `org.opencontainers.image.*` keys are standard |

**The build context.** `podman build -t app .` sends the folder `.` to the builder. `COPY` can only
read files inside it — never `../something` and never an absolute host path — which is why images
build the same everywhere. A `.containerignore` file (Docker's `.dockerignore` works too) lists what
not to send.

**ENV versus ARG.** `ENV GREETING=Hello` is baked into the image: `podman run` sees it, and
`podman run -e GREETING=Hi` overrides it. `ARG VERSION=1.0` exists only while building: use it in
`LABEL org.opencontainers.image.version=$VERSION` or in `RUN`, then pass another value with
`podman build --build-arg VERSION=2.0`. Never pass secrets as build arguments: they are recorded in
the image history. (A Buildah 1.33 quirk, measured: with the layer cache, an `ENV` or `LABEL` that uses
an argument can come from the cache after the argument's value changed. Add `--no-cache` when you
change a build argument; the grader builds without the cache once build arguments are involved.)

**RUN, shell form.** `RUN python -m compileall -q .` runs through `/bin/sh -c`, so `&&`, pipes and
variables work. Each `RUN` is a layer; combine related commands with `&&` (unit 10 shows why).

**Overriding at run time.** `podman run IMAGE args…` replaces `CMD` with `args…`; `-e KEY=value` sets
or overrides an environment variable; `-w /dir` changes the working directory.

In the grader, builds run with `--pull=never` and no network: `RUN` cannot download anything, and
`FROM` must name one of the course's prepared images.

Official docs: https://docs.podman.io/en/v4.9.3/markdown/podman-build.1.html (it documents
Containerfiles and `.containerignore`) and https://docs.docker.com/reference/dockerfile/ (the format is
the same).
'''

[[unit.step]]
kind = "concept"
id = "pm-c2-instructions"
title = "Configuration you can override"
points = 5
difficulty = 1
intro = '''
What ends up in the image's configuration, and what a `podman run` can change.
'''
body = '''
After a build, `podman image inspect app` shows the configuration the instructions wrote:

```json
"Config": {
  "Env": ["PATH=...", "GREETING=Hello"],
  "Cmd": ["python", "greet.py"],
  "WorkingDir": "/app",
  "Labels": {"org.opencontainers.image.version": "1.0"}
}
```

Each of these is a **default**. `podman run -e GREETING=Hi app` changes the variable for that
container only; `podman run app python greet.py Ana` replaces the command. The image itself never
changes — which is why the same image can run in every environment with different settings.
'''

[[unit.step]]
kind = "drill"
id = "pm-d2-python"
title = "A small Python image"
points = 10
difficulty = 1
placeholder_policy = "shown"
intro = '''
The everyday shape of an application image.
'''
prompt = '''
Type the Containerfile of a small Python script.
'''
target = '''
FROM docker.io/library/python:3.15.2-alpine3.24
ENV PYTHONUNBUFFERED=1
WORKDIR /app
COPY app.py .
CMD ["python", "app.py"]
'''
line_comments = [
  "The official Python image on Alpine, pinned to an exact version.",
  "Print output immediately: useful for `podman logs`.",
  "Everything below happens in /app.",
  "Copy the script into /app (the `.` is relative to WORKDIR).",
  "Run it with the image's Python.",
]
explanation = "Five lines cover most application images: a base, an environment, a folder, the code and a command."

[[unit.step]]
kind = "drill"
id = "pm-d2-args"
title = "Build arguments and labels"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = '''
A value chosen at build time, recorded in the image's metadata.
'''
prompt = '''
Type the Containerfile. `VERSION` can be changed with `--build-arg VERSION=…`.
'''
target = '''
FROM docker.io/library/alpine:3.24.4
ARG VERSION=1.0
LABEL org.opencontainers.image.version=$VERSION
ENV APP_VERSION=$VERSION
RUN echo "built $VERSION" > /built.txt
CMD ["cat", "/built.txt"]
'''
line_comments = [
  "Any prepared base will do.",
  "A build argument with a default: only exists while building.",
  "The standard OCI label for the version, filled from the argument.",
  "Copy it into an ENV to keep it at run time.",
  "Build arguments are visible to RUN as variables.",
  "Prints the file written at build time.",
]
explanation = "`podman build --build-arg VERSION=2.0 -t app .` writes 2.0 in the label, the variable and the file."

[[unit.step]]
kind = "challenge"
id = "pm-p2-greet"
title = "A configurable greeter"
points = 30
difficulty = 2
intro = '''
Write the Containerfile of a script whose greeting comes from the environment.
'''
instructions = '''
`greet.py` prints `<GREETING>, <name>!`, reading `GREETING` from the environment and the name from
its first argument. Write the `Containerfile` so that:

- it starts from `docker.io/library/python:3.15.2-alpine3.24`;
- the working directory is `/app`, and `greet.py` is copied there;
- `GREETING` is `Hello` by default (`podman run -e GREETING=… ` can change it);
- the build compiles the script once with `RUN python -m compileall -q .` (in `/app`);
- the default command is `python greet.py`, in exec form, so `podman run --rm greet` prints
  `Hello, world!`;
- a build argument `VERSION` (default `1.0`) is recorded in the label
  `org.opencontainers.image.version`, so `--build-arg VERSION=2.0` changes it.
'''

[unit.step.project]
main = "Containerfile"
readonly = ["greet.py"]
explanation = '''
`ENV` sets a default the container can override with `-e`; `ARG` is only for the build and reaches
the image through `LABEL ...=$VERSION`. `WORKDIR /app` makes `COPY greet.py .`, `RUN` and `CMD` all
work in `/app`, which is where the compiled `__pycache__` ends up.
'''

[unit.step.project.starter]
"Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
COPY greet.py /greet.py
CMD ["python", "/greet.py"]
'''
"greet.py" = '''
import os
import sys

greeting = os.environ.get("GREETING", "Hi")
name = sys.argv[1] if len(sys.argv) > 1 else "world"
print(f"{greeting}, {name}!")
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["podman", "build", "-t", "greet", "."]
message = "The Containerfile must build."

[[run]]
cmd = ["podman", "run", "--rm", "greet"]
output_contains = ["Hello, world!"]
message = "By default the image greets with Hello: GREETING is Hello and CMD runs python greet.py."

[[run]]
cmd = ["podman", "run", "--rm", "-e", "GREETING=Bom dia", "greet"]
output_contains = ["Bom dia, world!"]
message = "podman run -e GREETING=… overrides the greeting."

[[run]]
cmd = ["podman", "run", "--rm", "greet", "python", "greet.py", "Ana"]
output_contains = ["Hello, Ana!"]
message = "Arguments after the image replace CMD and run in /app."

[[run]]
cmd = ["podman", "run", "--rm", "--mount", "type=image,source=greet,target=/img", "docker.io/library/alpine:3.24.4", "test", "-d", "/img/app/__pycache__"]
message = "The build compiles greet.py in /app (RUN python -m compileall -q .)."

[[run]]
cmd = ["podman", "image", "inspect", "greet"]
save = "image.json"
message = "The image must exist."

[[check]]
file = "image.json"
path = "[0].Config.WorkingDir"
equals = "/app"
message = "The working directory is /app."

[[check]]
file = "image.json"
path = "[0].Config.Env"
contains = "GREETING=Hello"
message = "ENV GREETING=Hello sets the default."

[[check]]
file = "image.json"
path = '[0].Config.Labels["org.opencontainers.image.version"]'
equals = "1.0"
message = "The label org.opencontainers.image.version comes from ARG VERSION (default 1.0)."

[[run]]
cmd = ["podman", "build", "-t", "greet:v2", "--build-arg", "VERSION=2.0", "."]
message = "The image must build with --build-arg VERSION=2.0."

[[run]]
cmd = ["podman", "image", "inspect", "greet:v2"]
save = "image2.json"
message = "The second build must exist."

[[check]]
file = "image2.json"
path = '[0].Config.Labels["org.opencontainers.image.version"]'
equals = "2.0"
message = "--build-arg VERSION=2.0 changes the version label."
'''

[unit.step.project.solution]
"Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
ARG VERSION=1.0
LABEL org.opencontainers.image.version=$VERSION
ENV GREETING=Hello
WORKDIR /app
COPY greet.py .
RUN python -m compileall -q .
CMD ["python", "greet.py"]
'''

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "pm-u3-entrypoint"
title = "ENTRYPOINT, CMD and running containers"
level = "basic"
difficulty = 3
intro = "What runs when a container starts, how to change it, and how to watch a container that runs in the background."
concepts = '''
Two instructions decide the process a container starts:

- **`ENTRYPOINT`** — the program. Arguments given to `podman run` are **appended** to it.
- **`CMD`** — the default arguments (or, with no `ENTRYPOINT`, the default command). Arguments given
  to `podman run` **replace** it.

With `ENTRYPOINT ["python", "/app/count.py"]` and `CMD ["--help"]`, `podman run count` runs
`python /app/count.py --help`, and `podman run count one two` runs `python /app/count.py one two`. The
image behaves like a command-line tool. To run something else entirely, `--entrypoint` replaces the
entrypoint for one container: `podman run --entrypoint python count -c "print(1)"`.

**Exec form versus shell form.** `CMD ["python", "app.py"]` (a JSON list) starts `python` directly,
as process 1 of the container. `CMD python app.py` (shell form) starts `/bin/sh -c "python app.py"`:
the shell is process 1, signals such as the `SIGTERM` of `podman stop` reach the shell and not your
program, and an `ENTRYPOINT` in shell form ignores the arguments of `podman run`. Use the exec form for
`ENTRYPOINT` and `CMD` unless you need a shell feature.

**Running in the background.** `podman run -d --name job IMAGE` starts the container detached and
prints its ID. `podman ps` lists running containers (`-a` also the stopped ones), `podman logs job`
prints what it wrote to stdout and stderr — even after it stopped — and `podman exec job CMD` runs
another command inside a running container. `podman stop job` sends `SIGTERM`, then `SIGKILL` after 10
seconds; `podman rm job` deletes it; `--rm` on `podman run` deletes it as soon as it exits.

| Run-time option | Effect |
|---|---|
| `podman run IMAGE a b` | replaces `CMD` with `a b` (appended to `ENTRYPOINT`) |
| `--entrypoint prog` | replaces `ENTRYPOINT` (and clears `CMD`) |
| `-d` · `--name n` | detached · a name for later commands |
| `podman logs n` · `podman exec n cmd` | its output · a command inside it |

Official docs: https://docs.podman.io/en/v4.9.3/markdown/podman-run.1.html and
https://docs.docker.com/reference/dockerfile/#entrypoint
'''

[[unit.step]]
kind = "concept"
id = "pm-c3-entrypoint"
title = "A program and its default arguments"
points = 5
difficulty = 1
intro = '''
How ENTRYPOINT and CMD combine into the command line of process 1.
'''
body = '''
| Containerfile | `podman run img` | `podman run img x y` |
|---|---|---|
| `CMD ["echo", "hi"]` | `echo hi` | `x y` |
| `ENTRYPOINT ["echo"]` + `CMD ["hi"]` | `echo hi` | `echo x y` |
| `ENTRYPOINT ["echo"]` | `echo` | `echo x y` |

An image meant to be **used like a command** sets `ENTRYPOINT` to the program and `CMD` to a sensible
default (often `--help`). An image meant to be **a service** usually sets only `CMD`, so an operator
can run a shell or a one-off task with `podman run img sh` without fighting the entrypoint.
'''

[[unit.step]]
kind = "drill"
id = "pm-d3-tool"
title = "An image that behaves like a command"
points = 10
difficulty = 2
placeholder_policy = "shown"
