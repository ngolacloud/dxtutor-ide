output_contains = ["hello, Ana (static Go binary)"]
message = "The image runs the program with the arguments of podman run."

[[run]]
cmd = ["podman", "image", "inspect", "hello"]
save = "image.json"
message = "The image must exist."

[[check]]
file = "image.json"
path = "[0].Size"
at_most = 5000000
message = "The final image is under 5 MB: only the binary, FROM scratch."

[[check]]
file = "image.json"
path = "[0].RootFS.Layers"
len = 1
message = "The final image has one layer: the binary copied from the build stage."

[[check]]
file = "image.json"
path = "[0].Config.Entrypoint"
equals = ["/hello"]
message = "ENTRYPOINT is [\"/hello\"]."

[[run]]
cmd = ["podman", "run", "--rm", "--mount", "type=image,source=hello,target=/img", "docker.io/library/alpine:3.24.4", "sh", "-c", "test -x /img/hello && test ! -e /img/usr/local/go"]
message = "The binary is at /hello and the Go toolchain is not in the image."

[[run]]
