[[unit]]
id = "pm-u10-size"
title = "Image size and build cache"
level = "advanced"
difficulty = 10
intro = "Order the instructions so the cache does the work, send the builder only what it needs, and clean up in the layer that made the mess."
concepts = '''
**The build cache.** For each instruction, Podman (Buildah) looks for a layer it already built from the
same parent with the same instruction — and, for `COPY`/`ADD`, the same file contents. If it finds one
it prints `--> Using cache` and skips the work. The first instruction whose input changed, and **every
instruction after it**, run again. So order the Containerfile from what changes least to what changes
most:

```dockerfile
COPY words.txt build_index.py ./     # changes rarely
RUN … build the index …              # slow: cached while the two files above do not change
COPY . .                             # the code: changes on every commit
```

Put `COPY . .` first and every code change re-runs the slow step.

**`.containerignore`.** The whole build context is sent to the builder and `COPY . .` copies all of it:
notes, test data, `.git`, local secrets. A `.containerignore` file (Podman also reads Docker's
`.dockerignore`) lists patterns to leave out — `notes/`, `*.log`, `.git`. Smaller context, faster
builds, nothing private in the image, and fewer cache misses caused by irrelevant files.

**Layers only add.** Deleting a file in a later `RUN` hides it, but the earlier layer still carries its
bytes: the image does not shrink. Create and delete temporary things in the **same** `RUN`:

```dockerfile
RUN python -m venv /opt/build \
 && /opt/build/bin/python build_index.py \
 && rm -rf /opt/build
```

**Smaller images**, beyond that: a small base (`alpine`, `-slim`, distroless, `scratch` with a
multi-stage build), no package manager caches (`apk add --no-cache`, `pip install --no-cache-dir`),
and nothing that is only needed to build. `podman image inspect --format '{{.Size}}'` and
`podman history` show where the bytes are.

Official docs: https://docs.docker.com/build/cache/,
https://docs.docker.com/build/building/best-practices/ and
https://docs.podman.io/en/v4.9.3/markdown/podman-build.1.html (`.containerignore`, `--layers`)
'''

[[unit.step]]
kind = "concept"
id = "pm-c10-size"
title = "Every instruction after a change runs again"
points = 5
difficulty = 1
intro = '''
How one changed file decides how much of the build is repeated.
'''
body = '''
Change one line of `app.py` and rebuild:

| Order | Steps re-run |
|---|---|
| `COPY . .` then `RUN` (slow) then `CMD` | `COPY`, the slow `RUN`, everything after |
| `COPY deps` then `RUN` (slow) then `COPY . .` | only the last `COPY` |

The second order turns a two-minute rebuild into two seconds — on your machine and in CI. `podman
build` tells you which: every reused step prints `--> Using cache <id>`.
'''

[[unit.step]]
kind = "drill"
id = "pm-d10-order"
title = "Dependencies before code"
points = 10
difficulty = 3
placeholder_policy = "shown"
intro = '''
The classic cache-friendly order for a Python service.
'''
prompt = '''
Type the Containerfile. The dependency step is cached until `requirements.txt` changes.
'''
