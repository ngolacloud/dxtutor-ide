[[unit.step]]
kind = "challenge"
id = "pm-p4-hello"
title = "From 270 MB to under 5 MB"
points = 40
difficulty = 4
intro = '''
Turn a single-stage Go image into a multi-stage one that ships only the binary.
'''
instructions = '''
The starter `Containerfile` builds `main.go` in the `golang` image and ships the whole SDK. Rewrite it
as a **multi-stage** build:

- a first stage named **`build`**, from `docker.io/library/golang:1.27.4-alpine3.24`, that compiles a
  **static** binary (`CGO_ENABLED=0 go build …`) from `go.mod` and `main.go`;
- a final stage **`FROM scratch`** that contains only that binary, at `/hello`, and runs it with
  `ENTRYPOINT ["/hello"]`;
- `podman run --rm hello Ana` prints `hello, Ana (static Go binary)`;
- the image is under **5 MB** and has a single layer, and the Go toolchain is not in it;
- `podman build --target build` still builds the first stage (the grader runs `go version` in it).
'''

[unit.step.project]
main = "Containerfile"
readonly = ["go.mod", "main.go"]
explanation = '''
`CGO_ENABLED=0` makes Go link everything statically, so the binary runs in `scratch`, which has no C
library. `COPY --from=build` is the only thing that crosses stages, so the final image is one layer
with one file. The `build` stage still exists for `--target build`.
'''

[unit.step.project.starter]
"Containerfile" = '''
FROM docker.io/library/golang:1.27.4-alpine3.24
WORKDIR /src
COPY go.mod main.go ./
