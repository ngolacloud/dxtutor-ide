instructions = '''
`api/` is a finished service: it answers `healthy` on `http://<host>:8080/health`. `client/check.py`
fetches the URL in `API_URL` and prints the answer. Write `client/Containerfile` so that:

- it starts from `docker.io/library/python:3.15.2-alpine3.24` and copies `check.py` to `/app/check.py`;
- `API_URL` defaults to the API's health URL **as seen from the API's own network namespace** (the
  grader runs the client with `--network container:api`, like two containers in one pod);
- it runs as a non-root user (UID 10001) and runs `python /app/check.py` by default.

The grader builds both images, starts `api`, runs the client in its namespace (it must print
`healthy`), and runs the client alone (with its own namespace it must fail: nothing listens there).
'''

[unit.step.project]
main = "client/Containerfile"
readonly = ["api/Containerfile", "api/server.py", "client/check.py"]
explanation = '''
In a shared network namespace there is one `localhost` and no DNS, so the client reaches the API at
`http://127.0.0.1:8080/health`. The name `api` would only resolve on a user-defined network, where
Podman's DNS knows the container names.
'''

[unit.step.project.starter]
"client/Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
COPY check.py /app/check.py
ENV API_URL=http://api:8080/health
CMD ["python", "/app/check.py"]
'''
"client/check.py" = '''
import os
import sys
import urllib.request

url = os.environ.get("API_URL", "")
if not url:
    sys.exit("API_URL is not set")
try:
    with urllib.request.urlopen(url, timeout=3) as response:
        print(response.read().decode().strip(), "from", url)
except OSError as error:
    sys.exit(f"cannot reach {url}: {error}")
'''
"api/Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
COPY server.py /app/server.py
USER 10001
EXPOSE 8080
CMD ["python", "/app/server.py"]
'''
"api/server.py" = '''
import http.server


class Handler(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        ok = self.path == "/health"
        body = b"healthy\n" if ok else b"not found\n"
        self.send_response(200 if ok else 404)
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)


http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
'''

