# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "pm-u4-multistage"
title = "Multi-stage builds"
level = "intermediate"
difficulty = 4
intro = "Compile in a stage with the whole toolchain, then copy only the result into a small final image."
concepts = '''
A compiler, its standard library and the build cache are needed to **build** a program, not to
**run** it. A **multi-stage** Containerfile has several `FROM` lines; each starts a new stage, and only
the last stage becomes the image (unless you pick another with `--target`). A later stage copies what
it needs from an earlier one with `COPY --from=<stage>`:

```dockerfile
FROM docker.io/library/golang:1.27.4-alpine3.24 AS build
WORKDIR /src
COPY go.mod main.go ./
RUN CGO_ENABLED=0 go build -o /out/hello .

FROM scratch
COPY --from=build /out/hello /hello
ENTRYPOINT ["/hello"]
```

The `golang` image is about 270 MB; the final image here is the binary alone, under 2 MB, with no
shell, no package manager and nothing to patch but your program.

**Naming stages.** `AS build` names a stage; `COPY --from=build` uses the name (`--from=0` would use its
position, which breaks when you add a stage). `podman build --target build -t hello-build .` stops at
that stage — handy to debug the build environment, or to run the tests in it.

**`scratch`** is the empty image: no files at all. It only works for programs that need nothing from an
operating system — a static binary. Go makes one with `CGO_ENABLED=0` (no C library). For programs
that need a C library, CA certificates or time zones, use a minimal base instead (`alpine`, or a
"distroless" image).

**What stays behind.** Nothing from a stage reaches the final image unless it is copied: no compiler,
no source code, no build cache, no secrets used while building. That is the main reason to use
multi-stage builds, even more than size.

Podman builds multi-stage Containerfiles with Buildah, exactly as Docker does with BuildKit. In the
grader, every stage builds offline: `go build` here needs only the standard library.

Official docs: https://docs.docker.com/build/building/multi-stage/ and
https://docs.podman.io/en/v4.9.3/markdown/podman-build.1.html (`--target`)
'''

[[unit.step]]
kind = "concept"
id = "pm-c4-multistage"
title = "Build here, ship there"
points = 5
difficulty = 1
intro = '''
Why the image you run should not contain the tools that built it.
'''
body = '''
Compare two ways to ship the same Go program:

| | single stage (`FROM golang`) | multi-stage (`FROM scratch`) |
|---|---|---|
| size | ~270 MB | ~1.5 MB |
| contains | Go toolchain, Alpine, your source, the binary | the binary |
| a shell to exploit | yes | no |
| security updates to track | Alpine + Go + your code | your code |

The program behaves the same. The multi-stage image is smaller to pull, faster to start, and has far
less in it that an attacker could use or a scanner could flag.
'''

[[unit.step]]
kind = "drill"
id = "pm-d4-stages"
title = "Two stages"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = '''
