# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "pm-u8-compose"
title = "Compose"
level = "advanced"
difficulty = 8
intro = "A multi-service application in one YAML file: services, their images, configuration, dependencies, volumes, networks and secrets."
concepts = '''
Running an application by hand means a `podman run` per service, with the right networks, volumes,
environment and start order. The **Compose specification** describes all of it in one file,
`compose.yaml`:

```yaml
services:
  web:
    build: ./web                 # or image: … to use a ready image
    ports: ["8080:8080"]
    environment:
      DATABASE_HOST: db          # services find each other by name
    depends_on:
      db:
        condition: service_healthy
  db:
    image: docker.io/library/postgres:17.12-alpine3.24
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
volumes:
  db-data: {}
```

The pieces you will use most:

| Key | Meaning |
|---|---|
| `build` / `image` | build from a folder, or run an existing image (pin the tag) |
| `ports` | `"HOST:CONTAINER"` — quote it: YAML reads `60:60` as a number in base 60 |
| `environment` | variables; `${VAR}` is interpolated from your shell or `.env` file |
| `depends_on` + `condition: service_healthy` | start only after the dependency's health check passes |
| `volumes` | named volumes (declared at the top level) or bind mounts |
| `networks` | user-defined networks; `internal: true` cuts them off from the outside |
| `secrets` | files mounted at `/run/secrets/<name>` instead of passwords in the environment |
| `healthcheck` | the same as `HEALTHCHECK`, per service |

**Secrets do not go in `environment`.** A `POSTGRES_PASSWORD: hunter2` in `compose.yaml` ends up in
git, in `podman inspect` and in every process listing. The official PostgreSQL image reads
`POSTGRES_PASSWORD_FILE` instead, pointing at a secret file.

**Running it with Podman.** `podman compose up` hands the file to a compose provider — `docker-compose`
(talking to Podman's API socket) or `podman-compose` (which turns it into `podman` commands). Podman
also has its own path: `podman kube play pod.yaml` runs Kubernetes YAML, and `podman kube generate`
writes it from running containers.

**In this course** the compose file is graded by **reading it**: hidden checks verify each service, its
dependencies, networks, volumes and secrets, the way a reviewer would. `podman compose up` is not run —
it would publish ports on your machine and create networks next to your own. The web service's image
is still built and started for real.

Official docs: https://docs.podman.io/en/v4.9.3/markdown/podman-compose.1.html and
https://docs.docker.com/reference/compose-file/
'''

[[unit.step]]
kind = "concept"
id = "pm-c8-compose"
title = "One file instead of ten commands"
points = 5
difficulty = 1
intro = '''
What a compose file replaces, line by line.
'''
body = '''
| By hand | In `compose.yaml` |
|---|---|
| `podman network create backend --internal` | `networks: {backend: {internal: true}}` |
| `podman volume create db-data` | `volumes: {db-data: {}}` |
| `podman run -d --name db --network backend -v db-data:/var/lib/postgresql/data postgres` | `services.db` |
| wait until the database is ready | `depends_on: {db: {condition: service_healthy}}` |
| `podman build -t web ./web && podman run -d -p 8080:8080 web` | `services.web` |

The file is also documentation: anyone can read which services exist, how they connect and what they
persist, and review a change to it like any other code.
'''

