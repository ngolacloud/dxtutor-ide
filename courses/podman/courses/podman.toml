WORKDIR /src
COPY go.mod main.go ./
RUN CGO_ENABLED=0 go build -trimpath -o /out/app .

FROM scratch
COPY --from=build /out/app /app
ENTRYPOINT ["/app"]
'''
line_comments = [
  "The build stage: the Go SDK on Alpine, named `build`.",
  "Work in /src.",
  "Copy the module file and the source.",
  "A static binary (no C library), without local paths in it.",
  "",
  "The final stage starts from nothing at all.",
  "Only the binary crosses over from the build stage.",
  "Run it directly: there is no shell in scratch.",
]
explanation = "Only the last stage becomes the image; `--target build` would stop at the first one."

[[unit.step]]
