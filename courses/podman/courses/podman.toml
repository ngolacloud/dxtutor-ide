HEALTHCHECK --interval=15s --timeout=2s --start-period=10s --retries=3 \
  CMD wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
CMD ["python", "/app/app.py"]
'''
line_comments = [
  "The base image.",
  "The service.",
  "Non-root.",
  "Its port.",
  "Every 15 s, at most 2 s each, ignoring failures in the first 10 s, unhealthy after 3 in a row…",
  "…by fetching /health with busybox wget; any failure exits 1.",
  "The server.",
]
explanation = "Build it with `podman build --format docker -t app .`, or Podman drops the HEALTHCHECK."

[[unit.step]]
