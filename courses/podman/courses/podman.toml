[[unit]]
id = "pm-u9-health"
title = "Health checks"
level = "advanced"
difficulty = 9
intro = "A container that runs is not necessarily a service that works: a health check asks the service itself."
concepts = '''
`podman ps` says a container is `Up` as long as its main process runs. A web server that deadlocked,
lost its database or is still loading its cache is `Up` too. A **health check** is a command that runs
inside the container at intervals and says whether the service really works: exit code 0 is healthy,
1 is unhealthy.

```dockerfile
HEALTHCHECK --interval=10s --timeout=3s --start-period=5s --retries=3 \
  CMD wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
```

| Option | Meaning |
|---|---|
| `--interval` | time between checks (default 30s) |
| `--timeout` | a check that takes longer counts as a failure (default 30s) |
| `--start-period` | failures in this first period do not count — time to start up (default 0) |
| `--retries` | consecutive failures before the container is `unhealthy` (default 3) |

The status — `starting`, `healthy`, `unhealthy` — shows in `podman ps` and in
`podman inspect --format '{{.State.Health.Status}}' web`; `podman healthcheck run web` runs the check
once, now. Compose waits for it (`condition: service_healthy`), and an orchestrator can restart an
unhealthy container. Kubernetes ignores `HEALTHCHECK` and uses its own probes, but the endpoint you
expose (`/health`) is the same.

**A good check** tests the service the way a client would (an HTTP request to the app, not "is the
process alive"), is cheap, has a timeout, and uses a tool that exists in the image — Alpine has
busybox `wget`; a `scratch` image has nothing, so its program must provide its own check command.

**Podman and the OCI format.** `HEALTHCHECK` is part of the **Docker** image format, not of the OCI
image specification. Podman builds **OCI** images by default and, building one, warns
"HEALTHCHECK is not supported for OCI image format and will be ignored". Build with
**`podman build --format docker`** (or `BUILDAH_FORMAT=docker`) to keep it. Podman's `inspect` shows the
check at the top level (`Healthcheck`), Docker's under `Config.Healthcheck`. And on a running container,
Podman runs the checks from a systemd timer; `podman run --health-cmd …` can also set or replace one.

Official docs: https://docs.docker.com/reference/dockerfile/#healthcheck and
https://docs.podman.io/en/v4.9.3/markdown/podman-healthcheck-run.1.html
'''

[[unit.step]]
kind = "concept"
id = "pm-c9-health"
title = "Up is not healthy"
points = 5
difficulty = 1
intro = '''
What the health status adds to "the process is running".
'''
body = '''
| Situation | `podman ps` status | health |
|---|---|---|
| just started, loading | Up 2 seconds | starting |
| serving requests | Up 5 minutes | healthy |
| deadlocked, every request times out | Up 5 minutes | unhealthy |
| crashed | Exited (1) | — |

Only the health check can tell the second and third rows apart. Remember, with Podman, to build with
`--format docker`: an OCI image has no place to keep the check.
'''

[[unit.step]]
kind = "drill"
id = "pm-d9-healthcheck"
title = "An HTTP health check"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = '''
