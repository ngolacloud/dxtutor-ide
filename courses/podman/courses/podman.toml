ENTRYPOINT ["hello"]
'''
"go.mod" = '''
module example.com/hello

go 1.27
'''
"main.go" = '''
package main

import (
	"fmt"
	"os"
)

func main() {
	name := "world"
	if len(os.Args) > 1 {
		name = os.Args[1]
	}
	fmt.Printf("hello, %s (static Go binary)\n", name)
}
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["podman", "build", "-t", "hello", "."]
message = "The Containerfile must build."

[[run]]
