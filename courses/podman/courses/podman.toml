[[unit.step]]
kind = "challenge"
id = "pm-p5-server"
title = "A web server that is not root"
points = 40
difficulty = 4
intro = '''
Make a small HTTP server run as a fixed non-root user that cannot modify its own code.
'''
instructions = '''
`server.py` answers every request with `ok uid=<its uid>` on port 8080. Write the `Containerfile` so
that:

- it starts from `docker.io/library/python:3.15.2-alpine3.24`;
- it creates a user and group `app` with UID and GID **10001**, and runs the server as that user
  (`USER`, numeric or by name);
- `server.py` is in `/app`, **owned by root**, so the server cannot change it;
- it documents port **8080** (`EXPOSE`) and runs `python server.py` by default;
- the image also works with a read-only root filesystem (`podman run --read-only`).

The grader starts it (`podman run -d --name web web`), asks it for a page from a second container that
shares its network namespace, and runs `id -u` inside it.
'''

[unit.step.project]
main = "Containerfile"
readonly = ["server.py"]
explanation = '''
`USER 10001:10001` makes the server run unprivileged; `COPY` without `--chown` leaves the code owned by
root, so the server can read it but not write it. Nothing in the image needs to write outside `/tmp`,
so `--read-only` works too.
'''

[unit.step.project.starter]
"Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
WORKDIR /app
COPY server.py .
CMD ["python", "server.py"]
'''
"server.py" = '''
import http.server
import os


class Handler(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        body = f"ok uid={os.getuid()}\n".encode()
        self.send_response(200)
        self.send_header("Content-Type", "text/plain")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

    def log_message(self, fmt, *args):
        print(fmt % args, flush=True)


http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
'''

[unit.step.project.tests]
"checks.toml" = '''
[[run]]
cmd = ["podman", "build", "-t", "web", "."]
message = "The Containerfile must build."

[[run]]
cmd = ["podman", "image", "inspect", "web"]
save = "image.json"
message = "The image must exist."

[[check]]
file = "image.json"
path = "[0].Config.User"
matches = '^(10001|app)(:(10001|app))?$'
message = "The image runs as the app user (UID 10001): USER 10001:10001 or USER app."

[[check]]
file = "image.json"
path = "[0].Config.ExposedPorts"
contains = { "8080/tcp" = {} }
message = "EXPOSE 8080 documents the port."

[[run]]
cmd = ["podman", "run", "-d", "--name", "web", "web"]
message = "The server starts."

[[run]]
cmd = ["podman", "run", "--rm", "--network", "container:web", "docker.io/library/alpine:3.24.4", "wget", "-q", "-T", "3", "-O", "-", "http://127.0.0.1:8080/"]
retries = 10
message = "The server answers on port 8080 (asked from a second container in its network namespace)."

[[run]]
cmd = ["podman", "run", "--rm", "--network", "container:web", "docker.io/library/alpine:3.24.4", "wget", "-q", "-T", "3", "-O", "-", "http://127.0.0.1:8080/"]
output_contains = ["ok uid=10001"]
message = "The server runs as UID 10001."

[[run]]
cmd = ["podman", "exec", "web", "id", "-u"]
output_contains = ["10001"]
message = "Inside the container, the process runs as 10001."

[[run]]
cmd = ["podman", "exec", "web", "sh", "-c", "echo hacked >> /app/server.py"]
expect = "failure"
message = "The server's user cannot modify its own code: server.py stays owned by root."

[[run]]
cmd = ["podman", "run", "--rm", "--read-only", "web", "python", "-c", "import os; print('read-only ok', os.getuid())"]
output_contains = ["read-only ok 10001"]
message = "The image works with a read-only root filesystem."
'''

[unit.step.project.solution]
"Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
RUN addgroup -S -g 10001 app && adduser -S -D -H -u 10001 -G app app
WORKDIR /app
COPY server.py .
USER 10001:10001
EXPOSE 8080
CMD ["python", "server.py"]
'''

# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "pm-u6-volumes"
title = "Volumes"
level = "intermediate"
difficulty = 6
intro = "Data that must outlive a container goes in a volume — and the user who writes it must own it."
concepts = '''
A container's writable layer disappears with the container. Anything that must survive a restart, an
upgrade to a new image or a `podman rm` — a database, uploaded files, a counter — belongs in a
**volume**: storage managed by Podman, mounted into the container at a path.

```sh
podman volume create data
podman run --rm -v data:/data app     # writes /data/count
podman run --rm -v data:/data app     # sees what the first one wrote
```

**Named volumes** (`-v data:/data`) live in Podman's storage
(`~/.local/share/containers/storage/volumes` for rootless) and are listed by `podman volume ls`. They
outlive every container until `podman volume rm`. **Bind mounts** (`-v /host/path:/data`) map a host
folder instead; they depend on the machine they run on, and the grader never uses them.

**`VOLUME /data` in a Containerfile** declares that `/data` holds data. When a container starts without
a volume there, Podman creates an **anonymous** volume for it, so writes never go to the container
layer. `podman run --rm` removes that anonymous volume with the container — only a **named** volume
keeps data between runs.

**Ownership.** When an empty named volume is first mounted, Podman copies into it what the image has at
that path — files **and ownership**. So an image that runs as a non-root user should create the folder
and give it to that user:

```dockerfile
RUN mkdir /data && chown 10001:10001 /data
USER 10001
VOLUME /data
```

If the image has `/data` but it belongs to root (a plain `RUN mkdir /data`), the new volume belongs to
root too and the non-root process gets "Permission denied" — the most common volume bug. (When the
path does not exist in the image at all, Podman — unlike Docker — gives the new volume to the
container's user. Do not rely on it: create the folder and give it to the user, which works with both.)

**`:ro`.** `-v data:/data:ro` mounts the volume read-only: useful for a container that only reads
configuration or another service's output.

Official docs: https://docs.podman.io/en/v4.9.3/markdown/podman-volume-create.1.html and
https://docs.docker.com/engine/storage/volumes/
'''

[[unit.step]]
kind = "concept"
id = "pm-c6-volumes"
title = "Containers are disposable, data is not"
points = 5
difficulty = 1
intro = '''
Where a container's writes go, and which of them survive.
'''
body = '''
| Written to | Survives `podman rm`? | Survives a new image? |
|---|---|---|
| the container layer | no | no |
| an anonymous volume (`VOLUME`, no `-v`) | not with `--rm` | no |
| a named volume (`-v data:/data`) | yes | yes |

Upgrading an application means removing its container and starting a new one from the new image. If
its data is in a named volume, the new container mounts the same volume and carries on.
'''

