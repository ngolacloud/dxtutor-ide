# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "pm-u5-users"
title = "Users and least privilege"
level = "intermediate"
difficulty = 5
intro = "Run as a fixed non-root user, keep the code read-only for it, and give the container nothing it does not need."
concepts = '''
Unless the image says otherwise, the process in a container runs as **root** (UID 0) of the
container. Rootless Podman maps that root to your own user on the host, which limits the damage — but
inside the container it can still rewrite the application, read everything, and use whatever
capabilities the container has. Production images run as an unprivileged user.

**`USER`.** `USER 10001:10001` makes the following `RUN`, `CMD` and `ENTRYPOINT` run as that UID and
GID. A **numeric** UID is best: it works without an `/etc/passwd` entry, and Kubernetes can check it
(`runAsNonRoot` cannot verify a name). Create a matching user for tools that look the name up:

```dockerfile
RUN addgroup -S -g 10001 app && adduser -S -D -H -u 10001 -G app app
USER 10001:10001
```

(On Alpine `adduser`/`addgroup` come from busybox; on Debian-based images use `useradd`/`groupadd`.)

**Who owns the code.** `COPY` creates files owned by root unless you write `COPY --chown=…`. For the
application's own code that is exactly right: the non-root user can read and run it but cannot change
it — so a compromised process cannot plant code that survives a restart. Give the user write access only
where it must write (a data folder, a volume, `/tmp`).

**Ports below 1024.** A non-root process cannot bind port 80 without the `NET_BIND_SERVICE`
capability. Listen on a high port (8080) instead, and let the platform map it.

**Capabilities and a read-only root.** Podman starts containers with a small default set of Linux
capabilities. `--cap-drop=ALL` removes them all (the grader always does), `--cap-add=X` returns one
that a service really needs, and `--read-only` makes the container's root filesystem read-only (with
`--tmpfs /tmp` for scratch space). An image that runs as a non-root user and writes nowhere but its
volumes works under all three.

Official docs: https://docs.docker.com/reference/dockerfile/#user,
https://docs.podman.io/en/v4.9.3/markdown/podman-run.1.html (`--user`, `--cap-drop`, `--read-only`)
'''

[[unit.step]]
kind = "concept"
id = "pm-c5-users"
title = "Root in a container is still root"
points = 5
difficulty = 1
intro = '''
What a process running as UID 0 can do inside its container, even rootless.
'''
body = '''
Run `podman run --rm img id` on an image without `USER`: `uid=0(root)`. That process can:

- overwrite the application's code and configuration in the container;
- install tools, if the image has a package manager;
- read every file of the image, including keys someone forgot there;
- use the container's capabilities (changing file owners, binding low ports, …).

Rootless Podman maps that UID 0 to your unprivileged user on the host, so an escape gains little. But
"inside the container" is where the application and its data live. Running as a fixed, non-root UID,
with code it cannot write, removes most of that power at no cost.
'''

[[unit.step]]
kind = "drill"
id = "pm-d5-user"
title = "A dedicated user"
points = 10
difficulty = 2
placeholder_policy = "shown"
intro = '''
Create a system user with a fixed UID and switch to it.
'''
prompt = '''
