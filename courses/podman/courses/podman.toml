[[unit.step]]
kind = "challenge"
id = "pm-p9-health"
title = "A service that knows when it is healthy"
points = 50
difficulty = 5
intro = '''
Add a health check that tests the real endpoint, and build the image so Podman keeps it.
'''
instructions = '''
`app.py` serves `/` and a health endpoint `/health` on port 8080. Fix the `Containerfile` so that:

- the `HEALTHCHECK` fetches `http://127.0.0.1:8080/health` (the starter checks the wrong port), with
  `--interval=10s`, `--timeout=3s`, `--start-period=5s` and `--retries=3`;
- the service runs as UID 10001 and `EXPOSE`s 8080.

The grader builds it with `podman build --format docker` (so the check is kept), starts it, runs
`podman healthcheck run app` until it passes, and expects the container to be `healthy`. It also
builds it once in the default **OCI** format, to show you that the check is gone there.
'''

[unit.step.project]
main = "Containerfile"
readonly = ["app.py"]
explanation = '''
The check now asks the endpoint the service really serves, with a timeout. The intervals end up in
the image in nanoseconds (`Interval: 10000000000`). Built as OCI, the same Containerfile has no
`Healthcheck` at all: that format has no field for it.
'''

[unit.step.project.starter]
"Containerfile" = '''
FROM docker.io/library/python:3.15.2-alpine3.24
WORKDIR /app
COPY app.py .
USER 10001
EXPOSE 8080
HEALTHCHECK CMD wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1
CMD ["python", "app.py"]
'''
"app.py" = '''
import http.server


class Handler(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        if self.path == "/health":
            body, status = b"ok\n", 200
        elif self.path == "/":
            body, status = b"hello\n", 200
        else:
            body, status = b"not found\n", 404
        self.send_response(status)
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

    def log_message(self, fmt, *args):
        pass


http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
'''

