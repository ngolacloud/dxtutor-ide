FROM docker.io/library/python:3.15.2-alpine3.24
WORKDIR /app
COPY words.txt build_index.py ./
RUN python -m venv /opt/build \
 && /opt/build/bin/python build_index.py \
 && rm -rf /opt/build
COPY . .
USER 10001
CMD ["python", "app.py"]
'''
".containerignore" = '''
notes/
Containerfile
.containerignore
'''
