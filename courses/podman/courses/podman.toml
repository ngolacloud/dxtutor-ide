`count.py` prints how many words it was given, or its usage with no arguments (or `--help`). Write the
`Containerfile` so that:

- it starts from `docker.io/library/python:3.15.2-alpine3.24` and copies `count.py` to `/app/count.py`;
- the **entrypoint** is `python /app/count.py`, in exec form;
