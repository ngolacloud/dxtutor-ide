# ─────────────────────────────────────────────────────────────────────────────────────────────
[[unit]]
id = "pm-u7-networks"
title = "Networks"
level = "intermediate"
difficulty = 7
intro = "Every container has its own network namespace; containers reach each other by sharing one, or through a network with DNS."
concepts = '''
Each container gets its own **network namespace**: its own interfaces, its own routing table and its
own `localhost`. A server listening on `127.0.0.1:8080` in one container is invisible from another
container's `localhost`. There are three ways to connect containers:

1. **Share a namespace.** `podman run --network container:api client` puts `client` in `api`'s
   namespace: they share interfaces and `localhost`, so the client reaches the server at
   `http://127.0.0.1:8080`. A **pod** (`podman pod create --name shop`, then `podman run --pod shop …`)
   is a group of containers that share one namespace this way — exactly like a Kubernetes Pod.
2. **A user-defined network.** `podman network create shop`, then `podman run --network shop --name api …`
   and `podman run --network shop client`: each container has its own address on the network, and
   Podman's DNS server (aardvark-dns) resolves the **container names**, so the client uses
   `http://api:8080`. `--internal` makes a network with no route to the outside world.
3. **Publish a port on the host.** `podman run -p 8080:8080 api` forwards the host's port 8080 to the
   container. That is how users reach a service; containers talking to each other should not need it.

`--network none` gives a container only a loopback interface: nothing in, nothing out. It is the
safest default for a job that needs no network — and what the grader uses for everything.

**Rootless networking.** Without root, Podman cannot create real bridges on the host. Rootless
containers on the default network go out through a user-mode network stack (`slirp4netns` or `pasta`),
and every rootless user-defined network of a user lives inside one shared "rootless network namespace".
Ports below 1024 cannot be published without changing a system setting.

**In this sandbox.** The grader creates no user-defined networks — inside the shared rootless
namespace they would collide with your own — and publishes no ports. It uses `--network none` and
`--network container:<name>`, which is enough to test the pod pattern: two containers that talk over
`localhost`. On your machine, try the network variant too: create a network, run the API with
`--name api`, and point the client at `http://api:8080`.

Official docs: https://docs.podman.io/en/v4.9.3/markdown/podman-network.1.html,
https://docs.podman.io/en/v4.9.3/markdown/podman-pod-create.1.html and
https://docs.podman.io/en/v4.9.3/markdown/podman-run.1.html (`--network`)
'''

[[unit.step]]
kind = "concept"
id = "pm-c7-networks"
title = "Whose localhost?"
points = 5
difficulty = 1
intro = '''
The same URL means different things depending on the namespace a container is in.
'''
body = '''
| The client runs with | `http://127.0.0.1:8080` reaches | `http://api:8080` reaches |
|---|---|---|
| its own namespace (default, or `--network none`) | the client itself: nothing there | nothing (no such name) |
| `--network container:api` / the same pod | the API | nothing (no DNS in a shared namespace) |
| a user-defined network with the API on it | the client itself | the API, through Podman's DNS |

So a client's configuration depends on how it is deployed. That is why the URL belongs in an
environment variable with a sensible default, not in the code.
'''

[[unit.step]]
kind = "drill"
id = "pm-d7-client"
