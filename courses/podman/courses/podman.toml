- `podman run --rm count one two three` prints `3 words`;
- `podman run --rm --entrypoint python count -c "..."` can still run Python directly.

The grader also runs it detached (`podman run -d --name job count a b`) and reads `podman logs job`.
'''

[unit.step.project]
