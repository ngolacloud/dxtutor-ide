target = '''
func insertionSort<T: Comparable>(_ a: inout [T]) {
    guard a.count > 1 else { return }
    for i in 1..<a.count {
        let item = a[i]
        var j = i - 1
        while j >= 0 && a[j] > item {
            a[j + 1] = a[j]
            j -= 1
        }
        a[j + 1] = item
    }
}

