            let elapsed = Date().timeIntervalSince(start)
            self.expect(html.hasPrefix("<ol><li>item 0</li><li>item 1</li>"))
            self.expect(html.hasSuffix("<li>item 19999</li></ol>"))
            self.equal(html.components(separatedBy: "<li>").count - 1, n)
            self.expect(elapsed < 2.0, "rendering 20,000 items took \(elapsed) s")
        }
