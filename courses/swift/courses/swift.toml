'''
tests = '''
func nodes<T>(_ list: SinglyLinkedList<T>, limit: Int) -> [Node<T>] {
    var out: [Node<T>] = []
    var node = list.head
    while let current = node, out.count <= limit {
        out.append(current)
        node = current.next
    }
    return out
}

test("a new list is empty") {
    let list = SinglyLinkedList<Int>()
    self.expect(list.isEmpty, "a new list must be empty")
    self.equal(list.count, 0)
    self.equal(list.toArray(), [])
    self.expect(list.popFront() == nil, "popFront on an empty list must return nil")
    self.expect(list.head == nil && list.tail == nil, "head and tail must be nil")
}

test("pushFront and append keep order and count") {
    let list = SinglyLinkedList<Int>()
    list.append(2)
    list.pushFront(1)
    list.append(3)
    list.pushFront(0)
    self.equal(list.toArray(), [0, 1, 2, 3])
    self.equal(list.count, 4)
    self.equal(list.head?.value, 0)
    self.equal(list.tail?.value, 3)
    self.expect(list.tail?.next == nil, "the tail must be the last node")
}

test("pushFront on an empty list also sets the tail") {
    let list = SinglyLinkedList<String>()
    list.pushFront("a")
    self.expect(list.head === list.tail, "a one-node list has head === tail")
    list.append("b")
    self.equal(list.toArray(), ["a", "b"])
}

test("popFront returns values in order and empties the list") {
    let list = SinglyLinkedList<String>()
    for word in ["x", "y", "z"] { list.append(word) }
    self.equal(list.popFront(), "x")
    self.equal(list.popFront(), "y")
    self.equal(list.count, 1)
    self.equal(list.popFront(), "z")
    self.expect(list.popFront() == nil, "the fourth pop must return nil")
    self.expect(list.isEmpty && list.tail == nil, "popping the last node must clear the tail")
    list.append("again")
    self.equal(list.toArray(), ["again"])
}

test("removeAll(where:) handles head, middle, tail and duplicates") {
    let list = SinglyLinkedList<Int>()
    for v in [7, 1, 7, 7, 2, -3, 7] { list.append(v) }
    self.equal(list.removeAll { $0 == 7 }, 4)
    self.equal(list.toArray(), [1, 2, -3])
    self.equal(list.count, 3)
    self.equal(list.tail?.value, -3)
    list.append(9)
    self.equal(list.toArray(), [1, 2, -3, 9])
    self.equal(list.removeAll { $0 > 100 }, 0)
    self.equal(list.removeAll { _ in true }, 4)
    self.expect(list.isEmpty && list.head == nil && list.tail == nil, "removing everything empties the list")
    list.append(5)
    self.equal(list.toArray(), [5])
}

test("reverse rewires the same nodes") {
    let list = SinglyLinkedList<Int>()
    for v in [10, 20, 30, 40] { list.append(v) }
    let before = nodes(list, limit: 10)
    list.reverse()
    let after = nodes(list, limit: 10)
    self.equal(after.count, 4)
    self.equal(list.toArray(), [40, 30, 20, 10])
    for (a, b) in zip(after, before.reversed()) {
        self.expect(a === b, "nodes must be rewired, not recreated")
    }
    self.expect(list.tail === before[0], "the old head must become the tail")
    self.expect(list.tail?.next == nil, "the new tail must end the list")
    list.append(50)
    self.equal(list.toArray(), [40, 30, 20, 10, 50])
}

test("reverse of empty and one-node lists") {
    let empty = SinglyLinkedList<Int>()
    empty.reverse()
    self.expect(empty.isEmpty && empty.tail == nil, "reversing an empty list keeps it empty")
    let one = SinglyLinkedList<Int>()
    one.append(5)
    let node = one.head
    one.reverse()
    self.expect(one.head === node && one.tail === node, "a one-node list keeps its node")
    self.equal(one.toArray(), [5])
}

test("100,000 nodes: every operation stays O(1) or O(n)") {
    let n = 100_000
    let start = Date()
    let list = SinglyLinkedList<Int>()
    for i in 0..<n { list.append(i) }
    list.reverse()
    self.equal(list.count, n)
    self.equal(list.head?.value, n - 1)
    let removed = list.removeAll { $0 % 2 == 1 }
    self.equal(removed, n / 2)
    let values = list.toArray()
    self.equal(values.count, n / 2)
    self.equal(values.first, n - 2)
    self.equal(values.last, 0)
    for _ in 0..<1000 { _ = list.popFront() }
    self.equal(list.count, n / 2 - 1000)
    self.expect(Date().timeIntervalSince(start) < 3.0, "operations on a long list should be linear, not quadratic")
}
'''

