[unit.step.gabarito]
solution = '''
// Return the letter grade for a score from 0 to 100:
// 90...100 "A", 80...89 "B", 70...79 "C", 60...69 "D", 0...59 "F".
// Any score outside 0...100 returns "invalid".
func grade(_ score: Int) -> String {
    guard (0...100).contains(score) else {
        return "invalid"
    }
    switch score {
    case 90...100:
        return "A"
    case 80..<90:
        return "B"
    case 70..<80:
        return "C"
    case 60..<70:
        return "D"
    default:
        return "F"
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function performs a fixed number of comparisons: one range check in the `guard` and at
most four range patterns in the `switch`, each of which compares `score` with two bounds.
That number does not depend on the value of `score`, so the time is **O(1)**. No memory is
allocated beyond the returned string literal, which already exists in the program, so the
space is **O(1)**.

The structure is what keeps it correct. The `guard` removes every out-of-range value first,
so the `switch` only ever sees `0...100` and its `default` can safely mean `F`. Half-open
ranges such as `80..<90` make neighbouring bands meet without overlapping or leaving gaps,
and since the cases are tried top to bottom, each score lands in exactly one band.
'''

[[unit]]
id = "sw-u05-loops"
title = "Loops: for-in, while & stride"
level = "basic"
difficulty = 5
intro = '''
Computers shine at doing the same thing many times without getting bored. This unit
teaches Swift's loops: `for-in` over ranges and other sequences, `stride` for custom steps,
`while` and `repeat-while` for loops that run until a condition changes, and `break` and
`continue` to steer them.
'''
concepts = '''
## The idea

A **loop** repeats a block of code. Some loops know in advance how many times to run ("for
each number from 1 to 10"), others run until something happens ("until the value reaches
1"). Each run of the block is called an **iteration**. Loops turn a few lines of code into
work over thousands or millions of values, and they are where most of a program's running
time is spent.

## How Swift does it

**`for-in`** walks through a **sequence**, giving each element a name for one iteration.
Ranges are the commonest sequences: `1...5` is closed (includes 5) and `0..<5` is half-open
(stops before 5, which is perfect for counting from zero).

```swift
for n in 1...3 {
    print(n * n)        // 1, 4, 9
}
for _ in 0..<2 {
    print("again")      // _ when you don't need the value
}
```

Strings and arrays are sequences too: `for ch in "abc"` visits each `Character`.

**`stride(from:to:by:)`** counts in custom steps and stops *before* the end;
**`stride(from:through:by:)`** may land *on* the end. A negative step counts down. You can
also write `(1...5).reversed()`.

**`while`** checks its condition *before* each iteration, so it may run zero times.
**`repeat { } while`** checks *after*, so its body always runs at least once.

```swift
var n = 100
while n > 1 {
    n /= 2
}
```

**`continue`** skips the rest of the current iteration and moves to the next; **`break`**
leaves the loop entirely. A label such as `outer:` before a loop lets `break outer` leave
an outer loop from inside an inner one. A `where` clause filters a `for-in`:
`for n in 1...10 where n % 2 == 0`.

## What is special or tricky

- **No C-style `for`.** `for (var i = 0; i < 3; i++)` fails with `C-style for statement
  was removed in Swift 3`, and there is no `++` operator; use `+= 1`.
- **The loop variable is a constant.** Assigning to it inside the loop fails with
  `cannot assign to value: 'i' is a 'let' constant`.
- **Ranges can't run backwards.** `5...1` compiles but crashes with `Range requires
  lowerBound <= upperBound`. Use `stride` with a negative step or `reversed()`.
- **Off by one.** `0...n` runs `n + 1` times; `0..<n` runs `n` times.
- **Infinite loops.** A `while` whose condition never becomes false never ends; make sure
  each iteration moves towards the exit.

## What you will practise

You will sum a range, loop over a string and an array, count in steps with `stride`, run
`while` and `repeat-while` loops, and filter with `continue` and `break`. The challenge asks
you to test whether a number is prime efficiently, stopping as soon as the answer is known.
'''

[[unit.step]]
kind = "concept"
id = "sw-u05-c1-loops"
title = "Repetition with loops"
points = 5
difficulty = 5
intro = '''
A loop is a jump backwards in the program: after the block runs, control returns to the
top and the exit condition is checked again. The number of iterations decides the running
time, which is why counting how many times a loop body runs is the first step of analysing
any algorithm.
'''
body = '''
## Counting loops

```swift
var total = 0
for n in 1...100 {
    total += n
}
print(total)   // 5050
```

The body runs once for each value of the range: 100 iterations. `n` is a new constant in
each iteration, and `total` lives outside the loop so it can accumulate.

## Condition loops

```swift
var balance = 1000.0
var years = 0
while balance < 2000 {
    balance *= 1.05
    years += 1
}
print(years)   // 15
```

Here nobody knows the number of iterations in advance; the loop runs until its condition
becomes false. `repeat { ... } while condition` is the same idea with the test at the end,
so the body always runs at least once.

## Steering a loop

- `continue` jumps straight to the next iteration.
- `break` leaves the loop at once, which is how you stop searching once you have found the
  answer.

## Counting the work

If a loop over `1...n` does a fixed amount of work per iteration, the total work grows in
proportion to `n`; computer scientists write that as **O(n)**. A loop that can stop at the
square root of `n` does only about √n iterations, which for a billion is about 31,623
instead of a billion. Choosing *when to stop* is often the biggest optimisation available.
'''

