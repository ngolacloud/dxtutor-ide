  "Prints `10 4`.",
]
explanation = '''
In the open 3 × 4 grid every path makes 2 moves down and 3 moves right in some order, so there
are C(5, 2) = 10 paths, and the table reaches 10 in its corner. The wall at row 1, column 1
keeps a 0, which blocks every path through it; the bottom row then accumulates 1, 1, 2, 4, so
the program prints `10 4`. The table has rows × cols cells, each filled in O(1), so the cost is
O(rows · cols) time and space, with no recursion at all. The naive recursion would branch twice
per step and revisit cells exponentially often.
'''

[[unit.step]]
kind = "challenge"
id = "sw-u34-x1-edit-distance"
title = "Edit distance"
points = 40
difficulty = 34
entry = "editDistance"
intro = '''
The edit (Levenshtein) distance between two strings is the fewest single-character insertions,
deletions and substitutions that turn one into the other. Spell checkers, diff tools and DNA
alignment all build on it, and it is the classic two-dimensional dynamic programming problem.
'''
instructions = '''
## Your turn

Implement `editDistance`:

```swift
func editDistance(_ a: String, _ b: String) -> Int
```

Return the minimum number of single-character edits that turn `a` into `b`. The allowed edits
are **insert** a character, **delete** a character, and **substitute** one character for
another, each costing 1.

Rules:

- Compare `Character`s, what a reader sees as one letter, not bytes or code units: `"café"`
  and `"cafe"` are at distance 1, and `"🙂🙂"` and `"🙂"` too.
- Strings can be 2,000 characters long. The plain recursion is exponential, so use a DP table
  (or a memo) that solves each pair of prefixes once.
- Prefer loops to recursion: 2,000 + 2,000 nested calls is deep enough to worry about.

Let `d[i][j]` be the distance between the first `i` characters of `a` and the first `j` of `b`:

- `d[i][0] = i` and `d[0][j] = j` (delete or insert everything);
- if the `i`-th and `j`-th characters are equal, `d[i][j] = d[i-1][j-1]`;
- otherwise `d[i][j] = 1 + min(d[i-1][j-1], d[i-1][j], d[i][j-1])`
  (substitute, delete, insert).

Examples:

- `editDistance("kitten", "sitting")` is 3 (k→s, e→i, insert g).
- `editDistance("", "abc")` is 3, and `editDistance("swift", "swift")` is 0.
- `editDistance("ab", "ba")` is 2.

**Hint:** convert each string once with `Array(a)`, so you can index Characters in O(1). Each
row of the table needs only the row above it, so two rows are enough.

Hidden tests decide correctness.
'''
starter = '''
/// Returns the Levenshtein distance between `a` and `b`: the fewest single-character
/// insertions, deletions and substitutions that turn `a` into `b`.
/// Compare Characters (what a reader sees as one letter), not bytes.
func editDistance(_ a: String, _ b: String) -> Int {
    fatalError("not implemented")
}
'''
tests = '''
func naive(_ a: [Character], _ b: [Character]) -> Int {
    if a.isEmpty { return b.count }
    if b.isEmpty { return a.count }
    if a[0] == b[0] { return naive(Array(a.dropFirst()), Array(b.dropFirst())) }
    return 1 + min(naive(Array(a.dropFirst()), b),
                   naive(a, Array(b.dropFirst())),
                   naive(Array(a.dropFirst()), Array(b.dropFirst())))
}

test("empty strings") {
    self.equal(editDistance("", ""), 0)
    self.equal(editDistance("", "abc"), 3)
    self.equal(editDistance("abcd", ""), 4)
}

test("equal strings cost nothing") {
    self.equal(editDistance("swift", "swift"), 0)
    self.equal(editDistance("a", "a"), 0)
}

test("classic examples") {
    self.equal(editDistance("kitten", "sitting"), 3)
    self.equal(editDistance("flaw", "lawn"), 2)
    self.equal(editDistance("intention", "execution"), 5)
    self.equal(editDistance("a", "b"), 1)
    self.equal(editDistance("ab", "ba"), 2)
}

test("the distance is symmetric") {
    for (x, y) in [("sunday", "saturday"), ("abc", "yabd"), ("", "q")] {
        self.equal(editDistance(x, y), editDistance(y, x))
    }
    self.equal(editDistance("sunday", "saturday"), 3)
}

test("counts Characters, not bytes") {
    self.equal(editDistance("café", "cafe"), 1)
    self.equal(editDistance("naïve", "naive"), 1)
    self.equal(editDistance("🙂🙂", "🙂"), 1)
    self.equal(editDistance("e\u{301}", "é"), 0)
}

test("agrees with the plain recursion on short strings") {
    let words = ["", "a", "ab", "abc", "acb", "bca", "aab", "abab", "baba", "cabbage"]
    for x in words {
        for y in words {
            self.equal(editDistance(x, y), naive(Array(x), Array(y)))
        }
    }
}

test("two 2,000-character strings in O(m·n)") {
    let x = String(repeating: "abcde", count: 400)
    let y = String(repeating: "abdce", count: 400)
    let start = Date()
    self.equal(editDistance(x, y), 800)
    self.equal(editDistance(x, x), 0)
    self.equal(editDistance(x, ""), 2000)
    self.expect(Date().timeIntervalSince(start) < 3.0, "the table should be filled in O(m·n)")
}
'''

[unit.step.gabarito]
solution = '''
/// Returns the Levenshtein distance between `a` and `b`: the fewest single-character
/// insertions, deletions and substitutions that turn `a` into `b`.
func editDistance(_ a: String, _ b: String) -> Int {
    let s = Array(a), t = Array(b)
    if s.isEmpty { return t.count }
    if t.isEmpty { return s.count }
    var previous = Array(0...t.count)
    var current = [Int](repeating: 0, count: t.count + 1)
    for i in 1...s.count {
        current[0] = i
        for j in 1...t.count {
            if s[i - 1] == t[j - 1] {
                current[j] = previous[j - 1]
            } else {
                current[j] = 1 + min(previous[j - 1], previous[j], current[j - 1])
            }
        }
        swap(&previous, &current)
    }
    return previous[t.count]
}
'''
time = "O(m · n)"
space = "O(m + n)"
justification = '''
There are (m + 1) × (n + 1) subproblems, one per pair of prefix lengths, and each is filled in
O(1) from three neighbours that were already computed, so the time is **O(m · n)**: about four
million cell updates for two 2,000-character strings, which takes milliseconds at `-O`.
Converting both strings to `[Character]` costs O(m + n) and makes every character comparison
an O(1) array access instead of a walk through the string.

Row `i` of the table depends only on row `i - 1`, so the solution keeps just two rows and swaps
them after each pass. Together with the two character arrays, that makes the extra space
**O(m + n)** instead of O(m · n) for the full table. (Making `b` the shorter string would cut
the rows to O(min(m, n)).)

The recurrence is correct because an optimal edit sequence must end in one of four ways: the
last characters match and cost nothing, or the last step is a substitution, a deletion from `a`
or an insertion into `a`. Taking the minimum over those cases, with the empty-prefix base cases,
gives the optimum. The plain recursion explores the same subproblems exponentially many times;
the table solves each exactly once, and the loops keep the stack depth constant.
'''
