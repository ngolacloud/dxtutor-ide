print the values.

**Why:** deciding between `let` and `var` is the first design choice in almost every Swift
line you will write. Notice which names change and which don't.
'''
target = '''
let name = "Ada"
let birthYear = 1815
var score = 10

print(name, "was born in", birthYear)
print("starting score:", score)

score = score + 5
score += 20
score -= 3
print("final score:", score)

let pi = 3.14159
let isLearning = true
print("pi is about", pi, "and learning is", isLearning)
'''
line_comments = [
  "A constant holding a string. It never changes, so `let` is the right choice.",
