    let r = splitBill(totalCents: 999, people: 1, tipPercent: 15)
    self.equal(r.each, 1148)
    self.equal(r.leftover, 0)
}
test("tip and leftover together") {
    let r = splitBill(totalCents: 1234, people: 5, tipPercent: 10)
    self.equal(r.each, 271)
    self.equal(r.leftover, 2)
}
test("default tip is zero") {
    let a = splitBill(totalCents: 777, people: 7)
    let b = splitBill(totalCents: 777, people: 7, tipPercent: 0)
    self.equal(a.each, b.each)
    self.equal(a.leftover, b.leftover)
    self.equal(a.each, 111)
}
test("one person pays everything") {
    let r = splitBill(totalCents: 4321, people: 1)
    self.equal(r.each, 4321)
    self.equal(r.leftover, 0)
}
test("empty bill") {
    let r = splitBill(totalCents: 0, people: 5, tipPercent: 20)
    self.equal(r.each, 0)
    self.equal(r.leftover, 0)
}
test("more people than cents") {
    let r = splitBill(totalCents: 2, people: 5)
    self.equal(r.each, 0)
    self.equal(r.leftover, 2)
}
test("shares and leftover add back up") {
    let (each, leftover) = splitBill(totalCents: 98_765, people: 12, tipPercent: 18)
    self.equal(each * 12 + leftover, 98_765 + 98_765 * 18 / 100)
    self.expect(leftover >= 0 && leftover < 12, "leftover must be smaller than the number of people")
}
'''

[unit.step.gabarito]
solution = '''
// Split a bill between `people` diners (people is always at least 1).
// The tip is totalCents * tipPercent / 100, rounded down, and is added to the bill.
// Return how many whole cents each person pays and how many cents are left over.
func splitBill(totalCents: Int, people: Int, tipPercent: Int = 0) -> (each: Int, leftover: Int) {
    let tip = totalCents * tipPercent / 100
    let total = totalCents + tip
    return (total / people, total % people)
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function performs a fixed sequence of integer operations: one multiplication and one
division for the tip, one addition, and one division and one remainder for the split.
Whatever the size of the bill or the number of people, that is the same handful of
operations on fixed-width integers, so the time is **O(1)**. It stores two local constants
and returns a two-element tuple, so the space is **O(1)** as well.

Correctness rests on the definition of integer division: for a positive divisor,
`total == (total / people) * people + total % people`, with the remainder between 0 and
`people - 1`. That is exactly "everyone pays `each`, and `leftover` cents remain", which is
what the last test checks. Working in whole cents avoids floating-point rounding entirely;
computing the tip as `totalCents * tipPercent / 100` multiplies first so the rounding down
happens once, at the end, rather than losing precision in `tipPercent / 100`, which would be
0 for every tip below 100%.
'''

