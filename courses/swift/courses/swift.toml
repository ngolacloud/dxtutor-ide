[[unit.step]]
kind = "challenge"
id = "sw-u14-x1-event-emitter"
title = "An event emitter"
points = 30
difficulty = 14
entry = "EventEmitter"
intro = '''
The **observer pattern** lets parts of a program react to events without the event source
knowing who is listening. An event emitter is its simplest form: it stores escaping handler
closures per event name and calls them when the event fires, which is how UI toolkits, Node.js
and many game engines deliver events.
'''
instructions = '''
## Your turn

Complete the class `EventEmitter`. Handlers are closures of type `(String) -> Void` that
receive the event's payload.

```swift
final class EventEmitter {
    init()
    func on(_ event: String, _ handler: @escaping (String) -> Void) -> Int
    func once(_ event: String, _ handler: @escaping (String) -> Void) -> Int
    func off(_ token: Int) -> Bool
    func emit(_ event: String, _ payload: String) -> Int
    func listenerCount(_ event: String) -> Int
}
```

- `on` registers `handler` for `event` and returns a **token** that identifies it. Tokens are
  unique across all events and never reused, even after `off`.
- `once` does the same, but the handler is removed as soon as the event is emitted, before it
  runs, so it runs at most once even if it emits the same event again.
- `off` removes the handler with that token and returns `true`; it returns `false` if no such
  handler is registered (unknown token, already removed, or a `once` handler that has fired).
- `emit` calls the event's handlers **in registration order** with `payload` and returns how
  many it called. It works on a **snapshot** taken when it starts: a handler registered while
  `emit` is running is not called by that `emit`.
- `listenerCount` returns how many handlers are currently registered for `event`.

Add whatever stored properties you need; keep the method signatures (the
`@discardableResult` attributes in the starter let callers ignore the returned values).

Example:

```swift
let bus = EventEmitter()
var log: [String] = []
bus.on("save") { log.append("saved \($0)") }
bus.once("save") { _ in log.append("first save") }
bus.emit("save", "a.txt")   // 2; log: ["saved a.txt", "first save"]
bus.emit("save", "b.txt")   // 1
```

**Hint:** store a small struct per handler (token, a `once` flag and the closure) in a
`[String: [Listener]]` dictionary, plus a counter for the next token. A second dictionary from
token to event name makes `off` find the right list quickly.

Hidden tests decide correctness.
'''
starter = '''
final class EventEmitter {
    // Add the stored properties you need (the handlers must be stored: they escape).

    init() {}

    // Register handler for event and return a new token (unique, never reused).
    @discardableResult
    func on(_ event: String, _ handler: @escaping (String) -> Void) -> Int {
        fatalError("not implemented")
    }

    // Like on, but the handler is removed the first time the event is emitted.
    @discardableResult
    func once(_ event: String, _ handler: @escaping (String) -> Void) -> Int {
        fatalError("not implemented")
    }

    // Remove the handler with this token. Return false if no such handler is registered.
    @discardableResult
    func off(_ token: Int) -> Bool {
        fatalError("not implemented")
    }

    // Call the event's handlers in registration order with payload; return how many ran.
    // Work on a snapshot taken when emit starts.
    @discardableResult
    func emit(_ event: String, _ payload: String) -> Int {
        fatalError("not implemented")
    }

    // How many handlers are currently registered for event.
    func listenerCount(_ event: String) -> Int {
        fatalError("not implemented")
    }
}
'''
tests = '''
test("handlers run in registration order with the payload") {
    let bus = EventEmitter()
    var log: [String] = []
    bus.on("save") { log.append("a:\($0)") }
    bus.on("save") { log.append("b:\($0)") }
    bus.on("load") { log.append("c:\($0)") }
    self.equal(bus.emit("save", "doc1"), 2)
    self.equal(log, ["a:doc1", "b:doc1"])
    self.equal(bus.emit("load", "x"), 1)
    self.equal(log, ["a:doc1", "b:doc1", "c:x"])
}
test("emitting an event nobody listens to does nothing") {
    let bus = EventEmitter()
    self.equal(bus.emit("ghost", ""), 0)
    self.equal(bus.listenerCount("ghost"), 0)
}
test("handlers keep captured state between emits") {
    let bus = EventEmitter()
    var total = 0
    bus.on("add") { total += Int($0) ?? 0 }
    bus.emit("add", "5")
    bus.emit("add", "7")
    bus.emit("add", "oops")
    self.equal(total, 12)
}
test("tokens are unique across events") {
    let bus = EventEmitter()
    let tokens = [bus.on("a") { _ in }, bus.on("b") { _ in }, bus.once("a") { _ in }, bus.on("a") { _ in }]
    self.equal(Set(tokens).count, 4)
    self.equal(bus.listenerCount("a"), 3)
    self.equal(bus.listenerCount("b"), 1)
}
test("off removes exactly one handler") {
    let bus = EventEmitter()
    var log: [String] = []
    let first = bus.on("tick") { _ in log.append("first") }
    bus.on("tick") { _ in log.append("second") }
    self.expect(bus.off(first), "off must report a removed handler")
    self.expect(!bus.off(first), "a token can be removed only once")
    self.expect(!bus.off(9_999), "unknown tokens report false")
    self.equal(bus.emit("tick", ""), 1)
    self.equal(log, ["second"])
    self.equal(bus.listenerCount("tick"), 1)
}
test("once handlers run a single time") {
    let bus = EventEmitter()
    var log: [String] = []
    let token = bus.once("ready") { log.append("once:\($0)") }
    bus.on("ready") { log.append("always:\($0)") }
    self.equal(bus.emit("ready", "1"), 2)
    self.equal(bus.emit("ready", "2"), 1)
    self.equal(log, ["once:1", "always:1", "always:2"])
    self.expect(!bus.off(token), "a fired once-handler is already gone")
}
test("tokens are never reused after off") {
    let bus = EventEmitter()
    let a = bus.on("e") { _ in }
    bus.off(a)
    let b = bus.on("e") { _ in }
    self.expect(a != b, "a new handler must get a new token")
}
test("emit works on a snapshot") {
    let bus = EventEmitter()
    var calls = 0
    bus.on("grow") { _ in
        calls += 1
        bus.on("grow") { _ in calls += 100 }
    }
    self.equal(bus.emit("grow", ""), 1)
    self.equal(calls, 1)
    self.equal(bus.listenerCount("grow"), 2)
}
test("a once handler that re-emits does not run twice") {
    let bus = EventEmitter()
    var runs = 0
    bus.once("ping") { _ in
        runs += 1
        bus.emit("ping", "again")
    }
    bus.emit("ping", "first")
    self.equal(runs, 1)
}
test("many handlers") {
    let bus = EventEmitter()
    var sum = 0
    var tokens: [Int] = []
    for i in 1...2_000 {
        tokens.append(bus.on("n") { _ in sum += i })
    }
    for token in tokens.prefix(1_000) {
        bus.off(token)
    }
    self.equal(bus.emit("n", ""), 1_000)
    self.equal(sum, (1_001...2_000).reduce(0, +))
}
'''

[unit.step.gabarito]
solution = '''
final class EventEmitter {
    private struct Listener {
        let token: Int
        let once: Bool
        let handler: (String) -> Void
    }

    private var listeners: [String: [Listener]] = [:]
    private var eventOfToken: [Int: String] = [:]
    private var nextToken = 1

    init() {}

    private func register(_ event: String, once: Bool, _ handler: @escaping (String) -> Void) -> Int {
        let token = nextToken
        nextToken += 1
        listeners[event, default: []].append(Listener(token: token, once: once, handler: handler))
        eventOfToken[token] = event
        return token
    }

    @discardableResult
    func on(_ event: String, _ handler: @escaping (String) -> Void) -> Int {
        register(event, once: false, handler)
    }

    @discardableResult
    func once(_ event: String, _ handler: @escaping (String) -> Void) -> Int {
        register(event, once: true, handler)
    }

    @discardableResult
    func off(_ token: Int) -> Bool {
        guard let event = eventOfToken.removeValue(forKey: token) else { return false }
        listeners[event]?.removeAll { $0.token == token }
        return true
    }

    @discardableResult
    func emit(_ event: String, _ payload: String) -> Int {
        let snapshot = listeners[event] ?? []
        for listener in snapshot where listener.once {
            off(listener.token)
        }
        for listener in snapshot {
            listener.handler(payload)
        }
        return snapshot.count
    }

    func listenerCount(_ event: String) -> Int {
        listeners[event]?.count ?? 0
    }
}
'''
time = "O(1) on/once, O(h) off/emit"
space = "O(total handlers)"
justification = '''
Let `h` be the number of handlers registered for one event. `on` and `once` do one dictionary
update and one array `append`, both amortised **O(1)**. `off` finds the event through
`eventOfToken` in expected O(1), then removes the listener from that event's array with
`removeAll(where:)`, an O(h) scan that shifts the survivors left. `emit` copies the event's
array once (O(h)), removes the `once` handlers (O(h) each, so O(h²) only in the unusual case
where every handler is a `once`), and calls each handler: **O(h)** plus the handlers' own work.
`listenerCount` is O(1). The emitter stores every live handler once in `listeners` and once in
`eventOfToken`, so the space is **O(total handlers)**.

The snapshot is what keeps `emit` predictable. Iterating over a copy means a handler can call
`on`, `off` or even `emit` on the same emitter without corrupting the loop, and Swift's arrays,
being value types, make the copy cheap: it shares storage until one side is mutated
(copy-on-write). Removing `once` handlers **before** calling anything is what stops a `once`
handler that re-emits its own event from running twice.

Every handler parameter is `@escaping` because it is stored in a property and called after
`on` has returned. That also means each handler keeps alive everything it captures; a handler
that captures the emitter itself forms a retain cycle, which unit 27 shows how to break with
`[weak self]`.
'''

# ══ sw-u15-errors ══════════════════════════════════════════════════════════

[[unit]]
id = "sw-u15-errors"
title = "Error handling: throws, do/catch, typed throws and Result"
level = "intermediate"
difficulty = 15
intro = '''
Some operations fail for reasons the caller should handle: a file is missing, a number doesn't
parse, a balance is too low. Swift makes every function that can fail say so with `throws`,
and makes every caller acknowledge it with `try`. You will throw and catch errors, use `try?`
and `defer`, declare typed throws and `Result`, then write a configuration parser that reports
exactly what went wrong.
'''
concepts = '''
## The idea

Optionals say "there may be no value". Errors say **why** there is no value, so the caller can
react: retry, show a message, or pass the problem up. Swift's error handling is built so that a
failure can never be silently ignored. A function that can fail is marked `throws`, and every
call to it is marked `try`, so the possible failure points are visible right in the code.

Swift errors are not exceptions that unwind through arbitrary code. A `throw` simply returns
an error value to the caller through a separate path, and it costs about the same as a normal
return.

## How Swift does it

Any type that conforms to the empty `Error` protocol can be thrown. Enums are the usual
choice, because each case names one failure and can carry details:

```swift
enum LoginError: Error {
    case unknownUser(String)
    case wrongPassword(attemptsLeft: Int)
}

func login(_ user: String, _ password: String) throws -> Session { ... }
```

- `do { try ... } catch { ... }` handles errors. `catch` clauses can match patterns, like
  `catch LoginError.wrongPassword(let left)`, and a final plain `catch` receives any other error
  as a constant named `error`.
- `try?` turns a throwing call into an optional: the value on success, `nil` on any error.
- `try!` asserts that the call cannot fail, and crashes the program if it does. Use it only
  when a failure would be a programmer mistake.
- `defer { ... }` schedules code to run when the current scope exits, however it exits: a
  normal return, a `throw` or a `break`.
- **Typed throws** (Swift 6) name the one error type a function can throw:
  `func parse(_ s: String) throws(ParseError) -> Int`. Inside, `throw .empty` is enough, and a
  `catch` around it receives a `ParseError` instead of `any Error`. In a closure, write the type
  on the block: `do throws(ParseError) { ... }`.
- `Result<Success, Failure>` stores either outcome as a value, with cases `.success(value)` and
  `.failure(error)`. It is useful when an outcome must be stored, compared or passed along
  instead of handled right away. `get()` turns it back into a throwing call.

```swift
let r: Result<Int, ParseError> = .failure(.empty)
```

## What is special or tricky

- Calling a throwing function without `try` fails with `call can throw, but it is not marked
  with 'try' and the error is not handled`. Using `try` outside a `do` in a non-throwing
  function gives `errors thrown from here are not handled`.
- An untyped `catch` only sees `any Error`. To read your own cases, match a pattern or use
  typed throws.
- `try?` discards the reason for the failure. Use it when "it failed" is all you need.
- In a `throws(E)` function you can only throw `E`; throwing another type is a compile error.
- `defer` blocks run in reverse order of declaration, last one first.

## What you will practise

You will catch specific error cases, collapse failures with `try?`, watch `defer` run last, and
convert between typed throws and `Result`. The challenge parses a server configuration file and
reports the first problem as a precise, typed error.
'''

[[unit.step]]
kind = "concept"
id = "sw-u15-c1-throwing"
title = "Throwing, catching and the cost of ignoring"
points = 5
difficulty = 15
intro = '''
Error handling is a contract between a function that can fail and its callers. Swift encodes
that contract in the function's type, so the compiler can check that every failure is either
handled or explicitly passed on.
'''
body = '''
## Throwing

A function that can fail adds `throws` before its return arrow and uses `throw` to stop with
an error:

```swift
enum AgeError: Error { case negative, tooLarge(Int) }

func checkAge(_ n: Int) throws -> Int {
    if n < 0 { throw AgeError.negative }
    if n > 150 { throw AgeError.tooLarge(n) }
    return n
}
```

## Catching

Calls are marked with `try`, inside a `do` block whose `catch` clauses handle the errors:

```swift
do {
    let age = try checkAge(200)
    print("ok", age)
} catch AgeError.tooLarge(let n) {
    print(n, "is too large")
} catch {
    print("other error:", error)
}
```

The first `catch` whose pattern matches wins. The last, plain `catch` handles everything else,
so this `do` is complete.

## Passing errors on

A function that doesn't want to handle an error can mark itself `throws` and simply `try` the
call: the error travels on to *its* caller. Errors move up the call stack only through
functions that admit they throw.

## Three ways to say "I don't care how"

- `try?` gives an optional: `let age = try? checkAge(-1)` is `nil`.
- `try!` crashes on an error. Reserve it for calls that truly cannot fail.
- `Result` stores the outcome as a value to inspect later.

Choosing between `throws`, an optional and `Result` is a design decision: throw when callers
need the reason, return an optional when "no value" says it all.
'''

