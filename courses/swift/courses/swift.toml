[[unit]]
id = "sw-u30-linked-list"
title = "Singly linked lists"
level = "advanced"
difficulty = 30
intro = '''
A linked list stores each value in its own node object that points to the next one, so a
sequence becomes a chain of references instead of one contiguous block of memory. You will
define a generic `Node<T>` class, push and pop at the head, keep a tail reference for O(1)
appends, free a million nodes without blowing the stack, and finish with a complete
`SinglyLinkedList<T>` that deletes and reverses in place.
'''
concepts = '''
## The idea

A **linked list** stores a sequence as a chain of **nodes**. Each node holds a value and a **reference** to the next node, and the last node refers to nothing. The list itself is a reference to the first node, the **head**. Nothing is contiguous: the nodes live anywhere on the heap, connected only by references.

That layout trades one set of costs for another. Compared with a Swift `Array`, which is one contiguous buffer:

- **Insert or remove at the head: O(1).** You rewire one reference. `array.insert(x, at: 0)` must shift every element, which is O(n).
- **Insert after a node you already hold: O(1)**, for the same reason.
- **Access by index and search: O(n).** You must walk from the head; no arithmetic jumps to element *i*.
- **Append at the tail: O(n)**, unless you also keep a reference to the last node.

In everyday Swift, `Array` wins: it is cache-friendly and its appends are amortised O(1). Linked lists still matter. They teach reference-based structures, trees and graphs are built from the same kind of node, and "rewire two references" is the trick behind LRU caches and schedulers.

## How Swift does it

A node must be a **class**. A struct cannot contain a stored property of its own type, because a value would have to contain itself (`error: value type 'Node' cannot have a stored property that recursively contains it`). A class property is a reference, so the chain is fine. An `Optional` marks the end:

```swift
final class Node<T> {
    var value: T
    var next: Node<T>?
    init(_ value: T, next: Node<T>? = nil) {
        self.value = value
        self.next = next
    }
}
```

Walking the list is a `while let` loop that follows `next` until it is `nil`:

```swift
var node = head
while let current = node {
    print(current.value)
    node = current.next
}
```

There is no `free`. **ARC** counts the references to each node and destroys it, running its `deinit`, the moment the count reaches zero. Unlinking a node is therefore enough to delete it.

## What is special or tricky

- **Force-unwrapping `next` past the end** (`head!.next!.value`) traps with `Unexpectedly found nil while unwrapping an Optional value`. Use `if let`, `guard let` or `while let`.
- **Order of rewiring matters.** Overwrite `node.next` before saving it and the rest of the chain is released at once. Save the successor in a local first.
- **Releasing a long chain recurses.** When the head dies it releases the second node, which releases the third, and so on: one nested call per node. A million nodes can overflow the stack and crash. Long-lived lists free their nodes in a loop in `deinit`.
- **Identity versus equality.** `===` asks "the same node object?"; `==` compares values and needs `Equatable`.
- A wrapper class with a `count` property keeps the length O(1) instead of a walk.

## What you will practise

You will push and pop at the head, wrap the nodes in a list class with a tail and a counter, and free a million-node list iteratively. The challenge is a full generic `SinglyLinkedList<T>`: O(1) pushes and pops, removal by predicate, and in-place reversal, tested on 100,000 nodes.
'''

