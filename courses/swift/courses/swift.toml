## Your turn

The starter declares the error type and the result (don't change them):

```swift
enum ConfigError: Error, Equatable {
    case malformedLine(Int), emptyKey(Int), duplicateKey(String)
    case missingKey(String), invalidPort(String), invalidBool(String)
