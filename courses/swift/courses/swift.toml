intro = '''
When the number of iterations depends on the data, you loop on a condition. The **Collatz
sequence** (halve even numbers, map odd `n` to `3n + 1`) is famous because nobody has proved
it always reaches 1, so only a `while` loop can follow it. `break` and `continue` give you
