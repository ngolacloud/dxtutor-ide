[[unit]]
id = "sw-u07-optionals"
title = "Optionals: values that might be missing"
level = "intermediate"
difficulty = 7
intro = '''
Swift has no null references that crash at random. A value that might be absent has an
**optional** type, such as `Int?` or `String?`, and the compiler makes you handle the missing
case before you can use the value. You will unwrap optionals with `if let` and `guard let`,
supply defaults with `??`, reach through them with optional chaining, and learn why `!` is a
promise you should rarely make.
'''
concepts = '''
## The idea

Many operations cannot always produce a value. Converting `"seven"` to a number fails, looking
up a missing key in a dictionary finds nothing, and an empty array has no largest element.
Older languages return a special value such as `null`, `-1` or `NaN` and trust you to check
for it. Forgetting that check is one of the most common bugs in software.

Swift puts the possibility of absence into the **type**. An `Int` always holds an integer. An
`Int?` (read "optional Int") holds either an integer or `nil`. They are different types, so
you cannot add 1 to an `Int?` by accident: the compiler stops you until you have dealt with
`nil`.

## How Swift does it

`Int?` is shorthand for `Optional<Int>`, an ordinary enum with two cases, `.some(value)` and
`.none`. `nil` is just `.none`. Many standard APIs return optionals:

```swift
let port = Int("8080")         // Int?, holds 8080
let bad = Int("80a")           // Int?, holds nil
let first = [String]().first   // String?, holds nil
```

To use the value you **unwrap** the optional:

- `if let n = port { ... }` runs the block only when there is a value, with `n` bound as a
  plain `Int`. The short form `if let port { ... }` reuses the same name.
- `guard let n = port else { return }` leaves early when the value is missing, and `n` stays
  available for the rest of the function. It keeps the main path unindented.
- `port ?? 80` is the **nil-coalescing** operator: the value if present, otherwise the default.
- `user?.address?.city` is **optional chaining**. Each `?.` continues only when the left side
  has a value, and the whole expression becomes `nil` as soon as one link is missing. The
  result is always optional.

## Pitfalls and compiler errors

- **"Value of optional type 'Int?' must be unwrapped to a value of type 'Int'"** is the error
  you will meet most. You used an optional where a plain value is needed. Unwrap it; don't
  silence it with `!`.
- **Force unwrapping** with `!` says "I promise this is not nil". If you are wrong, the program
  traps with *Unexpectedly found nil while unwrapping an Optional value*, and in this course's
  tests a trap ends the whole run. Use `!` only when nil is impossible by construction.
- **Printing an optional** shows `Optional(42)` and warns *expression implicitly coerced from
  'Int?' to 'Any'*. Unwrap first, or use `String(describing:)` when you want the wrapper.
- **`if let` scope.** A name bound by `if let` exists only inside its braces. Use `guard let`
  when you need the value afterwards.
- **Implicitly unwrapped optionals** (`String!`) exist for a few framework patterns. Avoid them
  in your own code: they are a hidden `!`.

## What you will practise

You will parse text with `if let` and `guard let`, combine `??` with optional chaining on
dictionary lookups, look at `Optional` as the enum it really is with `switch`, `map` and
`flatMap`, and then average a list of messy sensor readings, skipping every value that is
missing or invalid.
'''

[[unit.step]]
kind = "concept"
id = "sw-u07-c1-optional-type"
title = "Optional is a type, not a convention"
points = 5
difficulty = 7
intro = '''
An optional wraps a value that may be absent. Because `Int?` and `Int` are different types,
the compiler can prove that every missing value is handled before it is used: absence becomes
a compile-time question instead of a run-time crash.
'''
body = '''
## Two types, not one

```swift
let typed = "42"
let number: Int? = Int(typed)
```

`Int(typed)` cannot promise success, so it returns `Int?`. To use the integer inside, you must
unwrap it, and every way of unwrapping makes you say what happens when there is nothing:

```swift
if let number {
    print(number + 1)        // number is a plain Int here
} else {
    print("not a number")
}

let safe = number ?? 0       // a default when nil
```

## What an optional really is

Under the hood, `Int?` is `Optional<Int>`, an enum from the standard library:

```swift
enum Optional<Wrapped> {
    case none
    case some(Wrapped)
}
```

`nil` is how you write `.none`, and Swift wraps a plain value in `.some` for you whenever an
optional is expected. That is why you can assign `5` to an `Int?`, but not an `Int?` to an
`Int`.

## Choosing the right tool

- `if let`: do something only when the value exists.
- `guard let`: leave early when it doesn't, and keep the value for the rest of the scope.
- `??`: fall back to a sensible default.
- `?.`: call a method or read a property only when there is a value. The result is optional.
- `!`: trap if nil. A last resort, for values that cannot be nil.

The drills practise each of these, and the challenge combines them on messy input.
'''

