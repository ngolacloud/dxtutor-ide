instructions = '''
## Your turn

Implement a `Document` struct with value semantics and copy-on-write storage:

```swift
struct Document {
    init(lines: [String] = [])
    var lines: [String] { get }
    var revision: Int { get }
    var storageID: ObjectIdentifier { get }
    mutating func append(_ line: String)
    mutating func replace(at index: Int, with line: String) -> Bool
}
```

Rules:

- Keep the state (the lines and the revision) in a **class instance** (the starter has an
  empty `DocumentStorage` class for you to fill). `storageID` is `ObjectIdentifier` of that
  instance.
- `revision` starts at 0 and goes up by 1 on every **successful** mutation. A copy starts
  with the revision of the value it was copied from.
- Copying a `Document` must not copy the storage: right after `var b = a`,
  `a.storageID == b.storageID`.
- Before mutating, copy the storage **only if it is shared**
  (`isKnownUniquelyReferenced`). After a mutation of a shared value, the two values have
  different storage, and the other one still has its old lines and revision.
- A mutation of a **uniquely owned** document must keep its storage: `storageID` doesn't
  change.
- `replace(at:with:)` returns `false` and changes nothing when `index` is out of range,
  including negative indices: no revision bump, no copy, no crash. Otherwise it replaces the
  line and returns `true`.

Example:

```swift
var a = Document(lines: ["hello"])
var b = a                  // a.storageID == b.storageID
b.append("world")          // b gets its own storage
// a.lines == ["hello"], a.revision == 0
// b.lines == ["hello", "world"], b.revision == 1
```

**Hint:** write one `private mutating func makeUnique()` and call it from both mutating
methods, after the bounds check in `replace`.

Hidden tests decide correctness.
'''
