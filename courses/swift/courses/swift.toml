instructions = '''
## Your turn

Implement the methods of the generic class `SinglyLinkedList<T>`:

```swift
final class SinglyLinkedList<T> {
    private(set) var head: Node<T>?
    private(set) var tail: Node<T>?
    private(set) var count: Int
    var isEmpty: Bool
    func pushFront(_ value: T)
    func append(_ value: T)
    func popFront() -> T?
    func removeAll(where shouldRemove: (T) -> Bool) -> Int
    func reverse()
    func toArray() -> [T]
}
```

The `Node<T>` class, the stored properties and the iterative `deinit` are provided in the
starter; don't change them.

Rules:

- `pushFront`, `append` and `popFront` are **O(1)**. `popFront` returns `nil` on an empty list.
- `head`, `tail` and `count` must be correct after **every** call: `tail` is the last node
  (its `next` is `nil`), and both are `nil` when the list is empty.
- `removeAll(where:)` unlinks every matching node in **one pass** and returns how many it
  removed. Matches can be at the head, in the middle, at the tail, or everywhere.
- `reverse()` works **in place**: rewire the existing nodes, create none, and don't change
  any `value`. The old head becomes the new tail.
- Lists can have 100,000 nodes, so every operation must be at most O(n), and loops are safer
  than recursion.

