[unit.step.gabarito]
solution = '''
enum Instruction: Equatable {
    case push(Int)
    case add
    case subtract
    case multiply
    case negate
    case duplicate
    case swap
    case pop
}

/// Pops b (the top) and a (below it) and pushes op(a, b).
/// Returns false, leaving the stack alone, when it holds fewer than two values.
private func applyBinary(_ stack: inout [Int], _ op: (Int, Int) -> Int) -> Bool {
    guard stack.count >= 2 else { return false }
    let b = stack.removeLast()
    let a = stack.removeLast()
    stack.append(op(a, b))
    return true
}

func execute(_ program: [Instruction]) -> [Int]? {
    var stack: [Int] = []
    for instruction in program {
        switch instruction {
        case .push(let value):
            stack.append(value)
        case .add:
            guard applyBinary(&stack, +) else { return nil }
        case .subtract:
            guard applyBinary(&stack, -) else { return nil }
        case .multiply:
            guard applyBinary(&stack, *) else { return nil }
        case .negate:
            guard let top = stack.popLast() else { return nil }
            stack.append(-top)
        case .duplicate:
            guard let top = stack.last else { return nil }
            stack.append(top)
        case .swap:
            guard stack.count >= 2 else { return nil }
            stack.swapAt(stack.count - 1, stack.count - 2)
        case .pop:
            guard stack.popLast() != nil else { return nil }
        }
    }
    return stack
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the number of instructions. The loop visits each instruction once, and every case
does a constant amount of work: `append`, `removeLast`, `popLast`, `last` and `swapAt` on the
end of an array are all O(1) (`append` is amortised O(1), because the array occasionally
doubles its buffer). So the whole run is **O(n)** time. The stack can grow by at most one value
per instruction, so it holds at most `n` values: **O(n)** space.

The enum is what keeps the interpreter honest. Each `case` names one instruction, `push`
binds its payload with `let`, and because there is no `default`, adding a new instruction such
as `divide` to the enum would make the compiler reject `execute` until the new case is handled.
Checking the stack depth *before* popping (`guard stack.count >= 2`, or `guard let` on
`popLast()`) is what turns an underflow into `nil`: `removeLast()` on an empty array traps and
would crash the whole program.

`applyBinary` takes the operator as a value of type `(Int, Int) -> Int`. Swift's `+`, `-` and
`*` are ordinary functions, so they can be passed directly, and popping `b` before `a` gives
the right order for `subtract`. Real virtual machines (the JVM, WebAssembly, CPython's bytecode
loop) are built on exactly this pattern, with many more instructions.
'''

# ══ sw-u13-protocols ═══════════════════════════════════════════════════════

[[unit]]
id = "sw-u13-protocols"
title = "Protocols, extensions and protocol-oriented design"
level = "intermediate"
difficulty = 13
intro = '''
A protocol is a contract: a list of properties and methods a type promises to provide, without
saying how. With extensions you can add behaviour to any type, including ones you didn't write,
and give a protocol default implementations that every conforming type gets for free. You will
use all three, then design a checkout whose pricing rules plug in through a protocol.
'''
concepts = '''
## The idea

Code often needs "anything that can do X" rather than one specific type: anything that has an
area, anything that can be printed, anything that can compute a discount. A **protocol** names
that capability. It lists **requirements** (properties and methods) and says nothing about how
they work. Any struct, class or enum can **conform** by providing them, and code written against
the protocol works with every conforming type, including types written years later.

Swift leans on this so heavily that its style is called **protocol-oriented programming**:
instead of a deep class hierarchy, you describe small capabilities as protocols, give them
shared behaviour in **protocol extensions**, and let value types such as structs and enums adopt
whatever they need.

## How Swift does it

```swift
protocol Describable {
    var title: String { get }
    func describe() -> String
}

extension Describable {
    func describe() -> String { "<\(title)>" }
}

struct Book: Describable {
    let title: String
}
```

- `var title: String { get }` requires a readable property. A stored `let`, a stored `var` or a
  computed property all satisfy it.
- An `extension` adds methods and computed properties to an existing type. An extension of a
  **protocol** provides **default implementations**: `Book` never wrote `describe()`, yet
  `Book(title: "Dune").describe()` returns `"<Dune>"`. A type can still write its own version,
  and that one wins.
- Conformance can be added in an extension too, even to types you don't own:
  `extension Int: Describable { ... }`. Grouping each conformance in its own extension is common
  Swift style.
- A variable or array of type `any Describable` holds a value of *some* conforming type behind a
  box, an **existential**. `[any Describable]` can mix books and films. Unit 16 compares `any`
  with `some` and generics.

## What is special or tricky

- A missing requirement gives `type 'Film' does not conform to protocol 'Describable'`, and the
  compiler offers to add stubs for what is missing.
- A requirement marked `{ get set }` cannot be satisfied by a `let`.
- **Dispatch depends on whether a method is a requirement.** Requirements are looked up at run
  time, so the conforming type's own version always runs. A method that exists *only* in a
  protocol extension is chosen at compile time from the static type: through an `any
  Describable`, you get the extension's version even if the concrete type wrote one with the
  same name. Declare a method in the protocol when types are meant to customise it.
- Extensions can add methods, computed properties and conformances, but not **stored**
  properties: `extensions must not contain stored properties`.
- Protocols that mutate a struct need `mutating` in the requirement, or a struct can't satisfy
  it with a method that changes `self`.

## What you will practise

You will hold different shapes in one `[any Shape]`, give a protocol a default implementation
that one type overrides, and extend `Int` and a struct of your own with new behaviour and
standard-library conformances. The challenge is a checkout where each pricing rule is a type
that conforms to one protocol.
'''

[[unit.step]]
kind = "concept"
id = "sw-u13-c1-contracts"
title = "Protocols as contracts"
points = 5
difficulty = 13
intro = '''
A protocol separates *what* a type can do from *how* it does it. Code that depends only on the
contract can work with types it has never heard of, which is how libraries stay open to
extension without being modified.
'''
body = '''
## Requirements

A protocol lists what a conforming type must provide:

```swift
protocol Animal {
    var name: String { get }
    func sound() -> String
}
```

Any type can sign the contract by naming the protocol after a colon and implementing every
requirement:

```swift
struct Dog: Animal {
    let name: String
    func sound() -> String { "woof" }
}
```

## Programming against the contract

A function that takes `any Animal` accepts a `Dog`, a `Cat`, or a type added next year:

```swift
func introduce(_ a: any Animal) -> String {
    "\(a.name) says \(a.sound())"
}
```

The function knows only the requirements. It can't touch anything else a `Dog` happens to
have, and that restriction is the point: it depends on the smallest possible surface.

## Default behaviour

A protocol extension can implement methods for every conforming type at once:

```swift
extension Animal {
    func introduce() -> String { "\(name) says \(sound())" }
}
```

Now `Dog(name: "Rex").introduce()` works without `Dog` writing a line of it. The same idea
powers the standard library: conform to `Comparable` by writing `<`, and you get `>`, `<=`,
`>=`, `max()` and `sorted()` for free.

Protocols, extensions and value types together are Swift's preferred design tool: small
capabilities, composed as needed, rather than one deep inheritance tree.
'''

