        }
        test("equal versions hash equally") {
            let set = Set(["1.2", "1.2.0", "1.2.0.0", "2", "2.0", "1.10"].compactMap { Version($0) })
            self.equal(set.count, 3)
            var notes: [Version: String] = [:]
            if let key = Version("3.1.0") { notes[key] = "stable" }
            self.equal(Version("3.1").flatMap { notes[$0] }, "stable")
