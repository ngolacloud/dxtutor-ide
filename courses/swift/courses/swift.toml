[[unit.step]]
kind = "challenge"
id = "sw-u01-x1-greet"
title = "Implement greet"
points = 20
difficulty = 1
entry = "greet"
intro = '''
Now you apply what you learned, with one new idea: a **function** that hands a value back
with `return` instead of printing it. A function that returns can be reused anywhere, and
that is exactly how the hidden tests check it: they call it and compare the result.
'''
instructions = '''
## Your turn

Implement the function `greet`:

```swift
func greet(_ name: String) -> String
```

It takes a name and **returns** (does not print) a string that reads `Hello, <name>!`.

Examples:

- `greet("World")` → `"Hello, World!"`
- `greet("Ada Lovelace")` → `"Hello, Ada Lovelace!"`
- `greet("")` → `"Hello, !"`

How to read the signature: `name: String` says the function receives one string called
`name`, and `-> String` promises that it returns a string. The `_` in front lets callers
write `greet("World")` without naming the argument; unit 6 explains these labels. The
compiler rejects a body that forgets to return a string.

**Hint:** build the result by joining strings with `+`, and hand it back with
`return ...`. Replace the `fatalError(...)` line, which stops the program on purpose until
you do.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Return a greeting of the form "Hello, <name>!".
// Return the text; don't print it.
func greet(_ name: String) -> String {
    fatalError("not implemented")
}
'''
tests = '''
test("greets the world") { self.equal(greet("World"), "Hello, World!") }
test("greets Swift") { self.equal(greet("Swift"), "Hello, Swift!") }
test("empty name") { self.equal(greet(""), "Hello, !") }
test("name with spaces") { self.equal(greet("Ada Lovelace"), "Hello, Ada Lovelace!") }
test("accented name") { self.equal(greet("João"), "Hello, João!") }
test("one letter") { self.equal(greet("X"), "Hello, X!") }
test("emoji name") { self.equal(greet("🐦"), "Hello, 🐦!") }
test("called twice gives independent results") {
    let a = greet("A")
    let b = greet("B")
    self.equal(a, "Hello, A!")
    self.equal(b, "Hello, B!")
}
'''

[unit.step.gabarito]
solution = '''
// Return a greeting of the form "Hello, <name>!".
// Return the text; don't print it.
func greet(_ name: String) -> String {
    return "Hello, " + name + "!"
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
`+` on strings does not change `name`; it builds a brand-new string that holds the fixed
text `Hello, `, then the `n` characters of `name`, then `!`. Copying those characters is
the only real work, so both the time and the memory grow in direct proportion to the
length of the name: the time is **O(n)** and the space is **O(n)**, where `n` is the length
of `name`. There is no loop in your code; the copying happens once, inside the `+`
operations. (String interpolation, `"Hello, \(name)!"`, which unit 3 introduces, does the
same work.)
'''

[[unit]]
id = "sw-u02-variables"
title = "Constants, variables & types"
level = "basic"
difficulty = 2
intro = '''
Programs remember things by giving values names. In this unit you meet Swift's two kinds of
names, `let` constants and `var` variables, the four everyday types (`Int`, `Double`,
`Bool` and `String`), and the rule that Swift never converts between types behind your
back. You will also see what happens when a number gets too big for its type.
'''
concepts = '''
## The idea

A program needs to remember values while it runs: a score, a price, a name. A **variable**
is a name attached to a value, so you can use the value again by writing the name. Swift
draws a sharp line between names whose value never changes, **constants**, and names whose
value may be replaced later, **variables**.

## How Swift does it

`let` declares a constant and `var` declares a variable:

```swift
let birthYear = 1815     // fixed for ever
var lives = 3            // may change
lives = lives - 1        // now 2
lives += 10              // shorthand for lives = lives + 10
```

Swift prefers `let`. If a value doesn't need to change, making it a constant tells the
reader (and the compiler) that it never will, which removes a whole class of bugs.

Every value has a **type**, and the type never changes. The everyday ones are `Int` (whole
numbers), `Double` (decimal numbers), `Bool` (`true` or `false`) and `String` (text).
Usually you don't write the type: the compiler **infers** it from the value (`3` is an
`Int`, `3.0` a `Double`). You can also state it with a **type annotation**:

```swift
let price: Double = 20   // annotation turns the literal 20 into a Double
let ready: Bool = false
```

Swift never converts between types silently. To mix an `Int` with a `Double`, you convert
one of them by calling the type like a function: `Double(count)` or `Int(price)`. Turning a
`Double` into an `Int` **truncates**, cutting off the fraction towards zero.

Each integer type has a fixed range. `Int` is 64 bits on modern machines, from `Int.min` to
`Int.max` (about nine quintillion). Smaller types such as `Int8` (-128 to 127) and `UInt8`
(0 to 255) exist for special cases.

## What is special or tricky

- **Constants can't be reassigned.** `let x = 1` then `x = 2` fails with
  `cannot assign to value: 'x' is a 'let' constant`.
- **No silent conversion.** `let n: Int = 3.5` fails with
  `cannot convert value of type 'Double' to specified type 'Int'`, and multiplying an `Int`
  by a `Double` fails with `binary operator '*' cannot be applied to operands of type 'Int'
  and 'Double'`.
- **Use before set.** `var x: Int` followed by `print(x)` fails with
  `variable 'x' used before being initialized`.
- **Overflow is a crash, not a surprise number.** If arithmetic leaves the type's range,
  Swift stops the program with an arithmetic overflow trap instead of quietly producing a
  wrong value. When the compiler can see it coming, it refuses to compile:
  `integer literal '300' overflows when stored into 'UInt8'`. If you really want
  wrap-around, the **overflow operators** `&+`, `&-` and `&*` say so explicitly.
- **Integer division drops the fraction.** `7 / 2` is `3`. Convert first if you need `3.5`.

## What you will practise

You will declare constants and variables and update them, let the compiler infer types and
inspect them with `type(of:)`, convert between `Int` and `Double`, and watch overflow being
reported. The challenge asks you to compute an average that stays correct even for numbers
so large that adding them as `Int` would crash.
'''

[[unit.step]]
kind = "concept"
id = "sw-u02-c1-let-var"
title = "let, var and types"
points = 5
difficulty = 2
intro = '''
A name in a program is a label for a value stored in memory. Swift asks you to decide, when
you create the name, whether the value may ever change. The compiler then enforces that
promise and also fixes the value's type, so whole groups of mistakes are found before the
program runs.
'''
body = '''
## Two kinds of names

```swift
let city = "Lisbon"      // a constant: always "Lisbon"
var visitors = 0         // a variable: may be replaced
visitors = visitors + 1
visitors += 1            // same as visitors = visitors + 1
```

- **`let`** creates a **constant**. Once it has a value, that value stays. Trying to assign
  again is a compile-time error.
- **`var`** creates a **variable**. You can give it a new value as often as you like, but
  always of the **same type**.
- `+=`, `-=` and `*=` are shorthand: they combine the old value with a new one and store
  the result back.

Start with `let` and change it to `var` only when you really need to assign again. Swift
code reads more easily when most names are constants, because the reader knows they never
change.

## Types are fixed

Every value has a type: `Int` for whole numbers, `Double` for decimals, `Bool` for `true`
and `false`, `String` for text. The compiler **infers** the type from the first value, so
`visitors` above is an `Int`. Writing `visitors = "many"` later is an error, because a
`String` is not an `Int`.

To combine values of different types you **convert** explicitly: `Double(visitors)` makes a
`Double` from an `Int`. Swift never does this for you, so you always see where a
conversion happens and can decide whether losing a fraction is acceptable.
'''

