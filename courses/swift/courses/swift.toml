tests = '''
actor Probe {
    private(set) var calls: [String] = []
    private(set) var inFlight = 0
    private(set) var peak = 0
    func enter(_ name: String) {
        calls.append(name)
        inFlight += 1
        peak = max(peak, inFlight)
    }
    func leave() { inFlight -= 1 }
    // Waits (up to ~0.5 s, in 1 ms steps) until `count` loaders are inside at once. Loaders that
    // really overlap meet here quickly; a sequential solution only ever has one inside.
    func meet(_ count: Int) async {
        var tries = 0
        while inFlight < count && tries < 500 {
            tries += 1
            try? await Task.sleep(for: .milliseconds(1))
        }
    }
}

