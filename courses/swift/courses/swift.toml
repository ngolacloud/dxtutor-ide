[[unit]]
id = "sw-u12-enums"
title = "Enums: raw values, associated values and exhaustive switch"
level = "intermediate"
difficulty = 12
intro = '''
An enum names a closed set of choices, and Swift enums go much further than a list of
constants: every case can carry its own data, and a `switch` must handle every case. You will
use raw values, associated values and an `indirect` recursive enum, then run a small stack
machine whose instructions are enum cases.
'''
concepts = '''
## The idea

Many values in a program come from a fixed, known set: a direction is north, south, east or
west; a download is waiting, running, finished or failed. An **enumeration** (enum) is a type
whose values are exactly those choices and nothing else. Because the compiler knows the whole
list, it can check that your code handles every choice, and it rejects a typo or a forgotten
case before the program ever runs.

Swift enums are also **algebraic data types**: each case may carry **associated values**, with
different types per case. One enum can say "a circle with a radius, *or* a rectangle with a width
and a height", the kind of data other languages model with class hierarchies or tagged unions.

## How Swift does it

```swift
enum Suit: String, CaseIterable {
    case hearts = "H", spades = "S", clubs, diamonds
}

enum Payment {
    case cash
    case card(last4: String)
    case transfer(iban: String, reference: String)
}
```

- A **raw value** type (`: Int`, `: String`) gives each case a fixed literal. Swift fills in the
  ones you omit: the next integer, or the case's own name for strings (`clubs` is `"clubs"`).
  `Suit(rawValue: "H")` is a **failable initializer** that returns `Suit?`, because not every
  string names a case.
- `CaseIterable` adds `allCases`, an array of every case in declaration order.
- **Associated values** are attached when you build a value, `.card(last4: "4242")`, and taken
  apart with a pattern in `switch` or `if case`. When the type is already known, `.cash` is
  short for `Payment.cash`.

```swift
switch payment {
case .cash: print("cash")
case .card(let last4): print("card ending", last4)
case let .transfer(iban, _): print("transfer from", iban)
}
```

- A **recursive** enum, whose cases hold values of the enum itself (an expression tree), must be
  marked `indirect`. Swift then stores those payloads in a heap box, so the enum keeps a finite
  size.

## What is special or tricky

- **`switch` must be exhaustive.** Leave a case out and the compiler stops with
  `switch must be exhaustive` and offers to add the missing cases. Prefer listing your own cases
  over `default:`: when a new case is added later, the compiler then points at every switch
  that has to change.
- Raw values and associated values don't mix: `enum Planet: Int { case earth(String) }` fails
  with `enum with raw type cannot have cases with arguments`.
- `Planet(rawValue: 9)` is `nil`, not a crash. Unwrap it like any other optional.
- A recursive enum without `indirect` fails with `recursive enum 'Expr' is not marked 'indirect'`.
- Enums are **value types**, like structs. They can have methods and computed properties, and a
  method that replaces `self` must be `mutating`.

## What you will practise

You will list planets through raw values, compute areas from shapes that carry associated
values and evaluate an `indirect` expression tree. The challenge runs a tiny stack machine whose
instructions are enum cases, some with a payload and some without.
'''

[[unit.step]]
kind = "concept"
id = "sw-u12-c1-closed-sets"
title = "Cases, raw values and payloads"
points = 5
difficulty = 12
intro = '''
An enum is the type-system way to say "one of these, and nothing else". Because the set of
cases is closed, the compiler can prove that a `switch` covers every possibility, which turns a
whole family of runtime bugs into compile errors.
'''
body = '''
## Three kinds of enum

The plainest enum is a list of names:

```swift
enum Light { case red, amber, green }
```

Add a **raw value** type and every case maps to a fixed literal, which is handy for storage and
protocols that speak in numbers or strings:

```swift
enum Status: Int { case ok = 200, notFound = 404 }
Status(rawValue: 404)   // Optional(Status.notFound)
Status.ok.rawValue      // 200
```

Give cases **associated values** and each one carries its own data, chosen when the value is
built:

```swift
enum Event {
    case tap(x: Int, y: Int)
    case key(Character)
    case quit
}
let e = Event.tap(x: 3, y: 4)
```

## Taking a value apart

A `switch` matches the case and binds its payload in one move. Every case must be covered, so
the compiler catches the one you forgot:

```swift
switch e {
case let .tap(x, y): print("tap at", x, y)
case .key(let c): print("key", c)
case .quit: print("bye")
}
```

When you care about a single case, `if case .key(let c) = e { ... }` is shorter.

## Why it matters

Each case can only hold the data that makes sense for it: a `quit` event has no coordinates,
so there is no `x` to forget to check. Modelling state as an enum makes impossible states
impossible to write, and the exhaustive `switch` keeps every piece of code that reads that
state honest as the enum grows.
'''

