solution = '''
/// A node of a singly linked list (provided: do not change it).
final class Node<T> {
    var value: T
    var next: Node<T>?

    init(_ value: T, next: Node<T>? = nil) {
        self.value = value
        self.next = next
    }
}

/// A singly linked list with a head, a tail and an O(1) count.
final class SinglyLinkedList<T> {
    private(set) var head: Node<T>?
    private(set) var tail: Node<T>?
    private(set) var count = 0

    init() {}

    /// Provided: frees long lists with a loop instead of a deep chain of deinits.
    deinit {
        var node = head
        head = nil
        tail = nil
        while let current = node {
            node = current.next
            current.next = nil
        }
    }

    var isEmpty: Bool { head == nil }

    func pushFront(_ value: T) {
        head = Node(value, next: head)
        if tail == nil { tail = head }
        count += 1
    }

    func append(_ value: T) {
        let node = Node(value)
        if let last = tail {
            last.next = node
        } else {
            head = node
        }
        tail = node
        count += 1
    }

    func popFront() -> T? {
        guard let first = head else { return nil }
        head = first.next
        if head == nil { tail = nil }
        count -= 1
        return first.value
    }

    @discardableResult
    func removeAll(where shouldRemove: (T) -> Bool) -> Int {
        var removed = 0
        var previous: Node<T>? = nil
        var node = head
        while let current = node {
            node = current.next
            if shouldRemove(current.value) {
                if let previous { previous.next = current.next } else { head = current.next }
                current.next = nil
                removed += 1
            } else {
                previous = current
            }
        }
        tail = previous
        count -= removed
        return removed
    }

    func reverse() {
        tail = head
        var previous: Node<T>? = nil
        var node = head
        while let current = node {
            node = current.next
            current.next = previous
            previous = current
        }
        head = previous
    }

    func toArray() -> [T] {
        var out: [T] = []
        out.reserveCapacity(count)
        var node = head
        while let current = node {
            out.append(current.value)
            node = current.next
        }
        return out
    }
}
'''
time = "O(1) for push, append and pop; O(n) for removeAll, reverse and toArray"
space = "O(1) extra (O(n) for the array returned by toArray)"
justification = '''
`pushFront`, `append` and `popFront` each create or unlink one node and touch at most the
head, the tail and the counter, so they are **O(1)** regardless of length: the tail reference
is what keeps `append` from walking the list. `removeAll(where:)` and `reverse()` visit every
node exactly once with constant work per node, so they are **O(n)**; `toArray()` is O(n) too,
and `reserveCapacity(count)` avoids repeated reallocation of the result.

None of the mutating operations allocate beyond the nodes themselves: `removeAll` keeps only
`previous`, `node` and `current`, and `reverse` keeps `previous`, `node` and `current`, so the
extra space is **O(1)**. Their correctness rests on two invariants. In `removeAll`, `previous`
is always the last node known to be kept, so it is also the new tail when the loop ends (or
`nil` if everything went). In `reverse`, `previous` heads the already reversed prefix and
`node` heads the untouched suffix; saving `current.next` before flipping it is what keeps the
suffix reachable. A recursive reversal would also be O(n) time but O(n) stack, which is
risky at 100,000 nodes, and rebuilding a new list would break the "reuse the nodes" contract.
'''

[[unit]]
id = "sw-u31-hash-maps"
title = "Hash tables, frequencies and sets"
level = "advanced"
difficulty = 31
intro = '''
Swift's `Dictionary` and `Set` answer "is this key here?" in constant time on average because
they are hash tables. In this unit you open the box: you will turn keys into bucket indexes,
build a tiny chained map on top of `Hashable`, count frequencies and combine sets, and then
write a generic `HashTable<Key, Value>` from scratch that grows itself as it fills up.
'''
concepts = '''
## The idea

A **hash table** stores key-value pairs in an array of **buckets**. A **hash function** turns each key into an integer, and that integer modulo the number of buckets picks the bucket. To find a key you hash it, jump straight to one bucket and look only there. No scan of the whole table, no ordering needed.

Two different keys can land in the same bucket. That is a **collision**, and it is unavoidable: there are far more possible keys than buckets. **Separate chaining** keeps a small list in every bucket and searches it. The cost of a lookup is the length of that list, so the table watches its **load factor**, `count / bucketCount`. When it passes a threshold (0.75 is common), the table allocates twice as many buckets and **rehashes** every entry into its new place.

A resize costs O(n), but it happens only after the count has doubled, so its cost spread over all the insertions is O(1) each: **amortised O(1)**. With a decent hash function, lookups, inserts and removals are O(1) on average. With a terrible one, where every key collides, they degrade to O(n).

## How Swift does it

A type usable as a key conforms to **`Hashable`**, which refines `Equatable`. The compiler synthesises both for structs and enums whose members are `Hashable`, or you write `hash(into:)` yourself:

```swift
struct Point: Hashable {
    let x: Int, y: Int
    func hash(into hasher: inout Hasher) {
        hasher.combine(x)
        hasher.combine(y)
    }
}
```

`Hasher` mixes the combined values with a strong algorithm, and `key.hashValue` gives the final `Int`. A `Dictionary` reads with a subscript that returns an optional, and has a `default:` form that is perfect for counting:

```swift
var counts: [Character: Int] = [:]
for ch in "banana" { counts[ch, default: 0] += 1 }
```

`Set` offers `union`, `intersection`, `subtracting` and `symmetricDifference`.

## What is special or tricky

- **`hashValue` changes on every run.** Swift seeds `Hasher` randomly at process start to resist collision attacks, so never store or print hash values, and never depend on the iteration order of a `Dictionary` or `Set`. Sort before printing.
- **`hashValue` can be negative**, so `hashValue % n` can be a negative index and `abs(Int.min)` traps. Convert with `UInt(bitPattern:)` first.
- **Equal keys must hash equally.** If `==` says two values are equal but `hash(into:)` combines a field that differs, lookups silently miss.
- Reading a missing key gives `nil`, not a crash; assigning `nil` through the subscript removes the key.
- Keys used in a hash table should be immutable while stored: change one in place and it sits in the wrong bucket.

## What you will practise

You will compute bucket indexes with a hand-written hash, build a small chained map over `Hashable`, and count words and combine sets with the standard types. The challenge is a generic, resizing `HashTable<Key: Hashable, Value>` with a subscript and removal, checked with colliding keys and 100,000 entries.
'''

[[unit.step]]
kind = "concept"
id = "sw-u31-c1-buckets"
title = "Buckets, hashing and collisions"
points = 5
difficulty = 31
intro = '''
A hash table is an array plus a function that maps every key to an index. Good hashing spreads
keys evenly, chaining handles the keys that still collide, and resizing keeps the chains short
as the table fills up.
'''
body = '''
## From key to bucket

```swift
let index = Int(UInt(bitPattern: key.hashValue) % UInt(buckets.count))
```

`hashValue` is any `Int`, positive or negative. Reinterpreting its bits as a `UInt` makes the
remainder a valid index from 0 to `buckets.count - 1`.

## Chaining

Each bucket is a small array of `(key, value)` pairs:

```swift
var buckets: [[(key: String, value: Int)]] = Array(repeating: [], count: 8)
```

- **Lookup:** hash the key, then scan that one bucket for an equal key.
- **Insert:** if the key is already in its bucket, overwrite the value; otherwise append a
  new pair.
- **Remove:** find the pair in its bucket and delete it.

## Load factor and resizing

With *n* keys in *m* buckets, a bucket holds *n / m* pairs on average. Keep that ratio below
about 0.75 and every bucket stays tiny, so all three operations are O(1) on average. When an
insert pushes it higher, allocate `2 * m` buckets and re-insert every pair: each key's index
depends on `m`, so pairs move to new buckets.

## Why it is fast, and when it is not

Doubling means the expensive rehash happens only when the count passes 6, 12, 24, 48... Its total cost
stays proportional to *n*, so each insert is **amortised O(1)**. The guarantee relies on the
hash function. A key type whose `hash(into:)` sends everything to one bucket turns the table
into a single list, and every operation becomes O(n).
'''

