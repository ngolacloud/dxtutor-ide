            self.equal(topFrequent([3, 1, 3, 2, 1, 3], 1), [3])
        }
        test("ties are broken by first appearance") {
            self.equal(topFrequent(["b", "a", "b", "a", "c"], 2), ["b", "a"])
            self.equal(topFrequent(["x", "y", "z"], 3), ["x", "y", "z"])
