[[unit.step]]
kind = "challenge"
id = "sw-u03-x1-palindrome"
title = "Implement isPalindrome"
points = 20
difficulty = 3
entry = "isPalindrome"
intro = '''
A palindrome reads the same forwards and backwards. The textbook check compares a string
with its reverse, but the reverse must be taken over the right units: reversing bytes or
Unicode scalars would tear accents off their letters. Swift's `Character`-based strings
make the correct version the easy one.
'''
instructions = '''
## Your turn

Implement the function `isPalindrome`:

```swift
func isPalindrome(_ text: String) -> Bool
```

It returns `true` when `text` reads the same forwards and backwards **ignoring upper and
lower case**, and `false` otherwise.

Examples:

- `isPalindrome("level")` → `true`
- `isPalindrome("Racecar")` → `true` (case is ignored)
- `isPalindrome("swift")` → `false`
- `isPalindrome("")` → `true` (the empty string reads the same both ways)

Rules:

- Compare whole `Character`s. A letter written as `e` plus a combining accent
  (`"e\u{301}"`) is one character and must stay one character when reversed.
- Spaces and punctuation are **not** ignored: `"nurses run"` is not a palindrome here.

**Hint:** make a lowercase copy with `lowercased()`, build its reverse with
`String(... .reversed())`, and compare the two with `==`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Return true when `text` reads the same forwards and backwards, ignoring case.
// Compare whole Characters (what a reader sees as one letter), not bytes.
func isPalindrome(_ text: String) -> Bool {
    fatalError("not implemented")
}
'''
tests = '''
test("simple palindromes") {
