[[unit.step]]
kind = "challenge"
id = "sw-u02-x1-average"
title = "Implement average"
points = 20
difficulty = 2
entry = "average"
intro = '''
Averaging looks trivial, but it combines two classic numeric traps: integer division
throws away the fraction, and adding large fixed-width integers can overflow. Converting
each value to a floating-point `Double` before doing any arithmetic avoids both, at the cost
of the tiny rounding error every `Double` carries.
'''
instructions = '''
## Your turn

Implement the function `average`:

```swift
func average(_ a: Int, _ b: Int, _ c: Int) -> Double
```

It returns the **mean** of three whole numbers: their sum divided by 3, as a `Double` with
its fraction kept.

Examples:

- `average(1, 2, 3)` → `2.0`
- `average(1, 2, 2)` → `1.6666666666666667`
- `average(-4, -5, 0)` → `-3.0`

Rules:

- The result must keep the fraction: `average(7, 0, 0)` is `2.333...`, not `2.0`.
- The numbers can be huge, up to `Int.max`. Adding three such values as `Int` overflows,
  and an overflow **crashes** the whole program. Convert before you add.

**Hint:** `Double(a)` turns an `Int` into a `Double`. Once all three are `Double`s, adding
and dividing them can't overflow.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Return the average (mean) of three whole numbers as a Double, keeping the fraction.
// The numbers can be huge, so don't add them as Int: convert each one first.
func average(_ a: Int, _ b: Int, _ c: Int) -> Double {
    fatalError("not implemented")
}
'''
tests = '''
test("simple average") { self.near(average(1, 2, 3), 2.0) }
test("result keeps the fraction") { self.near(average(1, 2, 2), 5.0 / 3.0) }
test("not integer division") { self.near(average(7, 0, 0), 7.0 / 3.0) }
test("all zeros") { self.near(average(0, 0, 0), 0.0) }
test("negatives") { self.near(average(-4, -5, 0), -3.0) }
test("mixed signs") { self.near(average(-10, 10, 3), 1.0) }
test("all the same") { self.near(average(5, 5, 5), 5.0) }
test("huge values do not overflow") {
    let big = 4_000_000_000_000_000_000
    self.near(average(big, big, big), 4e18, 1e4)
}
test("Int.max and Int.min") {
    self.near(average(Int.max, Int.min, 1), 0.0, 1e3)
    self.near(average(Int.max, Int.max, Int.max), Double(Int.max), 1e4)
}
'''

[unit.step.gabarito]
solution = '''
// Return the average (mean) of three whole numbers as a Double, keeping the fraction.
// The numbers can be huge, so don't add them as Int: convert each one first.
func average(_ a: Int, _ b: Int, _ c: Int) -> Double {
    let sum = Double(a) + Double(b) + Double(c)
    return sum / 3
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function does a fixed amount of work whatever the values are: three conversions, two
additions and one division. Numbers in Swift have a fixed width (64 bits for both `Int` and
`Double`), so each of those operations takes the same time for `1` as for `Int.max`. The
time is therefore **O(1)**, and the only extra memory is the single `Double` named `sum`,
so the space is **O(1)** too.

The order of operations is what makes it correct. `(a + b + c) / 3` would fail twice: the
`Int` sum overflows (and crashes) for large inputs, and integer division would drop the
fraction. Converting first means the sum is computed in `Double`, whose range reaches about
10³⁰⁸. The price is precision: a `Double` holds about 16 significant digits, so averages of
numbers near `Int.max` are correct only to within a few thousand, which is why the tests
compare with a tolerance (`near`) instead of exact equality.
'''

[[unit]]
id = "sw-u03-strings"
title = "Strings & characters"
level = "basic"
difficulty = 3
intro = '''
Text is everywhere in programs, and Swift takes it unusually seriously. In this unit you
build strings with interpolation, call their most useful methods, discover why a Swift
`Character` is what a human sees as one letter (even when it is made of several Unicode
pieces), and write multi-line and raw strings.
'''
concepts = '''
## The idea

A **string** is a sequence of characters: a word, a sentence, a whole file. Computers store
text as numbers, and the worldwide standard that assigns those numbers is **Unicode**. One
visible letter can be made of more than one Unicode number: `é` can be stored as a single
code (`U+00E9`) or as `e` followed by a combining accent (`U+0301`). Emoji flags are two
codes glued together.

## How Swift does it

`String` is a value type made of `Character`s, and a Swift `Character` is one
**user-perceived character** (Unicode calls it an *extended grapheme cluster*). So `count`
gives the number of letters a person would count, not the number of bytes:

```swift
let word = "naïve"
print(word.count)          // 5 characters
print(word.utf8.count)     // 6 bytes in UTF-8
```

**Interpolation** puts any value inside a string: write `\(` and `)` around an expression.

```swift
let items = 3
print("You have \(items) items, \(items * 2) after doubling.")
```

Useful methods and properties: `uppercased()`, `lowercased()`, `hasPrefix(_:)`,
`hasSuffix(_:)`, `contains(_:)`, `isEmpty`, `count`, and `reversed()` (wrap it in
`String(...)` to get a string back). Strings join with `+` and grow with `+=`.

A **multi-line string** sits between `"""` delimiters on their own lines. The indentation of
the closing `"""` is removed from every line. **Escapes** such as `\n` (newline), `\t` (tab),
`\"` (a quote) and `\u{E9}` (a Unicode code) work in ordinary strings. A **raw string**,
wrapped in `#"` and `"#`, treats backslashes literally, which is handy for file paths and
patterns.

## What is special or tricky

- **No integer indexing.** `word[0]` fails with `'subscript(_:)' is unavailable: cannot
  subscript String with an Int, use a String.Index instead`. Because characters have
  different sizes in memory, Swift won't pretend that finding the n-th one is instant.
- **`count` walks the string.** It must examine the text to group it into characters, so it
  takes time proportional to the length.
- **Equality is by meaning.** `"\u{E9}" == "e\u{301}"` is `true`: both are `é`, so Swift
  compares them as equal even though their bytes differ.
- **Single quotes are not strings.** `'a'` is an error; a `Character` literal also uses
  double quotes, with an annotation: `let c: Character = "a"`.
- **Numbers don't join with `+`.** Use interpolation or `String(n)`.

## What you will practise

You will interpolate values and call string methods, count characters versus bytes and
Unicode scalars, compare differently encoded letters, and write multi-line and raw strings.
The challenge asks you to recognise palindromes correctly, even when a letter is made of
several Unicode pieces.
'''

[[unit.step]]
kind = "concept"
id = "sw-u03-c1-strings"
title = "Strings, Characters and Unicode"
points = 5
difficulty = 3
intro = '''
Text looks simple, but the bytes behind it are not. Unicode gives every symbol a number,
UTF-8 stores those numbers in one to four bytes each, and several numbers may combine into
one visible letter. Swift's `String` hides that complexity behind `Character`s that match
what a reader sees.
'''
body = '''
## Three views of the same text

Take the word `café`. A person sees 4 letters. Swift lets you look at it at three levels:

```swift
let word = "caf\u{E9}"          // café
print(word.count)                 // 4 Characters
print(word.unicodeScalars.count)  // 4 Unicode scalars
print(word.utf8.count)            // 5 bytes: é takes two in UTF-8
```

- A **`Character`** is one letter as a person sees it.
- A **Unicode scalar** is one Unicode number, written `\u{...}` in hexadecimal.
- A **UTF-8 byte** is how the text is stored in memory and in files.

Write `é` instead as `e` plus the combining accent `\u{301}`, and the scalar count becomes
5 while `count` stays 4, because Swift groups the two scalars into a single `Character`.

## Building strings

Interpolation, `\(expression)`, converts any value to text inside a string literal, so you
rarely need `+` with numbers:

```swift
let name = "Ada"
let year = 1815
print("\(name) was born in \(year), \(2026 - year) years ago.")
```

## Why there is no `word[0]`

Because one `Character` may take 1 byte or 20, finding the tenth one means walking from
the start. Swift refuses to hide that cost behind an integer index, so `word[0]` does not
compile. For now, use methods such as `hasPrefix`, `contains` and `reversed()`; unit 19
shows how to move through a string with indices.
'''

