[[unit.step]]
kind = "challenge"
id = "sw-u24-x1-loading-cache"
title = "A cache that loads each key once"
points = 40
difficulty = 24
entry = "LoadingCache"
intro = '''
When twenty screens ask for the same report at the same moment, a naive cache misses twenty
times and hits the server twenty times, because every caller checks the cache before the first
load has finished. Remembering the in-flight load inside an actor, and letting late callers await
that same work, is the standard fix for this reentrancy problem.
'''
instructions = '''
## Your turn

Implement the actor `LoadingCache`:

```swift
actor LoadingCache {
    func value(
        for key: String,
        load: @escaping @Sendable (String) async throws -> String
    ) async throws -> String
    func cachedKeys() -> [String]
}
```

`value(for:load:)` returns the value for `key`:

1. If a value is already cached for `key`, return it without calling `load`.
2. Else, if a load for the same `key` is **already in progress**, wait for that load and return
   its result. Don't call `load` again.
3. Else start a new load by calling `load(key)`. On success, cache the value and return it.

A failed load is **not** cached: every caller waiting on it gets the error, and a later request
for the key calls `load` again. Different keys load independently and may load at the same time.

`cachedKeys()` returns the keys that currently hold a cached value, sorted ascending.

Example: twenty concurrent `value(for: "report", load: slowLoader)` calls must call `slowLoader`
exactly once and all return its result.

