[[unit.step]]
kind = "challenge"
id = "sw-u10-x1-fraction"
title = "An exact Fraction type"
points = 30
difficulty = 10
entry = "Fraction"
intro = '''
Floating-point numbers cannot represent 1/3 exactly, so music timing, geometry and some
financial code use exact rationals instead. A fraction type is only trustworthy if every
instance is kept in one canonical form, lowest terms with a positive denominator, and that
invariant belongs in the initialiser, enforced with Euclid's greatest-common-divisor algorithm.
'''
instructions = '''
## Your turn

Complete the struct `Fraction`:

```swift
struct Fraction: Equatable {
    private(set) var numerator: Int
    private(set) var denominator: Int
    init?(_ numerator: Int, _ denominator: Int)
    var value: Double { get }
    var isWhole: Bool { get }
    func adding(_ other: Fraction) -> Fraction
    mutating func multiply(by other: Fraction)
}
```

Every `Fraction` must be stored in **canonical form**:

- the denominator is positive, so the sign lives on the numerator;
- the numerator and denominator have no common factor greater than 1;
- zero is stored as `0/1`.

Rules:

- `init?` returns `nil` when the denominator is 0. Otherwise it stores the canonical form:
  `Fraction(6, 8)` holds 3/4, `Fraction(1, -2)` holds -1/2 and `Fraction(0, -7)` holds 0/1.
- `value` is the fraction as a `Double`. `isWhole` is `true` when the denominator is 1.
- `adding(_:)` returns `self + other` in canonical form and leaves `self` unchanged.
- `multiply(by:)` replaces `self` with `self × other`, in canonical form.
- Keep the `Equatable` conformance. Swift synthesises `==` by comparing the stored properties,
  and canonical form is exactly what makes that comparison correct: 2/4 and 1/2 are then stored
  identically.

Examples:

- `Fraction(1, 2)!.adding(Fraction(1, 3)!)` equals `Fraction(5, 6)`.
- `Fraction(2, 4) == Fraction(-5, -10)` is `true`.
- `Fraction(1, 0)` is `nil`.

**Hint:** write a `gcd(_:_:)` helper with Euclid's algorithm: while `b != 0`, replace `(a, b)`
with `(b, a % b)`. `adding` and `multiply` always have a non-zero denominator, so they don't
need the failable initialiser: add a `private init` that only normalises, and call it from all
three places. The tests use small values, so you don't need to worry about overflow.

Hidden tests decide correctness.
'''
starter = '''
/// An exact fraction, always stored in lowest terms with a positive denominator.
struct Fraction: Equatable {
    private(set) var numerator: Int
    private(set) var denominator: Int

    /// Return nil when `denominator` is 0. Otherwise store the fraction in lowest
    /// terms with a positive denominator: Fraction(2, -4) holds -1/2.
    init?(_ numerator: Int, _ denominator: Int) {
        fatalError("not implemented")
    }

    /// The fraction as a Double: 1/4 gives 0.25.
    var value: Double {
        fatalError("not implemented")
    }

    /// True when the fraction is a whole number (its denominator is 1).
    var isWhole: Bool {
        fatalError("not implemented")
    }

    /// Returns self + other, in lowest terms. Does not change self.
    func adding(_ other: Fraction) -> Fraction {
        fatalError("not implemented")
    }

    /// Replaces self with self * other, in lowest terms.
    mutating func multiply(by other: Fraction) {
        fatalError("not implemented")
    }
}
'''
tests = '''
test("a zero denominator fails") {
    self.expect(Fraction(1, 0) == nil, "Fraction(1, 0) should be nil")
    self.expect(Fraction(0, 0) == nil, "Fraction(0, 0) should be nil")
}
test("stores lowest terms") {
    guard let f = Fraction(6, 8) else { return self.expect(false, "Fraction(6, 8) was nil") }
    self.equal(f.numerator, 3)
    self.equal(f.denominator, 4)
    self.equal(Fraction(10, 5), Fraction(2, 1))
}
test("the sign lives on the numerator") {
    guard let a = Fraction(1, -2), let b = Fraction(-3, -9) else {
        return self.expect(false, "valid fractions came back nil")
    }
    self.equal(a.numerator, -1)
    self.equal(a.denominator, 2)
    self.equal(b.numerator, 1)
    self.equal(b.denominator, 3)
}
test("zero is stored as 0/1") {
    guard let z = Fraction(0, -7) else { return self.expect(false, "Fraction(0, -7) was nil") }
    self.equal(z.numerator, 0)
    self.equal(z.denominator, 1)
    self.expect(z.isWhole, "0 is a whole number")
}
test("value and isWhole") {
    guard let q = Fraction(1, 4), let w = Fraction(-12, 4) else {
        return self.expect(false, "valid fractions came back nil")
    }
    self.near(q.value, 0.25)
    self.near(w.value, -3.0)
    self.expect(!q.isWhole, "1/4 is not whole")
    self.expect(w.isWhole, "-12/4 is whole")
}
test("equal values compare equal") {
    self.equal(Fraction(2, 4), Fraction(-5, -10))
    self.expect(Fraction(1, 2) != Fraction(1, 3), "1/2 and 1/3 differ")
}
test("adding returns a new reduced fraction") {
    guard let a = Fraction(1, 2), let b = Fraction(1, 3), let c = Fraction(1, 6) else {
        return self.expect(false, "valid fractions came back nil")
    }
    self.equal(a.adding(b), Fraction(5, 6))
    self.equal(a.adding(c).adding(b), Fraction(1, 1))
    self.equal(a.adding(Fraction(-1, 2)!), Fraction(0, 1))
    self.equal(a, Fraction(1, 2))
}
test("multiply mutates only that copy") {
    guard var f = Fraction(2, 3), let half = Fraction(-3, 4) else {
        return self.expect(false, "valid fractions came back nil")
    }
    let before = f
    f.multiply(by: half)
    self.equal(f, Fraction(-1, 2))
    self.equal(before, Fraction(2, 3))
    f.multiply(by: Fraction(0, 5)!)
    self.equal(f.numerator, 0)
    self.equal(f.denominator, 1)
}
test("sums of many fractions stay exact") {
    var total = Fraction(0, 1)!
    for n in 1...20 {
        total = total.adding(Fraction(1, n * (n + 1))!)
    }
    self.equal(total, Fraction(20, 21))
}
'''

[unit.step.gabarito]
solution = '''
/// An exact fraction, always stored in lowest terms with a positive denominator.
struct Fraction: Equatable {
    private(set) var numerator: Int
    private(set) var denominator: Int

    /// Fails when `denominator` is 0; otherwise normalises sign and lowest terms.
    init?(_ numerator: Int, _ denominator: Int) {
        guard denominator != 0 else { return nil }
        self.init(reducing: numerator, denominator)
    }

    /// Callers guarantee `denominator != 0`.
    private init(reducing numerator: Int, _ denominator: Int) {
        let divisor = Fraction.gcd(abs(numerator), abs(denominator))
        let sign = denominator < 0 ? -1 : 1
        self.numerator = sign * numerator / divisor
        self.denominator = sign * denominator / divisor
    }

    private static func gcd(_ a: Int, _ b: Int) -> Int {
        var (a, b) = (a, b)
        while b != 0 {
            (a, b) = (b, a % b)
        }
        return a
    }

    var value: Double {
        Double(numerator) / Double(denominator)
    }

    var isWhole: Bool {
        denominator == 1
    }

    func adding(_ other: Fraction) -> Fraction {
        Fraction(reducing: numerator * other.denominator + other.numerator * denominator,
                 denominator * other.denominator)
    }

    mutating func multiply(by other: Fraction) {
        self = Fraction(reducing: numerator * other.numerator, denominator * other.denominator)
    }
}
'''
time = "O(log n)"
space = "O(1)"
justification = '''
Let `n` be the largest absolute value among the numerators and denominators involved.

Each operation does a constant number of multiplications and additions, then one normalisation.
Normalising runs Euclid's algorithm, which needs O(log n) iterations: after every two steps
the first argument has at least halved, and Lamé showed that the worst case is a pair of
consecutive Fibonacci numbers. So `init?`, `adding(_:)` and `multiply(by:)` are **O(log n)**,
while `value` and `isWhole` are O(1).

A `Fraction` is two `Int`s stored inline, with no heap allocation, and the algorithm keeps only
a couple of local integers, so the space is **O(1)**.

Normalising in the initialiser is the design decision that makes everything else simple. No
code path can create a non-canonical `Fraction`, so the synthesised `==`, which only compares
the stored numerator and denominator, is correct; without canonical form, 1/2 and 2/4 would
compare unequal. `private(set)` closes the last loophole: outside code can read the parts but
cannot write `f.denominator = 0`. Value semantics complete the picture: `multiply(by:)`
changes only the variable it is called on, so a copy kept elsewhere is never disturbed.
'''

[[unit]]
id = "sw-u11-classes"
title = "Classes: reference types and inheritance"
level = "intermediate"
difficulty = 11
intro = '''
A class is like a struct with two extra powers: its instances have identity and are shared by
reference, and one class can inherit from another and override its behaviour. Those powers
bring responsibilities: writing your own initialisers, knowing who else holds a reference, and
knowing when an object is freed. You will compare reference and value semantics, build a small
class hierarchy, check identity with `===`, watch `deinit` run, and model bank accounts that
send money to each other.
'''
concepts = '''
## The idea

A struct value is a self-contained copy. Some things, though, are *one thing* that several
parts of a program must see: a bank account, an open file, a player in a game. Copying them
would be wrong, because a deposit made through one copy would not appear in the other. A
**class** models such entities. A class instance lives on the heap, and variables hold
**references** to it, so assigning one copies the reference, not the object.

Classes also support **inheritance**. A subclass reuses everything its superclass has, adds
its own properties, and **overrides** methods to specialise them. A call through a
superclass-typed reference still runs the subclass's override; this is **dynamic dispatch**.

## How Swift does it

```swift
class Animal {
    let name: String
    init(name: String) { self.name = name }   // no memberwise init for classes
    func sound() -> String { "..." }
}

final class Dog: Animal {
    override func sound() -> String { "woof" }
}

let pet: Animal = Dog(name: "Rex")
print(pet.sound())        // woof: the override runs
let same = pet
print(same === pet)       // true: one object, two references
```

- A class has **no memberwise initialiser**. Stored properties without defaults need an
  `init` that you write.
- A subclass `init` sets its own properties first, then calls `super.init(...)`. This
  two-phase rule guarantees that no method ever sees a half-built object.
- `override` is mandatory when replacing an inherited member, and `super.method()` calls the
  inherited version.
- `final` forbids further subclassing, which documents intent and lets the compiler call
  methods directly.
- `===` and `!==` test **identity**: are these the same instance? `==` tests equality and exists
  only when the type conforms to `Equatable`.
- `deinit` runs when the last reference to an instance disappears. Swift tracks this with
  **automatic reference counting** (ARC), the subject of unit 27.

## Reference semantics

A class method can change properties without `mutating`, even through a `let` constant: `let`
freezes the *reference*, not the object. That is convenient and also risky. Any code holding a
reference can change the shared state, so a change in one place can surprise code elsewhere.

## Pitfalls and compiler errors

- **"Class 'X' has no initializers"**: a stored property has neither a default value nor an
  `init` that sets it.
- **"Property 'self.x' not initialized at super.init call"** and **"'super.init' isn't called
  on all paths before returning from initializer"**: follow the two-phase order.
- **"Overriding declaration requires an 'override' keyword"**, and the reverse, *"Method does
  not override any method from its superclass"*, usually a typo in the name.
- **Surprise mutation**: an object you passed to a function changed under you. With a struct,
  that cannot happen.
- In Swift 6, a class with mutable state is not `Sendable`, so it cannot move freely between
  concurrent tasks. Prefer structs unless you need shared identity.

## What you will practise

You will share one instance through two names and contrast it with a struct copy, override
methods in a small shape hierarchy, observe identity and `deinit`, and then implement accounts
whose transfers rely on identity checks and dynamic dispatch.
'''

[[unit.step]]
kind = "concept"
id = "sw-u11-c1-references"
title = "Classes are shared by reference"
points = 5
difficulty = 11
intro = '''
A struct variable contains its value; a class variable contains a reference to an object on the
heap. Copying the variable copies only the reference, so several names can reach, and change,
the same object. That shared identity is why classes exist, and also their main source of bugs.
'''
body = '''
## One object, many names

```swift
final class Score {
    var points = 0
}

let mine = Score()
let yours = mine          // copies the reference
yours.points += 10
print(mine.points)        // 10: there is only one Score
print(mine === yours)     // true
```

With a struct, `var yours = mine` would copy the value, and `mine.points` would stay 0.

Notice that `mine` is a `let`, yet its property changed. For a class, `let` means "this name
always refers to the same object", not "the object never changes". For the same reason, class
methods never need the `mutating` keyword.

## Struct or class?

Use a **struct** when the value is just data: a point, a date range, a configuration, a
fraction. Two values with equal contents are interchangeable.

Use a **class** when the thing has an **identity** that matters beyond its contents: two
accounts with the same owner and balance are still two accounts. Classes are also the tool
when you need **inheritance**, or when an object manages a resource that it must release in
`deinit`.

## Identity versus equality

`===` asks "are these the same instance?". `==` asks "are these equal?", and it only works
when the type conforms to `Equatable`. For classes these really are different questions, and
the challenge depends on telling them apart.
'''

