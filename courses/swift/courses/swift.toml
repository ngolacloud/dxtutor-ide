[unit.step.gabarito]
solution = '''
import Foundation

/// What the home screen shows for one user (provided: do not change it).
struct Dashboard: Equatable, Sendable {
    let name: String
    let orderCount: Int
    let total: Int
}

/// Thrown for a user id that is zero or negative (provided: do not change it).
enum DashboardError: Error, Equatable {
    case invalidUser(Int)
}

/// Loads the profile name and the order amounts for `userID` concurrently and combines them.
func loadDashboard(
    userID: Int,
    profile: @escaping @Sendable (Int) async throws -> String,
    orders: @escaping @Sendable (Int) async throws -> [Int]
) async throws -> Dashboard {
    guard userID > 0 else { throw DashboardError.invalidUser(userID) }
    async let name = profile(userID)
    async let amounts = orders(userID)
    let (resolvedName, resolvedAmounts) = try await (name, amounts)
    return Dashboard(
        name: resolvedName,
        orderCount: resolvedAmounts.count,
        total: resolvedAmounts.reduce(0, +)
    )
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
Let *n* be the number of order amounts. The validation and the two `async let` launches are
constant work; summing the amounts with `reduce` visits each one once, so the function's own work
is **O(n)**. Apart from the arrays the loaders return, it keeps only a few values, so its extra
space is **O(1)**.

The interesting cost is **latency**, not CPU. Awaiting the loaders one after the other costs
`t(profile) + t(orders)`; starting both as child tasks costs `max(t(profile), t(orders))`. The
children are structured: if `profile` throws, the `try await` rethrows, and Swift cancels and
awaits the `orders` child before the function exits, so no work leaks past the call. Checking
`userID` before launching anything means an invalid request never touches either service.
'''

[[unit]]
id = "sw-u23-task-groups"
title = "Task groups, structured concurrency and cancellation"
level = "advanced"
difficulty = 23
intro = '''
`async let` handles a fixed number of concurrent calls; a **task group** handles as many as your
data needs. You will fan work out over a dictionary, collect results as they finish, let one
failure cancel the rest, stop a long job cooperatively, and finish by writing a concurrent `map`
that keeps the input order and never runs more than a given number of tasks at once.
'''
concepts = '''
## The idea

Many jobs are "do the same thing for every item": download every image, check every URL, resize
every photo. Running them one by one wastes time when each item mostly waits. Running all of them
at once can overload the machine or the server. A good concurrent program fans the work out,
gathers the results, and stays in control: it knows when everything is done, it stops the rest
when something fails, and it can be cancelled.

## How Swift does it

`withTaskGroup` creates a scope in which you add **child tasks** dynamically. The group is
itself an `AsyncSequence` of child results, delivered **in completion order**:

```swift
let lengths = await withTaskGroup(of: Int.self) { group in
    for word in ["a", "bbb"] {
        group.addTask { word.count }
    }
    var all: [Int] = []
    for await n in group { all.append(n) }
    return all
}
```

Every child must finish before `withTaskGroup` returns; that is the *structured* part. When the
children can fail, use `withThrowingTaskGroup` and `for try await`: the first error thrown out of
the loop leaves the scope, and the group **cancels all remaining children** and awaits them.
`group.next()` reads one result at a time, and `group.cancelAll()` cancels on demand.

## Cancellation is cooperative

Cancelling a task does not stop it. It sets a flag, and the task must notice:

```swift
for chunk in chunks {
    try Task.checkCancellation()
    await process(chunk)
}
```

`Task.checkCancellation()` throws `CancellationError` when the flag is set; `Task.isCancelled`
lets you check it without throwing. Many system calls check for you: `Task.sleep` throws
`CancellationError` as soon as its task is cancelled. Cancelling a parent cancels all of its
children, which is how one `job.cancel()` stops a whole tree of work.

## Pitfalls and compiler errors

- **Results arrive in completion order**, not in the order you added the tasks. Return the index
  with each result, or sort, when order matters.
- **"capture of non-Sendable type in a @Sendable closure"**: child task closures run
  concurrently, so in Swift 6 everything they capture must be `Sendable`. Value types made of
  `Sendable` parts, actors and `@Sendable` closures are fine; a mutable local `var` is not.
- Don't mutate the group or shared state from inside a child; return values to the parent and
  combine them there.
- Adding ten thousand children at once is legal but rarely wise. Add a few, then add one more each
  time one finishes, to cap concurrency.

## What you'll practise

You will collect results from a task group, propagate a failure out of a throwing group, cancel a
long-running task and prove it stopped, and in the challenge build an order-preserving concurrent
`map` with a concurrency limit, error propagation and cancellation.
'''

[[unit.step]]
kind = "concept"
id = "sw-u23-c1-structured"
title = "The task tree"
points = 5
difficulty = 23
intro = '''
Structured concurrency arranges tasks in a tree: every child task has a parent that waits for it.
Because of that tree, results, errors and cancellation all have a well-defined path, and no task
silently outlives the code that started it.
'''
body = '''
## Parents and children

When a function opens a task group and adds three children, those children form a little tree
below it. Three rules hold for every node of that tree:

1. **A parent waits for its children.** `withTaskGroup` does not return until every child has
   finished, even if you stopped reading results early.
2. **Errors flow up.** In a throwing group, an error thrown by a child comes out of
   `for try await` (or `group.next()`) in the parent.
3. **Cancellation flows down.** Cancelling a task cancels all of its children, and leaving a group
   because of an error cancels the children that are still running.

```swift
try await withThrowingTaskGroup(of: Void.self) { group in
    group.addTask { try await upload("a") }
    group.addTask { try await upload("b") }
    try await group.waitForAll()
}
```

If `upload("a")` throws, `waitForAll()` rethrows the error, the group cancels `upload("b")`, waits
for it to wind down, and only then does the error reach the caller.

## Cooperative cancellation

Cancellation only sets a flag. Code that loops or does heavy work should call
`try Task.checkCancellation()` regularly, so that it throws `CancellationError` and unwinds.
Waiting operations such as `Task.sleep` already check and throw for you. A task that never checks
keeps running until it finishes naturally, cancelled or not.

## Why it matters

Unstructured `Task { }` handles are easy to forget, and a forgotten task keeps running and
holding resources. Groups make the lifetime of concurrent work visible in the shape of the code:
when the closing brace is reached, all of it is over.
'''

