[[unit.step]]
kind = "challenge"
id = "sw-u32-x1-bst"
title = "A generic BST with deletion"
points = 40
difficulty = 32
entry = "BST"
intro = '''
Deletion is where BSTs get interesting. Removing a leaf or a node with one child is a simple
splice, but a node with two children must be replaced by a key that keeps the order intact:
its in-order successor, the smallest key of its right subtree.
'''
instructions = '''
## Your turn

Implement the methods of the generic class `BST<T: Comparable>`, a binary search tree of
**unique** values built from `TreeNode<T>` class nodes:

```swift
final class BST<T: Comparable> {
    private(set) var root: TreeNode<T>?
    private(set) var count: Int
    func insert(_ value: T) -> Bool
    func contains(_ value: T) -> Bool
    var min: T?
    func remove(_ value: T) -> Bool
    func inOrder() -> [T]
}
```

The `TreeNode<T>` class and the stored properties are provided in the starter; don't change
them.

Rules:

- `insert` adds the value and returns `true`, or returns `false` and changes nothing if it is
  already present. New values always become leaves.
- `contains` and `min` walk down the tree; `min` is `nil` for an empty tree.
- `remove` returns `false` if the value is absent. Otherwise it removes it and returns `true`:
  1. **No children**: unlink the node.
  2. **One child**: the child takes its place.
  3. **Two children**: copy the in-order successor's value (the smallest value in the right
     subtree) into the node, then remove the successor from the right subtree.
- `inOrder()` returns every value in ascending order.
- `count` and the BST property must be right after every call. The root itself can be removed.

Examples, on the tree built by inserting `50, 30, 70, 20, 40, 60, 80`:

- `insert(30)` returns `false`; `count` stays 7.
- `remove(20)` removes a leaf; `inOrder()` becomes `[30, 40, 50, 60, 70, 80]`.
- `remove(50)` removes the root, which has two children; 60 takes its place, so
  `root?.value == 60`.
- `remove(99)` returns `false`.

Hidden tests decide correctness, including a degenerate tree of 2,000 sorted keys and
100,000 random keys with 20,000 removals.
'''
starter = '''
/// A node of a binary search tree (provided: do not change it).
final class TreeNode<T: Comparable> {
    var value: T
    var left: TreeNode<T>?
    var right: TreeNode<T>?

    init(_ value: T) {
        self.value = value
    }
}

/// A binary search tree of unique values.
final class BST<T: Comparable> {
    private(set) var root: TreeNode<T>?
    private(set) var count = 0

    init() {}

    /// Adds `value`. Returns false (and changes nothing) if it is already present.
    @discardableResult
    func insert(_ value: T) -> Bool {
        fatalError("not implemented")
    }

    /// True when `value` is in the tree. Walk down with a loop.
    func contains(_ value: T) -> Bool {
        fatalError("not implemented")
    }

    /// The smallest value, or nil for an empty tree.
    var min: T? {
        fatalError("not implemented")
    }

    /// Removes `value`. Returns false if it was absent. A node with two children
    /// takes the value of its in-order successor, which is then removed instead.
    @discardableResult
    func remove(_ value: T) -> Bool {
        fatalError("not implemented")
    }

    /// Every value in ascending order.
    func inOrder() -> [T] {
        fatalError("not implemented")
    }
}
'''
tests = '''
struct SplitMix: RandomNumberGenerator {
    var state: UInt64
    mutating func next() -> UInt64 {
        state &+= 0x9E37_79B9_7F4A_7C15
        var z = state
        z = (z ^ (z >> 30)) &* 0xBF58_476D_1CE4_E5B9
        z = (z ^ (z >> 27)) &* 0x94D0_49BB_1331_11EB
        return z ^ (z >> 31)
    }
}

func isBST<T: Comparable>(_ tree: BST<T>) -> Bool {
    var stack: [(TreeNode<T>, T?, T?)] = []
    if let root = tree.root { stack.append((root, nil, nil)) }
    while let (node, low, high) = stack.popLast() {
        if let low, node.value <= low { return false }
        if let high, node.value >= high { return false }
        if let left = node.left { stack.append((left, low, node.value)) }
        if let right = node.right { stack.append((right, node.value, high)) }
    }
    return true
}

func build(_ values: [Int]) -> BST<Int> {
    let tree = BST<Int>()
    for v in values { tree.insert(v) }
    return tree
}

let base = [50, 30, 70, 20, 40, 60, 80]

test("an empty tree") {
    let tree = BST<Int>()
    self.equal(tree.count, 0)
    self.equal(tree.min, nil)
    self.expect(!tree.contains(1), "an empty tree contains nothing")
    self.expect(!tree.remove(1), "removing from an empty tree returns false")
    self.equal(tree.inOrder(), [])
}

test("insert keeps the BST property and rejects duplicates") {
    let tree = BST<Int>()
    for v in base { self.expect(tree.insert(v), "first insert of \(v) must return true") }
    self.expect(!tree.insert(30), "a duplicate insert must return false")
    self.equal(tree.count, 7)
    self.equal(tree.inOrder(), [20, 30, 40, 50, 60, 70, 80])
    self.equal(tree.root?.value, 50)
    self.equal(tree.root?.left?.value, 30)
    self.equal(tree.root?.right?.left?.value, 60)
    self.equal(tree.min, 20)
    self.expect(tree.contains(60) && !tree.contains(45), "contains must follow the tree")
}

test("remove a leaf and a node with one child") {
    let tree = build(base + [65])
    self.expect(tree.remove(20), "20 is a leaf")
    self.expect(tree.remove(60), "60 has one child")
    self.equal(tree.inOrder(), [30, 40, 50, 65, 70, 80])
    self.equal(tree.root?.right?.left?.value, 65)
    self.equal(tree.count, 6)
    self.expect(isBST(tree), "the tree must stay a BST")
}

test("remove nodes with two children, including the root") {
    let tree = build(base)
    self.expect(tree.remove(30), "30 has two children")
    self.equal(tree.inOrder(), [20, 40, 50, 60, 70, 80])
    self.expect(tree.remove(50), "the root has two children")
    self.equal(tree.root?.value, 60)
    self.equal(tree.inOrder(), [20, 40, 60, 70, 80])
    self.expect(isBST(tree), "the tree must stay a BST")
}

test("remove a missing key, the only key, and a root with one child") {
    let tree = build(base)
    self.expect(!tree.remove(99) && !tree.remove(45), "missing keys return false")
    self.equal(tree.count, 7)
    let single = build([5])
    self.expect(single.remove(5), "the only key")
    self.expect(single.root == nil && single.count == 0, "the tree is empty again")
    let chain = build([1, 2, 3])
    chain.remove(1)
    self.equal(chain.root?.value, 2)
    self.equal(chain.inOrder(), [2, 3])
}

test("works with negative numbers and strings") {
    let tree = build([0, -10, 10, -20, -5, 5, 20])
    for k in [-10, 0, 20] { tree.remove(k) }
    self.equal(tree.inOrder(), [-20, -5, 5, 10])
    self.equal(tree.min, -20)
    let words = BST<String>()
    for w in ["pear", "apple", "fig", "kiwi", "apple"] { words.insert(w) }
    words.remove("fig")
    self.equal(words.inOrder(), ["apple", "kiwi", "pear"])
}

test("a degenerate tree from sorted keys") {
    let tree = build(Array(0..<2000))
    self.equal(tree.count, 2000)
    self.equal(tree.min, 0)
    for k in stride(from: 1, to: 2000, by: 2) { tree.remove(k) }
    self.equal(tree.inOrder(), Array(stride(from: 0, to: 2000, by: 2)))
}

test("random inserts and removals against a Set") {
    var rng = SplitMix(state: 32)
    let keys = Array(0..<300).shuffled(using: &rng)
    let tree = build(keys)
    var alive = Set(keys)
    for (i, k) in keys.shuffled(using: &rng).enumerated() {
        self.expect(tree.remove(k), "\(k) should be present")
        alive.remove(k)
        if i % 15 == 0 {
            self.expect(isBST(tree), "BST property broken after removing \(k)")
            self.equal(tree.inOrder(), alive.sorted())
        }
    }
    self.expect(tree.root == nil && tree.count == 0, "every key was removed")
}

test("100,000 random keys: operations cost O(h)") {
    var rng = SplitMix(state: 2026)
    let keys = (0..<100_000).map { _ in Int.random(in: 0..<10_000_000, using: &rng) }
    let start = Date()
    let tree = build(keys)
    let unique = Set(keys)
    self.equal(tree.count, unique.count)
    var doomed = Set<Int>()
    for k in keys.prefix(20_000) {
        self.expect(tree.remove(k) == doomed.insert(k).inserted, "remove must report presence")
    }
    self.expect(!tree.remove(-1), "-1 was never inserted")
    var found = 0
    for k in keys where tree.contains(k) { found += 1 }
    self.expect(found > 0, "keys that were not removed must still be found")
    self.equal(tree.inOrder(), unique.subtracting(doomed).sorted())
    self.expect(isBST(tree), "the tree must stay a BST")
    self.expect(Date().timeIntervalSince(start) < 3.0, "each operation should cost O(h)")
}
'''

[unit.step.gabarito]
solution = '''
/// A node of a binary search tree (provided: do not change it).
final class TreeNode<T: Comparable> {
    var value: T
    var left: TreeNode<T>?
    var right: TreeNode<T>?

    init(_ value: T) {
        self.value = value
    }
}

/// A binary search tree of unique values.
final class BST<T: Comparable> {
    private(set) var root: TreeNode<T>?
    private(set) var count = 0

    init() {}

    @discardableResult
    func insert(_ value: T) -> Bool {
        guard var node = root else {
            root = TreeNode(value)
            count = 1
            return true
        }
        while true {
            if value < node.value {
                guard let next = node.left else {
                    node.left = TreeNode(value)
                    break
                }
                node = next
            } else if value > node.value {
                guard let next = node.right else {
                    node.right = TreeNode(value)
                    break
                }
                node = next
            } else {
                return false
            }
        }
        count += 1
        return true
    }

    func contains(_ value: T) -> Bool {
        var node = root
        while let current = node {
            if value == current.value { return true }
            node = value < current.value ? current.left : current.right
        }
        return false
    }

    var min: T? {
        guard var node = root else { return nil }
        while let next = node.left { node = next }
        return node.value
    }

    @discardableResult
    func remove(_ value: T) -> Bool {
        var removed = false
        root = remove(value, from: root, removed: &removed)
        if removed { count -= 1 }
        return removed
    }

    private func remove(_ value: T, from node: TreeNode<T>?, removed: inout Bool) -> TreeNode<T>? {
        guard let node else { return nil }
        if value < node.value {
            node.left = remove(value, from: node.left, removed: &removed)
        } else if value > node.value {
            node.right = remove(value, from: node.right, removed: &removed)
        } else {
            removed = true
            guard let left = node.left else { return node.right }
            guard let right = node.right else { return left }
            var successor = right
            while let next = successor.left { successor = next }
            node.value = successor.value
            var ignored = false
            node.right = remove(successor.value, from: right, removed: &ignored)
        }
        return node
    }

    func inOrder() -> [T] {
        var out: [T] = []
        out.reserveCapacity(count)
        var stack: [TreeNode<T>] = []
        var node = root
        while node != nil || !stack.isEmpty {
            while let current = node {
                stack.append(current)
                node = current.left
            }
            let current = stack.removeLast()
            out.append(current.value)
            node = current.right
        }
        return out
    }
}
'''
time = "O(h) per insert, contains, min and remove (O(log n) on a balanced tree); O(n) for inOrder"
space = "O(1) extra for insert, contains and min; O(h) for remove and inOrder"
justification = '''
`insert`, `contains` and `min` follow one path from the root downwards with a loop, doing
constant work per level, so each costs **O(h)** time and **O(1)** extra space. `remove` also
walks one path to the node; in the two-children case it continues down the right subtree to
the successor and removes it, and the successor has no left child, so that second removal is
the cheap one-child splice. Both walks lie on downward paths, so the total is still **O(h)**,
with O(h) stack for the recursive helper.

On random keys h = O(log n), a few dozen levels for 100,000 keys, which is why 20,000 removals
finish in milliseconds; on the 2,000-key sorted chain h = n, so each operation is O(n) and the
whole test is quadratic but small. `inOrder()` visits every node once with an explicit stack
of at most h nodes, so it is **O(n)** time and O(h) space and can't overflow the call stack on
a degenerate tree.

Returning the new subtree root from the recursive helper is what makes the root deletable
without a special case: the caller reattaches whatever comes back (`root = remove(...)`).
Copying the successor's value keeps the order intact, because the successor is larger than
everything on the left and smaller than everything else on the right.
'''

[[unit]]
id = "sw-u33-sorting-searching"
title = "Sorting and searching by hand"
level = "advanced"
difficulty = 33
intro = '''
`sort()` and `firstIndex(of:)` are excellent, but knowing how sorting and searching work is
what lets you reason about cost and adapt the ideas to new problems. You will write a generic
insertion sort, the merge step that powers merge sort, and a binary search that never goes off
by one, then use divide and conquer to sort an array and count how disordered it was, in
O(n log n).
'''
concepts = '''
## The idea

**Sorting** puts elements in order; **searching** finds one. They are linked: once data is sorted, you can search it in O(log n) instead of O(n).

Simple sorts compare neighbours. **Insertion sort** grows a sorted prefix by sliding each new element left until it fits. It is O(n²) in general but O(n) on nearly sorted input, which is why real libraries use it for short runs.

**Divide and conquer** does better. **Merge sort** splits the array in half, sorts each half recursively and **merges** the two sorted halves by repeatedly taking the smaller front element. There are log₂ n levels of splitting and each level merges n elements in total, so it is **O(n log n)** in every case, with O(n) extra memory. When equal elements are taken from the left half first, merge sort is **stable**: equal elements keep their original order, which matters when you sort records by one field after another.

**Binary search** works on a sorted array. Keep a range that must contain the answer, look at the middle, and discard the half that cannot. Each step halves the range: about 17 steps for 100,000 elements, 30 for a billion.

## How Swift does it

The standard library's `sort()` is a stable hybrid merge sort (it finds and merges runs, like Timsort), O(n log n). Writing your own generic algorithms uses the `Comparable` constraint, and in-place algorithms take an `inout` array:

```swift
func isSorted<T: Comparable>(_ a: [T]) -> Bool {
    zip(a, a.dropFirst()).allSatisfy { $0 <= $1 }
}
```

Slicing with `a[..<mid]` gives an `ArraySlice` that shares the array's storage and **keeps the original indices**: `a[3...]` starts at index 3, not 0. Convert with `Array(slice)` before indexing from zero. Binary search is simplest with a **half-open range** `low..<high`:

```swift
var low = 0, high = a.count
while low < high {
    let mid = low + (high - low) / 2
    // look at a[mid], then move low or high
}
```

## What is special or tricky

- **Off-by-one errors.** Mixing closed and half-open ranges is the classic binary-search bug. Pick half-open, and make every update shrink the range: `low = mid + 1` or `high = mid`.
- **Index out of range traps.** Swift checks every subscript, so `a[i]` past the end crashes with `Fatal error: Index out of range` instead of reading garbage.
- **Slices keep their indices.** `let right = a[mid...]; right[0]` traps unless `mid` is 0. Use `right.startIndex` or convert to an `Array`.
- **`inout` exclusivity.** You can't pass the same array as two `inout` arguments: `error: inout arguments are not allowed to alias each other`.
- **Stability is a property of the merge.** Use `<` (take from the right only when strictly smaller), not `<=`, and equal elements stay in order.

## What you will practise

You will write a generic insertion sort over an `inout` array, merge two sorted arrays, and find the first position of a value with a half-open binary search. The challenge sorts any `Comparable` array with merge sort and counts its inversions on the way, fast enough for 100,000 elements.
'''

[[unit.step]]
kind = "concept"
id = "sw-u33-c1-divide-conquer"
title = "Divide, conquer, merge"
points = 5
difficulty = 33
intro = '''
Divide and conquer solves a problem by splitting it into smaller copies, solving those, and
combining the answers. Merge sort is the textbook case: the split is trivial, the combining
step is a linear merge, and the result is O(n log n) in every case.
'''
body = '''
## Merge sort in three lines of thought

1. **Divide:** split the array at `mid = count / 2`.
2. **Conquer:** sort each half recursively. An array of 0 or 1 elements is already sorted:
   that is the base case.
3. **Combine:** merge the two sorted halves into one.

## The merge

Keep one index into each half. Compare the two front elements, append the smaller, and advance
that index. When one half runs out, append the rest of the other:

```text
left  [1, 4, 7]      right [2, 3, 8]
take 1, take 2, take 3, take 4, take 7, then the rest: 8
result [1, 2, 3, 4, 7, 8]
```

Each comparison places one element, so merging n elements costs O(n).

## Why O(n log n)

Halving n repeatedly reaches 1 after log₂ n levels. On each level the merges together touch all
n elements once. Total work: n per level × log₂ n levels. For 100,000 elements that is about
1.7 million steps, against 5 billion for an O(n²) sort.

## Counting while merging

Merging also reveals order information. When an element from the right half is taken before
elements still waiting in the left half, it is smaller than **all** of them, so it forms one
**inversion** (a pair that is out of order) with each. Adding `left.count - i` at that moment
counts the inversions across the two halves in O(1), and the recursion counts the ones inside
each half. That is the idea behind this unit's challenge.
'''

