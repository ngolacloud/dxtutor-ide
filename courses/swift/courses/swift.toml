`repeat-while`, and print odd numbers below 10 using `continue` and `break`.

**Why:** condition loops handle "repeat until done" problems, and `break` lets a search stop
as soon as it has its answer.
'''
target = '''
var n = 27
var steps = 0
while n != 1 {
    if n % 2 == 0 {
        n /= 2
    } else {
        n = 3 * n + 1
    }
    steps += 1
}
print("27 reaches 1 after", steps, "steps")

var number = 90210
var digits = 0
repeat {
    number /= 10
    digits += 1
} while number > 0
print("90210 has", digits, "digits")

for i in 1...20 {
    if i % 2 == 0 {
        continue
    }
    if i > 9 {
        break
    }
    print(i, terminator: " ")
}
print()
'''
