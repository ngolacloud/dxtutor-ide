[[unit.step]]
kind = "challenge"
id = "sw-u07-x1-average-readings"
title = "Average messy sensor readings"
points = 30
difficulty = 7
entry = "averageReading"
intro = '''
Real input is messy: fields are missing, padded with spaces, or not numbers at all. Treating
every failed parse as `nil` and skipping it is the optional-driven way to clean data, and
returning `Double?` instead of a magic `0` tells the caller honestly that there may be no
answer.
'''
instructions = '''
## Your turn

Implement `averageReading`:

```swift
func averageReading(_ readings: [String?]) -> Double?
```

Each element is one raw reading from a sensor log. Return the arithmetic mean of the **usable**
readings, or `nil` when there are none.

A reading is usable when:

- it is not `nil`;
- after trimming spaces, tabs and newlines from both ends, `Double(_:)` can parse it;
- the parsed value is finite. `Double` happily parses `"inf"` and `"nan"`, so skip those.

Ignore everything else silently, and never trap: no `!` on a parse result.

Examples:

- `averageReading(["1", "2", "3", "6"])` returns `3.0`.
- `averageReading([nil, "4", "abc", "6"])` returns `5.0`.
- `averageReading([" 2.5 ", "\t3.5"])` returns `3.0`.
- `averageReading([])` returns `nil`, and so does `averageReading([nil, "", "n/a"])`.

**Hint:** loop once, keeping a running sum and a count. `guard let ... else { continue }` skips
an entry. `trimmingCharacters(in: .whitespacesAndNewlines)` comes from Foundation, which the
starter imports, and `value.isFinite` rules out infinities and NaN.

Hidden tests decide correctness.
'''
starter = '''
