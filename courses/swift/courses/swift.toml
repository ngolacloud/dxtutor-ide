intro = '''
A recursive data type contains values of its own type, like an arithmetic expression whose
operands are expressions. Recursive functions follow the shape of the data: one `case` per
kind of node, calling themselves on the children. In Swift such an enum must be `indirect`.
'''
prompt = '''
Define an `indirect enum` for arithmetic expressions, then write two recursive functions over
it: one that evaluates the tree and one that renders it as text.

**Why:** expression trees are how compilers, calculators and query engines represent code, and
"one case per node kind, recurse on the children" is the pattern behind all of them.
'''
target = '''
indirect enum Expr {
    case number(Int)
    case add(Expr, Expr)
    case multiply(Expr, Expr)
    case negate(Expr)
}

func evaluate(_ expr: Expr) -> Int {
    switch expr {
    case .number(let n):
        return n
    case let .add(left, right):
        return evaluate(left) + evaluate(right)
    case let .multiply(left, right):
        return evaluate(left) * evaluate(right)
    case .negate(let inner):
        return -evaluate(inner)
    }
}

func render(_ expr: Expr) -> String {
    switch expr {
    case .number(let n): return String(n)
    case let .add(l, r): return "(\(render(l)) + \(render(r)))"
    case let .multiply(l, r): return "\(render(l)) * \(render(r))"
    case .negate(let e): return "-\(render(e))"
    }
}

let expr = Expr.multiply(.add(.number(2), .number(3)), .negate(.number(4)))
print(render(expr), "=", evaluate(expr))
'''
