[[unit.step]]
kind = "challenge"
id = "sw-u27-x1-tree-parent"
title = "A tree with weak parent pointers"
points = 40
difficulty = 27
entry = "TreeNode"
run_command = "swiftc -O -swift-version 6 Student.swift main.swift -o testbin && ./testbin"
intro = '''
Trees with parent pointers (file systems, menus, view hierarchies, DOM nodes) are the
textbook source of retain cycles: a parent refers to its children and every child refers
back. Getting the ownership right means strong references down the tree and weak references
up, so dropping the root frees every node.
'''
instructions = '''
## Your turn

Complete the `TreeNode` class:

```swift
final class TreeNode {
    let name: String
    private(set) var children: [TreeNode]
    var parent: TreeNode?        // decide its ownership
    init(_ name: String)
    @discardableResult func addChild(_ child: TreeNode) -> Bool
    func removeFromParent()
    var depth: Int { get }
    func path() -> String
}
```

Rules:

- A parent owns its children. The `parent` back-pointer must **not** keep the parent alive:
  when nobody outside holds a tree, every node in it is freed, and a child whose parent was
  freed sees `parent == nil`. Change the declaration of `parent` accordingly.
- `addChild` appends `child` to `children` and sets its `parent`. If the child already had a
  parent, it is first removed from that parent's `children` (it moves). Adding a node that is
  already a child of this node moves it to the end, and it still appears only once.
- `addChild` returns `false` and changes nothing when `child` is this node or one of its
  ancestors, because that would create a cycle; otherwise it returns `true`.
- `removeFromParent` removes this node (by identity, `===`) from its parent's `children` and
  sets `parent` to `nil`. On a root it does nothing.
- `depth` is the number of ancestors (0 for a root). `path()` joins the names from the root
  down to this node with `/`, so a root's path is its own name.

Example:

```swift
let root = TreeNode("root")
let docs = TreeNode("docs")
let file = TreeNode("a.txt")
root.addChild(docs)
docs.addChild(file)
file.path()           // "root/docs/a.txt"
file.depth            // 2
file.addChild(root)   // false: root is an ancestor of file
```

**Hint:** walking up with `var node = parent; while let current = node { ...; node = current.parent }`
answers `depth`, `path()` and the cycle check. Think about `weak` versus `unowned`: a child
can outlive its parent here.

Hidden tests decide correctness.
'''
starter = '''
/// A node of a tree (folders, menus, scene graphs...) with a back-pointer to its parent.
final class TreeNode {
    let name: String
    private(set) var children: [TreeNode] = []
    /// TODO: a parent owns its children. Choose the ownership of this
    /// back-pointer so that a tree is freed as soon as nobody holds it.
    var parent: TreeNode?

    init(_ name: String) {
        self.name = name
    }

    /// Attaches `child` as the last child of this node, detaching it from any
    /// previous parent. Refuses (returns false, changes nothing) when `child` is
    /// this node or one of its ancestors, because that would create a cycle.
    @discardableResult
    func addChild(_ child: TreeNode) -> Bool {
        fatalError("not implemented")
    }

    /// Detaches this node from its parent. Does nothing for a root.
    func removeFromParent() {
        fatalError("not implemented")
    }

    /// The number of ancestors: 0 for a root.
    var depth: Int {
        fatalError("not implemented")
    }

    /// The names from the root down to this node, joined by "/".
    func path() -> String {
        fatalError("not implemented")
    }
}
'''
tests = '''
        test("path, depth and parent links") {
            let root = TreeNode("root")
            let docs = TreeNode("docs")
            let file = TreeNode("a.txt")
            self.expect(root.addChild(docs))
            self.expect(docs.addChild(file))
            self.equal(file.path(), "root/docs/a.txt")
            self.equal(file.depth, 2)
            self.equal(root.depth, 0)
            self.equal(root.path(), "root")
            self.expect(file.parent === docs, "file.parent must be docs")
            self.expect(docs.parent === root, "docs.parent must be root")
            self.expect(root.parent == nil, "a root has no parent")
        }
        test("children keep insertion order") {
            let root = TreeNode("root")
            for name in ["b", "a", "c"] {
                root.addChild(TreeNode(name))
            }
            self.equal(root.children.map { $0.name }, ["b", "a", "c"])
            self.expect(root.children.allSatisfy { $0.parent === root })
        }
        test("adding a node to a new parent moves it") {
            let left = TreeNode("left")
            let right = TreeNode("right")
            let leaf = TreeNode("leaf")
            left.addChild(leaf)
            right.addChild(leaf)
            self.equal(left.children.count, 0)
            self.equal(right.children.map { $0.name }, ["leaf"])
            self.equal(leaf.path(), "right/leaf")
            right.addChild(leaf)
            self.equal(right.children.count, 1)
        }
        test("removeFromParent detaches, and is a no-op on a root") {
            let root = TreeNode("root")
            let a = TreeNode("a")
            let b = TreeNode("b")
            root.addChild(a)
            root.addChild(b)
            a.removeFromParent()
            self.expect(a.parent == nil)
            self.equal(root.children.map { $0.name }, ["b"])
            self.equal(a.path(), "a")
            root.removeFromParent()
            a.removeFromParent()
            self.equal(root.children.count, 1)
        }
        test("cycles are refused and change nothing") {
            let root = TreeNode("root")
            let mid = TreeNode("mid")
            let leaf = TreeNode("leaf")
            root.addChild(mid)
            mid.addChild(leaf)
            self.expect(!root.addChild(root), "a node cannot be its own child")
            self.expect(!leaf.addChild(root), "an ancestor cannot become a child")
            self.expect(!leaf.addChild(mid), "a parent cannot become a child of its child")
            self.equal(leaf.path(), "root/mid/leaf")
            self.equal(leaf.children.count, 0)
            self.equal(root.children.count, 1)
            self.expect(root.parent == nil)
        }
        test("a tree nobody holds is freed (no retain cycle)") {
            weak var weakRoot: TreeNode?
            weak var weakMid: TreeNode?
            weak var weakLeaf: TreeNode?
            do {
                let root = TreeNode("root")
                let mid = TreeNode("mid")
                let leaf = TreeNode("leaf")
                root.addChild(mid)
                mid.addChild(leaf)
                weakRoot = root
                weakMid = mid
                weakLeaf = leaf
                self.expect(weakLeaf != nil)
            }
            self.expect(weakRoot == nil, "the root leaked: parent and child keep each other alive")
            self.expect(weakMid == nil, "an inner node leaked")
            self.expect(weakLeaf == nil, "a leaf leaked")
        }
        test("a child does not keep its parent alive") {
            let leaf = TreeNode("leaf")
            weak var weakRoot: TreeNode?
            do {
                let root = TreeNode("root")
                root.addChild(leaf)
                weakRoot = root
                self.equal(leaf.path(), "root/leaf")
            }
            self.expect(weakRoot == nil, "the child kept its parent alive")
            self.expect(leaf.parent == nil, "the back-pointer must become nil")
            self.equal(leaf.path(), "leaf")
            self.equal(leaf.depth, 0)
        }
        test("a removed child is freed when nobody else holds it") {
            let root = TreeNode("root")
            weak var weakChild: TreeNode?
            do {
                let child = TreeNode("child")
                root.addChild(child)
                weakChild = child
            }
            self.expect(weakChild != nil, "the parent must own its children")
            weakChild?.removeFromParent()
            self.expect(weakChild == nil, "the removed child is still referenced somewhere")
            self.equal(root.children.count, 0)
        }
        test("wide and deep trees") {
            let root = TreeNode("r")
            var kids: [TreeNode] = []
            for i in 0..<10_000 {
                let kid = TreeNode("k\(i)")
                root.addChild(kid)
                kids.append(kid)
            }
            self.equal(kids[9_999].path(), "r/k9999")
            kids[5_000].removeFromParent()
            self.equal(root.children.count, 9_999)
            self.equal(root.children[5_000].name, "k5001")
            var tip = root
            for i in 0..<1_000 {
                let next = TreeNode("d\(i)")
                tip.addChild(next)
                tip = next
            }
            self.equal(tip.depth, 1_000)
            self.expect(tip.path().hasPrefix("r/d0/d1/d2/"))
            self.expect(tip.path().hasSuffix("/d998/d999"))
        }
