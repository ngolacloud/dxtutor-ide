        test("max and min") {
            let all = ["1.0", "10.0.1", "9.99", "10"].compactMap { Version($0) }
            self.equal(all.max()?.description, "10.0.1")
            self.equal(all.min()?.description, "1")
        }
        test("10,000 versions sort correctly") {
            let versions = (0..<10_000).compactMap { Version("\($0 % 7).\($0 % 13).\($0)") }
            self.equal(versions.count, 10_000)
