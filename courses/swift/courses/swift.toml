[[unit]]
id = "sw-u26-result-builders"
title = "Result builders: a small DSL"
level = "advanced"
difficulty = 26
intro = '''
A result builder lets the statements of a closure be collected into a value instead of being
thrown away, which is how SwiftUI views, HTML generators and routing tables read like a
little language of their own. You will write builders from the simplest `buildBlock` up to
`if`, `if`/`else` and `for` support, and finish with an HTML DSL that renders escaped markup.
'''
concepts = '''
## The idea

Normally the expression statements inside a closure are evaluated and discarded: a line that
only says `"apples"` does nothing. A **result builder** changes that rule for one closure.
The compiler collects every expression statement as a **component** and hands the components
to static methods of a builder type, which combine them into one result. The result is an
**embedded DSL** (domain-specific language): code that reads like a declaration of *what* you
want, with no `append` calls and no temporary arrays, while staying ordinary, type-checked
Swift. SwiftUI's `VStack { Text("a"); Text("b") }` is the famous example; HTML generators,
route tables and test suites use the same trick.

## How Swift does it

Mark a type with `@resultBuilder`, give it `static` build methods, and mark a closure
parameter with the builder's name:

```swift
@resultBuilder
enum Words {
    static func buildBlock(_ parts: String...) -> String {
        parts.joined(separator: " ")
    }
}

func sentence(@Words _ make: () -> String) -> String { make() }

let s = sentence {
    "result"
    "builders"
}   // "result builders"
```

The compiler rewrites that closure into roughly
`return Words.buildBlock("result", "builders")`. Each extra method unlocks more syntax:

- `buildBlock(_:)` combines the components of one block. It is the only required method.
- `buildExpression(_:)` converts each statement into the component type first. Overloads let
  a block accept several types, for example both strings and nodes.
- `buildOptional(_:)` makes `if` without `else` legal; it receives `nil` when the condition
  was false.
- `buildEither(first:)` and `buildEither(second:)` make `if`/`else` (and `switch`) legal.
- `buildArray(_:)` makes `for`-`in` legal; it receives one component per iteration.

A popular design makes the component type an array, `[T]`. Then every method is a small
flatten, and an empty block, a skipped `if` and a loop over nothing all become `[]`.

## Pitfalls and compiler errors

- Using `if` or `for` when the builder lacks `buildOptional`, `buildEither` or `buildArray`
  fails with `closure containing control flow statement cannot be used with result builder`.
- A statement of a type the builder does not accept fails with an ordinary conversion error,
  such as `cannot convert value of type 'Int' to expected argument type 'String'`. Add a
  `buildExpression` overload or convert the value yourself.
- `let` declarations inside the block are fine and produce no component, but an explicit
  `return` turns the builder off for that closure.
- Build methods must be `static`: the builder type is never instantiated.
- Large builder bodies are slow to type-check, so keep each block short and split big ones
  into helper functions.

## What you will practise

You will write a bullet-list builder with only `buildBlock`, add `buildExpression`,
`buildOptional` and `buildEither` so a checklist can branch, and use `buildArray` to generate
routes with a loop. The challenge is a complete HTML builder with a renderer that escapes text.
'''

[[unit.step]]
kind = "concept"
id = "sw-u26-c1-builder-transform"
title = "What the compiler does with a builder closure"
points = 5
difficulty = 26
intro = '''
A result builder is a compile-time rewrite, not a runtime feature. Understanding the
rewrite, statement by statement, is what makes the error messages and the set of build
methods make sense.
'''
body = '''
## The rewrite

Given a builder with `buildExpression` and `buildBlock`, this closure

```swift
page {
    "Title"
    paragraph
}
```

is compiled as if you had written

```swift
page {
    let v0 = Builder.buildExpression("Title")
    let v1 = Builder.buildExpression(paragraph)
    return Builder.buildBlock(v0, v1)
}
```

Nothing is evaluated lazily and nothing is stored behind your back: every statement runs
once, in order, and its value becomes an argument of `buildBlock`.

## Control flow becomes method calls

An `if` without `else` turns into a call to `buildOptional`, which receives the branch's
result or `nil`. An `if`/`else` becomes nested `buildEither(first:)` and
`buildEither(second:)` calls, so both branches must produce the same component type. A `for`
loop collects one component per iteration into an array and passes it to `buildArray`.

## Choosing the component type

If the component type is an array such as `[String]`, all of these are easy:
`buildBlock` flattens its arguments, `buildOptional` turns `nil` into `[]`, both `buildEither`
methods return their argument unchanged, and `buildArray` flattens again. That is the design
you will use in every step of this unit, because it makes the builder correct by
construction: whatever the closure does, the output is a flat list in source order.
'''

