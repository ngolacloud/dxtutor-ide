[unit.step.gabarito]
solution = '''
/// A tiny HTML document tree: either escaped text or an element with children.
enum HTMLNode: Equatable {
    case text(String)
    case element(tag: String, children: [HTMLNode])
}

/// Turns the statements of an `element { ... }` block into a flat list of child nodes.
@resultBuilder
enum HTMLBuilder {
    static func buildExpression(_ node: HTMLNode) -> [HTMLNode] {
        [node]
    }

    static func buildExpression(_ text: String) -> [HTMLNode] {
        [.text(text)]
    }

    static func buildBlock(_ components: [HTMLNode]...) -> [HTMLNode] {
        components.flatMap { $0 }
    }

    static func buildOptional(_ component: [HTMLNode]?) -> [HTMLNode] {
        component ?? []
    }

    static func buildEither(first component: [HTMLNode]) -> [HTMLNode] {
        component
    }

    static func buildEither(second component: [HTMLNode]) -> [HTMLNode] {
        component
    }

    static func buildArray(_ components: [[HTMLNode]]) -> [HTMLNode] {
        components.flatMap { $0 }
    }
}

/// Builds an element whose children come from the builder block.
func element(_ tag: String, @HTMLBuilder _ content: () -> [HTMLNode]) -> HTMLNode {
    .element(tag: tag, children: content())
}

/// Renders a node as HTML, escaping the text inside it.
func render(_ node: HTMLNode) -> String {
    var out = ""
    write(node, into: &out)
    return out
}

private func write(_ node: HTMLNode, into out: inout String) {
    switch node {
    case .text(let text):
        for ch in text {
            switch ch {
            case "&": out += "&amp;"
            case "<": out += "&lt;"
            case ">": out += "&gt;"
            case "\"": out += "&quot;"
            default: out.append(ch)
            }
        }
    case .element(let tag, let children):
        out += "<\(tag)>"
        for child in children {
            write(child, into: &out)
        }
        out += "</\(tag)>"
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let *n* be the size of the tree plus the length of its text. Building the tree is **O(n)**:
each build method touches each component once, and `flatMap` only concatenates arrays whose
total length is the number of children of that element.

`render` is a depth-first traversal that visits every node once and examines every character
of every text once, appending to a single `inout String`. Appending to a `String` is
amortized O(1) per character because the buffer grows geometrically, so rendering is
**O(n)** time. The output string is O(n) and the recursion depth is the height of the tree,
so the space is **O(n)** overall.

The naive alternative, `children.map(render).joined()` at every level, is also correct, but
it builds an intermediate string for every subtree and copies each character once per
ancestor, which costs O(n · height) in a deep document. Escaping character by character in one
pass also avoids the subtle bug of chained `replacingOccurrences` calls, where replacing `&`
after `<` would turn `&lt;` into `&amp;lt;`.
'''

[[unit]]
id = "sw-u27-memory-arc"
title = "Memory and ARC: strong, weak and unowned"
level = "advanced"
difficulty = 27
intro = '''
Swift frees class instances with Automatic Reference Counting: every strong reference keeps an
object alive, and the moment the last one disappears the object's `deinit` runs. You will
watch that happen, create a retain cycle and break it with `weak`, capture `self` safely in a
closure, and finish with a tree whose parent back-pointers never leak.
'''
concepts = '''
## The idea

Values of struct and enum types are copied and live wherever they are stored, so they need no
memory management. Class instances are different: many variables can refer to the **same**
object on the heap, so something must decide when that object is no longer needed. Swift uses
**Automatic Reference Counting (ARC)**. Every class instance carries a count of the **strong**
references to it. Assigning the object to a variable, a property or an array element
increments the count; when that reference goes away (the variable goes out of scope, is set to
`nil` or is overwritten) the count is decremented. When it reaches zero, Swift runs the
object's `deinit` and frees the memory immediately.

ARC is deterministic, unlike a tracing garbage collector: no background pauses, and cleanup
happens at a predictable point. The price is that ARC cannot see **cycles**. If A strongly
refers to B and B strongly refers to A, both counts stay above zero forever, even when your
program can no longer reach either object. That is a **memory leak**.

## How Swift does it

```swift
final class Node {
    var next: Node?          // strong: keeps the next node alive
    weak var previous: Node? // weak: does not count, becomes nil on deinit
    unowned let list: List   // unowned: does not count, must outlive me
    init(list: List) { self.list = list }
    deinit { print("node freed") }
}
```

- A **strong** reference is the default. Use it for ownership: a parent owns its children, an
  array owns its elements.
- A **weak** reference does not increase the count. It must be an optional, and ARC sets it to
  `nil` automatically when the object is freed. Use it for back-pointers (child to parent),
  delegates and caches.
- An **unowned** reference also does not count, but it is not optional and is never set to
  `nil`. Use it only when the other object is guaranteed to live at least as long. Reading an
  unowned reference after the object died traps with
  `Attempted to read an unowned reference but object ... was already destroyed`.

Closures are reference types too, and they capture strongly by default. A class that stores a
closure which mentions `self` forms a cycle; a **capture list** such as `[weak self]` breaks it.

## Pitfalls and compiler errors

- `'weak' variable should have optional type`: a weak reference can always become `nil`.
- `reference to property 'x' in closure requires explicit use of 'self' to make capture
  semantics explicit`: Swift makes you write `self.` in escaping closures so the capture is
  visible. Consider whether it should be `[weak self]`.
- After `[weak self]`, unwrap once with `guard let self else { return }` instead of writing
  `self?.` on every line.
- Don't use `unowned` just to avoid unwrapping: when in doubt, use `weak`.
- `deinit` runs when the last strong reference ends, which may be earlier than the end of the
  enclosing scope once the variable is no longer used. Tests therefore keep a `weak` probe and
  check that it became `nil`.

## What you will practise

You will log `init` and `deinit` to see reference counts at work, break a two-object cycle
with `weak`, and use `[weak self]` in a stored closure. The challenge is a tree whose nodes
own their children but only weakly refer to their parent.
'''

[[unit.step]]
kind = "concept"
id = "sw-u27-c1-reference-counting"
title = "Reference counts, deinit and cycles"
points = 5
difficulty = 27
intro = '''
Reference counting is a simple bookkeeping rule: count the owners, free the object when the
count reaches zero. Seeing exactly when the count changes explains both why ARC is
predictable and why it leaks on cycles.
'''
body = '''
## Counting owners

```swift
var a: Report? = Report()   // count 1
var b = a                   // count 2: same object, second owner
a = nil                     // count 1
b = nil                     // count 0: deinit runs now
```

Only class instances are counted. Copying a struct copies its value, so there is nothing to
share and nothing to count (a struct's class-typed properties are counted, of course).

## When the count reaches zero

Swift calls `deinit` synchronously, at the point where the last strong reference ended, and
then frees the memory. That is why a `deinit` can reliably close a file or print a message:
there is no collector running later at an unknown time.

## Cycles

```swift
final class Person { var flat: Flat? }
final class Flat { var tenant: Person? }
```

If a person refers to their flat and the flat refers back to the person, each object holds
the other's count at 1 or more. Drop every outside variable and both objects are now
unreachable, yet neither count is zero, so neither `deinit` ever runs. ARC has no cycle
detector.

The fix is to decide who **owns** whom. The person owns the flat (strong), and the flat only
**knows** its tenant (`weak var tenant: Person?`). A weak reference is not counted, so when
the last outside reference to the person goes away the person is freed, its `flat` property is
released, and the flat follows. As a bonus, ARC sets every weak reference to the person to
`nil`, so nobody is left holding a dangling pointer.
'''

