instructions = '''
## Your turn

Implement the `Version` struct:

```swift
struct Version: Comparable, Hashable, CustomStringConvertible {
    init?(_ text: String)
    static func < (lhs: Version, rhs: Version) -> Bool
    var description: String { get }
}
```

Rules:

- `init?` accepts one or more dot-separated non-negative integers written with ASCII digits
  only: `"2"`, `"1.10"`, `"0.3.7"`, `"007.1"`. It returns `nil` for anything else: `""`,
  `"1..2"`, `"1."`, `".1"`, `"1.x"`, `"-1"`, `"+1"`, `" 1.2"`, `"v1"`, or a component too
  large for `Int`.
- **Trailing zero components don't matter:** `Version("1.2") == Version("1.2.0")`, and both
  are equal to `Version("1.2.0.0")`.
- **Order compares components numerically**, left to right: `1.9 < 1.10 < 2`, and
  `1.2 < 1.2.1`.
- Equal versions must have equal hashes, so a `Set` or `Dictionary` treats `1.2` and `1.2.0`
  as the same key.
- `description` is the version without trailing zero components, keeping at least one:
  `"1.2.0"` gives `"1.2"`, `"007.1"` gives `"7.1"`, `"0.0"` gives `"0"`.

**Hint:** store the parsed components with the trailing zeros already removed. Then the
synthesized `==` and `hash(into:)` are correct as they are, and `<` is a lexicographic
comparison of two `[Int]` arrays (`lexicographicallyPrecedes`).

Hidden tests decide correctness.
