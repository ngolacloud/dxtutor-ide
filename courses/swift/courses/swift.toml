[unit.step.gabarito]
solution = '''
import Foundation

enum OrderStatus: String, Decodable {
    case paid, pending, refunded
}

struct Order: Decodable {
    let orderID: Int
    let customer: String
    let totalCents: Int
    let status: OrderStatus

    enum CodingKeys: String, CodingKey {
        case orderID = "order_id"
        case customer
        case totalCents = "total_cents"
        case status
    }
}

struct OrdersPayload: Decodable {
    let orders: [Order]
}

struct OrdersSummary: Encodable {
    let count: Int
    let customers: [String]
    let pending: Int
    let revenueCents: Int

    enum CodingKeys: String, CodingKey {
        case count, customers, pending
        case revenueCents = "revenue_cents"
    }
}

enum OrdersError: Error {
    case negativeTotal(orderID: Int)
}

/// Decodes an orders payload and returns a summary as JSON with sorted keys.
func summarizeOrders(_ json: String) throws -> String {
    let payload = try JSONDecoder().decode(OrdersPayload.self, from: Data(json.utf8))
    if let bad = payload.orders.first(where: { $0.totalCents < 0 }) {
        throw OrdersError.negativeTotal(orderID: bad.orderID)
    }
    let paid = payload.orders.filter { $0.status == .paid }
    let summary = OrdersSummary(
        count: paid.count,
        customers: Set(paid.map(\.customer)).sorted(),
        pending: payload.orders.filter { $0.status == .pending }.count,
        revenueCents: paid.reduce(0) { $0 + $1.totalCents }
    )
    let encoder = JSONEncoder()
    encoder.outputFormatting = [.sortedKeys]
    return String(decoding: try encoder.encode(summary), as: UTF8.self)
}
'''
time = "O(n + c log c)"
space = "O(n)"
justification = '''
Let `n` be the size of the input and `c` the number of distinct paying customers. Decoding
reads the text once, **O(n)**. The validation pass, the two filters and the `reduce` are
each one pass over the orders, so they are O(n) too. Collecting customers into a `Set` is
O(n) on average, and sorting the `c` distinct names is **O(c log c)**. Encoding the summary
is proportional to its size, which is O(c). The total is **O(n + c log c)**.

The decoded orders and the `paid` array take **O(n)** space; the set and the sorted
customer list take O(c) ≤ O(n).

The design does the validation where it is cheapest. The `OrderStatus` enum and the
non-optional properties make the decoder reject unknown statuses and missing or mistyped
fields, so the business logic only ever sees well-formed orders. The one rule the type system
can't express, a non-negative total, is a single explicit check. `.sortedKeys` makes the
output deterministic: without it the key order would follow the encoder's internal
dictionary and could change between runs.
'''

[[unit]]
id = "sw-u18-dates"
title = "Dates, calendars and time zones"
level = "intermediate"
difficulty = 18
intro = '''
Dates look simple until a month has 29 days, a user lives in another time zone, or a test
passes on your laptop and fails on the build server. This unit separates the instant (`Date`)
from its human reading (`Calendar`, `TimeZone`, `DateComponents`), and shows how to parse,
format and do arithmetic with dates in a way that gives the same answer on every machine.
'''
concepts = '''
## The idea

A **moment in time** and **the way people write it** are different things. "The build
finished" happened at one instant everywhere on Earth; it was 22:13 in London and 07:13 the
next day in Tokyo. Keeping the instant separate from its presentation is what makes date
code correct.

## How Swift does it

- **`Date`** is just an instant: a `Double` count of seconds since 1 January 2001, 00:00:00
  UTC. It has no time zone, no calendar and no format. Comparing and subtracting dates is
  plain arithmetic.
- **`Calendar`** turns an instant into human fields and back. It needs a **`TimeZone`** to
  know which wall clock to use.
- **`DateComponents`** holds those fields (`year`, `month`, `day`, `hour`, `weekday`…),
  each optional.
- **`ISO8601DateFormatter`** reads and writes machine timestamps such as
  `2024-02-28T23:30:00Z`. **`DateFormatter`** handles custom patterns such as `yyyy-MM-dd`.

```swift
import Foundation

var calendar = Calendar(identifier: .gregorian)
calendar.timeZone = TimeZone(identifier: "UTC")!
let instant = Date(timeIntervalSince1970: 0)
print(calendar.component(.year, from: instant))   // 1970
```

Use calendar arithmetic, `calendar.date(byAdding: .month, value: 1, to: d)`, for anything a
human would call "a day" or "a month". Adding `86_400` seconds is not always one day once
daylight saving time is involved, and months have different lengths: adding one month to
31 January gives the last day of February.

## Deterministic date code

Date bugs love hidden inputs. Remove them:

- **Never read the clock inside logic you test.** `Date()` changes every run; pass "now" in
  as a parameter.
- **Never rely on the machine's settings.** `Calendar.current`, `TimeZone.current` and
  `Locale.current` differ between your laptop, a server and a user's phone. Create a
  Gregorian calendar and set `TimeZone(identifier: "UTC")` explicitly.
- **Pin the locale of fixed formats** with `Locale(identifier: "en_US_POSIX")`, so a user's
  12-hour clock or non-Gregorian calendar setting can't change how `yyyy-MM-dd` is parsed.

## Pitfalls and compiler errors

- `TimeZone(identifier:)` returns an optional, because the name may be unknown. Assigning
  it directly fails with *"value of optional type 'TimeZone?' must be unwrapped to a value
  of type 'TimeZone'"*. Unwrap it (`!` is acceptable for the literal `"UTC"`).
- `YYYY` is not `yyyy`. `YYYY` is the *week-based* year, so 30 December 2024 formats as
  2025. Use `yyyy` for calendar years.
- Formatters can be lenient. A `DateFormatter` with `yyyy-MM-dd` accepts `2024-1-5` and even
  ` 2024-01-15` with a leading space, and `ISO8601DateFormatter` turns `2024-02-30` into
  1 March. To validate strictly, format the parsed date back and compare it with the input.
- `calendar.date(byAdding:to:)` returns an optional: unwrap it before use.

## What you will practise

You will read calendar fields from a fixed instant in two time zones, parse and format ISO
8601 timestamps and add days and months, and count days between dates with a POSIX
formatter. The challenge builds a monthly billing schedule that handles month ends and leap
years.
'''

[[unit.step]]
kind = "concept"
id = "sw-u18-c1-instant-vs-calendar"
title = "Instants, calendars and time zones"
points = 5
difficulty = 18
intro = '''
Time libraries are built on one split: an absolute instant on a single global timeline, and
a calendar plus time zone that map that instant to the fields people read. Keeping the two
apart is what makes date arithmetic and storage correct.
'''
body = '''
## One timeline

A `Date` is a position on a single timeline shared by every computer. Internally it is
`timeIntervalSinceReferenceDate`, the seconds since 2001-01-01 00:00:00 UTC, and
`timeIntervalSince1970` gives the Unix timestamp. Two `Date`s compare with `<` and subtract
with `timeIntervalSince(_:)`, which returns seconds.

## Many wall clocks

To show a date to a person you must choose a **calendar** (Gregorian, almost always) and a
**time zone**. The same instant reads differently in each zone:

```swift
var utc = Calendar(identifier: .gregorian)
utc.timeZone = TimeZone(identifier: "UTC")!
var tokyo = utc
tokyo.timeZone = TimeZone(secondsFromGMT: 9 * 3600)!

let d = Date(timeIntervalSince1970: 1_700_000_000)
utc.component(.hour, from: d)    // 22
tokyo.component(.hour, from: d)  // 7, on the next day
```

`TimeZone(secondsFromGMT:)` gives a fixed offset with no daylight saving rules; a named zone
such as `"Europe/Lisbon"` follows that region's rules.

## Store instants, present fields

The safe pattern for real systems:

1. **Store and transmit instants**, as ISO 8601 strings in UTC (`2023-11-14T22:13:20Z`) or
   as Unix timestamps.
2. **Convert to calendar fields only at the edges**, when showing a date to a user or
   reading one they typed, with an explicit time zone.
3. **Do calendar arithmetic with `Calendar`**, never with hand-made multiples of 86,400
   seconds.

A calendar also knows its own rules: `weekday` numbers Sunday as 1, `range(of:in:for:)`
tells you how many days a month has, and `dateComponents(_:from:to:)` measures the distance
between two dates in days, months or years.
'''

