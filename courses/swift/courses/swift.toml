struct SameHash: Hashable {
    let id: Int
    func hash(into hasher: inout Hasher) { hasher.combine(0) }
}

test("a new table is empty") {
    let table = HashTable<String, Int>()
    self.equal(table.count, 0)
    self.equal(table["missing"], nil)
    self.equal(table.keys, [])
}

test("insert, read and overwrite") {
    var table = HashTable<String, Int>()
    table["apple"] = 3
    table["pear"] = 5
    self.equal(table["apple"], 3)
    self.equal(table["pear"], 5)
    self.equal(table["plum"], nil)
    table["apple"] = 10
    self.equal(table["apple"], 10)
    self.equal(table.count, 2)
    self.equal(table.keys.sorted(), ["apple", "pear"])
}

test("removeValue and assigning nil") {
    var table = HashTable<Int, String>()
    table[1] = "one"
    table[2] = "two"
    table[-3] = "minus three"
    self.equal(table.removeValue(forKey: 2), "two")
    self.equal(table.removeValue(forKey: 2), nil)
    self.equal(table[2], nil)
    self.equal(table.count, 2)
    table[-3] = nil
    self.equal(table[-3], nil)
    self.equal(table.count, 1)
    table[99] = nil
    self.equal(table.count, 1)
    self.equal(table.keys, [1])
}

test("colliding keys share a bucket and stay separate") {
    var table = HashTable<SameHash, Int>()
    for i in 0..<50 { table[SameHash(id: i)] = i * i }
    self.equal(table.count, 50)
    self.equal(table[SameHash(id: 7)], 49)
    self.equal(table[SameHash(id: 50)], nil)
    table[SameHash(id: 7)] = -1
    self.equal(table[SameHash(id: 7)], -1)
    self.equal(table.removeValue(forKey: SameHash(id: 0)), 0)
    self.equal(table.count, 49)
    self.equal(Set(table.keys.map(\.id)), Set(1..<50))
}

test("the table grows to keep the load factor at most 0.75") {
    var table = HashTable<Int, Int>()
    self.equal(table.bucketCount, 8)
    for i in 0..<6 { table[i] = i }
    self.equal(table.bucketCount, 8)
    table[6] = 6
    self.equal(table.bucketCount, 16)
    for i in 7..<1000 { table[i] = i }
    self.expect(table.count * 4 <= table.bucketCount * 3, "load factor above 0.75")
    self.expect(table.bucketCount <= 4096, "the table grew far more than needed")
    for i in 0..<1000 where table[i] != i {
        self.expect(false, "lost key \(i) while growing")
