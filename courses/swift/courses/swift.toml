instructions = '''
## Your turn

Implement the sequence `RunLengths` and its iterator:

```swift
struct Run<Value: Equatable>: Equatable { let value: Value; let count: Int }

struct RunLengths<Base: Sequence>: Sequence where Base.Element: Equatable {
    init(_ base: Base)
    func makeIterator() -> Iterator
    struct Iterator: IteratorProtocol {
        mutating func next() -> Run<Base.Element>?
    }
}
```

`Run` is provided; don't change it. Add whatever stored properties and initializer your
`Iterator` needs.

Rules:

- Each maximal group of equal **adjacent** elements becomes one `Run` with that value and the
  group's length. Equal values that are not adjacent form separate runs.
- An empty base yields no runs.
- It must be **lazy**: nothing is read from the base until the first call to `next()`, and
  producing a run reads that run plus at most one more element (the first element of the next
  run). So it must work on an infinite base with `prefix`.
- `next()` keeps returning `nil` once the base is exhausted.
- Each call to `makeIterator()` starts from the beginning of the base (for a multi-pass base
  such as an array).

Examples:

```swift
Array(RunLengths([1, 1, 2, 3, 3, 3]))
// [Run(value: 1, count: 2), Run(value: 2, count: 1), Run(value: 3, count: 3)]

RunLengths("aaabcc").map { "\($0.count)\($0.value)" }.joined()   // "3a1b2c"
```

**Hint:** the iterator holds the base's iterator and one "pending" element, the first
element of the next run, which it has already read. Remember that a `nil` pending element
can mean either "not started yet" or "finished".

Hidden tests decide correctness.
