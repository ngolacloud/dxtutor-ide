[unit.step.gabarito]
solution = '''
/// Sorts `values` with merge sort and counts its inversions: the pairs of
/// indices i < j with values[i] > values[j].
func sortAndCountInversions<T: Comparable>(_ values: [T]) -> (sorted: [T], inversions: Int) {
    if values.count < 2 { return (values, 0) }
    let mid = values.count / 2
    let (left, leftInversions) = sortAndCountInversions(Array(values[..<mid]))
    let (right, rightInversions) = sortAndCountInversions(Array(values[mid...]))
    var merged: [T] = []
    merged.reserveCapacity(values.count)
    var inversions = leftInversions + rightInversions
    var i = 0, j = 0
    while i < left.count && j < right.count {
        if right[j] < left[i] {
            merged.append(right[j])
            inversions += left.count - i
            j += 1
        } else {
            merged.append(left[i])
            i += 1
        }
    }
    merged += left[i...]
    merged += right[j...]
    return (merged, inversions)
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
The recursion halves the array until the pieces have 0 or 1 elements, so it is log₂ n levels
deep. On each level, the merges together append every element exactly once and do O(1)
counting work per step, so each level costs O(n) and the total is **O(n log n)**, whether the
input is sorted, reversed or random.

The count is correct because every inversion (i, j) is counted exactly once, at the level where
i and j fall into different halves: inversions inside a half are counted by the recursive
calls, and cross inversions are counted during the merge. When `right[j]` is taken before the
`left.count - i` elements still waiting in the left half, it is smaller than all of them,
because the halves are sorted. Taking from the right only when **strictly** smaller means equal
elements never count as inversions and stay in their original order, which is the stability
rule.

Extra space is **O(n)**: the arrays alive along one recursion path (the halves and their
merges) total a constant times n + n/2 + n/4 + ... < 2n elements, plus O(log n) stack frames. The brute-force double loop would be
O(n²): 5 × 10⁹ comparisons for 100,000 elements, many seconds even compiled with `-O`.
'''

[[unit]]
id = "sw-u34-recursion-dp"
title = "Recursion and dynamic programming"
level = "advanced"
difficulty = 34
intro = '''
Recursion solves a problem by solving smaller copies of itself, and dynamic programming makes
that fast when the same copies come up again and again. You will recurse over a nested
`indirect enum`, count how much work naive Fibonacci wastes compared with a memo, fill a
two-dimensional table bottom-up, and finish by computing the edit distance between two strings.
'''
concepts = '''
## The idea

A **recursive** function calls itself on a smaller input. Every recursion needs two parts: a **base case** that answers directly, and a **recursive case** that reduces the problem towards it. Miss the base case, or fail to shrink the input, and the calls never stop.

Recursion fits naturally **self-similar** data: a tree is a node plus smaller trees, and a nested list is a list of items, each of which may be a nested list.

Some recursions recompute the same subproblems many times. Naive Fibonacci calls `fib(n - 1)` and `fib(n - 2)`, and both of those call `fib(n - 3)`, and so on: the number of calls grows like 1.6ⁿ. **Dynamic programming** (DP) applies when a problem has **overlapping subproblems** and **optimal substructure** (the best answer is built from best answers to subproblems). It solves each subproblem once:

- **Top-down (memoisation):** keep the recursion, but store each result in a dictionary and look it up before computing.
- **Bottom-up (tabulation):** fill a table from the smallest subproblems upwards with loops, so no recursion is needed at all.

Either way the cost becomes *number of subproblems × work per subproblem*, which turns exponential algorithms into polynomial ones.

## How Swift does it

Recursive functions are ordinary functions, and nested functions can recurse too. A recursive data type is an `indirect enum`:

```swift
indirect enum Expr {
    case number(Int)
    case add(Expr, Expr)
}
func eval(_ e: Expr) -> Int {
    switch e {
    case .number(let n): return n
    case .add(let a, let b): return eval(a) + eval(b)
    }
}
```

A memo is a `[Int: Int]` dictionary passed `inout`, or owned by a class or a struct with a `mutating` method. A bottom-up table is a nested array:

```swift
var table = Array(repeating: Array(repeating: 0, count: cols), count: rows)
```

Strings are not integer-indexable in Swift, because a `Character` can span several bytes. Convert once with `Array(text)` to get a `[Character]` you can index in O(1).

## What is special or tricky

- **No recursion limit, but a finite stack.** Swift doesn't stop deep recursion with an error; it overflows the stack and the program crashes (`EXC_BAD_ACCESS` or a segmentation fault). The main thread has about 8 MB, so tens of thousands of frames can be too many. Bottom-up loops avoid the problem.
- **No guaranteed tail calls.** The optimiser may turn a tail call into a jump, but the language doesn't promise it, so don't rely on it.
- **A closure can't easily call itself.** Use a nested `func` for recursive helpers.
- **Global mutable memo tables are errors in Swift 6.** A top-level `var cache` used from a function is shared mutable state. Pass the memo in, or keep it inside a type.
- `Array(repeating: row, count: n)` copies the row value, so each row is independent, unlike Python's `[[0] * c] * r` trap.

## What you will practise

You will sum and measure a nested enum recursively, count the calls of naive and memoised Fibonacci, and fill a grid of path counts bottom-up. The challenge is the classic **edit distance** between two strings, solved with a DP table on inputs too long for plain recursion.
'''

[[unit.step]]
kind = "concept"
id = "sw-u34-c1-recursion-memo"
title = "Base cases, overlap and the memo"
points = 5
difficulty = 34
intro = '''
Every recursion is a base case plus a step that shrinks the problem. When the same smaller
problems recur, storing their answers in a memo or a table makes each one cost O(1) after the
first time, which is the whole idea of dynamic programming.
'''
body = '''
## Base case and recursive case

```swift
func factorial(_ n: Int) -> Int {
    n <= 1 ? 1 : n * factorial(n - 1)
}
```

`n <= 1` stops the recursion; `factorial(n - 1)` moves towards it. Each pending call keeps a
frame on the stack until its subcall returns, so recursion depth costs memory.

## Overlapping subproblems

Naive Fibonacci recomputes the same values over and over:

```text
fib(5) -> fib(4), fib(3)
fib(4) -> fib(3), fib(2)     fib(3) is now computed twice
```

The call tree roughly doubles with every level, so `fib(40)` takes hundreds of millions of
calls although there are only 41 distinct subproblems.

## Memoise: top-down

Remember each answer the first time you compute it:

```swift
func fib(_ n: Int, _ memo: inout [Int: Int]) -> Int {
    if n < 2 { return n }
    if let known = memo[n] { return known }
    let result = fib(n - 1, &memo) + fib(n - 2, &memo)
    memo[n] = result
    return result
}
```

Now each `fib(k)` is computed once: O(n) time instead of exponential.

## Tabulate: bottom-up

Or skip recursion and fill a table from the smallest cases upwards: `f[0] = 0`, `f[1] = 1`,
then `f[i] = f[i - 1] + f[i - 2]`. No deep stack, and often you can keep only the last row.

## The recipe

Define the subproblem precisely, write the recurrence with its base cases, then choose an
evaluation order that computes every subproblem before it is needed.
'''

