[unit.step.gabarito]
solution = '''
import Foundation

/// Turns "name:points" lines into a ranked list of "name: total" strings.
func leaderboard(_ lines: [String]) -> [String] {
    let entries: [(name: String, points: Int)] = lines.compactMap { line in
        let parts = line.split(separator: ":", omittingEmptySubsequences: false)
        guard parts.count == 2 else { return nil }
        let name = parts[0].trimmingCharacters(in: .whitespaces)
        let digits = parts[1].trimmingCharacters(in: .whitespaces)
        guard !name.isEmpty, let points = Int(digits) else { return nil }
        return (name, points)
    }
    let totals = entries.reduce(into: [String: Int]()) { sums, entry in
        sums[entry.name, default: 0] += entry.points
    }
    return totals
        .sorted { a, b in a.value != b.value ? a.value > b.value : a.key < b.key }
        .map { "\($0.key): \($0.value)" }
}
'''
time = "O(n + k log k)"
space = "O(n + k)"
justification = '''
Let `n` be the number of lines, each of bounded length, and `k` the number of distinct players,
with `k ≤ n`.

- **Parsing** with `compactMap` splits and trims every line once: O(n) time. It builds an array
  of at most `n` entries: O(n) space.
- **Totalling** with `reduce(into:)` does one dictionary update per entry, O(1) on average:
  O(n) time and O(k) space for the totals. The `into:` form mutates a single dictionary; a plain
  `reduce` returning a fresh dictionary at every step would copy it each time, O(n·k).
- **Sorting** the `k` totals takes O(k log k) comparisons, each O(1) for integers and short
  names.
- **Formatting** with `map` is O(k).

That gives **O(n + k log k)** time and **O(n + k)** extra space. Folding the parsing into the
`reduce(into:)` closure would drop the intermediate array and bring the extra space down to
O(k), at some cost in readability.

The comparison `a.value != b.value ? a.value > b.value : a.key < b.key` defines a strict total
order on (total, name) pairs, so the output is fully determined even though dictionary
iteration order is random and `sorted` is not documented as stable. Sorting twice by different
keys, or relying on input order, would not guarantee this.
'''

[[unit]]
id = "sw-u10-structs"
title = "Structs: your own value types"
level = "intermediate"
difficulty = 10
intro = '''
A struct bundles related values into a new type of your own, with properties that store or
compute data, methods that act on it and initialisers that guarantee every instance starts out
valid. Structs are value types, so each variable owns its own copy. You will write stored and
computed properties, `mutating` methods, and custom and failable initialisers, then build an
exact `Fraction` type.
'''
concepts = '''
## The idea

So far every value has had a built-in type: `Int`, `String`, `[Double]`. Real programs talk
about points, prices, temperatures and orders. A **struct** defines a new type that groups the
data describing one such thing, together with the operations that make sense for it. The type
can then protect its own rules: a `Fraction` can guarantee that its denominator is never zero,
so no caller ever has to check.

Structs are Swift's default way to model data. `Int`, `String`, `Array` and `Dictionary` are
themselves structs.

## How Swift does it

```swift
struct Money {
    var cents: Int                          // stored property
    var dollars: Double {                   // computed property
        Double(cents) / 100
    }
    mutating func add(_ other: Money) {     // changes self
        cents += other.cents
    }
}

var price = Money(cents: 1250)              // memberwise initialiser
price.add(Money(cents: 50))
print(price.dollars)                        // 13.0
```

- **Stored properties** hold data. **Computed properties** run code on every read, and may
  also have a `set` that writes to stored ones.
- Swift generates a **memberwise initialiser** with one labelled parameter per stored property,
  in declaration order. Properties with default values may be left out.
- A method that changes stored properties must be marked **`mutating`**. Inside one, you can
  even replace the whole value: `self = Money(cents: 0)`.
- You can write your own `init`. Every stored property must be set before it finishes. An
  **`init?`** is *failable*: it returns `nil` for invalid input, so invalid instances never
  exist.
- `private(set) var` makes a property readable from outside but writable only inside the type.

## Value semantics

Assigning a struct copies it. After `var b = a`, changing `b` never changes `a`, and a struct
passed to a function arrives as a copy. A `let` struct is frozen: you can neither change its
properties nor call its `mutating` methods.

## Pitfalls and compiler errors

- **"Cannot use mutating member on immutable value: 'p' is a 'let' constant"**: declare the
  variable with `var`.
- **"Cannot assign to property: 'self' is immutable"**: the method changes a property but is
  not marked `mutating`.
- **"Return from initializer without initializing all stored properties"**: some path through
  your `init` forgot a property.
- **An `init` written inside the struct body removes the memberwise initialiser.** Put custom
  initialisers in an `extension` to keep both.
- **"Missing argument for parameter 'x' in call"**: the memberwise initialiser needs every
  property without a default, with its label, in order.
- A struct cannot store a property of its own type: *value type 'Node' cannot have a stored
  property that recursively contains it*. That is a job for classes or indirect enums
  (units 11 and 12).

## What you will practise

You will write computed properties with and without setters, `mutating` methods acting on
copies, memberwise, extension and failable initialisers, and then a `Fraction` struct that
always keeps itself in lowest terms and does exact arithmetic.
'''

[[unit.step]]
kind = "concept"
id = "sw-u10-c1-value-types"
title = "Structs model values"
points = 5
difficulty = 10
intro = '''
A struct is a composite value type: its stored properties live inline, and assignment copies
the whole value. Because no two variables ever share one struct instance, code that receives a
struct can reason about it locally, with no fear that someone else will change it.
'''
body = '''
## Defining a type

```swift
struct Point {
    var x: Double
    var y: Double

    var length: Double {
        (x * x + y * y).squareRoot()
    }

    func moved(dx: Double, dy: Double) -> Point {
        Point(x: x + dx, y: y + dy)
    }

    mutating func move(dx: Double, dy: Double) {
        x += dx
        y += dy
    }
}
```

`x` and `y` are stored; `length` is computed every time you read it. `moved` returns a new
point and leaves this one alone, while `move` changes the point in place, so it must be
`mutating`. Swift's naming guidelines follow the same split: a past-participle name such as
`moved` or `sorted` for the version that returns a copy, and an imperative verb such as `move`
or `sort` for the one that mutates.

## Copies

```swift
var a = Point(x: 1, y: 2)
var b = a                 // b is a copy
b.move(dx: 10, dy: 0)
print(a.x, b.x)           // 1.0 11.0
```

`a` is unaffected. Had `a` been a `let`, calling `a.move` would not even compile, because a
constant struct is immutable all the way down.

## Why structs come first

Value types are easier to reason about: no hidden sharing, and no surprise changes from another
part of the program. In Swift 6 they are also easy to make safe to send between concurrent
tasks. Reach for a class, the subject of the next unit, only when you need shared identity or
inheritance.
'''

