[unit.step.gabarito]
solution = '''
/// Applies `orders` one by one to a copy of `stock`.
/// Returns the stock that is left (no zero counts) and the items of the
/// rejected orders, in the order they were rejected.
func fulfill(
    _ orders: [(item: String, quantity: Int)],
    from stock: [String: Int]
) -> (stock: [String: Int], rejected: [String]) {
    var left: [String: Int] = [:]
    for (item, count) in stock where count > 0 {
        left[item] = count
    }
    var rejected: [String] = []
    for order in orders {
        guard order.quantity > 0,
              let available = left[order.item],
              order.quantity <= available
        else {
            rejected.append(order.item)
            continue
        }
        if available == order.quantity {
            left[order.item] = nil
        } else {
            left[order.item] = available - order.quantity
        }
    }
    return (left, rejected)
}
'''
time = "O(s + n)"
space = "O(s + n)"
justification = '''
Let `s` be the number of items in `stock` and `n` the number of orders.

- Copying the positive entries of `stock` into `left` visits each item once, and each
  dictionary insertion is O(1) on average: **O(s)**.
- Each order does one dictionary lookup, a few comparisons and at most one update, removal or
  array append, all O(1) on average (appends are amortised O(1)): **O(n)** for the loop.

The total is **O(s + n)** time. The result holds at most `s` stock entries and at most `n`
rejected names, so the extra space is **O(s + n)**.

Two Swift details carry the correctness. The dictionary subscript returns `Int?`, so
`guard let available = left[order.item]` handles "unknown item" and "read the count" in one
step, with no way to crash on a missing key. And `stock` is a value: the function receives
its own constant copy and builds a separate `left`, so the caller's dictionary cannot change,
whatever the loop does. In a language where dictionaries are shared references you would have
to copy defensively.

Keeping the stock as an array of pairs instead would make each order a linear search, O(s),
and the whole run O(n·s).
'''

[[unit]]
id = "sw-u09-collection-operations"
title = "Transforming collections: map, filter and reduce"
level = "intermediate"
difficulty = 9
intro = '''
Instead of writing a loop for every transformation, Swift collections offer higher-order
methods that take a small function: `map` transforms each element, `filter` keeps some of them,
`reduce` folds them into one result, and `compactMap`, `sorted(by:)` and
`Dictionary(grouping:by:)` cover most of the rest. You will chain these into short pipelines
and build a ranked leaderboard from raw log lines.
'''
concepts = '''
## The idea

Most loops follow a few shapes: build a new array by transforming every element, keep only the
elements that pass a test, or combine everything into one value. **Higher-order functions**
give those shapes names. You pass in only the part that varies, as a small function, and the
method supplies the loop. The code says *what* happens instead of *how*, and there is no index
to get wrong.

## How Swift does it

The small function is a **closure**, written in braces. In a short closure, `$0` and `$1` name
its first and second arguments (unit 14 covers closures fully):

```swift
let nums = [3, 8, 1, 6]
nums.map { $0 * 10 }                  // [30, 80, 10, 60]
nums.filter { $0.isMultiple(of: 2) }  // [8, 6]
nums.reduce(0, +)                     // 18
nums.sorted(by: >)                    // [8, 6, 3, 1]
```

- `map` returns a new array of the same length, possibly with a different element type.
- `filter` returns the elements for which the closure is `true`.
- `reduce(initial, combine)` starts from `initial` and folds each element in.
  `reduce(into:)` lets the closure mutate an accumulator, such as a dictionary, in place.
- `compactMap` maps and drops the `nil`s, which makes it the tool for "parse what you can":
  `["1", "x"].compactMap { Int($0) }` is `[1]`.
- `sorted()` needs `Comparable` elements; `sorted(by:)` takes a closure that answers "should
  the first come before the second?".
- `Dictionary(grouping:by:)` buckets elements by a key, and `mapValues` transforms every value
  of a dictionary.
- `first(where:)`, `contains(where:)`, `allSatisfy` and `min(by:)` search without a loop.

Each of these returns a **new** value; the original collection never changes.

## Pitfalls and compiler errors

- **Each step is a full pass.** `a.filter { ... }.map { ... }` loops twice and builds an
  intermediate array. That is a fair price for clarity; unit 28 shows `lazy` for long chains.
- **Sorting by several keys** needs one closure that compares the first key and falls back to
  the next only on a tie. Calling `sorted` twice does not achieve that.
- **`sorted` costs O(n log n).** Don't call it inside a loop.
- **Grouped dictionaries are unordered.** Sort the keys before printing.
- **"Generic parameter 'ElementOfResult' could not be inferred"** appears when the compiler
  cannot work out what a multi-statement closure returns, typically a `compactMap` that
  returns `nil` on one path. Annotate the result:
  `let pairs: [(String, Int)] = lines.compactMap { ... }`.
- **"Contextual closure type '(Int, Int) throws -> Int' expects 2 arguments, but 1 was used in
  closure body"** means you used only `$0` where the method passes two values, as `reduce`
  and `sorted(by:)` do.

## What you will practise

You will transform, filter and fold a list of temperatures, parse and rank data with
`compactMap` and a multi-key `sorted(by:)`, group words with `Dictionary(grouping:by:)` and
`reduce(into:)`, and then turn a messy score log into a ranked leaderboard with one pipeline.
'''

[[unit.step]]
kind = "concept"
id = "sw-u09-c1-higher-order"
title = "Loops as functions"
points = 5
difficulty = 9
intro = '''
A higher-order function takes another function as an argument. `map`, `filter` and `reduce`
capture the three most common loop shapes, so a pipeline built from them states the intent of
the code and leaves the iteration to the standard library.
'''
body = '''
## The same loop, two ways

Here is a loop that keeps the even numbers and squares them:

```swift
var squares: [Int] = []
for n in [1, 2, 3, 4] {
    if n % 2 == 0 {
        squares.append(n * n)
    }
}
```

And here is the same work as a pipeline:

```swift
let squares = [1, 2, 3, 4].filter { $0 % 2 == 0 }.map { $0 * $0 }   // [4, 16]
```

Read it from left to right: take the numbers, keep the even ones, square each one. The result
can be a `let`, because nothing is appended after the fact.

## Closures in one minute

`{ $0 % 2 == 0 }` is a **closure**, an unnamed function, and `$0` is its first argument. When a
closure is the last argument it can follow the parentheses (a *trailing closure*), and when it
is the only argument the parentheses disappear. You can also name the arguments:

```swift
let total = [4, 5, 6].reduce(0) { sum, n in sum + n }   // 15
```

An operator such as `+` or `>` is itself a function, so `reduce(0, +)` and `sorted(by: >)`
work as they are.

## Which one to use

- One output per input: `map`, or `compactMap` when some inputs should vanish.
- A subset: `filter`.
- One value from many: `reduce`.
- A new order: `sorted(by:)`.
- Buckets: `Dictionary(grouping:by:)`.

A plain `for` loop is still the right tool when the body has side effects, such as printing,
or when it must stop early.
'''

