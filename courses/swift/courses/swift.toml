instructions = '''
## Your turn

Implement the generic struct `HashTable<Key: Hashable, Value>`:

```swift
struct HashTable<Key: Hashable, Value> {
    private(set) var count: Int
    var bucketCount: Int
    subscript(key: Key) -> Value? { get set }
    mutating func removeValue(forKey key: Key) -> Value?
    var keys: [Key]
}
```

The starter provides the storage (`buckets`, an array of chains of `(key, value)` pairs),
`count`, an `init()` that creates **8** empty buckets, and `bucketCount`. Don't use
`Dictionary` or `Set` inside the table: the point is to build one.

Rules:

- `table[key]` returns the value, or `nil` if the key is absent.
- `table[key] = value` inserts the key, or overwrites its value if it is already there.
- `table[key] = nil` removes the key (and does nothing if it is absent).
- `removeValue(forKey:)` removes the key and returns its old value, or `nil`.
- `count` is the number of keys stored.
- After an insertion that makes `count > 0.75 * bucketCount`, **double** the number of
  buckets and rehash every pair. Starting from 8 buckets, the 7th key triggers growth to 16.
- `keys` returns every stored key once, in any order.
- Pick a bucket with `Int(UInt(bitPattern: key.hashValue) % UInt(bucketCount))`, so negative
