target = '''
struct Page<Item> {
    let items: [Item]
    let number: Int
    let totalPages: Int

    var hasNext: Bool { number < totalPages }

    func map<U>(_ transform: (Item) -> U) -> Page<U> {
        Page<U>(items: items.map(transform), number: number, totalPages: totalPages)
    }
}

extension Page where Item: Numeric {
    var sum: Item { items.reduce(0, +) }
}

func paginate<Item>(_ all: [Item], size: Int, page: Int) -> Page<Item> {
    let total = max(1, (all.count + size - 1) / size)
    let start = min((page - 1) * size, all.count)
    let end = min(start + size, all.count)
    return Page(items: Array(all[start..<end]), number: page, totalPages: total)
}

let prices = [120, 75, 300, 40, 99, 15, 60]
let second = paginate(prices, size: 3, page: 2)
print(second.items, second.number, "of", second.totalPages, "next:", second.hasNext)
print("sum:", second.sum)
let labels = second.map { "$\($0)" }
print(labels.items, "next:", labels.hasNext)
let last = paginate(prices, size: 3, page: 3)
print(last.items, "next:", last.hasNext)
