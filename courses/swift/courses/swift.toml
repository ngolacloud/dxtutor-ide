id = "sw-u08-x1-fulfill-orders"
title = "Fulfil orders from a stock"
points = 30
difficulty = 8
entry = "fulfill"
intro = '''
Inventory systems apply a stream of orders to a table of quantities: each order either succeeds
and changes the table, or is rejected. A dictionary gives O(1) average lookups by item name,
and Swift's value semantics guarantee that working on your copy of the stock can never corrupt
the caller's.
