[[unit.step]]
kind = "challenge"
id = "sw-u13-x1-pricing-rules"
title = "A checkout with pluggable pricing rules"
points = 30
difficulty = 13
entry = "total"
intro = '''
The **strategy pattern** puts each interchangeable algorithm behind one interface, so new
variants plug in without touching the code that uses them. In Swift the interface is a
protocol, the variants are small structs, and shared helpers live in a protocol extension.
'''
instructions = '''
## Your turn

The starter declares an `Item` (a product code and a price in cents) and the protocol every
pricing rule conforms to:

```swift
protocol PricingRule {
    var sku: String { get }
    func discount(for items: [Item]) -> Int
}
```

Implement four pieces (keep every declaration's name and signature):

1. **`extension PricingRule { func matching(_ items: [Item]) -> [Item] }`**, a default
   implementation shared by all rules: the items whose `sku` equals the rule's `sku`, in their
   original order.
2. **`BuyNGetOneFree(sku:n:)`**: for every complete group of `n + 1` matching items, one is
   free. The free items are the **cheapest** matching items, so the discount is the sum of the
   `count / (n + 1)` lowest matching prices. If `n < 1`, the discount is 0.
3. **`BulkDiscount(sku:minQuantity:centsOffEach:)`**: if there are at least `minQuantity`
   matching items, each of them gets `centsOffEach` off, but never more than its own price.
   Otherwise the discount is 0.
4. **`func total(_ items: [Item], rules: [any PricingRule]) -> Int`**: the sum of all prices,
   minus the discount of every rule, each computed on the whole basket. Rules stack. The total
   never goes below 0.

`total` must work with **any** type that conforms to `PricingRule`, including rules the tests
define themselves, which will rely on your `matching`.

Examples (apples cost 50, tea costs 300):

- `total([apple, tea], rules: [])` is `350`.
- `BuyNGetOneFree(sku: "apple", n: 2)` on three apples gives a discount of `50`.
- `BulkDiscount(sku: "tea", minQuantity: 3, centsOffEach: 25)` on four teas gives `100`, and
  on two teas gives `0`.
- `BulkDiscount(sku: "apple", minQuantity: 1, centsOffEach: 70)` on one apple gives `50`.

**Hint:** write `matching` with `filter`, then build both rules on top of it; `sorted()`,
`prefix(_:)` and `reduce` do most of the work.

Hidden tests decide correctness.
'''
starter = '''
struct Item: Equatable {
    let sku: String
    let priceCents: Int
}

protocol PricingRule {
    var sku: String { get }
    func discount(for items: [Item]) -> Int
}

extension PricingRule {
    // Default implementation for every rule: the items whose sku equals this rule's sku,
    // in their original order.
    func matching(_ items: [Item]) -> [Item] {
        fatalError("not implemented")
    }
}

struct BuyNGetOneFree: PricingRule {
    let sku: String
    let n: Int

    // For every complete group of n + 1 matching items, one is free: the free ones are the
    // cheapest matching items. No discount when n < 1.
    func discount(for items: [Item]) -> Int {
        fatalError("not implemented")
    }
}

struct BulkDiscount: PricingRule {
    let sku: String
    let minQuantity: Int
    let centsOffEach: Int

    // With at least minQuantity matching items, each of them gets centsOffEach off,
    // but never more than its own price.
    func discount(for items: [Item]) -> Int {
        fatalError("not implemented")
    }
}

// The sum of all prices minus the discount of every rule, never below zero.
func total(_ items: [Item], rules: [any PricingRule]) -> Int {
    fatalError("not implemented")
}
'''
tests = '''
let apple = Item(sku: "apple", priceCents: 50)
let pear = Item(sku: "pear", priceCents: 80)
let tea = Item(sku: "tea", priceCents: 300)

test("matching keeps the rule's sku, in order") {
    let rule = BulkDiscount(sku: "pear", minQuantity: 1, centsOffEach: 0)
    self.equal(rule.matching([apple, pear, tea, pear]), [pear, pear])
    self.equal(rule.matching([apple, tea]), [])
    self.equal(rule.matching([]), [])
}
test("no rules: the plain sum") {
    self.equal(total([], rules: []), 0)
    self.equal(total([apple, pear, tea], rules: []), 430)
}
test("buy two, get one free") {
    let rule = BuyNGetOneFree(sku: "apple", n: 2)
    self.equal(rule.discount(for: [apple, apple]), 0)
    self.equal(rule.discount(for: [apple, apple, apple]), 50)
    self.equal(rule.discount(for: [apple, apple, apple, apple, apple, apple, apple]), 100)
    self.equal(total([apple, tea, apple, apple], rules: [rule]), 400)
}
test("the free items are the cheapest matching ones") {
    let rule = BuyNGetOneFree(sku: "book", n: 1)
    let books = [900, 400, 1200, 700, 100].map { Item(sku: "book", priceCents: $0) }
    self.equal(rule.discount(for: books), 500)
    self.equal(BuyNGetOneFree(sku: "book", n: 0).discount(for: books), 0)
    self.equal(BuyNGetOneFree(sku: "book", n: -3).discount(for: books), 0)
}
test("bulk discount needs the minimum quantity") {
    let rule = BulkDiscount(sku: "tea", minQuantity: 3, centsOffEach: 25)
    self.equal(rule.discount(for: [tea, tea, apple]), 0)
    self.equal(rule.discount(for: [tea, apple, tea, tea]), 75)
    self.equal(total([tea, tea, tea, tea], rules: [rule]), 1100)
}
test("bulk discount never exceeds an item's price") {
    let rule = BulkDiscount(sku: "apple", minQuantity: 2, centsOffEach: 70)
    self.equal(rule.discount(for: [apple, apple]), 100)
    self.equal(total([apple, apple], rules: [rule]), 0)
}
test("rules stack, and the total never goes negative") {
    let rules: [any PricingRule] = [
        BuyNGetOneFree(sku: "apple", n: 2),
        BulkDiscount(sku: "apple", minQuantity: 3, centsOffEach: 10),
        BulkDiscount(sku: "pear", minQuantity: 5, centsOffEach: 10),
    ]
    self.equal(total([apple, apple, apple, pear], rules: rules), 150)
    let greedy: [any PricingRule] = [
        BulkDiscount(sku: "pear", minQuantity: 1, centsOffEach: 80),
        BuyNGetOneFree(sku: "pear", n: 1),
    ]
    self.equal(total([pear, pear], rules: greedy), 0)
}
test("any new rule works with total and gets matching for free") {
    struct FlatOff: PricingRule {
        let sku: String
        func discount(for items: [Item]) -> Int { matching(items).isEmpty ? 0 : 30 }
    }
    self.equal(total([tea, apple], rules: [FlatOff(sku: "tea")]), 320)
    self.equal(total([apple], rules: [FlatOff(sku: "tea")]), 50)
}
test("large baskets") {
    let basket = Array(repeating: apple, count: 30_000)
    self.equal(total(basket, rules: [BuyNGetOneFree(sku: "apple", n: 2)]), 1_000_000)
}
'''

[unit.step.gabarito]
solution = '''
struct Item: Equatable {
    let sku: String
    let priceCents: Int
}

protocol PricingRule {
    var sku: String { get }
    func discount(for items: [Item]) -> Int
}

extension PricingRule {
    func matching(_ items: [Item]) -> [Item] {
        items.filter { $0.sku == sku }
    }
}

struct BuyNGetOneFree: PricingRule {
    let sku: String
    let n: Int

    func discount(for items: [Item]) -> Int {
        guard n >= 1 else { return 0 }
        let prices = matching(items).map(\.priceCents).sorted()
        let free = prices.count / (n + 1)
        return prices.prefix(free).reduce(0, +)
    }
}

struct BulkDiscount: PricingRule {
    let sku: String
    let minQuantity: Int
    let centsOffEach: Int

    func discount(for items: [Item]) -> Int {
        let hits = matching(items)
        guard hits.count >= minQuantity else { return 0 }
        return hits.reduce(0) { $0 + min(centsOffEach, $1.priceCents) }
    }
}

func total(_ items: [Item], rules: [any PricingRule]) -> Int {
    let gross = items.reduce(0) { $0 + $1.priceCents }
    let off = rules.reduce(0) { $0 + $1.discount(for: items) }
    return max(0, gross - off)
}
'''
time = "O(n log n + r·n)"
space = "O(n)"
justification = '''
Let `n` be the number of items and `r` the number of rules. `matching` is one `filter` pass,
O(n) time and up to O(n) space for the matches. `BulkDiscount` adds a single `reduce` over the
matches, so it stays **O(n)**. `BuyNGetOneFree` must find the cheapest `k` matching prices, and
sorting the `m` matching prices costs O(m log m), at most **O(n log n)**; summing the prefix
is O(m). `total` sums the prices once (O(n)) and asks each of the `r` rules for its discount,
so the whole checkout is **O(n log n + r·n)** time with **O(n)** extra space for the matched
and sorted prices.

The design is the interesting part. `total` depends only on the `PricingRule` contract, so a
new rule, like the `FlatOff` struct the tests declare, plugs in without changing `total` at
all. `matching` lives in a protocol extension, so every rule, yours or the tests', gets it
without writing it. Clamping with `max(0, gross - off)` and capping each bulk discount with
`min(centsOffEach, price)` keep stacked rules from producing a negative bill.

Sorting is simple and fast enough here. A selection algorithm (quickselect) could find the `k`
cheapest prices in O(m) expected time, but the gain only matters for very large baskets; a
heap of size `k` is another option, at O(m log k).
'''

# ══ sw-u14-closures ════════════════════════════════════════════════════════

[[unit]]
id = "sw-u14-closures"
title = "Closures, captures and @escaping"
level = "intermediate"
difficulty = 14
intro = '''
A closure is a function you can write inline, store in a variable and pass around like any
other value. Closures remember the variables they use from their surroundings, which is what
makes callbacks, counters and event handlers possible. You will shorten closure syntax step by
step, capture state, store escaping closures, and build an event emitter.
'''
concepts = '''
## The idea

In Swift, functions are **first-class values**: a function has a type, such as
`(Int) -> String`, and can be stored in a variable, put in an array, passed as an argument and
returned from another function. A **closure** is an unnamed function written inline, right
where it is needed. You have used them already with `map`, `filter` and `sorted(by:)`.

What makes closures powerful is **capturing**. A closure can use variables from the scope
where it was written, and it keeps them alive for as long as the closure itself lives, even
after that scope has returned. A counter that remembers its count, or a button handler that
remembers which screen it belongs to, are both captured state.

## How Swift does it

The full syntax names parameters and the return type before `in`. Swift lets you drop
whatever it can infer:

```swift
let square: (Int) -> Int = { (x: Int) -> Int in return x * x }
let same: (Int) -> Int = { x in x * x }       // types inferred, single expression
let nums = [3, 1, 2].sorted { $0 > $1 }       // shorthand names $0, $1
let alsoNums = [3, 1, 2].sorted(by: >)        // an operator is a function too
```

- When the last argument is a closure, write it **after** the parentheses as a **trailing
  closure**, and drop empty parentheses entirely: `numbers.map { $0 * 2 }`.
- Captured variables are captured **by reference**: the closure sees later changes, and its own
  changes are visible outside. A **capture list** such as `{ [count] in ... }` copies the value
  at the moment the closure is created instead.
- A closure parameter is **non-escaping** by default: it may only be called before the function
  returns. Mark it `@escaping` when the function stores it or calls it later.

```swift
var handlers: [() -> Void] = []
func register(_ h: @escaping () -> Void) { handlers.append(h) }
```

## What is special or tricky

- Storing a plain closure parameter fails with
  `converting non-escaping parameter 'h' to generic parameter 'Element' may allow it to escape`,
  or `escaping closure captures non-escaping parameter`. Add `@escaping`.
- Inside a class, an escaping closure that uses a property must say `self.` explicitly:
  `reference to property 'x' in closure requires explicit use of 'self'`. Swift wants you to
  notice that the closure keeps the object alive. Unit 27 explains the `[weak self]` capture
  list that breaks such retain cycles.
- `$0` with a multi-line body quickly becomes unreadable; name the parameters instead.
- Under Swift 6's strict concurrency, a closure handed to another task must be `@Sendable` and
  may not capture mutable local variables. Units 22 to 24 cover this; everything here runs on
  one thread.

## What you will practise

You will rewrite one sort from the longest closure syntax to the shortest, build counters that
capture state, compare a live capture with a capture list, and queue escaping closures to run
later. The challenge is an event emitter that stores handlers and calls them on demand.
'''

[[unit.step]]
kind = "concept"
id = "sw-u14-c1-functions-as-values"
title = "Functions as values, closures as captured state"
points = 5
difficulty = 14
intro = '''
Treating functions as values lets code take behaviour as a parameter: a sort that accepts the
comparison, a button that accepts what to do when tapped. Closures add memory to that
behaviour by capturing the variables around them.
'''
body = '''
## A function type

Every function has a type written as its parameter types and its result:

```swift
func double(_ x: Int) -> Int { x * 2 }
let f: (Int) -> Int = double
print(f(21))   // 42
```

`f` holds the function itself, not a result. A closure expression creates the same kind of
value inline:

```swift
let triple: (Int) -> Int = { x in x * 3 }
```

## Passing behaviour in

Many standard-library methods take a closure that decides one detail of their work:

```swift
let names = ["Zoe", "al", "Bob"]
let sorted = names.sorted { $0.lowercased() < $1.lowercased() }
```

`sorted` knows how to sort; the closure only says what "smaller" means.

## Capturing

A closure can use variables from where it was written, and it keeps them alive:

```swift
func makeGreeter(greeting: String) -> (String) -> String {
    return { name in "\(greeting), \(name)!" }
}
let hello = makeGreeter(greeting: "Hello")
print(hello("Ada"))   // Hello, Ada!
```

`makeGreeter` has returned, yet `hello` still knows `greeting`. Each call to `makeGreeter`
creates a new closure with its own captured `greeting`. When the captured variable is a `var`,
the closure can also change it, and that is how a closure carries state from one call to the
next.

## Escaping

If a function stores a closure parameter for later, the closure **escapes** the call, and the
parameter must be marked `@escaping`. The annotation tells callers that whatever the closure
captures may live much longer than the call itself.
'''

