body = '''
## The node

```swift
final class Node<T> {
    var value: T
    var next: Node<T>?
    init(_ value: T, next: Node<T>? = nil) { self.value = value; self.next = next }
}
```

`next` refers to another `Node`, or is `nil` when there is no next node. An empty list is a
head that is `nil`. The node is a class because only a reference can point at another value
of the same type.

## Push to the front

Make a new node whose `next` is the current head, then move the head to it. No element moves,
so this is O(1) however long the list is:

```swift
head = Node(v, next: head)
```

## Walk the list

Follow `next` from the head until you reach `nil`:

```swift
var node = head
while let current = node {
    print(current.value)
    node = current.next
}
```

## Pop the front

Popping is the mirror image of pushing: remember the value, then move the head one node on.
The old first node is no longer referenced, so ARC destroys it immediately.

```swift
if let first = head { head = first.next; print(first.value) }
```

Pushing to the front reverses insertion order: the last value pushed is the first one you
meet when walking. Appending at the end needs the last node, and finding it is an O(n) walk
unless you keep a `tail` reference, as the second drill does. Every linked-list operation is
a combination of these moves: create a node, follow `next`, and rewire `next`.
'''

