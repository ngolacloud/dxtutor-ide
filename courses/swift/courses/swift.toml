target = '''
indirect enum Tree<T: Comparable> {
    case empty
    case node(Tree<T>, T, Tree<T>)

    func inserting(_ value: T) -> Tree<T> {
        switch self {
        case .empty:
            return .node(.empty, value, .empty)
        case let .node(left, key, right):
            if value < key { return .node(left.inserting(value), key, right) }
            if value > key { return .node(left, key, right.inserting(value)) }
            return self
        }
    }

    func inOrder() -> [T] {
        guard case let .node(left, key, right) = self else { return [] }
        return left.inOrder() + [key] + right.inOrder()
    }
}

var tree = Tree<Int>.empty
for k in [50, 30, 70, 20, 40, 60, 80, 30] {
    tree = tree.inserting(k)
}
print(tree.inOrder())
