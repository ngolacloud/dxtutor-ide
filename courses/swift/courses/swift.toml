[unit.step.gabarito]
solution = '''
import Foundation

enum ScheduleError: Error {
    case invalidStart(String)
}

/// Returns `count` billing dates ("yyyy-MM-dd"): date i is `start` plus i months,
/// clamped to the last day of shorter months, computed in UTC.
func billingSchedule(from start: String, count: Int) throws -> [String] {
    guard let utc = TimeZone(identifier: "UTC") else { throw ScheduleError.invalidStart(start) }
    var calendar = Calendar(identifier: .gregorian)
    calendar.timeZone = utc

    let formatter = DateFormatter()
    formatter.locale = Locale(identifier: "en_US_POSIX")
    formatter.timeZone = utc
    formatter.dateFormat = "yyyy-MM-dd"

    // Lenient parsing accepts "2024-1-5"; the round trip rejects anything non-canonical.
    guard let anchor = formatter.date(from: start), formatter.string(from: anchor) == start else {
        throw ScheduleError.invalidStart(start)
    }
    guard count > 0 else { return [] }

    var dates: [String] = []
    dates.reserveCapacity(count)
    for offset in 0..<count {
        // Always from the anchor, so a short month does not shift later dates.
        guard let next = calendar.date(byAdding: .month, value: offset, to: anchor) else {
            throw ScheduleError.invalidStart(start)
        }
        dates.append(formatter.string(from: next))
    }
    return dates
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Parsing and validating `start` handles a fixed-length string, so it is O(1). The loop runs
`n = count` times, and each iteration does one calendar addition and one formatting call,
both bounded by a constant amount of work for a single date. That makes the time **O(n)**.
The result holds `n` short strings, so the space is **O(n)**; everything else (one
calendar, one formatter, the anchor) is O(1).

The correctness argument is about *where* each date comes from. Adding `i` months to the
anchor lets the calendar clamp each month on its own: 31 January plus 1 month is 29
February, and plus 2 months is 31 March again. Adding one month to the previous result
instead would drift (31 Jan → 29 Feb → 29 Mar → 29 Apr) and never recover. The strict round
trip `formatter.string(from: anchor) == start` rejects the inputs a lenient formatter quietly
accepts, such as `2024-1-5` or a leading space, while the explicit UTC calendar and POSIX
locale make the output the same on every machine.
'''

[[unit]]
id = "sw-u19-text-parsing"
title = "Text processing, Regex and parsing"
level = "intermediate"
difficulty = 19
intro = '''
Logs, configuration files, CSV exports and user input all arrive as text, and turning that
text into typed values is one of the most common jobs in production code. You will split,
trim and convert strings safely, match patterns with Swift's typed `Regex` literals and
captures, and finish by writing a small CSV parser as a state machine.
'''
concepts = '''
## The idea

**Parsing** turns unstructured text into structured data: lines into records, fields into
numbers, timestamps into dates. Good parsers share three habits. They read the input in one
pass, they never trust it (every conversion can fail), and they report bad input instead of
crashing on it.

## How Swift does it

A `String` is a collection of `Character`s, where each `Character` is a full grapheme
cluster: `"é"` is one character even if it is stored as two Unicode scalars. The everyday
tools are:

```swift
let line = " ana , 31 "
let fields = line.split(separator: ",")             // [" ana ", " 31 "] as Substrings
let name = fields[0].trimmingCharacters(in: .whitespaces)   // "ana" (Foundation)
let age = Int(fields[1].trimmingCharacters(in: .whitespaces)) // Optional(31)
```

`split` returns `Substring`s, views that share the original string's storage. They are
cheap, but convert with `String(sub)` before you store them long-term. `Int("x")` returns
`nil` instead of throwing, so conversion failures are handled with `if let` or `guard let`.

For patterns, Swift has **`Regex` literals** written between slashes. The compiler checks
the pattern and gives the match a typed output: a tuple of the whole match and each capture,
with names when you use `(?<name>…)`:

```swift
let size = /(?<width>\d+)x(?<height>\d+)/
if let m = "1920x1080".wholeMatch(of: size) {
    print(m.width, m.height)   // 1920 1080, as Substrings
}
```

`wholeMatch(of:)` requires the entire string to match, `firstMatch(of:)` finds the first
occurrence, `matches(of:)` returns all of them, and `replacing(_:with:)` substitutes them.
When the pattern only exists at run time, `try Regex(text)` builds one dynamically, with
untyped captures.

## Pitfalls and compiler errors

- *"cannot convert value of type 'String.SubSequence' (aka 'Substring') to specified type
  'String'"*: wrap the value in `String(…)`.
- *"regex literal may not start with space"*: `/ a/` is rejected. Escape the space or use
  an extended literal, `#/ a/#`.
- **`"\r\n"` is one `Character`.** Windows line endings form a single grapheme, so
  `text.split(separator: "\n")` will not split them. Use
  `text.split(whereSeparator: \.isNewline)`, which handles `\n`, `\r\n` and `\r`.
- `split` drops empty pieces by default, so `"a,,b"` gives two fields. Pass
  `omittingEmptySubsequences: false` when empty fields matter, as they do in CSV.
- A regex is the wrong tool for nested or quoted structure, such as JSON or CSV fields that
  may contain commas. Use a real decoder or a small state machine.

## What you will practise

You will clean and sum a messy list, parse log lines with named captures, and extract and
redact values with `matches(of:)` and `replacing`. The challenge is a CSV parser that
handles quoted fields, escaped quotes, Windows line endings and malformed rows.
'''

[[unit.step]]
kind = "concept"
id = "sw-u19-c1-strings-and-regex"
title = "Splitting, converting and matching"
points = 5
difficulty = 19
intro = '''
Most text formats are either delimited, where fields are separated by a known character, or
patterned, where fields follow a recognisable shape. Splitting handles the first kind, regular
expressions the second, and a hand-written state machine handles anything with quoting or
nesting.
'''
body = '''
## Delimited text: split, then convert

```swift
let record = "42;Ana Lima;  3.5 "
let parts = record.split(separator: ";", omittingEmptySubsequences: false)
let id = Int(parts[0])                                        // Optional(42)
let score = Double(parts[2].trimmingCharacters(in: .whitespaces))  // Optional(3.5)
```

Every numeric conversion returns an optional, so a parser decides what to do with bad input
right where it happens: skip the line, collect an error, or throw.

## Patterned text: Regex literals

A `Regex` literal is checked when you compile, and its captures are typed:

```swift
let entry = /(?<user>[a-z]+)@(?<host>[a-z.]+)/
for m in "ana@x.io, bo@y.org".matches(of: entry) {
    print(m.user, "at", m.host)
}
```

`\d` matches a digit, `\w` a word character, `+` means one or more, `{4}` exactly four, and
`(?<name>…)` names a capture. `wholeMatch` is the strict choice for validation: it fails if
anything extra surrounds the pattern.

## Structured text: a state machine

Quoted CSV fields, escape sequences and nested brackets need memory of what came before:
"am I inside quotes right now?". A regex can't track that reliably, but a loop over the
characters with an explicit `state` variable can, and it reads the input exactly once, in
O(n). Each character either changes the state, is added to the current field, or ends it.

## Characters are graphemes

Swift counts what a reader sees: `"🇦🇴".count` is 1, and so is `"\r\n".count`. This
protects you from cutting a character in half, but it also means indexing is not `O(1)`
integer arithmetic, so prefer loops, `split` and matching over hand-made index math.
'''

