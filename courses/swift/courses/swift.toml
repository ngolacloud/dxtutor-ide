target = '''
func fibNaive(_ n: Int, _ calls: inout Int) -> Int {
    calls += 1
    if n < 2 { return n }
    return fibNaive(n - 1, &calls) + fibNaive(n - 2, &calls)
}

func fibMemo(_ n: Int, _ memo: inout [Int: Int], _ calls: inout Int) -> Int {
    calls += 1
    if n < 2 { return n }
    if let known = memo[n] { return known }
    let result = fibMemo(n - 1, &memo, &calls) + fibMemo(n - 2, &memo, &calls)
    memo[n] = result
    return result
}

var naiveCalls = 0
