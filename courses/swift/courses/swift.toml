[unit.step.gabarito]
solution = '''
enum CSVError: Error {
    case fieldCount(record: Int, expected: Int, found: Int)
    case unterminatedQuote(line: Int)
    case strayQuote(line: Int)
    case duplicateHeader(String)
}

private enum FieldState {
    case start          // at the beginning of a field
    case plain          // inside an unquoted field
    case quoted         // inside a quoted field
    case quoteInQuoted  // just read a quote inside a quoted field
}

/// Splits one line into fields with a four-state machine, reading each character once.
private func splitFields(_ line: Substring, lineNumber: Int) throws -> [String] {
    var fields: [String] = []
    var field = ""
    var state = FieldState.start
    for ch in line {
        switch (state, ch) {
        case (.start, "\""):
            state = .quoted
        case (.start, ","), (.plain, ","), (.quoteInQuoted, ","):
            fields.append(field)
            field = ""
            state = .start
        case (.start, _), (.plain, _):
            if ch == "\"" { throw CSVError.strayQuote(line: lineNumber) }
            field.append(ch)
            state = .plain
        case (.quoted, "\""):
            state = .quoteInQuoted
        case (.quoted, _):
            field.append(ch)
        case (.quoteInQuoted, "\""):
            field.append("\"")
            state = .quoted
        case (.quoteInQuoted, _):
            throw CSVError.strayQuote(line: lineNumber)
        }
    }
    if state == .quoted { throw CSVError.unterminatedQuote(line: lineNumber) }
    fields.append(field)
    return fields
}

/// Parses CSV text with a header line into one dictionary per record.
func parseCSV(_ text: String) throws -> [[String: String]] {
    let lines = text.split(whereSeparator: \.isNewline)
    guard let headerLine = lines.first else { return [] }
    let header = try splitFields(headerLine, lineNumber: 1)
    guard Set(header).count == header.count else {
        throw CSVError.duplicateHeader(headerLine.description)
    }

    var records: [[String: String]] = []
    records.reserveCapacity(lines.count - 1)
    for (offset, line) in lines.dropFirst().enumerated() {
        let fields = try splitFields(line, lineNumber: offset + 2)
        guard fields.count == header.count else {
            throw CSVError.fieldCount(record: offset + 1, expected: header.count, found: fields.count)
        }
        var record: [String: String] = [:]
        for (name, value) in zip(header, fields) {
            record[name] = value
        }
        records.append(record)
    }
    return records
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the number of characters in the text. Splitting into lines is one pass, **O(n)**.
`splitFields` visits every character of a line exactly once and does O(1) work per character
(a switch on the state, an append), so all lines together cost O(n). Building each record
does one dictionary insertion per field, and the number of fields is at most the number of
characters, so that is O(n) as well. The total is **O(n)**.

The lines, the fields and the resulting dictionaries together hold every character of the
input once (plus constant overhead per field), so the space is **O(n)**.

The state machine is what makes the parser both linear and correct. A quote means different
things depending on context: it opens a field at `start`, is an error in `plain`, ends or
escapes inside `quoted`. Tracking that context in one `enum` and switching on
`(state, character)` covers every case explicitly, and Swift checks the switch is
exhaustive. A regex-only approach would struggle with `""` escapes and commas inside quotes,
and splitting on `"\n"` would silently fail on `\r\n`, which Swift treats as one `Character`.
'''

[[unit]]
id = "sw-u20-equatable-hashable"
title = "Equatable, Hashable and Comparable"
level = "intermediate"
difficulty = 20
intro = '''
Three small protocols decide whether your types can be compared with `==`, stored in a `Set`
or used as dictionary keys, and sorted. You will rely on the compiler's synthesized
conformances, write custom equality and hashing that agree with each other, define a natural
order with tuple comparison, and build a version-number type that does all three.
'''
concepts = '''
## The idea

What does it mean for two values to be "the same"? For a point, equal coordinates. For a
user account, probably the same id, even if the display name changed. For an e-mail address,
perhaps the same text ignoring case. **Equality is a design decision**, and three protocols
encode it:

- **`Equatable`**: `==` and `!=`.
- **`Hashable`**: `Equatable` plus `hash(into:)`, which lets a type be a `Set` element or a
  `Dictionary` key. Hash tables find a value by its hash in O(1) on average.
- **`Comparable`**: `Equatable` plus `<`, which gives you `>`, `<=`, `>=`, `min()`, `max()`
  and `sorted()` for free.

## How Swift does it

For structs whose stored properties all conform, and for enums whose associated values all
conform, the compiler **synthesizes** `Equatable` and `Hashable`: just declare them.
Enums without associated values also get a synthesized `Comparable` that orders cases as
written.

```swift
struct Point: Hashable { let x: Int; let y: Int }
enum Size: Comparable { case small, medium, large }   // small < medium < large
```

When equality must ignore some fields or normalise them, write both methods yourself, and
make them agree:

```swift
struct Tag: Hashable {
    let name: String
    static func == (a: Tag, b: Tag) -> Bool { a.name.lowercased() == b.name.lowercased() }
    func hash(into hasher: inout Hasher) { hasher.combine(name.lowercased()) }
}
```

**The hashing rule:** if `a == b`, then `a` and `b` must produce the same hash. Feed the
hasher exactly the values `==` compares, normalised the same way. Break the rule and a `Set`
can hold two "equal" elements, or fail to find one that is there.

For `Comparable`, implement `static func <`. Tuples of up to six comparable elements compare
lexicographically, which makes multi-key orders one line:
`(a.lastName, a.firstName) < (b.lastName, b.firstName)`. For a one-off order, skip the
protocol and pass a closure: `people.sorted { $0.age > $1.age }`.

## Pitfalls and compiler errors

- *"type 'Card' does not conform to protocol 'Hashable'"*: some stored property isn't
  `Hashable`. Make it conform, or write `==` and `hash(into:)` by hand.
- *"referencing instance method 'sorted()' on 'Sequence' requires that 'P' conform to
  'Comparable'"*: conform, or call `sorted(by:)` with a closure.
- `<` must agree with `==`: for any two values exactly one of `a < b`, `a == b`, `b < a`
  holds. If `<` ignores a field that `==` compares, sorting gets an inconsistent answer, so
  break ties with the remaining fields.
- `Hasher` is seeded randomly per process. Hash values change between runs, so never print,
  store or send them, and never depend on `Set` or `Dictionary` iteration order.

## What you will practise

You will use synthesized conformances in sets and dictionaries, write case-insensitive
equality with matching hashing, and sort tickets by a multi-key natural order. The challenge
is a `Version` type where `1.2` equals `1.2.0` and `1.9` sorts before `1.10`.
'''

[[unit.step]]
kind = "concept"
id = "sw-u20-c1-equality-contracts"
title = "Equality, hashing and order are contracts"
points = 5
difficulty = 20
intro = '''
Hash tables and sorting algorithms trust the methods you give them. Hash tables assume that
equal values have equal hashes, and sorting assumes that `<` is a strict, consistent order, so
breaking either assumption causes silent wrong answers rather than crashes.
'''
body = '''
## Equatable: an equivalence

`==` must behave like equality: every value equals itself, `a == b` implies `b == a`, and
if `a == b` and `b == c`, then `a == c`. Synthesized `==` compares every stored property,
which is right for plain data such as points, money amounts and coordinates.

## Hashable: equal values, equal hashes

A `Set` or `Dictionary` computes a value's hash to choose a bucket, then uses `==` to find
the exact element inside it. So the one hard rule is:

> if `a == b`, then `a.hashValue == b.hashValue`.

Unequal values may share a hash (a *collision*), which only costs a little speed. In
`hash(into:)`, combine exactly the values that `==` compares:

```swift
func hash(into hasher: inout Hasher) {
    hasher.combine(id)        // == compares only id, so hash only id
}
```

## Comparable: a strict total order

`<` must be irreflexive (`a < a` is false), transitive, and consistent with `==`: for any two
values exactly one of `a < b`, `a == b` or `b < a` is true. Tuple comparison makes this easy:

```swift
static func < (l: Employee, r: Employee) -> Bool {
    (l.department, l.name, l.id) < (r.department, r.name, r.id)
}
```

The tuple is compared element by element, and the last element breaks any remaining tie.

## Natural order versus ad hoc order

Conform to `Comparable` when a type has one obvious order, such as versions, dates or
priorities. For every other order, pass a closure: `sorted { $0.salary > $1.salary }`.
Swift's `sort` is stable, so elements that compare equal keep their original relative order,
which lets you sort by a secondary key first and the primary key second.
'''

