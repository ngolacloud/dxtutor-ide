        test("parses and describes valid versions") {
            self.equal(Version("1.4.2")?.description, "1.4.2")
            self.equal(Version("2")?.description, "2")
            self.equal(Version("1.2.0")?.description, "1.2")
            self.equal(Version("007.1")?.description, "7.1")
            self.equal(Version("0.0")?.description, "0")
            self.equal(Version("0")?.description, "0")
