prompt = '''
Decode shipments whose `status` is an enum, and catch each kind of `DecodingError` to print
a precise message.

**Why:** in production the input is never as clean as the happy path, and a good error
message is the difference between a quick fix and an hour of debugging.
'''
target = '''
import Foundation

enum Status: String, Codable {
    case pending, shipped, delivered
}

struct Shipment: Codable {
    let id: Int
    let status: Status
}

func load(_ json: String) -> String {
    do {
        let shipment = try JSONDecoder().decode(Shipment.self, from: Data(json.utf8))
        return "ok #\(shipment.id) is \(shipment.status.rawValue)"
    } catch DecodingError.keyNotFound(let key, _) {
        return "missing key '\(key.stringValue)'"
    } catch DecodingError.typeMismatch(let type, let context) {
        let path = context.codingPath.map(\.stringValue).joined(separator: ".")
        return "wrong type at '\(path)', expected \(type)"
    } catch DecodingError.dataCorrupted(let context) {
        let path = context.codingPath.map(\.stringValue).joined(separator: ".")
        return path.isEmpty ? "invalid JSON" : "bad value at '\(path)'"
    } catch {
        return "other error: \(error)"
    }
}

print(load(#"{"id": 1, "status": "shipped"}"#))
print(load(#"{"status": "pending"}"#))
print(load(#"{"id": "one", "status": "pending"}"#))
print(load(#"{"id": 2, "status": "lost"}"#))
