id = "sw-u17-d3-decoding-errors"
title = "Enums and decoding errors"
points = 10
difficulty = 17
placeholder_policy = "on_demand"
run_command = "swiftc main.swift -o main && ./main"
intro = '''
Decoding is also validation: a missing key, a value of the wrong type or an unknown enum case
all throw a `DecodingError`. Pattern matching on its cases, and reading the `codingPath`,
turns an opaque failure into a message that says exactly where the input is wrong.
