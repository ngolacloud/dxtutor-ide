solution = '''
/// A hash table with separate chaining that doubles its buckets as it fills up.
struct HashTable<Key: Hashable, Value> {
    private var buckets: [[(key: Key, value: Value)]]
    private(set) var count = 0

    /// Provided: starts with 8 empty buckets.
    init() {
        buckets = Array(repeating: [], count: 8)
    }

    /// The number of buckets (provided).
    var bucketCount: Int { buckets.count }

    private func index(for key: Key) -> Int {
        Int(UInt(bitPattern: key.hashValue) % UInt(buckets.count))
    }

    subscript(key: Key) -> Value? {
        get {
            for entry in buckets[index(for: key)] where entry.key == key {
                return entry.value
            }
            return nil
        }
        set {
            if let newValue {
                insert(newValue, forKey: key)
            } else {
                removeValue(forKey: key)
            }
        }
    }

    private mutating func insert(_ value: Value, forKey key: Key) {
        let i = index(for: key)
        if let j = buckets[i].firstIndex(where: { $0.key == key }) {
            buckets[i][j].value = value
            return
        }
        buckets[i].append((key: key, value: value))
        count += 1
        if count * 4 > buckets.count * 3 {
            grow()
        }
    }

    @discardableResult
    mutating func removeValue(forKey key: Key) -> Value? {
        let i = index(for: key)
        guard let j = buckets[i].firstIndex(where: { $0.key == key }) else { return nil }
        buckets[i].swapAt(j, buckets[i].count - 1)
        count -= 1
        return buckets[i].removeLast().value
    }

    private mutating func grow() {
        let old = buckets
        buckets = Array(repeating: [], count: old.count * 2)
        for bucket in old {
            for entry in bucket {
                buckets[index(for: entry.key)].append(entry)
            }
        }
    }

    var keys: [Key] {
        buckets.flatMap { bucket in bucket.map(\.key) }
    }
}
'''
time = "O(1) average per get, set and remove (amortised for inserts); O(n) worst case"
space = "O(n)"
justification = '''
Every operation hashes the key once and scans one bucket. Because the table doubles whenever
`count` exceeds 0.75 of the bucket count, the average chain holds fewer than one pair, so a
lookup, an overwrite or a removal is **O(1) on average**. Removal swaps the found pair with the
last one in its bucket and pops it, which avoids shifting the rest of the chain.

Growth is the expensive part: `grow()` reinserts all *n* pairs, which is O(n). It runs only
when the count crosses 6, 12, 24, 48... so the total rehashing work for *n* inserts is at most
6 + 12 + 24 + ... < 2n, and each insert pays **amortised O(1)**. The worst case is a hash
function that sends every key to the same bucket: the chain then holds all *n* keys and every
operation becomes **O(n)**, which is why the colliding-key test still passes but would be slow
at scale. Memory is the pairs plus the bucket array, and the load-factor rule keeps the array
within a constant factor of *n*, so space is **O(n)**. As a struct of arrays, `HashTable` also
inherits copy-on-write: copies are cheap until one of them is mutated.
'''

[[unit]]
id = "sw-u32-binary-search-tree"
title = "Binary search trees"
level = "advanced"
difficulty = 32
intro = '''
A binary search tree keeps keys in order by putting smaller keys to the left and larger keys
to the right of every node, so each comparison discards a whole subtree. You will build an
immutable tree as an `indirect enum`, search a class-based tree with a loop, measure height to
see why insertion order matters, and finish with a generic `BST<T: Comparable>` that supports
the trickiest operation of all: deletion.
'''
concepts = '''
## The idea

A **binary tree** is made of nodes that each have at most two children, `left` and `right`. A **binary search tree** (BST) adds one ordering rule, the **BST property**: for every node, all keys in its left subtree are smaller than its key, and all keys in its right subtree are larger. Duplicates are rejected or always sent to the same side.

That rule turns search into a walk down the tree. Compare the target with the root, go left if it is smaller and right if it is larger, and stop on a match or at an empty child. Each step descends one level, so search, insert and delete all cost **O(h)**, where *h* is the tree's **height**.

The height depends on insertion order. Random order gives a height of O(log n), a few dozen levels for 100,000 keys. Sorted order is the disaster case: every key becomes the right child of the previous one, the tree degenerates into a linked list, and *h* = *n*. **Self-balancing** trees (AVL, red-black) rotate nodes to keep the height O(log n) whatever the order. Swift's standard library has no ordered tree; you sort an `Array` and binary-search it, or write one.

An **in-order traversal** (left subtree, node, right subtree) visits the keys in sorted order. That is the BST's edge over a hash table: ordered iteration, minimum, maximum and range queries come cheaply.

## How Swift does it

Swift offers two natural shapes. An **`indirect enum`** describes the tree as a value: a tree is either empty or a node with two subtrees. Every update returns a new tree, and unchanged subtrees are shared:

```swift
indirect enum Tree<T: Comparable> {
    case empty
    case node(Tree<T>, T, Tree<T>)
}
```

`indirect` tells the compiler to box the recursive payloads; without it you get `error: recursive enum 'Tree<T>' is not marked 'indirect'`. **Class nodes** describe a mutable tree that you rewire in place, the right choice for a long-lived container:

```swift
final class TreeNode<T: Comparable> {
    var value: T
    var left: TreeNode<T>?
    var right: TreeNode<T>?
    init(_ value: T) { self.value = value }
}
```

The `Comparable` constraint is what allows `<` on keys. Forget it and the compiler stops you with `binary operator '<' cannot be applied to two 'T' operands`.

## What is special or tricky

- **Recursion depth.** Recursive code on a degenerate tree recurses once per level. Swift has no recursion limit, but a deep enough chain overflows the stack and crashes. Searching and inserting are easy to write as loops.
- **Validity is about whole subtrees.** Checking only that each node is greater than its left child and smaller than its right child is not enough: a key deep in the left subtree must also be smaller than the root.
- **Deleting a node with two children** can't just splice it out. Something must take its place without breaking the order.
- With class nodes, a recursive helper that **returns the new subtree root** lets the parent reattach it, so even the root can change without special cases.

## What you will practise

You will insert into an immutable enum tree and read it back sorted, search a class tree with a loop while counting steps, and compare the heights of balanced and degenerate trees. The challenge is a generic `BST<T>` with insert, search, minimum, in-order listing and deletion, checked on 100,000 random keys.
'''

[[unit.step]]
kind = "concept"
id = "sw-u32-c1-bst-property"
title = "The BST property and O(h)"
points = 5
difficulty = 32
intro = '''
One ordering rule, applied at every node, is what turns a tree into a search structure. It
makes each comparison throw away a whole subtree, so the cost of an operation is the height
of the tree rather than the number of keys.
'''
body = '''
## The rule

For every node: keys in the left subtree are **smaller**, keys in the right subtree are
**larger**.

```
        50
      /    \
    30      70
   /  \    /  \
  20  40  60  80
```

## Search is a walk

To find 60: 60 > 50, go right; 60 < 70, go left; found. Three comparisons, each ruling out
half of what was left. To learn that 45 is absent, walk 50, 30, 40 and fall off an empty
right child.

```swift
var node = root
while let current = node, current.value != target {
    node = target < current.value ? current.left : current.right
}
```

## Insert follows the same walk

Walk as if searching. Where the walk falls off the tree, hang the new node. The tree only
ever grows at the bottom.

## In order means sorted

Visiting left subtree, node, right subtree yields 20 30 40 50 60 70 80. The tree is a sorted
sequence that you can search in O(h) and update without shifting elements, unlike a sorted
`Array`, where an insert costs O(n).

## Height decides everything

Every operation costs O(h). With 7 keys in the balanced shape above, h = 3. Insert the same
keys in sorted order and each one becomes the right child of the last: h = 7, and the tree
is a linked list. Balanced trees keep h = O(log n); a plain BST gives no such guarantee.
'''

