[[unit.step]]
kind = "challenge"
id = "sw-u05-x1-is-prime"
title = "Implement isPrime"
points = 20
difficulty = 5
entry = "isPrime"
intro = '''
A **prime** has exactly two divisors, 1 and itself. Trial division tests candidate
divisors one by one, and the key insight is that divisors come in pairs `d × (n / d)`, one
of which is at most √n. Stopping at the square root turns a billion iterations into about
thirty thousand.
'''
instructions = '''
## Your turn

Implement the function `isPrime`:

```swift
func isPrime(_ n: Int) -> Bool
```

It returns `true` when `n` is a **prime number**, a whole number greater than 1 whose only
divisors are 1 and itself, and `false` otherwise.

Examples:

- `isPrime(2)` → `true` (the only even prime)
- `isPrime(13)` → `true`
- `isPrime(15)` → `false` (3 × 5)
- `isPrime(1)` → `false`
- `isPrime(-7)` → `false`

Rules:

- 0, 1 and every negative number are not prime.
- `n` can be as large as 1,000,000,007. Testing every number below it would take far too
  long, so stop as soon as the answer is known.

**Hint:** if `n` has a divisor `d` other than 1 and `n`, then either `d` or `n / d` is at
most √n. So a `while` loop that tries `d = 2, 3, 4, ...` only while `d * d <= n` is enough;
return `false` the moment `n % d == 0`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Return true when n is prime: a whole number greater than 1 whose only divisors
// are 1 and itself. 0, 1 and negative numbers are not prime.
// n can be as large as 1_000_000_007, so stop testing divisors at the square root.
func isPrime(_ n: Int) -> Bool {
    fatalError("not implemented")
}
'''
tests = '''
test("small primes") {
    for p in [2, 3, 5, 7, 11, 13, 97] {
        self.expect(isPrime(p), "\(p) should be prime")
    }
}
test("small composites") {
    for c in [4, 6, 9, 15, 21, 25, 49, 91] {
        self.expect(!isPrime(c), "\(c) should not be prime")
    }
}
test("zero and one are not prime") {
    self.equal(isPrime(0), false)
    self.equal(isPrime(1), false)
}
test("negatives are not prime") {
    self.equal(isPrime(-1), false)
    self.equal(isPrime(-7), false)
    self.equal(isPrime(Int.min), false)
}
test("there are 25 primes below 100") {
    var count = 0
    for n in 0..<100 where isPrime(n) {
        count += 1
    }
    self.equal(count, 25)
}
test("square of a prime") {
    self.equal(isPrime(7919 * 7919), false)
}
test("large prime") {
    self.equal(isPrime(1_000_000_007), true)
    self.equal(isPrime(999_999_937), true)
}
test("large composite") {
    self.equal(isPrime(1_000_000_007 * 3), false)
    self.equal(isPrime(999_999_999), false)
}
'''

[unit.step.gabarito]
solution = '''
// Return true when n is prime: a whole number greater than 1 whose only divisors
// are 1 and itself. 0, 1 and negative numbers are not prime.
// n can be as large as 1_000_000_007, so stop testing divisors at the square root.
func isPrime(_ n: Int) -> Bool {
    guard n >= 2 else {
        return false
    }
    if n % 2 == 0 {
        return n == 2
    }
    var d = 3
    while d * d <= n {
        if n % d == 0 {
            return false
        }
        d += 2
    }
    return true
}
'''
time = "O(√n)"
space = "O(1)"
justification = '''
The loop tries divisors `d` only while `d * d <= n`, that is while `d <= √n`, and it skips
even candidates, so it runs at most about √n / 2 times. Each iteration does a constant
amount of work (one multiplication, one remainder, one comparison), giving **O(√n)** time in
the worst case, which happens when `n` is prime and no early `return` fires. For
1,000,000,007 that is about 15,800 iterations instead of a billion. Only the counter `d` is
stored, so the space is **O(1)**.

Stopping at √n is safe because divisors pair up: if `n = a × b` with `a <= b`, then
`a × a <= n`, so the smaller divisor is always found before the loop ends. The guard
handles 0, 1 and negatives before any arithmetic, and checking `n % 2` once lets the loop
step by 2. Writing the condition as `d * d <= n` avoids floating-point square roots. For
inputs up to about a billion, `d` never exceeds about 31,623, so `d * d` stays far below
`Int.max`; for `n` close to `Int.max` you would write `d <= n / d` instead, which cannot
overflow.
'''

[[unit]]
id = "sw-u06-functions"
title = "Functions: labels, defaults & tuples"
level = "basic"
difficulty = 6
intro = '''
Functions let you name a piece of work and reuse it. Swift functions read almost like
English sentences thanks to **argument labels**, and they can supply default values, change
a caller's variable with `inout`, and return several values at once in a tuple. This unit
closes the Basic level.
'''
concepts = '''
## The idea

A **function** is a named, reusable block of code. It receives input through
**parameters**, does its work, and may hand a result back with `return`. Functions let you
solve a problem once and use the solution everywhere, give a meaningful name to a few lines
of logic, and test each piece separately, which is exactly what the hidden tests do.

## How Swift does it

```swift
func area(width: Int, height: Int) -> Int {
    return width * height
}
let a = area(width: 3, height: 4)   // 12
```

`func` starts the declaration, each parameter has a name and a type, and `-> Int` is the
**return type**. If the body is a single expression you may drop `return`.

Each parameter has an **argument label**, used by the caller, and a **parameter name**,
used inside the body. By default they are the same. Write two names to make them differ,
or `_` to drop the label entirely:

```swift
func move(from start: Int, to end: Int) -> Int { end - start }
func square(_ x: Int) -> Int { x * x }

move(from: 2, to: 9)    // reads like a sentence
square(5)               // no label needed
```

A parameter can have a **default value**, `exponent: Int = 2`, so callers may leave it out.

Parameters are constants. To let a function change a caller's variable, mark the
parameter **`inout`** and pass the variable with `&` in front, which makes the change
visible at the call site.

A function can return several values at once as a **tuple**, optionally with named parts:
`-> (quotient: Int, remainder: Int)`. The caller reads `result.quotient` or splits the tuple
with `let (q, r) = ...`.

## What is special or tricky

- **Labels are part of the call.** Leaving one out fails with
  `missing argument label 'name:' in call`; using the wrong one is also an error.
- **Parameters can't be reassigned.** Assigning to one fails with
  `cannot assign to value: 'x' is a 'let' constant`. Copy it into a `var`, or use `inout`.
- **Every path must return.** A function with a return type that can end without a
  `return` fails with `missing return in global function expected to return 'Int'`.
- **`inout` needs `&`.** Forgetting it fails with `passing value of type 'Int' to an inout
  parameter requires explicit '&'`.
- **Unused results are flagged.** Calling a function and ignoring what it returns gives the
  warning `result of call to 'f()' is unused`; write `_ = f()` if you really mean it.

## What you will practise

You will declare functions with labels, unlabeled parameters and implicit returns, use
default parameter values and `inout` parameters, and return named tuples and take them
apart. The challenge combines all three ideas in a bill-splitting function.
'''

[[unit.step]]
kind = "concept"
id = "sw-u06-c1-functions"
title = "Functions, labels and return values"
points = 5
difficulty = 6
intro = '''
Calling a function pushes a new **frame** holding its parameters and local variables; when
it returns, the frame disappears and only the returned value survives. That isolation is
what makes functions safe to reuse: a function can only affect the outside world through
its result, or through parameters explicitly marked `inout`.
'''
body = '''
## Anatomy of a function

```swift
func greet(person: String, from hometown: String) -> String {
    "Hello \(person) from \(hometown)!"
}
print(greet(person: "Ada", from: "London"))
```

- `person` has one name, used both as the label in calls and inside the body.
- `from hometown` has two names: callers write `from:`, the body uses `hometown`.
- `-> String` is the return type. The body is a single expression, so `return` is optional.

## Choosing labels

Good labels make the call site read like a phrase: `move(from: 3, to: 10)`,
`divide(17, by: 5)`. Use `_` when the meaning is obvious without a label, as in
`square(9)` or `greet("World")`.

## Defaults and inout

```swift
func power(_ base: Int, exponent: Int = 2) -> Int { ... }
power(5)                  // exponent is 2
power(2, exponent: 10)

func addBonus(to score: inout Int) { score += 10 }
var points = 50
addBonus(to: &points)     // points is now 60
```

A default value makes an argument optional. `inout` copies the value in, lets the function
change it, and writes it back when the function returns; the `&` warns the reader that the
variable may change.

## Returning several values

```swift
func divide(_ a: Int, by b: Int) -> (quotient: Int, remainder: Int) {
    (a / b, a % b)
}
let (q, r) = divide(17, by: 5)   // q is 3, r is 2
```

A tuple bundles values without declaring a new type, which is ideal for small, temporary
groupings like this one.
'''

