Implement:

```swift
func parseServerConfig(_ text: String) throws(ConfigError) -> ServerConfig
func loadConfig(_ text: String) -> Result<ServerConfig, ConfigError>
```

`parseServerConfig` reads `key = value` lines and throws the **first** problem it meets:

1. Go through the lines in order; line numbers start at 1 and count every line. Trim spaces
   and tabs from each line. Skip blank lines and lines starting with `#`.
2. A line without `=` is `malformedLine(n)`. Otherwise split at the **first** `=` and trim
   the key and the value (so the value may itself contain `=`). An empty key is `emptyKey(n)`.
   A key seen before is `duplicateKey(key)`. Unknown keys are allowed and ignored.
3. After all lines: if `host` is missing or its value is empty, throw `missingKey("host")`;
   then, if `port` is missing, `missingKey("port")`.
4. `port` must be an integer from 1 to 65535, otherwise `invalidPort(value)`.
5. `debug` is optional and defaults to `false`; if present it must be exactly `true` or
   `false`, otherwise `invalidBool(value)`.

`loadConfig` returns the same outcome as a `Result`: `.success(config)` or `.failure(error)`.

