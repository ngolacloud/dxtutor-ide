instructions = '''
## Your turn

Implement `fulfill`:

```swift
func fulfill(
    _ orders: [(item: String, quantity: Int)],
    from stock: [String: Int]
) -> (stock: [String: Int], rejected: [String])
```

Apply the orders **in sequence** to the stock, and return what is left plus the items of the
orders you rejected.

Rules:

- An order is **rejected** when its quantity is 0 or negative, when the item is not in stock,
  or when the quantity is larger than the units left at that moment. A rejection changes
  nothing; append the order's item to `rejected`, keeping the order in which rejections
  happened.
- Otherwise, subtract the quantity from that item.
- The returned stock **never contains a zero count**. An item that reaches 0 is removed, and
  items that are already 0 in the input are dropped too (they count as out of stock).
- Don't modify anything the caller passed in. In Swift you could not even if you tried:
  `stock` is a constant copy.

Examples:

- `fulfill([("apple", 2)], from: ["apple": 5])` returns stock `["apple": 3]` and rejected `[]`.
- `fulfill([("egg", 4), ("egg", 3)], from: ["egg": 6])` returns stock `["egg": 2]` and
  rejected `["egg"]`.
- `fulfill([("kiwi", 4)], from: ["kiwi": 4])` returns stock `[:]` and rejected `[]`.

