[unit.step.gabarito]
solution = '''
import Foundation

/// A cache that loads each key at most once, even when many tasks ask for it at the same time.
actor LoadingCache {
    private var values: [String: String] = [:]
    private var inFlight: [String: Task<String, any Error>] = [:]

    /// Returns the cached value for `key`, joins a load already in progress for it,
    /// or starts a new load with `load`. Failed loads are not cached.
    func value(
        for key: String,
        load: @escaping @Sendable (String) async throws -> String
    ) async throws -> String {
        if let cached = values[key] {
            return cached
        }
        if let running = inFlight[key] {
            return try await running.value
        }
        let task = Task { try await load(key) }
        inFlight[key] = task
        do {
            let value = try await task.value
            values[key] = value
            inFlight[key] = nil
            return value
        } catch {
            inFlight[key] = nil
            throw error
        }
    }

    /// The keys that currently hold a cached value, sorted.
    func cachedKeys() -> [String] {
        values.keys.sorted()
    }
}
'''
time = "O(1) per call, O(k log k) for cachedKeys"
space = "O(k)"
justification = '''
Let *k* be the number of distinct keys. Each call to `value(for:load:)` does a constant number of
dictionary lookups and writes, which are **O(1)** on average, and calls `load` at most once per
key no matter how many callers ask concurrently. `cachedKeys()` sorts the *k* keys, so it costs
**O(k log k)**. The two dictionaries hold at most one value and one in-flight task per key, so the
space is **O(k)**.

Correctness rests on actor reentrancy. Between the cache checks and `inFlight[key] = task` there
is no `await`, so no other call can run on the actor in that stretch: the first caller always
registers its task before anyone else can look. Every caller that arrives while the load is
suspended finds the task and awaits its `value`, sharing both the result and the error. When the
load finishes, the first caller stores the value (or not, on failure) and removes the task, again
without suspending. The naive version (check the dictionary, `await load(key)`, then store) has
an `await` between the check and the store, so every concurrent caller misses and the loader runs
once per caller.
'''

[[unit]]
id = "sw-u25-async-sequences"
title = "AsyncSequence, AsyncStream and for await"
level = "advanced"
difficulty = 25
intro = '''
Some values do not arrive all at once but over time: lines from a socket, sensor readings, events
from a user. An `AsyncSequence` is a sequence whose next element may need to be awaited, and
`for await` loops over it. You will produce values with `AsyncStream`, propagate errors with
`AsyncThrowingStream`, write your own async sequence, and finish by building a stream adapter that
groups another stream's elements into chunks.
'''
concepts = '''
## The idea

A `Sequence` hands out its elements on demand: `next()` returns the next one immediately, or
`nil` at the end. An **`AsyncSequence`** is the same idea for values that arrive over time: its
iterator's `next()` is `async`, so asking for the next element may suspend until one is ready.
The consumer pulls elements one at a time, at its own pace, and the sequence ends when `next()`
returns `nil` (or throws, for a throwing sequence).

```swift
for await reading in sensor.readings {
    print(reading)
}
```

`for await` suspends between elements without blocking a thread. Use `for try await` when the
sequence can throw. `break` stops consuming early, and the usual operators exist in async form:
`map`, `filter`, `prefix`, `contains`, `reduce` and friends.

## AsyncStream: bridging pushes into a sequence

Most sources *push* values: a callback fires, a timer ticks. `AsyncStream` turns pushes into a
sequence you can pull from. Its builder gives you a **continuation**:

```swift
let numbers = AsyncStream<Int> { continuation in
    continuation.yield(1)
    continuation.yield(2)
    continuation.finish()
}
```

`yield` buffers a value for the consumer, `finish()` ends the sequence, and `finish(throwing:)`
ends an `AsyncThrowingStream` with an error. `AsyncStream.makeStream(of:)` returns the stream and
its continuation as a pair, handy when the producer lives somewhere else.

When the consumer stops early, or the task iterating the stream is cancelled, the stream
**terminates** and calls the continuation's `onTermination` closure. That is where a producer
cancels its background task, closes a file or unsubscribes, so nothing keeps working for a
consumer that has gone.

## Writing your own

Any type can become an async sequence by conforming to `AsyncSequence` and providing an iterator
that conforms to `AsyncIteratorProtocol` with a `mutating func next() async -> Element?`.

## Pitfalls and compiler errors

- **"'async' in a function that does not support concurrency"**: `for await` must run in an async
  context, or at the top level of `main.swift`.
- **"call can throw but is not marked with 'try'"**: a throwing stream needs `for try await`.
- A stream that is never finished keeps its consumer waiting forever. Always call `finish()` on
  every path, including errors.
- `yield` after termination is ignored; it returns `.terminated`, which a producer can check to
  stop early.
- Values yielded into a stream cross into another task, so in Swift 6 the element type must be
  `Sendable`.

## What you'll practise

You will consume an `AsyncStream` fed by a producer task, handle an error from an
`AsyncThrowingStream`, write a custom `AsyncSequence` and chain operators on it, and in the
challenge write a stream adapter that chunks another stream and cleans up when its consumer leaves.
'''

[[unit.step]]
kind = "concept"
id = "sw-u25-c1-pull-model"
title = "Values over time"
points = 5
difficulty = 25
intro = '''
An async sequence is a pull-based stream: the consumer asks for the next element and may suspend
until it exists. Producers that push values, such as callbacks or timers, are adapted with
`AsyncStream`, whose continuation buffers values until the consumer pulls them.
'''
body = '''
## Pull, not push

With a callback, the producer decides when your code runs. With an async sequence, the
**consumer** decides: each turn of `for await` calls the iterator's `next()`, and the loop body
runs only after an element is available. Back-pressure comes for free: a slow consumer simply asks
less often.

```swift
for await line in lines {
    if line.isEmpty { break }
    print(line)
}
```

The loop ends when `next()` returns `nil`. A throwing sequence ends either with `nil` or with an
error that `for try await` rethrows.

## The continuation

`AsyncStream` connects a pushing producer to a pulling consumer. The builder closure receives a
continuation with three jobs:

- `yield(value)` hands a value over, buffering it if the consumer is not ready yet;
- `finish()` (or `finish(throwing:)` for `AsyncThrowingStream`) ends the stream;
- `onTermination` runs once when the stream ends, whether it finished, the consumer stopped early,
  or the consuming task was cancelled.

```swift
let ticks = AsyncStream<Int> { continuation in
    let timer = Task {
        for i in 1...3 { continuation.yield(i) }
        continuation.finish()
    }
    continuation.onTermination = { _ in timer.cancel() }
}
```

The builder runs once, immediately, so long-running production belongs in a `Task` like the one
above, and cleanup belongs in `onTermination`.

## Iterators

Under the hood, `for await x in s` creates an iterator with `s.makeAsyncIterator()` and calls
`try await iterator.next()` until it returns `nil`. Writing that pair of types yourself gives you a
custom async sequence that works with every operator.
'''

