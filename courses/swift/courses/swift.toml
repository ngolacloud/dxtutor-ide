[[unit.step]]
kind = "challenge"
id = "sw-u11-x1-accounts"
title = "Accounts that share money"
points = 30
difficulty = 11
entry = "Account"
intro = '''
Bank accounts are the textbook case for classes: each account has an identity, several parts of
a program hold references to it, and a savings account is a specialised account. Writing
`transfer` once in the base class and letting it call an overridable `withdraw` is the
template-method pattern, and it works only because of dynamic dispatch.
'''
instructions = '''
## Your turn

Complete the classes `Account` and `SavingsAccount`. Amounts are whole units, as `Int`.

```swift
class Account {
    let owner: String
    private(set) var balance: Int
    init(owner: String, balance: Int)
    func deposit(_ amount: Int) -> Bool
    func withdraw(_ amount: Int) -> Bool
    func transfer(_ amount: Int, to other: Account) -> Bool
}

final class SavingsAccount: Account {
    let minimumBalance: Int
    init(owner: String, balance: Int, minimumBalance: Int)
    override func withdraw(_ amount: Int) -> Bool
}
```

Rules for `Account`:

- `init` stores the owner and the starting balance. The tests only use non-negative balances.
- `deposit` adds a **positive** amount and returns `true`. For 0 or a negative amount it
  returns `false` and changes nothing.
- `withdraw` removes a positive amount that does not exceed the balance and returns `true`.
  Otherwise it returns `false` and changes nothing. The balance may reach exactly 0.
- `transfer(_:to:)` moves money to `other` by withdrawing from this account and depositing into
  `other`. It returns `false` and changes **neither** account when the withdrawal fails, or
  when `other` is **this very object**. Decide that with identity (`===` or `!==`), not by
  comparing owners or balances: a different account with the same owner and balance is a valid
  target.

Rules for `SavingsAccount`:

- `init` stores `minimumBalance` and calls `super.init`.
- Its `withdraw` refuses, returning `false`, any withdrawal that would leave less than
  `minimumBalance`. Otherwise it behaves like `Account.withdraw`.
- `transfer` is **not** overridden, yet a transfer out of a savings account must respect the
  minimum, even when the account is used through a variable of type `Account`.

The methods are marked `@discardableResult`, so callers may ignore the returned `Bool`.

Examples:

- `Account(owner: "Ada", balance: 100).withdraw(150)` returns `false`, and the balance stays 100.
- With balances 100 and 5, `a.transfer(30, to: b)` returns `true` and leaves 70 and 35.
- `a.transfer(10, to: a)` returns `false`.
- `SavingsAccount(owner: "Eve", balance: 100, minimumBalance: 20).withdraw(81)` returns
  `false`, but `withdraw(80)` returns `true`.

**Hint:** write `transfer` in terms of `withdraw` and `deposit`, and deposit only after the
withdrawal has succeeded. In the override, check the minimum, then call
`super.withdraw(amount)` for the usual checks.

Hidden tests decide correctness.
'''
starter = '''
/// A bank account. It is a class: every variable that holds it shares one balance.
class Account {
    let owner: String
    private(set) var balance: Int

    init(owner: String, balance: Int) {
        fatalError("not implemented")
    }

    /// Adds a positive amount and returns true; returns false (no change) otherwise.
    @discardableResult
    func deposit(_ amount: Int) -> Bool {
        fatalError("not implemented")
    }

    /// Removes a positive amount that does not exceed the balance and returns true;
    /// returns false (no change) otherwise.
    @discardableResult
    func withdraw(_ amount: Int) -> Bool {
        fatalError("not implemented")
    }

    /// Moves money to `other` by withdrawing here and depositing there. Returns false,
    /// changing nothing, when the withdrawal fails or `other` is this same object.
    @discardableResult
    func transfer(_ amount: Int, to other: Account) -> Bool {
        fatalError("not implemented")
    }
}

/// A savings account must always keep at least `minimumBalance`.
final class SavingsAccount: Account {
    let minimumBalance: Int

    init(owner: String, balance: Int, minimumBalance: Int) {
        fatalError("not implemented")
    }

    /// Like Account.withdraw, but refuses to go below `minimumBalance`.
    @discardableResult
    override func withdraw(_ amount: Int) -> Bool {
        fatalError("not implemented")
    }
}
'''
tests = '''
test("a new account keeps its owner and balance") {
    let a = Account(owner: "Ada", balance: 100)
    self.equal(a.owner, "Ada")
    self.equal(a.balance, 100)
}
test("deposit accepts only positive amounts") {
    let a = Account(owner: "Ada", balance: 0)
    self.expect(a.deposit(40), "deposit(40) should succeed")
    self.expect(!a.deposit(0), "deposit(0) should fail")
    self.expect(!a.deposit(-5), "deposit(-5) should fail")
    self.equal(a.balance, 40)
}
test("withdraw cannot overdraw") {
    let a = Account(owner: "Ben", balance: 50)
    self.expect(a.withdraw(50), "withdrawing the whole balance is allowed")
    self.equal(a.balance, 0)
    self.expect(!a.withdraw(1), "an empty account cannot pay")
    self.expect(!a.withdraw(-10), "negative withdrawals are refused")
    self.equal(a.balance, 0)
}
test("two variables, one account") {
    let a = Account(owner: "Cy", balance: 10)
    let alias = a
    alias.deposit(15)
    self.equal(a.balance, 25)
    self.expect(a === alias, "both names refer to the same object")
}
test("transfer moves money between two objects") {
    let a = Account(owner: "Ada", balance: 100)
    let b = Account(owner: "Ben", balance: 5)
    self.expect(a.transfer(30, to: b), "transfer should succeed")
    self.equal(a.balance, 70)
    self.equal(b.balance, 35)
    self.expect(!a.transfer(500, to: b), "too large a transfer must fail")
    self.expect(!a.transfer(0, to: b), "a zero transfer must fail")
    self.equal(a.balance, 70)
    self.equal(b.balance, 35)
}
test("transfer to the same object is refused, but a twin is fine") {
    let a = Account(owner: "Dee", balance: 60)
    let same = a
    self.expect(!a.transfer(10, to: same), "an account cannot pay itself")
    self.equal(a.balance, 60)
    let twin = Account(owner: "Dee", balance: 60)
    self.expect(a.transfer(10, to: twin), "an equal-looking but distinct account is a valid target")
    self.equal(a.balance, 50)
    self.equal(twin.balance, 70)
}
test("savings keep their minimum balance") {
    let s = SavingsAccount(owner: "Eve", balance: 100, minimumBalance: 20)
    self.equal(s.minimumBalance, 20)
    self.expect(!s.withdraw(81), "would drop below the minimum")
    self.expect(s.withdraw(80), "lands exactly on the minimum")
    self.equal(s.balance, 20)
    self.expect(!s.withdraw(-1), "negative withdrawals are refused")
    self.expect(s.deposit(5), "deposits still work")
    self.equal(s.balance, 25)
}
test("the override is used through an Account reference") {
    let s = SavingsAccount(owner: "Fay", balance: 50, minimumBalance: 40)
    let asBase: Account = s
    let other = Account(owner: "Gus", balance: 0)
    self.expect(!asBase.withdraw(20), "dynamic dispatch must reach the savings rule")
    self.expect(!asBase.transfer(11, to: other), "transfers use withdraw, so the rule applies")
    self.expect(asBase.transfer(10, to: other), "a transfer within the rule succeeds")
    self.equal(s.balance, 40)
    self.equal(other.balance, 10)
    self.expect(other.transfer(10, to: s), "a plain account can pay into savings")
    self.equal(s.balance, 50)
}
test("many small transfers balance out") {
    let a = Account(owner: "A", balance: 10_000)
    let b = Account(owner: "B", balance: 0)
    for _ in 0..<10_000 {
        a.transfer(1, to: b)
    }
    self.equal(a.balance, 0)
    self.equal(b.balance, 10_000)
    self.expect(!a.transfer(1, to: b), "a is empty now")
}
'''

[unit.step.gabarito]
solution = '''
/// A bank account. It is a class: every variable that holds it shares one balance.
class Account {
    let owner: String
    private(set) var balance: Int

    init(owner: String, balance: Int) {
        self.owner = owner
        self.balance = balance
    }

    @discardableResult
    func deposit(_ amount: Int) -> Bool {
        guard amount > 0 else { return false }
        balance += amount
        return true
    }

    @discardableResult
    func withdraw(_ amount: Int) -> Bool {
        guard amount > 0, amount <= balance else { return false }
        balance -= amount
        return true
    }

    @discardableResult
    func transfer(_ amount: Int, to other: Account) -> Bool {
        guard other !== self, withdraw(amount) else { return false }
        other.deposit(amount)
        return true
    }
}

/// A savings account must always keep at least `minimumBalance`.
final class SavingsAccount: Account {
    let minimumBalance: Int

    init(owner: String, balance: Int, minimumBalance: Int) {
        self.minimumBalance = minimumBalance
        super.init(owner: owner, balance: balance)
    }

    @discardableResult
    override func withdraw(_ amount: Int) -> Bool {
        guard balance - amount >= minimumBalance else { return false }
        return super.withdraw(amount)
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Every method does a constant number of comparisons, at most one subtraction and one addition,
and no loops or allocations, so each runs in **O(1)** time and **O(1)** extra space. Creating an
account is one small heap allocation holding two or three stored properties.

The correctness argument rests on three class features:

- **Encapsulation.** `balance` is `private(set)`, so only `deposit` and `withdraw` can change
  it, and both reject non-positive amounts. `Account.withdraw` never goes below 0, and the
  override never below `minimumBalance`. These invariants hold no matter who holds a reference.
- **Identity.** `other !== self` compares references, which is exactly what "the same account"
  means. Comparing owners or balances would wrongly refuse a transfer to a different account
  that merely looks the same, and `==` is not even available without `Equatable`.
- **Dynamic dispatch.** `transfer` calls `withdraw` on `self`. When `self` is a
  `SavingsAccount`, even through a reference typed `Account`, Swift runs the override, so the
  minimum-balance rule applies to transfers with no extra code. Because the deposit happens
  only after a successful withdrawal, a failed transfer leaves both accounts untouched.

A struct could not model this: copying an account would duplicate its money, and a transfer
would change copies instead of the accounts the caller holds.
'''

