- `append(2)`, `pushFront(1)`, `append(3)`, then `toArray()` gives `[1, 2, 3]`.
- On `[7, 1, 7, 2, 7]`, `removeAll { $0 == 7 }` returns `3` and leaves `[1, 2]`, whose tail
