Integers and floating-point numbers are stored in completely different binary formats, so
turning one into the other is a real computation that may lose information. A fixed-width
integer that exceeds its range **overflows**; Swift treats that as an error by default and
offers explicit wrapping operators for the rare cases where wrap-around is the goal.
