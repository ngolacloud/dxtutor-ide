[unit.step.gabarito]
solution = '''
/// A node of a tree (folders, menus, scene graphs...) with a back-pointer to its parent.
final class TreeNode {
    let name: String
    private(set) var children: [TreeNode] = []
    /// Weak: the parent owns its children, never the other way round.
    weak var parent: TreeNode?

    init(_ name: String) {
        self.name = name
    }

    /// Attaches `child` as the last child of this node, detaching it from any
    /// previous parent. Refuses (returns false) when `child` is this node or one
    /// of its ancestors, because that would turn the tree into a cycle.
    @discardableResult
    func addChild(_ child: TreeNode) -> Bool {
        var node: TreeNode? = self
        while let current = node {
            if current === child { return false }
            node = current.parent
        }
        child.removeFromParent()
        child.parent = self
        children.append(child)
        return true
    }

    /// Detaches this node from its parent. Does nothing for a root.
    func removeFromParent() {
        guard let parent else { return }
        parent.children.removeAll { $0 === self }
        self.parent = nil
    }

    /// The number of ancestors: 0 for a root.
    var depth: Int {
        var count = 0
        var node = parent
        while let current = node {
            count += 1
            node = current.parent
        }
        return count
    }

    /// The names from the root down to this node, joined by "/".
    func path() -> String {
        var names: [String] = []
        var node: TreeNode? = self
        while let current = node {
            names.append(current.name)
            node = current.parent
        }
        return names.reversed().joined(separator: "/")
    }
}
'''
time = "O(d + s) per operation"
space = "O(d)"
justification = '''
Let *d* be the depth of the node and *s* the number of children of the parent involved.

- `depth` and `path()` walk up the parent chain once, so they cost **O(d)**. `path()` also
  collects *d* names and reverses them, which is **O(d)** extra space; `depth` needs O(1).
- `addChild` first walks up from `self` to check that `child` is not this node or an
  ancestor, which is O(d). It then detaches the child from its old parent with
  `removeAll { $0 === self }`, a single **O(s)** scan of that parent's children, and appends
  in amortized O(1).
- `removeFromParent` is the same O(s) scan.

The memory behaviour is the point of the exercise. `children` holds strong references and
`parent` is `weak`, so the only strong references point downwards and the ownership graph is
a tree, with no cycles. When the last outside reference to the root disappears, its count
hits zero, its `children` array is released, and the release cascades down. Every weak
`parent` pointing at a freed node is set to `nil` by ARC, which is why a child that outlives
its parent reports `parent == nil` and `path() == name`. `unowned` would also break the cycle,
but reading it after the parent died would trap, so `weak` is the correct choice when a child
can outlive its parent. The cycle check in `addChild` matters for the same reason: if a node
became its own ancestor, the strong `children` references alone would form a loop and leak.
'''

[[unit]]
id = "sw-u28-sequences-iterators"
title = "Sequences, iterators and laziness"
level = "advanced"
difficulty = 28
intro = '''
Every `for`-`in` loop in Swift is driven by two small protocols, `Sequence` and
`IteratorProtocol`, and conforming your own types to them gives you `map`, `filter`,
`reduce`, `prefix` and the rest for free. You will write finite and infinite sequences, see
how `lazy` turns eager pipelines into on-demand ones, and finish with a lazy run-length
encoder that works on any sequence, even an endless one.
'''
concepts = '''
## The idea

Many algorithms only need to look at values **one at a time, in order**: summing, searching,
printing, encoding. They do not need random access or even to know how many values there
are. An **iterator** captures exactly that: an object with one operation, "give me the next
value, or tell me you are done". A **sequence** is anything that can hand out an iterator. The
values may come from an array, be computed on the fly, be read from a file, or never end.

## How Swift does it

```swift
protocol IteratorProtocol {
    associatedtype Element
    mutating func next() -> Element?   // nil means "finished"
}

protocol Sequence {
    associatedtype Iterator: IteratorProtocol
    func makeIterator() -> Iterator
}
```

The compiler turns `for x in seq { body }` into

```swift
var it = seq.makeIterator()
while let x = it.next() { body }
```

`next()` is `mutating` because an iterator must remember where it is. A type can be its own
iterator (conform to both protocols and implement only `next()`), or it can return a separate
iterator struct, which lets the same sequence be walked many times from the start. Once you
conform, every `Sequence` algorithm works: `map`, `filter`, `reduce`, `first(where:)`,
`contains`, `prefix`, `enumerated`, `zip`, `max(by:)`...

The free functions `sequence(first:next:)` and `sequence(state:next:)`, and the type-erased
`AnyIterator { ... }`, build sequences from closures without declaring a type.

## Eager and lazy

`map` and `filter` on a sequence are **eager**: they run over every element at once and
build a new array. `.lazy` returns a view whose `map` and `filter` store the closure and
apply it only when an element is pulled, one at a time. That makes pipelines over infinite
sequences possible, and avoids work for elements you never look at:

```swift
let firstBig = (1...).lazy.map { $0 * $0 }.first { $0 > 50 }   // 64, after 8 squares
```

## Pitfalls and compiler errors

- Forgetting `mutating` on `next()`: `cannot assign to property: 'self' is immutable`.
- Calling `next()` on a `let`: `cannot use mutating member on immutable value`. Iterators live
  in `var`s.
- `Array(infinite)` or a plain `map` on an infinite sequence never finishes. Use `prefix`,
  `first(where:)` or `lazy` first.
- A lazy pipeline is recomputed each time you iterate it. If you need the results twice,
  store them in an `Array`.
- A `Sequence` is only promised to be **single-pass**: some (an iterator wrapped as a
  sequence, a stream) cannot be restarted. Use `Collection` when you need multi-pass access.

## What you will practise

You will write a countdown that is its own iterator, an infinite Fibonacci sequence with a
separate iterator, and measure how much work `lazy` saves. The challenge is a lazy
run-length encoder, generic over any sequence of `Equatable` elements.
'''

[[unit.step]]
kind = "concept"
id = "sw-u28-c1-for-in-desugared"
title = "What for-in really calls"
points = 5
difficulty = 28
intro = '''
`for`-`in` is syntactic sugar over a pull-based protocol: ask for an iterator, then call
`next()` until it returns `nil`. Seeing that loop written out explains why iterators are
`var`s, why sequences can be infinite, and why laziness is possible at all.
'''
body = '''
## The loop, written out

```swift
for word in ["to", "be"] {
    print(word)
}
```

is compiled as

```swift
var iterator = ["to", "be"].makeIterator()
while let word = iterator.next() {
    print(word)
}
```

The consumer **pulls** values one at a time. The iterator keeps the position (for an array,
an index) and returns `nil` when there is nothing left.

## Writing a sequence

The shortest route is a type that is its own iterator:

```swift
struct Evens: Sequence, IteratorProtocol {
    var n = 0
    mutating func next() -> Int? {
        defer { n += 2 }
        return n
    }
}
```

`Evens()` never returns `nil`, so it is infinite, and that is fine: the loop decides when to
stop. `Array(Evens().prefix(3))` is `[0, 2, 4]`, and `Evens().first { $0 > 7 }` is `8`.

## Separate iterators

When the sequence and its iterator are different types, `makeIterator()` creates a fresh
iterator each time, so the same sequence value can be walked again from the beginning. This
is how `Array`, `Dictionary` and `String` work: the collection is unchanged by iteration,
and only the iterator moves. A sequence that hands out the same underlying source twice (a
network stream, an `AnyIterator` you wrapped) is single-pass, and walking it a second time
continues where the first walk stopped.
'''

