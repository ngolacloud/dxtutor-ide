            }
            self.equal(render(status(0)), "<p>No messages</p>")
            self.equal(render(status(1)), "<p>One message</p>")
            self.equal(render(status(7)), "<p>7 messages</p>")
        }
        test("for loops, including an empty one") {
            func list(_ items: [String]) -> HTMLNode {
                element("ul") {
                    for item in items {
                        element("li") { item }
                    }
                }
            }
            self.equal(render(list(["x", "y", "x"])), "<ul><li>x</li><li>y</li><li>x</li></ul>")
            self.equal(render(list([])), "<ul></ul>")
            self.equal(list(["one"]), HTMLNode.element(tag: "ul", children: [.element(tag: "li", children: [.text("one")])]))
        }
        test("text is escaped, tags are not") {
            let node = element("p") { "a < b && \"c\" > d" }
            self.equal(render(node), "<p>a &lt; b &amp;&amp; &quot;c&quot; &gt; d</p>")
            self.equal(render(.text("<script>")), "&lt;script&gt;")
            self.equal(render(.text("café ✓")), "café ✓")
        }
        test("a large list renders in linear time") {
            let n = 20_000
            let start = Date()
            let node = element("ol") {
                for i in 0..<n {
                    element("li") { "item \(i)" }
