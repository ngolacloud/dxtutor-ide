[[unit.step]]
kind = "challenge"
id = "sw-u23-x1-map-concurrently"
title = "A concurrent map with a limit"
points = 40
difficulty = 23
entry = "mapConcurrently"
intro = '''
A concurrent `map` is the workhorse of batch processing, and a good one has three properties: it
returns results in input order although they finish in any order, it caps how many items run at
once so it does not overwhelm a server, and it stops promptly on the first error or when its
caller is cancelled. A task group with a sliding window delivers all three.
'''
instructions = '''
## Your turn

Implement `mapConcurrently`:

```swift
func mapConcurrently<T: Sendable, R: Sendable>(
    _ items: [T],
    maxConcurrent: Int,
    transform: @escaping @Sendable (T) async throws -> R
) async throws -> [R]
```

It applies `transform` to every item concurrently and returns the results **in the same order as
`items`**. The `MapError` enum is provided in the starter.

Rules:

- If `maxConcurrent < 1`, throw `MapError.invalidLimit(maxConcurrent)`.
- **Never** run more than `maxConcurrent` transforms at the same time, and do run up to that many:
  the tests measure both.
- An empty input returns `[]` without calling `transform`.
- If a transform throws, rethrow that error and **start no further items**; items still running
  are cancelled.
- If the calling task is cancelled, stop and throw `CancellationError`.

Examples:

- `mapConcurrently([5, 1, 4], maxConcurrent: 3) { $0 * 10 }` returns `[50, 10, 40]`, even if the
  item `1` finishes first.
- With `maxConcurrent: 1` the items run one at a time.
- `mapConcurrently([1], maxConcurrent: 0) { $0 }` throws `MapError.invalidLimit(0)`.

**Hint:** use `withThrowingTaskGroup(of: (Int, R).self)` so each child returns its index. Add the
first `maxConcurrent` children, then add one more each time `group.next()` delivers a result.
Store results in an array of optionals indexed by position.

Hidden tests decide correctness.
'''
starter = '''
import Foundation

/// Thrown when `maxConcurrent` is below 1 (provided: do not change it).
enum MapError: Error, Equatable {
    case invalidLimit(Int)
}

/// Applies `transform` to every item and returns the results in the order of `items`.
///
/// - Throw `MapError.invalidLimit(maxConcurrent)` when `maxConcurrent < 1`.
/// - Never run more than `maxConcurrent` transforms at the same time, but do run up to that many.
/// - If a transform throws, rethrow that error and start no further items.
/// - If the calling task is cancelled, stop and throw `CancellationError`.
func mapConcurrently<T: Sendable, R: Sendable>(
    _ items: [T],
    maxConcurrent: Int,
    transform: @escaping @Sendable (T) async throws -> R
) async throws -> [R] {
    fatalError("not implemented")
}
'''
tests = '''
actor Probe {
    private(set) var started = 0
    private(set) var finished = 0
    private(set) var inFlight = 0
    private(set) var peak = 0
    func enter() {
        started += 1
        inFlight += 1
        peak = max(peak, inFlight)
    }
    func leave() {
        inFlight -= 1
        finished += 1
    }
    // Waits (up to ~0.5 s, in 1 ms steps) until `count` transforms are running at once.
    func meet(_ count: Int) async {
        var tries = 0
        while inFlight < count && tries < 500 {
            tries += 1
            try? await Task.sleep(for: .milliseconds(1))
        }
    }
}

struct Boom: Error, Equatable {}

test("keeps the input order even when later items finish first") {
    let out = try await mapConcurrently([5, 1, 4, 2, 3], maxConcurrent: 5) { n in
        try await Task.sleep(for: .milliseconds(n * 3))
        return n * 10
    }
    self.equal(out, [50, 10, 40, 20, 30])
}

test("an empty input returns an empty array and calls nothing") {
    let probe = Probe()
    let out = try await mapConcurrently([Int](), maxConcurrent: 3) { n in
        await probe.enter()
        return n
    }
    self.equal(out, [])
    self.equal(await probe.started, 0)
}

test("maxConcurrent 1 runs the items one at a time") {
    let probe = Probe()
    let out = try await mapConcurrently(["a", "bb", "ccc"], maxConcurrent: 1) { s in
        await probe.enter()
        try await Task.sleep(for: .milliseconds(2))
        await probe.leave()
        return s.count
    }
    self.equal(out, [1, 2, 3])
    self.equal(await probe.peak, 1)
}

test("never runs more than maxConcurrent transforms at once") {
    let probe = Probe()
    let out = try await mapConcurrently(Array(1...12), maxConcurrent: 3) { n in
        await probe.enter()
        try await Task.sleep(for: .milliseconds(2))
        await probe.leave()
        return n * n
    }
    self.equal(out, (1...12).map { $0 * $0 })
    self.expect(await probe.peak <= 3, "peak was \(await probe.peak), the limit is 3")
    self.equal(await probe.started, 12)
}

test("really runs up to maxConcurrent transforms in parallel") {
    let probe = Probe()
    let out = try await mapConcurrently(["w", "x", "y", "z"], maxConcurrent: 4) { s in
        await probe.enter()
        await probe.meet(4)
        await probe.leave()
        return s.uppercased()
    }
    self.equal(out, ["W", "X", "Y", "Z"])
    self.equal(await probe.peak, 4)
}

test("a limit larger than the input, duplicates and negatives") {
    let out = try await mapConcurrently([-2, -2, 3, 0], maxConcurrent: 100) { n in abs(n) }
    self.equal(out, [2, 2, 3, 0])
}

test("rejects a limit below 1") {
    for bad in [0, -3] {
        do {
            _ = try await mapConcurrently([1, 2], maxConcurrent: bad) { $0 }
            self.expect(false, "expected MapError.invalidLimit(\(bad))")
        } catch let error as MapError {
            self.equal(error, .invalidLimit(bad))
        }
    }
}

test("the first error is rethrown and no further items are started") {
    let probe = Probe()
    do {
        _ = try await mapConcurrently(Array(0..<20), maxConcurrent: 2) { n in
            await probe.enter()
            if n == 3 { throw Boom() }
            try await Task.sleep(for: .milliseconds(2))
            await probe.leave()
            return n
        }
        self.expect(false, "expected Boom to be thrown")
    } catch let error as Boom {
        self.equal(error, Boom())
    }
    let started = await probe.started
    self.expect(started < 20, "\(started) items were started after the error")
}

test("cancelling the caller stops the work with CancellationError") {
    let probe = Probe()
    let job = Task {
        try await mapConcurrently(Array(0..<50), maxConcurrent: 2) { n in
            await probe.enter()
            try await Task.sleep(for: .milliseconds(10))
            await probe.leave()
            return n
        }
    }
    try await Task.sleep(for: .milliseconds(15))
    job.cancel()
    do {
        _ = try await job.value
        self.expect(false, "expected CancellationError")
    } catch is CancellationError {
        self.expect(true)
    }
    let finished = await probe.finished
    self.expect(finished < 50, "all \(finished) items finished despite the cancel")
    try await Task.sleep(for: .milliseconds(20))
    self.equal(await probe.finished, finished)
}

test("a thousand items with a small limit") {
    let out = try await mapConcurrently(Array(0..<1_000), maxConcurrent: 8) { n in n * 2 }
    self.equal(out, (0..<1_000).map { $0 * 2 })
}
'''

[unit.step.gabarito]
solution = '''
import Foundation

/// Thrown when `maxConcurrent` is below 1 (provided: do not change it).
enum MapError: Error, Equatable {
    case invalidLimit(Int)
}

/// Applies `transform` to every item with at most `maxConcurrent` child tasks running at once
/// and returns the results in the same order as `items`.
func mapConcurrently<T: Sendable, R: Sendable>(
    _ items: [T],
    maxConcurrent: Int,
    transform: @escaping @Sendable (T) async throws -> R
) async throws -> [R] {
    guard maxConcurrent >= 1 else { throw MapError.invalidLimit(maxConcurrent) }
    return try await withThrowingTaskGroup(of: (Int, R).self) { group in
        var results = [R?](repeating: nil, count: items.count)
        var nextIndex = 0
        func startNext() {
            let index = nextIndex
            let item = items[index]
            group.addTask { (index, try await transform(item)) }
            nextIndex += 1
        }
        while nextIndex < min(maxConcurrent, items.count) {
            startNext()
        }
        while let (index, value) = try await group.next() {
            results[index] = value
            if nextIndex < items.count {
                try Task.checkCancellation()
                startNext()
            }
        }
        return results.compactMap { $0 }
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let *n* be the number of items and *k* = `maxConcurrent`. Each item is added to the group once
and its result is received once by `group.next()`, and storing a result at its index is O(1), so
the bookkeeping is **O(n)** (plus the cost of the *n* transforms themselves). The results array
holds *n* optionals, so the extra space is **O(n)**; at most *k* child tasks exist at any moment,
so the task overhead is O(k).

The sliding window is what enforces the limit: the loop starts *k* children, and every time one
result comes out it starts exactly one more, so the number of running children never exceeds *k*
and stays at *k* while items remain. Returning the index with each value makes completion order
irrelevant. Errors and cancellation come for free from structured concurrency: a child's error is
rethrown by `next()`, which leaves the group, and the group cancels and awaits the remaining
children; a cancelled caller cancels the group, so the transforms' `Task.sleep` (or
`Task.checkCancellation()` before adding more work) throws `CancellationError`. Adding all *n*
children up front would also be O(n), but it would ignore the limit and start every item before
the first error could stop anything.
'''

[[unit]]
id = "sw-u24-actors"
title = "Actors, Sendable and data-race safety"
level = "advanced"
difficulty = 24
intro = '''
A data race happens when two threads touch the same memory at the same time and at least one of
them writes. Swift 6 turns data races into compile errors, using two tools: **actors**, which
protect mutable state by letting one task in at a time, and **`Sendable`**, which marks values
that are safe to share. You will build actors, send values between tasks, survive actor
reentrancy, and finish with a cache that loads each key only once under concurrent requests.
'''
concepts = '''
## The idea

A counter incremented by a thousand concurrent tasks should end at 1,000. Without protection it
often does not: `count += 1` is a read, an add and a write, and two tasks can read the same old
value and both write back the same new one. That is a **data race**, and its symptoms (lost
updates, corrupted dictionaries, crashes) appear randomly and rarely in tests.

Classic code protects shared state with locks, and forgetting a lock is easy. Swift's answer is
to make the compiler check the rules.

## Actors

An **actor** is a reference type, like a class, whose mutable state is **isolated**: only code
running *on* the actor can touch it, and the actor runs one piece of code at a time.

```swift
actor Scoreboard {
    private var points: [String: Int] = [:]
    func add(_ n: Int, to team: String) { points[team, default: 0] += n }
    func score(of team: String) -> Int { points[team, default: 0] }
}
let board = Scoreboard()
await board.add(3, to: "red")
```

From outside, every call to an actor method is **asynchronous** and needs `await`: your task may
have to wait its turn. Inside the actor, methods call each other synchronously. A `let` holding a
`Sendable` value can be marked `nonisolated` and read without `await`.

## Sendable

Values that cross from one task or actor to another must be **`Sendable`**: safe to use from
several places at once. Structs and enums whose stored properties are all `Sendable` conform
automatically (`Int`, `String`, arrays of them...). Actors are always `Sendable`. A class is
`Sendable` only if it is `final` and has nothing but immutable `let` properties of `Sendable`
types. Closures that run concurrently must be `@Sendable`, which means they capture only
`Sendable` values and do not capture mutable variables.

## Reentrancy

An actor runs one thing at a time, but **every `await` inside an actor method is a point where
other calls can run**. State you checked before an `await` may have changed after it. Keep each
check-and-update in a single synchronous stretch, or check again after resuming. When many callers
ask for the same slow result, remember the in-flight `Task` so latecomers await the same work.

## Compiler errors you will meet

- **"actor-isolated property 'x' can not be referenced from a nonisolated context"** or **"... is
  not marked with 'await'"**: you touched actor state from outside; add `await` or move the code
  into the actor.
- **"main actor-isolated var 'x' is mutable from nonisolated context"** / **"var 'x' is not
  concurrency-safe because it is nonisolated global shared mutable state"**: global `var`s are
  forbidden in Swift 6; use a `let`, or put the state in an actor.
- **"capture of 'x' with non-Sendable type"** or **"stored property of 'Sendable'-conforming class
  is mutable"**: make the type a struct, make its properties `let`, or make it an actor.

## What you'll practise

You will protect a counter with an actor, move `Sendable` values into an actor that enforces an
invariant, handle reentrancy across an `await`, and in the challenge build a deduplicating cache.
'''

[[unit.step]]
kind = "concept"
id = "sw-u24-c1-isolation"
title = "Isolation domains"
points = 5
difficulty = 24
intro = '''
Swift 6 divides a program into isolation domains: each actor is one, the main actor is one, and
code that belongs to no actor is nonisolated. Mutable state lives inside exactly one domain, and
only `Sendable` values may cross between them, so the compiler can prove there are no data races.
'''
body = '''
## One door per actor

Think of an actor as a room with a single door and a queue outside. Each call is a visitor; only
one visitor is in the room at a time, so code inside can read and write the actor's properties
without any locks. Callers outside write `await` because they may have to queue:

```swift
actor Tally {
    private var total = 0
    func add(_ n: Int) { total += n }
    func value() -> Int { total }
}
let tally = Tally()
await tally.add(5)
```

The `private var total` is reachable only through those methods, so there is no way to race on it.

## What may cross the door

A value that passes from one domain to another, as an argument, a return value or a capture of a
concurrent closure, must be **`Sendable`**:

- value types made of `Sendable` parts (`Int`, `String`, `[Double]`, your own structs and enums);
- actors, because they protect themselves;
- `final` classes with only `let` properties of `Sendable` types;
- `@Sendable` closures, which capture only `Sendable` values.

A mutable class instance shared by two tasks could be changed by both at once, so the compiler
refuses to let it cross.

## The main actor

`@MainActor` is a global actor tied to the main thread, used for UI state. Top-level code in
`main.swift` runs on the main actor, which is why a global `var` there is fine, but a global
`var` in another file is an error in Swift 6.

## Reentrancy in one sentence

While an actor method is suspended at an `await`, the door is open for other callers, so never
assume state is unchanged across an `await`.
'''

