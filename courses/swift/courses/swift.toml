[[unit.step]]
kind = "challenge"
id = "sw-u12-x1-stack-machine"
title = "A stack machine driven by enum cases"
points = 30
difficulty = 12
entry = "execute"
intro = '''
A stack machine is the simplest model of how many interpreters and virtual machines run code:
each instruction pops its operands from a stack and pushes its result. The instruction set is
a natural enum, some cases carry a value (`push(5)`) and most do not, and an exhaustive `switch`
is the interpreter loop.
'''
instructions = '''
## Your turn

The starter declares the instruction set (don't change it):

```swift
enum Instruction: Equatable {
    case push(Int)
    case add, subtract, multiply
    case negate, duplicate, swap, pop
}
```

Implement:

```swift
func execute(_ program: [Instruction]) -> [Int]?
```

Run the instructions in order on a stack that starts **empty**, and return the final stack as
an array, **bottom first** (the top of the stack is the last element).

- `push(v)` pushes `v`.
- `add`, `subtract` and `multiply` pop the top value `b`, then the value below it `a`, and push
  `a + b`, `a - b` or `a * b`. Note the order for `subtract`: `[push(10), push(3), subtract]`
  leaves `[7]`.
- `negate` replaces the top value `v` with `-v`.
- `duplicate` pushes a copy of the top value.
- `swap` exchanges the top two values.
- `pop` removes the top value.
- If an instruction needs more values than the stack holds (two for `add`, `subtract`,
  `multiply` and `swap`; one for the others), stop and return `nil`, even if earlier
  instructions succeeded.

Write the `switch` over `Instruction` with every case listed and no `default` branch. Programs
in the tests can have about 200,000 instructions, so run them in a single pass.

Examples:

- `execute([])` is `[]`.
- `execute([.push(2), .push(3), .add, .push(4), .multiply])` is `[20]`.
- `execute([.push(1), .push(2), .swap])` is `[2, 1]`.
- `execute([.push(1), .add])` is `nil`.

**Hint:** `popLast()` returns an optional, which is `nil` on an empty array, and a small helper
that takes the stack as `inout` and an operator such as `+` as a function keeps the three
arithmetic cases to one line each.

Hidden tests decide correctness.
'''
