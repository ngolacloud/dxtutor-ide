[[unit.step]]
kind = "drill"
id = "sw-u34-d3-grid-table"
title = "A bottom-up table: paths through a grid"
points = 10
difficulty = 34
placeholder_policy = "on_demand"
run_command = "swiftc main.swift -o main && ./main"
intro = '''
Counting monotone paths through a grid has a simple recurrence: the paths into a cell are the
paths into the cell above plus the paths into the cell to its left. Filling a table row by row
evaluates that recurrence bottom-up, with no recursion and each cell computed exactly once.
'''
prompt = '''
Count the paths from the top-left to the bottom-right corner of a grid, moving only right or
down and avoiding `#` walls, for an open grid and for one with a wall.

**Why:** bottom-up tabulation is dynamic programming in its plainest form: define the cell,
write the recurrence, and fill the table in an order where every input is already known.
'''
target = '''
func countPaths(_ grid: [[Character]]) -> Int {
    let rows = grid.count, cols = grid[0].count
    var table = Array(repeating: Array(repeating: 0, count: cols), count: rows)
    for r in 0..<rows {
        for c in 0..<cols {
            if grid[r][c] == "#" { continue }
            if r == 0 && c == 0 {
                table[r][c] = 1
                continue
            }
            let fromAbove = r > 0 ? table[r - 1][c] : 0
            let fromLeft = c > 0 ? table[r][c - 1] : 0
            table[r][c] = fromAbove + fromLeft
        }
    }
    return table[rows - 1][cols - 1]
}

let open = ["....", "....", "...."].map { Array($0) }
let walled = ["....", ".#..", "...."].map { Array($0) }
print(countPaths(open), countPaths(walled))
'''
