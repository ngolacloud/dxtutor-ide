read an order as `order.item` and `order.quantity`, and return a tuple such as
`(left, rejected)`.

**Hint:** start with a `var` dictionary holding only the positive entries of `stock`
(`for (item, count) in stock where count > 0`), then loop over the orders. One `guard` with
several conditions, including `let available = left[order.item]`, expresses every rejection
rule at once.

Hidden tests decide correctness.
'''
