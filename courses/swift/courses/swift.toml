            if let a = Version("1.2"), let b = Version("1.2.1"), let c = Version("1.2.0") {
                self.expect(a < b, "1.2 < 1.2.1")
                self.expect(!(b < a), "not 1.2.1 < 1.2")
                self.expect(!(a < c) && !(c < a), "1.2 and 1.2.0 are equal, neither is smaller")
