- `"host = example.org\nport=8080"` gives `ServerConfig(host: "example.org", port: 8080, debug: false)`.
- `"# hi\n\nhost example.org"` throws `malformedLine(3)`.
- `"host=a\nport=0"` throws `invalidPort("0")`.
- `loadConfig("port=80")` is `.failure(.missingKey("host"))`.

**Hint:** `text.split(omittingEmptySubsequences: false, whereSeparator: \.isNewline)` keeps
blank lines so the numbering stays right, `firstIndex(of: "=")` finds the split point, and
`trimmingCharacters(in: .whitespaces)` (from Foundation) trims. In `loadConfig`, a `do`/`catch`
around the call receives a `ConfigError` directly.

Hidden tests decide correctness.
