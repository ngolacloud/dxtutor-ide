        test("trailing zeros do not matter for equality") {
            self.equal(Version("1.2"), Version("1.2.0"))
            self.equal(Version("1.2.0.0"), Version("1.2"))
            self.equal(Version("0"), Version("0.0.0"))
            self.expect(Version("1.2") != Version("1.2.1"))
            self.expect(Version("1.0.1") != Version("1.1"))
