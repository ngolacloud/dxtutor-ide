target = '''
enum TempError: Error, Equatable {
    case notANumber(String)
    case belowAbsoluteZero(Double)
}

func parseCelsius(_ text: String) throws(TempError) -> Double {
    guard let value = Double(text) else {
        throw .notANumber(text)
    }
    if value < -273.15 {
        throw .belowAbsoluteZero(value)
    }
    return value
}

func celsius(_ text: String) -> Result<Double, TempError> {
    do {
        return .success(try parseCelsius(text))
    } catch {
        return .failure(error)
    }
}

for text in ["21.5", "warm", "-500"] {
    switch celsius(text) {
    case .success(let value):
        print("ok", value * 9 / 5 + 32)
    case .failure(.notANumber(let raw)):
        print("not a number:", raw)
    case .failure(.belowAbsoluteZero(let value)):
        print("impossible:", value)
    }
}

print(celsius("100").map { $0 * 9 / 5 + 32 })
print(celsius("-300") == .failure(.belowAbsoluteZero(-300)))
