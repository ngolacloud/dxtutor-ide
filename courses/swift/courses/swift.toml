id = "swift-basics"
language = "swift"
title = "Swift: From Zero to Confident"
level = "beginner"
summary = "A serious, guided course in Swift 6 that takes you from your very first program to the ideas behind safe, fast apps: optionals, value types, protocols, error handling and data-race-free concurrency with async/await and actors. You read a short concept, build muscle memory by typing small, complete programs, then prove what you learned by writing real functions that hidden tests check."
overview = '''
## What Swift is

Swift is a compiled, statically typed language that Apple introduced in 2014 and made open
source in 2015. It compiles to fast native code, yet reads almost like a scripting language
thanks to type inference and clean syntax. This course teaches **Swift 6**, in the Swift 6
language mode, where the compiler also checks your concurrent code for data races.

## Where it is used

Swift is the main language for apps on Apple's platforms: iOS, iPadOS, macOS, watchOS, tvOS
and visionOS. It also runs on Linux and Windows, and is used for servers (for example with
the Vapor framework) and command-line tools.

## The mental model: safe by default

In Swift the easy way is also the safe way. A value that may be missing is an **optional**,
and the compiler makes you handle the missing case. Structs, enums and the standard
collections are **value types**, so a copy never changes behind your back. A `switch` over
an enum must be **exhaustive**. A function that can fail says so with `throws`, and the
caller must deal with the error. In Swift 6 the compiler also rejects code in which two
tasks could touch the same mutable data at the same time.

## How the course is organised

- **Basic:** your first programs, constants and types, strings and Unicode, decisions,
  loops and functions.
- **Intermediate:** optionals, collections and their operations, structs, classes, enums,
  protocols, closures and error handling, then a production Swift block: generics,
  `Codable` and JSON, dates, text parsing with regular expressions, `Equatable` and
  `Hashable`, and value semantics with copy-on-write.
- **Advanced:** `async`/`await`, task groups, actors and `Sendable`, async sequences, result
  builders, memory management with ARC, and data structures and algorithms built by hand:
  stacks and queues, linked lists, hash maps, binary search trees, sorting, recursion and
  dynamic programming.

Everything runs on Linux with the Swift standard library and Foundation, so there are no
UIKit or SwiftUI screens: the course is about the language itself.

## How the steps work

Each unit opens with a reading text. A **concept** step explains one idea. A **drill** asks
you to type a short, commented program, which the tutor then compiles and runs. A
**challenge** asks you to write a function or type on your own: hidden tests check it, and
once they pass you can compare your code with a reference solution and its complexity
analysis.
'''

# ── g1-basic ────────────────────────────────────────────────────────────

[[unit]]
id = "sw-u01-hello"
title = "Hello & print"
level = "basic"
difficulty = 1
intro = '''
Your very first steps in Swift: what a program is, how the Swift compiler turns your source
file into a program the computer can run, and how `print` shows text on the screen. By the
end you will write a tiny greeting function and let the hidden tests check it.
'''
concepts = '''
## The idea

A computer does not understand English; it follows instructions, one after another. A
**programming language** is a precise notation that people can read and that a tool can
turn into actions the machine carries out. Swift is a **compiled** language: a program
called the **compiler** (`swiftc`) reads your whole source file, checks it, and translates
it into an **executable**, a file of machine instructions that the computer runs directly.

So running Swift code takes two separate steps. First you compile, then you run what the
compiler produced:

```sh
swiftc main.swift -o main    # compile: main.swift becomes the executable "main"
./main                       # run it
```

Because the compiler reads everything before anything runs, it catches many mistakes
early. A **compile-time error** means no program was produced at all. A **run-time error**
(a crash) happens later, while the program is running.

## How Swift does it

A file named `main.swift` may contain **top-level code**: statements written at the left
margin, which run from the first line to the last. You don't need a special `main`
function; the file itself is the program.

```swift
// A comment: the compiler skips it.
print("first line")
print("the answer is", 42)
print()
```

`print` writes its arguments to **standard output** (the text the terminal shows) and then
ends the line. Several arguments are joined with a space, and `print()` alone prints an
empty line. Two optional, **labelled** arguments change that: `separator:` goes between
the arguments and `terminator:` goes after the last one (a newline, `"\n"`, by default).

```swift
print("a", "b", "c", separator: "-")   // a-b-c
print("no newline", terminator: "")
print(" ...continued")
```

Comments start with `//` and run to the end of the line, or sit between `/*` and `*/` and
may span several lines.

## What is special or tricky

- **Case matters.** It is `print`, never `Print`; the second spelling fails with
  `error: cannot find 'Print' in scope`.
- **Strings use double quotes.** `'hi'` is rejected with
  `single-quoted string literal found, use '"'`, and `"hi` with
  `unterminated string literal`.
- **Types don't mix silently.** `"age " + 42` fails with `binary operator '+' cannot be
  applied to operands of type 'String' and 'Int'`. Unit 2 shows how to convert.
- **One error stops everything.** If any line fails to compile, no executable is made and
  not even the first `print` runs.
- **`print` shows a value; it does not hand one back.** A function that produces a result
  for other code uses `return`, which you meet in the challenge.
- **Top-level code lives only in `main.swift`.** Every other file may hold only
  declarations, such as functions. That is why, in challenges, you write a function and
  nothing else.

## What you will practise

You will type a first program with comments, shape output with `separator:` and
`terminator:`, and print the results of small calculations. Then you will write your first
function, one that builds a greeting from a name it receives.
'''

[[unit.step]]
kind = "concept"
id = "sw-u01-c1-programs"
title = "What a Swift program is"
points = 5
difficulty = 1
intro = '''
Before you write anything, picture what happens to your code. The compiler reads the whole
file, checks it, and produces an executable; only then does the program run, executing the
top-level statements of `main.swift` from top to bottom. Anything you `print` travels to
**standard output**, which the terminal shows on screen.
'''
body = '''
## Compile first, then run

A Swift program starts life as a plain text file, here named `main.swift`. The command
`swiftc main.swift -o main` asks the **compiler** to read it, check every line, and write an
executable called `main`. The command `./main` then runs that executable. If the compiler
finds a mistake, it prints an error with the file, line and column, and produces nothing to
run.

```swift
// This line is a comment: the compiler skips it.
print("Hello, Swift!")
print("Swift can count:", 2 + 3)
```

Things to notice:

- **`print(...)`** is a function from Swift's standard library. It writes its arguments to
  standard output and finishes the line.
- **`"Hello, Swift!"`** is a **string**, a piece of text between double quotes.
- **`2 + 3`** is an **expression**. Its value, `5`, is worked out before `print` receives
  it, so the second line shows `Swift can count: 5`.
- **No semicolons** are needed at the end of a line, and no `main` function: in
  `main.swift` the statements themselves are the program.

## What the tutor does

In each drill you type a small, complete program. When your code matches the target, the
tutor saves it as `main.swift`, compiles it with `swiftc` and runs it, so you see exactly
what it prints. In each challenge you write a function instead; your file is compiled
together with hidden tests that call the function with many inputs and check what it
returns.
'''

