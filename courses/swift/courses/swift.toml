target = '''
struct ChainedMap {
    private var buckets: [[(key: String, value: Int)]] = Array(repeating: [], count: 4)

    private func index(for key: String) -> Int {
        Int(UInt(bitPattern: key.hashValue) % UInt(buckets.count))
    }

    mutating func set(_ key: String, _ value: Int) {
        let i = index(for: key)
        if let j = buckets[i].firstIndex(where: { $0.key == key }) {
            buckets[i][j].value = value
        } else {
            buckets[i].append((key: key, value: value))
        }
    }

    func get(_ key: String) -> Int? {
        buckets[index(for: key)].first(where: { $0.key == key })?.value
    }
}

var stock = ChainedMap()
stock.set("apple", 3)
stock.set("pear", 5)
stock.set("apple", 7)
print(stock.get("apple") ?? 0, stock.get("pear") ?? 0, stock.get("plum") == nil)
