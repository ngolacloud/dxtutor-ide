}

/// A lazy run-length encoding of any sequence: [a, a, b, a] yields
/// Run(a, 2), Run(b, 1), Run(a, 1). It pulls from the base only on demand.
struct RunLengths<Base: Sequence>: Sequence where Base.Element: Equatable {
    let base: Base

    init(_ base: Base) {
        self.base = base
    }

    func makeIterator() -> Iterator {
        Iterator(source: base.makeIterator())
    }

    struct Iterator: IteratorProtocol {
        var source: Base.Iterator
        /// The first element of the next run, already read from the base.
        var pending: Base.Element?
        var started = false

        init(source: Base.Iterator) {
            self.source = source
        }

        mutating func next() -> Run<Base.Element>? {
            if !started {
                started = true
                pending = source.next()
            }
            guard let value = pending else { return nil }
            var count = 1
            while true {
                guard let following = source.next() else {
                    pending = nil
                    break
                }
                if following == value {
                    count += 1
                } else {
                    pending = following
                    break
                }
            }
            return Run(value: value, count: count)
        }
    }
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
Each element of the base is pulled from the base's iterator exactly once, either as the
pending first element of a run or inside the inner loop that extends a run, and each pull
does O(1) work (one `==` and one increment). Encoding a base of *n* elements therefore costs
**O(n)** time in total, no matter how the elements group into runs.

The iterator stores only the base's iterator, one pending element, a `started` flag and,
during a call, a counter, so the extra space is **O(1)**: no runs or elements are
buffered. That is what makes the encoder usable on a million-element lazy range or on an
infinite sequence with `prefix`.

The `started` flag is there because "nothing pending" has two meanings: before the first call
nothing has been read yet, and after the end there is nothing left. Reading the first element
inside `next()`, not in `makeIterator()`, keeps the adaptor fully lazy. A tempting shortcut,
`Array(base)` followed by a loop, gives the right runs on finite input but costs O(n) memory,
reads the whole base before returning the first run, and never terminates on an infinite base.
'''

[[unit]]
id = "sw-u29-stacks-queues"
title = "Stacks and queues by hand"
level = "advanced"
difficulty = 29
intro = '''
Stacks (last in, first out) and queues (first in, first out) are the two workhorse
containers behind undo histories, parsers, schedulers and breadth-first search. You will
build both on top of `Array`, see why `removeFirst()` makes a naive queue quadratic, and fix
it twice: with a moving head index and with a ring buffer. The challenge is a growable ring
buffer queue fast enough for hundreds of thousands of operations.
'''
concepts = '''
## The idea

A **stack** hands values back in the reverse order they arrived: the last value pushed is the
first popped (**LIFO**). Think of a pile of plates, the call stack, an undo history, or
matching brackets. A **queue** hands them back in arrival order (**FIFO**): a checkout line, a
print spooler, a task scheduler, the frontier of a breadth-first search. Both are tiny
interfaces (add, remove, peek, count), and the interesting part is making every operation
O(1).

## How Swift does it

Swift's standard library has no `Stack` or `Queue` type, but `Array` makes a perfect stack,
because adding and removing at the **end** is amortized O(1):

```swift
var stack: [Int] = []
stack.append(1)            // push
stack.append(2)
let top = stack.last       // peek: Optional(2)
let popped = stack.popLast()   // pop: Optional(2), nil when empty
```

A queue removes from the **front**, and that is where arrays are slow. `removeFirst()` shifts
every remaining element one slot left, so it is O(n), and draining a queue of *n* elements
costs O(n²). Two classic fixes keep the array but stop shifting:

- **A head index.** Leave dequeued slots in place and remember where the front is. Now and
  then, when more than half the array is dead space, drop the dead prefix in one go. Each
  element is moved at most a constant number of times, so dequeue is amortized O(1).
- **A ring buffer.** Treat a fixed-size array as a circle. Keep the index of the front and
  the number of elements; the back is at `(head + count) % capacity`. Both ends move forward
  and wrap around with `%`, so nothing is ever shifted. When the ring is full, allocate a
  bigger array (double the size) and copy the elements in order.

Wrap these in a generic `struct` with `mutating` methods and you get value semantics for
free: copying a queue copies its contents (lazily, thanks to the array's copy-on-write).

## Pitfalls and compiler errors

- `removeFirst()` and `removeLast()` on an empty array trap with
  `Can't remove first element from an empty collection`. Use `popLast()` or check `isEmpty`
  first, and return an optional from your own `pop` and `dequeue`.
- Forgetting `mutating` on a method that changes a stored property fails with
  `cannot use mutating member on immutable value` or `cannot assign to property: 'self' is
  immutable`.
- In a ring buffer, `% capacity` with a capacity of 0 traps with a division by zero. Grow
  before the first insert.
- A ring of `[Element?]` must set dequeued slots back to `nil`, or it keeps objects alive
  that the queue no longer contains.
- Off-by-one errors live at the wrap-around point, so test sequences of operations that wrap.

## What you will practise

You will check balanced brackets with a generic stack, build a queue with a head index, and
keep the last N readings in a fixed-size ring buffer. The challenge is a growable ring-buffer
queue checked against more than 600,000 operations.
'''

[[unit.step]]
kind = "concept"
id = "sw-u29-c1-lifo-fifo"
title = "LIFO, FIFO and the cost of the front"
points = 5
difficulty = 29
intro = '''
The only difference between a stack and a queue is which end values leave from, but on an
array that difference decides between O(1) and O(n) per operation. The fix is to stop moving
the data and move an index instead.
'''
body = '''
## Two disciplines

Push 1, 2, 3 and take three values back out:

- a **stack** returns 3, 2, 1 (last in, first out);
- a **queue** returns 1, 2, 3 (first in, first out).

## Why the end of an array is cheap

An array stores its elements contiguously and keeps spare capacity at the end. `append` and
`popLast` touch only the last slot, so they are O(1) (amortized for `append`, which sometimes
reallocates and copies). That makes `Array` an ideal stack.

## Why the front is expensive

`removeFirst()` must keep the elements contiguous starting at index 0, so it moves every
remaining element one slot to the left. Removing *n* elements one by one moves
n-1 + n-2 + ... + 1 elements, which is O(n²). For 100,000 elements that is about five
billion moves.

## Moving an index instead

```swift
var items = [10, 20, 30]
var head = 0
let front = items[head]   // 10
head += 1                 // "dequeue" without moving anything
```

The live elements are `items[head...]`. A **ring buffer** goes further: it reuses the dead
slots at the start by wrapping the back index around with `%`:

```swift
let back = (head + count) % capacity
```

Both ends now move forward forever on a circle, every operation is O(1), and memory is
reallocated only when the ring is completely full. Doubling the capacity at that moment keeps
the average cost of an enqueue O(1).
'''

