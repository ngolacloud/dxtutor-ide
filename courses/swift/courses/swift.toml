            self.equal(topFrequent([1, 2, 2], 0), [])
            self.equal(topFrequent([1, 2, 2], -4), [])
        }
        test("k larger than the number of distinct items") {
            self.equal(topFrequent([4, 4, -1, 4, -1, 0], 10), [4, -1, 0])
            self.equal(topFrequent(["solo"], 5), ["solo"])
        }
        test("a custom Hashable struct") {
            struct Tag: Hashable { let name: String }
            let tags = [Tag(name: "swift"), Tag(name: "go"), Tag(name: "go"), Tag(name: "rust"), Tag(name: "swift"), Tag(name: "go")]
            self.equal(topFrequent(tags, 2), [Tag(name: "go"), Tag(name: "swift")])
        }
        test("100,000 items") {
            let items = (0..<100_000).map { $0 % 997 }
            self.equal(topFrequent(items, 3), [0, 1, 2])
            let ranked = topFrequent(items, 1_000)
            self.equal(ranked.count, 997)
            self.equal(ranked[299], 299)
            self.equal(ranked[300], 300)
            self.equal(ranked.last, 996)
