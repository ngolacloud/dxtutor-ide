/// Averages every reading that holds a finite number, ignoring the rest.
/// Skip nil entries, trim surrounding whitespace, skip text that is not a
/// number and skip non-finite values (inf, nan). Return nil when nothing is usable.
func averageReading(_ readings: [String?]) -> Double? {
    fatalError("not implemented")
}
'''
tests = '''
test("averages clean readings") {
    if let avg = averageReading(["1", "2", "3", "6"]) {
        self.near(avg, 3.0)
    } else {
        self.expect(false, "expected 3.0, got nil")
    }
}
test("one reading is its own average") {
    self.equal(averageReading(["42.5"]), 42.5)
}
test("empty input gives nil") {
    self.equal(averageReading([]), nil)
}
test("skips nil entries and text that is not a number") {
    self.equal(averageReading([nil, "4", "abc", nil, "6", "", "7 kg"]), 5.0)
}
test("nothing usable gives nil, not zero") {
    self.equal(averageReading([nil, nil]), nil)
    self.equal(averageReading(["", "   ", "n/a"]), nil)
}
test("trims spaces, tabs and newlines") {
    if let avg = averageReading([" 2.5 ", "\t3.5", "4.5\n"]) {
        self.near(avg, 3.5)
    } else {
        self.expect(false, "expected 3.5, got nil")
    }
}
test("negative and fractional readings count") {
    self.equal(averageReading(["-1", "-3", "-0.5", "0.5"]), -1.0)
}
test("skips infinity and NaN") {
    self.equal(averageReading(["inf", "nan", "10", "-infinity"]), 10.0)
    self.equal(averageReading(["inf"]), nil)
}
test("a large input stays fast and exact") {
    var readings: [String?] = []
    for i in 0..<200_000 {
        readings.append(i % 3 == 0 ? nil : String(i % 10))
    }
    var sum = 0.0
    var count = 0.0
    for case let r? in readings {
        sum += Double(r)!
        count += 1
    }
    if let avg = averageReading(readings) {
        self.near(avg, sum / count, 1e-9)
    } else {
        self.expect(false, "expected a value, got nil")
    }
}
'''

[unit.step.gabarito]
solution = '''
import Foundation

/// Averages every reading that holds a finite number, ignoring the rest.
/// Returns nil when no reading is usable.
func averageReading(_ readings: [String?]) -> Double? {
    var sum = 0.0
    var count = 0
    for entry in readings {
        guard let raw = entry else { continue }
        let text = raw.trimmingCharacters(in: .whitespacesAndNewlines)
        guard let value = Double(text), value.isFinite else { continue }
        sum += value
        count += 1
    }
    guard count > 0 else { return nil }
    return sum / Double(count)
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
Let `n` be the number of readings. The function makes a single pass. For each entry it checks
for `nil`, trims the text, parses it and updates two numbers. Trimming and parsing are linear
in the length of the reading, and sensor readings have bounded length, so each entry costs
O(1) and the whole loop is **O(n)** time. (Measured in characters, it is linear in the total
size of the input.)

Only the running sum, the count and one trimmed string at a time are kept, so the extra space
is **O(1)**. Collecting the parsed values in an array first, for example with `compactMap`
(unit 9), would read just as well but cost O(n) extra space.

Two decisions carry the correctness. Returning `Double?` matters because the average of nothing
is not 0: a caller who receives `0.0` cannot tell "the sensor read zero" from "the sensor read
nothing", while `nil` forces them to decide. Checking `isFinite` matters because a single
`inf` would make the whole sum infinite and a single `nan` would make it NaN.
'''

[[unit]]
id = "sw-u08-collections"
title = "Collections: Array, Dictionary and Set"
level = "intermediate"
difficulty = 8
intro = '''
Almost every program keeps groups of values. Swift's three workhorse collections are `Array`
(ordered and indexed), `Dictionary` (keys to values) and `Set` (unique members), and all three
are value types: assigning one copies it. You will practise each one's everyday operations,
learn which of them hand back optionals, and finish by applying a batch of orders to an
inventory.
'''
concepts = '''
## The idea

A **collection** stores many values under one name. The one you pick decides what is cheap:

- An **array** keeps elements in order, packed in one block of memory. Reading `a[i]` is O(1)
  and appending is amortised O(1), but finding a value means scanning, which is O(n).
- A **dictionary** is a hash table from keys to values. Looking up, inserting or removing by
  key is O(1) on average, but there is no meaningful order.
- A **set** is a hash table of keys only. It answers "have I seen this?" in O(1) on average and
  never stores duplicates.

Dictionary keys and set members must be `Hashable`. `String`, `Int`, `Double`, `Bool` and
`Character` all are; unit 20 shows how to make your own types hashable.

## How Swift does it

```swift
var langs: [String] = ["swift", "go"]     // Array<String>
var ages: [String: Int] = ["ada": 36]     // Dictionary<String, Int>
var tags: Set<String> = ["new", "sale"]   // a Set must be named explicitly
langs.append("rust")
ages["alan"] = 41                         // insert or replace
tags.insert("new")                        // already present: no change
```

The collections are **generic**: an `[Int]` holds only `Int`s, and the compiler checks every
insertion. Empty literals need a type, as in `var names: [String] = []` or `[String: Int]()`.

Several operations answer with an **optional**, because the answer may not exist: `first`,
`last`, `min()`, `max()`, `firstIndex(of:)` and, above all, the dictionary subscript:
`ages["bob"]` is an `Int?`. The array subscript `a[i]` is *not* optional. An index out of range
**traps**.

## Value semantics

`Array`, `Dictionary` and `Set` are structs. After `var b = a`, `b` is a logically separate
copy, and changing one never changes the other. Swift keeps this cheap with
**copy-on-write**: the two share storage until one of them is modified, and only then is the
storage copied. A `let` collection is completely immutable.

## Pitfalls and compiler errors

- **`Fatal error: Index out of range`** is a trap, not an exception you can catch. Check
  `a.indices.contains(i)`, or use `first` and `last` when the array may be empty.
- **Dictionary and set order is not stable.** Swift seeds its hashing randomly for each
  process, so iteration order can change between runs. Sort the keys whenever order matters,
  including when printing.
- **"Cannot use mutating member on immutable value"** means you called `append` or `insert`
  on a `let`.
- **"Empty collection literal requires an explicit type"** appears for `let x = []`.
- `ages["ada"] = nil` *removes* the key rather than storing nil.
- `counts[key, default: 0] += 1` counts in one line, with no unwrapping.

## What you will practise

You will add, insert and remove array elements safely, count with dictionaries and their
`default:` subscript, combine sets and watch value semantics keep copies apart, and finally
apply a sequence of orders to a stock dictionary, rejecting the ones that cannot be filled.
'''

[[unit.step]]
kind = "concept"
id = "sw-u08-c1-three-collections"
title = "Choosing a collection"
points = 5
difficulty = 8
intro = '''
Arrays, dictionaries and sets can hold the same values with very different trade-offs. An
array is a contiguous block indexed by position; dictionaries and sets are hash tables that
find an element from its hash in constant expected time, at the price of giving up order.
'''
body = '''
## Three shapes for a group of values

```swift
let queue = ["ana", "ben", "cy"]           // order matters, duplicates allowed
let phone = ["ana": "555-0101"]            // look up by key
let visited: Set = ["Lisbon", "Luanda"]    // membership, no duplicates
```

Ask what you will do most often:

| You need to... | Use | Cost |
|---|---|---|
| keep order, access by position | `Array` | `a[i]` is O(1) |
| find a value from its key | `Dictionary` | `d[k]` is O(1) on average |
| test membership, drop duplicates | `Set` | `s.contains(x)` is O(1) on average |

`array.contains(x)` works too, but it compares elements one by one, which is O(n). Inside a
loop over n items that becomes O(n²), while a set keeps the whole job at O(n).

## Answers that may not exist

A dictionary lookup returns an optional, because the key may be missing:

```swift
let number = phone["bob"]            // String?, here nil
let shown = phone["bob"] ?? "unknown"
```

The array subscript does not: `queue[10]` traps at run time. Prefer `queue.first`,
`queue.last` or an index check when you are not sure.

## Copies, not shares

All three collections are value types. Assigning one to another variable, or passing it to a
function, gives the receiver its own copy, so nobody can change your data behind your back.
Swift delays the real copy until someone writes (**copy-on-write**), so passing collections
around stays cheap.
'''

