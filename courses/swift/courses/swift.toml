prompt = '''
Write a generic `LinkedList<T>` class that keeps `head`, `tail` and `count`, append three
words, and print the list, its count and its last value.

**Why:** a little extra bookkeeping turns two O(n) operations into O(1) ones, and one
`makeIterator()` method buys you every `Sequence` algorithm for free.
