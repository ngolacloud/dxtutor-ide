'''
[unit.step.gabarito]
solution = '''
/// Returns the k most frequent distinct items, most frequent first.
/// Ties are broken by first appearance in `items`. Returns [] when k <= 0.
func topFrequent<T: Hashable>(_ items: [T], _ k: Int) -> [T] {
    guard k > 0 else { return [] }
    var counts: [T: Int] = [:]
    var firstSeen: [T] = []
    for item in items {
        if counts[item] == nil { firstSeen.append(item) }
        counts[item, default: 0] += 1
    }
    let ranked = firstSeen.indices.sorted { i, j in
        let ci = counts[firstSeen[i], default: 0]
        let cj = counts[firstSeen[j], default: 0]
        return ci != cj ? ci > cj : i < j
    }
    return ranked.prefix(k).map { firstSeen[$0] }
}
'''
time = "O(n + d log d)"
space = "O(d)"
justification = '''
One pass over the `n` items does an O(1) average dictionary update per item, so counting is
**O(n)**. Sorting the `d` distinct items costs **O(d log d)**, and taking the first `k` is
O(k) ≤ O(d). In total **O(n + d log d)**, which is O(n log n) in the worst case where every
item is distinct and O(n) when only a few values repeat many times.

The dictionary and the `firstSeen` array each hold one entry per distinct item, so the extra
space is **O(d)**.

The tie-break is what makes the output deterministic: the comparator orders by count and,
on equal counts, by the index in `firstSeen`, which is the order of first appearance. That
gives a strict total order, so the result is the same on every run, even though iterating
`counts.keys` directly would not be (Swift seeds its hashing randomly per process). Sorting
indices rather than items keeps the comparator to two O(1) dictionary lookups.
'''

[[unit]]
id = "sw-u17-codable"
title = "Codable: JSON in and out"
level = "intermediate"
difficulty = 17
intro = '''
Almost every real program reads or writes JSON: API responses, configuration files, saved
state. Swift's `Codable` lets the compiler write the conversion code for your types, so you
describe the data once as plain structs and enums. You will encode and decode values, rename
keys with `CodingKeys`, decode nested payloads, and turn decoding errors into useful messages.
'''
concepts = '''
## The idea

JSON is text; your program works with typed values. Converting between them by hand means
walking dictionaries of `Any`, casting every field and hoping the keys are spelled right.
**Serialization** is that conversion done systematically: *encoding* turns a value into
bytes, *decoding* turns bytes back into a value and rejects anything that doesn't fit.

## How Swift does it

`Codable` is a type alias for two protocols, `Encodable & Decodable`. When every stored
property of a struct is itself `Codable` (`String`, `Int`, `Double`, `Bool`, arrays,
dictionaries, optionals, other `Codable` types), the compiler **synthesizes** both
conformances for you:

```swift
import Foundation

struct Point: Codable {
    let x: Int
    let y: Int
}

let data = try JSONEncoder().encode(Point(x: 1, y: 2))
let back = try JSONDecoder().decode(Point.self, from: data)
```

Encoders work with `Data` (bytes). Use `String(decoding: data, as: UTF8.self)` to see the
text and `Data(text.utf8)` to go the other way. Both calls can fail, so they need `try`.

Field names come from property names. When the JSON uses other names, such as snake_case,
declare a nested `enum CodingKeys: String, CodingKey` that maps each property to its key.
Optional properties may be missing or `null` in the input, and a `nil` optional is left out
of the output. An enum with `String` raw values encodes as its raw value, and decoding
fails for any other string, which is free validation.

## Deterministic output

A JSON object is unordered, and so is a Swift `Dictionary`: its iteration order is seeded
randomly **per process**, so the same program can print keys in a different order on every
run. Whenever output is compared, logged or hashed, set

```swift
let encoder = JSONEncoder()
encoder.outputFormatting = [.sortedKeys]
```

Add `.prettyPrinted` for humans, and `.withoutEscapingSlashes` if you don't want `/` written
as `\/`.

## Pitfalls and compiler errors

- *"type 'Brand' does not conform to protocol 'Decodable'"*: one stored property has a type
  that isn't `Codable`. Make that type `Codable` too, or exclude the property from
  `CodingKeys` and give it a default value.
- *"call can throw but is not marked with 'try'"*: `encode` and `decode` throw.
- Key mismatches are **not** compile errors. A misspelt `CodingKeys` entry compiles and then
  throws `DecodingError.keyNotFound` at run time, so test your decoders with real payloads.
- `DecodingError` has four cases worth knowing: `keyNotFound`, `typeMismatch` (a string
  where a number was expected), `valueNotFound` (`null` for a non-optional) and
  `dataCorrupted` (invalid JSON, or an unknown enum raw value). Each carries a `codingPath`
  that tells you where it went wrong.

## What you will practise

You will round-trip a struct, map snake_case keys and decode a nested response, and report
decoding errors precisely. The challenge decodes an orders payload, validates it, and
encodes a summary with deterministic key order.
'''

[[unit.step]]
kind = "concept"
id = "sw-u17-c1-synthesized"
title = "Synthesized conformance and the codec"
points = 5
difficulty = 17
intro = '''
`Codable` separates the shape of the data, which your type declares, from the format, which
an encoder or decoder implements. The compiler generates the glue between them, so the same
struct could be written as JSON or as a property list without changing it.
'''
body = '''
## Two halves of one job

`Encodable` means "can describe itself to an encoder"; `Decodable` means "can rebuild itself
from a decoder". `Codable` is both. A type that is only ever sent can be `Encodable`, one
that is only ever received can be `Decodable`.

## What the compiler writes for you

For this struct

```swift
struct User: Codable {
    let id: Int
    let name: String
    let email: String?
}
```

Swift synthesizes a `CodingKeys` enum with one case per property, an `encode(to:)` method
and an `init(from:)` initializer. Decoding `{"id": 1, "name": "Ana"}` succeeds and leaves
`email` as `nil`; decoding `{"name": "Ana"}` throws because `id` is required. Extra keys in
the JSON are ignored.

## Encoder and decoder

```swift
let encoder = JSONEncoder()
encoder.outputFormatting = [.sortedKeys]
let data = try encoder.encode(user)
print(String(decoding: data, as: UTF8.self))

let user2 = try JSONDecoder().decode(User.self, from: data)
```

Notice `User.self`: the decoder needs to be told the type to build, because JSON text
carries no Swift type information.

## Strategies

Encoders and decoders have options that apply to every key or value. For example,
`decoder.keyDecodingStrategy = .convertFromSnakeCase` maps `first_name` to `firstName`
without a `CodingKeys` enum. Explicit `CodingKeys` remain clearer when only a few names
differ, or when a key isn't a mechanical transformation of the property name. Whatever you
choose, keep `.sortedKeys` on any encoder whose output you compare: a test that passes once
and fails the next time is worse than no test.
'''

