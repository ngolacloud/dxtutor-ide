test("an empty program leaves an empty stack") {
    self.equal(execute([]), [])
}
test("push keeps values bottom first") {
    self.equal(execute([.push(1), .push(2), .push(3)]), [1, 2, 3])
    self.equal(execute([.push(-7)]), [-7])
}
test("arithmetic pops two values and pushes one") {
    self.equal(execute([.push(2), .push(3), .add, .push(4), .multiply]), [20])
    self.equal(execute([.push(6), .push(-2), .multiply]), [-12])
    self.equal(execute([.push(5), .push(1), .push(2), .add]), [5, 3])
}
test("subtract takes the top from the value below it") {
    self.equal(execute([.push(10), .push(3), .subtract]), [7])
    self.equal(execute([.push(3), .push(10), .subtract]), [-7])
    self.equal(execute([.push(10), .push(3), .swap, .subtract]), [-7])
}
test("negate, duplicate, swap and pop") {
    self.equal(execute([.push(4), .negate]), [-4])
    self.equal(execute([.push(-4), .negate, .negate]), [-4])
    self.equal(execute([.push(9), .duplicate, .multiply]), [81])
    self.equal(execute([.push(1), .push(2), .swap]), [2, 1])
    self.equal(execute([.push(1), .push(2), .pop]), [1])
    self.equal(execute([.push(1), .pop]), [])
}
test("every instruction rejects an empty stack") {
    for instruction: Instruction in [.add, .subtract, .multiply, .negate, .duplicate, .swap, .pop] {
        self.expect(execute([instruction]) == nil, "\(instruction) on an empty stack must give nil")
    }
}
test("binary instructions and swap need two values") {
    for instruction: Instruction in [.add, .subtract, .multiply, .swap] {
        self.expect(execute([.push(1), instruction]) == nil, "\(instruction) with one value must give nil")
    }
}
test("an underflow after earlier work still fails the whole run") {
    self.equal(execute([.push(1), .push(2), .add, .add]), nil)
    self.equal(execute([.push(5), .pop, .pop, .push(1)]), nil)
}
test("long programs run in one pass") {
    let n = 100_000
    var program = Array(repeating: Instruction.push(1), count: n)
