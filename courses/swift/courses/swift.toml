target = '''
final class Node {
    let key: Int
    var left: Node?
    var right: Node?
    init(_ key: Int) { self.key = key }
}

func insert(_ node: Node?, _ key: Int) -> Node {
    guard let node else { return Node(key) }
    if key < node.key {
        node.left = insert(node.left, key)
    } else if key > node.key {
        node.right = insert(node.right, key)
    }
    return node
}

func height(_ node: Node?) -> Int {
    guard let node else { return 0 }
    return 1 + max(height(node.left), height(node.right))
}

func minKey(_ root: Node?) -> Int? {
    guard var node = root else { return nil }
    while let next = node.left { node = next }
    return node.key
}

let balanced = [4, 2, 6, 1, 3, 5, 7].reduce(nil as Node?) { insert($0, $1) }
let chain = [1, 2, 3, 4, 5, 6, 7].reduce(nil as Node?) { insert($0, $1) }
