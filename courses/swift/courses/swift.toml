    self.equal(loadConfig("debug=maybe\nport=0\nnonsense"), .failure(.malformedLine(3)))
    self.equal(loadConfig("port=0\ndebug=maybe\nhost=a"), .failure(.invalidPort("0")))
    self.assertThrows { _ = try parseServerConfig("host=a\nport=99999") }
}
test("large files") {
    var lines = ["host=big", "port=9000"]
    for i in 0..<20_000 { lines.append("key\(i) = value \(i)") }
    self.equal(loadConfig(lines.joined(separator: "\n")),
               .success(ServerConfig(host: "big", port: 9000, debug: false)))
}
'''

[unit.step.gabarito]
solution = '''
import Foundation

enum ConfigError: Error, Equatable {
    case malformedLine(Int)
    case emptyKey(Int)
    case duplicateKey(String)
    case missingKey(String)
    case invalidPort(String)
    case invalidBool(String)
}

struct ServerConfig: Equatable {
    let host: String
    let port: Int
    let debug: Bool
}

func parseServerConfig(_ text: String) throws(ConfigError) -> ServerConfig {
    var values: [String: String] = [:]
    let lines = text.split(omittingEmptySubsequences: false, whereSeparator: \.isNewline)
    for (index, rawLine) in lines.enumerated() {
        let line = rawLine.trimmingCharacters(in: .whitespaces)
        if line.isEmpty || line.hasPrefix("#") { continue }
        guard let equals = line.firstIndex(of: "=") else {
            throw .malformedLine(index + 1)
        }
        let key = line[..<equals].trimmingCharacters(in: .whitespaces)
        let value = line[line.index(after: equals)...].trimmingCharacters(in: .whitespaces)
        guard !key.isEmpty else { throw .emptyKey(index + 1) }
        guard values[key] == nil else { throw .duplicateKey(key) }
        values[key] = value
    }

    guard let host = values["host"], !host.isEmpty else { throw .missingKey("host") }
    guard let portText = values["port"] else { throw .missingKey("port") }
    guard let port = Int(portText), (1...65_535).contains(port) else {
        throw .invalidPort(portText)
    }
    var debug = false
    if let flag = values["debug"] {
        switch flag {
        case "true": debug = true
        case "false": debug = false
        default: throw .invalidBool(flag)
        }
    }
    return ServerConfig(host: host, port: port, debug: debug)
}

func loadConfig(_ text: String) -> Result<ServerConfig, ConfigError> {
    do {
        return .success(try parseServerConfig(text))
    } catch {
        return .failure(error)
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the length of the text. Splitting into lines is one pass, and every line is then
trimmed, searched for `=` and sliced once, so all the per-line work adds up to a constant
number of passes over the characters: **O(n)** time. Each key lookup and insertion in the
`values` dictionary is expected O(1) plus hashing the key, which is proportional to its
length and therefore already counted in the O(n). The lines and the dictionary together hold
at most a copy of the text: **O(n)** space.

The order of the checks is what makes "the first error wins" true. Line errors are thrown
during the scan, so they come before any check that needs the whole file; the missing-key,
port and debug checks run afterwards in a fixed order. `guard` with an early `throw` keeps the
happy path flat: each guard either proves a fact for the lines below or leaves the function.

Typed throws make the contract visible. Because the signature says `throws(ConfigError)`, a
caller's `catch` receives a `ConfigError` it can `switch` over exhaustively, and `loadConfig`
can store it in a `Result<ServerConfig, ConfigError>` without a cast. The parser never uses
`try!` or force-unwraps, so no input, however malformed, can crash the program.
'''

