- `topFrequent(Array("mississippi"), 3)` returns `["i", "s", "p"]`.

**Hint:** a dictionary `[T: Int]` counts; an array of distinct items in first-seen order
gives you the tie-break. Never rely on the order of a dictionary's keys: it changes from one
