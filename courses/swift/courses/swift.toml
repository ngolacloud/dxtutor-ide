- `reverse()` on `[10, 20, 30]` gives `[30, 20, 10]`, and the node that held 10 is the tail.

**Hint:** after removing or reversing, recompute `tail` from what you already know (the last
kept node, or the old head) instead of walking the list again.

Hidden tests decide correctness.
