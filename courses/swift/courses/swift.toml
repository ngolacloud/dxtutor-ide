solution = '''
/// Holds a document's state.
final class DocumentStorage {
    var lines: [String]
    var revision: Int

    init(lines: [String], revision: Int) {
        self.lines = lines
        self.revision = revision
    }

    func copy() -> DocumentStorage {
        DocumentStorage(lines: lines, revision: revision)
    }
}

/// A text document with value semantics and copy-on-write storage.
struct Document {
    private var storage: DocumentStorage

    init(lines: [String] = []) {
        storage = DocumentStorage(lines: lines, revision: 0)
    }

    var lines: [String] { storage.lines }
    var revision: Int { storage.revision }
    var storageID: ObjectIdentifier { ObjectIdentifier(storage) }

    /// Gives this value its own storage if any other value shares it.
    private mutating func makeUnique() {
        if !isKnownUniquelyReferenced(&storage) {
            storage = storage.copy()
        }
    }

    mutating func append(_ line: String) {
        makeUnique()
        storage.lines.append(line)
        storage.revision += 1
    }

    mutating func replace(at index: Int, with line: String) -> Bool {
        guard storage.lines.indices.contains(index) else { return false }
        makeUnique()
        storage.lines[index] = line
        storage.revision += 1
        return true
    }
}
'''
time = "O(1) to copy; O(1) amortized per unshared mutation; O(n) for the first write after a copy"
space = "O(n)"
justification = '''
Let `n` be the number of lines. Copying a `Document` copies one reference and bumps a
reference count, so it is **O(1)** no matter how long the document is. Reading `lines`
returns the stored array, which is itself copy-on-write, so it is O(1) as well.

`isKnownUniquelyReferenced` is an O(1) check of the reference count. When the storage is
unique, `append` is an amortized **O(1)** array append and `replace` is an O(1) assignment.
When the storage is shared, the first mutation copies it, **O(n)**; after that the value owns
its storage and later mutations are cheap again. Each divergence between copies therefore
pays for at most one O(n) copy.

A document holds its `n` lines once, so the space is **O(n)**. Copies that haven't been
written share that memory, and only the ones that diverge pay for a second copy.

The ordering in `replace` matters: the bounds check runs before `makeUnique`, so a failed
replace neither changes the revision nor allocates new storage. Without the uniqueness
check, mutating `storage` would change every copy (reference semantics leaking through);
copying unconditionally would make 20,000 appends cost O(n²) and change `storageID` on every
call.
'''

# ── g5-concurrency ────────────────────────────────────────────────────────────

[[unit]]
id = "sw-u22-async-await"
title = "Async functions, await and async let"
level = "advanced"
difficulty = 22
intro = '''
Most real programs spend their time waiting: for the network, the disk or a timer. Swift's
`async`/`await` lets a function pause at a clearly marked point without blocking a thread, and
`async let` starts several pieces of work at once. You will write async functions, run two loads
side by side, wrap work in a `Task`, and finish by loading a dashboard from two concurrent sources.
'''
concepts = '''
## The idea

A **synchronous** function runs from start to finish on one thread: while it waits for a server,
that thread sits idle. An **asynchronous** function can **suspend**: it gives its thread back to
the system while it waits, and **resumes** later, possibly on a different thread. Thousands of
suspended functions cost almost nothing, so a program can wait for many things at once without
creating thousands of threads.

Swift makes every possible pause visible. A function that may suspend is marked `async`, and every
call to it is marked `await`. Reading the code, you can see exactly where the world may change
under you, which is the key to reasoning about concurrent programs.

## How Swift does it

```swift
func fetchUser(id: Int) async throws -> String {
    try await Task.sleep(for: .milliseconds(5))
    return "user-\(id)"
}
let name = try await fetchUser(id: 1)
```

`Task.sleep` stands in for a network call. `try` comes before `await` when the call can also
throw. In `main.swift` you may `await` at the top level; elsewhere you can only `await` inside
another async function or a `Task`.

Calls written one after another run **one after another**: the second starts only when the first
has returned. To overlap independent work, use **`async let`**:

```swift
async let a = fetchUser(id: 1)
async let b = fetchUser(id: 2)
let both = try await [a, b]
```

Each `async let` starts a **child task** immediately; the `await` collects the results. The
children belong to the enclosing scope: if the function leaves early (for example because one of
them threw), Swift cancels and awaits the others first. That rule is **structured concurrency**.

A **`Task { ... }`** starts *unstructured* work that runs on its own. You keep the handle and read
`try await task.value` (or `await task.result`, a `Result`) when you need the outcome.

## Pitfalls and compiler errors

- **"'async' call in a function that does not support concurrency"**: you called an async function
  from a synchronous one. Make the caller `async`, or start a `Task`.
- **"expression is 'async' but is not marked with 'await'"**: add `await`; the compiler wants
  every suspension point visible.
- `async let` values must be awaited before you use them, and the right-hand side must be safe to
  run concurrently: in Swift 6 the values and closures it captures must be **`Sendable`**.
- Sequential `await`s are not a bug, but they are a missed opportunity when the calls do not
  depend on each other.

## What you'll practise

You will write and call async functions, overlap two loads with `async let`, start a `Task` and
handle its errors, and in the challenge combine two concurrent loaders into one result while
validating input and letting errors propagate.
'''

[[unit.step]]
kind = "concept"
id = "sw-u22-c1-suspension"
title = "Suspension points and child tasks"
points = 5
difficulty = 22
intro = '''
An async function is a function that can pause without holding a thread. Each `await` marks a
possible suspension point, and `async let` turns independent calls into child tasks that run at
the same time.
'''
body = '''
## Suspending is not blocking

When a synchronous function waits, its thread waits with it. When an async function reaches an
`await` on something that is not ready, it **suspends**: its local state is saved, the thread
goes off to run other work, and the function **resumes** when the result arrives. That is why
Swift can keep thousands of requests in flight on a handful of threads.

```swift
func price(of item: String) async -> Int {
    try? await Task.sleep(for: .milliseconds(10))
    return item.count * 100
}
```

## Sequential versus concurrent

```swift
let a = await price(of: "pen")
let b = await price(of: "book")
```

The second call starts only after the first has finished, so the waits add up. With `async let`
both calls start at once, and the waits overlap:

```swift
async let a = price(of: "pen")
async let b = price(of: "book")
let total = await a + b
```

Each `async let` is a **child task** of the current function. The child cannot outlive its
parent: before the function returns or throws, Swift cancels and awaits any child that was not
awaited. Results, errors and cancellation all flow back up the tree, which is what makes this
kind of concurrency *structured*.

## Unstructured tasks

`Task { ... }` starts work that is not tied to the current scope. It begins running right away;
you await its `value` (rethrowing its error) or its `result` later. Use it when synchronous code
needs to kick off async work, and prefer `async let` when the work belongs to one function.
'''

