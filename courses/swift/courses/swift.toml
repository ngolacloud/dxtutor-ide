    let n = 100_000
    let start = Date()
    var table = HashTable<String, Int>()
    for i in 0..<n { table["key\(i)"] = i }
    self.equal(table.count, n)
    var hits = 0
    for i in 0..<n where table["key\(i)"] == i { hits += 1 }
    self.equal(hits, n)
    for i in stride(from: 0, to: n, by: 2) { table.removeValue(forKey: "key\(i)") }
