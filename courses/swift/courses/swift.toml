## Your turn

Implement `summarizeOrders`:

```swift
func summarizeOrders(_ json: String) throws -> String
```

The input looks like this (keys in any order, extra keys allowed and ignored):

```json
{"orders": [
  {"order_id": 1, "customer": "ana", "total_cents": 1250, "status": "paid"},
