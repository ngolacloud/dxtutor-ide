target = '''
struct RingBuffer {
    private var slots: [Int]
    private var start = 0
    private(set) var count = 0

    init(capacity: Int) {
        slots = Array(repeating: 0, count: capacity)
    }

    mutating func append(_ value: Int) {
        let end = (start + count) % slots.count
        slots[end] = value
        if count < slots.count {
            count += 1
        } else {
            start = (start + 1) % slots.count
        }
    }

    var elements: [Int] {
        (0..<count).map { slots[(start + $0) % slots.count] }
    }
}

var lastThree = RingBuffer(capacity: 3)
for reading in [10, 20, 30, 40, 50] {
