intro = '''
An HTML generator is the classic result-builder DSL: the document is a tree, each
`element { ... }` block lists its children, and control flow decides what appears. Rendering
the tree is a depth-first traversal, and escaping the text is what keeps a page safe from
markup injection.
'''
instructions = '''
## Your turn

Implement the builder and the two functions of a tiny HTML DSL:

```swift
enum HTMLNode: Equatable {
    case text(String)
    case element(tag: String, children: [HTMLNode])
}

@resultBuilder enum HTMLBuilder { ... }   // component type: [HTMLNode]
func element(_ tag: String, @HTMLBuilder _ content: () -> [HTMLNode]) -> HTMLNode
func render(_ node: HTMLNode) -> String
```

`HTMLNode` is provided; don't change it. The starter declares every build method you need.

Rules:

- A string statement in a block becomes a `.text` child; an `HTMLNode` statement is used as
  is. Children keep their source order.
- Blocks may be empty and may use `if`, `if`/`else` (including `else if`) and `for`.
- `element(tag) { ... }` returns `.element(tag: tag, children: ...)`.
- `render` writes an element as `<tag>` + its rendered children + `</tag>` (an element with no
  children renders as `<tag></tag>`), and writes text with `&`, `<`, `>` and `"` replaced by
  `&amp;`, `&lt;`, `&gt;` and `&quot;`. Tags are not escaped.
- Rendering must be linear in the size of the output: a list of 20,000 items renders quickly.

Examples:

```swift
let card = element("p") {
    "Hi, "
    element("b") { "Ana" }
    "!"
}
render(card)              // "<p>Hi, <b>Ana</b>!</p>"
render(.text("a < b"))    // "a &lt; b"
render(element("ul") {})  // "<ul></ul>"
```

**Hint:** with `[HTMLNode]` as the component type, every build method is one line. For
`render`, append into one `inout String` while you walk the tree, instead of concatenating
the strings returned by recursive calls.

Hidden tests decide correctness.
'''
starter = '''
