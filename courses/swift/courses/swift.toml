[[unit]]
id = "sw-u16-generics"
title = "Generics: write it once, use it with any type"
level = "intermediate"
difficulty = 16
intro = '''
Generics let you write a function or a type once and reuse it with every type that meets the
requirements you state, without giving up type safety or speed. You will write constrained
generic functions, build a generic struct with a conditional extension, meet protocols with
associated types, and learn when to write `some` and when to write `any`.
'''
concepts = '''
## The idea

Suppose you need "the largest element" for an array of `Int`, then for `Double`, then for
`String`. Without generics you either copy the function three times or erase the types to
`Any` and cast them back at run time, losing the compiler's help. A **generic** function
names a *type parameter*, a placeholder the compiler fills in at every call site. The body
is checked once against the requirements you declare, and every call is then checked
against those same requirements. With `-O` the optimiser usually *specialises* the code
for each concrete type, so generics cost nothing at run time.

You have been using generics all along: `Array<Element>`, `Dictionary<Key, Value>`,
`Set<Element>` and `Optional<Wrapped>` are generic types from the standard library.

## How Swift does it

Type parameters go in angle brackets. A **constraint** says what the type must be able to do:

```swift
func contains<T: Equatable>(_ items: [T], _ target: T) -> Bool {
    for item in items where item == target { return true }
    return false
}
```

`T: Equatable` is what makes `==` legal inside the body. Combine requirements with `&`
(`T: Hashable & Comparable`) or with a `where` clause. Generic types work the same way:

```swift
struct Pair<First, Second> {
    var first: First
    var second: Second
}

extension Pair where First == Second {
    func swapped() -> Pair { Pair(first: second, second: first) }
}
```

The extension adds `swapped()` only to pairs whose two types are the same.

A protocol can leave a type open with an **associated type**, which each conforming type
fixes: `protocol Container { associatedtype Item; var items: [Item] { get } }`. Swift then
offers two ways to use the protocol as a type:

- **`some Container`** is an *opaque* type: one specific concrete type that the compiler
  knows, even if the reader does not. It is fast and keeps all type information.
- **`any Container`** is an *existential*: a box that can hold a different concrete type at
  run time, such as an array that mixes several shapes. It costs a dynamic lookup and gives
  you only what the protocol promises.

Prefer `some` and generic parameters. Reach for `any` when you really need values of
different types side by side.

## Pitfalls and compiler errors

- Forgetting a constraint: `a > b` on a plain `T` fails with *"referencing operator function
  '>' on 'Comparable' requires that 'T' conform to 'Comparable'"*. Add `T: Comparable`.
- *"generic parameter 'T' could not be inferred"*: the call gives the compiler nothing to
  deduce `T` from, for example `let x = makeEmpty()`. Annotate the type: `let x: [Int] = makeEmpty()`.
- Calling a conditional method on a type that doesn't meet its `where` clause gives
  *"referencing instance method … requires that 'String' conform to 'Numeric'"*.
- Writing a protocol as a bare type, `func f(_ c: Container)`, now warns that it *"must be
  written 'any Container'"*. Say `any` (or better, `some`) explicitly.
- Don't make everything generic. Generalise when you have two real uses, not before.

## What you will practise

You will write a constrained `largest` function, a generic `Page<Item>` with a conditional
`sum`, a repository protocol with an associated type used through `some`, and a list of
`any Notifier` values. The challenge asks for a generic "most frequent items" function that
works for any `Hashable` type.
'''

[[unit.step]]
kind = "concept"
id = "sw-u16-c1-type-parameters"
title = "Type parameters and constraints"
points = 5
difficulty = 16
intro = '''
A generic function is checked once, against the constraints it declares, and then works for
every type that satisfies them. The constraint is a contract: it lists exactly which
operations the body may use.
'''
body = '''
## A placeholder for a type

```swift
func firstOrDefault<T>(_ items: [T], _ fallback: T) -> T {
    items.first ?? fallback
}

firstOrDefault([3, 4], 0)        // T is Int
firstOrDefault([String](), "-")  // T is String
```

`T` is a **type parameter**. At each call the compiler deduces it from the arguments, then
checks that both arguments really share that one type: `firstOrDefault([1], "x")` does not
compile.

## Constraints unlock operations

Inside the body you may only do what every possible `T` can do. With no constraint that is
almost nothing: you can store, pass and return a `T`, but not compare or add it. A
constraint widens the menu:

```swift
func clamp<T: Comparable>(_ value: T, _ low: T, _ high: T) -> T {
    min(max(value, low), high)
}
```

`Comparable` provides `<`, `>`, `min` and `max`. Other everyday constraints are `Equatable`
(`==`), `Hashable` (dictionary keys and set members), `Numeric` (`+`, `*` and integer
literals) and `CustomStringConvertible` (`description`).

## Generic types and where clauses

A type can be generic too, as in `struct Page<Item>`. An extension can add members only for
some type arguments: `extension Page where Item: Numeric { … }` gives numeric pages a
`sum`, while a `Page<String>` simply doesn't have it, and calling it is a compile error, not
a crash.

The rule of thumb: ask for the weakest constraint that lets the body compile. Every extra
requirement shuts out types that could have used your code.
'''

[[unit.step]]
kind = "drill"
