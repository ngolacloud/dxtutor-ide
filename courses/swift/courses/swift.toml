/// (Provided: do not change it.)
enum HTMLNode: Equatable {
    case text(String)
    case element(tag: String, children: [HTMLNode])
}

/// Turns the statements of an `element { ... }` block into a flat list of child nodes.
/// Implement every builder method so blocks can mix strings and nodes and use
/// `if`, `if`/`else` and `for`.
@resultBuilder
enum HTMLBuilder {
    /// A node statement becomes a one-element list.
    static func buildExpression(_ node: HTMLNode) -> [HTMLNode] {
        fatalError("not implemented")
    }

    /// A string statement becomes a text node.
    static func buildExpression(_ text: String) -> [HTMLNode] {
        fatalError("not implemented")
    }

    /// Joins the results of the block's statements, in order.
    static func buildBlock(_ components: [HTMLNode]...) -> [HTMLNode] {
        fatalError("not implemented")
    }

    /// An `if` without `else`: nil when the condition was false.
    static func buildOptional(_ component: [HTMLNode]?) -> [HTMLNode] {
        fatalError("not implemented")
    }

    /// The `if` branch of an `if`/`else`.
    static func buildEither(first component: [HTMLNode]) -> [HTMLNode] {
        fatalError("not implemented")
    }

    /// The `else` branch of an `if`/`else`.
    static func buildEither(second component: [HTMLNode]) -> [HTMLNode] {
        fatalError("not implemented")
    }

    /// A `for` loop: one result per iteration.
    static func buildArray(_ components: [[HTMLNode]]) -> [HTMLNode] {
        fatalError("not implemented")
    }
}

/// Builds an element whose children come from the builder block.
func element(_ tag: String, @HTMLBuilder _ content: () -> [HTMLNode]) -> HTMLNode {
    fatalError("not implemented")
}

/// Renders a node as HTML: `<tag>children</tag>` for elements, and text with
/// `&`, `<`, `>` and `"` escaped as `&amp;`, `&lt;`, `&gt;` and `&quot;`.
func render(_ node: HTMLNode) -> String {
    fatalError("not implemented")
}
'''
tests = '''
        test("a string statement becomes a text child") {
            let node = element("p") { "Hello" }
            self.equal(node, HTMLNode.element(tag: "p", children: [.text("Hello")]))
            self.equal(render(node), "<p>Hello</p>")
        }
        test("render plain text") {
            self.equal(render(.text("hi")), "hi")
            self.equal(render(.text("")), "")
        }
        test("an empty block gives an element with no children") {
            let node = element("div") {}
            self.equal(node, HTMLNode.element(tag: "div", children: []))
            self.equal(render(node), "<div></div>")
        }
        test("strings and nodes mix in order") {
            let node = element("p") {
                "Hi, "
                element("b") { "Ana" }
                "!"
            }
            self.equal(render(node), "<p>Hi, <b>Ana</b>!</p>")
            if case .element(_, let children) = node {
                self.equal(children.count, 3)
            } else {
                self.expect(false, "element(_:_:) must return .element")
            }
        }
        test("nested elements") {
            let page = element("html") {
                element("body") {
                    element("h1") { "Title" }
                    element("ul") {
                        element("li") { "a" }
                        element("li") { "b" }
                    }
                }
            }
            self.equal(render(page), "<html><body><h1>Title</h1><ul><li>a</li><li>b</li></ul></body></html>")
        }
        test("if without else") {
            func badge(_ admin: Bool) -> HTMLNode {
                element("span") {
                    "user"
                    if admin {
                        element("b") { "admin" }
                    }
                }
            }
            self.equal(render(badge(true)), "<span>user<b>admin</b></span>")
            self.equal(render(badge(false)), "<span>user</span>")
        }
        test("if and else pick one branch") {
            func status(_ count: Int) -> HTMLNode {
                element("p") {
                    if count == 0 {
                        "No messages"
                    } else if count == 1 {
                        "One message"
                    } else {
                        "\(count) messages"
