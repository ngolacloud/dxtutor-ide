print(a === c, a === b, a.code == b.code)

func useBriefly() {
    let temp = Ticket(code: "T9")
    print("using", temp.code)
}

useBriefly()
print("back from useBriefly")

var holder: Ticket? = Ticket(code: "Z0")
holder = nil
print("end of program")
