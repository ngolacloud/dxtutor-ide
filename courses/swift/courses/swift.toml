prompt = '''
Write a `TaskQueue` that stores escaping jobs and runs them later, and contrast it with a
function whose non-escaping closure runs immediately.

**Why:** deferred work queues, completion handlers and event callbacks all rely on escaping
closures, and the annotation documents that the closure outlives the call.
'''
target = '''
final class TaskQueue {
    private var pending: [() -> Void] = []

    func add(_ job: @escaping () -> Void) {
        pending.append(job)
    }

    func runAll() -> Int {
        let jobs = pending
        pending.removeAll()
        for job in jobs { job() }
        return jobs.count
    }
}

func measure(_ label: String, _ work: () -> Int) {
    print(label, work())
}

let queue = TaskQueue()
var log: [String] = []
for name in ["build", "test", "deploy"] {
    queue.add { log.append("ran \(name)") }
}
print("queued, log has", log.count, "entries")
measure("jobs run:") { queue.runAll() }
print(log)
measure("second run:") { queue.runAll() }
'''
