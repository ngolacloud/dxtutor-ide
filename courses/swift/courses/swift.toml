    private(set) var firstChunkSeen = false
    private(set) var sourceTerminated = false
    func sawFirstChunk() { firstChunkSeen = true }
    func terminated() { sourceTerminated = true }
    // Polls (up to ~0.5 s, in 1 ms steps) until the condition holds.
    func waitFor(_ condition: @Sendable (isolated Flags) -> Bool) async {
        var tries = 0
        while !condition(self) && tries < 500 {
            tries += 1
            try? await Task.sleep(for: .milliseconds(1))
        }
    }
}

func streamOf<T: Sendable>(_ values: [T]) -> AsyncStream<T> {
    AsyncStream { continuation in
        for v in values { continuation.yield(v) }
        continuation.finish()
    }
}

func collect<T: Sendable>(_ stream: AsyncStream<[T]>) async -> [[T]] {
    var out: [[T]] = []
    for await chunk in stream { out.append(chunk) }
    return out
}

test("groups elements and emits the leftover chunk at the end") {
    let out = await collect(chunked(streamOf(Array(1...7)), size: 3))
    self.equal(out, [[1, 2, 3], [4, 5, 6], [7]])
}

test("an exact multiple leaves no empty chunk") {
    let out = await collect(chunked(streamOf(Array(1...6)), size: 2))
    self.equal(out, [[1, 2], [3, 4], [5, 6]])
}

test("an empty source gives no chunks") {
    let out = await collect(chunked(streamOf([Int]()), size: 4))
    self.equal(out, [])
}

test("size 1 and a size larger than the input") {
    self.equal(await collect(chunked(streamOf([9, 8, 7]), size: 1)), [[9], [8], [7]])
    self.equal(await collect(chunked(streamOf([9, 8, 7]), size: 10)), [[9, 8, 7]])
}

test("a size below 1 finishes at once with no chunks") {
    self.equal(await collect(chunked(streamOf([1, 2, 3]), size: 0)), [])
    self.equal(await collect(chunked(streamOf([1, 2, 3]), size: -2)), [])
}

test("works for any Sendable element and keeps duplicates") {
    let out = await collect(chunked(streamOf(["a", "a", "b", "a", "a"]), size: 2))
    self.equal(out, [["a", "a"], ["b", "a"], ["a"]])
}

test("a full chunk is delivered before the source finishes") {
    let flags = Flags()
    let (source, input) = AsyncStream.makeStream(of: Int.self)
    let producer = Task {
        input.yield(1)
        input.yield(2)
        await flags.waitFor { $0.firstChunkSeen }
        let early = await flags.firstChunkSeen
        input.yield(3)
        input.finish()
        return early
    }
    var chunks: [[Int]] = []
    for await chunk in chunked(source, size: 2) {
        chunks.append(chunk)
        await flags.sawFirstChunk()
    }
    self.equal(chunks, [[1, 2], [3]])
    self.expect(await producer.value, "the first chunk only arrived after the source finished")
}

test("stopping early cancels the reading of the source") {
    let flags = Flags()
    let (source, input) = AsyncStream.makeStream(of: Int.self)
    input.onTermination = { reason in
        if case .cancelled = reason {
            Task { await flags.terminated() }
        }
    }
    // A long but finite source: about 2 s of numbers, one per millisecond.
    let producer = Task {
        for n in 1...2_000 {
            if Task.isCancelled { break }
            if case .terminated = input.yield(n) { break }
            try? await Task.sleep(for: .milliseconds(1))
        }
        input.finish()
    }
    var first: [Int] = []
    for await chunk in chunked(source, size: 3) {
        first = chunk
        break
    }
    self.equal(first, [1, 2, 3])
    await flags.waitFor { $0.sourceTerminated }
    self.expect(await flags.sourceTerminated, "the source was never cancelled after the consumer stopped")
    producer.cancel()
    _ = await producer.value
}

test("ten thousand elements in chunks of 64") {
    let out = await collect(chunked(streamOf(Array(0..<10_000)), size: 64))
    self.equal(out.count, 157)
    self.equal(out.dropLast().allSatisfy { $0.count == 64 }, true)
    self.equal(out.last, Array(9_984..<10_000))
    self.equal(out.flatMap { $0 }, Array(0..<10_000))
}
'''

[unit.step.gabarito]
solution = '''
import Foundation

/// Groups the elements of `source` into arrays of `size` elements, in order. When the source
/// finishes, a last shorter chunk is emitted if any elements are left over. A `size` below 1
/// produces a stream that finishes at once. When the consumer stops early, the work reading
/// `source` is cancelled.
func chunked<Element: Sendable>(_ source: AsyncStream<Element>, size: Int) -> AsyncStream<[Element]> {
    AsyncStream { continuation in
        guard size >= 1 else {
            continuation.finish()
            return
        }
        let reader = Task {
            var chunk: [Element] = []
            chunk.reserveCapacity(size)
            for await element in source {
                chunk.append(element)
                if chunk.count == size {
                    continuation.yield(chunk)
                    chunk.removeAll(keepingCapacity: true)
                }
            }
            if !chunk.isEmpty {
                continuation.yield(chunk)
            }
            continuation.finish()
        }
        continuation.onTermination = { _ in
            reader.cancel()
        }
    }
}
'''
time = "O(n)"
space = "O(size)"
justification = '''
Let *n* be the number of elements in the source. The reader task receives each element once and
appends it to the current chunk in amortized O(1); each chunk is yielded once, and handing a
chunk to the stream is O(1) (the array is copied lazily, by copy-on-write, only when the buffer is
reused). The total work is therefore **O(n)**. The adapter itself holds at most one partial chunk
of `size` elements, so its extra space is **O(size)**, plus whatever full chunks the stream
buffers while the consumer is slower than the source.

Emitting a chunk the moment it is full, instead of collecting the whole source first, is what
keeps memory bounded and latency low; collecting first would cost O(n) space and never work with
an endless source. Cleanup follows the stream's lifecycle: when the consumer breaks out,
`onTermination` runs and cancels the reader task, and cancelling a task that is iterating an
`AsyncStream` ends its `for await` and terminates `source` with `.cancelled`, so the producer
upstream learns that nobody is listening.
'''

