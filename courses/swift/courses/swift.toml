'''
[unit.step.gabarito]
solution = '''
/// A dotted version number such as "1.4.2".
struct Version: Comparable, Hashable, CustomStringConvertible {
    /// Numeric components with trailing zeros removed, so equal versions store equal arrays
    /// and the synthesized == and hash(into:) are automatically consistent.
    private let parts: [Int]

    init?(_ text: String) {
        var numbers: [Int] = []
        for piece in text.split(separator: ".", omittingEmptySubsequences: false) {
            guard !piece.isEmpty,
                  piece.allSatisfy({ $0.isASCII && $0.isNumber }),
                  let value = Int(piece) else { return nil }
            numbers.append(value)
        }
        while numbers.last == 0 {
            numbers.removeLast()
        }
        parts = numbers
    }

    static func < (lhs: Version, rhs: Version) -> Bool {
        lhs.parts.lexicographicallyPrecedes(rhs.parts)
    }

    var description: String {
        parts.isEmpty ? "0" : parts.map(String.init).joined(separator: ".")
    }
}
'''
time = "O(L) to parse; O(k) to compare or hash"
space = "O(k)"
justification = '''
Let `L` be the length of the text and `k` the number of components. `init?` splits the text
once and checks every character once, so parsing is **O(L)**. Trimming trailing zeros removes
at most `k` elements. Each `Version` stores its `k` integers, so the space is **O(k)**.

`<` walks both arrays until the first difference, **O(k)** in the worst case, and the
synthesized `==` and `hash(into:)` also visit each component once. Sorting `n` versions
therefore costs O(n log n) comparisons of O(k) each.

The key decision is the **canonical form**. Because `1.2`, `1.2.0` and `1.2.0.0` all store
`[1, 2]`, the compiler-generated equality and hashing agree with each other by construction,
which is exactly the Hashable contract. Removing trailing zeros also makes the lexicographic
order correct: `[1, 2]` is a prefix of `[1, 2, 1]`, and a prefix precedes the longer array,
so `1.2 < 1.2.1`, while `1.2` and `1.2.0` compare equal. Comparing the raw strings would put
`1.10` before `1.9`, and comparing untrimmed arrays would make `1.2 < 1.2.0` even though the
two are equal, breaking the rule that `<` must be consistent with `==`.
'''

[[unit]]
id = "sw-u21-value-semantics"
title = "Value semantics and copy-on-write"
level = "intermediate"
difficulty = 21
intro = '''
Swift's most important design choice is that most types are values: assigning one copies
it, so no other part of the program can change your copy behind your back. You will compare
value and reference semantics, see how `let` freezes a struct but not an object, watch arrays
copy only when written to, and implement copy-on-write yourself with
`isKnownUniquelyReferenced`.
'''
concepts = '''
## The idea

There are two ways for a variable to hold data:

- **Value semantics:** the variable holds the data itself. `b = a` makes an independent
  copy; changing `b` never affects `a`.
- **Reference semantics:** the variable holds a reference to an object. `b = a` copies the
  reference, so `a` and `b` are two names for the same object, and a change through one is
  visible through the other.

Shared mutable state is the root of many bugs: a function that "only reads" a list and
quietly modifies it, a cached object changed by another screen, a data race between two
threads. Values remove the whole category, because nobody else can hold your copy.

## How Swift does it

Structs, enums and tuples are value types, and so are `String`, `Array`, `Dictionary` and
`Set`. Classes, actors and closures are reference types. `let` means different things for
each:

```swift
struct Size { var w: Int }
final class Box { var w = 0 }

let s = Size(w: 1)
// s.w = 2            // error: the whole value is constant
let b = Box()
b.w = 2               // fine: the reference is constant, the object is not
```

Copying a big array on every assignment would be slow, so the standard collections use
**copy-on-write** (COW). A copy shares the underlying buffer, which makes assignment O(1),
and the buffer is duplicated only when one of the sharing values is mutated. A function
that receives an array and only reads it never pays for a copy.

You can give your own types the same behaviour: keep the data in a private class instance,
and before every mutation call `isKnownUniquelyReferenced(&storage)`. If it returns `false`,
the storage is shared, so replace it with a fresh copy first.

```swift
if !isKnownUniquelyReferenced(&storage) {
    storage = storage.copy()
}
```

Value types also matter for Swift 6 concurrency: a struct whose properties are all
`Sendable` is itself `Sendable` and can cross between tasks and actors safely, while a
class with mutable state cannot.

## Pitfalls and compiler errors

- *"cannot assign to property: 'p' is a 'let' constant"*: a `let` struct is fully
  immutable. Declare it with `var` if it must change.
- *"left side of mutating operator isn't mutable: 'self' is immutable"*: a method that
  changes a struct's properties must be marked `mutating`.
- *"passing value of type 'S' to an inout parameter requires explicit '&'"*:
  `isKnownUniquelyReferenced` takes its argument `inout`, so write `&storage`, and the
  storage must be a `var`.
- **A class inside a struct is shared.** Copying the struct copies the reference, not the
  object, so both copies see the same mutations. This quietly breaks value semantics unless
  you add copy-on-write.

## What you will practise

You will contrast a struct and a class, watch arrays copy on write and a class inside a
struct stay shared, and build a copy-on-write list by hand. The challenge is a `Document`
type whose copies are O(1) and share storage until one of them is changed.
'''

[[unit.step]]
kind = "concept"
id = "sw-u21-c1-values-and-references"
title = "Values, references and copy-on-write"
points = 5
difficulty = 21
intro = '''
Value semantics are a guarantee about behaviour, not about memory layout. Copy-on-write
delivers that guarantee cheaply: copies share one buffer until the first write, so a copy
costs O(1) and the O(n) duplication happens only when it is really needed.
'''
body = '''
## Two kinds of assignment

```swift
var a = [1, 2, 3]
var b = a          // value: b is an independent array
b.append(4)        // a is still [1, 2, 3]

final class Counter { var n = 0 }
let x = Counter()
let y = x          // reference: y is the same object as x
y.n += 1           // x.n is now 1 too
```

`===` asks whether two references point to the same object. Values have no identity to ask
about, only contents.

## Copy-on-write underneath

`b = a` above doesn't copy three integers. Both arrays point to one shared buffer with a
reference count of 2. When `b.append(4)` runs, the array sees the buffer is shared, copies it,
and appends to its own copy. The next `b.append` finds its buffer unique and appends in
place. So:

- copying a collection is **O(1)**;
- the first mutation after a copy is **O(n)**;
- later mutations of a uniquely owned value are as cheap as ever.

## Doing it yourself

A custom type gets the same behaviour from three pieces:

1. a `final class` that holds the data (the storage);
2. a struct with a `private var storage` of that class;
3. a check in every mutating method:

```swift
mutating func append(_ x: Int) {
    if !isKnownUniquelyReferenced(&storage) {
        storage = Storage(storage.items)   // shared: make our own copy first
    }
    storage.items.append(x)
}
```

`isKnownUniquelyReferenced` returns `true` only when exactly one strong reference to the
object exists, which is the moment when mutating in place cannot be observed by anyone
else. Read-only members, such as a computed `items` property, need no check at all.
'''

