tests = '''
actor Probe {
    private(set) var loads: [String] = []
    private(set) var inFlight = 0
    private(set) var peak = 0
    func enter(_ key: String) {
        loads.append(key)
        inFlight += 1
        peak = max(peak, inFlight)
    }
    func leave() { inFlight -= 1 }
    // Waits (up to ~0.5 s, in 1 ms steps) until `count` loads are running at once.
    func meet(_ count: Int) async {
        var tries = 0
        while inFlight < count && tries < 500 {
            tries += 1
            try? await Task.sleep(for: .milliseconds(1))
        }
    }
}

struct Boom: Error, Equatable {}

test("the first request loads, the second one is served from the cache") {
    let cache = LoadingCache()
    let probe = Probe()
    let loader: @Sendable (String) async throws -> String = { key in
        await probe.enter(key)
        await probe.leave()
        return key.uppercased()
    }
    self.equal(try await cache.value(for: "ada", load: loader), "ADA")
    self.equal(try await cache.value(for: "ada", load: loader), "ADA")
    self.equal(await probe.loads, ["ada"])
    self.equal(await cache.cachedKeys(), ["ada"])
}

test("twenty concurrent requests for one key share a single load") {
    let cache = LoadingCache()
    let probe = Probe()
    let results = try await withThrowingTaskGroup(of: String.self) { group in
        for _ in 0..<20 {
            group.addTask {
                try await cache.value(for: "report") { key in
                    await probe.enter(key)
                    try await Task.sleep(for: .milliseconds(10))
                    await probe.leave()
                    return "\(key)-v1"
                }
            }
        }
        var all: [String] = []
        while let r = try await group.next() { all.append(r) }
        return all
    }
    self.equal(results, Array(repeating: "report-v1", count: 20))
    self.equal(await probe.loads, ["report"])
}

test("different keys load separately and in parallel") {
    let cache = LoadingCache()
    let probe = Probe()
    let loader: @Sendable (String) async throws -> String = { key in
        await probe.enter(key)
        await probe.meet(2)
        await probe.leave()
        return String(key.reversed())
    }
    async let a = cache.value(for: "abc", load: loader)
    async let b = cache.value(for: "xy", load: loader)
    let (ra, rb) = try await (a, b)
    self.equal(ra, "cba")
    self.equal(rb, "yx")
    self.equal(await probe.peak, 2)
    self.equal(await probe.loads.sorted(), ["abc", "xy"])
    self.equal(await cache.cachedKeys(), ["abc", "xy"])
}

test("a failed load is not cached and the next request tries again") {
    let cache = LoadingCache()
    let probe = Probe()
    do {
        _ = try await cache.value(for: "k") { key in
            await probe.enter(key)
            throw Boom()
        }
        self.expect(false, "expected Boom to be thrown")
    } catch let error as Boom {
        self.equal(error, Boom())
    }
    self.equal(await cache.cachedKeys(), [])
    let v = try await cache.value(for: "k") { key in
        await probe.enter(key)
        return "ok"
    }
    self.equal(v, "ok")
    self.equal(await probe.loads, ["k", "k"])
    self.equal(await cache.cachedKeys(), ["k"])
}

test("every waiter of a failing shared load gets the error") {
    let cache = LoadingCache()
    let failures = await withTaskGroup(of: Bool.self) { group in
        for _ in 0..<5 {
            group.addTask {
                do {
                    _ = try await cache.value(for: "bad") { _ in
                        try await Task.sleep(for: .milliseconds(10))
                        throw Boom()
                    }
                    return false
                } catch {
                    return error is Boom
                }
            }
        }
        var count = 0
        for await failed in group where failed { count += 1 }
        return count
    }
    self.equal(failures, 5)
    self.equal(await cache.cachedKeys(), [])
}

test("the empty key is a key like any other") {
    let cache = LoadingCache()
    self.equal(try await cache.value(for: "") { _ in "empty" }, "empty")
    self.equal(try await cache.value(for: "") { _ in "other" }, "empty")
    self.equal(await cache.cachedKeys(), [""])
}

test("two hundred keys requested three times each load exactly once per key") {
    let cache = LoadingCache()
    let probe = Probe()
    try await withThrowingTaskGroup(of: Void.self) { group in
        for _ in 0..<3 {
            for i in 0..<200 {
                group.addTask {
                    let v = try await cache.value(for: "key\(i)") { key in
                        await probe.enter(key)
                        try await Task.sleep(for: .milliseconds(1))
                        await probe.leave()
                        return "\(key)!"
                    }
                    if v != "key\(i)!" { throw Boom() }
                }
            }
        }
        try await group.waitForAll()
    }
    self.equal(await probe.loads.count, 200)
    self.equal(Set(await probe.loads).count, 200)
    self.equal(await cache.cachedKeys().count, 200)
}
