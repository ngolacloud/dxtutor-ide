  "A variable, because the score will change. It starts at 10.",
  "",
  "`print` accepts several values of different types and puts spaces between them.",
  "Shows the variable's current value, 10.",
  "",
  "Reads `score` (10), adds 5, and stores 15 back into `score`.",
  "Shorthand for `score = score + 20`, so `score` becomes 35.",
  "Shorthand for `score = score - 3`, so `score` becomes 32.",
  "Prints the latest value, 32.",
  "",
  "A decimal literal, so the inferred type is `Double`.",
  "`true` is a `Bool` literal, so the inferred type is `Bool`.",
  "Mixes a `Double` and a `Bool` in one `print`."
]
explanation = '''
The program printed `Ada was born in 1815`, `starting score: 10`, `final score: 32` and
`pi is about 3.14159 and learning is true`. Only `score` was declared with `var`, so only
it could change: 10 became 15, then 35, then 32. Had you written `name = "Grace"`, the
compiler would have refused with `cannot assign to value: 'name' is a 'let' constant`.
'''

