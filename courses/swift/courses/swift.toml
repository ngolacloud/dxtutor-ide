instructions = '''
## Your turn

Implement `parseCSV`:

```swift
func parseCSV(_ text: String) throws -> [[String: String]]
```

The first non-empty line is the **header**; each following non-empty line is a **record**.
Return one dictionary per record that maps each header name to that record's field, in
input order.

Rules:

- Lines end with `\n`, `\r\n` or `\r`. Completely empty lines are skipped.
- Fields are separated by commas and kept **exactly** as written: no trimming. An empty
  field is `""`.
- A field may be wrapped in double quotes. Inside quotes a comma is an ordinary character,
  and two quotes `""` stand for one `"` character. Quoted fields never span lines.
