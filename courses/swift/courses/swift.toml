prompt = '''
Write a generic `largest` that works for `Int`, `String` and `Double` arrays and returns
`nil` for an empty one, then print the results through a generic `describe` helper.

**Why:** one function, checked once, replaces a family of copy-pasted versions, and the
constraint documents exactly what the function needs from its type.
'''
target = '''
func largest<T: Comparable>(_ items: [T]) -> T? {
    guard var best = items.first else { return nil }
    for item in items.dropFirst() where item > best {
        best = item
    }
    return best
}

func describe<T: CustomStringConvertible>(_ value: T?) -> String {
    value.map { $0.description } ?? "none"
}

print(describe(largest([3, 41, 7, 41, 12])))
print(describe(largest(["pear", "apple", "zucchini", "fig"])))
print(describe(largest([2.5, -1.0])))
print(describe(largest([Int]())))
'''
