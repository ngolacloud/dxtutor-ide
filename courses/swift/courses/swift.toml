[unit.step.gabarito]
solution = '''
/// A FIFO queue stored in a growable ring buffer: O(1) amortized enqueue,
/// O(1) dequeue, value semantics like Array.
struct RingQueue<Element> {
    private var slots: [Element?] = []
    private var head = 0
    private(set) var count = 0

    init() {}

    var isEmpty: Bool { count == 0 }

    /// The front element, without removing it.
    func peek() -> Element? {
        isEmpty ? nil : slots[head]
    }

    /// Adds `element` at the back.
    mutating func enqueue(_ element: Element) {
        if count == slots.count {
            grow()
        }
        slots[(head + count) % slots.count] = element
        count += 1
    }

    /// Removes and returns the front element, or nil when the queue is empty.
    mutating func dequeue() -> Element? {
        guard count > 0 else { return nil }
        let element = slots[head]
        slots[head] = nil
        head = (head + 1) % slots.count
        count -= 1
        return element
    }

    /// The elements from front to back.
    var elements: [Element] {
        (0..<count).map { slots[(head + $0) % slots.count]! }
    }

    /// Doubles the capacity and unrolls the ring so the front is at index 0.
    private mutating func grow() {
        var bigger = [Element?](repeating: nil, count: max(4, slots.count * 2))
        for i in 0..<count {
            bigger[i] = slots[(head + i) % slots.count]
        }
        slots = bigger
        head = 0
    }
}
'''
time = "O(1) dequeue/peek, amortized O(1) enqueue"
space = "O(n)"
justification = '''
`dequeue` and `peek` read one slot and update `head` and `count` with a modulo, so they are
**O(1)**. `enqueue` is O(1) when there is a free slot. When the ring is full it calls `grow()`,
which copies all *k* elements into an array of twice the capacity, O(k).

The doubling makes that rare: after a grow to capacity 2k, at least k more enqueues happen
before the next grow. Charging each copy to those cheap enqueues gives a constant amount of
extra work per enqueue, so any sequence of *m* operations costs **O(m)** in total, and
`enqueue` is **amortized O(1)**. Equivalently, the copies over the queue's lifetime are
4 + 8 + 16 + ... + n < 2n.

Space is **O(n)** for *n* elements: the capacity is at most twice the largest size the queue
has reached. Dequeued slots are set back to `nil` so the queue does not keep objects alive
that it no longer contains. `elements` is O(n), as it must be to build an array of every
element.

Compare a queue built on `removeFirst()`: each dequeue shifts every remaining element, so
draining 200,000 elements moves about 2 × 10^10 of them, which takes seconds. Because the
storage is an `Array` inside a struct, copying a `RingQueue` shares the buffer until one copy
is mutated (copy-on-write), which gives value semantics at no extra cost.
'''

