    self.equal(isPalindrome("abba"), true)
}
test("not palindromes") {
    self.equal(isPalindrome("swift"), false)
    self.equal(isPalindrome("ab"), false)
}
test("case is ignored") {
    self.equal(isPalindrome("Racecar"), true)
    self.equal(isPalindrome("NooN"), true)
}
test("empty string") { self.equal(isPalindrome(""), true) }
test("single character") { self.equal(isPalindrome("x"), true) }
test("spaces are not ignored") { self.equal(isPalindrome("nurses run"), false) }
test("accented letters") {
    self.equal(isPalindrome("Été"), true)
    self.equal(isPalindrome("été!"), false)
}
test("combining accents stay attached") {
    self.equal(isPalindrome("e\u{301}te\u{301}"), true)
    self.equal(isPalindrome("e\u{301}e"), false)
}
test("emoji") {
    self.equal(isPalindrome("🐦x🐦"), true)
    self.equal(isPalindrome("\u{1F1F5}\u{1F1F9}a\u{1F1F5}\u{1F1F9}"), true)
}
test("long palindrome") {
    let half = String(repeating: "ab", count: 5000)
    self.equal(isPalindrome(half + String(half.reversed())), true)
    self.equal(isPalindrome(half + "c"), false)
}
'''

[unit.step.gabarito]
solution = '''
// Return true when `text` reads the same forwards and backwards, ignoring case.
// Compare whole Characters (what a reader sees as one letter), not bytes.
func isPalindrome(_ text: String) -> Bool {
    let lower = text.lowercased()
    return lower == String(lower.reversed())
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
`lowercased()` walks the `n` characters once and builds a copy, `reversed()` walks them once
more in the other direction while `String(...)` builds a second copy, and `==` compares the
two strings with at most one more pass. A fixed number of linear passes is **O(n)** time,
where `n` is the length of the text. The two copies each hold `n` characters, so the extra
space is **O(n)**.

Correctness comes from reversing `Character`s. `reversed()` on a `String` steps through
grapheme clusters, so `e` followed by its combining accent moves as one unit and a flag
emoji stays whole. Reversing the `utf8` bytes instead would split multi-byte letters and
produce invalid text. A two-index version that compares `text[i]` with `text[j]` while
moving inwards could avoid the reversed copy (still O(n) time, O(1) extra after lowercasing),
but it needs `String.Index`, which comes later in the course.
'''

[[unit]]
id = "sw-u04-control-flow"
title = "Making decisions: if, switch & guard"
level = "basic"
difficulty = 4
intro = '''
So far every line of your programs ran, in order. Now your code starts choosing. You will
branch with `if` and `else`, match values against patterns and ranges with Swift's
exhaustive `switch`, and leave a function early with `guard` when its input is not usable.
'''
concepts = '''
## The idea

Real programs react to their data: give a discount *if* the customer is a member, print a
different message *depending on* the score. This is **control flow**: deciding which
statements run. Every decision rests on a **condition**, an expression whose value is a
`Bool`, either `true` or `false`.

Conditions are built with **comparison operators** (`==`, `!=`, `<`, `<=`, `>`, `>=`) and
combined with **logical operators**: `&&` (and), `||` (or) and `!` (not). `&&` and `||`
**short-circuit**: if the left side already decides the answer, the right side is never
evaluated.

## How Swift does it

`if` runs a block only when its condition is `true`; `else if` and `else` add alternatives.
No parentheses are needed around the condition, but the braces are always required.

```swift
if speed > 120 {
    print("too fast")
} else if speed < 40 {
    print("too slow")
} else {
    print("fine")
}
```

`switch` compares one value against a list of **patterns** and runs the first case that
matches. A case can list several values, a **range** (`1...5` includes 5, `1..<5` stops
before it), a **tuple** with `_` as a wildcard, or bind values with `let` and filter them
with `where`. Once a case finishes, the `switch` ends; there is no falling through to the
next case.

**`guard`** states what must be true to continue. If the condition is false, its `else`
block runs and must leave the current scope (with `return`, for example). That keeps the
main path of a function unindented and puts the error cases first.

`if` and `switch` can also be **expressions** that produce a value:

```swift
let label = if count == 1 { "item" } else { "items" }
```

## What is special or tricky

- **Conditions must be `Bool`.** `if count { ... }` with an `Int` fails with
  `type 'Int' cannot be used as a boolean; test for '!= 0' instead`.
- **`switch` must be exhaustive.** Every possible value needs a case, or the compiler
  reports `switch must be exhaustive`. For numbers and strings that means a `default`.
- **Every case needs a statement.** An empty case fails with `'case' label in a 'switch'
  must have at least one executable statement`; write `break` if a case should do nothing.
- **`guard` must exit.** Its `else` block may not simply continue:
  `'guard' body must not fall through, consider using a 'return' or 'throw' to exit the
  scope`.
- **`=` is not `==`.** `=` assigns and `==` compares; using `=` in a condition is an error.

## What you will practise

You will chain `if`/`else if`/`else` with logical operators, write `switch` statements over
ranges, characters and tuples, and use `guard` for early exits inside a function. The
challenge turns a score into a letter grade, with careful attention to the boundaries.
'''

[[unit.step]]
kind = "concept"
id = "sw-u04-c1-branching"
title = "Conditions, branches and patterns"
points = 5
difficulty = 4
intro = '''
A branch is a fork in the path the processor follows through your program: it evaluates a
Boolean condition and jumps to one block or another. Swift adds pattern matching on top, so
a single `switch` can test ranges, combinations and conditions, and the compiler proves
that no possible value is forgotten.
'''
body = '''
## if, else if, else

The conditions are checked from the top, and only the **first** true one runs its block:

```swift
let hour = 14
if hour < 12 {
    print("Good morning")
} else if hour < 18 {
    print("Good afternoon")
} else {
    print("Good evening")
}
```

`hour < 12` is false, `hour < 18` is true, so only `Good afternoon` prints. Combine
conditions with `&&`, `||` and `!`.

## switch and patterns

```swift
switch hour {
case 0..<12:
    print("morning")
case 12, 13:
    print("lunch time")
case let h where h >= 18:
    print("evening, hour \(h)")
default:
    print("afternoon")
}
```

- A **range** pattern matches every value inside it.
- A comma lists several values for one case.
- `case let h where ...` binds the value to a name and adds an extra condition.
- `default` catches everything else, which makes the `switch` **exhaustive**.

## guard: leave early

```swift
func half(of n: Int) -> Int {
    guard n % 2 == 0 else {
        return 0
    }
    return n / 2
}
```

Read `guard` as "make sure that ... otherwise leave". The happy path stays at the left
margin, and the compiler checks that the `else` block really exits.
'''

