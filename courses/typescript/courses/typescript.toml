[[unit.step]]
kind = "challenge"
id = "ts-u03-x1-mask-email"
title = "Implement maskEmail"
points = 20
difficulty = 3
entry = "maskEmail"
intro = '''
Masking personal data before showing or logging it is a common, practical string task. It
combines **searching** (find where the domain starts), **slicing** (cut the string into
pieces) and **building** (glue a new string together), all without ever modifying the
original.
'''
instructions = '''
## Your turn

Implement the function `maskEmail`:

```ts
export function maskEmail(email: string): string
```

An email has a *local part* before the `@` and a *domain* after it. Keep the first
character of the local part, replace **every other character of the local part** with `*`,
and keep the `@` and the domain unchanged. The number of `*` must equal the number of
characters you hide.

If the string contains no `@`, or the `@` is the very first character, return it unchanged.
You may assume there is at most one `@`.

Examples:

- `maskEmail("ada@example.com")` → `"a**@example.com"`
- `maskEmail("grace.hopper@navy.mil")` → `"g***********@navy.mil"`
- `maskEmail("x@y.io")` → `"x@y.io"`
- `maskEmail("not-an-email")` → `"not-an-email"`

**Hint:** `indexOf("@")` tells you where the local part ends. `slice` and `repeat` do the
rest.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
