 * Resolve with the results in input order. Reject with a RangeError for a bad limit,
 * or with the first task error (and start no further tasks).
 */
export async function mapLimit<T, R>(
  items: readonly T[],
  limit: number,
  fn: (item: T, index: number) => Promise<R>,
): Promise<R[]> {
  throw new Error("not implemented");
}
'''
tests = '''
const t_sleep = (ms: number): Promise<void> => new Promise((resolve) => setTimeout(resolve, ms));
let t_finished = false;
process.on("exit", () => {
