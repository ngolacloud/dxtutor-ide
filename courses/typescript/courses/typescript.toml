dxt.test("objects that are already frozen still get their children frozen", () => {
  const inner = { n: 1 };
  const outer = Object.freeze({ inner });
  deepFreeze(outer);
  dxt.check(Object.isFrozen(inner), "do not stop at an object that was frozen before");
});

dxt.test("large and moderately deep inputs", () => {
  const wide: Record<string, { i: number }> = {};
  for (let i = 0; i < 20_000; i++) wide["k" + i] = { i };
  let deep: { next?: object } = {};
  const root = deep;
  for (let i = 0; i < 500; i++) {
    const next = {};
    deep.next = next;
    deep = next;
  }
  const start = performance.now();
  deepFreeze({ wide, root });
  const elapsed = performance.now() - start;
  dxt.check(Object.isFrozen(wide["k19999"]), "the last wide child was not frozen");
  dxt.check(Object.isFrozen(deep), "the deepest object was not frozen");
  dxt.check(elapsed < 2000, "deepFreeze should be linear in the size of the graph");
});
'''

[unit.step.gabarito]
solution = '''
// Functions stay callable; any other object is mapped key by key. On arrays and tuples a
// homomorphic mapped type produces readonly arrays and readonly tuples.
export type DeepReadonly<T> = T extends (...args: never[]) => unknown
  ? T
  : T extends object
    ? { readonly [K in keyof T]: DeepReadonly<T[K]> }
    : T;

export function deepFreeze<T>(value: T): DeepReadonly<T> {
  const seen = new WeakSet<object>();
  const stack: unknown[] = [value];
  while (stack.length > 0) {
    const current = stack.pop();
    if (typeof current !== "object" || current === null || seen.has(current)) continue;
    seen.add(current);
    Object.freeze(current);
    for (const child of Object.values(current)) stack.push(child);
  }
  // The loop above froze every reachable object, so the readonly view is now accurate.
  return value as DeepReadonly<T>;
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let **n** be the number of reachable objects plus the number of property values they hold. Each
object enters the `seen` set once; when it is popped again (through a cycle or a shared
reference) the `seen.has` check discards it in O(1). Every property value is pushed onto the stack
exactly once, when its owner is first visited, so the loop does a constant amount of work per
object and per property: **O(n)** time.

The `WeakSet` holds at most one entry per object and the explicit stack holds at most one entry
per property value, so the extra space is **O(n)**. Using an explicit stack instead of recursion
also means a very deep chain cannot overflow the call stack. Checking `Object.isFrozen` instead of
`seen` would be wrong twice over: it skips the children of an object frozen earlier, and it would
not stop a cycle made of unfrozen objects until they were frozen.

The type is checked at compile time only and costs nothing at run time. Because the mapped type is
homomorphic (`[K in keyof T]` with `T` a type parameter), applying it to `string[]` yields
`readonly DeepReadonly<string>[]`, so arrays and tuples become readonly without a special case.
'''


[[unit]]
id = "ts-u17-type-level"
title = "Template literal types, satisfies, brands and predicates"
level = "advanced"
difficulty = 23
intro = '''
This unit is about making the compiler know more than "it is a string". You will describe the
shape of strings with template literal types, check objects against a type without losing their
precise shape using `satisfies`, and connect run-time checks to types with type predicates and
assertion functions. The challenge combines them into a branded `Email` type that only a
validating parser can produce.
'''
concepts = '''
## The idea

Many bugs are values of the right primitive type that mean the wrong thing: a user id passed
where an order id was expected, `"12"` where `"12px"` was required, an email address that was
never validated. TypeScript can encode more of that meaning in types, so the mistake becomes a
compile error. Four tools help:

- **Template literal types** describe the shape of a string: `` `${number}px` `` or
  `` `on${string}` ``.
- **`satisfies`** checks that a value fits a type while keeping the value's own, more precise
  inferred type.
- **Type predicates** (`x is T`) and **assertion functions** (`asserts x is T`) let a run-time
  check teach the compiler something.
- **Branded types** attach a compile-time-only tag to a primitive so that only trusted code can
  create one.

## How TypeScript does it

Template literal types use the same backtick syntax as template strings, but with types inside.
Combined with a union they multiply out, and with key remapping (`as`) they rename keys:

```ts
type Size = "sm" | "lg";
type ClassName = `btn-${Size}`; // "btn-sm" | "btn-lg"
type Getters<T> = { [K in keyof T & string as `get${Capitalize<K>}`]: () => T[K] };
```

An annotation `const x: T = ...` replaces the inferred type with `T`. `satisfies` only checks:

```ts
const sizes = { sm: 8, lg: 16 } satisfies Record<string, number>;
sizes.sm; // still known: the keys are "sm" | "lg", not any string
```

A predicate is a function returning `boolean` whose return type says what `true` means:

```ts
function isNumberArray(v: unknown): v is number[] {
  return Array.isArray(v) && v.every((x) => typeof x === "number");
}
```

A brand intersects a primitive with a property that no real value has. A `unique symbol`
declared with `declare` exists only for the compiler:

```ts
declare const userIdBrand: unique symbol;
type UserId = number & { readonly [userIdBrand]: true };
```

A plain `number` is not assignable to `UserId`, but a `UserId` is still usable as a number.

## What is special or tricky

- **Predicates are trusted, not verified.** If `isNumberArray` returns `true` for a string,
  `tsc` believes it anyway. The body of a predicate is the one place you must get exactly right.
- **Brands are erased.** At run time a `UserId` is a plain number. The only safe way to make one
  is a function that validates and then casts, once, in one place.
- **An assertion function needs an explicit type.** Calling `asserts` through an arrow function
  stored in an unannotated `const` fails with *Assertions require every name in the call target
  to be declared with an explicit type annotation*. Use a `function` declaration.
- **Annotation widens, `satisfies` does not.** Annotating a config with `Record<string, Route>`
  makes every key a `string`, so typos in lookups are no longer caught. Prefer `satisfies`
  (often `as const satisfies`) for literal configuration objects.
- **`as` is not validation.** `"hello" as Email` compiles. Casting raw input skips every rule;
  keep casts inside the parser.

## What you will practise

You will build endpoint and event-handler names from template literal types, check a palette and
a route table with `satisfies`, and filter parsed JSON with a predicate and an assertion
function. The challenge is a validating parser that returns a branded `Email`.
'''

[[unit.step]]
kind = "concept"
id = "ts-u17-c1-precise-types"
title = "Precise types for strings and checks"
points = 5
difficulty = 23
intro = '''
A type system can say more than "string" or "number". Encoding the meaning of a value in its type
moves a whole class of mistakes from run time, where users find them, to compile time.
'''
body = '''
## Strings with a shape

```ts
type Hex = `#${string}`;
type Event = `${"click" | "key"}:${"down" | "up"}`; // 4 members
```

A template literal type is a pattern over strings. Unions inside it are multiplied out, and the
intrinsic helpers `Uppercase`, `Lowercase`, `Capitalize` and `Uncapitalize` transform them.

## Checking without widening

```ts
const ports = { http: 80, https: 443 } satisfies Record<string, number>;
```

`satisfies` reports an error if the value does not fit, but `ports` keeps its precise type, with
the keys `http` and `https`. An annotation would have replaced it with `Record<string, number>`.

## Teaching the compiler with a check

```ts
function isString(v: unknown): v is string {
  return typeof v === "string";
}
function assertPositive(n: number): asserts n {
  if (n <= 0) throw new RangeError("must be positive");
}
```

After `if (isString(x))`, `x` is a `string` inside the branch. An assertion function narrows
everything after the call, because returning normally means the check passed.

## Brands: proof in the type

```ts
type Email = string & { readonly __brand: "Email" };
```

No real string has a `__brand` property, so the only way to get an `Email` is a cast. Put that
cast in one validating function and every `Email` in the program carries proof that it was
checked. All of this is erased by Node: at run time an `Email` is just a string.
'''

