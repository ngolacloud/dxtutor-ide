instructions = '''
## Your turn

Write a type and a function that agree with each other:

```ts
export type DeepReadonly<T> = /* ... */;
export function deepFreeze<T>(value: T): DeepReadonly<T> { /* ... */ }
```

**The type.** `DeepReadonly<T>` makes every property readonly at every depth, and every array a
readonly array. Primitives stay as they are, and functions are left unchanged. For example,
`DeepReadonly<{ user: { name: string; tags: string[] } }>` must reject `x.user.name = "B"` and
`x.user.tags.push("y")`, but still let you read `x.user.tags[0]` as a `string`.

**The function.** `deepFreeze` freezes `value` and every object or array reachable from it
through its property values, with `Object.freeze`, **in place**, and returns the same reference
it received.

- Primitives, `null` and `undefined` are returned unchanged.
- The graph may contain **shared objects and cycles** (`a.self = a`). Each object must be
  visited once; the function must terminate.
- Objects with thousands of properties must be handled quickly.
- Only plain objects and arrays are tested.

Examples:

- `deepFreeze(5)` returns `5`.
- After `const o = deepFreeze({ inner: { n: 1 } })`, both `Object.isFrozen(o)` and
  `Object.isFrozen(o.inner)` are `true`, and `deepFreeze` returned `o` itself.

**Hint:** a mapped type over `keyof T` keeps arrays and tuples as arrays (and makes them
readonly) when `T` is a type parameter. At run time, keep a `WeakSet` of objects already seen.
Your code is also type-checked, so the readonly rules above are tested by `tsc`.

Hidden tests decide correctness.
'''
