[[unit.step]]
kind = "challenge"
id = "ts-u09-x1-evaluate"
title = "Evaluate an expression tree"
points = 30
difficulty = 9
entry = "evaluate"
intro = '''
Compilers and calculators represent a program as an abstract syntax tree (AST): each node is a
number, or an operator whose children are smaller trees. A discriminated union describes the
node kinds exactly, and a recursive function that switches on the tag evaluates the tree in one
visit per node.
'''
instructions = '''
## Your turn

Implement `evaluate`, which computes the value of an arithmetic expression tree. The type is
given in the starter:

```ts
export type Expr =
  | { kind: "num"; value: number }
  | { kind: "neg"; operand: Expr }
  | { kind: "bin"; op: "+" | "-" | "*" | "/"; left: Expr; right: Expr }
  | { kind: "max"; args: readonly Expr[] };

export function evaluate(e: Expr): number
```

Rules:

- `num` evaluates to its `value`.
- `neg` evaluates to the negation of its operand.
- `bin` applies `op` to the values of `left` and `right`. Division is ordinary floating-point
  division, but if the right side evaluates to `0`, throw a `RangeError("division by zero")`.
- `max` evaluates to the largest of its arguments. A `max` with no arguments has no value:
  throw a `RangeError`.
- Handle every `kind` with narrowing; finish your `switch` with an exhaustiveness check on
  `never`.

Example: the tree for `max(2, 3) * -(4 - 10)`

```ts
evaluate({
  kind: "bin", op: "*",
  left: { kind: "max", args: [{ kind: "num", value: 2 }, { kind: "num", value: 3 }] },
  right: { kind: "neg", operand: {
    kind: "bin", op: "-", left: { kind: "num", value: 4 }, right: { kind: "num", value: 10 },
  } },
}); // 18
```

The tree already encodes precedence, so there is nothing to parse. Trees may contain tens of
thousands of nodes, and `max` may have thousands of arguments.

**Hint:** recursion mirrors the tree: the value of a node is computed from the values of its
children. Avoid `Math.max(...values)` on huge arrays; a loop or `reduce` is safer.

Hidden tests decide correctness.
'''
starter = '''
export type Expr =
  | { kind: "num"; value: number }
  | { kind: "neg"; operand: Expr }
  | { kind: "bin"; op: "+" | "-" | "*" | "/"; left: Expr; right: Expr }
  | { kind: "max"; args: readonly Expr[] };

// Compute the value of the tree. Throw a RangeError on division by zero and on a
// `max` with no arguments. Switch on `e.kind` and check exhaustiveness with `never`.
export function evaluate(e: Expr): number {
  throw new Error("not implemented");
}
'''
tests = '''
const t_num = (value: number): Expr => ({ kind: "num", value });
const t_neg = (operand: Expr): Expr => ({ kind: "neg", operand });
const t_bin = (op: "+" | "-" | "*" | "/", left: Expr, right: Expr): Expr => ({ kind: "bin", op, left, right });
const t_max = (...args: Expr[]): Expr => ({ kind: "max", args });

dxt.test("a number is its own value", () => {
  dxt.equal(evaluate(t_num(42)), 42);
  dxt.equal(evaluate(t_num(-2.5)), -2.5);
});

dxt.test("the four operators", () => {
  dxt.equal(evaluate(t_bin("+", t_num(7), t_num(5))), 12);
  dxt.equal(evaluate(t_bin("-", t_num(7), t_num(5))), 2);
  dxt.equal(evaluate(t_bin("*", t_num(7), t_num(5))), 35);
  dxt.equal(evaluate(t_bin("/", t_num(7), t_num(2))), 3.5);
});

dxt.test("negation and nesting follow the tree", () => {
  dxt.equal(evaluate(t_neg(t_num(3))), -3);
  dxt.equal(evaluate(t_neg(t_neg(t_num(3)))), 3);
  // (1 + 2) * (3 - 10) and 1 + 2 * 3 - 10 differ only in shape
  dxt.equal(evaluate(t_bin("*", t_bin("+", t_num(1), t_num(2)), t_bin("-", t_num(3), t_num(10)))), -21);
  dxt.equal(evaluate(t_bin("-", t_bin("+", t_num(1), t_bin("*", t_num(2), t_num(3))), t_num(10))), -3);
});

dxt.test("max of one, several, negative and duplicate arguments", () => {
  dxt.equal(evaluate(t_max(t_num(9))), 9);
  dxt.equal(evaluate(t_max(t_num(-4), t_num(-1), t_num(-7))), -1);
  dxt.equal(evaluate(t_max(t_num(5), t_bin("+", t_num(2), t_num(3)), t_num(1))), 5);
});

dxt.test("the example from the instructions", () => {
  const t_tree = t_bin("*", t_max(t_num(2), t_num(3)), t_neg(t_bin("-", t_num(4), t_num(10))));
  dxt.equal(evaluate(t_tree), 18);
});

dxt.test("division by zero throws a RangeError", () => {
  dxt.throws(() => evaluate(t_bin("/", t_num(1), t_num(0))), "1 / 0 must throw");
  dxt.throws(() => evaluate(t_bin("/", t_num(1), t_bin("-", t_num(2), t_num(2)))), "1 / (2 - 2) must throw");
  let t_kind = "";
  try {
    evaluate(t_bin("/", t_num(5), t_num(0)));
  } catch (e) {
    t_kind = e instanceof RangeError ? "RangeError" : "other";
  }
  dxt.equal(t_kind, "RangeError");
  dxt.equal(evaluate(t_bin("/", t_num(0), t_num(4))), 0);
});

dxt.test("an empty max throws a RangeError", () => {
  let t_kind = "none";
  try {
    evaluate(t_bin("+", t_num(1), t_max()));
  } catch (e) {
    t_kind = e instanceof RangeError ? "RangeError" : "other";
  }
  dxt.equal(t_kind, "RangeError");
});

dxt.test("large trees", () => {
  const t_balanced = (depth: number): Expr => (depth === 0 ? t_num(1) : t_bin("+", t_balanced(depth - 1), t_balanced(depth - 1)));
  dxt.equal(evaluate(t_balanced(16)), 65536);
  let t_deep: Expr = t_num(5);
  for (let i = 0; i < 2000; i++) t_deep = t_neg(t_deep);
  dxt.equal(evaluate(t_deep), 5);
  const t_args: Expr[] = [];
  for (let i = 0; i < 200_000; i++) t_args.push(t_num((i * 7919) % 100_003));
  dxt.equal(evaluate({ kind: "max", args: t_args }), 100_002);
});
'''

[unit.step.gabarito]
solution = '''
export type Expr =
  | { kind: "num"; value: number }
  | { kind: "neg"; operand: Expr }
  | { kind: "bin"; op: "+" | "-" | "*" | "/"; left: Expr; right: Expr }
  | { kind: "max"; args: readonly Expr[] };

function assertNever(x: never): never {
  throw new Error(`unexpected expression: ${JSON.stringify(x)}`);
}

export function evaluate(e: Expr): number {
  switch (e.kind) {
    case "num":
      return e.value;
    case "neg":
      return -evaluate(e.operand);
    case "bin": {
      const left = evaluate(e.left);
      const right = evaluate(e.right);
      switch (e.op) {
        case "+":
          return left + right;
        case "-":
          return left - right;
        case "*":
          return left * right;
        case "/":
          if (right === 0) throw new RangeError("division by zero");
          return left / right;
      }
    }
    case "max": {
      if (e.args.length === 0) throw new RangeError("max needs at least one argument");
      let best = -Infinity;
      for (const arg of e.args) best = Math.max(best, evaluate(arg));
      return best;
    }
    default:
      return assertNever(e);
  }
}
'''
time = "O(n)"
space = "O(h)"
justification = '''
Let n be the number of nodes in the tree and h its height. `evaluate` is called exactly once
per node: each call handles its own node in O(1) work (one `switch`, one arithmetic operation or
one comparison per `max` argument) and recurses into each child once. So the running time is
**O(n)**. A `max` with k arguments does k comparisons, but those k children are k of the n
nodes, so the total stays linear.

The extra space is the recursion stack, one frame per node on the path from the root to the
node currently being evaluated, so **O(h)**. That is O(log n) for a balanced tree and O(n) for a
degenerate chain such as 2,000 nested negations. Folding `max` with a loop keeps it O(1) extra
space; `Math.max(...values)` would first allocate an O(k) array and then pass k arguments on the
call stack, which throws `RangeError: Maximum call stack size exceeded` for very large k. The
outer `switch` ends in `assertNever`, so adding a fifth node kind is a compile error until it
is handled.
'''

[[unit]]
id = "ts-u10-classes"
title = "Classes"
level = "intermediate"
difficulty = 10
intro = '''
A class bundles data with the operations that keep that data valid, and hands out new objects
built to the same plan. This unit covers TypeScript's additions to JavaScript classes: typed
fields, `private`/`protected`/`readonly`, parameter properties, `implements`, abstract classes
and getters. The challenge is a classic immutable value type, an exact fraction.
'''
concepts = '''
## The idea

So far, data (objects) and behaviour (functions) have lived apart. A **class** puts them
together: it describes the **state** each object carries and the **methods** that read and
change it. `new` builds an **instance**, running the **constructor** to set up its state.
The real benefit is **encapsulation**: if only the class's own methods can change the state,
then the class alone is responsible for keeping it valid, such as a balance that never goes
negative or a fraction that is always in lowest terms. Such a rule is called an **invariant**.

## How TypeScript does it

JavaScript already has classes; TypeScript adds types and visibility. Every field is declared
with a type and, under `--strict`, must be initialised either inline or in the constructor
(otherwise TS2564, "Property 'x' has no initializer").

```ts
class Counter {
  private count = 0;                     // only Counter's methods can touch it
  constructor(readonly name: string) {}  // a parameter property: declares and assigns

  increment(): number {
    return ++this.count;
  }

  get value(): number {                  // read like a property: counter.value
    return this.count;
  }
}
```

- `public` (the default), `private` and `protected` (visible to subclasses) control access
  at compile time. JavaScript's own `#field` syntax is private **at run time** too.
- `readonly` fields can be assigned only in their declaration or in the constructor.
- `static` members belong to the class itself, not to each instance.
- `class Circle implements Shape` asks the compiler to check that the class has everything the
  interface requires. It adds nothing; it is a checked promise.
- An `abstract class` cannot be instantiated; it shares code with subclasses (`extends`) and
  declares `abstract` methods that each subclass must implement. `super(...)` calls the parent
  constructor and `super.method()` the parent's version of a method.

## Pitfalls

- **`private` is erased.** `(account as any).balance` or `account["balance"]` still reach it
  at run time. Use `#balance` when the privacy must be real.
- **`this` is lost when a method is detached.** `const inc = counter.increment; inc();` runs
  with `this` undefined and throws a `TypeError`; passing `counter.increment` as a callback has
  the same problem. Pass `() => counter.increment()` instead.
- **Classes are structural too.** Any object with the same public members is assignable to a
  class type, and `instanceof` is the only way to ask "was this made by `new Counter`?".
- **Interfaces can't be `new`-ed or checked with `instanceof`**; only classes exist at run time.
- Forgetting `super(...)` in a subclass constructor is TS2377, and calling `new` on an abstract
  class is TS2511.

## What you will practise

You will write a class with private state and a static counter, implement an interface with
getters and a validating setter, and build a small hierarchy on an abstract base class. The
challenge asks for an immutable `Fraction` whose constructor enforces its invariants.
'''

[[unit.step]]
kind = "concept"
id = "ts-u10-c1-encapsulation"
title = "State, methods and invariants"
points = 5
difficulty = 10
intro = '''
An invariant is a property of an object's state that is always true between method calls, such
as "the balance is never negative". Encapsulation makes invariants enforceable: if every change
goes through a method, each method only has to preserve the rule, and no outside code can break
it.
'''
body = '''
## Constructor, fields, methods

```ts
class Stack {
  private items: number[] = [];

  push(x: number): void {
    this.items.push(x);
  }

  pop(): number {
    const x = this.items.pop();
    if (x === undefined) throw new Error("empty stack");
    return x;
  }

  get size(): number {
    return this.items.length;
  }
}
```

Each instance gets its own `items` array. Methods live once on the class's **prototype** and
reach the instance through `this`. The getter `size` is called without parentheses,
`stack.size`, yet runs code every time.

## Why `private` matters

Because `items` is private, outside code cannot write `stack.items = null`. Only `push` and
`pop` change the array, so reasoning about the stack means reading two short methods, not the
whole program. TypeScript's `private` is checked by the compiler; JavaScript's `#items` is
enforced by the runtime as well.

## Contracts: implements and abstract

An interface describes what callers may rely on; `implements` makes the compiler check that a
class keeps that promise. An `abstract` class goes one step further and shares real code: it can
implement most of an algorithm and leave one or two `abstract` methods for each subclass to fill
in, which is how polymorphism works in TypeScript: callers hold the base type and every object
answers in its own way.
'''

