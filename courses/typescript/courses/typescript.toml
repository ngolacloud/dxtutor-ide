intro = '''
Batch loading is everyday asynchronous work: fetch many records, keep going when some fail, and
report what went wrong. Starting every load at once makes the wall-clock time roughly that of
the slowest load instead of the sum, and handling each failure locally stops one bad item from
discarding all the good ones.
