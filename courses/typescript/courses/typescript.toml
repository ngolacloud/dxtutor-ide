[unit.step.gabarito]
solution = '''
// An exact rational number, always stored in lowest terms with a positive denominator.
// Every operation returns a new Fraction; none modifies an existing one.
export class Fraction {
  readonly numerator: number;
  readonly denominator: number;

  constructor(numerator: number, denominator = 1) {
    if (!Number.isInteger(numerator) || !Number.isInteger(denominator)) {
      throw new RangeError(`not an integer fraction: ${numerator}/${denominator}`);
    }
    if (denominator === 0) throw new RangeError("denominator must not be zero");
    if (numerator === 0) {
      this.numerator = 0;
      this.denominator = 1;
      return;
    }
    const g = Fraction.gcd(numerator, denominator);
    const sign = denominator < 0 ? -1 : 1;
    this.numerator = (sign * numerator) / g;
    this.denominator = Math.abs(denominator) / g;
  }

  private static gcd(a: number, b: number): number {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b !== 0) {
      [a, b] = [b, a % b];
    }
    return a;
  }

  get value(): number {
    return this.numerator / this.denominator;
  }

  add(other: Fraction): Fraction {
    return new Fraction(
      this.numerator * other.denominator + other.numerator * this.denominator,
      this.denominator * other.denominator,
    );
  }

  sub(other: Fraction): Fraction {
    return this.add(new Fraction(-other.numerator, other.denominator));
  }

  mul(other: Fraction): Fraction {
    return new Fraction(this.numerator * other.numerator, this.denominator * other.denominator);
  }

  div(other: Fraction): Fraction {
    if (other.numerator === 0) throw new RangeError("division by zero");
    return new Fraction(this.numerator * other.denominator, this.denominator * other.numerator);
  }

  equals(other: Fraction): boolean {
    return this.numerator === other.numerator && this.denominator === other.denominator;
  }

  compareTo(other: Fraction): number {
    return Math.sign(this.numerator * other.denominator - other.numerator * this.denominator);
  }

  toString(): string {
    return this.denominator === 1 ? `${this.numerator}` : `${this.numerator}/${this.denominator}`;
  }

  static parse(text: string): Fraction {
    const match = /^(-?\d+)(?:\/(-?\d+))?$/.exec(text);
    if (match === null) throw new SyntaxError(`not a fraction: ${JSON.stringify(text)}`);
    const [, num, den] = match;
    return new Fraction(Number(num), den === undefined ? 1 : Number(den));
  }
}
'''
time = "O(log(min(|a|, |b|))) per operation"
space = "O(1)"
justification = '''
Every operation does a constant number of multiplications and then builds one `Fraction`, whose
constructor runs Euclid's algorithm. Each step of `gcd` replaces `(a, b)` with `(b, a % b)`, and
every two steps at least halve the larger value, so it takes **O(log min(|a|, |b|))** iterations.
That is the cost of `add`, `sub`, `mul`, `div` and of the constructor itself. `equals`,
`compareTo`, `value` and `toString` are **O(1)** (for numbers that fit in a double), and
`parse` is O(L) in the length of the text plus one constructor call.

Each operation allocates exactly one new object of constant size, so the extra space is
**O(1)**. Correctness rests on the invariant: because the constructor is the only place a
`Fraction` is born and it always reduces and fixes the sign, two equal numbers always have
identical parts, which makes `equals` a two-field comparison and `compareTo` a single cross
multiplication (valid because both denominators are positive). The `numerator === 0` branch
avoids storing `-0`. One honest limit: products beyond 2^53 lose precision, which a production
version would avoid with `bigint`.
'''

[[unit]]
id = "ts-u11-generics"
title = "Generics"
level = "intermediate"
difficulty = 11
intro = '''
Some code doesn't care what it stores: a stack of numbers and a stack of users work the same
way. Generics let you write that code once while keeping full type information, so a
`Stack<User>` hands back `User`s and not `any`. You will write generic functions, types and
classes, restrict them with `extends`, reach into object types with `keyof`, and finish with a
generic priority queue built on a binary heap.
'''
concepts = '''
## The idea

Many algorithms are independent of the data they move around. Returning the first element,
reversing a list, keeping a queue sorted by priority: the steps are identical for numbers,
strings or orders. Without generics you have two bad options in a typed language. Write the
code once per type, or type it with `any` and lose every check: what comes out is `any`, and a
typo on it compiles happily.

**Generics** are the third option: a function or type takes a **type parameter**, a
placeholder such as `T`, which is filled in at each use. The relationship between input and
output is preserved: put a `string[]` in, get a `string` out.

## How TypeScript does it

```ts
function first<T>(items: readonly T[]): T | undefined {
  return items[0];
}

const n = first([1, 2, 3]);       // T inferred as number, n: number | undefined
const s = first<string>([]);      // T given explicitly
```

Type parameters also work on interfaces, type aliases and classes, can have defaults, and can
be several at once:

```ts
interface Box<T> { value: T }
type Pair<A, B = A> = [A, B];
class Queue<T> { private items: T[] = []; }
```

A **constraint** (`T extends ...`) says what every `T` must have, which in turn lets the body
use it:

```ts
function longest<T extends { length: number }>(a: T, b: T): T {
  return b.length > a.length ? b : a;
}
```

`keyof T` is the union of `T`'s property names, and `T[K]` is the type of property `K`.
Together with `K extends keyof T` they type a property lookup exactly: asking for `"name"`
returns a `string`, asking for `"id"` returns a `number`, and asking for `"phone"` on a type
without it does not compile.

## Pitfalls

- **Generics are erased.** There is no `T` at run time: no `new T()`, no `x instanceof T`, no
  `typeof x === T`. If the code needs to make or compare `T`s, take a function as a parameter
  (a factory or a comparator), as the challenge does.
- **`any` is not a generic.** `function first(items: any[]): any` compiles, but every caller
  loses its types. A type parameter keeps them.
- **Constrain instead of casting.** "Property 'length' does not exist on type 'T'" (TS2339)
  means the body uses something not every `T` has: add `extends { length: number }`, don't write
  `(x as any).length`.
- **A type parameter used only once is a smell.** `function log<T>(x: T): void` gains nothing
  over `x: unknown`.
- `T extends ...` constrains; it does not convert. Arguments that don't fit fail with TS2345.

## What you will practise

You will write generic helpers and let inference fill in the types, build generic types and a
generic class, use constraints and `keyof` for type-safe property access, and implement
`PriorityQueue<T>`, whose ordering comes from a comparator you pass in.
'''

[[unit.step]]
kind = "concept"
id = "ts-u11-c1-type-parameters"
title = "Type parameters"
points = 5
difficulty = 11
intro = '''
Parametric polymorphism, the formal name for generics, means writing code that works uniformly
for every type. The type parameter is a variable at the type level: it is bound at each call,
usually by inference, and it links the types of the inputs to the type of the output.
'''
body = '''
## A function with a type parameter

```ts
function wrap<T>(value: T): T[] {
  return [value];
}

wrap(3);          // number[]
wrap("hi");       // string[]
wrap<boolean>(1); // error: 1 is not a boolean
```

`<T>` declares the parameter; every use of `T` inside the signature refers to the same type.
Most of the time you never write the type argument: TypeScript infers it from the arguments,
exactly as it infers a variable's type from its value.

## Constraints say what T can do

Inside `wrap`, `T` could be anything, so you can only pass it around. To call a method or read a
property you need a constraint:

```ts
function byName<T extends { name: string }>(items: T[]): T[] {
  return [...items].sort((a, b) => (a.name < b.name ? -1 : 1));
}
```

The result is still `T[]`, not `{ name: string }[]`, so callers keep every other property of
their objects. That is the point of a generic: it adds a requirement without forgetting the rest
of the type.

## Behaviour comes in as functions

Because types vanish at run time, a generic container cannot inspect `T` to decide how to order
or compare items. It takes that knowledge as an argument instead, usually a comparator `(a: T,
b: T) => number`, the same convention `Array.prototype.sort` uses.
'''

