run_command = "node --experimental-transform-types main.ts"
intro = '''
Insertion sort grows a sorted prefix one item at a time, shifting larger items right to open a
gap. It is O(n²) in the worst case but O(n) on nearly sorted input, which is why TimSort uses
it for short runs.
'''
prompt = '''
Sort a copy of an array with insertion sort and show that the original is untouched.

**Why:** insertion sort is the simplest correct sort, shows where O(n²) comes from, and the
`readonly` parameter makes "don't modify the input" a compile-time promise.
'''
target = '''
function insertionSort(items: readonly number[]): number[] {
  const a = [...items];
  for (let i = 1; i < a.length; i++) {
    const current = a[i];
    let j = i - 1;
    while (j >= 0 && a[j] > current) {
      a[j + 1] = a[j];
      j--;
    }
    a[j + 1] = current;
  }
  return a;
}

const data = [5, 2, 9, 1, 5, 6];
console.log(insertionSort(data), data);
console.log(insertionSort([]), insertionSort([3]));
'''
