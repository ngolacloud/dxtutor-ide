'''

[unit.step.gabarito]
solution = '''
export function memoize<A extends unknown[], R>(
  fn: (...args: A) => R,
  keyOf: (...args: A) => string = (...args) => JSON.stringify(args),
): (...args: A) => R {
  const cache = new Map<string, R>();
  return (...args: A): R => {
    const key = keyOf(...args);
    if (cache.has(key)) return cache.get(key) as R;
    const result = fn(...args); // if this throws, nothing is stored
    cache.set(key, result);
    return result;
  };
}
'''
time = "O(k)"
space = "O(m)"
justification = '''
Let **k** be the cost of computing the key (for the default key, the size of the JSON text of the
arguments) and **m** the number of distinct keys seen so far. On every call the wrapper computes
the key once and does one `Map.has` and at most one `Map.get` and one `Map.set`, which are O(1) on
average. So a cache hit costs **O(k)**, and a miss costs O(k) plus one call to `fn`. The cache
holds one entry per distinct key, so the space is **O(m)**, and it is never freed, which is the
trade-off of an unbounded memo table.

For the recursive Fibonacci, every `n` from 0 to 70 misses exactly once, and every other call is
a hit, so `fn` runs 71 times instead of roughly 3 × 10¹⁴ times. That is the exponential-to-linear
jump that memoization exists for.

Correctness hinges on three details. `cache.has(key)` distinguishes a cached `undefined` from a
missing entry, which `cache.get(key) ?? ...` or a truthiness check would confuse. The result is
stored only after `fn` returns, so a throw skips `cache.set` and nothing is cached. And the
generic rest tuple `A` means the returned function has `fn`'s exact parameter list, so callers
keep every compile-time check that `(...args: any[]) => any` would have thrown away.
'''

# ── g6-async ────────────────────────────────────────────────────────────

[[unit]]
id = "ts-u20-event-loop"
title = "The event loop: microtasks, macrotasks and timers"
level = "advanced"
difficulty = 26
intro = '''
JavaScript runs your code on a single thread, yet Node.js juggles timers, network replies and
promise callbacks all at once. The trick is the **event loop**, which takes one job at a time
from a set of queues. You will learn the exact order in which those queues are drained, predict
the output of tricky programs, and build a batcher that relies on microtasks.
'''
concepts = '''
## The idea

JavaScript runs on **one thread** with one **call stack**. While a function runs, nothing else
in your program can run: there is no pre-emption. Concurrency comes from the **event loop**, a
loop inside the runtime that repeatedly takes the next piece of work from a queue, runs it to
completion, and moves on. Waiting for a timer or a network reply never blocks the thread; the
runtime parks the callback and queues it when the event happens.

Two kinds of queue matter:

- **Macrotasks** (often just "tasks"): timer callbacks (`setTimeout`, `setInterval`), I/O
  callbacks and `setImmediate`. The loop runs **one** of them at a time.
- **Microtasks**: promise reactions (`.then`, the code after an `await`) and
  `queueMicrotask`. After every task the loop drains the microtask queue **completely**,
  including microtasks queued by other microtasks, before it takes the next task.

The rule of thumb: **synchronous code first, then every microtask, then the next timer**.

## How TypeScript (on Node.js) does it

TypeScript adds no runtime of its own: the types are erased and Node.js runs the JavaScript.
Node's loop goes through **phases**: timers, then I/O polling, then `setImmediate` callbacks
(the "check" phase), then close callbacks, draining microtasks after each callback. Node also
has `process.nextTick`, a queue that runs *before* the promise microtasks.

```ts
setTimeout(() => console.log("timer"), 0);
Promise.resolve().then(() => console.log("microtask"));
console.log("sync");
// sync, microtask, timer
```

`setTimeout(fn, 0)` means "as a new task, no earlier than about 1 ms from now", not "now".
Timers fire in order of their deadline, not in the order you created them.

`await x` splits an async function in two. The part before it runs synchronously; the rest is
queued as a microtask once `x` settles. That is why an `async` function hands control back to
its caller at its first `await`.

## Pitfalls

- **Microtasks can starve the loop.** A promise chain that keeps queuing more microtasks never
  lets a timer or an I/O callback run.
- **Long synchronous work blocks everything.** A 2-second loop delays every timer by 2 seconds:
  the delay of `setTimeout(fn, 10)` is a minimum, never a guarantee.
- **`setTimeout(fn, 0)` versus `setImmediate`** from the main module is a race. Rely on their
  order only inside an I/O or timer callback.
- **ES modules change the top-level order.** In a module (`"type": "module"`, which the tutor
  uses) the top-level code itself runs inside a promise job, so promise callbacks queued there
  run before `process.nextTick` callbacks. Inside a timer callback you see Node's usual order.
- **The types say nothing about timing.** `Promise<void>` does not tell you *when* a callback
  runs, and a promise you forget to `await` compiles fine; if it rejects, Node crashes with an
  unhandled rejection.

## What you will practise

You will print the order of synchronous code, microtasks and timers, compare `nextTick`,
promises and `setImmediate`, and watch two `async` functions interleave at each `await`. The
challenge asks for a batcher that collects the calls made in one synchronous turn and delivers
them together in a single microtask.
'''

[[unit.step]]
kind = "concept"
id = "ts-u20-c1-queues"
title = "One thread, a stack and two queues"
points = 5
difficulty = 26
intro = '''
The event loop is a scheduler for a single thread. It runs one task until the call stack is
empty, drains every pending microtask, and only then picks the next task. Everything in this
unit follows from that one loop.
'''
body = '''
## Run to completion

A task (the script itself, a timer callback, an I/O callback) runs until its call stack is
empty. Only then does the event loop look at its queues again. Nothing interrupts a running
function halfway through.

## Then drain the microtasks

Promise callbacks and `queueMicrotask` callbacks go to the **microtask queue**. As soon as the
stack is empty, the loop runs every microtask in that queue, in order, including any that those
microtasks add. Only when the queue is empty does the loop move on.

```ts
console.log("A");
setTimeout(() => console.log("D"), 0);
queueMicrotask(() => console.log("C"));
console.log("B");
```

This prints `A B C D`: the two synchronous logs, then the microtask, then the timer.

## Then the next macrotask

Timers (`setTimeout`, `setInterval`), `setImmediate` and I/O callbacks are **macrotasks**. Each
one runs to completion and is followed by another microtask drain. A timer's delay is a
*minimum*: the callback cannot run before the delay expires, and it cannot run while other code
is still busy.

## Why it matters

Ordering bugs are among the hardest to spot. A value read after an `await` may already have
changed, and a server stops answering while a long synchronous loop holds the thread. Knowing
the queues turns these mysteries into a predictable sequence you can trace line by line.
'''

