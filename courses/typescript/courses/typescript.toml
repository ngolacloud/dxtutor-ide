[[unit.step]]
kind = "drill"
id = "ts-u07-d2-tuples"
title = "Tuples in, tuples out"
points = 10
difficulty = 7
placeholder_policy = "on_demand"
run_command = "node --experimental-transform-types main.ts"
intro = '''
A tuple is a fixed-length array whose positions have their own types, a record without field
names. Destructuring unpacks it by position, in parameters, in `const` declarations and in
`for...of` loops, so tuples cost almost nothing to use.
'''
prompt = '''
Define labelled tuple types for points and score entries, destructure them in parameters and
loops, and return two values at once from `minMax`.

**Why:** returning a `[min, max]` tuple is the idiomatic way to hand back a small group of
values, and labels make the type self-documenting in editor hints.
'''
target = '''
type Point = [x: number, y: number];
type Entry = [name: string, score: number];

function distance([x1, y1]: Point, [x2, y2]: Point): number {
  return Math.hypot(x2 - x1, y2 - y1);
}

function minMax(values: number[]): [min: number, max: number] {
  let min = values[0];
  let max = values[0];
  for (const v of values) {
    if (v < min) min = v;
    if (v > max) max = v;
  }
  return [min, max];
}

const entries: Entry[] = [["ada", 91], ["alan", 78], ["grace", 85]];
for (const [name, score] of entries) {
  console.log(name.padEnd(6) + String(score));
}

console.log(distance([0, 0], [3, 4]));
const [lo, hi] = minMax(entries.map(([, score]) => score));
console.log("range:", lo, "to", hi);
'''
line_comments = [
  "A labelled tuple: exactly two numbers; the labels only document their meaning.",
