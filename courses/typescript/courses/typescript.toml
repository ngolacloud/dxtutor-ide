intro = '''
Breadth-first search explores a graph level by level: first every cell one step away, then every
cell two steps away, and so on. A FIFO queue produces that order automatically, so the first time
BFS reaches a cell it has found a shortest path to it, in O(V + E) time.
'''
prompt = '''
Find the length of the shortest path from `S` to `E` in a small maze, moving up, down, left or
right and never through `#`.

**Why:** BFS is the queue's signature algorithm, behind route planners, network hops and
"degrees of separation".
'''
target = '''
const maze = [
  "S.#.....",
  ".##.###.",
  "....#...",
  ".##...#E",
];

function shortestPath(rows: string[]): number {
  const dist = rows.map((row) => new Array<number>(row.length).fill(-1));
  const queue: [number, number][] = [[0, 0]];
  dist[0][0] = 0;
  for (let head = 0; head < queue.length; head++) {
    const [r, c] = queue[head];
    if (rows[r][c] === "E") return dist[r][c];
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nr = r + dr;
      const nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= rows.length || nc >= rows[nr].length) continue;
      if (rows[nr][nc] === "#" || dist[nr][nc] !== -1) continue;
      dist[nr][nc] = dist[r][c] + 1;
      queue.push([nr, nc]);
    }
  }
  return -1;
}

console.log("steps from S to E:", shortestPath(maze));
console.log("walled off:", shortestPath(["S#", "#E"]));
'''
