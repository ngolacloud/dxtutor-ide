tests = '''
import * as t_sqlite from "node:sqlite";

const t_EVENTS: Array<[number, number]> = [
  [1, 300], [2, 100], [3, 200], [4, 100],
  [5, 200], [6, 100], [7, 400], [8, 200],
];
const t_ORDERED: Array<[number, number]> = t_EVENTS
  .map(([id, ts]): [number, number] => [ts, id])
  .sort((a, b) => a[0] - b[0] || a[1] - b[1]);

function t_with(fn: (db: t_sqlite.DatabaseSync) => void): void {
  const db = new t_sqlite.DatabaseSync(":memory:");
  try {
    db.exec("CREATE TABLE events (id INTEGER PRIMARY KEY, ts INTEGER NOT NULL, name TEXT)");
    const insert = db.prepare("INSERT INTO events VALUES (?, ?, ?)");
    for (const [id, ts] of t_EVENTS) insert.run(id, ts, `event ${id}`);
    fn(db);
  } finally {
    db.close();
  }
}

function t_walk(db: t_sqlite.DatabaseSync, size: number): Array<[number, number]> {
  const seen: Array<[number, number]> = [];
  let cursor: readonly [number, number] | null = null;
  for (let i = 0; i < 100; i++) {
    const page = nextPage(db, cursor, size);
    if (page.length === 0) return seen;
    dxt.check(page.length <= size, `page longer than ${size}`);
    seen.push(...page);
    cursor = page[page.length - 1];
  }
  throw new Error("pagination never ended");
}

dxt.test("first page", () => {
  t_with((db) => dxt.equal(nextPage(db, null, 3), [[100, 2], [100, 4], [100, 6]]));
});

dxt.test("page boundary inside a tie", () => {
  t_with((db) => {
    dxt.equal(nextPage(db, [100, 4], 2), [[100, 6], [200, 3]]);
    dxt.equal(nextPage(db, [200, 3], 3), [[200, 5], [200, 8], [300, 1]]);
  });
});

dxt.test("walk all pages with many sizes", () => {
  t_with((db) => {
    for (const size of [1, 2, 3, 5, 8, 50]) dxt.equal(t_walk(db, size), t_ORDERED);
  });
});

dxt.test("after the last row", () => {
  t_with((db) => {
    dxt.equal(nextPage(db, [400, 7], 5), []);
    dxt.equal(nextPage(db, [300, 1], 5), [[400, 7]]);
  });
});

dxt.test("non-positive size", () => {
  t_with((db) => {
    dxt.equal(nextPage(db, null, 0), []);
    dxt.equal(nextPage(db, null, -1), []);
    dxt.equal(nextPage(db, [100, 2], -5), []);
  });
});

dxt.test("insert before the cursor does not repeat rows", () => {
  t_with((db) => {
    const first = nextPage(db, null, 4);
    db.exec("INSERT INTO events VALUES (9, 50, 'late arrival')");
    const second = nextPage(db, first[first.length - 1], 4);
    dxt.equal([...first, ...second], t_ORDERED);
  });
});

dxt.test("empty table", () => {
  t_with((db) => {
    db.exec("DELETE FROM events");
    dxt.equal(nextPage(db, null, 3), []);
  });
});

dxt.test("returns [ts, id] pairs of numbers", () => {
  t_with((db) => {
    const page = nextPage(db, null, 2);
    dxt.check(page.every((row) => Array.isArray(row) && row.length === 2), "expected 2-element arrays");
    dxt.check(page.every(([ts, id]) => typeof ts === "number" && typeof id === "number"), "expected numbers");
  });
});

dxt.test("uses keyset, not OFFSET", () => {
  t_with((db) => {
    const proto = t_sqlite.DatabaseSync.prototype as unknown as Record<string, (sql: string) => unknown>;
    const original = proto.prepare;
    const seen: string[] = [];
    proto.prepare = function (this: unknown, sql: string): unknown {
      seen.push(sql);
      return original.call(this, sql);
    };
    try {
      nextPage(db, null, 2);
      nextPage(db, [100, 6], 2);
    } finally {
      proto.prepare = original;
    }
    dxt.check(seen.length > 0, "no statement was prepared");
    dxt.check(seen.every((sql) => !/offset/i.test(sql)), "OFFSET is not keyset pagination");
  });
});
'''

[unit.step.gabarito]
solution = '''
import { DatabaseSync } from "node:sqlite";

type EventKey = { ts: number; id: number };

// Return the next `size` events after the cursor, as [ts, id] tuples ordered by ts, then id.
export function nextPage(
  db: DatabaseSync,
  after: readonly [number, number] | null,
  size: number,
): Array<[number, number]> {
  if (size <= 0) {
    return [];
  }
  const rows = (
    after === null
      ? db.prepare("SELECT ts, id FROM events ORDER BY ts, id LIMIT ?").all(size)
      : db
          .prepare("SELECT ts, id FROM events WHERE (ts, id) > (?, ?) ORDER BY ts, id LIMIT ?")
          .all(after[0], after[1], size)
  ) as EventKey[];
  return rows.map((row): [number, number] => [row.ts, row.id]);
}
'''
time = "O(n log k)"
space = "O(k)"
justification = '''
With an index on `(ts, id)`, SQLite seeks to the cursor in **O(log n)** and reads the next
**k** = `size` entries in order, so a page costs **O(log n + k)** however deep it is. The test
table has no such index, so there SQLite scans all **n** rows and keeps the best k in a
bounded sorter, **O(n log k)**; that is why production keyset paging always comes with an
index on the sort key. The page itself is **O(k)** space.

Comparing the pair `(ts, id)` makes the order total: the primary key breaks every tie, so each
row has exactly one position and the cursor names it unambiguously. Comparing `ts` alone would
skip the rest of a tie group at a page boundary, and comparing `id` alone would ignore the time
order. The explicit tuple return type on `map` keeps the result a list of pairs, not of
`number[]`.
'''

[[unit]]
id = "ts-udb6-indexes"
title = "Indexes & EXPLAIN QUERY PLAN"
level = "intermediate"
difficulty = 21
intro = '''
An index is a sorted copy of some columns that turns a full-table scan into a quick seek.
`EXPLAIN QUERY PLAN` shows the strategy SQLite picked, so you can check that an index is really
used. You will watch a `SCAN` become a `SEARCH`, meet covering and composite indexes, and design
one index that serves two queries.
'''
concepts = '''
## The idea

Without help, the only way to find the rows where `email = 'ana@example.com'` is to read every row and test it: a **full table scan**, O(n). An **index** is a separate structure, a **B-tree**, that keeps the values of some columns in sorted order, each with a pointer back to its row. Because it is sorted and its nodes are wide, even millions of keys are only three or four levels deep, so finding a value is a **seek** of O(log n).

Indexes are not free. Every `INSERT`, `UPDATE` and `DELETE` must also update every index on the table, and each index takes disk space. So you index the columns your important queries filter, join or sort on, and nothing else.

Two refinements matter in practice. A **composite index** on `(a, b)` is sorted by `a`, then by `b` within equal `a`s, like a phone book sorted by surname, then first name. It can seek on `a` alone or on `a` and `b` together (a **leftmost prefix**), but not on `b` alone. And when an index already contains every column a query needs, the database answers from the index without touching the table: a **covering index**.

## How TypeScript does it

`CREATE INDEX name ON table (columns)` builds an index; `IF NOT EXISTS` makes the statement safe to run twice. To see what the planner decided, prefix a query with `EXPLAIN QUERY PLAN`. It returns rows whose `detail` column describes each step, and it accepts the same parameters as the real query:

```ts
type PlanRow = { id: number; parent: number; detail: string };

function plan(db: DatabaseSync, sql: string, ...params: SQLInputValue[]): string[] {
  const rows = db.prepare(`EXPLAIN QUERY PLAN ${sql}`).all(...params) as PlanRow[];
  return rows.map((r) => r.detail);
}
```

`SCAN users` means a full scan. `SEARCH users USING INDEX idx_users_email (email=?)` means a seek through that index. `USING COVERING INDEX` means the table itself was never read, and `USING INTEGER PRIMARY KEY` means a seek on the rowid, which every table has for free.

## What is special or tricky

- An index on `email` does not help `WHERE lower(email) = ?`. The index stores `email`, not `lower(email)`, so the planner falls back to a scan. Compare the bare column, or index the expression itself.
- Column order in a composite index is the design. `(status, customer_id)` cannot serve a filter on `customer_id` alone.
- `EXPLAIN QUERY PLAN` describes; it does not run the query or measure time. Check it for the queries that matter, with realistic data.
- The plan text is for humans and can change between SQLite versions. A test may look for `SEARCH` or `USING INDEX`, not the whole sentence.
- Building an index on a big table takes time and writes a lot. Wrap schema changes in a transaction and make them idempotent.

## What you will practise

You will read the plan of an unindexed lookup, add an index and watch the plan change, then compare composite and covering cases. The challenge asks you to design a single index for two hot queries.
'''

[[unit.step]]
kind = "concept"
id = "ts-udb6-c1-index"
title = "Why indexes matter"
points = 5
difficulty = 21
intro = '''
A B-tree keeps keys sorted in wide, shallow nodes, so even millions of keys are only a few
levels deep. Searching it is O(log n) instead of the O(n) of reading every row, and the query
planner chooses between the two for each query.
'''
body = '''
## Scan or search

```ts
db.exec("CREATE INDEX IF NOT EXISTS idx_users_email ON users (email)");
```

- Without an index, `WHERE email = ?` is a **SCAN**: every row is read and tested, **O(n)**.
- With one, it is a **SEARCH**: a walk down the B-tree to the first match, **O(log n)**,
  then the matching entries in order.
- The integer primary key is the table's own B-tree, so lookups by `id` are always searches.

## Reading the plan

```ts
type PlanRow = { detail: string };

const rows = db
  .prepare("EXPLAIN QUERY PLAN SELECT name FROM users WHERE email = ?")
  .all("ana@example.com") as PlanRow[];
console.log(rows.map((r) => r.detail));
// [ 'SEARCH users USING INDEX idx_users_email (email=?)' ]
```

`EXPLAIN QUERY PLAN` takes the same SQL and parameters as the real query, but only describes
the strategy. Look for three words: `SCAN` (reads everything), `SEARCH` (seeks), and
`COVERING` (answered from the index alone, without visiting the table).

## Composite and covering

An index on `(last, first)` is sorted by `last`, then `first`. It serves filters on `last`, or
on `last` and `first`, but not on `first` alone. If the query selects only columns the index
holds, the plan says `USING COVERING INDEX` and the table is never read.

Every index costs space and slows down writes, so add the ones your hot queries need, and
check with the plan that they are used.
'''

