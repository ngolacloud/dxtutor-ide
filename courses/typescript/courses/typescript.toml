  throw new Error("not implemented");
}
'''
tests = '''
async function* t_from<T>(items: readonly T[]): AsyncGenerator<T> {
  for (const item of items) {
    await null;
    yield item;
  }
}

async function t_collect<T>(iterable: AsyncIterable<T>): Promise<T[]> {
  const out: T[] = [];
  for await (const x of iterable) out.push(x);
  return out;
}

let t_finished = false;
process.on("exit", () => {
  if (!t_finished) {
    console.error("FAILED: the tests never finished (a promise never settled)");
    process.exitCode = 1;
  }
});

dxt.test("groups items, with a shorter last batch", async () => {
  dxt.equal(await t_collect(batched(t_from([1, 2, 3, 4, 5, 6, 7]), 3)), [[1, 2, 3], [4, 5, 6], [7]]);
});

dxt.test("an exact multiple leaves no empty batch", async () => {
  dxt.equal(await t_collect(batched(t_from(["a", "b", "c", "d"]), 2)), [["a", "b"], ["c", "d"]]);
});

dxt.test("an empty source yields nothing", async () => {
  dxt.equal(await t_collect(batched(t_from([] as number[]), 3)), []);
});

dxt.test("size 1 and a size larger than the input", async () => {
  dxt.equal(await t_collect(batched(t_from([-1, -1, 0]), 1)), [[-1], [-1], [0]]);
  dxt.equal(await t_collect(batched(t_from([1, 2]), 10)), [[1, 2]]);
});

dxt.test("is lazy and closes the source on early exit", async () => {
  let pulled = 0;
  let closed = false;
  async function* source(): AsyncGenerator<number> {
    try {
      for (let i = 0; i < 100; i++) {
        pulled++;
        yield i;
      }
    } finally {
      closed = true;
    }
  }
  const stage = batched(source(), 4);
  dxt.equal(pulled, 0);
  const got: number[][] = [];
  for await (const batch of stage) {
    got.push(batch);
    break;
  }
  dxt.equal(got, [[0, 1, 2, 3]]);
  dxt.equal(pulled, 4);
  dxt.check(closed, "breaking out of the loop must close the source");
});

dxt.test("source errors reach the consumer", async () => {
  async function* broken(): AsyncGenerator<number> {
    yield 1;
    yield 2;
    yield 3;
    throw new Error("source broke");
  }
  const got: number[][] = [];
  let caught: unknown = null;
  try {
    for await (const batch of batched(broken(), 2)) got.push(batch);
  } catch (e) {
    caught = e;
  }
  dxt.equal(got, [[1, 2]]);
  dxt.check(caught instanceof Error && caught.message === "source broke", "the source's error must propagate");
});

dxt.test("rejects a bad size with a RangeError", async () => {
  for (const bad of [0, -2, 2.5]) {
    let caught: unknown = null;
    try {
      await t_collect(batched(t_from([1, 2, 3]), bad));
    } catch (e) {
      caught = e;
    }
    dxt.check(caught instanceof RangeError, `size ${bad} should throw a RangeError`);
  }
});

dxt.test("works with any AsyncIterable", async () => {
  const words = ["x", "y", "z"];
  const iterable: AsyncIterable<string> = {
    [Symbol.asyncIterator]() {
      let i = 0;
      return {
        next: async (): Promise<IteratorResult<string>> =>
          i < words.length ? { value: words[i++], done: false } : { value: undefined, done: true },
      };
    },
  };
  dxt.equal(await t_collect(batched(iterable, 2)), [["x", "y"], ["z"]]);
});

dxt.test("large stream", async () => {
  async function* many(): AsyncGenerator<number> {
    for (let i = 0; i < 100_000; i++) yield i;
  }
  const batches = await t_collect(batched(many(), 1000));
  dxt.equal(batches.length, 100);
  dxt.check(batches.every((b) => b.length === 1000), "every batch must hold 1000 items");
  dxt.equal(batches[0][0], 0);
  dxt.equal(batches[99][999], 99_999);
  dxt.check(batches[0] !== batches[1], "each batch must be a new array");
