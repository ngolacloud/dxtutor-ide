'''

[unit.step.gabarito]
solution = '''
/**
 * Map `items` through the async `fn`, with at most `limit` calls in flight at once.
 * Resolve with the results in input order. Reject with a RangeError for a bad limit,
 * or with the first task error (and start no further tasks).
 */
export async function mapLimit<T, R>(
  items: readonly T[],
  limit: number,
  fn: (item: T, index: number) => Promise<R>,
): Promise<R[]> {
  if (!Number.isInteger(limit) || limit < 1) {
    throw new RangeError(`limit must be a positive integer, got ${limit}`);
  }
  const results = new Array<R>(items.length);
  let next = 0;
  let failed = false;

  const worker = async (): Promise<void> => {
    while (!failed && next < items.length) {
      const i = next++;
      try {
        results[i] = await fn(items[i], i);
      } catch (e) {
        failed = true;
        throw e;
      }
    }
  };

  const workers = Array.from({ length: Math.min(limit, items.length) }, () => worker());
  await Promise.all(workers);
  return results;
}
'''
time = "O(n) bookkeeping; wall-clock about ceil(n / k) task durations"
space = "O(n + k)"
justification = '''
Each index is claimed exactly once (`next++` between two `await`s is atomic on JavaScript's single
thread), and claiming it, calling `fn` and storing the result are O(1) work. So the bookkeeping is
**O(n)** for *n* items, whatever the limit. With *k* workers and tasks of similar length, the
wall-clock time is about **ceil(n / k)** task durations: *k* times faster than a sequential loop,
without the unbounded burst of `Promise.all(items.map(fn))`.

Space is **O(n)** for the results array plus **O(k)** for the worker promises. The pool never holds
more than *k* pending tasks, which is the whole point.

Storing each value at its claimed index keeps input order even when tasks finish out of order.
On a failure the worker sets `failed` and rethrows, so no worker claims a new index, and
`Promise.all` rejects with that first error. A promise built in a loop that pushes results in
completion order, or a version that awaits each task in turn, would break either the ordering
rule or the concurrency rule.
'''

[[unit]]
id = "ts-u22-async-iterators-events"
title = "Async iterators, for await and events"
level = "advanced"
difficulty = 28
intro = '''
Some data does not arrive all at once: lines from a file, messages from a socket, pages from an
API. An **async iterable** delivers such a stream one value at a time, and `for await` consumes it
with ordinary loop syntax. You will write async generators, drive Node's `EventEmitter`, bridge
events into loops, and build a lazy batching stage for an async pipeline.
'''
concepts = '''
## The idea

A synchronous iterator hands out values on demand: each `next()` returns `{ value, done }` at
once. An **async iterator** does the same, except that `next()` returns a **promise** of
`{ value, done }`. That models streams whose next item is not ready yet. The consumer asks,
waits, and asks again, so the producer never runs ahead of the consumer. This **pull** model
gives you backpressure for free.

Events are the opposite, a **push** model: an emitter calls your listeners whenever something
happens, whether or not you are ready. Node's `EventEmitter` is the foundation of its streams,
servers and child processes.

## How TypeScript does it

An `async function*` is an **async generator**. It may both `await` and `yield`, and it returns
an `AsyncGenerator<T>`, which is an `AsyncIterable<T>`:

```ts
async function* countdown(from: number): AsyncGenerator<number> {
  for (let n = from; n > 0; n--) {
    await new Promise((resolve) => setTimeout(resolve, 1));
    yield n;
  }
}

for await (const n of countdown(3)) console.log(n); // 3, 2, 1
```

`for await` accepts any object with a `[Symbol.asyncIterator]()` method, and also plain iterables
of promises. Leaving the loop early with `break`, `return` or an exception calls the iterator's
`return()` method, which runs the generator's `finally` blocks, so clean-up is reliable.

`EventEmitter` from `node:events` calls listeners **synchronously**, in the order they were
registered, inside `emit`. Recent `@types/node` versions let you describe the events with a map
from event name to argument tuple, so `on` and `emit` are type-checked:

```ts
import { EventEmitter } from "node:events";
const bus = new EventEmitter<{ tick: [n: number] }>();
bus.on("tick", (n) => console.log("tick", n));
bus.emit("tick", 1);
```

Two helpers connect the worlds: `once(emitter, name)` returns a promise for the next event, and
`on(emitter, name)` returns an async iterator over all future events.

## Pitfalls

- **An `"error"` event with no listener throws.** Always listen for `error` on emitters you own.
- **Listeners leak.** Every `on` without a matching `off` keeps the listener, and everything it
  closes over, alive. Node warns when one event has more than 10 listeners.
- **`emit` is synchronous.** The code after `emit` runs only once every listener has returned.
- **`for await` is sequential.** Each iteration waits for the previous one; use a combinator when
  the items can be processed in parallel.
- **Generators are lazy.** Calling one runs nothing until somebody iterates it.
- **Iterable versus iterator.** `for await` needs the iterable; passing something else makes
  `tsc` complain that the type must have a `[Symbol.asyncIterator]()` method.
- **Untyped emitters are `any`.** The arrays that `once` and `on` produce are `any[]`, so their
  contents are unchecked; annotate or validate them.

## What you will practise

You will stream values out of an async generator and stop early, wire up an emitter with `on`,
`once` and `off`, and turn events into a promise and an async loop. The challenge asks for
`batched`, an async generator that groups a stream into fixed-size arrays without reading ahead.
'''

[[unit.step]]
kind = "concept"
id = "ts-u22-c1-pull-push"
title = "Pulling from a stream, pushing events"
points = 5
difficulty = 28
intro = '''
An async iterator is a pull interface: the consumer asks for the next value and waits for a
promise. An event emitter is a push interface: the producer calls you. Knowing which side
controls the pace tells you where buffering, backpressure and clean-up have to happen.
'''
body = '''
## next() returns a promise

An async iterator's `next()` returns `Promise<IteratorResult<T>>`. Each result is either
`{ value, done: false }` or `{ value: undefined, done: true }`. A loop such as
`for await (const x of source)` calls `next()`, awaits it, runs the body, and repeats until
`done` is true.

## Async generators write iterators for you

```ts
async function* pages(): AsyncGenerator<string[]> {
  yield await fetchPage(1);
  yield await fetchPage(2);
}
```

The body runs only when the consumer asks for a value, and it pauses at every `yield`. That makes
the generator **lazy**: a consumer that stops after the first page never triggers the second
request.

## Clean-up on early exit

When a `for await` loop ends early, because of `break`, `return` or an exception, it calls the
iterator's `return()` method. In a generator this resumes the paused `yield` as if it were a
`return`, so `finally` blocks run and files, sockets or listeners are released.

## Events push, iterators pull

An `EventEmitter` calls its listeners the moment `emit` runs; it waits for nobody. The helper
`on(emitter, "data")` adapts that push stream into a pull stream by buffering events until the
loop asks for them, and `once(emitter, "ready")` turns a single future event into a promise you
can `await`.
'''

