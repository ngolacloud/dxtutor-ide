dxt.test("merge with an empty patch returns a copy", () => {
  const t_d: Readonly<t_User> = Object.freeze(t_make());
  const t_m = merge(t_d, {});
  dxt.equal(t_m, t_make());
  dxt.check(t_m !== (t_d as object), "merge must return a new object");
  t_m.name = "changed";
