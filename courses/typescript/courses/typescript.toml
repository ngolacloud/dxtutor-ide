  dxt.check(t_e instanceof ParseError, "expected a ParseError");
  dxt.check(t_e instanceof Error, "a ParseError is also an Error");
  if (t_e instanceof ParseError) {
    dxt.equal(t_e.line, 3);
    dxt.equal(t_e.name, "ParseError");
    dxt.equal(t_e.message, 'invalid port "abc"');
  }
