[[unit.step]]
kind = "challenge"
id = "ts-u21-x1-map-limit"
title = "A concurrency-limited async map"
points = 40
difficulty = 27
entry = "mapLimit"
intro = '''
Running every task at once can exhaust sockets, memory or a remote rate limit; running them one
by one wastes time. A **concurrency limit** is the middle ground: a fixed pool of workers pulls
tasks from a shared index, so exactly *k* run at any moment. It is the same idea as a thread pool,
built from promises on a single thread.
'''
instructions = '''
## Your turn

Implement `mapLimit`:

```ts
export async function mapLimit<T, R>(
  items: readonly T[],
  limit: number,
  fn: (item: T, index: number) => Promise<R>,
): Promise<R[]>
```

It calls `fn(items[i], i)` for every item and resolves with all the results.

Rules:

- `result[i]` is the value of `fn(items[i], i)`, whatever order the tasks finish in.
- **Never more than `limit` tasks in flight** (started but not yet settled). Use every allowed
  slot: whenever a task settles and items remain, start the next one right away, in index order.
- If `limit` is not a positive integer (`0`, `-1`, `1.5`, `NaN`), reject with a `RangeError`
  without calling `fn`.
- If a task rejects, `mapLimit` rejects with **that same error** and starts no further tasks.
  Tasks already running may finish; their results are ignored.
- An empty `items` resolves to `[]` without calling `fn`.

Examples:

```ts
await mapLimit([3, 1, 2], 2, async (n) => n * 10); // [30, 10, 20]
await mapLimit([], 4, async (n: number) => n);     // []
```

**Hint:** start `min(limit, items.length)` async workers. Each one loops: take the next index from
a shared counter, `await fn` for it, store the result at that index. Wait for all workers with
`Promise.all`.

Hidden tests decide correctness.
'''
