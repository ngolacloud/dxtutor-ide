[unit.step.gabarito]
solution = '''
import { DatabaseSync } from "node:sqlite";

type NameRow = { name: string };

// Return the sorted names of the people who live in `city`.
export function namesInCity(db: DatabaseSync, city: string): string[] {
  const rows = db
    .prepare("SELECT name FROM people WHERE city = ? ORDER BY name")
    .all(city) as NameRow[];
  return rows.map((row) => row.name);
}
'''
time = "O(n + k log k)"
space = "O(k)"
justification = '''
The table has no index on `city`, so SQLite scans all **n** rows once to test the `WHERE`
condition: **O(n)**. The **k** matching names are then sorted for `ORDER BY`, which costs
**O(k log k)**. `all()` builds an array of k row objects and `map` builds the k names, so
the extra space is **O(k)**. Binding the city as a parameter costs nothing extra and keeps the
statement's structure fixed, whatever characters the city contains.
'''

[[unit]]
id = "ts-udb2-transactions"
title = "Transactions: all or nothing"
level = "intermediate"
difficulty = 17
intro = '''
A transaction groups several statements so that either all of them take effect or none do.
`node:sqlite` runs every statement in its own transaction unless you say otherwise, so you open
one with `BEGIN`, keep it with `COMMIT` and throw it away with `ROLLBACK`. You wrap that in
`try`/`catch` and use it to build a money transfer that can never leave the books half-updated.
'''
concepts = '''
## The idea

Many changes only make sense together. Moving money between two accounts is two updates: a debit and a credit. If the program crashes, throws or loses power between them, money has vanished. A **transaction** makes a group of statements **atomic**, the A in ACID: the database applies the whole group or none of it. It keeps a journal of what it changed since the transaction began, so it can undo everything exactly.

A transaction has three moves. `BEGIN` starts it. `COMMIT` makes every change durable and visible to other connections. `ROLLBACK` undoes every change since `BEGIN`. Until the commit, other connections keep seeing the old data, which is the I of ACID, **isolation**.

## How TypeScript does it

`node:sqlite` works in **autocommit** mode: a statement outside an explicit transaction is committed on its own as soon as it finishes. There is no hidden transaction and no `commit()` method; you write the SQL yourself with `db.exec`, and `db.isTransaction` tells you whether one is open.

```ts
db.exec("BEGIN");
try {
  db.prepare("UPDATE stock SET qty = qty - ? WHERE sku = ?").run(1, "A-1");
  db.prepare("INSERT INTO orders (sku) VALUES (?)").run("A-1");
  db.exec("COMMIT");
} catch (err) {
  db.exec("ROLLBACK");
  throw err;
}
```

The `try`/`catch` is the whole pattern: commit at the end of the happy path, roll back on any exception and rethrow it so the caller still learns what went wrong. A generic helper such as `transaction<T>(db, fn: () => T): T` keeps that shape in one place.

Your own rules can abort a transaction too. `run()` returns `{ changes, lastInsertRowid }`, and `changes` says how many rows a write touched. An `UPDATE ... WHERE id = ?` that reports `changes === 0` found no such row, and that is a reason to roll back.

## What is special or tricky

- A failed statement does **not** end the transaction. A `CHECK` or `NOT NULL` violation throws and undoes that one statement, but the earlier statements stay pending and `isTransaction` is still `true`. You must `ROLLBACK` yourself.
- Forget the rollback and the transaction stays open: the next `BEGIN` throws `cannot start a transaction within a transaction`, and other connections wait on your lock.
- In `catch (err)`, `err` is `unknown` under `strict`. Narrow it with `err instanceof Error` before reading `err.message`.
- `changes` is typed `number | bigint`, because a huge database could overflow a `number`. Comparing it with `=== 1` is fine.
- Never `await` between `BEGIN` and `COMMIT`. While your code waits, the transaction holds its locks and other code can run against the same connection; the next unit shows why.

## What you will practise

You will commit one change and roll back another, write a helper that rolls back when an exception escapes, and watch a constraint violation cancel a whole group of updates. The challenge is a transfer that commits only when every rule holds.
'''

[[unit.step]]
kind = "concept"
id = "ts-udb2-c1-begin-commit"
title = "BEGIN, COMMIT and ROLLBACK"
points = 5
difficulty = 17
intro = '''
Atomicity is the A in ACID: a transaction is applied whole or not at all. The database keeps
enough information (a journal) to undo every change made since `BEGIN`, which is how a
rollback can restore the previous state exactly.
'''
body = '''
## Autocommit and explicit transactions

Outside a transaction, `node:sqlite` commits each statement by itself. To group statements,
open a transaction with SQL:

```ts
db.exec("BEGIN");
db.prepare("UPDATE accounts SET balance = balance - ? WHERE id = ?").run(30, 1);
db.prepare("UPDATE accounts SET balance = balance + ? WHERE id = ?").run(30, 2);
db.exec("COMMIT");                 // or db.exec("ROLLBACK") to undo both
console.log(db.isTransaction);     // false
```

- **`BEGIN`** starts the transaction; **`COMMIT`** keeps every change since then;
  **`ROLLBACK`** discards them all.
- **`db.isTransaction`** is `true` while a transaction is open.
- Until `COMMIT`, other connections still see the old rows.

## Roll back on any exception

```ts
function transaction<T>(db: DatabaseSync, fn: () => T): T {
  db.exec("BEGIN");
  try {
    const result = fn();
    db.exec("COMMIT");
    return result;
  } catch (err) {
    db.exec("ROLLBACK");
    throw err;
  }
}
```

Whatever `fn` throws, nothing it wrote survives and no transaction is left open. Rethrowing
keeps the error visible to the caller.

A thrown constraint error undoes only its own statement: the transaction stays open, so the
`ROLLBACK` in `catch` is not optional. And when a rule of your own fails, for example an
`UPDATE` whose `changes` is 0 because the row does not exist, throw or roll back explicitly.
'''

