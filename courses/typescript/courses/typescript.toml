id = "typescript-basics"
language = "typescript"
title = "TypeScript: From Zero to Confident"
level = "beginner"
summary = "A serious, guided course in TypeScript that takes you from your very first typed program to the ideas that make large codebases safe: unions and narrowing, generics, async code and type-level programming. You read a short concept, build muscle memory by typing small, complete programs, then prove what you learned by writing real functions that hidden tests check."
overview = '''
## What TypeScript is

TypeScript is **JavaScript with a static type system**. You write ordinary JavaScript and
add types that describe your values: this is a `number`, that is a `string`, this object
has a `name` and an optional `email`. The type checker, `tsc`, reads the whole program
before it runs and reports mistakes such as a misspelt property or a value that might be
`undefined`. Then the types are removed, by `tsc` compiling to JavaScript or by
a runtime that strips them, and plain JavaScript runs. In this course, Node.js runs your
`.ts` files directly by stripping the types.

## Where it is used

It is widely used for web front-ends: Angular is written in it, and React and Vue projects
commonly use it.
On the server it powers Node.js back-ends and APIs. Much developer tooling is written in
TypeScript too: Visual Studio Code itself is a TypeScript application.

## The mental model

The course builds one idea step by step: **types describe the shapes of values**, and the
checker proves your code respects them. You will learn to describe data with object types
and unions, to **narrow** a broad type into a precise one with ordinary `if` checks, to write
reusable code with **generics**, and to reason about **asynchronous** code with promises and
`async`/`await`. Throughout, you will keep a clear line between what exists only at check
time (types) and what exists at run time (values).

## How the course is organised

- **Basic:** running programs, variables, strings, decisions, loops and functions.
- **Intermediate:** arrays and tuples, objects and interfaces, unions and narrowing, classes,
  generics, maps and sets, errors, utility types, promises, and a block on SQLite databases
  with Node's built-in `node:sqlite` (queries, transactions, WAL mode, N+1, pagination and
  indexes).
- **Advanced:** type-level programming (conditional, mapped and template literal types),
  iterators and functional style, the event loop and async control, and classic data
  structures and algorithms implemented by hand.

## How a unit works

Each unit opens with a reading text. A **concept** step explains one idea in focus. In each
**drill** you type a short, complete program line by line, with a comment on every line, and
then see it run. The **challenge** asks you to write a function or class on your own; hidden
tests check it, and afterwards you can compare with a reference solution and its complexity
analysis.
'''

# ── g1-basic ────────────────────────────────────────────────────────────

[[unit]]
id = "ts-u01-hello"
title = "Hello & console.log"
level = "basic"
difficulty = 1
intro = '''
Your very first steps in TypeScript: what a program is, how TypeScript relates to JavaScript,
and how Node.js runs a `.ts` file from top to bottom. You will print text with `console.log`,
see that type annotations vanish before the program runs, and finish by writing a tiny
greeting function that hidden tests check.
'''
concepts = '''
## The idea

A computer does not understand English; it follows instructions, one after another. A
**programming language** is a precise notation that people can read and that a tool can
turn into actions the machine carries out. **JavaScript** is the language every web browser
runs, and **Node.js** (`node`) is a program that runs JavaScript outside the browser, on
your own machine.

**TypeScript** is JavaScript plus **types**. A type is a label that says what kind of value
something is: a piece of text, a number, true or false. You write those labels in your code,
and a tool called the **type checker** (`tsc`) reads the whole program *before it runs* and
complains when the labels don't fit, for example when you pass a number where text was
expected. When the program actually runs, the types are simply **erased**: what is left is
ordinary JavaScript.

## How TypeScript does it

A TypeScript program is a plain text file whose name ends in `.ts`. In this course Node runs
it directly with `node --experimental-transform-types main.ts`: Node strips the type labels
away and executes the rest, statement by statement, from the first line to the last.

The simplest way to talk to the outside world is **standard output**, a stream of text that
the terminal displays. `console.log` writes its arguments there and ends the line:

```ts
console.log("first line");
console.log("the answer is", 42);
console.log();
```

Text in quotes is a **string**; single and double quotes mean the same thing. With several
arguments, `console.log` puts a space between them. With none, it prints an empty line.

A type annotation is a colon and a type after a name:

```ts
const city: string = "Lisbon";   // the checker knows city holds text
```

Anything after `//` on a line is a **comment**, and `/* ... */` can span several lines.
Comments are notes for humans; they never run.

## What is special or tricky

- **Types do not exist at run time.** Node only strips them, so `const n: number = "x";`
  still runs. `tsc` is what refuses it, with `error TS2322: Type 'string' is not assignable
  to type 'number'.` Always treat a type error as a real bug.
- **`any` switches the checker off.** A value of type `any` is accepted everywhere, so
  mistakes slip through to run time. This course avoids it.
- **Case matters.** It is `console.log`, never `Console.log` or `console.Log`; the checker
  reports that the name or property does not exist.
- **Quotes must match.** `"hello'` never closes, which is a syntax error.
- **Semicolons** end statements. JavaScript can often insert them for you, but writing them
  keeps the code unambiguous, so every example here uses them.

## What you will practise

You will type a first program with comments, print the results of small calculations, and
see type annotations disappear at run time. Then you will write your first function, one
that builds a greeting string from a name it receives and hands it back.
'''

[[unit.step]]
kind = "concept"
id = "ts-u01-c1-programs"
title = "What a TypeScript program is"
points = 5
difficulty = 1
intro = '''
Before you write anything, picture what happens when you run a `.ts` file. First, optionally,
the type checker reads the code and reports mistakes without running it. Then Node removes the
type labels and executes the remaining JavaScript from top to bottom, sending whatever you
log to **standard output**.
'''
body = '''
## Two tools, two moments

TypeScript work happens at two different moments:

1. **Check time.** `tsc` reads your program and verifies that every value is used according
   to its type. Nothing runs. If something does not fit, you get an error with a file name,
   a line number and a code such as `TS2322`.
2. **Run time.** `node` strips the types and executes what is left, which is plain
   JavaScript, one statement after another, starting at the first line.

```ts
// This line is a comment: it never runs.
const language: string = "TypeScript";
console.log("Hello from", language);
console.log("Two plus three is", 2 + 3);
```

Things to notice:

- **`console.log(...)`** writes its arguments to standard output, separated by spaces, and
  finishes the line.
- **`: string`** is a type annotation. It helps the checker and vanishes at run time.
- **`2 + 3`** is an **expression**. It is worked out to `5` before `console.log` receives it.
- There is no special `main` function: the file itself is the program.

## What the tutor does

In each drill you type a small, complete program. When your code matches the target, the
tutor saves it as `main.ts` and runs it with Node, so you see exactly what it prints. In
each challenge you write a function instead, and hidden tests call it with many different
inputs to check what it returns.
'''

