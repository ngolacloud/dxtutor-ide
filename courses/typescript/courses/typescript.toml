tests = '''
import * as t_sqlite from "node:sqlite";

type t_Method = (...args: unknown[]) => unknown;

function t_open(): t_sqlite.DatabaseSync {
  const db = new t_sqlite.DatabaseSync(":memory:");
  db.exec(`
    CREATE TABLE authors (id INTEGER PRIMARY KEY, name TEXT);
    CREATE TABLE posts (id INTEGER PRIMARY KEY, author_id INTEGER, title TEXT);
    INSERT INTO authors VALUES (1, 'Ana'), (2, 'Bo'), (3, 'O''Hara');
    INSERT INTO posts VALUES
      (1, 1, 'Hello'), (2, 2, 'SQL tips'), (3, 1, 'Joins'),
      (4, 3, 'Quotes'), (5, 42, 'Orphan');
  `);
  return db;
}

// Runs `fn` while counting every statement execution on any connection.
function t_counted<T>(fn: () => T): { result: T; count: number } {
  const st = t_sqlite.StatementSync.prototype as unknown as Record<string, t_Method>;
  const dbp = t_sqlite.DatabaseSync.prototype as unknown as Record<string, t_Method>;
  const targets: Array<[Record<string, t_Method>, string]> = [
    [st, "all"], [st, "get"], [st, "run"], [st, "iterate"], [dbp, "exec"],
  ];
  const saved = targets.map(([obj, key]) => obj[key]);
  let count = 0;
  targets.forEach(([obj, key], i) => {
    const original = saved[i];
    obj[key] = function (this: unknown, ...args: unknown[]): unknown {
      count++;
      return original.apply(this, args);
    };
  });
  try {
    const result = fn();
    return { result, count };
  } finally {
    targets.forEach(([obj, key], i) => {
      obj[key] = saved[i];
    });
  }
}

function t_with(fn: (db: t_sqlite.DatabaseSync) => void): void {
  const db = t_open();
  try {
    fn(db);
  } finally {
    db.close();
  }
}

dxt.test("three posts, one statement", () => {
  t_with((db) => {
    const { result, count } = t_counted(() => postAuthors(db, [1, 2, 3]));
    dxt.equal(result, new Map([[1, "Ana"], [2, "Bo"], [3, "Ana"]]));
    dxt.equal(count, 1);
  });
});

