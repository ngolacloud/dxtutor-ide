instructions = '''
## Your turn

Implement `leaderboard`:

```ts
export type Score = [name: string, points: number];
export type Ranked = [rank: number, name: string, points: number];

export function leaderboard(scores: readonly Score[], k: number): Ranked[]
```

Return the top `k` rows of the leaderboard as `[rank, name, points]` tuples.

Rules:

- Entries whose points are `NaN` are invalid: skip them. Negative points are valid.
- Order by points, highest first. Equal points are ordered by name, in ascending code-unit
  order (compare the strings with `<` and `>`).
- **Competition ranking:** equal points share a rank, and the next different score gets its
  position in the list (1-based). Points 100, 90, 90, 80 get ranks 1, 2, 2, 4.
