intro = '''
Transient failures (a dropped connection, a busy server) often succeed on a second try. A retry
loop with **exponential backoff** doubles the wait after each failure, so a struggling service
gets more and more room to recover, and a maximum number of attempts makes sure the loop
eventually gives up.
'''
prompt = '''
Write a generic `retry` helper, use it on an operation that fails twice before succeeding, and on
one that never succeeds.

**Why:** retries are the most common resilience pattern in networked code, and the generic
signature shows how `T` flows from the operation to the caller.
'''
target = '''
import { setTimeout as sleep } from "node:timers/promises";

let calls = 0;
async function flaky(): Promise<string> {
  calls++;
  if (calls < 3) throw new Error(`attempt ${calls} failed`);
  return `succeeded on attempt ${calls}`;
}

async function retry<T>(fn: () => Promise<T>, attempts: number, baseMs: number): Promise<T> {
  for (let i = 0; ; i++) {
    try {
      return await fn();
    } catch (e) {
      if (i + 1 >= attempts) throw e;
      const delay = baseMs * 2 ** i;
      console.log(`${e instanceof Error ? e.message : String(e)}; retrying in ${delay} ms`);
      await sleep(delay);
    }
  }
}

console.log(await retry(flaky, 5, 2));

try {
  await retry(async () => { throw new Error("always down"); }, 2, 1);
} catch (e) {
  console.log("gave up:", e instanceof Error ? e.message : e);
}
'''
