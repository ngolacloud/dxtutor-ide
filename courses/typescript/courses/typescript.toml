[unit.step.gabarito]
solution = '''
/** The string hash every bucket index must use (provided: do not change it). */
export function hashString(key: string): number {
  let h = 0;
  for (let i = 0; i < key.length; i++) {
    h = (Math.imul(h, 31) + key.charCodeAt(i)) >>> 0;
  }
  return h;
}

type Bucket<V> = Array<[string, V]>;

/** A hash map from string keys to values of type V, with separate chaining. */
export class HashMap<V> {
  /** One array of [key, value] entries per bucket. */
  buckets: Array<Bucket<V>>;
  private count = 0;

  constructor(capacity = 8) {
    if (!Number.isInteger(capacity) || capacity < 1) {
      throw new RangeError(`capacity must be a positive integer, got ${capacity}`);
    }
    this.buckets = HashMap.emptyBuckets<V>(capacity);
  }

  private static emptyBuckets<V>(n: number): Array<Bucket<V>> {
    return Array.from({ length: n }, (): Bucket<V> => []);
  }

  get size(): number {
    return this.count;
  }

  private bucketOf(key: string): Bucket<V> {
    return this.buckets[hashString(key) % this.buckets.length];
  }

  set(key: string, value: V): void {
    const bucket = this.bucketOf(key);
    for (const entry of bucket) {
      if (entry[0] === key) {
        entry[1] = value;
        return;
      }
    }
    bucket.push([key, value]);
    this.count++;
    if (this.count > 0.75 * this.buckets.length) this.grow();
  }

  get(key: string): V | undefined {
    for (const [k, v] of this.bucketOf(key)) {
      if (k === key) return v;
    }
    return undefined;
  }

  has(key: string): boolean {
    return this.bucketOf(key).some(([k]) => k === key);
  }

  delete(key: string): boolean {
    const bucket = this.bucketOf(key);
    const i = bucket.findIndex(([k]) => k === key);
    if (i === -1) return false;
    bucket[i] = bucket[bucket.length - 1];
    bucket.pop();
    this.count--;
    return true;
  }

  private grow(): void {
    const old = this.buckets;
    this.buckets = HashMap.emptyBuckets<V>(old.length * 2);
    for (const bucket of old) {
      for (const entry of bucket) {
        this.bucketOf(entry[0]).push(entry);
      }
    }
  }
}
'''
time = "O(1) average per operation (amortised for set)"
space = "O(n)"
justification = '''
Every operation hashes the key in O(length of the key), which is constant for bounded keys,
and then scans one bucket. Because the table doubles whenever `size > 0.75 * buckets.length`,
the load factor stays below 0.75, so with a reasonable hash the expected bucket length is
O(1) and `get`, `has`, `delete` and a non-resizing `set` are **O(1) on average**. `delete`
swaps the found entry with the bucket's last one and pops it, which avoids shifting.

A resize moves all n entries, which is O(n), but it only happens when the size doubles. The
moves add up to at most 8 + 16 + ... + n < 2n over n inserts, so each `set` is **O(1)
amortised**. The worst case is O(n) per operation if every key collides, which is why the
hash function matters. Space is **O(n)**: n entries plus fewer than 2n / 0.75 buckets, since
the table never shrinks below the size it reached. The tuples are reused on a resize, so
rehashing allocates new bucket arrays but no new entries.
'''

[[unit]]
id = "ts-u26-binary-search-tree"
title = "Binary search trees"
level = "advanced"
difficulty = 32
intro = '''
A binary search tree keeps keys in order by putting smaller keys to the left and larger keys
to the right of every node, so each comparison discards a whole subtree. You will insert keys
and read them back sorted with a generator, search with a loop, measure height to see why
balance matters, and finish with the trickiest operation of all: deletion.
'''
concepts = '''
## The idea

A **binary tree** is made of nodes that each have at most two children, `left` and `right`. A **binary search tree** (BST) adds one ordering rule, the **BST property**: for every node, all keys in its left subtree are smaller than its key, and all keys in its right subtree are larger. Duplicates are either rejected or always sent to the same side.

That rule turns search into a walk down the tree. Compare the target with the root, go left if it is smaller and right if it is larger, and stop on a match or at an empty child. Each step descends one level, so search, insert and delete all cost **O(h)**, where *h* is the tree's **height**.

The height depends on the order of insertion. Random order gives a tree whose height is O(log n), a few dozen levels for 100,000 keys. Sorted order is the disaster case: each new key becomes the right child of the previous one, and the tree degenerates into a linked list with h = n. Self-balancing trees (AVL, red-black) rotate nodes to keep h = O(log n). JavaScript has no built-in ordered map: `Map` keeps insertion order, not key order.

An **in-order traversal** (left subtree, then the node, then the right subtree) visits the keys in sorted order. That is the BST's advantage over a hash table: ordered iteration, minimum and maximum, range queries and "next larger key" all come cheaply.

## How TypeScript does it

A node is a small class whose children are typed `TreeNode | null`:

```ts
class TreeNode {
  left: TreeNode | null = null;
  right: TreeNode | null = null;
  constructor(public key: number) {}
}
```

Recursion fits trees naturally, because every subtree is itself a tree:

```ts
function size(node: TreeNode | null): number {
  return node === null ? 0 : 1 + size(node.left) + size(node.right);
}
```

Operations that change the shape are usually written as functions that return the (possibly new) root of a subtree, so the parent can reattach it: `node.left = insert(node.left, key)`. Generator functions make traversals pleasant: `yield* inOrder(node.left)` passes along every key of the left subtree, and the return type `Generator<number>` documents what comes out.

## What is special or tricky

- **Recursion depth.** Node's stack holds roughly ten thousand frames, so recursive code on a degenerate tree of 100,000 sorted keys throws `RangeError: Maximum call stack size exceeded`. Search and insert are easy to write as loops.
- **Keys must be comparable.** With `number` keys `<` is numeric. A generic `TreeNode<K>` should take a comparator: `tsc` accepts `a < b` for any `K`, but on objects `<` compares their string forms, which is almost never what you want.
- **Narrowing does not survive reassignment.** After `node = node.left`, the compiler forgets that `node` was not null; check again rather than writing `node!.key`.
- **Validity is about whole subtrees.** Checking only that each node is greater than its left child and smaller than its right child is not enough: a key deep in the left subtree must also be smaller than the root.
- **Deleting a node with two children** can't just splice it out. Something must take its place, and it must keep the order intact.

## What you will practise

You will insert keys and print them in order, search with a loop while counting steps, and compare the height of a balanced tree with that of a degenerate one. The challenge is deletion, with all three cases, checked on a tree of 100,000 keys.
'''

[[unit.step]]
kind = "concept"
id = "ts-u26-c1-bst-property"
title = "The BST property and O(h)"
points = 5
difficulty = 32
intro = '''
One ordering rule, applied at every node, is what turns a tree into a search structure. It
makes each comparison throw away a whole subtree, so the cost of an operation is the height
of the tree rather than the number of keys.
'''
body = '''
## The rule

For every node: keys in the left subtree are **smaller**, keys in the right subtree are
**larger**.

```
        50
      /    \
    30      70
   /  \    /  \
  20  40  60  80
```

## Search is a walk

To find 60: 60 > 50, go right; 60 < 70, go left; found. Three comparisons, and each one
ruled out half of what was left. To learn that 45 is absent, walk 50, 30, 40 and fall off
an empty right child.

```ts
let node = root;
while (node !== null && node.key !== target) {
  node = target < node.key ? node.left : node.right;
}
```

When the loop ends, `node` is either the match or `null`, and its type says so.

## Insert follows the same walk

Walk as if searching. Where the walk falls off the tree, hang the new node. The tree only
ever grows at the bottom.

## In order means sorted

Visiting left subtree, node, right subtree yields 20 30 40 50 60 70 80. The tree is a
sorted sequence that you can search in O(h) and update without shifting elements.

## Height decides everything

Every operation costs O(h). With 7 keys in the balanced shape above, h = 3. Insert the same
keys in sorted order and each one becomes the right child of the last: h = 7, and the "tree"
is a linked list. Balanced trees keep h = O(log n); a plain BST gives no such guarantee.
'''

