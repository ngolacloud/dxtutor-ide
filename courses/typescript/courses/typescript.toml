title = "A bottom-up table: paths through a grid"
points = 10
difficulty = 34
placeholder_policy = "on_demand"
run_command = "node --experimental-transform-types main.ts"
intro = '''
Tabulation fills a table in an order where every cell's dependencies are already known. To
count the paths that move only right or down through a grid, each cell is the sum of the cell
above and the cell to its left, so a row-by-row fill works.
'''
prompt = '''
Fill a table of path counts for a 3 by 4 grid with one blocked cell and print it.

**Why:** this is tabulation in two dimensions: a clear subproblem, a recurrence, base cases
and an order in which to fill the table, with no recursion at all.
'''
target = '''
const rows = 3;
const cols = 4;
const blocked = new Set(["1,1"]);
const paths: number[][] = Array.from({ length: rows }, () => new Array<number>(cols).fill(0));

for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    if (blocked.has(`${r},${c}`)) continue;
    if (r === 0 && c === 0) {
      paths[r][c] = 1;
    } else {
      const fromAbove = r > 0 ? paths[r - 1][c] : 0;
      const fromLeft = c > 0 ? paths[r][c - 1] : 0;
      paths[r][c] = fromAbove + fromLeft;
    }
  }
}

for (const row of paths) console.log(row.join(" "));
console.log("paths:", paths[rows - 1][cols - 1]);
'''
line_comments = [
  "The grid has three rows...",
  "...and four columns.",
  "Blocked cells as string keys, since array keys would compare by reference.",
  "One separate row array per row, every cell starting at 0.",
  "",
  "Fills top to bottom...",
  "...and left to right, so the cells above and to the left are ready.",
  "A blocked cell keeps 0: no path goes through it.",
  "The start cell is the base case.",
  "There is exactly one way to be where you start.",
  "Every other cell is reached from above or from the left.",
  "Paths that arrive from the cell above, if there is one.",
  "Paths that arrive from the cell to the left, if there is one.",
  "The recurrence: the two counts add up.",
  "Closes the branch.",
  "Closes the column loop.",
  "Closes the row loop.",
  "",
  "Prints the table: `1 1 1 1`, `1 0 1 2`, `1 1 2 4`.",
  "Prints `paths: 4`, the bottom-right cell.",
]
explanation = '''
The first row and first column are all 1, since there is one straight path along an edge,
except where a block interrupts. The blocked cell at row 1, column 1 stays 0, so the cells
after it only receive paths from one side: row 1 becomes `1 0 1 2` and row 2 `1 1 2 4`. The
answer in the bottom-right corner is 4 (without the block it would be 10). Each cell is filled
once from two neighbours, so the table costs O(rows × cols). Building rows with `Array.from`
matters: `new Array(rows).fill(new Array(cols).fill(0))` would share one row among all three.
'''

