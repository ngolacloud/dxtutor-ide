type t_Assert<T extends true> = T;
type t_IsReadonlyArray<T> = T extends unknown[] ? false : T extends readonly unknown[] ? true : false;
type t_ArrayOk = t_Assert<t_IsReadonlyArray<DeepReadonly<number[]>>>;
type t_NestedArrayOk = t_Assert<t_IsReadonlyArray<DeepReadonly<{ grid: number[][] }>["grid"][number]>>;

function t_compileOnly(): void {
  const f = deepFreeze({ user: { name: "Ada", tags: ["x"] }, n: 1 });
  // @ts-expect-error the top level is readonly
  f.n = 2;
  // @ts-expect-error nested properties are readonly
  f.user.name = "Bob";
  // @ts-expect-error nested arrays are readonly
  f.user.tags.push("y");
  const n: number = f.n;
