  for (const t_bad of ["0", "65536", "70000", "-1", "+80", "8.0", "80 81", "1e3"]) {
    const t_e = t_errorOf(() => parsePorts(`22\n${t_bad}`));
    dxt.check(t_e instanceof ParseError && t_e.line === 2, `"${t_bad}" should fail on line 2`);
    if (t_e instanceof ParseError) dxt.equal(t_e.message, `invalid port "${t_bad}"`);
  }
