tests = '''
function t_errorOf(fn: () => unknown): unknown {
  try {
    fn();
  } catch (e) {
    return e;
  }
  return undefined;
}

dxt.test("parses ports, skipping blanks and comments", () => {
  dxt.equal(parsePorts("80\n\n# https\n443\n  8080  \n"), [80, 443, 8080]);
