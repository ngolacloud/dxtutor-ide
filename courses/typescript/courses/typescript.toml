run_command = "node --experimental-transform-types main.ts"
intro = '''
When generators are chained, a value travels through every stage before the next value is
produced. The pipeline does the minimum work needed for the result, so even an infinite source
is fine as long as the last stage stops asking.
'''
prompt = '''
Square the natural numbers, keep the odd squares and take three, with a log line that shows
exactly when each number is produced.

**Why:** the log proves the pipeline is lazy: nothing runs before the loop starts, and the source
stops at 5 instead of building an endless array.
