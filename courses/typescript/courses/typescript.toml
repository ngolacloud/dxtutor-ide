[[unit.step]]
kind = "drill"
id = "ts-u01-d3-erased"
title = "Types are erased before running"
points = 10
difficulty = 1
placeholder_policy = "shown"
run_command = "node --experimental-transform-types main.ts"
intro = '''
Type annotations are instructions for the **checker**, not for the computer. When Node runs a
`.ts` file it removes every `: string` and `: number` and executes the plain JavaScript that
remains. At run time, the `typeof` operator asks a value what kind it is, and the answer
comes from the value itself, not from your annotation.
'''
prompt = '''
Declare two annotated constants, print them, and ask each value for its run-time type with
`typeof`. Add a block comment that spans two lines.

**Why:** knowing which part of your code exists only for the checker, and which part
actually runs, is the single most important idea in TypeScript.
'''
target = '''
// The `: string` and `: number` parts are type annotations.
const language: string = "TypeScript";
const year: number = 2012;

console.log(language, "first appeared in", year);
console.log(typeof language, typeof year);

/* A block comment
   can span several lines. */
console.log("The annotations are gone at run time.");
'''
line_comments = [
  "A line comment explaining what the annotations are.",
  "Declares a constant named `language`; `: string` tells the checker it holds text.",
  "`: number` says `year` holds a number. TypeScript was first released publicly in 2012.",
  "",
  "Prints the two values with a fixed piece of text between them, separated by spaces.",
  "`typeof` is a run-time question: it inspects the value and answers `string` or `number`.",
  "",
  "A block comment starts with `/*` ...",
  "... and ends with `*/`, so it can cover more than one line.",
  "Runs after the comment, which produced no output.",
]
explanation = '''
The output was `TypeScript first appeared in 2012`, then `string number`, then the last line.
The annotations helped the checker, but Node stripped them before running: what executed was
`const language = "TypeScript";`. The `typeof` answers came from the values themselves, which
is why annotations and real values must agree; making them agree is the checker's job.
'''

