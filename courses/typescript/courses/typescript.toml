// Insert 1..upto into nums(n) using `workers` concurrent tasks and return the sum.
// Switch the file to WAL first, give each task its own connection with a busy
// timeout, keep every transaction synchronous, and read the sum after all tasks finish.
export async function parallelSum(file: string, upto: number, workers: number): Promise<number> {
