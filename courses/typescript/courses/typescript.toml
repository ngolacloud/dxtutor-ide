[unit.step.gabarito]
solution = '''
declare const emailBrand: unique symbol;

// A string that carries a compile-time-only tag. No real string has this property.
export type Email = string & { readonly [emailBrand]: true };

// Local part: no whitespace, no "@". Domain: dot-separated labels of [a-z0-9-], at least two.
const EMAIL_PATTERN = /^[^\s@]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+$/;

export function isEmail(value: unknown): value is Email {
  return typeof value === "string" && value === value.toLowerCase() && EMAIL_PATTERN.test(value);
}

export function parseEmail(input: string): Email {
  const normalized = input.trim().toLowerCase();
  if (!isEmail(normalized)) {
    throw new Error(`invalid email address: ${JSON.stringify(input)}`);
  }
  return normalized;
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let **n** be the length of the input. `trim` and `toLowerCase` each scan the string once and build
one new string, which is O(n) time and O(n) space. The regular expression is also linear: the
local part `[^\s@]+` cannot overlap with the `@`, and every domain label ends exactly at a dot or
at the end of the string, so there is only one way to match and no catastrophic backtracking.
Checking `value === value.toLowerCase()` in `isEmail` is one more O(n) pass. Overall: **O(n)**
time and **O(n)** extra space for the normalized copy.

The type-level part costs nothing at run time. `Email` is `string & { readonly [emailBrand]: true
}`; because no string literal has the `emailBrand` property, `"x@y.z"` is not assignable to it,
while every `Email` is still a `string`. Note that `parseEmail` needs no cast at all: after
`isEmail(normalized)` returns `true`, the predicate has already narrowed `normalized` to `Email`.
The only trust the program places in unchecked code is the body of `isEmail`, which is exactly
why it is written to check every rule.
'''


[[unit]]
id = "ts-u18-iterators-generators"
title = "Iterators, generators and lazy pipelines"
level = "advanced"
difficulty = 24
intro = '''
Every `for...of` loop, spread and destructuring in JavaScript runs on one small protocol: an
object with a `next()` method. You will implement that protocol by hand, let generator functions
write it for you, and chain generators into lazy pipelines that compute only the values someone
asks for, even from infinite sources. The challenge is a lazy `chunk` that splits any iterable
into batches.
'''
concepts = '''
## The idea

An **iterator** hands out values one at a time. Instead of building a whole array and returning
it, a producer waits until the consumer asks for the next value. That gives you three things an
array cannot: values computed **on demand** (lazily), sequences that are **infinite**, and
**constant memory** for long streams, because only the current value has to exist.

The cost is that an iterator is usually one-shot and sequential. You cannot index into it, and
once it is used up, it stays used up.

## How TypeScript does it

The protocol has two parts. An **iterable** is any object with a `[Symbol.iterator]()` method.
That method returns an **iterator**: an object whose `next()` returns `{ value, done }`. Arrays,
strings, `Map`, `Set` and generator objects are all iterable, and `for...of`, spread (`[...x]`),
destructuring and `Array.from` all work with any iterable.

```ts
const it = [10, 20][Symbol.iterator]();
it.next(); // { value: 10, done: false }
it.next(); // { value: 20, done: false }
it.next(); // { value: undefined, done: true }
```

Writing `next()` by hand means keeping the state yourself. A **generator function**, declared
with `function*`, keeps it for you: each `yield` hands out a value and pauses the function, and
the next call to `next()` resumes it right after the `yield`. `yield*` delegates to another
iterable.

```ts
function* evens(limit: number): Generator<number, void, undefined> {
  for (let n = 0; n <= limit; n += 2) yield n;
}
```

The three type parameters of `Generator<T, TReturn, TNext>` are the type of the yielded values,
the type of the final `return` value, and the type a caller may pass into `next(...)`. For simple
producers, `Iterable<T>` is the type to accept and `Generator<T, void, undefined>` the type to
return.

Generators compose: a `map` generator pulls from a source, transforms each value and yields it
on. Chaining `map`, `filter` and `take` gives a **lazy pipeline** where each value flows through
every stage before the next one is produced.

## What is special or tricky

- **A generator's body does not run when you call it.** The call only creates a paused generator
  object; nothing executes until the first `next()`. Argument checks inside a `function*` throw
  late, at the first iteration, not at the call.
- **Iterators are one-shot.** Spreading a generator twice gives an empty second result. An
  iterable *class* can return a fresh iterator from each `[Symbol.iterator]()` call.
- **`break` closes the source.** Leaving a `for...of` early calls the iterator's `return()`
  method, which runs `finally` blocks inside a generator. That is how infinite generators get
  cleaned up.
- **Don't reuse yielded arrays.** If you yield an array and then mutate it, the consumer's copy
  changes too.
- **Iterator helpers** such as `iterator.map(...)` and `.take(...)` exist in recent Node
  releases, but they need the `ES2025` library in `tsc`. This course writes them as generators,
  which work everywhere and show what the helpers do.

## What you will practise

You will implement the iterator protocol in a class, write generators that are finite, infinite
and delegating, and watch a lazy pipeline pull only five values from an infinite source. The
challenge asks for a lazy, validated `chunk` function.
'''

[[unit.step]]
kind = "concept"
id = "ts-u18-c1-protocol"
title = "The iteration protocol"
points = 5
difficulty = 24
intro = '''
Iteration in JavaScript is a contract between two objects: the consumer calls `next()`, the
producer answers with a value and a `done` flag. Every loop and spread over a collection is built
on top of that one method.
'''
body = '''
## Iterable and iterator

```ts
interface Iterable<T> {
  [Symbol.iterator](): Iterator<T>;
}
interface Iterator<T> {
  next(): IteratorResult<T>; // { value: T, done: false } or { value: ..., done: true }
}
```

`Symbol.iterator` is a well-known symbol, a special property key that the language looks up.
`for (const x of xs)` calls `xs[Symbol.iterator]()` once, then `next()` until `done` is `true`.

## Generators write iterators for you

```ts
function* letters(): Generator<string, void, undefined> {
  yield "a";
  yield "b";
}
const g = letters(); // nothing has run yet
g.next();            // runs to the first yield: { value: "a", done: false }
```

A generator object is both an iterator and an iterable, so `[...letters()]` gives
`["a", "b"]`. Local variables survive between `yield`s, which is exactly the state you would
otherwise keep in fields.

## Lazy versus eager

`[1, 2, 3].map(f)` is eager: it calls `f` three times and builds a new array immediately. A
generator `map` is lazy: it calls `f` only when the consumer asks for the next value. Laziness
lets you describe an infinite sequence, or a huge file, and still stop after the first few items
with constant memory.

## One shot

Once an iterator reports `done: true`, it is finished. Arrays feel reusable only because each
`for...of` asks them for a brand new iterator. A generator object returns itself from
`[Symbol.iterator]()`, so a second loop over the same generator sees nothing at all.
'''

[[unit.step]]
