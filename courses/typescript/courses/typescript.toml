'''

[unit.step.gabarito]
solution = '''
// Keep the first character of the part before "@", replace the rest of that
// part with "*", keep "@" and the domain. No "@" (or "@" first): return as is.
export function maskEmail(email: string): string {
  const at = email.indexOf("@");
  if (at <= 0) {
    return email;
  }
  const hidden = "*".repeat(at - 1);
  return `${email[0]}${hidden}${email.slice(at)}`;
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
`indexOf` scans the string from the left until it meets the `@`, at most `n` characters,
where `n` is the length of the email. `repeat` builds `at - 1` stars, `slice` copies the
domain, and the template literal copies all the pieces into the result; each of these touches
every character at most a constant number of times. The total work is therefore **O(n)**.
The result has exactly the same length as the input, plus a few temporary pieces of at most
that size, so the extra space is **O(n)**. One `if` with `at <= 0` covers both special cases:
`-1` (no `@`) and `0` (`@` first).
'''

[[unit]]
id = "ts-u04-control-flow"
title = "Decisions: if, switch and narrowing"
level = "basic"
difficulty = 4
intro = '''
So far every program ran every line. Now your code will **choose**: `if`/`else` and `switch`
pick which statements run, based on comparisons and logical operators. You will learn why
TypeScript code uses `===`, which values count as "truthy", and how the checker **narrows** a
type once a condition has ruled some possibilities out.
'''
concepts = '''
## The idea

Real programs react to their data: a discount applies only above some amount, a login fails
when the password is wrong. A **condition** is an expression that is either true or false,
and **control flow** statements use conditions to decide which code runs next.

## How TypeScript does it

`if` runs a block when its condition is true; `else if` tries another condition; `else`
catches everything left:

```ts
const temperature: number = 31;
if (temperature >= 30) {
  console.log("hot");
} else if (temperature >= 15) {
  console.log("mild");
} else {
  console.log("cold");
}
```

Comparisons produce booleans: `<`, `<=`, `>`, `>=`, `===` (equal) and `!==` (not equal).
Combine them with `&&` (and), `||` (or) and `!` (not). For a short choice between two
values, the **conditional operator** reads `condition ? ifTrue : ifFalse`.

`switch` compares one value against several `case` labels with `===`. Execution jumps to the
matching case and continues until a `break`; `default` handles everything else.

## Truthiness and narrowing

An `if` accepts any value, not only booleans. These six are **falsy** and behave like
`false`: `false`, `0`, `""` (the empty string), `null`, `undefined` and `NaN`. Everything
else, including `"0"` and `"false"`, is **truthy**.

The checker follows your conditions. If a value has type `string | undefined` and you test
`if (value !== undefined)`, then inside that block TypeScript knows the value is a `string`.
This is called **narrowing**, and it is how TypeScript stays strict without getting in your
way:

```ts
const letter = "hi".at(5);          // string | undefined
if (letter !== undefined) {
  console.log(letter.toUpperCase()); // allowed: letter is a string here
}
```

## What is special or tricky

- **Use `===`, not `==`.** The double form converts types before comparing, so `"0" == 0` is
  `true`. Comparing values that can never be equal, such as a `number` with a `string`, is
  reported by `tsc` as `TS2367: This comparison appears to be unintentional because the
  types 'number' and 'string' have no overlap.`
- **Forgetting `break`** in a `switch` makes execution "fall through" into the next case.
- **Truthiness can lie.** `if (count)` is false when `count` is `0`, which is often a valid
  value. Compare explicitly (`count !== undefined`) when zero or the empty string matter.
- **`=` is assignment, not comparison.** Write `===` inside conditions.
- Using a possibly-`undefined` value without checking it first is reported as
  `'letter' is possibly 'undefined'.` Narrow it, as shown above.

## What you will practise

You will write an `if`/`else if` ladder, a `switch` with grouped cases, and conditions that
rely on truthiness and narrowing. Then you will classify triangles by the lengths of their
sides, a problem full of edge cases.
'''

[[unit.step]]
kind = "concept"
id = "ts-u04-c1-conditions"
title = "Conditions and branches"
points = 5
difficulty = 4
intro = '''
A branch makes a program's path depend on its data. Each condition is evaluated to true or
false, and exactly one branch of an `if`/`else if`/`else` chain runs: the first whose
condition holds.
'''
body = '''
## An if ladder runs at most one branch

```ts
const age: number = 15;
if (age >= 18) {
  console.log("adult");
} else if (age >= 13) {
  console.log("teenager");
} else {
  console.log("child");
}
```

Conditions are tested **from top to bottom**, and the first true one wins; the others are
skipped. Order matters: testing `age >= 13` first would label adults as teenagers too.

## Building conditions

- Comparisons: `<`, `<=`, `>`, `>=`, `===`, `!==`.
- Logic: `a && b` is true when both are; `a || b` when at least one is; `!a` flips a boolean.
- `&&` and `||` **short-circuit**: if the left side already decides the answer, the right
  side is not evaluated at all.

## Choosing a value

The conditional operator is an expression, so it produces a value you can store:

```ts
const label = age >= 18 ? "adult" : "minor";
```

## Narrowing

TypeScript reads your conditions too. After `if (x !== null)`, the checker removes `null`
from the type of `x` inside the block. After a `return` inside an `if`, the rest of the
function knows that case is gone. You get strict types without writing extra annotations:
the shape of your code is the proof.
'''

[[unit.step]]
kind = "drill"
