[unit.step.gabarito]
solution = '''
// Return the k most frequent words of `text` as [word, count] tuples:
// lower-case words made of ASCII letters, most frequent first, ties alphabetical.
export function topWords(text: string, k: number): Array<[string, number]> {
  if (k <= 0) return [];
  const counts = new Map<string, number>();
  for (const word of text.toLowerCase().match(/[a-z]+/g) ?? []) {
    counts.set(word, (counts.get(word) ?? 0) + 1);
  }
  const ranked = [...counts].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  return ranked.slice(0, k);
}
'''
time = "O(n + u log u)"
space = "O(u)"
justification = '''
Lower-casing and matching the text is one linear scan over its `n` characters, and each word
costs one O(1) average `get` and `set` on the `Map`, so counting is **O(n)**. Only the `u`
distinct words are sorted, which is **O(u log u)**; `slice` then copies at most `k` entries.
Since `u ≤ n`, the total is **O(n + u log u)**.

The map holds one entry per distinct word, so the extra space is **O(u)** (the array of matched
words is O(n) temporarily; a manual scan could avoid it). Two details make the result correct:
the comparator returns a number (`b[1] - a[1]` for counts, then an explicit alphabetical
comparison, because `a[0] < b[0]` alone is a boolean), and `?? []` handles `match` returning
`null` for a text without letters. Counting with `array.filter(...).length` for each word would
be O(n·u), which collapses on large texts; a heap of size `k` could lower the ranking step to
O(u log k) when `k` is small.
'''

[[unit]]
id = "ts-u13-errors"
title = "Errors: throw, catch and Result"
level = "intermediate"
difficulty = 13
intro = '''
Programs meet bad input, missing files and broken networks, and they need a disciplined way to
report and recover. This unit covers `throw`, `try`/`catch`/`finally`, why the caught value is
`unknown`, custom `Error` classes, and Result-style return values that put failure into the
type. You will finish by writing a parser that throws precise errors and a safe wrapper around it.
'''
concepts = '''
## The idea

An **exception** is a way to abandon the normal path of a computation. When code `throw`s, the
engine stops the current function and **unwinds the call stack**, function by function, until it
finds an enclosing `try` block with a `catch`. If nothing catches it, the program crashes with a
stack trace. This lets the code that *detects* a problem (deep inside a parser) be far away from
the code that knows how to *handle* it (the caller that can show a message or retry).

The alternative is to **return** failure as an ordinary value. Then the caller cannot ignore it
by accident, because the success value is only reachable after checking.

## How TypeScript does it

```ts
function parseAge(text: string): number {
  const n = Number(text);
  if (!Number.isInteger(n) || n < 0) throw new RangeError(`bad age: ${text}`);
  return n;
}

try {
  parseAge("-3");
} catch (e) {           // e: unknown
  if (e instanceof RangeError) console.log(e.message);
  else throw e;         // not ours: let it keep unwinding
} finally {
  console.log("always runs");
}
```

JavaScript can throw **any** value, not only `Error` objects, so under `--strict` the catch
variable is `unknown`. You must narrow it, usually with `instanceof`, before reading `.message`.
Custom errors are classes that extend `Error`; give them a `name` and any extra fields the
handler needs. `new Error(msg, { cause })` chains a low-level error to a high-level one.

A **Result** type is a discriminated union, as in unit 9:

```ts
type Result<T, E> = { ok: true; value: T } | { ok: false; error: E };
```

After `if (r.ok)`, the compiler knows `r.value` exists; in the `else` branch only `r.error` does.

## Pitfalls

- **No checked exceptions.** A function's type says nothing about what it throws. Document it,
  or return a Result when failure is an expected outcome rather than a bug.
- **`catch (e: any)`** or **`e as Error`** compiles, but if someone threw a string, `e.message`
  is `undefined`. Narrow instead of casting.
- **Throw `Error` objects, not strings.** Only `Error` objects carry a stack trace.
- **Swallowing errors.** An empty `catch {}` hides bugs. Catch what you can handle and rethrow
  the rest.
- **`finally` runs even after `return`**, and a `return` inside `finally` overrides the original
  result or error: avoid it.
- **`instanceof` with your own subclasses** works when you target ES2015 or later, as this
  course does. Older compile targets needed `Object.setPrototypeOf` workarounds.
- **Errors are run-time.** `tsc` cannot prove that `JSON.parse` will succeed; types describe
  values that exist, not ones that failed to appear.

## What you will practise

You will catch a `SyntaxError` from `JSON.parse` and see when `finally` runs, build a small
hierarchy of error classes with a `cause`, and validate input with a Result type. The challenge
asks for a parser that throws a custom error with a line number, plus a wrapper that turns it
into a Result.
'''

[[unit.step]]
kind = "concept"
id = "ts-u13-c1-throw-catch"
title = "Throwing, catching and unknown"
points = 5
difficulty = 13
intro = '''
When code throws, the engine unwinds the call stack until a `try` block catches the value.
Because JavaScript allows throwing anything, TypeScript types the caught value as `unknown`, and
narrowing it is your job.
'''
body = '''
## Throw and catch

```ts
function divide(a: number, b: number): number {
  if (b === 0) throw new Error("division by zero");
  return a / b;
}

try {
  console.log(divide(1, 0));
} catch (e) {
  console.log(e instanceof Error ? e.message : String(e));
}
```

`throw` ends `divide` immediately; the `console.log` inside `try` never runs. Control jumps to
`catch`, which prints `division by zero`.

## Why `unknown`?

`throw "oops"`, `throw 42` and `throw { code: 1 }` are all legal JavaScript. So in
`catch (e)`, the compiler cannot promise that `e` is an `Error`. Under `--strict` it is
`unknown`, and you must check before you use it:

```ts
catch (e) {
  if (e instanceof TypeError) { /* handle it */ }
  else throw e;              // rethrow what you cannot handle
}
```

## finally

A `finally` block runs whether the `try` succeeded, threw, or returned. It is the place to
release resources: close a file, stop a timer, unlock a mutex.

## Custom errors

```ts
class NotFoundError extends Error {
  constructor(readonly id: number) {
    super(`item ${id} not found`);
    this.name = "NotFoundError";
  }
}
```

A subclass lets a handler recognise the failure with `instanceof` and read extra fields such as
`id`, instead of parsing message strings.

## Results instead of exceptions

When failure is a normal outcome (invalid form input, a missing config key), returning
`{ ok: false, error }` makes the caller deal with it, and the compiler checks that they did.
Keep exceptions for the truly unexpected.
'''

