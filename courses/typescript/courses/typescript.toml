instructions = '''
## Your turn

Implement `loadAll`:

```ts
export async function loadAll<T>(
  ids: readonly number[],
  load: (id: number) => Promise<T>,
): Promise<{ values: T[]; failed: number[] }>
```

Call `load` once for each element of `ids` and wait for all of them.

Rules:

- **Start every load before waiting for any.** The tests measure how many loads are in progress
  at the same time, so a loop that awaits each load in turn will fail.
- `values` holds the results of the successful loads **in the order of `ids`**, not in the order
  they finished.
- A load that rejects must not reject `loadAll`. Its id goes into `failed`, also in the order of
  `ids`.
- A `load` function may also throw **synchronously** instead of returning a rejected promise.
  Treat that as a failure too.
- Duplicate ids are loaded once per occurrence. An empty `ids` resolves to
  `{ values: [], failed: [] }` without calling `load`.

Example: with `ids = [1, 2, 3]` and a `load` that rejects for 2,
`await loadAll(ids, load)` resolves to `{ values: [load result for 1, load result for 3], failed: [2] }`.

Hidden tests decide correctness.
'''
starter = '''
