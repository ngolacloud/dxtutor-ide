intro = '''
A function that takes or returns another function is called higher-order. Together with closures,
which remember the variables around them, this is enough to build caches, counters, decorators and
pipelines without classes.
'''
body = '''
## Higher-order functions

```ts
const twice = <T>(f: (x: T) => T) => (x: T): T => f(f(x));
const addThree = (n: number) => n + 3;
twice(addThree)(1); // 7
```

`twice` receives a function and returns a new one. The types are generic, so `twice` works for
strings, numbers or any other type, and `tsc` checks that `f` accepts what it returns.

## Closures

```ts
function makeCounter(): () => number {
  let count = 0;
  return () => ++count;
}
```

Each call to `makeCounter` creates a fresh `count`, and the returned arrow function keeps it alive.
Nothing outside can read or change `count` except through that function: the closure is a private
field.

## Purity and immutability

A pure function returns the same output for the same input and changes nothing outside itself.
`(xs: readonly number[]) => xs.reduce((a, b) => a + b, 0)` is pure; a function that pushes onto
an array it received is not. Return new values instead:

```ts
const append = <T>(xs: readonly T[], x: T): T[] => [...xs, x];
```

## Composition

Small, pure functions snap together. `pipe(trim, lower)` gives a function that trims and then
lowercases; `compose(f, g)` applies `g` first and `f` second. Each piece stays tiny and testable,
and the composed function is just another value you can pass around.
'''

