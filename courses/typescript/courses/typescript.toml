'''

[unit.step.gabarito]
solution = '''
// Return the length of the longest group of equal, adjacent values (0 if empty).
export function longestRun(values: number[]): number {
  if (values.length === 0) {
    return 0;
  }
  let best = 1;
  let current = 1;
  for (let i = 1; i < values.length; i++) {
    if (values[i] === values[i - 1]) {
      current++;
    } else {
      current = 1;
    }
    if (current > best) {
      best = current;
    }
  }
  return best;
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
The loop visits each of the `n` elements once and does a constant amount of work per element
(one comparison with its neighbour, one or two updates), so the time is **O(n)**. It keeps
only two counters, `current` and `best`, whatever the size of the input, so the extra space
is **O(1)**.

The invariant makes it correct: after processing index `i`, `current` is the length of the
run that ends at `i`, and `best` is the longest run anywhere in `values[0..i]`. Updating
`best` inside the loop, not only when a run ends, is what handles a run at the very end of
the array. Comparing every pair of positions instead would also work, but would take O(n²)
time and be far too slow for 100,000 elements.
'''

[[unit]]
id = "ts-u06-functions"
title = "Functions"
level = "basic"
difficulty = 6
intro = '''
Functions let you name a piece of work and reuse it. You will declare functions with typed
parameters and return types, make parameters optional or give them defaults, write compact
**arrow functions**, and meet `void`, the return type of functions that only do something.
You will also pass a function to another function, a first taste of a very powerful idea.
'''
concepts = '''
## The idea

A **function** is a named, reusable block of code. It receives inputs, called
**parameters**, and usually hands back an output, its **return value**. Functions let you
solve a problem once and use the solution everywhere, and they give that solution a name
that explains what it does. In TypeScript the inputs and the output have types, so a
function's first line is a small contract that the checker enforces at every call.

## How TypeScript does it

```ts
function area(width: number, height: number): number {
  return width * height;
}
const a = area(3, 4);   // 12
```

Each parameter has a type, and the type after the parentheses is the **return type**. You can
often leave the return type out and let TypeScript infer it, but writing it documents the
contract and catches mistakes inside the function.

A parameter becomes **optional** with `?` (its value is `undefined` when omitted), or gets a
**default** with `=`:

```ts
function label(text: string, suffix?: string): string {
  return suffix === undefined ? text : `${text} ${suffix}`;
}
function power(base: number, exponent = 2): number {
  return base ** exponent;
}
```

**Arrow functions** are a shorter way to write a function value. When the body is a single
expression, it is returned automatically:

```ts
const half = (n: number): number => n / 2;
```

A function that returns nothing useful has the return type **`void`**. Functions are values,
so you can store them in variables and pass them as arguments. The type of a function value
looks like an arrow: `(n: number) => number`.

## What is special or tricky

- **Unannotated parameters** are an error under `--strict`: `TS7006: Parameter 'x' implicitly
  has an 'any' type.` Always type your parameters.
- **Wrong number of arguments** is caught: `TS2554: Expected 2 arguments, but got 1.`
- **A missing `return` on some path** gives `TS2366: Function lacks ending return statement
  and return type does not include 'undefined'.`
- **Optional parameters must come after required ones.**
- **`return` ends the function.** Code after it in the same block never runs.
- **Hoisting.** A `function` declaration can be called before the line where it appears; a
  `const` arrow function cannot be used before its line runs.
- Printing is not returning: a function that calls `console.log` returns `undefined`.

## What you will practise

You will declare and combine functions, use optional and default parameters, write arrow
functions and a `void` function, and pass one function to another. Then you will write a
pricing function whose optional parameters change its behaviour, and that rejects bad input
by throwing an error.
'''

[[unit.step]]
kind = "concept"
id = "ts-u06-c1-functions"
title = "Functions as typed contracts"
points = 5
difficulty = 6
intro = '''
A function's signature (its name, parameter types and return type) is a contract between the
code that defines it and the code that calls it. The checker verifies both sides: the body
must return what it promises, and every call must pass what it asks for.
'''
body = '''
## Defining and calling

```ts
function fullPrice(price: number, taxRate: number): number {
  const tax = price * taxRate;
  return price + tax;
}
console.log(fullPrice(100, 0.23));   // 123
```

When you call `fullPrice(100, 0.23)`, the arguments are copied into the parameters `price`
and `taxRate`, the body runs, and `return` sends a value back to the caller. Variables
declared inside, like `tax`, exist only while the call runs; nothing outside can see them.

## What the types buy you

- Calling `fullPrice("100", 0.23)` is an error: a `string` is not a `number`.
- Calling `fullPrice(100)` is an error: an argument is missing.
- If the body forgot to `return`, the declared `: number` would make the checker complain.

## Flexible parameters

`name?: string` makes a parameter optional (it is `undefined` when omitted), and
`count = 1` gives it a default value. Both must come after the required parameters.

## Arrow functions and `void`

```ts
const square = (x: number): number => x * x;
function log(message: string): void {
  console.log(message);
}
```

An arrow function is a function **value**, often used for short helpers and for passing
behaviour to other functions. `void` says "this function is called for its effect, not its
result". Splitting a program into small, well-named, typed functions is the single best way
to keep it readable.
'''

