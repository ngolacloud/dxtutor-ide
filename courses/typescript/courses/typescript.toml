dxt.test("merge applies falsy values", () => {
  const t_m = merge<t_User>({ id: 9, name: "x", email: "y", admin: true }, { id: 0, name: "", admin: false });
  dxt.equal(t_m, { id: 0, name: "", email: "y", admin: false });
