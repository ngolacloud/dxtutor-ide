[[unit.step]]
kind = "challenge"
id = "ts-u12-x1-top-words"
title = "The most frequent words"
points = 30
difficulty = 12
entry = "topWords"
intro = '''
A word-frequency ranking combines a hash map for counting with a sort for ranking. Counting is
linear in the length of the text; sorting only touches the distinct words, which are usually far
fewer. A precise tie-breaking rule is what makes the output deterministic and testable.
'''
instructions = '''
## Your turn

Implement `topWords`:

```ts
export function topWords(text: string, k: number): Array<[string, number]>
```

Return the `k` most frequent words of `text`, as `[word, count]` tuples.

Rules:

- A **word** is a maximal run of ASCII letters `A`–`Z` and `a`–`z`. Everything else (spaces,
  digits, punctuation, newlines) separates words.
- Words are compared **case-insensitively** and returned in lower case: `"The"` and `"the"` are
  the same word, `"the"`.
- Sort by **count, highest first**. Words with the same count are sorted **alphabetically**
  (plain string comparison).
- Return at most `k` entries. If `k` is 0 or negative, return `[]`. If there are fewer than `k`
  distinct words, return them all.
- The text can contain hundreds of thousands of words: count in one pass with a `Map`.

Examples:

- `topWords("b a b c a b", 2)` returns `[["b", 3], ["a", 2]]`.
- `topWords("To be, or not to be!", 3)` returns `[["be", 2], ["to", 2], ["not", 1]]`.
- `topWords("", 5)` returns `[]`.

**Hint:** `text.toLowerCase().match(/[a-z]+/g)` returns the words, or `null` when there are none.

Hidden tests decide correctness.
'''
