entry = "classifyTriangle"
intro = '''
Classification problems are where conditions earn their keep: the order of the checks matters,
and the invalid cases must be ruled out before anything else. The **triangle inequality**
says that three lengths form a real triangle only when each side is shorter than the sum of
the other two.
