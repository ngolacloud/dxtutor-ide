instructions = '''
## Your turn

Implement the function `parallelSum`:

```ts
export async function parallelSum(file: string, upto: number, workers: number): Promise<number>
```

`file` is a database file that may not exist yet. Then:

1. Open it, switch it to **WAL** with `PRAGMA journal_mode = WAL`, and create the table
   `nums (n INTEGER)` if it does not exist.
2. Start `workers` async tasks (`workers >= 1`) that run concurrently. Each task opens
   **its own** connection with a busy timeout and inserts its share of the numbers
   `1..upto`, so that every number is inserted exactly once.
3. Each task writes in transactions of at most 100 rows. Never `await` inside a transaction:
   commit, then `await new Promise((resolve) => setImmediate(resolve))` to let the other tasks
   run. Close each task's connection when it is done.
4. Wait for all tasks, then return `SUM(n)` over the whole table, or `0` when it is empty.

Examples, on a new file:

- `await parallelSum(file, 100, 4)` -> `5050`
- `await parallelSum(file, 3, 8)` -> `6` (some workers have nothing to do)
- `await parallelSum(file, 0, 4)` -> `0`

Hidden tests decide correctness. They also check the journal mode, the rows left in `nums`,
and that no lock is still held when the promise resolves.
'''
starter = '''
