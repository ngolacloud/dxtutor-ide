intro = '''
Brackets nest: the bracket opened last must be closed first. That is exactly LIFO order, so a
stack of open brackets checks a whole string in one O(n) pass. A closing bracket must match the
top of the stack, and at the end the stack must be empty.
'''
prompt = '''
Write `balanced`, which checks whether the brackets in a string are properly nested, and run it
on five inputs.

**Why:** bracket matching is the textbook stack problem, and the same idea checks HTML tags,
parses expressions and drives a compiler's parser.
'''
target = '''
const OPENER: Record<string, string> = { ")": "(", "]": "[", "}": "{" };

function balanced(text: string): boolean {
  const stack: string[] = [];
  for (const ch of text) {
    if (ch === "(" || ch === "[" || ch === "{") {
      stack.push(ch);
    } else if (ch in OPENER) {
      if (stack.pop() !== OPENER[ch]) return false;
    }
  }
  return stack.length === 0;
}

for (const s of ["(a[b]{c})", "([)]", "((", "", "f(x) = [1, {2}]"]) {
  console.log(JSON.stringify(s), balanced(s));
}
'''
