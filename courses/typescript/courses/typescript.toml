intro = '''
Aggregation, "group the records by a key and combine each group", is the heart of reporting
code and of SQL's `GROUP BY`. With a hash-based dictionary, each record is folded into its group
in O(1) expected time, so the cost is one pass over the data plus sorting the groups.
