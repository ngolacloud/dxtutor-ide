destructuring. Returning a new iterator object, with its own position, from each call is what
makes the iterable reusable rather than one-shot.
'''
prompt = '''
Write a `Countdown` class that is iterable, then consume it with spread, `for...of`, manual
`next()` calls and destructuring.

**Why:** seeing the raw `{ value, done }` objects demystifies every loop you write, and shows that
the state of an iteration lives in the iterator, not in the collection.
'''
target = '''
class Countdown implements Iterable<number> {
  readonly from: number;

  constructor(from: number) {
    this.from = from;
  }

  [Symbol.iterator](): Iterator<number> {
    let current = this.from;
    return {
      next(): IteratorResult<number> {
        if (current < 0) return { done: true, value: undefined };
        return { done: false, value: current-- };
      },
    };
  }
}

const c = new Countdown(3);
console.log([...c]);
for (const n of c) {
  if (n % 2 === 1) console.log("odd", n);
}

const it = c[Symbol.iterator]();
console.log(it.next(), it.next());

const [first, second] = new Countdown(9);
console.log(first, second, Math.max(...new Countdown(5)));
'''
