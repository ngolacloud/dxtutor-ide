entry = "reverseList"
intro = '''
Reversing a singly linked list is the classic test of pointer rewiring: every `next`
reference must be turned around while you still hold enough references not to lose the rest
of the chain. Done well, it is one pass with O(1) extra memory and creates no nodes at all.
'''
instructions = '''
## Your turn

Implement `reverseList`:

```ts
function reverseList<T>(head: ListNode<T> | null): ListNode<T> | null
```

Reverse the singly linked list that starts at `head` **in place** and return the new head.
The generic `ListNode<T>` class is provided in the starter; don't change it.

Rules:

- Reuse the existing nodes. Rewire their `next` references; don't create new nodes and don't
  change any node's `value`.
- The old head becomes the last node, so its `next` must end up as `null`.
- Lists can have 100,000 nodes, far beyond Node's call-stack depth, so a recursive solution
  will throw `RangeError`. Use a loop.
- Don't copy the values into an array: the tests check node identity.

Examples (lists written as chains):

- `reverseList(null)` returns `null`.
- `1 -> 2 -> 3` becomes `3 -> 2 -> 1`, and the returned head is the node that held 3.
- `5` stays `5`, and the same node comes back.

**Hint:** walk the list once with two references, the part already reversed and the part not
yet visited. Save the next node in a `const` before you overwrite `next`.

Hidden tests decide correctness.
'''
starter = '''
/** A singly linked list node (provided: do not change it). */
export class ListNode<T> {
  value: T;
  next: ListNode<T> | null;

  constructor(value: T, next: ListNode<T> | null = null) {
    this.value = value;
    this.next = next;
  }
}

/**
 * Reverse the list that starts at `head` in place and return its new head.
 * Rewire the existing nodes' `next` references: create no new nodes and
 * leave every `value` unchanged.
 */
export function reverseList<T>(head: ListNode<T> | null): ListNode<T> | null {
  throw new Error("not implemented");
}
'''
tests = '''
function t_build<T>(values: T[]): ListNode<T> | null {
  let head: ListNode<T> | null = null;
  for (let i = values.length - 1; i >= 0; i--) head = new ListNode(values[i], head);
  return head;
}

function t_nodes<T>(head: ListNode<T> | null, limit: number): ListNode<T>[] {
  const out: ListNode<T>[] = [];
  for (let n = head; n !== null; n = n.next) {
    out.push(n);
    if (out.length > limit) throw new Error("the list has a cycle: an old next was not cleared");
  }
  return out;
}

function t_values<T>(head: ListNode<T> | null, limit: number): T[] {
  return t_nodes(head, limit).map((n) => n.value);
}

dxt.test("empty list", () => {
  dxt.equal(reverseList(null), null);
});

dxt.test("single node comes back unchanged", () => {
  const n = new ListNode(5);
  const r = reverseList(n);
  dxt.check(r === n, "the same node must be returned");
  dxt.equal(n.next, null);
  dxt.equal(n.value, 5);
});

dxt.test("three nodes", () => {
  dxt.equal(t_values(reverseList(t_build([1, 2, 3])), 10), [3, 2, 1]);
});

dxt.test("two string nodes", () => {
  dxt.equal(t_values(reverseList(t_build(["a", "b"])), 10), ["b", "a"]);
});

dxt.test("duplicates and negatives", () => {
  dxt.equal(t_values(reverseList(t_build([-1, 0, -1, 2, 2])), 20), [2, 2, -1, 0, -1]);
});

dxt.test("reuses the same nodes and keeps their values", () => {
  const head = t_build([10, 20, 30, 40]);
  const original = t_nodes(head, 10);
  const r = reverseList(head);
  dxt.check(r === original[3], "the new head must be the old last node");
  const got = t_nodes(r, 10);
  dxt.equal(got.length, 4);
  for (let i = 0; i < 4; i++) {
    dxt.check(got[i] === original[3 - i], "nodes must be rewired, not recreated");
  }
  dxt.equal(original.map((n) => n.value), [10, 20, 30, 40]);
});

dxt.test("old head becomes the tail", () => {
  const head = t_build([1, 2, 3, 4, 5]);
  reverseList(head);
  dxt.equal(head?.next, null);
});

dxt.test("reversing twice restores the list", () => {
  const head = t_build([0, 1, 2, 3, 4, 5, 6]);
  const once = reverseList(head);
  dxt.equal(t_values(once, 20), [6, 5, 4, 3, 2, 1, 0]);
  const twice = reverseList(once);
  dxt.check(twice === head, "reversing twice must give back the original head");
  dxt.equal(t_values(twice, 20), [0, 1, 2, 3, 4, 5, 6]);
});

dxt.test("100,000 nodes in one fast pass", () => {
  const n = 100_000;
  const values = Array.from({ length: n }, (_, i) => i);
  const head = t_build(values);
  const start = performance.now();
  const r = reverseList(head);
  const elapsed = performance.now() - start;
  dxt.equal(t_values(r, n + 1), values.reverse());
  dxt.check(elapsed < 1000, `reversal took ${elapsed.toFixed(0)} ms; it should be a single O(n) pass`);
});
'''

[unit.step.gabarito]
solution = '''
/** A singly linked list node (provided: do not change it). */
export class ListNode<T> {
  value: T;
  next: ListNode<T> | null;

  constructor(value: T, next: ListNode<T> | null = null) {
    this.value = value;
    this.next = next;
  }
}

/** Reverse the list that starts at `head` in place and return its new head. */
export function reverseList<T>(head: ListNode<T> | null): ListNode<T> | null {
  let prev: ListNode<T> | null = null;
  let node = head;
  while (node !== null) {
    const following = node.next;
    node.next = prev;
    prev = node;
    node = following;
  }
  return prev;
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
The loop visits each node exactly once and does a constant amount of work per node (save
`next`, flip it, advance two references), so the time is **O(n)**. Only three references are
kept (`prev`, `node`, `following`) regardless of the list's length, so the extra space is
**O(1)**: the nodes themselves are reused, not copied.

The invariant is what makes it correct: before each iteration, `prev` heads the already
reversed prefix and `node` heads the untouched suffix. Saving `node.next` first is essential,
because flipping it would otherwise cut off the suffix. When `node` reaches `null`, `prev` is
the old last node, the new head. The explicit annotation `ListNode<T> | null` on `prev` is
needed because `null` alone would be inferred as type `null`. A recursive version would also
be O(n) time, but it uses O(n) stack frames and throws `RangeError` long before 100,000
nodes; copying the values into an array and writing them back would break the "reuse the
nodes" contract and cost O(n) extra space.
'''

[[unit]]
id = "ts-u25-hash-maps-sets"
title = "Hash tables, frequencies and sets"
level = "advanced"
difficulty = 31
intro = '''
JavaScript's `Map` and `Set` answer "is this key here?" in constant time on average because
they are hash tables. In this unit you open the box: you will turn string keys into bucket
indexes, build a tiny chained hash map with a generic value type, count frequencies and
combine sets, and then write a hash map from scratch that grows itself as it fills up.
'''
concepts = '''
## The idea

A **hash table** stores key-value pairs in an array of **buckets**. A **hash function** turns each key into a number, and `hash % buckets.length` picks the bucket. To find a key you hash it, jump straight to one bucket, and compare keys only inside it. If the keys are spread evenly, each bucket holds a handful of entries, so lookup, insert and delete cost **O(1) on average**.

Two different keys can land in the same bucket: a **collision**. With **separate chaining**, each bucket is a small list of entries, and a lookup scans just that list. The **load factor** (entries divided by buckets) measures how crowded the table is. When it passes a threshold, often 0.75, the table **doubles** its buckets and **rehashes** every entry. That one step is O(n), but it happens so rarely that each insert is still **amortised O(1)**. The worst case is O(n): a bad hash that sends every key to the same bucket turns the table into a list.

## How TypeScript does it

`Map<K, V>` and `Set<T>` are the built-in hash tables, and they remember insertion order. A typical frequency count:

```ts
const counts = new Map<string, number>();
for (const ch of "banana") {
  counts.set(ch, (counts.get(ch) ?? 0) + 1);
}
```

`get` returns `V | undefined`, so the compiler makes you decide what a missing key means; `?? 0` does that here. Set algebra is a filter away: `[...a].filter((x) => b.has(x))` is the intersection.

JavaScript gives you no public hash function, so a hand-made table needs its own. A classic string hash multiplies by 31 and adds each character code. `Math.imul` does a 32-bit multiply and `>>> 0` turns the result into an unsigned integer, so the number never grows huge or negative:

```ts
let h = 0;
for (let i = 0; i < key.length; i++) {
  h = (Math.imul(h, 31) + key.charCodeAt(i)) >>> 0;
}
```

Entries can be typed as tuples, `Array<Array<[string, V]>>`, and a generic class parameter `V` keeps the values typed.

## What is special or tricky

- **Object keys compare by reference.** `new Map([[[1, 2], "x"]]).get([1, 2])` is `undefined`, because the second `[1, 2]` is a different array. Use a string or number key, such as `"1,2"`.
- **Plain objects are poor maps.** `Record<string, number>` works for fixed keys, but every key becomes a string, inherited names such as `"constructor"` are already "there", and `"__proto__"` is special. Prefer `Map` for data keys.
- **`undefined` can be a real value.** `get` returns `undefined` both for a missing key and for a stored `undefined`; `has` tells them apart. Avoid `map.get(k)!`: the `!` is an unchecked cast that hides a missing key until it crashes.
- **Mutating a key after inserting it** is impossible with strings, which is one reason they make good keys.

## What you will practise

You will hash words into buckets and watch two collide, write a chained `put`/`get`, and count frequencies and combine sets with `Map` and `Set`. The challenge is a generic `HashMap<V>` that chains collisions and doubles itself, tested with 100,000 keys.
'''

[[unit.step]]
kind = "concept"
id = "ts-u25-c1-buckets"
title = "Buckets, hashing and collisions"
points = 5
difficulty = 31
intro = '''
A hash table is an array plus a function that maps every key to an index. The function makes
lookups O(1) on average, collisions are inevitable, and resizing keeps the buckets short as
the table grows.
'''
body = '''
## From key to index

A hash function maps a key to a large integer. Taking it modulo the number of buckets gives
an index:

```ts
const index = hashString(key) % buckets.length;
```

The same key always gives the same hash, so a later lookup goes straight back to the same
bucket. Different keys usually give different hashes, which spreads them out.

## Collisions

With more possible keys than buckets, some keys must share a bucket. That is a collision, and
it is normal. With **chaining**, every bucket is an array of `[key, value]` tuples:

```
bucket 0: [ ["dog", 1] ]
bucket 1: [ ["emu", 4] ]
bucket 2: [ ["cat", 3], ["gnu", 2] ]
bucket 3: [ ["fox", 5] ]
```

A lookup hashes the key, picks the bucket, and compares keys with `===` inside it. Short
buckets mean few comparisons.

## Load factor and resizing

The load factor is `size / buckets.length`. Past about 0.75, buckets get long. The fix is to
**double** the array and reinsert every entry, because each index depends on the bucket count.
Doubling costs O(n), but after it you can insert as many keys again before the next one. Spread
over all those inserts, the cost per insert is O(1): **amortised** constant time.

## Why order is not guaranteed

A raw hash table stores keys in hash order, which looks random. `Map` and `Set` add extra
bookkeeping so that iteration follows insertion order; a hand-made table does not.
'''

