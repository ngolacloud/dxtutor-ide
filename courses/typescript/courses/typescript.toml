[unit.step.gabarito]
solution = '''
export type Score = [name: string, points: number];
export type Ranked = [rank: number, name: string, points: number];

function byPointsThenName([nameA, a]: Score, [nameB, b]: Score): number {
  if (a !== b) return b - a;
  return nameA < nameB ? -1 : nameA > nameB ? 1 : 0;
}

export function leaderboard(scores: readonly Score[], k: number): Ranked[] {
  if (!Number.isInteger(k) || k < 0) {
    throw new RangeError(`k must be a non-negative integer, got ${k}`);
  }
  const valid: Score[] = scores.filter(([, points]) => !Number.isNaN(points));
  valid.sort(byPointsThenName);

  const rows: Ranked[] = [];
  for (let i = 0; i < valid.length && i < k; i++) {
    const [name, points] = valid[i];
    const tiedWithPrevious = i > 0 && rows[i - 1][2] === points;
    const rank = tiedWithPrevious ? rows[i - 1][0] : i + 1;
    rows.push([rank, name, points]);
  }
  return rows;
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
`filter` makes one O(n) pass and allocates a new array of at most n entries, which is the
**O(n)** extra space. Sorting that copy with a comparator costs **O(n log n)** comparisons, and
each comparison is O(1) for short names. The final loop visits at most min(k, n) rows, doing
constant work per row, so it is O(k). The sort dominates: **O(n log n)** overall.

Sorting the filtered copy rather than `scores` is what keeps the caller's array untouched
without a second copy. The competition rank is correct because the sort puts equal scores next
to each other: a row either shares the previous row's rank or takes its own 1-based position,
which skips exactly as many ranks as the tie was long. If k were usually tiny compared with n,
a heap of size k could select the top rows in O(n log k), but the sort is simpler and fast
enough for 100,000 entries.
'''

[[unit]]
id = "ts-u08-objects-interfaces"
title = "Objects & interfaces"
level = "intermediate"
difficulty = 8
intro = '''
Real data comes in records: a user has a name and an email, an order has lines and a total.
This unit shows how TypeScript describes the shape of an object with interfaces and type
aliases, how optional and readonly properties work, and why TypeScript compares objects by
their shape rather than by their name.
'''
concepts = '''
## The idea

An **object** groups named values, its **properties**, into one record. In JavaScript an
object is a dynamic bag of keys: you can add, read or delete any property at any time, and a
typo such as `user.emial` silently gives `undefined`. TypeScript describes the **shape** an
object must have, which properties exist and what type each one holds, and then checks every
access against that shape.

The key design decision is **structural typing**. A value fits a type if it has the right
properties with the right types, whatever it is called and wherever it was created. Nobody
has to declare "I am a `Point`"; having numeric `x` and `y` is enough. This matches how
JavaScript code is really written, with object literals and JSON passed around freely.

## How TypeScript does it

An `interface` and a `type` alias can both name an object shape:

```ts
interface User {
  readonly id: number;   // can be set once, never reassigned
  name: string;
  nickname?: string;     // optional: string | undefined when read
}

type Address = { city: string; zip: string };
```

Interfaces **extend** other interfaces, and type aliases combine shapes with the
**intersection** operator `&`. Only `type` can name unions, tuples and primitives
(`type ID = string | number`); only `interface` supports **declaration merging**, where two
declarations with the same name add up. For plain object shapes either works, and many teams
prefer `interface` for objects and `type` for everything else.

An **index signature** describes an object used as a dictionary:

```ts
interface Stock {
  [sku: string]: number;
}
```

## Pitfalls

- **Optional means "may be missing".** Reading `user.nickname` gives `string | undefined`;
  narrow it (`!== undefined`) or provide a default with `??` before using it as a string.
- **Excess property checks apply only to fresh literals.** Passing `{ x: 1, y: 2, z: 3 }`
  directly where a `Point` is expected is an error (TS2353, "Object literal may only specify
  known properties"), but the same object stored in a variable first is accepted.
- **`readonly` is shallow and compile-time only.** A `readonly items: string[]` cannot be
  reassigned, yet `items.push` still works, and nothing stops mutation at run time.
- **Index signatures trust every key.** `stock.kiwi` is typed `number` even when it is
  absent. Plain objects also inherit keys like `constructor` and `toString` from
  `Object.prototype`, so `"toString" in stock` is true. For arbitrary keys, a `Map` is safer.
- **`as` casts lie.** `{} as User` compiles, then crashes later when `name` is `undefined`.
- A missing required property is TS2741: "Property 'name' is missing in type ...".

## What you will practise

You will model a record with readonly and optional properties, combine shapes with `extends`
and `&`, and watch structural typing and excess property checks in action. The challenge
aggregates nested order records into per-customer totals.
'''

[[unit.step]]
kind = "concept"
id = "ts-u08-c1-shapes"
title = "Describing object shapes"
points = 5
difficulty = 8
intro = '''
A type in TypeScript is a set of values, and an object type is the set of all objects that
have certain properties. Checking membership looks only at the shape, never at a class name,
which is why the system is called structural.
'''
body = '''
## A shape is a list of properties

```ts
interface Product {
  readonly sku: string;
  name: string;
  price: number;
  tags?: string[];
}
```

Each line names a property and its type. `readonly` forbids reassignment after the object is
created, and `?` makes a property optional: it may be absent, and reading it gives
`string[] | undefined`.

## Checking happens by shape

```ts
function label(p: { name: string; price: number }): string {
  return `${p.name}: ${p.price}`;
}

const pen: Product = { sku: "P-1", name: "Pen", price: 2 };
label(pen); // OK: a Product has name and price, plus extras
```

`label` never mentions `Product`, yet it accepts one, because a `Product` has every property
`label` needs. Extra properties are fine for values you already hold. Only an object literal
written directly at the call site is checked for unknown properties, because there an extra
key is almost always a typo.

## Interface or type?

Both name object shapes, and both are erased before the program runs. Reach for `interface`
to describe objects that others may extend, and for `type` when you need unions,
intersections or tuples. Neither creates anything at run time: no constructor, no
`instanceof`. If data arrives from outside the program, such as JSON from a file or a
network, the compiler cannot know its real shape; you must check it yourself, a job unit 9's
narrowing tools are made for.
'''

