instructions = '''
## Your turn

Implement `totalsByCustomer`. The interfaces are given in the starter:

```ts
export interface LineItem { readonly sku: string; readonly qty: number; readonly unitPrice: number }
export interface Order {
  readonly id: string;
  readonly customer: string;
  readonly items: readonly LineItem[];
  readonly discount?: number;
}
export interface CustomerTotal { customer: string; orders: number; spent: number }

export function totalsByCustomer(orders: readonly Order[]): CustomerTotal[]
```

All amounts are whole numbers of cents, so the arithmetic is exact.

Rules:

- An order's total is the sum of `qty * unitPrice` over its items, minus its `discount` (0 when
  absent). A total never goes below 0.
- Return one `CustomerTotal` per distinct customer: `orders` counts their orders (an order with
  no items still counts) and `spent` adds up their order totals.
- Sort the result by `spent`, highest first; break ties by customer name in ascending code-unit
  order (`<`).
- Customer names are arbitrary, case-sensitive strings, including names such as `constructor`
  or `toString`.
- Don't modify the input. An empty list gives `[]`.

Example:

```ts
totalsByCustomer([
  { id: "o1", customer: "ana", items: [{ sku: "pen", qty: 3, unitPrice: 150 }] },
  { id: "o2", customer: "ben", items: [{ sku: "ink", qty: 1, unitPrice: 900 }], discount: 100 },
  { id: "o3", customer: "ana", items: [] },
]);
// [{ customer: "ben", orders: 1, spent: 800 }, { customer: "ana", orders: 2, spent: 450 }]
```

**Hint:** group with a `Map<string, CustomerTotal>` (unit 12 covers `Map` in depth). A plain
object used as a dictionary inherits keys such as `toString`, which is exactly the trap the
naming rule above is about.

