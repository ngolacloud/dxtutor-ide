target = '''
function* range(start: number, end: number, step = 1): Generator<number, void, undefined> {
  for (let i = start; i < end; i += step) yield i;
}

function* fibonacci(): Generator<number, never, undefined> {
  let [a, b] = [0, 1];
  while (true) {
    yield a;
    [a, b] = [b, a + b];
