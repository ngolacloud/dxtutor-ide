  deepFreeze(o);
  dxt.throws(() => {
    o.inner.n = 2;
  }, "writing a nested property should throw in strict mode");
  dxt.throws(() => {
    o.xs.push(3);
  }, "pushing onto a frozen array should throw");
  dxt.equal(o, { inner: { n: 1 }, xs: [1, 2] });
});

dxt.test("primitives and null pass through", () => {
  dxt.equal(deepFreeze(5), 5);
  dxt.equal(deepFreeze("text"), "text");
  dxt.equal(deepFreeze(null), null);
  dxt.equal(deepFreeze(undefined), undefined);
});

dxt.test("an empty object and an empty array", () => {
  const e = {};
  const a: number[] = [];
  dxt.check(deepFreeze(e) === e && Object.isFrozen(e));
  dxt.check(deepFreeze(a) === a && Object.isFrozen(a));
});

dxt.test("cycles and shared objects terminate", () => {
  type T_Node = { name: string; self?: T_Node; child: { parent?: T_Node; leaf: { v: number } } };
  const shared = { v: 7 };
  const a: T_Node = { name: "a", child: { leaf: shared } };
  a.self = a;
  a.child.parent = a;
  const pair = { left: shared, right: shared, a };
  deepFreeze(pair);
  dxt.check(Object.isFrozen(pair) && Object.isFrozen(a) && Object.isFrozen(a.child));
  dxt.check(Object.isFrozen(shared), "a shared object must be frozen too");
