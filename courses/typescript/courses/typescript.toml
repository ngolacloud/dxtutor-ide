instructions = '''
## Your turn

Implement the function `greet`:

```ts
export function greet(name: string): string
```

It takes a name and **returns** (does not print) a string that reads `Hello, {name}!`.

Examples:

- `greet("World")` → `"Hello, World!"`
- `greet("Ada Lovelace")` → `"Hello, Ada Lovelace!"`
- `greet("")` → `"Hello, !"`

**Hint:** build the result by joining strings with `+`, and hand it back with `return`.
Keep the `export` keyword: it lets the tests see your function.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Return a greeting of the form "Hello, {name}!".
// Use `return`, not console.log.
export function greet(name: string): string {
  throw new Error("not implemented");
}
'''
tests = '''
dxt.test("greets the world", () => {
  dxt.equal(greet("World"), "Hello, World!");
});

dxt.test("greets TypeScript", () => {
  dxt.equal(greet("TypeScript"), "Hello, TypeScript!");
});

dxt.test("returns a string", () => {
  dxt.equal(typeof greet("Ada"), "string");
});

dxt.test("handles an empty name", () => {
  dxt.equal(greet(""), "Hello, !");
});

dxt.test("keeps spaces inside the name", () => {
  dxt.equal(greet("Ada Lovelace"), "Hello, Ada Lovelace!");
});

dxt.test("keeps accented letters", () => {
  dxt.equal(greet("João"), "Hello, João!");
});

dxt.test("returns instead of printing", () => {
  const original = console.log;
  let printed = 0;
  console.log = () => {
    printed++;
  };
  let result = "";
  try {
    result = greet("Grace");
  } finally {
    console.log = original;
  }
  dxt.equal(result, "Hello, Grace!");
  dxt.equal(printed, 0);
});
'''

[unit.step.gabarito]
solution = '''
// Return a greeting of the form "Hello, {name}!".
export function greet(name: string): string {
  return "Hello, " + name + "!";
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
JavaScript strings are immutable, so joining them builds a brand-new string: the fixed text
`Hello, ` and `!` plus the `n` characters of `name` end up in it. Both the work and the
memory grow in direct proportion to the length of `name`, so the time is **O(n)** and the
space is **O(n)**, where `n` is the length of the name. There is no loop in your code; the
copying happens once, inside the `+` operations. The type annotations cost nothing: they are
erased before the program runs.
'''

[[unit]]
id = "ts-u02-variables"
title = "Variables & basic types"
level = "basic"
difficulty = 2
intro = '''
Programs remember things in **variables**: names bound to values. You will meet `let` and
`const`, the three everyday types `number`, `string` and `boolean`, and the two ways of
saying "no value", `undefined` and `null`. Along the way you will see how TypeScript
**infers** most types for you, and when it is worth writing an annotation yourself.
'''
concepts = '''
## The idea

A **variable** is a name that refers to a value, so you can compute something once and use
it many times. Every value has a **type**, which decides what you can do with it: you can
multiply two numbers, but not two sentences. In plain JavaScript nobody checks this before
the program runs. TypeScript adds a checker that knows the type of every variable and stops
you from mixing them up.

## How TypeScript does it

`const` declares a name that can never be pointed at another value; `let` declares one that
can be reassigned later. Prefer `const`, and use `let` only when the value must change.

```ts
const name = "Ada";        // inferred: string
let score = 10;            // inferred: number
score = score + 5;         // fine: still a number
let active: boolean = true; // explicit annotation
```

Most of the time you don't need to write a type: TypeScript **infers** it from the value you
assign. Annotations are useful when there is no initial value, when you want to document an
intent, or when the inferred type would be too narrow.

The three everyday types are:

- **`number`**: every number, whole or fractional. JavaScript has a single number type, a
  64-bit floating-point value, so `7 / 2` is `3.5` and `0.1 + 0.2` is not exactly `0.3`.
  Use `Math.floor` or `Math.round` when you need whole numbers.
- **`string`**: text, written in quotes.
- **`boolean`**: `true` or `false`, usually the result of a comparison such as `score > 15`.

Two special values mean "nothing here". **`undefined`** is what a variable holds before it
is assigned. **`null`** is a value you assign on purpose to say "deliberately empty". With
strict checking, a `string` variable can hold neither; you must say so with a **union**,
written with `|`:

```ts
let nickname: string | undefined;   // starts as undefined
let middle: string | null = null;   // empty on purpose
```

The operator `??` picks a fallback when the left side is `null` or `undefined`:
`middle ?? "(none)"`.

## What is special or tricky

- **Reassigning a `const`** is refused by `tsc` with `error TS2588: Cannot assign to 'name'
  because it is a constant.` At run time it would throw a `TypeError`.
- **Mixing types** is the classic `TS2322: Type 'string' is not assignable to type
  'number'.` Remember that Node only strips types, so the checker is your safety net.
- **`any` opts out** of all of this. Never annotate with `any` to silence an error; fix the
  value instead.
- **Converting text to a number** is explicit: `Number("42")` gives `42`, and
  `Number("abc")` gives `NaN` ("not a number"), which is still of type `number`.
- **`typeof null` is `"object"`**, a famous historical quirk of JavaScript.
- Avoid the old `var` keyword; `let` and `const` have clearer rules.

## What you will practise

You will declare constants and variables, do arithmetic with JavaScript's single number type,
handle missing values with `undefined`, `null` and `??`, and then write a function that turns
a number of seconds into hours, minutes and seconds.
'''

[[unit.step]]
kind = "concept"
id = "ts-u02-c1-let-const"
title = "let, const and inference"
points = 5
difficulty = 2
intro = '''
A variable binds a name to a value. TypeScript records the type of that value the moment the
variable is declared, by **inference** or from your annotation, and from then on it checks
every use of the name against that type, long before the program runs.
'''
body = '''
## Declaring names

```ts
const pi = 3.14159;           // can never be reassigned
let count = 0;                // can be reassigned
count = count + 1;
let title: string = "Intro";  // annotated explicitly
```

Use **`const`** by default. It tells the reader, and the checker, that the name will always
refer to the same value. Switch to **`let`** only for values that genuinely change, such as a
counter or a running total.

## Inference

When you write `let count = 0;` TypeScript **infers** that `count` is a `number`. You did not
write the type, yet the checker enforces it: a later `count = "many";` is an error. Inference
keeps code short while still fully typed. Hover over a name in the editor to see what was
inferred.

You add an **annotation** (`: type`) when the value comes later, when you want to make an
intention explicit, or when the variable may hold more than one kind of value:

```ts
let answer: number;            // assigned later
let note: string | null = null; // text, or nothing yet
```

## Values versus types

Annotations live only in the checker's world. At run time a variable just holds a value,
and `typeof` reports what that value is: `"number"`, `"string"`, `"boolean"` or
`"undefined"`. The checker's job is to guarantee that the value you see at run time is
always the one your types promised.
'''

