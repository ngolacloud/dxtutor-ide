prompt = '''
Read a `count` field from JSON text. Handle malformed JSON in the function, let other errors
reach the caller, and log from `finally` on every path.

**Why:** a good handler catches only what it understands. Watching `finally` run on all three
paths shows exactly when cleanup code executes.
