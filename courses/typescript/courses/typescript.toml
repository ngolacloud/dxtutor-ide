target = '''
function* naturals(): Generator<number, never, undefined> {
  for (let n = 1; ; n++) {
    console.log("  produce", n);
    yield n;
  }
}

function* map<T, U>(source: Iterable<T>, fn: (x: T) => U): Generator<U, void, undefined> {
  for (const x of source) yield fn(x);
}

function* filter<T>(source: Iterable<T>, keep: (x: T) => boolean): Generator<T, void, undefined> {
  for (const x of source) if (keep(x)) yield x;
}

function* take<T>(source: Iterable<T>, n: number): Generator<T, void, undefined> {
  if (n <= 0) return;
  let count = 0;
  for (const x of source) {
    yield x;
    if (++count === n) return;
  }
}

const squares = map(naturals(), (n) => n * n);
const pipeline = take(filter(squares, (sq) => sq % 2 === 1), 3);
console.log("nothing has run yet");
for (const v of pipeline) console.log("got", v);
'''
