tests = '''
function t_brute(a: readonly number[]): number {
  let n = 0;
  for (let i = 0; i < a.length; i++) {
    for (let j = i + 1; j < a.length; j++) if (a[i] > a[j]) n++;
  }
  return n;
}

function t_fenwick(a: readonly number[]): number {
  const values = [...new Set(a)].sort((x, y) => x - y);
  const rank = new Map<number, number>(values.map((v, i): [number, number] => [v, i + 1]));
  const tree = new Array<number>(values.length + 1).fill(0);
  let inv = 0;
  for (let i = a.length - 1; i >= 0; i--) {
    const r = rank.get(a[i]) ?? 0;
    for (let k = r - 1; k > 0; k -= k & -k) inv += tree[k];
    for (let k = r; k <= values.length; k += k & -k) tree[k]++;
  }
  return inv;
}

