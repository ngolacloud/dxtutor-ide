entry = "batched"
intro = '''
Stream pipelines are built from small stages that each consume one async iterable and produce
another. Batching is a classic stage: databases and APIs are far more efficient with one request
for 100 rows than 100 requests for one row. A well-behaved stage stays lazy, pulling from its
source only when its own consumer asks, and passes early exits upstream so resources are released.
'''
instructions = '''
## Your turn

Implement the async generator `batched`:

```ts
export async function* batched<T>(source: AsyncIterable<T>, size: number): AsyncGenerator<T[]>
```

It reads `source` and yields its items grouped into arrays of `size` items, in order.

Rules:

- Every batch has exactly `size` items, except the last, which holds whatever is left. Never
  yield an empty batch.
- If `size` is not a positive integer (`0`, `-2`, `2.5`), throw a `RangeError`. Since the body
  of a generator runs only when iteration starts, the error surfaces on the first `next()`.
- **Be lazy.** Yield a batch as soon as it is full; don't pull the next item from `source` until
  the consumer asks for the next batch. If the consumer stops early, the source must be closed
  (its `finally` blocks must run).
- If `source` throws, the error reaches the consumer. Batches yielded before stay yielded; a
  partial batch is dropped.
- `source` can be any `AsyncIterable`, not only a generator.

Examples:

```ts
async function* nums() { yield 1; yield 2; yield 3; yield 4; yield 5; }
for await (const b of batched(nums(), 2)) console.log(b);
// [ 1, 2 ]  [ 3, 4 ]  [ 5 ]
```

**Hint:** `for await` over the source, push into a current array, and `yield` it the moment it
is full. A `for await` loop already forwards an early exit to its source.

Hidden tests decide correctness.
'''
starter = '''
