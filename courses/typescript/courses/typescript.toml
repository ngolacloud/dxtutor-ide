tests = '''
dxt.test("uses the default discount", () => {
  dxt.equal(applyDiscount(50), 45);
  dxt.equal(applyDiscount(200), 180);
});

dxt.test("custom percent with rounding", () => {
  dxt.equal(applyDiscount(19.99, 25), 14.99);
  dxt.equal(applyDiscount(10, 33), 6.7);
});

dxt.test("zero and full discounts", () => {
  dxt.equal(applyDiscount(80, 0), 80);
  dxt.equal(applyDiscount(80, 100), 0);
});

dxt.test("price floor applies", () => {
  dxt.equal(applyDiscount(100, 50, 80), 80);
});

dxt.test("floor does not matter when the discount stays above it", () => {
  dxt.equal(applyDiscount(100, 10, 50), 90);
});

dxt.test("never more expensive than the original", () => {
  dxt.equal(applyDiscount(30, 20, 40), 30);
});

dxt.test("free item stays free", () => {
  dxt.equal(applyDiscount(0), 0);
});

dxt.test("rejects bad input", () => {
  dxt.throws(() => applyDiscount(10, 150), "percent above 100 must throw");
  dxt.throws(() => applyDiscount(10, -5), "negative percent must throw");
  dxt.throws(() => applyDiscount(-1), "negative price must throw");
