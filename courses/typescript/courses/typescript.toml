[[unit.step]]
kind = "challenge"
id = "ts-u19-x1-memoize"
title = "A typed memoize"
points = 40
difficulty = 25
entry = "memoize"
intro = '''
Memoization trades memory for time: remember each result under a key made from the arguments, and
answer repeated calls from the cache. It is a higher-order function built on a closure, and it
can turn exponential recursion, such as naive Fibonacci, into a linear computation.
'''
instructions = '''
## Your turn

Implement `memoize`:

```ts
export function memoize<A extends unknown[], R>(
  fn: (...args: A) => R,
  keyOf?: (...args: A) => string,
): (...args: A) => R
```

It returns a new function with **exactly the same parameters and result type** as `fn`, which
remembers results:

- The cache key for a call is `keyOf(...args)` when `keyOf` is given, and `JSON.stringify(args)`
  otherwise.
- `fn` runs at most once per key. A repeated key returns the remembered result without calling
  `fn`.
- **Every** result is cached, including `undefined`, `null`, `0`, `""` and `false`.
- If `fn` throws, nothing is cached: the error propagates, and the next call with the same key
  tries again.
- Each call to `memoize` has its own, separate cache.

Examples:

- With `const sq = memoize((n: number) => n * n)`, calling `sq(4)` twice runs the multiplication
  once and returns `16` both times.
- With `memoize(f, (s: string) => s.toLowerCase())`, `"Ada"` and `"ADA"` share one cache entry.
- A recursive `fib` that calls its own memoized version computes `fib(70)` instantly.

**Hint:** keep a `Map<string, R>` in the closure. Use `has`, not the truthiness of `get`, to tell
"cached `undefined`" apart from "not cached". Your code is also type-checked: a memoized function
must reject arguments that the original would reject.

Hidden tests decide correctness.
'''
starter = '''
// Return a function with fn's exact signature that caches results by key.
// The key is keyOf(...args) if given, otherwise JSON.stringify(args).
export function memoize<A extends unknown[], R>(
  fn: (...args: A) => R,
  keyOf?: (...args: A) => string,
): (...args: A) => R {
  throw new Error("not implemented");
}
'''
tests = '''
function t_compileOnly(): void {
  const repeat = memoize((s: string, times: number) => s.repeat(times));
  const r: string = repeat("ab", 2);
  // @ts-expect-error argument types are preserved
  repeat(2, "ab");
  // @ts-expect-error the number of arguments is preserved
  repeat("ab");
  // @ts-expect-error the key function must accept the same arguments as fn
  memoize((n: number) => n, (s: string) => s);
  void r;
}
void t_compileOnly;

dxt.test("runs fn once per distinct argument", () => {
  let calls = 0;
  const sq = memoize((n: number) => {
    calls++;
    return n * n;
  });
  dxt.equal(sq(4), 16);
  dxt.equal(sq(4), 16);
  dxt.equal(sq(-4), 16);
  dxt.equal(sq(5), 25);
  dxt.equal(calls, 3);
});

dxt.test("all arguments together form the key", () => {
  let calls = 0;
  const sub = memoize((a: number, b: number) => {
    calls++;
    return a - b;
  });
  dxt.equal(sub(5, 2), 3);
  dxt.equal(sub(2, 5), -3);
  dxt.equal(sub(5, 2), 3);
  dxt.equal(calls, 2);
});

dxt.test("objects with equal JSON share an entry by default", () => {
  let calls = 0;
  const area = memoize((r: { w: number; h: number }) => {
    calls++;
    return r.w * r.h;
  });
  dxt.equal(area({ w: 2, h: 3 }), 6);
  dxt.equal(area({ w: 2, h: 3 }), 6);
  dxt.equal(calls, 1);
});

dxt.test("falsy results are cached too", () => {
  const values: unknown[] = [undefined, null, 0, "", false];
  let calls = 0;
  const pick = memoize((i: number): unknown => {
    calls++;
    return values[i];
  });
  for (let round = 0; round < 3; round++) {
    for (let i = 0; i < values.length; i++) dxt.equal(pick(i), values[i]);
  }
  dxt.equal(calls, values.length);
});

dxt.test("errors are not cached", () => {
  let attempts = 0;
  const flaky = memoize((id: string) => {
    attempts++;
    if (attempts === 1) throw new Error("temporary failure");
    return `user ${id}`;
  });
  dxt.throws(() => flaky("7"));
  dxt.equal(flaky("7"), "user 7");
  dxt.equal(flaky("7"), "user 7");
  dxt.equal(attempts, 2);
});

dxt.test("a custom key function", () => {
  let calls = 0;
  const len = memoize(
    (s: string) => {
      calls++;
      return s.length;
    },
    (s) => s.toLowerCase(),
  );
  dxt.equal(len("Ada"), 3);
  dxt.equal(len("ADA"), 3);
  dxt.equal(len("ada"), 3);
  dxt.equal(len("Lin"), 3);
  dxt.equal(calls, 2);
});

dxt.test("each memoized function has its own cache", () => {
  let calls = 0;
  const base = (n: number) => {
    calls++;
    return n + 1;
  };
  const m1 = memoize(base);
  const m2 = memoize(base);
  dxt.equal(m1(1), 2);
  dxt.equal(m2(1), 2);
  dxt.equal(calls, 2);
});

dxt.test("memoized recursion turns exponential into linear", () => {
  let calls = 0;
  const fib: (n: number) => number = memoize((n: number): number => {
    calls++;
    return n < 2 ? n : fib(n - 1) + fib(n - 2);
  });
  dxt.equal(fib(70), 190392490709135);
  dxt.equal(calls, 71);
