entry = "Queue"
intro = '''
A ring buffer stores a queue in a fixed array whose end wraps around to its start, so items never
move when the front advances. Doubling the array whenever it fills up keeps every operation
amortized O(1): it is how `collections.deque`, Java's `ArrayDeque` and most production queues
work under the hood.
'''
instructions = '''
## Your turn

Implement the class `Queue<T>`, a first-in, first-out queue:

```ts
export class Queue<T> {
  get size(): number
  isEmpty(): boolean
  enqueue(value: T): void
  dequeue(): T | undefined
  peek(): T | undefined
  toArray(): T[]
}
```

- `enqueue` adds a value at the back.
- `dequeue` removes and returns the front value, or `undefined` when the queue is empty (the size
  never goes negative).
- `peek` returns the front value without removing it, or `undefined` when empty.
- `size` is the number of stored values, and `isEmpty()` says whether it is 0.
- `toArray()` returns a **new** array with the values from front to back, without changing the
  queue.

`enqueue`, `dequeue`, `peek`, `size` and `isEmpty` must be **O(1)** (amortized). In particular
**don't use `Array.prototype.shift`**: the hidden tests push 200,000 values through a queue that
already holds 100,000 and expect it to finish well within a second.

**Hint:** keep a private array of slots, a `head` index and a `count`. The *k*-th value from the
front lives at `(head + k) % slots.length`. When `count` reaches the capacity, copy the values in
order into an array twice as large and reset `head` to 0. Set a dequeued slot to `undefined` so
it doesn't keep the value alive.

Hidden tests decide correctness.
'''
