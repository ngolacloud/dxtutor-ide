  "`Kind<42>` resolves to `\"number\"`, which is exactly what `kindOf(42)` returns.",
  "Prints `number other`.",
]
explanation = '''
`Present<string | number | null | undefined>` distributes into `string | number | never | never`,
which simplifies to `string | number`, so `values` has no nullish members and the program prints
`[ 'ts', 42, 'node' ]`. The predicate `x is Present<T>` is what lets `filter` return the narrower
array type. `kindOf` computes the same labels at run time, prints `[ 'text', 'number', 'text' ]`,
and finally `number other`. The cast in `kindOf` is the honest compromise: the runtime branches
match the type branches one for one, so the cast only says what is already true.
'''

[[unit.step]]
kind = "drill"
id = "ts-u16-d2-mapped"
title = "A validator table with a mapped type"
points = 10
difficulty = 22
placeholder_policy = "on_demand"
run_command = "node --experimental-transform-types main.ts"
intro = '''
A mapped type rebuilds an object type key by key. Mapping `keyof T` to a function that receives
`T[K]` gives each validator the exact type of the field it checks, and the compiler insists that
every field has one.
'''
prompt = '''
Describe a table of validators with a mapped type and use it to validate two sign-up forms.

**Why:** when a field is added to `Signup`, `rules` stops compiling until the new field gets a
validator. The mapped type keeps the data shape and the checks in sync.
'''
target = '''
interface Signup {
  name: string;
  age: number;
  email: string;
}

type Validators<T> = { [K in keyof T]: (value: T[K]) => boolean };
type Report<T> = { readonly [K in keyof T]: "ok" | "invalid" };

const rules: Validators<Signup> = {
  name: (v) => v.trim().length > 0,
  age: (v) => Number.isInteger(v) && v >= 18,
  email: (v) => v.includes("@"),
};

function validate<T extends object>(value: T, checks: Validators<T>): Report<T> {
  const out: { [K in keyof T]?: "ok" | "invalid" } = {};
  for (const key of Object.keys(checks) as (keyof T)[]) {
    out[key] = checks[key](value[key]) ? "ok" : "invalid";
  }
  return out as Report<T>;
}

console.log(validate({ name: "Ada", age: 17, email: "ada@example.com" }, rules));
console.log(validate({ name: " ", age: 30, email: "lin.example.com" }, rules));
'''
