still prints `[ 5, 2, 9, 1, 5, 6 ]`. The comparison `a[j] > current` is strict, so the second
5 stops behind the first and the sort is stable. A reversed array makes every item shift past
all earlier ones: 1 + 2 + ... + (n - 1) shifts, O(n²). An empty array and a one-item array
skip the loop entirely.
'''

