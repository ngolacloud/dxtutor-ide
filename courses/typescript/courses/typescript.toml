[unit.step.gabarito]
solution = '''
/** A FIFO queue with amortized O(1) enqueue, dequeue and peek. Don't use Array.shift. */
export class Queue<T> {
  private slots: (T | undefined)[] = new Array<T | undefined>(8);
  private head = 0;
  private count = 0;

  /** The number of values in the queue. */
  get size(): number {
    return this.count;
  }

  /** True when the queue holds no values. */
  isEmpty(): boolean {
    return this.count === 0;
  }

  /** Add `value` at the back. */
  enqueue(value: T): void {
    if (this.count === this.slots.length) this.grow();
    this.slots[(this.head + this.count) % this.slots.length] = value;
    this.count++;
  }

  /** Remove and return the front value, or undefined when empty. */
  dequeue(): T | undefined {
    if (this.count === 0) return undefined;
    const value = this.slots[this.head];
    this.slots[this.head] = undefined;
    this.head = (this.head + 1) % this.slots.length;
    this.count--;
    return value;
  }

  /** Return the front value without removing it, or undefined when empty. */
  peek(): T | undefined {
    return this.count === 0 ? undefined : this.slots[this.head];
  }

  /** A new array with the values from front to back. */
  toArray(): T[] {
    const out: T[] = [];
    for (let k = 0; k < this.count; k++) {
      // Slots inside the live window always hold a stored T.
      out.push(this.slots[(this.head + k) % this.slots.length] as T);
    }
    return out;
  }

  /** Copy the values, front first, into an array twice as large. */
  private grow(): void {
    const bigger = new Array<T | undefined>(this.slots.length * 2);
    for (let k = 0; k < this.count; k++) {
      bigger[k] = this.slots[(this.head + k) % this.slots.length];
    }
    this.slots = bigger;
    this.head = 0;
  }
}
'''
time = "O(1) amortized for enqueue, dequeue, peek, size and isEmpty; O(n) for toArray"
space = "O(n)"
justification = '''
`dequeue`, `peek`, `size` and `isEmpty` touch a fixed number of fields and one slot, so they are
**O(1)** in the worst case: removing from the front only advances `head` modulo the capacity, and
no element ever moves. `enqueue` is O(1) except when the buffer is full, when `grow` copies all
*c* values into an array of size 2*c*. Doubling means the copies form a geometric series,
8 + 16 + 32 + ... < 2n, over *n* enqueues, so `enqueue` is **amortized O(1)**. `toArray` visits
each stored value once, **O(n)**.

The capacity is the smallest power-of-two multiple of 8 that has held the peak number of values,
so it is less than twice that peak: **O(n)** space. Clearing a slot on `dequeue` lets the garbage
collector reclaim the value. An `Array.shift` queue gives the same answers, but each `shift` moves
every remaining element, O(n) per dequeue and O(n²) for the test's 300,000 dequeues, which is why
the large test has a time bound.
'''

