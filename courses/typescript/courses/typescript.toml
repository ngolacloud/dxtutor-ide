- `parseEmail("  Ada.Lovelace@Example.COM ")` returns `"ada.lovelace@example.com"`.
- `parseEmail("ada@example")` and `parseEmail("a@b@c.com")` throw.
- `isEmail("ada@example.com")` is `true`; `isEmail("Ada@example.com")` and `isEmail(42)` are
  `false`.

**Hint:** declare the brand with `declare const brand: unique symbol`, which exists only for the
compiler. A predicate that returns `true` narrows a string to `Email`; if you need a cast,
keep it inside the validating code. Your code is also type-checked, so the branding is tested by `tsc`.

Hidden tests decide correctness.
'''
