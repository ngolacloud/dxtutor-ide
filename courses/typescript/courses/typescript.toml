intro = '''
A chained hash map is an array of buckets in which each bucket is a short list of
`[key, value]` tuples. `put` either updates the matching entry or appends a new one, and `get`
scans a single bucket, so both are O(1) on average.
'''
prompt = '''
Build a generic `ChainedMap<V>` with `put` and `get`, store two names, overwrite one, and look
up a present and a missing key.

**Why:** this is the core of every hash table: hash to one bucket, then compare keys with
`===` inside it.
'''
target = '''
class ChainedMap<V> {
  private buckets: Array<Array<[string, V]>>;

  constructor(capacity = 4) {
    this.buckets = Array.from({ length: capacity }, () => []);
  }

  private bucketFor(key: string): Array<[string, V]> {
    let h = 0;
    for (let i = 0; i < key.length; i++) h = (Math.imul(h, 31) + key.charCodeAt(i)) >>> 0;
    return this.buckets[h % this.buckets.length];
  }

  put(key: string, value: V): void {
    const bucket = this.bucketFor(key);
    for (const entry of bucket) {
      if (entry[0] === key) {
        entry[1] = value;
        return;
      }
    }
    bucket.push([key, value]);
  }

  get(key: string): V | undefined {
    for (const [k, v] of this.bucketFor(key)) {
      if (k === key) return v;
    }
    return undefined;
  }
}

const ages = new ChainedMap<number>();
ages.put("ana", 31);
ages.put("rui", 28);
ages.put("ana", 32);
console.log(ages.get("ana"), ages.get("rui"), ages.get("eva"));
'''
