dxt.test("all tests finished", () => {
  t_finished = true;
});
'''

[unit.step.gabarito]
solution = '''
/**
 * Yield the items of `source` in arrays of `size` (the last may be shorter, never empty).
 * Throw a RangeError if `size` is not a positive integer. Never read ahead of the consumer.
 */
export async function* batched<T>(source: AsyncIterable<T>, size: number): AsyncGenerator<T[]> {
  if (!Number.isInteger(size) || size < 1) {
    throw new RangeError(`size must be a positive integer, got ${size}`);
  }
  let batch: T[] = [];
  for await (const item of source) {
    batch.push(item);
    if (batch.length === size) {
      yield batch;
      batch = [];
    }
  }
  if (batch.length > 0) yield batch;
}
'''
time = "O(n) over the whole stream, O(1) amortized per item"
space = "O(size)"
justification = '''
Every item is pulled from the source once and pushed into the current batch once, an amortized
O(1) step, so consuming the whole stream costs **O(n)** for *n* items plus whatever the source
itself costs. Only the batch being filled is held in memory, so the extra space is **O(size)**:
a full batch is handed to the consumer and then replaced, never copied.

Laziness comes from the generator protocol. The body pauses at `yield batch` right after the
`size`-th item arrives, and the next `source` item is requested only when the consumer calls
`next()` again. When the consumer breaks out, its loop calls `return()` on this generator, which
completes the paused `yield` as a return; that exits the inner `for await`, which in turn calls
`return()` on the source and runs its `finally` blocks. Errors travel the other way: an exception
thrown by the source surfaces inside the `for await` and propagates out of the generator,
dropping the partial batch.
'''

[[unit]]
id = "ts-u23-stacks-queues"
title = "Stacks and queues"
level = "advanced"
difficulty = 29
intro = '''
Stacks and queues are the two simplest ways to line work up: last in, first out, or first in,
first out. JavaScript arrays make a perfect stack, but their obvious queue operation, `shift()`,
is secretly O(n). You will match brackets with a stack, see why `shift` is slow, run a
breadth-first search with a queue, and build a ring-buffer queue whose operations really are O(1).
'''
concepts = '''
## The idea

A **stack** is a pile: you `push` onto the top and `pop` from the top, so the **last** item in is
the **first** out (LIFO). Function calls, undo histories, bracket matching and depth-first search
all follow that pattern.

A **queue** is a line at a counter: you `enqueue` at the back and `dequeue` from the front, so
the **first** item in is the first out (FIFO). Job schedulers, message buffers, the event loop's
own task queue and breadth-first search all use queues.

Both are **abstract data types**: they are defined by their operations, not by their memory
layout. A good implementation makes every operation O(1).

## How TypeScript does it

An array is already an excellent stack. `push` and `pop` work at the end of the array, where
nothing has to move, so both are amortized O(1):

```ts
const stack: number[] = [];
stack.push(1);
stack.push(2);
const top = stack.pop(); // type number | undefined, value 2
```

`pop()` returns `T | undefined`, because the array may be empty, and `strict` mode makes you
handle that case. `stack.at(-1)` peeks at the top without removing it.

A queue is where arrays bite. `push` adds at the back cheaply, but `shift()` removes the **front**
element and must move every remaining element one slot to the left: O(n) per call, O(n²) to drain
a queue of *n* items. With 100,000 items that is billions of moves. Two fixes are common:

- **A head index.** Never remove from the front; advance an index instead, and now and then drop
  the consumed prefix in one go.
- **A ring buffer.** An array with a `head` position and a `count`. The slot after the last one
  wraps around to index 0 with `%`. When the array is full, copy the items into one twice as
  large. Each item is copied O(1) times on average, so every operation is amortized O(1).

```ts
const capacity = 8;
const head = 6;
const slotOf = (k: number): number => (head + k) % capacity; // k-th item from the front
console.log(slotOf(0), slotOf(1), slotOf(2)); // 6 7 0
```

A class hides that bookkeeping behind a typed API. Keep the internal array `private`, so callers
cannot break its invariants.

## Pitfalls

- **`shift` and `unshift` in a hot loop.** They look like O(1) but move elements. V8 speeds up
  some small cases, so the slowdown shows only on large inputs, exactly when it hurts.
- **Empty pops.** `pop()` and `shift()` return `undefined` on an empty array. Writing
  `stack.pop()!` silences `tsc`, but it turns a logic error into a silent `undefined` at run time.
- **Memory leaks.** A head-index queue that never compacts keeps every consumed item alive. Clear
  vacated slots so the garbage collector can reclaim what they referenced.
- **Typing the slots.** A ring buffer's empty slots hold `undefined`, so its array type is
  `(T | undefined)[]`; narrow, or document why a cast is safe, when you read from it.

## What you will practise

You will match brackets with a stack, build a head-index queue and compare it with `shift`, and
run a breadth-first search over a grid. The challenge is `Queue<T>`, a growable ring buffer with
O(1) `enqueue`, `dequeue` and `peek`.
'''

[[unit.step]]
kind = "concept"
id = "ts-u23-c1-lifo-fifo"
title = "LIFO and FIFO"
points = 5
difficulty = 29
intro = '''
A stack and a queue store the same items but hand them back in opposite orders. That order is
the whole contract, and choosing the structure whose order matches the problem is often what
makes an algorithm simple and fast.
'''
body = '''
## Stack: last in, first out

```ts
const undo: string[] = [];
undo.push("type a");
undo.push("type b");
undo.pop(); // "type b": the most recent action is undone first
```

A stack only ever touches one end. In an array that end is the back, so `push` and `pop` never
move the other elements.

## Queue: first in, first out

```ts
const line: string[] = ["ana", "bo"];
line.push("cy"); // joins at the back
line.shift();    // "ana" leaves from the front
```

The behaviour is right, but the cost is not: `shift` re-indexes every remaining element. A queue
touches **both** ends, and an array is cheap at only one of them.

## Choosing between them

Use a stack when the newest item must be handled first: nested structures (brackets, HTML tags,
function calls), backtracking and undo. Use a queue when items must be handled in arrival order:
jobs, messages, and breadth-first search, which explores a graph level by level and therefore
finds shortest paths when every edge costs the same.

## O(1) means independent of size

An operation is O(1) when its cost does not grow with the number of stored items. **Amortized**
O(1) allows an occasional expensive step, such as copying everything into a bigger array, as long
as the total cost of *n* operations stays O(n).
'''

