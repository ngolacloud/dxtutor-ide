tests = '''
interface t_User {
  id: number;
  name: string;
  email: string;
  admin: boolean;
}

const t_make = (): t_User => ({ id: 1, name: "Ada", email: "ada@example.com", admin: false });

dxt.test("pick keeps only the listed keys", () => {
  const t_u = t_make();
  const t_p: Pick<t_User, "id" | "name"> = pick(t_u, ["id", "name"]);
  dxt.equal(t_p, { id: 1, name: "Ada" });
  dxt.equal(Object.keys(t_p).sort(), ["id", "name"]);
  // @ts-expect-error: email was not picked
  dxt.equal(t_p.email, undefined);
});

dxt.test("pick returns a new object and leaves the input alone", () => {
  const t_u = t_make();
  const t_p = pick(t_u, ["id", "name", "email", "admin"]);
  dxt.check(t_p !== (t_u as object), "pick must return a new object");
  dxt.equal(t_p, t_make());
  dxt.equal(t_u, t_make());
});

dxt.test("pick with no keys and with repeated keys", () => {
  dxt.equal(pick(t_make(), []), {});
  dxt.equal(pick(t_make(), ["admin", "admin"]), { admin: false });
});

dxt.test("omit removes the listed keys", () => {
  const t_u = t_make();
  const t_o: Omit<t_User, "email" | "admin"> = omit(t_u, ["email", "admin"]);
  dxt.equal(t_o, { id: 1, name: "Ada" });
  // @ts-expect-error: admin was omitted
  dxt.equal(t_o.admin, undefined);
  dxt.equal(t_u, t_make());
});

dxt.test("omit with no keys copies the object", () => {
  const t_u = t_make();
  const t_o = omit(t_u, []);
  dxt.equal(t_o, t_make());
  dxt.check(t_o !== (t_u as object), "omit must return a new object");
});

dxt.test("merge overrides defaults and skips undefined", () => {
  const t_u = t_make();
  const t_m: t_User = merge(t_u, { name: "Grace", email: undefined });
  dxt.equal(t_m, { id: 1, name: "Grace", email: "ada@example.com", admin: false });
  dxt.equal(t_u, t_make());
