'''

[unit.step.gabarito]
solution = '''
// Return a new object with only the listed keys of obj.
export function pick<T extends object, K extends keyof T>(obj: T, keys: readonly K[]): Pick<T, K> {
  const out = {} as Pick<T, K>;
  for (const key of keys) out[key] = obj[key];
  return out;
}

// Return a new object with every own key of obj except the listed ones.
export function omit<T extends object, K extends keyof T>(obj: T, keys: readonly K[]): Omit<T, K> {
  const out: Partial<T> = { ...obj };
  for (const key of keys) delete out[key];
  return out as Omit<T, K>;
}

// Return a copy of defaults overridden by every patch value that is not undefined.
export function merge<T extends object>(defaults: Readonly<T>, patch: Partial<T>): T {
  const out = { ...defaults } as T;
  for (const key of Object.keys(patch) as Array<keyof T>) {
    const value = patch[key];
    if (value !== undefined) out[key] = value;
  }
  return out;
}
'''
time = "O(n + k)"
space = "O(n)"
justification = '''
Let `n` be the number of keys in the object and `k` the length of the key list or patch. `pick`
does one property read and write per listed key, so it is **O(k)** time and the result has at
most `k` properties. `omit` copies the object with a spread (O(n)) and deletes `k` keys, and
`merge` copies `defaults` (O(n)) and visits the `k` keys of the patch, so both are **O(n + k)**.
Each function allocates one new object of at most `n` properties: **O(n)** space.

The types do the rest. `K extends keyof T` lets `obj[key]` be read with type `T[K]`, and the
return types are exactly the utility types, so callers get `Pick<T, K>` without casts. Two casts
remain, both justified: `{} as Pick<T, K>` because the object is filled in the loop right after,
and `out as Omit<T, K>` because deleting keys is not something the compiler tracks. In `merge`,
testing `value !== undefined` rather than truthiness is what keeps `0`, `""` and `false`; a plain
`{ ...defaults, ...patch }` would let an explicit `undefined` erase a default.
'''

[[unit]]
id = "ts-u15-async-promises"
title = "Promises and async/await"
level = "intermediate"
difficulty = 15
intro = '''
Reading a file, querying a database or calling an API takes time, and a Node.js program must
not freeze while it waits. This unit explains promises, the `async`/`await` syntax built on them,
how `Promise.all` runs work concurrently, and how errors travel through asynchronous code. You
will finish by loading many items at once while collecting the ones that failed.
'''
concepts = '''
## The idea

Node.js runs your JavaScript on **one thread**. If that thread sat idle while a disk or network
request completed, nothing else could happen. Instead, slow operations are started and the thread
moves on; when the result is ready, a callback is queued and the **event loop** runs it later.

A **promise** is an object that stands for a value that is not available yet. It starts
**pending** and settles exactly once, either **fulfilled** with a value or **rejected** with a
reason (usually an `Error`). Code that needs the value registers a reaction, and the reaction
always runs asynchronously, after the current synchronous code has finished.

## How TypeScript does it

`Promise<T>` is the type of a promise that fulfils with a `T`. An `async` function always returns
a promise, and `await` pauses that function (not the whole program) until a promise settles:

```ts
import { setTimeout as sleep } from "node:timers/promises";

async function double(n: number): Promise<number> {
  await sleep(5);               // the thread is free during these 5 ms
  return n * 2;                 // fulfils the returned promise
}

const x: number = await double(21);   // top-level await works in ES modules
```

If an awaited promise rejects, `await` **throws** the reason, so ordinary `try`/`catch` handles
asynchronous errors. As in unit 13, the caught value is `unknown`.

To run independent operations **concurrently**, start them all, then wait for all of them:

```ts
const [a, b] = await Promise.all([double(1), double(2)]); // typed [number, number]
```

`Promise.all` resolves to the results **in input order**, whatever order they finished in, and it
rejects as soon as **any** input rejects.

## Pitfalls

- **Forgetting `await`.** `const n = double(2)` is a `Promise<number>`, not a number. `tsc`
  catches many of these (`n + 1` will not compile), but a forgotten `await` on a `Promise<void>`
  is silent, and a `try` around it will not catch its rejection.
- **Accidental sequencing.** `for (const id of ids) await load(id)` waits for each load before
  starting the next. When the loads are independent, start them together with `Promise.all`.
- **`forEach` does not wait.** `ids.forEach(async (id) => …)` starts the callbacks and returns
  immediately. Use `for...of` with `await`, or `Promise.all(ids.map(…))`.
- **Unhandled rejections crash Node.** A rejected promise that nobody awaits or `.catch`es
  terminates the process with exit code 1.
- **`Promise.all` fails fast.** One rejection rejects the whole call, and the other results are
  lost unless each promise handles its own errors.
- **`async` does not make code parallel.** CPU-heavy work still blocks the single thread;
  promises help with *waiting*, not with computing.

## What you will practise

You will trace the order in which synchronous code and promise reactions run, combine results
with `Promise.all`, and handle rejections with `try`/`catch` and `.catch`. The challenge asks you
to load many items concurrently, keep their order, and report which ones failed.
'''

[[unit.step]]
kind = "concept"
id = "ts-u15-c1-promises"
title = "A value that arrives later"
points = 5
difficulty = 15
intro = '''
A promise is a placeholder for the result of work that is still in progress. It settles once,
fulfilled or rejected, and its reactions are queued for the event loop instead of running
immediately, which is what keeps a single-threaded program responsive.
'''
body = '''
## Three states

A `Promise<T>` is **pending** until the work finishes, then **fulfilled** with a `T` or
**rejected** with an error. It never changes again after that.

```ts
const ready: Promise<string> = new Promise((resolve) => {
  setTimeout(() => resolve("done"), 10);
});
ready.then((v) => console.log(v));   // prints "done" about 10 ms later
console.log("first");                // prints before "done"
```

`then` registers a reaction. It does not wait; the program keeps going, and the reaction runs
once the promise is fulfilled.

## async and await

`async`/`await` lets you write the same thing in a straight line:

```ts
async function main(): Promise<void> {
  const v = await ready;   // pauses main, not the program
  console.log(v);
}
```

Calling an `async` function runs its body synchronously up to the first `await`, then returns a
pending promise. When the awaited promise settles, the function resumes from where it paused.
Whatever it `return`s fulfils its promise; whatever it `throw`s rejects it.

## Errors

A rejection becomes an exception at the `await`:

```ts
try {
  await fetchSomething();
} catch (e) {
  // e is unknown, as in any catch
}
```

Without `await`, you attach `.catch(handler)` instead. A rejection that nobody handles makes
Node.js exit with an error.

## Concurrency

Two `await`s in a row run one after the other. To overlap independent waits, create the promises
first and await them together with `Promise.all([...])`, which keeps results in input order.
'''

