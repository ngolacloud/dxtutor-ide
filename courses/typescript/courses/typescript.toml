const fahrenheit: number[] = temps.map((c) => (c * 9) / 5 + 32);
const warm: number[] = temps.filter((c) => c >= 20);
const total: number = temps.reduce((sum, c) => sum + c, 0);
const average = total / temps.length;

console.log(fahrenheit.map((f) => f.toFixed(1)).join(", "));
console.log("warm days:", warm.length, warm);
console.log("average:", average.toFixed(2));

