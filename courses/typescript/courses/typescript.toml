let grade: string;

if (score >= 90) {
  grade = "A";
} else if (score >= 80) {
  grade = "B";
} else if (score >= 70) {
  grade = "C";
} else {
  grade = "F";
}

console.log(`score ${score} -> grade ${grade}`);
const result = score >= 70 ? "passed" : "failed";
console.log(result);
'''
line_comments = [
  "The annotation widens the type to `number`, so the checker treats the score as any number, not just 82.",
  "Declared without a value; the checker verifies that every branch below assigns it before use.",
  "",
  "First test: 82 is not 90 or more, so this branch is skipped.",
