import { DatabaseSync } from "node:sqlite";

// Move `amount` from account `src` to account `dst` atomically.
// Commit and return true when the transfer is valid; otherwise leave every
// balance unchanged, end the transaction and return false.
export function transfer(db: DatabaseSync, src: number, dst: number, amount: number): boolean {
  throw new Error("not implemented");
}
