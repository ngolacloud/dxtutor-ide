[[unit]]
id = "ts-u16-advanced-generics"
title = "Conditional types, mapped types and infer"
level = "advanced"
difficulty = 22
intro = '''
Generics let a type take parameters; this unit lets a type make decisions and loop. You will
write conditional types that pick a branch, mapped types that transform every property of an
object type, and `infer`, which pulls a piece out of another type. You finish by typing a deep
freeze whose result type is readonly all the way down.
'''
concepts = '''
## The idea

So far, types have described values. TypeScript's type system can also **compute**: a type
alias can take type parameters, test them and build new types from them, all at compile time.
Three tools do most of the work:

- a **conditional type** chooses between two types, like a ternary;
- a **mapped type** walks the keys of an object type and builds a new object type;
- **`infer`** declares a type variable inside a conditional and captures whatever matches it.

The built-in utility types you met in unit 14 (`Partial`, `Pick`, `ReturnType`, `NonNullable`)
are written with exactly these tools. Learning them means you can read the standard library's
types and write your own when the built-ins are not enough.

## How TypeScript does it

A conditional type reads `T extends U ? X : Y`: if `T` is assignable to `U`, the result is `X`,
otherwise `Y`. When `T` is a bare type parameter and you pass a union, the condition is applied
to **each member separately** and the results are joined again. This is called distribution:

```ts
type OnlyStrings<T> = T extends string ? T : never;
type S = OnlyStrings<"a" | 1 | "b">; // "a" | "b"
```

`never` disappears from a union, which makes it the natural way to filter.

A mapped type iterates over a union of keys, usually `keyof T`, with `[K in keyof T]`. You can
add or remove modifiers with `readonly`, `-readonly`, `?` and `-?`:

```ts
type Mutable<T> = { -readonly [K in keyof T]: T[K] };
type Flags<T> = { [K in keyof T]?: boolean };
```

`infer` only appears in the `extends` clause of a conditional type. It says "whatever sits
here, call it `R`":

```ts
type ReturnOf<F> = F extends (...args: never[]) => infer R ? R : never;
type Item<T> = T extends readonly (infer E)[] ? E : T;
```

Types can also refer to themselves, so `type Tree<T> = { value: T; children: Tree<T>[] }` and
recursive conditional types are allowed.

## What is special or tricky

- **Everything here is erased.** Conditional and mapped types exist only for `tsc`. Node strips
  them, so they cannot check data at run time; the runtime code must still do the work.
- **Implementations need a cast.** Inside a generic function `T` is unknown, so a conditional
  return type such as `Kind<T>` cannot be resolved, and returning `"text"` fails with
  *Type '"text"' is not assignable to type 'Kind<T>'*. A narrow `as Kind<T>` on the result is
  the usual, honest workaround; an `as any` throws away all checking.
- **Distribution surprises.** `T extends string ? ...` distributes over unions, but
  `[T] extends [string] ? ...` does not. Wrap `T` in a tuple when you want the whole union
  tested at once.
- **Readonly is shallow.** `Readonly<T>` only marks the top level. Nested objects stay mutable
  unless you write a recursive type.
- **Very deep recursion** in types can hit *Type instantiation is excessively deep and possibly
  infinite*. Keep recursive types simple and bounded by the data's shape.

## What you will practise

You will filter unions with conditional types, build a validator table with a mapped type and
extract element and return types with `infer`. The challenge asks for a `DeepReadonly<T>` type
plus a `deepFreeze` function that makes the runtime object match it.
'''

[[unit.step]]
kind = "concept"
id = "ts-u16-c1-type-functions"
title = "Types that compute types"
points = 5
difficulty = 22
intro = '''
A generic type alias is a function that runs inside the compiler: it takes types as arguments
and returns a type. Conditional types give it an `if`, mapped types give it a loop over keys.
'''
body = '''
## A conditional type is an if

```ts
type IsArray<T> = T extends readonly unknown[] ? true : false;
type A = IsArray<string[]>; // true
type B = IsArray<string>;   // false
```

The test is assignability, the same relation that decides whether a value fits a variable.
Given a union, a conditional on a bare type parameter runs once per member and joins the
answers, which is how `Exclude<T, U>` and `NonNullable<T>` are built:

```ts
type Exclude<T, U> = T extends U ? never : T;
```

## A mapped type is a loop over keys

```ts
type Optional<T> = { [K in keyof T]?: T[K] };
```

`keyof T` is the union of `T`'s keys, `K` takes each one in turn, and `T[K]` is the type of
that property. The result has the same keys with a changed modifier or value type. This one
is the built-in `Partial<T>`.

## infer captures a part

```ts
type Awaited1<T> = T extends Promise<infer V> ? V : T;
type N = Awaited1<Promise<number>>; // number
```

If `T` matches the pattern `Promise<something>`, `V` becomes that something. You can put
`infer` anywhere in the pattern: in a parameter list, an array element or a return type.

## Compile time only

None of this exists when the program runs. These types help `tsc` reject wrong programs and
help your editor complete names, but they never test real data. Keep the runtime code honest;
the types describe what it already does.
'''

[[unit.step]]
kind = "drill"
id = "ts-u16-d1-conditional"
title = "Filter a union with a conditional type"
points = 10
difficulty = 22
placeholder_policy = "on_demand"
run_command = "node --experimental-transform-types main.ts"
intro = '''
A conditional type over a union distributes: it is evaluated for each member and the results
are joined, with `never` silently dropped. That turns a conditional into a type-level filter,
and a type predicate lets a runtime `filter` produce exactly that filtered type.
'''
prompt = '''
Remove `null` and `undefined` from an array with a type that matches, and label each value with
a conditional type.

**Why:** distribution plus `never` is how the standard library writes `NonNullable` and
`Exclude`; here you see the type and the runtime code agree.
'''
target = '''
type Nullish = null | undefined;
type Present<T> = T extends Nullish ? never : T;
type Kind<T> = T extends string ? "text" : T extends number ? "number" : "other";

function present<T>(xs: readonly T[]): Present<T>[] {
  return xs.filter((x): x is Present<T> => x !== null && x !== undefined);
}

function kindOf<T>(value: T): Kind<T> {
  const k = typeof value === "string" ? "text" : typeof value === "number" ? "number" : "other";
  return k as Kind<T>;
}

const raw = ["ts", null, 42, undefined, "node"];
const values = present(raw);
console.log(values);
console.log(values.map((v) => kindOf(v)));

const answer: Kind<42> = kindOf(42);
console.log(answer, kindOf(true));
'''
