prompt = '''
Write a `BST` class with `insert` and an in-order generator, insert eight keys (one of them a
duplicate) and print the traversal.

**Why:** the BST property guarantees that left-node-right order is sorted order, and the
"return the subtree root" pattern is how tree updates stay simple.
'''
target = '''
class TreeNode {
  left: TreeNode | null = null;
  right: TreeNode | null = null;
  constructor(public key: number) {}
}

class BST {
  root: TreeNode | null = null;

  insert(key: number): void {
    this.root = BST.insertAt(this.root, key);
  }

  private static insertAt(node: TreeNode | null, key: number): TreeNode {
    if (node === null) return new TreeNode(key);
    if (key < node.key) node.left = BST.insertAt(node.left, key);
    else if (key > node.key) node.right = BST.insertAt(node.right, key);
    return node;
  }

  *inOrder(node: TreeNode | null = this.root): Generator<number> {
    if (node === null) return;
    yield* this.inOrder(node.left);
    yield node.key;
    yield* this.inOrder(node.right);
  }
}

const tree = new BST();
for (const k of [50, 30, 70, 20, 40, 60, 80, 30]) tree.insert(k);
console.log([...tree.inOrder()].join(" "));
