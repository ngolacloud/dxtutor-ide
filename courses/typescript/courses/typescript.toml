'''

[unit.step.gabarito]
solution = '''
// Take `percent` per cent off `price` (default 10), round to 2 decimals.
// If `minPrice` is given, never go below it, but never above `price` either.
// Throw an Error for a negative price or a percent outside 0..100.
export function applyDiscount(price: number, percent: number = 10, minPrice?: number): number {
  if (price < 0) {
    throw new RangeError("price must not be negative");
  }
  if (percent < 0 || percent > 100) {
    throw new RangeError("percent must be between 0 and 100");
  }
  const discounted = Math.round(price * (100 - percent)) / 100;
  if (minPrice === undefined) {
    return discounted;
  }
  return Math.min(price, Math.max(discounted, minPrice));
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function does a fixed handful of comparisons and arithmetic operations, with no loop, so
the time is **O(1)** for any input, and it stores a single intermediate number, so the space
is **O(1)**.

Two details are worth noticing. First, `price * (100 - percent)` computes the discounted
price in cents directly. It equals `price * (1 - percent / 100) * 100`, but it skips the
inexact fraction `percent / 100`, which leaves less floating-point error before `Math.round`
picks the nearest cent.
Second, `Math.min(price, Math.max(discounted, minPrice))` expresses both rules at once: the
inner `max` raises the result to the floor, and the outer `min` stops that floor from ever
exceeding the original price. Checking `minPrice === undefined` narrows its type to `number`
for the last line.
'''

