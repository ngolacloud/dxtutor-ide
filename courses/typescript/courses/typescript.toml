instructions = '''
## Your turn

Implement three generic helpers:

```ts
export function pick<T extends object, K extends keyof T>(obj: T, keys: readonly K[]): Pick<T, K>
export function omit<T extends object, K extends keyof T>(obj: T, keys: readonly K[]): Omit<T, K>
export function merge<T extends object>(defaults: Readonly<T>, patch: Partial<T>): T
```

- `pick` returns a **new** object with only the listed keys of `obj`.
- `omit` returns a **new** object with every own key of `obj` except the listed ones.
- `merge` returns a **new** object: a copy of `defaults` where every key of `patch` whose value
  is **not `undefined`** replaces the default. Falsy values such as `0`, `""` and `false` are
  real values and must be applied.
- None of the three may modify its arguments.
- Repeated keys are allowed (`pick(u, ["id", "id"])` behaves like `pick(u, ["id"])`), and an
  empty key list is fine.

Examples, with `u = { id: 1, name: "Ada", admin: false }`:

- `pick(u, ["id", "name"])` returns `{ id: 1, name: "Ada" }`, typed `Pick<typeof u, "id" | "name">`.
- `omit(u, ["admin"])` returns `{ id: 1, name: "Ada" }`.
- `merge(u, { name: "Grace", admin: undefined })` returns `{ id: 1, name: "Grace", admin: false }`.

The hidden tests check the run-time results and also rely on the return types (for example,
reading a key that `pick` did not keep must be a compile error), so keep the signatures exactly
as given.

Hidden tests decide correctness.
'''
