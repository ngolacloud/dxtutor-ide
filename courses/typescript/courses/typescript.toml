[[unit.step]]
kind = "challenge"
id = "ts-u02-x1-duration"
title = "Implement formatDuration"
points = 20
difficulty = 2
entry = "formatDuration"
intro = '''
Converting a quantity into mixed units (seconds into hours, minutes and seconds; cents into
euros and cents) is a classic use of **whole-number division** and the **remainder**. Since
JavaScript has no integer division operator, you combine `/` with `Math.floor`, and use `%`
for what is left over.
'''
instructions = '''
## Your turn

Implement the function `formatDuration`:

```ts
export function formatDuration(totalSeconds: number): string
```

`totalSeconds` is a whole number of seconds, zero or more. Return a string of the form
`"{h}h {m}m {s}s"`, where `m` and `s` are always between 0 and 59 and `h` can be as large as
needed. Always include all three parts, even when they are zero.

Examples:

- `formatDuration(3725)` → `"1h 2m 5s"`
- `formatDuration(59)` → `"0h 0m 59s"`
- `formatDuration(0)` → `"0h 0m 0s"`
- `formatDuration(90000)` → `"25h 0m 0s"`

**Hint:** there are 3600 seconds in an hour. `Math.floor(total / 3600)` gives the hours, and
`total % 3600` gives the seconds that are left. Use `const` for each part, then join them
with `+`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Return "{h}h {m}m {s}s" for a whole number of seconds (0 or more).
export function formatDuration(totalSeconds: number): string {
  throw new Error("not implemented");
}
'''
tests = '''
dxt.test("hours, minutes and seconds", () => {
  dxt.equal(formatDuration(3725), "1h 2m 5s");
});

dxt.test("zero", () => {
  dxt.equal(formatDuration(0), "0h 0m 0s");
});

dxt.test("under a minute", () => {
  dxt.equal(formatDuration(59), "0h 0m 59s");
});

dxt.test("exactly one minute and one hour", () => {
  dxt.equal(formatDuration(60), "0h 1m 0s");
  dxt.equal(formatDuration(3600), "1h 0m 0s");
});

dxt.test("just below an hour", () => {
  dxt.equal(formatDuration(3599), "0h 59m 59s");
});

dxt.test("hours keep growing past a day", () => {
  dxt.equal(formatDuration(90000), "25h 0m 0s");
  dxt.equal(formatDuration(86399), "23h 59m 59s");
});

dxt.test("large input", () => {
  dxt.equal(formatDuration(3600 * 1000 + 61), "1000h 1m 1s");
});
'''

[unit.step.gabarito]
solution = '''
// Return "{h}h {m}m {s}s" for a whole number of seconds (0 or more).
export function formatDuration(totalSeconds: number): string {
  const hours = Math.floor(totalSeconds / 3600);
  const rest = totalSeconds % 3600;
  const minutes = Math.floor(rest / 60);
  const seconds = rest % 60;
  return hours + "h " + minutes + "m " + seconds + "s";
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function does a fixed number of divisions, remainders and string joins, no matter how
large `totalSeconds` is, so the time is **O(1)**. It keeps four small numbers and builds one
short string. Strictly speaking the string has a length proportional to the number of digits
of the hours, which grows like log₁₀ of the input, but for any value a `number` can hold
exactly that is at most a few dozen characters, so the space is **O(1)** as well. Note the
use of `Math.floor`: plain `/` would produce `1.0347…` hours for 3725 seconds.
'''

[[unit]]
id = "ts-u03-strings"
title = "Strings & template literals"
level = "basic"
difficulty = 3
intro = '''
Most programs spend a surprising amount of time handling text. You will build strings with
**template literals**, read their length and single characters, and transform them with
methods such as `trim`, `slice`, `includes` and `padStart`. You will also learn the rule
behind all of it: strings are **immutable**, so every method returns a new string.
'''
concepts = '''
## The idea

A **string** is a sequence of characters: a name, a sentence, a line of a file. Programs
constantly build strings from smaller pieces, search inside them, cut them up and clean
them. Strings are values, just like numbers, and in JavaScript they are **immutable**: once
created, a string never changes. Every operation that seems to modify one actually builds a
new string and leaves the original alone.

## How TypeScript does it

You can write strings with single quotes, double quotes or **backticks**. Backticks create a
**template literal**, which can span lines and embed any expression inside `${...}`:

```ts
const user = "Grace";
const items = 3;
const line = `${user} has ${items * 2} tickets`;  // "Grace has 6 tickets"
```

That is clearer and safer than joining many pieces with `+`. A string has a `length`, and you
reach a single character by its **index**, counting from 0. `at(-1)` counts from the end:

```ts
const word = "type";
word.length;   // 4
word[0];       // "t"
word.at(-1);   // "e"
```

Strings come with many **methods** (functions attached to the value):

- `trim()` removes spaces at both ends; `toUpperCase()` and `toLowerCase()` change case.
- `includes(x)`, `startsWith(x)` and `endsWith(x)` answer yes-or-no questions.
- `indexOf(x)` returns the position of the first match, or `-1` if there is none.
- `slice(start, end)` copies the characters from `start` up to, but not including, `end`.
- `replace(a, b)` replaces the first match; `replaceAll(a, b)` replaces all of them.
- `split(sep)` breaks a string into an array of pieces; `array.join(sep)` glues them back.
- `padStart(n, c)` and `repeat(n)` build longer strings.

## What is special or tricky

- **Immutability.** `word.toUpperCase()` does not change `word`; store the result. Writing
  `word[0] = "T"` is refused by `tsc` (`Index signature in type 'String' only permits
  reading`) and throws a `TypeError` at run time.
- **`+` with a number** turns the number into text: `"1" + 2` is `"12"`. Template literals
  make such conversions visible.
- **Out-of-range indexes** give `undefined`, yet `word[10]` is still typed `string`. The
  method `at` is more honest: its type is `string | undefined`.
- **`length` counts UTF-16 code units**, not what a human sees: an emoji such as 🙂 has
  length 2.
- **Calling a method that does not exist**, such as `word.capitalize()`, is caught by the
  checker with `Property 'capitalize' does not exist on type 'string'.`

## What you will practise

You will build sentences with template literals, chain methods to clean and inspect text,
and observe immutability directly. Then you will write a function that hides most of an
email address, using `indexOf`, `slice` and `repeat`.
'''

[[unit.step]]
kind = "concept"
id = "ts-u03-c1-strings"
title = "Strings are immutable sequences"
points = 5
difficulty = 3
intro = '''
A string is an ordered sequence of characters, each at a numbered position starting at 0.
Because strings are immutable, they can be shared freely: no part of a program can change a
string that another part is still using.
'''
body = '''
## Positions start at 0

```ts
const lang = "TypeScript";
console.log(lang.length);    // 10
console.log(lang[0]);        // "T"
console.log(lang.at(-1));    // "t"
console.log(lang.slice(0, 4)); // "Type"
```

The first character is at index 0 and the last at `length - 1`. `slice(start, end)` copies a
range: it includes `start` and stops just **before** `end`, so `slice(0, 4)` gives four
characters.

## Template literals

Backticks let you write the final shape of a string and drop values into it:

```ts
const year = 2012;
const msg = `${lang} was released in ${year}, ${2026 - year} years ago.`;
```

Anything inside `${...}` is an expression. It is evaluated and converted to text.

## Methods return new strings

```ts
const shout = lang.toUpperCase();
console.log(lang);   // still "TypeScript"
console.log(shout);  // "TYPESCRIPT"
```

No string method changes the string it is called on. If you want to keep the result, assign
it to a name, or reassign a `let` variable: `s = s.trim();`. That variable now points at a new
string; the old one is untouched and is eventually reclaimed by the garbage collector.

Methods can be **chained**, because each one returns a string you can call the next method
on: `raw.trim().toLowerCase()`.
'''

