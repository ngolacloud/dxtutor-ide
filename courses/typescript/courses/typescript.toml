[unit.step.gabarito]
solution = '''
import { DatabaseSync } from "node:sqlite";

type TotalRow = { total: number };

const BATCH = 100;

const nextTurn = (): Promise<void> => new Promise((resolve) => setImmediate(resolve));

async function insertStripe(file: string, start: number, step: number, upto: number): Promise<void> {
  const db = new DatabaseSync(file, { timeout: 1000 });
  try {
    const insert = db.prepare("INSERT INTO nums (n) VALUES (?)");
    let n = start;
    while (n <= upto) {
      db.exec("BEGIN IMMEDIATE");
      try {
        for (let i = 0; i < BATCH && n <= upto; i++, n += step) {
          insert.run(n);
        }
        db.exec("COMMIT");
      } catch (err) {
        db.exec("ROLLBACK");
        throw err;
      }
      await nextTurn();
    }
  } finally {
    db.close();
  }
}

// Insert 1..upto into nums(n) using `workers` concurrent tasks and return the sum.
export async function parallelSum(file: string, upto: number, workers: number): Promise<number> {
  const db = new DatabaseSync(file, { timeout: 1000 });
  try {
    db.exec("PRAGMA journal_mode = WAL");
    db.exec("CREATE TABLE IF NOT EXISTS nums (n INTEGER)");
    const tasks = Array.from({ length: workers }, (_, w) => insertStripe(file, w + 1, workers, upto));
    await Promise.all(tasks);
    const row = db.prepare("SELECT COALESCE(SUM(n), 0) AS total FROM nums").get() as TotalRow;
    return row.total;
  } finally {
    db.close();
  }
}
'''
time = "O(n log n)"
space = "O(w)"
justification = '''
Each of the **n** numbers is inserted exactly once. An insert into a table without an index
appends at the end of the rowid B-tree, **O(log n)** at most, so all inserts cost
**O(n log n)**; the final `SUM` scans the table once, **O(n)**. The stripes split the work
evenly: worker `w` takes `w + 1, w + 1 + workers, …`, so the numbers are disjoint and complete
whatever the number of workers. The program holds **w** connections and promises at once and
only one batch counter each: **O(w)** extra space (the rows themselves live in the database).

Batches of at most 100 rows mean about n / 100 transactions, each a synchronous run of code
that no other task can interrupt, so no lock is ever held across an `await` and the busy
timeout is never needed in practice. Awaiting `setImmediate` between batches hands the thread
to the next task, which is what makes the workers interleave.
'''

[[unit]]
id = "ts-udb4-n-plus-one"
title = "The N+1 query problem"
level = "intermediate"
difficulty = 19
intro = '''
A loop that runs one query per item is the N+1 anti-pattern: one query fetches a list, then N
more fetch something for each element. Each query pays a fixed cost, so the total grows with
N. You will count the statements through a small query helper, fold the work into one
`IN (...)` query and one `JOIN`, and then load related rows with exactly one statement.
'''
concepts = '''
## The idea

Every statement sent to a database has a fixed cost on top of the actual work: the request travels to the server, the SQL is parsed and planned, and the result travels back. That is a **round trip**. Over a network it often costs around a millisecond, far more than finding a few rows in an index.

The **N+1 problem** appears when code first runs one query to get a list (the "1"), then loops over the list and runs one more query per item (the "N"). With 3 items nobody notices. With 10 000 items, a page that runs 10 001 queries takes seconds, and the database spends most of its time on overhead. It often hides inside helper functions or ORM properties that load related records lazily, so each query looks innocent on its own.

The fix is to think in **sets**. SQL is built to process many rows per statement: `WHERE id IN (...)` filters by a list, `JOIN` combines related tables, and aggregates such as `SUM` and `COUNT` (with `GROUP BY`) summarise inside the database. One statement, one round trip, whatever N is.

## How TypeScript does it

`node:sqlite` never batches or hides your queries: each `get`, `all`, `run` or `iterate` call executes one statement. So the shape of your code *is* the shape of your database traffic, and a query call inside a `for` loop is the warning sign.

The module has no trace hook, so make the traffic visible yourself: send every query through one small, typed helper that counts (or logs) what it runs.

```ts
let statements = 0;
function query<T>(sql: string, ...params: SQLInputValue[]): T[] {
  statements++;
  return db.prepare(sql).all(...params) as T[];
}
```

When the list comes from your code, an `IN` clause needs one `?` per element, built with `ids.map(() => "?").join(", ")`, and the values go in as parameters with a spread: `.all(...ids)`. The SQL text then depends on how long the list is, but the values still never enter it. When the related data lives in another table, a `JOIN` fetches both sides in a single statement, and looping over its rows is fine: they were all produced by that one query.

## What is special or tricky

- A parameter binds one scalar. Passing the array itself, `.all(ids)`, does not expand it: `node:sqlite` treats a lone object argument as named parameters and throws `Unknown named parameter '0'`. Spread it: `.all(...ids)`.
- SQLite accepts an empty `IN ()`, but most databases reject it. Decide what an empty input means, and usually skip the query entirely.
- SQLite limits the number of parameters in one statement (32 766 in current versions). For very long lists, send the ids in chunks or as one JSON value read with `json_each`.
- `SUM` over zero matching rows returns `NULL`, which arrives as `null`. `COALESCE(SUM(x), 0)` gives 0 instead.
- `Promise.all` over N queries does not fix N+1. It only overlaps the round trips; with the synchronous `node:sqlite` it changes nothing at all.
- SQLite runs in-process, so its round trips are cheap. Code that feels fast on a laptop can crawl against a database server across a network; the habit matters more than the local timing.

## What you will practise

You will run the N+1 loop on purpose and count its statements, then fold the same work into one `IN (...)` query and into one `JOIN`. The challenge checks that you load related rows with exactly one statement.
'''

[[unit.step]]
kind = "concept"
id = "ts-udb4-c1-sets"
title = "One query, not N"
points = 5
difficulty = 19
intro = '''
The cost of a database call has a fixed part (the round trip, parsing and planning) and a
variable part (the rows). The N+1 pattern pays the fixed part N times; a set-based query pays
it once, which is why it scales.
'''
body = '''
## N+1 versus a single query

```ts
type PriceRow = { price: number };
type TotalRow = { total: number };

// N+1: one query per id
let total = 0;
const byId = db.prepare("SELECT price FROM orders WHERE id = ?");
for (const id of ids) {
  total += (byId.get(id) as PriceRow | undefined)?.price ?? 0;
}

// One query for the whole set
const marks = ids.map(() => "?").join(", ");     // "?, ?, ?"
const row = db
  .prepare(`SELECT COALESCE(SUM(price), 0) AS total FROM orders WHERE id IN (${marks})`)
  .get(...ids) as TotalRow;
```

- The loop sends **N** statements, one round trip each. Preparing the statement once does
  not help: every `get` is still a separate execution.
- The set-based version sends **one**. The template literal only inserts the right number of
  `?` marks; the ids themselves are spread into `get` as parameters, never pasted into the SQL.
- When the data you need is in a related table, a **`JOIN`** brings it back in the same
  statement instead of one lookup per row.

## Measure, don't guess

Route queries through one helper and count:

```ts
let statements = 0;
function query<T>(sql: string, ...params: SQLInputValue[]): T[] {
  statements++;
  return db.prepare(sql).all(...params) as T[];
}
```

Counting is the simplest way to catch an N+1 loop hidden inside another function, and a
test can assert on the count.
'''

