[[unit]]
id = "ts-u24-linked-list"
title = "Singly linked lists"
level = "advanced"
difficulty = 30
intro = '''
A linked list stores each value in its own node object that points to the next one, so a
sequence becomes a chain of references instead of one contiguous block of memory. You will
write a generic `ListNode<T>` class, push and pop at the head, keep a tail reference for O(1)
appends, delete by rewiring, and finish by reversing a list in place without creating a single
new node.
'''
concepts = '''
## The idea

A **linked list** stores a sequence as a chain of **nodes**. Each node holds a value and a **reference** to the next node, and the last node refers to nothing. The list itself is just a reference to the first node, the **head**. Nothing is contiguous: the nodes can live anywhere on the heap, connected only by references.

That layout trades one set of costs for another. Compared with a JavaScript array, which is a dynamic array:

- **Insert or remove at the head: O(1).** You only rewire a reference. `array.unshift(x)` and `array.shift()` must move every element, which is O(n).
- **Insert after a node you already hold: O(1)**, for the same reason.
- **Access by index, search, length: O(n).** You must walk from the head, because no arithmetic jumps to element *i*. Length is O(n) unless you store a counter.
- **Append at the tail: O(n)**, unless you also keep a reference to the last node.

In everyday TypeScript, arrays usually win: V8 stores them compactly and they are friendly to CPU caches. Linked lists still matter. They teach reference-based structures, trees and graphs are built from the same kind of node, and "rewire two references" is the trick behind LRU caches and schedulers.

## How TypeScript does it

Objects are always handled by reference, so a node is a small class. A **generic** parameter lets one class hold any value type, and `null` marks both the end of the list and the empty list:

```ts
class ListNode<T> {
  constructor(public value: T, public next: ListNode<T> | null = null) {}
}
```

`public value: T` in the constructor is a *parameter property*: it declares the field and assigns it in one go. There is no `free`: once nothing refers to a node, the garbage collector reclaims it.

Inserting after a known node is one assignment, because the right-hand side runs first and captures the old `next`:

```ts
function insertAfter<T>(node: ListNode<T>, value: T): void {
  node.next = new ListNode(value, node.next);
}
```

A walk follows `next` until `null`:

```ts
for (let node = head; node !== null; node = node.next) {
  if (node.value === target) return true;
}
```

## What is special or tricky

- **`'node' is possibly 'null'` (TS18047)** is the compiler stopping a crash before it happens. The runtime version is `TypeError: Cannot read properties of null (reading 'value')`. Narrow with `if (node !== null)` instead of silencing it.
- **The non-null assertion `node!.next` is an unchecked cast.** It is erased at run time, so if you are wrong the program still crashes. The same goes for `as ListNode<T>` and for typing a node as `any`, which switches the checker off entirely.
- **Reassigning a parameter does not affect the caller.** `head = head.next` inside a function changes only the local variable. Return the new head, or keep it in a field.
- **Order of rewiring matters.** Overwrite `node.next` before saving it and the rest of the list is unreachable. Save the next node in a `const` first.
- **Recursion and long lists do not mix.** Node's call stack holds roughly ten thousand frames, so a recursive walk over 100,000 nodes throws `RangeError: Maximum call stack size exceeded`. Use loops.

## What you will practise

You will build a list by pushing to the front, wrap it in a `LinkedList<T>` class with a tail reference, a size and an iterator, and delete values with a dummy node. The challenge asks you to reverse a list in place, reusing its nodes, on lists long enough to rule out recursion.
'''

[[unit.step]]
kind = "concept"
id = "ts-u24-c1-nodes"
title = "Nodes, references and null"
points = 5
difficulty = 30
intro = '''
A node holds a value and a reference to the next node, and `null` marks the end. The list
itself is nothing more than a reference to its first node, the head, typed
`ListNode<T> | null` so the compiler makes you handle the empty case.
'''
body = '''
## The node

```ts
class ListNode<T> {
  value: T;
  next: ListNode<T> | null;

  constructor(value: T, next: ListNode<T> | null = null) {
    this.value = value;
    this.next = next;
  }
}
```

`next` refers to another `ListNode<T>`, or to `null` when there is no next node. An empty
list is a head that is `null`, so the head's type is `ListNode<T> | null`.

## Push to the front

Make a new node whose `next` is the current head, then move the head to it. No element moves,
so this is O(1) no matter how long the list is:

```ts
head = new ListNode(v, head);
```

## Walk the list

Follow `next` from the head until you reach `null`. Inside the loop the condition has
narrowed `node` to `ListNode<T>`, so reading `node.value` compiles:

```ts
for (let node = head; node !== null; node = node.next) {
  console.log(node.value);
}
```

## Pop the front

Popping is the mirror image of pushing: remember the value, then move the head one node on.
The old first node is no longer referenced, and the garbage collector frees it. The compiler
insists that you check for an empty list first.

Pushing to the front reverses insertion order: the last value pushed is the first one you
meet when walking. Appending to the end without a separate reference to the last node means
walking the whole list, which is O(n). Keeping a `tail` reference makes appends O(1) again.
Every linked-list operation combines three moves: create a node, follow `next`, rewire `next`.
'''

