kind = "challenge"
id = "ts-u28-x1-edit-distance"
title = "Edit distance"
points = 40
difficulty = 34
entry = "editDistance"
intro = '''
The edit (Levenshtein) distance counts the fewest single-character insertions, deletions and
substitutions that turn one string into another. It powers spell checkers and diff tools, and
it is the textbook two-dimensional DP: each cell of the table depends on three neighbours.
'''
instructions = '''
## Your turn

Implement `editDistance`:

```ts
function editDistance(a: string, b: string): number
```

Return the minimum number of single-character edits (insert a character, delete a character,
or substitute one character for another) needed to turn `a` into `b`. Compare characters with
`===`; the comparison is case-sensitive, and the tests use plain ASCII.

Examples:

- `editDistance("kitten", "sitting")` returns `3` (k→s, e→i, insert g).
- `editDistance("", "abc")` returns `3`.
- `editDistance("flaw", "lawn")` returns `2` (delete f, insert n).
- `editDistance("same", "same")` returns `0`.

The hidden tests use strings of up to 2,000 characters. Naive recursion is exponential, and a
memo keyed by strings such as `` `${i},${j}` `` would create millions of keys, so fill a table
bottom-up.

**Hint:** let `d[i][j]` be the edit distance between the first `i` characters of `a` and the
first `j` characters of `b`. Row 0 and column 0 are easy (only insertions or only
deletions). For the other cells, think about the last character of each prefix: either they
match, or the last edit was an insertion, a deletion or a substitution.

Hidden tests decide correctness.
'''
starter = '''
/**
 * Return the minimum number of single-character insertions, deletions and
 * substitutions that turn `a` into `b`.
 */
export function editDistance(a: string, b: string): number {
  throw new Error("not implemented");
}
'''
tests = '''
function t_reference(a: string, b: string): number {
  const d: number[][] = Array.from({ length: a.length + 1 }, (_, i) =>
    Array.from({ length: b.length + 1 }, (_, j) => (i === 0 ? j : j === 0 ? i : 0)),
  );
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const sub = d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1);
      d[i][j] = Math.min(sub, d[i - 1][j] + 1, d[i][j - 1] + 1);
    }
  }
  return d[a.length][b.length];
}

function t_rng(seed: number): () => number {
  let s = seed >>> 0;
  return () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function t_word(rand: () => number, len: number, alphabet: string): string {
  let out = "";
  for (let i = 0; i < len; i++) out += alphabet[Math.floor(rand() * alphabet.length)];
  return out;
}

dxt.test("the examples", () => {
  dxt.equal(editDistance("kitten", "sitting"), 3);
  dxt.equal(editDistance("", "abc"), 3);
  dxt.equal(editDistance("flaw", "lawn"), 2);
  dxt.equal(editDistance("same", "same"), 0);
});

dxt.test("empty strings", () => {
  dxt.equal(editDistance("", ""), 0);
  dxt.equal(editDistance("abc", ""), 3);
  dxt.equal(editDistance("", "x"), 1);
});

dxt.test("single edits", () => {
  dxt.equal(editDistance("a", "b"), 1);
  dxt.equal(editDistance("cat", "cart"), 1);
  dxt.equal(editDistance("cart", "cat"), 1);
  dxt.equal(editDistance("ab", "ba"), 2);
  dxt.equal(editDistance("Hello", "hello"), 1);
});

dxt.test("repeated letters", () => {
  dxt.equal(editDistance("aaaa", "aa"), 2);
  dxt.equal(editDistance("abab", "baba"), 2);
  dxt.equal(editDistance("intention", "execution"), 5);
});

dxt.test("matches a reference table and is symmetric", () => {
  const rand = t_rng(28);
  for (let round = 0; round < 150; round++) {
    const a = t_word(rand, Math.floor(rand() * 25), "abc");
    const b = t_word(rand, Math.floor(rand() * 25), "abc");
    const got = editDistance(a, b);
    dxt.equal(got, t_reference(a, b));
    dxt.equal(editDistance(b, a), got);
  }
});

dxt.test("2,000-character strings finish quickly", () => {
  const a = "a".repeat(2000);
  const b = "a".repeat(1000) + "b".repeat(1000);
  const start = performance.now();
  const got = editDistance(a, b);
  const elapsed = performance.now() - start;
  dxt.equal(got, 1000);
  dxt.check(elapsed < 1500, `took ${elapsed.toFixed(0)} ms; the table should be O(len(a) * len(b))`);
  dxt.equal(editDistance("x".repeat(2000), "y".repeat(1500)), 2000);
});

dxt.test("random 2,000-character strings", () => {
  const rand = t_rng(2028);
  const a = t_word(rand, 2000, "acgt");
  const b = t_word(rand, 1800, "acgt");
  dxt.equal(editDistance(a, b), t_reference(a, b));
});
'''

[unit.step.gabarito]
solution = '''
/**
 * Return the minimum number of single-character insertions, deletions and
 * substitutions that turn `a` into `b`.
 */
export function editDistance(a: string, b: string): number {
  const [long, short] = a.length >= b.length ? [a, b] : [b, a];
  let prev: number[] = Array.from({ length: short.length + 1 }, (_, j) => j);
  let curr: number[] = new Array<number>(short.length + 1).fill(0);
  for (let i = 1; i <= long.length; i++) {
    curr[0] = i;
    for (let j = 1; j <= short.length; j++) {
      const cost = long[i - 1] === short[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return prev[short.length];
}
'''
time = "O(len(a) * len(b))"
space = "O(min(len(a), len(b)))"
justification = '''
Let `d[i][j]` be the distance between the first `i` characters of one string and the first `j`
of the other. Row 0 is `j` (insert everything) and column 0 is `i` (delete everything). For
any other cell, the last edit is either a deletion (`d[i-1][j] + 1`), an insertion
(`d[i][j-1] + 1`), or a substitution or free match (`d[i-1][j-1]` plus 0 or 1). Taking the
minimum of these three is correct because an optimal edit sequence ends with one of them.
There are (m + 1)(n + 1) cells, each filled in O(1), so the time is **O(m · n)**: 4 million
cells for two 2,000-character strings, a few milliseconds in V8.

Each row reads only the row above it, so the solution keeps two rows and swaps them with
destructuring instead of storing the whole table. Iterating over the longer string and making
the rows as long as the shorter one gives **O(min(m, n))** extra space. The distance is
symmetric (insertions one way are deletions the other way), which is what makes swapping the
roles of `a` and `b` safe. A memoised recursion would also be O(m · n) time, but it needs m + n
stack frames and millions of `Map` entries with string keys; naive recursion re-solves the
same prefixes exponentially often.
'''
