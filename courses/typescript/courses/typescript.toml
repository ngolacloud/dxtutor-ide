[[unit]]
id = "ts-u07-arrays-tuples"
title = "Arrays, tuples & readonly"
level = "intermediate"
difficulty = 7
intro = '''
Most programs spend their time walking through collections, and the array is the collection
JavaScript gives you first. In this unit you give arrays an element type, transform them with
`map`, `filter` and `reduce`, pack fixed-shape records into tuples, and use `readonly` to promise
that a function will not change the array it was handed.
'''
concepts = '''
## The idea

An **array** is an ordered sequence of values that you reach by position, starting at index
0. JavaScript arrays are dynamic: they grow with `push`, shrink with `pop`, and at run time
they will happily hold a number next to a string next to an object. Reading `xs[i]` is O(1),
because the engine jumps straight to slot *i*; finding a value without knowing its index is
O(n), because it must look at the elements one by one.

TypeScript adds one thing on top: an **element type**. A `number[]` holds only numbers, so
the compiler can check every `push` and knows that every element you read is a number. A
**tuple** goes further and fixes both the length and the type of each position: a
`[string, number]` is exactly two elements, a string and then a number. Tuples are the
lightweight way to return or store "a few values that belong together".

## How TypeScript does it

```ts
const primes: number[] = [2, 3, 5, 7];
const words: Array<string> = ["map", "filter"];   // the same as string[]
const point: [x: number, y: number] = [3, 4];     // a labelled tuple
const [x, y] = point;                             // destructuring by position
```

The higher-order methods take a **callback** and the types flow through it. `map` turns a
`T[]` into a `U[]`, `filter` keeps the elements for which the callback returns true, and
`reduce` folds the whole array into one value, starting from an initial **accumulator**:

```ts
const squares = primes.map((p) => p * p);          // number[]
const odd = primes.filter((p) => p % 2 === 1);     // number[]
const sum = primes.reduce((acc, p) => acc + p, 0); // number
```

None of the three modifies the original array; each returns something new. A parameter typed
`readonly number[]` (or `ReadonlyArray<number>`) promises that the function only reads:
`push`, `sort` and index assignment become compile errors inside it. `as const` turns a
literal into a readonly tuple of literal types.

## Pitfalls

- **Out-of-range reads are not caught.** `primes[10]` has type `number` but is `undefined`
  at run time. The compiler flag `noUncheckedIndexedAccess` makes such reads `number |
  undefined`; without it, check the length yourself.
- **`sort` mutates and compares strings by default.** `[10, 9, 1].sort()` gives
  `[1, 10, 9]`. Pass a comparator, `(a, b) => a - b`, and copy first (`[...xs].sort(...)`)
  when the caller's array must stay intact.
- **`reduce` without an initial value** throws `TypeError: Reduce of empty array with no
  initial value` on an empty array. Always pass the starting accumulator.
- **Tuples are not inferred.** `const p = ["ada", 36]` is a `(string | number)[]`, not a
  tuple. Annotate it, or write `as const`.
- **`readonly` is erased.** It is a compile-time promise only; any code that sees the array
  as `number[]` (or `any`) can still change it. `Object.freeze` is the run-time version.
- Typical `tsc` errors: `Property 'push' does not exist on type 'readonly number[]'`
  (TS2339) and `Type 'string' is not assignable to type 'number'` (TS2322).

## What you will practise

You will transform a list of readings with `map`, `filter` and `reduce`, return and
destructure labelled tuples, and keep a caller's array safe with `readonly` and copies. The
challenge combines them into a ranked leaderboard built from tuples.
'''

[[unit.step]]
kind = "concept"
id = "ts-u07-c1-typed-collections"
title = "Typed arrays and tuples"
points = 5
difficulty = 7
intro = '''
An array is a contiguous, indexable sequence: reading position *i* costs O(1), searching
costs O(n). TypeScript's contribution is an element type that the compiler checks on every
write and trusts on every read, plus tuples for short records of fixed shape.
'''
body = '''
## Two ways to say "array of T"

`number[]` and `Array<number>` mean the same thing; most code uses the short form. The
element type is checked on every write:

```ts
const ids: number[] = [4, 8, 15];
ids.push(16);      // fine
ids.push("23");    // error TS2345: 'string' is not assignable to 'number'
```

An empty literal needs an annotation, `const out: string[] = []`, so the compiler knows what
may go in later.

## Tuples: fixed length, typed positions

A tuple type lists the type of each position. Labels document the meaning and change nothing
at run time:

```ts
type Range = [start: number, end: number];
function span([start, end]: Range): number {
  return end - start;
}
span([3, 10]); // 7
```

Tuples are ideal for returning two or three values without inventing an object type, and
they destructure naturally in parameters and in `for...of` loops.

## Read-only views

`readonly T[]` is the same array seen through a window that hides `push`, `pop`, `sort` and
index assignment. Use it for parameters you only read: the caller then knows the array comes
back unchanged. It disappears when types are stripped, so it protects you while you write
code, not while the program runs.
'''

