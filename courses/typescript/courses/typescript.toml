target = '''
function readCount(json: string): number {
  try {
    const data: unknown = JSON.parse(json);
    if (typeof data === "object" && data !== null && "count" in data && typeof data.count === "number") {
      return data.count;
    }
    throw new TypeError("missing numeric count");
  } catch (e: unknown) {
    if (e instanceof SyntaxError) {
      console.log("bad JSON:", e.name);
      return 0;
    }
    throw e;
  } finally {
    console.log("checked", json);
  }
}

console.log(readCount('{"count": 3}'));
console.log(readCount("{oops"));
try {
  readCount('{"total": 1}');
} catch (e) {
  const message = e instanceof Error ? e.message : String(e);
  console.log("caller caught:", message);
}
'''
