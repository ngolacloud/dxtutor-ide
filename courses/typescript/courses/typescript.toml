[unit.step.gabarito]
solution = '''
import { DatabaseSync } from "node:sqlite";

type AuthorRow = { id: number; name: string };

// Map each post id in `postIds` to its author's name with ONE query.
export function postAuthors(db: DatabaseSync, postIds: number[]): Map<number, string> {
  const result = new Map<number, string>();
  if (postIds.length === 0) {
    return result;
  }
  const marks = postIds.map(() => "?").join(", ");
  const rows = db
    .prepare(
      "SELECT p.id, a.name FROM posts AS p " +
        "JOIN authors AS a ON a.id = p.author_id " +
        `WHERE p.id IN (${marks})`,
    )
    .all(...postIds) as AuthorRow[];
  for (const row of rows) {
    result.set(row.id, row.name);
  }
  return result;
}
'''
time = "O(k log n)"
space = "O(k)"
justification = '''
For **k** requested ids, SQLite looks each one up in the `posts` primary-key B-tree and then
finds the author through the `authors` primary key: two **O(log n)** seeks per id, so
**O(k log n)** in total. Building the parameter string, the rows array and the `Map` is
**O(k)**, and the result holds at most k entries: **O(k)** space.

The point is the number of round trips: exactly **one**, whatever k is. The N+1 version does
the same index work but pays the fixed cost of a statement k + 1 times. The inner `JOIN` drops
orphan posts for free, and `Map.set` collapses duplicate ids, because `IN` matches each post
row once however often its id appears in the list.
'''

[[unit]]
id = "ts-udb5-pagination"
title = "Pagination: OFFSET vs keyset"
level = "intermediate"
difficulty = 20
intro = '''
Long lists are shown a page at a time. `LIMIT`/`OFFSET` is easy but gets slower as the offset
grows and shifts when rows change. Keyset pagination remembers where the last page ended and
continues from there with `WHERE key > ?`. You will build both and then a keyset pager, typed
with tuples, that handles ties in the sort column.
'''
concepts = '''
## The idea

Nobody reads ten thousand rows at once. An API returns 20 orders, a feed shows 50 posts, and the client asks for "the next page". There are two common ways to say where the next page starts.

**Offset pagination** counts positions: page 3 of size 20 is `ORDER BY id LIMIT 20 OFFSET 40`. It is simple and allows jumping to any page number, but it has two flaws. First, the database must walk past all the skipped rows to find row 41, so a deep page costs O(offset + size). Second, an offset is a position, not a row: if a row before the page is deleted, everything shifts one place earlier and the next page silently skips a row; an insert makes a row appear twice.

**Keyset pagination** (also called cursor or seek pagination) remembers the last row the client saw and asks for rows after it: `WHERE id > ? ORDER BY id LIMIT 20`. With an index on the sort key, the database seeks straight to the cursor in O(log n) and reads the next page, however deep it is. Changes before the cursor cannot shift the page, because the cursor names a value, not a position. The price: you can only move forward (or backward) from a known row, not jump to page 37.

## How TypeScript does it

`LIMIT` and `OFFSET` take parameters like any value. A keyset cursor is just the sort key of the last row, so a typed tuple fits it well:

```ts
type Cursor = readonly [score: number, id: number];

const after: Cursor = [90, 17];
const sql = "SELECT score, id FROM scores WHERE (score, id) > (?, ?) ORDER BY score, id LIMIT ?";
const rows = db.prepare(sql).all(after[0], after[1], 10) as Array<{ score: number; id: number }>;
```

To turn rows back into tuples, give `map` an explicit return type, `(r): [number, number] => [r.score, r.id]`; without it TypeScript infers `number[]`, which forgets the length. Return the last element of a page as the next cursor, and an empty page means the end.

## What is special or tricky

- The sort must be **total**: every row needs exactly one position. If many rows share a `ts`, sort by `ts, id` and put both in the cursor. A cursor on `ts` alone skips the rest of a tie group at a page boundary.
- SQLite compares **row values**: `(a, b) > (x, y)` means `a > x OR (a = x AND b > y)`. It reads better than the expanded form and is easier to get right.
- `LIMIT` with a negative value means "no limit" in SQLite. Validate the page size in your code before it reaches SQL.
- A tuple type such as `[number, number]` is checked only at compile time. Rows cast with `as` are trusted; read exactly the columns you selected.
- Keyset pagination is fast only with an index that matches the `ORDER BY`; the next unit shows how to check.

## What you will practise

You will watch an offset page skip a row after a delete, page by keyset and survive the same delete, and walk a whole table page by page. The challenge is a keyset pager over a column with ties.
'''

[[unit.step]]
kind = "concept"
id = "ts-udb5-c1-paging"
title = "OFFSET versus keyset"
points = 5
difficulty = 20
intro = '''
Pagination trades random access for speed. An offset is a position, so the database has to
count up to it. A keyset cursor is a value, so an ordered index can seek to it directly, in
logarithmic time.
'''
body = '''
## Offset: a position

```ts
const page = db
  .prepare("SELECT id, name FROM items ORDER BY id LIMIT ? OFFSET ?")
  .all(size, pageIndex * size);
```

- Easy, and you can jump to any page number.
- Cost grows with the offset: SQLite produces and throws away `offset` rows first.
- A delete or insert before the page shifts every later row: rows get skipped or repeated.

## Keyset: a value

```ts
type ItemRow = { id: number; name: string };

const page = db
  .prepare("SELECT id, name FROM items WHERE id > ? ORDER BY id LIMIT ?")
  .all(lastId, size) as ItemRow[];
const nextCursor = page.at(-1)?.id;      // undefined means: no more pages
```

- The cursor is the sort key of the last row seen; the next page starts strictly after it.
- With an index on the sort key, each page is a seek plus `size` rows, however deep.
- Changes before the cursor cannot move the page.

## Ties need a tie-breaker

When the sort column is not unique, add a unique column to both the `ORDER BY` and the cursor:

```ts
const sql = "SELECT ts, id FROM events WHERE (ts, id) > (?, ?) ORDER BY ts, id LIMIT ?";
```

The pair `(ts, id)` is unique, so "after this row" names exactly one position. Model the
cursor as a tuple, `[ts, id]`, and annotate it so the compiler keeps its length and order.
'''

