target = '''
class IndexQueue<T> {
  private items: (T | undefined)[] = [];
  private head = 0;

  enqueue(value: T): void {
    this.items.push(value);
  }

  dequeue(): T | undefined {
    if (this.head === this.items.length) return undefined;
    const value = this.items[this.head];
    this.items[this.head++] = undefined;
    if (this.head > 1024 && this.head * 2 > this.items.length) {
      this.items = this.items.slice(this.head);
      this.head = 0;
    }
    return value;
  }
}

const N = 50_000;
const q = new IndexQueue<number>();
const arr: number[] = [];
for (let i = 0; i < N; i++) {
  q.enqueue(i);
  arr.push(i);
}

let t = performance.now();
let sumQueue = 0;
for (let v = q.dequeue(); v !== undefined; v = q.dequeue()) sumQueue += v;
const queueMs = performance.now() - t;

t = performance.now();
let sumShift = 0;
while (arr.length > 0) sumShift += arr.shift() ?? 0;
const shiftMs = performance.now() - t;

console.log("same sum:", sumQueue === sumShift, sumQueue);
console.log("index queue faster:", queueMs < shiftMs);
'''
