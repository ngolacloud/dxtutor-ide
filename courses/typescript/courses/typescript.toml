tests = '''
import * as t_sqlite from "node:sqlite";
import * as t_fs from "node:fs";
import * as t_os from "node:os";
import * as t_path from "node:path";

type t_Balance = { id: number; balance: number };
const t_START: Record<number, number> = { 1: 100, 2: 50, 3: 0 };

function t_balances(db: t_sqlite.DatabaseSync): Record<number, number> {
  const out: Record<number, number> = {};
  const rows = db.prepare("SELECT id, balance FROM accounts ORDER BY id").all() as t_Balance[];
  for (const row of rows) out[row.id] = row.balance;
  return out;
}

function t_bank(fn: (db: t_sqlite.DatabaseSync, committed: () => Record<number, number>) => void): void {
  const dir = t_fs.mkdtempSync(t_path.join(t_os.tmpdir(), "dxt-bank-"));
  const file = t_path.join(dir, "bank.db");
  const db = new t_sqlite.DatabaseSync(file);
  try {
    db.exec("CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL)");
    db.exec("INSERT INTO accounts VALUES (1, 100), (2, 50), (3, 0)");
    const committed = () => {
      const other = new t_sqlite.DatabaseSync(file, { timeout: 200 });
      try {
        return t_balances(other);
      } finally {
        other.close();
      }
    };
    fn(db, committed);
  } finally {
    if (db.isOpen) {
      if (db.isTransaction) db.exec("ROLLBACK");
      db.close();
    }
    t_fs.rmSync(dir, { recursive: true, force: true });
  }
}

function t_unchanged(db: t_sqlite.DatabaseSync, committed: () => Record<number, number>): void {
  dxt.check(!db.isTransaction, "a transaction was left open");
  dxt.equal(committed(), t_START);
  dxt.equal(t_balances(db), t_START);
}

dxt.test("valid transfer commits", () => {
  t_bank((db, committed) => {
    dxt.equal(transfer(db, 1, 2, 30), true);
    dxt.check(!db.isTransaction, "the transfer was not committed");
    dxt.equal(committed(), { 1: 70, 2: 80, 3: 0 });
  });
});

dxt.test("exact balance is allowed", () => {
  t_bank((db, committed) => {
    dxt.equal(transfer(db, 1, 3, 100), true);
    dxt.equal(committed(), { 1: 0, 2: 50, 3: 100 });
  });
});

dxt.test("insufficient funds", () => {
  t_bank((db, committed) => {
    dxt.equal(transfer(db, 2, 1, 80), false);
    t_unchanged(db, committed);
  });
});

dxt.test("missing destination rolls back the debit", () => {
  t_bank((db, committed) => {
    dxt.equal(transfer(db, 1, 99, 10), false);
    t_unchanged(db, committed);
  });
});

dxt.test("missing source", () => {
  t_bank((db, committed) => {
    dxt.equal(transfer(db, 99, 1, 10), false);
    t_unchanged(db, committed);
  });
});

dxt.test("zero and negative amounts", () => {
  t_bank((db, committed) => {
    dxt.equal(transfer(db, 1, 2, 0), false);
    dxt.equal(transfer(db, 1, 2, -40), false);
    t_unchanged(db, committed);
  });
});

dxt.test("same account", () => {
  t_bank((db, committed) => {
    dxt.equal(transfer(db, 1, 1, 10), false);
    t_unchanged(db, committed);
  });
});

dxt.test("sequence of transfers", () => {
  t_bank((db, committed) => {
    dxt.equal(transfer(db, 1, 2, 60), true);
    dxt.equal(transfer(db, 1, 3, 50), false);
    dxt.equal(transfer(db, 2, 3, 110), true);
    dxt.equal(transfer(db, 3, 1, 111), false);
    dxt.check(!db.isTransaction, "a transaction was left open");
    dxt.equal(committed(), { 1: 40, 2: 0, 3: 110 });
  });
});
'''

[unit.step.gabarito]
solution = '''
import { DatabaseSync } from "node:sqlite";

// Move `amount` from account `src` to account `dst` atomically.
export function transfer(db: DatabaseSync, src: number, dst: number, amount: number): boolean {
  if (amount <= 0 || src === dst) {
    return false;
  }
  db.exec("BEGIN");
  try {
    const debit = db
      .prepare("UPDATE accounts SET balance = balance - ? WHERE id = ? AND balance >= ?")
      .run(amount, src, amount);
    const credit = db
      .prepare("UPDATE accounts SET balance = balance + ? WHERE id = ?")
      .run(amount, dst);
    if (debit.changes !== 1 || credit.changes !== 1) {
      db.exec("ROLLBACK");
      return false;
    }
    db.exec("COMMIT");
    return true;
  } catch (err) {
    if (db.isTransaction) {
      db.exec("ROLLBACK");
    }
    throw err;
  }
}
'''
time = "O(log n)"
space = "O(1)"
justification = '''
Each `UPDATE` finds its account through the `INTEGER PRIMARY KEY`, which is the table's own
B-tree, so each one is a seek of **O(log n)** for **n** accounts. There are exactly two of
them, plus `BEGIN` and `COMMIT` or `ROLLBACK`: **O(log n)** time in total. The function keeps
only two small result objects: **O(1)** extra space (the journal SQLite writes for the
rollback holds two pages' worth of changes, also constant).

The checks live in the SQL itself: `AND balance >= ?` makes the debit touch zero rows when
funds are short, and `changes` reports that, as it does for a missing source or destination.
Any of those cases rolls back, so the database can only ever move from one consistent state to
another. The `catch` covers unexpected errors without leaving the transaction open.
'''

[[unit]]
id = "ts-udb3-wal-pool"
title = "WAL mode & connections"
level = "intermediate"
difficulty = 18
intro = '''
A database shared by several workers needs two things: a journal mode that lets readers and a
writer work at the same time, and a connection per worker. SQLite's Write-Ahead Logging (WAL)
gives the first, and `node:sqlite` connections are cheap enough to give every worker its own.
You switch a file database to WAL, watch a reader ignore an unfinished write and a second
writer time out, and split inserts across workers that each own a connection.
'''
concepts = '''
## The idea

SQLite allows many readers but only **one writer at a time** per database file. How readers and the writer get along depends on the **journal mode**. The default, `delete`, writes a rollback journal and, at commit time, locks out readers while the main file changes. **WAL** (write-ahead logging) inverts that: a commit appends the new pages to a separate `-wal` file, and readers keep working from the last committed snapshot. Readers never block the writer and the writer never blocks readers. WAL is a property of the database file, needs a real file (not `":memory:"`), and adds two companion files, `app.db-wal` and `app.db-shm`.

Writers still take turns. A second writer that finds the write lock taken gets `SQLITE_BUSY` ("database is locked"). A **busy timeout** tells SQLite to retry for up to that many milliseconds before giving up, which turns a crash into a short wait.

## How TypeScript does it

```ts
import { DatabaseSync } from "node:sqlite";

const db = new DatabaseSync("/tmp/app.db", { timeout: 1000 });
const mode = db.prepare("PRAGMA journal_mode = WAL").get() as { journal_mode: string };
console.log(mode.journal_mode); // "wal"
```

The `timeout` option is the busy timeout in milliseconds (the default, 0, fails at once). `PRAGMA journal_mode = WAL` answers with the mode actually in force, so read it instead of assuming.

A connection is a stateful object: it has at most one open transaction, and a `DatabaseSync` belongs to the thread that created it. So **each worker opens its own connection**: each `worker_threads` worker (true parallelism, real lock contention) or each independent task in one thread. A pool is just a set of such connections handed out one per task.

## What is special or tricky

- `node:sqlite` is synchronous. A busy wait **blocks the whole thread**: if the connection holding the lock lives in the same thread, it can never finish while you wait, and you get "database is locked" after the full timeout.
- So inside one thread, never `await` between `BEGIN` and `COMMIT`. Keep each write transaction synchronous and short, then `await` between transactions so other tasks get their turn.
- `BEGIN IMMEDIATE` takes the write lock at the start. A plain `BEGIN` takes it at the first write, and a transaction that read first may then fail to upgrade.
- A file database outlives your program. Tests and examples should create it in a fresh folder from `fs.mkdtempSync(path.join(os.tmpdir(), ...))` and remove the folder (with the `-wal` and `-shm` files) at the end.
- `journal_mode` on `":memory:"` stays `memory` without throwing: another reason to read the answer.

## What you will practise

You will turn on WAL and see its files, read a snapshot while a write is pending, hit a busy timeout on purpose, and start real worker threads that each insert through their own connection. The challenge splits inserts across several async workers, each with its own connection and short transactions.
'''

[[unit.step]]
kind = "concept"
id = "ts-udb3-c1-wal"
title = "WAL and one connection per worker"
points = 5
difficulty = 18
intro = '''
WAL is a form of multiversion concurrency control: a reader works from a consistent snapshot
while a writer prepares the next version. Concurrency in your program also needs isolation,
which is why each worker gets its own connection and its own transaction.
'''
body = '''
## Turning WAL on

```ts
const db = new DatabaseSync(file, { timeout: 1000 });
db.exec("PRAGMA journal_mode = WAL");
```

- WAL is stored in the database file, so it stays on for every later connection.
- It needs a file: on `":memory:"` the pragma quietly answers `memory`.
- Readers see the last committed snapshot while a writer works; only writers queue.

## The busy timeout

The `timeout` option (milliseconds) is how long a connection waits for a lock before it
throws `database is locked`. Zero, the default, fails immediately. With worker threads, a
generous timeout simply makes each writer wait its turn.

## One connection per worker

```ts
async function worker(file: string, values: number[]): Promise<void> {
  const db = new DatabaseSync(file, { timeout: 1000 });
  try {
    const insert = db.prepare("INSERT INTO log (v) VALUES (?)");
    db.exec("BEGIN IMMEDIATE");
    for (const v of values) insert.run(v);
    db.exec("COMMIT");
  } finally {
    db.close();
  }
}
```

A connection holds one transaction at a time, so sharing it between workers would mix their
`BEGIN`s and `COMMIT`s. Give each worker its own and close it in `finally`.

Because every call is synchronous, a transaction with no `await` inside cannot be interrupted
by other code in the same thread. That is the rule for async code: commit before you `await`.
'''

