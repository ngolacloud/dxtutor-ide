entry = "createBatcher"
intro = '''
Many libraries collect the calls made during one synchronous turn and handle them together:
DataLoader merges many small database lookups into one query, and UI frameworks merge many state
updates into one render. The trick is to schedule a single microtask on the first call of a turn,
so the batch is flushed as soon as the current code finishes and before any timer or I/O
callback.
'''
instructions = '''
## Your turn

Implement `createBatcher`:

```ts
export function createBatcher<T>(flush: (items: T[]) => void): (item: T) => void
```

It returns an `add` function. Every item passed to `add` during the same synchronous turn must
be delivered to `flush` **together, in one call, in the order it was added**, as soon as that
turn's synchronous code is over, that is, in a **microtask**.

Rules:

- `add` never calls `flush` synchronously.
- `flush` must run before any timer that is already waiting, so use the microtask queue
  (`queueMicrotask` or a resolved promise), not `setTimeout` or `setImmediate`.
- Calls made in a later turn start a new batch. Each batch is flushed exactly once, and an
  empty batch is never flushed.
- If `flush` itself calls `add`, those items belong to a **new** batch, flushed in a later
  microtask.
- `flush` may keep the array it receives: don't clear or reuse it afterwards.
- Every batcher is independent of the others.

Example:

```ts
const add = createBatcher<number>((items) => console.log(items));
add(1);
add(2);
add(3);
console.log("sync done");
// sync done
// [ 1, 2, 3 ]
```

**Hint:** keep a pending array and a "scheduled" flag. Schedule one microtask on the first `add`
of a turn. In that microtask, swap the pending array for a fresh one and reset the flag
*before* calling `flush`.

Hidden tests decide correctness.
'''
