instructions = '''
## Your turn

Implement the function `applyDiscount`:

```ts
export function applyDiscount(price: number, percent: number = 10, minPrice?: number): number
```

Return the price after taking `percent` per cent off, **rounded to 2 decimal places** with
`Math.round(value * 100) / 100`.

- `percent` defaults to `10`.
- If `minPrice` is given, the result must never be lower than `minPrice`. But a discount must
  never make anything more expensive: if `price` itself is below `minPrice`, return `price`.
- If `price` is negative, or `percent` is below 0 or above 100, **throw** an `Error`
  (for example `throw new RangeError("percent must be between 0 and 100")`).

Examples:

- `applyDiscount(50)` → `45`
- `applyDiscount(19.99, 25)` → `14.99`
- `applyDiscount(100, 50, 80)` → `80`
- `applyDiscount(30, 20, 40)` → `30`
