instructions = '''
## Your turn

Write a branded `Email` type, a predicate and a parser:

```ts
export type Email = /* a string carrying a compile-time brand */;
export function isEmail(value: unknown): value is Email { /* ... */ }
export function parseEmail(input: string): Email { /* ... */ }
```

**The type.** `Email` must be a branded string: an `Email` can be used anywhere a `string` can,
but a plain `string` (or a string literal) must **not** be assignable to `Email`.

**The rules** for a valid address, in normal form:

- exactly one `@`;
- the part before it is at least one character and contains no whitespace;
- the part after it is two or more labels separated by dots, and each label is one or more of
  `a`–`z`, `0`–`9` or `-` (so no empty labels, no leading or trailing dot);
- the whole address is lowercase.

**`isEmail(value)`** returns `true` only when `value` is a string that already follows these
rules. It never throws.

**`parseEmail(input)`** trims surrounding whitespace and lowercases `input`, then returns it as
an `Email` if it follows the rules. Otherwise it throws an `Error`.

