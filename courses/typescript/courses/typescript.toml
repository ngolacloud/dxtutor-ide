target = '''
function makeCounter(start = 0) {
  let count = start;
  return {
    increment: (): number => ++count,
    reset: (): void => {
      count = start;
    },
    value: (): number => count,
  };
}

function once<A extends unknown[], R>(fn: (...args: A) => R): (...args: A) => R {
  let done = false;
  let result: R;
  return (...args: A): R => {
    if (!done) {
      result = fn(...args);
      done = true;
    }
    return result;
  };
}

const a = makeCounter();
const b = makeCounter(10);
a.increment();
a.increment();
b.increment();
