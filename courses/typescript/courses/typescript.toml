instructions = '''
## Your turn

Implement the function `longestRun`:

```ts
export function longestRun(values: number[]): number
```

A **run** is a group of equal values that sit next to each other. Return the length of the
longest run in `values`. An empty array has no runs, so return `0`. Do not modify the array.

Examples:

- `longestRun([1, 1, 2, 2, 2, 3])` → `3` (the three 2s)
- `longestRun([5, 6, 5, 6])` → `1` (equal values that are not adjacent do not count)
- `longestRun([7])` → `1`
- `longestRun([])` → `0`

**Hint:** walk the array once with an indexed `for` loop. Compare each element with the one
before it: if they are equal the current run grows, otherwise a new run of length 1 starts.
Keep the best length seen so far in a second variable.

Hidden tests decide correctness, including arrays of 100,000 numbers. Implement it, then
submit.
'''
starter = '''
