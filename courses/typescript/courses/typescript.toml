});

dxt.test("one element", () => {
  dxt.equal(longestRun([7]), 1);
});

dxt.test("no adjacent duplicates", () => {
  dxt.equal(longestRun([5, 6, 5, 6]), 1);
});

dxt.test("run at the end", () => {
  dxt.equal(longestRun([1, 2, 3, 3, 3, 3]), 4);
});

dxt.test("run at the start", () => {
  dxt.equal(longestRun([9, 9, 9, 1, 2]), 3);
});

dxt.test("all equal, with negatives", () => {
  dxt.equal(longestRun([-4, -4, -4, -4, -4]), 5);
  dxt.equal(longestRun([-1, -1, 0, 0, 0, -1]), 3);
});

dxt.test("does not modify the array", () => {
  const data = [3, 3, 1];
  longestRun(data);
  dxt.equal(data, [3, 3, 1]);
});

dxt.test("large input", () => {
  const big: number[] = [];
  for (let i = 0; i < 100000; i++) {
    big.push(i < 60000 ? i % 2 : 8);
  }
  dxt.equal(longestRun(big), 40000);
