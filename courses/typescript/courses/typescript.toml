tests = '''
import * as t_sqlite from "node:sqlite";

type t_PlanRow = { detail: string };
type t_TotalRow = { total: number };

const t_Q_BOTH = "SELECT total FROM orders WHERE customer_id = ? AND status = ?";
const t_Q_CUSTOMER = "SELECT total FROM orders WHERE customer_id = ?";
const t_SCHEMA = "CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, status TEXT, total INTEGER)";

function t_plan(db: t_sqlite.DatabaseSync, sql: string, ...params: t_sqlite.SQLInputValue[]): string {
  const rows = db.prepare(`EXPLAIN QUERY PLAN ${sql}`).all(...params) as t_PlanRow[];
  return rows.map((r) => r.detail).join(" | ");
}

function t_with(fn: (db: t_sqlite.DatabaseSync) => void, seed = true): void {
  const db = new t_sqlite.DatabaseSync(":memory:");
  try {
    db.exec(t_SCHEMA);
    if (seed) {
      const statuses = ["paid", "open", "void"];
      const insert = db.prepare("INSERT INTO orders (customer_id, status, total) VALUES (?, ?, ?)");
      db.exec("BEGIN");
      for (let i = 0; i < 2000; i++) insert.run(i % 50, statuses[i % 3], (i * 7) % 1000);
      db.exec("COMMIT");
    }
    fn(db);
  } finally {
    db.close();
  }
}

function t_results(db: t_sqlite.DatabaseSync): [number[], number[]] {
  const both = (db.prepare(t_Q_BOTH).all(7, "paid") as t_TotalRow[]).map((r) => r.total);
  const customer = (db.prepare(t_Q_CUSTOMER).all(7) as t_TotalRow[]).map((r) => r.total);
  return [both.sort((a, b) => a - b), customer.sort((a, b) => a - b)];
}

dxt.test("two-column query uses a covering index", () => {
  t_with((db) => {
    addOrderIndex(db);
    const detail = t_plan(db, t_Q_BOTH, 7, "paid");
    dxt.check(detail.includes("SEARCH"), `expected a SEARCH, got: ${detail}`);
    dxt.check(detail.includes("USING COVERING INDEX"), `expected a covering index, got: ${detail}`);
  });
});

dxt.test("customer-only query searches", () => {
  t_with((db) => {
    addOrderIndex(db);
    const detail = t_plan(db, t_Q_CUSTOMER, 7);
    dxt.check(detail.startsWith("SEARCH"), `expected a SEARCH, got: ${detail}`);
    dxt.check(detail.includes("INDEX"), `expected an index, got: ${detail}`);
  });
});

dxt.test("before the call, both queries scan", () => {
  t_with((db) => {
    dxt.check(t_plan(db, t_Q_BOTH, 7, "paid").startsWith("SCAN"), "the test table should start unindexed");
    addOrderIndex(db);
    dxt.check(!t_plan(db, t_Q_BOTH, 7, "paid").startsWith("SCAN"), "still a SCAN after addOrderIndex");
  });
});

dxt.test("calling twice is safe", () => {
  t_with((db) => {
    addOrderIndex(db);
    addOrderIndex(db);
    dxt.check(t_plan(db, t_Q_BOTH, 1, "open").includes("USING COVERING INDEX"), "covering index lost");
  });
});

dxt.test("results are unchanged", () => {
  t_with((db) => {
    const before = t_results(db);
    addOrderIndex(db);
    dxt.equal(t_results(db), before);
    const count = db.prepare("SELECT COUNT(*) AS n FROM orders").get() as { n: number };
    dxt.equal(count.n, 2000);
  });
});

dxt.test("index exists and nothing is left open", () => {
  t_with((db) => {
    addOrderIndex(db);
    dxt.check(!db.isTransaction, "a transaction was left open");
    const names = db
      .prepare("SELECT name FROM sqlite_master WHERE type = 'index' AND tbl_name = 'orders'")
      .all();
    dxt.check(names.length >= 1, "no index on orders");
  });
});

dxt.test("empty table", () => {
  t_with((db) => {
    addOrderIndex(db);
    dxt.check(t_plan(db, t_Q_BOTH, 1, "paid").includes("USING COVERING INDEX"), "expected a covering index");
    dxt.check(t_plan(db, t_Q_CUSTOMER, 1).startsWith("SEARCH"), "expected a SEARCH");
  }, false);
});
'''

[unit.step.gabarito]
solution = '''
import { DatabaseSync } from "node:sqlite";

// Create the index that serves the two hot `orders` queries. Safe to call twice.
export function addOrderIndex(db: DatabaseSync): void {
  db.exec("BEGIN");
  try {
    db.exec(
      "CREATE INDEX IF NOT EXISTS idx_orders_customer_status_total " +
        "ON orders (customer_id, status, total)",
    );
    db.exec("COMMIT");
  } catch (err) {
    db.exec("ROLLBACK");
    throw err;
  }
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Building the index sorts all **n** rows by `(customer_id, status, total)`: **O(n log n)** time,
and the new B-tree stores one entry per row: **O(n)** space. After that, each hot query is a
seek of **O(log n)** plus the **k** matching entries, instead of an **O(n)** scan.

The column order is the design. `customer_id` comes first, so the customer-only query can seek
on the leftmost prefix; `status` second, so the two-column query seeks on both equalities;
`total` last, so the index already holds the selected column and the table is never visited.
Putting `status` first would still cover the first query, but turn the second into a `SCAN`.
`IF NOT EXISTS` makes the call idempotent, and the transaction makes the schema change
all-or-nothing.
'''

