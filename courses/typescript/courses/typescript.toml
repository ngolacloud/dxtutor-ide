target = '''
import { DatabaseSync } from "node:sqlite";
import { Worker } from "node:worker_threads";
import { mkdtempSync, rmSync } from "node:fs";
import { tmpdir } from "node:os";
import { join } from "node:path";

type StatsRow = { n: number; total: number };

const workerSource = `
const { DatabaseSync } = require("node:sqlite");
const { workerData } = require("node:worker_threads");
const db = new DatabaseSync(workerData.file, { timeout: 5000 });
const insert = db.prepare("INSERT INTO nums VALUES (?)");
db.exec("BEGIN IMMEDIATE");
for (let n = workerData.start; n <= 100; n += 4) insert.run(n);
db.exec("COMMIT");
db.close();
`;

const folder = mkdtempSync(join(tmpdir(), "dxt-wal-"));
const file = join(folder, "app.db");
const setup = new DatabaseSync(file);
setup.exec("PRAGMA journal_mode = WAL");
setup.exec("CREATE TABLE nums (n INTEGER)");
const finished = [1, 2, 3, 4].map((start) => new Promise<number>((resolve, reject) => {
  const worker = new Worker(workerSource, { eval: true, workerData: { file, start } });
  worker.on("error", reject);
  worker.on("exit", resolve);
}));
console.log("exit codes", await Promise.all(finished));
const stats = setup.prepare("SELECT COUNT(*) AS n, SUM(n) AS total FROM nums").get() as StatsRow;
console.log(stats.n, stats.total);
setup.close();
rmSync(folder, { recursive: true, force: true });
