instructions = '''
## Your turn

Implement the function `transfer`:

```ts
export function transfer(db: DatabaseSync, src: number, dst: number, amount: number): boolean
```

`db` is open on a database file with this table:

```sql
CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL)
```

Move `amount` from account `src` to account `dst` inside one transaction.

- If both accounts exist, `amount > 0`, `src !== dst` and `src` has at least `amount`,
  **commit** and return `true`.
- Otherwise change nothing (roll back anything you did) and return `false`.

Either way, no transaction may be left open when the function returns
(`db.isTransaction` must be `false`).

Examples, starting from balances `{1: 100, 2: 50}`:

- `transfer(db, 1, 2, 30)` -> `true`, balances become `{1: 70, 2: 80}`
- `transfer(db, 2, 1, 80)` -> `false` (account 2 has only 50)
- `transfer(db, 1, 99, 10)` -> `false` (no account 99), balances unchanged

Hidden tests decide correctness.
'''
