[[unit.step]]
kind = "challenge"
id = "ts-u11-x1-priority-queue"
title = "A generic priority queue"
points = 30
difficulty = 11
entry = "PriorityQueue"
intro = '''
A priority queue always hands out its "smallest" item next, which is what schedulers,
Dijkstra's shortest paths and event simulations need. A binary heap stores it in a plain array
arranged as a complete binary tree, where every parent is no larger than its children, so both
`push` and `pop` cost O(log n). Generics let one implementation serve any item type, with the
ordering supplied as a comparator.
'''
instructions = '''
## Your turn

Implement the generic class `PriorityQueue<T>`:

```ts
export class PriorityQueue<T> {
  constructor(compare: (a: T, b: T) => number);
  get size(): number;
  push(item: T): void;
  peek(): T | undefined;
  pop(): T | undefined;
}
```

`compare(a, b)` follows the `Array.prototype.sort` convention: negative when `a` must come out
before `b`, positive when after, and 0 when either order is fine.

Rules:

- `pop()` removes and returns the item that comes first under `compare`; `peek()` returns it
  without removing it. Both return `undefined` on an empty queue.
- `size` is the number of items currently stored.
- Items with equal priority may come out in any order.
- The tests push and pop 100,000 items under a time limit, so both `push` and `pop` must be
  O(log n). Sorting the array on every call, or scanning it on every `pop`, is too slow.

Example:

```ts
const q = new PriorityQueue<number>((a, b) => a - b);
q.push(5); q.push(1); q.push(3);
q.peek(); // 1
q.pop();  // 1
q.pop();  // 3
q.size;   // 1
```

**Hint:** use a binary heap in an array. The children of index `i` are `2 * i + 1` and
`2 * i + 2`, and its parent is `(i - 1) >> 1`. To push, append the item and swap it upwards while
it beats its parent. To pop, take index 0, move the last item to index 0, and swap it downwards
with its better child until neither child beats it.

Hidden tests decide correctness.
'''
starter = '''
// A min-priority queue ordered by `compare` (negative: a comes out first),
// stored as a binary heap so that push and pop are O(log n).
export class PriorityQueue<T> {
  private readonly heap: T[] = [];

  constructor(private readonly compare: (a: T, b: T) => number) {}

  get size(): number {
    throw new Error("not implemented");
  }

  push(item: T): void {
    throw new Error("not implemented");
  }

  peek(): T | undefined {
    throw new Error("not implemented");
  }

  pop(): T | undefined {
    throw new Error("not implemented");
  }
}
'''
tests = '''
function t_drain<T>(q: PriorityQueue<T>): T[] {
  const out: T[] = [];
  for (let i = 0; q.size > 0 && i < 1_000_000; i++) out.push(q.pop() as T);
  return out;
}

function t_byKey<T, K extends keyof T>(key: K): (a: T, b: T) => number {
  return (a, b) => (a[key] < b[key] ? -1 : a[key] > b[key] ? 1 : 0);
}

function t_random(n: number, seed: number): number[] {
  const out: number[] = [];
  let x = seed;
  for (let i = 0; i < n; i++) {
    x = (x * 48271) % 2147483647;
    out.push(x % 1_000_000);
  }
  return out;
}

dxt.test("an empty queue", () => {
  const q = new PriorityQueue<number>((a, b) => a - b);
  dxt.equal(q.size, 0);
  dxt.equal(q.peek(), undefined);
  dxt.equal(q.pop(), undefined);
  dxt.equal(q.size, 0);
});

dxt.test("numbers come out in ascending order, duplicates included", () => {
  const q = new PriorityQueue<number>((a, b) => a - b);
  for (const x of [5, 1, 4, 1, 3, 9, 2, 6, -7, 0]) q.push(x);
  dxt.equal(q.size, 10);
  dxt.equal(t_drain(q), [-7, 0, 1, 1, 2, 3, 4, 5, 6, 9]);
});

dxt.test("the comparator decides the order", () => {
  const maxQ = new PriorityQueue<number>((a, b) => b - a);
  for (const x of [3, 8, 1, 8, 5]) maxQ.push(x);
  dxt.equal(t_drain(maxQ), [8, 8, 5, 3, 1]);
  const words = new PriorityQueue<string>((a, b) => a.length - b.length || (a < b ? -1 : a > b ? 1 : 0));
  for (const w of ["heap", "a", "tree", "queue", "be"]) words.push(w);
  dxt.equal(t_drain(words), ["a", "be", "heap", "tree", "queue"]);
});

dxt.test("objects ordered by a key", () => {
  interface Task {
    name: string;
    priority: number;
  }
  const q = new PriorityQueue<Task>(t_byKey<Task, "priority">("priority"));
  q.push({ name: "deploy", priority: 3 });
  q.push({ name: "hotfix", priority: 1 });
  q.push({ name: "docs", priority: 5 });
  q.push({ name: "review", priority: 2 });
  dxt.equal(q.peek(), { name: "hotfix", priority: 1 });
  dxt.equal(t_drain(q).map((t) => t.name), ["hotfix", "review", "deploy", "docs"]);
});

dxt.test("peek does not remove and size tracks every change", () => {
  const q = new PriorityQueue<number>((a, b) => a - b);
  q.push(4);
  q.push(2);
  dxt.equal(q.peek(), 2);
  dxt.equal(q.peek(), 2);
  dxt.equal(q.size, 2);
  dxt.equal(q.pop(), 2);
  dxt.equal(q.size, 1);
  dxt.equal(q.pop(), 4);
  dxt.equal(q.size, 0);
});

dxt.test("interleaved pushes and pops", () => {
  const q = new PriorityQueue<number>((a, b) => a - b);
  q.push(5);
  q.push(3);
  dxt.equal(q.pop(), 3);
  q.push(4);
  q.push(1);
  dxt.equal(q.pop(), 1);
  dxt.equal(q.pop(), 4);
  q.push(2);
  q.push(7);
  dxt.equal(t_drain(q), [2, 5, 7]);
});

dxt.test("tuples ordered by their second element", () => {
  const q = new PriorityQueue<[string, number]>((a, b) => a[1] - b[1]);
  q.push(["c", 30]);
  q.push(["a", 10]);
  q.push(["b", 20]);
  dxt.equal(t_drain(q), [["a", 10], ["b", 20], ["c", 30]]);
});

dxt.test("100,000 pushes then 100,000 pops", () => {
  const t_values = t_random(100_000, 42);
  const q = new PriorityQueue<number>((a, b) => a - b);
  const t_start = Date.now();
  for (const x of t_values) q.push(x);
  const got = t_drain(q);
  dxt.check(Date.now() - t_start < 1500, "push and pop must be O(log n)");
  dxt.equal(got, [...t_values].sort((a, b) => a - b));
});

dxt.test("100,000 interleaved operations", () => {
  const t_values = t_random(100_000, 7);
  const q = new PriorityQueue<number>((a, b) => b - a);
  const t_start = Date.now();
  let t_popped = 0;
  for (let i = 0; i < t_values.length; i++) {
    q.push(t_values[i]);
    if (i % 3 === 2) {
      const top = q.peek();
      dxt.check(q.pop() === top, "pop must return what peek showed");
      t_popped++;
    }
  }
  dxt.check(Date.now() - t_start < 1500, "push and pop must be O(log n)");
  dxt.equal(q.size, t_values.length - t_popped);
  const rest = t_drain(q);
  dxt.check(rest.every((x, i) => i === 0 || rest[i - 1] >= x), "a max-queue drains in descending order");
});
'''

[unit.step.gabarito]
solution = '''
// A min-priority queue ordered by `compare` (negative: a comes out first),
// stored as a binary heap so that push and pop are O(log n).
export class PriorityQueue<T> {
  private readonly heap: T[] = [];

  constructor(private readonly compare: (a: T, b: T) => number) {}

  get size(): number {
    return this.heap.length;
  }

  push(item: T): void {
    const heap = this.heap;
    heap.push(item);
    let i = heap.length - 1;
    while (i > 0) {
      const parent = (i - 1) >> 1;
      if (this.compare(heap[i], heap[parent]) >= 0) break;
      [heap[i], heap[parent]] = [heap[parent], heap[i]];
      i = parent;
    }
  }

  peek(): T | undefined {
    return this.heap.length > 0 ? this.heap[0] : undefined;
  }

  pop(): T | undefined {
    const heap = this.heap;
    if (heap.length === 0) return undefined;
    const top = heap[0];
    const last = heap[heap.length - 1];
    heap.length -= 1;
    if (heap.length > 0) {
      heap[0] = last;
      this.siftDown(0);
    }
    return top;
  }

  private siftDown(start: number): void {
    const heap = this.heap;
    const n = heap.length;
    let i = start;
    for (;;) {
      const left = 2 * i + 1;
      const right = left + 1;
      let best = i;
      if (left < n && this.compare(heap[left], heap[best]) < 0) best = left;
      if (right < n && this.compare(heap[right], heap[best]) < 0) best = right;
      if (best === i) return;
      [heap[i], heap[best]] = [heap[best], heap[i]];
      i = best;
    }
  }
}
'''
time = "O(log n) per push and pop, O(1) for peek and size"
space = "O(n)"
justification = '''
The heap is a complete binary tree stored level by level in an array, so with n items its
height is ⌊log₂ n⌋. `push` appends at the bottom and swaps the new item upwards; each swap moves
one level closer to the root, so it does at most **O(log n)** comparisons. `pop` moves the last
item to the root and swaps it downwards with its better child, again at most one swap per level:
**O(log n)**. `peek` and `size` read index 0 and the length: **O(1)**. Draining n items
therefore costs O(n log n), which is a sort (heapsort).

Correctness rests on the heap invariant: no item compares as coming after either of its
children. Sifting up restores it along the single path from the new leaf to the root, and sifting
down along the single path from the root to a leaf; every other parent-child pair is untouched.
The array holds exactly the n items, so the space is **O(n)**, with O(1) extra per operation. A
sorted array would make `pop` O(1) but `push` O(n), and an unsorted one the reverse; the heap is
the balance that makes both logarithmic. The class never inspects `T` itself: all ordering comes
from the comparator, which is why one generic implementation serves numbers, tuples and objects.
'''

# ── g3-types ────────────────────────────────────────────────────────────

[[unit]]
id = "ts-u12-maps-sets"
title = "Maps, Sets and Records"
level = "intermediate"
difficulty = 12
intro = '''
Most real programs answer questions such as "how many times?", "have I seen this before?" and
"which items belong together?". This unit covers the three tools TypeScript gives you for those
questions: `Map` for key-to-value lookups, `Set` for membership, and `Record` for objects with a
known key type. You will count, deduplicate and group, and finish with a word-frequency ranking.
'''
concepts = '''
## The idea

A **dictionary** (also called an associative array) stores values under keys, so you can ask
"what is stored under `"apple"`?" without scanning everything. JavaScript engines implement
`Map` and `Set` as **hash tables**: the key is hashed to a bucket, so `get`, `set`, `has` and
`delete` take **O(1) time on average**, whatever the size. An array can answer the same questions
only by walking it, which is O(n).

- A **`Map<K, V>`** stores key/value pairs. Keys can be any value: strings, numbers, even objects.
- A **`Set<T>`** stores unique values. Adding a value that is already there does nothing.
- A **`Record<K, V>`** is a plain object type whose keys are `K` and whose values are `V`.

All three remember **insertion order**, so iterating gives the keys in the order they were first
added.

## How TypeScript does it

```ts
const stock = new Map<string, number>();
stock.set("apple", 3).set("pear", 0);
const apples = stock.get("apple") ?? 0;   // get returns number | undefined

const tags = new Set(["ts", "node", "ts"]); // Set<string> with 2 values
tags.has("node");                          // true

type Weekday = "mon" | "tue" | "wed";
const hours: Record<Weekday, number> = { mon: 8, tue: 6, wed: 7 };
```

`Map.get` is typed `V | undefined`, because the key might be missing. That is TypeScript being
honest: you must handle the missing case with `??`, an `if`, or `has`. With a union key such as
`Weekday`, `Record` makes the compiler insist on **every** key, which is a cheap exhaustiveness
check. Both `Map` and `Set` are iterable: `for (const [k, v] of map)`, `[...set]` and
`Array.from(map.values())` all work.

## Pitfalls

- **Object keys are always strings.** `obj[1]` and `obj["1"]` are the same slot. A `Map` keeps
  `1` and `"1"` apart.
- **`Map` compares keys by identity.** Two different arrays `[1, 2]` are two different keys, so
  `map.get([1, 2])` finds nothing. Use a string key such as `"1,2"` instead.
- **Plain objects inherit keys.** `"constructor" in {}` is `true`. A `Map` starts truly empty,
  which matters when the keys come from user input.
- **`Record<string, number>` lies a little.** Reading `rec["missing"]` is typed `number`, but at
  run time it is `undefined`. Only the `noUncheckedIndexedAccess` option makes the compiler add
  `| undefined`. Prefer a `Map` for open-ended keys.
- **`map.get(k)!`** silences the compiler with a non-null assertion. If the key is absent you
  get `undefined` anyway, and the crash happens later, far from the cause.
- **`JSON.stringify(new Map(...))` gives `"{}"`.** Convert first, with `Object.fromEntries(map)`.

## What you will practise

You will count words with a `Map`, compare two groups of visitors with `Set`, and tally and group
log lines with a `Record` and a `Map` of arrays. The challenge asks you to rank the most frequent
words of a text, with a precise tie-breaking rule.
'''

[[unit.step]]
kind = "concept"
id = "ts-u12-c1-lookup"
title = "Lookups in O(1): Map, Set and Record"
points = 5
difficulty = 12
intro = '''
A hash table turns a key into a bucket number, so finding a value no longer depends on how many
values are stored. `Map` and `Set` are the hash tables built into every JavaScript engine, and
`Record` describes a plain object used as a dictionary.
'''
body = '''
## Map: keys to values

```ts
const ages = new Map<string, number>();
ages.set("ada", 36);
ages.set("alan", 41);
console.log(ages.get("ada"));    // 36
console.log(ages.get("bob"));    // undefined
console.log(ages.size);          // 2
```

`get` returns `number | undefined`, so the compiler forces you to handle a missing key. The
counting idiom combines both steps: `counts.set(w, (counts.get(w) ?? 0) + 1)`.

## Set: unique values

```ts
const seen = new Set<string>();
seen.add("x");
seen.add("x");
console.log(seen.size, seen.has("x")); // 1 true
```

`new Set(array)` removes duplicates in one step, and `[...set]` turns it back into an array.

## Record: a typed object

`Record<K, V>` is the type of an object whose keys are `K` and values are `V`. When `K` is a
union of literals, every key is required:

```ts
type Coin = "heads" | "tails";
const flips: Record<Coin, number> = { heads: 0, tails: 0 };
flips.heads++;
```

## Which one to pick

Use a `Record` when the keys are a small fixed set known at compile time. Use a `Map` when keys
arrive at run time (words, ids, user input), when they are not strings, or when you add and
delete often. Use a `Set` when you only care whether something is present. All three keep
insertion order, and `Map` and `Set` give O(1) average-time lookups no matter how large they
grow.
'''

