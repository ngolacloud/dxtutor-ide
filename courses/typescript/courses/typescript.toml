intro = '''
A Result is a discriminated union with an `ok` tag. The compiler only lets you read `value`
after checking `ok`, so an error can never be mistaken for data. It is the approach Rust and Go
take by default, expressed with TypeScript's union types.
'''
prompt = '''
Parse percentage strings into fractions, returning a `Result` instead of throwing, and sum only
the valid ones.

**Why:** for input that is *expected* to be wrong sometimes, a Result makes every failure
visible in the type and keeps the control flow straight, without `try` blocks.
'''
target = '''
type Result<T, E = string> = { ok: true; value: T } | { ok: false; error: E };

function parsePercent(raw: string): Result<number> {
  const text = raw.trim();
  if (!text.endsWith("%")) return { ok: false, error: `"${raw}" has no % sign` };
  const n = Number(text.slice(0, -1));
  if (!Number.isFinite(n)) return { ok: false, error: `"${raw}" is not a number` };
  if (n < 0 || n > 100) return { ok: false, error: `${n} is out of range` };
  return { ok: true, value: n / 100 };
}

const inputs = ["50%", " 12.5% ", "abc%", "150%", "75"];
let total = 0;
for (const raw of inputs) {
  const r = parsePercent(raw);
  if (r.ok) {
    total += r.value;
    console.log("ok   ", r.value);
  } else {
    console.log("error", r.error);
  }
}
console.log("sum of valid:", total);
'''
