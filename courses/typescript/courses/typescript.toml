[[unit.step]]
kind = "drill"
id = "ts-u02-d2-numbers"
title = "One number type"
points = 10
difficulty = 2
placeholder_policy = "shown"
run_command = "node --experimental-transform-types main.ts"
intro = '''
JavaScript stores every number as a 64-bit IEEE 754 floating-point value. That means one type
covers both `3` and `3.5`, division never truncates, and decimal fractions such as `0.1` are
stored as the closest binary approximation, so tiny rounding errors can appear.
'''
prompt = '''
Divide, round, take remainders, and convert text to numbers, printing each result.

**Why:** many bugs in real programs come from assuming whole-number division or exact
decimals. Seeing `0.30000000000000004` once is the best way to remember it.
'''
target = '''
const a = 7;
const b = 2;
console.log("7 / 2 =", a / b);
console.log("floor:", Math.floor(a / b));
console.log("remainder:", a % b);
console.log("0.1 + 0.2 =", 0.1 + 0.2);
console.log("rounded:", (0.1 + 0.2).toFixed(2));

const fromText: number = Number("42");
console.log("42 + 1 =", fromText + 1);
console.log("bad input:", Number("abc"));
console.log("largest safe integer:", Number.MAX_SAFE_INTEGER);
'''
line_comments = [
  "Both constants are inferred as `number`; there is no separate integer type.",
  "",
  "Division gives the exact result `3.5`, never a truncated whole number.",
  "`Math.floor` rounds down, giving `3`: the usual way to get whole-number division.",
  "`%` is the remainder: 7 = 3 × 2 + 1, so it prints `1`.",
  "Binary floating point cannot store 0.1 exactly, so this prints `0.30000000000000004`.",
  "`toFixed(2)` formats a number as text with two decimals: `0.30`.",
  "",
  "`Number` converts a string to a number; the result is typed `number`.",
  "Now real addition happens: `43`, not the text `421`.",
  "Text that is not a number becomes `NaN`, which is still of type `number`.",
  "Above about 9 quadrillion, whole numbers can no longer all be represented exactly.",
]
explanation = '''
You saw `3.5`, `3`, `1`, `0.30000000000000004`, `0.30`, `43`, `NaN` and
`9007199254740991`. One number type keeps the language simple, but you must ask explicitly
for whole numbers (`Math.floor`) and for a fixed number of decimals (`toFixed`). `NaN` is a
reminder that the checker knows the *type* of a value, not whether the value is sensible.
'''

[[unit.step]]
kind = "drill"
id = "ts-u02-d3-null-undefined"
title = "undefined, null and ??"
points = 10
difficulty = 2
placeholder_policy = "shown"
run_command = "node --experimental-transform-types main.ts"
intro = '''
"No value" comes in two flavours: `undefined`, which the language uses for things that were
never set, and `null`, which you assign on purpose. With strict checks, TypeScript only lets a
variable hold them if its type says so, using a **union** such as `string | null`. This rules
out a whole family of "cannot read properties of null" crashes.
'''
prompt = '''
Declare a variable that starts as `undefined`, another that is deliberately `null`, and use
`??` to provide a fallback.

**Why:** missing values are everywhere in real data: an optional form field, a lookup that
finds nothing. Typing them explicitly forces you to handle them.
'''
target = '''
let nickname: string | undefined;
console.log("nickname:", nickname);
nickname = "Countess";
console.log("nickname:", nickname);

const middleName: string | null = null;
console.log("middle name:", middleName);
console.log(typeof undefined, typeof null);

