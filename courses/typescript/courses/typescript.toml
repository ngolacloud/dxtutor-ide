  void [n, tag, five];
}
void t_compileOnly;

dxt.test("returns the very same object", () => {
  const o = { a: 1 };
  dxt.check(deepFreeze(o) === o, "deepFreeze must freeze in place and return its argument");
  dxt.check(Object.isFrozen(o), "the top-level object must be frozen");
});

dxt.test("freezes nested objects and arrays", () => {
  const o = { user: { name: "Ada", tags: ["x", "y"] }, list: [{ n: 1 }, { n: 2 }] };
  deepFreeze(o);
