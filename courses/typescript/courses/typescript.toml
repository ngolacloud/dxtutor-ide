[unit.step.gabarito]
solution = '''
export interface LineItem {
  readonly sku: string;
  readonly qty: number;
  readonly unitPrice: number; // cents
}

export interface Order {
  readonly id: string;
  readonly customer: string;
  readonly items: readonly LineItem[];
  readonly discount?: number; // cents, subtracted from the order's subtotal
}

export interface CustomerTotal {
  customer: string;
  orders: number;
  spent: number;
}

function orderTotal(order: Order): number {
  const subtotal = order.items.reduce((sum, item) => sum + item.qty * item.unitPrice, 0);
  return Math.max(0, subtotal - (order.discount ?? 0));
}

export function totalsByCustomer(orders: readonly Order[]): CustomerTotal[] {
  const byCustomer = new Map<string, CustomerTotal>();
  for (const order of orders) {
    const total = orderTotal(order);
    const row = byCustomer.get(order.customer);
    if (row === undefined) {
      byCustomer.set(order.customer, { customer: order.customer, orders: 1, spent: total });
    } else {
      row.orders += 1;
      row.spent += total;
    }
  }
  return [...byCustomer.values()].sort(
    (a, b) => b.spent - a.spent || (a.customer < b.customer ? -1 : a.customer > b.customer ? 1 : 0),
  );
}
'''
time = "O(n + m + c log c)"
space = "O(c)"
justification = '''
Let n be the number of orders, m the total number of line items and c the number of distinct
customers. Computing every order's total touches each line item once, **O(n + m)**. Each
`Map.get` and `Map.set` is O(1) expected time, so grouping adds O(n). Sorting the c groups costs
**O(c log c)**, for **O(n + m + c log c)** in total; when every order has a different
customer that becomes O(n log n + m).

The map holds one `CustomerTotal` per customer and the final array copies those references, so
the extra space is **O(c)**; the orders themselves are only read. Rows are mutated in place
inside the map, but they are objects this function created, never the caller's data. A `Map`
rather than a plain object is the correct dictionary here: its keys are exactly the ones you
set, so customers named `constructor` or `toString` don't collide with inherited properties.
'''

[[unit]]
id = "ts-u09-unions-narrowing"
title = "Unions & narrowing"
level = "intermediate"
difficulty = 9
intro = '''
A value is often "one of several things": a string or a number, a success or a failure, a
circle or a square. Union types say exactly that, and narrowing is how TypeScript follows your
`if` and `switch` statements to know which case you are in. This unit ends with the most useful
pattern in the language, the discriminated union, checked for exhaustiveness with `never`.
'''
concepts = '''
## The idea

A **union type** `A | B` is the set of values that are an `A` or a `B`. A **literal type**
is a set with exactly one value, such as `"error"` or `404`, and a union of literals is a
precise, closed list of options: `type Level = "info" | "warn" | "error"`. Unions let a type
say what the data really is instead of settling for a vague `string` or, worse, `any`.

The catch is that you can only use what *every* member has. On a `string | number` you
cannot call `toUpperCase`, because numbers don't have it. To do more you must prove which
member you hold. TypeScript follows the checks you write and **narrows** the type inside each
branch; this is called control-flow analysis.

## How TypeScript does it

Each kind of run-time check narrows in its own way:

```ts
function show(v: string | number | null): string {
  if (v === null) return "none";             // equality narrowing
  if (typeof v === "string") return v.trim(); // v: string
  return v.toFixed(1);                        // v: number
}
```

- `typeof x === "string" | "number" | "boolean" | ...` narrows primitives.
- `"radius" in shape` narrows to the members that have that property.
- `x instanceof Date` narrows to a class.
- `===` against a literal narrows to that literal.

A **discriminated union** gives every member a common literal property, the **tag**:

```ts
type Result =
  | { kind: "ok"; value: number }
  | { kind: "err"; message: string };
```

Checking `r.kind` tells the compiler which member `r` is, so `r.value` is allowed only in the
`"ok"` branch. A `switch` over the tag reads like a table of cases.

**`never`** is the empty type: no value has it. After every member has been handled, the
remaining type is `never`. Assigning the leftover to a `never` parameter turns a forgotten case
into a compile error the day someone adds a new member.

## Pitfalls

- **`typeof null === "object"`.** Check `=== null` before relying on `typeof` for objects.
- **`instanceof` needs a class.** Interfaces and type aliases are erased, so `x instanceof
  Circle` is an error (TS2693) when `Circle` is an interface. Use `in` or a tag instead.
- **Casts skip the proof.** `(v as string).trim()` compiles and then crashes on a number.
- **Narrowing does not survive callbacks** on variables that are reassigned later; copy the
  value into a `const` first.
- Typical errors: `Property 'radius' does not exist on type 'Shape'` (TS2339, narrow first) and
  `Type 'Hexagon' is not assignable to type 'never'` (TS2322, a missing `case`).

## What you will practise

You will narrow with `typeof`, `in` and `instanceof`, compute areas over a discriminated union
with an exhaustive `switch`, and then write a small interpreter that evaluates a tree of
arithmetic expressions built from a discriminated union.
'''

[[unit.step]]
kind = "concept"
id = "ts-u09-c1-narrowing"
title = "Unions, literals and narrowing"
points = 5
difficulty = 9
intro = '''
A union type is a set union: the values of `A | B` are the values of `A` together with those of
`B`. Narrowing is the compiler doing set subtraction as it reads your code: after `if (typeof x
=== "string") return`, the strings are gone from what `x` can be.
'''
body = '''
## A union is a promise of "one of these"

```ts
type Id = string | number;
type Method = "GET" | "POST" | "DELETE";
```

`Method` accepts exactly three strings. Passing `"PUT"` is a compile error, which is far
better than a typo discovered in production.

## Narrowing follows your checks

```ts
function len(x: string | string[] | undefined): number {
  if (x === undefined) return 0;
  if (typeof x === "string") return x.length; // x: string
  return x.length;                             // x: string[]
}
```

After each `return`, TypeScript removes the handled member from what `x` can be. The checks are
ordinary JavaScript that also runs at run time; TypeScript simply understands what they prove.
Narrowing also works with `else`, `switch`, `&&`, early `throw`, and truthiness: inside
`if (name)` a `string | undefined` becomes `string`, though the empty string is excluded too.

## Tags make objects easy to tell apart

When the members are objects, give each one a literal `kind` property. Then `switch (x.kind)`
narrows each `case` to one member, and a final `default` that assigns `x` to `never` proves you
covered them all. The compiler then becomes a checklist: add a member to the union and every
`switch` that forgot it stops compiling. This tagged-union pattern is how TypeScript code models
states, events, messages and syntax trees.
'''

