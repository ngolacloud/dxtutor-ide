[unit.step.gabarito]
solution = '''
/**
 * Return an `add` function. Items added during one synchronous turn are passed to
 * `flush` together, in order, in a single microtask after that turn ends.
 */
export function createBatcher<T>(flush: (items: T[]) => void): (item: T) => void {
  let pending: T[] = [];
  let scheduled = false;
  return (item: T): void => {
    pending.push(item);
    if (scheduled) return;
    scheduled = true;
    queueMicrotask(() => {
      const batch = pending;
      pending = [];
      scheduled = false;
      flush(batch);
    });
  };
}
'''
time = "O(1) amortized per add; O(k) to hand over a batch of k items"
space = "O(k) for the pending batch"
justification = '''
Each `add` does a constant amount of work: one amortized O(1) `push` and, only for the first
call of a turn, one `queueMicrotask`. Over a turn with *k* calls that is **O(k)** in total, and
the flush itself hands over the array without copying it, so it is O(1) on top of whatever
`flush` does. The only storage is the pending array, **O(k)** for the current batch.

Correctness rests on the event loop. The microtask is queued during the turn, so it runs as soon
as the synchronous code ends and before any macrotask, which a `setTimeout` or `setImmediate`
version cannot guarantee. Swapping `pending` for a fresh array and clearing `scheduled` *before*
calling `flush` makes re-entrant calls safe: an `add` from inside `flush` lands in the new array
and schedules a new microtask, and the array already given to `flush` is never touched again.
'''

[[unit]]
id = "ts-u21-async-control"
title = "Async control: combinators, timeouts and concurrency limits"
level = "advanced"
difficulty = 27
intro = '''
Real programs rarely wait for one promise at a time. They fire several requests and need the
first answer, all the answers, or every outcome whether it succeeded or not; they give up on slow
work; and they cap how many tasks run at once so they don't flood a server. This unit covers the
four promise combinators, cancellation with `AbortController`, retries with backoff, and a
concurrency-limited map.
'''
concepts = '''
## The idea

A promise stands for one eventual result. Coordinating **many** of them is a separate skill:
which results do you actually need, what happens when one of them fails, and how many operations
may be in flight at the same time? The answers decide whether a program is fast, robust, and
polite to the services it calls.

## The four combinators

Each one takes an iterable of promises and returns a new promise:

- **`Promise.all`** fulfils with every value, in input order, once all inputs fulfil. It rejects
  as soon as **one** input rejects.
- **`Promise.allSettled`** waits for every input to settle and never rejects. Each entry is an
  outcome object: `{ status: "fulfilled", value }` or `{ status: "rejected", reason }`.
- **`Promise.race`** settles like the **first** input to settle, success or failure.
- **`Promise.any`** fulfils with the first input that **fulfils**. It rejects only when every
  input rejects, with an `AggregateError` that lists all the reasons.

TypeScript types them precisely. `allSettled` returns `PromiseSettledResult<T>[]`, a
discriminated union you narrow on `status`:

```ts
const results = await Promise.allSettled([load("a"), load("b")]);
for (const r of results) {
  if (r.status === "fulfilled") console.log(r.value);
  else console.log("failed:", r.reason);
}
```

None of the combinators cancels anything. When `race` settles, the losing operations keep
running; their results are simply ignored.

## Timeouts and cancellation

Cancellation in modern JavaScript is **cooperative**. An `AbortController` owns an `AbortSignal`;
the caller passes the signal down, and the worker checks it or listens for its `abort` event and
stops. `AbortSignal.timeout(ms)` creates a signal that aborts by itself. Many Node APIs accept
`{ signal }`, among them `fetch`, `events.once` and the promise version of `setTimeout`:

```ts
import { setTimeout as sleep } from "node:timers/promises";
await sleep(1000, undefined, { signal: AbortSignal.timeout(10) }); // rejects after ~10 ms
```

## Limiting concurrency

`Promise.all(items.map(fn))` starts **every** task immediately. For 10,000 URLs that means
10,000 open connections. A **concurrency limit** keeps at most *k* tasks in flight: start *k*
workers and let each one take the next index from a shared counter until the work runs out.
JavaScript is single-threaded, so reading and incrementing that counter between two `await`s
needs no lock.

## Pitfalls

- **The reason is `unknown`.** A rejection can carry any value. Narrow it with
  `instanceof Error` before you read `.message`; `(e as Error).message` only silences `tsc`.
- **Unhandled rejections crash Node.** A promise you start but never `await` or `.catch` ends
  the process when it rejects.
- **`async` callbacks in `forEach` are not awaited.** `items.forEach(async (x) => …)` starts
  everything and returns at once. Use `for … of` with `await`, or a combinator.
- **A signal does nothing by itself.** Passing `signal` to your own function stops nothing
  unless the function checks `signal.aborted` or listens for `abort`.

## What you will practise

You will collect outcomes with `allSettled`, `any` and `race`, put a deadline on slow work with
`AbortSignal`, and retry a flaky operation with exponential backoff. The challenge is `mapLimit`,
an order-preserving async map that never runs more than *k* tasks at once.
'''

[[unit.step]]
kind = "concept"
id = "ts-u21-c1-combinators"
title = "Waiting for many promises"
points = 5
difficulty = 27
intro = '''
Promise combinators turn many pending operations into one promise, and each answers a different
question: all of them, every outcome, the fastest, or the first success. None of them stops the
work it waits for; stopping work needs an `AbortSignal`.
'''
body = '''
## Choose by what you need

- You need **every** result, and any failure is fatal: `Promise.all`.
- You need **every outcome**, success or failure, for example for a report: `Promise.allSettled`.
- You need **the fastest** answer, whatever it is, often raced against a timeout: `Promise.race`.
- You need **the first success** and can ignore failures, as with mirrors or fallbacks:
  `Promise.any`.

```ts
const page = await Promise.any([fromMirror("eu"), fromMirror("us")]);
```

## Nothing gets cancelled

A combinator only decides when *its own* promise settles. The operations behind the input
promises keep running in the background. To really stop work, create an `AbortController`, pass
its `signal` into the work, and call `abort()`.

## Limit how many run at once

Mapping an array to promises starts all of them immediately. A pool of *k* workers that each pick
the next item when they finish keeps exactly *k* operations in flight. With *n* tasks of similar
length, the total time is about *n / k* task durations, instead of one duration with an unlimited
burst or *n* durations when you run them one by one.

## Errors are `unknown`

Under `strict`, TypeScript types a `catch` variable and a rejection reason as `unknown`, because
JavaScript can throw any value at all. Narrow it with `instanceof Error` before you use it.
'''

