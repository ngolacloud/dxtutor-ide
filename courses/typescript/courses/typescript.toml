[[unit.step]]
kind = "challenge"
id = "ts-u18-x1-chunk"
title = "Lazy chunks of any iterable"
points = 40
difficulty = 24
entry = "chunk"
intro = '''
Batching a stream into fixed-size groups is a staple of data processing: inserting rows in
batches, paging results, sending requests in groups. Done lazily, it works on streams too large
for memory or with no end at all, and it reads from the source only as far as the consumer
needs.
'''
instructions = '''
## Your turn

Implement `chunk`:

```ts
export function chunk<T>(source: Iterable<T>, size: number): Generator<T[], void, undefined>
```

It returns a generator that yields consecutive arrays of `size` items taken from `source`, in
order. The last array holds whatever is left and may be shorter; it is never empty.

Rules:

- **Validate eagerly.** If `size` is not a positive integer (`0`, `-1`, `2.5`, `NaN`), throw a
  `RangeError` **when `chunk` is called**, not later when it is iterated.
- **Be lazy.** Pull from `source` only when the consumer asks for the next chunk, and never more
  than needed: after the first chunk of size 3 has been yielded, exactly 3 items have been read.
  `source` may be infinite.
- Work with **any iterable**: arrays, strings, `Set`, generators.
- Every yielded chunk is a **new array**; never mutate an array after yielding it.
- If the consumer stops early (for example with `break`), the source must be closed, so its
  `finally` blocks run.

Examples:

- `[...chunk([1, 2, 3, 4, 5, 6, 7], 3)]` is `[[1, 2, 3], [4, 5, 6], [7]]`.
- `[...chunk("abcde", 2)]` is `[["a", "b"], ["c", "d"], ["e"]]`.
- `[...chunk([], 4)]` is `[]`.
- `chunk([1, 2], 0)` throws a `RangeError` immediately.

**Hint:** the body of a `function*` does not run until the first `next()`. Validate in an
ordinary function, then return a generator from a helper. Iterating the source with `for...of`
inside a generator closes it for you when the consumer stops.

Hidden tests decide correctness.
'''
starter = '''
// Split `source` into arrays of `size` items, lazily. Throw a RangeError right away
// if `size` is not a positive integer.
export function chunk<T>(source: Iterable<T>, size: number): Generator<T[], void, undefined> {
  throw new Error("not implemented");
}
'''
tests = '''
function* t_counting(log: { pulled: number; closed: boolean }): Generator<number, void, undefined> {
  try {
    for (let i = 1; ; i++) {
      log.pulled++;
      yield i;
    }
  } finally {
    log.closed = true;
  }
}

function t_compileOnly(): void {
  const g: Generator<string[], void, undefined> = chunk("abc", 2);
  // @ts-expect-error a number is not iterable
  chunk(5, 2);
  void g;
}
void t_compileOnly;

dxt.test("splits an array into chunks with a short last chunk", () => {
  dxt.equal([...chunk([1, 2, 3, 4, 5, 6, 7], 3)], [[1, 2, 3], [4, 5, 6], [7]]);
});

dxt.test("exact multiples, size one and size larger than the input", () => {
  dxt.equal([...chunk([1, 2, 3, 4], 2)], [[1, 2], [3, 4]]);
  dxt.equal([...chunk(["x", "y"], 1)], [["x"], ["y"]]);
  dxt.equal([...chunk([1, 2], 10)], [[1, 2]]);
});

dxt.test("an empty source yields nothing", () => {
  dxt.equal([...chunk([], 3)], []);
  dxt.equal([...chunk("", 1)], []);
});

dxt.test("works with strings, sets and generators", () => {
  dxt.equal([...chunk("abcde", 2)], [["a", "b"], ["c", "d"], ["e"]]);
  dxt.equal([...chunk(new Set([3, 3, 1, 2]), 2)], [[3, 1], [2]]);
  const log = { pulled: 0, closed: false };
  const firstTwo: number[][] = [];
  for (const c of chunk(t_counting(log), 2)) {
    firstTwo.push(c);
    if (firstTwo.length === 2) break;
  }
  dxt.equal(firstTwo, [[1, 2], [3, 4]]);
});

dxt.test("throws a RangeError immediately for a bad size", () => {
  for (const bad of [0, -1, 2.5, Number.NaN]) {
    let caught: unknown = null;
    try {
      chunk([1, 2, 3], bad);
    } catch (e) {
      caught = e;
    }
    dxt.check(caught instanceof RangeError, `chunk(xs, ${bad}) must throw a RangeError when called, before any iteration`);
  }
});

dxt.test("is lazy and never reads ahead", () => {
  const log = { pulled: 0, closed: false };
  const it = chunk(t_counting(log), 3);
  dxt.equal(log.pulled, 0);
  dxt.equal(it.next().value, [1, 2, 3]);
  dxt.equal(log.pulled, 3);
  dxt.equal(it.next().value, [4, 5, 6]);
  dxt.equal(log.pulled, 6);
});

dxt.test("stopping early closes the source", () => {
  const log = { pulled: 0, closed: false };
  for (const c of chunk(t_counting(log), 4)) {
    dxt.equal(c, [1, 2, 3, 4]);
    break;
  }
  dxt.check(log.closed, "breaking out of the loop must close the source generator");
});

dxt.test("every chunk is a separate array", () => {
  const all = [...chunk([1, 2, 3, 4, 5, 6], 2)];
  dxt.check(all[0] !== all[1] && all[1] !== all[2], "chunks must not share one array");
  all[0].push(99);
  dxt.equal(all[1], [3, 4]);
});

dxt.test("large input", () => {
  const n = 200_000;
  const start = performance.now();
  let count = 0;
  let total = 0;
  let last: number[] = [];
  for (const c of chunk(Array.from({ length: n }, (_, i) => i), 1000)) {
    count++;
    total += c.length;
    last = c;
  }
  dxt.equal(count, 200);
  dxt.equal(total, n);
  dxt.equal(last[last.length - 1], n - 1);
  dxt.check(performance.now() - start < 2000, "chunk should be linear in the number of items");
});
'''

[unit.step.gabarito]
solution = '''
export function chunk<T>(source: Iterable<T>, size: number): Generator<T[], void, undefined> {
  // A plain function runs immediately, so a bad size is reported at the call site.
  if (!Number.isInteger(size) || size < 1) {
    throw new RangeError(`chunk size must be a positive integer, got ${size}`);
  }
  return chunks(source, size);
}

function* chunks<T>(source: Iterable<T>, size: number): Generator<T[], void, undefined> {
  let batch: T[] = [];
  for (const item of source) {
    batch.push(item);
    if (batch.length === size) {
      yield batch;
      batch = [];
    }
  }
  if (batch.length > 0) yield batch;
}
'''
time = "O(n)"
space = "O(k)"
justification = '''
Let **n** be the number of items the consumer pulls through and **k** the chunk size. Each item is
read from the source once and pushed onto the current batch once, which is amortized O(1), so
the total time is **O(n)**. Starting a fresh `batch` array after every `yield` is O(1) as well,
and it is what keeps each yielded chunk independent of the next.

The generator holds at most one unfinished batch, so the extra space is **O(k)** no matter how
long, or infinite, the source is. (The chunks handed out belong to the consumer; if it keeps them
all, that is the consumer's O(n), not the function's.)

Two details make it correct beyond the arithmetic. First, `chunk` is an ordinary function that
validates and then returns the generator from `chunks`; had it been a `function*` itself, the
`RangeError` would only appear at the first `next()`. Second, iterating with `for...of` inside the
generator means that when the consumer breaks out, the paused `yield` completes with a return,
the loop exits, and `for...of` calls the source's `return()`, closing it. The batch is yielded as
soon as it is full, never after peeking at the next item, so the source is read no further than
needed.
'''


[[unit]]
id = "ts-u19-functional"
title = "Functional programming: closures, immutability and composition"
level = "advanced"
difficulty = 25
intro = '''
In TypeScript, functions are values: you can store them, pass them in and return them. This unit
uses that to build private state with closures, update data without mutating it, and assemble
small functions into bigger ones with composition and currying. The challenge is a generic
`memoize` that keeps the exact signature of the function it wraps.
'''
concepts = '''
## The idea

Functional programming is a style built on three habits:

- **Functions are values.** A function can be an argument or a return value. A function that
  takes or returns another function is a **higher-order function**: `map`, `filter`, `reduce`,
  `setTimeout` and every event listener are examples.
- **Prefer pure functions.** A pure function's result depends only on its arguments, and it has
  no side effects. Pure code is easy to test, to cache and to reason about.
- **Don't mutate shared data.** Instead of changing an object in place, build a new one with the
  change. Code that still holds the old value is not surprised.

You do not have to write everything this way. The payoff comes from using it where it helps:
data transformations, state updates and reusable utilities.

## How TypeScript does it

A **closure** is a function together with the variables it captured from the scope where it was
created. Those variables live as long as the function does, which gives you private state
without a class:

```ts
function makeId(prefix: string): () => string {
  let next = 1;
  return () => `${prefix}-${next++}`;
}
const orderId = makeId("ord"); // orderId() -> "ord-1", then "ord-2"
```

Immutability has a compile-time half and a run-time half. `readonly` properties, `readonly T[]`
and `Readonly<T>` make `tsc` reject writes. Spread syntax builds updated copies, and
`Object.freeze` blocks writes at run time:

```ts
type Point = { readonly x: number; readonly y: number };
const moveRight = (p: Point): Point => ({ ...p, x: p.x + 1 });
```

**Composition** builds a function out of others: `compose(f, g)(x)` is `f(g(x))`. Generic type
parameters make the types line up, so `tsc` rejects a pipeline whose steps do not fit together.
Rest parameters typed as a tuple, `(...args: A) => R` with `A extends unknown[]`, let a wrapper
accept and return functions of any arity while keeping their exact parameter types.

## What is special or tricky

- **Spread copies one level.** `{ ...state }` is a shallow copy: nested objects are shared. Copy
  every level you change, and share the levels you don't (that sharing is what makes immutable
  updates cheap).
- **`readonly` is compile time only.** Node strips it. Data from outside the program can still be
  mutated unless you also freeze it.
- **`sort` and `reverse` mutate.** Calling `.sort()` on an array you received changes the
  caller's array, and `tsc` rejects it on a `readonly` array. Copy first with `[...xs].sort()`.
- **Closures capture variables, not values.** A callback sees the variable's latest value. With
  `let` in a `for` loop each iteration gets its own binding; with `var` they would all share one.
- **Losing types in wrappers.** Typing a wrapper as `(...args: any[]) => any` compiles, but every
  caller loses its parameter checks. Use generic tuple parameters instead.

## What you will practise

You will build counters and a `once` helper with closures, update a shopping cart without
mutating it, and compose a string pipeline with `pipe`, `compose2` and currying. The challenge is a
fully typed `memoize`, a closure that caches results.
'''

[[unit.step]]
kind = "concept"
