// part with "*", keep "@" and the domain. No "@" (or "@" first): return as is.
export function maskEmail(email: string): string {
  throw new Error("not implemented");
}
'''
tests = '''
dxt.test("masks a short local part", () => {
  dxt.equal(maskEmail("ada@example.com"), "a**@example.com");
});

dxt.test("masks a long local part with a dot", () => {
  dxt.equal(maskEmail("grace.hopper@navy.mil"), "g***********@navy.mil");
});

dxt.test("one-character local part stays visible", () => {
  dxt.equal(maskEmail("x@y.io"), "x@y.io");
});

dxt.test("no @ means unchanged", () => {
  dxt.equal(maskEmail("not-an-email"), "not-an-email");
});

dxt.test("@ at the start means unchanged", () => {
  dxt.equal(maskEmail("@handle"), "@handle");
});

dxt.test("empty string", () => {
  dxt.equal(maskEmail(""), "");
});

dxt.test("domain is never masked", () => {
  dxt.equal(maskEmail("bob@sub.domain.example.org"), "b**@sub.domain.example.org");
});

dxt.test("keeps the length of the original", () => {
  const input = "a".repeat(500) + "@x.com";
  const out = maskEmail(input);
  dxt.equal(out.length, input.length);
  dxt.equal(out, "a" + "*".repeat(499) + "@x.com");
