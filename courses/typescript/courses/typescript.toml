function t_order(id: string, customer: string, items: Array<[string, number, number]>, discount?: number): Order {
  const lines: LineItem[] = items.map(([sku, qty, unitPrice]) => ({ sku, qty, unitPrice }));
  return discount === undefined ? { id, customer, items: lines } : { id, customer, items: lines, discount };
}

