instructions = '''
## Your turn

Implement the function `classifyTriangle`:

```ts
export function classifyTriangle(a: number, b: number, c: number): string
```

It returns one of four strings:

- `"invalid"` if the three lengths cannot form a triangle: any side is zero or negative, or
  any side is greater than **or equal to** the sum of the other two (a flat "triangle" does
  not count);
- `"equilateral"` if all three sides are equal;
- `"isosceles"` if exactly two sides are equal;
- `"scalene"` if all three sides are different.

The sides can come in any order, and they may have decimals.

Examples:

- `classifyTriangle(3, 4, 5)` → `"scalene"`
- `classifyTriangle(2, 2, 3)` → `"isosceles"`
- `classifyTriangle(1, 2, 3)` → `"invalid"` (1 + 2 is not greater than 3)

**Hint:** rule out the invalid cases first, then check for three equal sides, then for two.
Use `===`, `&&` and `||`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Return "invalid", "equilateral", "isosceles" or "scalene".
export function classifyTriangle(a: number, b: number, c: number): string {
  throw new Error("not implemented");
}
'''
tests = '''
dxt.test("scalene", () => {
  dxt.equal(classifyTriangle(3, 4, 5), "scalene");
  dxt.equal(classifyTriangle(5, 3, 4), "scalene");
});

dxt.test("equilateral", () => {
  dxt.equal(classifyTriangle(7, 7, 7), "equilateral");
});

dxt.test("isosceles in every position", () => {
  dxt.equal(classifyTriangle(2, 2, 3), "isosceles");
  dxt.equal(classifyTriangle(2, 3, 2), "isosceles");
  dxt.equal(classifyTriangle(3, 2, 2), "isosceles");
});

dxt.test("zero or negative sides are invalid", () => {
  dxt.equal(classifyTriangle(0, 0, 0), "invalid");
  dxt.equal(classifyTriangle(0, 4, 5), "invalid");
  dxt.equal(classifyTriangle(-3, 4, 5), "invalid");
});

dxt.test("flat triangles are invalid", () => {
  dxt.equal(classifyTriangle(1, 2, 3), "invalid");
  dxt.equal(classifyTriangle(3, 1, 2), "invalid");
  dxt.equal(classifyTriangle(2, 4, 2), "invalid");
});

dxt.test("too-long side is invalid", () => {
  dxt.equal(classifyTriangle(1, 1, 10), "invalid");
  dxt.equal(classifyTriangle(10, 1, 1), "invalid");
});

dxt.test("decimal sides", () => {
  dxt.equal(classifyTriangle(0.5, 0.5, 0.5), "equilateral");
  dxt.equal(classifyTriangle(1.5, 2.5, 3.5), "scalene");
});

dxt.test("large sides", () => {
  dxt.equal(classifyTriangle(1000000, 1000000, 1), "isosceles");
});
'''

[unit.step.gabarito]
solution = '''
// Return "invalid", "equilateral", "isosceles" or "scalene".
export function classifyTriangle(a: number, b: number, c: number): string {
  if (a <= 0 || b <= 0 || c <= 0) {
    return "invalid";
  }
  if (a >= b + c || b >= a + c || c >= a + b) {
    return "invalid";
  }
  if (a === b && b === c) {
    return "equilateral";
  }
  if (a === b || b === c || a === c) {
    return "isosceles";
  }
  return "scalene";
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The function performs a fixed number of comparisons and additions (at most a dozen) whatever
the values are, so the time is **O(1)**, and it allocates nothing beyond returning one of
four constant strings, so the space is **O(1)**.

The order of the checks is what makes it correct. Ruling out invalid lengths first means the
later tests only ever see real triangles. Testing "all three equal" before "two equal" matters
because an equilateral triangle also has two equal sides. Each `return` ends the function
early, so no `else` is needed: when execution reaches a line, every earlier case is known to
be false, which is the same idea as the checker's narrowing.
'''

[[unit]]
id = "ts-u05-loops"
title = "Loops & arrays"
level = "basic"
difficulty = 5
intro = '''
Computers shine at repetition. You will repeat work with the counting `for` loop, walk
through arrays and strings with `for...of`, keep going until a condition changes with
`while`, and steer loops with `break` and `continue`. You will also meet your first typed
collection, the array `number[]`.
'''
concepts = '''
## The idea

A **loop** runs the same block of code again and again: once per item in a list, a fixed
number of times, or until something becomes true. Each pass is called an **iteration**.
Loops are how a short program processes a thousand lines, or a million numbers. Most loops
walk over a **collection**, and the simplest collection is the **array**: an ordered list of
values, each at a numbered index starting at 0.

## How TypeScript does it

An array is written in square brackets, and its type is the element type followed by `[]`:

```ts
const temps: number[] = [18, 21, 19];
temps.push(25);              // add at the end
console.log(temps.length);   // 4
console.log(temps[0]);       // 18
```

The **counting `for` loop** has three parts: a start, a condition checked before every
iteration, and an update run after each one. It is the right tool when you need the index:

```ts
for (let i = 0; i < temps.length; i++) {
  console.log(i, temps[i]);
}
```

**`for...of`** gives you each element directly, with no index to manage. It works on arrays
and on strings (one character at a time):

```ts
for (const t of temps) {
  console.log(t);
}
```

**`while`** repeats as long as its condition stays true. Use it when you cannot know in
advance how many iterations you will need. Inside any loop, **`break`** leaves the loop
immediately and **`continue`** skips to the next iteration.

## What is special or tricky

- **Off-by-one errors.** Valid indexes run from `0` to `length - 1`. Writing `i <= arr.length`
  reads one element too far and gets `undefined`, which the checker does not catch: `arr[i]`
  is still typed `number`.
- **`for...in` is not `for...of`.** `for...in` walks the *keys*, which for an array are the
  indexes as strings (`"0"`, `"1"`, ...). Use `for...of` for values.
- **Infinite loops.** A `while` whose condition never becomes false never ends. Make sure
  something inside the loop moves towards the exit.
- **`const` or `let`.** In `for...of` each iteration gets a fresh variable, so `const` is
  right. The counter of a classic `for` changes, so it must be `let`.
- **Element types are enforced.** `temps.push("hot")` is rejected with `Argument of type
  'string' is not assignable to parameter of type 'number'.`

## What you will practise

You will count with `for`, add up and print arrays with `for...of` and indexes, and use
`while`, `break` and `continue` to control when a loop stops. Then you will find the longest
run of equal values in an array, in a single pass.
'''

[[unit.step]]
kind = "concept"
id = "ts-u05-c1-loops"
title = "Three ways to repeat"
points = 5
difficulty = 5
intro = '''
Every loop has the same anatomy: something that decides whether to run again, a body that
does the work, and progress towards the end. The three loop forms differ only in where they
put those pieces, so pick the one that makes the stopping rule easiest to read.
'''
body = '''
## Counting: `for`

```ts
for (let i = 0; i < 3; i++) {
  console.log(i);   // 0, then 1, then 2
}
```

Read it as: start with `i = 0`; while `i < 3`, run the body; after each run, do `i++`
(add one). The condition is checked **before** each iteration, so when `i` reaches 3 the loop
stops without running the body again.

## Walking a collection: `for...of`

```ts
const names: string[] = ["Ada", "Grace"];
for (const name of names) {
  console.log(`Hi, ${name}`);
}
```

No index, no condition, no way to go out of bounds. This is the most common loop in modern
TypeScript, and the checker knows that `name` is a `string`, because `names` is a `string[]`.

## Until something changes: `while`

```ts
let n = 100;
while (n > 1) {
  n = Math.floor(n / 2);
}
```

`while` suits loops whose number of iterations depends on the data, like halving a number
until it reaches 1.

## Steering

- `break` exits the loop at once, for example when you have found what you were looking for.
- `continue` skips the rest of this iteration and moves to the next one.

A loop over `n` items does `n` iterations, so its cost grows in proportion to `n`. That is
the **O(n)** you will see in the challenges' complexity analyses.
'''

