target = '''
interface User {
  id: number;
  name: string;
}

function isUser(value: unknown): value is User {
  return (
    typeof value === "object" && value !== null &&
    "id" in value && typeof value.id === "number" &&
    "name" in value && typeof value.name === "string"
  );
}

function assertDefined<T>(value: T, what: string): asserts value is NonNullable<T> {
  if (value === null || value === undefined) throw new Error(`${what} is missing`);
}

const raw: unknown = JSON.parse('[{"id":1,"name":"Ada"},{"id":"2"},null,{"id":3,"name":"Lin"}]');
if (!Array.isArray(raw)) throw new Error("expected an array");

const users = raw.filter(isUser);
console.log(users.map((u) => u.name).join(", "));

const found = users.find((u) => u.id === 3);
assertDefined(found, "user 3");
console.log(found.name.toUpperCase());
'''
