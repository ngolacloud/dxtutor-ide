[[unit.step]]
kind = "challenge"
id = "ts-u10-x1-fraction"
title = "An immutable Fraction class"
points = 30
difficulty = 10
entry = "Fraction"
intro = '''
Floating-point numbers can't represent 1/3 or even 0.1 exactly, which is why `0.1 + 0.2 !==
0.3`. A rational number stored as two integers in lowest terms is exact, and Euclid's
algorithm, the oldest algorithm still in daily use, keeps it reduced in O(log n) steps. As an
immutable value class, every operation returns a new fraction and none ever changes one.
'''
instructions = '''
## Your turn

Implement the class `Fraction`, an exact rational number:

```ts
export class Fraction {
  readonly numerator: number;
  readonly denominator: number;
  constructor(numerator: number, denominator?: number); // denominator defaults to 1
  get value(): number;
  add(other: Fraction): Fraction;
  sub(other: Fraction): Fraction;
  mul(other: Fraction): Fraction;
  div(other: Fraction): Fraction;
  equals(other: Fraction): boolean;
  compareTo(other: Fraction): number;
  toString(): string;
  static parse(text: string): Fraction;
}
```

Rules:

- **Invariants.** Both parts are integers, the fraction is in lowest terms, the denominator is
  positive (the sign lives in the numerator), and zero is always `0/1`. So
  `new Fraction(6, -8)` has numerator `-3` and denominator `4`.
- The constructor throws a `RangeError` if the denominator is `0` or if either part is not an
  integer (`1.5`, `NaN`, `Infinity`).
- `add`, `sub`, `mul` and `div` return a **new** reduced fraction and never change `this` or
  `other`. `div` by a zero fraction throws a `RangeError`.
- `value` is the fraction as a floating-point number (`3/4` gives `0.75`).
- `equals` is true when both fractions are the same number. `compareTo` returns a negative
  number, zero or a positive number when `this` is smaller than, equal to or larger than
  `other`, so `list.sort((a, b) => a.compareTo(b))` sorts ascending.
- `toString()` gives `"3/4"`, `"-3/4"`, or just `"2"` when the denominator is 1.
- `Fraction.parse` accepts `"<int>"` or `"<int>/<int>"`, where `<int>` is digits with an optional
  leading `-`, and nothing else (no spaces, no decimals). Anything else throws. `"4/-6"` parses to
  `-2/3`, and `"1/0"` throws like the constructor.

**Hint:** reduce in the constructor with the greatest common divisor, `gcd(a, b) = gcd(b, a % b)`,
stopping when `b` is 0. Then every method can just call `new Fraction(...)` and get a valid result.
Watch out for `-0`: `-1 * 0` is `-0` in JavaScript.

Hidden tests decide correctness.
'''
starter = '''
// An exact rational number, always stored in lowest terms with a positive denominator.
// Every operation returns a new Fraction; none modifies an existing one.
export class Fraction {
  readonly numerator: number;
  readonly denominator: number;

  constructor(numerator: number, denominator = 1) {
    throw new Error("not implemented");
  }

  get value(): number {
    throw new Error("not implemented");
  }

  add(other: Fraction): Fraction {
    throw new Error("not implemented");
  }

  sub(other: Fraction): Fraction {
    throw new Error("not implemented");
  }

  mul(other: Fraction): Fraction {
    throw new Error("not implemented");
  }

  div(other: Fraction): Fraction {
    throw new Error("not implemented");
  }

  equals(other: Fraction): boolean {
    throw new Error("not implemented");
  }

  compareTo(other: Fraction): number {
    throw new Error("not implemented");
  }

  toString(): string {
    throw new Error("not implemented");
  }

  static parse(text: string): Fraction {
    throw new Error("not implemented");
  }
}
'''
