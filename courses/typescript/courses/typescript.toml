tests = '''
import * as t_sqlite from "node:sqlite";
import * as t_fs from "node:fs";
import * as t_os from "node:os";
import * as t_path from "node:path";

type t_Stats = { rows: number; uniq: number; lo: number; hi: number };

async function t_inFolder(fn: (file: string) => Promise<void>): Promise<void> {
  const dir = t_fs.mkdtempSync(t_path.join(t_os.tmpdir(), "dxt-psum-"));
  try {
    await fn(t_path.join(dir, "nums.db"));
  } finally {
    t_fs.rmSync(dir, { recursive: true, force: true });
  }
}

function t_inspect(file: string): { mode: string; stats: t_Stats } {
  const db = new t_sqlite.DatabaseSync(file, { timeout: 1000 });
  try {
    const mode = (db.prepare("PRAGMA journal_mode").get() as { journal_mode: string }).journal_mode;
    const stats = db
      .prepare("SELECT COUNT(*) AS rows, COUNT(DISTINCT n) AS uniq, COALESCE(MIN(n), 0) AS lo, COALESCE(MAX(n), 0) AS hi FROM nums")
      .get() as t_Stats;
    return { mode, stats: { rows: stats.rows, uniq: stats.uniq, lo: stats.lo, hi: stats.hi } };
  } finally {
    db.close();
  }
}

dxt.test("four workers", async () => {
  await t_inFolder(async (file) => {
    dxt.equal(await parallelSum(file, 100, 4), 5050);
