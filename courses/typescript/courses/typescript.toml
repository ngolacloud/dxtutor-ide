  }
}

export type Result<T, E> = { ok: true; value: T } | { ok: false; error: E };

// Parse one port (1..65535, digits only) per line; skip blank lines and # comments.
// Throw ParseError(message, lineNumber) for an invalid or duplicate port.
export function parsePorts(text: string): number[] {
  const ports: number[] = [];
  const seen = new Set<number>();
  const lines = text.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line === "" || line.startsWith("#")) continue;
    const port = /^\d+$/.test(line) ? Number(line) : NaN;
    if (!(port >= 1 && port <= 65535)) {
      throw new ParseError(`invalid port "${line}"`, i + 1);
    }
    if (seen.has(port)) throw new ParseError(`duplicate port ${port}`, i + 1);
    seen.add(port);
    ports.push(port);
  }
  return ports;
}

// Like parsePorts, but return a ParseError as { ok: false, error } instead of throwing it.
export function safeParsePorts(text: string): Result<number[], ParseError> {
  try {
    return { ok: true, value: parsePorts(text) };
  } catch (e) {
    if (e instanceof ParseError) return { ok: false, error: e };
    throw e;
  }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
`split` and the loop each visit the `n` characters of the text once; per line the work is a trim,
a regular-expression test on that line and one O(1) average `Set` lookup and insert, so the total
time is **O(n)**. The lines array, the `Set` of seen ports and the result array are all bounded
by the size of the input, so the space is **O(n)** (and the set never exceeds 65,535 entries).

Correctness hinges on two checks. `/^\d+$/` rejects signs, decimals, exponents and inner spaces
that `Number` would happily accept (`Number("1e3")` is 1000, `Number(" ")` is 0), and the
negated range test `!(port >= 1 && port <= 65535)` also catches `NaN`, because every comparison
with `NaN` is false. Using a `Set` for duplicates keeps each check O(1); `ports.includes(port)`
would make the parser O(n²). In `safeParsePorts`, narrowing with `instanceof ParseError` and
rethrowing everything else keeps real bugs visible instead of disguising them as parse errors.
'''

[[unit]]
id = "ts-u14-utility-types"
title = "Utility types"
level = "intermediate"
difficulty = 14
intro = '''
Real codebases describe the same data in several shapes: a full record, a patch that changes a
few fields, a public view without secrets. TypeScript's **utility types** derive those shapes from
one definition, so they can never drift apart. You will use `Partial`, `Required`, `Pick`,
`Omit`, `Readonly`, `ReturnType` and `typeof`, and finish by writing typed `pick`, `omit` and
`merge` helpers.
'''
concepts = '''
## The idea

A type is a description of a set of values, and TypeScript lets you compute new descriptions
from old ones, much as a function computes a value from its arguments. **Utility types** are
ready-made type-level functions in the standard library. Their point is a **single source of
truth**: if `User` gains a field, every type derived from it updates automatically, and the
compiler points at every place that must change.

## How TypeScript does it

```ts
interface Task { id: number; title: string; done: boolean; notes?: string }

type TaskPatch   = Partial<Task>;              // every field optional
type FullTask    = Required<Task>;             // every field required, even notes
type TaskHeader  = Pick<Task, "id" | "title">; // only these keys
type NewTask     = Omit<Task, "id">;           // every key except id
type FrozenTask  = Readonly<Task>;             // no field can be reassigned
type Flags       = Record<"a" | "b", boolean>; // { a: boolean; b: boolean }
```

Two more work on values you already have. In a type position, **`typeof x`** means "the type of
the variable `x`", and **`ReturnType<F>`** extracts what a function type returns:

```ts
const limits = { min: 1, max: 9 };
type Limits = typeof limits;                 // { min: number; max: number }

function makeId() { return { prefix: "t", n: 0 }; }
type Id = ReturnType<typeof makeId>;         // { prefix: string; n: number }
```

`Parameters<F>` gives a function's parameter types as a tuple, and `as const` turns a literal
into its narrowest read-only type, so `typeof` sees `"dev"` rather than `string`.

## Pitfalls

- **Types are erased.** `Omit<User, "password">` does not remove anything at run time. If you
  assign a full `User` to it, the password is still there and `JSON.stringify` will send it. You
  must build a new object yourself.
- **`Readonly` is shallow and compile-time only.** Nested objects stay mutable, and plain
  JavaScript can still write to the object. `Object.freeze` gives run-time protection, also
  shallow.
- **`Omit` does not check its keys.** `Omit<User, "pasword">` compiles and removes nothing.
  `Pick` does check, because its keys must extend `keyof T`.
- **`Partial` allows explicit `undefined`.** A patch `{ age: undefined }` is a valid
  `Partial<User>`, so a naive spread can erase a field.
- **Two meanings of `typeof`.** In an expression, `typeof x` is the run-time operator that
  returns a string such as `"object"`. After `type X =` or `:`, it is the type query.
- **`{} as User`** silences the compiler while every field is missing. Utility types exist so
  that you never need that cast.

## What you will practise

You will apply partial updates and complete optional fields, strip a secret field both in the
type and at run time, and derive types from values with `typeof`, `ReturnType` and `as const`.
The challenge asks for generic `pick`, `omit` and `merge` functions whose return types are
exactly the utility types.
'''

[[unit.step]]
kind = "concept"
id = "ts-u14-c1-derived-types"
title = "Types made from types"
points = 5
difficulty = 14
intro = '''
Utility types are functions that run inside the compiler: they take a type and produce a new
one. They exist only at compile time, so the code that shapes the actual objects is still yours
to write.
'''
body = '''
## One definition, many shapes

```ts
interface Product {
  sku: string;
  name: string;
  price: number;
  stock?: number;
}
```

From `Product` you can derive:

- `Partial<Product>`: all four fields optional. Perfect for an "update these fields" patch.
- `Required<Product>`: `stock` becomes mandatory too.
- `Pick<Product, "sku" | "price">`: just `sku` and `price`.
- `Omit<Product, "stock">`: everything except `stock`.
- `Readonly<Product>`: the compiler rejects `p.price = 0`.

If you later add `currency: string` to `Product`, all five follow automatically.

## Types from values

Sometimes the value comes first. `typeof` in a type position reads the type of a variable, and
`ReturnType` reads the result type of a function type:

```ts
const defaults = { retries: 3, verbose: false };
type Options = typeof defaults;   // { retries: number; verbose: boolean }

function connect() { return { id: 1, open: true }; }
type Conn = ReturnType<typeof connect>;
```

Note the `typeof connect`: `ReturnType` needs a *type*, and `connect` is a value.

## Compile time versus run time

All of this disappears when Node strips the types. `Readonly` does not freeze anything and `Omit`
does not delete anything; they only constrain what the compiler accepts. When behaviour must
change at run time (removing a secret, preventing writes), write code such as destructuring or
`Object.freeze`, and use the utility type to describe the result accurately.
'''

