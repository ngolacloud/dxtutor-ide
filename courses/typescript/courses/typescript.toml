[unit.step.gabarito]
solution = '''
/**
 * Return a new array with `items` in ascending order, and the number of
 * pairs i < j with items[i] > items[j]. Don't modify `items`.
 */
export function sortAndCount(items: readonly number[]): [number[], number] {
  const a = [...items];
  const buffer = new Array<number>(a.length);
  const count = sortRange(a, buffer, 0, a.length);
  return [a, count];
}

/** Merge-sort a[lo, hi) in place and return the inversions inside it. */
function sortRange(a: number[], buffer: number[], lo: number, hi: number): number {
  if (hi - lo < 2) return 0;
  const mid = (lo + hi) >>> 1;
  let count = sortRange(a, buffer, lo, mid) + sortRange(a, buffer, mid, hi);
  let i = lo;
  let j = mid;
  let k = lo;
  while (i < mid && j < hi) {
    if (a[i] <= a[j]) {
      buffer[k++] = a[i++];
    } else {
      buffer[k++] = a[j++];
      count += mid - i;
    }
  }
  while (i < mid) buffer[k++] = a[i++];
  while (j < hi) buffer[k++] = a[j++];
  for (let t = lo; t < hi; t++) a[t] = buffer[t];
  return count;
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
This is merge sort with one extra addition per merge step. The recursion halves the range
until it has at most one item, so there are about log₂ n levels, and at each level the merges
together touch every item a constant number of times. The total is **O(n log n)**, about 1.7
million basic steps for 100,000 items, where checking all pairs would take 5 billion.

The counting rule: when `a[j]` from the right half is placed before `a[i]` from the left half,
`a[j]` is smaller than `a[i]` **and** than every item still waiting in the left half, because
that half is sorted. Each of those `mid - i` items sits before `a[j]` in the original array, so
each forms an inversion with it, and adding `mid - i` counts them all at once. Ties take from
the left (`<=`), so equal items are never counted. Inversions within each half were counted by
the recursive calls, and sorting a half never changes which pairs cross the middle.

Space is **O(n)**: the copy of the input plus one shared buffer of the same length, reused by
every merge instead of allocating new arrays, and an O(log n) recursion stack. The largest
possible count, n(n - 1) / 2, is about 5 × 10⁹ for 100,000 items, well within the range where
a JavaScript `number` is an exact integer (up to 2⁵³).
'''

[[unit]]
id = "ts-u28-recursion-dp"
title = "Recursion and dynamic programming"
level = "advanced"
difficulty = 34
intro = '''
Recursion solves a problem by solving smaller copies of itself, and dynamic programming makes
that fast when the same copies come up again and again. You will recurse over a recursive
type, count how much work naive Fibonacci wastes compared with a memo, fill a two-dimensional
table bottom-up, and finish by computing the edit distance between two strings.
'''
concepts = '''
## The idea

A **recursive** function calls itself on a smaller input. It needs a **base case** that answers directly, and a **recursive case** that reduces the problem and combines the answers. Recursion is the natural fit when the data is itself recursive: trees, nested arrays, JSON.

Some recursions solve the same subproblem many times. Naive Fibonacci computes `fib(n - 2)` once for `fib(n)` and again inside `fib(n - 1)`, and the waste compounds into exponential time. **Dynamic programming** (DP) applies when a problem has **overlapping subproblems** and **optimal substructure** (the best answer is built from best answers to subproblems). It solves each subproblem once and stores the result, in one of two styles:

- **Memoisation** (top-down): keep the recursion, but cache each result in a `Map`.
- **Tabulation** (bottom-up): fill an array in an order where every entry's dependencies are already computed. No recursion at all.

Designing a DP means naming the subproblem ("`d[i][j]` is the answer for the first `i` and `j` items"), writing the recurrence, fixing the base cases, and picking a fill order.

## How TypeScript does it

A recursive type describes recursive data, and narrowing separates the cases:

```ts
type Json = string | number | boolean | null | Json[] | { [key: string]: Json };
```

A memo is a typed `Map`. Its `get` returns `V | undefined`, so you check before trusting it:

```ts
const memo = new Map<number, bigint>();
function ways(n: number): bigint {
  if (n <= 1) return 1n;
  const hit = memo.get(n);
  if (hit !== undefined) return hit;
  const v = ways(n - 1) + ways(n - 2);
  memo.set(n, v);
  return v;
}
```

Tables are arrays of arrays, built with `Array.from({ length: rows }, () => new Array<number>(cols).fill(0))`.

## What is special or tricky

- **Annotate the return type of recursive functions.** Without it, `tsc --strict` may stop with TS7023: the function "implicitly has return type 'any' because it is referenced directly or indirectly in one of its return expressions".
- **The stack is finite and V8 does not eliminate tail calls.** A missing base case, or a recursion 10,000+ levels deep, throws `RangeError: Maximum call stack size exceeded`. Deep DP belongs in a loop.
- **Memo keys must be values, not objects.** `memo.get([i, j])` never hits, because every array literal is a new object. Use a string key such as `` `${i},${j}` `` or, faster, an index into a flat array.
- **`new Array(rows).fill([])` shares one row.** Every row is the same array, so writing one cell writes a whole column. Build each row separately with `Array.from`.
- Default parameters such as `memo = new Map()` are evaluated on every call, so a fresh memo per top-level call is safe, unlike in some other languages.

## What you will practise

You will sum and measure a nested array through a recursive type, count calls with and without a memo, and fill a table of grid paths. The challenge is the edit distance between two strings of up to 2,000 characters, which calls for a bottom-up table.
'''

[[unit.step]]
kind = "concept"
id = "ts-u28-c1-recursion-memo"
title = "Base cases, overlap and the memo"
points = 5
difficulty = 34
intro = '''
Every recursion needs a base case and a step that shrinks the problem. When the recursion tree
repeats the same calls, storing their results turns exponential time into polynomial time:
that is the whole idea of dynamic programming.
'''
body = '''
## Anatomy of a recursion

```ts
function fib(n: number): number {
  if (n < 2) return n;                // base case
  return fib(n - 1) + fib(n - 2);     // recursive case
}
```

Each call waits for its sub-calls on the **call stack**. Forget the base case and the stack
grows until Node throws `RangeError: Maximum call stack size exceeded`.

## The overlap

```
fib(5)
├─ fib(4)
│  ├─ fib(3)
│  │  ├─ fib(2) ...
│  │  └─ fib(1)
│  └─ fib(2) ...
└─ fib(3)          <- computed again
   ├─ fib(2) ...   <- and again
   └─ fib(1)
```

There are only n + 1 distinct subproblems, `fib(0)` to `fib(n)`, yet the naive tree has about
φⁿ nodes (φ ≈ 1.618). That gap is the signature of a DP problem.

## Memoise or tabulate

A **memo** stores each answer the first time it is computed, in a `Map<number, number>`;
later calls return it immediately, so each subproblem costs O(1) after the first time.

A **table** computes the answers in dependency order, smallest first, with no recursion and no
stack risk:

```ts
const f = [0, 1];
for (let i = 2; i <= n; i++) f[i] = f[i - 1] + f[i - 2];
```

Both make Fibonacci O(n). When only the last row or two of a table is ever read, you can keep
just those and cut the memory as well.
'''

