instructions = '''
## Your turn

Implement `deleteKey` (`delete` is a reserved word in TypeScript):

```ts
function deleteKey(root: TreeNode | null, key: number): TreeNode | null
```

Remove `key` from the binary search tree rooted at `root` and return the root of the
resulting tree (it may be a different node, or `null`). If `key` is not in the tree, return
the tree unchanged. The `TreeNode` class is provided in the starter. Keys are unique.

There are three cases for the node that holds `key`:

1. **No children**: remove it.
2. **One child**: the child takes its place.
3. **Two children**: replace its key with its in-order successor (the smallest key in its
   right subtree), then delete that successor from the right subtree.

After every deletion the tree must still satisfy the BST property and contain exactly the
remaining keys.

Examples, on the tree built by inserting `50, 30, 70, 20, 40, 60, 80`:

- `deleteKey(root, 20)` removes a leaf; in-order keys become `[30, 40, 50, 60, 70, 80]`.
- `deleteKey(root, 50)` removes the root, which has two children; 60 takes its place.
- `deleteKey(root, 99)` changes nothing and returns the same root.
- `deleteKey(null, 5)` returns `null`.

Hidden tests decide correctness, including thousands of deletions from a tree of 100,000
random keys.
'''
starter = '''
/** A binary search tree node (provided: do not change it). */
export class TreeNode {
  key: number;
  left: TreeNode | null;
  right: TreeNode | null;

  constructor(key: number, left: TreeNode | null = null, right: TreeNode | null = null) {
    this.key = key;
    this.left = left;
    this.right = right;
  }
}

/**
 * Remove `key` from the BST rooted at `root` and return the new root.
 * If `key` is absent, return the tree unchanged.
 */
export function deleteKey(root: TreeNode | null, key: number): TreeNode | null {
  throw new Error("not implemented");
}
'''
tests = '''
function t_insert(root: TreeNode | null, key: number): TreeNode {
  const fresh = new TreeNode(key);
  if (root === null) return fresh;
  let node = root;
  for (;;) {
    if (key < node.key) {
      if (node.left === null) { node.left = fresh; return root; }
      node = node.left;
    } else if (key > node.key) {
      if (node.right === null) { node.right = fresh; return root; }
      node = node.right;
    } else {
      return root;
    }
  }
}

function t_build(keys: number[]): TreeNode | null {
  let root: TreeNode | null = null;
  for (const k of keys) root = t_insert(root, k);
  return root;
}

function t_inorder(root: TreeNode | null): number[] {
  const out: number[] = [];
  const stack: TreeNode[] = [];
  let node = root;
  while (stack.length > 0 || node !== null) {
    while (node !== null) {
      stack.push(node);
      node = node.left;
    }
    const top = stack.pop() as TreeNode;
    out.push(top.key);
    node = top.right;
  }
  return out;
}

function t_isBst(root: TreeNode | null): boolean {
  const stack: Array<[TreeNode | null, number, number]> = [[root, -Infinity, Infinity]];
  while (stack.length > 0) {
    const [node, lo, hi] = stack.pop() as [TreeNode | null, number, number];
    if (node === null) continue;
    if (node.key <= lo || node.key >= hi) return false;
    stack.push([node.left, lo, node.key], [node.right, node.key, hi]);
  }
  return true;
}

function t_rng(seed: number): () => number {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function t_shuffle<T>(items: T[], rand: () => number): T[] {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

const T_BASE = [50, 30, 70, 20, 40, 60, 80];

dxt.test("deletes a leaf", () => {
  const root = deleteKey(t_build(T_BASE), 20);
  dxt.equal(t_inorder(root), [30, 40, 50, 60, 70, 80]);
  dxt.check(t_isBst(root), "the BST property must hold");
  dxt.equal(root?.key, 50);
});

dxt.test("deletes a node with one child", () => {
  let root = deleteKey(t_build([...T_BASE, 65]), 60);
  dxt.equal(t_inorder(root), [20, 30, 40, 50, 65, 70, 80]);
  dxt.check(t_isBst(root), "the BST property must hold");
  root = deleteKey(t_build([10, 5, 3]), 5);
  dxt.equal(t_inorder(root), [3, 10]);
  dxt.equal(root?.left?.key, 3);
  dxt.equal(root?.left?.left, null);
});

dxt.test("deletes a node with two children", () => {
  const root = deleteKey(t_build(T_BASE), 30);
  dxt.equal(t_inorder(root), [20, 40, 50, 60, 70, 80]);
  dxt.check(t_isBst(root), "the BST property must hold");
});

dxt.test("deletes the root with two children", () => {
  const root = deleteKey(t_build(T_BASE), 50);
  dxt.equal(t_inorder(root), [20, 30, 40, 60, 70, 80]);
  dxt.check(t_isBst(root), "the BST property must hold");
  dxt.equal(root?.key, 60);
});

dxt.test("deletes the root with one child", () => {
  const root = deleteKey(t_build([1, 2, 3]), 1);
  dxt.equal(root?.key, 2);
  dxt.equal(t_inorder(root), [2, 3]);
});

dxt.test("a missing key leaves the tree unchanged", () => {
  const root = t_build(T_BASE);
  dxt.check(deleteKey(root, 99) === root, "must return the same root");
  dxt.check(deleteKey(root, 45) === root, "must return the same root");
  dxt.equal(t_inorder(root), [20, 30, 40, 50, 60, 70, 80]);
});

dxt.test("empty tree and single node", () => {
  dxt.equal(deleteKey(null, 5), null);
  dxt.equal(deleteKey(new TreeNode(5), 5), null);
});

dxt.test("negative keys", () => {
  let root = t_build([0, -10, 10, -20, -5, 5, 20]);
  for (const k of [-10, 0, 20]) {
    root = deleteKey(root, k);
    dxt.check(t_isBst(root), `the BST property must hold after deleting ${k}`);
  }
  dxt.equal(t_inorder(root), [-20, -5, 5, 10]);
});

dxt.test("random deletions until the tree is empty", () => {
  const rand = t_rng(26);
  const keys = t_shuffle(Array.from({ length: 300 }, (_, i) => i), rand);
  let root = t_build(keys);
  const alive = new Set(keys);
  const order = t_shuffle([...keys], rand);
  order.forEach((k, i) => {
    root = deleteKey(root, k);
    alive.delete(k);
    if (i % 15 === 0) {
      dxt.check(t_isBst(root), "the BST property must hold");
      dxt.equal(t_inorder(root), [...alive].sort((a, b) => a - b));
    }
  });
  dxt.equal(root, null);
});

dxt.test("20,000 deletions from 100,000 random keys", () => {
  const rand = t_rng(2026);
  const unique = new Set<number>();
  while (unique.size < 100_000) unique.add(Math.floor(rand() * 10_000_000));
  const keys = [...unique];
  let root = t_build(keys);
  const doomed = t_shuffle([...keys], rand).slice(0, 20_000);
  doomed.push(-1, 10_000_001);
  const start = performance.now();
  for (const k of doomed) root = deleteKey(root, k);
  const elapsed = performance.now() - start;
  dxt.check(elapsed < 2000, `took ${elapsed.toFixed(0)} ms; each delete should cost O(h)`);
  dxt.check(t_isBst(root), "the BST property must hold");
  const gone = new Set(doomed);
  dxt.equal(t_inorder(root), keys.filter((k) => !gone.has(k)).sort((a, b) => a - b));
});
'''

[unit.step.gabarito]
solution = '''
/** A binary search tree node (provided: do not change it). */
export class TreeNode {
  key: number;
  left: TreeNode | null;
  right: TreeNode | null;

  constructor(key: number, left: TreeNode | null = null, right: TreeNode | null = null) {
    this.key = key;
    this.left = left;
    this.right = right;
  }
}

/** Remove `key` from the BST rooted at `root` and return the new root. */
export function deleteKey(root: TreeNode | null, key: number): TreeNode | null {
  if (root === null) return null;
  if (key < root.key) {
    root.left = deleteKey(root.left, key);
  } else if (key > root.key) {
    root.right = deleteKey(root.right, key);
  } else {
    if (root.left === null) return root.right;
    if (root.right === null) return root.left;
    let successor = root.right;
    while (successor.left !== null) successor = successor.left;
    root.key = successor.key;
    root.right = deleteKey(root.right, successor.key);
  }
  return root;
}
'''
time = "O(h), O(log n) on a balanced tree"
space = "O(h)"
justification = '''
The function walks one path from the root down to the node holding `key`, doing constant work
per level, so finding the node costs **O(h)**. In the two-children case it walks further down
the right subtree to the successor and then deletes the successor, which has no left child
and is therefore removed by the cheap one-child splice. Both walks lie on downward paths, so
the total is still **O(h)**. On a random tree h = O(log n), which is why 20,000 deletions from
100,000 keys finish in milliseconds; on a degenerate chain h = n.

Extra space is **O(h)** for the recursion stack (an iterative version with a parent reference
would use O(1)); on a random tree that is a few dozen frames, far from Node's stack limit.
Returning the subtree root from every call is what makes the root itself deletable without a
special case: the caller reattaches whatever comes back. Copying the successor's key into the
node keeps the tree's shape and order intact, since the successor is larger than everything
on the left and smaller than everything else on the right. Inside the `else` branch the two
early returns narrow `root.left` and `root.right` to `TreeNode`, so `successor` needs no cast.
'''

[[unit]]
id = "ts-u27-sorting-searching"
title = "Sorting and searching by hand"
level = "advanced"
difficulty = 33
intro = '''
`Array.prototype.sort` is fast and stable, but knowing how sorting works is what lets you
reason about cost and adapt the ideas to new problems. You will write insertion sort, the
merge step that powers merge sort, and a binary search that never goes off by one, then use
divide and conquer to sort an array and count how disordered it was, in O(n log n).
'''
concepts = '''
## The idea

Sorting puts items in order; searching finds one. The two are linked, because a sorted array can be searched in **O(log n)** by **binary search**: look at the middle item, and throw away the half that can't contain the target. Twenty steps cover a million items.

The simple sorts (insertion, selection, bubble) compare items pairwise and cost **O(n²)** in the worst case: fine for 50 items, hopeless for 100,000. **Merge sort** uses **divide and conquer**: split the array in half, sort each half recursively, then **merge** the two sorted halves in one linear pass. There are log₂ n levels of splitting and each level does O(n) work in total, so merge sort is **O(n log n)** in every case. No comparison sort can beat that in the worst case. Merge sort is also **stable**: equal items keep their original order.

## How TypeScript does it

The built-in is `array.sort(compare)`. It sorts **in place**, returns the same array, and has been stable since ES2019. V8 uses TimSort, a merge-sort hybrid that runs insertion sort on short runs. The comparator returns a negative number, zero or a positive number:

```ts
const ages = [40, 7, 100];
ages.sort((a, b) => a - b);          // [7, 40, 100]
const copy = [...ages].sort((a, b) => b - a);
```

Typing an input as `readonly number[]` documents that a function won't reorder it: `tsc` rejects calling `sort` or `push` on it, so you copy first with `[...items]`. Tuples make multi-value results precise: a return type of `[number[], number]` says "an array, then a count".

For binary search, a **half-open** interval `[lo, hi)` removes most off-by-one errors: start with `lo = 0`, `hi = a.length`, loop while `lo < hi`, and keep the invariant that the answer is always inside the interval.

```ts
const mid = (lo + hi) >>> 1;   // integer midpoint, no Math.floor needed
```

## What is special or tricky

- **The default sort compares strings.** `[10, 9, 1].sort()` gives `[1, 10, 9]`, because each number is converted to text. Always pass a comparator for numbers. `tsc` can't catch this: the call is perfectly well typed.
- **A boolean comparator is a bug.** `sort((a, b) => a > b)` fails to compile with "Type 'boolean' is not assignable to type 'number'". Casting it with `as any` compiles, and then sorts wrongly.
- **`sort` mutates.** Sorting a parameter reorders the caller's array. Copy first, or type the parameter `readonly`.
- **Binary search needs sorted input.** On unsorted data it returns nonsense without complaint, and no type tells you whether an array is sorted.
- **Recursion depth is not the problem here.** Merge sort recurses only log₂ n levels deep, about 17 for 100,000 items; the cost is the allocation, so reuse one buffer.

## What you will practise

You will sort a copy with insertion sort, merge two sorted arrays, and write a leftmost binary search with a half-open interval. The challenge sorts 100,000 numbers by hand and counts their inversions at the same time, in O(n log n).
'''

[[unit.step]]
kind = "concept"
id = "ts-u27-c1-divide-conquer"
title = "Divide, conquer, merge"
points = 5
difficulty = 33
intro = '''
Divide and conquer splits a problem into halves, solves each half recursively, and combines
the answers. For sorting, the combining step is a linear merge, and the halving gives only
log n levels, which is where O(n log n) comes from.
'''
body = '''
## Merge sort in three lines

1. If the array has 0 or 1 items, it is already sorted.
2. Sort the left half and the right half recursively.
3. **Merge** the two sorted halves into one.

## The merge

Two sorted arrays can be combined by repeatedly taking the smaller of their two front items:

```
left:  [2, 5, 8]      right: [1, 6]
take 1 (right), 2, 5 (left), 6 (right), 8 (left)  ->  [1, 2, 5, 6, 8]
```

Each step places one item, so merging n items costs O(n). Taking from the left on ties
(`<=`) keeps equal items in their original order, which makes the sort **stable**.

## Counting the cost

```
level 0:  [ 8 items ]                    8 items of merge work
level 1:  [ 4 ] [ 4 ]                    8
level 2:  [2] [2] [2] [2]                8
level 3:  [1][1][1][1][1][1][1][1]       base cases
```

Halving reaches size 1 after log₂ n levels, and every level merges n items in total, so the
whole sort is **O(n log n)**. Insertion sort, by contrast, may shift every earlier item for
every new one: O(n²). For 100,000 items that is about 1.7 million steps versus 5 billion.

## Binary search is divide and conquer too

Binary search splits in half and keeps only one half, so there is nothing to combine:
**O(log n)**. The price is that the input must already be sorted. In TypeScript, a
`readonly number[]` parameter is a good signal that a search will only read the array.
'''

[[unit.step]]
kind = "drill"
id = "ts-u27-d1-insertion-sort"
title = "Insertion sort"
points = 10
