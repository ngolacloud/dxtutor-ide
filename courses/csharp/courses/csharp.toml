[[unit.step]]
kind = "drill"
id = "cs-u13-d2-constraints"
title = "Constraints and default"
points = 10
difficulty = 13
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
A constraint trades generality for power: `where T : IComparable<T>` excludes types that cannot
be ordered but lets the body call `CompareTo`. `default` gives the zero value of any `T`, which
is `0` for numbers and `null` for references, and `T?` means different things for value and
reference types.
'''
prompt = '''
Find the largest element with an `IComparable<T>` constraint, create an object with `new()`,
and return a nullable value with a `struct` constraint.

**Why:** these are the three constraints you will meet most often, and the empty-array lines
show the subtle behaviour of `default`.
'''
target = '''
Console.WriteLine(Largest(new[] { 3, 9, 4 }));
Console.WriteLine(Largest(new[] { "pear", "apple", "fig" }));
Console.WriteLine(Largest(Array.Empty<int>()));
Console.WriteLine(Largest(Array.Empty<string>()) ?? "(none)");

var counter = Create<Counter>();
counter.Hits++;
Console.WriteLine($"hits={counter.Hits}");

Console.WriteLine(FirstOrNull(new List<int> { 5, 6 }));
Console.WriteLine(FirstOrNull(new List<int>()) is null);

static T? Largest<T>(T[] items) where T : IComparable<T>
{
    if (items.Length == 0) return default;
    T best = items[0];
    foreach (T item in items)
        if (item.CompareTo(best) > 0) best = item;
    return best;
}

static T Create<T>() where T : new() => new T();

static T? FirstOrNull<T>(List<T> items) where T : struct
    => items.Count > 0 ? items[0] : null;

class Counter
{
    public int Hits { get; set; }
}
'''
