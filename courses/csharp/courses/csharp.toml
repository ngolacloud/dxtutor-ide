id = "csharp-basics"
language = "csharp"
title = "C#: From Zero to Confident"
level = "beginner"
summary = "A serious, guided course in modern C# on .NET 8 that takes you from your very first program to the ideas behind professional .NET code: types and records, LINQ, pattern matching, async/await and safe concurrency. You read a short concept, build muscle memory by typing small, complete programs, then prove what you learned by writing real classes that hidden tests check."
overview = '''
## What C# and .NET are

C# is a general-purpose, statically typed language created at Microsoft and now developed in
the open. The compiler turns your source files into **IL** (Intermediate Language), and the
**.NET runtime** runs that IL, compiling it to fast machine code as the program runs. .NET is
free, open source and cross-platform: the same program runs on Linux, macOS and Windows. This
course teaches modern C# 12 on .NET 8.

## Where it is used

C# powers many enterprise backends and web APIs, usually built with ASP.NET Core, as well as
cloud services and Windows desktop applications. It is also the scripting language of the
Unity game engine, used for many mobile, desktop and console games.

## The mental model you will build

C# is **strongly typed**: the compiler knows the type of every value and rejects code that
mixes them up before it runs. Memory is **garbage-collected**, so you create objects freely
and the runtime reclaims them. You will learn the difference between **value types**, copied
on assignment, and **reference types**, shared through references, because it explains much of
how C# behaves. On top of that come **LINQ**, which queries any collection with `Where`,
`Select` and `GroupBy`, and **async/await**, which keeps programs responsive while they wait
for files, networks or timers.

## How the course is organised

- **Basic**: your first program, variables and number types, strings, decisions, loops and
  methods.
- **Intermediate**: collections, classes, interfaces, records and structs, exceptions,
  generics, lambdas and LINQ, then a **production C#** block: nullable reference types, dates
  and times, files and streams, regular expressions, equality and ordering, and immutability.
- **Advanced**: pattern matching, iterators, async/await, concurrency, cancellation and
  channels, spans, and data structures and algorithms built by hand: stacks, queues, linked
  lists, hash maps, binary search trees, sorting and searching, recursion and dynamic
  programming.

## How each unit works

Every unit opens with a short reading text. A **concept** step explains one idea. Three
**drill** steps have you type a small, complete program line by line, with a note on every
line, and run it to see what it prints. A **challenge** asks you to write real classes
yourself: hidden tests call your methods with ordinary and tricky inputs, and once they pass
you can compare your code with a reference solution and its complexity analysis.
'''

# ── g1-basic ────────────────────────────────────────────────────────────

[[unit]]
id = "cs-u01-hello"
title = "Hello, C#"
level = "basic"
difficulty = 1
intro = '''
Your very first steps in C#: what a program is, how the compiler and the .NET runtime work
together to run it, and how `Console.WriteLine` shows text on the screen. By the end you will
write a tiny class with a greeting method and let the hidden tests check it.
'''
concepts = '''
## The idea

A computer does not understand English; it follows instructions, one after another. A
**programming language** is a precise notation that people can read and that a tool can
turn into actions the machine carries out.

C# turns your text into actions in two stages. First the **compiler** reads your source file
(`Program.cs`), checks the whole file for mistakes and translates it into **IL**
(Intermediate Language), stored in a `.dll` file. Then the **.NET runtime** loads that IL
and, as the program runs, its just-in-time (JIT) compiler turns it into machine code for your
processor. The same `.dll` runs on Linux, macOS and Windows.

```text
dotnet new console -o Hello   # create a project folder with a Program.cs
cd Hello
dotnet run                    # compile, then run the result
```

`dotnet run` does both stages for you: it builds the project and, if the build succeeds,
runs it.

## How C# does it

Since C# 9 the simplest program is just a list of **top-level statements**: lines of code
written straight into `Program.cs`. The compiler wraps them in a hidden entry point, so they
run from the first line to the last, and then the program ends.

```csharp
// Program.cs
Console.WriteLine("Hello, C#!");
Console.Write("no line break");
Console.WriteLine(" ...continued");
```

`Console.WriteLine` writes its argument to **standard output** (the text the terminal shows)
and ends the line; `Console.Write` does the same without the line break. `Console` is a
**class** from the .NET library and `WriteLine` is one of its **methods**; the dot reaches
inside the class. Each statement ends with a semicolon. Text from `//` to the end of the line
is a **comment**, and `/* ... */` can span several lines.

## What is special or tricky

- **Every statement ends with `;`.** Forget one and the compiler reports
  `CS1002: ; expected`.
- **Case matters.** `console.WriteLine` fails with `CS0103: The name 'console' does not exist
  in the current context`, and `Console.Writeline` with `CS0117: 'Console' does not contain a
  definition for 'Writeline'`.
- **Quotes and brackets must close.** A string missing its closing quote gives
  `CS1010: Newline in constant`; a missing `}` gives `CS1513: } expected`.
- **Statements come before declarations.** A class written above your top-level statements
  gives `CS8803: Top-level statements must precede namespace and type declarations`.
- **Compile errors stop everything.** The compiler checks the whole file first, so a single
  error means nothing runs at all, not even the lines above it.

## What you will practise

You will type a first program with comments, mix `Write` and `WriteLine` with escape
sequences such as `\n` and `\"`, and print the results of small calculations, including
integer division. Then you will write your first class, with a method that builds a greeting
and returns it.
'''

[[unit.step]]
kind = "concept"
id = "cs-u01-c1-anatomy"
title = "The anatomy of a C# program"
points = 5
difficulty = 1
intro = '''
Before you write anything, picture what happens when you run a C# program. The compiler
checks the whole file and turns it into IL, then the .NET runtime executes the statements one
after another. Anything you print travels to **standard output**, which the terminal shows on
screen.
'''
body = '''
## A file of statements

```csharp
// Program.cs: the smallest useful C# program.
Console.WriteLine("Hello, C#!");
Console.WriteLine(2 + 3);
```

Read it line by line:

- **`// ...`** is a comment, a note for the people reading your code. The compiler throws it
  away.
- **`Console.WriteLine(...)`** is a **statement** that calls the method `WriteLine` of the
  class `Console`. It writes its argument to standard output and then ends the line. The
  semicolon closes the statement.
- **`"Hello, C#!"`** is a **string**, a piece of text between double quotes.
- **`2 + 3`** is an **expression**. C# works out its value, `5`, before `WriteLine` receives
  it.

These are **top-level statements**: there is no class or `Main` method around them. The
compiler generates that frame for you and runs the statements from top to bottom. You will
still meet classes very soon, because every type you write lives in one.

## What the tutor does

In each drill you type a small, complete program. When your code matches the target, the
tutor saves it as `Program.cs`, compiles it and runs it, the same thing `dotnet run` does in a
console project, so you see exactly what it prints. In each challenge you write a class with
methods instead, without any top-level statements, and hidden tests call those methods with
many inputs to check what they return.
'''

