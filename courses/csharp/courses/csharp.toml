intro = '''
Many list helpers take a **predicate**, a small function that answers yes or no for one
element, written as a lambda such as `n => n > 20` (unit 14 covers lambdas in depth). Each
helper is a linear scan, O(n). `BinarySearch` is the exception: on a **sorted** list it halves
the search range at every step, so it needs only O(log n) comparisons.
'''
prompt = '''
Filter a list with `FindAll`, test it with `Exists` and `TrueForAll`, delete with `RemoveAll`,
sort it both ways, binary-search it, map it with `ConvertAll`, and fill an array with
`Array.Fill`.

**Why:** these helpers replace hand-written loops for the most common list jobs, and binary
search shows why keeping data sorted pays off.
'''
target = '''
List<int> nums = [42, 7, 19, 7, 88, 3, 56];

List<int> big = nums.FindAll(n => n > 20);
Console.WriteLine("big: " + string.Join(" ", big));
Console.WriteLine($"any above 80: {nums.Exists(n => n > 80)}");
Console.WriteLine($"all positive: {nums.TrueForAll(n => n > 0)}");

int removed = nums.RemoveAll(n => n == 7);
Console.WriteLine($"removed {removed}: {string.Join(" ", nums)}");

nums.Sort();
Console.WriteLine("sorted: " + string.Join(" ", nums));
int at = nums.BinarySearch(56);
int miss = nums.BinarySearch(20);
Console.WriteLine($"56 at {at}, 20 would go at {~miss}");

nums.Sort((a, b) => b.CompareTo(a));
Console.WriteLine("descending: " + string.Join(" ", nums));

List<string> labels = nums.ConvertAll(n => $"#{n}");
Console.WriteLine(string.Join(",", labels));

int[] grid = new int[5];
Array.Fill(grid, -1);
Console.WriteLine(string.Join(" ", grid));
'''
