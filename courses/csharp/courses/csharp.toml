[[unit.step]]
kind = "challenge"
id = "cs-u27-x1-parse-ints"
title = "Parse integers without allocating"
points = 40
difficulty = 27
entry = "IntListParser"
intro = '''
Parsers sit on the hot path of servers, compilers and data tools, so the fastest ones never
create intermediate strings: they walk a span, slice out each token and convert it in place.
Writing into a buffer the caller provides moves the last allocation out of the parser
entirely.
'''
instructions = '''
## Your turn

Implement the static method `IntListParser.Parse`:

```csharp
public static int Parse(ReadOnlySpan<char> text, Span<int> destination)
```

`text` holds integers separated by commas, such as `"12, 7,-3"`. Parse each one, write them
in order into `destination`, and return **how many** you wrote.

Rules:

- Whitespace around each number is allowed and ignored: `" 12 ,  7 "` gives 12 and 7.
- A number may have a leading `-` or `+` sign. Use the invariant culture.
- Empty or whitespace-only `text` returns 0.
- An empty field (as in `"1,,2"`, `"1,"` or `","`) or a field that is not an integer
  (`"1,x"`, `"1 2"`) throws `FormatException`.
- More numbers than `destination.Length` throws `ArgumentException`.
- **Don't allocate.** No `Split`, `Substring`, `ToString`, `ToArray`, LINQ or lists: slice
  the span and parse each slice in place. A hidden test parses 20,000 numbers and checks with
  `GC.GetAllocatedBytesForCurrentThread()` that the call allocated (almost) nothing.

Examples:

- `Parse("12, 7,-3", buffer)` writes 12, 7, -3 and returns 3.
- `Parse("   ", buffer)` returns 0.
- `Parse("42", buffer)` writes 42 and returns 1.

**Hint:** trim the whole text first and return 0 if it is empty. Then loop: find the next comma
with `IndexOf`, take the slice before it (or the rest), `Trim()` it, and parse it with
`int.Parse(slice, NumberStyles.AllowLeadingSign, CultureInfo.InvariantCulture)`, which throws
`FormatException` for an empty slice. Continue with the slice after the comma.

Hidden tests decide correctness.
'''
starter = '''
using System.Globalization;

public static class IntListParser
{
    // Parse comma-separated integers from `text` into `destination` and return
    // how many were written. Slice the span; don't create strings or arrays.
    public static int Parse(ReadOnlySpan<char> text, Span<int> destination)
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
Test("parses a simple list", () =>
{
    Span<int> dest = stackalloc int[8];
    int n = IntListParser.Parse("12, 7,-3", dest);
    Equal(n, 3);
    Equal(dest[..n].ToArray(), new[] { 12, 7, -3 });
});
Test("ignores whitespace around numbers and accepts a plus sign", () =>
{
    var dest = new int[4];
    int n = IntListParser.Parse("  +5 ,\t-0,   99  ", dest);
    Equal(n, 3);
    Equal(dest[..3], new[] { 5, 0, 99 });
});
Test("empty and blank text give zero", () =>
{
    var dest = new int[2];
    Equal(IntListParser.Parse("", dest), 0);
    Equal(IntListParser.Parse("    ", dest), 0);
    Equal(IntListParser.Parse(" \t ", Span<int>.Empty), 0);
});
Test("one number, duplicates and the int range", () =>
{
    var dest = new int[5];
    Equal(IntListParser.Parse("42", dest), 1);
    Equal(dest[0], 42);
    Equal(IntListParser.Parse("7,7,7", dest), 3);
    Equal(dest[..3], new[] { 7, 7, 7 });
    Equal(IntListParser.Parse("-2147483648,2147483647", dest), 2);
    Equal(dest[..2], new[] { int.MinValue, int.MaxValue });
});
Test("an exactly sized destination is enough", () =>
{
    var dest = new int[3];
    Equal(IntListParser.Parse("1,2,3", dest), 3);
    Equal(dest, new[] { 1, 2, 3 });
});
Test("parses into part of a larger buffer", () =>
{
    var buffer = new int[] { -1, -1, -1, -1, -1 };
    Equal(IntListParser.Parse("8, 9", buffer.AsSpan(2)), 2);
    Equal(buffer, new[] { -1, -1, 8, 9, -1 });
});
Test("empty fields are format errors", () =>
{
    var dest = new int[8];
    Throws<FormatException>(() => IntListParser.Parse("1,,2", dest));
    Throws<FormatException>(() => IntListParser.Parse("1,", dest));
    Throws<FormatException>(() => IntListParser.Parse(",", dest));
    Throws<FormatException>(() => IntListParser.Parse(" , 3", dest));
});
Test("non-numbers are format errors", () =>
{
    var dest = new int[8];
    Throws<FormatException>(() => IntListParser.Parse("1,x", dest));
    Throws<FormatException>(() => IntListParser.Parse("1 2", dest));
    Throws<FormatException>(() => IntListParser.Parse("3.5", dest));
});
Test("too many numbers for the destination", () =>
{
    var dest = new int[2];
    Throws<ArgumentException>(() => IntListParser.Parse("1,2,3", dest));
    Throws<ArgumentException>(() => IntListParser.Parse("1", Span<int>.Empty));
});
Test("parses 20,000 numbers without allocating", () =>
{
    var text = string.Join(", ", Enumerable.Range(-10000, 20000));
    var dest = new int[20000];
    IntListParser.Parse(text, dest);
    Array.Clear(dest);
    long before = GC.GetAllocatedBytesForCurrentThread();
    int n = IntListParser.Parse(text, dest);
    long allocated = GC.GetAllocatedBytesForCurrentThread() - before;
    Equal(n, 20000);
    Equal(dest[0], -10000);
    Equal(dest[12345], 2345);
    Equal(dest[19999], 9999);
    Check(allocated < 1024, $"parsing allocated {allocated} bytes; slice the span instead of creating strings");
});
'''

[unit.step.gabarito]
solution = '''
using System.Globalization;

public static class IntListParser
{
    public static int Parse(ReadOnlySpan<char> text, Span<int> destination)
    {
        text = text.Trim();
        if (text.IsEmpty)
        {
            return 0;
        }

        int count = 0;
        while (true)
        {
            int comma = text.IndexOf(',');
            ReadOnlySpan<char> field = (comma < 0 ? text : text[..comma]).Trim();
            if (count == destination.Length)
            {
                throw new ArgumentException("destination is too small", nameof(destination));
            }
            destination[count++] = int.Parse(field, NumberStyles.AllowLeadingSign, CultureInfo.InvariantCulture);
            if (comma < 0)
            {
                return count;
            }
            text = text[(comma + 1)..];
        }
    }
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
Let `n` be the length of `text`. Each character is looked at a constant number of times: once
by `IndexOf` while searching for the next comma, at most once by `Trim`, and once by
`int.Parse`. Slicing a span only adjusts an offset and a length, so moving past each comma is
O(1). The total time is therefore **O(n)**.

The extra space is **O(1)**: the method keeps a few integers and spans (each a reference and a
length) whatever the input size, and it writes into the caller's `destination` instead of
allocating a result. That is why the allocation counter stays at zero. A `Split`-based
version has the same O(n) time, but it allocates an array plus one string per number, about
O(n) bytes of garbage per call, which is what the 20,000-number test detects.

Trimming the whole text first is what makes blank input return 0, while still letting an
empty field in the middle reach `int.Parse`, which reports it as a `FormatException`.
'''

[[unit]]
id = "cs-u28-sorted-collections"
title = "Sorted collections, priority queues and LinkedList"
level = "advanced"
difficulty = 28
intro = '''
`Dictionary` and `HashSet` are fast because they ignore order, but many problems are all about
order: the smallest key, everything in a range, the most urgent job, the least recently used
entry. You will use `SortedDictionary` and `SortedSet`, find the top k values with a
`PriorityQueue`, move nodes around a `LinkedList<T>`, and finish by building an LRU cache with
O(1) operations.
'''
concepts = '''
## The idea

A hash table answers "is this key here?" in O(1), but it keeps its keys in no useful order.
Asking it for the smallest key, or for every key between 60 and 89, means scanning everything.
**Ordered** structures pay O(log n) per insertion to keep their elements sorted, and in return
answer order questions cheaply. A **heap** is a cheaper compromise: it only guarantees that the
smallest element is on top, which is all a scheduler or a top-k search needs. And a **linked
list** gives O(1) insertion and removal anywhere you already hold a node.

## How C# does it

- `SortedDictionary<TKey, TValue>` is a balanced binary search tree (a red-black tree). Lookup,
  insertion and removal are O(log n), and enumeration yields the keys in sorted order.
- `SortedList<TKey, TValue>` keeps two sorted arrays. It uses less memory and allows access by
  index, but inserting in the middle shifts elements, which is O(n).
- `SortedSet<T>` is a sorted set of unique values with `Min`, `Max` and `GetViewBetween(lo, hi)`.
- `PriorityQueue<TElement, TPriority>` is a binary **min-heap**: `Enqueue` and `Dequeue` are
  O(log n), and `Peek` is O(1). Each element carries a separate priority.
- `LinkedList<T>` is doubly linked. `AddFirst`, `AddLast`, `AddAfter` and `Remove(node)` are
  O(1) given a `LinkedListNode<T>`, but `Find(value)` walks the list in O(n).

```csharp
var queue = new PriorityQueue<string, int>();
queue.Enqueue("low", 9);
queue.Enqueue("urgent", 1);
Console.WriteLine(queue.Dequeue());   // urgent: the smallest priority wins
```

For a max-heap, pass a reversed comparer:
`new PriorityQueue<string, int>(Comparer<int>.Create((a, b) => b.CompareTo(a)))`.

## Pitfalls

- **Sorted sets treat "compares equal" as "duplicate".** A `SortedSet<Person>` ordered by age
  silently drops the second person of the same age: `Add` returns `false`. Break ties in the
  comparer.
- **A `PriorityQueue` is not sorted.** Enumerating `UnorderedItems` gives heap order. Only
  repeated `Dequeue` yields sorted output. Equal priorities come out in no guaranteed order,
  and there is no way to change an element's priority or test membership.
- `Dequeue` and `Peek` on an empty queue throw `InvalidOperationException`; prefer
  `TryDequeue` and `TryPeek`.
- `PriorityQueue` needs two type arguments. `new PriorityQueue<int>()` fails with error
  **CS0305**: "Using the generic type 'PriorityQueue<TElement, TPriority>' requires 2 type
  arguments".
- `LinkedList<T>.Remove(value)` searches first, so it is O(n). Keep the node and call
  `Remove(node)` for O(1).
- Changing a collection while a `foreach` walks it throws `InvalidOperationException`
  ("Collection was modified").

## Combining structures

Real systems often pair two structures so each operation is cheap in one of them. An **LRU
cache** keeps a dictionary from key to linked-list node for O(1) lookup, and a linked list in
recency order for O(1) "move to front" and "evict the oldest":

```csharp
var order = new LinkedList<string>();
LinkedListNode<string> node = order.AddFirst("a");
order.Remove(node);           // O(1): no search
order.AddFirst(node);         // the same node, now at the front
```

## What you will practise

You will keep stock in key order and query a range of scores, find the three largest readings
with a size-k heap, rearrange a playlist by moving nodes, and then build a generic LRU cache.
'''

[[unit.step]]
kind = "concept"
id = "cs-u28-c1-trees-heaps"
title = "Trees, heaps and node handles"
points = 5
difficulty = 28
intro = '''
Each structure in this unit keeps a different invariant. A search tree keeps every element in
order, a heap keeps only the smallest element on top, and a linked list keeps neighbours
connected, and each invariant decides which operations are cheap.
'''
body = '''
## A search tree keeps everything in order

`SortedDictionary` and `SortedSet` are red-black trees: binary search trees that rebalance
themselves so their height stays about log₂ n. Every insert walks one path from the root,
so it costs O(log n), and an in-order walk visits the elements in sorted order. Range queries
such as `set.GetViewBetween(10, 20)` follow the tree instead of scanning.

## A heap keeps only the minimum on top

A binary heap is an array where each element is no larger than its two children. That weaker
invariant is cheaper to maintain: `Enqueue` adds at the end and swaps upward, and `Dequeue`
moves the last element to the top and swaps downward, both O(log n). The minimum is always at
index 0, so `Peek` is O(1).

To keep the **k largest** of a long stream, keep a min-heap of size k. Its top is the smallest
of the current top k, so a new value only enters when it beats the top:

```csharp
if (heap.Count < k) heap.Enqueue(v, v);
else if (v > heap.Peek()) heap.DequeueEnqueue(v, v);
```

This costs O(n log k) time and O(k) memory, instead of sorting all n values.

## A linked list keeps node handles

`LinkedList<T>` returns a `LinkedListNode<T>` from every `Add` call. As long as you hold that
node, removing it or inserting next to it is O(1), because only neighbouring links change.
Combined with a dictionary that maps keys to nodes, it gives O(1) reordering.
'''

