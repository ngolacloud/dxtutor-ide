[unit.step.gabarito]
solution = '''
using System.Globalization;

public interface IPriceRule
{
    string Name { get; }
    decimal Apply(decimal price);
}

public abstract class Discount : IPriceRule
{
    protected Discount(string name) => Name = name;

    public string Name { get; }

    public decimal Apply(decimal price)
    {
        ArgumentOutOfRangeException.ThrowIfNegative(price);
        decimal result = Math.Max(0m, Compute(price));
        return Math.Round(result, 2, MidpointRounding.AwayFromZero);
    }

    protected abstract decimal Compute(decimal price);

    public override string ToString() => Name;
}

public sealed class PercentOff : Discount
{
    public PercentOff(decimal percent)
        : base(percent.ToString(CultureInfo.InvariantCulture) + "% off")
    {
        ArgumentOutOfRangeException.ThrowIfNegative(percent);
        ArgumentOutOfRangeException.ThrowIfGreaterThan(percent, 100m);
        Percent = percent;
    }

    public decimal Percent { get; }

    protected override decimal Compute(decimal price) => price * (100m - Percent) / 100m;
}

public sealed class AmountOff : Discount
{
    public AmountOff(decimal amount)
        : base(amount.ToString(CultureInfo.InvariantCulture) + " off")
    {
        ArgumentOutOfRangeException.ThrowIfNegative(amount);
        Amount = amount;
    }

    public decimal Amount { get; }

    protected override decimal Compute(decimal price) => price - Amount;
}

public sealed class RuleChain : IPriceRule
{
    private readonly IPriceRule[] _rules;

    public RuleChain(params IPriceRule[] rules)
    {
        _rules = (IPriceRule[])rules.Clone();
        Name = _rules.Length == 0 ? "no rules" : string.Join(" then ", _rules.Select(r => r.Name));
    }

    public string Name { get; }

    public decimal Apply(decimal price)
    {
        ArgumentOutOfRangeException.ThrowIfNegative(price);
        foreach (IPriceRule rule in _rules)
        {
            price = rule.Apply(price);
        }
        return price;
    }

    public override string ToString() => Name;
}
'''
time = "O(r) per Apply"
space = "O(r)"
justification = '''
`PercentOff` and `AmountOff` do a constant amount of arithmetic, so their `Apply` is **O(1)**.
A `RuleChain` of `r` rules calls each rule's `Apply` once, so its `Apply` is **O(r)**, where
`r` counts every rule in the tree when chains are nested: each rule object is visited once.
The chain stores a copy of its rules array and its name (computed once in the constructor,
O(r) to build), so its space is **O(r)**. Computing the name on every read would cost O(r)
each time for no benefit, since the rules never change.

The design is what keeps every class small. `Discount.Apply` is a **template method**: it
owns the validation, the clamp at zero and the rounding, and calls the abstract `Compute`
through dynamic dispatch, so a new kind of discount is one override. `RuleChain` implements
`IPriceRule` instead of deriving from `Discount` because it composes other rules rather than
computing a price itself; since it depends only on the interface, it accepts discounts, other
chains, or any future rule. Copying the `params` array protects the chain from a caller who
keeps a reference to that array and edits it later. `decimal` with
`MidpointRounding.AwayFromZero` gives the cent rounding people expect from receipts; the
default, `ToEven`, would turn 0.025 into 0.02.
'''

[[unit]]
id = "cs-u11-records-structs"
title = "Records, structs and value semantics"
level = "intermediate"
difficulty = 11
intro = '''
Some objects have an identity, like a bank account that changes over time, while others are
just values, like a point, a date or an amount of money. This unit shows how C# models values:
**records** that compare by content and copy with `with`, and **structs**, which are copied
whenever they are assigned. The challenge builds a `Money` value type that splits an amount
into parts without losing a cent.
'''
concepts = '''
## The idea

C# has two families of types. A **reference type** (every `class`) lives on the heap, and a
variable holds a reference to it: assignment copies the reference, so two variables can share
one object. A **value type** (every `struct`, including `int`, `double`, `decimal`, `bool` and
`DateTime`) holds its data directly: assignment, passing an argument and returning a result
all copy the whole value.

Separately, a type can have **reference equality** (two variables are equal when they point
to the same object, the default for classes) or **value equality** (equal when their contents
match). Values such as coordinates or prices want value equality, and they are much easier to
reason about when they are **immutable**.

## How C# does it

A **record** is a type for data. From one line the compiler generates a constructor,
`init`-only properties, value-based `Equals`, `GetHashCode`, `==` and `!=`, a readable
`ToString` and a `Deconstruct` method:

```csharp
public record Point(int X, int Y);              // a class with value equality

var p = new Point(1, 2);
var q = p with { Y = 5 };                       // a copy with one property changed
Console.WriteLine(p == new Point(1, 2));        // True
Console.WriteLine(q);                           // Point { X = 1, Y = 5 }
```

The `with` expression is **non-destructive mutation**: it copies the record and changes only
the listed properties, leaving the original untouched. `record` alone means `record class`.
`record struct` and `readonly record struct` give the same conveniences to a value type.

A plain `struct` is a value type with field-by-field copying. Mark it `readonly struct` to
make every field immutable. Structs suit small values (a rule of thumb is 16 bytes or less)
that are created in large numbers, because they avoid a heap allocation each. Large structs
are slow to copy, and a struct stored as `object` or an interface is **boxed**, copied into a
heap object.

## Pitfalls and compiler errors

- **CS8852**: assigning a positional record property after creation; its setter is `init`.
- **CS1612**: `list[0].X = 5` on a `List<SomeStruct>`. The indexer returns a **copy**, so
  changing it would be lost; copy it out, change it, and store it back.
- `with` is **shallow**: a record holding a `List<T>` shares that list with its copy, and
  record equality compares the list by reference, not by contents.
- A method that receives a struct gets a copy, so changes inside it don't reach the caller
  (unless the parameter is `ref`).
- `default(SomeStruct)` has every field zeroed, and `string` fields are `null`.
- Records with **mutable** properties used as dictionary keys break hashing when they change.

## What you will practise

You will see what the compiler generates for a record, watch structs copy while classes share,
and combine `readonly record struct` with `with`, including the shallow-copy trap. The
challenge asks for a validated `Money` value type with operators and exact allocation.
'''

[[unit.step]]
kind = "concept"
id = "cs-u11-c1-values"
title = "Values versus identities"
points = 5
difficulty = 11
intro = '''
Whether a type behaves like a value or like an entity with an identity decides how it should
be copied and compared. Choosing between `class`, `record` and `struct` is about matching the
language's copy and equality rules to that meaning.
'''
body = '''
## Two questions

Ask two questions about every type you design:

1. **Does it have an identity?** Two bank accounts holding the same balance are still two
   accounts. Two `(3, 4)` points are the same point. Entities have identity; values do not.
2. **Should copies be independent?** Changing one copy of a value must never change another.

| Kind | Copy on assignment | Default equality | Typical use |
|---|---|---|---|
| `class` | the reference | same object | entities: accounts, services |
| `record` | the reference | same contents | immutable data, messages, DTOs |
| `struct` | the whole value | same contents (slow default) | tiny values: points, ranges |
| `record struct` | the whole value | same contents (generated) | small values with nice equality |

## Immutability makes sharing safe

A record class is still a reference type, so two variables can point to one record. That is
harmless when the record is immutable, because nobody can change it under you. To "modify"
it, you create a new one:

```csharp
var order = new Order("A-1", 3);
var bigger = order with { Quantity = 4 };   // order still has 3
```

## Why value semantics help

Value types make code easier to reason about. A method that receives a `DateTime` cannot
change your copy, and `==` on two records answers the question you actually meant. A plain
`struct` also gets `Equals` for free, but the default one uses reflection and is slow, which
is one reason to prefer `record struct`. Use a class when an object's identity matters or it
has a lifetime of its own.
'''

