  "Removes the folder and everything in it.",
  "",
  "Prints `False`: nothing is left behind.",
]
explanation = '''
`Path.GetTempPath()` plus a GUID gives a folder name no other program will use, and
`Directory.CreateDirectory` makes it. `WriteAllLines` creates the file with two lines,
`AppendAllText` adds a third, and `ReadAllLines` returns all three, so the program prints
`3 lines, last: ship it`. After `File.Copy` the folder holds two files; `GetFiles` returns full
paths in no particular order, so they are sorted ordinally and printed by name (`todo.bak`,
`todo.txt`), which keeps the output identical on every machine. The `finally` block deletes the
