[unit.step.gabarito]
solution = '''
using System.Globalization;

public class ConfigException(int line, string reason, Exception? inner = null)
    : Exception($"line {line}: {reason}", inner)
{
    public int Line { get; } = line;

    public string Reason { get; } = reason;
}

public static class ConfigParser
{
    public static Dictionary<string, int> Parse(string text)
    {
        ArgumentNullException.ThrowIfNull(text);
        var result = new Dictionary<string, int>();
        string[] lines = text.Split('\n');
        for (int i = 0; i < lines.Length; i++)
        {
            int lineNo = i + 1;
            string line = lines[i].Trim();
            if (line.Length == 0 || line.StartsWith('#'))
                continue;

            int eq = line.IndexOf('=');
            if (eq < 0)
                throw new ConfigException(lineNo, "expected key = value");
            string key = line[..eq].Trim();
            string raw = line[(eq + 1)..].Trim();
            if (key.Length == 0)
                throw new ConfigException(lineNo, "missing key");
            if (result.ContainsKey(key))
                throw new ConfigException(lineNo, $"duplicate key '{key}'");

            try
            {
                result[key] = int.Parse(raw, NumberStyles.AllowLeadingSign, CultureInfo.InvariantCulture);
            }
            catch (FormatException e)
            {
                throw new ConfigException(lineNo, $"'{raw}' is not a whole number", e);
            }
            catch (OverflowException e)
            {
                throw new ConfigException(lineNo, $"'{raw}' is out of range", e);
            }
        }
        return result;
    }

    public static bool TryParse(string text, out Dictionary<string, int> result, out string? error)
    {
        try
        {
            result = Parse(text);
            error = null;
            return true;
        }
        catch (ConfigException e)
        {
            result = new Dictionary<string, int>();
            error = e.Message;
            return false;
        }
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the length of the text. `Split` walks it once and copies every character into the
line strings; trimming, finding the `=`, slicing the key and the value and parsing the number
each touch a line's characters a constant number of times; and each dictionary lookup and
insert is **O(1)** on average (plus hashing the key, which is proportional to its length). Summed
over all lines, the work is **O(n)**. The line array, the substrings and the dictionary together
hold at most a constant multiple of the input, so the space is **O(n)** too.

The design points matter more than the speed. The parser validates in a fixed order and throws
before it stores anything for a bad line, so a `ConfigException` always names the first
problem. The `try` surrounds only `int.Parse`, so the two `catch` clauses can never mistake
another failure for a bad number, and passing `e` as `inner` keeps the original stack trace for
debugging. `TryParse` reuses `Parse` and catches **only** `ConfigException`: an
`ArgumentNullException` is a programming bug, not bad content, so it still escapes.
'''

[[unit]]
id = "cs-u13-generics"
title = "Generics"
level = "intermediate"
difficulty = 13
intro = '''
`List<int>` and `Dictionary<string, int>` have been with you since unit 7; now you learn to
write such types yourself. Generics let one class or method work with any type while the
compiler still checks every use, and constraints say what a type must be able to do. You finish
by building a generic stack that reports its minimum and maximum in constant time, for numbers,
strings and dates alike.
'''
concepts = '''
## The idea

Suppose you write a stack of `int`. Next week you need a stack of `string`, then one of
`Order`. Copying the class three times multiplies the bugs; storing everything as `object`
loses type safety, forces a cast on every read and **boxes** each `int` into a heap object.
**Generics** solve both problems. You write the code once with a **type parameter**, a
placeholder such as `T`, and every use supplies a **type argument**: `Stack<int>`,
`Stack<string>`. The compiler checks each use separately, so pushing a `string` onto a
`Stack<int>` is a compile error, not a crash at run time.

## How C# does it

Type parameters go in angle brackets after the name of a class, record, interface or method:

```csharp
class Box<T>
{
    public T Value { get; set; }
    public Box(T value) => Value = value;
}

static T FirstOr<T>(List<T> items, T fallback) => items.Count > 0 ? items[0] : fallback;

var b = new Box<string>("hi");
int n = FirstOr(new List<int>(), -1);   // T inferred as int
```

For methods the compiler usually **infers** the type arguments from the arguments. C# generics
are **reified**: unlike Java, the runtime knows the real type, so `typeof(T)` works and a
`List<int>` stores plain `int`s with no boxing.

Inside a generic body you may only do what is valid for *every* possible `T`. A **constraint**
widens that by narrowing which types are allowed:

- `where T : IComparable<T>`: values can be compared with `CompareTo`.
- `where T : class` or `where T : struct`: reference or value types only.
- `where T : new()`: has a parameterless constructor, so `new T()` compiles.
- `where T : notnull`, `where T : SomeBaseClass`, or several at once: `where T : class, IEntity`.

`default(T)`, or just `default`, is `null` for reference types and zero for numbers.

## Pitfalls and compiler errors

- **CS0019**, *Operator '<' cannot be applied to operands of type 'T' and 'T'*: an
  unconstrained `T` has no operators. Add `where T : IComparable<T>` and use `CompareTo`.
- **CS0304**: `new T()` needs the `new()` constraint.
- **CS0403**, *Cannot convert null to type parameter 'T'*: return `default` instead.
- **CS0314**: a generic method calls another one whose constraint its own `T` does not
  promise. Repeat the constraint.
- **CS0411**, *The type arguments cannot be inferred*: write them explicitly, `Create<int>()`.
- Generics are **invariant**: a `List<string>` is not a `List<object>` (**CS0029**), because
  the latter would let you add a number to a list of strings.

## What you will practise

You will write a generic record and generic methods and let the compiler infer their types,
use constraints to compare and create values, and build a repository constrained to an
interface. The challenge asks for a generic stack that answers `Min` and `Max` in O(1) and must
work, unchanged, for `int`, `string`, `decimal` and `DateOnly`.
'''

[[unit.step]]
kind = "concept"
id = "cs-u13-c1-type-parameters"
title = "Type parameters and constraints"
points = 5
difficulty = 13
intro = '''
A generic type is a template the compiler fills in: `List<T>` becomes `List<int>` or
`List<string>` at each use. Constraints are the contract between the generic code and its
callers: they list what any `T` must support.
'''
body = '''
## One definition, many types

```csharp
record Pair<TFirst, TSecond>(TFirst First, TSecond Second);

var p = new Pair<string, int>("age", 42);
string label = p.First;     // no cast: the compiler knows it is a string
```

By convention a single type parameter is called `T`; several get descriptive names that start
with `T`, such as `TKey` and `TValue`. The type arguments are part of the type:
`Pair<string, int>` and `Pair<int, string>` are different types.

## Constraints unlock operations

Inside this method the compiler only knows that `T` is *some* type:

```csharp
static T Larger<T>(T a, T b) => a.CompareTo(b) >= 0 ? a : b;   // error CS1061
```

An arbitrary type has no `CompareTo`. A constraint promises one, and the caller must keep the
promise:

```csharp
static T Larger<T>(T a, T b) where T : IComparable<T>
    => a.CompareTo(b) >= 0 ? a : b;

Larger(3, 8);            // int implements IComparable<int>
Larger("fig", "apple");  // so does string
```

`CompareTo` returns a negative number, zero or a positive number when `a` is less than, equal
to or greater than `b`. Calling `Larger` with a type that is not comparable is now a compile
error at the call site.

## Why not just use object?

With `object` you would write `(int)stack.Pop()` on every read, a wrong cast would crash at run
time, and every `int` would be boxed into a separate heap object. Generic code is checked at
compile time and, because .NET generates specialised code for value types, a `List<int>` is as
compact as an `int[]`.
'''

