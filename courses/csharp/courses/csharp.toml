[[unit.step]]
kind = "challenge"
id = "cs-u10-x1-pricing-rules"
title = "A polymorphic pricing engine"
points = 30
difficulty = 10
entry = "Discount"
intro = '''
The **composite** pattern treats a group of objects exactly like a single one: a chain of
price rules is itself a price rule, so chains can contain chains. Combined with an abstract
base class that owns the shared validation and rounding, every concrete rule shrinks to the
one line that makes it different, and the caller never needs to know which rule it holds.
'''
instructions = '''
## Your turn

The interface `IPriceRule` is provided; don't change it:

```csharp
public interface IPriceRule
{
    string Name { get; }
    decimal Apply(decimal price);
}
```

Implement these types:

```csharp
public abstract class Discount : IPriceRule
    protected Discount(string name)
    public string Name { get; }
    public decimal Apply(decimal price)            // the template method
    protected abstract decimal Compute(decimal price);
    public override string ToString()              // returns Name

public sealed class PercentOff : Discount
    public PercentOff(decimal percent)
    public decimal Percent { get; }

public sealed class AmountOff : Discount
    public AmountOff(decimal amount)
    public decimal Amount { get; }

public sealed class RuleChain : IPriceRule
    public RuleChain(params IPriceRule[] rules)
```

Rules:

- `Discount.Apply` throws `ArgumentOutOfRangeException` for a negative price. Otherwise it
  calls `Compute`, raises a negative result to 0, and rounds to 2 decimal places with
  `MidpointRounding.AwayFromZero` (so 0.025 becomes 0.03).
- `PercentOff` takes `percent` between 0 and 100 inclusive (otherwise
  `ArgumentOutOfRangeException`) and computes `price × (100 − percent) / 100`. Its name is
  the percent followed by `% off`, such as `"10% off"` or `"12.5% off"`.
- `AmountOff` takes a non-negative `amount` (otherwise `ArgumentOutOfRangeException`) and
  computes `price − amount`. Its name is the amount followed by ` off`, such as `"2.5 off"`.
- Format numbers in names with `CultureInfo.InvariantCulture`, so the decimal separator is
  always a dot.
- `RuleChain` applies its rules **in order**, each one to the result of the previous one. An
  empty chain returns the price unchanged. It throws `ArgumentOutOfRangeException` for a
  negative price. Its name joins the rule names with `" then "`, or is `"no rules"` when
  empty, and `ToString()` returns it. The chain keeps its own copy of the rules array.

Example:

```csharp
var chain = new RuleChain(new PercentOff(10), new AmountOff(5));
chain.Name;          // "10% off then 5 off"
chain.Apply(100m);   // 85.00 (100 → 90 → 85)
```

**Hint:** put all the shared logic in `Discount.Apply`, so `Compute` stays a one-liner in each
subclass. `using System.Globalization;` gives you `CultureInfo`.

Hidden tests decide correctness.
'''
