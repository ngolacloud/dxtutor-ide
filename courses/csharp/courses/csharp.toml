    Equal((s.Min, s.Max), (int.MinValue, int.MaxValue));
    s.Pop();
    Equal(s.Min, -5);
});
Test("pops in last-in, first-out order", () =>
{
    var s = MinMaxStack.Of(1, 2, 3);
    var popped = new List<int> { s.Pop(), s.Pop(), s.Pop() };
    Equal(popped, new List<int> { 3, 2, 1 });
    Equal(s.Count, 0);
});
Test("an empty stack throws InvalidOperationException", () =>
