[[unit.step]]
kind = "challenge"
id = "cs-u11-x1-money"
title = "A Money value type that never loses a cent"
points = 30
difficulty = 11
entry = "Money"
intro = '''
Money is the textbook value type: 10 euros is 10 euros wherever it came from, and adding
euros to dollars is a bug, not a number. Splitting an amount fairly is a small but real
algorithm: dividing 10.00 by 3 must give parts that add back to exactly 10.00, so the leftover
cents (the remainder of an integer division) are handed out one at a time.
'''
instructions = '''
## Your turn

Implement `Money` as a `readonly record struct`:

```csharp
public readonly record struct Money
    public Money(decimal amount, string currency)
    public decimal Amount { get; init; }
    public string Currency { get; init; }
    public static Money Zero(string currency)
    public static Money operator +(Money a, Money b)
    public static Money operator -(Money a, Money b)
    public Money[] Allocate(int parts)
    public override string ToString()
```

Rules:

- `Amount` is always rounded to 2 decimal places with `MidpointRounding.AwayFromZero`
  (`1.005` becomes `1.01`, `-1.005` becomes `-1.01`). Negative amounts are allowed.
- `Currency` must be exactly 3 ASCII letters, otherwise throw `ArgumentException`. It is
  stored in upper case: `"eur"` becomes `"EUR"`.
- Both rules must also hold for `with` expressions, such as `m with { Amount = 1.239m }`, so
  put them in the `init` accessors, not only in the constructor.
- Two `Money` values are equal when their amount and currency are equal (records give you
  this).
- `Zero("usd")` is `0.00 USD`.
- `+` and `-` throw `InvalidOperationException` when the currencies differ.
- `Allocate(parts)` throws `ArgumentOutOfRangeException` if `parts` is less than 1. Otherwise
  it returns `parts` values in the same currency whose amounts **add up exactly** to
  `Amount` and differ from each other by at most 0.01. The larger parts (in absolute value)
  come first.
- `ToString()` returns the amount with exactly two decimals and a dot, then a space and the
  currency: `"12.50 EUR"`, `"-3.00 USD"`. Use `CultureInfo.InvariantCulture`.

Examples:

```csharp
new Money(10m, "eur").Allocate(3);   // [3.34 EUR, 3.33 EUR, 3.33 EUR]
new Money(-0.05m, "EUR").Allocate(2); // [-0.03 EUR, -0.02 EUR]
new Money(1.5m, "EUR") == new Money(1.50m, "eur");   // true
```

**Hint:** allocate in whole cents. With `long cents = (long)(Amount * 100)`, each part gets
`cents / parts`, and the first `|cents % parts|` parts get one more cent with the sign of the
amount.

Hidden tests decide correctness.
'''
