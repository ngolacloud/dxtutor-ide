[unit.step.gabarito]
solution = '''
using System.Threading.Channels;

public static class WorkerPool
{
    public static async Task<List<TOut>> RunAsync<TIn, TOut>(
        IReadOnlyList<TIn> items,
        Func<TIn, CancellationToken, Task<TOut>> work,
        int workers,
        int capacity,
        CancellationToken cancellationToken = default)
    {
        ArgumentOutOfRangeException.ThrowIfLessThan(workers, 1);
        ArgumentOutOfRangeException.ThrowIfLessThan(capacity, 1);
        cancellationToken.ThrowIfCancellationRequested();

        using var linked = CancellationTokenSource.CreateLinkedTokenSource(cancellationToken);
        CancellationToken token = linked.Token;
        var channel = Channel.CreateBounded<int>(capacity);
        var results = new TOut[items.Count];

        async Task ProduceAsync()
        {
            try
            {
                for (int i = 0; i < items.Count; i++)
                {
                    await channel.Writer.WriteAsync(i, token);
                }
            }
            finally
            {
                channel.Writer.TryComplete();
            }
        }

        async Task ConsumeAsync()
        {
            try
            {
                await foreach (int i in channel.Reader.ReadAllAsync(token))
                {
                    results[i] = await work(items[i], token);
                }
            }
            catch
            {
                linked.Cancel();
                throw;
            }
        }

        var tasks = new List<Task> { ProduceAsync() };
        for (int w = 0; w < workers; w++)
        {
            tasks.Add(ConsumeAsync());
        }
        await Task.WhenAll(tasks);
        return results.ToList();
    }
}
'''
time = "O(n + w)"
space = "O(n + w + c)"
justification = '''
With `n` items, `w` workers and capacity `c`, every index passes through the channel exactly
once and each channel operation is O(1) amortized, so the pool's own bookkeeping is **O(n)**,
plus **O(w)** to start the consumers and wait for them. The cost of `work` itself comes on
top, but wall-clock time is roughly `n / w` rounds of it, because `w` calls run at once and a
consumer takes the next index as soon as it is free.

Space is **O(n)** for the results array and the final list, **O(w)** for the consumer tasks,
and **O(c)** for the channel's buffer. Writing indexes instead of items, and storing each
result at `results[i]`, keeps the input order no matter which consumer finishes first, and no
lock is needed because every slot is written by exactly one consumer.

Correctness lives in the shutdown protocol. The producer completes the writer in `finally`, so
the readers' loops always end. The linked source is the single stop signal: the caller's
cancellation flows into it, and a consumer that fails cancels it, which wakes a producer
blocked on a full channel and stops the other consumers. Cancelled tasks end in the Canceled
state, so `Task.WhenAll` faults with the real exception when there is one and is cancelled
otherwise.
'''

[[unit]]
id = "cs-u27-spans-performance"
title = "Spans and allocation-free code"
level = "advanced"
difficulty = 27
intro = '''
Much of the time a .NET program spends on text goes into allocating short-lived strings and
arrays that the garbage collector must clean up later. You will use `Span<T>` and
`ReadOnlySpan<T>` to slice text and arrays without copying, format into `stackalloc` buffers,
measure allocations, and finish by writing a parser that turns a line of numbers into integers
without allocating anything.
'''
concepts = '''
## The idea

`"a,b,c".Split(',')` looks free, but it allocates an array and three new strings, and
`Substring` copies characters into a fresh string every time. In a hot loop, a web server or a
log parser, those allocations add up: the garbage collector has to find and reclaim them, and
collections pause the program. The data was already in memory. What we wanted was a **view**
of part of it.

A **span** is exactly that: a reference to the start of a contiguous block of memory plus a
length. Slicing a span makes a new view of a sub-range in O(1), copies nothing and allocates
nothing. The memory can be an array, a string, a buffer on the stack, or native memory, and
the same code works over all of them.

## How C# does it

`Span<T>` is a writable view and `ReadOnlySpan<T>` a read-only one. Arrays convert to both,
and strings convert to `ReadOnlySpan<char>`:

```csharp
ReadOnlySpan<char> text = "key=value";
int eq = text.IndexOf('=');
ReadOnlySpan<char> key = text[..eq];        // a view: no new string
bool isKey = key is "key";                  // pattern matching works on spans
int[] data = { 5, 6, 7, 8 };
Span<int> tail = data.AsSpan(2);            // writes go to the array
tail[0] = 70;                               // data is now 5, 6, 70, 8
```

`MemoryExtensions` adds string-like methods to spans: `IndexOf`, `Trim`, `StartsWith`,
`SequenceEqual`, `Reverse` and more. Parsing and formatting APIs accept spans directly:
`int.Parse(ReadOnlySpan<char>, ...)`, `value.TryFormat(Span<char>, out int written, ...)`.

`stackalloc` reserves a small buffer on the stack, which disappears when the method returns
and costs the garbage collector nothing:

```csharp
Span<char> buffer = stackalloc char[16];
```

## The rules, and the errors you will meet

A span may point into the stack, so the compiler guarantees it never outlives that memory.
`Span<T>` is a **`ref struct`**, and the compiler enforces its rules with errors:

- a span cannot be a field of a class or a normal struct (**CS8345**);
- it cannot be a local in an `async` method or lambda (**CS4012**);
- a lambda cannot capture one (**CS8175**);
- it cannot be boxed or cast to `object` (**CS0030**);
- returning a span over a `stackalloc` buffer is rejected (**CS8352**).

When you need a slice that survives an `await` or lives in a field, use `Memory<T>` and call
`.Span` only where you do the work.

Other pitfalls: `stackalloc` is for small buffers (a few hundred bytes), because a large one
can overflow the stack, which crashes the process. Calling `ToString()` or `ToArray()` on a
span allocates again, so do it only at the edges, when you really need a string. Finally,
measure: `GC.GetAllocatedBytesForCurrentThread()` tells you how many bytes the current thread
has allocated so far.

## What you will practise

You will slice an HTTP request line and part of an array, compare the allocations of `Split`
and a span loop, and format into a stack buffer. The challenge asks you to parse a line of
comma-separated integers into a caller's buffer with zero allocations.
'''

[[unit.step]]
kind = "concept"
id = "cs-u27-c1-views"
title = "Views over memory"
points = 5
difficulty = 27
intro = '''
A span is a pointer and a length wrapped in a type the compiler can check. Because slicing
only adjusts those two numbers, a span lets you work with part of a string or array as if it
were its own object, without copying a single element.
'''
body = '''
## Slicing is free

Take the string `"2026-11-23"`. With strings, `s.Substring(0, 4)` allocates a new
four-character string. With spans, `s.AsSpan(0, 4)` creates a view: it remembers where the
year starts and that it is four characters long. The original characters are shared:

```csharp
ReadOnlySpan<char> date = "2026-11-23";
int year = int.Parse(date[..4]);
int month = int.Parse(date[5..7]);
```

Neither slice allocates, and `int.Parse` reads the characters in place.

## Writable views

A `Span<T>` over an array writes through to the array, so a method can fill, sort or reverse
part of an array without knowing about the rest:

```csharp
int[] a = { 9, 8, 7, 6 };
a.AsSpan(1, 2).Sort();      // a is now 9, 7, 8, 6
```

## Stack memory

`stackalloc` gives you a buffer that lives in the current method's stack frame. It is
reclaimed automatically when the method returns, so the garbage collector never sees it.
Assigned to a `Span<T>`, it needs no `unsafe` code:

```csharp
Span<byte> scratch = stackalloc byte[64];
```

## Why the restrictions

Because a span may point into a stack frame, it must never outlive that frame. That is why
spans cannot be stored in fields, captured by lambdas or used across `await`. The compiler
checks all of this, so span code is fast **and** memory-safe.
'''

