[[unit.step]]
kind = "drill"
id = "cs-u02-d2-conversions"
title = "Convert between number types"
points = 10
difficulty = 2
placeholder_policy = "shown"
run_command = "dotnet run"
intro = '''
A **widening** conversion, such as `int` to `long` or `int` to `double`, can never lose
information, so C# performs it implicitly. A **narrowing** conversion might, so it needs an
explicit cast. Text is not a number at all until you **parse** it.
'''
prompt = '''
Widen an `int` implicitly, fix integer division, cast a `double` down to an `int`, round,
parse a string, and convert between `char` and its numeric code.

**Why:** most "wrong number" bugs in beginner code are an unexpected integer division or a
silent truncation. Seeing each conversion once makes them easy to spot.
'''
target = '''
using System.Globalization;

CultureInfo.CurrentCulture = CultureInfo.InvariantCulture;

int whole = 7;
long wide = whole;
double asDouble = whole;
Console.WriteLine(wide + " " + asDouble);
Console.WriteLine(whole / 2);
Console.WriteLine(whole / 2.0);
Console.WriteLine((double)whole / 2);

double measured = 3.99;
int truncated = (int)measured;
Console.WriteLine(truncated);
Console.WriteLine(Math.Round(3.5) + " " + Math.Round(2.5));

int parsed = int.Parse("42");
Console.WriteLine(parsed + 1);
Console.WriteLine("42" + 1);
Console.WriteLine((int)'A');
Console.WriteLine((char)66);
'''
