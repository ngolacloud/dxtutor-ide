[unit.step.gabarito]
solution = '''
// TextTools: two everyday text transformations.
public static class TextTools
{
    // Lower-case the title and join its words with single dashes: "  Hello  World " -> "hello-world".
    public static string Slug(string title)
    {
        string[] words = title.ToLowerInvariant().Split(' ', StringSplitOptions.RemoveEmptyEntries);
        return string.Join("-", words);
    }

    // Replace every character except the last 4 with '*'. Short strings come back unchanged.
    public static string Mask(string cardNumber)
    {
        if (cardNumber.Length <= 4)
        {
            return cardNumber;
        }
        return new string('*', cardNumber.Length - 4) + cardNumber[^4..];
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the length of the input. In `Slug`, `ToLowerInvariant` makes one pass to build a
lower-case copy, `Split` makes one pass to cut it into words, and `string.Join` copies every
character once more into the result: three passes of O(n) each, so **O(n)** time. The
lower-case copy, the words and the result each hold at most `n` characters, so the space is
**O(n)**.

`Mask` builds `n - 4` stars, copies the last four characters and joins the two pieces once, so
it is **O(n)** time and **O(n)** space for the new string; strings are immutable, so the answer
must be a fresh string of length `n` anyway. Building the result one `+=` at a time inside a
loop would copy the growing string at every step and cost O(n²).
'''

[[unit]]
id = "cs-u04-control-flow"
title = "Decisions: if, switch and ?:"
level = "basic"
difficulty = 4
intro = '''
Until now every program ran each of its lines exactly once. Real programs make decisions: they
look at a value and choose what to do next. This unit covers the `bool` conditions behind every
decision, `if`/`else`, the `switch` statement, the modern switch expression and the conditional
operator `?:`.
'''
concepts = '''
## The idea

A **condition** is an expression whose value is a `bool`: `true` or `false`. A **branch**
lets the program run one block of code when a condition is true and another (or nothing) when
it is false. With branches, the same program can respond differently to different input,
which is what makes it useful.

## How C# does it

Conditions are built from **comparison operators** (`==`, `!=`, `<`, `<=`, `>`, `>=`) and
combined with **logical operators**: `&&` (and), `||` (or) and `!` (not). `&&` and `||`
**short-circuit**: if the left side already decides the answer, the right side is never
evaluated, so `s.Length > 0 && s[0] == 'A'` never reads a character of an empty string.

```csharp
if (temperature > 30)
{
    Console.WriteLine("Hot");
}
else if (temperature > 15)
{
    Console.WriteLine("Mild");
}
else
{
    Console.WriteLine("Cold");
}
```

The conditions are tested from the top, and only the first true branch runs.

A **`switch` statement** compares one value against several `case` labels. Every section must
end with `break` (or `return`): C# does not let execution fall from one case into the next.
A **switch expression** (C# 8) is the compact, modern form that *produces a value*:

```csharp
string size = count switch
{
    0 => "empty",
    < 10 => "small",
    _ => "large",   // _ matches anything else
};
```

The arms are tried in order and can use **patterns** such as `< 10`, `>= 1 and <= 5` or
`"stop" or "halt"`. Finally, the **conditional operator** `condition ? a : b` picks one of two
values in a single expression: `string word = n == 1 ? "item" : "items";`.

## What is special or tricky

- **`=` is not `==`.** `if (x = 5)` is `CS0029: Cannot implicitly convert type 'int' to
  'bool'`. C# only accepts a real `bool` as a condition, which catches this classic bug.
- **No fall-through.** A case without `break` gives `CS0163: Control cannot fall through from
  one case label ('case 1:') to another`. Stacking labels with no code between them is fine.
- **Switch expressions must cover every value.** Leaving out `_` gives warning `CS8509` (the
  switch expression is not exhaustive), and an unmatched value throws a
  `SwitchExpressionException` at run time.
- **A stray semicolon empties the `if`.** `if (x > 0);` gives warning `CS0642: Possible
  mistaken empty statement`, and the block below always runs.
- **Assign on every path.** A variable set only inside some branches cannot be read
  afterwards: `CS0165: Use of unassigned local variable`.

## What you will practise

You will write `if`/`else if`/`else` chains and short-circuit conditions, a `switch`
statement with stacked labels next to switch expressions with patterns, and the conditional
operator for plurals and signs. Then you will write a triangle classifier that must check its
conditions in the right order and avoid an overflow.
'''

[[unit.step]]
kind = "concept"
id = "cs-u04-c1-conditions"
title = "Conditions and branches"
points = 5
difficulty = 4
intro = '''
At the machine level, a branch is a conditional jump: the processor evaluates a test and either
continues with the next instruction or jumps elsewhere. Every `if`, `switch` and `?:` in C#
compiles down to such jumps. Your job is to write the test precisely.
'''
body = '''
## Building conditions

- `==` and `!=` test equal and not equal: with `x = 7`, `x == 7` is `true`.
- `<`, `<=`, `>` and `>=` compare order: `x > 10` is `false`.
- `&&` (and) needs both sides true: `x > 0 && x < 10` is `true`.
- `||` (or) needs at least one side true: `x < 0 || x > 5` is `true`.
- `!` (not) flips a `bool`: `!(x == 7)` is `false`.

`&&` is evaluated before `||`, just as `*` comes before `+`; use parentheses when you mix them
so readers do not have to remember.

## Short-circuit evaluation

`&&` stops as soon as its left side is `false`, and `||` stops as soon as its left side is
`true`, because the answer is already known. This is not just an optimisation, it is a safety
tool:

```csharp
if (word.Length > 0 && word[0] == 'A') { ... }
```

For an empty `word`, the left side is `false`, so `word[0]` is never evaluated and nothing
crashes.

## Blocks and braces

The code controlled by an `if` goes in a block between `{` and `}`. Braces are optional for a
single statement, but always writing them avoids a classic bug: adding a second indented line
that looks controlled by the `if` but actually always runs.

## Statement or expression?

`if` and the `switch` statement *do* things. The switch expression and `?:` *produce a value*
that you store or print. When each branch only computes a value, the expression forms are
shorter and the compiler can check that every case gives an answer.
'''

