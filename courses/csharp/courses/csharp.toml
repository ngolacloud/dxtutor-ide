[unit.step.gabarito]
solution = '''
public class MinMaxStack<T> where T : IComparable<T>
{
    private readonly List<(T Item, T Min, T Max)> _entries = new();

    public int Count => _entries.Count;

    public void Push(T item)
    {
        ArgumentNullException.ThrowIfNull(item);
        if (_entries.Count == 0)
        {
            _entries.Add((item, item, item));
            return;
        }
        var top = _entries[^1];
        T min = item.CompareTo(top.Min) < 0 ? item : top.Min;
        T max = item.CompareTo(top.Max) > 0 ? item : top.Max;
        _entries.Add((item, min, max));
    }

    public T Pop()
    {
        var top = Top();
        _entries.RemoveAt(_entries.Count - 1);
        return top.Item;
    }

    public T Peek() => Top().Item;

    public T Min => Top().Min;

    public T Max => Top().Max;

    private (T Item, T Min, T Max) Top() =>
        _entries.Count > 0 ? _entries[^1] : throw new InvalidOperationException("the stack is empty");
}

public static class MinMaxStack
{
    public static MinMaxStack<T> Of<T>(params T[] items) where T : IComparable<T>
    {
        var stack = new MinMaxStack<T>();
        foreach (T item in items)
            stack.Push(item);
        return stack;
    }
}
'''
time = "O(1) per operation"
space = "O(n)"
justification = '''
Each entry stores the item together with the minimum and maximum of the stack **up to and
including** that item. `Push` reads the entry below (the current top), does two `CompareTo`
calls and appends one tuple; appending to a `List<T>` is **amortised O(1)** because the backing
array doubles when it fills. `Pop` removes the last element, which shifts nothing, and `Peek`,
`Min` and `Max` just read the top entry. So every operation is **O(1)**, and `Of` with `k`
items is O(k).

Correctness rests on an invariant: the stored min and max of an entry describe exactly the
elements at or below it. Popping cannot change what lies below the new top, so its stored
values are already right and nothing has to be recomputed. A single `_min` field would break as
soon as the minimum is popped, and rescanning would make `Min` O(n), which the large test
rejects. The space is **O(n)**: three `T` values per element, a constant factor over a plain
stack. Because the class is generic and `T` is constrained to `IComparable<T>`, the same code
compiles to specialised versions for `int`, `decimal`, `char` and `DateOnly` (no boxing) and
works with `string` through its reference.
'''

[[unit]]
id = "cs-u14-delegates-lambdas"
title = "Delegates, lambdas and events"
level = "intermediate"
difficulty = 14
intro = '''
In C# a function can be a value: stored in a variable, passed to a method, returned from one.
This unit introduces delegate types such as `Func` and `Action`, the lambda syntax that creates
them, the closures that let a lambda remember variables, and the events built on top of
delegates. You finish by writing an observable value that notifies subscribers and derives new
values from itself.
'''
concepts = '''
## The idea

Many problems have a fixed skeleton and one variable step. Sorting needs to know how to compare
two items, a button needs to know what to do when clicked, a retry loop needs to know which
operation to repeat. Instead of writing the skeleton again for every case, you pass the
variable step in as a **function value**. A function that takes or returns other functions is a
**higher-order function**, and it is the idea behind LINQ, which comes next.

## How C# does it

A **delegate** is a type-safe reference to a method: it fixes the parameter types and the
return type, and any method or lambda with that shape can be stored in it. You can declare your
own delegate type, but the built-in generic ones cover almost every need:

- `Func<T1, ..., TResult>` takes up to 16 arguments and returns `TResult`;
- `Action<T1, ...>` takes arguments and returns nothing;
- `Predicate<T>` is the older name for `Func<T, bool>`.

```csharp
Func<int, int> square = x => x * x;          // expression lambda
Action<string> log = msg =>
{
    Console.WriteLine($"[log] {msg}");       // statement lambda
};
Func<string, int> length = s => s.Length;
Func<double, double> sqrt = Math.Sqrt;       // a method group converts too
```

A lambda that uses a variable from the surrounding scope **captures** it, forming a
**closure**. It captures the *variable*, not its current value: if the variable changes later,
the lambda sees the change, and the variable lives as long as the lambda does.

Delegates are **multicast**: `+=` adds a method to the invocation list and `-=` removes it.
An **event** wraps a delegate field so that outsiders can only subscribe and unsubscribe, while
only the owning class can raise it:

```csharp
class Button
{
    public event EventHandler? Clicked;
    public void Click() => Clicked?.Invoke(this, EventArgs.Empty);
}
```

`?.Invoke` matters: with no subscribers the delegate is `null`.

## Pitfalls and compiler errors

- **CS1593**, *Delegate 'Func<int, int>' does not take 2 arguments*: the call does not match
  the delegate's shape.
- **CS8917**, *The delegate type could not be inferred*: `var f = x => x;` gives the compiler
  no parameter type. Write `var f = (int x) => x;` or name the delegate type.
- **CS0070**, *The event can only appear on the left hand side of += or -=*: code outside the
  class tried to invoke or assign the event.
- In a `for` loop, all lambdas capture the **same** loop variable and see its final value.
  Copy it into a local inside the loop. (`foreach` creates a fresh variable each iteration.)
- A subscriber that never unsubscribes keeps its object alive as long as the publisher lives.

## What you will practise

You will store lambdas and methods in `Func`, `Action` and a custom delegate, build closures
that keep private state and meet the loop-capture trap, and raise an event to several
subscribers. The challenge combines all of it in a generic `Observable<T>`.
'''

[[unit.step]]
kind = "concept"
id = "cs-u14-c1-functions-as-values"
title = "Functions as values"
points = 5
difficulty = 14
intro = '''
A delegate value is a small object that remembers which method to call and, for a closure, the
captured variables it needs. Calling the delegate calls that method, so code can decide at run
time what a piece of behaviour should be.
'''
body = '''
## A delegate is a typed function reference

```csharp
static int Twice(int x) => 2 * x;

Func<int, int> f = Twice;      // points at a named method
Func<int, int> g = x => x + 1; // points at an anonymous one
Console.WriteLine(f(5) + g(5)); // 10 + 6
```

`Func<int, int>` reads "takes an `int`, returns an `int`". The **last** type argument of a
`Func` is always the result; `Action` has no result. Both `f` and `g` have the same type, so
either can be passed wherever a `Func<int, int>` is expected:

```csharp
static int[] Map(int[] items, Func<int, int> transform)
{
    var result = new int[items.Length];
    for (int i = 0; i < items.Length; i++)
        result[i] = transform(items[i]);
    return result;
}

Map(new[] { 1, 2, 3 }, Twice);        // [2, 4, 6]
Map(new[] { 1, 2, 3 }, x => x * x);   // [1, 4, 9]
```

`Map` is the fixed skeleton; the delegate is the step that varies.

## Closures carry state

```csharp
int calls = 0;
Func<int, int> counted = x => { calls++; return x; };
counted(1); counted(2);
Console.WriteLine(calls);   // 2
```

The lambda captured the variable `calls` itself. The compiler moves such variables into a
hidden object shared by the method and the lambda, which is why changes are visible on both
sides and why the variable outlives the method that declared it.

## Events are guarded delegates

An `event` field exposes only `+=` and `-=` to the outside world. Subscribers cannot raise it,
replace the whole list with `=`, or erase other subscribers; only the declaring class decides
when it fires.
'''

