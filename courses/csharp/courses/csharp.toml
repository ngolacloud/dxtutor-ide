run_command = "dotnet run"
intro = '''
Search never needs recursion: one reference walks down the tree, turning left or right at
each node until it finds the key or falls off. Counting the comparisons shows the O(h) cost
directly.
'''
prompt = '''
Build a small `SearchTree<T>` that inserts and searches with loops, then search for a key
deep in the tree, a shallow key and a missing key, printing how many comparisons each took.

**Why:** an iterative search uses O(1) memory and can't overflow the stack, and the
comparison count is exactly the path length that the O(h) bound talks about.
'''
target = '''
var tree = new SearchTree<int>();
foreach (var key in new[] { 50, 30, 70, 20, 40, 60, 80, 65 })
    tree.Add(key);
foreach (var target in new[] { 65, 20, 55 })
    Console.WriteLine($"{target}: found={tree.Find(target, out var steps)} after {steps} comparisons");

class SearchTree<T> where T : IComparable<T>
{
    private sealed class Node(T key) { public readonly T Key = key; public Node? Left, Right; }
    private Node? _root;

    public void Add(T key)
    {
        ref var slot = ref _root;
        while (slot is not null)
        {
            var cmp = key.CompareTo(slot.Key);
            if (cmp == 0) return;
            slot = ref (cmp < 0 ? ref slot.Left : ref slot.Right);
        }
        slot = new Node(key);
    }

    public bool Find(T key, out int steps)
    {
        steps = 0;
        var node = _root;
        while (node is not null)
        {
            steps++;
            var cmp = key.CompareTo(node.Key);
            if (cmp == 0) return true;
            node = cmp < 0 ? node.Left : node.Right;
        }
        return false;
    }
}
'''
