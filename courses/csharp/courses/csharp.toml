`Directory.CreateDirectory` builds `src/util` and its parent in one call. The search pattern
`*.cs` with `AllDirectories` finds the two source files in any subfolder and skips the README.
`GetRelativePath` removes the random root, the separator is normalised to `/`, and an ordinal
sort fixes the order, so the listing is the same on Linux and Windows. The `Path` methods split
