[[unit.step]]
kind = "challenge"
id = "cs-u33-x1-merge-sort-inversions"
title = "A stable merge sort that counts inversions"
points = 40
difficulty = 33
entry = "SortAndCount"
intro = '''
An **inversion** is a pair of items that are out of order. The count measures how far an
array is from sorted: 0 for a sorted array, n(n − 1)/2 for a reversed one. It is used to
compare rankings, and counting it fast is a classic divide-and-conquer exercise, because a
merge sort can count every inversion while it merges.
'''
instructions = '''
## Your turn

Complete the static method `MergeSorter.SortAndCount`:

```csharp
public static (T[] Sorted, long Inversions) SortAndCount<T>(
    IReadOnlyList<T> items, IComparer<T>? comparer = null)
```

Return a tuple:

1. `Sorted`: a **new** array with the items in ascending order according to `comparer`
   (`Comparer<T>.Default` when it is `null`). Don't modify `items`. The sort must be
   **stable**: items that compare equal keep their original order.
2. `Inversions`: the number of index pairs `i < j` with `items[i]` greater than `items[j]`.
   Items that compare equal are **not** an inversion.

If `items` is `null`, throw `ArgumentNullException`.

Examples:

- `SortAndCount(new int[0])` returns an empty array and `0`.
- `SortAndCount(new[] { 2, 4, 1, 3, 5 })` returns `[1, 2, 3, 4, 5]` and `3`: the inversions
  are (2, 1), (4, 1) and (4, 3).
- `SortAndCount(new[] { 3, 1, 3, 1 })` returns `[1, 1, 3, 3]` and `3`.
- A reversed array of 200,000 items has 19,999,900,000 inversions, which doesn't fit in an
  `int`: that is why the count is a `long`.

The hidden tests include arrays of 200,000 items, so checking every pair is far too slow,
and `Array.Sort` is not stable. Write the merge sort yourself.

**Hint:** sort the two halves recursively, each returning its own count. What remains is
pairs with one item in each half. When the merge takes an item from the right half because
it is strictly smaller than the current left item, how many left items does it jump over?

Hidden tests decide correctness.
'''
