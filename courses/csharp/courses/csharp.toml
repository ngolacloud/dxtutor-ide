[[unit]]
id = "cs-u12-exceptions"
title = "Exceptions and cleanup"
level = "intermediate"
difficulty = 12
intro = '''
Real programs meet text that is not a number, files that vanish and keys that are missing. In
this unit you learn how C# reports such problems with exceptions, how `try`, `catch`, `finally`
and exception filters decide who handles them, and how `using` guarantees that resources are
released. You finish by writing a configuration parser whose errors say exactly which line went
wrong and why.
'''
concepts = '''
## The idea

Sooner or later a method meets a situation it cannot handle where it stands: the text it was
given is not a number, a file does not exist, an argument is out of range. Returning a special
value such as `-1` forces every caller to remember to check, and the ones that forget carry on
with garbage. C# uses **exceptions** instead. The method creates an object that describes the
problem and **throws** it. Normal execution stops at once and the runtime **unwinds the call
stack**, method by method, until it finds a `catch` that accepts that type. If none does, the
process ends and prints the exception with its **stack trace**.

Unlike Java, C# has **no checked exceptions**: the compiler never forces you to catch or declare
anything. What a method can throw is part of its documentation, not of its signature.

## How C# does it

Every exception derives from `System.Exception`. The standard library gives you the ones you
will throw most: `ArgumentException` and its children `ArgumentNullException` and
`ArgumentOutOfRangeException` for bad arguments, `InvalidOperationException` when the object is
in the wrong state, and `FormatException`, `OverflowException`, `KeyNotFoundException` and
`IOException` from parsing, dictionaries and files.

```csharp
static int ParsePort(string text)
{
    ArgumentNullException.ThrowIfNull(text);
    int port = int.Parse(text, CultureInfo.InvariantCulture);  // may throw FormatException
    if (port is < 1 or > 65_535)
        throw new ArgumentOutOfRangeException(nameof(text), port, "port must be 1-65535");
    return port;
}
```

`try` runs code that may throw, each `catch` handles one family of types, and `finally` runs on
every way out. A `when` clause is an **exception filter**: the catch applies only if the
condition is true, and a false filter leaves the exception travelling as if the catch were not
there. Anything that holds an operating-system resource implements `IDisposable`, and `using`
calls its `Dispose()` for you, even when an exception escapes:

```csharp
using var reader = new StreamReader(path);   // Dispose() runs at the end of the scope
```

Your own exception is an ordinary class that derives from `Exception` and passes a message, and
optionally the original exception as `InnerException`, to the base constructor.

## Pitfalls and compiler errors

- **CS0160**, *A previous catch clause already catches all exceptions of this or of a super
  type*: a `catch (Exception)` above a `catch (FormatException)` makes the second unreachable.
  Put specific types first.
- **CS0155**, *The type caught or thrown must be derived from System.Exception*.
- **CS1674**: only an `IDisposable` can appear in a `using`.
- `throw ex;` resets the stack trace to the current line. To rethrow, write plain `throw;`.
- An empty `catch { }` swallows the error and hides the bug.
- Exceptions are slow and are for exceptional cases. For expected failures prefer the `Try`
  pattern: `int.TryParse`, `dict.TryGetValue`.

## What you will practise

You will catch parse failures while a `finally` block reports progress, route errors with
filters and wrap one exception inside another, and watch `using` dispose resources in reverse
order. The challenge asks you for a parser with its own `ConfigException` that remembers the
line number and the original cause.
'''

[[unit.step]]
kind = "concept"
id = "cs-u12-c1-unwinding"
title = "How an exception travels"
points = 5
difficulty = 12
intro = '''
Throwing an exception is a jump that can cross many method calls at once. Picture the call
stack as a pile of frames: the runtime pops frames until one of them has a matching `catch`,
running every `finally` it passes on the way.
'''
body = '''
## Throw, unwind, catch

When `int.Parse("abc")` throws a `FormatException`, the rest of the current method is
abandoned. The runtime looks at the method that called it, then at that method's caller, and
so on, searching for a `try` block with a `catch` whose type matches. This is **unwinding the
stack**. The first match wins, so the order of `catch` clauses matters:

```csharp
try
{
    Save(Load(path));
}
catch (FileNotFoundException e)      // most specific first
{
    Console.WriteLine($"missing: {e.FileName}");
}
catch (IOException e) when (e.HResult == 32)   // a filter
{
    Console.WriteLine("file is locked, try later");
}
catch (IOException)                  // any other IO failure
{
    throw;                           // rethrow, keeping the original stack trace
}
finally
{
    Console.WriteLine("attempt finished");
}
```

## Filters run first

A `when` filter is evaluated **before** the stack unwinds. If it returns `false`, the catch is
skipped and the search continues outward, with nothing undone. That is why a filter is better
than catching, checking a condition and rethrowing.

## finally always runs

A `finally` block runs whether the `try` finished normally, returned early or threw. It is the
place for cleanup. The `using` statement is shorthand for exactly that pattern: a `try` whose
`finally` calls `Dispose()`.
'''

