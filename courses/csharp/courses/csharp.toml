Console.WriteLine($"Fib(90) = {FibMemo(90)}");

long FibNaive(int n)
{
    naiveCalls++;
    return n < 2 ? n : FibNaive(n - 1) + FibNaive(n - 2);
}

long FibMemo(int n)
{
    memoCalls++;
    if (n < 2) return n;
    if (memo.TryGetValue(n, out var known)) return known;
