[[unit.step]]
kind = 'challenge'
id = 'cs-u22-x1-simplify'
title = 'Evaluate and simplify expressions'
points = 40
difficulty = 22
entry = 'ExprTools'
intro = '''
Compilers and computer algebra systems represent expressions as trees and rewrite them with
rules such as `x + 0 = x`. A rule is a pattern on the shape of a subtree, so nested positional
patterns express each rule in one line. Simplifying the children first lets the rules cascade
in a single bottom-up pass.
'''
instructions = '''
## Your turn

The starter defines a tiny algebra of integer expressions as records (don't change them):
`Num(int Value)`, `Var(string Name)`, `Add(Expr Left, Expr Right)`, `Mul(Expr Left, Expr Right)`
and `Neg(Expr Operand)`, all deriving from the abstract record `Expr`. Implement the two
methods of the static class `ExprTools`:

```csharp
public static int Eval(Expr e, IReadOnlyDictionary<string, int> vars);
public static Expr Simplify(Expr e);
```

**`Eval`** computes the value of `e`, reading variables from `vars`. An unknown variable throws
`KeyNotFoundException`.

**`Simplify`** returns an equivalent expression, simplified **bottom-up**: simplify the children
first, then apply these rules to the rebuilt node.

- Constant folding: `Num a + Num b` becomes `Num(a + b)`, `Num a * Num b` becomes `Num(a * b)`,
  and `Neg(Num n)` becomes `Num(-n)`.
- `0 + x` and `x + 0` become `x`.
- `0 * x` and `x * 0` become `Num(0)`, even when `x` contains variables.
- `1 * x` and `x * 1` become `x`.
- `Neg(Neg(x))` becomes `x`.
- Anything else stays as it is (`x + x`, `2 * x` and `x + y` are already simplified).

Because the records compare by value, the tests compare whole trees with `Equal`.

Examples (written as math):

- `Simplify(2 + 3 * 4)` gives `Num(14)`.
- `Simplify((0 + 1) * (x + 2 * 0))` gives `Var("x")`: the children become `1` and `x` first.
- `Simplify(-(-(-x)))` gives `-x`.
- `Eval((x + 3) * -y)` with `x = 5`, `y = -2` gives `16`.

**Hint:** write each method as a switch expression with positional patterns, such as
`Add(Num(var a), Num(var b))` and `Mul(Num(0), _)`. Put a `_ => throw` arm last in `Eval`.

Hidden tests decide correctness.
'''
