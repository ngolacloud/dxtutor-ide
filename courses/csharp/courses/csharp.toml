[[unit.step]]
kind = "challenge"
id = "cs-u29-x1-ring-deque"
title = "A circular deque by hand"
points = 40
difficulty = 29
entry = "RingDeque"
intro = '''
A double-ended queue supports pushing and popping at both ends in O(1). Built on a circular
array that doubles when full, it gets the speed and cache-friendliness of an array without
ever shifting elements, and it can serve as a stack, a queue or both at once.
'''
instructions = '''
## Your turn

Implement the generic class `RingDeque<T>` with a parameterless constructor:

```csharp
public int Count { get; }
public bool IsEmpty { get; }
public void AddFirst(T item)          public void AddLast(T item)
public T RemoveFirst()                public T RemoveLast()
public T PeekFirst()                  public T PeekLast()
public T this[int index] { get; }     // index 0 is the front
public T[] ToArray()                  // front to back
```

Rules:

- Store the elements in **your own `T[]` array** used as a circular buffer. Don't keep them in
  a `List<T>`, `Queue<T>`, `Stack<T>`, `LinkedList<T>` or any other collection. A hidden test
  inspects the fields.
- Start small (8 slots is fine) and **double** the capacity when the array is full, copying the
  elements in logical order.
- All operations except `ToArray` are amortized **O(1)**: never shift the elements. The tests
  run hundreds of thousands of operations at the front against a time limit.
- `RemoveFirst`, `RemoveLast`, `PeekFirst` and `PeekLast` throw `InvalidOperationException`
  when the deque is empty.
- The indexer throws `ArgumentOutOfRangeException` unless `0 <= index < Count`.

Examples:

- `AddLast(1)`, `AddLast(2)`, `AddLast(3)`: `RemoveFirst()` returns 1 (a queue), while
  `RemoveLast()` would return 3 (a stack), and `d[1]` is 2.
- `AddFirst(1)`, `AddFirst(2)`: `PeekFirst()` is 2, `PeekLast()` is 1, and `ToArray()` is
  `[2, 1]`.

**Hint:** keep `_head` and `_count`. Element `i` lives in slot `(_head + i) % _items.Length`.
To add at the front, step the head back with `(_head - 1 + _items.Length) % _items.Length`
(in C#, `%` applied to a negative number gives a negative result). The back element is at
`(_head + _count - 1) % _items.Length`. When removing, overwrite the freed slot with `default!`
so the array doesn't keep the object alive for the garbage collector.

Hidden tests decide correctness.
'''
starter = '''
public sealed class RingDeque<T>
{
    // A double-ended queue on a circular T[] array that doubles when full.
    // Every operation except ToArray is amortized O(1); never shift elements.
    public int Count => throw new NotImplementedException();

    public bool IsEmpty => throw new NotImplementedException();

    public void AddFirst(T item) => throw new NotImplementedException();

    public void AddLast(T item) => throw new NotImplementedException();

    public T RemoveFirst() => throw new NotImplementedException();

    public T RemoveLast() => throw new NotImplementedException();

    public T PeekFirst() => throw new NotImplementedException();

    public T PeekLast() => throw new NotImplementedException();

    public T this[int index] => throw new NotImplementedException();

    public T[] ToArray() => throw new NotImplementedException();
}
'''
tests = '''
using System.Diagnostics;
using System.Reflection;
Test("works as a queue and as a stack", () =>
{
    var d = new RingDeque<int>();
    d.AddLast(1);
    d.AddLast(2);
    d.AddLast(3);
    Equal(d.Count, 3);
    Equal(d[1], 2);
    Equal(d.RemoveFirst(), 1);
    Equal(d.RemoveLast(), 3);
    Equal(d.ToArray(), new[] { 2 });
});
Test("adds at the front", () =>
{
    var d = new RingDeque<string>();
    d.AddFirst("one");
    d.AddFirst("two");
    d.AddLast("zero");
    Equal(d.PeekFirst(), "two");
    Equal(d.PeekLast(), "zero");
    Equal(d.ToArray(), new[] { "two", "one", "zero" });
    Equal(d[0], "two");
    Equal(d[2], "zero");
});
Test("a new deque is empty and refuses to remove", () =>
{
    var d = new RingDeque<int>();
    Equal(d.Count, 0);
    Check(d.IsEmpty, "a new deque should be empty");
    Equal(d.ToArray(), new int[0]);
    Throws<InvalidOperationException>(() => d.RemoveFirst());
    Throws<InvalidOperationException>(() => d.RemoveLast());
    Throws<InvalidOperationException>(() => d.PeekFirst());
    Throws<InvalidOperationException>(() => d.PeekLast());
});
Test("emptying it again restores the empty behaviour", () =>
{
    var d = new RingDeque<int>();
    d.AddFirst(5);
    Equal(d.RemoveLast(), 5);
    Check(d.IsEmpty, "the deque should be empty again");
    Throws<InvalidOperationException>(() => d.RemoveFirst());
    d.AddLast(6);
    Equal(d.PeekFirst(), 6);
    Equal(d.PeekLast(), 6);
});
Test("the indexer checks its bounds", () =>
{
    var d = new RingDeque<int>();
    Throws<ArgumentOutOfRangeException>(() => _ = d[0]);
    d.AddLast(10);
    d.AddLast(20);
    Throws<ArgumentOutOfRangeException>(() => _ = d[-1]);
    Throws<ArgumentOutOfRangeException>(() => _ = d[2]);
    Equal(d[1], 20);
});
Test("wraps around and grows while keeping the order", () =>
{
    var d = new RingDeque<int>();
    for (int i = 0; i < 6; i++) d.AddLast(i);
    for (int i = 0; i < 4; i++) d.RemoveFirst();
    for (int i = 6; i < 30; i++) d.AddLast(i);
    for (int i = -1; i >= -10; i--) d.AddFirst(i);
    Equal(d.Count, 36);
    var expected = Enumerable.Range(-10, 10).Concat(Enumerable.Range(4, 26)).ToArray();
    Equal(d.ToArray(), expected);
    for (int i = 0; i < d.Count; i++) Check(d[i] == expected[i], $"d[{i}] should be {expected[i]}");
});
Test("matches LinkedList on random operations, duplicates included", () =>
{
    var rng = new Random(29);
    var d = new RingDeque<int>();
    var model = new LinkedList<int>();
    for (int step = 0; step < 20000; step++)
    {
        int op = rng.Next(6);
        int value = rng.Next(-5, 6);
        if (op == 0) { d.AddFirst(value); model.AddFirst(value); }
        else if (op == 1) { d.AddLast(value); model.AddLast(value); }
        else if (op == 2 && model.Count > 0)
        {
            Check(d.RemoveFirst() == model.First!.Value, $"step {step}: RemoveFirst");
            model.RemoveFirst();
        }
        else if (op == 3 && model.Count > 0)
        {
            Check(d.RemoveLast() == model.Last!.Value, $"step {step}: RemoveLast");
            model.RemoveLast();
        }
        else if (op == 4 && model.Count > 0)
        {
            Check(d.PeekFirst() == model.First!.Value && d.PeekLast() == model.Last!.Value, $"step {step}: Peek");
        }
        Check(d.Count == model.Count, $"step {step}: Count {d.Count}, expected {model.Count}");
    }
    Equal(d.ToArray(), model.ToArray());
});
Test("300,000 operations at the front are fast", () =>
{
    var d = new RingDeque<int>();
    var clock = Stopwatch.StartNew();
    for (int i = 0; i < 300000; i++) d.AddFirst(i);
    long sum = 0;
    for (int i = 0; i < 150000; i++) sum += d.RemoveFirst();
    for (int i = 0; i < 150000; i++) d.AddFirst(-i);
    clock.Stop();
    Equal(d.Count, 300000);
    Equal(sum, 33749925000L);
    Equal(d.PeekLast(), 0);
    Check(clock.ElapsedMilliseconds < 2000, $"took {clock.ElapsedMilliseconds} ms; operations must not shift elements");
});
Test("stores the elements in its own array", () =>
{
    var fields = typeof(RingDeque<int>).GetFields(BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic);
    Check(fields.Any(f => f.FieldType == typeof(int[])), "expected a T[] field for the circular buffer");
    foreach (var f in fields)
    {
        bool collection = !f.FieldType.IsArray && f.FieldType != typeof(string)
            && typeof(System.Collections.IEnumerable).IsAssignableFrom(f.FieldType);
        Check(!collection, $"field {f.Name} is a {f.FieldType.Name}; use a plain array instead");
    }
});
'''

[unit.step.gabarito]
solution = '''
public sealed class RingDeque<T>
{
    private T[] _items = new T[8];
    private int _head;
    private int _count;

    public int Count => _count;

    public bool IsEmpty => _count == 0;

    public void AddFirst(T item)
    {
        if (_count == _items.Length) Grow();
        _head = (_head - 1 + _items.Length) % _items.Length;
        _items[_head] = item;
        _count++;
    }

    public void AddLast(T item)
    {
        if (_count == _items.Length) Grow();
        _items[(_head + _count) % _items.Length] = item;
        _count++;
    }

    public T RemoveFirst()
    {
        T item = PeekFirst();
        _items[_head] = default!;
        _head = (_head + 1) % _items.Length;
        _count--;
        return item;
    }

    public T RemoveLast()
    {
        T item = PeekLast();
        _items[Slot(_count - 1)] = default!;
        _count--;
        return item;
    }

    public T PeekFirst()
    {
        if (_count == 0) throw new InvalidOperationException("The deque is empty.");
        return _items[_head];
    }

    public T PeekLast()
    {
        if (_count == 0) throw new InvalidOperationException("The deque is empty.");
        return _items[Slot(_count - 1)];
    }

    public T this[int index]
    {
        get
        {
            if ((uint)index >= (uint)_count) throw new ArgumentOutOfRangeException(nameof(index));
            return _items[Slot(index)];
        }
    }

    public T[] ToArray()
    {
        var result = new T[_count];
        for (int i = 0; i < _count; i++) result[i] = _items[Slot(i)];
        return result;
    }

    private int Slot(int index) => (_head + index) % _items.Length;

    private void Grow()
    {
        var bigger = new T[_items.Length * 2];
        for (int i = 0; i < _count; i++) bigger[i] = _items[Slot(i)];
        _items = bigger;
        _head = 0;
    }
}
'''
time = "O(1) amortized per operation"
space = "O(n)"
justification = '''
Every operation except `ToArray` and `Grow` touches one slot and updates `_head` or `_count`
with a little modular arithmetic, so it is O(1). Adding at either end never shifts elements:
`AddFirst` steps the head backwards around the ring, `AddLast` writes just past the logical
end, and removals move the head or shrink the count.

`Grow` copies all `n` elements, which is O(n), but it runs only when the array is full and then
doubles it. Starting from 8 slots, reaching `n` elements triggers copies of 8 + 16 + 32 + … < 2n
elements in total, so the copying cost spread over the `n` insertions is constant: **O(1)
amortized** per operation. The indexer is O(1) because slot `(head + i) % capacity` is direct
arithmetic, which a linked list could not offer.

The array holds at most `2n` slots after doubling (plus the initial 8), so the space is
**O(n)**. Clearing freed slots with `default!` matters for reference types: otherwise the array
would keep removed objects reachable and the garbage collector could not reclaim them.
'''

# ── g7-ds ────────────────────────────────────────────────────────────

[[unit]]
id = "cs-u30-linked-list"
title = "Singly linked lists"
level = "advanced"
difficulty = 30
intro = '''
A linked list stores each value in its own node object that refers to the next one, so a
sequence becomes a chain of references instead of one contiguous block of memory. You will
define a generic `Node<T>` class, push and pop at the head, keep a tail reference for O(1)
appends, delete by rewiring with a dummy node, and finish by building a complete
`SinglyLinkedList<T>` that reverses itself in place without creating a single new node.
'''
concepts = '''
## The idea

A **linked list** stores a sequence as a chain of **nodes**. Each node holds a value and a **reference** to the next node, and the last node refers to nothing. The list itself is just a reference to the first node, the **head**. Nothing is contiguous: the nodes live wherever the garbage collector put them, connected only by references.

That layout trades one set of costs for another. Compared with `List<T>`, which is a resizable array:

- **Insert or remove at the head: O(1).** You only rewire a reference. `list.Insert(0, x)` must shift every element, which is O(n).
- **Insert after a node you already hold: O(1)**, for the same reason.
- **Access by index, search: O(n).** You must walk from the head, because no arithmetic jumps to element *i*.
- **Append at the tail: O(n)**, unless you also keep a reference to the last node. **Count: O(n)**, unless you store a counter.

In everyday C#, `List<T>`, `Queue<T>` and `Stack<T>` win: arrays are friendly to CPU caches. Linked lists still matter. Trees and graphs are built from the same kind of node, and "rewire two references" is the trick behind LRU caches and schedulers.

## How C# does it

A class variable already holds a reference, so a node is a small generic class. With nullable reference types on, `Node<T>?` says honestly that the next node may be missing:

```csharp
class Node<T>(T value, Node<T>? next = null)
{
    public T Value { get; } = value;
    public Node<T>? Next { get; set; } = next;
}
```

A walk is a loop that follows `Next` until `null`:

```csharp
for (var node = head; node is not null; node = node.Next)
    Console.WriteLine(node.Value);
```

The BCL already has `LinkedList<T>` in `System.Collections.Generic`, but it is **doubly** linked and hides its nodes' wiring. That is why this unit names its own type `SinglyLinkedList<T>`: it avoids confusion with a type the implicit usings already import.

## What is special or tricky

- **`NullReferenceException`** is the classic linked-list crash: following `Next` past the last node, or reading `head.Value` on an empty list. The compiler warns first with **CS8602** (dereference of a possibly null reference). Don't silence it with `!`; check `is not null`.
- **Generic values can't use `==`.** `node.Value == target` on a plain `T` is error **CS0019**. Compare with `EqualityComparer<T>.Default.Equals(a, b)`, which also handles `null`.
- **References are passed by value.** `head = head.Next` inside a method changes only the local copy. Return the new head, or keep it in a field of a list object.
- **Order of rewiring matters.** Overwrite `node.Next` before saving it and the rest of the chain is lost.
- **Recursion and long lists do not mix.** A recursive walk over a million nodes overflows the stack, and a `StackOverflowException` cannot be caught: the process dies. Use loops.

## What you will practise

You will build a list by pushing to the front, wrap it in a class with a tail reference and a count, and delete values with a dummy node. The challenge asks for a full `SinglyLinkedList<T>` with O(1) operations at both ends, removal by value and an in-place reversal, tested on a million nodes.
'''

[[unit.step]]
kind = "concept"
id = "cs-u30-c1-nodes"
title = "Nodes, references and null"
points = 5
difficulty = 30
intro = '''
A node holds a value and a reference to the next node, and `null` marks the end. The list
itself is nothing more than a reference to its first node, the head.
'''
body = '''
## The node

```csharp
class Node<T>(T value, Node<T>? next = null)
{
    public T Value { get; } = value;
    public Node<T>? Next { get; set; } = next;
}
```

`Next` refers to another `Node<T>`, or to `null` when there is no next node. An empty list is
a head that is `null`, so its type is `Node<T>?`.

## Push to the front

Make a new node whose `Next` is the current head, then move the head to it. No element moves,
so this is O(1) no matter how long the list is:

```csharp
head = new Node<int>(v, head);
```

## Walk the list

Follow `Next` from the head until you reach `null`:

```csharp
for (var node = head; node is not null; node = node.Next)
    Console.WriteLine(node.Value);
```

## Pop the front

Popping is the mirror image of pushing: remember the value, then move the head one node on.
The old first node is no longer referenced, and the garbage collector reclaims it.

```csharp
var value = head.Value;
head = head.Next;
```

Pushing to the front reverses insertion order: the last value pushed is the first one you
meet when walking. Appending to the end is the opposite story. Without a separate reference
to the last node you must walk the whole list to find it, which is O(n). Keeping a tail
reference, as the second drill does, makes appends O(1) again. Every linked-list operation
is some combination of these three moves: create a node, follow `Next`, and rewire `Next`.
'''

