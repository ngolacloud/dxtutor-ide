[unit.step.gabarito]
solution = '''
public record Product(string Sku, string Name, string Category, decimal Price);

public record Sale(string Sku, int Quantity);

public static class SalesReport
{
    public static Dictionary<string, decimal> RevenueByCategory(IEnumerable<Sale> sales, IEnumerable<Product> products)
    {
        ArgumentNullException.ThrowIfNull(sales);
        ArgumentNullException.ThrowIfNull(products);
        return sales
            .Join(products, s => s.Sku, p => p.Sku, (s, p) => (p.Category, Revenue: s.Quantity * p.Price))
            .GroupBy(x => x.Category)
            .ToDictionary(g => g.Key, g => g.Sum(x => x.Revenue));
    }

    public static List<string> TopSellers(IEnumerable<Sale> sales, IEnumerable<Product> products, int count)
    {
        ArgumentNullException.ThrowIfNull(sales);
        ArgumentNullException.ThrowIfNull(products);
        ArgumentOutOfRangeException.ThrowIfNegative(count);
        return sales
            .Join(products, s => s.Sku, p => p.Sku, (s, p) => (Product: p, s.Quantity))
            .GroupBy(x => x.Product, x => x.Quantity)
            .Select(g => (g.Key.Name, Units: g.Sum()))
            .OrderByDescending(x => x.Units)
            .ThenBy(x => x.Name, StringComparer.Ordinal)
            .Take(count)
            .Select(x => x.Name)
            .ToList();
    }

    public static List<string> Unsold(IEnumerable<Sale> sales, IEnumerable<Product> products)
    {
        ArgumentNullException.ThrowIfNull(sales);
        ArgumentNullException.ThrowIfNull(products);
        var sold = sales.Select(s => s.Sku).ToHashSet();
        return products
            .Where(p => !sold.Contains(p.Sku))
            .Select(p => p.Name)
            .Order(StringComparer.Ordinal)
            .ToList();
    }
}
'''
time = "O(s + p log p)"
space = "O(s + p)"
justification = '''
Let `s` be the number of sales and `p` the number of products. `Join` first reads the whole
catalog into a hash lookup keyed by SKU (**O(p)**), then streams the sales once, finding each
match in **O(1)** on average, so the join costs **O(s + p)** and yields at most `s` pairs.
`GroupBy` buckets those pairs with another hash table in **O(s)**, and summing visits each pair
once. `RevenueByCategory` stops there: **O(s + p)**. `TopSellers` then sorts at most `p` groups,
**O(p log p)**, and `Unsold` builds a `HashSet` of sold SKUs in O(s), filters the catalog in
O(p) and sorts the survivors in O(p log p). The worst case over the three methods is therefore
**O(s + p log p)**. The lookup, the groups and the sold set hold at most `s + p` entries, so the
space is **O(s + p)**.

The alternative of looping over the catalog for every sale would be O(s · p), 200 million
comparisons on the large test. The once-only rule is respected because `Join` enumerates each
input exactly once and `Unsold` materialises the sold SKUs before it walks the catalog; calling
`ToDictionary` or `ToList` at the end runs the pipeline immediately, so callers get a snapshot
instead of a query that would re-read the inputs.
'''

