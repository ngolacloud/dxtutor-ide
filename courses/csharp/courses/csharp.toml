[[unit.step]]
kind = "challenge"
id = "cs-u31-x1-hash-table"
title = "A resizing hash table from scratch"
points = 40
difficulty = 31
entry = "HashTable"
intro = '''
Every dictionary in every language is a variation on one design: an array of buckets, a hash
function, a collision strategy and a resizing policy. Writing one yourself shows why lookups
are O(1) on average, why inserts are O(1) only amortised, and why `Equals` and `GetHashCode`
must agree.
'''
instructions = '''
## Your turn

Complete the class `HashTable<TKey, TValue>`:

```csharp
public sealed class HashTable<TKey, TValue> where TKey : notnull
{
    public HashTable(int capacity = 8);
    public int Count { get; }
    public int Capacity { get; }                 // the number of buckets
    public TValue this[TKey key] { get; set; }
    public bool TryGetValue(TKey key, out TValue value);
    public bool ContainsKey(TKey key);
    public bool Remove(TKey key);
    public IEnumerable<TKey> Keys { get; }
}
```

Rules:

- Use **separate chaining** in an array of `capacity` buckets. Don't use `Dictionary`,
  `HashSet` or any other hashing collection to store the entries.
- A key lives in bucket `(hash & 0x7FFFFFFF) % Capacity`, where `hash` comes from
  `EqualityComparer<TKey>.Default.GetHashCode(key)`. Keys are compared with
  `EqualityComparer<TKey>.Default.Equals`, so different objects that are equal are the same
  key.
- The constructor throws `ArgumentOutOfRangeException` if `capacity` is less than 1.
- The indexer's setter adds the key or replaces its value. If an **add** makes `Count`
  exceed `0.75 * Capacity`, **double** the capacity and move every entry to its new bucket.
- The indexer's getter throws `KeyNotFoundException` for a missing key. `TryGetValue`
  returns `false` and sets `value` to `default` instead.
- `Remove` returns whether the key was present. Removing never shrinks the bucket array.
- A `null` key (possible at run time despite `notnull`) throws `ArgumentNullException`.
- `Keys` yields every key once, in any order.

Examples:

```csharp
var t = new HashTable<string, int>();
t["a"] = 1; t["b"] = 2; t["a"] = 3;
t["a"]                       // 3
t.Count, t.ContainsKey("b")  // 2, true
t.Remove("b")                // true
t.TryGetValue("b", out _)    // false
```

Starting from 8 buckets, the 7th key makes the table grow to 16 (7 > 6), and inserting 100
distinct keys leaves 256 buckets (8 -> 16 -> 32 -> 64 -> 128 -> 256).

Hidden tests decide correctness, including one with keys that all share one hash code and
one with 200,000 keys.
'''
starter = '''
// A generic hash table with separate chaining that doubles its bucket array
// when Count exceeds 0.75 * Capacity. Don't use Dictionary or HashSet inside.
public sealed class HashTable<TKey, TValue> where TKey : notnull
{
    public HashTable(int capacity = 8) => throw new NotImplementedException();

    public int Count => throw new NotImplementedException();

    // The number of buckets.
    public int Capacity => throw new NotImplementedException();

    // get: KeyNotFoundException when missing. set: add or replace (and grow if needed).
    public TValue this[TKey key]
    {
        get => throw new NotImplementedException();
        set => throw new NotImplementedException();
    }

    public bool TryGetValue(TKey key, out TValue value) => throw new NotImplementedException();

    public bool ContainsKey(TKey key) => throw new NotImplementedException();

    public bool Remove(TKey key) => throw new NotImplementedException();

    public IEnumerable<TKey> Keys => throw new NotImplementedException();
}
'''
tests = '''
// long.GetHashCode() is (int)v ^ (int)(v >> 32), so x * 0x1_0000_0001 hashes to 0 for every x.
long Colliding(int x) => x * 0x1_0000_0001L;
async Task<bool> FinishesWithin(double seconds, Action work)
{
    var task = Task.Run(work);
    if (await Task.WhenAny(task, Task.Delay(TimeSpan.FromSeconds(seconds))) != task) return false;
    await task;
    return true;
}

Test("set, get and replace", () =>
{
    var t = new HashTable<string, int>();
    t["a"] = 1;
    t["b"] = 2;
    t["a"] = 3;
    Equal(t["a"], 3);
    Equal(t["b"], 2);
    Equal(t.Count, 2);
    Check(t.ContainsKey("b"), "ContainsKey(\"b\") should be true");
});
Test("missing keys", () =>
{
    var t = new HashTable<string, int>();
    t["x"] = 10;
    Throws<KeyNotFoundException>(() => _ = t["y"]);
    Check(!t.TryGetValue("y", out var v) && v == 0, "TryGetValue must return false and default");
    Check(t.TryGetValue("x", out var x) && x == 10, "TryGetValue must find a present key");
    Check(!t.ContainsKey("y"), "ContainsKey on a missing key must be false");
    var empty = new HashTable<int, string>();
    Equal(empty.Count, 0);
    Check(!empty.ContainsKey(0), "an empty table contains nothing");
});
Test("null values are real values", () =>
{
    var t = new HashTable<int, string?>();
    t[1] = null;
    Check(t.ContainsKey(1), "a key mapped to null is present");
    Equal(t.Count, 1);
    Check(t[1] is null, "the stored value is null");
});
Test("remove", () =>
{
    var t = new HashTable<string, int>();
    t["a"] = 1; t["b"] = 2; t["c"] = 3;
    Check(t.Remove("b"), "Remove(\"b\") should return true");
    Check(!t.Remove("b"), "a second Remove(\"b\") should return false");
    Check(!t.Remove("zzz"), "Remove of a missing key returns false");
    Equal(t.Count, 2);
    Check(!t.ContainsKey("b"), "b is gone");
    Equal(t["a"], 1);
    Equal(t["c"], 3);
    t["b"] = 20;
    Equal(t["b"], 20);
    Equal(t.Count, 3);
});
Test("doubles past a load factor of 0.75", () =>
{
    var t = new HashTable<int, int>();
    Equal(t.Capacity, 8);
    for (var i = 0; i < 6; i++) t[i] = i;
    Equal(t.Capacity, 8);
    t[6] = 6;
    Equal(t.Capacity, 16);
    t[6] = 60;
    Equal(t.Capacity, 16);
    for (var i = 7; i < 100; i++) t[i] = i;
    Equal(t.Capacity, 256);
    Equal(t.Count, 100);
    for (var i = 0; i < 100; i++) Equal(t[i], i == 6 ? 60 : i);
    for (var i = 0; i < 100; i++) t.Remove(i);
    Equal(t.Count, 0);
    Equal(t.Capacity, 256);
    var small = new HashTable<int, int>(1);
    small[1] = 1;
    small[2] = 2;
    Equal(small.Capacity, 4);
    Throws<ArgumentOutOfRangeException>(() => new HashTable<int, int>(0));
});
Test("keys are compared with Equals, not by reference", () =>
{
    var t = new HashTable<string, int>();
    t["hello"] = 1;
    var built = new string(new[] { 'h', 'e', 'l', 'l', 'o' });
    Equal(t[built], 1);
    t[built] = 2;
    Equal(t.Count, 1);
    var pairs = new HashTable<(int, string), string>();
    pairs[(1, "a")] = "first";
    pairs[(1, "a")] = "again";
    Equal(pairs.Count, 1);
    Equal(pairs[(1, "a")], "again");
});
Test("colliding keys share one chain", () =>
{
    Equal(Colliding(5).GetHashCode(), Colliding(7).GetHashCode());
    var t = new HashTable<long, int>();
    for (var i = 0; i < 300; i++) t[Colliding(i)] = i;
    Equal(t.Count, 300);
    for (var i = 0; i < 300; i += 2) Check(t.Remove(Colliding(i)), $"Remove({i}) should succeed");
    Equal(t.Count, 150);
    for (var i = 0; i < 300; i++)
        Check(t.ContainsKey(Colliding(i)) == (i % 2 == 1), $"wrong membership for colliding key {i}");
    Equal(t[Colliding(299)], 299);
});
Test("Keys lists every key once", () =>
{
    var t = new HashTable<string, int>();
    foreach (var w in "one two three four five six seven eight nine ten".Split(' ')) t[w] = w.Length;
    t.Remove("five");
    var keys = t.Keys.ToList();
    Equal(keys.Count, 9);
    Equal(keys.ToHashSet(), new HashSet<string> { "one", "two", "three", "four", "six", "seven", "eight", "nine", "ten" });
    Equal(new HashTable<int, int>().Keys.Count(), 0);
});
Test("null keys are rejected", () =>
{
    var t = new HashTable<string, int>();
    Throws<ArgumentNullException>(() => t[null!] = 1);
    Throws<ArgumentNullException>(() => _ = t[null!]);
});
Test("matches Dictionary on random operations", () =>
{
    var rng = new Random(31);
    var t = new HashTable<int, int>(2);
    var reference = new Dictionary<int, int>();
    for (var step = 0; step < 5000; step++)
    {
        var key = rng.Next(-200, 200);
        switch (rng.Next(3))
        {
            case 0: t[key] = step; reference[key] = step; break;
            case 1: Equal(t.Remove(key), reference.Remove(key)); break;
            default: Equal(t.ContainsKey(key), reference.ContainsKey(key)); break;
        }
    }
    Equal(t.Count, reference.Count);
    foreach (var (k, v) in reference) Equal(t[k], v);
});
Test("200,000 keys in amortised O(1)", async () =>
{
    const int n = 200_000;
    var t = new HashTable<int, int>();
    var done = await FinishesWithin(10, () =>
    {
        for (var i = 0; i < n; i++) t[i * 7] = i;
        for (var i = 0; i < n; i += 2) t.Remove(i * 7);
    });
    Check(done, "200,000 inserts and 100,000 removals should take well under a second");
    if (!done) return;
    Equal(t.Count, n / 2);
    Check(t.Capacity >= n / 0.75 && t.Capacity <= 2 * (n / 0.75), $"the table should have grown by doubling, but Capacity is {t.Capacity}");
    var found = 0;
    for (var i = 0; i < n; i++) if (t.TryGetValue(i * 7, out var v) && v == i) found++;
    Equal(found, n / 2);
});
'''

[unit.step.gabarito]
solution = '''
// A generic hash table with separate chaining that doubles its bucket array
// when Count exceeds 0.75 * Capacity.
public sealed class HashTable<TKey, TValue> where TKey : notnull
{
    private sealed class Entry(TKey key, TValue value, Entry? next)
    {
        public readonly TKey Key = key;
        public TValue Value = value;
        public Entry? Next = next;
    }

    private const double MaxLoadFactor = 0.75;
    private static readonly EqualityComparer<TKey> Comparer = EqualityComparer<TKey>.Default;
    private Entry?[] _buckets;

    public HashTable(int capacity = 8)
    {
        ArgumentOutOfRangeException.ThrowIfLessThan(capacity, 1);
        _buckets = new Entry?[capacity];
    }

    public int Count { get; private set; }

    public int Capacity => _buckets.Length;

    public TValue this[TKey key]
    {
        get => TryGetValue(key, out var value) ? value : throw new KeyNotFoundException($"Key not found: {key}");
        set
        {
            var entry = Find(key, out var index);
            if (entry is not null)
            {
                entry.Value = value;
                return;
            }
            _buckets[index] = new Entry(key, value, _buckets[index]);   // push onto the chain
            Count++;
            if (Count > MaxLoadFactor * _buckets.Length) Resize(_buckets.Length * 2);
        }
    }

    public bool TryGetValue(TKey key, out TValue value)
    {
        var entry = Find(key, out _);
        value = entry is null ? default! : entry.Value;
        return entry is not null;
    }

    public bool ContainsKey(TKey key) => Find(key, out _) is not null;

    public bool Remove(TKey key)
    {
        var index = IndexOf(key, _buckets.Length);
        Entry? prev = null;
        for (var entry = _buckets[index]; entry is not null; prev = entry, entry = entry.Next)
        {
            if (!Comparer.Equals(entry.Key, key)) continue;
            if (prev is null) _buckets[index] = entry.Next;
            else prev.Next = entry.Next;
            Count--;
            return true;
        }
        return false;
    }

    public IEnumerable<TKey> Keys
    {
        get
        {
            foreach (var head in _buckets)
                for (var entry = head; entry is not null; entry = entry.Next)
                    yield return entry.Key;
        }
    }

    private static int IndexOf(TKey key, int length)
    {
        if (key is null) throw new ArgumentNullException(nameof(key));
        return (Comparer.GetHashCode(key) & 0x7FFFFFFF) % length;
    }

    private Entry? Find(TKey key, out int index)
    {
        index = IndexOf(key, _buckets.Length);
        for (var entry = _buckets[index]; entry is not null; entry = entry.Next)
            if (Comparer.Equals(entry.Key, key)) return entry;
        return null;
    }

    private void Resize(int newLength)
    {
        var old = _buckets;
        _buckets = new Entry?[newLength];
        foreach (var head in old)
        {
            var entry = head;
            while (entry is not null)
            {
                var next = entry.Next;                 // relink the existing entries: no allocation
                var index = IndexOf(entry.Key, newLength);
                entry.Next = _buckets[index];
                _buckets[index] = entry;
                entry = next;
            }
        }
    }
}
'''
time = "O(1) average per lookup/remove; O(1) amortised per insert; O(n) worst case"
space = "O(n)"
justification = '''
`TryGetValue`, `ContainsKey`, `Remove` and the getter hash the key once and scan a single
chain. Because the table doubles whenever the load factor passes 0.75, the average chain
holds fewer than one entry plus a constant, so these operations are **O(1) on average**.
They degrade to **O(n)** only when every key collides, as with the test's `long` keys whose
hash codes are all 0: then one chain holds everything and each lookup walks it.

The setter is O(1) plus an occasional resize. A resize to 2m buckets relinks all ~0.75·m
entries in O(m), but it happens only after the number of entries has doubled since the last
one. Over n inserts the resize costs form a geometric series (… + n/4 + n/2 + n < 2n), so
each insert is **O(1) amortised**. That is why 200,000 inserts finish in milliseconds, while a
table stuck at 8 buckets would scan chains of 25,000 entries on every operation. The resize
reuses the `Entry` objects and only rewires their `Next`, so it allocates nothing but the new
array; each entry must still be rehashed, because its index depends on the array length.

Space is **O(n)**: one `Entry` per key plus a bucket array within a constant factor of the
peak size (it never shrinks). Pushing new entries at the head of a chain keeps the add O(1)
after the duplicate check, and removing with a `prev` reference unlinks in place.
'''

[[unit]]
id = "cs-u32-binary-search-tree"
title = "Binary search trees"
level = "advanced"
difficulty = 32
intro = '''
A binary search tree keeps its keys in order by construction: smaller keys go left, larger
keys go right, so every search discards a whole subtree at each step. You will insert keys
and read them back sorted, search with a loop while counting comparisons, compare a balanced
tree with a degenerate one, and finish with a generic `Bst<T>` that supports deletion.
'''
concepts = '''
## The idea

A **binary tree** is made of nodes with up to two children, **left** and **right**. A **binary search tree** (BST) adds one rule, the **BST property**: for every node, all keys in its left subtree are smaller than its key, and all keys in its right subtree are larger.

That rule turns the tree into a decision procedure. To find a key, compare it with the root: equal means found, smaller means go left, larger means go right. Each comparison discards a whole subtree. Insertion follows the same path and hangs a new leaf where the search fell off the tree.

The cost of every operation is the length of one root-to-leaf path, **O(h)**, where *h* is the tree's **height**:

- If keys arrive in random order, the tree stays bushy and h is about 2·log₂ n: **O(log n)**.
- If keys arrive **sorted**, every new key becomes the right child of the previous one. The tree is a linked list in disguise, h = n, and every operation is **O(n)**.

An **in-order traversal** (left subtree, node, right subtree) visits the keys in ascending order, so a BST also sorts.

**Self-balancing** trees (red-black, AVL) rotate nodes on insert and delete to keep h = O(log n) whatever the input. In real C# code you use `SortedSet<T>` and `SortedDictionary<TKey, TValue>`, which are red-black trees. This unit builds the plain, unbalanced version so you can see what balancing protects you from.

## How C# does it

A generic tree needs ordered keys, so it constrains `T`:

```csharp
class Node<T>(T key) where T : IComparable<T>
{
    public T Key = key;
    public Node<T>? Left, Right;
}
```

`a.CompareTo(b)` returns a negative number, zero or a positive number. The step from node to child is then:

```csharp
var cmp = key.CompareTo(node.Key);
node = cmp < 0 ? node.Left : node.Right;
```

## What is special or tricky

- **`<` doesn't work on a generic `T`.** `key < node.Key` is error **CS0019**; call `CompareTo`. Without the `where T : IComparable<T>` constraint, `CompareTo` itself is missing (**CS1061**).
- **Test the sign, not the value.** `CompareTo` may return -5 or 42, not just -1 and 1. Write `cmp < 0`, never `cmp == -1`.
- **Strings compare by culture** with `CompareTo`. When the order must be the same everywhere, pass `StringComparer.Ordinal` as an `IComparer<string>`.
- **Deep recursion can kill the process.** A degenerate tree of a million nodes makes a recursive insert a million calls deep, and a `StackOverflowException` cannot be caught. Loops are safer for insert, search and delete.
- **Deleting a node with two children** is the one hard case: you replace its key with its **in-order successor**, the smallest key of its right subtree.

## What you will practise

You will insert keys and traverse them in order, search with a loop that counts comparisons, and measure the height of a balanced and a degenerate tree. The challenge asks for a `Bst<T>` with add, search, delete, min, max, height and an in-order iterator, tested on 200,000 random keys.
'''

[[unit.step]]
kind = "concept"
id = "cs-u32-c1-bst-property"
title = "The BST property and O(h)"
points = 5
difficulty = 32
intro = '''
One ordering rule, applied at every node, is enough to make search fast. The price is that
the speed depends on the tree's shape, which depends on the order in which the keys arrived.
'''
body = '''
## The rule

For every node: keys in the left subtree are smaller, keys in the right subtree are larger.
Keys are unique, so equal means "found".

```text
        50
      /    \
    30      70
   /  \    /  \
  20  40  60  80
```

## Search and insert

Searching for 60: 60 > 50, go right; 60 < 70, go left; found. Three comparisons out of seven
keys. Inserting 65 follows the same path (50, 70, 60) and attaches 65 as the right child of
60, where the search fell off the tree. In C# the comparison is `key.CompareTo(node.Key)`,
whose **sign** says which way to go.

## Height decides everything

Every operation walks one path from the root, so it costs **O(h)**. The tree above has height
3 for 7 keys, about log₂ n. Insert 20, 30, 40, 50, 60, 70, 80 in sorted order instead and
each key becomes the right child of the previous one: a chain of height 7, where search is a
linear scan.

## In-order traversal

Visit the left subtree, then the node, then the right subtree. Because everything on the left
is smaller and everything on the right is larger, this prints the keys in ascending order:
20 30 40 50 60 70 80. Sorting by inserting into a BST and traversing it is O(n log n) on random
input, and O(n²) on sorted input. Balanced trees such as the red-black tree inside
`SortedSet<T>` remove that worst case by restructuring themselves as they grow.
'''

[[unit.step]]
kind = "drill"
id = "cs-u32-d1-insert-inorder"
title = "Insert keys, read them back sorted"
points = 10
difficulty = 32
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
Recursive insertion mirrors the definition of a BST: an empty tree becomes a single node,
otherwise the key goes into the left or right subtree. An in-order traversal then reads the
keys back in ascending order, whatever order they were inserted in.
'''
prompt = '''
Insert eight keys (one of them twice) into a BST with a recursive generic `Insert`, then
print the in-order traversal and the number of distinct keys.

**Why:** the recursive shape of insert and traverse is the template for every tree
algorithm, and the sorted output proves the BST property holds.
'''
target = '''
Node<int>? root = null;
foreach (var key in new[] { 50, 30, 70, 20, 40, 60, 80, 40 })
    root = Insert(root, key);
var keys = new List<int>();
InOrder(root, keys);
Console.WriteLine($"{string.Join(" ", keys)} ({keys.Count} keys)");

static Node<T> Insert<T>(Node<T>? node, T key) where T : IComparable<T>
{
    if (node is null) return new Node<T>(key);
    var cmp = key.CompareTo(node.Key);
    if (cmp < 0) node.Left = Insert(node.Left, key);
    else if (cmp > 0) node.Right = Insert(node.Right, key);
    return node;
}

static void InOrder<T>(Node<T>? node, List<T> output)
{
    if (node is null) return;
    InOrder(node.Left, output);
    output.Add(node.Key);
    InOrder(node.Right, output);
}

class Node<T>(T key)
{
    public T Key { get; } = key;
    public Node<T>? Left { get; set; }
    public Node<T>? Right { get; set; }
}
'''
