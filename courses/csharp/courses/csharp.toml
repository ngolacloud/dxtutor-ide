[[unit.step]]
kind = "drill"
id = "cs-u07-d2-list"
title = "Grow and shrink a List<T>"
points = 10
difficulty = 7
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
`Add` at the end of a list is amortised O(1), but `Insert(0, …)` and `RemoveAt` near the front
shift every later element, which is O(n). Watching `Capacity` while you add shows the doubling
strategy at work, and copying a list shows the difference between a second reference and a
second list.
'''
prompt = '''
Build a small task queue with `Add`, `Insert`, `Remove` and `RemoveAt`, query it, print the
list's capacity after each of nine appends, and compare an alias with a real copy.

**Why:** knowing which list operations are cheap and which ones shift elements is what keeps
everyday code fast, and the alias versus copy difference causes real bugs.
'''
target = '''
List<string> queue = ["write", "test"];
queue.Add("review");
queue.Insert(0, "plan");
Console.WriteLine($"{queue.Count}: {string.Join(" -> ", queue)}");

queue.Remove("test");
queue.RemoveAt(queue.Count - 1);
Console.WriteLine(string.Join(" -> ", queue));
Console.WriteLine(queue.Contains("review"));
Console.WriteLine(queue.IndexOf("write"));

List<int> sizes = new();
for (int i = 0; i < 9; i++)
{
    sizes.Add(i);
    Console.Write($"{sizes.Capacity} ");
}
Console.WriteLine();

List<string> alias = queue;
List<string> copy = new(queue);
