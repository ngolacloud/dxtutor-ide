[[unit]]
id = "cs-u26-cancellation-channels"
title = "Cancellation, timeouts and channels"
level = "advanced"
difficulty = 26
intro = '''
Real asynchronous work must be stoppable: a user presses Cancel, a request runs past its
deadline, or one part of a pipeline fails and the rest should give up. You will cancel work
cooperatively with `CancellationToken`, put deadlines on slow operations, connect producers to
consumers with `System.Threading.Channels`, and finish by writing a bounded worker pool that
stops cleanly on cancellation and on failure.
'''
concepts = '''
## The idea

An operation that may run for a long time needs a way to be told "stop now". Killing a thread
from the outside is unsafe, because it could die halfway through updating shared state. .NET
therefore uses **cooperative cancellation**: the caller raises a flag, and the work checks that
flag at points where stopping is safe, then unwinds normally with an exception.

The second idea of this unit is the **producer/consumer** pattern. One part of a program
produces items (lines read from a file, requests from a socket) and another consumes them, at
a different speed. A queue between them decouples the two. If the queue has a **bound**, a
fast producer has to wait when it is full, which is called **backpressure**, so memory stays
bounded.

## How C# does it

A `CancellationTokenSource` owns the flag, and its `Token` is the read-only view you pass
down to the work. `Cancel()` raises the flag now, and `CancelAfter(timeout)` (or the
constructor that takes a `TimeSpan`) raises it later, which is how timeouts are built:

```csharp
using var cts = new CancellationTokenSource(TimeSpan.FromSeconds(2));
foreach (var file in files)
{
    cts.Token.ThrowIfCancellationRequested();
    await ProcessAsync(file, cts.Token);
}
```

`ThrowIfCancellationRequested()` throws `OperationCanceledException`. Library methods that
accept a token, such as `Task.Delay(ms, token)`, throw `TaskCanceledException`, which derives
from it. `CancellationTokenSource.CreateLinkedTokenSource(a, b)` makes a source that is
cancelled when any of its parents is, or when you cancel it yourself.

A **channel** is an async, thread-safe queue in `System.Threading.Channels`:

```csharp
var channel = Channel.CreateBounded<string>(capacity: 100);
await channel.Writer.WriteAsync("job");     // waits while the channel is full
channel.Writer.Complete();                  // no more items will come
await foreach (var job in channel.Reader.ReadAllAsync())
    Console.WriteLine(job);                 // ends once completed and drained
```

## Pitfalls

- **Catch `OperationCanceledException`, not `TaskCanceledException`.** Your own checks throw
  the base type, so a `catch (TaskCanceledException)` misses them.
- **A token does nothing by itself.** A loop that never checks it, or a call that is not
  given it, keeps running after `Cancel()`.
- **Forgetting `Writer.Complete()`** leaves every `ReadAllAsync` loop waiting forever: the
  program hangs instead of crashing.
- **Dispose the source.** `CancellationTokenSource` may hold a timer, so create it with
  `using`.
- Channels need `using System.Threading.Channels;` (it is not an implicit using). Without it,
  `Channel.CreateBounded` fails with error CS0103, "The name 'Channel' does not exist in the
  current context".
- `Task.WhenAll` waits for *all* tasks. If one consumer fails and the others keep waiting for
  items that will never come, nothing finishes unless you cancel them.

## What you will practise

You will stop a loop cooperatively, add timeouts and linked tokens, and pass items through a
bounded channel. The challenge combines all three: a worker pool that keeps results in input
order, honours cancellation, and turns one failure into a clean shutdown.
'''

[[unit.step]]
kind = "concept"
id = "cs-u26-c1-cooperative"
title = "Cooperative cancellation and backpressure"
points = 5
difficulty = 26
intro = '''
Cancellation in .NET is a request, not an order: the code being cancelled decides where it is
safe to stop. Channels add the other half of a robust pipeline, a bounded queue that slows a
fast producer down instead of letting memory grow without limit.
'''
body = '''
## Source and token

A `CancellationTokenSource` is the remote control and a `CancellationToken` is the receiver.
The code that may want to stop work keeps the source, and the work receives only the token,
so it can observe cancellation but never trigger it:

```csharp
using var cts = new CancellationTokenSource();
Task work = RunAsync(cts.Token);
cts.Cancel();
```

Inside the work, check the token where stopping is safe, typically once per loop iteration,
and pass it on to every async call that accepts one:

```csharp
token.ThrowIfCancellationRequested();
await Task.Delay(100, token);
```

Both throw an `OperationCanceledException`, which unwinds the stack normally: `finally`
blocks and `using` disposals still run. A task that ends this way is in the **Canceled**
state rather than Faulted, and awaiting it rethrows the exception.

## Timeouts

A timeout is just cancellation driven by a timer: `new CancellationTokenSource(timeout)` or
`cts.CancelAfter(timeout)`. To combine "the caller cancelled" with "my own deadline passed",
link the two: `CreateLinkedTokenSource(callerToken)` plus `CancelAfter`.

## Bounded channels

`Channel.CreateBounded<T>(n)` holds at most `n` items. `WriteAsync` waits while it is full,
so a producer can never run more than `n` items ahead of its consumers. `Complete()` tells
the readers that no more items will come, and `ReadAllAsync` ends once the channel is both
completed and empty.
'''

