[[unit.step]]
kind = "drill"
id = "cs-u32-d3-height"
title = "Height: balanced versus degenerate"
points = 10
difficulty = 32
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
The same fifteen keys can form a tree of height 4 or a chain of height 15, depending only on
insertion order. Measuring both makes the gap between O(log n) and O(n) concrete.
'''
prompt = '''
Insert the keys 1 to 15 in sorted order, build a second tree from the same keys by always
choosing the middle key first, and print both heights.

**Why:** the height is the cost of every operation, and sorted input is the worst case for
an unbalanced BST, which is common in practice (IDs, timestamps).
'''
target = '''
int[] sorted = Enumerable.Range(1, 15).ToArray();
Node? chain = null;
foreach (var key in sorted)
    chain = Insert(chain, key);
var balanced = Build(sorted, 0, sorted.Length - 1);
Console.WriteLine($"sorted inserts: height {Height(chain)}");
Console.WriteLine($"middle first:   height {Height(balanced)}");

static Node Insert(Node? node, int key)
{
    if (node is null) return new Node(key);
    if (key < node.Key) node.Left = Insert(node.Left, key);
    else node.Right = Insert(node.Right, key);
    return node;
}

static Node? Build(int[] keys, int lo, int hi)
{
    if (lo > hi) return null;
    var mid = lo + (hi - lo) / 2;
    return new Node(keys[mid]) { Left = Build(keys, lo, mid - 1), Right = Build(keys, mid + 1, hi) };
}

static int Height(Node? node) =>
    node is null ? 0 : 1 + Math.Max(Height(node.Left), Height(node.Right));

class Node(int key)
{
    public int Key { get; } = key;
    public Node? Left { get; set; }
    public Node? Right { get; set; }
}
'''
