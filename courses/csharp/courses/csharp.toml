target = '''
using System.Globalization;

CultureInfo.CurrentCulture = CultureInfo.InvariantCulture;
string[] keys = ["apple", "banana", "cherry", "grape", "lemon", "mango"];
const int Buckets = 8;
foreach (var key in keys)
{
    var hash = Hash(key);
    Console.WriteLine($"{key,-7} hash={hash,11} bucket={BucketOf(hash, Buckets)}");
}
Console.WriteLine($"-7 % 8 = {-7 % 8}, but BucketOf(-7, 8) = {BucketOf(-7, 8)}");

static int Hash(string s)
{
    var h = 0;
    foreach (var c in s)
        h = unchecked(h * 31 + c);
    return h;
}

static int BucketOf(int hash, int buckets) => (hash & 0x7FFFFFFF) % buckets;
'''
