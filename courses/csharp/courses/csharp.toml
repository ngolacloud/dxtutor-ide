[[unit.step]]
kind = 'challenge'
id = 'cs-u23-x1-lazy-operators'
title = 'Two lazy sequence operators'
points = 40
difficulty = 23
entry = 'Seq'
intro = '''
Streaming algorithms process data that may be too large to hold in memory, reading each element
once and keeping only a small amount of state. Run-length encoding needs one pending run, and a
sliding window needs the last `k` elements. Written as iterators, both read exactly as far as
the consumer asks.
'''
instructions = '''
## Your turn

Implement two extension methods in the static class `Seq`:

```csharp
public static IEnumerable<(T Value, int Count)> Runs<T>(this IEnumerable<T> source);
public static IEnumerable<T[]> Windows<T>(this IEnumerable<T> source, int size);
```

**`Runs`** performs run-length encoding: each group of consecutive equal elements becomes one
`(Value, Count)` pair. Compare with `EqualityComparer<T>.Default`.

**`Windows`** yields every window of `size` consecutive elements, sliding one element at a
time. Each window is a **new array** that later windows must not change.

Rules for both:

- **Lazy and streaming.** Yield each result as soon as it is known and read the source only as
  far as needed. The tests use sources of a million elements and stop early with `Take`.
  Enumerate the source once; don't call `Count()` or `ToList()` on it.
- **Validate eagerly.** A null `source` throws `ArgumentNullException`, and a `size` below 1
  throws `ArgumentOutOfRangeException`, at the **call**, before anything is enumerated.

Examples:

- `"aaabccdd".Runs()` gives `('a', 3), ('b', 1), ('c', 2), ('d', 2)`.
- `new[] { 1, 1, 2, 1 }.Runs()` gives `(1, 2), (2, 1), (1, 1)`: only *adjacent* values merge.
- `new[] { 1, 2, 3, 4, 5 }.Windows(3)` gives `[1, 2, 3], [2, 3, 4], [3, 4, 5]`.
- `new[] { 1, 2 }.Windows(3)` and any empty source give nothing.

**Hint:** use the wrapper-plus-local-iterator shape: a public method that validates and returns
a private iterator. For `Runs`, use the enumerator directly and keep the current value and its
count. For `Windows`, a `Queue<T>` holds the last `size` elements and `ToArray()` copies them.

Hidden tests decide correctness.
'''
starter = '''
public static class Seq
{
    // Run-length encoding: each group of consecutive equal elements becomes (Value, Count).
    // Lazy and streaming; a null source throws ArgumentNullException at the call.
    public static IEnumerable<(T Value, int Count)> Runs<T>(this IEnumerable<T> source)
    {
        throw new NotImplementedException();
    }

    // Every window of `size` consecutive elements, each as a new array.
    // Lazy and streaming; validate `source` and `size` (at least 1) at the call.
    public static IEnumerable<T[]> Windows<T>(this IEnumerable<T> source, int size)
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
