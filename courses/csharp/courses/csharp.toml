[unit.step.gabarito]
solution = '''
// A stable merge sort that also counts inversions (pairs i < j with items[i] > items[j]).
public static class MergeSorter
{
    public static (T[] Sorted, long Inversions) SortAndCount<T>(IReadOnlyList<T> items, IComparer<T>? comparer = null)
    {
        ArgumentNullException.ThrowIfNull(items);
        comparer ??= Comparer<T>.Default;
        var data = items.ToArray();          // a copy: the input stays untouched
        var buffer = new T[data.Length];     // one scratch array, reused by every merge
        var inversions = SortRange(data, buffer, 0, data.Length, comparer);
        return (data, inversions);
    }

    // Sorts data[lo..hi) and returns the number of inversions inside that range.
    private static long SortRange<T>(T[] data, T[] buffer, int lo, int hi, IComparer<T> comparer)
    {
        if (hi - lo < 2) return 0;
        var mid = lo + (hi - lo) / 2;
        var count = SortRange(data, buffer, lo, mid, comparer) + SortRange(data, buffer, mid, hi, comparer);

        int i = lo, j = mid, k = lo;
        while (i < mid && j < hi)
        {
            if (comparer.Compare(data[j], data[i]) < 0)
            {
                count += mid - i;            // data[j] jumps over every remaining left item
                buffer[k++] = data[j++];
            }
            else
            {
                buffer[k++] = data[i++];     // ties take from the left: stable, and not counted
            }
        }
        while (i < mid) buffer[k++] = data[i++];
        while (j < hi) buffer[k++] = data[j++];
        Array.Copy(buffer, lo, data, lo, hi - lo);
        return count;
    }
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
This is merge sort with one extra line. The recursion halves the range about log₂ n times
(18 levels for 200,000 items), and each level merges n items in total, so the time is
**O(n log n)** for random and reversed input alike. A brute-force double loop would examine
n(n − 1)/2 ≈ 2·10¹⁰ pairs for 200,000 items, which takes far longer than the deadline.

The counting is correct because every inversion is of exactly one kind: both items in the
left half, both in the right half (counted by the recursive calls), or one in each. When the
merge takes `data[j]` from the right half because it is **strictly** smaller than `data[i]`,
it is also smaller than every remaining left item `data[i..mid)`, since the left half is
sorted. Each of those `mid - i` items came before `data[j]` in the original order, so each
forms one inversion, and adding them in one step keeps the merge linear. Taking the left item
on ties keeps equal items in their original order (stability) and never counts them. The
count is a `long` because a reversed array of 200,000 items has 19,999,900,000 inversions,
about nine times `int.MaxValue`.

Space is **O(n)**: one copy of the input that becomes the result, plus one buffer of the same
size reused by every merge, instead of slicing new arrays at every level. The recursion adds
only O(log n) stack frames.
'''

[[unit]]
id = "cs-u34-recursion-dp"
title = "Recursion and dynamic programming"
level = "advanced"
difficulty = 34
intro = '''
Recursion solves a problem by solving smaller copies of itself, and dynamic programming makes
that fast when the same copies come up again and again. You will recurse over a tree of
records, count how much work naive Fibonacci wastes compared with a memo, fill a
two-dimensional table bottom-up, and finish by computing the edit distance between two
strings of 2,000 characters.
'''
concepts = '''
## The idea

**Recursion** solves a problem by reducing it to smaller instances of the same problem. Every recursive definition needs a **base case** that is answered directly and a **recursive case** that moves towards it. At run time each pending call occupies a **stack frame**, so recursion depth costs memory.

Some recursions repeat themselves. Naive Fibonacci computes `Fib(n - 2)` from two different branches, and the repetition compounds into exponential time, about O(1.6ⁿ). **Dynamic programming** (DP) applies when a problem has two properties:

- **overlapping subproblems**: the same smaller question is asked again and again;
- **optimal substructure**: the best answer is built from the best answers to smaller questions.

DP solves each subproblem **once** and stores the answer. There are two styles:

- **Top-down memoisation** keeps the recursion but caches results, checking the cache before computing.
- **Bottom-up tabulation** fills a table from the smallest subproblems upward, with no recursion at all.

The recipe is always the same: define the subproblem in words ("the answer for the first *i* items"), write the **recurrence** that builds it from smaller ones, fix the base cases, and choose an evaluation order in which every dependency is ready. The cost is the number of subproblems times the work per subproblem.

## How C# does it

Recursion is ordinary method calls, and **local functions** can call themselves directly:

```csharp
long Paths(int r, int c) => r == 0 || c == 0 ? 1 : Paths(r - 1, c) + Paths(r, c - 1);
Console.WriteLine(Paths(2, 2));   // 6
```

A lambda can't refer to itself in its own initializer, which is one reason local functions exist. For a memo, a `Dictionary<int, long>` or a `Dictionary<(int, int), long>` keyed by a tuple works well, because tuples have value equality. For tables, a **rectangular array** is allocated in one piece and zero-filled:

```csharp
var table = new long[rows + 1, cols + 1];   // table[r, c]
```

## What is special or tricky

- **Stack overflow is fatal.** The CLR does no guaranteed tail-call optimisation, a thread's stack is about 1 MB on Windows by default, and a `StackOverflowException` **cannot be caught**: the process simply dies. Deep problems call for bottom-up loops.
- **A missing or unreachable base case** recurses until that crash.
- **Numbers overflow silently.** `Fib(93)` doesn't fit in a `long`, and the default unchecked arithmetic wraps to a negative number. Use `checked` to throw instead, or `System.Numerics.BigInteger` for exact huge values.
- **Jagged arrays need every row.** `new long[rows][]` creates `null` rows, so `table[0][0]` throws `NullReferenceException` until each row is allocated. A rectangular `long[,]` has no such trap.
- **Rolling rows.** When each row of a table depends only on the previous row, keep two rows: O(cols) space instead of O(rows × cols).

## What you will practise

You will recurse over a folder tree, count the calls made by naive and memoised Fibonacci, and fill a grid table bottom-up. The challenge asks for the edit distance between two strings of up to 2,000 characters, too large for naive recursion and too deep for top-down recursion on a thread-pool thread.
'''

[[unit.step]]
kind = "concept"
id = "cs-u34-c1-recursion-memo"
title = "Base cases, overlap and the memo"
points = 5
difficulty = 34
intro = '''
A recursive function needs a base case (when to stop) and a recursive case (how to shrink the
problem). When subproblems repeat, storing their answers removes the exponential blow-up;
that is all dynamic programming is.
'''
body = '''
## Recursion

A base case plus a smaller call:

```csharp
static long Factorial(int n) =>
    n <= 1 ? 1               // base case
           : n * Factorial(n - 1);   // recursive case
```

## The overlap problem

Naive Fibonacci asks the same questions over and over:

```csharp
static long Fib(int n) => n < 2 ? n : Fib(n - 1) + Fib(n - 2);
```

`Fib(5)` calls `Fib(3)` twice and `Fib(2)` three times. The call tree roughly doubles at every
level, so the work grows exponentially even though there are only n + 1 different questions.

## Memoisation (top-down)

Keep the recursion and remember each answer the first time it is computed:

```csharp
static long Fib(int n, Dictionary<int, long> memo)
{
    if (n < 2) return n;
    if (!memo.TryGetValue(n, out var known))
        memo[n] = known = Fib(n - 1, memo) + Fib(n - 2, memo);
    return known;
}
```

Now each `Fib(k)` is computed once: O(n) time.

## Tabulation (bottom-up)

Fill an array from the smallest case upward, so every value needed is already there:

```csharp
var dp = new long[n + 1];
dp[1] = 1;
for (var i = 2; i <= n; i++) dp[i] = dp[i - 1] + dp[i - 2];
```

No recursion means no stack to overflow. The general recipe: define the subproblem, write the
recurrence, set the base cases, and fill the table in an order where every dependency comes
first.
'''

