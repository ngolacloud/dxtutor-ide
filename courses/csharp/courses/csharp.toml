[[unit.step]]
kind = "challenge"
id = "cs-u20-x1-semver"
title = "A semantic version type"
points = 30
difficulty = 20
entry = "SemVer"
intro = '''
Package managers compare versions such as `1.10.0` and `1.9.0-beta` all day, and comparing them
as strings gets both equality and order wrong. A version type with value equality, a matching
hash code and a natural order that agree with each other works correctly in dictionaries, sets,
sorts and `Max`.
'''
instructions = '''
## Your turn

Implement the sealed class `SemVer`, a simplified [semantic version](https://semver.org):

```csharp
public SemVer(int major, int minor, int patch, string? preRelease = null)
public int Major { get; }   public int Minor { get; }   public int Patch { get; }
public string? PreRelease { get; }
public static SemVer Parse(string text)
// IEquatable<SemVer>, IComparable<SemVer>, Equals(object?), GetHashCode(), ToString()
// operators == != < > <= >=
```

**Construction.** Negative numbers throw `ArgumentOutOfRangeException`. A null or empty
`preRelease` means a normal release, and `PreRelease` is then `null`.

**Parsing.** `Parse` accepts exactly `MAJOR.MINOR.PATCH` or `MAJOR.MINOR.PATCH-LABEL`. Each number
is one or more ASCII digits that fit in an `int`; the label is one or more ASCII letters, digits,
dots or hyphens. Anything else (missing parts, signs, spaces, an empty label, overflow) throws
`FormatException`. `ToString` returns the canonical text, for example `1.2.3` or `2.0.0-rc.1`.

**Equality.** Two versions are equal when all three numbers and the label are equal (ordinal,
case-sensitive). Override `Equals(object?)` and `GetHashCode` consistently, so that equal
versions work as the same `Dictionary` key and collapse in a `HashSet`. `==` and `!=` must agree
with `Equals` and accept nulls.

**Order.** Compare `Major`, then `Minor`, then `Patch` numerically, so `1.10.0` is newer than
`1.9.0`. With equal numbers, a release is newer than any pre-release (`1.0.0-rc` < `1.0.0`), and
two labels compare with `string.CompareOrdinal` (`alpha` < `beta`). `CompareTo(null)` is
positive. `<`, `>`, `<=` and `>=` follow `CompareTo`, with `null` smaller than any version.
`CompareTo` returns 0 exactly when `Equals` is true.

**Hint:** `HashCode.Combine`, `int.TryParse` with `NumberStyles.None` and
`CultureInfo.InvariantCulture`, and `Comparer<SemVer>.Default`, which already handles nulls.

Hidden tests decide correctness.
'''
starter = '''
using System.Globalization;

// A simplified semantic version: MAJOR.MINOR.PATCH with an optional -LABEL.
// Equality, GetHashCode and ordering must all agree.
public sealed class SemVer : IEquatable<SemVer>, IComparable<SemVer>
{
    public SemVer(int major, int minor, int patch, string? preRelease = null)
    {
        throw new NotImplementedException();
    }

    public int Major => throw new NotImplementedException();
    public int Minor => throw new NotImplementedException();
    public int Patch => throw new NotImplementedException();
    public string? PreRelease => throw new NotImplementedException();

    public static SemVer Parse(string text) => throw new NotImplementedException();

    public bool Equals(SemVer? other) => throw new NotImplementedException();
    public override bool Equals(object? obj) => throw new NotImplementedException();
    public override int GetHashCode() => throw new NotImplementedException();
    public int CompareTo(SemVer? other) => throw new NotImplementedException();
    public override string ToString() => throw new NotImplementedException();

    public static bool operator ==(SemVer? left, SemVer? right) => throw new NotImplementedException();
    public static bool operator !=(SemVer? left, SemVer? right) => throw new NotImplementedException();
    public static bool operator <(SemVer? left, SemVer? right) => throw new NotImplementedException();
    public static bool operator >(SemVer? left, SemVer? right) => throw new NotImplementedException();
    public static bool operator <=(SemVer? left, SemVer? right) => throw new NotImplementedException();
    public static bool operator >=(SemVer? left, SemVer? right) => throw new NotImplementedException();
}
'''
tests = '''
static SemVer V(string s) => SemVer.Parse(s);
Test("parses and prints canonical versions", () =>
{
    var v = V("1.12.3");
    Equal(v.Major, 1);
    Equal(v.Minor, 12);
    Equal(v.Patch, 3);
    Equal(v.PreRelease, null);
    Equal(v.ToString(), "1.12.3");
    var rc = V("2.0.0-rc.1");
    Equal(rc.PreRelease, "rc.1");
    Equal(rc.ToString(), "2.0.0-rc.1");
    Equal(V("0.0.0").ToString(), "0.0.0");
    Equal(new SemVer(3, 4, 5, "beta-2").ToString(), "3.4.5-beta-2");
});
Test("rejects malformed text with FormatException", () =>
{
    foreach (string bad in new[] { "", "1.2", "1.2.3.4", "a.b.c", "1.2.-3", "+1.2.3", " 1.2.3", "1.2.3 ",
                                   "1.2.3-", "1.2.3-beta 2", "1..3", "99999999999.0.0", "1.2.3-é" })
        Throws<FormatException>(() => SemVer.Parse(bad));
});
Test("constructor validation", () =>
{
    Throws<ArgumentOutOfRangeException>(() => new SemVer(-1, 0, 0));
    Throws<ArgumentOutOfRangeException>(() => new SemVer(1, -2, 0));
    Throws<ArgumentOutOfRangeException>(() => new SemVer(1, 0, -3));
    Equal(new SemVer(1, 0, 0, "").PreRelease, null);
    Check(new SemVer(1, 0, 0, "") == new SemVer(1, 0, 0), "an empty label means a release");
});
Test("Equals is reflexive, symmetric and null-safe", () =>
{
    SemVer a = V("1.2.3"), b = V("1.2.3"), c = V("1.2.3-rc"), d = V("1.2.4");
    Check(a.Equals(a), "reflexive");
    Check(a.Equals(b) && b.Equals(a), "symmetric for equal values");
    Check(!a.Equals(c) && !c.Equals(a), "a label makes a different version");
    Check(!a.Equals(d), "different patch");
    Check(!a.Equals((object)"1.2.3"), "a string is never equal to a version");
    Check(a.Equals((object)b), "object overload agrees with the typed one");
    Check(!V("1.0.0-RC").Equals(V("1.0.0-rc")), "labels are case-sensitive");
    Check(!a.Equals((SemVer?)null), "Equals(null) is false");
    Check(!V("1.2.3").Equals((object?)null), "Equals((object)null) is false");
});
Test("== and != agree with Equals and accept null", () =>
{
    SemVer? none = null;
    SemVer a = V("4.5.6");
    Check(a == V("4.5.6"), "equal values are ==");
    Check(a != V("4.5.7"), "different values are !=");
    Check(none == null, "null == null");
    Check(a != null && null != a, "a version is never == null");
    Check(!(a == none), "a == null is false");
});
Test("equal versions have equal hash codes and dedupe in a HashSet", () =>
{
    Equal(V("1.2.3").GetHashCode(), V("1.2.3").GetHashCode());
    Equal(V("1.2.3-beta").GetHashCode(), new SemVer(1, 2, 3, "beta").GetHashCode());
    var set = new HashSet<SemVer> { V("1.2.3"), V("1.2.3"), V("1.2.3-rc"), new SemVer(1, 2, 3), V("2.0.0") };
    Equal(set.Count, 3);
    Check(set.Contains(V("1.2.3-rc")), "Contains finds an equal, freshly parsed version");
    Check(!set.Contains(V("1.2.3-RC")), "a different label is not found");
});
Test("works as a Dictionary key", () =>
{
    var notes = new Dictionary<SemVer, string> { [V("1.0.0")] = "first release" };
    notes[new SemVer(1, 0, 0)] = "first release, revised";
    Equal(notes.Count, 1);
    Equal(notes[V("1.0.0")], "first release, revised");
    Check(!notes.ContainsKey(V("1.0.0-rc")), "the pre-release is a different key");
    Check(notes.TryGetValue(V("1.0.0"), out var text) && text == "first release, revised", "TryGetValue");
});
Test("orders numerically, with pre-releases first", () =>
{
    var shuffled = new[] { "2.0.0", "1.0.0", "1.10.0", "1.0.0-beta", "1.9.0", "1.0.1", "1.0.0-alpha", "1.0.0-alpha.1", "0.9.9" }
        .Select(V).ToList();
    shuffled.Sort();
    Equal(shuffled.Select(v => v.ToString()).ToList(), new List<string>
        { "0.9.9", "1.0.0-alpha", "1.0.0-alpha.1", "1.0.0-beta", "1.0.0", "1.0.1", "1.9.0", "1.10.0", "2.0.0" });
    Equal(shuffled.Max()!.ToString(), "2.0.0");
});
Test("comparison operators and CompareTo agree with Equals", () =>
{
    Check(V("1.9.0") < V("1.10.0"), "1.9.0 < 1.10.0");
    Check(V("1.0.0") > V("1.0.0-rc"), "release > pre-release");
    Check(V("1.0.0-alpha") < V("1.0.0-beta"), "alpha < beta");
    Check(V("3.0.0") <= V("3.0.0") && V("3.0.0") >= V("3.0.0"), "<= and >= include equality");
    Check(!(V("3.0.0") < V("3.0.0")), "< is strict");
    Check(V("1.0.0").CompareTo(null) > 0, "CompareTo(null) is positive");
    SemVer? none = null;
    Check(none < V("0.0.0") && V("0.0.0") > none, "null sorts first");
    var all = new[] { "1.2.3", "1.2.3", "1.2.3-rc", "1.2.4", "0.1.0", "1.2.3-RC" }.Select(V).ToList();
    foreach (var x in all)
        foreach (var y in all)
        {
            int c = x.CompareTo(y);
            Check((c == 0) == x.Equals(y), $"CompareTo and Equals disagree on {x} vs {y}");
            Check(Math.Sign(c) == -Math.Sign(y.CompareTo(x)), $"CompareTo is not antisymmetric on {x} vs {y}");
        }
});
Test("sorts many versions", () =>
{
    var rng = new Random(42);
    var versions = Enumerable.Range(0, 20_000)
        .Select(_ => new SemVer(rng.Next(5), rng.Next(30), rng.Next(30), rng.Next(3) == 0 ? "rc" : null))
        .ToList();
    var expected = versions.OrderBy(v => (v.Major, v.Minor, v.Patch, v.PreRelease is null ? 1 : 0))
        .Select(v => v.ToString()).ToList();
    versions.Sort();
    Equal(versions.Select(v => v.ToString()).ToList(), expected);
    Check(versions.Distinct().Count() <= 5 * 30 * 30 * 2, "Distinct uses Equals and GetHashCode");
});
'''

[unit.step.gabarito]
solution = '''
using System.Globalization;
using System.Text.RegularExpressions;

// A simplified semantic version: MAJOR.MINOR.PATCH with an optional -LABEL.
// Equality, GetHashCode and ordering must all agree.
public sealed class SemVer : IEquatable<SemVer>, IComparable<SemVer>
{
    private static readonly Regex Pattern =
        new(@"\A(?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<patch>[0-9]+)(?:-(?<pre>[0-9A-Za-z.-]+))?\z");

    public SemVer(int major, int minor, int patch, string? preRelease = null)
    {
        ArgumentOutOfRangeException.ThrowIfNegative(major);
        ArgumentOutOfRangeException.ThrowIfNegative(minor);
        ArgumentOutOfRangeException.ThrowIfNegative(patch);
        Major = major;
        Minor = minor;
        Patch = patch;
        PreRelease = string.IsNullOrEmpty(preRelease) ? null : preRelease;
    }

    public int Major { get; }
    public int Minor { get; }
    public int Patch { get; }
    public string? PreRelease { get; }

    public static SemVer Parse(string text)
    {
        ArgumentNullException.ThrowIfNull(text);
        Match m = Pattern.Match(text);
        if (!m.Success) throw new FormatException($"'{text}' is not a version");
        string? pre = m.Groups["pre"].Success ? m.Groups["pre"].Value : null;
        return new SemVer(Number(m, "major", text), Number(m, "minor", text), Number(m, "patch", text), pre);
    }

    private static int Number(Match m, string group, string text) =>
        int.TryParse(m.Groups[group].Value, NumberStyles.None, CultureInfo.InvariantCulture, out int n)
            ? n
            : throw new FormatException($"'{text}': the {group} number is too large");

    public bool Equals(SemVer? other) =>
        other is not null
        && Major == other.Major && Minor == other.Minor && Patch == other.Patch
        && string.Equals(PreRelease, other.PreRelease, StringComparison.Ordinal);

    public override bool Equals(object? obj) => Equals(obj as SemVer);

    public override int GetHashCode() => HashCode.Combine(Major, Minor, Patch, PreRelease);

    public int CompareTo(SemVer? other)
    {
        if (other is null) return 1;
        int c = Major.CompareTo(other.Major);
        if (c != 0) return c;
        c = Minor.CompareTo(other.Minor);
        if (c != 0) return c;
        c = Patch.CompareTo(other.Patch);
        if (c != 0) return c;
        return (PreRelease, other.PreRelease) switch
        {
            (null, null) => 0,
            (null, _) => 1,      // a release is newer than any of its pre-releases
            (_, null) => -1,
            var (mine, theirs) => string.CompareOrdinal(mine, theirs),
        };
    }

    public override string ToString() => PreRelease is null
        ? string.Create(CultureInfo.InvariantCulture, $"{Major}.{Minor}.{Patch}")
        : string.Create(CultureInfo.InvariantCulture, $"{Major}.{Minor}.{Patch}-{PreRelease}");

    public static bool operator ==(SemVer? left, SemVer? right) => left is null ? right is null : left.Equals(right);
    public static bool operator !=(SemVer? left, SemVer? right) => !(left == right);
    public static bool operator <(SemVer? left, SemVer? right) => Comparer<SemVer>.Default.Compare(left, right) < 0;
    public static bool operator >(SemVer? left, SemVer? right) => Comparer<SemVer>.Default.Compare(left, right) > 0;
    public static bool operator <=(SemVer? left, SemVer? right) => Comparer<SemVer>.Default.Compare(left, right) <= 0;
    public static bool operator >=(SemVer? left, SemVer? right) => Comparer<SemVer>.Default.Compare(left, right) >= 0;
}
'''
time = "O(L) per operation; O(n log n) to sort"
space = "O(L)"
justification = '''
Let **L** be the length of the version text or label. `Parse` runs an anchored regex with no
nested quantifiers, so matching is linear, O(L), and the three `int.TryParse` calls together read
at most L digits. `Equals`, `GetHashCode` and `CompareTo` compare three integers in O(1) and the
labels in at most **O(L)** (ordinal comparison and string hashing are linear in the length), so
every operation is effectively constant time for realistic versions. Sorting n versions with
`List<T>.Sort` makes O(n log n) comparisons, and dictionary or set operations stay O(1) on
average because the hash code spreads versions across buckets. Space is O(L) for the stored
label.

Correctness hangs on the contract. `Equals`, `GetHashCode` and `CompareTo` all look at exactly the
same four fields, so equal versions hash alike (dictionaries and sets work), and `CompareTo`
returns 0 exactly when `Equals` is true (sorting, `Max` and `SortedSet` agree with `HashSet`).
All fields are get-only, so a version's hash can never change while it is a key. Comparing the
numbers as integers, not as text, is what puts `1.10.0` after `1.9.0`. `int.TryParse` with
`NumberStyles.None` rejects signs and spaces and turns overflow into a `FormatException` instead
of an `OverflowException`.
'''

[[unit]]
id = "cs-u21-immutability"
title = "Immutability"
level = "intermediate"
difficulty = 21
intro = '''
An object that can never change after it is built is easy to reason about: it can be shared
between threads, used as a dictionary key, and kept as a history entry without defensive copies.
C# offers immutability at every level, from `readonly` fields and `init` accessors to records with
`with` expressions and the `System.Collections.Immutable` collections. You will use each of them,
learn where immutability is only shallow, and finish with an immutable shopping cart whose every
change returns a new version.
'''
concepts = '''
## The idea

A **mutable** object changes in place: after `list.Add(x)`, everyone holding that list sees `x`.
An **immutable** object is fixed once constructed; to "change" it you build a new object with the
difference. That sounds wasteful, but it buys a lot:

- **Safe sharing.** Nobody can modify a value behind your back, so no defensive copies.
- **Thread safety.** Several threads can read an immutable object without locks.
- **Stable keys.** The hash code of an immutable key can never change while it sits in a set.
- **History for free.** Old versions stay valid, which makes undo and audit trails trivial.

Immutable collections avoid copying everything by **structural sharing**: a new version reuses
most of the old one's internal nodes.

## How C# does it

```csharp
public sealed class Account
{
    private readonly string _iban;                  // assignable only in a constructor
    public Account(string iban) => _iban = iban;
    public required string Owner { get; init; }     // set once, in an object initializer
    public decimal Limit { get; init; } = 500m;
}

public record Point(int X, int Y);                  // positional properties are init-only
var moved = new Point(1, 2) with { Y = 5 };         // a modified copy: Point(1, 5)
```

`readonly struct` and `readonly record struct` make value types immutable as a whole. For
collections, `IReadOnlyList<T>` is a read-only **view** (the owner can still change the data),
while `ImmutableList<T>`, `ImmutableArray<T>`, `ImmutableDictionary<K,V>` and
`ImmutableHashSet<T>` from `System.Collections.Immutable` are truly frozen: `Add`, `Remove` and
`SetItem` return a **new** collection and leave the original untouched.

```csharp
ImmutableList<int> a = ImmutableList.Create(1, 2);
ImmutableList<int> b = a.Add(3);   // a is still [1, 2]
```

## Errors and pitfalls

- **CS0191**: assigning a `readonly` field outside a constructor.
- **CS0200**: assigning a get-only property.
- **CS8852**: assigning an `init` property after the object initializer.
- **CS9035**: forgetting to set a `required` member.
- **Immutability is shallow.** `readonly List<string> _tags` freezes the reference, not the
  list. A record with a `List<T>` property can still be mutated, and `with` copies that reference,
  so the copy and the original share one list.
- **Record equality is shallow too.** Two records holding equal but distinct lists are not equal,
  because lists compare by reference.
- **Ignoring the result.** `prices.Add("tea", 3m);` on an immutable dictionary compiles and
  changes nothing. Always use the returned collection.
- **Views are not snapshots.** `list.AsReadOnly()` reflects later changes to `list`;
  `list.ToImmutableList()` copies.
- **Cost model.** `ImmutableList<T>` is a balanced tree, so indexing and updates are O(log n).
  `ImmutableArray<T>` reads like an array but copies on every change. Build large collections
  with a builder.

## What you will practise

You will combine `readonly`, `init` and `required`, use `with` and expose the shallow-copy trap,
then work with immutable lists, dictionaries, builders and snapshots. The challenge implements an
immutable shopping cart where every operation returns a new cart and old versions stay intact.
'''

[[unit.step]]
kind = "concept"
id = "cs-u21-c1-why-immutable"
title = "Values that never change"
points = 5
difficulty = 21
intro = '''
An immutable object's state is fixed at construction, so any reference to it can be shared
freely. Changes become new objects, and persistent data structures make that affordable by
sharing the unchanged parts between versions.
'''
body = '''
## Mutation is shared by everyone

```csharp
var tags = new List<string> { "new" };
var a = tags;
a.Add("sale");
Console.WriteLine(tags.Count);   // 2: a and tags are the same list
```

Any code holding a reference to a mutable object can change it for everyone else. Bugs appear
far from their cause, and multithreaded code needs locks.

## Change by creating

With an immutable type, an operation that "changes" a value returns a new one:

```csharp
var p1 = new Point(1, 2);
var p2 = p1 with { X = 10 };     // p1 is still (1, 2)

var v1 = ImmutableList.Create("new");
var v2 = v1.Add("sale");         // v1 still has one item
```

Both versions remain valid, so keeping a history (for undo, auditing or comparing before and
after) is just keeping references.

## Structural sharing

Copying a whole collection on every change would cost O(n). `ImmutableList<T>` is a balanced
binary tree instead: adding an item creates only the O(log n) nodes on the path to the change
and reuses every other node from the previous version. Old and new versions share most of their
memory, and because neither can change, the sharing is completely safe.

## How deep does it go?

Immutability is only as deep as its weakest part. A type is fully immutable when all its fields
are read-only **and** every object they refer to is itself immutable. A `readonly` field that
holds a `List<T>` is a fixed pointer to a changeable list.
'''

[[unit.step]]
kind = "drill"
id = "cs-u21-d1-readonly-init"
title = "readonly, init and required"
points = 10
difficulty = 21
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
C# can freeze state at three moments: a `readonly` field is set in the constructor, an `init`
property in the object initializer, and a `required` member forces callers to provide it. Each
restriction is enforced by the compiler, but `readonly` protects a reference, not the object it
points to.
'''
prompt = '''
Build an `Order` whose state is fixed after construction, "change" it by creating a new one, and
see that a `readonly` list field can still be modified.

**Why:** these modifiers let the compiler guarantee that an object stays valid after it is
built, and knowing their limits prevents false confidence.
'''
target = '''
var order = new Order(1001) { Customer = "Ana", Notes = "leave at door" };
Console.WriteLine(order);
Order changed = order.WithNotes("ring twice");
Console.WriteLine(changed);
Console.WriteLine(order.Notes);
Console.WriteLine(ReferenceEquals(order, changed));

var box = new TagBox();
box.Tags.Add("fragile");
box.Tags.Add("heavy");
Console.WriteLine(string.Join(",", box.Tags));

sealed class Order
{
    private readonly int _id;
    public Order(int id) => _id = id;
    public int Id => _id;
    public required string Customer { get; init; }
    public string Notes { get; init; } = "";
    public Order WithNotes(string notes) => new(_id) { Customer = Customer, Notes = notes };
    public override string ToString() => $"#{_id} {Customer}: {Notes}";
}

sealed class TagBox
{
