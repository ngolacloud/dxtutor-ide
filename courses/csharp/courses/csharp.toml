[[unit.step]]
kind = "challenge"
id = "cs-u26-x1-worker-pool"
title = "A cancellable worker pool"
points = 40
difficulty = 26
entry = "WorkerPool"
intro = '''
A worker pool spreads independent jobs over a fixed number of concurrent workers fed by a
bounded queue. Making it production-ready is about the unhappy paths: the caller cancels, or
one job fails while others are still running, and the pool must stop promptly instead of
hanging or leaking work.
'''
instructions = '''
## Your turn

Implement the static method `WorkerPool.RunAsync`:

```csharp
public static Task<List<TOut>> RunAsync<TIn, TOut>(
    IReadOnlyList<TIn> items,
    Func<TIn, CancellationToken, Task<TOut>> work,
    int workers,
    int capacity,
    CancellationToken cancellationToken = default)
```

It calls `work` once for every element of `items`, using **exactly `workers` concurrent
consumers** fed by a **bounded channel** of the given `capacity`, and returns the results **in
the order of `items`**.

Rules:

- `workers` or `capacity` below 1: throw `ArgumentOutOfRangeException`.
- At most `workers` calls to `work` may run at the same time, and with enough items, more than
  one must run at once. The hidden tests count the calls in flight.
- Pass a token to every call of `work`.
- **Cancellation:** when `cancellationToken` is cancelled, start no new calls, and make the
  returned task end with an `OperationCanceledException`. If the token is already cancelled,
  call `work` not even once.
- **Failure:** if a call to `work` throws, cancel the calls still running and make the returned
  task fail with **that exception**, not with a cancellation. This must not hang, even with one
  worker and a full channel.
- Empty `items` returns an empty list without calling `work`.

Examples:

- `RunAsync([1, 2, 3], (x, ct) => Task.FromResult(x * 10), 2, 1)` returns `[10, 20, 30]`.
- With a token that cancels after 100 ms and jobs that each take 40 ms, the task throws an
  `OperationCanceledException` soon after 100 ms.

**Hint:** create a linked token source from `cancellationToken` and use its token everywhere.
One producer writes the indexes `0..n-1` into the channel and completes the writer in a
`finally`. Each consumer reads indexes with `ReadAllAsync(token)`, stores
`results[i] = await work(items[i], token)` in an array, and on any exception cancels the linked
source before rethrowing. `Task.WhenAll` reports a failed task's exception in preference to
cancellations.

Hidden tests decide correctness.
'''
