prompt = '''
Write `IsBalanced`, which checks that every `(`, `[` and `{` is closed by the matching bracket
in the right order, and test it on five strings.

**Why:** compilers, JSON parsers and editors that highlight matching brackets all use this
stack algorithm.
'''
target = '''
string[] samples = { "(a[b]{c})", "([)]", "((", "", "}" };
foreach (string s in samples)
{
    Console.WriteLine($"\"{s}\" balanced: {IsBalanced(s)}");
}

static bool IsBalanced(string text)
{
    var open = new Stack<char>();
    foreach (char c in text)
    {
        switch (c)
        {
            case '(' or '[' or '{':
                open.Push(c);
                break;
            case ')' or ']' or '}':
                char expected = c switch { ')' => '(', ']' => '[', _ => '{' };
                if (!open.TryPop(out char top) || top != expected) return false;
                break;
        }
    }
    return open.Count == 0;
}
'''
