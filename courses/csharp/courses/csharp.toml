prompt = '''
Build a tiny project tree in a temporary folder, list its `.cs` files as sorted relative paths,
take a file name apart with `Path`, and compare `Path.Combine` with `Path.Join`.

**Why:** tools such as linters and build systems walk trees all day. Relative, normalised and
