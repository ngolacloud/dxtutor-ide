        throw new NotImplementedException();
    }

    // Return the exact average of a and b, fraction included, even for huge values.
    public static double Average(int a, int b)
    {
        throw new NotImplementedException();
    }

    // Add taxPercent percent to price and round to 2 decimals, halves away from zero.
    public static decimal PriceWithTax(decimal price, decimal taxPercent)
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
Test("multiplies small numbers", () => Equal(Calc.MultiplyWide(3, 4), 12L));
Test("multiplies past the int limit", () => Equal(Calc.MultiplyWide(int.MaxValue, 2), 4294967294L));
Test("multiplies negatives", () => Equal(Calc.MultiplyWide(-50_000, 60_000), -3_000_000_000L));
Test("multiplies the smallest ints", () => Equal(Calc.MultiplyWide(int.MinValue, int.MinValue), 4611686018427387904L));
Test("multiplies by zero", () => Equal(Calc.MultiplyWide(0, int.MaxValue), 0L));
Test("average keeps the fraction", () => Equal(Calc.Average(3, 4), 3.5));
Test("average of equal numbers", () => Equal(Calc.Average(10, 10), 10.0));
Test("average with negatives", () => Equal(Calc.Average(-7, 2), -2.5));
Test("average does not overflow", () => Equal(Calc.Average(int.MaxValue, int.MaxValue), 2147483647.0));
Test("average of the extremes", () => Equal(Calc.Average(int.MinValue, int.MaxValue), -0.5));
Test("adds tax", () => Equal(Calc.PriceWithTax(10.00m, 23m), 12.30m));
Test("zero tax keeps the price", () => Equal(Calc.PriceWithTax(19.99m, 0m), 19.99m));
Test("rounds to two decimals", () => Equal(Calc.PriceWithTax(9.99m, 6m), 10.59m));
Test("rounds halves away from zero", () => Equal(Calc.PriceWithTax(1.50m, 3m), 1.55m));
Test("rounds 0.055 up to 0.06", () => Equal(Calc.PriceWithTax(0.05m, 10m), 0.06m));
Test("rounds 2.675 up to 2.68", () => Equal(Calc.PriceWithTax(2.5m, 7m), 2.68m));
Test("free stays free", () => Equal(Calc.PriceWithTax(0m, 23m), 0m));
'''

[unit.step.gabarito]
solution = '''
// Calc: arithmetic that does not overflow, truncate or round the wrong way.
public static class Calc
{
    // Return a * b as a long, without overflowing.
    public static long MultiplyWide(int a, int b)
    {
        return (long)a * b;
    }

    // Return the exact average of a and b, fraction included, even for huge values.
    public static double Average(int a, int b)
    {
        return ((long)a + b) / 2.0;
    }

    // Add taxPercent percent to price and round to 2 decimals, halves away from zero.
    public static decimal PriceWithTax(decimal price, decimal taxPercent)
    {
        decimal total = price + price * taxPercent / 100m;
        return Math.Round(total, 2, MidpointRounding.AwayFromZero);
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Each method performs a fixed handful of arithmetic operations on fixed-size values (a 64-bit
`long`, a 64-bit `double`, a 128-bit `decimal`), no matter which numbers it receives, so the
time is **O(1)**. No collection or string is created, only a few temporary values, so the extra
space is **O(1)** too.

What makes the answers right is *where* the conversion happens. `(long)a * b` widens `a`
before multiplying, so the product is computed in 64 bits; `(long)(a * b)` would multiply in
32 bits, overflow, and only then widen the already wrong result. In `Average`, `(long)a + b`
cannot overflow and dividing by `2.0` keeps the fraction. In `PriceWithTax`, `decimal` holds
`2.675` exactly, so `MidpointRounding.AwayFromZero` sees a true half and rounds it to `2.68`; a
`double` would store something like 2.67499999 and round down.
'''

[[unit]]
id = "cs-u03-strings"
title = "Strings and text"
level = "basic"
difficulty = 3
intro = '''
Text is everywhere in programs: names, messages, file paths, JSON. In C# text is a `string`, an
immutable sequence of characters with a rich set of methods. This unit covers asking a string
questions, building strings with interpolation, verbatim and raw literals, and assembling text
efficiently with `StringBuilder`.
'''
concepts = '''
## The idea

A **string** is a sequence of characters. In C# each character is a `char`, a 16-bit UTF-16
code unit, and a `string` is a read-only array of them with a known `Length`. Strings are
**immutable**: once created, a string never changes. Every method that seems to modify one,
such as `ToUpper` or `Replace`, actually returns a **new** string and leaves the original as
it was. That makes strings safe to share, but it means you must keep the result.

## How C# does it

```csharp
string s = "Hello, World";
char first = s[0];              // 'H': positions start at 0
char last = s[^1];              // 'd': ^1 counts from the end
string word = s.Substring(7, 5); // "World": start index, then a length
bool has = s.Contains("lo");    // true
string[] parts = "a,b,c".Split(',');
string joined = string.Join("-", parts); // "a-b-c"
```

`==` compares strings by their **content**, so `"ab" == "a" + "b"` is `true`. It is
case-sensitive; `string.Equals(a, b, StringComparison.OrdinalIgnoreCase)` ignores case.

C# has several ways to write a string literal:

- **Interpolated** `$"Total: {count * 2}"` evaluates the expressions inside `{ }`, and can
  format them: `{price:F2}` (two decimals), `{name,8}` (right-aligned in 8 columns).
- **Verbatim** `@"C:\temp\new"` treats backslashes as plain characters; a quote is written
  `""`.
- **Raw** `"""..."""` (C# 11) holds any text, quotes and newlines included, with no escaping
  at all. It is ideal for JSON, SQL or multi-line messages.

Joining many pieces with `+` in a loop copies the growing string each time. A
`StringBuilder` (in `System.Text`) keeps a resizable buffer instead: you `Append` pieces
and call `ToString()` once at the end.

## What is special or tricky

- **You cannot change a character.** `s[0] = 'h';` is `CS0200: Property or indexer
  'string.this[int]' cannot be assigned to -- it is read only`.
- **Ignoring the result does nothing.** `s.ToUpper();` on its own line compiles, but `s` is
  unchanged. Write `s = s.ToUpper();`.
- **Backslashes need care.** `"C:\data"` is `CS1009: Unrecognized escape sequence`; use
  `"C:\\data"` or `@"C:\data"`.
- **`char` and `string` differ.** `'ab'` is `CS1012: Too many characters in character
  literal`; a `char` holds exactly one character.
- **Indexes are checked at run time.** `s[99]` throws `IndexOutOfRangeException`, and
  `Substring` with a start or length past the end throws `ArgumentOutOfRangeException`.
- **`Length` is a property, not a method.** `s.Length()` is `CS1955: Non-invocable member
  'string.Length' cannot be used like a method`.

## What you will practise

You will query a string with indexes and methods, format values with interpolation, write
verbatim and raw literals, and build a multi-line text with `StringBuilder`. Then you will
write a `TextTools` class that turns titles into URL slugs and masks card numbers.
'''

[[unit.step]]
kind = "concept"
id = "cs-u03-c1-immutable"
title = "Immutable sequences of characters"
points = 5
difficulty = 3
intro = '''
Under the hood a string is a length plus a block of 16-bit characters, and that block is never
written to again after the string is created. Immutability is a deliberate design choice: it
lets the runtime share strings freely and makes them safe to use as dictionary keys. The cost
is that every "change" allocates a new string.
'''
body = '''
## Indexes start at zero

```text
 H  e  l  l  o
 0  1  2  3  4      s[0] is 'H', s[4] is 'o'
^5 ^4 ^3 ^2 ^1      s[^1] is 'o' too
```

`s.Length` is 5, so the last valid index is `s.Length - 1`. Reading `s[5]` throws an
`IndexOutOfRangeException` when the program runs.

## Methods return new strings

```csharp
string name = "ada";
string upper = name.ToUpper();
Console.WriteLine(name);  // ada   (unchanged)
Console.WriteLine(upper); // ADA   (a new string)
```

Because `name` cannot change, `ToUpper` builds a new string and returns it. The same holds for
`Trim`, `Replace`, `Substring`, `Insert` and every other method that seems to edit text. If
you want the variable to hold the new text, assign it back: `name = name.ToUpper();`.

## Content equality

Two different string objects with the same characters are equal: `==` compares the
characters, not where the strings live in memory. That is different from most other classes
you will write, where `==` asks "is this the very same object?". Strings behave like values
even though they are objects.

## When to use StringBuilder

Building a long text from many small pieces with `+` copies everything built so far at each
step, which adds up to a lot of copying. A `StringBuilder` grows one buffer and copies each
piece once, so it is the tool for building text in a loop.
'''

