target = '''
foreach (var status in new[] { 200, 503, 404 })
{
    try
    {
        Fetch(status);
        Console.WriteLine($"{status}: ok");
    }
    catch (ApiException e) when (e.Status >= 500)
    {
        Console.WriteLine($"{status}: server error, retry later");
    }
    catch (ApiException e)
    {
        Console.WriteLine($"{status}: client error: {e.Message}");
    }
}

try
{
    LoadUser("x9");
}
catch (InvalidOperationException e)
{
    Console.WriteLine($"{e.Message} <- {e.InnerException?.GetType().Name}");
