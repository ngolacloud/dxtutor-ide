[[unit.step]]
kind = 'challenge'
id = 'cs-u25-x1-inventory'
title = 'A thread-safe inventory'
points = 40
difficulty = 25
entry = 'Inventory'
intro = '''
Shared counters and stock levels are where race conditions cost real money: a lost update
miscounts the stock, and an unprotected check-then-act sells the same item twice. A correct
design makes every read-modify-write atomic, with a lock or with compare-and-swap, so that any
interleaving of threads gives the same totals as some sequential order would.
'''
instructions = '''
## Your turn

Implement the class `Inventory`. Many threads will call its methods **at the same time**, so
every method must be thread-safe and no update may ever be lost.

```csharp
public sealed class Inventory
{
    public void Add(string item, int quantity);
    public bool TryRemove(string item, int quantity);
    public int Count(string item);
    public Dictionary<string, int> Snapshot();
}
```

- **`Add`** adds `quantity` units of `item`. A `quantity` of 0 or less throws
  `ArgumentOutOfRangeException`.
- **`TryRemove`** removes `quantity` units **only if** at least that many are in stock, and
  returns `true`. Otherwise it changes nothing and returns `false`. The check and the removal
  must be **one atomic step**: stock can never go negative, and the same unit can never be
  removed twice. A `quantity` of 0 or less throws `ArgumentOutOfRangeException`.
- **`Count`** returns the units of `item` in stock right now, or 0 for an item never added.
- **`Snapshot`** returns a new dictionary with the current stock, leaving out items with 0
  units. Later changes to the inventory must not affect a snapshot already returned.

The hidden tests start eight threads together and run hundreds of thousands of operations, for
example 400,000 concurrent `Add` calls on one item, or 16,000 attempts to remove 10,000 units.
An unsynchronised `Dictionary` or an `if (stock >= q) stock -= q` without a lock will fail them.

Examples (single-threaded):

- `Add("apple", 3)`, `Add("apple", 2)`, then `Count("apple")` is 5.
- With 5 bolts, `TryRemove("bolt", 3)` is `true`, then `TryRemove("bolt", 3)` is `false`
  and `Count("bolt")` stays 2.
- `Count("ghost")` is 0 and `TryRemove("ghost", 1)` is `false`.

**Hint:** either guard a plain `Dictionary` with one private lock object in every method, or use
a `ConcurrentDictionary<string, int>`: `AddOrUpdate` for `Add`, and a loop around `TryGetValue`
and `TryUpdate` (compare-and-swap) for `TryRemove`. Add `using System.Collections.Concurrent;`
if you need it.

Hidden tests decide correctness.
'''
