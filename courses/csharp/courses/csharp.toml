[[unit.step]]
kind = "challenge"
id = "cs-u28-x1-lru-cache"
title = "An LRU cache"
points = 40
difficulty = 28
entry = "LruCache"
intro = '''
A cache with a fixed capacity must decide what to throw away when it is full. **Least recently
used** eviction discards the entry that has gone unused the longest, and pairing a hash map
with a doubly linked list makes every operation, including the eviction, O(1).
'''
instructions = '''
## Your turn

Implement the generic class `LruCache<TKey, TValue>`:

```csharp
public LruCache(int capacity)
public int Capacity { get; }
public int Count { get; }
public bool TryGet(TKey key, out TValue value)
public void Put(TKey key, TValue value)
public bool Remove(TKey key)
public List<TKey> KeysByRecency()        // most recently used first
```

Rules:

- `capacity` below 1 throws `ArgumentOutOfRangeException`.
- `TryGet` returns `true` and the value when the key is present, and marks that key as the
  **most recently used**. When the key is missing it returns `false`, sets `value` to
  `default` and changes nothing.
- `Put` inserts or updates a key and marks it as most recently used. Updating an existing key
  never evicts anything. Inserting a new key into a full cache first **evicts the least
  recently used** key.
- `Remove` deletes a key and returns whether it was present.
- `KeysByRecency` returns the keys from most to least recently used.
- Every operation except `KeysByRecency` must be **O(1)**. A hidden test runs 300,000
  operations on a cache of 20,000 entries against a time limit.

Examples, with capacity 2:

- `Put("a", 1)`, `Put("b", 2)`, `TryGet("a", out _)`, `Put("c", 3)`: `b` was the least
  recently used, so it is evicted, and `KeysByRecency()` is `["c", "a"]`.
- `Put("a", 1)`, `Put("b", 2)`, `Put("a", 10)`: no eviction; `a` now maps to 10 and is the
  most recent.

**Hint:** keep a `Dictionary<TKey, LinkedListNode<(TKey Key, TValue Value)>>` and a
`LinkedList<(TKey Key, TValue Value)>` in recency order, newest at the front. To mark a node as
used, `Remove(node)` and `AddFirst(node)`. To evict, look at `Last`: the node stores its key,
so you can remove it from the dictionary too.

Hidden tests decide correctness.
'''
