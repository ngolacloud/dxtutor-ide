    Equal((letters.Min, letters.Max), ('b', 'x'));
    var dates = MinMaxStack.Of(new DateOnly(2024, 5, 1), new DateOnly(1999, 12, 31), new DateOnly(2030, 1, 1));
    dates.Pop();
    Equal(dates.Max, new DateOnly(2024, 5, 1));
    Equal(dates.Min, new DateOnly(1999, 12, 31));
});
Test("duplicates are handled", () =>
{
    var s = MinMaxStack.Of(2, 1, 1, 7, 7);
    s.Pop();
    Equal(s.Max, 7);
    s.Pop();
    Equal(s.Max, 2);
    s.Pop();
    Equal(s.Min, 1);
    s.Pop();
    Equal(s.Min, 2);
});
Test("negatives and extreme values", () =>
{
