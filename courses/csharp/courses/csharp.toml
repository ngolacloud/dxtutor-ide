    "`Clone` copies the elements into a new array; it returns `object`, hence the cast.",
    "Sorts the clone in place, in ascending order.",
    "Prints the sorted clone: `15 18 21 23 30`.",
    "The original keeps its order, because the sort touched a different array.",
    "`Array.IndexOf` scans from the start and returns the first matching index, or -1."
]
explanation = '''
The program prints `5 readings` and `first 18, last 21`, then the slice `23, 15, 30` (slots 1
to 3, because the end of a range is exclusive). The loop adds up to `sum 107, max 30`. The
sorted clone prints `15 18 21 23 30` while `temps` still prints `18 23 15 30 21`: `Clone` made
a second block of memory, so sorting it in place left the first one alone. Finally
