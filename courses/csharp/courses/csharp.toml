[[unit.step]]
kind = "challenge"
id = "cs-u02-x1-calc"
title = "Implement Calc: safe arithmetic"
points = 20
difficulty = 2
entry = "Calc"
intro = '''
Each method in this challenge has one trap from the unit hidden in it: an overflow, an
integer division and a rounding rule. The fix is always the same idea, doing the arithmetic in
a type that is wide enough or exact enough, and that is how real code handles numbers safely.
'''
instructions = '''
## Your turn

Implement the three static methods of the class `Calc`:

```csharp
public static long MultiplyWide(int a, int b)
public static double Average(int a, int b)
public static decimal PriceWithTax(decimal price, decimal taxPercent)
```

- `MultiplyWide` returns `a * b` **without overflowing**, even for the largest `int` values.
- `Average` returns the exact average of `a` and `b`, with its fraction: the average of 3 and 4
  is `3.5`. It must also work when `a + b` would not fit in an `int`.
- `PriceWithTax` adds `taxPercent` percent to `price` and rounds the result to **2 decimal
  places**, with halves rounded away from zero.

Examples:

- `Calc.MultiplyWide(int.MaxValue, 2)` → `4294967294`
- `Calc.Average(3, 4)` → `3.5`
- `Calc.Average(int.MaxValue, int.MaxValue)` → `2147483647`
- `Calc.PriceWithTax(10.00m, 23m)` → `12.30m`
- `Calc.PriceWithTax(1.50m, 3m)` → `1.55m` (1.545 rounds up, not to 1.54)

**Hints:** cast one operand to `long` *before* multiplying or adding. Divide by `2.0`, not
`2`. Use `Math.Round(value, 2, MidpointRounding.AwayFromZero)` on a `decimal`.

Hidden tests decide correctness. Implement it, then submit.
'''
