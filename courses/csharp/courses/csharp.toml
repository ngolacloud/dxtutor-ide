prompt = '''
Write `TwoStackQueue<T>` with `Enqueue`, `Dequeue` and `Count`, and show that it returns
items in FIFO order even when enqueues and dequeues are interleaved.

**Why:** amortized analysis explains why an occasional O(n) step can still mean O(1) per
operation on average, and this is the classic example.
'''
target = '''
var q = new TwoStackQueue<string>();
q.Enqueue("a");
q.Enqueue("b");
Console.WriteLine(q.Dequeue());
q.Enqueue("c");
Console.WriteLine($"{q.Dequeue()} {q.Dequeue()} count={q.Count}");

class TwoStackQueue<T>
{
    private readonly Stack<T> _inbox = new();
    private readonly Stack<T> _outbox = new();

    public int Count => _inbox.Count + _outbox.Count;

    public void Enqueue(T item) => _inbox.Push(item);

    public T Dequeue()
    {
        if (_outbox.Count == 0)
        {
            while (_inbox.Count > 0)
            {
                _outbox.Push(_inbox.Pop());
            }
        }
        return _outbox.Pop();
    }
}
'''
