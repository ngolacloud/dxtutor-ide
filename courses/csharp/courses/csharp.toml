[unit.step.gabarito]
solution = '''
public sealed class Observable<T>
{
    private T _value;

    public Observable(T initial) => _value = initial;

    public event Action<T, T>? Changed;

    public T Value
    {
        get => _value;
        set
        {
            if (EqualityComparer<T>.Default.Equals(_value, value))
                return;
            T old = _value;
            _value = value;
            Changed?.Invoke(old, value);
        }
    }

    public IDisposable Subscribe(Action<T, T> handler)
    {
        ArgumentNullException.ThrowIfNull(handler);
        Changed += handler;
        return new Subscription(() => Changed -= handler);
    }

    public Observable<TResult> Map<TResult>(Func<T, TResult> selector)
    {
        ArgumentNullException.ThrowIfNull(selector);
        var derived = new Observable<TResult>(selector(_value));
        Changed += (_, now) => derived.Value = selector(now);
        return derived;
    }

    private sealed class Subscription(Action unsubscribe) : IDisposable
    {
        private Action? _unsubscribe = unsubscribe;

        public void Dispose()
        {
            _unsubscribe?.Invoke();
            _unsubscribe = null;
        }
    }
}
'''
time = "O(k) per change"
space = "O(k)"
justification = '''
Let `k` be the number of handlers subscribed to an observable (derived observables count as one
handler each). Reading `Value` is **O(1)**. Setting it does one equality check and, when the
value changed, invokes the delegate's invocation list, which calls each of the `k` handlers
once: **O(k)**, plus whatever the handlers themselves do (a `Map` handler sets the derived
value, which recurses into that observable's own handlers). `Subscribe` and `Dispose` add or
remove one entry from the invocation list; delegates are immutable, so `+=` and `-=` build a new
list, which is O(k), still tiny in practice.

Space is **O(k)** for the invocation list, plus one small closure per subscription and per
`Map`. Two details make it correct: the setter stores the new value **before** raising
`Changed`, so handlers observe a consistent state; and `Subscription` clears its action after
the first `Dispose()`, so disposing twice cannot remove a second, identical subscription.
Because `Map` simply assigns `derived.Value`, the derived observable's own equality check is
what suppresses events when the mapped value did not change.
'''

[[unit]]
id = "cs-u15-linq"
title = "LINQ"
level = "intermediate"
difficulty = 15
intro = '''
LINQ (Language-Integrated Query) lets you describe *what* you want from a sequence (filter
these, sort by that, group by this) instead of writing the loops yourself. This unit covers the
core operators, query syntax, joins and aggregation, and the rule that surprises everyone at
first: most queries do nothing until you enumerate them. You finish by writing a sales report
built entirely from LINQ queries.
'''
concepts = '''
## The idea

Most data code repeats a few patterns: keep the items that match a condition, transform each
one, sort, group, combine two lists by a shared key, reduce everything to one number. Writing
each as a hand-made loop hides the intent among indexes and temporary lists. **LINQ** gives each
pattern a name and lets you chain them into a **pipeline** that reads like a sentence.

## How C# does it

LINQ operators are **extension methods** on `IEnumerable<T>`, defined in `System.Linq` (one of
the implicit usings), so they work on arrays, lists, dictionaries, sets and any sequence:

| Operator | Does |
|---|---|
| `Where(x => cond)` | keeps matching items |
| `Select(x => expr)` | transforms each item |
| `OrderBy`, `ThenBy`, `OrderByDescending` | sorts (stable) |
| `GroupBy(x => key)` | groups items sharing a key |
| `Join`, `GroupJoin` | matches two sequences by key |
| `Count`, `Sum`, `Min`, `Max`, `Average`, `Aggregate` | reduce to one value |
| `First`, `Any`, `All`, `ToList`, `ToDictionary` | pick, test or materialise |

```csharp
var cheapBooks = products
    .Where(p => p.Category == "books" && p.Price < 20m)
    .OrderBy(p => p.Price)
    .Select(p => p.Name);
```

The same query in **query syntax**, which the compiler translates into the method calls above:

```csharp
var cheapBooks = from p in products
                 where p.Category == "books" && p.Price < 20m
                 orderby p.Price
                 select p.Name;
```

## Deferred execution

`cheapBooks` holds no names. It is a *recipe*: an object that remembers the source and the
steps. The work happens only when something **enumerates** it: a `foreach`, `string.Join`, or an
operator that must produce a concrete result, such as `ToList()`, `Count()`, `Sum()` or
`First()`. Each enumeration runs the whole pipeline again and sees the source as it is *at that
moment*. Call `ToList()` or `ToArray()` when you want a snapshot or will read the results
several times.

## Pitfalls and compiler errors

- **Multiple enumeration**: calling `Count()` and then `foreach` on the same query runs it
  twice, which is slow and, for a sequence read from a file or network, may not work at all.
- `First()` on an empty sequence throws `InvalidOperationException` (*Sequence contains no
  elements*). Use `FirstOrDefault()` when "no result" is normal.
- Modifying a `List<T>` while a query is enumerating it throws *Collection was modified*.
- A second `OrderBy` replaces the first ordering; use `ThenBy` for a tie-breaker.
- Sorting strings with the default comparer depends on the culture. Pass
  `StringComparer.Ordinal` for a predictable order.
- **CS1936**, *Could not find an implementation of the query pattern*: query syntax over
  something that is not a sequence. **CS1061** on `.Where` means `System.Linq` is not imported.

## What you will practise

You will filter, project and sort a list in both syntaxes, group, join and aggregate orders, and
count exactly when a query runs. The challenge asks for a report built from joins and groupings
that must also work on sequences that can be read only once.
'''

[[unit.step]]
kind = "concept"
id = "cs-u15-c1-pipelines"
title = "Queries are recipes"
points = 5
difficulty = 15
intro = '''
A LINQ query is a chain of small operators, each consuming the sequence produced by the
previous one. Most operators are lazy: they hand items on one at a time, only when asked, which
is called **streaming**.
'''
body = '''
## A pipeline of operators

```csharp
int[] scores = { 72, 95, 48, 88, 95, 61 };

var top = scores
    .Where(s => s >= 60)        // 72, 95, 88, 95, 61
    .Distinct()                 // 72, 95, 88, 61
    .OrderByDescending(s => s)  // 95, 88, 72, 61
    .Take(3);                   // 95, 88, 72
```

Each call returns a new `IEnumerable<int>` that wraps the previous one. Nothing has been
computed yet: `top` is a description of the work.

## Pulling items through

When a `foreach` asks `top` for its first item, `Take` asks `OrderByDescending`, which asks
`Distinct`, which asks `Where`, which asks the array. `Where` and `Select` are **streaming**:
they pass an item along as soon as they have it. `OrderBy` and `GroupBy` are **buffering**: they
must read the whole input before producing their first result, because the smallest item might
be the last one.

## Immediate operators

Operators that return a single value or a concrete collection run the pipeline at once:

```csharp
int count = top.Count();          // runs the query
List<int> list = top.ToList();    // runs it again and keeps the results
double avg = scores.Average();    // 76.5
```

Because the query re-runs on every enumeration, the rule of thumb is simple: if you need the
results more than once, materialise them with `ToList()` and reuse the list.

## Lambdas everywhere

Every operator takes its variable step as a delegate, exactly as in the previous unit: `Where`
takes a `Func<T, bool>`, `Select` a `Func<T, TResult>`, `OrderBy` a key selector. LINQ is
higher-order functions applied to sequences.
'''

