[[unit.step]]
kind = "drill"
id = "cs-u31-d2-chained-map"
title = "A tiny chained hash map"
points = 10
difficulty = 31
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
Separate chaining keeps one small list per bucket. A put either updates an entry in its
bucket or appends a new one, and a get scans a single bucket, so the cost depends on the
chain length, not on the size of the table.
'''
prompt = '''
Build a generic `ChainedMap<TKey, TValue>` with 4 buckets, insert five entries (one is an
update), print the bucket sizes and look up a present key and a missing one.

**Why:** watching three keys pile into one bucket shows what collisions cost, and why real
tables resize instead of keeping a fixed array.
'''
target = '''
var map = new ChainedMap<int, string>(4);
map.Put(1, "one"); map.Put(5, "five"); map.Put(9, "nine"); map.Put(2, "two");
map.Put(5, "FIVE");
Console.WriteLine($"count={map.Count} buckets=[{string.Join(", ", map.BucketSizes())}]");
Console.WriteLine(map.TryGet(5, out var five) ? five : "missing");
Console.WriteLine(map.TryGet(13, out _) ? "found" : "13 missing");

class ChainedMap<TKey, TValue>(int capacity) where TKey : notnull
{
    private readonly List<(TKey Key, TValue Value)>[] _buckets =
        Enumerable.Range(0, capacity).Select(_ => new List<(TKey, TValue)>()).ToArray();
    public int Count { get; private set; }

    private List<(TKey Key, TValue Value)> BucketFor(TKey key) =>
        _buckets[(EqualityComparer<TKey>.Default.GetHashCode(key) & 0x7FFFFFFF) % _buckets.Length];

    public void Put(TKey key, TValue value)
    {
        var bucket = BucketFor(key);
        for (var i = 0; i < bucket.Count; i++)
            if (EqualityComparer<TKey>.Default.Equals(bucket[i].Key, key))
            {
                bucket[i] = (key, value);
                return;
            }
        bucket.Add((key, value));
        Count++;
    }

    public bool TryGet(TKey key, out TValue value)
    {
        foreach (var (k, v) in BucketFor(key))
            if (EqualityComparer<TKey>.Default.Equals(k, key)) { value = v; return true; }
        value = default!;
        return false;
    }

    public IEnumerable<int> BucketSizes() => _buckets.Select(b => b.Count);
}
'''
