**Why:** this is the guarantee that makes `using` safer than a hand-written `Dispose()` call:
nothing leaks, whatever path the code takes.
'''
target = '''
using (var log = new Resource("log"))
{
    Console.WriteLine($"writing to {log.Name}");
}

