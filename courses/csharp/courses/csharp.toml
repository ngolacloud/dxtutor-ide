## Your turn

Complete the static method `TextDistance.EditDistance`:

```csharp
public static int EditDistance(string a, string b)
```

Return the minimum number of single-character edits (insert a character, delete a character,
or substitute one character for another) needed to turn `a` into `b`. Characters are compared
exactly (ordinal, case-sensitive), one `char` at a time. If either argument is `null`, throw
