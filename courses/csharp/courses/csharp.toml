[[unit.step]]
kind = "drill"
id = "cs-u21-d2-records-with"
title = "Records, with and shallow copies"
points = 10
difficulty = 21
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
A `with` expression copies a record and changes the listed properties, a technique called
non-destructive mutation. The copy is **shallow**: reference-type properties are copied as
references, so a mutable list ends up shared between the original and the copy.
'''
prompt = '''
Copy a record with `with`, mutate a list it contains and watch the change leak into the
original, then fix the design with an `ImmutableList`.

**Why:** a record looks immutable, but it is only as immutable as the types of its properties.
'''
target = '''
using System.Collections.Immutable;

var v1 = new Config("api", 3, new List<string> { "eu-west" });
var v2 = v1 with { Retries = 5 };
Console.WriteLine($"{v1.Retries} {v2.Retries}");
v2.Regions.Add("us-east");
Console.WriteLine(string.Join(",", v1.Regions));
Console.WriteLine(ReferenceEquals(v1.Regions, v2.Regions));

var s1 = new SafeConfig("api", ImmutableList.Create("eu-west"));
var s2 = s1 with { Regions = s1.Regions.Add("us-east") };
Console.WriteLine(string.Join(",", s1.Regions));
Console.WriteLine(string.Join(",", s2.Regions));

var twin = new SafeConfig("api", ImmutableList.Create("eu-west"));
Console.WriteLine(twin == s1);
Console.WriteLine(twin.Regions.SequenceEqual(s1.Regions));

record Config(string Name, int Retries, List<string> Regions);
record SafeConfig(string Name, ImmutableList<string> Regions);
'''
line_comments = [
  "For `ImmutableList`.",
  "",
  "A record holding a mutable list.",
  "A copy with one property changed.",
  "Prints `3 5`.",
  "Mutates the list through the copy...",
  "...and the original sees it: `eu-west,us-east`.",
  "`with` copied the reference: `True`.",
  "",
  "The same shape with an immutable list.",
  "`Add` returns a new list for the copy.",
  "The original keeps one region: `eu-west`.",
  "The copy has two: `eu-west,us-east`.",
  "",
  "Equal contents, but a different list object.",
  "Record equality compares the lists by reference: `False`.",
  "Compare the contents explicitly: `True`.",
  "",
  "Looks immutable, but `Regions` is not.",
  "Every part is immutable.",
]
explanation = '''
`with` creates a new `Config` whose properties are copied from `v1`, with `Retries` replaced. The
`Regions` property is a reference, so both records point to the same `List<string>`, and adding
through `v2` changes what `v1` sees. With `ImmutableList<string>` the list cannot be changed in
place: `s1.Regions.Add` returns a new list, which the copy stores, while `s1` keeps the old one.
Record equality is also shallow. It calls `Equals` on each property, and an `ImmutableList`
compares by reference, so `twin` and `s1` are unequal despite identical contents; use
`SequenceEqual` or write a custom `Equals` when contents should decide.
'''

[[unit.step]]
kind = "drill"
id = "cs-u21-d3-immutable-collections"
title = "Immutable collections, builders and snapshots"
points = 10
difficulty = 21
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
Persistent collections return a new version from every update and leave the old one valid,
sharing structure between them. Builders batch many changes into one efficient construction, and
the difference between a read-only view and an immutable snapshot decides whether later changes
leak through.
'''
prompt = '''
Grow an immutable list version by version, update an immutable dictionary, fill an
`ImmutableArray` with a builder, and compare a read-only view with a snapshot.

**Why:** these collections are how .NET code shares data safely between components and threads
without copying it defensively.
'''
target = '''
using System.Collections.Immutable;
using System.Collections.ObjectModel;

var empty = ImmutableList<string>.Empty;
var one = empty.Add("a");
var two = one.Add("b");
Console.WriteLine($"{empty.Count} {one.Count} {two.Count}");
two.Add("lost");
Console.WriteLine(two.Count);

var prices = ImmutableDictionary<string, int>.Empty.Add("tea", 250).Add("cake", 400);
var raised = prices.SetItem("tea", 300);
Console.WriteLine($"{prices["tea"]} -> {raised["tea"]}");

var builder = ImmutableArray.CreateBuilder<int>();
for (int i = 1; i <= 5; i++) builder.Add(i * i);
ImmutableArray<int> squares = builder.ToImmutable();
Console.WriteLine(string.Join(",", squares));

var backing = new List<string> { "x" };
ReadOnlyCollection<string> view = backing.AsReadOnly();
ImmutableList<string> snapshot = backing.ToImmutableList();
backing.Add("y");
Console.WriteLine($"view {view.Count}, snapshot {snapshot.Count}");
'''
line_comments = [
  "The immutable collection types.",
  "For `ReadOnlyCollection<T>`.",
  "",
  "The shared empty list; no constructor needed.",
  "A new list with one item.",
  "Another new list, sharing structure with `one`.",
  "Every version survives: `0 1 2`.",
  "Compiles, but the new list is thrown away.",
  "Still `2`: always use the returned value.",
  "",
  "Prices in cents, built by chaining.",
  "Replaces one value in a new dictionary.",
  "Prints `250 -> 300`.",
  "",
  "A mutable builder for efficient bulk construction.",
  "Adds without creating intermediate versions.",
  "Freezes the result.",
  "Prints `1,4,9,16,25`.",
  "",
  "An ordinary mutable list.",
  "A read-only window onto `backing`.",
  "A frozen copy of the current contents.",
  "The owner changes the list.",
  "The view follows, the snapshot doesn't: `view 2, snapshot 1`.",
]
explanation = '''
Each `Add` on an `ImmutableList` returns a new list and leaves its source alone, so `empty`,
`one` and `two` all keep their counts. Calling `Add` and ignoring the result is legal but has
no visible effect, which is the most common mistake with these types. `SetItem` on the
dictionary works the same way, so `prices` still says 250. A builder is a mutable staging area:
the loop adds five squares in place and `ToImmutable` produces the final frozen array once.
Finally, `AsReadOnly` only wraps the list, so it reports the new item, while `ToImmutableList`
copied the contents and keeps reporting one.
'''

[[unit.step]]
kind = "challenge"
id = "cs-u21-x1-immutable-cart"
title = "An immutable shopping cart"
points = 30
difficulty = 21
entry = "Cart"
intro = '''
A shopping cart is usually modelled as a mutable list, which makes undo, concurrent readers and
"what did the cart look like before?" awkward. Modelling it as an immutable value, where every
operation returns a new cart that shares structure with the old one, makes all of those free.
'''
instructions = '''
## Your turn

Implement the immutable class `Cart`. The record `CartLine` is provided; don't change it.

```csharp
public static Cart Empty { get; }
public ImmutableList<CartLine> Lines { get; }
public decimal Total { get; }
public int ItemCount { get; }
public Cart Add(string sku, int quantity, decimal unitPrice)
public Cart Remove(string sku, int quantity)
```

**Immutability.** A `Cart` never changes after it is created: no public setters or `init`
accessors, and no public constructor (carts start from `Cart.Empty`). `Add` and `Remove` return a
**new** cart and leave the one they were called on exactly as it was.

- `Empty` is a cart with no lines, `Total` 0 and `ItemCount` 0, and it is always the same
  instance.
- `Lines` holds one line per SKU, in the order the SKUs were first added. SKUs compare with
  ordinal, case-sensitive equality.
- `Total` is the sum of `Quantity * UnitPrice` over all lines, and `ItemCount` is the sum of the
  quantities.

**`Add`**

- If the SKU is not in the cart, append a new line at the end.
- If it is, increase that line's quantity, keeping its position. If `unitPrice` differs from the
  line's price, throw `InvalidOperationException`.
- Throw `ArgumentException` for a null, empty or whitespace `sku`, and
  `ArgumentOutOfRangeException` for `quantity <= 0` or a negative `unitPrice`.

**`Remove`**

- Decrease the SKU's quantity by `quantity`. If it reaches zero or less, remove the line.
- If the SKU is not in the cart, return the **same instance** (`this`).
- If the last line is removed, return `Cart.Empty`.
- Throw `ArgumentOutOfRangeException` for `quantity <= 0`.

**Hint:** a private constructor that takes an `ImmutableList<CartLine>`, plus `FindIndex`,
`SetItem` and `RemoveAt`. Records support `line with { Quantity = ... }`.

Hidden tests decide correctness.
'''
starter = '''
using System.Collections.Immutable;

// Provided: one line of the cart. Don't change it.
public sealed record CartLine(string Sku, int Quantity, decimal UnitPrice)
{
    public decimal Subtotal => Quantity * UnitPrice;
}

// An immutable shopping cart: Add and Remove return a new cart.
public sealed class Cart
{
    public static Cart Empty => throw new NotImplementedException();

    public ImmutableList<CartLine> Lines => throw new NotImplementedException();
    public decimal Total => throw new NotImplementedException();
    public int ItemCount => throw new NotImplementedException();

    public Cart Add(string sku, int quantity, decimal unitPrice) => throw new NotImplementedException();
    public Cart Remove(string sku, int quantity) => throw new NotImplementedException();
}
'''
tests = '''
using System.Collections.Immutable;
using System.Reflection;
static ImmutableList<CartLine> L(params CartLine[] lines) => ImmutableList.Create(lines);
Test("the empty cart is empty and shared", () =>
{
    Check(ReferenceEquals(Cart.Empty, Cart.Empty), "Empty must always return the same instance");
    Equal(Cart.Empty.Lines.Count, 0);
    Equal(Cart.Empty.Total, 0m);
    Equal(Cart.Empty.ItemCount, 0);
});
Test("Add returns a new cart and leaves the old one alone", () =>
{
    Cart a = Cart.Empty.Add("tea", 2, 3.10m);
    Check(!ReferenceEquals(a, Cart.Empty), "Add must return a new cart");
    Equal(Cart.Empty.Lines.Count, 0);
    Equal(a.Lines, L(new CartLine("tea", 2, 3.10m)));
    Cart b = a.Add("cake", 1, 4.25m);
    Equal(a.Lines, L(new CartLine("tea", 2, 3.10m)));
    Equal(b.Lines, L(new CartLine("tea", 2, 3.10m), new CartLine("cake", 1, 4.25m)));
    Equal(b.Total, 10.45m);
    Equal(b.ItemCount, 3);
});
Test("adding an existing SKU merges in place", () =>
{
    Cart c = Cart.Empty.Add("tea", 1, 2m).Add("cake", 1, 4m).Add("tea", 2, 2m).Add("Tea", 1, 9m);
    Equal(c.Lines, L(new CartLine("tea", 3, 2m), new CartLine("cake", 1, 4m), new CartLine("Tea", 1, 9m)));
    Equal(c.Total, 19m);
    Equal(c.ItemCount, 5);
});
Test("a different price for the same SKU is rejected", () =>
{
    Cart c = Cart.Empty.Add("tea", 1, 2m);
    Throws<InvalidOperationException>(() => c.Add("tea", 1, 2.5m));
    Equal(c.Lines, L(new CartLine("tea", 1, 2m)));
});
Test("invalid arguments are rejected", () =>
{
    Throws<ArgumentOutOfRangeException>(() => Cart.Empty.Add("tea", 0, 1m));
    Throws<ArgumentOutOfRangeException>(() => Cart.Empty.Add("tea", -3, 1m));
    Throws<ArgumentOutOfRangeException>(() => Cart.Empty.Add("tea", 1, -0.01m));
    Throws<ArgumentException>(() => Cart.Empty.Add("", 1, 1m));
    Throws<ArgumentException>(() => Cart.Empty.Add("   ", 1, 1m));
    Throws<ArgumentException>(() => Cart.Empty.Add(null!, 1, 1m));
    Throws<ArgumentOutOfRangeException>(() => Cart.Empty.Add("tea", 1, 1m).Remove("tea", 0));
    Equal(Cart.Empty.Add("free sample", 1, 0m).Total, 0m);
});
Test("Remove decrements, deletes and keeps order", () =>
{
    Cart c = Cart.Empty.Add("a", 3, 1m).Add("b", 2, 10m).Add("c", 1, 100m);
    Cart less = c.Remove("a", 1);
    Equal(less.Lines, L(new CartLine("a", 2, 1m), new CartLine("b", 2, 10m), new CartLine("c", 1, 100m)));
    Cart noB = less.Remove("b", 5);
    Equal(noB.Lines, L(new CartLine("a", 2, 1m), new CartLine("c", 1, 100m)));
    Equal(noB.Total, 102m);
    Equal(c.Lines.Count, 3);
    Equal(c.Total, 123m);
});
Test("removing an unknown SKU returns the same cart", () =>
{
    Cart c = Cart.Empty.Add("a", 1, 1m);
    Check(ReferenceEquals(c.Remove("zzz", 1), c), "unknown SKU must return this");
    Check(ReferenceEquals(c.Remove("A", 1), c), "SKUs are case-sensitive");
    Check(ReferenceEquals(Cart.Empty.Remove("a", 1), Cart.Empty), "removing from Empty returns Empty");
});
Test("removing the last line returns Cart.Empty", () =>
{
    Cart c = Cart.Empty.Add("a", 2, 1m).Add("b", 1, 1m);
    Check(ReferenceEquals(c.Remove("a", 2).Remove("b", 1), Cart.Empty), "an emptied cart is Cart.Empty");
});
Test("old versions survive as an undo history", () =>
{
    var history = new List<Cart> { Cart.Empty };
    history.Add(history[^1].Add("a", 1, 1.5m));
    history.Add(history[^1].Add("b", 2, 2m));
    history.Add(history[^1].Add("a", 1, 1.5m));
    history.Add(history[^1].Remove("b", 1));
    Equal(history.Select(h => h.Total).ToList(), new List<decimal> { 0m, 1.5m, 5.5m, 7m, 5m });
    Equal(history.Select(h => h.ItemCount).ToList(), new List<int> { 0, 1, 3, 4, 3 });
    Equal(history[2].Lines, L(new CartLine("a", 1, 1.5m), new CartLine("b", 2, 2m)));
});
Test("the cart exposes no way to mutate it", () =>
{
    foreach (PropertyInfo p in typeof(Cart).GetProperties(BindingFlags.Public | BindingFlags.Instance | BindingFlags.Static))
        Check(p.SetMethod is null || !p.SetMethod.IsPublic, $"Cart.{p.Name} must not have a public setter or init accessor");
    Check(typeof(Cart).GetConstructors().Length == 0, "Cart must not have a public constructor");
    Cart c = Cart.Empty.Add("a", 1, 1m);
    ImmutableList<CartLine> grown = c.Lines.Add(new CartLine("x", 1, 1m));
    Equal(grown.Count, 2);
    Equal(c.Lines.Count, 1);
});
Test("many SKUs", () =>
{
    Cart c = Cart.Empty;
    for (int i = 0; i < 3000; i++) c = c.Add($"sku{i}", 1 + i % 3, 0.5m);
    for (int i = 0; i < 3000; i += 2) c = c.Add($"sku{i}", 1, 0.5m);
    Equal(c.Lines.Count, 3000);
    Equal(c.ItemCount, 3000 + 3000 + 1500);
    Equal(c.Total, 3750m);
    for (int i = 0; i < 3000; i++) c = c.Remove($"sku{i}", 10);
    Check(ReferenceEquals(c, Cart.Empty), "removing everything gives Cart.Empty");
});
'''

[unit.step.gabarito]
solution = '''
using System.Collections.Immutable;

// Provided: one line of the cart. Don't change it.
public sealed record CartLine(string Sku, int Quantity, decimal UnitPrice)
{
    public decimal Subtotal => Quantity * UnitPrice;
}

// An immutable shopping cart: Add and Remove return a new cart.
public sealed class Cart
{
    public static Cart Empty { get; } = new(ImmutableList<CartLine>.Empty);

    private Cart(ImmutableList<CartLine> lines)
    {
        Lines = lines;
        Total = lines.Sum(l => l.Subtotal);
        ItemCount = lines.Sum(l => l.Quantity);
    }

    public ImmutableList<CartLine> Lines { get; }
    public decimal Total { get; }
    public int ItemCount { get; }

    public Cart Add(string sku, int quantity, decimal unitPrice)
    {
        ArgumentException.ThrowIfNullOrWhiteSpace(sku);
        ArgumentOutOfRangeException.ThrowIfNegativeOrZero(quantity);
        ArgumentOutOfRangeException.ThrowIfNegative(unitPrice);

        int i = IndexOf(sku);
        if (i < 0) return new Cart(Lines.Add(new CartLine(sku, quantity, unitPrice)));

        CartLine line = Lines[i];
        if (line.UnitPrice != unitPrice)
            throw new InvalidOperationException($"{sku} is already in the cart at a different price");
        return new Cart(Lines.SetItem(i, line with { Quantity = line.Quantity + quantity }));
    }

    public Cart Remove(string sku, int quantity)
    {
        ArgumentOutOfRangeException.ThrowIfNegativeOrZero(quantity);
        int i = IndexOf(sku);
        if (i < 0) return this;

        CartLine line = Lines[i];
        ImmutableList<CartLine> lines = line.Quantity > quantity
            ? Lines.SetItem(i, line with { Quantity = line.Quantity - quantity })
            : Lines.RemoveAt(i);
        return lines.IsEmpty ? Empty : new Cart(lines);
    }

    private int IndexOf(string sku) => Lines.FindIndex(l => string.Equals(l.Sku, sku, StringComparison.Ordinal));
}
'''
time = "O(n) per Add or Remove"
space = "O(log n) new nodes per operation"
justification = '''
Let **n** be the number of lines. Finding a SKU with `FindIndex` scans the list, **O(n)**. The
update itself (`Add`, `SetItem` or `RemoveAt` on `ImmutableList<T>`, an AVL tree) is O(log n).
The constructor recomputes `Total` and `ItemCount` in O(n), which keeps both properties O(1) to
read and guarantees they can never drift out of sync with `Lines`. Each operation is therefore
O(n) overall, the same as a scan of a mutable list would be.

The space story is where immutability pays off. A tree update allocates only the **O(log n)**
nodes on the path from the root to the changed position, plus one `CartLine` and one `Cart`;
every other node is shared with the previous version. Keeping a full undo history of k
operations therefore costs O(n + k log n) memory rather than O(n·k) for copied lists. Sharing is
safe precisely because nothing can change: the private constructor, get-only properties,
`ImmutableList` and the `CartLine` record leave no way to modify a cart once it exists, and
returning `this` or `Cart.Empty` when nothing changes avoids allocations altogether. If carts
grew to thousands of lines, an extra `ImmutableDictionary<string, int>` from SKU to index would
make the lookup O(log n) as well.
'''

# ── g5-modern ────────────────────────────────────────────────────────────

[[unit]]
id = 'cs-u22-pattern-matching'
title = 'Pattern matching'
level = 'advanced'
difficulty = 22
intro = '''
A pattern lets one expression ask "what shape is this value?" and take its parts apart in the
same breath. You will match on types, properties, numeric ranges and list shapes, combine
patterns with `and`, `or` and `not`, and finish by writing a small algebra simplifier in which
every rewrite rule is one arm of a switch expression.
'''
concepts = '''
## The idea

Many decisions in a program are really questions about the **shape** of a value. Is this
object a string or a number? Is the order's total above 50 and the country Portugal? Does the
list have exactly two elements, and what are they? Classic code answers with chains of `if`,
casts and index checks, and every cast is a chance to get the type wrong. **Pattern matching**
lets you write the shape itself: the compiler generates the type tests, the casts and the
variable bindings, and it checks that you have not left a case out.

## How C# does it

Patterns appear after `is`, in `switch` statements and in **switch expressions**, which
produce a value. The arms are tried from top to bottom, and the first one that matches wins:

```csharp
static string Size(object? o) => o switch
{
    null => "nothing",
    int n when n < 0 => "negative",
    int and (0 or 1) => "tiny",
    int => "an int",
    string { Length: > 10 } => "a long string",
    _ => "something else",
};
```

The building blocks combine freely:

- **Type and declaration patterns**: `int` tests the type, `int n` also binds the value.
- **Constant patterns**: `null`, `0`, `"PT"`.
- **Relational patterns**: `< 0`, `>= 18`, combined with `and`, `or`, `not` and parentheses,
  as in `>= 0 and < 10` or `not null`.
- **Property patterns**: `{ Country: "PT", Total: > 50m }` checks members, and nests:
  `{ Address.City: "Lisbon" }`.
- **Positional patterns**: `Point(0, var y)` uses a record's `Deconstruct`.
- **List patterns**: `[]`, `[var only]`, `[var first, .., var last]`; `..` matches any slice
  and `.. var rest` captures it.
- `var x` matches anything and names it, `_` matches anything and ignores it, and a `when`
  clause adds any boolean condition.

## Pitfalls and compiler messages

- **Order matters.** Put specific arms before general ones. An arm that earlier arms already
  cover is error **CS8510**: the pattern has already been handled by a previous arm.
- **Exhaustiveness.** When the compiler can find an input that no arm matches, it warns with
  **CS8509** and shows an example. At run time that input throws `SwitchExpressionException`.
- **Open hierarchies.** The compiler cannot know every subclass of an abstract record, so a
  switch over one needs a final `_ => throw ...` arm even when you covered every type you wrote.
- Relational and constant patterns need **constants**: `> limit` with a variable does not
  compile. Use a `when` guard instead.
- A variable declared inside an `or` pattern is not allowed, because it might never be
  assigned. Write two arms instead.
- Prefer `is null` and `is not null`: they cannot be fooled by an overloaded `==`.

## What you will practise

You will classify values by type with guards, price orders with property and relational
patterns, and run commands with list patterns. The challenge asks you to evaluate and simplify
expression trees built from records, using positional patterns that look inside several
levels at once.
'''

[[unit.step]]
kind = 'concept'
id = 'cs-u22-c1-is-patterns'
title = 'Patterns test, cast and bind'
points = 5
difficulty = 22
intro = '''
A pattern is a test that can also extract data. The compiler turns each pattern into type
checks and comparisons, and it tracks which variables are definitely assigned after a
successful match, so you can use them without casting.
'''
body = '''
## One test instead of three steps

Before patterns, using an `object` as a string took three steps: test with `is`, cast, then
use. A declaration pattern does all three, and the variable exists only where the match is
certain:

```csharp
if (value is string { Length: > 0 } text)
{
    Console.WriteLine(text.ToUpperInvariant());
}
```

## Definite assignment

The compiler knows exactly where a pattern variable has a value. Inverting the test with
`not` is the idiom for an early exit, and the variable stays in scope afterwards:

```csharp
if (value is not int count) return;
Console.WriteLine(count + 1);   // count is definitely an int here
```

Using `count` where the match might have failed is error CS0165, use of an unassigned local
variable.

## Switch expressions

When there are several shapes to tell apart, a switch expression lists them as arms and
produces a value. Each arm is a pattern, an optional `when` guard, and `=>` the result:

```csharp
string label = temperature switch
{
    < 0 => "freezing",
    < 15 => "cold",
    < 25 => "mild",
    _ => "hot",
};
```

Because arms are tried in order, `< 15` only sees values that are already known to be at
least 0. Read a switch expression from top to bottom, like a sieve: each arm takes what it
recognises and lets the rest fall through to the arms below.
'''

