'''
prompt = '''
Write a generic `Repository<T>` that stores entities by id in a dictionary, use it with two
different record types, and look items up with `Get` and `TryGet`.

**Why:** "a generic container whose element type must implement an interface" is one of the
most common generic designs in real .NET code.
'''
target = '''
using System.Diagnostics.CodeAnalysis;

var users = new Repository<User>();
users.Add(new User(1, "ada"));
users.Add(new User(2, "linus"));
var books = new Repository<Book>();
books.Add(new Book(10, "SICP", 1985));

Console.WriteLine(users.Get(2));
Console.WriteLine(books.Get(10).Title);
Console.WriteLine(users.TryGet(99, out var missing) ? missing.Name : "no user 99");
Console.WriteLine($"{users.Count} users, {books.Count} books");

interface IEntity
{
    int Id { get; }
}

record User(int Id, string Name) : IEntity;
record Book(int Id, string Title, int Year) : IEntity;

class Repository<T> where T : class, IEntity
{
    private readonly Dictionary<int, T> _items = new();

    public int Count => _items.Count;

    public void Add(T item)
    {
        if (!_items.TryAdd(item.Id, item))
            throw new ArgumentException($"duplicate id {item.Id}");
    }

    public T Get(int id) => _items[id];

    public bool TryGet(int id, [NotNullWhen(true)] out T? item) => _items.TryGetValue(id, out item);
}
'''
