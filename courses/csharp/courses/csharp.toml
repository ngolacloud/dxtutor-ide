Examples:

- `EditDistance("kitten", "sitting")` returns `3` (k→s, e→i, insert g).
- `EditDistance("", "abc")` returns `3`.
- `EditDistance("flaw", "lawn")` returns `2` (delete f, insert n).
- `EditDistance("same", "same")` returns `0`.

The hidden tests use strings of up to 2,000 characters. Naive recursion is exponential, and
memoised recursion goes about `a.Length + b.Length` calls deep, which risks an uncatchable
stack overflow, so fill a table bottom-up.

**Hint:** let `d[i, j]` be the edit distance between the first `i` characters of `a` and the
first `j` characters of `b`. Row 0 and column 0 are easy (only insertions or only
deletions). For the other cells, think about the last character of each prefix: either they
match, or the last edit was an insertion, a deletion or a substitution. Each row needs only
the previous one.

Hidden tests decide correctness.
'''
starter = '''
public static class TextDistance
{
    // The fewest insertions, deletions and substitutions that turn a into b.
    // Throws ArgumentNullException if a or b is null.
