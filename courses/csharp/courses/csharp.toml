instructions = '''
## Your turn

Complete the class `Greeter` by implementing its method `Greet`:

```csharp
public static string Greet(string name)
```

It takes a name and **returns** (does not print) a string that reads `Hello, {name}!`.

Examples:

- `Greeter.Greet("World")` → `"Hello, World!"`
- `Greeter.Greet("Ada Lovelace")` → `"Hello, Ada Lovelace!"`
- `Greeter.Greet("")` → `"Hello, !"`

Notes:

- Your file contains only the class: no top-level statements. The hidden tests call
  `Greeter.Greet` directly, the same way your drills called `Math.Max`.
- `string` is the return type, so the method must end with `return` followed by a string.
  `static` lets the tests call it on the class itself, without creating a `Greeter` object.

**Hint:** build the result by joining strings with `+`, and hand it back with `return`.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Greeter: your first class. It has no top-level statements; the hidden tests call Greet directly.
public static class Greeter
{
    // Return (do not print) the text "Hello, {name}!".
    public static string Greet(string name)
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
Test("greets the world", () => Equal(Greeter.Greet("World"), "Hello, World!"));
Test("greets C#", () => Equal(Greeter.Greet("C#"), "Hello, C#!"));
Test("empty name", () => Equal(Greeter.Greet(""), "Hello, !"));
Test("name with spaces", () => Equal(Greeter.Greet("Ada Lovelace"), "Hello, Ada Lovelace!"));
Test("accented name", () => Equal(Greeter.Greet("João"), "Hello, João!"));
Test("single letter", () => Equal(Greeter.Greet("X"), "Hello, X!"));
Test("keeps the name exactly as given", () => Equal(Greeter.Greet("  grace "), "Hello,   grace !"));
Test("returns instead of printing", () =>
{
    var original = Console.Out;
    var buffer = new StringWriter();
    Console.SetOut(buffer);
    string result;
    try
    {
        result = Greeter.Greet("Grace");
    }
    finally
    {
        Console.SetOut(original);
    }
    Equal(result, "Hello, Grace!");
    Equal(buffer.ToString(), "");
});
'''

[unit.step.gabarito]
solution = '''
// Greeter: your first class. It has no top-level statements; the hidden tests call Greet directly.
public static class Greeter
{
    // Return (do not print) the text "Hello, {name}!".
    public static string Greet(string name)
    {
        return "Hello, " + name + "!";
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
C# strings are immutable, so joining them builds a brand-new `string`: the fixed text
`Hello, ` and `!` plus the `n` characters of `name` are copied into it. The compiler turns
the whole `"Hello, " + name + "!"` into a single `string.Concat` call that sizes the result
once and copies each character once, so the work grows in direct proportion to the length of
the name: **O(n)** time. The new string holds those `n + 8` characters, so the space is
**O(n)** as well, where `n` is the length of `name`. There is no loop in your code; the
copying happens inside the `+` operation.
'''

[[unit]]
id = "cs-u02-variables"
title = "Variables and number types"
level = "basic"
difficulty = 2
intro = '''
A variable is a named place that holds a value, and in C# every variable has a type that the
compiler knows before the program runs. This unit tours the everyday types (`int`, `long`,
`double`, `decimal`, `bool`, `char`), shows how `var` infers them, and explains what happens
when a value is converted or grows too large for its type.
'''
concepts = '''
## The idea

Programs work with values: a count of apples, a price, a yes-or-no answer. A **variable**
gives a value a name so you can use it and change it later. C# is **statically typed**: each
variable has a **type**, fixed when you declare it, that says what kind of value it may hold
and how much memory that takes. The compiler checks every assignment against that type, so
many mistakes are caught before the program ever runs.

## How C# does it

You declare a variable by writing its type, a name and, usually, a starting value:

```csharp
int age = 30;              // whole number, 32 bits: about ±2.1 billion
long stars = 8_000_000_000; // whole number, 64 bits; _ only helps reading
double ratio = 0.75;       // binary floating point, ~15-16 significant digits
decimal price = 9.99m;     // base-10 number for money: note the m suffix
bool done = false;         // true or false
char letter = 'C';         // one character, in single quotes
var count = 3;             // the compiler infers int from the value
```

`var` is not a "dynamic" variable: the type is still fixed, it is just written for you. A
`const` is a value that can never change, such as `const int DaysInWeek = 7;`.

**Conversions.** Going from a smaller type to a larger one is safe, so C# does it
implicitly (`int` to `long`, `int` to `double`). Going the other way could lose
information, so you must ask for it with a **cast**: `(int)3.99` is `3`, because a cast to a
whole number drops the fraction. Text is converted with `int.Parse("42")`.

**Overflow.** An `int` cannot hold more than `int.MaxValue` (2,147,483,647). By default,
arithmetic that goes past the limit silently **wraps around** to a large negative number.
Inside `checked(...)` the same operation throws an `OverflowException` instead.

## What is special or tricky

- **Types must match.** `int x = "5";` is `CS0029: Cannot implicitly convert type 'string'
  to 'int'`, and `int x = 3.5;` is `CS0266` (an explicit conversion exists: are you missing a
  cast?).
- **Read before write is an error.** Using a variable that was never assigned gives
  `CS0165: Use of unassigned local variable`.
- **`var` needs a value.** `var v;` is `CS0818: Implicitly-typed variables must be
  initialized`.
- **Decimal literals need `m`.** `decimal d = 1.5;` is `CS0664`, because `1.5` on its own is
  a `double`.
- **Constants are checked, variables are not.** `int.MaxValue + 1` written with literals is
  `CS0220: The operation overflows at compile time`, but the same sum through a variable
  wraps at run time without any warning.
- **`double` is approximate.** `0.1 + 0.2` is `0.30000000000000004`. Use `decimal` for money.

## What you will practise

You will declare one variable of each everyday type, convert between them with implicit
conversions, casts, rounding and parsing, and watch an `int` overflow, first silently and then
under `checked`. Then you will write a small `Calc` class whose methods avoid integer
division, integer overflow and money rounding errors.
'''

[[unit.step]]
kind = "concept"
id = "cs-u02-c1-types"
title = "Every value has a type"
points = 5
difficulty = 2
intro = '''
A type tells the compiler how many bytes a value needs and which operations make sense on it.
Because C# checks types at compile time, a line that mixes them up never reaches the
runtime. Choosing the right type is the first design decision you make about any value.
'''
body = '''
## Choosing a type

| Type | Holds | Example |
|---|---|---|
| `int` | whole numbers up to about ±2.1 billion (32 bits) | `int year = 2026;` |
| `long` | much larger whole numbers (64 bits) | `long bytes = 5_000_000_000;` |
| `double` | fractions, approximately (binary) | `double pi = 3.14159;` |
| `decimal` | exact base-10 fractions, for money | `decimal fee = 2.50m;` |
| `bool` | `true` or `false` | `bool ok = true;` |
| `char` | a single character | `char c = 'x';` |
| `string` | text | `string name = "Ada";` |

Start with `int` for counts, `double` for measurements, `decimal` for money and `bool` for
answers. Reach for `long` when values can pass two billion, such as file sizes or IDs.

## Declaring and changing

```csharp
int score = 10;   // declare with a type and a starting value
score = score + 5; // assign a new value: score is now 15
var bonus = 2;    // same as: int bonus = 2;
```

The `=` sign means "store the value on the right in the variable on the left", not "is
equal". Once declared, a variable keeps its type for ever: `score = "high";` will not
compile.

## Formatting numbers the same everywhere

How a number is printed depends on the computer's **culture**: in Portugal `1.5` prints as
`1,5`. The drills in this unit start with two lines that switch to the invariant culture, so
everyone sees the same output:

```csharp
using System.Globalization;
CultureInfo.CurrentCulture = CultureInfo.InvariantCulture;
```
'''

