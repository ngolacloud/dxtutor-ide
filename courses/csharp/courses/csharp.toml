tests = '''
long BruteForce(int[] a)
{
    long count = 0;
    for (var i = 0; i < a.Length; i++)
        for (var j = i + 1; j < a.Length; j++)
            if (a[i] > a[j]) count++;
    return count;
}
async Task<bool> FinishesWithin(double seconds, Action work)
{
    var task = Task.Run(work);
    if (await Task.WhenAny(task, Task.Delay(TimeSpan.FromSeconds(seconds))) != task) return false;
    await task;
    return true;
}

Test("empty and single item", () =>
{
    var (sorted, count) = MergeSorter.SortAndCount(Array.Empty<int>());
    Equal(sorted, Array.Empty<int>());
    Equal(count, 0L);
    var (one, none) = MergeSorter.SortAndCount(new[] { 42 });
    Equal(one, new[] { 42 });
    Equal(none, 0L);
});
Test("classic examples", () =>
{
    var (s1, c1) = MergeSorter.SortAndCount(new[] { 2, 4, 1, 3, 5 });
    Equal(s1, new[] { 1, 2, 3, 4, 5 });
    Equal(c1, 3L);
    var (s2, c2) = MergeSorter.SortAndCount(new[] { 5, 4, 3, 2, 1 });
    Equal(s2, new[] { 1, 2, 3, 4, 5 });
    Equal(c2, 10L);
    var (_, c3) = MergeSorter.SortAndCount(new[] { 1, 2, 3, 4 });
