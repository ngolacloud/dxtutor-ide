Test("pop restores the previous min and max", () =>
{
    var s = MinMaxStack.Of(5, 1, 9, 3);
    Equal(s.Pop(), 3);
    Equal((s.Min, s.Max), (1, 9));
    Equal(s.Pop(), 9);
    Equal((s.Min, s.Max), (1, 5));
    Equal(s.Pop(), 1);
    Equal((s.Min, s.Max), (5, 5));
    Equal(s.Count, 1);
