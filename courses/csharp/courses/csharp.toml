prompt = '''
Throw an `ApiException` with a status code, route server errors and client errors to different
handlers with a filter, then wrap a `FormatException` inside an `InvalidOperationException`.

**Why:** filters and inner exceptions are how production code keeps error handling precise
without losing information.
