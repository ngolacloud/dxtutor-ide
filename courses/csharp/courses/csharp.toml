Console.Write("...");
Console.WriteLine(" done");
Console.WriteLine("Name:\tAda");
Console.WriteLine("She said \"hi\".");
Console.WriteLine("It's fine: single quotes need no escape.");
Console.WriteLine("line one\nline two");
Console.WriteLine();
Console.WriteLine("C:\\Users\\ada");
'''
