[unit.step.gabarito]
solution = '''
using System.Globalization;

public readonly record struct Money
{
    private readonly decimal _amount;
    private readonly string _currency;

    public Money(decimal amount, string currency)
    {
        _amount = ToCents(amount);
        _currency = ToCode(currency);
    }

    public decimal Amount
    {
        get => _amount;
        init => _amount = ToCents(value);
    }

    public string Currency
    {
        get => _currency;
        init => _currency = ToCode(value);
    }

    public static Money Zero(string currency) => new(0m, currency);

    public static Money operator +(Money a, Money b) => new(a.Amount + b.Amount, SameCurrency(a, b));

    public static Money operator -(Money a, Money b) => new(a.Amount - b.Amount, SameCurrency(a, b));

    public Money[] Allocate(int parts)
    {
        ArgumentOutOfRangeException.ThrowIfLessThan(parts, 1);
        long cents = (long)(Amount * 100m);
        long share = cents / parts;
        long rest = cents % parts;
        var result = new Money[parts];
        for (int i = 0; i < parts; i++)
        {
            long c = share + (i < Math.Abs(rest) ? Math.Sign(rest) : 0);
            result[i] = new Money(c / 100m, Currency);
        }
        return result;
    }

    public override string ToString() =>
        $"{Amount.ToString("0.00", CultureInfo.InvariantCulture)} {Currency}";

    private static decimal ToCents(decimal value) =>
        Math.Round(value, 2, MidpointRounding.AwayFromZero);

    private static string ToCode(string value) =>
        value is { Length: 3 } && value.All(char.IsAsciiLetter)
            ? value.ToUpperInvariant()
            : throw new ArgumentException($"'{value}' is not a 3-letter currency code.", nameof(value));

    private static string SameCurrency(Money a, Money b) =>
        a.Currency == b.Currency
            ? a.Currency
            : throw new InvalidOperationException($"Cannot combine {a.Currency} with {b.Currency}.");
}
'''
time = "O(1) per operation, O(p) for Allocate"
space = "O(p) for Allocate"
justification = '''
Construction, `+`, `-`, equality and `ToString` each do a fixed amount of work on two fields,
so they are **O(1)**. `Allocate(p)` computes one division and one remainder, then fills an
array of `p` parts with constant work per part, so it runs in **O(p)** time and needs
**O(p)** space for the result. A `Money` value itself is a small struct (a `decimal` and a
reference), copied on assignment and never allocated on the heap.

The allocation is exact because it works in whole cents. Write `cents = q·p + r` with
`q = cents / p` and `r = cents % p`, where `|r| < p` and `r` has the sign of `cents`. Giving
`q` cents to every part and one extra cent (with the sign of `r`) to the first `|r|` parts
adds up to `q·p + r = cents`, and no two parts differ by more than one cent. Dividing the
`decimal` directly (`10.00 / 3 = 3.333…`) and rounding each part would give 3.33 three times
and lose a cent. Validation lives in two private helpers called by both the constructor and the
`init` accessors (which `with` runs), so no `Money` with an unrounded amount or an invalid currency can exist (apart
from `default(Money)`, which every struct has). The compiler-generated record equality
compares `_amount` and `_currency` field by field, and `decimal` equality ignores trailing
zeros, so `1.5m` and `1.50m` are equal and hash alike.
'''

