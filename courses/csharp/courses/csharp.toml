]
explanation = '''
The counting loop prints `the: 3`, `cat: 2` and a count of 1 for `sat`, `on`, `mat`, `and`
and `slept`. Writing `counts.GetValueOrDefault(word) + 1` avoids the exception that
`counts[word]++` would throw on a word seen for the first time. The grouping loop creates each
list the first time a length appears and then appends to that same list, giving
`3 letters: the, cat, sat, mat, and`, `2 letters: on` and `5 letters: slept`. `MaxBy` finds the
entry with the highest count, so the last line is `most common: the (3)`.
'''

[[unit.step]]
kind = "challenge"
id = "cs-u08-x1-anagrams"
title = "Group words into anagram families"
points = 30
difficulty = 8
entry = "Group"
intro = '''
Two words are anagrams when they use the same letters the same number of times. Sorting a
word's letters gives a **canonical key** that every anagram shares, so grouping by that key
puts each family in one bucket of a dictionary. A set alongside it filters out repeated words
in O(1) per word.
'''
instructions = '''
## Your turn

Implement the static method `Anagrams.Group`:

```csharp
public static Dictionary<string, List<string>> Group(IEnumerable<string> words)
```

It groups the words into families of anagrams and returns a dictionary from each family's
**key** to its words.

Rules:

- A word's key is the word in lower case (`ToLowerInvariant`) with its characters sorted in
  ascending order (ordinal, char by char). `"Listen"` has the key `"eilnst"`.
- Each list holds the words of one family **in the order they first appear**, with their
  original spelling.
- A word that is equal to an earlier word **ignoring case** is a repeat and is skipped:
  `"tea"` after `"Tea"` adds nothing.
- An empty input gives an empty dictionary. An empty string is a valid word with the key `""`.
- Don't print anything.

Example:

```csharp
Anagrams.Group(["listen", "google", "Silent", "enlist", "listen"])
// { "eilnst": ["listen", "Silent", "enlist"], "eggloo": ["google"] }
```

**Hint:** `char[] letters = word.ToLowerInvariant().ToCharArray(); Array.Sort(letters);`
then `new string(letters)` gives the key. Keep a `HashSet<string>` of the lower-case words you
have already accepted.

Hidden tests decide correctness.
'''
starter = '''
public static class Anagrams
{
    // Group the words by their key (lower-cased letters, sorted). Each list keeps
    // the words in first-appearance order; a word equal to an earlier one ignoring
    // case is skipped.
    public static Dictionary<string, List<string>> Group(IEnumerable<string> words)
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
Test("the example", () =>
{
    var got = Anagrams.Group(["listen", "google", "Silent", "enlist", "listen"]);
    Equal(got, new Dictionary<string, List<string>>
    {
        ["eilnst"] = ["listen", "Silent", "enlist"],
        ["eggloo"] = ["google"],
    });
});
Test("empty input gives an empty dictionary", () =>
{
    Equal(Anagrams.Group([]), new Dictionary<string, List<string>>());
});
Test("a single word", () =>
{
    Equal(Anagrams.Group(["Stop"]), new Dictionary<string, List<string>> { ["opst"] = ["Stop"] });
});
Test("repeats are skipped ignoring case", () =>
{
    var got = Anagrams.Group(["Tea", "eat", "tea", "ATE", "EAT", "tan"]);
    Equal(got, new Dictionary<string, List<string>>
    {
        ["aet"] = ["Tea", "eat", "ATE"],
        ["ant"] = ["tan"],
    });
});
Test("first-appearance order is kept", () =>
{
    var got = Anagrams.Group(["post", "stop", "pots", "tops", "spot", "opts"]);
    Equal(got["opst"], new List<string> { "post", "stop", "pots", "tops", "spot", "opts" });
    Equal(got.Count, 1);
});
Test("letters that repeat are counted", () =>
{
    var got = Anagrams.Group(["aab", "abb", "bab", "aba"]);
    Equal(got, new Dictionary<string, List<string>>
    {
        ["aab"] = ["aab", "aba"],
        ["abb"] = ["abb", "bab"],
    });
});
Test("the empty string is a word", () =>
{
    var got = Anagrams.Group(["", "a", ""]);
    Equal(got, new Dictionary<string, List<string>> { [""] = [""], ["a"] = ["a"] });
});
Test("works with any IEnumerable and does not change it", () =>
{
    var input = new List<string> { "evil", "vile", "live" };
    var got = Anagrams.Group(input.Where(w => w.Length == 4));
    Equal(got, new Dictionary<string, List<string>> { ["eilv"] = ["evil", "vile", "live"] });
    Equal(input, new List<string> { "evil", "vile", "live" });
});
Test("large input", () =>
{
    var words = new List<string>();
    for (int i = 0; i < 100_000; i++)
    {
        int g = i % 1000;
        string a = new string('a', g % 10 + 1) + new string('b', g / 10 + 1);
        words.Add(i / 1000 % 2 == 0 ? a : new string(a.Reverse().ToArray()));
    }
    var clock = System.Diagnostics.Stopwatch.StartNew();
    var got = Anagrams.Group(words);
    clock.Stop();
    Equal(got.Count, 1000);
    Check(got.Values.All(list => list.Count == 2), "every family should hold a word and its reverse");
    Check(clock.ElapsedMilliseconds < 1500, $"took {clock.ElapsedMilliseconds} ms: use a dictionary and a set");
});
'''

[unit.step.gabarito]
solution = '''
public static class Anagrams
{
    public static Dictionary<string, List<string>> Group(IEnumerable<string> words)
    {
        var families = new Dictionary<string, List<string>>();
        var accepted = new HashSet<string>();

        foreach (string word in words)
        {
            string lower = word.ToLowerInvariant();
            if (!accepted.Add(lower))
            {
                continue;
            }

            char[] letters = lower.ToCharArray();
            Array.Sort(letters);
            string key = new string(letters);

            if (!families.TryGetValue(key, out var family))
            {
                family = [];
                families[key] = family;
            }
            family.Add(word);
        }
        return families;
    }
}
'''
time = "O(n · k log k)"
space = "O(n · k)"
justification = '''
Let `n` be the number of words and `k` the length of the longest one. Each word is lower-cased
in O(k), checked against the `accepted` set in O(k) (hashing a string reads every character),
and its letters are sorted in O(k log k). The dictionary lookup on the key is O(k) on average
for the same hashing reason. Everything else per word is O(1), so the total time is
**O(n · k log k)**. A naive version that compares every word with every other word would be
O(n² · k log k).

The set, the keys and the lists together store at most a constant number of copies of each
word, so the extra space is **O(n · k)**. The two collections play different roles:
`accepted.Add(lower)` both tests and records a repeat in one O(1) average operation (its
`bool` result tells you whether the word was new), and `TryGetValue` creates each family's
list only once, so appending stays O(1) amortised.
'''

[[unit]]
id = "cs-u09-classes"
title = "Classes and objects"
level = "intermediate"
difficulty = 9
intro = '''
A class bundles data with the code that is allowed to change it, so the rest of the program
cannot put an object into a state that makes no sense. This unit covers constructors,
properties with `get`, `set` and `init`, private fields, and static members that belong to
the type instead of to one object. The challenge builds a shopping cart that keeps its totals
correct whatever the caller does.
'''
concepts = '''
## The idea

A **class** is a blueprint; an **object** is one instance built from it, with its own copy of
the data. `new Rectangle(3, 4)` allocates an object on the **heap** and gives you a
**reference** to it. Assigning that reference to another variable does not copy the object:
both variables now point to the same one.

Classes exist to protect **invariants**, the facts that must always be true about an object,
such as "the balance is never negative" or "the total equals the sum of the lines". The idea
is **encapsulation**: keep the data private and expose only operations that check their
inputs, so no outside code can break the rules.

## How C# does it

```csharp
public class Counter
{
    private int _count;                       // a field: private state
    public string Name { get; }               // read-only property
    public int Step { get; init; } = 1;       // settable only while creating
    public int Count => _count;               // computed property

    public Counter(string name) => Name = name;   // constructor
    public void Tick() => _count += Step;
    public static Counter Default { get; } = new("default");
}

var c = new Counter("clicks") { Step = 2 };   // object initializer
c.Tick();
```

A **property** looks like a field to the caller, but it runs code. `{ get; set; }` is an
**auto-property** with a hidden backing field. `private set` lets only the class change it,
and `init` allows assignment only in a constructor or object initializer. Adding `required`
forces every caller to set the property in the initializer. A full property, with
`get => _x; set { … }`, can validate the value before storing it.

A **constructor** has the class's name and no return type, and it runs once per object.
**Static** members belong to the type itself: one copy shared by every object, reached
through the class name, as in `Counter.Default`. Members are `private` unless you say
otherwise, and top-level classes default to `internal`. C# 12 also has **primary
constructors**, `class Point(int x, int y)`, whose parameters are visible in the whole class
body; they are not properties unless you declare them.

## Pitfalls and compiler errors

- **CS0200**: `Property 'Name' cannot be assigned to -- it is read only`, when a property has
  no setter.
- **CS8852**: an `init` property assigned after the object was created.
- **CS0272**: the setter exists but is `private`, so you cannot use it from outside.
- **CS0122**: `'_count' is inaccessible due to its protection level`.
- **CS0120**: `An object reference is required` when a static method touches an instance
  member.
- **CS8618**: a non-nullable `string` property is still `null` when the constructor ends.
  Assign it, give it a default, or mark it `required`.

## What you will practise

You will write a class with a constructor and computed properties, validate state behind a
full property, and use a private constructor with a static factory and counter. The challenge
asks for a shopping cart whose quantities and totals stay valid under every sequence of calls.
'''

[[unit.step]]
kind = "concept"
id = "cs-u09-c1-objects"
title = "Objects, references and invariants"
points = 5
difficulty = 9
intro = '''
An object is a piece of memory on the heap, and a variable of a class type holds only a
reference to it. Encapsulation means the object guards its own memory: callers go through
methods and properties that keep its invariants true.
'''
body = '''
## A variable holds a reference

```csharp
var a = new Account("Ada");
var b = a;            // copies the reference, not the account
b.Deposit(50);
Console.WriteLine(a.Balance);   // 50: a and b are one object
```

`new` allocates the object and runs its constructor. The variable stores the address of the
object, so `b = a` makes two names for one thing. When nothing refers to an object any more,
the garbage collector reclaims it; C# has no `delete`.

## Invariants

An invariant is a rule that holds after the constructor finishes and after every public
method returns. For an account it might be "the balance is never negative". Encapsulation is
how you enforce it:

```csharp
public class Account(string owner)
{
    public string Owner { get; } = owner;
    public decimal Balance { get; private set; }

    public void Deposit(decimal amount)
    {
        if (amount <= 0) throw new ArgumentOutOfRangeException(nameof(amount));
        Balance += amount;
    }
}
```

`Balance` can be read by anyone but changed only inside the class, so the single place that
modifies it is also the single place that checks the rule. If `Balance` had a public setter,
any line anywhere in the program could set it to `-1000`, and you would have to hunt through
all of them to find the bug.

Throwing an exception (unit 12) is the usual way to refuse invalid input: the operation stops
before it changes anything, so the object stays valid. Keeping fields private and exposing
narrow, checked operations is the core habit of object-oriented design.
'''

