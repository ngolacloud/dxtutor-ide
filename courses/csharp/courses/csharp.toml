intro = '''
Streams process a file a buffer at a time, so their memory use is constant no matter how big
the file grows. A writer must be disposed before the file is read back, otherwise its buffered
lines are still in memory, and a reader signals the end of the file by returning `null`.
'''
prompt = '''
Write a small CSV file with a `StreamWriter`, then read it back with a `StreamReader`, skipping
the header and totalling the prices.

**Why:** line-by-line processing is how real tools handle logs, exports and data files that are
far too big to load at once.
'''
target = '''
using System.Globalization;

var inv = CultureInfo.InvariantCulture;
string dir = Path.Combine(Path.GetTempPath(), "dxt-" + Guid.NewGuid().ToString("N"));
Directory.CreateDirectory(dir);
try
{
    string path = Path.Combine(dir, "prices.csv");
    using (var writer = new StreamWriter(path))
    {
        writer.WriteLine("item,price");
        for (int i = 1; i <= 5; i++)
            writer.WriteLine(string.Create(inv, $"item{i},{i * 1.25m}"));
    }
    decimal total = 0;
    int rows = 0;
    using var reader = new StreamReader(path);
    reader.ReadLine();
    string? line;
    while ((line = reader.ReadLine()) is not null)
    {
        total += decimal.Parse(line[(line.IndexOf(',') + 1)..], inv);
        rows++;
    }
    Console.WriteLine(string.Create(inv, $"{rows} rows, total {total}"));
}
finally
{
    Directory.Delete(dir, recursive: true);
}
'''
