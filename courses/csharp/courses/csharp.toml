then printed `== Shopping list:`, `- bread` and `- oat milk` on three lines, followed by a rule
of equals signs. Unlike a `string`, the builder really changed: `Append`, `Insert` and
`Replace` all edited the same buffer, and only `ToString()` produced a string.
'''

