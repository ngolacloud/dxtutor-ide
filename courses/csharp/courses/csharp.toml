tests = '''
// Runs `work(threadIndex)` on `threadCount` threads released together by a barrier.
// An exception in any thread is rethrown here, so it fails the test instead of the process.
static void Hammer(int threadCount, Action<int> work)
{
    var start = new Barrier(threadCount);
    var errors = new List<Exception>();
    var threads = new Thread[threadCount];
    for (int t = 0; t < threadCount; t++)
    {
        int index = t;
        threads[t] = new Thread(() =>
        {
            try
            {
                start.SignalAndWait();
                work(index);
            }
            catch (Exception e)
            {
                lock (errors) errors.Add(e);
            }
        });
        threads[t].Start();
    }
    foreach (var thread in threads) thread.Join();
    if (errors.Count > 0) throw errors[0];
}

Test("adds and counts", () =>
{
    var inv = new Inventory();
    inv.Add("apple", 3);
    inv.Add("apple", 2);
    inv.Add("pear", 1);
    Equal(inv.Count("apple"), 5);
    Equal(inv.Count("pear"), 1);
    Equal(inv.Count("ghost"), 0);
});

Test("TryRemove succeeds only with enough stock", () =>
{
    var inv = new Inventory();
    inv.Add("bolt", 5);
    Equal(inv.TryRemove("bolt", 3), true);
    Equal(inv.TryRemove("bolt", 3), false);
    Equal(inv.Count("bolt"), 2);
    Equal(inv.TryRemove("ghost", 1), false);
    Equal(inv.Count("ghost"), 0);
    Equal(inv.TryRemove("bolt", 2), true);
    Equal(inv.Count("bolt"), 0);
    Equal(inv.TryRemove("bolt", 1), false);
});

Test("Snapshot is a copy without empty items", () =>
{
    var inv = new Inventory();
    inv.Add("nut", 4);
    inv.Add("bolt", 1);
    inv.TryRemove("bolt", 1);
    var snap = inv.Snapshot();
    Equal(snap, new Dictionary<string, int> { ["nut"] = 4 });
    inv.Add("nut", 10);
    inv.Add("washer", 2);
    Equal(snap, new Dictionary<string, int> { ["nut"] = 4 });
    Equal(inv.Snapshot(), new Dictionary<string, int> { ["nut"] = 14, ["washer"] = 2 });
    Equal(new Inventory().Snapshot(), new Dictionary<string, int>());
});

Test("rejects quantities that are not positive", () =>
{
    var inv = new Inventory();
    inv.Add("x", 1);
    Throws<ArgumentOutOfRangeException>(() => inv.Add("x", 0));
    Throws<ArgumentOutOfRangeException>(() => inv.Add("x", -5));
    Throws<ArgumentOutOfRangeException>(() => inv.TryRemove("x", 0));
    Throws<ArgumentOutOfRangeException>(() => inv.TryRemove("x", -1));
    Equal(inv.Count("x"), 1);
});

Test("no add is lost under contention", () =>
{
    var inv = new Inventory();
    Hammer(8, t =>
    {
        for (int i = 0; i < 50_000; i++)
        {
            inv.Add("hits", 1);
            if (i % 10 == 0) inv.Add($"thread{t}", 2);
        }
    });
    Equal(inv.Count("hits"), 400_000);
    for (int t = 0; t < 8; t++) Equal(inv.Count($"thread{t}"), 10_000);
});

Test("never oversells", () =>
{
    var inv = new Inventory();
    inv.Add("ticket", 10_000);
    int sold = 0;
    Hammer(8, _ =>
    {
        for (int i = 0; i < 2_000; i++)
        {
            if (inv.TryRemove("ticket", 1)) Interlocked.Increment(ref sold);
        }
    });
    Equal(sold, 10_000);
    Equal(inv.Count("ticket"), 0);
    Equal(inv.TryRemove("ticket", 1), false);
});

Test("concurrent adds and removes stay consistent", () =>
{
    var inv = new Inventory();
    inv.Add("widget", 1_000);
    int removed = 0;
    int dippedBelowZero = 0;
    Hammer(8, t =>
    {
        for (int i = 0; i < 20_000; i++)
        {
            if (t % 2 == 0)
            {
                inv.Add("widget", 1);
            }
            else if (inv.TryRemove("widget", 2))
            {
                Interlocked.Increment(ref removed);
            }
            if (inv.Count("widget") < 0) Interlocked.Increment(ref dippedBelowZero);
        }
    });
    Equal(inv.Count("widget"), 1_000 + 4 * 20_000 - 2 * removed);
    Equal(dippedBelowZero, 0);
    Check(removed > 0, "some removals should have succeeded");
});

Test("many items from parallel loops", () =>
{
    var inv = new Inventory();
    Parallel.For(0, 20_000, i => inv.Add($"item{i % 100}", 1));
    var expected = Enumerable.Range(0, 100).ToDictionary(i => $"item{i}", _ => 200);
    Equal(inv.Snapshot(), expected);
});
'''

[unit.step.gabarito]
solution = '''
using System.Collections.Concurrent;

public sealed class Inventory
{
    private readonly ConcurrentDictionary<string, int> _stock = new();

    public void Add(string item, int quantity)
    {
        ArgumentOutOfRangeException.ThrowIfNegativeOrZero(quantity);
        _stock.AddOrUpdate(item, quantity, (_, current) => current + quantity);
    }

    public bool TryRemove(string item, int quantity)
    {
        ArgumentOutOfRangeException.ThrowIfNegativeOrZero(quantity);
        while (true)
        {
            if (!_stock.TryGetValue(item, out int current) || current < quantity)
                return false;
            // Compare-and-swap: succeeds only if nobody changed the count since we read it.
            if (_stock.TryUpdate(item, current - quantity, current))
                return true;
        }
    }

    public int Count(string item) => _stock.TryGetValue(item, out int units) ? units : 0;

    // ToArray takes a consistent copy; enumerating the dictionary directly would not.
    public Dictionary<string, int> Snapshot() =>
        _stock.ToArray()
              .Where(pair => pair.Value > 0)
              .ToDictionary(pair => pair.Key, pair => pair.Value);
}
'''
time = 'O(1) per call, O(m) for Snapshot'
space = 'O(m)'
justification = '''
Let `m` be the number of distinct items. `ConcurrentDictionary` is a hash table split into
independently locked buckets, so `Add`, `Count` and each attempt inside `TryRemove` are
**O(1)** expected time. `AddOrUpdate` retries internally if another thread changed the same key
in between, and `TryRemove`'s loop retries only when its compare-and-swap loses a race. Each
retry means another thread made progress, and under normal contention the expected number of
retries is a small constant. **`Snapshot`** copies every entry once: **O(m)** time and space.
The inventory itself stores one entry per item, **O(m)** space.

Correctness comes from atomicity. `AddOrUpdate` turns "read the count, add, write it back" into
one operation, so 400,000 concurrent adds give exactly 400,000. `TryUpdate(item, new, expected)`
writes only if the value is still the `expected` one that was checked, so two threads can never
both sell the last ticket: one CAS wins, the other sees the new value and retries or gives up.
That makes every run equivalent to some sequential order of the same calls, which is why the
tests can assert exact totals.

A single private `lock` around a plain `Dictionary` is equally correct and simpler to reason
about. Its cost is that all threads queue on one lock, even for different items. The concurrent
dictionary lets operations on different items, and reads, proceed in parallel.
'''

