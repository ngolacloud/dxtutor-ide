[[unit.step]]
kind = "drill"
id = "cs-u10-d3-interfaces"
title = "Interfaces and a default method"
points = 10
difficulty = 10
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
An interface describes a capability without saying how it is implemented, and one class can
implement several of them. A **default interface method** supplies a body that
implementers get for free, but it stays a member of the interface: you can only call it
through a variable of the interface type.
'''
prompt = '''
Define `ISwitchable` (with a default `Status` property) and `IDimmable`, implement both in
`Lamp` and only the first in `Fan`, then work with the devices through the interfaces and a
type pattern.

**Why:** interfaces let unrelated classes be treated alike, and `is IDimmable dim` asks an
object whether it has an extra capability without a chain of concrete type checks.
'''
target = '''
var lamp = new Lamp();
List<ISwitchable> devices = [lamp, new Fan()];

foreach (ISwitchable d in devices)
{
    d.Toggle();
}
lamp.Level = 70;

foreach (ISwitchable d in devices)
{
    string extra = d is IDimmable dim ? $" at {dim.Level}%" : "";
    Console.WriteLine($"{d.GetType().Name}: {d.Status}{extra}");
}
Console.WriteLine(devices.Count(d => d.IsOn));

interface ISwitchable
{
    bool IsOn { get; }
    void Toggle();
    string Status => IsOn ? "on" : "off";
}

interface IDimmable
{
    int Level { get; set; }
}

class Lamp : ISwitchable, IDimmable
{
    public bool IsOn { get; private set; }
    public int Level { get; set; } = 100;
    public void Toggle() => IsOn = !IsOn;
}

class Fan : ISwitchable
{
    public bool IsOn { get; private set; }
    public void Toggle() => IsOn = !IsOn;
}
'''
