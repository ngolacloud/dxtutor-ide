tests = '''
int Reference(string a, string b)
{
    var memo = new Dictionary<(int, int), int>();
    int D(int i, int j)
    {
        if (i == 0) return j;
        if (j == 0) return i;
        if (memo.TryGetValue((i, j), out var known)) return known;
        var result = a[i - 1] == b[j - 1]
            ? D(i - 1, j - 1)
            : 1 + Math.Min(D(i - 1, j - 1), Math.Min(D(i - 1, j), D(i, j - 1)));
        return memo[(i, j)] = result;
    }
    return D(a.Length, b.Length);
}
async Task<bool> FinishesWithin(double seconds, Action work)
{
    var task = Task.Run(work);
    if (await Task.WhenAny(task, Task.Delay(TimeSpan.FromSeconds(seconds))) != task) return false;
    await task;
    return true;
}

Test("classic examples", () =>
{
    Equal(TextDistance.EditDistance("kitten", "sitting"), 3);
    Equal(TextDistance.EditDistance("flaw", "lawn"), 2);
    Equal(TextDistance.EditDistance("intention", "execution"), 5);
});
Test("empty strings", () =>
{
    Equal(TextDistance.EditDistance("", ""), 0);
    Equal(TextDistance.EditDistance("", "abc"), 3);
    Equal(TextDistance.EditDistance("abc", ""), 3);
});
Test("identical strings", () =>
{
    Equal(TextDistance.EditDistance("same", "same"), 0);
    Equal(TextDistance.EditDistance("a", "a"), 0);
});
Test("a substitution costs one", () =>
{
    Equal(TextDistance.EditDistance("a", "b"), 1);
    Equal(TextDistance.EditDistance("abc", "abd"), 1);
    Equal(TextDistance.EditDistance("abcd", "wxyz"), 4);
    Equal(TextDistance.EditDistance("café", "cafe"), 1);
});
Test("symmetric and case-sensitive", () =>
{
    Equal(TextDistance.EditDistance("Sunday", "saturday"), 4);
    Equal(TextDistance.EditDistance("saturday", "Sunday"), 4);
    Equal(TextDistance.EditDistance("ABC", "abc"), 3);
});
Test("null arguments throw", () =>
{
    Throws<ArgumentNullException>(() => TextDistance.EditDistance(null!, "a"));
    Throws<ArgumentNullException>(() => TextDistance.EditDistance("a", null!));
});
Test("matches a memoised reference", () =>
{
    var rng = new Random(34);
    for (var round = 0; round < 300; round++)
    {
        var a = new string(Enumerable.Range(0, rng.Next(0, 10)).Select(_ => "abc"[rng.Next(3)]).ToArray());
        var b = new string(Enumerable.Range(0, rng.Next(0, 10)).Select(_ => "abc"[rng.Next(3)]).ToArray());
        var expected = Reference(a, b);
        var actual = TextDistance.EditDistance(a, b);
        Check(actual == expected, $"EditDistance(\"{a}\", \"{b}\") should be {expected}, got {actual}");
    }
});
Test("strings of 2,000 characters in O(len(a) * len(b))", async () =>
{
    int oneOff = -1, shifted = -1, disjoint = -1;
    var done = await FinishesWithin(15, () =>
    {
        oneOff = TextDistance.EditDistance(new string('a', 2000), new string('a', 1999) + "b");
        shifted = TextDistance.EditDistance(string.Concat(Enumerable.Repeat("ab", 1000)), string.Concat(Enumerable.Repeat("ba", 1000)));
        disjoint = TextDistance.EditDistance(new string('x', 1500), new string('y', 2000));
    });
    Check(done, "three 2,000-character comparisons should take well under a second with a table");
    if (!done) return;
    Equal(oneOff, 1);
    Equal(shifted, 2);
    Equal(disjoint, 2000);
});
'''

[unit.step.gabarito]
solution = '''
public static class TextDistance
{
    // The fewest insertions, deletions and substitutions that turn a into b.
    public static int EditDistance(string a, string b)
    {
        ArgumentNullException.ThrowIfNull(a);
        ArgumentNullException.ThrowIfNull(b);
        if (a.Length < b.Length) (a, b) = (b, a);   // symmetric: keep the rows short

        var previous = new int[b.Length + 1];
        var current = new int[b.Length + 1];
        for (var j = 0; j <= b.Length; j++) previous[j] = j;   // "" -> b[..j]: j insertions

        for (var i = 1; i <= a.Length; i++)
        {
            current[0] = i;                                     // a[..i] -> "": i deletions
            for (var j = 1; j <= b.Length; j++)
            {
                var substitute = previous[j - 1] + (a[i - 1] == b[j - 1] ? 0 : 1);
                var delete = previous[j] + 1;
                var insert = current[j - 1] + 1;
                current[j] = Math.Min(substitute, Math.Min(delete, insert));
            }
            (previous, current) = (current, previous);          // reuse the two rows
        }
        return previous[b.Length];
    }
}
'''
time = "O(len(a) * len(b))"
space = "O(min(len(a), len(b)))"
justification = '''
There is one subproblem per pair of prefix lengths, `(a.Length + 1) × (b.Length + 1)` of
them, and each is filled in O(1) from three neighbours: the cell above (delete), the cell to
the left (insert) and the diagonal (substitute, free when the characters match). That gives
**O(len(a) · len(b))** time, about four million cheap steps for two 2,000-character strings,
while naive recursion branches three ways at every step and is exponential.

Row `i` depends only on row `i − 1`, so the solution keeps two arrays and swaps them with a
tuple assignment after each row, instead of storing the whole table. Swapping the strings so
that `b` is the shorter one makes each row `min(len(a), len(b)) + 1` long, which gives
**O(min(len(a), len(b)))** space and no allocation inside the loops. The base cases are the
first row (`j` insertions turn an empty prefix into `b[..j]`) and the first column (`i`
deletions). Filling the table bottom-up also avoids the deep call chain, about
`a.Length + b.Length` frames, that a memoised top-down version would build, and with it the
risk of a fatal `StackOverflowException` on a thread-pool thread's smaller stack.
'''
