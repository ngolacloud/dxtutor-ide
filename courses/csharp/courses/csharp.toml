[[unit.step]]
kind = "challenge"
id = "cs-u13-x1-min-max-stack"
title = "A generic stack with O(1) min and max"
points = 30
difficulty = 13
entry = "MinMaxStack"
intro = '''
A plain stack answers `Push`, `Pop` and `Peek` in O(1), but finding its minimum means scanning
every element. Storing, next to each element, the minimum and maximum of everything at or below
it keeps those answers ready, so they survive pops for free. Making the stack generic, with a
comparison constraint, lets one implementation serve every orderable type.
'''
instructions = '''
## Your turn

Write a generic class and a small non-generic helper:

```csharp
public class MinMaxStack<T> where T : IComparable<T>
{
    public int Count { get; }
    public void Push(T item);
    public T Pop();
    public T Peek();
    public T Min { get; }
    public T Max { get; }
}

public static class MinMaxStack
{
    public static MinMaxStack<T> Of<T>(params T[] items) where T : IComparable<T>;
}
```

Rules:

- `Push`, `Pop` and `Peek` behave like a normal last-in, first-out stack.
- `Min` and `Max` return the smallest and largest element currently on the stack, using
  `CompareTo`. After a `Pop` they must reflect the remaining elements.
- **Every member must be O(1)**: the tests push 200,000 items and read `Min` and `Max` after
  every push and every pop.
- `Pop`, `Peek`, `Min` and `Max` on an empty stack throw `InvalidOperationException`.
- Pushing `null` (for example on a `MinMaxStack<string>`) throws `ArgumentNullException`
  and leaves the stack unchanged.
- `MinMaxStack.Of(3, 1, 2)` creates a stack and pushes the items in order, so `Pop()` returns
  `2` first. The type argument is inferred, and `Of()` with no items gives an empty stack.

The hidden tests use the stack with `int`, `string`, `decimal`, `char` and `DateOnly`, so it
must be truly generic.

Example: after `Push(5)`, `Push(1)`, `Push(9)`: `Min` is `1`, `Max` is `9`; after one `Pop()`,
`Max` is `5` again.

**Hint:** keep one list of entries, where each entry remembers the item plus the min and max of
the stack at the moment it was pushed. A tuple `(T Item, T Min, T Max)` is enough. A static
class may share its name with a generic class, as `Tuple` and `Tuple<T1, T2>` do.

Hidden tests decide correctness.
'''
starter = '''
