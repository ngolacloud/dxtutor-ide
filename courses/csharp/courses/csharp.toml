[[unit.step]]
kind = "challenge"
id = "cs-u12-x1-config-parser"
title = "A config parser with precise errors"
points = 30
difficulty = 12
entry = "ConfigParser"
intro = '''
A good error message is part of an API's contract. Instead of letting a raw `FormatException`
escape from deep inside a loop, a parser should translate it into an exception that says
**where** the problem is, while keeping the low-level cause as `InnerException` for whoever
needs to debug it. The `Try` pattern then offers a no-exception path for callers that expect
bad input.
'''
instructions = '''
## Your turn

Write two types.

**`ConfigException`**, a custom exception that derives from `Exception`:

```csharp
public ConfigException(int line, string reason, Exception? inner = null)
public int Line { get; }
public string Reason { get; }
```

Its `Message` is exactly `line {Line}: {Reason}`, for example `line 3: missing key`, and
`inner` becomes its `InnerException`.

**`ConfigParser`**, a static class that reads `key = value` lines whose values are whole numbers:

```csharp
public static Dictionary<string, int> Parse(string text)
public static bool TryParse(string text, out Dictionary<string, int> result, out string? error)
```

Rules for `Parse`, checked in this order for each line:

1. `null` text throws `ArgumentNullException`.
2. Split the text on `'\n'`; lines are numbered from 1. Trim each line (this also removes a
   Windows `'\r'`). Skip lines that are empty or start with `#`.
3. A line without `=` throws `ConfigException(line, "expected key = value")`.
4. Split at the **first** `=` and trim both sides. An empty key throws reason `missing key`.
5. A key seen before throws reason `duplicate key 'name'` (keys are case-sensitive).
6. Parse the value with `int.Parse(value, NumberStyles.AllowLeadingSign,
   CultureInfo.InvariantCulture)`. A `FormatException` becomes reason
   `'abc' is not a whole number`, and an `OverflowException` becomes reason
   `'99999999999' is out of range`. In both cases pass the caught exception as `inner`.

`TryParse` never throws for bad content: on success it returns `true`, the dictionary and a
`null` error; on a `ConfigException` it returns `false`, an **empty** dictionary and the
exception's `Message`.

Example: `Parse("# server\nport = 8080\nworkers=4\n")` returns `{ port: 8080, workers: 4 }`,
and `Parse("port = 80\nport = 81")` throws with `Message` `line 2: duplicate key 'port'`.

**Hint:** a primary constructor such as `class ConfigException(int line, string reason,
Exception? inner = null) : Exception(...)` builds the message in one place. Catch the two
parsing exceptions right around `int.Parse` and wrap them.

Hidden tests decide correctness.
'''
starter = '''
using System.Globalization;

// A parse error that remembers where it happened.
// Message must be "line {Line}: {Reason}"; `inner` becomes InnerException.
public class ConfigException : Exception
{
    public ConfigException(int line, string reason, Exception? inner = null)
    {
        throw new NotImplementedException();
    }

    public int Line => throw new NotImplementedException();

    public string Reason => throw new NotImplementedException();
}

// Reads "key = value" lines with whole-number values; see the rules in the instructions.
public static class ConfigParser
{
    public static Dictionary<string, int> Parse(string text)
    {
        throw new NotImplementedException();
    }

    public static bool TryParse(string text, out Dictionary<string, int> result, out string? error)
    {
        throw new NotImplementedException();
    }
}
'''
