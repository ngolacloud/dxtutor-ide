run_command = "dotnet run"
intro = '''
Merging is the combine step of merge sort: two indexes walk two sorted arrays, and the
smaller front item goes to the output each time. It takes O(n + m) time because every
comparison places one item.
'''
prompt = '''
Merge two sorted arrays into a new one, counting the comparisons, and merge an empty array
with a non-empty one.

**Why:** the merge is linear, which is what makes merge sort O(n log n); the `<=` decides
stability, and the leftover loops handle arrays of different lengths.
'''
target = '''
int[] left = [1, 4, 4, 9], right = [2, 3, 4, 10, 12];
var merged = Merge(left, right, out var comparisons);
Console.WriteLine($"{string.Join(" ", merged)} ({comparisons} comparisons)");
Console.WriteLine(string.Join(" ", Merge([], [7, 8], out _)));

static int[] Merge(int[] left, int[] right, out int comparisons)
{
    var result = new int[left.Length + right.Length];
    int i = 0, j = 0, k = 0;
    comparisons = 0;
    while (i < left.Length && j < right.Length)
    {
        comparisons++;
        result[k++] = left[i] <= right[j] ? left[i++] : right[j++];
    }
    while (i < left.Length) result[k++] = left[i++];
    while (j < right.Length) result[k++] = right[j++];
    return result;
}
'''
line_comments = [
  "Two sorted inputs of different lengths.",
  "Merges and reports the comparisons made.",
  "Prints `1 2 3 4 4 4 9 10 12 (7 comparisons)`.",
  "An empty side: prints `7 8` with no comparisons; `out _` discards the count.",
  "",
  "Both inputs must already be sorted.",
  "",
