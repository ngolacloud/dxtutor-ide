[[unit.step]]
kind = "drill"
id = "cs-u27-d3-stackalloc"
title = "Format into a stack buffer"
points = 10
difficulty = 27
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
When you build a short string piece by piece, a `stackalloc` buffer can hold the pieces while
you work and only the finished result becomes a heap string. `TryFormat` writes a number's
digits straight into a span and reports how many characters it used.
'''
prompt = '''
Write `ToHex`, which turns bytes into lowercase hexadecimal, and `FormatPair`, which formats
`(x, y)`, both into stack buffers, allocating only the final string.

**Why:** this is how `string.Format`, `ToString` and logging libraries work internally:
format into a buffer, then allocate once.
'''
target = '''
using System.Globalization;

Console.WriteLine(ToHex(new byte[] { 0xDE, 0xAD, 0xBE, 0xEF }));
Console.WriteLine(FormatPair(-12, 345));

static string ToHex(ReadOnlySpan<byte> bytes)
{
    Span<char> buffer = bytes.Length <= 128 ? stackalloc char[bytes.Length * 2] : new char[bytes.Length * 2];
    const string digits = "0123456789abcdef";
    for (int i = 0; i < bytes.Length; i++)
    {
        buffer[2 * i] = digits[bytes[i] >> 4];
        buffer[2 * i + 1] = digits[bytes[i] & 0xF];
    }
    return new string(buffer);
}

static string FormatPair(int x, int y)
{
    Span<char> buffer = stackalloc char[32];
    int pos = 0;
    buffer[pos++] = '(';
    x.TryFormat(buffer[pos..], out int written, default, CultureInfo.InvariantCulture);
    pos += written;
    ", ".AsSpan().CopyTo(buffer[pos..]);
    pos += 2;
    y.TryFormat(buffer[pos..], out written, default, CultureInfo.InvariantCulture);
    pos += written;
    buffer[pos++] = ')';
    return new string(buffer[..pos]);
}
'''
