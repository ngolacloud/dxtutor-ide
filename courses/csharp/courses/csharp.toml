kind = "challenge"
id = "cs-u30-x1-singly-linked-list"
title = "A complete singly linked list"
points = 40
difficulty = 30
entry = "SinglyLinkedList"
intro = '''
A real list type keeps its invariants by itself: the head, the tail and the count must agree
after every operation, including the awkward ones that empty the list or remove its last
node. Reversal is the classic test of pointer rewiring: every `Next` must be turned around
while you still hold enough references not to lose the rest of the chain.
'''
instructions = '''
## Your turn

Complete the class `SinglyLinkedList<T>`. The node class `ListNode<T>` is provided in the
starter; don't change it.

```csharp
public sealed class SinglyLinkedList<T> : IEnumerable<T>
{
    public ListNode<T>? Head { get; }   // the first node, or null when empty
    public int Count { get; }
    public void AddFirst(T value);
    public void AddLast(T value);
    public T RemoveFirst();
    public bool Remove(T value);
    public void Reverse();
    public IEnumerator<T> GetEnumerator();
}
```

Rules:

- `AddFirst`, `AddLast`, `RemoveFirst` and `Count` must be **O(1)**: keep a head, a tail and
  a counter. The hidden tests append a million values.
- `RemoveFirst` returns the first value and unlinks its node. On an empty list it throws
  `InvalidOperationException`.
- `Remove` deletes the **first** node whose value equals `value`, compared with
  `EqualityComparer<T>.Default` (so `null` values work), and returns whether it found one.
- `Reverse` reverses the list **in place**: reuse the existing nodes and rewire their
  `Next`; don't create nodes and don't copy values. The old last node becomes `Head`.
- Keep the tail correct in every case: after removing the last node, after emptying the
  list and after reversing it, `AddLast` must still append at the real end.
- `GetEnumerator` yields the values from head to tail. Use loops, not recursion: a million
  nodes would overflow the stack.

Examples:

```csharp
var list = new SinglyLinkedList<int>();
list.AddLast(2); list.AddFirst(1); list.AddLast(3);   // 1 -> 2 -> 3, Count 3
list.Remove(2);                                       // true: 1 -> 3
list.Reverse();                                       // 3 -> 1
list.AddLast(9);                                      // 3 -> 1 -> 9
list.RemoveFirst();                                   // returns 3: 1 -> 9
```

**Hint:** for `Reverse`, walk once with two references, the part already reversed and the
part not yet visited, and save the next node before you overwrite `Next`.

Hidden tests decide correctness.
'''
starter = '''
// The node class is provided: don't change it.
public sealed class ListNode<T>(T value)
{
    public T Value { get; } = value;
    public ListNode<T>? Next { get; set; }
}

// A singly linked list with a head, a tail and a count.
// AddFirst, AddLast, RemoveFirst and Count must be O(1); Reverse rewires the nodes in place.
public sealed class SinglyLinkedList<T> : IEnumerable<T>
{
    public ListNode<T>? Head => throw new NotImplementedException();

    public int Count => throw new NotImplementedException();

    public void AddFirst(T value) => throw new NotImplementedException();

    public void AddLast(T value) => throw new NotImplementedException();

    // Throws InvalidOperationException when the list is empty.
    public T RemoveFirst() => throw new NotImplementedException();

    // Removes the first node whose value equals `value`; returns false if there is none.
    public bool Remove(T value) => throw new NotImplementedException();

    // Reverses the list in place: no new nodes, no copied values.
    public void Reverse() => throw new NotImplementedException();

    public IEnumerator<T> GetEnumerator() => throw new NotImplementedException();

    System.Collections.IEnumerator System.Collections.IEnumerable.GetEnumerator() => GetEnumerator();
}
'''
tests = '''
// Walks the chain through Head, refusing to loop forever if a Next was left pointing backwards.
List<ListNode<T>> Nodes<T>(SinglyLinkedList<T> list)
{
    var nodes = new List<ListNode<T>>();
    for (var node = list.Head; node is not null; node = node.Next)
    {
        nodes.Add(node);
        if (nodes.Count > list.Count + 1)
            throw new InvalidOperationException("the chain is longer than Count: is there a cycle?");
    }
    return nodes;
}
List<T> Values<T>(SinglyLinkedList<T> list) => Nodes(list).Select(n => n.Value).ToList();
SinglyLinkedList<T> Build<T>(params T[] values)
{
    var list = new SinglyLinkedList<T>();
    foreach (var v in values) list.AddLast(v);
    return list;
}
async Task<bool> FinishesWithin(double seconds, Action work)
{
    var task = Task.Run(work);
    if (await Task.WhenAny(task, Task.Delay(TimeSpan.FromSeconds(seconds))) != task) return false;
    await task;
    return true;
}

Test("a new list is empty", () =>
{
    var list = new SinglyLinkedList<int>();
    Equal(list.Count, 0);
    Check(list.Head is null, "Head must be null on an empty list");
    Equal(list.ToList(), new List<int>());
});
Test("RemoveFirst on an empty list throws", () =>
    Throws<InvalidOperationException>(() => new SinglyLinkedList<string>().RemoveFirst()));
Test("AddFirst and AddLast keep the order", () =>
{
    var list = new SinglyLinkedList<int>();
    list.AddLast(2);
    list.AddFirst(1);
    list.AddLast(3);
    list.AddFirst(0);
    Equal(Values(list), new List<int> { 0, 1, 2, 3 });
    Equal(list.Count, 4);
    Equal(list.ToArray(), new[] { 0, 1, 2, 3 });
});
Test("RemoveFirst returns values in order and updates Count", () =>
{
    var list = Build("a", "b", "c");
    Equal(list.RemoveFirst(), "a");
    Equal(list.RemoveFirst(), "b");
    Equal(list.Count, 1);
    Equal(list.RemoveFirst(), "c");
    Equal(list.Count, 0);
    Check(list.Head is null, "Head must be null once the list is empty");
    Throws<InvalidOperationException>(() => list.RemoveFirst());
});
Test("emptying the list resets the tail", () =>
{
    var list = Build(1);
    list.RemoveFirst();
    list.AddLast(5);
    list.AddLast(6);
    Equal(Values(list), new List<int> { 5, 6 });
    var other = new SinglyLinkedList<int>();
    other.AddFirst(1);
    other.AddLast(2);
    Equal(Values(other), new List<int> { 1, 2 });
});
Test("Remove deletes only the first match", () =>
{
    var list = Build(7, 1, 7, 2, 7);
    Check(list.Remove(7), "Remove(7) should return true");
    Equal(Values(list), new List<int> { 1, 7, 2, 7 });
    Check(list.Remove(2), "Remove(2) should return true");
    Equal(Values(list), new List<int> { 1, 7, 7 });
    Check(!list.Remove(42), "Remove(42) should return false");
    Equal(list.Count, 3);
});
Test("removing the last node keeps the tail correct", () =>
{
    var list = Build(1, 2, 3);
    Check(list.Remove(3), "Remove(3) should return true");
    list.AddLast(4);
    Equal(Values(list), new List<int> { 1, 2, 4 });
    Check(list.Remove(1) && list.Remove(2) && list.Remove(4), "all three removals should succeed");
    Equal(list.Count, 0);
    list.AddLast(9);
    Equal(Values(list), new List<int> { 9 });
    Check(!new SinglyLinkedList<int>().Remove(1), "Remove on an empty list returns false");
});
Test("Remove compares values, including null", () =>
{
    var list = Build<string?>("ab", null, "cd");
    Check(list.Remove(new string(new[] { 'c', 'd' })), "an equal string is the same value");
    Check(list.Remove(null), "null is a value that can be removed");
    Equal(Values(list), new List<string?> { "ab" });
});
Test("Reverse reuses the same nodes", () =>
{
    var list = Build(10, 20, 30, 40);
    var before = Nodes(list);
    list.Reverse();
    var after = Nodes(list);
    Equal(after.Count, 4);
    for (var i = 0; i < 4; i++)
        Check(ReferenceEquals(after[i], before[3 - i]), $"node {i} must be the old node {3 - i}, rewired");
    Equal(Values(list), new List<int> { 40, 30, 20, 10 });
    Check(before[0].Next is null, "the old head is the new last node, so its Next must be null");
});
Test("Reverse handles empty, single and two-node lists", () =>
{
    var empty = new SinglyLinkedList<int>();
    empty.Reverse();
    Equal(empty.Count, 0);
    var one = Build('x');
    var node = one.Head;
    one.Reverse();
    Check(ReferenceEquals(one.Head, node), "a single node stays the head");
    Equal(Values(one), new List<char> { 'x' });
    var two = Build('a', 'b');
    two.Reverse();
    Equal(Values(two), new List<char> { 'b', 'a' });
});
Test("the tail follows a reversal", () =>
{
    var list = Build(1, 2, 3);
    list.Reverse();
    list.AddLast(0);
    list.AddFirst(4);
    Equal(Values(list), new List<int> { 4, 3, 2, 1, 0 });
    Equal(list.Count, 5);
});
Test("a million nodes in O(n)", async () =>
{
    const int n = 1_000_000;
    var list = new SinglyLinkedList<int>();
    var done = await FinishesWithin(10, () =>
    {
        for (var i = 0; i < n; i++) list.AddLast(i);
        list.Reverse();
        for (var i = 0; i < 10; i++) list.RemoveFirst();
    });
    Check(done, "a million appends, one reversal and ten pops should take well under a second");
    if (!done) return;
    Equal(list.Count, n - 10);
    Equal(list.First(), n - 11);
    Equal(list.Last(), 0);
    long sum = 0;
    foreach (var v in list) sum += v;
    Equal(sum, (long)(n - 10) * (n - 11) / 2);
});
'''

[unit.step.gabarito]
solution = '''
// The node class is provided: don't change it.
public sealed class ListNode<T>(T value)
{
    public T Value { get; } = value;
    public ListNode<T>? Next { get; set; }
}

// A singly linked list with a head, a tail and a count.
public sealed class SinglyLinkedList<T> : IEnumerable<T>
{
    private ListNode<T>? _head;
    private ListNode<T>? _tail;

    public ListNode<T>? Head => _head;

    public int Count { get; private set; }

    public void AddFirst(T value)
    {
        var node = new ListNode<T>(value) { Next = _head };
        _head = node;
        _tail ??= node;               // the first node is also the last
        Count++;
    }

    public void AddLast(T value)
    {
        var node = new ListNode<T>(value);
        if (_tail is null) _head = node;
        else _tail.Next = node;
        _tail = node;
        Count++;
    }

    public T RemoveFirst()
    {
        var node = _head ?? throw new InvalidOperationException("The list is empty.");
        _head = node.Next;
        if (_head is null) _tail = null;   // the list is empty again
        node.Next = null;
        Count--;
        return node.Value;
    }

    public bool Remove(T value)
    {
        var comparer = EqualityComparer<T>.Default;
        ListNode<T>? prev = null;
        for (var node = _head; node is not null; prev = node, node = node.Next)
        {
            if (!comparer.Equals(node.Value, value)) continue;
            if (prev is null) _head = node.Next;
            else prev.Next = node.Next;
            if (ReferenceEquals(node, _tail)) _tail = prev;
            node.Next = null;
            Count--;
            return true;
        }
        return false;
    }

    public void Reverse()
    {
        ListNode<T>? reversed = null;
        var node = _head;
        _tail = _head;                     // the old head ends up last
        while (node is not null)
        {
            var following = node.Next;     // save the rest before cutting it off
            node.Next = reversed;
            reversed = node;
            node = following;
        }
        _head = reversed;
    }

    public IEnumerator<T> GetEnumerator()
    {
        for (var node = _head; node is not null; node = node.Next)
            yield return node.Value;
    }

    System.Collections.IEnumerator System.Collections.IEnumerable.GetEnumerator() => GetEnumerator();
}
'''
time = "O(1) per AddFirst/AddLast/RemoveFirst/Count; O(n) for Remove, Reverse and enumeration"
space = "O(n) for the nodes; O(1) extra per operation"
justification = '''
`AddFirst`, `AddLast` and `RemoveFirst` each create or unlink one node and update a constant
number of references (`_head`, `_tail`, one `Next`) plus the counter, so they are **O(1)**
whatever the length. `Count` is a stored property, also **O(1)**. That is why a million
appends finish in milliseconds, while an `AddLast` that walked to the end every time would
do about n²/2 ≈ 5·10¹¹ steps.

`Remove` walks from the head until it finds a match, **O(n)** in the worst case, with O(1)
work to unlink: the predecessor skips the node, and if the node was the tail, the
predecessor becomes the tail. `Reverse` visits each node exactly once and flips its `Next`,
so it is **O(n)** time with **O(1)** extra space: three references (`reversed`, `node`,
`following`) regardless of the length, and no node is copied. Its invariant is that
`reversed` heads the already-reversed prefix and `node` heads the untouched suffix; saving
`node.Next` first is essential, because flipping it would cut the suffix off. The old head
becomes the tail, which is why `_tail = _head` is set before the loop.

The iterator yields lazily with a loop, so enumeration is O(n) time and O(1) extra space. A
recursive walk or reversal would also be O(n) time, but it would need O(n) stack frames and
crash with an uncatchable `StackOverflowException` on a million nodes.
'''

[[unit]]
id = "cs-u31-hash-maps"
title = "Hash tables, frequencies and sets"
level = "advanced"
difficulty = 31
intro = '''
A hash table turns a key into an array index, which is how `Dictionary<TKey, TValue>` and
`HashSet<T>` find things in O(1) on average. You will compute hash codes and bucket indexes
by hand, build a tiny chained map, count frequencies and combine sets, and finish by writing
a resizing `HashTable<TKey, TValue>` from scratch that holds 200,000 keys without slowing
down.
'''
concepts = '''
## The idea

A **hash table** stores entries in an array of **buckets**. A **hash function** turns each key into an integer, the **hash code**, and the hash code modulo the number of buckets picks the bucket. To find a key you hash it, jump straight to one bucket and search only there.

Different keys can land in the same bucket: a **collision**. With **separate chaining**, each bucket holds a small chain of entries, and a lookup scans the chain comparing keys for equality. (**Open addressing**, the other big family, probes neighbouring slots instead.)

The **load factor** is entries divided by buckets. While it stays below a constant, chains stay short and lookups are **O(1) on average**. When it grows too high the table **resizes**: it allocates more buckets, usually double, and rehashes every entry. One resize costs O(n), but doubling makes them rare, so inserts are **O(1) amortised**. The worst case is O(n), when every key collides into one chain.

## How C# does it

Every object has `GetHashCode()` and `Equals(object)`. The contract: **equal objects must return equal hash codes**, while unequal objects should usually differ. Records, tuples, strings and the numeric types already honour it. Generic code reaches both methods through `EqualityComparer<T>.Default`:

```csharp
var cmp = EqualityComparer<string>.Default;
int bucket = (cmp.GetHashCode("apple") & 0x7FFFFFFF) % 16;
```

`Dictionary<TKey, TValue>` is a chained hash table that grows automatically; `HashSet<T>` is the same idea storing only keys. `TryGetValue` does a lookup without an exception, and `GetValueOrDefault` turns counting into a one-liner.

## What is special or tricky

- **Hash codes can be negative**, and in C# `-7 % 8` is `-7`. Using it as an index throws `IndexOutOfRangeException`. Clear the sign bit with `& 0x7FFFFFFF` first.
- **`string.GetHashCode()` is randomised per process** in .NET. The same string hashes differently on every run, which defeats attacks that flood a table with colliding keys. Never store or print string hash codes.
- **Override both or neither.** Overriding `Equals` without `GetHashCode` gives warning **CS0659**, and a dictionary will then miss keys that are equal.
- **Don't mutate a key** after inserting it: its hash changes, it sits in the wrong bucket and lookups fail.
- `dict[key]` on a missing key throws `KeyNotFoundException`; `Add` with an existing key throws `ArgumentException`; changing a dictionary while you `foreach` over it throws `InvalidOperationException`.

## What you will practise

You will hash strings by hand and map them to buckets, build a chained map with a fixed bucket array, count words with a `Dictionary` and combine `HashSet`s. The challenge asks for a generic `HashTable<TKey, TValue>` with chaining, removal and doubling, checked on colliding keys and on 200,000 entries.
'''

[[unit.step]]
kind = "concept"
id = "cs-u31-c1-buckets"
title = "Buckets, hashing and collisions"
points = 5
difficulty = 31
intro = '''
A hash table is an array plus a function that turns keys into array indexes. Collisions are
unavoidable, so every design needs a plan for them, and a resizing policy that keeps the
chains short.
'''
body = '''
## From key to bucket

Hashing is a two-step trip from a key to a slot:

```csharp
int hash = EqualityComparer<TKey>.Default.GetHashCode(key);
int index = (hash & 0x7FFFFFFF) % buckets.Length;
```

The mask clears the sign bit, because a hash code may be negative and C#'s `%` keeps the
sign of the left operand. Two keys that are `Equals` always produce the same hash, so they
always meet in the same bucket.

## Collisions and chaining

Different keys may share a bucket. With **separate chaining**, every bucket holds a chain
of entries, and a lookup walks one chain comparing keys with `Equals`. The hash only narrows
the search; equality decides.

## Load factor and resizing

With n entries and m buckets the average chain has n / m entries, the **load factor**.
Keep it below a constant (0.75 is a common choice) and every operation scans O(1) entries on
average. When an insert pushes the load factor over the limit, allocate twice as many
buckets and move every entry to `hash % newLength`. Each entry must be rehashed, because its
index depends on the array length.

A resize costs O(n), yet it happens only after the table has doubled since the last one.
Over n inserts the resize work adds up to about n + n/2 + n/4 + … < 2n, so each insert is
**O(1) amortised**. That is exactly how `Dictionary<TKey, TValue>` and `List<T>` grow.
'''

