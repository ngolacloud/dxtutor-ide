[[unit.step]]
kind = "drill"
id = "cs-u15-d3-deferred-execution"
title = "When does a query run?"
points = 10
difficulty = 15
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
A LINQ query is evaluated lazily: defining it does no work, and every enumeration runs it again
over the source as it is at that moment. Counting how often the lambda runs makes this visible,
and shows why `ToList()` is the way to take a snapshot.
'''
prompt = '''
Count how many times a `Select` lambda runs while you define a query, change its source,
enumerate it, sum it, snapshot it with `ToList()` and search it with `First`.

**Why:** deferred execution is LINQ's biggest strength (no wasted work) and its biggest trap
(work repeated, or done later than you think).
'''
target = '''
var numbers = new List<int> { 1, 2, 3 };
int evaluations = 0;

var doubled = numbers.Select(n =>
{
    evaluations++;
    return n * 2;
});
Console.WriteLine($"after defining: {evaluations}");

numbers.Add(4);
Console.WriteLine(string.Join(", ", doubled));
Console.WriteLine($"after joining: {evaluations}");
Console.WriteLine($"sum {doubled.Sum()}, now {evaluations}");

var snapshot = doubled.ToList();
numbers.Add(5);
Console.WriteLine($"snapshot has {snapshot.Count}, query has {doubled.Count()}");
Console.WriteLine($"total evaluations: {evaluations}");

int firstBig = doubled.First(n => n > 4);
Console.WriteLine($"first > 4 is {firstBig}, evaluations {evaluations}");
'''
line_comments = [
  "The source list.",
  "Counts how often the lambda runs.",
  "",
  "Defines the query; nothing runs yet.",
  "",
  "A side effect, only for the demonstration.",
  "The real work of the projection.",
  "",
  "Prints `0`: the query is only a recipe.",
  "",
  "Changes the source AFTER the query was defined.",
  "Enumerates: sees all four numbers.",
  "Prints `4`.",
  "`Sum` enumerates again: four more evaluations.",
  "",
  "Runs the query once more and stores the results.",
  "The snapshot will not see this.",
  "`snapshot.Count` is a property; `doubled.Count()` runs the query.",
  "Every enumeration paid again.",
