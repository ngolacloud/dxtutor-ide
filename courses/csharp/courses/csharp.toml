[[unit.step]]
kind = "challenge"
id = "cs-u16-x1-layered-config"
title = "A layered configuration lookup"
points = 30
difficulty = 16
entry = "LayeredConfig"
intro = '''
Real applications read settings from several layers, such as a user file over built-in
defaults, and every layer may be missing, hold null, or hold a blank string. Expressing "may be
missing" in the types and resolving it with `?.`, `??` and `int?` turns a crash-prone lookup into
a few honest lines.
'''
instructions = '''
## Your turn

Implement the class `LayeredConfig`:

```csharp
public LayeredConfig(IReadOnlyDictionary<string, string?>? user,
                     IReadOnlyDictionary<string, string?> defaults)
public string? Get(string key)
public string? SourceOf(string key)
public string GetOrDefault(string key, string fallback)
public int? GetInt(string key)
```

A value is **set** in a layer when the key is present and its value is not null, not empty and
not only whitespace. Lookups check the `user` layer first, then `defaults`.

- The constructor throws `ArgumentNullException` when `defaults` is null. `user` may be null,
  meaning there is no user layer at all.
- `Get` returns the first set value (unchanged, not trimmed), or `null` when neither layer sets
  the key.
- `SourceOf` returns `"user"` or `"defaults"` for the layer that `Get` would read, or `null`.
- `GetOrDefault` returns `Get(key)`, or `fallback` when that is null.
- `GetInt` parses what `Get` returns as an integer using `CultureInfo.InvariantCulture` and
  `NumberStyles.Integer` (surrounding spaces and a leading sign are fine). It returns `null` when
  the key is not set or the text is not a valid `int`, including overflow. It never throws for bad
  text.
- `Get`, `SourceOf`, `GetOrDefault` and `GetInt` throw `ArgumentNullException` for a null `key`.

Example: with user `{ "port": "9090", "host": null }` and defaults
`{ "port": "8080", "host": "localhost" }`, `Get("port")` is `"9090"` from `"user"`,
`Get("host")` is `"localhost"` from `"defaults"`, and `GetInt("port")` is `9090`.

**Hint:** one private helper that returns both the value and its source keeps the four public
methods to a line each. `GetValueOrDefault` works on any `IReadOnlyDictionary`.

Hidden tests decide correctness.
'''
starter = '''
using System.Globalization;

// Looks settings up in an optional user layer first, then in the defaults.
// Null, empty and whitespace-only values count as "not set".
public sealed class LayeredConfig
{
    public LayeredConfig(IReadOnlyDictionary<string, string?>? user, IReadOnlyDictionary<string, string?> defaults)
    {
        throw new NotImplementedException();
    }

    // The first set value, user layer first; null when no layer sets the key.
    public string? Get(string key) => throw new NotImplementedException();

    // "user", "defaults", or null: the layer Get would read.
    public string? SourceOf(string key) => throw new NotImplementedException();

    // Get(key), or fallback when it is null.
    public string GetOrDefault(string key, string fallback) => throw new NotImplementedException();

    // Get(key) parsed as an invariant-culture int; null when unset or not a valid int.
    public int? GetInt(string key) => throw new NotImplementedException();
}
'''
tests = '''
Test("the user layer wins over the defaults", () =>
{
    var cfg = new LayeredConfig(
        new Dictionary<string, string?> { ["port"] = "9090" },
        new Dictionary<string, string?> { ["port"] = "8080", ["host"] = "localhost" });
    Equal(cfg.Get("port"), "9090");
    Equal(cfg.Get("host"), "localhost");
    Equal(cfg.SourceOf("port"), "user");
    Equal(cfg.SourceOf("host"), "defaults");
});
Test("a null user layer means defaults only", () =>
{
    var cfg = new LayeredConfig(null, new Dictionary<string, string?> { ["mode"] = "fast" });
    Equal(cfg.Get("mode"), "fast");
    Equal(cfg.SourceOf("mode"), "defaults");
    Equal(cfg.Get("other"), null);
});
Test("null, empty and blank values fall through", () =>
{
    var cfg = new LayeredConfig(
        new Dictionary<string, string?> { ["host"] = null, ["mode"] = "   ", ["name"] = "" },
        new Dictionary<string, string?> { ["host"] = "localhost", ["mode"] = "fast", ["name"] = " \t" });
    Equal(cfg.Get("host"), "localhost");
    Equal(cfg.Get("mode"), "fast");
    Equal(cfg.SourceOf("mode"), "defaults");
    Equal(cfg.Get("name"), null);
    Equal(cfg.SourceOf("name"), null);
});
Test("values come back untrimmed", () =>
{
    var cfg = new LayeredConfig(new Dictionary<string, string?> { ["greeting"] = "  hi  " },
        new Dictionary<string, string?>());
    Equal(cfg.Get("greeting"), "  hi  ");
});
Test("missing keys use the fallback", () =>
{
    var cfg = new LayeredConfig(new Dictionary<string, string?>(), new Dictionary<string, string?> { ["a"] = "1" });
    Equal(cfg.GetOrDefault("a", "x"), "1");
    Equal(cfg.GetOrDefault("zzz", "x"), "x");
    Equal(cfg.SourceOf("zzz"), null);
});
Test("GetInt parses invariant integers", () =>
{
    var cfg = new LayeredConfig(null, new Dictionary<string, string?>
    {
        ["a"] = " 42 ", ["b"] = "-7", ["c"] = "+3", ["d"] = "4,2", ["e"] = "abc",
        ["f"] = "99999999999", ["g"] = "2147483647", ["h"] = "1.5",
    });
    Equal(cfg.GetInt("a"), 42);
    Equal(cfg.GetInt("b"), -7);
    Equal(cfg.GetInt("c"), 3);
    Equal(cfg.GetInt("d"), null);
    Equal(cfg.GetInt("e"), null);
    Equal(cfg.GetInt("f"), null);
    Equal(cfg.GetInt("g"), int.MaxValue);
    Equal(cfg.GetInt("h"), null);
    Equal(cfg.GetInt("missing"), null);
});
Test("GetInt reads the value Get would return", () =>
{
    var cfg = new LayeredConfig(
        new Dictionary<string, string?> { ["port"] = "auto", ["retries"] = null },
        new Dictionary<string, string?> { ["port"] = "8080", ["retries"] = "5" });
    Equal(cfg.GetInt("port"), null);
    Equal(cfg.GetInt("retries"), 5);
});
Test("null arguments are rejected", () =>
{
    Throws<ArgumentNullException>(() => new LayeredConfig(null, null!));
    Throws<ArgumentNullException>(() => new LayeredConfig(new Dictionary<string, string?>(), null!));
    var cfg = new LayeredConfig(null, new Dictionary<string, string?>());
    Throws<ArgumentNullException>(() => cfg.Get(null!));
    Throws<ArgumentNullException>(() => cfg.SourceOf(null!));
    Throws<ArgumentNullException>(() => cfg.GetInt(null!));
    Throws<ArgumentNullException>(() => cfg.GetOrDefault(null!, "x"));
});
Test("many keys stay fast", () =>
{
    var defaults = new Dictionary<string, string?>();
    for (int i = 0; i < 100_000; i++) defaults[$"k{i}"] = i.ToString(System.Globalization.CultureInfo.InvariantCulture);
    var user = new Dictionary<string, string?> { ["k5"] = "-5" };
    var cfg = new LayeredConfig(user, defaults);
    long sum = 0;
    for (int i = 0; i < 100_000; i++) sum += cfg.GetInt($"k{i}") ?? 0;
    Equal(sum, 4999950000L - 10);
});
'''

[unit.step.gabarito]
solution = '''
using System.Globalization;

// Looks settings up in an optional user layer first, then in the defaults.
// Null, empty and whitespace-only values count as "not set".
public sealed class LayeredConfig
{
    private readonly IReadOnlyDictionary<string, string?>? _user;
    private readonly IReadOnlyDictionary<string, string?> _defaults;

    public LayeredConfig(IReadOnlyDictionary<string, string?>? user, IReadOnlyDictionary<string, string?> defaults)
    {
        ArgumentNullException.ThrowIfNull(defaults);
        _user = user;
        _defaults = defaults;
    }

    public string? Get(string key) => Lookup(key).Value;

    public string? SourceOf(string key) => Lookup(key).Source;

    public string GetOrDefault(string key, string fallback) => Get(key) ?? fallback;

    public int? GetInt(string key) =>
        int.TryParse(Get(key), NumberStyles.Integer, CultureInfo.InvariantCulture, out int n) ? n : null;

    private (string? Value, string? Source) Lookup(string key)
    {
        ArgumentNullException.ThrowIfNull(key);
        string? fromUser = _user?.GetValueOrDefault(key);
        if (!string.IsNullOrWhiteSpace(fromUser)) return (fromUser, "user");
        string? fromDefaults = _defaults.GetValueOrDefault(key);
        if (!string.IsNullOrWhiteSpace(fromDefaults)) return (fromDefaults, "defaults");
        return (null, null);
    }
}
'''
time = "O(k) per lookup"
space = "O(1)"
justification = '''
Each public method does at most two dictionary lookups. A `Dictionary` lookup hashes the key, so
it costs **O(k)** for a key of length k (hashing reads every character) and O(1) in the number of
stored settings, on average. `IsNullOrWhiteSpace` and `int.TryParse` scan the value once, which is
also linear in its length. Nothing is copied: the class keeps references to the two
dictionaries, so the extra space per call is **O(1)**, just a tuple on the stack.

The null handling is where the design pays off. `_user?.GetValueOrDefault(key)` collapses "no
user layer", "key absent" and "value is null" into one `string?`, and the
`[NotNullWhen(false)]` annotation on `IsNullOrWhiteSpace` lets the compiler see that the returned
value is a real string. `GetInt` returns `int?` instead of 0 or -1, so callers can tell "missing
or invalid" apart from a real zero, and `TryParse` avoids using exceptions for ordinary bad input.
'''

[[unit]]
id = "cs-u17-dates-times"
title = "Dates, times and durations"
level = "intermediate"
difficulty = 17
intro = '''
"When?" sounds simple until time zones, leap years and month ends get involved. .NET gives you
separate types for a calendar date, a time of day, a duration and an exact instant, and choosing
the right one prevents most date bugs before they happen. You will do calendar arithmetic, work
with durations, convert between offsets and UTC, and finish by computing invoice due dates in
business days.
'''
concepts = '''
## The idea

Programs ask three different questions about time, and mixing them up causes most date bugs:

- **An instant**: a single point on the global timeline, such as "when was this order placed?".
  It is the same moment in Lisbon and in Tokyo, even though their clocks show different hours.
- **A calendar value**: a date or a wall-clock time as people write it, such as "my birthday" or
  "the shop opens at 09:00". It has no time zone attached.
- **A duration**: an amount of elapsed time, such as "the build took 3 minutes".

## How .NET models them

| Type | Meaning |
|---|---|
| `DateOnly` | a calendar date (.NET 6+) |
| `TimeOnly` | a time of day (.NET 6+) |
| `TimeSpan` | a duration, possibly negative |
| `DateTimeOffset` | an instant: date, time and offset from UTC |
| `DateTime` | date and time plus a `Kind`: `Utc`, `Local` or `Unspecified` |

```csharp
var due = new DateOnly(2024, 3, 15);
var opens = new TimeOnly(9, 0);
var stamp = new DateTimeOffset(2024, 3, 15, 9, 0, 0, TimeSpan.FromHours(1));
TimeSpan wait = TimeSpan.FromMinutes(90);
```

`DateTime` is the oldest type and the most ambiguous: an `Unspecified` value could be in any time
zone, and converting it can silently apply your machine's local offset. For stored timestamps,
prefer `DateTimeOffset` (or a `DateTime` that is always UTC). For dates without a time, use
`DateOnly`.

## Formatting and parsing are cultural

`"03/04/2024"` is 4 March in the United States and 3 April in Portugal. Methods like `ToString()`
and `Parse` use the **current culture** of the machine, so the same code prints and parses
differently on different computers. In code that stores or exchanges dates:

- format and parse with `CultureInfo.InvariantCulture`;
- use ISO 8601 (`yyyy-MM-dd`, or the round-trip format `"O"`);
- parse with `ParseExact` and an explicit format, so unexpected input fails loudly.

## Pitfalls

- **Format letters are case sensitive.** `MM` is months and `mm` minutes; `HH` is a 24-hour hour
  and `hh` a 12-hour one.
- **Month arithmetic clamps.** `new DateOnly(2024, 1, 31).AddMonths(1)` is 29 February.
- **Invalid dates throw.** `new DateOnly(2023, 2, 29)` throws `ArgumentOutOfRangeException`, and
  `ParseExact` throws `FormatException` for text that does not match.
- **`DateOnly` has no minus operator.** `b - a` is error CS0019; subtract `b.DayNumber - a.DayNumber`.
- **`DateTime.Now` makes code untestable**, because the result changes every run and depends
  on the machine's time zone. Pass the date in as a parameter, or inject .NET 8's `TimeProvider`.

## What you will practise

You will add months and days to `DateOnly` values, total up `TimeSpan` durations and wrap a
`TimeOnly` past midnight, and compare instants written with different offsets. The challenge
computes invoice due dates in business days, skipping weekends and holidays, from timestamps
that carry their own offset.
'''

[[unit.step]]
kind = "concept"
id = "cs-u17-c1-instants-vs-calendar"
title = "Instants, calendar values and durations"
points = 5
difficulty = 17
intro = '''
Every date-and-time type answers a specific question. An instant is a point on the global
timeline, a calendar value is what a person reads on a calendar or a clock, and a duration is
elapsed time. The types keep these apart so the compiler can stop you from mixing them.
'''
body = '''
## Pick the type by the question

- "Which day is the deadline?" is a **calendar date**: `DateOnly`.
- "What time does the shop open?" is a **time of day**: `TimeOnly`.
- "How long did it take?" is a **duration**: `TimeSpan`.
- "When exactly did the payment arrive?" is an **instant**: `DateTimeOffset`.

## The arithmetic follows the meaning

```csharp
DateOnly deadline = new DateOnly(2024, 3, 15).AddDays(10);
TimeSpan shift = new TimeOnly(17, 30) - new TimeOnly(9, 0);   // 08:30:00
DateTimeOffset later = paidAt + TimeSpan.FromHours(2);
TimeSpan elapsed = later - paidAt;                            // 02:00:00
```

Subtracting two instants gives a duration; adding a duration to an instant gives an instant.
`DateOnly` counts in whole days, so you add days, months or years, and you measure a gap with
`DayNumber`.

## An instant carries its offset

`DateTimeOffset` stores the local date and time **and** the offset from UTC, for example
`2024-07-01 09:30 +01:00`. Two values with different offsets can describe the same moment:
`09:30 +01:00` and `04:30 -04:00` are both 08:30 UTC, and `==` compares them as equal. Converting
to UTC with `ToUniversalTime()` or `UtcDateTime` gives every instant a common reference, which is
what you store and compare.

## Keep the machine out of it

Results should not depend on where the code runs. Avoid the machine's local time zone
(`DateTime.Now`, `ToLocalTime()`) and its culture (`ToString()` with no format provider). Format
with an explicit pattern and `CultureInfo.InvariantCulture`, and receive "now" as a parameter.
'''

[[unit.step]]
kind = "drill"
id = "cs-u17-d1-dateonly-arithmetic"
title = "Calendar arithmetic with DateOnly"
points = 10
difficulty = 17
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
The Gregorian calendar is irregular: months have 28 to 31 days and leap years add a day to
February. `DateOnly` encodes those rules, so adding a month clamps to the last valid day, and the
`DayNumber` property turns a date into a plain day count you can subtract.
'''
prompt = '''
Add a month to 31 January in a leap year, parse a deadline, count the days in between, and find
the last day of a month.

**Why:** calendar rules are easy to get wrong by hand. Letting `DateOnly` do the arithmetic and
formatting with an explicit invariant pattern gives the same answer on every machine.
'''
target = '''
using System.Globalization;

var inv = CultureInfo.InvariantCulture;
var start = new DateOnly(2024, 1, 31);
Console.WriteLine(start.ToString("yyyy-MM-dd", inv));

DateOnly nextMonth = start.AddMonths(1);
Console.WriteLine(nextMonth.ToString("yyyy-MM-dd", inv));
Console.WriteLine(nextMonth.DayOfWeek);

var deadline = DateOnly.ParseExact("2024-03-15", "yyyy-MM-dd", inv);
int daysLeft = deadline.DayNumber - start.DayNumber;
Console.WriteLine($"{daysLeft} days until the deadline");
Console.WriteLine(deadline > start);

var firstOfMonth = new DateOnly(deadline.Year, deadline.Month, 1);
DateOnly lastOfMonth = firstOfMonth.AddMonths(1).AddDays(-1);
Console.WriteLine(lastOfMonth.ToString("dddd d MMMM yyyy", inv));
'''
line_comments = [
  "For `CultureInfo.InvariantCulture`.",
  "",
  "One culture-neutral provider for all formatting below.",
  "31 January 2024; 2024 is a leap year.",
  "ISO 8601 output: `2024-01-31`.",
  "",
  "There is no 31 February, so the day is clamped.",
  "Prints `2024-02-29`.",
  "An enum value: `Thursday`.",
  "",
  "Parses one exact format; anything else throws.",
  "`deadline - start` would be error CS0019.",
  "29 days of February plus 15 of March: `44`.",
  "Dates compare chronologically: `True`.",
  "",
  "Moves to the first day of March.",
  "First of next month minus one day.",
  "Prints `Sunday 31 March 2024`.",
]
explanation = '''
`AddMonths` keeps the day of the month when it can and clamps it when it cannot, so 31 January
plus one month is 29 February 2024, a Thursday. `DateOnly` has no subtraction operator, because
the result would be ambiguous between days and a `TimeSpan`; `DayNumber` (days since 1 January
of year 1) makes the gap a simple integer subtraction, 44. The "first of next month minus one
day" idiom finds a month's last day without knowing its length. Every format call passes the
invariant culture, so the day and month names are English and the output is identical on any
machine.
'''

[[unit.step]]
kind = "drill"
id = "cs-u17-d2-timespan-timeonly"
title = "Durations and times of day"
points = 10
difficulty = 17
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
A duration is just a count of ticks (100-nanosecond units), so `TimeSpan` values add and subtract
like numbers. A time of day lives on a 24-hour clock that wraps at midnight, which is why
`TimeOnly` arithmetic can report how many days it wrapped.
'''
prompt = '''
Total three task durations, show the result in several formats, and do clock arithmetic on
opening hours, including a shift that crosses midnight.

**Why:** "total time" and "what time will it be" are different calculations, and the two types
make that difference explicit.
'''
target = '''
using System.Globalization;

var inv = CultureInfo.InvariantCulture;
TimeSpan[] tasks = { TimeSpan.FromMinutes(45), new TimeSpan(1, 20, 0), TimeSpan.FromSeconds(4500) };
TimeSpan total = TimeSpan.Zero;
foreach (TimeSpan t in tasks)
    total += t;
Console.WriteLine(total.ToString("c", inv));
Console.WriteLine(total.TotalHours.ToString("0.00", inv));
Console.WriteLine($"{(int)total.TotalHours}h {total.Minutes}m");
Console.WriteLine(total.ToString(@"hh\:mm", inv));

var opens = new TimeOnly(9, 0);
var closes = new TimeOnly(17, 30);
Console.WriteLine(closes - opens);
TimeOnly end = new TimeOnly(22, 15).Add(TimeSpan.FromHours(3), out int wrapped);
Console.WriteLine($"{end.ToString("HH:mm", inv)} (+{wrapped} day)");
Console.WriteLine(new TimeOnly(12, 0).IsBetween(opens, closes));
Console.WriteLine(new TimeOnly(2, 0).IsBetween(new TimeOnly(22, 0), new TimeOnly(6, 0)));
'''
line_comments = [
  "For culture-neutral number and time formatting.",
  "",
  "The provider used by every `ToString` below.",
  "45, 80 and 75 minutes, built three ways.",
  "The running sum starts at zero.",
  "Adds the durations one by one.",
  "`TimeSpan` supports `+` like a number.",
  "The constant format `[d.]hh:mm:ss`: `03:20:00`.",
  "The whole duration in hours: `3.33`.",
  "`Minutes` is the component, not the total: `3h 20m`.",
  "Custom formats escape the colon: `03:20`.",
  "",
  "09:00 on any day.",
  "17:30 on the same day.",
  "Two times of day give a duration: `08:30:00`.",
  "The `out` parameter counts midnights crossed.",
  "Prints `01:15 (+1 day)`.",
  "Noon is within opening hours: `True`.",
  "A range may wrap midnight: `True`.",
]
explanation = '''
The three durations add up to 200 minutes. The `"c"` format prints `03:20:00`, `TotalHours` is
the whole duration as a `double` (3.33 to two places), and `Minutes` is only the minutes
component, so the friendly form is `3h 20m`. In custom `TimeSpan` formats the colon must be
escaped, which is why the pattern is a verbatim string `@"hh\:mm"`. Subtracting two `TimeOnly`
values yields a `TimeSpan` of 8.5 hours. Adding three hours to 22:15 wraps past midnight to
01:15, and the `out int` reports one wrapped day. `IsBetween` treats the end as exclusive and
understands ranges that cross midnight, such as a night shift from 22:00 to 06:00.
'''

[[unit.step]]
kind = "drill"
id = "cs-u17-d3-offsets-utc"
title = "Instants, offsets and UTC"
points = 10
difficulty = 17
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
An instant written as local time plus an offset from UTC is unambiguous anywhere in the world.
`DateTimeOffset` compares instants by their UTC value, round-trips through ISO 8601 text, and
converts to UTC without consulting the machine's time zone, unlike an `Unspecified` `DateTime`.
'''
prompt = '''
Compare the same moment written in Lisbon and in New York, round-trip timestamps through ISO 8601
text, convert to UTC, and see why a `DateTime` needs an explicit `Kind`.

**Why:** timestamps cross servers and countries. Storing and comparing them in UTC, with the
offset parsed rather than guessed, is how production systems stay correct.
'''
target = '''
using System.Globalization;

var inv = CultureInfo.InvariantCulture;
var lisbon = new DateTimeOffset(2024, 7, 1, 9, 30, 0, TimeSpan.FromHours(1));
var newYork = new DateTimeOffset(2024, 7, 1, 4, 30, 0, TimeSpan.FromHours(-4));
Console.WriteLine(lisbon == newYork);
Console.WriteLine(lisbon.EqualsExact(newYork));
Console.WriteLine(lisbon.ToString("O", inv));
Console.WriteLine(lisbon.UtcDateTime.ToString("O", inv));

var parsed = DateTimeOffset.ParseExact("2024-12-31T23:15:00-03:00", "yyyy-MM-dd'T'HH:mm:sszzz", inv);
DateTimeOffset utc = parsed.ToUniversalTime();
Console.WriteLine(utc.ToString("yyyy-MM-dd HH:mm 'UTC'", inv));
Console.WriteLine(DateOnly.FromDateTime(utc.UtcDateTime).ToString("yyyy-MM-dd", inv));
Console.WriteLine((utc - lisbon).TotalDays.ToString("0.00", inv));

var naive = new DateTime(2024, 7, 1, 9, 30, 0);
Console.WriteLine(naive.Kind);
DateTime marked = DateTime.SpecifyKind(naive, DateTimeKind.Utc);
Console.WriteLine(new DateTimeOffset(marked).Offset);
'''
line_comments = [
  "For `CultureInfo.InvariantCulture`.",
  "",
  "The provider for every parse and format below.",
  "09:30 at UTC+1.",
  "04:30 at UTC-4.",
  "Both are 08:30 UTC, the same instant: `True`.",
  "Also compares the offsets, which differ: `False`.",
  "Round-trip ISO 8601: `2024-07-01T09:30:00.0000000+01:00`.",
  "The UTC `DateTime` ends with `Z`.",
  "",
  "`zzz` reads the offset from the text.",
  "Same instant, offset zero; no local time zone involved.",
  "New Year's Eve in São Paulo is already 2025 in UTC.",
  "The UTC calendar date: `2025-01-01`.",
  "Instants subtract to a `TimeSpan`: `183.74`.",
  "",
  "No offset and no zone information.",
  "Prints `Unspecified`.",
  "States explicitly that it is UTC.",
  "`00:00:00`; with `Unspecified` the machine's offset would be used.",
]
explanation = '''
`DateTimeOffset` equality compares instants, so 09:30 at +01:00 equals 04:30 at -04:00; only
`EqualsExact` also requires the same offset. The `"O"` format writes every digit and the offset,
so the text parses back to exactly the same value. `ParseExact` with `zzz` takes the offset
from the string, so 23:15 at -03:00 becomes 02:15 UTC on 1 January 2025, and the UTC calendar
date differs from the local one. The `DateTime` constructor without a kind produces
`Unspecified`; converting such a value to `DateTimeOffset` silently applies the machine's local
offset, which is why the program marks it as UTC first and the output stays the same everywhere.
'''

[[unit.step]]
kind = "challenge"
id = "cs-u17-x1-due-dates"
title = "Invoice due dates in business days"
points = 30
difficulty = 17
entry = "Billing"
intro = '''
"Payment due in 10 business days" is everyday business logic that hides several date problems:
weekends, public holidays, and timestamps written in other time zones. Normalising the instant
to UTC, taking its calendar date, and stepping through days with `DateOnly` makes the answer
independent of the machine that computes it.
'''
instructions = '''
## Your turn

Implement the static class `Billing`:

```csharp
public static bool IsBusinessDay(DateOnly day, IReadOnlySet<DateOnly> holidays)
public static DateOnly AddBusinessDays(DateOnly start, int days, IReadOnlySet<DateOnly> holidays)
public static int BusinessDaysBetween(DateOnly from, DateOnly to, IReadOnlySet<DateOnly> holidays)
public static string DueDate(string issuedAt, int days, IReadOnlySet<DateOnly> holidays)
```

A **business day** is a Monday to Friday that is not in `holidays`.

- `IsBusinessDay` says whether `day` is a business day.
- `AddBusinessDays` walks forward from `start` one calendar day at a time and returns the day on
  which the `days`-th business day is reached. `start` itself never counts, and `days == 0`
  returns `start` unchanged, even on a weekend. A negative `days` throws
  `ArgumentOutOfRangeException`.
- `BusinessDaysBetween` counts the business days `d` with `from < d <= to`, and returns 0 when
  `to <= from`. So `BusinessDaysBetween(s, AddBusinessDays(s, n, h), h)` is always `n`.
- `DueDate` parses `issuedAt`, which must have exactly the form `yyyy-MM-ddTHH:mm:ss+hh:mm` (or
  `-hh:mm`), using `CultureInfo.InvariantCulture`. Any other text, including a timestamp without
  an offset or an impossible date, throws `FormatException`. It takes the **UTC** calendar date
  of that instant, adds `days` business days, and returns the result formatted as `yyyy-MM-dd`.

Example: `DueDate("2024-03-28T23:30:00-02:00", 1, {2024-03-29, 2024-04-01})`. In UTC the
invoice was issued at 01:30 on Friday 29 March. The next business day skips the weekend and
Easter Monday, so the result is `"2024-04-02"`.

Never use `DateTime.Now`, the local time zone or the current culture.

**Hint:** `DateTimeOffset.ParseExact` with the format `yyyy-MM-dd'T'HH:mm:sszzz`, then
`DateOnly.FromDateTime(value.UtcDateTime)`.

Hidden tests decide correctness.
'''
starter = '''
using System.Globalization;

// Business-day arithmetic for invoices. A business day is a Monday to Friday
// that is not in the holidays set.
public static class Billing
{
    public static bool IsBusinessDay(DateOnly day, IReadOnlySet<DateOnly> holidays) =>
        throw new NotImplementedException();

    // The day on which the days-th business day after start is reached (start never counts).
    public static DateOnly AddBusinessDays(DateOnly start, int days, IReadOnlySet<DateOnly> holidays) =>
        throw new NotImplementedException();

    // Business days d with from < d <= to; 0 when to <= from.
    public static int BusinessDaysBetween(DateOnly from, DateOnly to, IReadOnlySet<DateOnly> holidays) =>
        throw new NotImplementedException();

    // issuedAt is "yyyy-MM-ddTHH:mm:ss+hh:mm"; due date from its UTC calendar date, as "yyyy-MM-dd".
    public static string DueDate(string issuedAt, int days, IReadOnlySet<DateOnly> holidays) =>
        throw new NotImplementedException();
}
'''
tests = '''
static HashSet<DateOnly> Days(params string[] isoDates) =>
    isoDates.Select(s => DateOnly.ParseExact(s, "yyyy-MM-dd", System.Globalization.CultureInfo.InvariantCulture)).ToHashSet();
var none = new HashSet<DateOnly>();
Test("weekdays are business days, weekends and holidays are not", () =>
{
    var holidays = Days("2024-12-25");
    Check(Billing.IsBusinessDay(new DateOnly(2024, 12, 23), holidays), "Monday 23 Dec");
    Check(!Billing.IsBusinessDay(new DateOnly(2024, 12, 25), holidays), "Christmas is a holiday");
    Check(!Billing.IsBusinessDay(new DateOnly(2024, 12, 28), holidays), "Saturday");
    Check(!Billing.IsBusinessDay(new DateOnly(2024, 12, 29), holidays), "Sunday");
});
Test("adding business days skips the weekend", () =>
{
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 5, 9), 1, none), new DateOnly(2024, 5, 10));
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 5, 10), 1, none), new DateOnly(2024, 5, 13));
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 5, 11), 1, none), new DateOnly(2024, 5, 13));
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 5, 6), 10, none), new DateOnly(2024, 5, 20));
});
Test("zero days returns the start, even on a weekend", () =>
{
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 5, 11), 0, none), new DateOnly(2024, 5, 11));
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 12, 25), 0, Days("2024-12-25")), new DateOnly(2024, 12, 25));
});
Test("holidays are skipped, across month and year ends", () =>
{
    var holidays = Days("2024-12-25", "2024-12-26", "2025-01-01");
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 12, 24), 1, holidays), new DateOnly(2024, 12, 27));
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 12, 24), 3, holidays), new DateOnly(2024, 12, 31));
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 12, 24), 4, holidays), new DateOnly(2025, 1, 2));
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 2, 28), 1, none), new DateOnly(2024, 2, 29));
});
Test("negative day counts are rejected", () =>
{
    Throws<ArgumentOutOfRangeException>(() => Billing.AddBusinessDays(new DateOnly(2024, 1, 1), -1, none));
});
Test("counting business days between two dates", () =>
{
    Equal(Billing.BusinessDaysBetween(new DateOnly(2024, 5, 10), new DateOnly(2024, 5, 13), none), 1);
    Equal(Billing.BusinessDaysBetween(new DateOnly(2024, 5, 10), new DateOnly(2024, 5, 12), none), 0);
    Equal(Billing.BusinessDaysBetween(new DateOnly(2024, 5, 11), new DateOnly(2024, 5, 13), none), 1);
    Equal(Billing.BusinessDaysBetween(new DateOnly(2024, 5, 6), new DateOnly(2024, 5, 20), none), 10);
    Equal(Billing.BusinessDaysBetween(new DateOnly(2024, 5, 6), new DateOnly(2024, 5, 6), none), 0);
    Equal(Billing.BusinessDaysBetween(new DateOnly(2024, 5, 20), new DateOnly(2024, 5, 6), none), 0);
    Equal(Billing.BusinessDaysBetween(new DateOnly(2024, 12, 20), new DateOnly(2025, 1, 3), Days("2024-12-25", "2025-01-01")), 8);
});
Test("BusinessDaysBetween undoes AddBusinessDays", () =>
{
    var holidays = Days("2024-03-29", "2024-04-01", "2024-04-25", "2024-05-01");
    var start = new DateOnly(2024, 3, 1);
    for (int n = 0; n <= 60; n++)
        Equal(Billing.BusinessDaysBetween(start, Billing.AddBusinessDays(start, n, holidays), holidays), n);
});
Test("due dates use the UTC calendar date of the timestamp", () =>
{
    var easter = Days("2024-03-29", "2024-04-01");
    Equal(Billing.DueDate("2024-03-28T23:30:00-02:00", 1, easter), "2024-04-02");
    Equal(Billing.DueDate("2024-03-28T23:30:00-02:00", 0, easter), "2024-03-29");
    Equal(Billing.DueDate("2024-03-28T20:00:00+00:00", 1, easter), "2024-04-02");
    Equal(Billing.DueDate("2024-01-01T00:30:00+05:00", 1, none), "2024-01-01");
    Equal(Billing.DueDate("2024-01-01T00:30:00+05:00", 1, Days("2024-01-01")), "2024-01-02");
    Equal(Billing.DueDate("2024-05-06T12:00:00+01:00", 10, none), "2024-05-20");
});
Test("bad timestamps throw FormatException", () =>
{
    Throws<FormatException>(() => Billing.DueDate("2024-03-28T23:30:00", 1, none));
    Throws<FormatException>(() => Billing.DueDate("28/03/2024 23:30", 1, none));
    Throws<FormatException>(() => Billing.DueDate("2024-02-30T10:00:00+00:00", 1, none));
    Throws<FormatException>(() => Billing.DueDate("", 1, none));
});
Test("long horizons stay exact", () =>
{
    Equal(Billing.AddBusinessDays(new DateOnly(2024, 1, 1), 2600, none), new DateOnly(2033, 12, 19));
    Equal(Billing.BusinessDaysBetween(new DateOnly(2024, 1, 1), new DateOnly(2033, 12, 19), none), 2600);
});
'''

[unit.step.gabarito]
solution = '''
using System.Globalization;

// Business-day arithmetic for invoices. A business day is a Monday to Friday
// that is not in the holidays set.
public static class Billing
{
    private const string TimestampFormat = "yyyy-MM-dd'T'HH:mm:sszzz";

    public static bool IsBusinessDay(DateOnly day, IReadOnlySet<DateOnly> holidays) =>
        day.DayOfWeek is not (DayOfWeek.Saturday or DayOfWeek.Sunday) && !holidays.Contains(day);

    public static DateOnly AddBusinessDays(DateOnly start, int days, IReadOnlySet<DateOnly> holidays)
    {
        ArgumentOutOfRangeException.ThrowIfNegative(days);
        DateOnly day = start;
        while (days > 0)
        {
            day = day.AddDays(1);
            if (IsBusinessDay(day, holidays)) days--;
        }
        return day;
    }

    public static int BusinessDaysBetween(DateOnly from, DateOnly to, IReadOnlySet<DateOnly> holidays)
    {
        int count = 0;
        for (DateOnly day = from.AddDays(1); day <= to; day = day.AddDays(1))
            if (IsBusinessDay(day, holidays)) count++;
        return count;
    }

    public static string DueDate(string issuedAt, int days, IReadOnlySet<DateOnly> holidays)
    {
        DateTimeOffset issued = DateTimeOffset.ParseExact(issuedAt, TimestampFormat, CultureInfo.InvariantCulture);
        DateOnly issueDay = DateOnly.FromDateTime(issued.UtcDateTime);
        return AddBusinessDays(issueDay, days, holidays).ToString("yyyy-MM-dd", CultureInfo.InvariantCulture);
    }
}
'''
time = "O(d)"
space = "O(1)"
justification = '''
Let **d** be the number of calendar days walked. `AddBusinessDays` steps one day at a time and
checks each with `IsBusinessDay`, which is a `DayOfWeek` comparison plus an O(1) average hash-set
lookup, so it runs in **O(d)**. Because at least five of every seven days are business days
(fewer only when holidays are dense), d is at most about 1.4 times the requested count plus the
holidays crossed. `BusinessDaysBetween` visits each day of the interval once, also O(d), and
`DueDate` adds only a constant-time parse and format. Only a few `DateOnly` values (each a
single `int` inside) are kept, so the extra space is **O(1)**.

A closed formula (whole weeks times five, then fix up the ends and subtract the holidays in
range) would make the weekend part O(1), but it is easy to get wrong at the edges, and the
holidays still need a scan or a sorted search. The day-by-day walk is obviously correct, and
the round-trip test (`BusinessDaysBetween` undoing `AddBusinessDays`) checks that both methods
agree. Correctness across machines comes from the types: the offset is parsed with `zzz` instead
of guessed from the local zone, the calendar date is taken from `UtcDateTime`, and the result is
formatted with the invariant culture.
'''

[[unit]]
id = "cs-u18-files-streams"
title = "Files, paths and streams"
level = "intermediate"
difficulty = 18
intro = '''
Sooner or later every program reads a configuration file, writes a report or scans a folder of
logs. .NET splits that work into three tools: `Path` for building file names, `File` and
`Directory` for one-shot operations, and streams for reading and writing piece by piece. You
will use all three safely inside temporary folders, and finish by summarising and filtering log
files of any size.
'''
concepts = '''
## The idea

A **file** is a named sequence of bytes kept by the operating system, and a **path** is the
name that finds it, such as `/home/ana/notes.txt` or `C:\Users\Ana\notes.txt`. Text files add
an **encoding** that maps bytes to characters; .NET uses UTF-8 unless you say otherwise. A
**stream** is a cursor over those bytes: you read or write a little at a time, so a 10 GB log
needs no more memory than a 10 KB one.

## How C# does it

- **`Path`** only manipulates strings and never touches the disk: `Path.Combine`,
  `Path.GetFileName`, `Path.GetExtension`, `Path.GetTempPath`.
- **`File` and `Directory`** do whole operations in one call: `File.ReadAllText`,
  `File.WriteAllLines`, `File.Exists`, `Directory.CreateDirectory`, `Directory.EnumerateFiles`.
- **`StreamReader` and `StreamWriter`** read and write text line by line, and `File.ReadLines`
  wraps a reader in a lazy sequence you can `foreach`.

```csharp
string dir = Path.Combine(Path.GetTempPath(), "demo-" + Guid.NewGuid().ToString("N"));
Directory.CreateDirectory(dir);
string notes = Path.Combine(dir, "notes.txt");
File.WriteAllText(notes, "first line\n");
foreach (string line in File.ReadLines(notes))
    Console.WriteLine(line);
Directory.Delete(dir, recursive: true);
```

A file handle is an operating-system resource, so readers and writers implement `IDisposable`.
A `using` statement or declaration disposes them, which flushes buffered data and closes the
handle even when an exception is thrown.

## Pitfalls

- **Separators differ.** Linux uses `/`, Windows `\`. Build paths with `Path.Combine` or
  `Path.Join` instead of concatenating strings.
- **`Path.Combine` drops everything before a rooted part.** `Path.Combine("logs", "/etc/passwd")`
  is `/etc/passwd`, which matters when part of a path comes from a user. `Path.Join` never does
  that.
- **Writers buffer.** Until a `StreamWriter` is flushed or disposed, its last lines may exist
  only in memory, and on Windows the file stays locked. A `using var` declaration disposes at the
  end of the enclosing block, not at the next line.
- **Enumeration order is not guaranteed.** `Directory.EnumerateFiles` returns files in whatever
  order the file system keeps them. Sort when order matters.
- **Relative paths** resolve against the current working directory, not the program's folder.
- **Expect I/O exceptions:** `FileNotFoundException`, `DirectoryNotFoundException`,
  `UnauthorizedAccessException` and `IOException`. Checking `File.Exists` first does not remove
  the need to handle them, because another process can delete the file in between.

## What you will practise

You will create a private folder under the system's temporary directory, write and read whole
files, stream lines through a reader and a writer, and walk a directory tree with portable
relative paths, always cleaning up in `finally`. The challenge counts and filters log files line
by line, so its memory use does not grow with the file size.
'''

[[unit.step]]
kind = "concept"
id = "cs-u18-c1-paths-files-streams"
title = "Paths, one-shot files and streams"
points = 5
difficulty = 18
intro = '''
File access in .NET has three layers: pure string work on paths, convenient whole-file
operations, and streams that move data incrementally. Choosing the right layer decides how much
memory a program needs and how it behaves when something goes wrong.
'''
body = '''
## Paths are just strings

```csharp
string dir = Path.Combine(Path.GetTempPath(), "reports");
string file = Path.Combine(dir, "2024-q1.csv");
Path.GetFileName(file);       // "2024-q1.csv"
Path.GetExtension(file);      // ".csv"
Path.GetDirectoryName(file);  // the folder, or null for a root
```

None of these calls checks whether anything exists. They only split and join text, using the
right separator for the operating system.

## Whole-file operations

`File.ReadAllText`, `File.ReadAllLines` and `File.WriteAllText` open the file, do the work and
close it again in one call. They are perfect for small files such as configuration, but
`ReadAllLines` keeps every line in memory at once.

## Streams

A `StreamReader` hands you one line at a time and a `StreamWriter` accepts one line at a time,
each through a small buffer:

```csharp
using var reader = new StreamReader(inputPath);
string? line;
while ((line = reader.ReadLine()) is not null)
    Process(line);
```

`ReadLine` returns `null` at the end of the file, which is why its result is a `string?`. Memory
use stays constant however long the file is.

## Clean up, always

Disposing a stream flushes its buffer and releases the operating-system handle. Wrap streams in
`using`, and wrap the creation of temporary folders in `try`/`finally` so they are deleted even
when the code in between throws.
'''

[[unit.step]]
kind = "drill"
