    cart.Add("pen", 1.50m, 3);
    Equal(cart.QuantityOf("pen"), 5);
    Equal(cart.QuantityOf("book"), 1);
    Equal(cart.ItemCount, 6);
    Equal(cart.LineCount, 2);
    Equal(cart.Total, 19.50m);
});
Test("invalid arguments throw and change nothing", () =>
{
    var cart = new ShoppingCart("Ada");
    cart.Add("pen", 2m, 1);
    Throws<ArgumentException>(() => cart.Add(" ", 1m));
    Throws<ArgumentOutOfRangeException>(() => cart.Add("ink", -0.01m));
    Throws<ArgumentOutOfRangeException>(() => cart.Add("ink", 3m, 0));
    Throws<ArgumentOutOfRangeException>(() => cart.Add("pen", 2m, -4));
    Throws<ArgumentOutOfRangeException>(() => cart.Remove("pen", 0));
    Equal(cart.ItemCount, 1);
    Equal(cart.LineCount, 1);
    Equal(cart.Total, 2m);
});
Test("a different price for the same SKU is refused", () =>
{
    var cart = new ShoppingCart("Ada");
    cart.Add("pen", 1.50m, 2);
    Throws<InvalidOperationException>(() => cart.Add("pen", 1.75m));
    Equal(cart.QuantityOf("pen"), 2);
    Equal(cart.Total, 3.00m);
});
Test("a free item is allowed", () =>
{
    var cart = new ShoppingCart("Ada");
    cart.Add("sticker", 0m, 3);
    Equal(cart.ItemCount, 3);
    Equal(cart.Total, 0m);
});
Test("a line never exceeds MaxPerLine", () =>
{
    var cart = new ShoppingCart("Ada");
    Equal(ShoppingCart.MaxPerLine, 99);
    cart.Add("pen", 1m, 98);
    Throws<InvalidOperationException>(() => cart.Add("pen", 1m, 2));
    Throws<InvalidOperationException>(() => cart.Add("pen", 1m, int.MaxValue));
    Throws<InvalidOperationException>(() => cart.Add("ink", 1m, 100));
    cart.Add("pen", 1m, 1);
    Equal(cart.QuantityOf("pen"), 99);
    Equal(cart.QuantityOf("ink"), 0);
    Equal(cart.ItemCount, 99);
    Equal(cart.Total, 99m);
});
Test("remove decreases, deletes empty lines and reports missing SKUs", () =>
{
    var cart = new ShoppingCart("Ada");
    cart.Add("pen", 1.50m, 5);
    cart.Add("book", 12.00m);
    Check(cart.Remove("pen", 2), "removing 2 of 5 pens should return true");
    Equal(cart.QuantityOf("pen"), 3);
    Equal(cart.Total, 16.50m);
    Check(cart.Remove("pen", 10), "removing more than there is should still return true");
    Equal(cart.QuantityOf("pen"), 0);
    Equal(cart.LineCount, 1);
    Equal(cart.ItemCount, 1);
    Equal(cart.Total, 12.00m);
    Check(!cart.Remove("pen"), "a SKU that is gone should return false");
    Check(!cart.Remove("lamp"), "an unknown SKU should return false");
    Check(cart.Remove("book"), "the default quantity is 1");
    Equal(cart.LineCount, 0);
    Equal(cart.Total, 0m);
});
Test("state is encapsulated", () =>
{
    var t = typeof(ShoppingCart);
    foreach (var name in new[] { "Owner", "ItemCount", "LineCount", "Total" })
    {
        var p = t.GetProperty(name);
        Check(p is not null, $"missing property {name}");
        Check(p?.GetSetMethod() is null, $"{name} must not have a public setter");
    }
    Equal(t.GetFields(BindingFlags.Public | BindingFlags.Instance).Length, 0);
});
Test("each cart keeps its own lines", () =>
{
    var a = new ShoppingCart("Ada");
    var b = new ShoppingCart("Bo");
    a.Add("pen", 1m, 4);
    Equal(b.ItemCount, 0);
    Equal(b.QuantityOf("pen"), 0);
});
Test("many operations stay consistent", () =>
{
    var cart = new ShoppingCart("Ada");
    for (int i = 0; i < 50_000; i++)
    {
        string sku = "sku" + (i % 500);
        if (cart.QuantityOf(sku) < 90) cart.Add(sku, 0.25m, 1);
        if (i % 3 == 0) cart.Remove(sku);
    }
    long units = 0;
    for (int s = 0; s < 500; s++) units += cart.QuantityOf("sku" + s);
    Equal((long)cart.ItemCount, units);
    Equal(cart.Total, units * 0.25m);
    var clock = System.Diagnostics.Stopwatch.StartNew();
    decimal sum = 0;
    for (int i = 0; i < 1_000_000; i++) sum += cart.Total;
    clock.Stop();
    Check(clock.ElapsedMilliseconds < 1000, $"reading Total 1,000,000 times took {clock.ElapsedMilliseconds} ms: keep a running total");
});
'''

[unit.step.gabarito]
solution = '''
public class ShoppingCart
{
    public const int MaxPerLine = 99;

    private readonly Dictionary<string, (decimal Price, int Quantity)> _lines = new();

    public ShoppingCart(string owner)
    {
        if (string.IsNullOrWhiteSpace(owner))
        {
            throw new ArgumentException("A cart needs an owner.", nameof(owner));
        }
        Owner = owner.Trim();
    }

    public string Owner { get; }
    public int ItemCount { get; private set; }
    public int LineCount => _lines.Count;
    public decimal Total { get; private set; }

    public void Add(string sku, decimal unitPrice, int quantity = 1)
    {
        if (string.IsNullOrWhiteSpace(sku))
        {
            throw new ArgumentException("A SKU is required.", nameof(sku));
        }
        ArgumentOutOfRangeException.ThrowIfNegative(unitPrice);
        ArgumentOutOfRangeException.ThrowIfLessThan(quantity, 1);

        int current = 0;
        if (_lines.TryGetValue(sku, out var line))
        {
            if (line.Price != unitPrice)
            {
                throw new InvalidOperationException($"{sku} is already in the cart at {line.Price}.");
            }
            current = line.Quantity;
        }
        if (quantity > MaxPerLine - current)
        {
            throw new InvalidOperationException($"A line holds at most {MaxPerLine} units.");
        }

        _lines[sku] = (unitPrice, current + quantity);
        ItemCount += quantity;
        Total += unitPrice * quantity;
    }

    public int QuantityOf(string sku) =>
        _lines.TryGetValue(sku, out var line) ? line.Quantity : 0;

    public bool Remove(string sku, int quantity = 1)
    {
        ArgumentOutOfRangeException.ThrowIfLessThan(quantity, 1);
        if (!_lines.TryGetValue(sku, out var line))
        {
            return false;
        }

        int taken = Math.Min(quantity, line.Quantity);
        if (taken == line.Quantity)
        {
            _lines.Remove(sku);
        }
        else
        {
            _lines[sku] = (line.Price, line.Quantity - taken);
        }
        ItemCount -= taken;
        Total -= line.Price * taken;
        return true;
    }
}
'''
time = "O(1) per operation"
space = "O(L)"
justification = '''
Every public operation does a constant number of dictionary operations (`TryGetValue`, an
indexer write, or `Remove`), each **O(1)** on average, plus a few arithmetic updates. In
particular `Total`, `ItemCount` and `LineCount` are read in **O(1)**: the first two are
running values updated inside `Add` and `Remove`, and the third is the dictionary's own
`Count`. Recomputing the total by looping over the lines on every read would cost O(L) per
read, where `L` is the number of distinct SKUs. The cart stores one entry per line, so its
space is **O(L)**.

Correctness rests on two habits. First, **validate, then mutate**: every check (blank SKU,
negative price, price conflict, line limit) runs before any field changes, so a call that
throws leaves the cart untouched. Second, the limit is tested as
`quantity > MaxPerLine - current` rather than `current + quantity > MaxPerLine`, because the
sum overflows for `quantity = int.MaxValue` and wraps to a negative number that would pass the
check. `decimal` keeps prices such as 1.50 exact, so the running total never accumulates
binary rounding error the way `double` would.
'''

[[unit]]
id = "cs-u10-inheritance-interfaces"
title = "Inheritance and interfaces"
level = "intermediate"
difficulty = 10
intro = '''
Polymorphism lets one piece of code work with many kinds of objects: a loop calls `Area()` or
`Apply(price)` and each object answers in its own way. This unit covers the two tools C#
offers for it, **inheritance** (`virtual`, `override`, `abstract`, `base`) and **interfaces**,
and when to choose each. The challenge builds a small pricing engine of interchangeable
discount rules.
'''
concepts = '''
## The idea

**Inheritance** says "a `Dog` is an `Animal`": the derived class gets every member of its
base class and can add or change behaviour. An **interface** says "this type can do X": it is
a contract of members with no state, and any class or struct can sign it.

Both enable **polymorphism**. A variable of type `Animal` can refer to a `Dog`, and calling a
`virtual` method on it runs the `Dog` version. The decision is made at run time from the
object's real type, which is called **dynamic dispatch**. The runtime keeps a small table of
method pointers per type, so a virtual call costs one extra lookup.

## How C# does it

```csharp
public abstract class Shape
{
    public abstract double Area();                  // no body: derived classes must supply one
    public virtual string Label() => "shape";       // a default they may replace
}

public sealed class Square(double side) : Shape
{
    public override double Area() => side * side;
    public override string Label() => "square, " + base.Label();
}

public interface IHasId { int Id { get; } }
```

- A class has **one** base class (`: Shape`) but can implement **many** interfaces
  (`: Shape, IHasId, IComparable<Square>`).
- Methods are **not** virtual by default. The base class must opt in with `virtual` or
  `abstract`, and the derived class must say `override`.
- An `abstract` class cannot be instantiated, and may mix finished code with abstract
  members. A `sealed` class cannot be inherited.
- A constructor calls its base constructor with `: base(args)`, and `base.Method()` reaches
  the overridden version.
- Interfaces can provide **default implementations**. Callers can only reach them through
  the interface type, not through the class.
- `is` tests a type and can bind a variable: `if (shape is Square sq)`.

Choose an abstract base class to share code and state among closely related types. Choose an
interface to describe a capability that unrelated types share, or when a type needs more than
one. Prefer small interfaces with few members.

## Pitfalls and compiler errors

- **CS0506**: cannot override a member that is not marked `virtual`, `abstract` or `override`.
- **CS0534**: a class does not implement an inherited abstract member.
- **CS0535**: a class does not implement an interface member.
- **CS0144**: cannot create an instance of an abstract type or an interface.
- **CS0114** (warning): a method with the same name but no `override` **hides** the base
  method instead of overriding it, so calls through the base type still run the old code.
- **CS0115**: `override` used when there is no matching virtual method to override.
- **CS1061**: calling a default interface method through a class-typed variable.

## What you will practise

You will override along a small hierarchy, write an abstract class with a **template method**
that subclasses fill in, and implement two interfaces including a default method. The
challenge combines an interface, an abstract base and a composite rule.
'''

[[unit.step]]
kind = "concept"
id = "cs-u10-c1-dispatch"
title = "Static type, runtime type and dispatch"
points = 5
difficulty = 10
intro = '''
Every expression has a **static type**, the one the compiler sees, and every object has a
**runtime type**, the one it was created with. The compiler checks calls against the static
type, while virtual calls are resolved against the runtime type.
'''
body = '''
## Two types for one variable

```csharp
Animal a = new Dog("Rex");
```

The static type of `a` is `Animal`, so the compiler lets you call only `Animal` members. The
runtime type of the object is `Dog`. When you call a **virtual** method, the runtime looks up
the `Dog` override:

```csharp
class Animal { public virtual string Speak() => "..."; }
class Dog : Animal { public override string Speak() => "Woof"; }

Console.WriteLine(a.Speak());   // Woof
```

## Override versus hide

If `Dog` declares a `Speak` method **without** `override`, the method **hides** the base one
instead. Then the call is chosen by the **static** type: through an `Animal` variable you get
`"..."`, and through a `Dog` variable you get `"Woof"`. The compiler warns about this with
CS0114 (or CS0108 when the base method is not virtual), because it is almost always a
mistake. Writing `new` on the method silences the warning when hiding is really intended.

## Why it matters

Dynamic dispatch lets you write code against the general type and add new cases later
without touching it:

```csharp
foreach (Animal x in zoo)
{
    Console.WriteLine(x.Speak());   // each animal answers for itself
}
```

Adding a `Cow` class with its own override needs no change to this loop. That is the
**open/closed principle**: open to extension, closed to modification. The same works with an
interface: `foreach (IShape s in shapes) total += s.Area();` dispatches through the interface
to each type's implementation. Avoid long chains of `if (x is Dog) … else if (x is Cat) …`,
which must be edited for every new type; a virtual method usually does that job better.
'''

