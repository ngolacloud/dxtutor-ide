static string Run(string[] words) => words switch
{
    [] => "error: empty command",
    ["add", var a, var b] => $"{int.Parse(a) + int.Parse(b)}",
    ["twice", var a] => $"{2 * int.Parse(a)}",
    ["sum", .. var rest] => $"{rest.Sum(x => int.Parse(x))}",
