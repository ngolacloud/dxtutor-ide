intro = '''
A program that writes files needs a place it owns. A uniquely named folder under the system's
temporary directory cannot collide with anything else, and a `finally` block guarantees it is
deleted. Inside it, the one-shot `File` methods write, append, read and copy whole files.
'''
prompt = '''
Create a private temporary folder, write and append lines to a file, read them back, copy the
file, list the folder, and delete everything in `finally`.

**Why:** owning a fresh folder and cleaning it up is how tests and tools avoid trampling on each
other's files.
'''
target = '''
string dir = Path.Combine(Path.GetTempPath(), "dxt-" + Guid.NewGuid().ToString("N"));
Directory.CreateDirectory(dir);
try
{
    string file = Path.Combine(dir, "todo.txt");
    File.WriteAllLines(file, new[] { "buy milk", "write tests" });
    File.AppendAllText(file, "ship it" + Environment.NewLine);
    string[] lines = File.ReadAllLines(file);
    Console.WriteLine($"{lines.Length} lines, last: {lines[^1]}");
    Console.WriteLine(File.Exists(file));
    File.Copy(file, Path.Combine(dir, "todo.bak"));
    foreach (string f in Directory.GetFiles(dir).Order(StringComparer.Ordinal))
        Console.WriteLine(Path.GetFileName(f));
}
finally
{
    Directory.Delete(dir, recursive: true);
}
Console.WriteLine(Directory.Exists(dir));
'''
