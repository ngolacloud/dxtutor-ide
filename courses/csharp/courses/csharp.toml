[[unit.step]]
kind = "challenge"
id = "cs-u18-x1-log-files"
title = "Summarise and filter log files"
points = 30
difficulty = 18
entry = "LogFiles"
intro = '''
Log files are the classic streaming workload: they can be gigabytes long, but each line can be
handled on its own. Processing them line by line keeps memory constant, and walking a folder
tree with portable relative paths makes the results the same on every machine.
'''
instructions = '''
## Your turn

Implement the static class `LogFiles`. Each log line starts with a **level** word followed by a
message, for example `WARN disk 91% full`.

```csharp
public static Dictionary<string, int> CountLevels(string path)
public static int CopyLevel(string inputPath, string outputPath, string level)
public static List<string> FindLogs(string root)
```

The **level** of a line is its first word: trim the line, then take the text before the first
space, or the whole trimmed line when it has no space. Lines that are empty or only whitespace
have no level and are ignored.

- `CountLevels` reads the file at `path` and returns how many lines have each level. An empty
  file gives an empty dictionary. Levels are case sensitive (`INFO` and `info` differ).
- `CopyLevel` writes every line of `inputPath` whose level equals `level` to `outputPath`,
  unchanged and in order, and returns how many lines it wrote. It replaces an existing output
  file and creates the output's folder (and any missing parents) if needed.
- `FindLogs` returns the paths of all files ending in `.log` under `root`, including
  subfolders, relative to `root`, with `/` as the separator, sorted with ordinal string
  comparison. For example `["api/today.log", "app.log"]`.
- A missing input file must throw `FileNotFoundException`, and a missing `root` must throw
  `DirectoryNotFoundException`. The standard .NET APIs already do this, so don't catch them.

Read the input **line by line** (`StreamReader` or `File.ReadLines`), not with `ReadAllText` or
`ReadAllLines`: the tests use files with hundreds of thousands of lines, and lines may end in
`\n` or `\r\n`.

**Hint:** `Path.GetDirectoryName(Path.GetFullPath(outputPath))` gives the output folder, and
`Directory.CreateDirectory` is harmless when the folder already exists.

Hidden tests decide correctness.
'''
starter = '''
// Line-by-line log processing. The level of a line is its first word
// (after trimming); blank lines have no level and are ignored.
public static class LogFiles
{
    // How many lines have each level.
    public static Dictionary<string, int> CountLevels(string path) =>
        throw new NotImplementedException();

    // Writes the lines whose level equals `level` to outputPath (replacing it,
    // creating its folder if needed) and returns how many were written.
    public static int CopyLevel(string inputPath, string outputPath, string level) =>
        throw new NotImplementedException();

    // Relative, '/'-separated, ordinally sorted paths of every *.log file under root.
    public static List<string> FindLogs(string root) =>
        throw new NotImplementedException();
}
'''
tests = '''
static string NewDir()
{
    string dir = Path.Combine(Path.GetTempPath(), "dxt-test-" + Guid.NewGuid().ToString("N"));
    Directory.CreateDirectory(dir);
    return dir;
}
static void InDir(Action<string> body)
{
    string dir = NewDir();
    try { body(dir); }
    finally { Directory.Delete(dir, recursive: true); }
}
Test("counts lines per level", () => InDir(dir =>
{
    string log = Path.Combine(dir, "app.log");
    File.WriteAllText(log, "INFO started\nWARN disk 91% full\nINFO user login\nERROR db timeout\nINFO done\n");
    Equal(LogFiles.CountLevels(log), new Dictionary<string, int> { ["INFO"] = 3, ["WARN"] = 1, ["ERROR"] = 1 });
}));
Test("blank lines, CRLF, padding and bare levels", () => InDir(dir =>
{
    string log = Path.Combine(dir, "mixed.log");
    File.WriteAllText(log, "INFO a\r\n\r\n   \r\n  WARN  padded\r\nDEBUG\r\ninfo lower\r\nINFO b");
    Equal(LogFiles.CountLevels(log), new Dictionary<string, int> { ["INFO"] = 2, ["WARN"] = 1, ["DEBUG"] = 1, ["info"] = 1 });
}));
Test("an empty file has no levels", () => InDir(dir =>
{
    string log = Path.Combine(dir, "empty.log");
    File.WriteAllText(log, "");
    Equal(LogFiles.CountLevels(log), new Dictionary<string, int>());
}));
Test("a missing file throws FileNotFoundException", () => InDir(dir =>
{
    Throws<FileNotFoundException>(() => LogFiles.CountLevels(Path.Combine(dir, "nope.log")));
    Throws<FileNotFoundException>(() => LogFiles.CopyLevel(Path.Combine(dir, "nope.log"), Path.Combine(dir, "out.log"), "INFO"));
}));
Test("copies matching lines unchanged, creating folders", () => InDir(dir =>
{
    string log = Path.Combine(dir, "app.log");
    File.WriteAllText(log, "INFO started\nERROR db timeout\nINFO x\n  ERROR   spaced out  \nERRORS not this\n");
    string output = Path.Combine(dir, "out", "errors", "today.log");
    int n = LogFiles.CopyLevel(log, output, "ERROR");
    Equal(n, 2);
    Equal(File.ReadAllLines(output), new[] { "ERROR db timeout", "  ERROR   spaced out  " });
}));
Test("copying replaces an existing output file", () => InDir(dir =>
{
    string log = Path.Combine(dir, "app.log");
    File.WriteAllText(log, "INFO one\nWARN two\n");
    string output = Path.Combine(dir, "warn.log");
    File.WriteAllText(output, "old line 1\nold line 2\nold line 3\n");
    Equal(LogFiles.CopyLevel(log, output, "WARN"), 1);
    Equal(File.ReadAllLines(output), new[] { "WARN two" });
    Equal(LogFiles.CopyLevel(log, output, "FATAL"), 0);
    Equal(File.ReadAllLines(output), Array.Empty<string>());
}));
Test("finds .log files recursively as sorted relative paths", () => InDir(dir =>
{
    Directory.CreateDirectory(Path.Combine(dir, "api", "old"));
    Directory.CreateDirectory(Path.Combine(dir, "empty"));
    foreach (string f in new[] { "app.log", "notes.txt", "app.log.bak", "api/today.log", "api/old/2023.log", "Zed.log" })
        File.WriteAllText(Path.Combine(dir, f.Replace('/', Path.DirectorySeparatorChar)), "INFO x\n");
    Equal(LogFiles.FindLogs(dir), new List<string> { "Zed.log", "api/old/2023.log", "api/today.log", "app.log" });
    Equal(LogFiles.FindLogs(Path.Combine(dir, "empty")), new List<string>());
}));
Test("a missing root throws DirectoryNotFoundException", () => InDir(dir =>
{
    Throws<DirectoryNotFoundException>(() => LogFiles.FindLogs(Path.Combine(dir, "missing")));
}));
Test("large files are streamed", () => InDir(dir =>
{
    string log = Path.Combine(dir, "big.log");
    using (var w = new StreamWriter(log))
        for (int i = 0; i < 300_000; i++)
            w.WriteLine(i % 3 == 0 ? $"ERROR item {i}" : $"INFO item {i}");
    Equal(LogFiles.CountLevels(log), new Dictionary<string, int> { ["ERROR"] = 100_000, ["INFO"] = 200_000 });
    Equal(LogFiles.CopyLevel(log, Path.Combine(dir, "errors.log"), "ERROR"), 100_000);
    Equal(File.ReadLines(Path.Combine(dir, "errors.log")).Last(), "ERROR item 299997");
}));
'''

[unit.step.gabarito]
solution = '''
// Line-by-line log processing. The level of a line is its first word
// (after trimming); blank lines have no level and are ignored.
public static class LogFiles
{
    public static Dictionary<string, int> CountLevels(string path)
    {
        var counts = new Dictionary<string, int>();
        foreach (string line in File.ReadLines(path))
        {
            if (LevelOf(line) is string level)
                counts[level] = counts.GetValueOrDefault(level) + 1;
        }
        return counts;
    }

    public static int CopyLevel(string inputPath, string outputPath, string level)
    {
        using var reader = new StreamReader(inputPath);
        string? folder = Path.GetDirectoryName(Path.GetFullPath(outputPath));
        if (folder is not null) Directory.CreateDirectory(folder);
        using var writer = new StreamWriter(outputPath, append: false);

        int written = 0;
        string? line;
        while ((line = reader.ReadLine()) is not null)
        {
            if (LevelOf(line) == level)
            {
                writer.WriteLine(line);
                written++;
            }
        }
        return written;
    }

    public static List<string> FindLogs(string root) =>
        Directory.EnumerateFiles(root, "*.log", SearchOption.AllDirectories)
            .Select(f => Path.GetRelativePath(root, f).Replace(Path.DirectorySeparatorChar, '/'))
            .Order(StringComparer.Ordinal)
            .ToList();

    private static string? LevelOf(string line)
    {
        string trimmed = line.Trim();
        if (trimmed.Length == 0) return null;
        int space = trimmed.IndexOf(' ');
        return space < 0 ? trimmed : trimmed[..space];
    }
}
'''
time = "O(B) to read; O(F log F) to sort"
space = "O(L + longest line)"
justification = '''
Let **B** be the number of bytes in the input, **L** the number of distinct levels, and **F** the
number of `.log` files found. `CountLevels` and `CopyLevel` read the file once through a buffered
stream, and each line costs time proportional to its length (trim, find the space, one hash-table
update or one write), so both are **O(B)**. They keep only the current line, the stream buffers
and, for counting, a dictionary with one entry per level, so memory is **O(L + longest line)**
whatever the file size. Loading the file with `ReadAllLines` would be O(B) memory instead, which
is exactly what breaks on a multi-gigabyte log.

`FindLogs` visits every entry of the tree once, then sorts the F matches in **O(F log F)**
comparisons; it needs O(F) space for the result. The ordinal comparer and the `/` normalisation
make the output identical on every operating system and culture, because file-system enumeration
order is unspecified. `CopyLevel` opens the input before creating anything, so a missing input
throws `FileNotFoundException` without leaving an empty output file behind, and both streams are
disposed by `using` even if a write fails.
'''

[[unit]]
id = "cs-u19-text-regex"
title = "Parsing text and regular expressions"
level = "intermediate"
difficulty = 19
intro = '''
Configuration headers, log lines, URLs and CSV exports all arrive as plain strings that a
program must turn into structured data. This unit climbs a ladder of tools: string methods for
simple delimiters, regular expressions with named groups for patterns, and a hand-written state
machine for formats with quoting. You will finish by writing a CSV parser that handles quoted
fields correctly.
'''
concepts = '''
## The idea

**Parsing** turns text into data: `"port=5432"` becomes a key and an integer, and a log line
becomes a date, a level and a message. Choose the simplest tool that fits the format:

1. **String methods** for fixed delimiters: `Split`, `IndexOf`, `Trim`, `StartsWith`, slicing.
2. **Regular expressions** for patterns such as "four digits, a dash, two digits".
3. **A state machine**, a loop that reads one character at a time and remembers where it is, for
   formats where meaning depends on context, such as commas inside quotes.

## How C# does it

```csharp
string[] parts = "a, b,,c".Split(',',
    StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries); // a b c
```

Regular expressions live in `System.Text.RegularExpressions`, which is not an implicit using.
Write patterns as verbatim strings (`@"..."`) so a backslash reaches the regex engine untouched.
Named groups `(?<name>...)` label the parts you want back:

```csharp
var date = new Regex(@"^(?<year>\d{4})-(?<month>\d{2})-(?<day>\d{2})$");
Match m = date.Match("2024-05-01");
if (m.Success)
    Console.WriteLine(m.Groups["month"].Value); // 05
```

`Regex.Matches` finds every occurrence, `Regex.Replace` rewrites them (with `${name}` or a
lambda), and `IsMatch` just answers yes or no. Create a `Regex` once and reuse it: parsing the
pattern is the expensive part.

## Pitfalls

- **CS1009** (unrecognized escape sequence) appears when you write `"\d"` without the `@`.
- **CS0246** (`Regex` could not be found) means the `using` is missing.
- **Unanchored patterns match substrings.** `Regex.IsMatch("abc123", @"\d+")` is true. Anchor
  with `\A` and `\z`; `$` also matches just before a final newline.
- **`\d` matches any Unicode digit**, including Arabic-Indic ones. Write `[0-9]` when you mean
  ASCII digits.
- **Catastrophic backtracking.** Patterns such as `^(a+)+$` can take exponential time on hostile
  input. Pass a timeout to the constructor or use `RegexOptions.NonBacktracking`.
- **User input is not a pattern.** `"C++"` is an invalid regex; wrap it in `Regex.Escape`.
- **Culture again.** `"file.TXT".EndsWith(".txt")` and `IndexOf(string)` use culture-sensitive
  rules. Pass `StringComparison.Ordinal` (or `OrdinalIgnoreCase`) for machine text, and parse
  numbers with `CultureInfo.InvariantCulture`.
- **Regex is the wrong tool for quoted CSV.** Whether a comma separates fields depends on
  whether you are inside quotes, and a doubled quote `""` stands for one quote character. A
  small state machine handles that clearly.

## What you will practise

You will split a configuration header into a dictionary, pull named fields out of log lines and
mask email addresses, validate and normalise input safely, and defuse a backtracking pattern. The
challenge parses CSV lines and records, including quotes, escaped quotes and error reporting with
line numbers.
'''

[[unit.step]]
kind = "concept"
id = "cs-u19-c1-parsing-ladder"
title = "From Split to Regex to a state machine"
points = 5
difficulty = 19
intro = '''
Text formats differ in how much context it takes to read them. Fixed delimiters need no memory,
regular patterns need a matching engine, and quoted formats need a loop that remembers its
state. Picking the lowest rung that works keeps parsers fast and readable.
'''
body = '''
## Rung 1: string methods

When a delimiter always means the same thing, `Split` and slicing are enough:

```csharp
string[] kv = "timeout = 2.5".Split('=', 2, StringSplitOptions.TrimEntries);
double t = double.Parse(kv[1], CultureInfo.InvariantCulture);
```

The `2` caps the number of parts, so a value that itself contains `=` stays whole.

## Rung 2: regular expressions

A regex describes the **shape** of the text. `\d{4}` is four digits, `[A-Z]+` one or more
capital letters, `.*` anything, and `(?<name>...)` captures a part under a name:

```csharp
var rx = new Regex(@"\[(?<level>[A-Z]+)\] (?<msg>.*)");
Match m = rx.Match("[WARN] disk almost full");
string level = m.Groups["level"].Value;   // "WARN"
```

Always check `m.Success` before reading groups: a failed match returns empty strings, not an
exception, which can hide bugs.

## Rung 3: a state machine

Some formats cannot be split blindly. In CSV, `"Lisbon, PT",42` has two fields, not three,
because the first comma is inside quotes. A state machine walks the characters one by one and
keeps a little state, such as "am I inside quotes?", to decide what each character means. It
runs in a single pass, so it is O(n), and every rule of the format becomes one readable branch.

## Fail loudly

Whatever the tool, reject malformed input with a clear exception, such as a `FormatException`
whose message says where the problem is. Silently guessing produces corrupt data that is found
much later.
'''

[[unit.step]]
kind = "drill"
id = "cs-u19-d1-split-parse"
title = "Splitting a settings header"
points = 10
difficulty = 19
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
Many formats are just delimiters inside delimiters: pairs separated by `;`, keys and values by
`=`. `Split` with `RemoveEmptyEntries` and `TrimEntries` absorbs sloppy spacing and empty
segments, and a case-insensitive comparer makes lookups forgiving without changing the data.
'''
prompt = '''
Parse a messy `key=value` header into a case-insensitive dictionary, convert two values to
numbers with the invariant culture, then take a URL path apart.

**Why:** most of the text a program receives has a simple delimited format, and string methods
handle it with no regex at all.
'''
target = '''
using System.Globalization;

string header = "host = db.local ; port=5432;; timeout = 2.5 ;user=admin";
var settings = new Dictionary<string, string>(StringComparer.OrdinalIgnoreCase);
foreach (string pair in header.Split(';', StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries))
{
    string[] kv = pair.Split('=', 2, StringSplitOptions.TrimEntries);
    if (kv.Length == 2) settings[kv[0]] = kv[1];
}
Console.WriteLine(settings.Count);
Console.WriteLine(settings["HOST"]);
int port = int.Parse(settings["port"], CultureInfo.InvariantCulture);
double timeout = double.Parse(settings["timeout"], CultureInfo.InvariantCulture);
Console.WriteLine(port + 1);
Console.WriteLine((timeout * 2).ToString(CultureInfo.InvariantCulture));
Console.WriteLine(string.Join(", ", settings.Keys.Order(StringComparer.Ordinal)));

string path = "/api/v2/users/42";
Console.WriteLine(path.StartsWith("/api/", StringComparison.Ordinal));
Console.WriteLine(string.Join(" | ", path.Split('/', StringSplitOptions.RemoveEmptyEntries)));
Console.WriteLine(path[(path.LastIndexOf('/') + 1)..]);
'''
line_comments = [
  "For `CultureInfo.InvariantCulture`.",
  "",
  "Inconsistent spacing and an empty segment.",
  "Keys match regardless of case.",
  "Trims each piece and drops the empty ones.",
  "",
  "At most two parts: key and value.",
  "Ignores segments without an `=`.",
  "",
  "Prints `4`.",
  "The comparer finds `host`: prints `db.local`.",
  "Text to number, culture-neutral.",
  "The dot is the decimal separator here.",
  "Real arithmetic now: `5433`.",
  "Prints `5`.",
  "`host, port, timeout, user`.",
  "",
  "A URL path.",
  "Ordinal: byte-for-byte, no culture rules.",
  "The leading `/` would give an empty first part.",
  "Slices after the last slash: `42`.",
]
explanation = '''
The outer `Split` cuts on `;`, trims every piece and drops the empty segment between `;;`, which
leaves four pairs. The inner `Split('=', 2, ...)` produces at most a key and a value, so the
dictionary gets `host`, `port`, `timeout` and `user`, and its `OrdinalIgnoreCase` comparer makes
`settings["HOST"]` work. Parsing with the invariant culture turns `"5432"` and `"2.5"` into
numbers on any machine, so the program prints 5433 and 5. For the path, `StartsWith` with
`StringComparison.Ordinal` avoids culture-sensitive matching, `RemoveEmptyEntries` hides the
empty piece before the leading slash, and a range slice extracts the final segment.
'''

[[unit.step]]
kind = "drill"
id = "cs-u19-d2-named-groups"
title = "Named groups, Matches and Replace"
points = 10
difficulty = 19
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
A regular expression is a compact description of a set of strings, executed by a matching
engine. Named groups turn a match into labelled fields, `Matches` finds every occurrence, and
`Replace` rewrites matches either with a substitution pattern or with a lambda that computes
each replacement.
'''
prompt = '''
Parse structured log lines with a regex of named groups, skip lines that don't match, then
extract numbers, mask an email address and reformat a line.

**Why:** log processing, input validation and data cleaning are everyday regex work, and named
groups keep those patterns readable.
'''
target = '''
using System.Text.RegularExpressions;

var lineRx = new Regex(@"^(?<date>\d{4}-\d{2}-\d{2}) (?<time>\d{2}:\d{2}:\d{2}) \[(?<level>[A-Z]+)\] (?<msg>.*)$");
string[] log =
{
    "2024-05-01 12:00:03 [WARN] disk 91% full",
    "garbage line",
    "2024-05-01 12:00:07 [ERROR] payment 7731 failed for ana@example.com",
};
foreach (string line in log)
{
    Match m = lineRx.Match(line);
    if (!m.Success) { Console.WriteLine($"skip: {line}"); continue; }
    Console.WriteLine($"{m.Groups["level"].Value,-5} at {m.Groups["time"].Value}: {m.Groups["msg"].Value}");
}
string message = lineRx.Match(log[2]).Groups["msg"].Value;
Console.WriteLine(string.Join(",", Regex.Matches(message, @"\b[0-9]+\b").Select(x => x.Value)));
string masked = Regex.Replace(message, @"(?<user>[\w.]+)@(?<domain>[\w.]+)",
    m => $"{m.Groups["user"].Value[0]}***@{m.Groups["domain"].Value}");
Console.WriteLine(masked);
Console.WriteLine(lineRx.Replace(log[0], "${level}: ${msg}"));
'''
line_comments = [
  "`Regex` is not part of the implicit usings.",
  "",
  "Built once, reused for every line.",
  "Three lines, one of them malformed.",
  "",
  "A well-formed warning.",
  "Does not match the pattern.",
  "Contains a number and an email.",
  "",
  "Tries the pattern on each line.",
  "",
  "Never throws; reports through `Success`.",
  "Always check before reading groups.",
  "`,-5` pads the level to five characters.",
  "",
  "Just the free-text part.",
  "Every whole number: `7731`.",
  "Finds email-like text.",
  "The lambda computes each replacement.",
  "`payment 7731 failed for a***@example.com`.",
  "`${name}` substitutes a group: `WARN: disk 91% full`.",
]
explanation = '''
The pattern anchors the whole line with `^` and `$` and names four groups. The garbage line
fails the match, and since `Match` reports failure through `Success` instead of an exception,
the loop prints `skip: garbage line`. For the matching lines it prints the padded level, the time
and the message. `Matches` with `\b[0-9]+\b` finds whole numbers in the message (`7731`).
`Replace` with a lambda receives each `Match` and keeps only the first letter of the user name,
masking the address as `a***@example.com`. A replacement string can also refer to groups with
`${name}`, which reformats the first line as `WARN: disk 91% full`.
'''

[[unit.step]]
kind = "drill"
id = "cs-u19-d3-validate-safely"
title = "Anchors, escaping and timeouts"
points = 10
difficulty = 19
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
Validation needs a pattern that matches the **whole** input, so anchors matter, and `$` has a
surprising exception for a final newline. Input from users must be escaped before it becomes
part of a pattern, and a backtracking engine needs a timeout so that a hostile input cannot hang
the program.
'''
prompt = '''
Validate product codes with exact anchors, normalise whitespace, search for a user-supplied term
safely, and stop a pathological pattern with a timeout.

**Why:** these are the regex mistakes that become security bugs in production: partial
validation, injected patterns, and denial of service through backtracking.
'''
target = '''
using System.Text.RegularExpressions;

var sku = new Regex(@"\A[A-Z]{3}-[0-9]{4}\z");
foreach (string s in new[] { "ABC-1234", "abc-1234", "ABC-12345", "XABC-1234" })
    Console.WriteLine($"{s,-10} {sku.IsMatch(s)}");
Console.WriteLine(Regex.IsMatch("ABC-1234\n", @"^[A-Z]{3}-[0-9]{4}$"));
Console.WriteLine(sku.IsMatch("ABC-1234\n"));

string messy = "  too   many \t spaces  ";
Console.WriteLine($"[{Regex.Replace(messy, @"\s+", " ").Trim()}]");

string text = "I write c++ and C#, mostly C++.";
string term = "C++";
try { Regex.Matches(text, term); }
catch (ArgumentException e) { Console.WriteLine(e.GetType().Name); }
int hits = Regex.Matches(text, Regex.Escape(term), RegexOptions.IgnoreCase).Count;
Console.WriteLine($"{Regex.Escape(term)} found {hits} times");

var evil = new Regex(@"^(a+)+$", RegexOptions.None, TimeSpan.FromMilliseconds(100));
try { evil.IsMatch(new string('a', 40) + "!"); }
catch (RegexMatchTimeoutException) { Console.WriteLine("gave up after 100 ms"); }
var safe = new Regex(@"^(a+)+$", RegexOptions.NonBacktracking);
Console.WriteLine(safe.IsMatch(new string('a', 40) + "!"));
'''
line_comments = [
  "For `Regex` and its exceptions.",
  "",
  "`\\A` and `\\z` anchor the very start and end.",
  "One valid code and three near misses.",
  "Only the first prints `True`.",
  "`$` accepts a trailing newline: `True`.",
  "`\\z` does not: `False`.",
  "",
  "Runs of spaces and a tab.",
  "Collapses every run to one space: `[too many spaces]`.",
  "",
  "Text to search.",
  "A search term typed by a user.",
  "Used raw, `++` is not a valid pattern.",
  "Prints `RegexParseException`.",
  "Escaped, it matches literally.",
  "The escaped form is `C\\+\\+`; found 2 times.",
  "",
  "Nested quantifiers can backtrack exponentially.",
  "Forty letters and a mismatch at the end.",
  "The timeout turns a hang into an exception.",
  "A linear-time engine (.NET 7 and later).",
  "Answers `False` almost instantly.",
]
explanation = '''
With `\A` and `\z` the code must be the entire string, so lowercase letters, an extra digit and
an extra leading letter all fail. The plain `$` anchor also matches just before a final `\n`,
which is why the `^...$` version accepts `"ABC-1234\n"` while `\z` rejects it. `\s+` matches
any run of whitespace, so one `Replace` normalises the spacing. The raw term `C++` is not a valid
pattern and throws `RegexParseException`, a subclass of `ArgumentException`; `Regex.Escape`
turns it into `C\+\+`, which matches `c++` and `C++` with `IgnoreCase`. The nested `(a+)+`
explores about 2^40 ways to split the letters before failing, so the 100 ms timeout fires, while
the `NonBacktracking` engine answers in linear time.
'''

[[unit.step]]
kind = "challenge"
id = "cs-u19-x1-csv-parser"
title = "A CSV parser with quoted fields"
points = 30
difficulty = 19
entry = "Csv"
intro = '''
CSV looks like "split on commas" until a field contains a comma or a quote. The real format
quotes such fields and doubles any quote inside them, so whether a character is data or syntax
depends on context. A single-pass state machine handles every case in O(n) and can report
exactly where malformed input breaks.
'''
instructions = '''
## Your turn

Implement the static class `Csv`:

```csharp
public static List<string> ParseLine(string line)
public static List<Dictionary<string, string>> ParseRecords(string text)
```

**`ParseLine`** splits one line into fields:

- Fields are separated by commas. `"a,,b"` gives `a`, `""`, `b`; `"a,"` gives `a`, `""`; and the
  empty line `""` gives one empty field.
- An **unquoted** field is kept exactly as written, spaces included. A `"` in the middle of an
  unquoted field is an ordinary character: `5" disk` is a valid field.
- A field that **starts** with `"` is quoted. It ends at the next lone `"`; inside it, commas are
  ordinary characters and `""` stands for one `"`. The quotes themselves are not part of the
  value: `"say ""hi""",x` gives `say "hi"` and `x`.
- After a closing quote, the next character must be a comma or the end of the line.
- Throw `FormatException` for an unterminated quoted field or for anything after a closing quote
  other than a comma.

**`ParseRecords`** parses a whole document:

- Split `text` on `\n` and remove one trailing `\r` from each line. Skip empty lines.
- The first non-empty line is the **header**. Each later line is a record, returned as a
  dictionary from column name to value, in file order.
- Throw `FormatException` if the header repeats a column name, if a record does not have exactly
  as many fields as the header, or if `ParseLine` fails. The message must contain the 1-based
  line number in the form `line 3`.
- Text without a header (empty, or only empty lines) gives an empty list, and so does a header
  with no records.

Fields never contain line breaks, so each line can be parsed on its own.

**Hint:** walk the line with an index. At the start of each field, look at one character to
decide between the quoted and the unquoted case.

Hidden tests decide correctness.
'''
starter = '''
using System.Text;

// A small CSV reader: quoted fields may contain commas, and "" inside quotes stands for ".
public static class Csv
{
    // The fields of one line. Throws FormatException for malformed quoting.
    public static List<string> ParseLine(string line) =>
        throw new NotImplementedException();

    // Header line + records as column -> value dictionaries. Errors mention "line N".
    public static List<Dictionary<string, string>> ParseRecords(string text) =>
        throw new NotImplementedException();
}
'''
tests = '''
static List<string> L(params string[] xs) => xs.ToList();
Test("plain fields and empty fields", () =>
{
    Equal(Csv.ParseLine("a,b,c"), L("a", "b", "c"));
    Equal(Csv.ParseLine("a,,c"), L("a", "", "c"));
    Equal(Csv.ParseLine("a,"), L("a", ""));
    Equal(Csv.ParseLine(","), L("", ""));
    Equal(Csv.ParseLine(""), L(""));
    Equal(Csv.ParseLine("single"), L("single"));
});
Test("unquoted fields keep their spaces and stray quotes", () =>
{
    Equal(Csv.ParseLine(" a , b "), L(" a ", " b "));
    Equal(Csv.ParseLine("5\" disk,ok"), L("5\" disk", "ok"));
});
Test("quoted fields may contain commas", () =>
{
    Equal(Csv.ParseLine("\"Lisbon, PT\",42"), L("Lisbon, PT", "42"));
    Equal(Csv.ParseLine("1,\"a,b,c\""), L("1", "a,b,c"));
});
Test("doubled quotes inside quoted fields", () =>
{
    Equal(Csv.ParseLine("\"say \"\"hi\"\"\",x"), L("say \"hi\"", "x"));
    Equal(Csv.ParseLine("\"\""), L(""));
    Equal(Csv.ParseLine("\"\",\"\""), L("", ""));
    Equal(Csv.ParseLine("\"\"\"\""), L("\""));
});
Test("malformed quoting throws FormatException", () =>
{
    Throws<FormatException>(() => Csv.ParseLine("\"abc"));
    Throws<FormatException>(() => Csv.ParseLine("x,\"abc\"\""));
    Throws<FormatException>(() => Csv.ParseLine("\"abc\"x,1"));
    Throws<FormatException>(() => Csv.ParseLine("\""));
});
Test("records map header names to values", () =>
{
    string text = "name,city,age\r\nAna,\"Lisbon, PT\",31\r\n\r\nBob,Porto,\r\n";
    Equal(Csv.ParseRecords(text), new List<Dictionary<string, string>>
    {
        new() { ["name"] = "Ana", ["city"] = "Lisbon, PT", ["age"] = "31" },
        new() { ["name"] = "Bob", ["city"] = "Porto", ["age"] = "" },
    });
});
Test("no header or no records gives an empty list", () =>
{
    Equal(Csv.ParseRecords(""), new List<Dictionary<string, string>>());
    Equal(Csv.ParseRecords("\n\r\n\n"), new List<Dictionary<string, string>>());
    Equal(Csv.ParseRecords("a,b\n"), new List<Dictionary<string, string>>());
});
Test("errors report the line number", () =>
{
    string Message(string text)
    {
        try { Csv.ParseRecords(text); }
        catch (FormatException e) { return e.Message; }
        return "no exception";
    }
    string wrongCount = Message("name,age\nana,31\nbob\n");
    Check(wrongCount.Contains("line 3"), $"field count error should mention line 3, got: {wrongCount}");
    string badQuote = Message("name,age\n\n\"ana,31\n");
    Check(badQuote.Contains("line 3"), $"quoting error should mention line 3, got: {badQuote}");
    string duplicate = Message("\nid,name,id\n1,a,2\n");
    Check(duplicate.Contains("line 2"), $"duplicate header should mention line 2, got: {duplicate}");
    string tooMany = Message("a\n1,2\n");
    Check(tooMany.Contains("line 2"), $"too many fields should mention line 2, got: {tooMany}");
});
Test("large documents parse in one pass", () =>
{
    var sb = new System.Text.StringBuilder("id,label,note\n");
    for (int i = 0; i < 50_000; i++) sb.Append(i).Append(",\"item, ").Append(i).Append("\",\"say \"\"").Append(i).Append("\"\"\"\n");
    var records = Csv.ParseRecords(sb.ToString());
    Equal(records.Count, 50_000);
    Equal(records[^1], new Dictionary<string, string> { ["id"] = "49999", ["label"] = "item, 49999", ["note"] = "say \"49999\"" });
});
'''

[unit.step.gabarito]
solution = '''
using System.Text;

// A small CSV reader: quoted fields may contain commas, and "" inside quotes stands for ".
public static class Csv
{
    public static List<string> ParseLine(string line)
    {
        var fields = new List<string>();
        var field = new StringBuilder();
        int i = 0;
        while (true)
        {
            field.Clear();
            if (i < line.Length && line[i] == '"')
            {
                i++;                                   // opening quote
                while (true)
                {
                    if (i >= line.Length) throw new FormatException("unterminated quoted field");
                    char c = line[i++];
                    if (c != '"') field.Append(c);
                    else if (i < line.Length && line[i] == '"') { field.Append('"'); i++; }
                    else break;                        // closing quote
                }
                if (i < line.Length && line[i] != ',')
                    throw new FormatException($"unexpected '{line[i]}' after a closing quote at column {i + 1}");
            }
            else
            {
                int comma = line.IndexOf(',', i);
                int end = comma < 0 ? line.Length : comma;
                field.Append(line, i, end - i);
                i = end;
            }
            fields.Add(field.ToString());
            if (i >= line.Length) return fields;
            i++;                                       // skip the comma
        }
    }

    public static List<Dictionary<string, string>> ParseRecords(string text)
    {
        var records = new List<Dictionary<string, string>>();
        List<string>? header = null;
        string[] lines = text.Split('\n');
        for (int n = 0; n < lines.Length; n++)
        {
            string line = lines[n].EndsWith('\r') ? lines[n][..^1] : lines[n];
            if (line.Length == 0) continue;
            int lineNo = n + 1;
            List<string> fields;
            try { fields = ParseLine(line); }
            catch (FormatException e) { throw new FormatException($"line {lineNo}: {e.Message}", e); }

            if (header is null)
            {
                if (fields.Distinct(StringComparer.Ordinal).Count() != fields.Count)
                    throw new FormatException($"line {lineNo}: duplicate column name");
                header = fields;
                continue;
            }
            if (fields.Count != header.Count)
                throw new FormatException($"line {lineNo}: expected {header.Count} fields, found {fields.Count}");
            var record = new Dictionary<string, string>(header.Count);
            for (int k = 0; k < header.Count; k++) record[header[k]] = fields[k];
            records.Add(record);
        }
        return records;
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let **n** be the length of the input. `ParseLine` moves its index forward on every step and
never goes back: each character is examined a constant number of times (once in the quoted loop,
or once by `IndexOf` and once by `Append` in the unquoted case), so a line costs time linear in
its length. `ParseRecords` splits the text once, removes a `\r`, and parses each line, so the
whole document takes **O(n)** time. Checking the header for duplicates with `Distinct` is
linear in the header's length thanks to hashing, and building each record dictionary is linear
in its number of fields.

The output itself holds every field, so the space is **O(n)**; the `StringBuilder` is reused
across fields and never holds more than one field at a time. A regex-based split would struggle
with `""` inside quotes and could backtrack on malformed input, while the explicit state machine
(start of field, inside quotes, after a closing quote) makes every rule one branch and lets each
error say exactly what went wrong and where. Wrapping `ParseLine`'s `FormatException` with the
line number, and keeping the original as `InnerException`, is the usual way to add context
without losing detail.
'''

[[unit]]
id = "cs-u20-equality-ordering"
title = "Equality, hashing and ordering"
level = "intermediate"
difficulty = 20
intro = '''
Is this the same object, or an equal one? Which of two values comes first? Dictionaries, sets,
`Distinct`, sorting and `Max` all depend on your types answering those questions consistently.
You will see the default behaviours of classes, records and strings, write value equality and a
natural order by hand, plug in custom comparers, and finish with a semantic-version type that
works as a dictionary key and sorts correctly.
'''
concepts = '''
## The idea

**Identity** asks "are these the same object in memory?". **Equality** asks "do these represent
the same value?". Two `Money` objects for 9.99 EUR created separately are different objects but
should be equal, so a dictionary keyed by price finds either one. **Ordering** asks "which comes
first?", which sorting, `Min`, `Max` and sorted collections need.

## How C# does it

- **Classes** use reference equality by default: `Equals` and `==` compare identity.
- **Records** generate value equality from their properties, plus `GetHashCode`, `==` and `!=`.
- **Strings** are classes, but they override `Equals` and `==` to compare characters.

To give a class value equality, implement `IEquatable<T>`, override `Equals(object?)` and
`GetHashCode`, and usually add `==` and `!=`:

```csharp
public sealed class Color : IEquatable<Color>
{
    public Color(byte r, byte g, byte b) => (R, G, B) = (r, g, b);
    public byte R { get; }
    public byte G { get; }
    public byte B { get; }
    public bool Equals(Color? other) => other is not null && R == other.R && G == other.G && B == other.B;
    public override bool Equals(object? obj) => Equals(obj as Color);
    public override int GetHashCode() => HashCode.Combine(R, G, B);
}
```

A **natural order** comes from `IComparable<T>`: `a.CompareTo(b)` returns a negative number, zero
or a positive number. Any **other** order is an `IComparer<T>`, such as
`StringComparer.OrdinalIgnoreCase`, `Comparer<T>.Create(...)`, or the key selectors of `OrderBy`
and `ThenBy`. `Dictionary` and `HashSet` accept an `IEqualityComparer<T>` in the same way.

## The contract

Hash-based collections first compare **hash codes** to find a bucket, then call `Equals`. So:

- `Equals` must be reflexive, symmetric and transitive, and `x.Equals(null)` is `false`;
- **equal objects must have equal hash codes** (unequal objects may share one);
- the hash must not change while the object is in a set or used as a key, so build it from
  immutable state;
- `CompareTo` should return 0 exactly when `Equals` is true, and `x.CompareTo(null)` is positive.

## Pitfalls

- **CS0659**: overriding `Equals` without `GetHashCode` is only a warning, but equal keys then
  land in different buckets and lookups silently fail.
- **CS0660 and CS0661**: defining `==` without overriding `Equals` and `GetHashCode`.
- **CS0535**: you declared `IComparable<T>` but didn't implement `CompareTo`.
- **Mutating a key** after adding it to a `HashSet` makes it unfindable.
- **`object` hides overloads.** For two `object` variables holding equal strings, `==` compares
  references; `Equals` is virtual and compares values.
- **`string.GetHashCode` is randomised per process**, so never store it or send it elsewhere.
- **`return a - b;` in `CompareTo`** overflows for large values. Use `a.CompareTo(b)`.

## What you will practise

You will compare classes, records and strings, write a `Money` class with full value equality
and use it as a key, then sort with a natural order, a custom comparer and `OrderBy`. The
challenge builds a `SemVer` type whose equality, hash code and ordering all agree.
'''

[[unit.step]]
kind = "concept"
id = "cs-u20-c1-identity-equality-order"
title = "Identity, equality and order"
points = 5
difficulty = 20
intro = '''
Collections rely on three questions about your type: are two values equal, what is the hash
code, and which comes first. The answers must agree with each other, which is called the
equality contract. Breaking it rarely throws; instead lookups quietly miss.
'''
body = '''
## Three questions, three APIs

| Question | API | Used by |
|---|---|---|
| Same value? | `Equals`, `IEquatable<T>`, `==` | `Contains`, `Distinct`, `IndexOf` |
| Which bucket? | `GetHashCode` | `Dictionary`, `HashSet`, `GroupBy` |
| Which first? | `IComparable<T>`, `IComparer<T>` | `Sort`, `OrderBy`, `Max`, `SortedSet` |

## How a HashSet finds an item

A `HashSet<T>` is an array of buckets. To look up `x` it computes `x.GetHashCode()`, picks the
bucket from that number, and only then calls `Equals` on the few items in that bucket. If two
equal objects return different hash codes, the set looks in the wrong bucket and reports that
the item is missing, even though an equal one is stored. That is why equal objects **must** have
equal hash codes.

```csharp
public override int GetHashCode() => HashCode.Combine(Amount, Currency);
```

`HashCode.Combine` mixes the fields well. Use exactly the fields that `Equals` compares.

## Comparing for order

`CompareTo` returns less than zero, zero or more than zero. Compare the most important field
first and fall through to the next one on a tie:

```csharp
public int CompareTo(Person? other)
{
    if (other is null) return 1;
    int byLast = string.CompareOrdinal(Last, other.Last);
    return byLast != 0 ? byLast : string.CompareOrdinal(First, other.First);
}
```

A type has at most one natural order. For any other order, such as by length or ignoring case,
pass an `IComparer<T>` instead of changing the type. Keep the natural order consistent with
equality: `CompareTo` returns 0 exactly when `Equals` is true.
'''

