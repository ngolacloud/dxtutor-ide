    "Prints `removed 2: 42 19 88 3 56`.",
    "",
    "Sorts in place, ascending, using the default comparison for `int`.",
    "Prints `sorted: 3 19 42 56 88`.",
    "`BinarySearch` finds 56 at index 3 in O(log n) comparisons.",
    "A missing value gives a negative number: the bitwise complement of where it belongs.",
    "`~miss` turns that back into the insertion point, index 2.",
    "",
    "A comparison lambda that compares `b` with `a` reverses the order.",
    "Prints `descending: 88 56 42 19 3`.",
