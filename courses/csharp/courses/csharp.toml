    var s = MinMaxStack.Of<int>();
    Equal(s.Count, 0);
    Throws<InvalidOperationException>(() => s.Pop());
    Throws<InvalidOperationException>(() => s.Peek());
    Throws<InvalidOperationException>(() => _ = s.Min);
    Throws<InvalidOperationException>(() => _ = s.Max);
    s.Push(4);
    s.Pop();
    Throws<InvalidOperationException>(() => _ = s.Min);
});
Test("pushing null throws and changes nothing", () =>
{
