[[unit.step]]
kind = "drill"
id = "cs-u02-d3-overflow"
title = "Overflow, checked and precision"
points = 10
difficulty = 2
placeholder_policy = "shown"
run_command = "dotnet run"
intro = '''
Fixed-size integers live on a circle: one step past the largest `int` lands on the smallest
one, because the hardware simply drops the bit that no longer fits. Floating-point `double`
values have a different limit, precision, since most decimal fractions have no exact binary
form. `checked` and `decimal` are the tools C# gives you for each problem.
'''
prompt = '''
Overflow an `int` silently, avoid it with a `long`, catch it with `checked`, then compare
`double` and `decimal` arithmetic on `0.1 + 0.2`.

**Why:** overflow and rounding errors produce wrong answers without crashing, which makes
them the hardest bugs to notice. Knowing where they come from is the defence.
'''
target = '''
using System.Globalization;

CultureInfo.CurrentCulture = CultureInfo.InvariantCulture;

int max = int.MaxValue;
int wrapped = max + 1;
Console.WriteLine(wrapped);
long safe = (long)max + 1;
Console.WriteLine(safe);

try
{
    int boom = checked(max + 1);
    Console.WriteLine(boom);
}
catch (OverflowException)
{
    Console.WriteLine("checked caught the overflow");
}

double a = 0.1 + 0.2;
decimal b = 0.1m + 0.2m;
Console.WriteLine(a);
Console.WriteLine(b);
Console.WriteLine(a == 0.3);
Console.WriteLine(b == 0.3m);
'''
