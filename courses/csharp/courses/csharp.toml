[unit.step.gabarito]
solution = '''
public abstract record Expr;
public sealed record Num(int Value) : Expr;
public sealed record Var(string Name) : Expr;
public sealed record Add(Expr Left, Expr Right) : Expr;
public sealed record Mul(Expr Left, Expr Right) : Expr;
public sealed record Neg(Expr Operand) : Expr;

public static class ExprTools
{
    public static int Eval(Expr e, IReadOnlyDictionary<string, int> vars) => e switch
    {
        Num(var n) => n,
        Var(var name) => vars[name],
        Add(var l, var r) => Eval(l, vars) + Eval(r, vars),
        Mul(var l, var r) => Eval(l, vars) * Eval(r, vars),
        Neg(var operand) => -Eval(operand, vars),
        _ => throw new ArgumentException($"unknown node {e.GetType().Name}", nameof(e)),
    };

    public static Expr Simplify(Expr e) => e switch
    {
        Add(var l, var r) => Rewrite(new Add(Simplify(l), Simplify(r))),
        Mul(var l, var r) => Rewrite(new Mul(Simplify(l), Simplify(r))),
        Neg(var operand) => Rewrite(new Neg(Simplify(operand))),
        _ => e,
    };

    // Children are already simplified: apply the rules to this node only.
    private static Expr Rewrite(Expr e) => e switch
    {
        Add(Num(var a), Num(var b)) => new Num(a + b),
        Add(Num(0), var right) => right,
        Add(var left, Num(0)) => left,
        Mul(Num(var a), Num(var b)) => new Num(a * b),
        Mul(Num(0), _) or Mul(_, Num(0)) => new Num(0),
        Mul(Num(1), var right) => right,
        Mul(var left, Num(1)) => left,
        Neg(Num(var n)) => new Num(-n),
        Neg(Neg(var inner)) => inner,
        _ => e,
    };
}
'''
time = 'O(n)'
space = 'O(n)'
justification = '''
Let `n` be the number of nodes in the tree. **`Eval`** visits each node once and does
constant work there (one pattern test and at most one arithmetic operation or dictionary
lookup), so it runs in **O(n)** time. **`Simplify`** also visits each node once: it recurses
into the children, rebuilds the node, and `Rewrite` tests a fixed list of patterns, each of
which looks at most two levels deep. That is constant work per node, so **O(n)** time.

Space is **O(n)**: `Simplify` may allocate a new record for every node it rebuilds, and the
recursion uses one stack frame per level, O(h) for a tree of height `h`, which is n for a
degenerate chain like the one in the tests.

A single pass is enough because of the bottom-up order. When `Rewrite` runs, both children
are already fully simplified, and every rule either returns one of those children, returns a
`Num`, or leaves the node as it is. None of those results can enable a new rule higher up that
a second pass would find, which is why `Simplify(Simplify(e))` equals `Simplify(e)`. A
top-down version that rewrote the parent before its children would miss cascades such as
`(0 + 1) * x` and need to loop until nothing changed.
'''

[[unit]]
id = 'cs-u23-iterators-yield'
title = 'Iterators and yield'
level = 'advanced'
difficulty = 23
intro = '''
`foreach` works on anything that can hand out an enumerator, and `yield return` lets you write
such a sequence as an ordinary-looking method that the compiler turns into a resumable state
machine. You will drive an enumerator by hand, build lazy and infinite sequences, see exactly
when validation and cleanup run, and finish with two reusable lazy operators.
'''
concepts = '''
## The idea

A **sequence** is something you can walk one element at a time without knowing in advance how
many elements there are or where they come from: an array, the lines of a huge file, the
Fibonacci numbers. .NET models this with two interfaces. `IEnumerable<T>` is a **factory**: its
one method, `GetEnumerator()`, returns a fresh cursor. `IEnumerator<T>` is the **cursor**:
`MoveNext()` advances and says whether there is an element, `Current` reads it, and `Dispose()`
releases whatever the cursor holds. A `foreach` loop is shorthand for exactly this:

```csharp
using (IEnumerator<int> e = numbers.GetEnumerator())
{
    while (e.MoveNext())
        Console.WriteLine(e.Current);
}
```

Because each element is produced only when `MoveNext` asks for it, a sequence can be **lazy**
(no work happens until someone pulls) and even **infinite**.

## How C# does it

Writing an enumerator class by hand is tedious. An **iterator method** returns
`IEnumerable<T>` (or `IEnumerator<T>`) and hands out elements with `yield return`:

```csharp
static IEnumerable<int> Evens(int limit)
{
    for (int i = 0; i <= limit; i += 2)
        yield return i;
}
```

The compiler rewrites the method into a hidden class whose fields hold the local variables and
a state number. Calling `Evens(10)` runs **none** of the body; it only creates that object.
Each `MoveNext()` resumes the body where it paused, runs to the next `yield return`, and pauses
again. `yield break` ends the sequence early. A `finally` block runs when the body finishes
**or** when the consumer stops early and disposes the enumerator, which is how a `foreach`
with a `break` still closes a file.

LINQ operators such as `Where`, `Select` and `Take` are iterators too, so chaining them builds a
**pipeline**: each element travels through every stage before the next element is read, and
`Take(3)` stops pulling after the third.

## Pitfalls and compiler messages

- **Deferred validation.** Argument checks inside an iterator run at the first `MoveNext`, not
  at the call, so a bad argument fails far from the bug. The fix is a normal public method that
  validates and then returns a private iterator, often a local function.
- **Multiple enumeration.** Every `foreach` over an iterator runs its body again from the start.
  If that is expensive or has side effects, materialise once with `ToList()`.
- Changing a `List<T>` while a `foreach` walks it throws `InvalidOperationException`
  ("Collection was modified").
- An iterator must return an iterator interface, not `List<T>` (**CS1624**); it cannot
  `return` a value (**CS1622**); it cannot take `ref` or `out` parameters (**CS1623**); and
  `yield return` is not allowed inside a `try` that has a `catch` (**CS1626**).

## What you will practise

You will drive an enumerator by hand, trace a lazy pipeline over an infinite generator, and
watch when validation and `finally` blocks run. The challenge asks for two lazy operators,
run-length encoding and sliding windows, that must stream through a million elements while
reading only what they need.
'''

[[unit.step]]
kind = 'concept'
id = 'cs-u23-c1-state-machine'
title = 'An iterator is a paused method'
points = 5
difficulty = 23
intro = '''
An iterator method is compiled into a state machine: an object that remembers where the method
paused and the values of its local variables. Each `MoveNext` call runs the method from that
point to the next `yield return`, so the caller and the iterator take turns.
'''
body = '''
## Taking turns

Consider this iterator and a loop that consumes it:

```csharp
static IEnumerable<string> Steps()
{
    Console.WriteLine("before A");
    yield return "A";
    Console.WriteLine("before B");
    yield return "B";
    Console.WriteLine("done");
}

foreach (var s in Steps()) Console.WriteLine($"got {s}");
```

It prints `before A`, `got A`, `before B`, `got B`, `done`. The loop body runs *between* the
pieces of the iterator. Nothing is computed ahead of time and nothing is stored in a list:
the iterator holds only its current position and its local variables.

## What the compiler builds

`Steps()` returns an object of a generated class. Its `MoveNext` is a `switch` over a state
field: state 0 runs up to the first `yield return`, stores `"A"` in `Current`, sets the state
to 1 and returns `true`; state 1 continues from there, and so on. When the body ends,
`MoveNext` returns `false`.

## Laziness has consequences

- Calling an iterator does no work, so an exception inside it appears only when someone
  enumerates.
- Two `foreach` loops over the same iterator run the body twice.
- An infinite iterator, such as `while (true) yield return n++;`, is perfectly fine as long as
  the consumer stops, for example with `Take` or `break`.

This is the same machinery that `async` methods use to pause at `await`, which you will meet
in the next unit.
'''

