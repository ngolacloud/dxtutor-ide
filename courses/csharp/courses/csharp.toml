});
Test("every operation is O(1) on a large stack", () =>
{
    const int n = 200_000;
    var s = new MinMaxStack<int>();
    var watch = Stopwatch.StartNew();
    long checksum = 0;
    for (int i = 0; i < n; i++)
    {
        s.Push(i % 2 == 0 ? i : -i);
        checksum += s.Min + s.Max;
    }
    for (int i = 0; i < n; i++)
    {
        checksum += s.Min - s.Max;
        s.Pop();
    }
    watch.Stop();
    Equal(s.Count, 0);
