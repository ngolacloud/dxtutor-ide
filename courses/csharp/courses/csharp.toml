    "",
    "The range `1..4` copies slots 1, 2 and 3 into a new array; the end index is exclusive.",
    "`string.Join` puts the separator between the elements and prints `23, 15, 30`.",
    "",
    "An accumulator for the total.",
    "`foreach` visits every element in order, read-only.",
    "",
    "Adds the current reading to the total.",
    "",
