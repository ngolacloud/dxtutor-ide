prompt = '''
Use `Parallel.For` to process 1,000 numbers on several threads, aggregating a sum, a count and a
maximum with `Interlocked`.

**Why:** small shared aggregates are common in parallel code, and `Interlocked` updates them
atomically without the cost of a lock. The compare-and-swap loop works for any update.
'''
target = '''
long sum = 0;
int evens = 0;
int max = int.MinValue;

Parallel.For(0, 1_000, i =>
{
    Interlocked.Add(ref sum, i);
    if (i % 2 == 0)
    {
        Interlocked.Increment(ref evens);
    }
    UpdateMax(ref max, i * 7 % 1_000);
});

Console.WriteLine($"sum = {sum}");
Console.WriteLine($"evens = {evens}");
Console.WriteLine($"max = {max}");

static void UpdateMax(ref int target, int candidate)
{
    int current = Volatile.Read(ref target);
    while (candidate > current)
    {
        int seen = Interlocked.CompareExchange(ref target, candidate, current);
        if (seen == current) return;
        current = seen;
    }
}
'''
