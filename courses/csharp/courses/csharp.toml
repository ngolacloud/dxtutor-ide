prompt = '''
Remove every 7 from the list 7 -> 1 -> 7 -> 2 -> 7 and print what is left.

**Why:** deletion is "make the previous node skip this one". A dummy node in front of the
head lets the same code delete the first node, a middle node or the last node, and
`EqualityComparer<T>.Default` compares generic values safely.
'''
target = '''
var head = new Node<int>(7, new(1, new(7, new(2, new(7, null)))));
head = RemoveAll(head, 7);
Console.WriteLine($"[{string.Join(", ", Values(head))}]");

static Node<T>? RemoveAll<T>(Node<T>? head, T target)
{
    var dummy = new Node<T>(default!, head);
    var prev = dummy;
    while (prev.Next is not null)
    {
        if (EqualityComparer<T>.Default.Equals(prev.Next.Value, target))
            prev.Next = prev.Next.Next;
        else
            prev = prev.Next;
    }
    return dummy.Next;
}

static IEnumerable<T> Values<T>(Node<T>? node)
{
    for (; node is not null; node = node.Next)
        yield return node.Value;
}

class Node<T>(T value, Node<T>? next)
{
    public T Value { get; } = value;
    public Node<T>? Next { get; set; } = next;
}
