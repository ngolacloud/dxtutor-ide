[[unit.step]]
kind = "challenge"
id = "cs-u07-x1-max-window"
title = "Best window of consecutive values"
points = 30
difficulty = 7
entry = "MaxWindowSum"
intro = '''
A **sliding window** turns an O(n·k) problem into an O(n) one. Instead of re-adding the `k`
values of every window, you keep the current window's sum and update it as the window moves
one step: add the value that enters, subtract the value that leaves. Each element is touched
twice, whatever the size of the window.
'''
instructions = '''
## Your turn

Implement the static method `Windows.MaxWindowSum`:

```csharp
public static long MaxWindowSum(int[] values, int width)
```

It returns the largest sum of any `width` **consecutive** elements of `values`.

Rules:

- Throw `ArgumentOutOfRangeException` if `width` is less than 1 or greater than
  `values.Length` (so an empty array always throws).
- The result is a `long`: the sum of many large `int`s does not fit in an `int`. Make sure no
  intermediate step overflows either.
- Values can be negative, and so can the answer.
- Don't modify `values`.
- Arrays can hold 200,000 elements with windows of 100,000, so re-adding every window from
  scratch is far too slow. Aim for a single pass.

Examples:

- `MaxWindowSum([1, -2, 3, 4, -1, 2], 2)` returns `7` (3 + 4).
- `MaxWindowSum([1, -2, 3, 4, -1, 2], 3)` returns `6` (3 + 4 - 1).
- `MaxWindowSum([-5, -2, -9], 2)` returns `-7`.
- `MaxWindowSum([4], 1)` returns `4`.

**Hint:** sum the first window, then move it one step at a time: add `values[i]` and subtract
`values[i - width]`, keeping the best sum seen so far.

Hidden tests decide correctness.
'''
starter = '''
public static class Windows
{
    // Return the largest sum of `width` consecutive elements of `values`.
    // Throw ArgumentOutOfRangeException when width < 1 or width > values.Length.
    // Use a long accumulator and a single pass (a sliding window).
    public static long MaxWindowSum(int[] values, int width)
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
Test("the examples", () =>
{
    int[] xs = [1, -2, 3, 4, -1, 2];
    Equal(Windows.MaxWindowSum(xs, 2), 7L);
    Equal(Windows.MaxWindowSum(xs, 3), 6L);
    Equal(Windows.MaxWindowSum(xs, 6), 7L);
});
Test("width 1 is the largest element", () =>
{
    Equal(Windows.MaxWindowSum([3, 9, -4, 9, 2], 1), 9L);
    Equal(Windows.MaxWindowSum([4], 1), 4L);
});
Test("all negative values", () =>
{
    Equal(Windows.MaxWindowSum([-5, -2, -9], 2), -7L);
    Equal(Windows.MaxWindowSum([-8, -3, -6, -1], 1), -1L);
});
Test("the best window can be the last one", () =>
{
    Equal(Windows.MaxWindowSum([1, 1, 1, 0, 5, 6], 2), 11L);
    Equal(Windows.MaxWindowSum([9, 0, 0, 0, 1, 9], 2), 10L);
});
Test("sums do not overflow an int", () =>
{
    int[] big = [int.MaxValue, int.MaxValue, int.MaxValue];
    Equal(Windows.MaxWindowSum(big, 2), 4294967294L);
    Equal(Windows.MaxWindowSum(big, 3), 6442450941L);
    int[] swing = [int.MinValue, int.MaxValue, int.MinValue, int.MaxValue];
    Equal(Windows.MaxWindowSum(swing, 1), (long)int.MaxValue);
    Equal(Windows.MaxWindowSum(swing, 2), -1L);
});
Test("rejects impossible widths", () =>
{
    Throws<ArgumentOutOfRangeException>(() => Windows.MaxWindowSum([1, 2, 3], 0));
    Throws<ArgumentOutOfRangeException>(() => Windows.MaxWindowSum([1, 2, 3], -1));
    Throws<ArgumentOutOfRangeException>(() => Windows.MaxWindowSum([1, 2, 3], 4));
    Throws<ArgumentOutOfRangeException>(() => Windows.MaxWindowSum([], 1));
});
Test("does not modify the input", () =>
{
    int[] xs = [5, -1, 7, 2];
    Windows.MaxWindowSum(xs, 2);
    Equal(xs, new[] { 5, -1, 7, 2 });
});
Test("large input in a single pass", () =>
{
    int n = 200_000, k = 100_000;
    var xs = new int[n];
    for (int i = 0; i < n; i++) xs[i] = (int)((i * 7919L) % 2001) - 1000;
    var prefix = new long[n + 1];
    for (int i = 0; i < n; i++) prefix[i + 1] = prefix[i] + xs[i];
    long expected = long.MinValue;
    for (int i = k; i <= n; i++) expected = Math.Max(expected, prefix[i] - prefix[i - k]);
    var clock = System.Diagnostics.Stopwatch.StartNew();
    long got = Windows.MaxWindowSum(xs, k);
    clock.Stop();
    Equal(got, expected);
    Check(clock.ElapsedMilliseconds < 1000, $"took {clock.ElapsedMilliseconds} ms: use a sliding window");
});
'''

[unit.step.gabarito]
solution = '''
public static class Windows
{
    public static long MaxWindowSum(int[] values, int width)
    {
        ArgumentOutOfRangeException.ThrowIfLessThan(width, 1);
        ArgumentOutOfRangeException.ThrowIfGreaterThan(width, values.Length);

        long window = 0;
        for (int i = 0; i < width; i++)
        {
            window += values[i];
        }

        long best = window;
        for (int i = width; i < values.Length; i++)
        {
            window += values[i];
            window -= values[i - width];
            best = Math.Max(best, window);
        }
        return best;
    }
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
The first loop adds the first `width` values, and the second loop runs once for each of the
remaining `n - width` positions, doing a constant amount of work per step (one addition, one
subtraction, one comparison). Every element enters the window once and leaves it at most once,
so the total time is **O(n)**, independent of `width`. Only two `long` variables are kept, so
the extra space is **O(1)**: no copy of the array, no prefix-sum table.

The invariant is that `window` always holds the sum of the `width` values ending at index
`i`. Recomputing each window from scratch would also be correct, but it costs O(n·k): with
200,000 elements and windows of 100,000 that is about 10 billion additions. Note the two
separate statements `window += values[i]; window -= values[i - width];`. Writing
`window += values[i] - values[i - width]` subtracts two `int`s **before** widening to `long`,
and that difference can overflow, for example `int.MaxValue - int.MinValue`.
'''

[[unit]]
id = "cs-u08-dictionaries-sets"
title = "Dictionaries and sets"
level = "intermediate"
difficulty = 8
intro = '''
A list answers "what is at position 3?", but most real questions sound like "what is the
price of milk?" or "have I seen this user before?". This unit introduces the two hash-based
collections that answer them in O(1) on average, `Dictionary<TKey, TValue>` and `HashSet<T>`,
and the counting and grouping patterns built on top of them. The challenge groups words into
families of anagrams.
'''
concepts = '''
## The idea

A **hash table** stores entries in an array of **buckets**. To place a key, it computes the
key's **hash code**, a number derived from its contents, and maps that number to a bucket.
To find the key again it repeats the calculation and looks only in that one bucket, instead of
scanning everything. With a good hash function and enough buckets, adding, finding and
removing a key all take **O(1) on average**. When the table fills up it grows and re-hashes
every entry, which, like a list's doubling, keeps the average cost constant.

A **dictionary** maps unique keys to values: word → count, id → user. A **set** keeps unique
values with no payload, so its whole job is a fast answer to "is this already here?".

## How C# does it

```csharp
var ages = new Dictionary<string, int> { ["Ada"] = 36 };
ages["Lin"] = 29;                     // add or overwrite
ages.Add("Bo", 41);                   // add; throws if the key exists
if (ages.TryGetValue("Ada", out int age))
    Console.WriteLine(age);           // 36
int zoe = ages.GetValueOrDefault("Zoe"); // 0: default(int)

var seen = new HashSet<string>();
Console.WriteLine(seen.Add("x"));     // True: added
Console.WriteLine(seen.Add("x"));     // False: already there
```

Iterating a dictionary yields `KeyValuePair<TKey, TValue>` items, which you can deconstruct:
`foreach (var (name, value) in ages)`. `Keys` and `Values` are live views. `HashSet<T>` adds
set algebra that edits the set in place: `UnionWith`, `IntersectWith`, `ExceptWith`, plus
tests such as `IsSubsetOf` and `Overlaps`.

Keys are compared with `Equals` and `GetHashCode`. Strings, numbers and records already
implement both by value. Pass a comparer to change the rule, for example
`new Dictionary<string, int>(StringComparer.OrdinalIgnoreCase)`.

## Pitfalls and compiler errors

- Reading a missing key with the indexer, `ages["Zoe"]`, throws `KeyNotFoundException`. Use
  `TryGetValue` or `GetValueOrDefault` when absence is normal.
- `Add` with an existing key throws `ArgumentException: An item with the same key has already
  been added`. The indexer setter overwrites silently, and `TryAdd` returns `false`.
- `counts[word]++` on a key that is not there yet also throws, because it reads first.
- Never rely on iteration order. A dictionary happens to keep insertion order until you
  remove entries, but that is not promised. Sort when the order matters.
- Changing a dictionary inside a `foreach` over it throws `InvalidOperationException`.
- Don't mutate an object while it is a key: its hash code changes and the entry becomes
  unreachable.
- `dict.Length` is **CS1061**; the property is `Count`.

## What you will practise

You will store and query stock levels, deduplicate and combine sets of visitors, and write the
two classic patterns, counting with `GetValueOrDefault` and grouping into lists with
`TryGetValue`. The challenge combines both collections to build anagram families.
'''

[[unit.step]]
kind = "concept"
id = "cs-u08-c1-hashing"
title = "Keys, buckets and hash codes"
points = 5
difficulty = 8
intro = '''
Hashing trades a little memory for speed: a key's hash code tells the table which bucket to
look in, so a lookup inspects a handful of entries instead of all of them. Equal keys must
produce equal hash codes, or the table looks in the wrong bucket and never finds them.
'''
body = '''
## From key to bucket

```csharp
string key = "milk";
int hash = key.GetHashCode();          // some int, different on every run
int bucket = (hash & 0x7FFFFFFF) % 16; // one of 16 buckets
```

`Dictionary` does roughly this internally. Two different keys can land in the same bucket, a
**collision**, so each bucket holds a short chain of entries and the dictionary compares them
with `Equals` until it finds the right one. As long as chains stay short, a lookup is O(1) on
average. In the worst case, when every key collides, it degrades to O(n).

String hash codes are **randomised per process** in .NET, which protects servers from attacks
that feed them colliding keys. Never store or print a hash code and expect it to match next
time you run the program.

## The contract

For hashing to work, two rules must hold:

1. If `a.Equals(b)`, then `a.GetHashCode() == b.GetHashCode()`.
2. A key's hash code must not change while it sits in the table.

Built-in types such as `string`, `int` and records follow both rules. A class you write
compares by reference unless you override `Equals` and `GetHashCode` (unit 20).

## Dictionary or HashSet?

Use a `Dictionary<TKey, TValue>` when each key carries information: a count, a price, a list
of items. Use a `HashSet<T>` when the only question is membership: visited pages, unique tags,
values already processed. Both give O(1) average lookups, and neither keeps its entries sorted.
'''

