  "A new array; the inputs are untouched.",
  "",
]
explanation = '''
The merge compares the front items and copies the smaller one: 1, 2, 3, then the three 4s
(the left array's two 4s first, because ties take from the left), then 9. At that point
`left` is exhausted after 7 comparisons, and the leftover loop copies 10 and 12 without
comparing. The program prints `1 2 3 4 4 4 9 10 12 (7 comparisons)` and then `7 8`. A merge
of n + m items never needs more than n + m − 1 comparisons, so it is linear. The collection
expressions `[]` and `[7, 8]` are target-typed to `int[]` by the parameters.
'''

