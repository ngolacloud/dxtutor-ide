  "`First` stops as soon as it finds a match.",
  "Only three more evaluations: 2, 4, 6.",
]
explanation = '''
Defining `doubled` ran nothing (`0`). Adding `4` before enumerating meant `string.Join` saw
`2, 4, 6, 8`, after four evaluations, and `Sum` ran the lambda four more times (`sum 20, now 8`).
`ToList()` ran it again and froze four results, so after adding `5` the snapshot still has `4`
items while the query, run once more by `Count()`, has `5`. That makes `17` evaluations in total.
`First` streamed through 2, 4 and 6 and stopped at the first value above 4, adding only three:
`first > 4 is 6, evaluations 20`.
'''

[[unit.step]]
kind = "challenge"
id = "cs-u15-x1-sales-report"
title = "A sales report with LINQ"
points = 30
difficulty = 15
entry = "SalesReport"
intro = '''
Reports are where LINQ shines: a join connects sales to the product catalog, a grouping
aggregates them, and a sort with a tie-breaker ranks the result. Doing it right also means
respecting deferred execution: a sequence streamed from a file or a database can often be read
only once, so each input must be enumerated a single time.
'''
instructions = '''
## Your turn

The starter provides two records:

```csharp
public record Product(string Sku, string Name, string Category, decimal Price);
public record Sale(string Sku, int Quantity);
```

Implement three methods in the static class `SalesReport`:

```csharp
public static Dictionary<string, decimal> RevenueByCategory(IEnumerable<Sale> sales, IEnumerable<Product> products)
public static List<string> TopSellers(IEnumerable<Sale> sales, IEnumerable<Product> products, int count)
public static List<string> Unsold(IEnumerable<Sale> sales, IEnumerable<Product> products)
```

Rules:

- A sale's revenue is `Quantity * Price` of the product with the same `Sku`. Catalog SKUs are
  unique. Sales whose `Sku` is not in the catalog are **ignored** everywhere.
- `RevenueByCategory` maps each category that has at least one known sale to its total revenue.
- `TopSellers` returns the **names** of the products with the most units sold (summed over all
  their sales), highest first, ties broken by name in **ordinal** order
  (`StringComparer.Ordinal`), at most `count` names. Products with no sales are not listed.
  `count` of 0 gives an empty list; a negative `count` throws `ArgumentOutOfRangeException`.
- `Unsold` returns the names of catalog products that have no sale at all, in ordinal order.
- Each input sequence may be enumerated **only once** (it might be streamed from a file); the
  tests check this. Every method returns a finished collection, not a lazy query.
- A `null` argument throws `ArgumentNullException`.

Example with products `B1` ("Dune", "books", 10m) and `P1` ("Pen", "office", 1.50m) and sales
`B1×2`, `P1×4`, `B1×1`, `ZZ×9`:

- `RevenueByCategory` → `{ books: 30, office: 6 }` (the `ZZ` sale is ignored);
- `TopSellers(..., 1)` → `["Pen"]` (4 units beat 3).

**Hint:** `Join` reads each input once and pairs sales with products through a hash table.
`GroupBy`, `Sum`, `OrderByDescending`, `ThenBy` and `Take` do the rest. For `Unsold`, collect
the sold SKUs into a `HashSet<string>` first.

Hidden tests decide correctness.
'''
starter = '''
// Provided: the catalog entry and the sale record. Do not change them.
public record Product(string Sku, string Name, string Category, decimal Price);

public record Sale(string Sku, int Quantity);

// Build each report with LINQ. Enumerate each input sequence only once.
public static class SalesReport
{
