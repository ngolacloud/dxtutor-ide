]
explanation = '''
With 4 buckets an `int` key lands in bucket `key % 4`, so 1, 5 and 9 share bucket 1 and 2
sits alone in bucket 2. The second `Put(5, ...)` finds 5 in its chain and replaces the tuple,
so the count stays 4 and the program prints `count=4 buckets=[0, 3, 1, 0]`, then `FIVE`.
Looking up 13 hashes to bucket 1 as well and compares it with all three entries before
giving up, printing `13 missing`. Two buckets are empty while one holds three entries: that
imbalance is why real tables grow once the load factor (here 4 / 4 = 1.0) passes a limit.
'''

