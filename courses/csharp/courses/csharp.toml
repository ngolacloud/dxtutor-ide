the missing ones.

**Why:** a missing value and a zero are different facts. `int?` keeps them apart, and the
language defines exactly how missing values propagate.
'''
target = '''
using System.Globalization;

int? ParseOrNull(string text) =>
    int.TryParse(text, NumberStyles.Integer, CultureInfo.InvariantCulture, out int n) ? n : null;

int?[] readings = { ParseOrNull("12"), ParseOrNull("n/a"), ParseOrNull("-3"), ParseOrNull("") };
foreach (int? r in readings)
    Console.WriteLine(r.HasValue ? $"value {r.Value}" : "missing");

int? missing = readings[1];
Console.WriteLine(missing + 10 is null);
Console.WriteLine(missing > 0 || missing <= 0);
Console.WriteLine(missing.GetValueOrDefault(-1));

int first = readings[0] ?? 0;
Console.WriteLine(first * 2);
Console.WriteLine(readings.Sum());
Console.WriteLine(readings.Count(r => r is not null));
Console.WriteLine(readings.Average()?.ToString(CultureInfo.InvariantCulture));
'''
