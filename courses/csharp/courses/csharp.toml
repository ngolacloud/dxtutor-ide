[unit.step.gabarito]
solution = '''
// Triangles: name the kind of triangle three side lengths make.
public static class Triangles
{
    // Return "invalid", "equilateral", "isosceles" or "scalene".
    public static string Classify(int a, int b, int c)
    {
        if (a <= 0 || b <= 0 || c <= 0)
        {
            return "invalid";
        }
        if ((long)a + b <= c || (long)a + c <= b || (long)b + c <= a)
        {
            return "invalid";
        }
        if (a == b && b == c)
        {
            return "equilateral";
        }
        return a == b || b == c || a == c ? "isosceles" : "scalene";
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The method performs a fixed number of comparisons and additions, at most a dozen, whatever the
side lengths are, so the time is **O(1)**; and it stores nothing but its three parameters, so
the extra space is **O(1)**.

Correctness comes from the **order** of the tests. Rejecting non-positive sides and impossible
shapes first means the later tests can assume a real triangle, so `-2, -2, -2` is never called
equilateral. Once the equilateral case is ruled out, the single remaining question is "are any two sides
equal?", which one `?:` answers. Doing the sums in `long` matters: with `int`,
`int.MaxValue + 1` wraps to a negative number, which would make `int.MaxValue, 1, int.MaxValue`
look impossible.
'''

[[unit]]
id = "cs-u05-loops"
title = "Loops: for, while and foreach"
level = "basic"
difficulty = 5
intro = '''
Computers are good at doing the same thing many times without getting bored or making
mistakes. Loops are how you ask for that repetition. This unit covers the counting `for` loop,
`while` and `do`-`while` for "repeat until", `foreach` for walking through a collection, and
`break`/`continue` for leaving a loop or skipping a turn.
'''
concepts = '''
## The idea

A **loop** runs a block of code, the **body**, again and again while some condition holds.
Each run of the body is an **iteration**. Loops turn a program that handles one value into one
that handles a thousand: summing numbers, scanning text, retrying an operation. Every loop
needs something that eventually makes its condition false, or it never stops.

## How C# does it

The **`for`** loop is built for counting. Its header has three parts: an initializer that runs
once, a condition checked before every iteration, and a step that runs after every iteration.

```csharp
for (int i = 0; i < 5; i++)   // i takes the values 0, 1, 2, 3, 4
{
    Console.Write(i);
}
```

`i++` adds one to `i` (and `i--` subtracts one); `total += x` is short for `total = total + x`.

A **`while`** loop repeats as long as its condition is true, and checks it *before* each
iteration, so the body may run zero times. A **`do`-`while`** loop checks *after*, so its body
always runs at least once, which suits "ask, then decide whether to ask again".

**`foreach`** visits every element of a collection in order, without any index to manage:

```csharp
foreach (char c in "abc")
{
    Console.WriteLine(c);
}
```

Inside any loop, **`break`** leaves the loop immediately and **`continue`** skips the rest of
the current iteration and moves on to the next one. In nested loops, both affect only the
innermost loop.

## What is special or tricky

- **Off-by-one errors.** `i <= 5` runs one more time than `i < 5`. For a string or array of
  length `n`, valid indexes are `0` to `n - 1`, so the usual header is
  `for (int i = 0; i < s.Length; i++)`.
- **Infinite loops.** A `while` whose condition never becomes false hangs the program. Make
  sure the body changes something the condition depends on.
- **The loop variable is local to the loop.** Using `i` after the `for` has ended is
  `CS0103: The name 'i' does not exist in the current context`.
- **`foreach` variables are read-only.** Assigning to one is `CS1656: Cannot assign to 'c'
  because it is a 'foreach iteration variable'`.
- **Overflow inside loop conditions.** `i * i <= n` looks harmless, but when `n` is close to
  `int.MaxValue`, `i * i` can wrap to a negative number and the loop never ends correctly.

## What you will practise

You will sum and count with `for`, nest two loops to draw a shape, repeat with `while` until a
sequence reaches 1, peel digits off a number, see a `do`-`while` run once, and steer `foreach`
loops with `break` and `continue`. Then you will write a prime-number checker that must stay
fast and correct up to the largest `int`.
'''

[[unit.step]]
kind = "concept"
id = "cs-u05-c1-repetition"
title = "Repeating work"
points = 5
difficulty = 5
intro = '''
A loop is a branch that jumps backwards: after the body runs, control returns to the
condition and tests it again. The number of iterations, as a function of the input size, is
the first thing to estimate when you ask how fast a program is. That estimate is what Big-O
notation describes.
'''
body = '''
## Picking the right loop

- **`for`** when you know how many times to repeat, or you need an index: "for each `i` from
  0 to 9".
- **`foreach`** when you want every element of a collection and do not care about positions:
  "for each character in this word".
- **`while`** when you repeat until something happens and cannot know in advance how many
  turns it takes: "while the number is not 1".
- **`do`-`while`** for the same, when the body must run at least once.

## Tracing a loop

Reading a loop well means tracing it by hand with a small input. Take this one:

```csharp
int total = 0;
for (int i = 1; i <= 3; i++)
{
    total += i;
}
```

| before iteration | `i` | `i <= 3`? | `total` after the body |
|---|---|---|---|
| 1 | 1 | yes | 1 |
| 2 | 2 | yes | 3 |
| 3 | 3 | yes | 6 |
| — | 4 | no: the loop ends | 6 |

The condition was tested four times but the body ran three times. That last, failing test is
where off-by-one errors hide.

## Counting the work

If a loop runs once per element of an input of size `n`, its cost grows in proportion to `n`:
**O(n)**. Two nested loops over the same input run `n × n` times: **O(n²)**. A loop that stops
at the square root of `n` runs about `√n` times: **O(√n)**. You will use exactly that idea in
this unit's challenge.
'''

