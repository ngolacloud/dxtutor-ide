public class MinMaxStack<T> where T : IComparable<T>
{
    public int Count => throw new NotImplementedException();

    public void Push(T item)
    {
        throw new NotImplementedException();
    }

    public T Pop()
    {
        throw new NotImplementedException();
    }

    public T Peek()
    {
        throw new NotImplementedException();
    }

    public T Min => throw new NotImplementedException();

    public T Max => throw new NotImplementedException();
}

// Factory helper: MinMaxStack.Of(3, 1, 2) pushes 3, 1 and 2 in that order.
public static class MinMaxStack
{
    public static MinMaxStack<T> Of<T>(params T[] items) where T : IComparable<T>
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
using System.Diagnostics;
Test("tracks min and max of ints", () =>
{
    var s = new MinMaxStack<int>();
    Equal(s.Count, 0);
    s.Push(5);
    s.Push(1);
    s.Push(9);
    s.Push(3);
    Equal(s.Count, 4);
    Equal(s.Peek(), 3);
    Equal(s.Min, 1);
