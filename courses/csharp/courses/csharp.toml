intro = '''
By default an argument is copied into the method's stack frame, so the method works on its
own copy. A `ref` or `out` parameter instead passes a **reference to the caller's variable**:
the method reads and writes the original storage. `out` adds a promise checked by the compiler:
the method always assigns the variable before it returns.
'''
prompt = '''
Swap two variables through `ref`, compare a by-value parameter with a `ref` one, parse text with
`int.TryParse` and its `out` parameter, and return two results from one method with `out`.

**Why:** the `TryParse` pattern is the standard .NET way to handle input that may be invalid
without exceptions, and you will read `ref`/`out` in library code every day.
'''
target = '''
int a = 1, b = 2;
Swap(ref a, ref b);
Console.WriteLine($"a = {a}, b = {b}");

int score = 10;
AddBonus(score);
Console.WriteLine($"by value: {score}");
AddBonusRef(ref score);
Console.WriteLine($"by ref: {score}");

if (int.TryParse("123", out int parsed))
{
    Console.WriteLine($"parsed {parsed}");
}
bool ok = int.TryParse("12x", out int bad);
Console.WriteLine($"ok = {ok}, value = {bad}");

MinMax(7, 2, out int lo, out int hi);
Console.WriteLine($"min {lo}, max {hi}");

static void Swap(ref int x, ref int y)
{
    int temp = x;
    x = y;
    y = temp;
}

static void AddBonus(int value) => value += 5;

static void AddBonusRef(ref int value) => value += 5;

static void MinMax(int x, int y, out int min, out int max)
{
    min = x < y ? x : y;
    max = x < y ? y : x;
}
'''
