[[unit.step]]
kind = "challenge"
id = "cs-u09-x1-shopping-cart"
title = "A shopping cart that keeps its invariants"
points = 30
difficulty = 9
entry = "ShoppingCart"
intro = '''
A class earns its keep when it maintains **derived state**, like a running total, that would
otherwise have to be recomputed or could drift out of step. Updating the total inside the
only methods that change the lines makes reading it O(1), and checking every input before
touching anything means a refused call leaves the object exactly as it was.
'''
instructions = '''
## Your turn

Implement the class `ShoppingCart`:

```csharp
public const int MaxPerLine = 99;
public ShoppingCart(string owner)
public string Owner { get; }
public int ItemCount { get; }      // total units across all lines
public int LineCount { get; }      // number of distinct SKUs
public decimal Total { get; }      // sum of unitPrice × quantity
public void Add(string sku, decimal unitPrice, int quantity = 1)
public int QuantityOf(string sku)
public bool Remove(string sku, int quantity = 1)
```

Rules:

- The constructor throws `ArgumentException` if `owner` is empty or only whitespace. `Owner`
  is the name with surrounding spaces trimmed.
- `Add` throws `ArgumentException` for an empty or whitespace `sku`, and
  `ArgumentOutOfRangeException` if `unitPrice` is negative or `quantity` is less than 1.
- Adding a SKU that is already in the cart adds to its quantity. If the unit price differs
  from the one already in the cart, throw `InvalidOperationException`.
- A line may never hold more than `MaxPerLine` units. An `Add` that would exceed it throws
  `InvalidOperationException`. Watch out for `int` overflow when `quantity` is huge.
- `Remove` throws `ArgumentOutOfRangeException` if `quantity` is less than 1. It returns
  `false` if the SKU is not in the cart. Otherwise it removes up to `quantity` units (all of
  them if `quantity` is larger), deletes the line when it reaches 0, and returns `true`.
- `QuantityOf` returns 0 for a SKU that is not in the cart.
- A call that throws must leave the cart unchanged.
- `Owner`, `ItemCount`, `LineCount` and `Total` have no public setter, and the class has no
  public instance fields. Reading `Total` must not loop over the lines.

Example:

```csharp
var cart = new ShoppingCart("  Ada ");
cart.Add("pen", 1.50m, 2);
cart.Add("book", 12.00m);
cart.Add("pen", 1.50m, 3);
// Owner "Ada", QuantityOf("pen") 5, ItemCount 6, LineCount 2, Total 19.50
cart.Remove("pen", 10);   // true: the pen line is gone, Total 12.00
```

**Hint:** a private `Dictionary<string, (decimal Price, int Quantity)>` holds the lines.
Validate everything first, then update the dictionary, `ItemCount` and `Total` together.

Hidden tests decide correctness.
'''
