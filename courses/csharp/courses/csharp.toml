intro = '''
`Console.Write` writes text and stays on the same line, while `Console.WriteLine` adds a line
break after it. Some characters cannot be typed directly inside a string, so C# uses
**escape sequences** that start with a backslash: `\n` is a newline, `\t` a tab, `\"` a double
quote and `\\` a single backslash.
'''
