[unit.step.gabarito]
solution = '''
using System.Globalization;

// Money: formatting with defaults, parsing with out, updating with ref.
public static class Money
{
    // "12.50 EUR": the amount with `decimals` digits (invariant culture), a space, the currency.
    public static string Format(decimal amount, string currency = "EUR", int decimals = 2)
    {
        return amount.ToString("F" + decimals, CultureInfo.InvariantCulture) + " " + currency;
    }

    // Parse a non-negative amount (invariant culture). On failure return false and set amount to 0.
    public static bool TryParse(string? text, out decimal amount)
    {
        if (decimal.TryParse(text, NumberStyles.Number, CultureInfo.InvariantCulture, out amount) && amount >= 0)
        {
            return true;
        }
        amount = 0;
        return false;
    }

    // Add a positive amount to balance and return true; otherwise leave balance alone and return false.
    public static bool Deposit(ref decimal balance, decimal amount)
    {
        if (amount <= 0)
        {
            return false;
        }
        balance += amount;
        return true;
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the number of characters in the text being formatted or parsed. `Format` produces a
string of about `n` characters and joins it with the currency, and `TryParse` reads each
character of its input once, so both take **O(n)** time; the formatted string is the only
allocation, so the space is **O(n)**. In practice `n` is tiny (an amount has a few dozen
digits at most), so both behave like O(1). `Deposit` is a comparison and one addition on a
128-bit `decimal`: **O(1)** time and space.

The design choices matter more than the cost. `out decimal amount` is always assigned, as the
compiler demands, and resetting it to `0` on every failure path gives callers a predictable
value. `ref decimal balance` is written only on success, so a refused deposit leaves the
caller's variable exactly as it was. Passing `CultureInfo.InvariantCulture` explicitly keeps
`12.50` meaning twelve and a half on a computer set to Portuguese or German, where the comma is
the decimal separator.
'''

# ── g2-core ────────────────────────────────────────────────────────────

[[unit]]
id = "cs-u07-arrays-lists"
title = "Arrays and lists"
level = "intermediate"
difficulty = 7
intro = '''
Most programs work on many values at once, and C# gives you two everyday containers for an
ordered sequence: the fixed-size **array** and the growable **`List<T>`**. This unit shows how
both are laid out in memory, how to index, slice and iterate them, and which built-in helpers
sort, search and filter them. The challenge finds the best run of consecutive values with a
sliding window, in a single pass.
'''
concepts = '''
## The idea

An **array** is a block of slots that sit side by side in memory, each holding one value of
the same type. Because the slots are contiguous and equally sized, the address of element `i`
is simply *start + i × size*, so reading or writing any index costs O(1). The price is that an
array's length is fixed the moment you create it.

A **list** is a growable array. `List<T>` keeps a private array plus a `Count` of the slots in
use. When that array is full, `Add` allocates a new one twice as big and copies everything
across, so appending is **amortised O(1)**. Inserting or removing near the front still has to
shift every later element, which is O(n).

## How C# does it

```csharp
int[] scores = new int[3];               // { 0, 0, 0 }
int[] primes = { 2, 3, 5, 7 };
List<string> names = ["Ada", "Lin"];     // C# 12 collection expression
names.Add("Grace");
Console.WriteLine(primes.Length);        // 4
Console.WriteLine(names.Count);          // 3
Console.WriteLine(primes[^1]);           // 7: ^1 counts from the end
int[] middle = primes[1..3];             // { 3, 5 }: a new array
```

Arrays have `Length`; lists have `Count`. Both are indexed from `0` with `[]`, both work in
`foreach`, and both implement `IReadOnlyList<T>`, so a method that only reads can accept
either. Array helpers are **static methods** on the `Array` class (`Array.Sort`,
`Array.IndexOf`, `Array.Reverse`, `Array.Fill`), while a list carries **instance methods**
(`Sort`, `IndexOf`, `Contains`, `Insert`, `RemoveAt`, `FindAll`, `RemoveAll`).

Arrays and lists are **reference types**. `int[] b = a;` copies the reference, not the
elements, so `b[0] = 9` changes what `a` sees too. Make a real copy with `a.ToArray()`,
`new List<int>(list)` or `(int[])a.Clone()`.

## Pitfalls and compiler errors

- A bad index is a run-time error, not a compile-time one: `IndexOutOfRangeException` for an
  array, `ArgumentOutOfRangeException` for a list.
- `list.Length` or `array.Count` (without parentheses) is **CS1061**: the type does not contain
  a definition for that member.
- `new int[]` with neither a size nor an initializer is **CS1586**.
- `var xs = [1, 2];` is **CS9176**: a collection expression needs a target type, such as
  `int[] xs = [1, 2];`.
- Adding to or removing from a list inside a `foreach` over it throws
  `InvalidOperationException: Collection was modified`. Loop backwards with `for`, or use
  `RemoveAll`.
- `new string[3]` holds three `null`s, even though its type says `string`, so fill it before
  you read it.

## What you will practise

You will index, slice and sort an array, grow and shrink a list while watching its capacity
double, and use the predicate helpers `FindAll`, `Exists`, `RemoveAll` and `BinarySearch`. The
challenge computes the maximum sum of `k` consecutive values in O(n) time.
'''

[[unit.step]]
kind = "concept"
id = "cs-u07-c1-contiguous-memory"
title = "Contiguous memory and amortised growth"
points = 5
difficulty = 7
intro = '''
An array's elements are stored back to back, which is why indexing is O(1) and why its size
cannot change. A `List<T>` hides an array inside and replaces it with a bigger one when it
runs out of room, turning a fixed block into a sequence that grows.
'''
body = '''
## One block, fixed size

```csharp
int[] a = new int[4];   // four ints, side by side, all 0
a[2] = 42;              // jump straight to slot 2: O(1)
```

The runtime finds `a[2]` with one multiplication and one addition, no matter how long the
array is. Every access is also **bounds-checked**: `a[4]` throws `IndexOutOfRangeException`
instead of reading memory that does not belong to the array.

## Count and Capacity

```csharp
var list = new List<int>();
list.Add(1);            // Count 1, Capacity 4
list.Add(2);            // Count 2, Capacity 4
```

`Count` is how many elements you stored. `Capacity` is how many fit in the hidden array before
it must grow. When `Count` reaches `Capacity`, the next `Add` allocates an array twice as large,
copies the old elements and then appends. A copy costs O(n), but it happens so rarely (at 4,
8, 16, 32, …) that the elements copied during `n` appends add up to fewer than `2n`. The average cost per
append is therefore O(1), which is what **amortised O(1)** means.

## Which one to pick

Use an array when the size is known and fixed: the days of a week, a buffer, the result of a
calculation. Use `List<T>` when elements arrive one by one or get removed. If you know roughly
how many elements a list will hold, `new List<int>(capacity)` skips the intermediate copies.
Inserting or removing in the middle of a list is O(n), because every later element has to
move one slot.
'''

[[unit.step]]
