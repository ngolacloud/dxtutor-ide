[unit.step.gabarito]
solution = '''
public static class Seq
{
    public static IEnumerable<(T Value, int Count)> Runs<T>(this IEnumerable<T> source)
    {
        ArgumentNullException.ThrowIfNull(source);
        return Iterate(source);

        static IEnumerable<(T Value, int Count)> Iterate(IEnumerable<T> source)
        {
            var comparer = EqualityComparer<T>.Default;
            using IEnumerator<T> e = source.GetEnumerator();
            if (!e.MoveNext()) yield break;

            T current = e.Current;
            int count = 1;
            while (e.MoveNext())
            {
                if (comparer.Equals(e.Current, current))
                {
                    count++;
                    continue;
                }
                yield return (current, count);
                current = e.Current;
                count = 1;
            }
            yield return (current, count);
        }
    }

    public static IEnumerable<T[]> Windows<T>(this IEnumerable<T> source, int size)
    {
        ArgumentNullException.ThrowIfNull(source);
        ArgumentOutOfRangeException.ThrowIfLessThan(size, 1);
        return Iterate(source, size);

        static IEnumerable<T[]> Iterate(IEnumerable<T> source, int size)
        {
            var window = new Queue<T>(size);
            foreach (T item in source)
            {
                window.Enqueue(item);
                if (window.Count > size) window.Dequeue();
                if (window.Count == size) yield return window.ToArray();
            }
        }
    }
}
'''
time = 'O(n·k)'
space = 'O(k)'
justification = '''
Let `n` be the number of source elements and `k` the window size.

**`Runs`** reads each element exactly once and does constant work per element (one comparison
and either an increment or a yield), so it takes **O(n)** time. It keeps only the current value
and its count, so its extra space is **O(1)**, however long the source or the runs are.

**`Windows`** also reads each element once; enqueueing and dequeueing are O(1). The cost is in
the output: each of the `n - k + 1` windows is copied into a new array of `k` elements, which is
**O(n·k)** time in total. The queue never holds more than `k + 1` elements, so the working
space is **O(k)** (each yielded array is also O(k), and belongs to the caller). Copying is not
optional: yielding the same buffer every time would be O(n) but would break the rule that
earlier windows stay unchanged.

Laziness is what makes the early-stopping tests pass: `Take(2)` stops after two results, so
`Runs` reads 7 elements and `Windows` reads 4 out of a million. A version that called
`ToList()` on the source first would be O(n) space and would read all million elements before
yielding anything. Eager validation comes from the wrapper method, which runs at the call,
while the local iterator's body waits for the first `MoveNext`.
'''

[[unit]]
id = 'cs-u24-async-await'
title = 'Async and await'
level = 'advanced'
difficulty = 24
intro = '''
A `Task` is a promise of a result that may not exist yet, and `await` lets a method pause until
it does without blocking a thread. You will write async methods, run independent operations
concurrently with `Task.WhenAll`, race them with `Task.WhenAny`, follow exceptions through
awaited tasks, and finish with a concurrent fetcher whose tests decide exactly when each
operation completes.
'''
concepts = '''
## The idea

Many operations spend most of their time **waiting**: for a disk, a network reply, a database,
a timer. A thread that blocks while it waits does nothing useful, and threads are expensive:
each one reserves memory for its stack, and a server has only so many. **Asynchronous** code
starts the operation, gives the thread back so it can do other work, and resumes when the
result is ready.

.NET represents "an operation that finishes later" as a **`Task`** (no result) or a
**`Task<T>`** (a result of type `T`). A task ends in one of three states: completed with a
result, **faulted** with an exception, or canceled.

## How C# does it

Mark a method `async` and you can use `await` inside it:

```csharp
static async Task<int> LengthLaterAsync(string text)
{
    await Task.Delay(10);   // pause here; the thread is released
    return text.Length;     // becomes the task's result
}
```

The compiler turns the method into a state machine, like an iterator. Calling it runs
synchronously up to the first `await` of an unfinished task, then hands the caller an
incomplete `Task<int>`. When the awaited task finishes, the rest of the method runs as a
**continuation**, in a console app on a thread-pool thread. Top-level statements may use
`await` directly.

Awaiting one call after another runs them **in sequence**. Starting several tasks first and
awaiting them afterwards runs them **concurrently**:

```csharp
Task<int> a = LengthLaterAsync("one");
Task<int> b = LengthLaterAsync("three");
int[] both = await Task.WhenAll(a, b);   // [3, 5], in argument order
```

`Task.WhenAll` finishes when every task has finished. `Task.WhenAny` finishes with the **first
task** to finish; await that task again to get its value or its exception. `Task.Run` moves
CPU-bound work to the thread pool; for I/O, call the library's `...Async` method instead.

## Exceptions

An exception thrown inside an async method is stored in its task and rethrown by `await`, so an
ordinary `try`/`catch` works. When several tasks in a `WhenAll` fail, `await` rethrows the
**first**, and all of them remain in `task.Exception.InnerExceptions`. `.Result` and `.Wait()`
block the thread and wrap errors in an `AggregateException`: avoid them in async code.

## Pitfalls and compiler messages

- `await` in a method that is not `async` is error **CS4032** (**CS4033** if it returns `void`).
- An `async` method that never awaits runs synchronously: warning **CS1998**.
- Calling an async method without awaiting it is warning **CS4014**: the work runs unobserved
  and its exception is lost.
- `async void` is only for event handlers: nobody can await it, and its exceptions crash the
  process.
- `await` inside a `lock` block is error **CS1996**.

## What you will practise

You will follow the order in which an async method runs, fan out with `WhenAll` and race with
`WhenAny`, and catch failures from concurrent tasks. The challenge asks for a fetcher that starts
all its requests at once and a timeout helper, tested with tasks whose completion the tests control.
'''

[[unit.step]]
kind = 'concept'
id = 'cs-u24-c1-start-vs-await'
title = 'Starting a task versus awaiting it'
points = 5
difficulty = 24
intro = '''
Calling an async method starts the work; `await` is the point where the caller waits for its
result. Where you place each one decides whether independent operations overlap in time or run
one after another, which is the difference between the slowest one and the sum of all of them.
'''
body = '''
## Two timelines

Suppose `GetAsync` takes 100 ms because it waits for a server. Awaiting each call before
starting the next makes the waits add up:

```csharp
var a = await GetAsync("a");   // 0-100 ms
var b = await GetAsync("b");   // 100-200 ms
```

Starting both first and awaiting afterwards lets the waits overlap:

```csharp
Task<string> ta = GetAsync("a");   // starts at 0 ms
Task<string> tb = GetAsync("b");   // starts at 0 ms too
string[] both = await Task.WhenAll(ta, tb);   // done at about 100 ms
```

No extra threads were needed: while both requests wait, no thread is blocked at all.

## When sequential is right

Await in sequence when the second operation **needs** the first one's result, for example
reading a user and then their orders. Run concurrently only when the operations are
independent, and remember that "start everything" can overload a server when the list is long.

## What await really does

`await task` checks whether the task has finished. If it has, the method simply continues. If
not, the method registers the rest of its body as a continuation and **returns** to its caller.
The caller gets an incomplete task of its own and can carry on, which is why async code spreads
upwards: a method that awaits is usually awaited itself, all the way to `Main` or an event
handler.
'''

