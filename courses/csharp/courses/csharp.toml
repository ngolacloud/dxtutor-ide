[[unit.step]]
kind = "challenge"
id = "cs-u14-x1-observable"
title = "An observable value"
points = 30
difficulty = 14
entry = "Observable"
intro = '''
Reactive user interfaces and spreadsheets share one idea: a value that tells interested parties
when it changes, and other values derived from it that update themselves. Underneath it is
nothing more than an event, a few closures and a disposable object that undoes a subscription.
'''
instructions = '''
## Your turn

Write a generic class `Observable<T>`:

```csharp
public sealed class Observable<T>
{
    public Observable(T initial);
    public event Action<T, T>? Changed;          // (oldValue, newValue)
    public T Value { get; set; }
    public IDisposable Subscribe(Action<T, T> handler);
    public Observable<TResult> Map<TResult>(Func<T, TResult> selector);
}
```

Rules:

- `Value` starts as `initial`. Setting it to a value **equal** to the current one, according
  to `EqualityComparer<T>.Default`, does nothing at all.
- Otherwise the setter stores the new value first and then raises `Changed` with the old and
  the new value. Handlers run in subscription order, and inside a handler `Value` already
  returns the new value. With no subscribers nothing must crash.
- `Subscribe(handler)` adds `handler` to `Changed` and returns an `IDisposable`; calling its
  `Dispose()` removes that subscription. A second `Dispose()` on the same object does nothing.
  A `null` handler throws `ArgumentNullException`.
- `Map(selector)` returns a new observable whose value starts as `selector(Value)` and is set to
  `selector(newValue)` every time this observable changes. Because it is an observable itself,
  it raises its own `Changed` only when the **mapped** value actually changes. A `null` selector
  throws `ArgumentNullException`.

Example:

```csharp
var count = new Observable<int>(0);
var label = count.Map(n => n == 1 ? "1 item" : $"{n} items");
label.Changed += (old, now) => Console.WriteLine($"{old} -> {now}");
count.Value = 1;     // prints "0 items -> 1 item"
count.Value = 1;     // equal value: nothing happens
```

**Hint:** an event can be raised only inside its class, so `Subscribe` can simply do
`Changed += handler`. Return a small private class that implements `IDisposable` and stores the
action to run once, such as `() => Changed -= handler`.

Hidden tests decide correctness.
'''
starter = '''
