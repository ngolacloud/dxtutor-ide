intro = '''
`Interlocked` methods map to atomic CPU instructions, so updating a single variable needs no
lock. Compare-and-swap is the general primitive: write the new value only if the variable still
holds the value you read, and retry otherwise. `Parallel.For` spreads the iterations of a loop
