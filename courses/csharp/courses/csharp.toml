[[unit.step]]
kind = "challenge"
id = "cs-u32-x1-bst"
title = "A generic BST with deletion"
points = 40
difficulty = 32
entry = "Bst"
intro = '''
Deletion is where binary search trees get interesting. A leaf just disappears, a node with
one child is replaced by that child, and a node with two children borrows the key of its
in-order successor. Getting all three cases right, including at the root, while keeping the
count in step, is the real test of tree manipulation.
'''
instructions = '''
## Your turn

Complete the class `Bst<T>`, an unbalanced binary search tree of unique keys:

```csharp
public sealed class Bst<T> where T : IComparable<T>
{
    public int Count { get; }
    public bool Add(T key);              // false if the key is already present
    public bool Contains(T key);
    public bool Remove(T key);           // false if the key is absent
    public T Min();                      // InvalidOperationException when empty
    public T Max();                      // InvalidOperationException when empty
    public int Height();                 // nodes on the longest root-to-leaf path; 0 when empty
    public IEnumerable<T> InOrder();     // ascending order
}
```

Compare keys only with `CompareTo` and test the sign of the result. `Remove` has three
cases for the node that holds the key:

1. **No children**: unlink it from its parent.
2. **One child**: the child takes its place.
3. **Two children**: copy the key of its in-order successor (the smallest key in its right
   subtree) into it, then unlink the successor, which has no left child.

All three must also work when the node is the root. After every operation the tree must
satisfy the BST property and `Count` must equal the number of keys.

Examples, on the tree built by adding `50, 30, 70, 20, 40, 60, 80`:

- `Height()` is 3 and `InOrder()` yields `20 30 40 50 60 70 80`.
- `Remove(20)` removes a leaf; `Remove(50)` removes the root, and 60 takes its place.
- `Remove(99)` returns `false` and changes nothing; `Add(40)` returns `false`.

The hidden tests add 200,000 random keys and remove half of them, and they also build a
degenerate chain of 5,000 sorted keys. Loops (with an explicit `Stack<T>` for the traversal)
are the safest choice; deep recursion can overflow the stack.

Hidden tests decide correctness.
'''
starter = '''
// An unbalanced binary search tree of unique keys.
// Compare keys with CompareTo; Remove handles the leaf, one-child and two-children cases.
public sealed class Bst<T> where T : IComparable<T>
{
    public int Count => throw new NotImplementedException();

    // Returns false if the key is already present.
    public bool Add(T key) => throw new NotImplementedException();

    public bool Contains(T key) => throw new NotImplementedException();

    // Returns false if the key is absent.
    public bool Remove(T key) => throw new NotImplementedException();

    // Both throw InvalidOperationException when the tree is empty.
    public T Min() => throw new NotImplementedException();

    public T Max() => throw new NotImplementedException();

    // The number of nodes on the longest root-to-leaf path (0 for an empty tree).
    public int Height() => throw new NotImplementedException();

    // The keys in ascending order.
    public IEnumerable<T> InOrder() => throw new NotImplementedException();
}
'''
tests = '''
Bst<int> Sample()
{
    var t = new Bst<int>();
    foreach (var k in new[] { 50, 30, 70, 20, 40, 60, 80 }) t.Add(k);
    return t;
}
async Task<bool> FinishesWithin(double seconds, Action work)
{
    var task = Task.Run(work);
    if (await Task.WhenAny(task, Task.Delay(TimeSpan.FromSeconds(seconds))) != task) return false;
    await task;
    return true;
}

Test("an empty tree", () =>
{
    var t = new Bst<int>();
    Equal(t.Count, 0);
    Equal(t.Height(), 0);
    Equal(t.InOrder().ToList(), new List<int>());
    Check(!t.Contains(1), "an empty tree contains nothing");
    Check(!t.Remove(1), "Remove on an empty tree returns false");
    Throws<InvalidOperationException>(() => t.Min());
    Throws<InvalidOperationException>(() => t.Max());
});
Test("add, contains, in-order, min, max, height", () =>
{
    var t = Sample();
    Equal(t.Count, 7);
    Equal(t.InOrder().ToList(), new List<int> { 20, 30, 40, 50, 60, 70, 80 });
    Equal(t.Height(), 3);
    Equal(t.Min(), 20);
    Equal(t.Max(), 80);
    Check(t.Contains(60) && !t.Contains(65), "Contains(60) is true, Contains(65) is false");
});
Test("duplicates are rejected", () =>
{
    var t = Sample();
    Check(!t.Add(40), "Add(40) should return false");
    Check(t.Add(45), "Add(45) should return true");
    Equal(t.Count, 8);
    Equal(t.InOrder().ToList(), new List<int> { 20, 30, 40, 45, 50, 60, 70, 80 });
});
Test("remove a leaf and a one-child node", () =>
{
    var t = Sample();
    Check(t.Remove(20), "Remove(20) should return true");
    Equal(t.InOrder().ToList(), new List<int> { 30, 40, 50, 60, 70, 80 });
    Check(t.Remove(30), "Remove(30), now with one child, should return true");
    Equal(t.InOrder().ToList(), new List<int> { 40, 50, 60, 70, 80 });
    Equal(t.Count, 5);
    Equal(t.Height(), 3);
    Equal(t.Min(), 40);
});
Test("remove nodes with two children, including the root", () =>
{
    var t = Sample();
    Check(t.Remove(70), "Remove(70) should return true");
    Equal(t.InOrder().ToList(), new List<int> { 20, 30, 40, 50, 60, 80 });
    Check(t.Remove(50), "Remove(50), the root, should return true");
    Equal(t.InOrder().ToList(), new List<int> { 20, 30, 40, 60, 80 });
    Equal(t.Height(), 3);
    Check(!t.Contains(50) && t.Contains(60), "50 is gone, 60 is still there");
    Equal(t.Count, 5);
});
Test("remove a missing key changes nothing", () =>
{
    var t = Sample();
    Check(!t.Remove(99) && !t.Remove(55), "missing keys return false");
    Equal(t.Count, 7);
    Equal(t.InOrder().ToList(), new List<int> { 20, 30, 40, 50, 60, 70, 80 });
});
Test("remove everything, then reuse the tree", () =>
{
    var t = Sample();
    foreach (var k in new[] { 50, 20, 80, 30, 70, 40, 60 }) Check(t.Remove(k), $"Remove({k}) should return true");
    Equal(t.Count, 0);
    Equal(t.Height(), 0);
    Throws<InvalidOperationException>(() => t.Min());
    t.Add(-5);
    t.Add(-10);
    Equal(t.InOrder().ToList(), new List<int> { -10, -5 });
    Equal(t.Max(), -5);
});
Test("works for any IComparable<T>", () =>
{
    var t = new Bst<string>();
    foreach (var w in new[] { "pear", "apple", "fig", "banana", "cherry" }) t.Add(w);
    Equal(t.InOrder().ToList(), new List<string> { "apple", "banana", "cherry", "fig", "pear" });
    Check(t.Remove("apple"), "Remove(\"apple\") should return true");
    Equal(t.Min(), "banana");
    var dates = new Bst<DateOnly>();
    dates.Add(new DateOnly(2024, 5, 1));
    dates.Add(new DateOnly(2023, 1, 9));
    Equal(dates.Min(), new DateOnly(2023, 1, 9));
});
Test("matches SortedSet on random operations", () =>
{
    var rng = new Random(32);
    var t = new Bst<int>();
    var reference = new SortedSet<int>();
    for (var step = 0; step < 4000; step++)
    {
        var key = rng.Next(0, 300);
        if (rng.Next(3) == 0) Equal(t.Remove(key), reference.Remove(key));
        else Equal(t.Add(key), reference.Add(key));
    }
    Equal(t.Count, reference.Count);
    Equal(t.InOrder().ToList(), reference.ToList());
    Equal(t.Min(), reference.Min);
    Equal(t.Max(), reference.Max);
});
Test("a degenerate chain of sorted keys", () =>
{
    var t = new Bst<int>();
    for (var i = 0; i < 5000; i++) t.Add(i);
    Equal(t.Height(), 5000);
    Equal(t.Max(), 4999);
    Check(t.Remove(0) && t.Remove(4999), "removing both ends of the chain should succeed");
    Equal(t.InOrder().Count(), 4998);
    Equal(t.Height(), 4998);
});
Test("200,000 random keys in O(n log n)", async () =>
{
    var rng = new Random(2024);
    var keys = Enumerable.Range(0, 200_000).Select(i => i * 3).ToArray();
    rng.Shuffle(keys);
    var t = new Bst<int>();
    var done = await FinishesWithin(10, () =>
    {
        foreach (var k in keys) t.Add(k);
        for (var i = 0; i < keys.Length; i += 2) t.Remove(keys[i]);
    });
    Check(done, "200,000 adds and 100,000 removals on a random tree should take well under a second");
    if (!done) return;
    Equal(t.Count, 100_000);
    var expected = keys.Where((_, i) => i % 2 == 1).Order().ToList();
    Equal(t.InOrder().ToList(), expected);
    Check(t.Height() < 60, $"a random BST should stay shallow, but its height is {t.Height()}");
    Check(t.Contains(keys[1]) && !t.Contains(keys[0]) && !t.Contains(1), "membership after removals");
});
'''

[unit.step.gabarito]
solution = '''
// An unbalanced binary search tree of unique keys.
public sealed class Bst<T> where T : IComparable<T>
{
    private sealed class Node(T key)
    {
        public T Key = key;
        public Node? Left, Right;
    }

    private Node? _root;

    public int Count { get; private set; }

    public bool Add(T key)
    {
        if (_root is null)
        {
            _root = new Node(key);
            Count = 1;
            return true;
        }
        var node = _root;
        while (true)
        {
            var cmp = key.CompareTo(node.Key);
            if (cmp == 0) return false;
            ref var child = ref (cmp < 0 ? ref node.Left : ref node.Right);
            if (child is null)
            {
                child = new Node(key);
                Count++;
                return true;
            }
            node = child;
        }
    }

    public bool Contains(T key)
    {
        var node = _root;
        while (node is not null)
        {
            var cmp = key.CompareTo(node.Key);
            if (cmp == 0) return true;
            node = cmp < 0 ? node.Left : node.Right;
        }
        return false;
    }

    public bool Remove(T key)
    {
        Node? parent = null;
        var node = _root;
        while (node is not null)
        {
            var cmp = key.CompareTo(node.Key);
            if (cmp == 0) break;
            parent = node;
            node = cmp < 0 ? node.Left : node.Right;
        }
        if (node is null) return false;

        if (node.Left is not null && node.Right is not null)
        {
            // Two children: borrow the in-order successor's key, then unlink the successor.
            var successorParent = node;
            var successor = node.Right;
            while (successor.Left is not null)
            {
                successorParent = successor;
                successor = successor.Left;
            }
            node.Key = successor.Key;
            parent = successorParent;
            node = successor;
        }

        // Now `node` has at most one child, which takes its place.
        var replacement = node.Left ?? node.Right;
        if (parent is null) _root = replacement;
        else if (ReferenceEquals(parent.Left, node)) parent.Left = replacement;
        else parent.Right = replacement;
        Count--;
        return true;
    }

    public T Min()
    {
        var node = _root ?? throw new InvalidOperationException("The tree is empty.");
        while (node.Left is not null) node = node.Left;
        return node.Key;
    }

    public T Max()
    {
        var node = _root ?? throw new InvalidOperationException("The tree is empty.");
        while (node.Right is not null) node = node.Right;
        return node.Key;
    }

    public int Height()
    {
        // Breadth-first, one level at a time: no recursion, so a chain can't overflow the stack.
        if (_root is null) return 0;
        var height = 0;
        var level = new Queue<Node>();
        level.Enqueue(_root);
        while (level.Count > 0)
        {
            height++;
            for (var i = level.Count; i > 0; i--)
            {
                var node = level.Dequeue();
                if (node.Left is not null) level.Enqueue(node.Left);
                if (node.Right is not null) level.Enqueue(node.Right);
            }
        }
        return height;
    }

    public IEnumerable<T> InOrder()
    {
        var stack = new Stack<Node>();
        var node = _root;
        while (node is not null || stack.Count > 0)
        {
            for (; node is not null; node = node.Left) stack.Push(node);   // go as far left as possible
            var next = stack.Pop();
            yield return next.Key;
            node = next.Right;
        }
    }
}
'''
time = "O(h) per Add/Contains/Remove/Min/Max (O(log n) on random input, O(n) worst case); O(n) for Height and InOrder"
space = "O(n) for the nodes; O(h) extra for the traversal stack"
justification = '''
`Add`, `Contains`, `Min` and `Max` each walk one downward path from the root, doing constant
work per level, so they cost **O(h)**. `Remove` first walks down to the node holding the key;
in the two-children case it continues down the right subtree to the successor, which has no
left child and is therefore unlinked by the cheap one-child splice. Both walks lie on one
downward path, so `Remove` is **O(h)** too. Copying the successor's key into the node keeps
the BST property, because the successor is larger than everything on the left and smaller
than everything else on the right.

The height h is the whole story. On the random input of the large test h stays around
2·log₂ n ≈ 40, so 300,000 operations cost a few million comparisons and finish in a fraction
of a second. On the sorted input of the degenerate test h = n, and each operation becomes a
linear scan: 5,000 sorted adds cost about 12.5 million comparisons, which is why balanced
trees (`SortedSet<T>`) exist.

`Height` visits every node once in a breadth-first sweep, **O(n)** time, and `InOrder` pushes
and pops each node once, **O(n)** for a full traversal, with a stack that never holds more
than h nodes. All methods use loops, so the 5,000-deep chain needs no call stack at all;
recursive versions would be just as fast but would risk an uncatchable stack overflow on
deeper chains. The nodes take **O(n)** space; the operations themselves need O(1) extra,
except the traversal's O(h) stack and the breadth-first queue, which holds one level.
'''

[[unit]]
id = "cs-u33-sorting-searching"
title = "Sorting and searching by hand"
level = "advanced"
difficulty = 33
intro = '''
`Array.Sort` and `Array.BinarySearch` are one call away, but the ideas inside them, divide
and conquer and halving a search range, are the core of algorithm design. You will write
insertion sort, merge two sorted arrays, implement a lower-bound binary search without
off-by-one errors, and finish with a generic merge sort that counts inversions on 200,000
items.
'''
concepts = '''
## The idea

**Sorting** puts items in order according to a comparison. Simple algorithms such as **insertion sort** grow a sorted prefix one item at a time. They are O(n²) in the worst case, yet very fast on small or nearly sorted input, which is why real sorts use them for short runs.

**Merge sort** is the classic **divide and conquer** algorithm:

1. **Divide** the array into two halves.
2. **Conquer**: sort each half recursively. An array of length 0 or 1 is already sorted.
3. **Combine**: **merge** the two sorted halves by repeatedly taking the smaller front item.

The recursion is about log₂ n levels deep and each level merges n items in total, so merge sort is **O(n log n)** in every case. It needs O(n) extra memory, and it is **stable**: equal items keep their original order. No comparison sort can beat O(n log n) in the worst case.

**Binary search** finds a value in a **sorted** array by comparing with the middle item and discarding the half that cannot contain it. Each step halves the range, so it takes **O(log n)**: about 20 comparisons for a million items, where a linear scan needs up to a million.

## How C# does it

`Array.Sort` and `List<T>.Sort` use **introsort** (quicksort that falls back to heapsort, with insertion sort for small ranges). It is fast and in place, but **not stable**. LINQ's `OrderBy` is stable. Order comes from `IComparable<T>` or from an `IComparer<T>` you pass:

```csharp
var byLength = Comparer<string>.Create((a, b) => a.Length.CompareTo(b.Length));
Array.Sort(words, byLength);
```

`Comparer<T>.Default` uses `IComparable<T>`, so generic code can write `comparer ??= Comparer<T>.Default;` and accept both. `Array.BinarySearch` returns the index of a match, or the **bitwise complement** (`~index`) of the insertion point when the value is missing, so a negative result is not just "not found".

## What is special or tricky

- **Midpoint overflow.** `(lo + hi) / 2` overflows when `lo + hi > int.MaxValue`. Write `lo + (hi - lo) / 2`.
- **Subtraction comparers overflow too.** `(a, b) => a - b` gives the wrong sign for `int.MinValue` and 1. Use `a.CompareTo(b)`.
- **Off-by-one errors** in binary search come from mixing conventions. Pick one, such as the half-open range `[lo, hi)`, and keep its invariant on every line.
- **Counts can outgrow `int`.** A reversed array of 100,000 items has about 5·10⁹ out-of-order pairs, more than `int.MaxValue` (2,147,483,647). Silent wrap-around is the default, so use `long`.
- **Slicing copies.** `items[..mid]` on an array allocates a new array. Passing index ranges and reusing one buffer avoids O(n log n) allocations.
- **Recursion depth** is no problem for merge sort: about 18 levels for 200,000 items.

## What you will practise

You will trace insertion sort, merge two sorted arrays, and write a lower-bound binary search. The challenge asks for a generic, stable merge sort that also counts **inversions**, the pairs that are out of order, which measure how far an array is from sorted.
'''

[[unit.step]]
kind = "concept"
id = "cs-u33-c1-divide-conquer"
title = "Divide, conquer, merge"
points = 5
difficulty = 33
intro = '''
Divide and conquer splits a problem into smaller copies of itself, solves them, and combines
the answers. Merge sort and binary search are the two textbook examples, one splitting work
and one discarding it.
'''
body = '''
## Merge sort in three lines

```csharp
static int[] MergeSort(int[] items) =>
    items.Length <= 1 ? items
                      : Merge(MergeSort(items[..(items.Length / 2)]), MergeSort(items[(items.Length / 2)..]));
```

All the work happens in `Merge`, which walks two sorted arrays with one index each and
always takes the smaller front item. Taking the **left** item on ties (`<=`) keeps the sort
**stable**.

## Why O(n log n)

Halving an array of n items reaches length 1 after about log₂ n levels. At every level the
merges touch each item once, so each level costs O(n), and the total is O(n log n). For
200,000 items that is about 3.5 million steps, while an O(n²) sort needs about 20 billion.

## Binary search

On a sorted array, compare the target with the middle item. If the middle item is too small,
the answer lies to its right; otherwise it lies at the middle or to its left. Each comparison
halves the range, so a million items need about 20 steps.

```csharp
int lo = 0, hi = items.Length;           // invariant: the answer is in [lo, hi]
while (lo < hi)
{
    var mid = lo + (hi - lo) / 2;        // never overflows
    if (items[mid] < target) lo = mid + 1; else hi = mid;
}
```

This **lower bound** returns the first index whose item is not less than the target: the
position of the first match, or where the target would be inserted. Writing the invariant
down is what keeps binary search free of off-by-one errors.
'''

[[unit.step]]
kind = "drill"
