prompt = '''
Write a `Thermostat` whose target temperature is clamped to a safe range by its setter, whose
room name is `required` and `init`-only, and which counts changes through a `private set`
property.

**Why:** the property setter is the one place that can see every change, so it is where an
invariant such as "the target is between 10 and 30" belongs.
'''
target = '''
var t = new Thermostat { Room = "Kitchen", Target = 21 };
Console.WriteLine($"{t.Room}: {t.Target}");
t.Target = 5;
Console.WriteLine($"clamped to {t.Target}");
t.Raise();
t.Raise();
Console.WriteLine($"after raises: {t.Target}, changes {t.Changes}");
// t.Room = "Hall";   // error CS8852: Room is init-only

class Thermostat
{
    public const int Min = 10;
    public const int Max = 30;
    private int _target = 18;

    public required string Room { get; init; }
    public int Changes { get; private set; }

    public int Target
    {
        get => _target;
        set
        {
            _target = Math.Clamp(value, Min, Max);
            Changes++;
        }
    }

    public void Raise() => Target += 1;
}
'''
