'''
prompt = '''
Implement `LowerBound` on a sorted array with duplicates, try it on present, missing,
too-small and too-large targets, and decode `Array.BinarySearch`'s negative result.

**Why:** "first position not less than the target" answers both "is it there?" and "where
would it go?", and a written invariant is the cure for off-by-one bugs.
'''
target = '''
using System.Globalization;

CultureInfo.CurrentCulture = CultureInfo.InvariantCulture;
int[] sorted = [2, 3, 3, 3, 7, 11, 13];
foreach (var target in new[] { 3, 8, 1, 20 })
    Console.WriteLine($"LowerBound({target}) = {LowerBound(sorted, target)}");
var raw = Array.BinarySearch(sorted, 8);
Console.WriteLine($"Array.BinarySearch(8) = {raw}, insert at {~raw}");

static int LowerBound(int[] items, int target)
{
    int lo = 0, hi = items.Length;
    while (lo < hi)
    {
        var mid = lo + (hi - lo) / 2;
        if (items[mid] < target) lo = mid + 1;
        else hi = mid;
    }
    return lo;
}
'''
