[[unit.step]]
kind = "drill"
id = "cs-u10-d2-abstract"
title = "An abstract class with a template method"
points = 10
difficulty = 10
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
The **template method** pattern puts the fixed outline of an algorithm in a non-virtual method
of an abstract base class and leaves the variable steps to abstract or virtual methods. The
base class controls the order of the steps; each subclass supplies only what differs.
'''
prompt = '''
Write an abstract `Exporter` whose `Export` method outputs a header, one formatted line per
row and a footer, then two subclasses: a plain numbered list and an HTML list.

**Why:** the template method is how frameworks let you plug in behaviour without copying their
logic, and it shows the difference between `abstract` (must override) and `virtual` (may
override).
'''
target = '''
string[] rows = ["alpha", "beta"];
Exporter[] exporters = [new PlainExporter(), new HtmlExporter()];
foreach (Exporter e in exporters)
{
    Console.WriteLine(e.Export(rows));
}

abstract class Exporter
{
    public string Export(IEnumerable<string> rows)
    {
        var lines = new List<string> { Header() };
        int n = 1;
        foreach (string row in rows)
        {
            lines.Add(FormatRow(n++, row));
        }
        lines.Add(Footer());
        return string.Join("\n", lines.Where(line => line.Length > 0));
    }

    protected virtual string Header() => "";
    protected virtual string Footer() => "";
    protected abstract string FormatRow(int number, string row);
}

class PlainExporter : Exporter
{
    protected override string FormatRow(int number, string row) => $"{number}. {row}";
}

sealed class HtmlExporter : Exporter
{
    protected override string Header() => "<ol>";
    protected override string Footer() => "</ol>";
    protected override string FormatRow(int number, string row) => $"  <li>{row}</li>";
}
'''
