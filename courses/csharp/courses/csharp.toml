title = "Insertion sort"
points = 10
difficulty = 33
placeholder_policy = "on_demand"
run_command = "dotnet run"
intro = '''
Insertion sort keeps a sorted prefix and inserts the next item into it by shifting larger
items one place right. It is O(n²) on reversed input but O(n) on sorted input, which makes it
the algorithm of choice for small or nearly sorted arrays.
'''
prompt = '''
Write a generic in-place insertion sort and print the array after each pass.

**Why:** the trace shows the sorted prefix growing by one item per pass, and the shifting
loop is the cost that makes the algorithm quadratic.
'''
target = '''
int[] data = [5, 2, 4, 6, 1, 3];
InsertionSort(data);
Console.WriteLine($"sorted: {string.Join(" ", data)}");

static void InsertionSort<T>(T[] items) where T : IComparable<T>
{
    for (var i = 1; i < items.Length; i++)
    {
        var current = items[i];
        var j = i - 1;
        while (j >= 0 && items[j].CompareTo(current) > 0)
        {
            items[j + 1] = items[j];
            j--;
        }
        items[j + 1] = current;
        Console.WriteLine($"pass {i}: {string.Join(" ", items)}");
    }
}
'''
line_comments = [
  "The unsorted input.",
  "Sorts in place and prints each pass.",
  "Prints `sorted: 1 2 3 4 5 6`.",
  "",
  "Works for any comparable type.",
  "",
  "`items[..i]` is already sorted; insert `items[i]` into it.",
  "",
  "Saves the item, because shifting will overwrite its slot.",
  "Starts comparing with the last item of the sorted prefix.",
  "While the prefix item is larger...",
  "",
  "...shift it one place right...",
  "...and look further left.",
  "",
  "Drops the saved item into the gap.",
  "Shows the array after this pass.",
  "",
  "",
]
explanation = '''
Each pass takes the first unsorted item and shifts the larger items of the prefix right until
its place appears. Pass 1 moves 2 before 5 (`2 5 4 6 1 3`), pass 2 moves 4 between them
(`2 4 5 6 1 3`), pass 3 leaves 6 where it is, pass 4 shifts four items to bring 1 to the front
(`1 2 4 5 6 3`), and pass 5 inserts 3 (`1 2 3 4 5 6`). The program ends with
`sorted: 1 2 3 4 5 6`. The strict `> 0` never moves an item past an equal one, so the sort is
stable.
'''

[[unit.step]]
kind = "drill"
