[[unit.step]]
kind = 'challenge'
id = 'cs-u24-x1-fetcher'
title = 'A concurrent fetcher with a timeout'
points = 40
difficulty = 24
entry = 'Fetcher'
intro = '''
Fan-out and timeouts are the two everyday patterns of async I/O: issue independent requests
together so their latencies overlap, and never wait longer than a deadline. Both are built from
`Task.WhenAll` and `Task.WhenAny`. Because the tests hand you tasks they complete themselves,
they can tell whether your requests really overlap.
'''
instructions = '''
## Your turn

Implement the two methods of the static class `Fetcher`:

```csharp
public static Task<Dictionary<string, int>> FetchAllAsync(IEnumerable<string> keys, Func<string, Task<int>> fetch);
public static Task<T> WithTimeoutAsync<T>(Task<T> task, TimeSpan timeout, T fallback);
```

**`FetchAllAsync`** calls `fetch` for every key and returns a dictionary from key to value.

- Start **all** fetches before awaiting any of them. The tests use fetches that finish only
  when the test says so, and they check that every fetch has started before completing any.
- Fetch each **distinct** key only once, even if it appears several times in `keys`.
- No keys: return an empty dictionary without calling `fetch`.
- If a fetch fails, its exception must reach the caller of `await FetchAllAsync(...)` with its
  original type (not wrapped in an `AggregateException`).

**`WithTimeoutAsync`** waits for `task`, but for at most `timeout`.

- If `task` finishes first, return its result. If it failed, let its exception escape.
- If the timeout comes first, return `fallback`, without waiting for `task`.
- If `task` is fast, return as soon as it finishes; don't wait out the whole timeout.

Examples:

- `FetchAllAsync(["a", "bb", "a"], k => Task.FromResult(k.Length))` gives `{ a: 1, bb: 2 }`
  and calls `fetch` twice.
- `WithTimeoutAsync(Task.FromResult(42), TimeSpan.FromSeconds(5), -1)` gives 42 at once.
- `WithTimeoutAsync(neverFinishes, TimeSpan.FromMilliseconds(10), -1)` gives -1 after 10 ms.

**Hint:** collect the tasks into an array first, then `await Task.WhenAll(tasks)`. For the
timeout, race `task` against `Task.Delay(timeout)` with `Task.WhenAny`, and compare the winner
with `task`.

Hidden tests decide correctness.
'''
starter = '''
public static class Fetcher
{
    // Fetch every DISTINCT key concurrently (start them all before awaiting any)
    // and return key -> value. A failed fetch's exception must reach the caller.
    public static Task<Dictionary<string, int>> FetchAllAsync(IEnumerable<string> keys, Func<string, Task<int>> fetch)
    {
        throw new NotImplementedException();
    }

    // Wait for `task` for at most `timeout`; on timeout return `fallback`.
    // If `task` finishes first, return its result (or let its exception escape).
    public static Task<T> WithTimeoutAsync<T>(Task<T> task, TimeSpan timeout, T fallback)
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
using System.Diagnostics;

Test("fetches every key", async () =>
{
    var result = await Fetcher.FetchAllAsync(["a", "bb", "ccc"], async k => { await Task.Delay(5); return k.Length; });
    Equal(result, new Dictionary<string, int> { ["a"] = 1, ["bb"] = 2, ["ccc"] = 3 });
});

Test("no keys gives an empty dictionary without fetching", async () =>
{
    int calls = 0;
    var result = await Fetcher.FetchAllAsync(Array.Empty<string>(), k => { calls++; return Task.FromResult(0); });
    Equal(result, new Dictionary<string, int>());
    Equal(calls, 0);
});

Test("starts every fetch before any completes", async () =>
{
    var gate = new object();
    var pending = new Dictionary<string, TaskCompletionSource<int>>();
    Task<int> Fetch(string key)
    {
        var tcs = new TaskCompletionSource<int>(TaskCreationOptions.RunContinuationsAsynchronously);
        lock (gate) pending[key] = tcs;
        return tcs.Task;
    }
    int Started() { lock (gate) return pending.Count; }

    Task<Dictionary<string, int>> call = Fetcher.FetchAllAsync(["x", "y", "z"], Fetch);
    for (int i = 0; i < 200 && Started() < 3; i++) await Task.Delay(5);
    Equal(Started(), 3);
    Check(!call.IsCompleted, "the result must wait for the fetches");
    if (Started() < 3) return;

    pending["z"].SetResult(30);
    pending["x"].SetResult(10);
    pending["y"].SetResult(20);
    Equal(await call, new Dictionary<string, int> { ["x"] = 10, ["y"] = 20, ["z"] = 30 });
});

Test("fetches duplicate keys once", async () =>
{
    var calls = new List<string>();
    var result = await Fetcher.FetchAllAsync(["a", "b", "a", "a", "b"], k =>
    {
        lock (calls) calls.Add(k);
        return Task.FromResult(k == "a" ? 1 : 2);
    });
    Equal(result, new Dictionary<string, int> { ["a"] = 1, ["b"] = 2 });
    Equal(calls.OrderBy(k => k, StringComparer.Ordinal).ToList(), new List<string> { "a", "b" });
});

Test("a failing fetch surfaces its own exception", async () =>
{
    try
    {
        await Fetcher.FetchAllAsync(["ok", "bad", "fine"], async k =>
        {
            await Task.Delay(5);
            if (k == "bad") throw new InvalidOperationException("bad key");
            return 1;
        });
        Check(false, "expected an InvalidOperationException");
    }
    catch (InvalidOperationException e)
    {
        Equal(e.Message, "bad key");
    }
});

Test("many keys", async () =>
{
    var keys = Enumerable.Range(0, 1000).Select(i => $"k{i}").ToList();
    var result = await Fetcher.FetchAllAsync(keys, async k => { await Task.Yield(); return int.Parse(k[1..]); });
    Equal(result.Count, 1000);
    Equal(result["k0"], 0);
    Equal(result["k999"], 999);
});

Test("WithTimeoutAsync returns a fast result at once", async () =>
{
    var watch = Stopwatch.StartNew();
    Equal(await Fetcher.WithTimeoutAsync(Task.FromResult(42), TimeSpan.FromSeconds(3), -1), 42);
    Check(watch.Elapsed < TimeSpan.FromSeconds(1), "a finished task must not wait for the timeout");
    async Task<string> Later() { await Task.Delay(5); return "done"; }
    Equal(await Fetcher.WithTimeoutAsync(Later(), TimeSpan.FromSeconds(3), "fallback"), "done");
});

Test("WithTimeoutAsync returns the fallback on timeout", async () =>
{
    var never = new TaskCompletionSource<int>().Task;
    Equal(await Fetcher.WithTimeoutAsync(never, TimeSpan.FromMilliseconds(10), -1), -1);
    var neverText = new TaskCompletionSource<string?>().Task;
    Equal(await Fetcher.WithTimeoutAsync(neverText, TimeSpan.FromMilliseconds(10), null), null);
});

Test("WithTimeoutAsync lets the task's exception escape", async () =>
{
    try
    {
        await Fetcher.WithTimeoutAsync(Task.FromException<int>(new FormatException("boom")), TimeSpan.FromSeconds(3), 0);
        Check(false, "expected a FormatException");
    }
    catch (FormatException e)
    {
        Equal(e.Message, "boom");
    }
});
'''

[unit.step.gabarito]
solution = '''
public static class Fetcher
{
    public static async Task<Dictionary<string, int>> FetchAllAsync(IEnumerable<string> keys, Func<string, Task<int>> fetch)
    {
        string[] distinct = keys.Distinct().ToArray();
        Task<int>[] tasks = distinct.Select(fetch).ToArray();   // every fetch starts here
        int[] values = await Task.WhenAll(tasks);              // rethrows the first failure
        return distinct.Zip(values).ToDictionary(pair => pair.First, pair => pair.Second);
    }

    public static async Task<T> WithTimeoutAsync<T>(Task<T> task, TimeSpan timeout, T fallback)
    {
        Task first = await Task.WhenAny(task, Task.Delay(timeout));
        return first == task ? await task : fallback;
    }
}
'''
time = 'O(n)'
space = 'O(n)'
justification = '''
Let `n` be the number of keys. **`FetchAllAsync`** makes one pass to remove duplicates (a hash
set inside `Distinct`, O(1) expected per key), starts one fetch per distinct key, and builds the
dictionary in one more pass: **O(n)** work and **O(n)** space for the array of keys, the array
of tasks, the results and the dictionary.

The more interesting cost is wall-clock time. Because every fetch starts before the first
`await`, the latencies overlap, and the total wait is about the **slowest** fetch, not the
**sum** of all of them as it would be with `await fetch(k)` inside a loop. `Task.WhenAll`
returns the values in the order of the tasks, so zipping them with `distinct` pairs each key with
its own value even though the fetches finished in a different order. When a fetch fails,
`await` rethrows its original exception.

**`WithTimeoutAsync`** is **O(1)**: it creates one delay task and one `WhenAny` task. It returns
as soon as either finishes, so a fast task never waits for the timeout. Comparing the winner with
`task` (by reference) decides the outcome, and `await task` either unwraps the value or rethrows
the task's exception. On timeout the original task keeps running; stopping it needs a
`CancellationToken`, the subject of unit 26.
'''

[[unit]]
id = 'cs-u25-concurrency'
title = 'Threads, locks and concurrent collections'
level = 'advanced'
difficulty = 25
intro = '''
When several threads touch the same memory, an operation that looks like a single step in the
source, such as `count++`, can interleave with another thread's and lose updates. You will
protect shared state with `lock`, use `Interlocked` for single-variable updates, count in
parallel with `ConcurrentDictionary` and `Parallel.For`, and finish with a thread-safe inventory
that hidden tests hammer from many threads at once.
'''
concepts = '''
## The idea

A **thread** is an independent flow of execution, and a modern CPU runs several threads at the
same instant on different cores. All the threads of a process share one heap, so they can read
and write the same objects. That is the power and the danger. `count++` looks like one step but
is three: **read** the value, **add** one, **write** it back. If two threads both read 41 and
both write 42, one increment is lost. This is a **race condition**: the result depends on how
the threads happen to interleave, so the bug appears rarely, differently on every run, and
hardly ever under a debugger.

The cure is to make every **read-modify-write** sequence **atomic**: no other thread may see or
change the state halfway through.

## How C# does it

- **`lock`** gives a block **mutual exclusion**: only one thread at a time can hold the lock on
  a given object, and the others wait at the door.

```csharp
private readonly object _gate = new();
private int _count;

public void Increment()
{
    lock (_gate) { _count++; }
}
```

- **`Interlocked`** performs one atomic operation on one variable with a CPU instruction, no
  lock needed: `Increment`, `Add`, `Exchange`, and `CompareExchange`, the compare-and-swap
  (CAS) that lock-free code retries in a loop.
- **`System.Collections.Concurrent`** has collections built for many threads:
  `ConcurrentDictionary<TKey, TValue>` with atomic `GetOrAdd`, `AddOrUpdate` and `TryUpdate`,
  plus `ConcurrentQueue<T>` and `ConcurrentBag<T>`. A plain `Dictionary` written by two threads
  can lose entries, throw, or corrupt itself.
- **`Parallel.For`** and **`Parallel.ForEach`** split a loop across thread-pool threads and
  return when every iteration is done. `new Thread(...)` with `Start` and `Join`, or `Task.Run`,
  start work explicitly.

## Pitfalls and compiler messages

- **Check-then-act is a race too.** `if (stock >= 1) stock--;` is two steps, and two threads can
  both pass the check. The check and the action must happen under the same lock, or in a CAS loop.
- **Reads need protection as well**, or a reader may see a stale value.
- Lock on a private object that only your class can see, never on `this`, a `string` or a type.
- `lock` needs a reference type: locking an `int` is error **CS0185**. You cannot `await`
  inside a `lock` (**CS1996**); async code uses `SemaphoreSlim.WaitAsync`.
- `AddOrUpdate` may call your update function more than once under contention, so keep it
  free of side effects.
- Two locks taken in opposite orders by two threads can **deadlock**: each waits for the other
  forever.

## What you will practise

You will count with a lock across four threads, aggregate with `Interlocked` inside
`Parallel.For`, and count words in parallel with `ConcurrentDictionary`. The challenge is a
thread-safe inventory whose tests run hundreds of thousands of operations from eight threads
and check that nothing is lost and nothing is oversold.
'''

[[unit.step]]
kind = 'concept'
id = 'cs-u25-c1-races'
title = 'Why count++ loses updates'
points = 5
difficulty = 25
intro = '''
A data race happens when two threads access the same memory at the same time and at least one
of them writes. Because the hardware interleaves the separate read, compute and write steps of
each thread, the final value depends on timing unless a critical section makes those steps
indivisible.
'''
body = '''
## One line, three steps

The statement `count++` compiles to a read of `count` into a register, an addition, and a write
back. Two threads running it at the same moment can interleave like this:

| time | thread A | thread B | count |
|---|---|---|---|
| 1 | reads 41 | | 41 |
| 2 | | reads 41 | 41 |
| 3 | writes 42 | | 42 |
| 4 | | writes 42 | 42 |

Two increments ran and the counter grew by one. Run a million increments from four threads and
the total typically comes out short by a different amount on each run.

## Critical sections

A **critical section** is a piece of code that only one thread may run at a time. C#'s `lock`
statement makes one: a thread entering `lock (gate)` waits until no other thread holds `gate`.
With the increment inside the lock, steps 1 to 3 of one thread can no longer interleave with
another thread's steps.

```csharp
lock (gate)
{
    count++;
}
```

For a single variable, `Interlocked.Increment(ref count)` does the same job with one atomic CPU
instruction, which is cheaper than a lock.

## Atomic is not enough by itself

Making each operation atomic does not make a **sequence** of operations atomic. Checking that a
dictionary has a key and then reading it are two operations; another thread can remove the key
in between. Whatever must be true together has to be done together, inside one lock or with a
method such as `TryGetValue` or `AddOrUpdate` that does it in one call.
'''

