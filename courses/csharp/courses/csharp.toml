Test("isosceles, outer two equal", () => Equal(Triangles.Classify(5, 8, 5), "isosceles"));
Test("isosceles, last two equal", () => Equal(Triangles.Classify(8, 5, 5), "isosceles"));
Test("flat triangle is invalid", () => Equal(Triangles.Classify(1, 2, 3), "invalid"));
Test("too long a side is invalid", () => Equal(Triangles.Classify(1, 10, 12), "invalid"));
Test("too long, equal short sides", () => Equal(Triangles.Classify(1, 1, 3), "invalid"));
Test("zero sides are invalid", () => Equal(Triangles.Classify(0, 0, 0), "invalid"));
Test("a negative side is invalid", () => Equal(Triangles.Classify(-3, 4, 5), "invalid"));
Test("negative equal sides are invalid", () => Equal(Triangles.Classify(-2, -2, -2), "invalid"));
Test("huge equilateral", () => Equal(Triangles.Classify(int.MaxValue, int.MaxValue, int.MaxValue), "equilateral"));
Test("huge isosceles", () => Equal(Triangles.Classify(int.MaxValue, 1, int.MaxValue), "isosceles"));
