two readings is what the code in between allocated.
'''
prompt = '''
Sum the numbers in `"12, 7,-3,40,  5"` twice, once with `Split` and once with a span loop, and
print whether each version allocated memory.

**Why:** `Split` creates an array and one string per field, while the span loop parses the
characters in place, and seeing the difference measured makes the trade-off concrete.
'''
target = '''
using System.Globalization;

string line = "12, 7,-3,40,  5";
Console.WriteLine($"sums: {SumSplit(line)} {SumSpan(line)}");

long before = GC.GetAllocatedBytesForCurrentThread();
SumSplit(line);
long split = GC.GetAllocatedBytesForCurrentThread() - before;

before = GC.GetAllocatedBytesForCurrentThread();
SumSpan(line);
long span = GC.GetAllocatedBytesForCurrentThread() - before;
Console.WriteLine($"Split allocated: {split > 0}, span loop allocated: {span > 0}");

static int SumSplit(string s) =>
    s.Split(',').Sum(part => int.Parse(part, CultureInfo.InvariantCulture));

static int SumSpan(ReadOnlySpan<char> s)
{
    int sum = 0;
    while (true)
    {
        int comma = s.IndexOf(',');
        ReadOnlySpan<char> part = comma < 0 ? s : s[..comma];
        sum += int.Parse(part, NumberStyles.Integer, CultureInfo.InvariantCulture);
        if (comma < 0) return sum;
        s = s[(comma + 1)..];
    }
}
'''
