[[unit.step]]
kind = "drill"
id = "cs-u01-d3-expressions"
title = "Print the results of expressions"
points = 10
difficulty = 1
placeholder_policy = "shown"
run_command = "dotnet run"
intro = '''
An **expression** is any piece of code that produces a value, like `7 + 5`. C# evaluates it
first and only then hands the result to `WriteLine`. The type of the values decides what an
operator does: dividing two whole numbers gives a whole number, and `+` with a string joins
text instead of adding.
'''
prompt = '''
Print the results of arithmetic expressions, then see how precedence, integer division and
string joining change the answer.

**Why:** seeing that `7 / 2` is `3` and that `"Sum: " + 7 + 5` prints `Sum: 75` early saves
you from two of the most common beginner bugs.
'''
target = '''
Console.WriteLine(7 + 5);
Console.WriteLine(7 * 5);
Console.WriteLine(7 / 2);
Console.WriteLine(7 % 2);
Console.WriteLine(-7 / 2);
Console.WriteLine(2 + 3 * 4);
Console.WriteLine((2 + 3) * 4);
Console.WriteLine("Sum: " + 7 + 5);
Console.WriteLine("Sum: " + (7 + 5));
Console.WriteLine(Math.Max(7, 5));
'''
line_comments = [
  "C# evaluates `7 + 5` to `12` first, then `WriteLine` prints the number.",
  "`*` is multiplication: `35`.",
  "Both operands are whole numbers (`int`), so `/` is integer division and drops the fraction: `3`.",
  "`%` is the remainder of that division: 7 = 2 * 3 + 1, so it prints `1`.",
  "Integer division truncates towards zero, so -3.5 becomes `-3`, not -4.",
  "`*` binds tighter than `+`, exactly as in school maths: 2 + 12 = `14`.",
  "Parentheses force the addition first: 5 * 4 = `20`.",
  "`+` works left to right: `\"Sum: \" + 7` is already a string, so the 5 is glued on as text: `Sum: 75`.",
  "Parentheses make `7 + 5` a number first, giving `Sum: 12`.",
  "`Math.Max` is a method from the .NET library that returns the larger of its two arguments: `7`.",
]
explanation = '''
The program printed `12`, `35`, `3`, `1`, `-3`, `14`, `20`, `Sum: 75`, `Sum: 12` and `7`.
Every expression was evaluated before `WriteLine` ran. Dividing two `int` values threw the
fraction away, `*` was done before `+` unless parentheses said otherwise, and once the left
side of a `+` was a string, everything after it was joined as text. Unit 2 shows how to get
`3.5` with the `double` type.
'''

[[unit.step]]
kind = "challenge"
id = "cs-u01-x1-greet"
title = "Implement Greeter.Greet"
points = 20
difficulty = 1
entry = "Greeter"
intro = '''
Now you apply what you learned, with one new idea: a **method** that hands a value back with
`return` instead of printing it. A method that returns can be reused anywhere, and that is
exactly how the hidden tests check it: they call it and compare the result.
