  "",
]
explanation = '''
`required` makes the compiler insist that every `new Order(...)` sets `Customer`, and `init`
allows assignment only inside that initializer, so an `Order` cannot be half-built or edited
later. `WithNotes` follows the immutable pattern: it builds a new order with the same id and
customer and different notes, leaving `order` as it was. `TagBox` shows the limit of `readonly`:
