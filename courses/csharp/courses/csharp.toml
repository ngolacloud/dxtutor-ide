]
explanation = '''
The writer lives in a `using` block, so it is flushed and closed at the block's closing brace,
before the reader opens the same file; reading earlier could miss lines still in the buffer.
`string.Create(inv, $"...")` formats the interpolated decimals with the invariant culture, giving
