  "Makes numbers print the same on every computer (a dot for decimals), whatever its language settings.",
  "",
  "An `int`: a 32-bit whole number.",
  "Eight billion does not fit in an `int`, so this needs a `long`. The `_` separators are ignored by the compiler.",
  "A `double` holds a fractional number (approximately, in binary).",
  "A `decimal` holds exact base-10 fractions; the `m` suffix makes the literal a `decimal`.",
  "A `bool` is either `true` or `false`.",
  "A `char` is one character, written in single quotes.",
  "A `string` is text, written in double quotes.",
  "`var` lets the compiler infer the type from the value: this is an `int`.",
  "A `const` can never be reassigned; by convention its name uses PascalCase.",
  "",
  "Reads `apples` (12), adds `extra` (3) and stores the result back: `apples` is now 15.",
  "Joining a string and a number with `+` turns the number into text: `apples: 15`.",
  "A `long` prints like any other number.",
  "With the invariant culture the decimal separator is a dot: `1.75`.",
  "A `decimal` prints with the digits it was given: `19.99`.",
  "`bool` values print as `True` or `False`, with a capital letter.",
  "A `char` prints as the character itself.",
  "The string is printed as it is.",
  "`*` happens before `+` joins the text, so this prints `days in 52 weeks: 364`.",
  "`int.MaxValue` is the largest value an `int` can hold: 2147483647.",
]
explanation = '''
Each line printed its label and value: `apples: 15` (after the update), the population as a
