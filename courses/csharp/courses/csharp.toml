    // Every operation except KeysByRecency must be O(1).
    public LruCache(int capacity)
    {
        throw new NotImplementedException();
    }

    public int Capacity => throw new NotImplementedException();

    public int Count => throw new NotImplementedException();

    public bool TryGet(TKey key, [MaybeNullWhen(false)] out TValue value)
    {
        throw new NotImplementedException();
    }

    public void Put(TKey key, TValue value)
    {
        throw new NotImplementedException();
    }

    public bool Remove(TKey key)
    {
        throw new NotImplementedException();
    }

    public List<TKey> KeysByRecency()
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
using System.Diagnostics;
Test("a get refreshes a key and the oldest is evicted", () =>
{
    var cache = new LruCache<string, int>(2);
    cache.Put("a", 1);
    cache.Put("b", 2);
    Check(cache.TryGet("a", out int a) && a == 1, "a should be cached with value 1");
    cache.Put("c", 3);
    Check(!cache.TryGet("b", out _), "b was the least recently used and should be evicted");
    Equal(cache.KeysByRecency(), new List<string> { "c", "a" });
    Equal(cache.Count, 2);
    Equal(cache.Capacity, 2);
});
Test("updating a key moves it to the front without evicting", () =>
{
    var cache = new LruCache<string, int>(2);
    cache.Put("a", 1);
    cache.Put("b", 2);
    cache.Put("a", 10);
    Equal(cache.Count, 2);
    Equal(cache.KeysByRecency(), new List<string> { "a", "b" });
    cache.Put("c", 3);
    Check(cache.TryGet("a", out int a) && a == 10, "a should hold its updated value 10");
    Check(!cache.TryGet("b", out _), "b should have been evicted");
});
Test("a miss returns default and changes nothing", () =>
{
    var cache = new LruCache<int, string>(3);
    cache.Put(1, "one");
    cache.Put(2, "two");
    Check(!cache.TryGet(99, out string? missing), "99 is not cached");
    Equal(missing, null);
    Equal(cache.KeysByRecency(), new List<int> { 2, 1 });
    var empty = new LruCache<int, int>(1);
    Check(!empty.TryGet(0, out int zero) && zero == 0, "an empty cache misses with default 0");
    Equal(empty.Count, 0);
    Equal(empty.KeysByRecency(), new List<int>());
});
Test("capacity one keeps only the newest key", () =>
{
    var cache = new LruCache<char, int>(1);
    cache.Put('x', 1);
    cache.Put('y', 2);
    Equal(cache.KeysByRecency(), new List<char> { 'y' });
    cache.Put('y', 3);
    Check(cache.TryGet('y', out int y) && y == 3, "y should hold 3");
    Equal(cache.Count, 1);
});
Test("remove deletes a key and frees a slot", () =>
{
    var cache = new LruCache<string, int>(2);
    cache.Put("a", 1);
    cache.Put("b", 2);
    Equal(cache.Remove("a"), true);
    Equal(cache.Remove("a"), false);
    Equal(cache.Count, 1);
    cache.Put("c", 3);
    Equal(cache.KeysByRecency(), new List<string> { "c", "b" });
    Check(cache.TryGet("b", out int b) && b == 2, "b must not be evicted after a remove freed a slot");
});
Test("rejects a capacity below 1", () =>
{
    Throws<ArgumentOutOfRangeException>(() => new LruCache<int, int>(0));
    Throws<ArgumentOutOfRangeException>(() => new LruCache<int, int>(-5));
});
Test("matches a simple model on random operations", () =>
{
    var rng = new Random(2026);
    var cache = new LruCache<int, int>(16);
    var model = new List<(int Key, int Value)>();
    for (int step = 0; step < 5000; step++)
    {
        int key = rng.Next(40);
        int op = rng.Next(10);
        int at = model.FindIndex(e => e.Key == key);
        if (op < 5)
        {
            int value = rng.Next(1000) - 500;
            if (at >= 0) model.RemoveAt(at);
            else if (model.Count == 16) model.RemoveAt(model.Count - 1);
            model.Insert(0, (key, value));
            cache.Put(key, value);
        }
        else if (op < 9)
        {
            bool hit = cache.TryGet(key, out int got);
            Check(hit == at >= 0, $"step {step}: TryGet({key}) hit={hit}");
            if (at >= 0)
            {
                var entry = model[at];
                Check(got == entry.Value, $"step {step}: TryGet({key}) returned {got}, expected {entry.Value}");
                model.RemoveAt(at);
                model.Insert(0, entry);
            }
        }
        else
        {
            Check(cache.Remove(key) == at >= 0, $"step {step}: Remove({key})");
            if (at >= 0) model.RemoveAt(at);
        }
        Check(cache.Count == model.Count, $"step {step}: Count {cache.Count}, expected {model.Count}");
    }
    Equal(cache.KeysByRecency(), model.Select(e => e.Key).ToList());
});
Test("300,000 operations on a large cache are fast", () =>
{
    var cache = new LruCache<int, long>(20000);
    var rng = new Random(7);
    var clock = Stopwatch.StartNew();
    long sum = 0;
    for (int i = 0; i < 300000; i++)
    {
        int key = rng.Next(30000);
        if (cache.TryGet(key, out long v)) sum += v;
        else cache.Put(key, i);
    }
    clock.Stop();
    Equal(cache.Count, 20000);
    Check(sum > 0, "some lookups should hit");
    Check(clock.ElapsedMilliseconds < 2000, $"took {clock.ElapsedMilliseconds} ms; every operation must be O(1)");
});
'''

[unit.step.gabarito]
solution = '''
using System.Diagnostics.CodeAnalysis;

public sealed class LruCache<TKey, TValue> where TKey : notnull
{
    private readonly Dictionary<TKey, LinkedListNode<(TKey Key, TValue Value)>> _map;
    private readonly LinkedList<(TKey Key, TValue Value)> _order = new();

    public LruCache(int capacity)
    {
        ArgumentOutOfRangeException.ThrowIfLessThan(capacity, 1);
        Capacity = capacity;
        _map = new Dictionary<TKey, LinkedListNode<(TKey Key, TValue Value)>>(capacity);
    }

    public int Capacity { get; }

    public int Count => _map.Count;

    public bool TryGet(TKey key, [MaybeNullWhen(false)] out TValue value)
    {
        if (_map.TryGetValue(key, out var node))
        {
            MoveToFront(node);
            value = node.Value.Value;
            return true;
        }
        value = default;
        return false;
    }

    public void Put(TKey key, TValue value)
    {
        if (_map.TryGetValue(key, out var node))
        {
            node.Value = (key, value);
            MoveToFront(node);
            return;
        }
        if (_map.Count == Capacity)
        {
            var oldest = _order.Last!;
            _order.RemoveLast();
            _map.Remove(oldest.Value.Key);
        }
        _map[key] = _order.AddFirst((key, value));
    }

    public bool Remove(TKey key)
    {
        if (!_map.Remove(key, out var node))
        {
            return false;
        }
        _order.Remove(node);
        return true;
    }

    public List<TKey> KeysByRecency() => _order.Select(entry => entry.Key).ToList();

    private void MoveToFront(LinkedListNode<(TKey Key, TValue Value)> node)
    {
        if (node != _order.First)
        {
            _order.Remove(node);
            _order.AddFirst(node);
        }
    }
}
'''
time = "O(1) per operation"
space = "O(capacity)"
justification = '''
Each operation does a constant number of O(1) steps. `TryGet` is one dictionary lookup (O(1)
on average) plus a move to the front, which is `Remove(node)` and `AddFirst(node)` on a doubly
linked list: both rewire a few links around a node we already hold, with no search. `Put`
adds at most one eviction, which reads `Last`, removes it in O(1) and deletes its key from the
dictionary; storing the key inside the node is what makes that possible. `Remove` is a
dictionary removal plus an O(1) unlink. So every operation is **O(1)**, and only
`KeysByRecency` is O(n), because it copies the keys out.

The dictionary and the list each hold at most `capacity` entries, so the space is
**O(capacity)**.

Neither structure works alone. A dictionary has no notion of recency, and finding its oldest
entry would be O(n). A list ordered by recency cannot find a key without walking it, which is
also O(n). Together, the dictionary finds the node and the list orders the nodes. Reusing the
same node when moving it also means a cache hit allocates nothing.
'''

[[unit]]
id = "cs-u29-stacks-queues"
title = "Stacks and queues"
level = "advanced"
difficulty = 29
intro = '''
Stacks hand back the newest item first and queues the oldest, and between them they power
undo, parsing, scheduling and graph search. You will use `Stack<T>` to match brackets and
`Queue<T>` to find the shortest path through a maze, build a queue out of two stacks, and
finish with a growable circular deque written by hand on top of a plain array.
'''
concepts = '''
## The idea

A **stack** is last in, first out (LIFO): you push onto the top and pop from the top, like a
pile of plates. It is the natural shape for anything nested or undoable: the call stack,
matching brackets, undo history, depth-first search. A **queue** is first in, first out
(FIFO): you enqueue at the back and dequeue from the front, like a line at a counter. It is
the shape of fairness and of distance: job schedulers, buffers between threads, breadth-first
search, which finds shortest paths precisely because it explores in arrival order.

Both are restrictions of a list, and the restriction is the point: each allowed operation can
be O(1).

## How C# does it

`Stack<T>` and `Queue<T>` live in `System.Collections.Generic`:

```csharp
var undo = new Stack<string>();
undo.Push("type a");
undo.Push("type b");
Console.WriteLine(undo.Pop());       // type b
var jobs = new Queue<int>();
jobs.Enqueue(1);
jobs.Enqueue(2);
Console.WriteLine(jobs.Dequeue());   // 1
```

`Peek` looks at the next item without removing it, and `TryPop`, `TryPeek` and `TryDequeue`
return `false` on an empty collection instead of throwing. Both are backed by an array that
doubles when full, so pushes and enqueues are amortized O(1).

A stack only grows and shrinks at one end of its array. A queue needs both ends, so `Queue<T>`
uses a **circular buffer**: a `head` index for the front and a count, with positions wrapping
around the end of the array. Element `i` lives at `(head + i) % capacity`. Dequeuing moves
`head` forward instead of shifting every element, which is why it is O(1).

.NET has no built-in double-ended queue. `LinkedList<T>` can act as one, but it allocates a
node per element, so a hand-written circular deque is the usual fast choice.

## Pitfalls

- `Pop`, `Peek` and `Dequeue` on an empty collection throw `InvalidOperationException`
  ("Stack empty." or "Queue empty."). Check `Count` or use the `Try` methods.
- **Don't use `List<T>` as a queue.** `list.RemoveAt(0)` shifts every remaining element, so
  draining a list from the front costs O(n²) in total.
- Enumerating a `Stack<T>` (or calling `ToArray`) yields items **top first**, the reverse of
  the order you pushed them. `new Stack<int>(new[] { 1, 2, 3 })` has 3 on top.
- `Queue<T>` has no `Pop` and `Stack<T>` has no `Dequeue`: mixing them up is error **CS1061**,
  "'Queue<int>' does not contain a definition for 'Pop'".
- In a circular buffer, `(head - 1) % capacity` is **negative** when `head` is 0, because `%`
  in C# keeps the sign of the left operand. Add `capacity` before taking the remainder.

## What you will practise

You will check brackets with a stack, run a breadth-first search with a queue, and build a
queue from two stacks with amortized O(1) operations. The challenge asks you to write a deque
on a circular array that grows by doubling, with O(1) operations at both ends.
'''

[[unit.step]]
kind = "concept"
id = "cs-u29-c1-lifo-fifo"
title = "LIFO, FIFO and the ring"
points = 5
difficulty = 29
intro = '''
A stack and a queue store the same items and differ only in which item leaves next. Behind
both sits an array; the queue's trick is to let its contents wrap around the end of the array
so that removing from the front never shifts anything.
'''
body = '''
## Two orders

Push 1, 2, 3 onto a **stack** and pop three times: you get 3, 2, 1. Enqueue 1, 2, 3 into a
**queue** and dequeue three times: you get 1, 2, 3. A stack reverses order and a queue
preserves it. That is why a stack matches nested brackets (the most recent opener must close
first) and why a queue explores a graph level by level.

## The stack's array

A stack keeps its items in `items[0..count)` with the top at `items[count - 1]`. Push writes at
`count` and increments it; pop decrements it. When the array is full, a new one of twice the
size is allocated and the items are copied. Doubling makes the copies rare: over n pushes the
total copying is less than 2n, so each push is **amortized O(1)**.

## The queue's ring

A queue removes from the front. Shifting everything left on each dequeue would be O(n), so
instead the queue keeps a `head` index and a `count`:

```csharp
int slot = (head + i) % items.Length;    // where element i lives
```

Dequeue reads `items[head]` and advances `head`; enqueue writes at `(head + count) %
items.Length`. When `head + count` passes the end of the array, new items wrap around to the
free slots at the start. When the ring is full, it is copied into a twice-as-large array **in
logical order**, starting from `head`, and `head` becomes 0. A **deque** extends the same ring
with operations at both ends, stepping `head` backwards to add at the front.
'''

