    File.WriteAllText(Path.Combine(root, "src", "main.cs"), "");
    File.WriteAllText(Path.Combine(root, "src", "util", "text.cs"), "");

    var sources = Directory.EnumerateFiles(root, "*.cs", SearchOption.AllDirectories)
