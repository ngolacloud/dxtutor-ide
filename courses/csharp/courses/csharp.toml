[[unit.step]]
kind = "challenge"
id = "cs-u05-x1-primes"
title = "Implement Primes: test and count"
points = 20
difficulty = 5
entry = "Primes"
intro = '''
A prime has no divisors other than 1 and itself, and **trial division** checks that by trying
candidate divisors in a loop. The key insight is that divisors come in pairs, `d` and `n / d`,
so you only need to try candidates up to `√n`. That turns an O(n) loop into an O(√n) one.
'''
instructions = '''
## Your turn

Implement the two static methods of the class `Primes`:

```csharp
public static bool IsPrime(int n)
public static int CountUpTo(int n)
```

- `IsPrime` returns `true` when `n` is a prime number: greater than 1 and divisible only by 1
  and itself. Zero, one and negative numbers are not prime.
- `CountUpTo` returns how many primes are **less than or equal to** `n` (0 when `n < 2`).

Examples:

- `Primes.IsPrime(2)` → `true`, `Primes.IsPrime(9)` → `false`, `Primes.IsPrime(97)` → `true`
- `Primes.IsPrime(1)` → `false`, `Primes.IsPrime(-7)` → `false`
- `Primes.IsPrime(int.MaxValue)` → `true` (2147483647 is prime)
- `Primes.CountUpTo(10)` → `4` (2, 3, 5 and 7)

Requirements:

- Only try divisors `d` while `d * d <= n`. Trying every number up to `n` is too slow for
  `int.MaxValue`.
- **Watch the overflow:** when `n` is near `int.MaxValue`, `d * d` no longer fits in an `int`.
  Compute it as `(long)d * d`, or test `d <= n / d` instead.
- `CountUpTo` may call `IsPrime` in a loop.

Hidden tests decide correctness. Implement it, then submit.
'''
starter = '''
// Primes: trial division up to the square root.
public static class Primes
{
    // True when n is prime: greater than 1 and with no divisor between 2 and its square root.
    public static bool IsPrime(int n)
    {
        throw new NotImplementedException();
    }

    // How many primes are less than or equal to n (0 when n < 2).
    public static int CountUpTo(int n)
    {
        throw new NotImplementedException();
    }
}
'''
tests = '''
Test("two is the smallest prime", () => Equal(Primes.IsPrime(2), true));
Test("small primes", () => Check(Primes.IsPrime(3) && Primes.IsPrime(5) && Primes.IsPrime(97), "3, 5 and 97 are prime"));
Test("one is not prime", () => Equal(Primes.IsPrime(1), false));
Test("zero and negatives are not prime", () => Check(!Primes.IsPrime(0) && !Primes.IsPrime(-7) && !Primes.IsPrime(int.MinValue), "0, -7 and int.MinValue are not prime"));
Test("even numbers above two", () => Check(!Primes.IsPrime(4) && !Primes.IsPrime(100), "4 and 100 are not prime"));
Test("perfect squares are not prime", () => Check(!Primes.IsPrime(9) && !Primes.IsPrime(25) && !Primes.IsPrime(49), "9, 25 and 49 are squares"));
Test("int.MaxValue is prime", () => Equal(Primes.IsPrime(int.MaxValue), true));
Test("a large prime near the limit", () => Equal(Primes.IsPrime(2147483629), true));
Test("a large square near the limit", () => Equal(Primes.IsPrime(2147117569), false));
Test("a large even number", () => Equal(Primes.IsPrime(2147483646), false));
Test("count up to 10", () => Equal(Primes.CountUpTo(10), 4));
Test("count includes n itself", () => Equal(Primes.CountUpTo(2), 1));
Test("count below two is zero", () => Check(Primes.CountUpTo(1) == 0 && Primes.CountUpTo(-5) == 0, "no primes below 2"));
Test("count up to 100", () => Equal(Primes.CountUpTo(100), 25));
Test("count up to 100000", () => Equal(Primes.CountUpTo(100_000), 9592));
'''

[unit.step.gabarito]
solution = '''
// Primes: trial division up to the square root.
public static class Primes
{
    // True when n is prime: greater than 1 and with no divisor between 2 and its square root.
    public static bool IsPrime(int n)
    {
        if (n < 2)
        {
            return false;
        }
        if (n % 2 == 0)
        {
            return n == 2;
        }
        for (int d = 3; (long)d * d <= n; d += 2)
        {
            if (n % d == 0)
            {
                return false;
            }
        }
        return true;
    }

    // How many primes are less than or equal to n (0 when n < 2).
    public static int CountUpTo(int n)
    {
        int count = 0;
        for (int k = 2; k <= n; k++)
        {
            if (IsPrime(k))
            {
                count++;
            }
        }
        return count;
    }
}
'''
time = "O(√n) to test, O(n√n) to count"
space = "O(1)"
justification = '''
If `n` has a divisor `d` larger than `√n`, then `n / d` is a divisor smaller than `√n`, so
when no candidate up to `√n` divides `n`, none above it can either. `IsPrime` therefore tries
at most about `√n` candidates (half that, since it skips even ones after checking 2), each a
single `%`: **O(√n)** time. For `int.MaxValue` that is about 23,000 divisions instead of two
billion. It keeps only the loop variable, so the space is **O(1)**.

`CountUpTo` calls `IsPrime` once for each `k` from 2 to `n`, and each call costs at most
`O(√k) ≤ O(√n)`, so the total is **O(n√n)** time with **O(1)** extra space. Writing
`(long)d * d` keeps the loop condition correct near the top of the `int` range: in 32-bit
arithmetic, `46341 * 46341` wraps to a negative number, the test `d * d <= n` stays true, and
the loop runs on far past `√n`. A sieve of Eratosthenes would count primes in O(n log log n)
time, at the cost of O(n) memory; you will meet arrays in unit 7.
'''

[[unit]]
id = "cs-u06-methods"
title = "Methods"
level = "basic"
difficulty = 6
intro = '''
A method gives a name to a piece of logic so you can call it from anywhere, test it on its own
and stop repeating yourself. This unit covers defining static methods and local functions,
parameters and return values, overloading, optional and named arguments, and the `ref` and
`out` keywords that let a method write back into the caller's variables.
'''
concepts = '''
## The idea

As programs grow, the same steps appear in several places: computing an area, formatting a
price, validating input. A **method** packages those steps under a name. The caller passes in
**arguments**, the method receives them as **parameters**, does its work and may **return** a
result. A good method does one job, has a name that says what that job is, and can be
understood without reading the code that calls it.

## How C# does it

```csharp
public static class Geometry
{
    public static double CircleArea(double radius)
    {
        return Math.PI * radius * radius;
    }

    public static int Square(int x) => x * x;   // expression-bodied
}
```

The header reads: who may call it (`public`), that it belongs to the class rather than to an
object (`static`), the **return type** (`double`; `void` means "returns nothing"), the name,
and the parameter list. `return` hands the value back and ends the method. A body that is a
single expression can be written after `=>`. In a top-level program you can also declare
**local functions** below your statements, and call them from anywhere in the file.

- **Overloading**: several methods may share a name if their parameter lists differ, such as
  `Max(int, int)` and `Max(double, double)`. The compiler picks the one that fits the
  arguments.
- **Optional parameters** have a default: `Pad(string s, int width = 3)` can be called as
  `Pad("x")`. **Named arguments** say which parameter they are for: `Pad("x", width: 5)`.
- **Pass by value** is the default: the method receives a copy of each argument, so assigning
  to a parameter does not change the caller's variable. **`ref`** passes the variable itself,
  so the method can change it. **`out`** is for extra results: the method *must* assign it,
  and the caller does not need to initialise it. `int.TryParse(text, out int n)` uses `out` to
  return both "did it work?" and the number.

## What is special or tricky

- **Every path must return.** A method with a return type that can reach its end without
  `return` is `CS0161: not all code paths return a value`.
- **Arguments must match.** Leaving one out is `CS7036: There is no argument given that
  corresponds to the required parameter`.
- **`ref` and `out` are visible at the call.** Forgetting the keyword is `CS1620: Argument 1
  must be passed with the 'ref' keyword`; an `out` parameter left unassigned is `CS0177`.
- **Optional parameters go last.** `void P(int a = 1, int b)` is `CS1737: Optional parameters
  must appear after all required parameters`.
- **`void` has no value.** `int r = Log();` for a `void` method is `CS0029: Cannot implicitly
  convert type 'void' to 'int'`.

## What you will practise

You will write local functions with block and expression bodies, a static class with
overloads and optional parameters called with named arguments, and methods that use `ref` and
`out`. Then you will write a `Money` class whose methods format amounts with defaults, parse
text safely with `out`, and update a balance through `ref`.
'''

[[unit.step]]
kind = "concept"
id = "cs-u06-c1-anatomy"
title = "The anatomy of a method"
points = 5
difficulty = 6
intro = '''
Calling a method pushes a new **stack frame** that holds its parameters and local variables;
returning pops the frame and hands a value back to the caller. Because each call gets its own
frame, a method's locals cannot clash with the caller's, which is what makes methods safe
building blocks.
'''
body = '''
## Reading a header

```csharp
public static string Repeat(string text, int times = 2)
//  │      │      │      │       │            └ optional parameter with a default
//  │      │      │      │       └ first parameter: type, then name
//  │      │      │      └ the method's name, in PascalCase
//  │      │      └ return type: what the caller gets back
//  │      └ belongs to the class, not to an object
//  └ any code may call it
```

Calling it: `Repeat("ab")` returns `"abab"`, `Repeat("ab", 3)` returns `"ababab"`, and
`Repeat(times: 3, text: "ab")` gives the same result with named arguments in any order.

## Parameters are copies

```csharp
static void ResetCopy(int value) { value = 0; }
static void ResetRef(ref int value) { value = 0; }

int n = 5;
ResetCopy(n);     // n is still 5: the method changed its own copy
ResetRef(ref n);  // n is now 0: the method received n itself
```

The two bodies are identical; only `ref` decides whether the caller sees the change. Use `ref`
sparingly: a method that returns its result is easier to read and
to test than one that edits the caller's variables.

## Returning more than one value

`out` parameters are the classic way: `bool TryParse(string s, out int value)` returns success
and writes the number. Modern C# also offers **tuples**, `(int Min, int Max) MinMax(...)`, which
you will meet later. The `TryXxx` pattern with `out` is everywhere in .NET, so you need to read
it fluently.
'''

[[unit.step]]
kind = "drill"
id = "cs-u06-d1-local-functions"
title = "Define and call local functions"
points = 10
difficulty = 6
placeholder_policy = "shown"
run_command = "dotnet run"
intro = '''
A local function is a method declared inside another body, here inside the top-level program.
The compiler knows every local function in the block before it runs any statement, so you may
call one above the line where it is written. Each call jumps into the function, runs it with
its own parameters and comes back with the result.
'''
prompt = '''
Call five local functions first, then declare them below: one with a block body, three with
expression bodies, one `void` that only prints, and one with two `return` statements.

**Why:** naming small computations is the first step towards readable code: `IsEven(10)` says
what it means, while `10 % 2 == 0` makes the reader work it out.
'''
target = '''
Console.WriteLine(Square(7));
Console.WriteLine(IsEven(10));
PrintBanner("Methods");
Console.WriteLine(Area(3, 4));
Console.WriteLine(Describe(-2));
Console.WriteLine(Describe(Square(0)));

static int Square(int x)
{
    return x * x;
}

static bool IsEven(int n) => n % 2 == 0;

static void PrintBanner(string title)
{
    Console.WriteLine($"== {title} ==");
}

static int Area(int width, int height) => width * height;

static string Describe(int n)
{
    if (n < 0)
