'''
target = '''
string[] maze =
{
    "S.#.....",
    ".##.###.",
    "....#...",
    ".##...#E",
};
Console.WriteLine($"shortest path: {ShortestPath(maze)} steps");

static int ShortestPath(string[] grid)
{
    int rows = grid.Length, cols = grid[0].Length;
    var dist = new Dictionary<(int R, int C), int> { [(0, 0)] = 0 };
    var queue = new Queue<(int R, int C)>();
    queue.Enqueue((0, 0));
    (int, int)[] moves = { (1, 0), (-1, 0), (0, 1), (0, -1) };
    while (queue.TryDequeue(out var cell))
    {
        if (grid[cell.R][cell.C] == 'E') return dist[cell];
        foreach (var (dr, dc) in moves)
        {
            var next = (R: cell.R + dr, C: cell.C + dc);
            if (next.R < 0 || next.R >= rows || next.C < 0 || next.C >= cols) continue;
            if (grid[next.R][next.C] == '#' || dist.ContainsKey(next)) continue;
            dist[next] = dist[cell] + 1;
            queue.Enqueue(next);
        }
    }
    return -1;
}
'''
