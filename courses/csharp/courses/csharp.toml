[[unit]]
id = "cs-u16-nullable"
title = "Nullable types and null safety"
level = "intermediate"
difficulty = 16
intro = '''
`null` means "no object here", and dereferencing it is the most common crash in .NET code. Modern
C# lets the compiler track which references may be null, gives value types an explicit "maybe"
form with `int?`, and offers compact operators (`?.`, `??`, `??=`) for handling the missing case.
You will use all of them and finish with a layered configuration lookup that never crashes on a
missing key.
'''
concepts = '''
## The idea

A reference variable either points at an object or holds `null`, which means "no object". Calling a
member through `null` throws `NullReferenceException` at run time, usually far from the line that
forgot to assign the value. Tony Hoare, who introduced null references in 1965, later called them
his "billion-dollar mistake". The cure is to make "may be missing" part of the **type**, so the
compiler can tell you where you forgot to check.

## Two kinds of "maybe" in C#

**Value types** (`int`, `double`, `DateOnly`, structs) can never be null. To express "an int or
nothing" you write `int?`, which is short for the struct `Nullable<int>`. It really exists at run
time and has `HasValue`, `Value` and `GetValueOrDefault()`.

**Reference types** (`string`, classes, records) could always hold null. Since C# 8, with nullable
reference types enabled (the default in new projects and in this course), `string` means "never
null" and `string?` means "may be null". This is **static analysis only**: at run time `string` and
`string?` are the same type, and the compiler reports problems as warnings.

```csharp
int? retries = null;             // Nullable<int>: a real struct with HasValue
string? middleName = null;       // an annotation the compiler tracks
string name = "Ada";             // the compiler warns if you assign null here
```

## The null operators

```csharp
string? city = order.Customer?.Address?.City; // ?. stops at the first null
int length = city?.Length ?? 0;               // ?? supplies a fallback
cache ??= new Dictionary<string, int>();      // ??= assigns only when null
```

The compiler also does **flow analysis**: after `if (s is null) return;`, it knows `s` is not null.
Helpers such as `string.IsNullOrEmpty` carry attributes that teach the compiler the same thing.

## Warnings and errors you will meet

- **CS8600**: converting a null literal or possible null value to a non-nullable type.
- **CS8602**: dereference of a possibly null reference (you wrote `s.Length` on a `string?`).
- **CS8603**: possible null reference return.
- **CS8618**: a non-nullable property or field is left null when the constructor exits.
- **CS0266**: `int x = maybeInt;` is an error, because `int?` does not convert to `int`
  implicitly. Use `?? 0`, `.Value` or a check.

The **null-forgiving operator** `!` (`name!.Length`) silences a warning when you know better than
the compiler. It changes nothing at run time: if you are wrong, the crash still comes. Use it
rarely, and never to make a warning disappear without thinking. One known hole remains: arrays
such as `new string[3]` start full of nulls even though their type says `string`.

## What you will practise

You will chain `?.` and `??` through an object graph, compute with `int?` values parsed from
text, and let flow analysis and guard clauses prove references non-null. The challenge builds a
two-layer configuration lookup where missing, null and blank values all fall back cleanly.
'''

[[unit.step]]
kind = "concept"
id = "cs-u16-c1-two-maybes"
title = "int? and string?: two kinds of maybe"
points = 5
difficulty = 16
intro = '''
C# separates "maybe" for value types, which is a real runtime struct, from "maybe" for reference
types, which is a compile-time annotation checked by flow analysis. Knowing which one you hold
tells you what the compiler can prove and what can still fail at run time.
'''
body = '''
## `Nullable<T>` for value types

An `int` always holds a number. `int?` (exactly `Nullable<int>`) is a small struct with two
fields: a `bool` saying whether there is a value, and the value itself.

```csharp
int? score = null;
Console.WriteLine(score.HasValue);            // False
Console.WriteLine(score.GetValueOrDefault()); // 0
score = 42;
int real = score.Value;                       // fine now; throws when empty
```

Arithmetic on `int?` is **lifted**: if either side is null, the result is null. Comparisons such
as `<` and `>` with a null side are simply `false`.

## Annotations for reference types

`string?` does not create a new type. It tells the compiler "this variable may be null", and the
compiler then checks every dereference:

```csharp
string? input = Console.ReadLine(); // ReadLine returns string?
int n = input.Length;               // warning CS8602: may be null
int m = input?.Length ?? 0;         // fine: handled
```

## Narrowing

The compiler follows your checks. Inside `if (input is not null) { ... }`, or after
`if (input is null) return;`, `input` is treated as `string`. Patterns work too:
`if (input is { Length: > 0 })` checks for null and for content in one go.

The rule of thumb: let the types say what may be missing, handle the missing case at the
boundary (parsing, lookups, user input), and keep the inside of your program working with
non-nullable values.
'''

