prompt = '''
Write a generic `ArrayStack<T>` that starts with room for two elements and doubles when
full, use it to reverse a sentence, then pop the empty stack.

**Why:** writing the structure yourself shows where the amortized O(1) comes from and why
Java code stores generic elements in an `Object[]`.
'''
target = '''
import java.util.Arrays;
import java.util.NoSuchElementException;

public class Main {
    public static void main(String[] args) {
        ArrayStack<String> stack = new ArrayStack<>();
        for (String word : "to be or not to be".split(" ")) {
            stack.push(word);
        }
        StringBuilder out = new StringBuilder();
        while (!stack.isEmpty()) out.append(stack.pop()).append(' ');
        System.out.println(out.toString().strip());
        try {
            stack.pop();
        } catch (NoSuchElementException e) {
            System.out.println("error: " + e.getMessage());
        }
    }
}

class ArrayStack<T> {
    private Object[] data = new Object[2];
    private int size;

    void push(T value) {
        if (size == data.length) data = Arrays.copyOf(data, size * 2);
        data[size++] = value;
    }

    @SuppressWarnings("unchecked")
    T pop() {
        if (size == 0) throw new NoSuchElementException("stack is empty");
        T value = (T) data[--size];
        data[size] = null;
        return value;
    }

    boolean isEmpty() { return size == 0; }
}
