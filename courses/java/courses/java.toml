prompt = '''
Start from 31 January 2024, add 30 days and one or two months, and compare chained month
arithmetic with adding two months at once.

**Why:** seeing the clamping and the drift once, with fixed dates, is the best defence against
off-by-a-day billing bugs.
'''
target = '''
import java.time.DayOfWeek;
import java.time.LocalDate;
import java.time.temporal.ChronoUnit;

public class Main {
    public static void main(String[] args) {
        LocalDate invoice = LocalDate.of(2024, 1, 31);
        LocalDate due = invoice.plusDays(30);
        System.out.println("due " + due + " on a " + due.getDayOfWeek());

        invoice.plusDays(1);
        System.out.println("still " + invoice);

        System.out.println(invoice.plusMonths(1));
        System.out.println(invoice.plusMonths(1).plusMonths(1));
        System.out.println(invoice.plusMonths(2));

        LocalDate feb = LocalDate.of(2024, 2, 1);
        System.out.println(feb.lengthOfMonth() + " days, leap " + feb.isLeapYear());
        System.out.println(ChronoUnit.DAYS.between(invoice, due) + " days");
        System.out.println(ChronoUnit.DAYS.between(due, invoice) + " days");
        System.out.println(due.getDayOfWeek() == DayOfWeek.FRIDAY);
    }
}
'''
