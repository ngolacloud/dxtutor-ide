intro = '''
A withdrawal is a **check-then-act** sequence: test the balance, then subtract. If two threads
both pass the check before either subtracts, the account goes negative. Holding one lock
around the whole sequence makes the check and the act a single atomic step.
'''
prompt = '''
Submit 2,000 one-unit withdrawals from four pool threads against an account holding 1,000,
guarding the balance with a `ReentrantLock`, and print the final state.

**Why:** explicit locks are what you reach for when `synchronized` is not flexible enough,
and the `lock` / `try` / `finally unlock` shape is the one you must write every time.
'''
target = '''
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;
import java.util.concurrent.locks.ReentrantLock;

public class Main {
    public static void main(String[] args) {
        Account account = new Account(1_000);
        try (ExecutorService pool = Executors.newFixedThreadPool(4)) {
            for (int i = 0; i < 2_000; i++) {
                pool.submit(() -> account.withdraw(1));
            }
        }
        System.out.println("balance " + account.balance());
    }
}

class Account {
    private final ReentrantLock lock = new ReentrantLock();
    private long balance;

    Account(long balance) {
        this.balance = balance;
    }

    boolean withdraw(long amount) {
        lock.lock();
        try {
            if (balance < amount) return false;
            balance -= amount;
            return true;
        } finally {
            lock.unlock();
        }
    }

    long balance() {
        lock.lock();
        try { return balance; } finally { lock.unlock(); }
    }
}
'''
