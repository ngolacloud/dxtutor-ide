prompt = '''
Count unique visitors with a `HashSet`, report repeat visits using the result of `add`, and
compare two days' visitors with intersection, union and difference.

**Why:** "remove duplicates", "have I seen this?" and "what is in both?" are among the most
common questions programs ask about data, and sets answer each one in a line.
