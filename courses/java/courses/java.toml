prompt = '''
Write a bounded `clamp` and an unbounded `swap`, and call them with integers, strings and an
array of names.

**Why:** the bound is the price of calling `compareTo`, and the reward is a single method that
works for every comparable type instead of one overload per type.
'''
target = '''
import java.util.Arrays;

public class Main {
    static <T extends Comparable<T>> T clamp(T value, T lo, T hi) {
        if (value.compareTo(lo) < 0) {
            return lo;
        }
        if (value.compareTo(hi) > 0) {
            return hi;
        }
        return value;
    }

    static <T> void swap(T[] items, int i, int j) {
        T tmp = items[i];
        items[i] = items[j];
        items[j] = tmp;
    }

    public static void main(String[] args) {
        System.out.println(clamp(15, 0, 10));
        System.out.println(clamp(-3, 0, 10));
        System.out.println(clamp("kiwi", "apple", "melon"));
        System.out.println(clamp("zebra", "apple", "melon"));

        String[] names = {"Ada", "Linus", "Grace"};
        swap(names, 0, 2);
        System.out.println(Arrays.toString(names));
    }
}
'''
