[[unit]]
id = "java-u30-linked-list"
title = "Singly linked lists"
level = "advanced"
difficulty = 30
intro = '''
A linked list stores each value in its own node object that points to the next one, so a
sequence becomes a chain of references instead of one contiguous array. You will write a
generic `Node<T>`, push and pop at the head, keep a tail reference for O(1) appends, make the
list work with the enhanced `for` loop, and finish by reversing a million nodes in place.
'''
concepts = '''
## The idea

A **linked list** stores a sequence as a chain of **nodes**. Each node holds a value and a **reference** to the next node, and the last node's reference is `null`. The list itself only needs a reference to the first node, the **head**. Nothing is contiguous: the nodes live wherever the JVM allocated them, connected only by references.

That layout trades one set of costs for another. Compared with `ArrayList`, which is a resizable array:

- **Insert or remove at the head: O(1).** You rewire one reference. `arrayList.add(0, x)` shifts every element, which is O(n).
- **Insert after a node you already hold: O(1)**, for the same reason.
- **Access by index and search: O(n).** You must walk from the head, because no arithmetic jumps to element *i*.
- **Append at the tail: O(n)** unless you also keep a reference to the last node, and **size: O(n)** unless you keep a counter.

In everyday Java, `ArrayList` and `ArrayDeque` usually win: their arrays are friendly to CPU caches, while every node is a separate object with its own header. Linked lists still matter. Trees and graphs are built from the same kind of node, and "rewire two references" is the trick behind LRU caches and the JDK's own `LinkedHashMap`.

## How Java does it

A node is a small generic class. Declaring it as a `static` nested class keeps it next to the list without giving each node a hidden reference to a list object:

```java
class Chain<T> {
    static final class Node<T> {
        T val;
        Node<T> next;
        Node(T val, Node<T> next) { this.val = val; this.next = next; }
    }
    Node<T> head;
}
```

Inserting after a node you hold is one assignment. The constructor reads the old `node.next` before the field is overwritten:

```java
node.next = new Node<>(value, node.next);
```

A walk is a loop that follows `next` until it reaches `null`:

```java
for (Node<T> n = head; n != null; n = n.next) {
    if (Objects.equals(n.val, target)) return true;
}
```

There is no `free`: once nothing refers to a node, the garbage collector reclaims it.

## What is special or tricky

- **`NullPointerException`** is the classic crash: following `next` past the last node, or reading `head.val` on an empty list. Java 21 names the culprit, as in `Cannot read field "val" because "head" is null`. Check for `null` first.
- **Java passes references by value.** `head = head.next` inside a helper method changes only its local copy. Return the new head, or keep it in a field of a list object.
- **Compare values with `equals`, nodes with `==`.** On `Integer` values, `==` compares the boxes and only seems to work between -128 and 127, the range the JDK caches.
- **Order of rewiring matters.** Overwrite `node.next` before saving it and the rest of the chain is lost.
- **Mind the name.** `java.util.LinkedList` is a doubly linked list. Call yours `SinglyLinkedList`, so it never fights an import over the name.
- **Deep recursion fails.** A recursive walk over a million nodes throws `StackOverflowError`. Use loops.

## What you will practise

You will push and pop at the head, build a `SinglyLinkedList<T>` with a tail reference, a size counter and an `Iterator`, and delete values with a dummy node. The challenge asks for a complete list class whose `reverse` rewires a million nodes in place.
'''

[[unit.step]]
kind = "concept"
id = "java-u30-c1-nodes"
title = "Nodes, references and null"
points = 5
difficulty = 30
intro = '''
A node holds a value and a reference to the next node, and `null` marks the end. The list
itself is nothing more than a reference to its first node, the head.
'''
body = '''
## The node

```java
class Node<T> {
    T val;
    Node<T> next;
    Node(T val, Node<T> next) { this.val = val; this.next = next; }
}
```

`next` refers to another `Node<T>`, or is `null` when there is no next node. An empty list is
a head that is `null`.

## Push to the front

Create a node whose `next` is the current head, then move the head to it. No element moves,
so this is O(1) however long the list is:

```java
head = new Node<>(v, head);
```

## Walk the list

Follow `next` from the head until you reach `null`:

```java
for (Node<T> n = head; n != null; n = n.next) {
    System.out.println(n.val);
}
```

## Pop the front

Popping is the mirror image of pushing: remember the value, then move the head one node on.
The old first node is no longer referenced, and the garbage collector frees it.

```java
T val = head.val;
head = head.next;
```

Pushing to the front reverses insertion order: the last value pushed is the first one you
meet when walking. Appending to the end is the opposite story. Without a second reference to
the last node you must walk the whole list to find it, which is O(n). Keeping a `tail`
reference, as the second drill does, makes appends O(1) again. Every linked-list operation is
some combination of these three moves: create a node, follow `next`, and rewire `next`.
'''

