[[unit.step]]
kind = "drill"
id = "java-u20-d3-comparator-chain"
title = "Comparator chains"
points = 10
difficulty = 20
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
A `Comparator` is an ordering as a value: you can build one from a key extractor, add
tie-breakers with `thenComparing`, and reverse it. Because `List.sort` is stable, ties that no
key separates keep their original order.
'''
prompt = '''
Sort employees by department, then salary from highest to lowest, then name, using one chained
`Comparator`; then find the top earner with `max` and sort by name in reverse.

**Why:** report screens and APIs sort by several columns all the time, and a comparator chain
says it in one readable expression instead of a hand-written `compare`.
'''
target = '''
import java.util.ArrayList;
import java.util.Comparator;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        List<Employee> staff = new ArrayList<>(List.of(
                new Employee("Rui", "ops", 3200),
                new Employee("Bea", "dev", 4100),
                new Employee("Ana", "dev", 4100),
                new Employee("Zoe", "dev", 5000),
                new Employee("Ivo", "ops", 3900)));

        Comparator<Employee> order = Comparator.comparing(Employee::dept)
                .thenComparing(Employee::salary, Comparator.reverseOrder())
                .thenComparing(Employee::name);
        staff.sort(order);
        staff.forEach(e -> System.out.println(e.dept() + " " + e.salary() + " " + e.name()));

        Employee top = staff.stream().max(Comparator.comparingInt(Employee::salary)).orElseThrow();
        System.out.println("top: " + top.name());

        staff.sort(Comparator.comparing(Employee::name).reversed());
        System.out.println(staff.get(0).name() + " ... " + staff.get(staff.size() - 1).name());
    }
}

record Employee(String name, String dept, int salary) {}
'''
