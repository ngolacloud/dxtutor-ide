snapshot. Both reject writes, but only the snapshot is isolated from changes to the source,
which is the difference between "read-only" and "immutable".
'''
prompt = '''
Wrap a list in an unmodifiable view and copy it with `List.copyOf`, change the source, try to
write through the view, give `List.of` a `null`, and add to a `final` list.

**Why:** these four behaviours are what the words "read-only", "immutable" and `final` actually
mean, and mixing them up is how internal state leaks.
'''
target = '''
import java.util.ArrayList;
import java.util.Collections;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        List<String> source = new ArrayList<>(List.of("a", "b"));
        List<String> view = Collections.unmodifiableList(source);
        List<String> copy = List.copyOf(source);

        source.add("c");
        System.out.println("source " + source);
        System.out.println("view   " + view);
        System.out.println("copy   " + copy);

        try {
            view.add("d");
        } catch (UnsupportedOperationException e) {
            System.out.println("view.add -> UnsupportedOperationException");
        }
        try {
            List.of("x", null);
        } catch (NullPointerException e) {
            System.out.println("List.of rejects null");
        }

        final List<String> fixed = new ArrayList<>();
        fixed.add("still mutable");
        System.out.println(fixed);
    }
}
