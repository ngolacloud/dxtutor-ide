[[unit.step]]
kind = "drill"
id = "java-u09-d2-encapsulation"
title = "Private state and validation"
points = 10
difficulty = 9
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
Encapsulation means the only way to change an object's state is through methods that check
the change first. If every write goes through one validating method, the invariant holds for
the object's whole lifetime, including during construction.
'''
prompt = '''
Write a `Thermostat` whose target temperature is `private` and must stay between 5 and 30
degrees. Every change, including the one in the constructor, goes through `setTarget`.

**Why:** a class that validates in one place cannot be put into a bad state, no matter who
calls it; this is the core habit of object-oriented design.
'''
target = '''
public class Main {
    public static void main(String[] args) {
        Thermostat t = new Thermostat(20.0);
        t.raise(2.5);
        System.out.println("target " + t.target());
        try {
            t.setTarget(45.0);
        } catch (IllegalArgumentException e) {
            System.out.println("rejected: " + e.getMessage());
        }
        System.out.println("still " + t.target());
    }
}

class Thermostat {
    static final double MIN = 5.0;
    static final double MAX = 30.0;
    private double target;

    Thermostat(double target) {
        setTarget(target);
    }

    double target() {
        return target;
    }

    void setTarget(double value) {
        if (value < MIN || value > MAX) {
            throw new IllegalArgumentException(value + " is outside " + MIN + ".." + MAX);
        }
        target = value;
    }

    void raise(double delta) {
        setTarget(target + delta);
    }
}
'''
