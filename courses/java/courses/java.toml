[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.List;

public class Chunks {
    public static List<List<Integer>> chunk(List<Integer> items, int size) {
        if (size < 1) {
            throw new IllegalArgumentException("size must be at least 1, got " + size);
        }
        List<List<Integer>> chunks = new ArrayList<>();
        for (int start = 0; start < items.size(); start += size) {
            int end = Math.min(start + size, items.size());
            chunks.add(new ArrayList<>(items.subList(start, end)));
        }
        return chunks;
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
The loop advances `start` by `size` each time, so it runs `ceil(n / size)` times, and each
iteration copies exactly the `end - start` elements of its chunk. Every element is copied
once in total, so the time is **O(n)** for a list of `n` elements (on an `ArrayList`,
`subList` and its reads are O(1) per element). The result holds a copy of every element plus
one small list object per chunk, so the extra space is **O(n)**.

The copy is not optional decoration. `subList` returns a *view* that shares the caller's
backing array: returning views would be O(n / size) space, but the chunks would change when
the caller edits their list, and a structural change such as `add` would make every view
throw `ConcurrentModificationException`. Clamping with `Math.min(start + size, n)` handles
the short last chunk, and a `size` larger than the list ends the loop after the first chunk,
which is why even `Integer.MAX_VALUE` works.
'''

[[unit]]
id = "java-u08-maps-sets"
title = "Maps and sets"
level = "intermediate"
difficulty = 8
intro = '''
Lists answer "what is at position 3?"; maps and sets answer "what belongs to this key?" and
"have I seen this before?", in O(1) on average. This unit covers `HashMap` and `HashSet`,
the `getOrDefault`, `merge` and `computeIfAbsent` idioms for counting and grouping, and why
hash-based collections have no order. The challenge groups anagrams with a map.
'''
concepts = '''
## The idea

Many questions are not about positions at all. What does a coffee cost? How many times does
the word "the" appear? Has this user already voted? A **map** stores **key → value** pairs
with unique keys, and a **set** stores unique values. Searching a list for the answer costs
O(n); a **hash table** answers in O(1) on average. It calls the key's `hashCode()` to get a
number, turns that number into a **bucket** index in an internal array, and compares only the
few keys in that bucket with `equals`. When the table fills up, it doubles its array and
redistributes the entries, so inserting stays O(1) amortised.

## How Java does it

`HashMap<K, V>` and `HashSet<E>` are the everyday hash-based implementations. Declare
variables with the interfaces `Map` and `Set`, so you can swap the implementation later.

```java
Map<String, Integer> stock = new HashMap<>();
stock.put("apple", 3);
stock.put("apple", 5);                    // same key: replaces the value, size stays 1
int pears = stock.getOrDefault("pear", 0);

Set<String> tags = new HashSet<>();
boolean added = tags.add("java");         // false if "java" was already present
```

`get` returns `null` for a missing key, which is why `getOrDefault` exists. Counting and
grouping have dedicated methods. `merge(key, 1, Integer::sum)` stores 1 for a new key and
otherwise adds 1 to the current value; `computeIfAbsent(key, k -> new ArrayList<>())` creates
a missing list before you add to it, and returns the list either way. Walk a map with
`for (Map.Entry<String, Integer> e : map.entrySet())` and read `e.getKey()` and
`e.getValue()`; `keySet()` and `values()` give the keys or the values alone.

## What is special or tricky

- **No order.** A `HashMap` or `HashSet` iterates in an order that depends on hashes and
  capacity, and it can change as the table grows. Never rely on it. `TreeMap`/`TreeSet` keep
  keys sorted, and `LinkedHashMap`/`LinkedHashSet` keep insertion order.
- **Unboxing a missing value crashes.** `int n = map.get("missing");` throws
  `NullPointerException`, because `null` cannot become an `int`.
- **Keys need consistent `equals` and `hashCode`.** Strings, boxed numbers and records have
  them. A class of your own compares by identity until unit 20 shows how to override both.
- **Never mutate an object while it is a key**: its hash changes and the entry is lost in the
  wrong bucket.
- **`Map.of` and `Set.of` are unmodifiable**, reject `null`, and throw
  `IllegalArgumentException: duplicate element` when given the same element twice.
- **Changing a map while looping over it** throws `ConcurrentModificationException`; use
  `map.entrySet().removeIf(...)` instead.

## What you will practise

You will store, look up and replace values, print a map in sorted order, combine sets with
union, intersection and difference, and count and group words. The challenge groups
anagrams under a key built from each word's sorted letters.
'''

[[unit.step]]
kind = "concept"
id = "java-u08-c1-hashing"
title = "Keys, buckets and hashing"
points = 5
difficulty = 8
intro = '''
A hash table turns a key into an array index with a hash function, so a lookup jumps almost
straight to the right place instead of scanning. Collisions, two keys in the same bucket, are
resolved by comparing the few candidates with `equals`.
'''
body = '''
## From key to bucket

Every Java object has a `hashCode()`, an `int` computed from its contents. A `HashMap` keeps
an array of buckets and puts each entry in bucket `hash % capacity` (Java uses a fast
bit-mask variant). To find a key later it recomputes the hash, goes to that one bucket, and
checks the entries there with `equals`.

```java
Map<String, Integer> ages = new HashMap<>();
ages.put("ada", 36);       // hash("ada") picks a bucket
ages.get("ada");           // same hash, same bucket: 36
ages.get("bob");           // a bucket with no "bob": null
```

With a good hash function the buckets stay short, so `put`, `get`, `containsKey` and
`remove` all take **O(1) on average**. When the table is three-quarters full it doubles its
array and re-buckets every entry; that occasional O(n) resize spreads out to O(1) amortised
per insert.

## A set is a map without values

`HashSet` is implemented as a `HashMap` whose values are ignored. That is why `add`,
`contains` and `remove` on a set are O(1) on average, while `contains` on a `List` is O(n).

## The contract

Two keys that are `equals` must return the same `hashCode`, or the map looks in the wrong
bucket and reports a key as missing. `String`, `Integer` and records honour this contract
already. Because the bucket order follows the hashes, iterating a `HashMap` gives no
meaningful order: copy it into a `TreeMap` when you want sorted output.
'''

