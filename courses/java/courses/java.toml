[[unit.step]]
kind = "drill"
id = "java-u12-d2-try-with-resources"
title = "try-with-resources and suppressed exceptions"
points = 10
difficulty = 12
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
A resource such as a file, socket or database connection must be closed even when the work
fails. Try-with-resources calls `close()` on every resource in **reverse** order of opening.
If `close()` also throws, that second exception is attached to the first as a **suppressed**
exception instead of replacing it.
'''
prompt = '''
Open two resources in one `try`, fail while using them, and print the order of events and the
suppressed exception.

**Why:** this is the guarantee that makes try-with-resources better than a hand-written
`finally`: nothing leaks, and no exception is silently lost.
'''
target = '''
public class Main {
    public static void main(String[] args) {
        try (Resource db = new Resource("db"); Resource file = new Resource("file")) {
            System.out.println("using " + db.name + " and " + file.name);
            throw new IllegalStateException("work failed");
        } catch (IllegalStateException e) {
            System.out.println("caught: " + e.getMessage());
            for (Throwable s : e.getSuppressed()) {
                System.out.println("suppressed: " + s.getMessage());
            }
        }
    }
}

class Resource implements AutoCloseable {
    final String name;

    Resource(String name) {
        this.name = name;
        System.out.println("open " + name);
    }

    @Override
    public void close() {
        System.out.println("close " + name);
        if (name.equals("file")) {
            throw new IllegalArgumentException("could not close " + name);
        }
    }
}
'''
