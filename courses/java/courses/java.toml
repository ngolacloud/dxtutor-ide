[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.Arrays;
import java.util.HashMap;
import java.util.List;
import java.util.Locale;
import java.util.Map;

public class Anagrams {
    public static String key(String word) {
        char[] letters = word.toLowerCase(Locale.ROOT).toCharArray();
        Arrays.sort(letters);
        return new String(letters);
    }

    public static Map<String, List<String>> group(List<String> words) {
        Map<String, List<String>> groups = new HashMap<>();
        for (String word : words) {
            groups.computeIfAbsent(key(word), k -> new ArrayList<>()).add(word);
        }
        return groups;
    }
}
'''
time = "O(n · k log k)"
space = "O(n · k)"
justification = '''
For `n` words of at most `k` characters, `key` copies a word (O(k)) and sorts its letters
(O(k log k)), and building the result string is O(k) again. `group` calls `key` once per word,
then does one hash lookup on a key of length `k`: hashing and comparing a string is O(k), and
the lookup is O(1) on average in the number of entries. `add` on an `ArrayList` is amortised
O(1). The total is **O(n · k log k)** time.

The map stores one key per group and every input word exactly once across the lists, so the
extra space is **O(n · k)** in the worst case (every word its own group). The naive
alternative, comparing each word with every group already found, costs O(n²) comparisons;
the canonical key is what turns the problem into a single pass. A counting key (26 letter
counts) would make `key` O(k), but sorting is simpler and handles any characters.
'''

[[unit]]
id = "java-u09-classes"
title = "Classes and objects"
level = "intermediate"
difficulty = 9
intro = '''
Java is built around classes: blueprints that bundle data (fields) with the code that works
on it (methods). This unit covers objects and references, constructors and `this`, `private`
fields that protect an invariant, and the difference between static and instance members.
The challenge is a bank account whose balance can never go negative.
'''
concepts = '''
## The idea

So far your data has lived in loose variables passed to static methods. As programs grow,
data and the operations on it belong together. A **class** is a blueprint that declares
**fields** (the state) and **methods** (the behaviour). An **object** is one instance built
from that blueprint, with its own copy of every instance field: ten `BankAccount` objects
share one class but hold ten balances. A class also decides **who may touch its state**. By
hiding the fields and exposing only methods, it can guarantee a rule such as "the balance is
never negative". Such a rule is an **invariant**, and protecting it is the point of
**encapsulation**.

## How Java does it

```java
public class Counter {
    private int count;                  // a field: each object has its own
    private final String label;         // final: assigned exactly once

    public Counter(String label) {      // a constructor: class name, no return type
        this.label = label;             // this.label is the field, label the parameter
    }

    public void increment() { count++; }
    public int count() { return count; }
}

Counter clicks = new Counter("clicks"); // new allocates and runs the constructor
clicks.increment();
```

Fields start at default values (`0`, `false`, `null`) before the constructor runs. Access
modifiers set visibility: `private` (this class only), no modifier (the same package),
`protected` (also subclasses) and `public` (everyone). A **`static`** member belongs to the
class itself rather than to any object: `Math.max` needs no object, and a `static int
created` field is one counter shared by every instance. Inside a constructor, `this(...)`
calls another constructor of the same class, which keeps validation in one place.

## What is special or tricky

- **Variables hold references.** `Counter a = b;` copies the reference, not the object, so
  both names now see the same counter.
- **Calling a method on `null`** throws `NullPointerException`, often the sign of a field
  that was never initialised.
- **Declaring a constructor removes the free default one.** After `Counter(String label)`
  exists, `new Counter()` fails with `constructor Counter in class Counter cannot be applied
  to given types`.
- **Static code has no `this`.** Reading an instance field from `main` gives
  `non-static variable count cannot be referenced from a static context`.
- **Shadowing.** In a constructor whose parameter is also named `count`, the line
  `count = count;` assigns the parameter to itself and the field stays 0. Write
  `this.count = count`.
- **`private` is per class, not per object.** A `BankAccount` method may read another
  account's private balance, which is handy for a transfer.
- **Printing an object** without a `toString` method shows something like
  `Counter@6d06d69c`.

## What you will practise

You will write classes with fields, constructors and methods, see two variables share one
object, guard state with `private` fields and validation, and mix static and instance
members. The challenge asks for a bank account that enforces its own rules.
'''

[[unit.step]]
kind = "concept"
id = "java-u09-c1-objects"
title = "Objects, references and invariants"
points = 5
difficulty = 9
intro = '''
An object is a block of memory on the heap that holds its fields, plus a pointer to its
class. A variable of a class type never holds the object itself, only a reference to it, so
copying a variable shares the object instead of duplicating it.
'''
body = '''
## Creating an object

```java
Point p = new Point(3, 4);
```

`new` asks the JVM for memory on the **heap**, sets every field to its default value, runs
the constructor, and returns a **reference** to the new object. The variable `p` stores that
reference. Assigning `Point q = p;` copies the reference: `p` and `q` now name the same
object, and a change made through one is visible through the other. Objects are freed by the
garbage collector once nothing refers to them; there is no `delete`.

## Methods act on one object

```java
class Point {
    int x, y;
    Point(int x, int y) { this.x = x; this.y = y; }
    void move(int dx, int dy) { x += dx; y += dy; }
}
```

Inside an instance method, `this` is the object the method was called on. `p.move(1, 0)`
runs `move` with `this == p`, so `x` means `p.x`.

## Encapsulation protects invariants

If `x` were a balance that must never go negative, a public field would let any line of the
program break that rule. Making the field `private` and changing it only through methods
that check their arguments puts the rule in one place:

```java
private long balance;
public void deposit(long cents) {
    if (cents <= 0) throw new IllegalArgumentException("deposit must be positive");
    balance += cents;
}
```

Now the class itself guarantees its invariant, however many objects exist and whoever
calls them.
'''

