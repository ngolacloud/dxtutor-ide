[[unit.step]]
kind = "challenge"
id = "java-u06-x1-math-utils"
title = "Implement the MathUtils helpers"
points = 20
difficulty = 6
entry = "MathUtils"
intro = '''
Small, well-specified helpers are the building blocks of every code base. Here overloading
gives one operation, clamping, a version per numeric type, input validation enforces each
method's contract, and pass-by-value lets a `void` method edit an array the caller owns.
'''
instructions = '''
## Your turn

Complete the class `MathUtils` with three `static` methods:

```java
static int clamp(int value, int min, int max)
static double clamp(double value, double min, double max)
static void swapEnds(int[] values)
```

- Both `clamp` overloads return `value` limited to the range `[min, max]`: `min` if the value
  is below it, `max` if it is above it, and the value itself otherwise. If `min > max`, the
  range makes no sense, so throw an `IllegalArgumentException`.
- `swapEnds` swaps the first and the last element of the array **in place** and returns
  nothing. An empty array or an array of one element is left as it is.

Examples:

- `MathUtils.clamp(15, 0, 10)` → `10` (an `int`)
- `MathUtils.clamp(-5, 0, 10)` → `0`
- `MathUtils.clamp(0.25, 0.0, 1.0)` → `0.25` (a `double`)
- `MathUtils.clamp(3, 5, 1)` throws `IllegalArgumentException`
- after `int[] a = {1, 2, 3, 4}; MathUtils.swapEnds(a);`, `a` is `{4, 2, 3, 1}`

Notes:

- The tests check the **type** of each result, so `clamp(15, 0, 10)` must use the `int`
  overload and return the `int` `10`, not the `double` `10.0`.
- `values.length` is the number of elements, and `values[i]` reads or writes element `i`.
  The last element is at index `values.length - 1`.

Hidden tests decide correctness.
'''
starter = '''
// MathUtils: overloaded, validating helpers.
public class MathUtils {

    // value limited to [min, max]; throw IllegalArgumentException if min > max.
    static int clamp(int value, int min, int max) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The same contract for doubles.
    static double clamp(double value, double min, double max) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Swap the first and last elements in place; arrays shorter than 2 stay as they are.
    static void swapEnds(int[] values) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
tests = '''
test("int clamp inside the range", () -> {
    equal(MathUtils.clamp(5, 0, 10), 5);
    equal(MathUtils.clamp(0, 0, 10), 0);
    equal(MathUtils.clamp(10, 0, 10), 10);
});
test("int clamp outside the range", () -> {
    equal(MathUtils.clamp(-5, 0, 10), 0);
    equal(MathUtils.clamp(15, 0, 10), 10);
    equal(MathUtils.clamp(Integer.MAX_VALUE, -1, 1), 1);
    equal(MathUtils.clamp(Integer.MIN_VALUE, -1, 1), -1);
});
test("int clamp with negative and single-point ranges", () -> {
    equal(MathUtils.clamp(0, -10, -5), -5);
    equal(MathUtils.clamp(7, 3, 3), 3);
});
test("double clamp", () -> {
    equal(MathUtils.clamp(0.25, 0.0, 1.0), 0.25);
    equal(MathUtils.clamp(2.5, 0.0, 1.0), 1.0);
    equal(MathUtils.clamp(-0.5, 0.0, 1.0), 0.0);
    equal(MathUtils.clamp(-3.75, -10.0, -1.5), -3.75);
});
test("each overload returns its own type", () -> {
    Object whole = MathUtils.clamp(15, 0, 10);
    Object decimal = MathUtils.clamp(15.0, 0.0, 10.0);
    check(whole instanceof Integer, "clamp(int, int, int) must return an int");
    check(decimal instanceof Double, "clamp(double, double, double) must return a double");
});
test("invalid ranges are rejected", () -> {
    assertThrows(IllegalArgumentException.class, () -> MathUtils.clamp(3, 5, 1));
    assertThrows(IllegalArgumentException.class, () -> MathUtils.clamp(0.5, 1.0, 0.0));
});
test("swapEnds on four elements", () -> {
    int[] a = {1, 2, 3, 4};
    MathUtils.swapEnds(a);
    equal(a, new int[] {4, 2, 3, 1});
