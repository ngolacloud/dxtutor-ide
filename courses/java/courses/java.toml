`ConcurrentModificationException` on purpose and catch it.

**Why:** "delete while walking" is a classic bug. Seeing both the safe way and the fail-fast
error makes the rule stick.
'''
target = '''
import java.util.ArrayList;
import java.util.ConcurrentModificationException;
import java.util.Iterator;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        List<Integer> numbers = new ArrayList<>(List.of(4, 7, 10, 13, 16));
        Iterator<Integer> it = numbers.iterator();
        while (it.hasNext()) {
            int n = it.next();
            if (n % 2 == 0) {
                it.remove();
            }
        }
        System.out.println(numbers);

        try {
            for (Integer n : numbers) {
                if (n == 7) {
                    numbers.add(99);
                }
            }
        } catch (ConcurrentModificationException e) {
            System.out.println("fail-fast: " + e.getClass().getSimpleName());
        }
    }
}
'''
