test("swapEnds on two elements and with duplicates", () -> {
    int[] two = {1, 2};
    MathUtils.swapEnds(two);
    equal(two, new int[] {2, 1});
    int[] same = {7, 0, 7};
    MathUtils.swapEnds(same);
    equal(same, new int[] {7, 0, 7});
});
test("swapEnds leaves short arrays alone", () -> {
    int[] empty = {};
    MathUtils.swapEnds(empty);
    equal(empty, new int[] {});
    int[] one = {42};
    MathUtils.swapEnds(one);
    equal(one, new int[] {42});
});
test("swapEnds twice restores a large array", () -> {
    int[] big = new int[100_000];
    for (int i = 0; i < big.length; i++) big[i] = i;
    MathUtils.swapEnds(big);
    equal(big[0], 99_999);
    equal(big[99_999], 0);
