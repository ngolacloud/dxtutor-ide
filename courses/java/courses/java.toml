[unit.step.gabarito]
solution = '''
import java.io.IOException;
import java.nio.file.Files;
import java.nio.file.Path;
import java.nio.file.StandardCopyOption;
import java.util.List;
import java.util.stream.Stream;

public class FileTools {
    static long totalSize(Path dir) throws IOException {
        List<Path> files;
        try (Stream<Path> paths = Files.walk(dir)) {
            files = paths.filter(Files::isRegularFile).toList();
        }
        long total = 0;
        for (Path file : files) {
            total += Files.size(file);
        }
        return total;
    }

    static List<String> findByExtension(Path dir, String ext) throws IOException {
        String suffix = "." + ext;
        try (Stream<Path> paths = Files.walk(dir)) {
            return paths.filter(Files::isRegularFile)
                    .filter(p -> p.getFileName().toString().endsWith(suffix))
                    .map(p -> dir.relativize(p).toString().replace('\\', '/'))
                    .sorted()
                    .toList();
        }
    }

    static Path backup(Path file) throws IOException {
        Path target = file.resolveSibling(file.getFileName() + ".bak");
        return Files.copy(file, target, StandardCopyOption.REPLACE_EXISTING);
    }
}
'''
time = "O(n log n) for the search, O(n) for the size, O(b) for the backup"
space = "O(n)"
justification = '''
Let `n` be the number of entries (files and directories) under `dir`, and `b` the size of the
file being backed up.

`totalSize` walks the tree once, which visits each entry exactly once: **O(n)** file-system
calls. Collecting the regular files first costs **O(n)** memory, but it lets the stream be closed
before the loop and lets `Files.size` throw its checked `IOException` normally, which a lambda
could not do.

`findByExtension` is the same walk plus a filter and a `relativize` per file, then a sort of the
`m ≤ n` matching names, so it is **O(n + m log m)**, which is O(n log n) in the worst case, and
**O(m)** memory for the result. Sorting is necessary because directory order depends on the
file system. Replacing the Windows separator `\` with `/` keeps the result identical on every system.

`backup` is a single `Files.copy`, which reads and writes the `b` bytes once: **O(b)** time and
constant extra memory in our code. `REPLACE_EXISTING` makes a second backup overwrite the first
instead of throwing `FileAlreadyExistsException`, and a missing source surfaces as
`NoSuchFileException` before any target is created. Every stream is opened in
try-with-resources, so no directory handle outlives the call.
'''

[[unit]]
id = "java-u19-text-regex"
title = "Text processing and regular expressions"
level = "intermediate"
difficulty = 19
intro = '''
Logs, CSV exports, configuration lines and user input all arrive as text that a program has to
take apart. This unit covers `split` and its surprising edge cases, regular expressions with
`Pattern` and `Matcher`, search-and-replace with groups, and ends with a CSV parser that
handles quoted fields, the case a naive `split(",")` gets wrong.
'''
concepts = '''
## The idea

Parsing means turning a flat string into structure: fields, numbers, key-value pairs. The
simplest tool is **splitting** on a delimiter. When the format is richer, a **regular
expression** (regex) describes the shape of the text in a small pattern language: `\d{4}` is
"four digits", `\s+` is "one or more whitespace characters", `(…)` captures a part for later.
When even that is not enough, as with quoted CSV fields, you write a tiny **state machine** that
reads one character at a time.

## How Java does it

`String.split` takes a **regex**, not a plain string:

```java
"a, b,c".split("\\s*,\\s*");   // [a, b, c]
"x|y".split(Pattern.quote("|"));  // [x, y]; a bare "|" would split everywhere
```

For repeated use, compile the pattern once and ask a `Matcher` about each input:

```java
private static final Pattern KV = Pattern.compile("(?<key>\\w+)=(?<value>\\S+)");
Matcher m = KV.matcher(line);
while (m.find()) {
    System.out.println(m.group("key") + " -> " + m.group("value"));
}
```

`matches()` asks whether the **whole** input fits the pattern, `find()` looks for the next
match **anywhere** in it, and `group` returns what a set of parentheses captured, by number or
by `(?<name>…)`. `replaceAll` can reuse groups as `$1` or `${name}`, and `Matcher.results()`
streams all matches.

## Pitfalls

- **Escaping twice.** The regex `\d` must be written `"\\d"` in a Java string, because the
  compiler consumes one backslash. An invalid pattern throws `PatternSyntaxException` at run time.
- **Metacharacters.** `.`, `|`, `+`, `(` and `$` mean something in a regex. `"1.2.3".split(".")`
  returns an empty array, because every character is a delimiter. Escape them or use
  `Pattern.quote`; `String.replace` (no `All`) is a plain-text replacement.
- **Trailing empty fields vanish.** `"a,b,,".split(",")` has length 2. Pass a limit of `-1` to
  keep them: `split(",", -1)` has length 4. And `"".split(",")` has length 1, not 0.
- **`group` before `find`.** Calling `m.group()` before a successful `find()` or `matches()`
  throws `IllegalStateException: No match found`.
- **Line endings.** Files from Windows use `\r\n`; split on `"\\R"`, which matches any line break.
- **Compile once.** `String.matches` and `String.split` compile their pattern on every call. In
  a loop over a million lines, keep a `static final Pattern`.

## What you will practise

You will meet `split`'s edge cases, extract key-value pairs with named groups, and rewrite text
with `replaceAll`. The challenge is a CSV reader: a character-by-character parser for one line,
with quoted fields and escaped quotes, and a function that turns a whole document into records.
'''

[[unit.step]]
kind = "concept"
id = "java-u19-c1-patterns"
title = "Patterns are tiny programs"
points = 5
difficulty = 19
intro = '''
A regular expression is a small program for a matching engine: it describes a set of strings,
and the engine searches the input for members of that set. Most of its syntax is a handful of
building blocks combined with repetition.
'''
body = '''
## The building blocks

| Pattern | Matches |
|---|---|
| `abc` | the literal text `abc` |
| `.` | any one character (except a line break) |
| `\d` `\w` `\s` | a digit, a word character, a whitespace character |
| `[a-z]` `[^,]` | one character from a set, or not in it |
| `x*` `x+` `x?` `x{2,4}` | zero or more, one or more, optional, 2 to 4 times |
| `^` `$` `\b` | start, end, word boundary |
| `(…)` `(?<name>…)` | a captured group, numbered or named |

A vertical bar separates alternatives: `cat|dog` matches either word. In Java source every backslash is doubled: the pattern `\d+` is the string `"\\d+"`.

## Whole or part

`Pattern.compile(p).matcher(s).matches()` succeeds only if **all** of `s` fits `p`: use it to
validate input. `find()` succeeds if **some part** of `s` fits, and can be called again to find
the next match: use it to extract.

## Greedy by default

`.*` and `.+` take as much as they can and then back off. Against `<a><b>`, the pattern `<.*>`
matches the whole string; the reluctant `<.*?>` matches just `<a>`. Prefer a precise class such
as `[^>]*` when you can: it is clearer and faster.

## Know when to stop

Regexes are excellent for tokens: dates, ids, key-value pairs. They are poor at nested or
stateful formats such as quoted CSV, JSON or HTML. There, a short loop over the characters,
remembering whether you are inside quotes, is simpler and correct.
'''

