'''
prompt = '''
Sum every number in a nested list and measure how deeply its lists are nested, using a
recursive pattern-matching `switch`.

**Why:** when the data is recursive, the code that walks it is naturally recursive too, and
each `case` is either a base case or a call on a smaller part.
'''
target = '''
import java.util.List;

public class Main {
    public static void main(String[] args) {
        List<Object> data = List.of(1, List.of(2, 3), List.of(List.of(4), List.of()), 5);
        System.out.println("sum " + sum(data) + ", depth " + depth(data));
    }

    static int sum(Object item) {
        return switch (item) {
            case Integer n -> n;
            case List<?> list -> {
                int total = 0;
                for (Object child : list) total += sum(child);
                yield total;
            }
            default -> throw new IllegalArgumentException("not a number or list: " + item);
        };
    }

    static int depth(Object item) {
        if (!(item instanceof List<?> list)) return 0;
        int deepest = 0;
        for (Object child : list) deepest = Math.max(deepest, depth(child));
        return 1 + deepest;
    }
}
'''
