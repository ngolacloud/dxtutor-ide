[[unit.step]]
kind = "challenge"
id = "java-u22-x1-expressions"
title = "Evaluate, print and simplify expressions"
points = 40
difficulty = 22
entry = "Exprs"
intro = '''
Expression trees are the textbook algebraic data type: compilers, query planners and
spreadsheet engines all represent formulas this way. Each operation is a recursive function
over the variants, and simplification is pattern matching on the *shape* of a subtree, which
is exactly what nested record patterns are for.
'''
instructions = '''
## Your turn

The starter declares a sealed expression type. Don't change it:

```java
sealed interface Expr permits Num, Var, Add, Mul, Neg {}
record Num(long value) implements Expr {}
record Var(String name) implements Expr {}
record Add(Expr left, Expr right) implements Expr {}
record Mul(Expr left, Expr right) implements Expr {}
record Neg(Expr operand) implements Expr {}
```

Implement the three static methods of `class Exprs`:

```java
static long eval(Expr e, Map<String, Long> env)
static String show(Expr e)
static Expr simplify(Expr e)
```

- **`eval`** computes the value of `e` with `long` arithmetic. A `Var` takes its value from
  `env`; if the name is missing, throw `IllegalArgumentException`.
- **`show`** renders the tree: a `Num` as its number (`-5` for a negative one), a `Var` as its
  name, `Add` as `(a + b)`, `Mul` as `(a * b)` and `Neg` as `-a`.
  `show(new Add(new Var("x"), new Mul(new Num(2), new Num(3))))` is `"(x + (2 * 3))"`.
- **`simplify`** returns a new tree. Simplify the children first, then apply the first rule
  that matches the node, or keep it unchanged:
  - `Add` or `Mul` of two `Num`s becomes one `Num` (constant folding);
  - `x + 0` and `0 + x` become `x`;
  - `x * 0` and `0 * x` become `Num(0)`;
  - `x * 1` and `1 * x` become `x`;
  - `-Num(n)` becomes `Num(-n)`, and `--x` (a `Neg` of a `Neg`) becomes `x`.

  For example `Mul(Add(Num 1, Num 1), Var x)` simplifies to `Mul(Num 2, Var x)`, and
  `Add(Mul(Num 1, Var x), Num 0)` to `Var x`.

Use exhaustive `switch` expressions with record patterns; the simplification rules map
directly to nested patterns such as `case Add(Num(long a), Num(long b))`. Trees can be a few
thousand levels deep, which recursion handles fine here.

Hidden tests decide correctness.
'''
starter = '''
