[unit.step.gabarito]
solution = '''
// NumberTheory: three classic loops. Every method must handle any int it is promised.
public class NumberTheory {

    // True when n > 1 and n has no divisor other than 1 and itself.
    static boolean isPrime(int n) {
        if (n < 2) {
            return false;
        }
        if (n % 2 == 0) {
            return n == 2;
        }
        for (int d = 3; d <= n / d; d += 2) {
            if (n % d == 0) {
                return false;
            }
        }
        return true;
    }

    // Sum of the decimal digits of n, ignoring the sign.
    static int digitSum(int n) {
        int sum = 0;
        while (n != 0) {
            sum += Math.abs(n % 10);
            n /= 10;
        }
        return sum;
    }

    // Greatest common divisor, never negative; gcd(0, 0) == 0.
    static int gcd(int a, int b) {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b != 0) {
            int remainder = a % b;
            a = b;
            b = remainder;
        }
        return a;
    }
}
'''
time = "O(√n) for isPrime, O(log n) for digitSum and gcd"
space = "O(1)"
justification = '''
**`isPrime`** tries divisors only while `d <= n / d`, that is while `d` is at most `√n`:
if `n` had a divisor larger than its square root, the matching co-divisor would be smaller
and would already have been found. Skipping even candidates halves the work but does not
change the growth, so the loop runs about `√n / 2` times: **O(√n)**. For
`Integer.MAX_VALUE` that is roughly 23,000 iterations, a fraction of a millisecond. Writing
the condition as `d * d <= n` would overflow once `d` passes 46,340, turning the product
negative, so the loop would keep going until `d` divides `n` itself and wrongly report the
prime as composite.

**`digitSum`** removes one decimal digit per iteration, and a number `n` has about
`log₁₀ n + 1` digits, so it runs in **O(log n)** time: at most 10 iterations for any `int`.
Keeping `n` negative and taking `Math.abs` of each remainder avoids `Math.abs(n)`, which
overflows for `Integer.MIN_VALUE`.

**`gcd`** is Euclid's algorithm. After two iterations the larger number has at least
halved, so the number of iterations is **O(log min(a, b))**. Consecutive Fibonacci numbers
are the worst case, and even they need fewer than 50 steps for `int` values.

All three keep only a few `int` variables, so the extra space is **O(1)**.
'''

[[unit]]
id = "java-u06-methods"
title = "Methods"
level = "basic"
difficulty = 6
intro = '''
A method gives a name to a piece of work so you can write it once and use it everywhere.
This unit covers `static` methods with parameters and return values, overloading (several
methods with one name), and the rule behind every argument in Java: values are always
passed by copy, even when the value is a reference to an object.
'''
concepts = '''
## The idea

As programs grow, the same steps appear again and again: compute an area, validate an
input, format a price. A **method** packages such steps under a name. Calling it runs the
steps; the caller does not need to know how they work, only what goes in and what comes
out. Methods make programs shorter, easier to test, and easier to change, because each
piece of logic lives in exactly one place.

## How Java does it

Every method lives inside a class. Its **header** (or **signature**, roughly) states the
return type, the name and the **parameters** with their types:

```java
static double circleArea(double radius) {
    return Math.PI * radius * radius;
}
```

`static` means the method belongs to the class itself, so you call it without creating an
object: `circleArea(2.0)` from inside the same class, or `Geometry.circleArea(2.0)` from
another class. The values you pass at the call are the **arguments**; inside the method
they arrive as the parameters. `return` ends the method and hands a value back. A method
that returns nothing has the return type `void`.

**Overloading** means several methods share one name but differ in their parameter lists.
The compiler picks the version whose parameters best match the arguments: an exact match
first, then one reachable by **widening** (such as `int` to `long` or `double`).

```java
static int max(int a, int b) { return a > b ? a : b; }
static double max(double a, double b) { return a > b ? a : b; }
```

## Pass by value

Java copies every argument into its parameter. For a primitive, the method receives a copy
of the number, so changing the parameter never affects the caller's variable. For an object
or an array, the value being copied is a **reference**: both the caller and the method now
point at the same object. The method can therefore **change the object** (set an array
element, append to a `StringBuilder`), but **reassigning** the parameter to a new object
only changes the method's own copy.

## What is special or tricky

- **Every path must return.** A non-`void` method that can reach its closing brace fails
  with `missing return statement`.
- **Calling from `main`.** `main` is `static`, so it can only call other methods directly
  if they are `static` too; otherwise `non-static method f() cannot be referenced from a
  static context`.
- **Wrong arguments** fail with `method f in class Main cannot be applied to given types`,
  listing what was required and what was found.
- **Return type alone does not overload.** Two methods with the same name and parameters
  fail with `method f(int) is already defined`.
- **Ambiguity.** If two overloads match equally well, the call fails with `reference to f
  is ambiguous`.

## What you will practise

You will split a program into small methods, call overloaded methods and predict which one
runs, and see pass-by-value with primitives, arrays and a `StringBuilder`. The challenge
asks for overloaded, validating helpers and a method that edits an array in place.
'''

[[unit.step]]
kind = "concept"
id = "java-u06-c1-contracts"
title = "A method is a small contract"
points = 5
difficulty = 6
intro = '''
A method's header is a contract: it promises what the method needs (its parameters) and what
it gives back (its return type). Callers rely only on that contract, which is what lets you
test a method on its own and later change its body without touching any caller.
'''
body = '''
## Anatomy of a method

```java
static int square(int x) {   // return type, name, parameter list
    return x * x;            // the value handed back
}
```

- **`static`**: the method belongs to the class; call it by name, no object needed.
- **`int`** before the name: the type of the value it returns (`void` if none).
- **`square`**: the name, a verb or a question, in `camelCase`.
- **`(int x)`**: the parameters, each with a type. A method may have none: `()`.

## What happens at a call

When `main` runs `int y = square(7);`, Java evaluates the argument `7`, copies it into a
fresh parameter `x`, and jumps into `square`. Its local variables live in a new
**stack frame**, a private workspace for this call. `return x * x;` computes `49`, the
frame is thrown away, and execution continues in `main` with `49` as the value of the call.

Because each call has its own frame, a method's local variables cannot clash with the
caller's, even when they share a name. That is also why changing `x` inside `square` could
never change anything in `main`.

## Designing good methods

- **One job per method.** If you need "and" to describe it, consider two methods.
- **Return results, print at the edges.** A method that returns a value can be tested and
  reused; one that prints can only be watched.
- **Validate inputs at the top.** Throw an `IllegalArgumentException` for arguments that
  break the contract, so a bad call fails loudly where it happens.

These habits are exactly what the hidden tests of every challenge reward.
'''

