[unit.step.gabarito]
solution = '''
// MathUtils: overloaded, validating helpers.
public class MathUtils {

    // value limited to [min, max]; throw IllegalArgumentException if min > max.
    static int clamp(int value, int min, int max) {
        if (min > max) {
            throw new IllegalArgumentException("min " + min + " is greater than max " + max);
        }
        return Math.max(min, Math.min(value, max));
    }

    // The same contract for doubles.
    static double clamp(double value, double min, double max) {
        if (min > max) {
            throw new IllegalArgumentException("min " + min + " is greater than max " + max);
        }
        return Math.max(min, Math.min(value, max));
    }

    // Swap the first and last elements in place; arrays shorter than 2 stay as they are.
    static void swapEnds(int[] values) {
        if (values.length < 2) {
            return;
        }
        int last = values.length - 1;
        int first = values[0];
        values[0] = values[last];
        values[last] = first;
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Each `clamp` overload performs one validation comparison and two more through `Math.min`
and `Math.max`, regardless of the values involved, so it runs in **O(1)** time and keeps
nothing but its parameters: **O(1)** space. The overloads exist so that callers keep their
numeric type: an `int` caller gets an `int` back with no cast, and the compiler chooses the
right version from the argument types before the program even runs.

`swapEnds` touches exactly two elements, however long the array is, so it is **O(1)** in
time too, even on the 100,000-element array in the tests. It needs one temporary variable,
`first`, to hold a value while the other is copied over it, so its extra space is **O(1)**.
It works on the caller's array because Java copies the **reference** into `values`: both
names refer to the same array object, so writes through `values` are visible to the caller
without returning anything. Returning early for arrays shorter than two elements avoids
reading index 0 of an empty array, which would throw `ArrayIndexOutOfBoundsException`.
'''

# ── g2-oop ────────────────────────────────────────────────────────────

[[unit]]
id = "java-u07-arrays-lists"
title = "Arrays and lists"
level = "intermediate"
difficulty = 7
intro = '''
Real programs handle many values at once, so this unit introduces Java's two everyday
sequences: the fixed-size **array** and the growable **`ArrayList`**. You will index, walk,
sort and copy them with the `Arrays` and `Collections` helpers, and learn why `List.of`
refuses to change. The challenge splits a list into fixed-size chunks.
'''
concepts = '''
## The idea

Most programs work with many values of the same kind: the scores of a game, the lines of a
file, the orders in a shop. A **sequence** keeps them in order and lets you reach each one by
its position, its **index**, counting from 0. Java gives you two everyday sequences. An
**array** is a block of slots created once, whose length never changes. A **list** such as
`ArrayList` grows on demand: it keeps an array inside and, when that array is full, allocates
one about 1.5 times larger and copies the elements across. That copy is rare enough that
appending costs O(1) on average, which is called **amortised** constant time. Reading or
replacing the element at an index is O(1) for both; inserting or removing in the middle of a
list is O(n), because every later element shifts by one slot.

## How Java does it

```java
int[] scores = new int[3];          // {0, 0, 0}: slots start at a default value
int[] primes = {2, 3, 5, 7};
System.out.println(primes.length);  // 4: a field, not a method
System.out.println(primes[0]);      // 2
```

An `int[]` stores the numbers themselves. A list holds only **objects**, so a
`List<Integer>` stores boxed `Integer` values and Java converts between `int` and `Integer`
automatically (**autoboxing**). The type in angle brackets is a **type argument**: the
compiler rejects `names.add(42)` on a `List<String>`.

```java
List<String> names = new ArrayList<>();   // the diamond <> infers <String>
names.add("Ada");
names.add(0, "Alan");                     // insert at index 0, shifting the rest right
String first = names.get(0);              // "Alan"
List<Integer> fixed = List.of(3, 1, 2);   // an unmodifiable list
```

The utility classes `Arrays` and `Collections` hold static helpers for the common jobs:
`Arrays.toString`, `Arrays.sort`, `Arrays.fill`, `Arrays.asList`, `Collections.sort`,
`Collections.max` and `Collections.reverse`. Walk a sequence with an index loop when you need
the position, or with the enhanced `for (String n : names)` when you only need the values.

## What is special or tricky

- **Out-of-range indexes fail at run time** with
  `ArrayIndexOutOfBoundsException: Index 4 out of bounds for length 4` (arrays) or
  `IndexOutOfBoundsException` (lists). Valid indexes run from 0 to `length - 1`.
- **`length`, `length()` and `size()`.** Arrays use the field `length`, strings the method
  `length()`, collections the method `size()`.
- **Printing an array directly** shows its type and identity, like `[I@1b6d3586`. Use
  `Arrays.toString`.
- **`List.of` is unmodifiable** and rejects `null`: `add`, `set` or `remove` throws
  `UnsupportedOperationException`. Copy it with `new ArrayList<>(list)` to change it.
- **`remove(int)` versus `remove(Object)`.** On a `List<Integer>`, `list.remove(1)` removes
  the element *at index 1*; `list.remove(Integer.valueOf(1))` removes the *value* 1.
- **Changing a list inside a for-each** over it throws `ConcurrentModificationException`.
  Use `removeIf` instead.
- **Primitives cannot be type arguments**: `List<int>` does not compile.

## What you will practise

You will create, index and sort arrays, grow and shrink an `ArrayList`, and use the
`List.of`, `Arrays` and `Collections` helpers. The challenge asks you to split a list into
chunks of a given size without touching the input.
'''

[[unit.step]]
kind = "concept"
id = "java-u07-c1-sequences"
title = "Arrays, lists and indexes"
points = 5
difficulty = 7
intro = '''
An array is one contiguous block of slots, so the address of element `i` is a simple
calculation and indexing is O(1). An `ArrayList` wraps such an array and replaces it with a
bigger one when it fills up, which is how it can grow while keeping O(1) indexing.
'''
body = '''
## Arrays: fixed size, fast access

```java
int[] counts = new int[5];         // five slots, all 0
String[] days = {"Mon", "Tue"};    // length fixed at 2
counts[2] = 7;                     // write by index
int n = days.length;               // 2
```

An array's length is chosen when it is created and never changes. Every slot holds a value
of the declared type, starting at the default (`0`, `false`, or `null` for objects). Because
the slots sit side by side in memory, the JVM finds `counts[i]` in constant time, and it
checks the index on every access: a bad one throws `ArrayIndexOutOfBoundsException`.

## Lists: a growable array

```java
List<String> todo = new ArrayList<>();
todo.add("write");                 // append at the end: amortised O(1)
todo.add(0, "plan");               // insert at the front: O(n), the rest shifts
todo.set(1, "test");               // replace by index: O(1)
String head = todo.get(0);         // "plan"
```

Declare the variable with the interface type `List` and pick the implementation with `new`.
The rest of your code then depends only on what a list can do, not on how it is stored.

## Which one?

Use an array when the size is known up front and fixed, for example the 26 letter counts of
an alphabet, or when you need primitive values without boxing. Use a `List` almost
everywhere else: it grows, it prints nicely, and the whole collections library speaks it.
'''

