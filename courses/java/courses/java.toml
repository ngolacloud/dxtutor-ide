[unit.step.gabarito]
solution = '''
import java.util.Objects;

class InsufficientFundsException extends Exception {
    private final long requested;
    private final long available;

    InsufficientFundsException(long requested, long available) {
        super("insufficient funds: requested " + requested + ", available " + available);
        this.requested = requested;
        this.available = available;
    }

    long requested() {
        return requested;
    }

    long available() {
        return available;
    }

    long shortfall() {
        return requested - available;
    }
}

class Account {
    private long balance;

    Account(long openingBalance) {
        if (openingBalance < 0) {
            throw new IllegalArgumentException("opening balance must not be negative: " + openingBalance);
        }
        this.balance = openingBalance;
    }

    long balance() {
        return balance;
    }

    void deposit(long amount) {
        requirePositive(amount);
        balance = Math.addExact(balance, amount);   // throws before assigning on overflow
    }

    void withdraw(long amount) throws InsufficientFundsException {
        requirePositive(amount);
        if (amount > balance) {
            throw new InsufficientFundsException(amount, balance);
        }
        balance -= amount;
    }

    static void transfer(Account from, Account to, long amount) throws InsufficientFundsException {
        Objects.requireNonNull(from, "from");
        Objects.requireNonNull(to, "to");
        from.withdraw(amount);              // validates and may throw: nothing has changed yet
        try {
            to.deposit(amount);
        } catch (RuntimeException e) {
            from.balance += amount;         // compensate, then let the caller see the failure
            throw e;
        }
    }

    private static void requirePositive(long amount) {
        if (amount <= 0) {
            throw new IllegalArgumentException("amount must be positive: " + amount);
        }
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Every operation does a fixed number of comparisons, one checked addition or subtraction and at
most one object allocation (the exception), whatever the balance or the number of earlier
operations, so each call is **O(1)** in time. An account stores one `long` and an exception two,
so the extra space is **O(1)** too.

The interesting part is correctness rather than speed. Every method validates **before** it
mutates: `requirePositive` and the overdraft check throw while the balance is untouched, and
`Math.addExact` throws before the assignment happens. `transfer` reuses that guarantee. If
`withdraw` throws, nothing has changed; if the later `deposit` throws, the `catch` puts the money
back and rethrows the same exception, so the caller sees the real cause and both balances are
exactly as before. Catching `RuntimeException` (not `Exception`) keeps the checked
`InsufficientFundsException` out of that block, where it could never occur anyway.
'''

