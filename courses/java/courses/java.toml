[[unit.step]]
kind = "challenge"
id = "java-u24-x1-parallel-map"
title = "A parallel map that keeps order"
points = 40
difficulty = 24
entry = "Parallel"
intro = '''
Applying a function to every element of a list is embarrassingly parallel: the calls are
independent, so a pool of threads can run them at the same time. The engineering is in the
details: results must come back in input order however the tasks finish, failures must reach
the caller intact, and the pool must never leak threads.
'''
instructions = '''
## Your turn

Implement the static generic method `map` in `class Parallel`:

```java
static <T, R> List<R> map(List<T> items, Function<? super T, ? extends R> fn, int threads)
```

It applies `fn` to every item on a pool of worker threads and returns the results.

Rules:

- If `threads < 1`, throw `IllegalArgumentException`.
- The result has one element per item, **in the same order as `items`**, whatever order the
  tasks finish in. An empty input gives an empty list. `fn` may return `null`, and that `null`
  appears in the result.
- Run the calls on **at most `threads`** worker threads, never on the calling thread, and let
  them really run at the same time (up to `threads` calls at once).
- If `fn` throws a `RuntimeException` for some item, `map` throws **that same exception**
  (unwrap it from the `ExecutionException`), not a wrapper.
- Always shut the pool down before returning, also when a task failed. When `map` returns,
  no worker thread may be left running.

Example: `Parallel.map(List.of(1, 2, 3), x -> x * 10, 2)` returns `[10, 20, 30]`.

**Hint:** a fixed pool in try-with-resources, one `submit` per item, and the futures read
back in order. Remember that `ExecutionException` and `InterruptedException` are checked.

Hidden tests decide correctness.
'''
starter = '''
import java.util.List;
import java.util.function.Function;

class Parallel {
    // Apply fn to every item on at most `threads` worker threads and return the results
    // in input order. Unwrap a task's RuntimeException and always shut the pool down.
    static <T, R> List<R> map(List<T> items, Function<? super T, ? extends R> fn, int threads) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
