    check(!seen.isEmpty() && seen.size() <= 2, "expected 1 or 2 worker threads, saw " + seen.size());
    check(!seen.contains(Thread.currentThread()), "the work must run on pool threads, not on the caller");
    seen.remove(Thread.currentThread());
    for (Thread t : seen) t.join(5_000);
