[[unit]]
id = "java-u16-optional"
title = "Optional and null safety"
level = "intermediate"
difficulty = 16
intro = '''
Real lookups often come back empty: no user with that id, no setting with that key, no element
that matches. This unit shows how `Optional<T>` puts "maybe absent" into a method's type, how to
chain `map`, `filter` and `flatMap` without a single `null` check, and how to fail fast with a
clear message when a value is required.
'''
concepts = '''
## The idea

Many operations have a perfectly normal "nothing" outcome. Searching a list may find no match,
a configuration key may be missing, a customer may have no address on file. For decades Java
expressed that outcome with `null`: a reference that points to no object. The trouble is that
`null` is invisible in the type. A method declared to return `String` may hand you `null`, and
the first time you call `.length()` on it the program dies with a `NullPointerException`, the
most common crash in Java code.

`java.util.Optional<T>` makes absence explicit. A method that returns `Optional<User>` says, in
its signature, "there may be no user", and the caller cannot reach the value without deciding
what happens when it is missing.

## How Java does it

An `Optional` is a small box that is either **present** (holds one value) or **empty**:

```java
Optional<String> some = Optional.of("ada");            // value must not be null
Optional<String> none = Optional.empty();
Optional<String> maybe = Optional.ofNullable(map.get("k")); // null becomes empty
```

You consume it by saying what to do in both cases, and you transform it without unwrapping:

```java
String name = maybe.orElse("guest");                  // fallback value
String id = maybe.orElseThrow(() -> new IllegalStateException("no id"));
int length = maybe.map(String::length).orElse(0);     // runs only if present
maybe.filter(s -> !s.isBlank()).ifPresent(System.out::println);
```

`map` applies a function only when a value is present; if the function returns `null`, the
result is empty. `flatMap` is for functions that already return an `Optional`, so you never end
up with `Optional<Optional<T>>`. Streams speak the same language: `findFirst`, `min` and `max`
return an `Optional`.

## Pitfalls

- `get()` and the no-argument `orElseThrow()` on an empty Optional throw
  `NoSuchElementException: No value present`. Prefer a fallback or an exception that explains
  what was missing.
- `Optional.of(null)` throws `NullPointerException` at once. Use `ofNullable` when the source
  may be `null`.
- `orElse(x)` always evaluates `x`, even when a value is present. When the fallback is
  expensive or has side effects, use `orElseGet(() -> …)`.
- Optional is designed for **return types**. Don't use it for fields, parameters or collection
  elements, and never return a `null` Optional: that is the worst of both worlds.
- Older APIs still return `null` (`Map.get`, `BufferedReader.readLine`). Wrap them at the
  boundary with `ofNullable`. For arguments that must exist, `Objects.requireNonNull(arg, "arg")`
  fails fast with a named message.
- Since Java 14, a `NullPointerException` names the culprit:
  `Cannot invoke "String.length()" because "name" is null`. Read it: it tells you which
  reference was `null`.

## What you will practise

You will return an Optional from a search, parse settings with a `map`/`filter` pipeline, and
navigate nested optional data with `flatMap`. The challenge is a `Settings` class whose lookups
never return `null` and never crash on missing, blank or malformed values.
'''

[[unit.step]]
kind = "concept"
id = "java-u16-c1-absence"
title = "Absence as a value"
points = 5
difficulty = 16
intro = '''
`null` is a missing value disguised as a normal reference; `Optional` is a missing value that
announces itself in the type. Choosing between them is an API design decision that decides
where crashes can happen.
'''
body = '''
## Two boxes

Think of `Optional<T>` as a box that holds either one value or nothing. Code that receives the
box must open it deliberately, and every way of opening it forces a decision about the empty
case:

| You want… | Write |
|---|---|
| a default value | `opt.orElse(defaultValue)` |
| a default computed only when needed | `opt.orElseGet(() -> compute())` |
| an error, because the value is required | `opt.orElseThrow(() -> new SomeException(…))` |
| to act only when present | `opt.ifPresent(v -> …)` |
| to act in both cases | `opt.ifPresentOrElse(v -> …, () -> …)` |

## Pipelines without checks

`map`, `filter` and `flatMap` keep the box closed while you transform what may be inside. Each
step is skipped when the box is already empty, so a chain reads like the happy path:

```java
Optional.ofNullable(raw)          // null -> empty
        .map(String::strip)       // only if present
        .filter(s -> !s.isEmpty())// blank -> empty
        .map(Integer::parseInt);
```

Compare that with the nested `if (raw != null) { … if (!s.isEmpty()) … }` it replaces.

## Where it belongs

Return `Optional` from methods whose "not found" outcome is normal. Keep fields and
parameters as plain references, validated with `Objects.requireNonNull` at the door. Inside a
class you control, `null` can still be an internal detail; the public methods are where the
contract becomes visible.
'''

