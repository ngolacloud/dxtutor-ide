target = '''
import java.util.ArrayList;
import java.util.List;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;
import java.util.concurrent.Future;

public class Main {
    public static void main(String[] args) throws Exception {
        List<String> words = List.of("thread", "pool", "future", "callable", "executor");
        List<Future<Integer>> futures = new ArrayList<>();
        try (ExecutorService pool = Executors.newFixedThreadPool(3)) {
            for (String w : words) {
                futures.add(pool.submit(() -> countVowels(w)));
            }
            for (int i = 0; i < words.size(); i++) {
                System.out.println(words.get(i) + " -> " + futures.get(i).get());
            }
        }
        System.out.println("all done: " + futures.stream().allMatch(Future::isDone));
    }

    static int countVowels(String w) {
        int n = 0;
        for (char c : w.toCharArray()) {
            if ("aeiou".indexOf(c) >= 0) n++;
        }
        return n;
    }
}
