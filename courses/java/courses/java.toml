[unit.step.gabarito]
solution = '''
class EditDistance {
    static int distance(String a, String b) {
        int n = a.length(), m = b.length();
        int[] prev = new int[m + 1];
        int[] cur = new int[m + 1];
        for (int j = 0; j <= m; j++) prev[j] = j;
        for (int i = 1; i <= n; i++) {
            cur[0] = i;
            char ca = a.charAt(i - 1);
            for (int j = 1; j <= m; j++) {
                if (ca == b.charAt(j - 1)) {
                    cur[j] = prev[j - 1];
                } else {
                    cur[j] = 1 + Math.min(prev[j - 1], Math.min(prev[j], cur[j - 1]));
                }
            }
            int[] swap = prev;
            prev = cur;
            cur = swap;
        }
        return prev[m];
    }
}
'''
time = "O(n·m)"
space = "O(m)"
justification = '''
Let `d[i][j]` be the edit distance between the first `i` characters of `a` and the first `j`
characters of `b`. Turning a prefix into the empty string takes `i` deletions, and building a
prefix from nothing takes `j` insertions, so `d[i][0] = i` and `d[0][j] = j`. For the other
cells, look at the last characters: if they are equal, they cost nothing and
`d[i][j] = d[i-1][j-1]`; otherwise the last edit was a substitution (`d[i-1][j-1] + 1`), a
deletion (`d[i-1][j] + 1`) or an insertion (`d[i][j-1] + 1`), and the minimum wins. The answer
is `d[n][m]`.

There are (n + 1)(m + 1) cells and each takes O(1) work, so the time is **O(n·m)**: about nine
million cells for two 3,000-character strings, a few milliseconds. Each row reads only the row
above and the cell to its left, so two rows of `m + 1` ints are enough, and they are swapped
instead of reallocated: **O(m)** extra space instead of the O(n·m) of a full table (which would
still be fine here at about 36 MB, but can't scale).

Naive recursion branches three ways at every mismatch, which is exponential. Top-down
memoization would also be O(n·m), but it recurses up to n + m frames deep and, with a
`HashMap`, boxes millions of entries; the bottom-up loops avoid both. `a.length()` throws
`NullPointerException` for a `null` argument, as required.
'''
