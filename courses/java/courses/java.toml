[[unit]]
id = "java-u13-generics"
title = "Generics"
level = "intermediate"
difficulty = 13
intro = '''
Generics let you write a class or a method once and use it safely with many types:
`List<String>` and `List<Integer>` are the same code, checked by the compiler for different
element types. In this unit you write generic classes and methods, constrain them with bounds,
and learn the wildcard rule that the whole collections library is built on.
'''
concepts = '''
## The idea

Before Java 5, a `List` held plain `Object`s. You could put a `String` in and take an `Integer`
out, and nothing complained until a `ClassCastException` crashed the program at run time.
**Generics** move that check to compile time. A class or method declares **type parameters**,
placeholders such as `T` that the caller fills in, and the compiler then knows exactly what goes
in and what comes out. No casts, and a whole category of bugs becomes a compile error.

## How Java does it

A **generic class** names its type parameters after the class name and uses them like types:

```java
class Box<T> {
    private T value;
    void put(T value) { this.value = value; }
    T get() { return value; }
}

Box<String> b = new Box<>();     // the diamond <> infers String
b.put("hi");
String s = b.get();               // no cast needed
```

A **generic method** declares its own parameters before the return type, and the compiler
usually infers them from the arguments: `static <T> T firstOf(List<T> items)`.

A **bound** restricts what `T` may be, which in turn lets you call methods on it:

```java
static <T extends Comparable<T>> boolean inOrder(T a, T b) {
    return a.compareTo(b) <= 0;    // allowed: every T has compareTo
}
```

**Wildcards** describe a family of types. `List<? extends Number>` is "a list of some subtype of
`Number`": you can read `Number`s out of it, but not add to it. `List<? super Integer>` is "a list
that accepts `Integer`s": you can add to it, but reads only give `Object`. The rule of thumb is
**PECS: producer `extends`, consumer `super`**. `Collections.copy` is declared
`copy(List<? super T> dest, List<? extends T> src)` for exactly this reason.

## Pitfalls and compiler errors

- **Generics are not covariant.** A `List<Integer>` is not a `List<Number>`, or you could add a
  `Double` to a list of integers. Passing one gives `error: incompatible types: List<Integer>
  cannot be converted to List<Number>`. Use `List<? extends Number>` instead.
- **No primitives.** `List<int>` fails with `error: unexpected type ... required: reference
  found: int`. Use the wrapper (`List<Integer>`); autoboxing converts for you.
- **Type erasure.** The JVM drops type arguments after compiling, so at run time a
  `List<String>` is just a `List`. That is why `new T()`, `new T[n]` and
  `x instanceof List<String>` are all rejected.
- **Raw types.** Writing `List` without `<…>` switches the checks off and earns an
  "unchecked" warning. Always give the type argument, or use `<>`.
- `T extends Comparable<T>` rejects types that are comparable through a supertype, such as
  `LocalDate`, which implements `Comparable<ChronoLocalDate>`. The fully general bound is
  `T extends Comparable<? super T>`.

## What you will practise

You will write a generic stack used with two element types, generic methods with a bound, and
methods that read from `? extends` lists and write to `? super` lists. The challenge asks you
for a generic `Pair<A, B>` and a small library of algorithms (`zip`, `maxOf`, `maxBy`,
`copyInto`) that the hidden tests call with strings, integers and dates.
'''

[[unit.step]]
kind = "concept"
id = "java-u13-c1-type-parameters"
title = "Type parameters and erasure"
points = 5
difficulty = 13
intro = '''
A type parameter is a variable whose value is a type. The compiler substitutes the real type at
every use, checks it, and then erases it, so generic code costs nothing extra at run time.
'''
body = '''
## Parameters for types

You already know parameters for values: `square(int x)` works for any `x`. A **type parameter**
does the same for types. In `class Box<T>`, `T` stands for "whatever type the user chooses",
and `Box<String>` fixes it to `String` for that one variable. By convention type parameters
are single capital letters: `T` (type), `E` (element), `K` and `V` (key and value), `R`
(result).

```java
record Pair<A, B>(A first, B second) {}

Pair<String, Integer> p = new Pair<>("age", 42);
int n = p.second();          // the compiler knows second() returns Integer
```

## Checked, then erased

The compiler uses the type arguments to check every call, inserts any casts that are needed,
and then **erases** them: the bytecode of `Box<String>` and `Box<Integer>` is one and the same
class. This keeps generic code fast and compatible with old libraries, but it means the type
argument does not exist at run time. You can't write `new T()`, ask `obj instanceof Box<String>`,
or overload `f(List<String>)` with `f(List<Integer>)`, because after erasure both are `f(List)`.

## Why bounds exist

Inside a generic method, a plain `T` could be anything, so you may only call `Object`'s methods
on it. A **bound** such as `<T extends Comparable<T>>` promises more, and then `compareTo` is
allowed. A bound is a contract in both directions: the caller must supply a type that fits, and
the method may use everything the bound guarantees.
'''

