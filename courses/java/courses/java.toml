- `Card.parse("qh")` equals `new Card(Rank.QUEEN, Suit.HEARTS)` and prints as `QH`.
- `Card.parse("AS").beats(Card.parse("KS"))` → `true`.
- `Card.parse("1H")`, `Card.parse("QX")`, `Card.parse("Q")` → `IllegalArgumentException`.

**Hint:** loop over `values()` to find a constant by its symbol, and let the record generate
`equals` and `hashCode`.

Hidden tests decide correctness.
