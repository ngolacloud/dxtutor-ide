intro = '''
A payroll is the textbook case for polymorphism: the code that totals salaries should not
care how each person is paid. An interface states the capability, an abstract class holds
what all employees share, and each subclass supplies its own pay rule, so adding a new kind
of employee never touches the totalling code.
'''
instructions = '''
## Your turn

Complete the types in the starter. All money is in cents, as `long`.

- **`interface Payable`**: `long payCents()` plus a default method `String payLabel()` that
  formats `payCents()` as dollars: `123456` → `"$1234.56"`, `5` → `"$0.05"`.
- **`abstract class Employee implements Payable`**: a constructor taking the name (throw
  `IllegalArgumentException` if it is `null` or blank), `name()`, an abstract `role()`, and
  `toString()` returning `name (role): payLabel`, e.g. `"Grace (manager): $8500.00"`.
- **`Salaried(name, monthlyCents)`**: pays `monthlyCents`; role `"salaried"`.
- **`Hourly(name, rateCents, hours)`**: the first 160 hours are paid at `rateCents`, every
  hour above 160 at one and a half times the rate. Compute it exactly as
  `rateCents * regular + rateCents * overtime * 3 / 2` (integer division). Role `"hourly"`.
- **`Manager(name, monthlyCents, bonusCents)` extends `Salaried`**: pays the salary plus the
  bonus (reuse the parent's `payCents()` through `super`); role `"manager"`.
- **`Payroll.total(staff)`**: the sum of `payCents()` over the list, `0` when it is empty. It
  accepts any list of `Payable`s, including lambdas such as `() -> 5_000L`.

Every negative amount or number of hours throws `IllegalArgumentException`.

Examples:

- `new Hourly("Bo", 2_000, 170).payCents()` → `350000` (160 × 2000 + 10 × 3000)
- `new Manager("Grace", 800_000, 50_000).toString()` → `"Grace (manager): $8500.00"`

**Hint:** keep the fields `private` in each class and let `toString` in `Employee` call the
abstract methods; dynamic dispatch does the rest.

Hidden tests decide correctness.
'''
starter = '''
import java.util.List;

// Anything the company pays.
interface Payable {
    long payCents();

    // Format payCents() as dollars: 123456 -> "$1234.56", 5 -> "$0.05".
    default String payLabel() {
        throw new UnsupportedOperationException("not implemented");
    }
}

// What every employee shares. The name must not be null or blank.
abstract class Employee implements Payable {
    protected Employee(String name) {
        throw new UnsupportedOperationException("not implemented");
    }

    public String name() {
        throw new UnsupportedOperationException("not implemented");
    }

    // "salaried", "hourly" or "manager".
    public abstract String role();

    // "Grace (manager): $8500.00"
    @Override
    public String toString() {
        throw new UnsupportedOperationException("not implemented");
    }
}

class Salaried extends Employee {
    public Salaried(String name, long monthlyCents) {
        super(name);
        throw new UnsupportedOperationException("not implemented");
    }

    @Override
    public long payCents() {
        throw new UnsupportedOperationException("not implemented");
    }

    @Override
    public String role() {
        throw new UnsupportedOperationException("not implemented");
    }
}

class Hourly extends Employee {
    // Hours above 160 are paid at 1.5 times the rate.
    public Hourly(String name, long rateCents, int hours) {
        super(name);
        throw new UnsupportedOperationException("not implemented");
    }

    @Override
    public long payCents() {
        throw new UnsupportedOperationException("not implemented");
    }

    @Override
    public String role() {
        throw new UnsupportedOperationException("not implemented");
    }
}

class Manager extends Salaried {
    public Manager(String name, long monthlyCents, long bonusCents) {
        super(name, monthlyCents);
        throw new UnsupportedOperationException("not implemented");
    }

    @Override
    public long payCents() {
        throw new UnsupportedOperationException("not implemented");
    }

    @Override
    public String role() {
        throw new UnsupportedOperationException("not implemented");
    }
}

final class Payroll {
    // The sum of payCents() over the list; 0 for an empty list.
    public static long total(List<? extends Payable> staff) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
