target = '''
import java.util.HashSet;
import java.util.List;
import java.util.Set;
import java.util.TreeSet;

public class Main {
    public static void main(String[] args) {
        List<String> visits = List.of("ana", "ben", "ana", "cleo", "ben", "ana");
        Set<String> unique = new HashSet<>(visits);
        System.out.println(visits.size() + " visits, " + unique.size() + " visitors");

        Set<String> seen = new HashSet<>();
        for (String v : visits) {
            if (!seen.add(v)) {
                System.out.println("repeat: " + v);
            }
        }

        Set<String> monday = Set.of("ana", "ben", "cleo");
        Set<String> tuesday = Set.of("ben", "dan", "cleo");
        Set<String> both = new TreeSet<>(monday);
        both.retainAll(tuesday);
        Set<String> either = new TreeSet<>(monday);
        either.addAll(tuesday);
        Set<String> onlyMonday = new TreeSet<>(monday);
        onlyMonday.removeAll(tuesday);
        System.out.println("both " + both + ", either " + either + ", only monday " + onlyMonday);
        System.out.println(unique.contains("cleo") + " " + unique.contains("zoe"));
    }
}
'''
