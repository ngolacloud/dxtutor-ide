prompt = '''
Give a `Team` record a compact constructor that copies its member list, show that the caller's
later changes do not reach it, add a member with a wither, and try to write through the accessor.

**Why:** records are the default way to model values in modern Java, and the defensive copy is
the one line that makes a record with a collection truly immutable.
'''
target = '''
import java.util.ArrayList;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        List<String> names = new ArrayList<>(List.of("Ana", "Rui"));
        Team team = new Team("core", names);
        names.add("Intruder");
        System.out.println(team);

        Team bigger = team.withMember("Bea");
        System.out.println(team.members().size() + " -> " + bigger.members().size());

        try {
            team.members().add("Hacker");
        } catch (UnsupportedOperationException e) {
            System.out.println("members() is read-only");
        }
        System.out.println(team.equals(new Team("core", List.of("Ana", "Rui"))));
    }
}

record Team(String name, List<String> members) {
    Team {
        members = List.copyOf(members);
    }

    Team withMember(String member) {
        List<String> next = new ArrayList<>(members);
        next.add(member);
        return new Team(name, next);
    }
}
