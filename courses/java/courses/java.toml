[[unit.step]]
kind = "challenge"
id = "java-u02-x1-units"
title = "Implement the Units conversions"
points = 20
difficulty = 2
entry = "Units"
intro = '''
Unit conversions look trivial, but each one hides a type decision: whole-number division
that drops a fraction, or a product that silently overflows. You will write three small
methods whose hidden tests deliberately use inputs that break the naive `int` version.
'''
instructions = '''
## Your turn

Complete the class `Units` with three `static` methods:

```java
static long toSeconds(int days, int hours, int minutes, int seconds)
static double average(int a, int b)
static double fahrenheit(double celsius)
```

- `toSeconds` returns the total number of seconds in the given duration. A day has 86,400
  seconds. Inputs are never negative, but `days` can be as large as `Integer.MAX_VALUE`,
  so the arithmetic must not overflow.
- `average` returns the exact mean of two `int`s, including the `.5` when there is one. It
  must also work for two huge values such as `Integer.MAX_VALUE`.
- `fahrenheit` converts Celsius to Fahrenheit with `F = C × 9 / 5 + 32`.

Examples:

- `Units.toSeconds(1, 1, 1, 1)` → `90061`
- `Units.toSeconds(30000, 0, 0, 0)` → `2592000000` (does not fit in an `int`)
- `Units.average(1, 2)` → `1.5`
- `Units.average(Integer.MAX_VALUE, Integer.MAX_VALUE)` → `2147483647.0`
- `Units.fahrenheit(100)` → `212.0`

**Hint:** make the first operand of each calculation a `long` or a `double` (with a suffix
like `86_400L` or `2.0`, or a cast) so the whole expression is computed in that wider type.

Hidden tests decide correctness.
'''
starter = '''
// Units: small conversions that must survive large inputs.
public class Units {

    // Total seconds in the duration; must not overflow for huge day counts.
    static long toSeconds(int days, int hours, int minutes, int seconds) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The exact mean of a and b, keeping any .5.
    static double average(int a, int b) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Celsius to Fahrenheit: F = C * 9 / 5 + 32.
    static double fahrenheit(double celsius) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
tests = '''
test("zero duration", () -> equal(Units.toSeconds(0, 0, 0, 0), 0L));
test("one of each", () -> equal(Units.toSeconds(1, 1, 1, 1), 90061L));
test("only seconds", () -> equal(Units.toSeconds(0, 0, 0, 59), 59L));
test("30000 days overflows an int", () -> equal(Units.toSeconds(30000, 0, 0, 0), 2_592_000_000L));
test("Integer.MAX_VALUE days", () -> equal(Units.toSeconds(Integer.MAX_VALUE, 23, 59, 59), 185_542_587_187_199L));
test("average keeps the half", () -> equal(Units.average(1, 2), 1.5));
test("average of equal values", () -> equal(Units.average(4, 4), 4.0));
test("average with negatives", () -> {
    equal(Units.average(-3, 4), 0.5);
    equal(Units.average(-3, -4), -3.5);
});
test("average of huge values", () -> {
    equal(Units.average(Integer.MAX_VALUE, Integer.MAX_VALUE), 2147483647.0);
    equal(Units.average(Integer.MIN_VALUE, Integer.MIN_VALUE), -2147483648.0);
    equal(Units.average(Integer.MAX_VALUE, Integer.MIN_VALUE), -0.5);
});
test("boiling and freezing", () -> {
    near(Units.fahrenheit(100), 212.0, 1e-9);
    near(Units.fahrenheit(0), 32.0, 1e-9);
});
test("minus forty is the same on both scales", () -> near(Units.fahrenheit(-40), -40.0, 1e-9));
test("fractional degrees", () -> {
    near(Units.fahrenheit(37), 98.6, 1e-9);
    near(Units.fahrenheit(1), 33.8, 1e-9);
});
'''

[unit.step.gabarito]
solution = '''
// Units: small conversions that must survive large inputs.
public class Units {
    static final long SECONDS_PER_DAY = 86_400;
    static final long SECONDS_PER_HOUR = 3_600;
    static final long SECONDS_PER_MINUTE = 60;

    // Total seconds in the duration; must not overflow for huge day counts.
    static long toSeconds(int days, int hours, int minutes, int seconds) {
        return days * SECONDS_PER_DAY
                + hours * SECONDS_PER_HOUR
                + minutes * SECONDS_PER_MINUTE
                + seconds;
    }

    // The exact mean of a and b, keeping any .5.
    static double average(int a, int b) {
        return ((long) a + b) / 2.0;
    }

    // Celsius to Fahrenheit: F = C * 9 / 5 + 32.
    static double fahrenheit(double celsius) {
        return celsius * 9 / 5 + 32;
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Each method performs a fixed handful of arithmetic operations, whatever the size of the
numbers it receives, so every call is **O(1)** in time. No method allocates anything that
grows with the input, so the space is **O(1)** too.

The interesting part is correctness, not speed. In `toSeconds`, the constants are `long`,
so `days * SECONDS_PER_DAY` is computed as a `long` multiplication and the largest possible
answer, about 1.86 × 10¹⁴, fits comfortably below `Long.MAX_VALUE` (about 9.2 × 10¹⁸). In
`average`, casting `a` to `long` before adding prevents `a + b` from wrapping when both are
near `Integer.MAX_VALUE`, and dividing by `2.0` rather than `2` keeps the fraction. In
`fahrenheit`, `celsius` is already a `double`, so `celsius * 9 / 5` never falls into
integer division; writing `9 / 5 * celsius` instead would compute `9 / 5 = 1` first and
give wrong answers.
'''

[[unit]]
id = "java-u03-strings"
title = "Strings"
level = "basic"
difficulty = 3
intro = '''
Text is everywhere in real programs: names, messages, file contents, web requests. In Java,
text is a `String`, an immutable object with dozens of useful methods. This unit shows how
to slice and transform strings, why `==` is the wrong way to compare them, how
`StringBuilder` builds text efficiently, and how text blocks hold multi-line strings.
'''
concepts = '''
## The idea

A **string** is a sequence of characters. Each character has a position, its **index**,
starting at 0, so in `"Java"` the `J` is at index 0 and the final `a` at index 3. Unlike
`int` or `char`, `String` is not a primitive: it is a **class**, and a `String` variable
holds a **reference** to a string object somewhere in memory.

Java strings are **immutable**: once created, a string object never changes. Every method
that seems to modify a string, such as `toUpperCase` or `replace`, actually builds and
returns a **new** string and leaves the original alone.

## How Java does it

```java
String lang = "Java";
lang.length();          // 4
lang.charAt(0);         // 'J' (a char)
lang.substring(1, 3);   // "av": from index 1 up to, not including, 3
lang.indexOf("va");     // 2, or -1 when not found
lang.toUpperCase();     // "JAVA"; lang itself is still "Java"
```

Other everyday methods: `strip()` removes surrounding spaces, `replace`, `contains`,
`startsWith`, `endsWith`, `repeat`, `isEmpty` and `isBlank`. `"%s is %d".formatted("x", 3)`
fills placeholders.

To **compare content**, call `equals` (or `equalsIgnoreCase`). The `==` operator compares
references: it asks whether two variables point at the very same object, which two equal
strings often do not.

Joining strings with `+` creates a new string every time. That is fine for a few pieces,
but inside a loop it copies the growing text again and again. A `StringBuilder` is a
**mutable** buffer made for this: `append` adds to the end, `insert` and `reverse` edit in
place, and `toString` produces the final `String`.

Since Java 15, a **text block** holds multi-line text between triple quotes. The common
indentation is removed for you:

```java
String poem = """
    Roses are red,
    strings are immutable.
    """;
```

## What is special or tricky

- **`==` on strings is a trap.** It sometimes works, because Java reuses identical
  literals, and then fails on strings built at run time. Always use `equals`.
- **Results must be kept.** `name.strip();` on its own line does nothing useful; write
  `name = name.strip();`.
- **Indexes are checked.** `"abc".charAt(3)` throws `StringIndexOutOfBoundsException`.
- **`null` is not an empty string.** Calling a method on a `null` reference throws
  `NullPointerException`. `"text".equals(maybeNull)` is safe; the reverse is not.
- **`'a'` and `"a"` differ.** Single quotes make a `char`, double quotes a `String`:
  `char c = "a";` fails with `incompatible types: String cannot be converted to char`.

## What you will practise

You will call the common `String` methods, compare strings with `==` and `equals`, and build
text with `StringBuilder` and a text block. The challenge combines them into three small
text utilities.
'''

[[unit.step]]
kind = "concept"
id = "java-u03-c1-immutable"
title = "Strings are immutable objects"
points = 5
difficulty = 3
intro = '''
A `String` variable does not contain the characters; it holds a reference to a string object.
Because string objects can never change, many variables can safely share the same one, and
every "modification" produces a fresh object instead.
'''
body = '''
## References, not boxes

```java
String a = "hello";
String b = a;            // b refers to the same object as a
a = a.toUpperCase();     // a now refers to a NEW object, "HELLO"
System.out.println(b);   // still "hello"
```

`toUpperCase` did not touch the original object. It built a new string, and the assignment
moved `a` to point at it. `b` still points at the old one, which never changed. This is what
**immutable** means, and it is why sharing strings is safe: nobody can alter text that
someone else is holding.

## Two kinds of equality

Because variables hold references, there are two questions you can ask:

- `a == b`: do these two variables refer to the **same object**?
- `a.equals(b)`: do these two objects contain the **same characters**?

For text you almost always mean the second one. Java keeps a pool of string literals, so
two identical literals in your code usually share one object and `==` happens to say
`true`. A string built at run time, from user input, a file, or a method like `substring`,
is a separate object, and `==` says `false` even when the characters match.

## When text must change

Since a `String` cannot change, building text piece by piece with `+` creates a new string
at every step. `StringBuilder` is the mutable alternative: one buffer that grows as you
`append`, and a single `toString()` at the end. Use it whenever you build a string in a
loop.
'''

