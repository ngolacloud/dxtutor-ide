[[unit.step]]
kind = "drill"
id = "java-u18-d3-walk-tree"
title = "List, walk and delete a directory tree"
points = 10
difficulty = 18
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
`Files.list` returns the direct children of a directory, while `Files.walk` performs a
depth-first traversal of the whole tree. Deleting a tree must go the other way, children before
parents, which sorting the walked paths in reverse order achieves.
'''
prompt = '''
Build a small project tree in a temporary directory, list its top level, print every file's path
relative to the root, and delete the whole tree from the deepest path up.

**Why:** walking a tree is the core of build tools, search tools and backups, and recursive
deletion is the cleanup every one of them needs.
'''
target = '''
import java.io.IOException;
import java.nio.file.Files;
import java.nio.file.Path;
import java.util.Comparator;
import java.util.List;
import java.util.stream.Stream;

public class Main {
    public static void main(String[] args) throws IOException {
        Path root = Files.createTempDirectory("dxt-tree");
        try {
            Files.createDirectories(root.resolve("src/main"));
            Files.writeString(root.resolve("README.md"), "# demo");
            Files.writeString(root.resolve("src/main/App.java"), "class App {}");
            Files.writeString(root.resolve("src/main/Util.java"), "class Util {}");

            try (Stream<Path> top = Files.list(root)) {
                top.map(p -> p.getFileName().toString())
                        .sorted()
                        .forEach(n -> System.out.println("top: " + n));
            }
            try (Stream<Path> all = Files.walk(root)) {
                all.filter(Files::isRegularFile)
                        .map(p -> root.relativize(p).toString())
                        .sorted()
                        .forEach(System.out::println);
            }
        } finally {
            List<Path> paths;
            try (Stream<Path> all = Files.walk(root)) {
                paths = all.sorted(Comparator.reverseOrder()).toList();
            }
            for (Path p : paths) {
                Files.delete(p);
            }
        }
        System.out.println("removed: " + Files.notExists(root));
    }
}
'''
