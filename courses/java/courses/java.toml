});
test("calls run concurrently, up to the thread limit", () -> {
    CountDownLatch latch = new CountDownLatch(3);
    List<Boolean> met = Parallel.map(List.of(1, 2, 3), x -> {
        latch.countDown();
        try {
            return latch.await(5, TimeUnit.SECONDS);
        } catch (InterruptedException e) {
