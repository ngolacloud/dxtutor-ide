[[unit.step]]
kind = "challenge"
id = "java-u27-x1-map-all"
title = "Fan out on virtual threads"
points = 40
difficulty = 27
entry = "Fanout"
intro = '''
Calling a slow service once per item in a loop costs the **sum** of the latencies. Calling
it from one virtual thread per item costs about the **maximum**, and a semaphore keeps the
service from being flooded. Collecting the results in input order and propagating failures
completes a production-quality fan-out.
'''
instructions = '''
## Your turn

Implement `Fanout.mapAll`:

```java
static <T, R> List<R> mapAll(List<T> items, int maxConcurrent,
                             Function<? super T, ? extends R> fn) throws InterruptedException
```

Apply `fn` to every item and return the results **in the same order as `items`**.

Rules:

- Run each call of `fn` on **its own virtual thread** (for example with
  `Executors.newVirtualThreadPerTaskExecutor()` in try-with-resources), so calls that block
  overlap.
- Never run more than `maxConcurrent` calls of `fn` at the same time. Throw
  `IllegalArgumentException` if `maxConcurrent < 1`.
- Wait for every call before returning. `fn` may return `null`; keep it in the results.
- If any call throws, `mapAll` throws an `IllegalStateException` whose **cause** is the
  exception thrown by the first failing item **in input order**.

Examples:

- `mapAll(List.of("a", "bb"), 2, String::length)` returns `[1, 2]`.
- 500 items whose calls each sleep 20 ms finish in well under a second with
  `maxConcurrent = 500`, instead of 10 seconds.
- `mapAll(List.of(), 4, x -> x)` returns an empty list.

**Hint:** submit one task per item and keep the `Future`s in a list, which preserves the
order. Inside each task, `acquire` a permit from a `Semaphore` before calling `fn` and release
it in `finally`. `Future.get()` throws an `ExecutionException` whose cause is the original
exception.

Hidden tests decide correctness.
'''
starter = '''
