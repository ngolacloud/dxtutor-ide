[[unit.step]]
kind = "drill"
id = "java-u11-d3-enum"
title = "An enum with fields and a switch"
points = 10
difficulty = 11
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
An enum is a class with a fixed list of instances, each created once when the class loads.
Giving each constant its own data through a constructor keeps that data next to the name, and
a switch expression over the enum lets the compiler check that every constant is handled.
'''
prompt = '''
Declare a `Coin` enum whose constants carry their value in cents, list the constants, total
a purse, look a constant up by name, and classify it with a switch expression.

**Why:** enums replace "magic" strings and numbers with a closed, type-checked set, and their
fields and methods keep behaviour next to the data.
'''
target = '''
public class Main {
    public static void main(String[] args) {
        for (Coin c : Coin.values()) {
            System.out.println(c.ordinal() + " " + c + " = " + c.cents() + "c");
        }
        Coin[] purse = {Coin.QUARTER, Coin.DIME, Coin.DIME, Coin.PENNY};
        int total = 0;
        for (Coin c : purse) {
            total += c.cents();
        }
        System.out.println("purse holds " + total + "c");

        Coin parsed = Coin.valueOf("NICKEL");
        System.out.println(parsed + " is " + parsed.size() + ", same constant? " + (parsed == Coin.NICKEL));
    }
}

enum Coin {
    PENNY(1), NICKEL(5), DIME(10), QUARTER(25);

    private final int cents;

    Coin(int cents) {
        this.cents = cents;
    }

    int cents() {
        return cents;
    }

    String size() {
        return switch (this) {
            case PENNY, DIME -> "small";
            case NICKEL -> "medium";
            case QUARTER -> "large";
        };
    }
}
'''
