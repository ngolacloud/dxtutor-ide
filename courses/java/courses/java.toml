[unit.step.gabarito]
solution = '''
record SortResult(int[] sorted, long inversions) {}

class Inversions {
    static SortResult sortAndCount(int[] items) {
        int[] a = items.clone();
        int[] buffer = new int[a.length];
        long count = sortRange(a, buffer, 0, a.length);
        return new SortResult(a, count);
    }

    // Sorts a[lo, hi) in place and returns the inversions inside that range.
    private static long sortRange(int[] a, int[] buffer, int lo, int hi) {
        if (hi - lo <= 1) return 0;
        int mid = (lo + hi) >>> 1;
        long count = sortRange(a, buffer, lo, mid) + sortRange(a, buffer, mid, hi);
        int i = lo, j = mid, k = lo;
        while (i < mid && j < hi) {
            if (a[i] <= a[j]) {
                buffer[k++] = a[i++];
            } else {
                count += mid - i;
                buffer[k++] = a[j++];
            }
        }
        while (i < mid) buffer[k++] = a[i++];
        while (j < hi) buffer[k++] = a[j++];
        System.arraycopy(buffer, lo, a, lo, hi - lo);
        return count;
    }
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
This is merge sort with one extra line. The recursion halves the range each time, so it is
log₂ n levels deep, and at each level the merges together copy every element once: **O(n log n)**
time, on every input, including the reversed and random arrays of a million elements.

The count is correct because every inversion `(i, j)` falls into exactly one of three groups:
both indexes in the left half, both in the right half, or one in each. The recursive calls count
the first two groups. For the third, look at the merge: when the right half's front element
`a[j]` is strictly smaller than the left half's front element `a[i]`, it is also smaller than
every element still waiting in the left half, because that half is sorted. So `a[j]` forms an
inversion with exactly `mid - i` left elements, and one addition counts them all. When
`a[i] <= a[j]`, the left element is taken first and no inversion is counted, which is why equal
items never count and why the merge stays stable.

Space is **O(n)**: one copy of the input (so `items` is untouched) and one shared merge buffer,
allocated once instead of at every level, plus O(log n) stack frames for the recursion. The
count is a `long`, since a million elements can have up to about 5 × 10¹¹ inversions. Checking
every pair would be O(n²), about 5 × 10¹¹ comparisons for the largest test, which is hours, not
milliseconds.
'''

[[unit]]
id = "java-u34-recursion-dp"
title = "Recursion and dynamic programming"
level = "advanced"
difficulty = 34
intro = '''
Recursion solves a problem by solving smaller copies of it, and dynamic programming makes that
fast when the same smaller copies come up again and again. You will recurse over nested data
with pattern matching, count how many calls a memo saves, fill a table bottom-up, and finish
with edit distance, the dynamic program behind spell checkers and `diff`.
'''
concepts = '''
## The idea

A **recursive** method calls itself on a smaller input. Every recursion needs two parts: a **base case** that answers directly, and a **recursive case** that moves strictly towards it. Each call gets its own **stack frame** with its own parameters and locals, and the frames pile up until a base case returns.

Recursion fits data that is recursive itself (nested lists, trees, file systems) and problems defined in terms of smaller versions of themselves. But naive recursion can repeat work. `fib(n) = fib(n-1) + fib(n-2)` computes `fib(n-2)` twice, `fib(n-3)` three times, and so on: about 1.6ⁿ calls.

**Dynamic programming** (DP) applies when a problem has:

- **optimal substructure**: the answer is built from answers to subproblems, and
- **overlapping subproblems**: the same subproblems come up many times.

Then you solve each subproblem once and store the result. **Memoization** (top-down) keeps the recursion and caches each answer. **Tabulation** (bottom-up) fills a table in an order where every entry's dependencies are already computed, with no recursion at all. Either way the cost becomes (number of subproblems) × (work per subproblem).

## How Java does it

A memo is an array when the subproblems are small integers, or a `HashMap` otherwise:

```java
static long[] memo = new long[91];

static long fib(int n) {
    if (n < 2) return n;
    if (memo[n] != 0) return memo[n];
    return memo[n] = fib(n - 1) + fib(n - 2);
}
```

Pattern matching makes recursion over mixed data concise: `switch (item) { case Integer n -> ...; case List<?> l -> ...; }` picks the case by the runtime type.

## What is special or tricky

- **`StackOverflowError`.** Every call uses a stack frame, and the default thread stack (typically 1 MB on 64-bit systems) holds somewhere between a few thousand and a few tens of thousands of frames, depending on their size. Java has no tail-call optimisation, so even a tail-recursive method can overflow. `java -Xss16m` enlarges the stack, but a bottom-up table needs no stack at all.
- **Missing or unreachable base case**: infinite recursion ends in the same `StackOverflowError`.
- **Don't memoize with `computeIfAbsent` recursively.** Calling `memo.computeIfAbsent(n, k -> fib(k - 1) + fib(k - 2))` modifies the `HashMap` from inside its own update and throws `ConcurrentModificationException`. Use `get`, then `put`.
- **Overflow.** `fib(93)` no longer fits in a `long`, and path counts grow just as fast. Use `long`, or `BigInteger` when the answers are unbounded.
- **Boxing.** A `HashMap<Integer, Long>` memo boxes every key and value; a `long[]` is much faster when the keys are small integers.

## What you will practise

You will sum a nested list with a recursive `switch`, count the calls of naive and memoized Fibonacci, and count grid paths with a bottom-up table. The challenge is edit distance on strings of thousands of characters.
'''

[[unit.step]]
kind = "concept"
id = "java-u34-c1-recursion-memo"
title = "Base cases, overlap and the memo"
points = 5
difficulty = 34
intro = '''
A recursive definition is correct when every call reaches a base case. It is fast only when it
doesn't solve the same subproblem over and over, and that is exactly what a memo or a table
prevents.
'''
body = '''
## Base case and progress

```java
static int sum(int[] a, int i) {
    if (i == a.length) return 0;        // base case
    return a[i] + sum(a, i + 1);        // smaller problem: one element fewer
}
```

Each call waits for the one below it, so the stack holds one frame per element: `sum` on a
million elements throws `StackOverflowError`. A loop does the same job in O(1) stack.

## Overlap

Draw the calls of naive `fib(5)` as a tree: `fib(3)` appears twice, `fib(2)` three times,
`fib(1)` five times. The tree has about 1.6ⁿ nodes, but only n + 1 *different* subproblems.
That gap is what dynamic programming removes.

## Top-down: memoize

Keep the recursion, and store every answer the first time it is computed. Before computing,
look in the memo. Each subproblem is then solved once, and `fib(n)` takes O(n) calls.

## Bottom-up: tabulate

Decide an order in which every subproblem's dependencies come first, and fill a table in that
order with loops:

```java
long[] f = new long[n + 1];
f[1] = 1;
for (int i = 2; i <= n; i++) f[i] = f[i - 1] + f[i - 2];
```

No recursion means no stack depth limit, and often you can keep just the last row or the last
two values, cutting memory to O(1) or O(row). The recipe for any DP: define what a table entry
means, write the recurrence, identify the base cases, and choose a fill order.
'''

