id = "java-basics"
language = "java"
title = "Java: From Zero to Confident"
level = "beginner"
summary = "A serious, guided course in modern Java 21 that takes you from your very first program to the ideas that power large backend systems: objects and interfaces, generics, streams, records and sealed types, and concurrency with virtual threads. You read a short concept, build muscle memory by typing small, complete programs, then prove what you learned by writing real classes that hidden tests check."
overview = '''
## What Java is

Java is a general-purpose, statically typed, object-oriented language. You write source
files, the compiler `javac` turns them into **bytecode**, and the **Java Virtual Machine**
(the JVM) runs that bytecode on Linux, macOS or Windows alike, compiling hot code to fast
machine code as it goes.

## Where it is used

Java runs a large share of enterprise backends, from banks to online shops, often with
frameworks such as Spring. It is one of the two main languages of Android apps, alongside
Kotlin, and big-data tools such as Apache Hadoop, Kafka and Cassandra are built on the JVM.
Java also prepares you for Kotlin and C#, which share many of its ideas.

## The mental model this course builds

- **Everything lives in a class**, and every value has a **static type** that the compiler
  checks before the program runs.
- **Objects and interfaces**: programs are built from objects that hide their data behind
  methods, and from interfaces that let different classes be used the same way.
- **References and the garbage collector**: variables refer to objects, and the JVM's
  garbage collector reclaims objects that nothing refers to, so you never free memory by
  hand.
- **Modern Java 21**: records for plain data, sealed types and pattern matching for
  `switch`, streams and lambdas, and virtual threads for massive concurrency.

## How the course is organised

**Basic** units start from zero: your first program, variables and types, strings,
decisions, loops and methods. **Intermediate** units cover collections, classes,
inheritance and interfaces, records and enums, exceptions, generics, lambdas and streams,
followed by a "production Java" block: `Optional`, `java.time`, files with NIO, regular
expressions, equality and ordering, and immutability. **Advanced** units tackle sealed
types and pattern matching, iterators, concurrency with executors, synchronization,
`CompletableFuture` and virtual threads, and then data structures and algorithms built by
hand: stacks and queues, linked lists, hash tables, binary search trees, sorting, recursion
and dynamic programming.

## How the steps work

Each unit opens with a **concept** to read. Three **drills** follow: you retype a short,
complete program, guided by a comment on every line, and the tutor runs it with
`java Main.java`. A **challenge** closes the unit: you write a class with the requested
methods, and hidden tests check normal and edge cases. Once you pass, a reference solution
with its time and space complexity is revealed.
'''

# ── g1-basic ────────────────────────────────────────────────────────────

[[unit]]
id = "java-u01-hello"
title = "Hello, Java"
level = "basic"
difficulty = 1
intro = '''
Your very first steps in Java: what a program is, how the compiler and the Java Virtual
Machine work together to run it, and why even the smallest Java program lives inside a
class with a `main` method. By the end you will write a tiny class with a greeting method
and let the hidden tests check it.
'''
concepts = '''
## The idea

A computer does not understand English; it follows instructions, one after another. A
**programming language** is a precise notation that people can read and that a tool can
turn into actions the machine carries out.

Java turns your text into actions in two stages. First the **compiler**, `javac`, reads your
source file (`Main.java`), checks it for mistakes and translates it into **bytecode**, a
compact instruction set stored in a `.class` file. Then the **Java Virtual Machine** (the
JVM, started with the `java` command) loads that bytecode and runs it. Because every
operating system has its own JVM, the same bytecode runs on Linux, macOS and Windows.

```text
javac Main.java     # compile: Main.java -> Main.class
java Main           # run: the JVM executes Main.class
java Main.java      # both in one go (the "source launcher")
```

The tutor uses the last form: `java Main.java` compiles your file in memory and runs it
straight away.

## Why a class and a main method

In Java, every piece of code lives inside a **class**. For now, think of a class as the
named box that holds your program; from unit 9 on you will see that classes are also
blueprints for objects. The JVM also needs to know where to begin, so it looks for one
method with this exact header:

```java
public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, Java!");
    }
}
```

`public` lets the JVM see it, `static` means it can run without creating an object first,
`void` says it returns nothing, and `String[] args` receives any command-line arguments. You
will understand every word by unit 9; today, treat the two outer lines as the frame every
program sits in. Inside `main`, statements run from top to bottom and each one ends with a
semicolon. `System.out.println` writes text to **standard output** and ends the line;
`System.out.print` does the same without the line break. Text between `//` and the end of
the line is a **comment**, and `/* ... */` can span several lines.

## What is special or tricky

- **Every statement ends with `;`.** Forget one and the compiler reports `';' expected`.
- **Case matters.** `system.out.println` gives `package system does not exist`, and
  `string` instead of `String` gives `cannot find symbol`.
- **Braces must balance.** A missing `}` ends in `reached end of file while parsing`.
- **A public class lives in a file of the same name.** With `javac`, `public class Hello`
  inside `Main.java` fails with `class Hello is public, should be declared in a file named
  Hello.java`.
- **No `main`, no start.** Running a class without it prints `can't find main(String[])
  method in class: Main`.
- **Compile errors stop everything.** The compiler checks the whole file first, so a single
  error means nothing runs at all, not even the lines above it.

## What you will practise

You will type a first program with comments, mix `print` and `println` with escape
sequences such as `\n` and `\"`, and print the results of small calculations. Then you will
write your first class with a method that builds a greeting and returns it.
'''

[[unit.step]]
kind = "concept"
id = "java-u01-c1-anatomy"
title = "The anatomy of a Java program"
points = 5
difficulty = 1
intro = '''
Before you write anything, picture what happens when you run a Java file. The compiler
checks the whole file and turns it into bytecode, then the JVM finds the `main` method and
runs its statements one after another. Anything you print travels to **standard output**,
which the terminal shows on screen.
'''
body = '''
## Three layers, one program

```java
// Main.java: the smallest useful Java program.
public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, Java!");
        System.out.println(2 + 3);
    }
}
```

Read it from the outside in:

- **`public class Main { ... }`** declares a class named `Main`. Everything else sits
  between its braces. Java has no code floating outside a class.
- **`public static void main(String[] args) { ... }`** is the **entry point**. The JVM looks
  for exactly this header and starts running there. If it is missing or misspelled, the
  program cannot start.
- **`System.out.println(...)`** is a statement. It writes its argument to standard output
  and then ends the line. The semicolon closes the statement.
- **`2 + 3`** is an **expression**. Java works out its value, `5`, before `println`
  receives it.

The indentation is not required by the compiler, but every Java programmer uses it: four
spaces per level of braces makes the structure visible at a glance.

## What the tutor does

In each drill you type a small, complete program. When your code matches the target, the
tutor saves it as `Main.java` and runs `java Main.java`, so you see exactly what it prints.
In each challenge you write a class with methods instead, without a `main`, and hidden
tests call those methods with many inputs to check what they return.
'''

