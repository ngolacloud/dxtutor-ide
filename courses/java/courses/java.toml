'''
prompt = '''
Write a `Range` record that implements `Iterable<Integer>` with an anonymous `Iterator`, use
it in a for-each loop, and show that two iterators walk independently.

**Why:** implementing `Iterable` is all it takes to plug your own type into the enhanced `for`
loop, and the anonymous class shows where the walk's state really lives.
'''
target = '''
import java.util.Iterator;
import java.util.NoSuchElementException;

public class Main {
    public static void main(String[] args) {
        Range range = new Range(10, 25, 5);
        for (int x : range) {
            System.out.println("value " + x);
        }
        Iterator<Integer> it = range.iterator();
        it.next();
        System.out.println(it.next() + " then a fresh iterator gives " + range.iterator().next());
    }
}

record Range(int start, int end, int step) implements Iterable<Integer> {
    @Override
    public Iterator<Integer> iterator() {
        return new Iterator<>() {
            private int current = start;

            @Override
            public boolean hasNext() {
                return current < end;
            }

            @Override
            public Integer next() {
                if (!hasNext()) throw new NoSuchElementException();
                int value = current;
                current += step;
                return value;
            }
        };
    }
}
'''
