[[unit.step]]
kind = "challenge"
id = "java-u16-x1-settings"
title = "Null-safe settings"
points = 30
difficulty = 16
entry = "Settings"
intro = '''
Every service reads settings, and every settings file has missing keys, blank values and typos.
A robust reader turns all of those into empty Optionals at one boundary, so the rest of the
program never meets a `null` and only fails, with a clear message, when a value is truly required.
'''
instructions = '''
## Your turn

Write a class `Settings` that wraps raw text settings:

```java
public class Settings {
    public Settings(Map<String, String> values)
    public Optional<String> get(String key)
    public Optional<Integer> getInt(String key)
    public int getInt(String key, int fallback)
    public String require(String key)
}
```

Rules:

- The constructor throws `NullPointerException` if `values` is `null`. It **copies** the map,
  so later changes to the caller's map do not affect the settings. Values inside the map may
  be `null` (use a `HashMap` copy).
- `get(key)` returns the value with surrounding whitespace stripped. It is **empty** when the
  key is missing, its value is `null`, or the stripped value is empty. It never returns `null`.
- `getInt(key)` is `get(key)` parsed as an `int`. It is empty when the setting is missing or is
  not a valid integer (for example `"abc"`, `"12.5"` or a number too large for an `int`): it must
  not throw. Negative numbers such as `"-15"` are valid.
- `getInt(key, fallback)` returns the parsed value, or `fallback` when `getInt(key)` is empty.
- `require(key)` returns `get(key)`'s value, or throws `IllegalStateException` whose message
  contains the key, for example `missing setting: db.url`.

Examples, for a map `{"port" = " 5432 ", "host" = "db", "name" = "  "}`:

- `get("host")` → `Optional[db]`; `get("name")` and `get("user")` → `Optional.empty`
- `getInt("port")` → `Optional[5432]`; `getInt("host")` → `Optional.empty`
- `getInt("retries", 3)` → `3`
- `require("user")` → throws `IllegalStateException("missing setting: user")`

**Hint:** build every method on top of `get`. `Integer.parseInt` throws
`NumberFormatException`; catch it in a small helper that returns an `Optional`, and connect it
with `flatMap`.

Hidden tests decide correctness.
'''
starter = '''
import java.util.Map;
import java.util.Optional;

public class Settings {
    // Copy `values` (reject a null map). Every lookup goes through get().
    public Settings(Map<String, String> values) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The stripped value, or empty when missing, null or blank. Never null.
    public Optional<String> get(String key) {
        throw new UnsupportedOperationException("not implemented");
    }

    // get(key) parsed as an int; empty when missing or not a valid int.
    public Optional<Integer> getInt(String key) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The parsed value, or `fallback`.
    public int getInt(String key, int fallback) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The value, or an IllegalStateException whose message names the key.
    public String require(String key) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
