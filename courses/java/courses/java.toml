[[unit.step]]
kind = "challenge"
id = "java-u18-x1-file-tools"
title = "File tools: size, search and backup"
points = 30
difficulty = 18
entry = "FileTools"
intro = '''
Disk-usage reports, "find all `.log` files" and "keep a backup before you edit" are the bread
and butter of tooling and operations scripts. Each one is a short walk over a directory tree or a
single copy, and each one must close its streams and report missing files honestly.
'''
instructions = '''
## Your turn

Write a class `FileTools` with three static methods:

```java
public class FileTools {
    static long totalSize(Path dir) throws IOException
    static List<String> findByExtension(Path dir, String ext) throws IOException
    static Path backup(Path file) throws IOException
}
```

**`totalSize(dir)`** returns the sum of the sizes, in bytes, of all **regular files** anywhere
under `dir` (subdirectories included). Directories themselves count as 0. An empty tree gives
`0`.

**`findByExtension(dir, ext)`** returns the paths of all regular files under `dir` whose name
ends with `"." + ext` (case-sensitive; `ext` is given without the dot, e.g. `"txt"`). Each path
is **relative to `dir`**, written with `/` between parts (for example `docs/a.txt`), and the
list is sorted in natural `String` order. A directory whose name happens to end in `.txt` is
not a file and must not be listed.

**`backup(file)`** copies `file` to a sibling named after it with `.bak` added (`notes.txt` →
`notes.txt.bak`), replacing an existing backup, and returns the backup's path. The original is
left untouched.

Errors: if `dir` or `file` does not exist, let the `IOException` (a `NoSuchFileException`)
propagate. Close every stream you open.

Examples, for a tree `a.txt` (5 bytes), `docs/b.txt` (3 bytes), `docs/c.md` (10 bytes):

- `totalSize(root)` → `18`
- `findByExtension(root, "txt")` → `["a.txt", "docs/b.txt"]`
- `backup(root.resolve("a.txt"))` → `root/a.txt.bak`, a copy of `a.txt`

**Hint:** `Files.walk` in try-with-resources, `Files.isRegularFile`, `dir.relativize(p)`, and
`Files.copy` with `StandardCopyOption.REPLACE_EXISTING`. `Files.size` throws `IOException`, so
sum it in a plain loop rather than inside a lambda.

Hidden tests decide correctness.
'''
