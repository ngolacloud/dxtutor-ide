[unit.step.gabarito]
solution = '''
import java.util.List;

interface Payable {
    long payCents();

    default String payLabel() {
        long cents = payCents();
        return String.format("$%d.%02d", cents / 100, cents % 100);
    }
}

abstract class Employee implements Payable {
    private final String name;

    protected Employee(String name) {
        if (name == null || name.isBlank()) {
            throw new IllegalArgumentException("name must not be blank");
        }
        this.name = name;
    }

    public String name() {
        return name;
    }

    public abstract String role();

    @Override
    public String toString() {
        return name + " (" + role() + "): " + payLabel();
    }

    protected static long requireNonNegative(long value, String what) {
        if (value < 0) {
            throw new IllegalArgumentException(what + " must not be negative, got " + value);
        }
        return value;
    }
}

class Salaried extends Employee {
    private final long monthlyCents;

    public Salaried(String name, long monthlyCents) {
        super(name);
        this.monthlyCents = requireNonNegative(monthlyCents, "salary");
    }

    @Override
    public long payCents() {
        return monthlyCents;
    }

    @Override
    public String role() {
        return "salaried";
    }
}

class Hourly extends Employee {
    private static final int REGULAR_HOURS = 160;

    private final long rateCents;
    private final int hours;

    public Hourly(String name, long rateCents, int hours) {
        super(name);
        this.rateCents = requireNonNegative(rateCents, "rate");
        this.hours = (int) requireNonNegative(hours, "hours");
    }

    @Override
    public long payCents() {
        int regular = Math.min(hours, REGULAR_HOURS);
        int overtime = hours - regular;
        return rateCents * regular + rateCents * overtime * 3 / 2;
    }

    @Override
    public String role() {
        return "hourly";
    }
}

class Manager extends Salaried {
    private final long bonusCents;

    public Manager(String name, long monthlyCents, long bonusCents) {
        super(name, monthlyCents);
        this.bonusCents = requireNonNegative(bonusCents, "bonus");
    }

    @Override
    public long payCents() {
        return super.payCents() + bonusCents;
    }

    @Override
    public String role() {
        return "manager";
    }
}

final class Payroll {
    private Payroll() {
    }

    public static long total(List<? extends Payable> staff) {
        long sum = 0;
        for (Payable p : staff) {
            sum += p.payCents();
        }
        return sum;
    }
}
'''
time = "O(n)"
space = "O(1)"
justification = '''
Each `payCents()` is a constant number of arithmetic operations, and a `Manager` adds one
`super` call on top, so every pay computation is O(1). `Payroll.total` calls it once per
element of the list, so totalling `n` employees takes **O(n)** time. It keeps a single
`long` accumulator, so the extra space is **O(1)**; the employees themselves are the input.
`toString` and `payLabel` build strings bounded by the name length and at most 19 digits.

The design is what makes the loop that simple. `total` depends only on the `Payable`
interface, so it accepts employees and lambdas alike, and dynamic dispatch selects each
object's pay rule at run time: adding a `Contractor` class would need no change to
`Payroll`. Validation lives once in `Employee` (the name) and in a shared helper (the
amounts), and `Manager` reuses the salary rule through `super.payCents()` instead of copying
it. Using `long` cents keeps the arithmetic exact; integer division in
`rateCents * overtime * 3 / 2` rounds half-cents down, as the specification requires.
'''

[[unit]]
id = "java-u11-records-enums"
title = "Records and enums"
level = "intermediate"
difficulty = 11
intro = '''
Two modern Java features remove most of the boilerplate from everyday types. A **record**
declares a data carrier in one line and gets its constructor, accessors, `equals`, `hashCode`
and `toString` for free; an **enum** lists a fixed set of named constants that can carry
fields and methods. The challenge models playing cards with two enums and a record that
parses text such as `"10H"`.
'''
concepts = '''
## The idea

Many classes exist only to carry data: a point, an amount of money, a row read from a file.
Writing one by hand means private fields, a constructor, accessors, `equals`, `hashCode` and
`toString`, dozens of lines that hide two or three facts. A **record** states those facts
once and the compiler generates the rest. Other types have a small, fixed set of possible
values: the four suits of a deck, the days of the week, the states of an order. An **enum**
names each one, so the compiler rejects anything else, whereas a `String` or `int` constant
would accept `"Hearts "` or `7` just as happily.

## How Java does it

```java
record Point(int x, int y) {
    Point {                                      // compact constructor: validation
        if (x < 0 || y < 0) throw new IllegalArgumentException("negative coordinate");
    }
    Point withX(int newX) { return new Point(newX, y); }
}

Point p = new Point(3, 4);
p.x();                         // 3: accessors are named after the components
p.equals(new Point(3, 4));     // true: equality compares the components
```

A record's fields are `private final`, so a record is a (shallowly) immutable value: to
"change" one, you build a new record. The **compact constructor** has no parameter list. It
runs before the fields are assigned and may reassign the parameters to normalise them, as in
`name = name.strip();`.

```java
enum Level {
    LOW(1), MEDIUM(5), HIGH(10);                 // each constant calls the constructor
    private final int weight;
    Level(int weight) { this.weight = weight; }
    int weight() { return weight; }
}
```

Every enum has `values()` (all constants in declaration order), `valueOf("HIGH")`, `name()`
and `ordinal()`. Each constant is a single object, so `==` compares them safely, and they
work as map keys and in `switch`. A switch expression that covers every constant needs no
`default`.

## What is special or tricky

- **Records are shallowly immutable.** A `List` component can still be changed by whoever
  passed it in, unless the compact constructor copies it with `List.copyOf`.
- **Records cannot extend a class** (they already extend `java.lang.Record`) or declare
  extra instance fields: `field declaration must be static`. They can implement interfaces
  and add methods and static factories.
- **`valueOf` is strict.** `Level.valueOf("high")` throws
  `IllegalArgumentException: No enum constant Level.high`. Normalise the text first, or write
  your own lookup.
- **Don't store `ordinal()`.** Inserting a constant renumbers the ones after it; store
  `name()` instead.
- **Enum constructors are private.** `new Level(3)` fails with
  `enum classes may not be instantiated`.
- **Incomplete switches.** A switch expression that misses a constant and has no `default`
  fails with `the switch expression does not cover all possible input values`, which is
  exactly the help you want when someone adds a new constant.

## What you will practise

You will declare records and rely on their generated methods, validate and normalise data
in compact constructors, and give enums fields, methods and a switch. The challenge parses
playing cards into a record built from two enums.
'''

[[unit.step]]
kind = "concept"
id = "java-u11-c1-values"
title = "Value types: records and enums"
points = 5
difficulty = 11
intro = '''
A **value type** is defined by its contents, not by its identity: two points with the same
coordinates are the same point. Records give Java value semantics for data, and enums give it
a closed set of values the compiler can check exhaustively.
'''
body = '''
## What a record generates

```java
record Money(long cents, String currency) { }
```

From that one line, the compiler writes:

- two `private final` fields, `cents` and `currency`;
- a **canonical constructor** `Money(long cents, String currency)`;
- accessors `cents()` and `currency()`;
- `equals` and `hashCode` that compare every component, so records work as map keys and in
  sets;
- `toString`, which prints `Money[cents=250, currency=EUR]`.

You may add methods, static fields and static factories, and implement interfaces. Validation
goes in a **compact constructor**, `Money { ... }`, which sees the parameters and runs before
the fields are assigned.

## What an enum is

```java
enum Direction { NORTH, EAST, SOUTH, WEST }
```

`Direction` is a class with exactly four instances, created once when the class loads. Since
no other instance can ever exist, `==` is a correct comparison, `values()` lists them all in
order, and a `switch` over a `Direction` can be checked for completeness by the compiler.
Enums can have fields, constructors and methods, so data that belongs to each constant (a
coin's value, a planet's mass) lives with it rather than in a parallel array.

## When to use which

Use a record when there are many possible values described by a few components. Use an enum
when the set of values is small, fixed and known when you write the code. The two combine
well: a `Card` record made of a `Rank` enum and a `Suit` enum describes all 52 cards with
almost no code.
'''

