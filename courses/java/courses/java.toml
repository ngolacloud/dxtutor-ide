'''
prompt = '''
Write a generic `Filtered<T>` iterator that wraps another iterator and yields only the
elements that satisfy a `Predicate`, then use it to skip empty strings.

**Why:** this is how lazy pipelines such as streams work inside: each stage pulls from the one
before it, one element at a time, and nothing is copied into an intermediate list.
'''
target = '''
import java.util.Iterator;
import java.util.List;
import java.util.NoSuchElementException;
import java.util.function.Predicate;

public class Main {
    public static void main(String[] args) {
        Iterator<String> words = List.of("apple", "", "kiwi", "", "", "plum").iterator();
        Iterator<String> it = new Filtered<>(words, w -> !w.isEmpty());
        while (it.hasNext()) System.out.println(it.next());
    }
}

class Filtered<T> implements Iterator<T> {
    private final Iterator<T> source;
    private final Predicate<T> keep;
    private T next;
    private boolean ready;

    Filtered(Iterator<T> source, Predicate<T> keep) {
        this.source = source;
        this.keep = keep;
    }

    @Override
    public boolean hasNext() {
        while (!ready && source.hasNext()) {
            next = source.next();
            ready = keep.test(next);
        }
        return ready;
    }

    @Override
    public T next() {
        if (!hasNext()) throw new NoSuchElementException();
        ready = false;
        return next;
    }
}
'''
