intro = '''
Data parallelism splits one big job into independent chunks that threads process at the same
time. If each thread writes only to its own slot, no two threads touch the same memory, and
`join` both waits for them and makes their writes visible to `main`.
'''
prompt = '''
Sum the numbers 1 to 1,000 with four threads, each summing a quarter of the array into its own
slot, then join them and add the partial sums.

**Why:** this is the fork-join shape behind parallel streams and map-reduce: split, work
independently, wait, combine.
'''
target = '''
import java.util.Arrays;

public class Main {
    public static void main(String[] args) throws InterruptedException {
        int[] data = new int[1_000];
        for (int i = 0; i < data.length; i++) {
            data[i] = i + 1;
        }
        int parts = 4;
        long[] partial = new long[parts];
        Thread[] workers = new Thread[parts];
        for (int p = 0; p < parts; p++) {
            final int id = p;
            workers[p] = new Thread(() -> {
                int chunk = data.length / parts;
                for (int i = id * chunk; i < (id + 1) * chunk; i++) {
                    partial[id] += data[i];
                }
            }, "worker-" + p);
            workers[p].start();
        }
        long total = 0;
        for (int p = 0; p < parts; p++) {
            workers[p].join();
            total += partial[p];
        }
        System.out.println("partials: " + Arrays.toString(partial));
        System.out.println("total: " + total);
    }
}
'''
