test("carts are values: equals and hashCode", () -> {
    var a = Cart.empty().add("milk", 2).add("bread", 1);
    var b = Cart.empty().add("bread", 1).add("milk", 1).add("milk", 1);
    var c = new Cart(Map.of("milk", 2, "bread", 1));
    check(a.equals(b) && b.equals(a) && a.equals(c), "same items must be equal");
    equal(a.hashCode(), b.hashCode());
    equal(a.hashCode(), c.hashCode());
    check(!a.equals(Cart.empty().add("milk", 2)), "different items must not be equal");
    check(!a.equals(null), "equals(null) must be false");
