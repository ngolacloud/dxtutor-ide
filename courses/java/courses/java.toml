[[unit.step]]
kind = "challenge"
id = "java-u13-x1-generic-algorithms"
title = "A generic pair and generic algorithms"
points = 30
difficulty = 13
entry = "Algos"
intro = '''
Generic algorithms are written once against type parameters and bounds, then reused with every
type that fits. Getting the bounds and wildcards right is what makes them usable: too strict and
callers' code stops compiling, too loose and the method cannot do its job. Each method here
needs only a single pass over its input.
'''
instructions = '''
## Your turn

Complete a generic record and a class of generic static methods. The starter has the exact
signatures; don't change them, because the hidden tests call them with `String`, `Integer`,
`Double`, `Number`, `Object` and `LocalDate`.

```java
record Pair<A, B>(A first, B second) {
    Pair<B, A> swap()
}

class Algos {
    static <A, B> List<Pair<A, B>> zip(List<A> left, List<B> right)
    static <T extends Comparable<? super T>> T maxOf(List<? extends T> items)
    static <T> T maxBy(List<? extends T> items, Comparator<? super T> order)
    static <T> void copyInto(List<? super T> target, List<? extends T> source)
}
```

- `swap()` returns a new pair with the two values exchanged.
- `zip` pairs elements at the same index into a new list and stops at the end of the shorter
  list: `zip(["a", "b", "c"], [1, 2])` is `[Pair[a, 1], Pair[b, 2]]`.
- `maxOf` returns the largest element by natural order (`compareTo`).
- `maxBy` returns the largest element according to `order`. When several are equally large,
  return the **first** of them.
- Both `maxOf` and `maxBy` throw `NoSuchElementException` for an empty list.
- `copyInto` appends every element of `source`, in order, to the end of `target`.

Examples:

- `Algos.maxOf(List.of(3, -1, 7))` is `7`; `Algos.maxOf(List.of("kiwi", "pear", "fig"))` is
  `"pear"`.
- `Algos.maxBy(List.of("bb", "a", "cc"), Comparator.comparingInt(String::length))` is `"bb"`.
- Copying a `List<Integer>` into a `List<Number>` that holds `0.5` gives `[0.5, 1, 2]`.

**Hint:** inside these methods you only know that the elements are some `T`. Read them into a
variable of type `T`, compare with `compareTo` or `order.compare`, and replace the best one only
when the new element is strictly larger.

Hidden tests decide correctness.
'''
