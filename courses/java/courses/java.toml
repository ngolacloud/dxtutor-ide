intro = '''
A record's `equals` and `hashCode` are derived from its components, so two records with the
same data are equal even when they are different objects. That makes records safe keys for
hash-based collections, and immutability means a "modified" record is always a new one.
'''
prompt = '''
Declare a `Point` record with a static constant and two methods, compare two equal points,
derive a moved copy, and put points in a `HashSet`.

**Why:** you get a constructor, accessors, `equals`, `hashCode` and `toString` from one line,
and seeing them work shows what a record really is.
'''
target = '''
import java.util.HashSet;
import java.util.Set;

public class Main {
    public static void main(String[] args) {
        Point a = new Point(3, 4);
        Point b = new Point(3, 4);
        System.out.println(a + " x=" + a.x() + " y=" + a.y());
        System.out.println("equal? " + a.equals(b) + ", same object? " + (a == b));
        System.out.println("distance " + a.distanceFromOrigin());

        Point moved = a.withX(10);
        System.out.println(moved + ", but a is still " + a);

        Set<Point> visited = new HashSet<>();
        visited.add(a);
        visited.add(b);
        visited.add(Point.ORIGIN);
        System.out.println(visited.size() + " points, origin? " + visited.contains(new Point(0, 0)));
    }
}

record Point(int x, int y) {
    static final Point ORIGIN = new Point(0, 0);

    double distanceFromOrigin() {
        return Math.sqrt(x * x + y * y);
    }

    Point withX(int newX) {
        return new Point(newX, y);
    }
}
'''
