intro = '''
The number of right-and-down paths to a cell is the number of paths to the cell above plus the
number to the cell on the left. Filling the table row by row guarantees both are ready before
they are needed, so there is no recursion and no memo lookup.
'''
prompt = '''
Count the paths from the top-left to the bottom-right corner of a grid with walls, moving only
right or down, then count them on an open 34 × 34 grid.

**Why:** this is the bottom-up recipe in its purest form: define a cell, write the recurrence,
set the base case, pick a fill order. The 34 × 34 answer also shows why the table holds `long`s.
'''
target = '''
import java.util.Arrays;

public class Main {
    public static void main(String[] args) {
        String[] walls = {
            "....",
            ".#..",
            "...#",
            "#...",
        };
        System.out.println("walls: " + countPaths(walls));
        String[] open = new String[34];
        Arrays.fill(open, ".".repeat(34));
        System.out.println("open 34x34: " + countPaths(open));
    }

    static long countPaths(String[] grid) {
        int rows = grid.length, cols = grid[0].length();
        long[][] ways = new long[rows][cols];
        for (int r = 0; r < rows; r++) {
            for (int c = 0; c < cols; c++) {
                if (grid[r].charAt(c) == '#') continue;
                if (r == 0 && c == 0) ways[r][c] = 1;
                else ways[r][c] = (r > 0 ? ways[r - 1][c] : 0) + (c > 0 ? ways[r][c - 1] : 0);
            }
        }
        return ways[rows - 1][cols - 1];
    }
}
'''
