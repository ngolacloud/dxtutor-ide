entry = "Card"
intro = '''
Parsing text into a validated value type is everyday work: dates, currencies, product codes,
and here playing cards. Two enums capture the closed sets of ranks and suits, and a record
combines them into a value with structural equality. The parser's job is to accept every
valid spelling and reject everything else.
