instructions = '''
## Your turn

Implement the generic class `RingDeque<T>` with a no-argument constructor:

```java
void addFirst(T value)    void addLast(T value)
T removeFirst()           T removeLast()
T peekFirst()             T peekLast()
int size()                boolean isEmpty()
```

It must behave exactly like `ArrayDeque` for these operations.

Rules:

- Store the elements in **your own array** (an `Object[]` field) used as a circular buffer.
  Don't keep them in an `ArrayDeque`, `ArrayList` or any other collection.
- Start small (8 slots is fine) and **double** the capacity when the array is full, copying
  the elements in logical order.
- All operations are amortized **O(1)**: never shift the elements.
- `removeFirst` and `removeLast` throw `NoSuchElementException` when empty; `peekFirst` and
  `peekLast` return `null` when empty.
- `addFirst(null)` and `addLast(null)` throw `NullPointerException`.

Examples:

- `addLast(1)`, `addLast(2)`, `addLast(3)`: `removeFirst()` returns 1 (a queue), while
  `removeLast()` would return 3 (a stack).
- `addFirst(1)`, `addFirst(2)`: `peekFirst()` is 2 and `peekLast()` is 1.

**Hint:** keep `head` and `size`. The back slot is `(head + size) % data.length`, and stepping
the head backwards is `(head - 1 + data.length) % data.length`, which never goes negative.

Hidden tests decide correctness.
'''
