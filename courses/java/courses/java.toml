[unit.step.gabarito]
solution = '''
// Rules: calendar and grading decisions. Reject invalid input with IllegalArgumentException.
public class Rules {

    // Divisible by 4, except centuries, unless divisible by 400.
    static boolean isLeapYear(int year) {
        return (year % 4 == 0 && year % 100 != 0) || year % 400 == 0;
    }

    // 90-100 "A", 80-89 "B", 70-79 "C", 60-69 "D", 0-59 "F"; otherwise throw.
    static String grade(int score) {
        if (score < 0 || score > 100) {
            throw new IllegalArgumentException("score out of range: " + score);
        }
        if (score >= 90) {
            return "A";
        } else if (score >= 80) {
            return "B";
        } else if (score >= 70) {
            return "C";
        } else if (score >= 60) {
            return "D";
        }
        return "F";
    }

    // Days in month 1..12 of the given year; otherwise throw.
    static int daysInMonth(int month, int year) {
        return switch (month) {
            case 1, 3, 5, 7, 8, 10, 12 -> 31;
            case 4, 6, 9, 11 -> 30;
            case 2 -> isLeapYear(year) ? 29 : 28;
            default -> throw new IllegalArgumentException("month out of range: " + month);
        };
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Each method makes a fixed number of comparisons whatever its input: `isLeapYear` computes
at most three remainders, `grade` checks the range and then at most four thresholds, and
`daysInMonth` performs one switch plus, for February, one call to `isLeapYear`. None of them
depends on the size of the numbers, so the time is **O(1)**. Nothing is allocated except,
on invalid input, a single exception object, so the space is **O(1)**.

The structure follows the rules directly. Validating the range first lets the grade chain
test only lower bounds, because each `else if` runs only when every higher threshold
failed. In `daysInMonth`, the multi-label arms list each group of months exactly once, and
the `default` arm can be a `throw`, which keeps the switch exhaustive while rejecting
months outside 1–12. A `switch` with constant cases is typically compiled to a jump table,
so it does not even compare against the cases one by one.
'''

[[unit]]
id = "java-u05-loops"
title = "Loops"
level = "basic"
difficulty = 5
intro = '''
Computers shine at repetition: doing the same steps thousands of times without getting
bored or making mistakes. This unit covers Java's four loops (`for`, the enhanced `for`,
`while` and `do`-`while`), when to choose each one, and how `break` and `continue` change
the flow inside them.
'''
concepts = '''
## The idea

A **loop** repeats a block of code while a condition stays true. Each repetition is an
**iteration**. Every loop needs three ingredients: a starting state, a condition that is
checked before (or after) each iteration, and progress towards making that condition
false. Forget the progress and you get an **infinite loop**, a program that never stops.

## How Java does it

The classic **`for` loop** packs the three ingredients into its header, which makes it the
natural choice for counting:

```java
for (int i = 0; i < 5; i++) {    // start; condition; update
    System.out.println(i);       // prints 0, 1, 2, 3, 4
}
```

The **enhanced `for`** (often read "for each") visits every element of an array or
collection, without an index:

```java
int[] primes = {2, 3, 5, 7};
for (int p : primes) {
    System.out.println(p);
}
```

The **`while` loop** checks its condition before each iteration, so it may run zero times.
It fits when you do not know in advance how many iterations you need. The **`do`-`while`**
loop checks the condition **after** the body, so the body always runs at least once.

```java
int n = 1000;
while (n > 1) {
    n /= 2;          // halves until it reaches 1
}
```

Inside any loop, **`break`** leaves the loop immediately and **`continue`** skips the rest
of the current iteration and moves on to the next one. Use them to stop early once you have
found what you were looking for, or to skip elements you do not care about.

## What is special or tricky

- **Off-by-one errors.** `i <= array.length` runs one time too many and throws
  `ArrayIndexOutOfBoundsException`. Counting from 0 with `<` is the idiom.
- **A stray semicolon.** `for (int i = 0; i < 3; i++);` has an empty body: the block
  below it runs once, after the loop.
- **Scope.** A variable declared in the `for` header exists only inside the loop. Using
  `i` after it fails with `cannot find symbol`.
- **Infinite loops** do not produce an error; the program just hangs. Check that every
  path through the body makes progress.
- **Overflow in conditions.** `i * i <= n` can overflow for large `n` (unit 2); `i <= n / i`
  asks the same question safely.
- **The enhanced `for` gives you copies.** Assigning to the loop variable does not change
  the array element.

## What you will practise

You will count with `for`, walk arrays and strings with the enhanced `for` and `continue`,
and use `while`, `do`-`while` and `break` for loops whose length is not known in advance.
The challenge asks for three classic number algorithms, one of which must stay fast and
correct up to `Integer.MAX_VALUE`.
'''

[[unit.step]]
kind = "concept"
id = "java-u05-c1-repetition"
title = "Choosing the right loop"
points = 5
difficulty = 5
intro = '''
All loops are built from the same three ingredients: a start, a condition and progress.
Java offers four shapes so that each kind of repetition reads naturally, and choosing the
right one makes the intent of the code obvious at a glance.
'''
body = '''
## Four loops, four situations

| Situation | Loop |
|---|---|
| Count a known number of times, or need the index | `for (int i = 0; i < n; i++)` |
| Visit every element, index not needed | `for (String s : names)` |
| Repeat until something happens, count unknown | `while (condition)` |
| Same, but the body must run at least once | `do { ... } while (condition);` |

Any of them can do the job; the right one announces your intent.

## Tracing a loop

The best way to understand a loop is to trace it by hand. Take:

```java
int total = 0;
for (int i = 1; i <= 3; i++) {
    total += i;
}
```

| Step | `i` | condition | `total` after |
|---|---|---|---|
| 1 | 1 | `1 <= 3` true | 1 |
| 2 | 2 | `2 <= 3` true | 3 |
| 3 | 3 | `3 <= 3` true | 6 |
| 4 | 4 | `4 <= 3` false | loop ends |

The condition is checked four times but the body runs three times: that extra check is
where off-by-one errors hide.

## Leaving early

`break` stops the loop at once, which is how a search ends as soon as it finds an answer.
`continue` jumps straight to the next iteration, which keeps "skip this element" logic flat
instead of nesting the whole body inside an `if`. Both affect only the innermost loop.

## Cost

A loop that runs `n` times and does constant work each time costs **O(n)**. Two nested
loops of `n` iterations each cost **O(n²)**. Counting iterations is how you will estimate
the speed of every algorithm in this course.
'''

