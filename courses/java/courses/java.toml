'''
target = '''
import java.util.List;
import java.util.TreeMap;
import java.util.TreeSet;

public class Main {
    public static void main(String[] args) {
        TreeMap<Integer, String> tiers = new TreeMap<>();
        tiers.put(0, "bronze");
        tiers.put(100, "silver");
        tiers.put(500, "gold");
        tiers.put(1000, "platinum");

        for (int points : new int[] {0, 99, 100, 742, 5000}) {
            System.out.println(points + " -> " + tiers.floorEntry(points).getValue());
        }
        System.out.println("next tier after 742 at " + tiers.higherKey(742));
