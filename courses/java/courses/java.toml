public class Billing {
    // Parse "yyyy-MM-dd" or "dd/MM/yyyy" strictly; IllegalArgumentException otherwise.
    static LocalDate parseDate(String text) {
        throw new UnsupportedOperationException("not implemented");
    }

    // First start.plusMonths(k), k >= 0, that is on or after today.
    static LocalDate nextBillingDate(LocalDate start, LocalDate today) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Days late, or 0 when paid on time or early.
    static long overdueDays(LocalDate due, LocalDate paid) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
