[unit.step.gabarito]
solution = '''
import java.util.Collections;
import java.util.Map;
import java.util.Objects;
import java.util.TreeMap;

public final class Cart {
    private static final Cart EMPTY = new Cart(Map.of());

    private final Map<String, Integer> items;

    public Cart(Map<String, Integer> items) {
        Objects.requireNonNull(items, "items");
        TreeMap<String, Integer> copy = new TreeMap<>();
        for (Map.Entry<String, Integer> e : items.entrySet()) {
            String sku = Objects.requireNonNull(e.getKey(), "sku");
            int quantity = Objects.requireNonNull(e.getValue(), "quantity");
            if (quantity <= 0) {
                throw new IllegalArgumentException("quantity must be positive for " + sku);
            }
            copy.put(sku, quantity);
        }
        this.items = Collections.unmodifiableMap(copy);
    }

    public static Cart empty() {
        return EMPTY;
    }

    public Cart add(String sku, int quantity) {
        Objects.requireNonNull(sku, "sku");
        if (quantity <= 0) {
            throw new IllegalArgumentException("quantity must be positive: " + quantity);
        }
        Map<String, Integer> next = new TreeMap<>(items);
        next.merge(sku, quantity, Integer::sum);
        return new Cart(next);
    }

    public Cart remove(String sku) {
        if (!items.containsKey(sku)) {
            return this;
        }
        Map<String, Integer> next = new TreeMap<>(items);
        next.remove(sku);
        return new Cart(next);
    }

    public int quantity(String sku) {
        return items.getOrDefault(sku, 0);
    }

    public int totalItems() {
        int total = 0;
        for (int quantity : items.values()) {
            total += quantity;
        }
        return total;
    }

    public Map<String, Integer> items() {
        return items;
    }

    @Override
    public boolean equals(Object o) {
        return o instanceof Cart other && items.equals(other.items);
    }

    @Override
    public int hashCode() {
        return items.hashCode();
    }

    @Override
    public String toString() {
        return "Cart" + items;
    }
}
'''
time = "O(n log n) per add/remove, O(log n) per quantity, O(n) for totalItems"
space = "O(n) per cart"
justification = '''
Let `n` be the number of distinct SKUs in the cart.

The constructor copies `n` entries into a `TreeMap`, each insertion O(log n), so building a cart
is **O(n log n)** time and **O(n)** space. `add` and `remove` copy the current map, change one
entry, and build a new cart: **O(n log n)** each. That copy is the deliberate price of
immutability; for a cart of a few dozen lines it is microseconds, and in exchange no cart ever
changes after it is built. (Persistent data structures can share most of the old structure and
bring this down to O(log n), at the cost of much more code.)

`quantity` is one `TreeMap` lookup, **O(log n)**, `totalItems` sums `n` values in **O(n)**, and
`items()` is **O(1)** because it returns the same unmodifiable view every time. Handing out that
view is safe because nobody else holds a reference to the `TreeMap` underneath: the constructor
created it and validated every entry while copying, so the caller's map cannot change the cart
afterwards, and the view rejects every write, including `Entry.setValue`. `equals` and
`hashCode` delegate to the map, which compares contents regardless of insertion history, so
equal carts are equal values in a `HashSet`. `remove` returns `this` when nothing changes,
which is safe only because the cart is immutable.
'''

