record Var(String name) implements Expr {}

record Add(Expr left, Expr right) implements Expr {}

record Mul(Expr left, Expr right) implements Expr {}

record Neg(Expr operand) implements Expr {}

class Exprs {
    // Compute the value of e; a Var reads env, and a missing name throws IllegalArgumentException.
    static long eval(Expr e, Map<String, Long> env) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Render e as text: 7, x, (a + b), (a * b), -a.
    static String show(Expr e) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Simplify the children first, then apply the rules from the instructions.
    static Expr simplify(Expr e) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
