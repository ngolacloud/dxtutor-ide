public class Main {
    static final Map<Integer, Customer> CUSTOMERS = Map.of(
            1, new Customer("Ana", new Address("Luanda")),
            2, new Customer("Rui", null));

    public static void main(String[] args) {
        for (int id = 1; id <= 3; id++) {
            String city = find(id)
                    .flatMap(Customer::address)
                    .map(Address::city)
                    .orElse("unknown");
            System.out.println(id + " -> " + city);
        }
        try {
            find(3).orElseThrow();
        } catch (NoSuchElementException e) {
            System.out.println("error: " + e.getMessage());
        }
        Customer rui = find(2).orElseThrow(() -> new IllegalStateException("no customer 2"));
        System.out.println(rui.name());
    }

    static Optional<Customer> find(int id) {
        return Optional.ofNullable(CUSTOMERS.get(id));
    }
}

record Address(String city) {}

record Customer(String name, Address home) {
    Optional<Address> address() {
        return Optional.ofNullable(home);
    }
}
