test("the last chunk can be shorter", () -> equal(Chunks.chunk(List.of(1, 2, 3, 4, 5), 3),
        List.of(List.of(1, 2, 3), List.of(4, 5))));
test("empty input gives no chunks", () -> equal(Chunks.chunk(List.of(), 4), List.of()));
test("size 1 wraps every element", () -> equal(Chunks.chunk(List.of(9, 8, 7), 1),
        List.of(List.of(9), List.of(8), List.of(7))));
test("a size larger than the list gives one chunk", () -> {
