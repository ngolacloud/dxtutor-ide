});
test("doubles past a load factor of 0.75", () -> {
    var t = new HashTable<Integer, Integer>();
    equal(t.capacity(), 8);
    for (int i = 0; i < 6; i++) t.put(i, i);
    equal(t.capacity(), 8);
    t.put(0, 100);
    equal(t.capacity(), 8);
    t.put(6, 6);
    equal(t.capacity(), 16);
    for (int i = 0; i < 6; i++) t.remove(i);
    equal(t.capacity(), 16);
    var small = new HashTable<String, Integer>(2);
    small.put("x", 1);
    equal(small.capacity(), 2);
    small.put("y", 2);
    equal(small.capacity(), 4);
    equal(small.get("x"), 1);
    var hundred = new HashTable<String, Integer>();
    for (int i = 0; i < 100; i++) hundred.put("key-" + i, i);
    equal(hundred.capacity(), 256);
    equal(hundred.size(), 100);
    for (int i = 0; i < 100; i++) equal(hundred.get("key-" + i), i);
    for (int i = 0; i < hundred.capacity(); i++) {
        for (var e : hundred.buckets.get(i)) {
            equal(Math.floorMod(e.key().hashCode(), hundred.capacity()), i);
        }
    }
});
test("200,000 keys stay fast", () -> {
    int n = 200_000;
    var t = new HashTable<Integer, Integer>();
    long start = System.nanoTime();
    for (int i = 0; i < n; i++) t.put(i * 7919, i);
    for (int i = 0; i < n; i += 2) t.remove(i * 7919);
    long ms = (System.nanoTime() - start) / 1_000_000;
    equal(t.size(), n / 2);
    equal(t.capacity(), 524_288);
    int wrong = 0;
    for (int i = 0; i < n; i++) {
        boolean ok = i % 2 == 1 ? Integer.valueOf(i).equals(t.get(i * 7919)) : !t.containsKey(i * 7919);
        if (!ok) wrong++;
    }
    equal(wrong, 0);
    check(ms < 3000, "200,000 puts and 100,000 removes took " + ms + " ms: they must be O(1) on average");
});
'''

