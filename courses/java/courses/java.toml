intro = '''
`ArrayDeque` is a ring buffer: two moving ends over one array, wrapping around with modular
arithmetic, and doubling when full. Writing one yourself exercises every detail at once:
index arithmetic at both ends, growth while the contents are wrapped, and the contract for
