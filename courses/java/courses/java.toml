[[unit.step]]
kind = "challenge"
id = "java-u19-x1-csv"
title = "A CSV reader with quoted fields"
points = 30
difficulty = 19
entry = "Csv"
intro = '''
CSV looks like "split on commas" until a field contains a comma or a quote. Real CSV (RFC 4180)
wraps such fields in double quotes and doubles any quote inside them, which a regex cannot
handle cleanly but a one-pass state machine with an "inside quotes" flag can.
'''
instructions = '''
## Your turn

Write a class `Csv` with two static methods:

```java
public class Csv {
    static List<String> parseLine(String line)
    static List<Map<String, String>> parse(String text)
}
```

**`parseLine(line)`** splits one line into fields:

- Fields are separated by commas. Every comma outside quotes ends a field, so `"a,,b"` has three
  fields and `"a,"` has two (the last one empty). An empty line is one empty field: `[""]`.
- A double quote `"` opens a quoted section, in which commas are ordinary characters. Inside a
  quoted section, two quotes `""` stand for one literal `"`, and a single `"` closes the section.
  The quotes themselves are not part of the field.
- Nothing is trimmed: spaces are part of the field.
- An unterminated quoted section throws `IllegalArgumentException`.

**`parse(text)`** reads a whole document:

- Split it into lines on any line ending (`\n` or `\r\n`). Skip blank lines.
- The first non-blank line is the header. Each later line becomes a `Map` from header name to
  field, keeping the header's column order (use a `LinkedHashMap`).
- A line whose number of fields differs from the header's throws `IllegalArgumentException`
  whose message contains `line N`, where N is the 1-based line number in `text`.
- No lines, or only a header, give an empty list.

Examples:

- `parseLine("ana,30,Luanda")` → `[ana, 30, Luanda]`
- `parseLine("\"Smith, John\",42")` → `[Smith, John, 42]`
- `parseLine("\"say \"\"hi\"\"\",x")` → `[say "hi", x]`
- `parse("name,age\nAna,30\nRui,25")` → `[{name=Ana, age=30}, {name=Rui, age=25}]`

**Hint:** walk the characters once with a `StringBuilder` for the current field and a boolean
`inQuotes`. When you see a quote inside quotes, peek at the next character to tell `""` from the
closing quote.

Hidden tests decide correctness.
'''
