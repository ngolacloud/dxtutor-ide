intro = '''
When code inside `try` throws, the JVM abandons the rest of the block and jumps to the first
`catch` whose type matches. A `finally` block runs on every path out of the `try`, which makes
it the place for work that must happen whatever the outcome.
'''
prompt = '''
Parse four strings as integers, skip the ones that are not numbers, and report each attempt
from a `finally` block.

**Why:** `Integer.parseInt` signals bad input with an unchecked `NumberFormatException`.
Catching it inside the loop lets one bad value fail without stopping the others.
'''
target = '''
import java.util.List;

public class Main {
    public static void main(String[] args) {
        List<String> inputs = List.of("42", "-7", "abc", "");
        int total = 0;
        for (String s : inputs) {
            try {
                int n = Integer.parseInt(s);
                total += n;
                System.out.println("parsed " + n);
            } catch (NumberFormatException e) {
                System.out.println("skipped: " + e.getMessage());
            } finally {
                System.out.println("done with [" + s + "]");
            }
        }
        System.out.println("total = " + total);
    }
}
