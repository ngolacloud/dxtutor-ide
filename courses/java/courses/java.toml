'''

[unit.step.gabarito]
solution = '''
import java.util.HashMap;
import java.util.Map;
import java.util.Objects;
import java.util.Optional;

public class Settings {
    private final Map<String, String> values;

    public Settings(Map<String, String> values) {
        this.values = new HashMap<>(Objects.requireNonNull(values, "values"));
    }

    public Optional<String> get(String key) {
        return Optional.ofNullable(values.get(key))
                .map(String::strip)
                .filter(s -> !s.isEmpty());
    }

    public Optional<Integer> getInt(String key) {
        return get(key).flatMap(Settings::parseInt);
    }

    public int getInt(String key, int fallback) {
        return getInt(key).orElse(fallback);
    }

    public String require(String key) {
        return get(key).orElseThrow(() -> new IllegalStateException("missing setting: " + key));
    }

    private static Optional<Integer> parseInt(String text) {
        try {
            return Optional.of(Integer.parseInt(text));
        } catch (NumberFormatException e) {
            return Optional.empty();
        }
    }
}
'''
time = "O(L) per lookup, O(n) to build"
space = "O(n)"
justification = '''
The constructor copies the `n` entries into a new `HashMap`, which is **O(n)** time and
**O(n)** space; that copy is what isolates the settings from later changes to the caller's map.

Each lookup is one expected O(1) hash lookup followed by work proportional to the length `L`
of the value: `strip` scans it once, and `parseInt` reads each digit once. So `get`, both
`getInt`s and `require` are **O(L)**, which is O(1) for the short values settings normally hold.
The Optional pipeline adds only a constant number of small objects per call.

Building everything on `get` keeps the rules in one place: the `null`, missing and blank cases
all become an empty Optional there, `flatMap` connects the parse helper without nesting
Optionals, and `orElse`/`orElseThrow` decide the empty case at the very end. Catching
`NumberFormatException` inside the helper turns a malformed number into "absent" instead of a
crash, which is what a settings reader should do.
'''

[[unit]]
id = "java-u17-dates-times"
title = "Dates and times with java.time"
level = "intermediate"
difficulty = 17
intro = '''
Due dates, subscriptions, timeouts and timestamps appear in almost every production system, and
date arithmetic is full of traps: months of different lengths, leap years, time zones. This unit
teaches the immutable `java.time` types, the difference between a `Duration` and a `Period`, and
how to format and parse dates strictly so that `31/02/2025` is rejected instead of silently fixed.
'''
concepts = '''
## The idea

"A date" means different things in different places. A birthday is a calendar date with no time
and no zone. A meeting is a date and a time in some city. A log entry is an exact instant on the
global timeline, the same everywhere on Earth. Mixing these up causes the classic bugs: invoices
due a day early, alarms an hour late after a daylight-saving change, tests that pass in Lisbon
and fail in Luanda.

`java.time` (Java 8+) gives each meaning its own type, and every one of them is **immutable**.

## How Java does it

| Type | Holds | Example |
|---|---|---|
| `LocalDate` | a calendar date | `2025-03-07` |
| `LocalDateTime` | a date and a wall-clock time, no zone | `2025-03-07T09:15` |
| `Instant` | a point on the UTC timeline | `2023-11-14T22:13:20Z` |
| `ZonedDateTime` / `OffsetDateTime` | a date-time pinned to a zone or offset | `…T09:15+01:00` |
| `Duration` | an amount of time in seconds and nanos | `PT1H50M` |
| `Period` | an amount of calendar time | `P1Y2M3D` |

```java
LocalDate start = LocalDate.of(2025, 1, 31);     // months are 1-based
LocalDate later = start.plusMonths(1);            // 2025-02-28: clamped to month end
long days = ChronoUnit.DAYS.between(start, later); // 28
```

Every "change" returns a **new** object. Use `Duration` for machine time (timeouts, elapsed
time) and `Period` for human calendar time (subscriptions, ages), because "one month" has no
fixed number of seconds.

Text goes through a `DateTimeFormatter`. `LocalDate.parse("2025-03-07")` uses ISO-8601; other
layouts need a pattern, and a pattern that prints month or day names needs a locale:

```java
var dmy = DateTimeFormatter.ofPattern("dd/MM/uuuu", Locale.ROOT)
        .withResolverStyle(ResolverStyle.STRICT);
LocalDate d = LocalDate.parse("07/03/2025", dmy);
```

## Pitfalls

- **Ignoring the result.** `date.plusDays(1);` on its own line does nothing: the original is
  immutable and the new date is thrown away.
- **Pattern letters are case-sensitive.** `MM` is month, `mm` is minute; `uuuu`/`yyyy` is the
  year, while `YYYY` is the *week-based* year and prints the wrong year around New Year.
- **Lenient parsing.** The default "smart" resolver turns `31/02/2025` into `28/02/2025`.
  `ResolverStyle.STRICT` rejects it, and with STRICT you must use `uuuu` (`yyyy` would also need
  an era). Bad text throws `DateTimeParseException`.
- **Hidden clocks and zones.** `LocalDate.now()` and `ZoneId.systemDefault()` depend on the
  machine, which makes code untestable. Pass the date (or a `Clock`) in, and name zones
  explicitly, for example `ZoneOffset.UTC`.
- **Chained month arithmetic drifts.** `jan31.plusMonths(1).plusMonths(1)` is `03-28` or
  `03-29`, not `03-31`. Compute from the original date instead.

## What you will practise

You will do date arithmetic across a leap February, measure durations and ages, and format and
parse strictly. The challenge is a small billing module: parse dates in two layouts, find the
next monthly billing date without drifting, and count overdue days.
'''

[[unit.step]]
kind = "concept"
id = "java-u17-c1-values-not-clocks"
title = "Dates are values, not clocks"
points = 5
difficulty = 17
intro = '''
A `LocalDate` is a value like an `int`: it never changes, and arithmetic produces a new one. The
calendar rules (month lengths, leap years) live inside the type, so you never compute them by hand.
'''
body = '''
## Values you can trust

`LocalDate`, `LocalDateTime`, `Instant`, `Duration` and `Period` are immutable. That makes them
safe to share between objects and threads, and safe to use as `HashMap` keys. It also means
every operation **returns** the answer:

```java
LocalDate due = invoice.plusDays(30);    // invoice is unchanged
```

## Calendar rules are built in

`plusMonths` clamps to the last valid day: January 31 plus one month is February 28, or 29 in
a leap year. `lengthOfMonth()`, `isLeapYear()` and `getDayOfWeek()` answer the questions you
would otherwise get wrong by hand. `ChronoUnit.DAYS.between(a, b)` counts whole days, and is
negative when `b` is before `a`.

## Two kinds of "amount"

A `Duration` is an exact number of seconds: two hours is always 7,200 seconds. A `Period` is
years, months and days as a human means them: "one month" from January 31 and from February 1
covers different numbers of days. Pick `Duration` for timeouts and stopwatches, `Period` for
billing cycles and ages.

## Keep "now" out of your logic

Code that calls `LocalDate.now()` gives a different answer every day, so it cannot be tested.
Production code reads the clock once, at the edge, and passes the date down as a parameter.
Every program in this unit uses fixed dates, so its output never changes.
'''

