[[unit]]
id = "java-u15-streams"
title = "Streams"
level = "intermediate"
difficulty = 15
intro = '''
The Stream API lets you describe a computation over a collection as a pipeline of steps
(filter these, transform those, group and total the rest) instead of writing the loop yourself.
In this unit you learn how pipelines are built and when they run, the core operations `map`,
`filter` and `reduce`, and the collectors that group and summarise data. You finish by writing
a sales report entirely with streams.
'''
concepts = '''
## The idea

Most loops over a collection follow a handful of patterns: keep the elements that match,
transform each one, combine them into a single value, or sort them into groups. A **stream**
lets you state those patterns directly. You describe *what* the result is, as a chain of
operations, and the library takes care of *how* to loop. The code reads like the specification
("the titles of the books longer than 400 pages, sorted"), and each step is a small function
you can test on its own.

## How Java does it

A **stream pipeline** has three parts:

1. a **source**: `list.stream()`, `Stream.of(a, b, c)`, `Arrays.stream(array)` or
   `IntStream.range(0, n)`;
2. zero or more **intermediate operations**, each returning a new stream: `filter`, `map`,
   `sorted`, `distinct`, `limit`, `skip`, `flatMap`;
3. one **terminal operation** that produces the result: `toList()`, `count()`, `sum()`,
   `reduce`, `anyMatch`, `findFirst`, `forEach` or `collect`.

```java
List<String> names = people.stream()
        .filter(p -> p.age() >= 18)
        .map(Person::name)
        .sorted()
        .toList();
```

Intermediate operations are **lazy**: they do nothing until the terminal operation asks for
elements, and then each element flows through the whole chain before the next one starts. That
is why `findFirst` can stop after a few elements of a huge source.

`IntStream`, `LongStream` and `DoubleStream` work on primitives without boxing and add `sum()`,
`average()` and `max()`; `mapToInt` gets you there from a stream of objects. For anything more
structured, `collect` takes a **collector** from `Collectors`:

```java
Map<String, Long> perCity = people.stream()
        .collect(Collectors.groupingBy(Person::city, Collectors.counting()));
String csv = words.stream().collect(Collectors.joining(","));
```

`groupingBy` takes a **downstream** collector that decides what each group becomes: `counting()`,
`summingInt(...)`, `mapping(...)`, `toList()` and more.

## Pitfalls and runtime errors

- A stream can be consumed only once. Reusing one throws
  `IllegalStateException: stream has already been operated upon or closed`.
- `Stream.toList()` returns an **unmodifiable** list; adding to it throws
  `UnsupportedOperationException`. Use `collect(Collectors.toCollection(ArrayList::new))` when
  you need to modify the result.
- `Collectors.toMap` throws `IllegalStateException: Duplicate key` when two elements map to the
  same key, unless you pass a merge function.
- `groupingBy` returns a `HashMap` with no particular order. Pass `TreeMap::new` when the order
  of keys matters.
- Lambdas in a pipeline should not modify outside state, such as adding to an external list.
  Let the collector build the result.
- Forgetting the terminal operation is legal and silent: nothing runs at all.

## What you will practise

You will filter, map and count, combine values with `reduce` and `joining` while watching
laziness at work, and group records with `groupingBy`, `counting`, `mapping` and
`partitioningBy`. The challenge asks you to build a sales report (totals, revenue per region,
the best-selling products) from a list of records.
'''

[[unit.step]]
kind = "concept"
id = "java-u15-c1-pipelines"
title = "Pipelines: source, operations, terminal"
points = 5
difficulty = 15
intro = '''
A stream is not a data structure: it stores nothing. It is a description of a computation
that pulls elements from a source, one at a time, through a chain of operations, and runs only
when a terminal operation asks for a result.
'''
body = '''
## Building the pipeline

Every pipeline reads left to right: a source, any number of intermediate operations, and one
terminal operation.

```java
long count = words.stream()            // source
        .filter(w -> w.length() > 3)   // intermediate
        .map(String::toLowerCase)      // intermediate
        .distinct()                    // intermediate
        .count();                      // terminal
```

Each intermediate operation returns a new `Stream`, which is why they chain. The terminal
operation returns something that is not a stream (a number, a list, a map, a boolean), or
nothing at all in the case of `forEach`.

## Lazy, element by element

Building the chain does no work. When the terminal operation starts, it pulls the first
element through `filter`, then `map`, then `distinct`, and only then fetches the second
element. This has two consequences. A **short-circuiting** terminal operation such as
`findFirst` or `anyMatch` stops as soon as it knows the answer, so it may look at only a few
elements. And stateless operations (`filter`, `map`) never need to hold the whole collection in
memory; only **stateful** ones such as `sorted` and `distinct` must remember what they have seen.

## Streams don't change the source

`filter` doesn't delete anything from `words`; it just doesn't pass some elements on. The
source collection is unchanged, and the result is new. That makes pipelines safe to reason
about, as long as the lambdas themselves don't modify shared state.
'''

