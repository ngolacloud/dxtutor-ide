[[unit.step]]
kind = "challenge"
id = "java-u25-x1-thread-safe-bank"
title = "A thread-safe bank"
points = 40
difficulty = 25
entry = "Bank"
intro = '''
A money transfer touches two accounts, so it needs two locks, and that is where deadlocks come
from. The standard fix, used by databases and operating systems alike, is **lock ordering**:
every thread acquires locks in the same global order, so a cycle of threads waiting on each
other can never form.
'''
instructions = '''
## Your turn

Implement a thread-safe `class Bank`:

```java
class Bank {
    Bank(int accounts, long initialBalance)
    void deposit(int account, long amount)
    boolean transfer(int from, int to, long amount)
    long balance(int account)
    long total()
}
```

Accounts are numbered `0` to `accounts - 1`, and each starts with `initialBalance`.

Rules:

- The constructor throws `IllegalArgumentException` if `accounts < 1` or
  `initialBalance < 0`.
- `deposit` adds `amount` to one account.
- `transfer` moves `amount` from `from` to `to` and returns `true`. If `from` holds less than
  `amount`, it changes nothing and returns `false`. A balance can never go negative.
- `amount <= 0` throws `IllegalArgumentException` (in `deposit` and `transfer`), and so does a
  transfer with `from == to`. An account number out of range throws
  `IndexOutOfBoundsException` (an `ArrayIndexOutOfBoundsException` is fine). A call that
  throws changes nothing: validate before you move any money.
- `balance` returns one account's balance, and `total` the sum of all balances.

Thread safety, which the hidden tests check with many threads at once:

- Every method may be called from many threads concurrently. No deposit or transfer may be
  lost, and the total must be conserved by transfers.
- `total()` must never observe money "in flight": called while transfers are running, it
  always returns the true total.
- Transfers in opposite directions (`0 → 1` and `1 → 0`) running at the same time must not
  deadlock.

**Hint:** one lock for the whole bank is correct and acceptable. For more parallelism, give
every account its own `ReentrantLock` and always lock the **lower-numbered** account first;
`total()` then locks all accounts in ascending order. Unlock in `finally`.

Hidden tests decide correctness.
'''
