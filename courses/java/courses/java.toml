[unit.step.gabarito]
solution = '''
import java.time.LocalDate;
import java.time.format.DateTimeFormatter;
import java.time.format.DateTimeParseException;
import java.time.format.ResolverStyle;
import java.time.temporal.ChronoUnit;
import java.util.List;
import java.util.Locale;
import java.util.Objects;

public class Billing {
    private static final List<DateTimeFormatter> FORMATS = List.of(
            DateTimeFormatter.ISO_LOCAL_DATE,
            DateTimeFormatter.ofPattern("dd/MM/uuuu", Locale.ROOT).withResolverStyle(ResolverStyle.STRICT));

    static LocalDate parseDate(String text) {
        String s = Objects.requireNonNull(text, "text").strip();
        for (DateTimeFormatter format : FORMATS) {
            try {
                return LocalDate.parse(s, format);
            } catch (DateTimeParseException e) {
                // try the next layout
            }
        }
        throw new IllegalArgumentException("not a date: " + text);
    }

    static LocalDate nextBillingDate(LocalDate start, LocalDate today) {
        Objects.requireNonNull(start, "start");
        Objects.requireNonNull(today, "today");
        if (!today.isAfter(start)) {
            return start;
        }
        long k = Math.max(0, ChronoUnit.MONTHS.between(start, today) - 1);
        LocalDate date = start.plusMonths(k);
        while (date.isBefore(today)) {
            k++;
            date = start.plusMonths(k);
        }
        return date;
    }

    static long overdueDays(LocalDate due, LocalDate paid) {
        return Math.max(0, ChronoUnit.DAYS.between(due, paid));
    }
}
'''
time = "O(L) for parseDate, O(1) for the others"
space = "O(1)"
justification = '''
`parseDate` tries at most two formatters, and each one reads the `L` characters of the text
once, so it is **O(L)**. The formatters are built once, in a static field, because building a
formatter means compiling its pattern.

`nextBillingDate` does not walk the calendar. `ChronoUnit.MONTHS.between(start, today)` counts
the whole months between the two dates in constant time, so `start.plusMonths(k)` with that `k`
(minus one, to be safe) lands just before or on `today`. Billing dates computed from `start`
never decrease as `k` grows, so the `while` loop only has to step forward once or twice before
it reaches the first date on or after `today`. Each `plusMonths` is constant-time arithmetic on
year and month numbers, so the method is **O(1)** whether the dates are a week or five centuries
apart; a loop that adds one month at a time would be O(months), and one that chains
`date.plusMonths(1)` would also drift from the 31st to the 28th and stay there.

`overdueDays` is one signed day count clamped at zero, **O(1)**. No method allocates more than
a few small immutable values, so the extra space is **O(1)**.
'''

[[unit]]
id = "java-u18-files-nio"
title = "Files and paths with java.nio.file"
level = "intermediate"
difficulty = 18
intro = '''
Programs read configuration, write reports and scan directories every day. This unit covers the
modern `java.nio.file` API: `Path` to name a file, `Files` to read, write, list, walk, copy and
delete it, checked `IOException`s, and try-with-resources to close what you open. Every program
works inside a temporary directory and cleans up after itself.
'''
concepts = '''
## The idea

A file system is a tree: directories contain files and other directories, and a **path** names
one node of that tree, like `reports/2025/march.csv`. A path is only a name; the file it names
may or may not exist. Reading and writing are separate operations that go to the operating
system, and they can fail for reasons your program does not control: the file is missing, the
disk is full, permission is denied. Java makes those failures visible with the checked
`IOException`.

## How Java does it

`Path` (an interface) is the name, and the `Files` class holds static methods that act on it:

```java
Path dir = Files.createTempDirectory("demo");    // a fresh, private directory
Path file = dir.resolve("notes.txt");             // dir + "/notes.txt"
Files.writeString(file, "hello\n");               // create or overwrite
Files.writeString(file, "more\n", StandardOpenOption.APPEND);
String all = Files.readString(file);
List<String> lines = Files.readAllLines(file);
```

`resolve` joins paths, `getFileName` and `getParent` take them apart, `relativize` computes the
path from one node to another. `Files.exists`, `isRegularFile`, `isDirectory` and `size` ask
questions; `createDirectories`, `copy`, `move`, `delete` and `deleteIfExists` change the tree.
Since Java 18 the default charset is UTF-8, so text round-trips the same on every system.

For large files, stream instead of loading everything. `Files.lines`, `Files.list` and
`Files.walk` return a `Stream` that holds an open file handle, so they belong in
try-with-resources:

```java
try (Stream<String> lines = Files.lines(file)) {
    long errors = lines.filter(l -> l.contains("ERROR")).count();
}
```

## Pitfalls

- **Checked exceptions.** Most `Files` methods declare `throws IOException`. Either declare it
  on your method or handle it; the compiler reports `unreported exception IOException; must be
  caught or declared to be thrown`. Inside a lambda you cannot throw it, so use a plain loop.
- **Leaked handles.** A `Files.lines` or `Files.walk` stream that is never closed keeps the file
  or directory open. Always use try-with-resources.
- **Specific failures.** A missing file throws `NoSuchFileException`; deleting a directory that
  still has children throws `DirectoryNotEmptyException`. Delete a tree from the deepest path
  up, for example by sorting `Files.walk` in reverse order.
- **Relative paths** resolve against the process's working directory, which differs between your
  IDE, a test runner and production. Build paths from a known base.
- **Directories have a size too.** `Files.size(dir)` is the size of the directory entry itself
  (often 4096 bytes), not of its contents.

## What you will practise

You will write, append and read a file, stream a CSV with `Files.lines`, and walk and delete a
directory tree. The challenge is a small `FileTools` class: total size of a tree, search by
extension, and a safe backup copy.
'''

[[unit.step]]
kind = "concept"
id = "java-u18-c1-paths-and-files"
title = "Paths name, Files acts"
points = 5
difficulty = 18
intro = '''
I/O crosses the boundary between your program and the operating system, so it is slow, can fail
at any time and holds resources that must be released. `java.nio.file` separates naming a file
(`Path`) from acting on it (`Files`).
'''
body = '''
## A name is not a file

`Path.of("data", "users.csv")` or `dir.resolve("users.csv")` builds a name and touches nothing
on disk. That is why it never throws `IOException`. Only the `Files` methods talk to the
operating system, and those are the calls that can fail.

## Small files: one call

For files that comfortably fit in memory, one call does the whole job:

```java
Files.writeString(path, text);          // create or replace
String text = Files.readString(path);
List<String> lines = Files.readAllLines(path);
Files.write(path, List.of("a", "b"));   // one line per element
```

Options such as `StandardOpenOption.APPEND` change the behaviour of a write.

## Big files and directories: streams you must close

`Files.lines`, `Files.list` and `Files.walk` produce their entries lazily, so they keep an
operating-system handle open until the stream is closed. `newBufferedReader` and
`newBufferedWriter` do the same for character-by-character work. Wrap all of them in
try-with-resources:

```java
try (BufferedWriter out = Files.newBufferedWriter(path)) {
    out.write("header");
    out.newLine();
}   // flushed and closed here, even if an exception is thrown
```

## Work in a sandbox

`Files.createTempDirectory("prefix")` gives a fresh, private directory under the system temp
folder. Tests and examples use one so they never overwrite real files, and delete it in a
`finally` block so nothing is left behind.
'''

[[unit.step]]
