[unit.step.gabarito]
solution = '''
import java.util.Map;

// The expression type (provided: do not change it).
sealed interface Expr permits Num, Var, Add, Mul, Neg {}

record Num(long value) implements Expr {}

record Var(String name) implements Expr {}

record Add(Expr left, Expr right) implements Expr {}

record Mul(Expr left, Expr right) implements Expr {}

record Neg(Expr operand) implements Expr {}

class Exprs {
    static long eval(Expr e, Map<String, Long> env) {
        return switch (e) {
            case Num(long v) -> v;
            case Var(String name) -> {
                Long v = env.get(name);
                if (v == null) throw new IllegalArgumentException("unbound variable: " + name);
                yield v;
            }
            case Add(Expr l, Expr r) -> eval(l, env) + eval(r, env);
            case Mul(Expr l, Expr r) -> eval(l, env) * eval(r, env);
            case Neg(Expr x) -> -eval(x, env);
        };
    }

    static String show(Expr e) {
        return switch (e) {
            case Num(long v) -> Long.toString(v);
            case Var(String name) -> name;
            case Add(Expr l, Expr r) -> "(" + show(l) + " + " + show(r) + ")";
            case Mul(Expr l, Expr r) -> "(" + show(l) + " * " + show(r) + ")";
            case Neg(Expr x) -> "-" + show(x);
        };
    }

    static Expr simplify(Expr e) {
        // 1. Simplify the children (an exhaustive switch: no default).
        Expr node = switch (e) {
            case Num n -> n;
            case Var v -> v;
            case Add(Expr l, Expr r) -> new Add(simplify(l), simplify(r));
            case Mul(Expr l, Expr r) -> new Mul(simplify(l), simplify(r));
            case Neg(Expr x) -> new Neg(simplify(x));
        };
        // 2. Apply the first rule whose pattern matches; default means "no rule applies".
        return switch (node) {
            case Add(Num(long a), Num(long b)) -> new Num(a + b);
            case Mul(Num(long a), Num(long b)) -> new Num(a * b);
            case Add(Num(long z), Expr x) when z == 0 -> x;
            case Add(Expr x, Num(long z)) when z == 0 -> x;
            case Mul(Num(long z), Expr x) when z == 0 -> new Num(0);
            case Mul(Expr x, Num(long z)) when z == 0 -> new Num(0);
            case Mul(Num(long one), Expr x) when one == 1 -> x;
            case Mul(Expr x, Num(long one)) when one == 1 -> x;
            case Neg(Num(long v)) -> new Num(-v);
            case Neg(Neg(Expr x)) -> x;
            default -> node;
        };
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the number of nodes in the tree. `eval` and `show` visit each node exactly once
and do constant work per node apart from the recursive calls, so `eval` is **O(n)** time.
`show` is O(n) in the number of nodes too, plus the cost of building the text: string
concatenation copies partial results, which is O(n·h) characters in the worst case for a tree
of height `h`; a `StringBuilder` threaded through the recursion would make it linear in the
output length.

`simplify` also visits every node once. At each node it rebuilds at most one node and tries a
fixed list of rules, each a constant-time pattern test on the node and its direct children,
so it is **O(n)** time. Because the children are already simplified when the rules run, one
pass is enough: every rule returns either a `Num` or an already simplified child.

Space is **O(n)** for the new tree that `simplify` allocates, and the recursion uses
**O(h)** stack frames, where `h` is the height (up to `n` for a degenerate chain like the
5,000-level test). Records make the nodes immutable, so sharing unchanged subtrees between
the old and the new tree is safe. The `default` in the rule table is deliberate: there it
means "no rewrite applies", while the first switch, which must handle every variant, has none.
'''

[[unit]]
id = "java-u23-iterators"
title = "Iterators and your own iterable types"
level = "advanced"
difficulty = 23
intro = '''
Every enhanced `for` loop in Java is a conversation with an `Iterator`: "is there another
element?" and "give it to me". In this unit you take that protocol apart, remove elements
safely while walking, write iterable types of your own, and build lazy iterators that wrap
other iterators. The challenge is a fixed-size ring buffer with a fail-fast iterator.
'''
concepts = '''
## The idea

**Iteration** means visiting the elements of a collection one at a time. The **iterator
pattern** separates *what* is stored from *how you walk it*: the collection hands out a
small cursor object that remembers where the walk is, and the caller pulls elements from that
cursor until it runs out. Because each walk has its own cursor, two loops over the same list
never disturb each other, and the caller never needs to know whether the data lives in an
array, a linked chain, a tree or a file being read lazily.

## How Java does it

Two small interfaces from `java.lang` and `java.util` carry the whole protocol:

```java
interface Iterable<T> { Iterator<T> iterator(); }
interface Iterator<T> { boolean hasNext(); T next(); }
```

Anything that implements `Iterable` works in an enhanced `for`. The compiler rewrites
`for (String s : words)` into:

```java
Iterator<String> it = words.iterator();
while (it.hasNext()) {
    String s = it.next();
    // loop body
}
```

`Iterator` also has a default `remove()` that deletes the element last returned by `next()`;
collections such as `ArrayList` support it, and others throw. You can always fall back to the
explicit `while` loop above when you need the iterator itself, for example to remove while
walking. A custom iterator is usually an inner or anonymous class, because it needs access to
the private fields of the collection it walks.

## Pitfalls

- **Running off the end.** Calling `next()` when `hasNext()` is false must throw
  `java.util.NoSuchElementException`. Your own iterators must keep that contract.
- **Modifying while iterating.** Adding to or removing from an `ArrayList` inside a for-each
  loop throws `ConcurrentModificationException` on the next `next()`. The standard collections
  are **fail-fast**: they count structural changes and compare the count on every step.
  Use `it.remove()` or `removeIf` instead.
- **`hasNext()` must not consume anything.** Callers may call it twice in a row, or not at
  all before `next()`. Do the real work in a way that tolerates both.
- **Not iterable.** Using a class in for-each that does not implement `Iterable` fails with
  `for-each not applicable to expression type`. An `Iterator` is not itself `Iterable`.
- `remove()` is optional: the default implementation throws `UnsupportedOperationException`.

## What you will practise

You will remove elements with an explicit iterator and trigger a fail-fast exception on
purpose, write a `Range` record that works in for-each, and build a lazy filtering iterator
with one element of lookahead. The challenge asks for a generic ring buffer whose iterator
walks from oldest to newest and detects modification during the walk.
'''

[[unit.step]]
kind = "concept"
id = "java-u23-c1-iterator-protocol"
title = "The iterator protocol"
points = 5
difficulty = 23
intro = '''
An iterator is a cursor with two operations, *test* and *advance*. Keeping the walk's state
in a separate object is what lets many walks share one collection, and what lets a walk be
lazy: elements are produced only when someone asks for them.
'''
body = '''
## Two interfaces, two roles

`Iterable<T>` is the **collection** side: it promises a method `iterator()` that returns a
brand-new cursor each time it is called. `Iterator<T>` is the **cursor** side: `hasNext()`
answers whether another element exists, and `next()` returns it and moves past it.

```java
Iterator<Integer> it = List.of(3, 1, 4).iterator();
it.next();              // 3
it.hasNext();           // true
it.next();              // 1
```

## The contract

- `hasNext()` only looks; it never moves the cursor. Calling it twice changes nothing.
- `next()` returns the next element and advances. When there is none it throws
  `NoSuchElementException`; it must not return `null` as an "end" marker, because `null` may
  be a real element.
- Each call to `iterator()` starts a new, independent walk from the beginning.

## Why it matters

The enhanced `for` loop is pure syntax over these two methods, so implementing `Iterable` is
all it takes for your own type to work in a for-each loop, and with `forEach` too. Iterators
can also be **lazy**: a range from 1 to a billion never builds a list of a billion numbers;
its iterator just remembers the current value. And iterators compose: an iterator can wrap
another one and filter, transform or limit what it yields. Streams, which you met earlier,
are built on exactly this idea, with the iterator replaced by a `Spliterator` that can also
split work for parallel processing.
'''

