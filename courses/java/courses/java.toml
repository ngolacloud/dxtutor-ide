An **abstract class** can mix finished methods with abstract ones that subclasses must
supply. A concrete method that calls abstract steps is the **template method** pattern: the
parent fixes the algorithm, and each subclass fills in the details.
'''
prompt = '''
Write an abstract `Shape` with abstract `area` and `name` and a concrete `describe`, then
two subclasses, and print and total the areas through a `List<Shape>`.

**Why:** abstract classes share code and force subclasses to supply the missing pieces, and
the compiler checks that none is forgotten.
'''
target = '''
import java.util.List;
import java.util.Locale;

public class Main {
    public static void main(String[] args) {
        List<Shape> shapes = List.of(new Circle(1.5), new Square(2), new Circle(0.5));
        double total = 0;
        for (Shape s : shapes) {
            System.out.println(s.describe());
            total += s.area();
        }
        System.out.println(String.format(Locale.ROOT, "total area %.2f", total));
    }
}

abstract class Shape {
    abstract double area();

    abstract String name();

    String describe() {
        return String.format(Locale.ROOT, "%s has area %.2f", name(), area());
    }
}

class Circle extends Shape {
    private final double radius;
    Circle(double radius) { this.radius = radius; }
    @Override double area() { return Math.PI * radius * radius; }
    @Override String name() { return "circle r=" + radius; }
}

class Square extends Shape {
    private final double side;
    Square(double side) { this.side = side; }
    @Override double area() { return side * side; }
    @Override String name() { return "square s=" + side; }
}
