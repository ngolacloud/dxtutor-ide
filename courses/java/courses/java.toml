prompt = '''
Create a temporary directory, write and append to a text file, read it back as lines, replace
its content, and delete everything in a `finally` block.

**Why:** these five `Files` calls cover most everyday file I/O, and the cleanup pattern is the
habit that keeps disks and test runs clean.
'''
target = '''
import java.io.IOException;
import java.nio.file.Files;
import java.nio.file.Path;
import java.nio.file.StandardOpenOption;
import java.util.List;

public class Main {
    public static void main(String[] args) throws IOException {
        Path dir = Files.createTempDirectory("dxt-notes");
        Path file = dir.resolve("notes.txt");
        try {
            Files.writeString(file, "first line\n");
            Files.writeString(file, "second line\n", StandardOpenOption.APPEND);
            System.out.println(file.getFileName() + " exists: " + Files.exists(file));
            System.out.println(Files.size(file) + " bytes");

            List<String> lines = Files.readAllLines(file);
            System.out.println(lines.size() + " lines, last = " + lines.get(lines.size() - 1));

            Files.write(file, List.of("replaced", "content"));
            System.out.print(Files.readString(file));
        } finally {
            Files.deleteIfExists(file);
            Files.delete(dir);
        }
        System.out.println("cleaned up: " + Files.notExists(dir));
    }
}
'''
