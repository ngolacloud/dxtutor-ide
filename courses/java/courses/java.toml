'''
prompt = '''
Build a generic `ChainedMap<K, V>` with `put` and `get`, store two names, overwrite one, and
look up a present and a missing key.

**Why:** this is the core of every hash table: hash to one bucket, then compare keys with
`equals` inside it.
'''
target = '''
import java.util.ArrayList;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        var ages = new ChainedMap<String, Integer>(8);
        ages.put("ana", 31);
        ages.put("rui", 27);
        ages.put("ana", 32);
        System.out.println(ages.get("ana") + " " + ages.get("rui") + " " + ages.get("eva"));
    }
}

class ChainedMap<K, V> {
    record Entry<K, V>(K key, V value) {}
    private final List<List<Entry<K, V>>> buckets = new ArrayList<>();

    ChainedMap(int capacity) {
        for (int i = 0; i < capacity; i++) buckets.add(new ArrayList<>());
    }

    private List<Entry<K, V>> bucketFor(K key) {
        return buckets.get(Math.floorMod(key.hashCode(), buckets.size()));
    }

    void put(K key, V value) {
        List<Entry<K, V>> bucket = bucketFor(key);
        bucket.removeIf(e -> e.key().equals(key));
        bucket.add(new Entry<>(key, value));
    }

    V get(K key) {
        for (Entry<K, V> e : bucketFor(key)) {
            if (e.key().equals(key)) return e.value();
        }
        return null;
    }
}
'''
