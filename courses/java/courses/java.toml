target = '''
public class Main {
    public static void main(String[] args) {
        Node head = new Node(7, new Node(1, new Node(7, new Node(2, new Node(7, null)))));
        head = removeAll(head, 7);
        System.out.println(toText(head));
    }

    static Node removeAll(Node head, int target) {
        Node dummy = new Node(0, head);
        Node prev = dummy;
        while (prev.next != null) {
            if (prev.next.val == target) {
                prev.next = prev.next.next;
            } else {
                prev = prev.next;
            }
        }
        return dummy.next;
    }

    static String toText(Node head) {
        StringBuilder sb = new StringBuilder("[");
        for (Node n = head; n != null; n = n.next) {
            sb.append(n.val).append(n.next != null ? ", " : "");
        }
        return sb.append("]").toString();
    }
}

class Node {
    int val;
    Node next;

    Node(int val, Node next) {
        this.val = val;
        this.next = next;
    }
}
