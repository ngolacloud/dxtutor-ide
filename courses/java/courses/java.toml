    equal(s.getInt("port"), Optional.of(5432));
    equal(s.getInt("offset"), Optional.of(-15));
    equal(s.getInt("zero"), Optional.of(0));
});
test("getInt returns empty for invalid numbers instead of throwing", () -> {
    var s = new Settings(Map.of("word", "abc", "decimal", "12.5", "huge", "99999999999", "mixed", "12abc"));
    equal(s.getInt("word"), Optional.empty());
    equal(s.getInt("decimal"), Optional.empty());
    equal(s.getInt("huge"), Optional.empty());
    equal(s.getInt("mixed"), Optional.empty());
    equal(s.getInt("missing"), Optional.empty());
});
test("getInt with a fallback", () -> {
    var m = new HashMap<String, String>();
    m.put("workers", "8");
    m.put("bad", "eight");
    m.put("null", null);
    var s = new Settings(m);
    equal(s.getInt("workers", 1), 8);
    equal(s.getInt("bad", 1), 1);
    equal(s.getInt("null", 2), 2);
    equal(s.getInt("absent", -1), -1);
});
test("require returns the stripped value", () -> {
    var s = new Settings(Map.of("db.url", " jdbc:sqlite:app.db "));
    equal(s.require("db.url"), "jdbc:sqlite:app.db");
