'''
tests = '''
import java.io.ByteArrayOutputStream;
import java.io.PrintStream;
test("greets the world", () -> equal(Greeter.greet("World"), "Hello, World!"));
test("greets Java", () -> equal(Greeter.greet("Java"), "Hello, Java!"));
test("empty name", () -> equal(Greeter.greet(""), "Hello, !"));
test("name with spaces", () -> equal(Greeter.greet("Ada Lovelace"), "Hello, Ada Lovelace!"));
test("accented name", () -> equal(Greeter.greet("João"), "Hello, João!"));
test("single letter", () -> equal(Greeter.greet("X"), "Hello, X!"));
test("returns instead of printing", () -> {
    PrintStream original = System.out;
    ByteArrayOutputStream buffer = new ByteArrayOutputStream();
    System.setOut(new PrintStream(buffer));
    String result;
    try {
        result = Greeter.greet("Grace");
    } finally {
        System.setOut(original);
    }
    equal(result, "Hello, Grace!");
    equal(buffer.toString(), "");
});
'''

[unit.step.gabarito]
solution = '''
// Greeter: your first class. It has no main method; the hidden tests call greet directly.
public class Greeter {

    // Return (do not print) the text "Hello, {name}!".
    static String greet(String name) {
        return "Hello, " + name + "!";
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Java strings are immutable, so joining them builds a brand-new `String`: the fixed text
`Hello, ` and `!` plus the `n` characters of `name` are copied into it. The compiler turns
the whole `"Hello, " + name + "!"` into a single concatenation that sizes the result once
and copies each character once, so the work grows in direct proportion to the length of the
name: **O(n)** time. The new string holds those `n + 8` characters, so the space is **O(n)**
as well, where `n` is the length of `name`. There is no loop in your code; the copying
happens inside the `+` operation.
'''

[[unit]]
id = "java-u02-variables"
title = "Variables and primitive types"
level = "basic"
difficulty = 2
intro = '''
Programs remember things in variables, and in Java every variable has a type that the
compiler checks before the program ever runs. This unit covers the eight primitive types,
`var`, conversions and casts, the silent integer overflow that catches professionals too,
and `final` for values that must not change.
'''
concepts = '''
## The idea

A **variable** is a named place in memory that holds a value. You give it a name so you can
read the value later and replace it when it changes. Java is **statically typed**: every
variable has a **type**, fixed when you declare it, and the compiler checks every
assignment against that type before the program runs. Putting text into a number variable
is not a crash at run time; it is a compile error you fix before anything starts.

## How Java does it

A declaration names the type, then the variable, then (usually) an initial value. Java has
eight **primitive types**, which store the value itself rather than a reference to an
object:

| Type | Holds | Example |
|---|---|---|
| `int` | whole numbers, 32 bits (about ±2.1 billion) | `int count = 3;` |
| `long` | whole numbers, 64 bits | `long stars = 9_000_000_000L;` |
| `double` | decimal numbers, 64 bits | `double price = 9.99;` |
| `boolean` | `true` or `false` | `boolean done = false;` |
| `char` | one character, in single quotes | `char grade = 'A';` |
| `byte`, `short`, `float` | smaller sizes, for special cases | `float f = 1.5f;` |

`String` is not a primitive (unit 3 explains it), but you declare it the same way.
Underscores in number literals are only for readability. Inside a method you can write
`var` and let the compiler **infer** the type from the initial value; the variable is still
statically typed, you just did not spell the type out.

```java
var total = 0;            // total is an int, forever
final int MAX_USERS = 100; // final: assigned once, never again
```

## Conversions, casts and overflow

Java converts automatically when nothing can be lost (**widening**: `int` to `long` to
`double`). Going the other way needs an explicit **cast**, and you accept the loss:
`(int) 3.99` is `3`, because a cast to a whole type cuts off the fraction. Division between
two `int`s is whole-number division, so `7 / 2` is `3`; cast one side, `(double) 7 / 2`, to
get `3.5`.

Every whole type has a fixed range. When a result does not fit, the bits simply wrap
around: `Integer.MAX_VALUE + 1` is `-2147483648`, with no error or warning. Use `long` when
values can grow large, or `Math.addExact`, which throws an `ArithmeticException` instead of
wrapping. Decimal numbers are binary approximations, so `0.1 + 0.2` prints
`0.30000000000000004`.

## What is special or tricky

- `int n = 3.5;` fails with `incompatible types: possible lossy conversion from double to
  int`. Cast if you really mean it.
- Reading a local variable before assigning it gives `variable n might not have been
  initialized`.
- Assigning a `final` variable twice gives `cannot assign a value to final variable MAX`.
- `long big = 3000000000;` gives `integer number too large`: the literal itself is an
  `int` until you add the `L` suffix.
- `var x;` and `var x = null;` fail with `cannot infer type for local variable x`.
- Integer division by zero throws `ArithmeticException: / by zero`, while `1.0 / 0` quietly
  gives `Infinity`.

## What you will practise

You will declare variables of each primitive type, convert between them with and without
casts, and watch overflow happen. The challenge asks for small unit conversions that stay
correct even for inputs big enough to overflow an `int`.
'''

[[unit.step]]
kind = "concept"
id = "java-u02-c1-typed-boxes"
title = "Variables are typed boxes"
points = 5
difficulty = 2
intro = '''
A variable couples a name, a type and a value. The type decides how many bytes the value
occupies and which operations are allowed on it, and the compiler enforces that contract on
every line. Choosing the right type is the first design decision in every Java program.
'''
body = '''
## Declare, assign, reassign

```java
int score = 10;        // declare an int named score and give it 10
score = score + 5;     // read it, add 5, store the result back: 15
score += 5;            // the same idea, shorter: 20
double half = score / 2.0;
```

The `=` sign means **assign**, not "equals": the right-hand side is evaluated first, then
its value is stored in the variable on the left. That is why `score = score + 5` makes sense.

## The type is part of the variable

Once `score` is an `int`, it can only ever hold `int` values. `score = "ten";` does not
compile, and neither does `score = 2.5;`. This feels strict at first, but it means a whole
category of mistakes is caught before you run anything, and your editor always knows what
each variable can do.

## var and final

```java
var name = "Ada";        // the compiler infers String
final double TAX = 0.14; // can never be reassigned
```

`var` saves typing when the type is obvious from the right-hand side; it does not make the
variable dynamic. `final` marks a value as fixed. By convention, constants that never
change are written in `UPPER_SNAKE_CASE`.

## Picking a type

Use `int` for counts and indexes, `long` when a count might pass two billion (milliseconds,
file sizes, populations), `double` for measurements, `boolean` for yes/no facts and `char`
for single characters. When in doubt between `int` and `long` for something that grows,
choose `long`.
'''

