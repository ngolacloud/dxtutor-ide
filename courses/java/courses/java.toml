[[unit.step]]
kind = "drill"
id = "java-u11-d2-compact"
title = "Validate and normalise in a compact constructor"
points = 10
difficulty = 11
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
A record's compact constructor runs on every creation path, so it is the one place to reject
invalid data and to normalise the rest. Because record fields are only shallowly immutable, it
is also where a mutable component such as a `List` gets a defensive copy.
'''
prompt = '''
Write a `Range` record that rejects `lo > hi`, and an `Article` record that strips its title
and copies its tag list, then show that the caller's later changes cannot reach the record.

**Why:** a value that validates itself on creation can never exist in a bad state, which
removes whole classes of bugs from the code that uses it.
'''
target = '''
import java.util.ArrayList;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        Range r = new Range(2, 7);
        System.out.println(r + " length " + r.length() + ", contains 5? " + r.contains(5));
        try {
            new Range(9, 1);
        } catch (IllegalArgumentException e) {
            System.out.println("rejected: " + e.getMessage());
        }

        List<String> tags = new ArrayList<>(List.of("java", "records"));
        Article post = new Article("  Records in Java  ", tags);
        tags.add("hacked");
        System.out.println("[" + post.title() + "] " + post.tags());
    }
}

record Range(int lo, int hi) {
    Range {
        if (lo > hi) {
            throw new IllegalArgumentException("lo " + lo + " > hi " + hi);
        }
    }

    int length() { return hi - lo; }

    boolean contains(int n) { return lo <= n && n < hi; }
}

record Article(String title, List<String> tags) {
    Article {
        title = title.strip();
        tags = List.copyOf(tags);
    }
}
'''
