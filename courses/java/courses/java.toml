prompt = '''
Search a list of names for the first one with a given prefix, returning `Optional<String>`, and
consume the result with `orElse`, `isPresent`/`isEmpty` and `ifPresentOrElse`.

**Why:** "not found" is a normal outcome of a search, and the return type should say so.
'''
target = '''
import java.util.List;
import java.util.Optional;

public class Main {
    public static void main(String[] args) {
        List<String> names = List.of("Ana", "Bruno", "Carla", "Bea");

        Optional<String> b = firstStartingWith(names, "B");
        Optional<String> z = firstStartingWith(names, "Z");

        System.out.println(b.orElse("nobody"));
        System.out.println(z.orElse("nobody"));
        System.out.println(b.isPresent() + " " + z.isEmpty());
        z.ifPresentOrElse(
                name -> System.out.println("found " + name),
                () -> System.out.println("no name starts with Z"));
    }

    static Optional<String> firstStartingWith(List<String> names, String prefix) {
        for (String name : names) {
            if (name.startsWith(prefix)) {
                return Optional.of(name);
            }
        }
        return Optional.empty();
    }
}
'''
