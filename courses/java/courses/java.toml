title = "Implement the Text utilities"
points = 20
difficulty = 3
entry = "Text"
intro = '''
Small text utilities are where `String` methods meet edge cases: empty strings, single
characters, mixed case. Because strings are immutable, each of these methods computes a new
string or a yes/no answer and never changes its input.
'''
instructions = '''
## Your turn

Complete the class `Text` with three `static` methods:

```java
static String capitalize(String word)
static boolean isPalindrome(String text)
static String mask(String digits)
```

- `capitalize` returns the word with its first character in upper case and **all** the
  others in lower case. An empty string stays empty.
- `isPalindrome` returns `true` when the text reads the same backwards, **ignoring case and
  spaces**. The empty string is a palindrome.
- `mask` hides everything except the last four characters, replacing each hidden character
  with `*`. A string of four characters or fewer is returned unchanged.

Examples:

- `Text.capitalize("jAVA")` → `"Java"`
- `Text.capitalize("a")` → `"A"`
- `Text.isPalindrome("Never odd or even")` → `true`
- `Text.isPalindrome("Java")` → `false`
- `Text.mask("1234567812345678")` → `"************5678"`
- `Text.mask("123")` → `"123"`

**Hint:** `substring`, `toUpperCase`, `toLowerCase`, `replace`, `repeat` and
`new StringBuilder(s).reverse()` cover everything. You do not need a loop.

Hidden tests decide correctness.
'''
