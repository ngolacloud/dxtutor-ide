The number of inversions measures how far an array is from sorted: it is what insertion sort
pays in shifts, and it is how rankings are compared (Kendall's tau). Counting them pair by pair
is O(n²), but merge sort can count them while it merges, in O(n log n), because during a merge
one comparison settles a whole block of pairs at once.
