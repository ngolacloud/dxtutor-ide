[[unit.step]]
kind = "challenge"
id = "java-u14-x1-higher-order"
title = "A toolkit of higher-order functions"
points = 30
difficulty = 14
entry = "Funcs"
intro = '''
Higher-order functions take functions as arguments or return them as results. They let you
express *how* to combine behaviour separately from *what* the behaviour is: the same `pipeline`
chains string cleaners or arithmetic steps. Doing it well means thinking about when a function
runs, what it captures and how deep the call stack grows.
'''
instructions = '''
## Your turn

Implement the five static methods of `Funcs`:

```java
static <T, R> List<R> mapAll(List<T> items, Function<? super T, ? extends R> f)
static <T> Predicate<T> allOf(List<Predicate<T>> checks)
static <T> Function<T, T> pipeline(List<Function<T, T>> steps)
static IntUnaryOperator repeat(IntUnaryOperator f, int times)
static <T> Supplier<T> memoize(Supplier<T> supplier)
```

- `mapAll` returns a **new** list with `f` applied to every item, in order. The input list is
  not changed.
- `allOf` returns a predicate that is true when **every** check accepts the value. With no
  checks it is always true. It stops at the first check that fails, so later checks don't run.
- `pipeline` returns a function that applies the steps in list order: the output of one step
  is the input of the next. With no steps it returns its input unchanged.
- `allOf` and `pipeline` take a **snapshot** of the list: adding to the list afterwards must not
  change a predicate or function already returned.
- `repeat` returns a function that applies `f` `times` times: `repeat(f, 3)` is
  `x -> f(f(f(x)))`, and `repeat(f, 0)` is the identity. A negative `times` throws
  `IllegalArgumentException` immediately, when `repeat` is called. `f` must not run until the
  returned function is applied.
- `memoize` returns a supplier that calls `supplier` the **first** time its `get` is called,
  then returns the same value forever without calling it again, even if that value is `null`.

Pipelines can have 100,000 steps and `repeat` can run 1,000,000 times, so apply functions in a
loop instead of nesting `andThen` calls or recursing.

Examples:

- `Funcs.mapAll(List.of("a", "bb"), String::length)` is `[1, 2]`.
- `Funcs.pipeline(List.of(x -> x + 1, x -> x * 10)).apply(2)` is `30`.
- `Funcs.repeat(x -> x * 2, 10).applyAsInt(1)` is `1024`.

**Hint:** `List.copyOf` makes the snapshot. A lambda can't reassign a captured local variable,
so `memoize` needs somewhere mutable to keep its state: a field of an anonymous class or a
small array.

Hidden tests decide correctness.
'''
starter = '''
import java.util.ArrayList;
import java.util.List;
import java.util.function.Function;
import java.util.function.IntUnaryOperator;
import java.util.function.Predicate;
import java.util.function.Supplier;

// Higher-order functions: each one takes and/or returns behaviour.
class Funcs {
    // A new list with f applied to every item, in order.
    static <T, R> List<R> mapAll(List<T> items, Function<? super T, ? extends R> f) {
        throw new UnsupportedOperationException("not implemented");
    }

    // True when every check passes (short-circuit); always true with no checks.
    static <T> Predicate<T> allOf(List<Predicate<T>> checks) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Applies the steps in order; the identity with no steps.
    static <T> Function<T, T> pipeline(List<Function<T, T>> steps) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Applies f `times` times; IllegalArgumentException when times < 0.
    static IntUnaryOperator repeat(IntUnaryOperator f, int times) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Calls supplier at most once, on the first get(), and caches the result.
    static <T> Supplier<T> memoize(Supplier<T> supplier) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
tests = '''
import java.util.ArrayList;
import java.util.function.Function;
import java.util.function.IntUnaryOperator;
import java.util.function.Predicate;
import java.util.function.Supplier;
test("mapAll transforms every item in order", () -> {
    equal(Funcs.mapAll(List.of("a", "bb", ""), String::length), List.of(1, 2, 0));
    equal(Funcs.mapAll(List.of(1, 2, 3), n -> "#" + n), List.of("#1", "#2", "#3"));
    Function<Object, String> show = Object::toString;
    List<String> shown = Funcs.mapAll(List.of(4.5, 7.0), show);
    equal(shown, List.of("4.5", "7.0"));
});
test("mapAll handles empty input and leaves the input alone", () -> {
    equal(Funcs.mapAll(List.<String>of(), String::length), List.of());
    List<Integer> input = new ArrayList<>(List.of(1, 2, 3));
    List<Integer> doubled = Funcs.mapAll(input, n -> n * 2);
    equal(doubled, List.of(2, 4, 6));
    equal(input, List.of(1, 2, 3));
});
test("allOf requires every check", () -> {
    List<Predicate<String>> checks = List.of(s -> !s.isEmpty(), s -> s.length() < 5, s -> s.equals(s.toLowerCase()));
    Predicate<String> ok = Funcs.allOf(checks);
    check(ok.test("java"), "java passes all three");
    check(!ok.test(""), "empty fails the first");
    check(!ok.test("lambda"), "lambda is too long");
    check(!ok.test("Go"), "Go is not lowercase");
});
test("allOf with no checks accepts everything", () -> {
    Predicate<Integer> any = Funcs.allOf(List.of());
    check(any.test(0) && any.test(-5) && any.test(null), "no checks means always true");
});
test("allOf stops at the first failing check", () -> {
    List<Predicate<Integer>> checks = List.of(n -> n != 0, n -> 100 / n > 1);
    Predicate<Integer> p = Funcs.allOf(checks);
    check(!p.test(0), "0 fails the first check and must not reach the division");
    check(p.test(10), "100 / 10 > 1");
    check(!p.test(200), "100 / 200 is 0");
});
test("allOf and pipeline take a snapshot of the list", () -> {
    List<Predicate<String>> checks = new ArrayList<>();
    checks.add(s -> s.startsWith("a"));
    Predicate<String> p = Funcs.allOf(checks);
    checks.add(s -> false);
    check(p.test("abc"), "a check added later must not count");
    List<Function<Integer, Integer>> steps = new ArrayList<>();
    steps.add(x -> x + 1);
    Function<Integer, Integer> f = Funcs.pipeline(steps);
    steps.add(x -> x * 100);
    equal(f.apply(1), 2);
});
test("pipeline applies the steps in order", () -> {
    equal(Funcs.pipeline(List.<Function<Integer, Integer>>of(x -> x + 1, x -> x * 10)).apply(2), 30);
    equal(Funcs.pipeline(List.<Function<Integer, Integer>>of(x -> x * 10, x -> x + 1)).apply(2), 21);
    List<Function<String, String>> clean = List.of(String::strip, String::toUpperCase, s -> s + "!");
    equal(Funcs.pipeline(clean).apply("  hi there "), "HI THERE!");
    equal(Funcs.pipeline(List.<Function<String, String>>of()).apply("same"), "same");
});
test("pipeline handles 100,000 steps", () -> {
    List<Function<Integer, Integer>> steps = new ArrayList<>();
    for (int i = 0; i < 100_000; i++) {
        steps.add(x -> x + 1);
    }
    equal(Funcs.pipeline(steps).apply(0), 100_000);
});
test("repeat applies f the given number of times", () -> {
    equal(Funcs.repeat(x -> x * 2, 10).applyAsInt(1), 1024);
    equal(Funcs.repeat(x -> x - 3, 1).applyAsInt(0), -3);
    equal(Funcs.repeat(x -> x * 2, 0).applyAsInt(7), 7);
    equal(Funcs.repeat(x -> x + 1, 1_000_000).applyAsInt(0), 1_000_000);
});
test("repeat rejects negative counts at once and runs f lazily", () -> {
    assertThrows(IllegalArgumentException.class, () -> Funcs.repeat(x -> x, -1));
    int[] calls = {0};
    IntUnaryOperator g = Funcs.repeat(x -> { calls[0]++; return x + 1; }, 3);
    equal(calls[0], 0);
    equal(g.applyAsInt(10), 13);
    equal(g.applyAsInt(0), 3);
    equal(calls[0], 6);
});
test("memoize calls the supplier once, lazily", () -> {
    int[] calls = {0};
    Supplier<String> slow = () -> "value " + (++calls[0]);
    Supplier<String> fast = Funcs.memoize(slow);
    equal(calls[0], 0);
    equal(fast.get(), "value 1");
    equal(fast.get(), "value 1");
    equal(fast.get(), "value 1");
    equal(calls[0], 1);
});
test("memoize caches a null result too", () -> {
    int[] calls = {0};
    Supplier<Object> nothing = Funcs.memoize(() -> { calls[0]++; return null; });
    equal(nothing.get(), null);
    equal(nothing.get(), null);
    equal(calls[0], 1);
});
'''

[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.List;
import java.util.function.Function;
import java.util.function.IntUnaryOperator;
import java.util.function.Predicate;
import java.util.function.Supplier;

class Funcs {
    static <T, R> List<R> mapAll(List<T> items, Function<? super T, ? extends R> f) {
        List<R> out = new ArrayList<>(items.size());
        for (T item : items) {
            out.add(f.apply(item));
        }
        return out;
    }

    static <T> Predicate<T> allOf(List<Predicate<T>> checks) {
        List<Predicate<T>> snapshot = List.copyOf(checks);
        return value -> {
            for (Predicate<T> check : snapshot) {
                if (!check.test(value)) {
                    return false;
                }
            }
            return true;
        };
    }

    static <T> Function<T, T> pipeline(List<Function<T, T>> steps) {
        List<Function<T, T>> snapshot = List.copyOf(steps);
        return input -> {
            T value = input;
            for (Function<T, T> step : snapshot) {
                value = step.apply(value);
            }
            return value;
        };
    }

    static IntUnaryOperator repeat(IntUnaryOperator f, int times) {
        if (times < 0) {
            throw new IllegalArgumentException("times must not be negative: " + times);
        }
        return x -> {
            int value = x;
            for (int i = 0; i < times; i++) {
                value = f.applyAsInt(value);
            }
            return value;
        };
    }

    static <T> Supplier<T> memoize(Supplier<T> supplier) {
        return new Supplier<>() {
            private boolean done;
            private T value;

            @Override
            public T get() {
                if (!done) {
                    value = supplier.get();
                    done = true;
                }
                return value;
            }
        };
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the size of the list (or `times` for `repeat`), and count each call of a
user-supplied function as O(1). `mapAll` calls `f` once per item and appends to a pre-sized
`ArrayList`: **O(n)** time and **O(n)** space for the result. `allOf` and `pipeline` copy the
list once (O(n) time and space for the snapshot) and the returned function then runs at most
`n` checks or steps per call, so each call is O(n) time with O(1) extra space. `repeat` builds
its function in O(1) and each application runs a loop of `times` iterations: O(times) time,
O(1) space. `memoize` is O(1) per `get`.

The loops matter as much as the counts. Nesting `andThen` 100,000 times, or writing `repeat`
recursively, also does O(n) work but puts O(n) frames on the call stack, and a deep enough
chain ends in `StackOverflowError`. A loop over a snapshot keeps the stack flat and makes the
returned function immune to later changes of the caller's list. `memoize` keeps a separate
`done` flag rather than testing `value == null`, so a supplier that legitimately returns `null`
is still called only once.
'''

