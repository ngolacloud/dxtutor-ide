[unit.step.gabarito]
solution = '''
import java.util.Iterator;
import java.util.NoSuchElementException;

class SinglyLinkedList<T> implements Iterable<T> {
    static final class Node<T> {
        T val;
        Node<T> next;

        Node(T val, Node<T> next) {
            this.val = val;
            this.next = next;
        }
    }

    Node<T> head;
    Node<T> tail;
    int size;

    void addFirst(T val) {
        head = new Node<>(val, head);
        if (tail == null) tail = head;
        size++;
    }

    void addLast(T val) {
        Node<T> node = new Node<>(val, null);
        if (tail == null) {
            head = node;
        } else {
            tail.next = node;
        }
        tail = node;
        size++;
    }

    T removeFirst() {
        if (head == null) throw new NoSuchElementException("the list is empty");
        T val = head.val;
        head = head.next;
        if (head == null) tail = null;
        size--;
        return val;
    }

    T get(int index) {
        if (index < 0 || index >= size) {
            throw new IndexOutOfBoundsException("index " + index + ", size " + size);
        }
        Node<T> node = head;
        for (int i = 0; i < index; i++) node = node.next;
        return node.val;
    }

    void reverse() {
        Node<T> prev = null;
        Node<T> node = head;
        tail = head;
        while (node != null) {
            Node<T> following = node.next;
            node.next = prev;
            prev = node;
            node = following;
        }
        head = prev;
    }

    int size() {
        return size;
    }

    @Override
    public Iterator<T> iterator() {
        return new Iterator<>() {
            private Node<T> cur = head;

            @Override
            public boolean hasNext() {
                return cur != null;
            }

            @Override
            public T next() {
                if (cur == null) throw new NoSuchElementException();
                T val = cur.val;
                cur = cur.next;
                return val;
            }
        };
    }
}
'''
time = "O(1) for addFirst, addLast, removeFirst and size; O(n) for get and reverse"
space = "O(n) for the nodes; O(1) extra for every operation"
justification = '''
`addFirst`, `addLast` and `removeFirst` each create or drop one node and rewire a constant
number of references, using the stored `head` and `tail`, so they are **O(1)**. The `size`
counter is updated alongside, which makes `size()` O(1) instead of a walk. `get(index)` must
follow `next` *index* times, because a linked list has no arithmetic jump to element *i*, so it
is **O(index)**, O(n) in the worst case.

`reverse` visits each node exactly once and does constant work per node (save `next`, flip it,
advance two references), so it is **O(n)** time. It keeps only three references (`prev`,
`node`, `following`) whatever the length, so its extra space is **O(1)**: the nodes are reused,
not copied. The invariant is what makes it correct: before each iteration, `prev` heads the
already reversed prefix and `node` heads the untouched suffix. Saving `node.next` first is
essential, because flipping it would otherwise cut off the suffix. The old head becomes the
tail, and its `next` is set to `null` on the first iteration, so no cycle remains.

A recursive reversal would also be O(n) time but would use O(n) stack frames and throw
`StackOverflowError` on a million nodes; copying the values into an `ArrayList` and writing
them back would break the "reuse the nodes" contract and cost O(n) extra space. The list
itself takes **O(n)** memory, one node object per value.
'''

[[unit]]
id = "java-u31-hash-maps"
title = "Hash tables, frequencies and sets"
level = "advanced"
difficulty = 31
intro = '''
`HashMap` and `HashSet` answer "is this key here?" in constant time on average because they are
hash tables. In this unit you open the box: you will turn `hashCode()` into a bucket index,
build a tiny chained map, count frequencies and combine sets, and then write a generic hash
table from scratch that grows itself as it fills up.
'''
concepts = '''
## The idea

A **hash table** stores key/value pairs in an array of **buckets**. A **hash function** turns a key into an integer, and that integer modulo the number of buckets picks one bucket. Looking up a key means hashing it, jumping straight to one bucket and scanning the few entries there. That costs **O(1) on average**, however many keys the table holds.

Two different keys can land in the same bucket. That is a **collision**, and there are two classic ways to handle it:

- **Separate chaining**: each bucket is a small list of entries, and a lookup scans that list. `java.util.HashMap` works this way.
- **Open addressing**: all entries live in one array, and a collision probes other slots.

Speed depends on the **load factor**, α = entries / buckets. As α grows, chains get longer and lookups slow down. So a hash table **resizes**: when α passes a threshold (0.75 in `HashMap`), it allocates twice as many buckets and **rehashes** every entry, because the index depends on the bucket count. One resize costs O(n), but doubling makes resizes rare, so inserts are **O(1) amortised**, the same argument that makes `ArrayList.add` cheap. If every key collides, a lookup degrades to O(n), which is why the hash function must spread keys well.

## How Java does it

Every object has `int hashCode()`. `Integer` hashes to its own value, and `String` uses a formula fixed by the specification, so the same string has the same hash on every run and every JVM:

```java
// s[0]*31^(n-1) + s[1]*31^(n-2) + ... + s[n-1], in int arithmetic
"cat".hashCode();   // 98262
```

The contract ties it to `equals`: **if `a.equals(b)` then `a.hashCode() == b.hashCode()`**. Records and enums get both methods generated consistently. `HashMap` uses a power-of-two bucket count (16 by default), mixes the high bits of the hash into the low ones, and turns a chain of 8 or more entries into a small red-black tree, which limits the damage a bad hash can do.

A `HashSet` is a `HashMap` whose values are ignored. It gives O(1) membership and set algebra through `retainAll` (intersection), `addAll` (union) and `removeAll` (difference).

## What is special or tricky

- **`hashCode()` can be negative**, and `%` keeps the sign of the left operand, so `h % n` can be `-2`. Indexing with it throws `ArrayIndexOutOfBoundsException: Index -2 out of bounds for length 4`. Use `Math.floorMod(h, n)`. `Math.abs(h) % n` is not a fix: `Math.abs(Integer.MIN_VALUE)` is still negative.
- **Override `equals` and `hashCode` together.** A class with only `equals` keeps `Object`'s identity hash, so an equal key lands in another bucket and `get` returns `null`.
- **Don't mutate a key after inserting it.** It stays in the bucket of its old hash, where lookups no longer look.
- **`new ArrayList<String>[8]` does not compile** ("generic array creation"). Store buckets in a `List<List<...>>` instead.
- **Iteration order of `HashMap` and `HashSet` is unspecified.** Use `TreeMap`/`TreeSet` or `LinkedHashMap` when order matters.

## What you will practise

You will compute `String.hashCode()` by hand and pick buckets with `Math.floorMod`, build a generic chained map, and count frequencies with `merge`. The challenge is a complete `HashTable<K, V>` with chaining, removal and automatic doubling, tested on 200,000 keys.
'''

[[unit.step]]
kind = "concept"
id = "java-u31-c1-buckets"
title = "Buckets, hashing and collisions"
points = 5
difficulty = 31
intro = '''
A hash table is an array plus a function that maps any key to an array index. When two keys
map to the same index, the table must still keep both, and that is what collision handling is
for.
'''
body = '''
## From key to index

`hashCode()` turns a key into an `int`, and the remainder picks a bucket:

```java
int index = Math.floorMod(key.hashCode(), buckets.size());
```

The same key always produces the same index, so `put` and `get` agree on where to look.
`floorMod` always returns a value in `0 .. size - 1`, even for a negative hash.

## Chaining

With separate chaining, each bucket is a list of entries:

```java
List<List<Entry<K, V>>> buckets = new ArrayList<>();
for (int i = 0; i < 8; i++) buckets.add(new ArrayList<>());
```

A lookup hashes the key, goes to that one bucket and compares keys with `equals` inside it.
Keys that collide simply share a bucket.

## Load factor and resizing

With *n* entries in *m* buckets, the average chain length is the load factor α = n / m. If *m*
stays fixed while *n* grows, chains grow too, and the "constant-time" table slides towards
O(n). The fix is to grow: once α passes a threshold, allocate a bigger bucket list (typically
double) and reinsert every entry, recomputing each index with the new size.

That rehash is O(n), but after doubling it cannot happen again until the table holds twice as
many keys. Spread over all the inserts, each insert pays O(1) on average (**amortised**).

## Equality and hashing go together

Inside a bucket, keys are compared with `equals`. That is why Java requires equal objects to
have equal hash codes: two equal keys must land in the same bucket, or the table would store
them twice.
'''

