target = '''
public class Main {
    public static void main(String[] args) {
        Node root = null;
        for (String w : "mango apple pear banana cherry zucchini kiwi".split(" ")) {
            root = insert(root, w);
        }
        for (String target : new String[] {"kiwi", "grape"}) {
            System.out.println(target + ": " + search(root, target));
        }
        Node lo = root, hi = root;
        while (lo.left != null) lo = lo.left;
        while (hi.right != null) hi = hi.right;
        System.out.println("min " + lo.key + ", max " + hi.key);
    }

    static Node insert(Node node, String key) {
        if (node == null) return new Node(key);
        int c = key.compareTo(node.key);
        if (c < 0) node.left = insert(node.left, key);
        else if (c > 0) node.right = insert(node.right, key);
        return node;
    }

    static String search(Node node, String target) {
        StringBuilder path = new StringBuilder();
        while (node != null) {
            path.append(node.key).append(' ');
            int c = target.compareTo(node.key);
            if (c == 0) return path + "-> found";
            node = c < 0 ? node.left : node.right;
        }
        return path + "-> missing";
    }
}

class Node {
    String key;
    Node left, right;
    Node(String key) { this.key = key; }
}
'''
