target = '''
import java.util.concurrent.CompletableFuture;
import java.util.concurrent.CompletionException;

public class Main {
    static CompletableFuture<Integer> parseAsync(String text) {
        return CompletableFuture.supplyAsync(() -> Integer.parseInt(text));
    }

    public static void main(String[] args) {
        CompletableFuture<Integer> good = parseAsync("42");
        CompletableFuture<Integer> bad = parseAsync("forty-two");

        int recovered = bad.exceptionally(ex -> -1).join();
        System.out.println("recovered " + recovered);

        String report = good.handle((value, ex) -> ex == null ? "ok " + value : "failed").join();
        System.out.println(report);

        try {
            bad.join();
        } catch (CompletionException e) {
            System.out.println("cause: " + e.getCause().getClass().getSimpleName());
        }
    }
}
'''
