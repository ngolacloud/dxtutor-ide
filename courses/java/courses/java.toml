instructions = '''
## Your turn

Implement `Quotes.bestPrice`:

```java
static CompletableFuture<Integer> bestPrice(List<Supplier<Integer>> vendors, Executor executor)
```

Each `Supplier` is one vendor: calling `get()` returns its quote, and it may block for a
while (like a network call) or throw. Return a future that completes with the **lowest**
quote among the vendors that answered.

Rules:

- Call every vendor **asynchronously on the given `executor`**, all of them at once. Don't
  use the common pool.
- `bestPrice` must **not block**: return the future immediately, without `join()` or `get()`.
- A vendor that throws, or returns `null`, is ignored.
- If no vendor answers (every one failed, or the list is empty), the returned future
  completes exceptionally with a `NoSuchElementException`. `bestPrice` itself never throws.

Examples:

- quotes 120, 95, 101 complete with 95;
- a failing vendor and a vendor quoting 80 complete with 80;
- an empty list completes exceptionally; `get()` throws an `ExecutionException` whose cause
  is a `NoSuchElementException`.

**Hint:** turn each vendor into a future that can't fail, for example a
`CompletableFuture<Optional<Integer>>` with `exceptionally`, then `allOf` them and take the
minimum of the present values.

Hidden tests decide correctness.
'''
