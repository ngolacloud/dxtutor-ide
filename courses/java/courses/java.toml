[[unit.step]]
kind = "challenge"
id = "java-u05-x1-number-theory"
title = "Implement NumberTheory"
points = 20
difficulty = 5
entry = "NumberTheory"
intro = '''
Classic number algorithms are small loops with sharp edges. Trial division needs to stop at
the square root to be fast, digit extraction relies on integer division and remainder, and
Euclid's algorithm replaces a pair of numbers by a smaller pair until the answer appears.
'''
instructions = '''
## Your turn

Complete the class `NumberTheory` with three `static` methods:

```java
static boolean isPrime(int n)
static int digitSum(int n)
static int gcd(int a, int b)
```

- `isPrime` returns `true` when `n` is a prime number: greater than 1 and divisible only by
  1 and itself. Numbers below 2, including negatives, are not prime. It must answer
  quickly for any `int`, up to `Integer.MAX_VALUE` (which is prime).
- `digitSum` returns the sum of the decimal digits of `n`, ignoring its sign. It must work
  for every `int`, including `Integer.MIN_VALUE`.
- `gcd` returns the **greatest common divisor** of `a` and `b`: the largest number that
  divides both. The result is never negative, `gcd(a, 0)` is the absolute value of `a`,
  and `gcd(0, 0)` is `0`. Inputs will not be `Integer.MIN_VALUE`.

Examples:

- `NumberTheory.isPrime(97)` → `true`, `NumberTheory.isPrime(91)` → `false`
- `NumberTheory.digitSum(12345)` → `15`, `NumberTheory.digitSum(-123)` → `6`
- `NumberTheory.gcd(12, 18)` → `6`, `NumberTheory.gcd(-12, 18)` → `6`

**Hints:**

- A composite number has a divisor no larger than its square root. Test `d <= n / d` rather
  than `d * d <= n`, which overflows near `Integer.MAX_VALUE`.
- `n % 10` is the last digit and `n / 10` removes it. For negative `n`, the remainder is
  negative too, so add `Math.abs(n % 10)`. `Math.abs(Integer.MIN_VALUE)` is still negative.
- Euclid's algorithm: while `b` is not 0, replace `(a, b)` with `(b, a % b)`.

Hidden tests decide correctness.
'''
starter = '''
