[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.List;
import java.util.concurrent.ExecutionException;
import java.util.concurrent.Executors;
import java.util.concurrent.Future;
import java.util.concurrent.Semaphore;
import java.util.function.Function;

class Fanout {
    static <T, R> List<R> mapAll(List<T> items, int maxConcurrent,
                                 Function<? super T, ? extends R> fn) throws InterruptedException {
        if (maxConcurrent < 1) {
            throw new IllegalArgumentException("maxConcurrent must be at least 1, got " + maxConcurrent);
        }
        Semaphore permits = new Semaphore(maxConcurrent);
        List<Future<R>> futures = new ArrayList<>(items.size());
        try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
            for (T item : items) {
                futures.add(executor.submit(() -> {
                    permits.acquire();
                    try {
                        return fn.apply(item);
                    } finally {
                        permits.release();
                    }
                }));
            }
        } // close() waits for every task, so every future below is complete
        List<R> results = new ArrayList<>(futures.size());
        for (Future<R> future : futures) {
            try {
                results.add(future.get());
            } catch (ExecutionException e) {
                throw new IllegalStateException("a call to fn failed", e.getCause());
            }
        }
        return results;
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
For n items the method does O(1) work per item to submit a task, then O(1) per item to
collect its result, so the CPU time spent in `mapAll` is **O(n)** plus the calls of `fn`
themselves. The interesting cost is wall-clock time: with a limit of c, the calls run in
about ⌈n / c⌉ overlapping "waves", so n blocking calls of latency L take roughly
`⌈n / c⌉ · L` instead of `n · L`. With c ≥ n that is a single L.

Space is **O(n)**: one future, one virtual thread (a small heap object while it waits) and
one result per item. That is affordable precisely because the threads are virtual; n
platform threads of 1 MB stack reservation each would not be.

Order is preserved because the futures list is built in input order and read back in the
same order, whatever order the tasks finish in. For the same reason, the first
`ExecutionException` met while reading is the first failure **in input order**, and its
`getCause()` is the exception `fn` threw. The semaphore is acquired inside each virtual
thread, so waiting for a permit parks a cheap virtual thread rather than the caller, and
`release` in `finally` returns the permit even when `fn` throws.
'''

[[unit]]
id = "java-u28-sorted-collections"
title = "Sorted collections: TreeMap, PriorityQueue, LinkedHashMap"
level = "advanced"
difficulty = 28
intro = '''
A `HashMap` is fast but has no idea of order, and many real questions are about order: the
smallest deadline, the top scores, the entry used least recently. You will navigate a
`TreeMap` with floor and ceiling queries, keep a top-k with a bounded `PriorityQueue`, build
an LRU cache from a `LinkedHashMap`, and finish with a leaderboard backed by a `TreeSet`.
'''
concepts = '''
## The idea

A hash table answers "what is stored under this key?" in O(1), but it scatters keys on
purpose, so it can't answer questions about **order**: which deadline comes first, who has
the three best scores, which tier does 742 points fall into, which cache entry was used least
recently. Java's collections library has three structures for this, each keeping a
different kind of order at a different cost.

## How Java does it

**`TreeMap` and `TreeSet`** keep their keys sorted in a **red-black tree**, a binary search
tree that rebalances itself so its height stays O(log n). `get`, `put` and `remove` cost
O(log n), and in exchange you get **navigation**: `firstKey` and `lastKey`, `floorKey(k)`
(greatest key ≤ k), `ceilingKey(k)` (least key ≥ k), the strict `lowerKey` and `higherKey`,
and range views such as `headMap`, `tailMap`, `subMap` and `descendingMap`. Iteration
visits keys in sorted order.

```java
var rates = new TreeMap<Integer, Double>(Map.of(0, 0.0, 10_000, 0.2, 50_000, 0.4));
rates.floorEntry(23_000).getValue();   // 0.2: the bracket that applies
```

**`PriorityQueue`** is a **binary heap** stored in an array. `offer` and `poll` cost
O(log n), `peek` O(1), and `poll` always removes the smallest element by natural order or
by your `Comparator`. It is not sorted: printing or iterating it shows heap order. Only
repeated `poll` produces sorted output.

**`LinkedHashMap`** is a `HashMap` with a doubly linked list threaded through its entries,
so iteration follows insertion order or, constructed with `accessOrder = true`, the order of
most recent access. Overriding `removeEldestEntry` turns it into a bounded cache that
evicts its least recently used entry by itself.

## What is special or tricky

- **The comparator decides equality.** A `TreeSet` or `TreeMap` treats two elements as the
  same when `compare` returns 0, whatever `equals` says. Order players by score alone and two
  players with equal scores collapse into one. Break ties:
  `comparingInt(Player::score).thenComparing(Player::name)`.
- **Never change an element's sort key while it is inside a tree or heap.** It was placed by
  its old value and will never be found again. Remove it, change it, insert it again.
- **`TreeMap` rejects `null` keys** with a `NullPointerException`, and a `TreeSet` of a type
  that isn't `Comparable` throws `ClassCastException` on the first `add`, unless you pass a
  `Comparator`.
- **`PriorityQueue` is a min-heap.** For largest-first, pass `Comparator.reverseOrder()`.
  Its `contains` and `remove(Object)` are O(n).
- **Navigation can come back empty.** `floorKey` below the smallest key returns `null`, and
  `firstKey` on an empty map throws `NoSuchElementException`.

## What you will practise

You will query a `TreeMap` with floor, higher and range views, keep the top k values with
a bounded min-heap, and build an LRU cache from a `LinkedHashMap`. The challenge is a
leaderboard that keeps each player's best score and lists the best players in logarithmic
time per update.
'''

[[unit.step]]
kind = "concept"
id = "java-u28-c1-three-orders"
title = "Three kinds of order"
points = 5
difficulty = 28
intro = '''
Sorted order, priority order and recency order are different promises with different costs.
Choosing the right collection is choosing which promise you need, and paying nothing for the
others.
'''
body = '''
## Pick the order you need

| Need | Collection | Key costs |
|---|---|---|
| everything sorted, plus "nearest key" queries | `TreeMap` / `TreeSet` | O(log n) get, put, remove, floor, ceiling |
| only the smallest (or largest) element, repeatedly | `PriorityQueue` | O(log n) offer and poll, O(1) peek |
| insertion or access order with hash speed | `LinkedHashMap` | O(1) get and put |

## Sorted: a balanced search tree

A `TreeMap` can answer `floorKey(742)` by walking down one path of the tree, comparing at
each node, so it touches O(log n) nodes. Sorting a `HashMap`'s keys for every such query would
cost O(n log n) each time.

## Priority: a heap

A heap keeps only a weak promise: each parent is no larger than its children. That is enough
to find the minimum at the root in O(1) and to repair the heap in O(log n) after a change,
and it is cheaper than keeping everything sorted. A bounded heap of size k also gives you the
k largest of n values in O(n log k).

## Recency: a linked hash map

With `accessOrder = true`, every `get` or `put` moves the entry to the end of the internal
linked list, so the first entry is always the least recently used one. Evicting it when the
map exceeds its capacity is the classic **LRU cache**, used by databases, browsers and
CPUs to keep the working set close at hand.

All three accept a `Comparator` or define a deterministic order, so the same code prints the
same result on every run, unlike iteration over a plain `HashMap`.
'''

