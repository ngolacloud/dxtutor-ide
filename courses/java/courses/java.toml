}
'''
tests = '''
import java.util.Map;
test("key sorts lower-cased letters", () -> {
    equal(Anagrams.key("Listen"), "eilnst");
    equal(Anagrams.key("banana"), "aaabnn");
    equal(Anagrams.key("a"), "a");
});
test("key of the empty word", () -> equal(Anagrams.key(""), ""));
test("groups anagrams in input order", () -> equal(
        Anagrams.group(List.of("listen", "silent", "google", "enlist")),
        Map.of("eilnst", List.of("listen", "silent", "enlist"), "eggloo", List.of("google"))));
test("no words, no groups", () -> equal(Anagrams.group(List.of()), Map.of()));
test("one word", () -> equal(Anagrams.group(List.of("solo")), Map.of("loos", List.of("solo"))));
test("keeps duplicates and original case", () -> equal(
        Anagrams.group(List.of("Tea", "eat", "tea", "ate")),
        Map.of("aet", List.of("Tea", "eat", "tea", "ate"))));
test("words that share no letters stay apart", () -> {
    Map<String, List<String>> g = Anagrams.group(List.of("abc", "bca", "xyz", "zyx", "q", "cab"));
    equal(g.size(), 3);
