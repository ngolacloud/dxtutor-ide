intro = '''
`List<Integer>` is not a subtype of `List<Number>`, so a method that takes `List<Number>` would
reject a list of integers. Wildcards restore the flexibility safely: `? extends Number` for a
list you only read from, `? super Integer` for a list you only add to.
'''
prompt = '''
Write `sum`, which reads any list of numbers, and `addSquares`, which writes integers into any
list that can hold them. Call each with two different list types.

**Why:** PECS (producer `extends`, consumer `super`) is the rule behind the signatures of
`addAll`, `Collections.copy` and `Collections.max`. Once you see it, those signatures read
naturally.
'''
target = '''
import java.util.ArrayList;
import java.util.List;

public class Main {
    static double sum(List<? extends Number> nums) {
        double total = 0;
        for (Number n : nums) {
            total += n.doubleValue();
        }
        return total;
    }

    static void addSquares(List<? super Integer> out, int n) {
        for (int i = 1; i <= n; i++) {
            out.add(i * i);
        }
    }

    public static void main(String[] args) {
        List<Integer> ints = List.of(1, 2, 3);
        List<Double> doubles = List.of(0.5, 0.25);
        System.out.println(sum(ints) + " " + sum(doubles));

        List<Number> numbers = new ArrayList<>();
        addSquares(numbers, 3);
        List<Object> objects = new ArrayList<>(List.of("squares:"));
        addSquares(objects, 4);
        System.out.println(numbers + " " + objects);
        System.out.println(sum(numbers));
    }
}
'''
