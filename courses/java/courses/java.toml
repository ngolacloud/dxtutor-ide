target = '''
import java.util.Arrays;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        List<Result> results = Arrays.asList(parse("42"), parse("-7"), parse("x1"), null);
        for (Result r : results) {
            System.out.println(render(r));
        }
        if (results.get(0) instanceof Ok(int v) && v > 40) {
            System.out.println("first value is large: " + v);
        }
    }

    static Result parse(String text) {
        try {
            return new Ok(Integer.parseInt(text));
        } catch (NumberFormatException e) {
            return new Err("not a number: " + text);
        }
    }

    static String render(Result r) {
        return switch (r) {
            case null -> "no result";
            case Ok(int v) when v < 0 -> "negative " + v;
            case Ok(int v) -> "ok " + v;
            case Err(String msg) -> "error: " + msg;
        };
    }
}

sealed interface Result permits Ok, Err {}

record Ok(int value) implements Result {}

record Err(String message) implements Result {}
