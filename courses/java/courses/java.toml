[[unit.step]]
kind = "challenge"
id = "java-u04-x1-rules"
title = "Implement the calendar and grading Rules"
points = 20
difficulty = 4
entry = "Rules"
intro = '''
Business rules are mostly decisions: which branch applies to this input, and what to do
with input that makes no sense. Rejecting invalid values loudly, by throwing an exception,
is safer than returning a wrong answer that spreads silently through a program.
'''
instructions = '''
## Your turn

Complete the class `Rules` with three `static` methods:

```java
static boolean isLeapYear(int year)
static String grade(int score)
static int daysInMonth(int month, int year)
```

- `isLeapYear`: a year is a leap year when it is divisible by 4, except years divisible by
  100, which are leap years only when also divisible by 400. So 2024 and 2000 are leap
  years, while 2023 and 1900 are not.
- `grade` maps a score from 0 to 100 to a letter: 90–100 is `"A"`, 80–89 `"B"`, 70–79 `"C"`,
  60–69 `"D"` and 0–59 `"F"`.
- `daysInMonth` returns the number of days in a month numbered 1 (January) to 12
  (December). February has 29 days in a leap year and 28 otherwise.
- Invalid input must be rejected: a score outside 0–100 or a month outside 1–12 throws an
  `IllegalArgumentException`, like this:

```java
throw new IllegalArgumentException("score out of range: " + score);
```

Examples:

- `Rules.grade(90)` → `"A"`, `Rules.grade(89)` → `"B"`, `Rules.grade(0)` → `"F"`
- `Rules.daysInMonth(2, 2024)` → `29`, `Rules.daysInMonth(4, 2023)` → `30`
- `Rules.grade(101)` and `Rules.daysInMonth(13, 2024)` throw `IllegalArgumentException`

**Hint:** a switch expression with multi-label arms (`case 4, 6, 9, 11 -> 30;`) fits
`daysInMonth` perfectly, and its `default` arm can throw.

Hidden tests decide correctness.
'''
