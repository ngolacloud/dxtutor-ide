entry = "Leaderboard"
intro = '''
A game leaderboard must absorb a stream of score submissions and answer "who is on top?" at
any moment. Keeping a sorted set of (score, player) entries next to a hash map of each
player's best score makes every update O(log n) and every top-k query O(log n + k), as long
as you never mutate an entry in place.
'''
instructions = '''
## Your turn

Implement the class `Leaderboard`:

```java
void submit(String player, int score)   // record a score
List<String> top(int k)                 // the k best players, best first
List<String> atLeast(int minScore)      // every player whose best score is >= minScore, best first
int size()                              // number of distinct players
```

Rules:

- A player's standing is their **best** score. A submission that is not higher than the
  player's current best is ignored. Each player appears **at most once** in any result.
- Order is score **descending**; players with the same score are ordered by name
  **ascending** (`String.compareTo`).
- `top(k)` returns fewer than k players if there are fewer, an empty list for `k == 0`, and
  throws `IllegalArgumentException` for a negative `k`.
- Scores may be negative. `atLeast` is inclusive.
- `submit` must run in O(log n) and `top(k)` in O(log n + k) for n players: don't sort on
  every query.

Example: after `submit("ann", 50)`, `submit("bob", 80)`, `submit("cy", 80)` and
`submit("ann", 30)`, `top(5)` is `[bob, cy, ann]` and `atLeast(60)` is `[bob, cy]`.

**Hint:** keep a `HashMap<String, Integer>` of best scores and a `TreeSet` of small records
ordered by a `Comparator` with a tie-break. When a player improves, **remove** the old record
before adding the new one.

Hidden tests decide correctness.
'''
