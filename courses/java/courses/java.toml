[[unit]]
id = "java-u22-sealed-patterns"
title = "Sealed types and pattern matching"
level = "advanced"
difficulty = 22
intro = '''
Sealed interfaces let you say exactly which types may implement an interface, and pattern
matching for `switch` lets the compiler prove that you handled every one of them. Together
with records and record patterns they give Java true algebraic data types. You will finish by
writing an evaluator, a printer and a simplifier for arithmetic expression trees.
'''
concepts = '''
## The idea

A lot of data comes in a fixed number of shapes. A payment is a card, a bank transfer or cash;
a JSON value is a number, a string, an array or an object; an arithmetic expression is a number,
a variable, a sum or a product. Classic object-oriented design puts the behaviour inside each
class (one `fee()` method per payment type). Functional languages take the other route: an
**algebraic data type** is a *closed* set of variants, each a plain data carrier, and the
operations are functions that look at which variant they received. Adding a new operation is
then one new function instead of an edit to every class.

The price of that design is that adding a variant means updating every function that inspects
variants. That is exactly the kind of bookkeeping a compiler can do for you, provided it knows
the set of variants is closed.

## How Java does it

A **sealed** interface lists the only types allowed to implement it, and records make each
variant a one-liner:

```java
sealed interface Payment permits Card, Transfer, Cash {}
record Card(String number, long cents) implements Payment {}
record Transfer(String iban, long cents) implements Payment {}
record Cash(long cents) implements Payment {}
```

Every permitted subtype must be `final`, `sealed` or `non-sealed`; records are implicitly
final. When all the types live in the same file you may leave out the `permits` clause.

A `switch` over a sealed type can use **type patterns**, and it needs no `default`:

```java
static long fee(Payment p) {
    return switch (p) {
        case Card c -> c.cents() / 50;
        case Transfer t -> 25;
        case Cash c -> 0;
    };
}
```

**Record patterns** take a record apart in place, and they nest:
`case Card(String number, long cents) when cents > 100_000 -> ...`. The `when` clause is a
**guard**: the case matches only if the pattern matches *and* the condition is true.
`instanceof` accepts the same patterns: `if (p instanceof Cash(long cents) && cents > 0)`.

## Pitfalls

- **Exhaustiveness.** Forget a variant and `javac` reports `the switch expression does not
  cover all possible input values`. That error is the feature: add a `Crypto` record to
  `Payment` and every switch that forgot it stops compiling. A `default` branch silences the
  check, so avoid it on sealed types.
- **Dominance.** A general case placed before a more specific one is rejected with
  `this case label is dominated by a preceding case label`. Put guarded cases first.
- **null.** A pattern `switch` throws `NullPointerException` on `null` unless it has an
  explicit `case null ->`.
- **Outsiders.** A class missing from `permits` that writes `implements Payment` gets
  `class is not allowed to extend sealed class`.
- A pattern variable exists only inside its own case (and its guard).

## What you will practise

You will model shapes as a sealed hierarchy, take nested records apart with record patterns,
write guarded cases and `case null`, and then build a small expression language: evaluate a
tree, print it, and simplify it with nested patterns.
'''

[[unit.step]]
kind = "concept"
id = "java-u22-c1-closed-hierarchies"
title = "Closed hierarchies and exhaustive switches"
points = 5
difficulty = 22
intro = '''
A sealed type turns "these are all the cases" from a comment into a fact the compiler knows.
That single fact is what lets a `switch` be checked for completeness, the way a compiler for
ML or Rust checks a `match`.
'''
body = '''
## Sealing a hierarchy

```java
sealed interface Shape permits Circle, Square {}
record Circle(double r) implements Shape {}
record Square(double side) implements Shape {}
```

`permits` names every allowed subtype. Each of them must say how the hierarchy continues
below it: `final` (no subclasses; records and enums are final already), `sealed` (another
closed list) or `non-sealed` (open again from that point on). A class that is not on the list
cannot implement `Shape` at all.

## Switching over it

```java
double area(Shape s) {
    return switch (s) {
        case Circle c -> Math.PI * c.r() * c.r();
        case Square q -> q.side() * q.side();
    };
}
```

The switch has no `default`, yet it compiles, because the compiler can see that `Circle` and
`Square` are the only possibilities. This is the real payoff. When someone later adds
`record Triangle(...) implements Shape` to the `permits` list, this method stops compiling
with `the switch expression does not cover all possible input values`, and so does every
other switch over `Shape`. The compiler hands you the to-do list.

Compare the old style, a chain of `if (s instanceof Circle) ... else if ...` ending in
`throw new IllegalStateException()`. It compiles happily when a new shape appears and fails
only at run time, on the first unlucky input. With a sealed type and a pattern switch, a
missing case is a compile error, not a production incident. That is why you should resist
adding `default` to such a switch: it would turn the check off.
'''

