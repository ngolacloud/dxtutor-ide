target = '''
import java.util.Arrays;

public class Main {
    public static void main(String[] args) {
        int[] temps = {21, 18, 25, 19, 23};
        System.out.println("days: " + temps.length);
        System.out.println("first " + temps[0] + ", last " + temps[temps.length - 1]);

        int sum = 0;
        for (int t : temps) {
            sum += t;
        }
        System.out.println("average " + (double) sum / temps.length);

        int[] sorted = temps.clone();
        Arrays.sort(sorted);
        System.out.println(Arrays.toString(temps) + " -> " + Arrays.toString(sorted));

        boolean[] seen = new boolean[3];
        String[] labels = new String[2];
        System.out.println(Arrays.toString(seen) + " " + Arrays.toString(labels));

        char[] bar = new char[5];
        Arrays.fill(bar, '#');
        System.out.println(new String(bar));
    }
}
'''
