entry = "Account"
intro = '''
Good error handling is part of a class's contract: invalid arguments are rejected before any
state changes, expected failures are reported with a checked exception that carries the facts,
and an operation that touches two objects either completes or leaves both untouched. That last
property, **atomicity**, is what databases call a transaction.
'''
instructions = '''
## Your turn

Write two classes.

**`InsufficientFundsException`**, a **checked** exception (it extends `Exception`):

```java
InsufficientFundsException(long requested, long available)
long requested()
long available()
long shortfall()        // requested - available
```

Its message is exactly `insufficient funds: requested 150, available 100` (with the real
numbers).

**`Account`**, which holds a balance in whole cents as a `long`:

```java
Account(long openingBalance)
long balance()
void deposit(long amount)
void withdraw(long amount) throws InsufficientFundsException
static void transfer(Account from, Account to, long amount) throws InsufficientFundsException
```

Rules:

- A negative opening balance, and an `amount` that is zero or negative in `deposit`,
  `withdraw` or `transfer`, throw `IllegalArgumentException`.
- `withdraw` of more than the balance throws `InsufficientFundsException` and leaves the
  balance unchanged. Withdrawing the whole balance is allowed.
- A deposit that would overflow a `long` throws `ArithmeticException` and leaves the balance
  unchanged (`Math.addExact` does the check for you).
- `transfer` moves money between accounts **atomically**: if anything fails (too little money
  in `from`, overflow in `to`), neither balance changes and the exception reaches the caller.
- A `null` account in `transfer` throws `NullPointerException`.

Examples:

- `new Account(100)`, then `deposit(50)` and `withdraw(30)`: `balance()` is `120`.
- `new Account(100).withdraw(150)` throws an exception whose `shortfall()` is `50`.

**Hint:** validate first, change state last. When the second half of `transfer` fails, undo the
first half in a `catch` and rethrow.

Hidden tests decide correctness.
'''
