- `productsByRegion` is `{east=[fig], north=[apple, pear], south=[apple, pear]}`.

**Hint:** `groupingBy` with a downstream `summingDouble` or `summingInt` does most of the work.
For the ranking, stream the entries of `unitsByProduct` and sort them with a comparator on the
value (reversed), then on the key.

Hidden tests decide correctness.
