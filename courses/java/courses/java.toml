[unit.step.gabarito]
solution = '''
import java.util.NoSuchElementException;
import java.util.Objects;

class RingDeque<T> {
    private Object[] data = new Object[8];
    private int head;   // index of the first element
    private int size;

    void addFirst(T value) {
        Objects.requireNonNull(value, "RingDeque does not accept null");
        growIfFull();
        head = (head - 1 + data.length) % data.length;
        data[head] = value;
        size++;
    }

    void addLast(T value) {
        Objects.requireNonNull(value, "RingDeque does not accept null");
        growIfFull();
        data[(head + size) % data.length] = value;
        size++;
    }

    T removeFirst() {
        if (size == 0) throw new NoSuchElementException("deque is empty");
        T value = at(head);
        data[head] = null;
        head = (head + 1) % data.length;
        size--;
        return value;
    }

    T removeLast() {
        if (size == 0) throw new NoSuchElementException("deque is empty");
        int last = (head + size - 1) % data.length;
        T value = at(last);
        data[last] = null;
        size--;
        return value;
    }

    T peekFirst() {
        return size == 0 ? null : at(head);
    }

    T peekLast() {
        return size == 0 ? null : at((head + size - 1) % data.length);
    }

    int size() {
        return size;
    }

    boolean isEmpty() {
        return size == 0;
    }

    private void growIfFull() {
        if (size < data.length) return;
        Object[] bigger = new Object[data.length * 2];
        for (int i = 0; i < size; i++) {
            bigger[i] = data[(head + i) % data.length];   // unwrap into logical order
        }
        data = bigger;
        head = 0;
    }

    @SuppressWarnings("unchecked")
    private T at(int index) {
        return (T) data[index];
    }
}
'''
time = "O(1) amortized per operation"
space = "O(n)"
justification = '''
Every operation except growth touches a constant number of slots and indices: a modulo, one
array read or write, and an update of `head` or `size`. That is **O(1)**, at both ends,
because nothing is ever shifted: only the `head` index moves.

Growth copies all n elements, which is O(n), but it happens only when the array is full, and
the capacity doubles each time. Reaching n elements costs copies of 8 + 16 + 32 + ... + n,
which is less than 2n in total, so the copying adds O(1) **amortized** per insertion. This
is the same argument that makes `ArrayList.add` amortized O(1).

Space is **O(n)**: the array is at most twice the number of elements it has ever held (it
never shrinks, like `ArrayDeque`). Copying in **logical** order, `data[(head + i) % length]`
for i from 0, is what keeps growth correct when the contents wrap around the end of the
array; a plain `Arrays.copyOf` would keep the wrapped layout but break the modular indices
once the length changes. Clearing removed slots avoids holding on to dead objects.
'''

