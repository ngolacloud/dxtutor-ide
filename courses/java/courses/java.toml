    // Add amount (> 0) to one account.
    void deposit(int account, long amount) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Move amount (> 0) between two different accounts; false if `from` lacks the funds.
    boolean transfer(int from, int to, long amount) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The current balance of one account.
    long balance(int account) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The sum of all balances, never counting money in flight.
    long total() {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
tests = '''
import java.util.concurrent.atomic.AtomicInteger;
import java.util.function.IntConsumer;
record Workers(int count) {
    // Runs body(0..count-1) on `count` daemon threads; false if they do not finish in 10 s.
    boolean run(IntConsumer body) throws InterruptedException {
        Thread[] threads = new Thread[count];
        for (int t = 0; t < count; t++) {
            final int id = t;
            threads[t] = new Thread(() -> body.accept(id));
            threads[t].setDaemon(true);
            threads[t].start();
        }
        long deadline = System.nanoTime() + 10_000_000_000L;
        for (Thread t : threads) {
            t.join(Math.max(1, (deadline - System.nanoTime()) / 1_000_000));
            if (t.isAlive()) return false;
        }
        return true;
    }
}
test("starting balances and total", () -> {
    Bank bank = new Bank(3, 100);
    equal(bank.balance(0), 100L);
    equal(bank.balance(2), 100L);
    equal(bank.total(), 300L);
});
test("transfers move money and refuse overdrafts", () -> {
    Bank bank = new Bank(3, 100);
    check(bank.transfer(0, 1, 30), "a covered transfer returns true");
    equal(bank.balance(0), 70L);
    equal(bank.balance(1), 130L);
    check(!bank.transfer(0, 2, 71), "an overdraft returns false");
    equal(bank.balance(0), 70L);
    equal(bank.balance(2), 100L);
    check(bank.transfer(0, 2, 70), "transferring the whole balance is allowed");
    equal(bank.balance(0), 0L);
    bank.deposit(0, 5);
    equal(bank.balance(0), 5L);
    equal(bank.total(), 305L);
});
test("invalid arguments are rejected", () -> {
    assertThrows(IllegalArgumentException.class, () -> new Bank(0, 10));
    assertThrows(IllegalArgumentException.class, () -> new Bank(2, -1));
    Bank bank = new Bank(2, 10);
    assertThrows(IllegalArgumentException.class, () -> bank.transfer(0, 1, 0));
    assertThrows(IllegalArgumentException.class, () -> bank.transfer(0, 1, -5));
    assertThrows(IllegalArgumentException.class, () -> bank.transfer(1, 1, 5));
    assertThrows(IllegalArgumentException.class, () -> bank.deposit(0, 0));
    assertThrows(IndexOutOfBoundsException.class, () -> bank.transfer(0, 2, 1));
    assertThrows(IndexOutOfBoundsException.class, () -> bank.balance(-1));
    equal(bank.total(), 20L);
});
test("concurrent deposits are never lost", () -> {
    Bank bank = new Bank(1, 0);
    boolean finished = new Workers(8).run(id -> {
        for (int i = 0; i < 20_000; i++) bank.deposit(0, 1);
    });
    check(finished, "deposits did not finish in time");
    if (!finished) return;
    equal(bank.balance(0), 160_000L);
});
test("concurrent transfers conserve money and never overdraw", () -> {
    Bank bank = new Bank(5, 1_000);
    boolean finished = new Workers(6).run(id -> {
        for (int i = 0; i < 50_000; i++) {
            int from = (id + i) % 5;
            int to = (id + 3 * i + 1) % 5;
            if (from != to) bank.transfer(from, to, 1 + (i * 7 + id) % 50);
        }
    });
    check(finished, "transfers did not finish in time: deadlock? acquire locks in a fixed order");
    if (!finished) return;
    equal(bank.total(), 5_000L);
    for (int a = 0; a < 5; a++) check(bank.balance(a) >= 0, "account " + a + " went negative");
});
test("the last unit can be spent only once", () -> {
    Bank bank = new Bank(2, 1_000);
    AtomicInteger succeeded = new AtomicInteger();
    boolean finished = new Workers(4).run(id -> {
        for (int i = 0; i < 1_000; i++) {
            if (bank.transfer(0, 1, 1)) succeeded.incrementAndGet();
        }
    });
    check(finished, "transfers did not finish in time");
    if (!finished) return;
    equal(succeeded.get(), 1_000);
    equal(bank.balance(0), 0L);
    equal(bank.balance(1), 2_000L);
});
test("opposite transfers do not deadlock", () -> {
    Bank bank = new Bank(2, 1_000_000);
    boolean finished = new Workers(4).run(id -> {
        for (int i = 0; i < 50_000; i++) {
            if (id % 2 == 0) bank.transfer(0, 1, 1);
            else bank.transfer(1, 0, 1);
        }
    });
    check(finished, "transfers 0->1 and 1->0 deadlocked: acquire locks in a fixed order");
    if (!finished) return;
    equal(bank.balance(0), 1_000_000L);
    equal(bank.balance(1), 1_000_000L);
});
test("total never sees money in flight", () -> {
    Bank bank = new Bank(4, 250);
    AtomicInteger wrong = new AtomicInteger();
    boolean finished = new Workers(4).run(id -> {
        for (int i = 0; i < 20_000; i++) {
            if (id == 3) {
                if (bank.total() != 1_000L) wrong.incrementAndGet();
            } else {
                bank.transfer((id + i) % 4, (id + i + 1) % 4, 1 + i % 5);
            }
        }
    });
    check(finished, "transfers and totals did not finish in time: deadlock?");
    if (!finished) return;
    equal(wrong.get(), 0);
    equal(bank.total(), 1_000L);
});
'''

[unit.step.gabarito]
solution = '''
import java.util.Objects;
import java.util.concurrent.locks.ReentrantLock;

class Bank {
    private final long[] balances;        // balances[i] is guarded by locks[i]
    private final ReentrantLock[] locks;

    Bank(int accounts, long initialBalance) {
        if (accounts < 1) throw new IllegalArgumentException("need at least one account: " + accounts);
        if (initialBalance < 0) throw new IllegalArgumentException("negative initial balance: " + initialBalance);
        balances = new long[accounts];
        locks = new ReentrantLock[accounts];
        for (int i = 0; i < accounts; i++) {
            balances[i] = initialBalance;
            locks[i] = new ReentrantLock();
        }
    }

    void deposit(int account, long amount) {
        requirePositive(amount);
        ReentrantLock lock = locks[account];
        lock.lock();
        try {
            balances[account] += amount;
        } finally {
            lock.unlock();
        }
    }

    boolean transfer(int from, int to, long amount) {
        requirePositive(amount);
        Objects.checkIndex(from, balances.length);
        Objects.checkIndex(to, balances.length);
        if (from == to) throw new IllegalArgumentException("cannot transfer to the same account");
        // Lock ordering: always the lower-numbered account first, so no cycle can form.
        ReentrantLock first = locks[Math.min(from, to)];
        ReentrantLock second = locks[Math.max(from, to)];
        first.lock();
        try {
            second.lock();
            try {
                if (balances[from] < amount) return false;
                balances[from] -= amount;
                balances[to] += amount;
                return true;
            } finally {
                second.unlock();
            }
        } finally {
            first.unlock();
        }
    }

    long balance(int account) {
        ReentrantLock lock = locks[account];
        lock.lock();
        try {
            return balances[account];
        } finally {
            lock.unlock();
        }
    }

    long total() {
        // Holding every lock (in the same ascending order) gives a consistent snapshot.
        for (ReentrantLock lock : locks) lock.lock();
        try {
            long sum = 0;
            for (long b : balances) sum += b;
            return sum;
        } finally {
            for (int i = locks.length - 1; i >= 0; i--) locks[i].unlock();
        }
    }

    private static void requirePositive(long amount) {
        if (amount <= 0) throw new IllegalArgumentException("amount must be positive: " + amount);
    }
}
'''
time = "O(1) per operation, O(n) for total"
space = "O(n)"
justification = '''
Let `n` be the number of accounts. `deposit`, `balance` and `transfer` each acquire one or
two locks and do a constant amount of arithmetic, so each is **O(1)** apart from the time
spent waiting for a lock held by another thread. `total` locks, sums and unlocks all `n`
accounts, so it is **O(n)**. Space is **O(n)**: one `long` and one `ReentrantLock` per
account.

Correctness rests on three arguments. **Atomicity:** every read or write of `balances[i]`
happens while holding `locks[i]`, and a transfer holds both accounts' locks across the check
and the two updates, so no update is lost and the overdraft check cannot be invalidated
between check and act. **No deadlock:** every thread that holds two or more locks acquired
them in ascending account order, so a waiting cycle (A holds 0 and wants 1 while B holds 1 and
wants 0) is impossible. `total` follows the same order. **Consistency:** while `total` holds
every lock, no transfer is half done, so it always sees the true sum.

A single lock for the whole bank (`synchronized` on every method) is also correct and
simpler, but it serializes all transfers, even between unrelated accounts. Per-account locks
let transfers on disjoint accounts proceed in parallel, at the price of the ordering rule.
'''

