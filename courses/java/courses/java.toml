[[unit.step]]
kind = "drill"
id = "java-u34-d2-count-calls"
title = "Count the calls: naive versus memo"
points = 10
difficulty = 34
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
Naive recursive Fibonacci solves the same subproblems over and over, so its number of calls
grows exponentially. A memo stores each answer the first time and turns the call tree into a
chain: the count drops from millions to dozens.
'''
prompt = '''
Compute `fib(30)` naively and with a `HashMap` memo, counting the calls each one makes, then
compute `fib(90)` with the memo.

**Why:** counting calls makes the exponential blow-up concrete, and it shows that the memo's
cost is (number of subproblems) × (work per subproblem).
'''
target = '''
import java.util.HashMap;
import java.util.Map;

public class Main {
    static long calls = 0;
    static final Map<Integer, Long> cache = new HashMap<>();

    public static void main(String[] args) {
        System.out.println("naive fib(30) = " + naive(30) + " in " + calls + " calls");
        calls = 0;
        System.out.println("memo  fib(30) = " + memo(30) + " in " + calls + " calls");
        System.out.println("memo  fib(90) = " + memo(90));
    }

    static long naive(int n) {
        calls++;
        return n < 2 ? n : naive(n - 1) + naive(n - 2);
    }

    static long memo(int n) {
        calls++;
        if (n < 2) return n;
        Long known = cache.get(n);
        if (known != null) return known;
        long result = memo(n - 1) + memo(n - 2);
        cache.put(n, result);
        return result;
    }
}
'''
