instructions = '''
## Your turn

A sale is a record (provided in the starter; don't change it):

```java
record Sale(String region, String product, int quantity, double unitPrice) {
    double revenue() { return quantity * unitPrice; }
}
```

Implement the static methods of `SalesReport`, using streams and collectors:

```java
static double totalRevenue(List<Sale> sales)
static Map<String, Double> revenueByRegion(List<Sale> sales)
static Map<String, Integer> unitsByProduct(List<Sale> sales)
static List<String> topProducts(List<Sale> sales, int n)
static Map<String, List<String>> productsByRegion(List<Sale> sales)
```

- `totalRevenue`: the sum of `revenue()` over all sales; `0.0` for no sales.
- `revenueByRegion`: each region mapped to the total revenue of its sales.
- `unitsByProduct`: each product mapped to the total `quantity` sold.
- `topProducts`: the names of the `n` products with the most units sold, most first. Ties are
  broken alphabetically. If there are fewer than `n` products, return them all. A negative `n`
  throws `IllegalArgumentException`.
- `productsByRegion`: each region mapped to the names of the products sold there, sorted
  alphabetically and without duplicates.

The maps may be of any `Map` type. Regions and products that never appear are simply absent, so
an empty list of sales gives empty maps and an empty list.

Example, for these sales:

```text
