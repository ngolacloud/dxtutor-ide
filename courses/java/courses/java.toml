[[unit]]
id = "java-u26-completable-future"
title = "CompletableFuture: composing async work"
level = "advanced"
difficulty = 26
intro = '''
A `Future` lets you wait for a result; a `CompletableFuture` lets you say what should happen
next without waiting at all. You will start asynchronous work on an executor, chain and
combine stages, and recover from failures, then build a price aggregator that queries many
vendors at once and survives the ones that fail.
'''
concepts = '''
## The idea

In unit 24 a `Future` was a ticket for a result still being computed, and the only useful
thing you could do with it was block on `get()`. Blocking is the problem. If a request needs
a user's profile, then that user's orders, then a price for each order, a thread that blocks
at every step spends most of its life waiting. What you want is to describe the **pipeline**
up front ("when the profile arrives, fetch the orders; when both prices arrive, add them")
and let the runtime run each stage as soon as its inputs are ready. That is **asynchronous
composition**, the same idea as promises in JavaScript.

## How Java does it

`CompletableFuture<T>` (in `java.util.concurrent`) is a future that code can complete and
that accepts **callbacks**. Every method returns a new stage, so calls chain:

```java
CompletableFuture<Integer> length = CompletableFuture
        .supplyAsync(() -> "hello", pool)   // run on pool, produce a value
        .thenApply(String::length);         // transform it when it arrives
System.out.println(length.join());          // 5
```

The core vocabulary:

- `supplyAsync(supplier, executor)` and `runAsync(runnable, executor)` start work.
- `thenApply(f)` transforms a value (like `map`); `thenAccept(c)` consumes it.
- `thenCompose(f)` chains a step that itself returns a future (like `flatMap`), so you never
  end up with a `CompletableFuture<CompletableFuture<T>>`.
- `thenCombine(other, (a, b) -> ...)` waits for two independent futures.
- `allOf(futures...)` completes when all of them have; `anyOf` when the first one does.
- `exceptionally(ex -> fallback)` recovers from a failure; `handle((value, ex) -> ...)` sees
  both outcomes.
- `join()` waits and returns the value; `get(2, TimeUnit.SECONDS)` waits with a deadline.

## What is special or tricky

- **Forgetting the executor.** Without one, `supplyAsync` runs on the shared
  `ForkJoinPool.commonPool()`, which is sized for CPU work. Blocking I/O there starves
  everything else in the JVM that uses it, parallel streams included.
- **Blocking in the middle.** A `join()` inside a pipeline turns async code back into
  sequential code, and on a small pool it can deadlock. Join once, at the edge.
- **Wrapped exceptions.** A failure flows to every dependent stage. `join()` throws an
  unchecked `CompletionException`, `get()` a checked `ExecutionException`, and the real
  exception is `getCause()`. Inside `exceptionally` and `handle` you often receive the
  `CompletionException` wrapper too.
- **Lost failures.** If nothing joins or handles a failed future, its exception vanishes
  silently. End every pipeline in a join, a `handle` or an `exceptionally`.
- **Waiting forever.** A stage that never completes blocks `join()` forever. Use
  `get(timeout, unit)` or `orTimeout` when you can't trust the producer.

## What you will practise

You will chain stages on a pool, combine two independent lookups with `thenCombine` and a
dependent one with `thenCompose`, and recover from failures with `exceptionally` and `handle`.
The challenge is a price aggregator that queries many vendors in parallel and keeps the best
quote from the ones that answer.
'''

[[unit.step]]
kind = "concept"
id = "java-u26-c1-stages"
title = "Stages, not threads"
points = 5
difficulty = 26
intro = '''
A `CompletableFuture` is a node in a graph of **stages**. Each stage runs when the stages it
depends on have completed, so you describe the data flow and the library schedules the work.
'''
body = '''
## A graph of stages

Each call such as `thenApply` or `thenCombine` does not run anything yet. It registers a
**dependent stage** and returns its future at once. When a stage completes, it triggers the
stages that depend on it, which may trigger more. Your code describes the graph; completions
drive it.

```java
CompletableFuture<String> user = CompletableFuture.supplyAsync(() -> load(42), pool);
CompletableFuture<Integer> size = user.thenApply(String::length);
```

`supplyAsync` returns immediately. `size` completes only after `user` does.

## Which thread runs a callback?

- `supplyAsync(task, pool)` runs `task` on `pool`.
- A plain callback (`thenApply`) runs on the thread that completed the previous stage, or on
  the caller's thread if that stage was already complete when you attached it.
- The `...Async` variants (`thenApplyAsync(f, pool)`) always hand the callback to an executor.

Keep plain callbacks short and non-blocking, because they borrow someone else's thread.

## Success and failure travel the same graph

A stage completes **normally** with a value or **exceptionally** with a `Throwable`. A failure
skips the `thenApply`/`thenCombine` stages after it and lands in the first `exceptionally` or
`handle`, which can turn it back into a value. Like a `try`/`catch`, but spread over time and
threads.

Finally, `join()` and `get()` are the bridge back to blocking code: call them once, at the
edge of your program, ideally with a timeout.
'''

