test("empty input and a single item", () -> {
    equal(Parallel.map(List.<Integer>of(), x -> x + 1, 3), List.of());
    equal(Parallel.map(List.of("solo"), String::length, 1), List.of(4));
});
test("threads below one throws IllegalArgumentException", () -> {
    assertThrows(IllegalArgumentException.class, () -> Parallel.map(List.of(1), x -> x, 0));
    assertThrows(IllegalArgumentException.class, () -> Parallel.map(List.of(1), x -> x, -3));
});
test("null results are kept", () -> {
