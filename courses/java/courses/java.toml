prompt = '''
Count words from four lines of text on three threads, using `ConcurrentHashMap.merge` for the
per-word counts and an `AtomicInteger` for the total, then print the results sorted.

**Why:** concurrent counting and grouping is one of the most common shared-state jobs, and
