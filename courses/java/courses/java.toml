[[unit.step]]
kind = "challenge"
id = "java-u31-x1-hash-table"
title = "A resizing hash table from scratch"
points = 40
difficulty = 31
entry = "HashTable"
intro = '''
A real hash table must stay fast as it grows, so it watches its load factor and doubles its
bucket list when the chains get too long, rehashing every entry. You will build a generic one
with separate chaining, removal and automatic resizing, and the tests will check its capacity
to make sure it really grows that way.
'''
instructions = '''
## Your turn

Complete the generic class `HashTable<K, V>`:

```java
class HashTable<K, V> {
    HashTable()                       // 8 buckets
    HashTable(int capacity)           // the given number of buckets
    void put(K key, V value)          // insert or replace
    V get(K key)                      // the value, or null if absent
    boolean containsKey(K key)
    boolean remove(K key)             // true if the key was present
    int size()                        // the number of keys
    int capacity()                    // the current number of buckets
}
```

Rules:

- Use **separate chaining**: store entries in `buckets`, the list of lists in the starter. A
  key lives in bucket `Math.floorMod(key.hashCode(), capacity())`. Don't use `HashMap`,
  `HashSet` or any other JDK map or set to store the entries.
- `put` replaces the value if the key is already present. Otherwise it adds the entry, and if
  `size()` now exceeds `0.75 * capacity()`, it **doubles** the number of buckets and moves every
  entry to its new bucket.
- Keys are compared with `equals`, so different objects that are equal are the same key.
- Keys can't be `null`: `put`, `get`, `containsKey` and `remove` throw `NullPointerException` for
  a `null` key. Values may be `null`, and `containsKey` tells a stored `null` from an absent key.
- `remove` never shrinks the bucket list.

Example:

```java
var t = new HashTable<String, Integer>();
t.put("a", 1); t.put("b", 2); t.put("a", 3);
t.get("a");            // 3
t.size();              // 2
t.remove("b");         // true
t.get("b");            // null
```

Starting from 8 buckets, inserting 100 distinct keys leaves 256 buckets
(8 -> 16 -> 32 -> 64 -> 128 -> 256). Watch out for negative hash codes:
`"polygenelubricants".hashCode()` is `Integer.MIN_VALUE`.

Hidden tests decide correctness, including one with 200,000 keys.
'''
starter = '''
import java.util.ArrayList;
import java.util.List;

class HashTable<K, V> {
    // One key/value pair. Records are immutable: replace an entry to change its value.
    record Entry<K, V>(K key, V value) {}

    // The buckets: buckets.get(i) is the chain of entries whose index is i.
    List<List<Entry<K, V>>> buckets = new ArrayList<>();
    int size;

    HashTable() {
        this(8);
    }

    HashTable(int capacity) {
        for (int i = 0; i < capacity; i++) buckets.add(new ArrayList<>());
    }

    // Insert or replace; after adding a NEW key, double the buckets if size > 0.75 * capacity.
    // A null key throws NullPointerException.
    void put(K key, V value) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The value stored for key, or null if it is absent.
    V get(K key) {
        throw new UnsupportedOperationException("not implemented");
    }

    boolean containsKey(K key) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Delete key; return whether it was present. Never shrinks the buckets.
    boolean remove(K key) {
        throw new UnsupportedOperationException("not implemented");
    }

    int size() {
        return size;
    }

    int capacity() {
        return buckets.size();
    }
}
'''
