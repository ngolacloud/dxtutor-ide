[[unit.step]]
kind = "drill"
id = "java-u06-d3-pass-by-value"
title = "Pass by value, with primitives and references"
points = 10
difficulty = 6
placeholder_policy = "shown"
run_command = "java Main.java"
intro = '''
Java always passes a **copy** of each argument. For a primitive the copy is the number
itself, so the caller's variable cannot change. For an array or an object the copy is a
**reference**, so the method can modify the shared object, but reassigning the parameter
only redirects its own copy.
'''
prompt = '''
Pass an `int`, an array and a `StringBuilder` to methods that try to change them, and print
what the caller sees afterwards.

**Why:** "why did my variable not change?" and "who changed my array?" are two sides of the
same rule. Once you can predict these five lines, you understand how Java passes arguments.
'''
target = '''
public class Main {
    public static void main(String[] args) {
        int count = 10;
        bump(count);
        System.out.println("count " + count);
        count = bumped(count);
        System.out.println("count " + count);
        int[] data = {1, 2, 3};
        bumpFirst(data);
        System.out.println("data[0] " + data[0]);
        replace(data);
        System.out.println("data[0] " + data[0]);
        StringBuilder log = new StringBuilder("start");
        addStep(log);
        System.out.println(log);
    }

    static void bump(int x) {
        x++;
    }

    static int bumped(int x) {
        return x + 1;
    }

    static void bumpFirst(int[] values) {
        values[0]++;
    }

    static void replace(int[] values) {
        values = new int[] {99, 99, 99};
    }

    static void addStep(StringBuilder sb) {
        sb.append(" -> step");
    }
}
'''
