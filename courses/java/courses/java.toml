prompt = '''
Write `merge` for two sorted arrays, build `mergeSort` on top of it, and sort an array that
contains duplicates and negative numbers.

**Why:** the merge is the linear step that makes merge sort O(n log n), and the same loop is the
heart of the challenge.
'''
target = '''
import java.util.Arrays;

public class Main {
    public static void main(String[] args) {
        System.out.println(Arrays.toString(merge(new int[] {1, 4, 9}, new int[] {2, 4, 10, 12})));
        int[] data = {38, 27, 43, 3, -9, 82, 10, 3};
        System.out.println(Arrays.toString(mergeSort(data)) + " input " + Arrays.toString(data));
    }

    static int[] mergeSort(int[] a) {
        if (a.length <= 1) return a;
        int mid = a.length / 2;
        int[] left = mergeSort(Arrays.copyOfRange(a, 0, mid));
        int[] right = mergeSort(Arrays.copyOfRange(a, mid, a.length));
        return merge(left, right);
    }

    static int[] merge(int[] left, int[] right) {
        int[] out = new int[left.length + right.length];
        int i = 0, j = 0, k = 0;
        while (i < left.length && j < right.length) {
            out[k++] = left[i] <= right[j] ? left[i++] : right[j++];
        }
        while (i < left.length) out[k++] = left[i++];
        while (j < right.length) out[k++] = right[j++];
        return out;
    }
}
'''
