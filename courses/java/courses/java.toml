[unit.step.gabarito]
solution = '''
import java.util.Comparator;
import java.util.List;
import java.util.Map;
import java.util.TreeMap;
import java.util.TreeSet;
import java.util.stream.Collectors;

record Sale(String region, String product, int quantity, double unitPrice) {
    double revenue() {
        return quantity * unitPrice;
    }
}

class SalesReport {
    static double totalRevenue(List<Sale> sales) {
        return sales.stream().mapToDouble(Sale::revenue).sum();
    }

    static Map<String, Double> revenueByRegion(List<Sale> sales) {
        return sales.stream()
                .collect(Collectors.groupingBy(Sale::region, TreeMap::new, Collectors.summingDouble(Sale::revenue)));
    }

    static Map<String, Integer> unitsByProduct(List<Sale> sales) {
        return sales.stream()
                .collect(Collectors.groupingBy(Sale::product, TreeMap::new, Collectors.summingInt(Sale::quantity)));
    }

    static List<String> topProducts(List<Sale> sales, int n) {
        if (n < 0) {
            throw new IllegalArgumentException("n must not be negative: " + n);
        }
        Comparator<Map.Entry<String, Integer>> byUnits = Map.Entry.comparingByValue();
        return unitsByProduct(sales).entrySet().stream()
                .sorted(byUnits.reversed().thenComparing(Map.Entry.comparingByKey()))
                .limit(n)
                .map(Map.Entry::getKey)
                .toList();
    }

    static Map<String, List<String>> productsByRegion(List<Sale> sales) {
        return sales.stream()
                .collect(Collectors.groupingBy(Sale::region, TreeMap::new,
                        Collectors.collectingAndThen(
                                Collectors.mapping(Sale::product, Collectors.toCollection(TreeSet::new)),
                                List::copyOf)));
    }
}
'''
time = "O(n log n)"
space = "O(n)"
justification = '''
Let `n` be the number of sales and `k` the number of distinct keys (regions or products), with
`k ≤ n`. `totalRevenue` is one pass with O(1) extra space. `revenueByRegion` and `unitsByProduct`
make one pass and update one group per sale. With the `TreeMap` used here (sorted keys are
pleasant to print) each update costs O(log k), so they run in O(n log k); with the default
`HashMap` they would be O(n). Their space is the O(k) map.

`topProducts` builds the table of units and then sorts its `k` entries, not the `n` sales:
O(n log k + k log k), after which `limit(n)` stops the stream early. `productsByRegion` inserts
each product name into the `TreeSet` of its region (O(log k) per insertion, duplicates ignored)
and copies each set into a list once, so it is O(n log k) time and, in the worst case where
every sale has a different product, O(n) space. Since `k ≤ n`, every method is at most
**O(n log n)** in time and **O(n)** in extra space.

The comparator carries the ranking rule: `comparingByValue().reversed()` puts the largest totals
first and `thenComparing(comparingByKey())` breaks ties alphabetically, so the result is
deterministic whatever the iteration order of the map.
'''

