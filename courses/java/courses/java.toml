[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.List;
import java.util.Objects;

class BST<T extends Comparable<T>> {
    static final class Node<T> {
        T key;
        Node<T> left, right;

        Node(T key) {
            this.key = key;
        }
    }

    Node<T> root;
    int size;

    boolean insert(T key) {
        Objects.requireNonNull(key, "key");
        if (root == null) {
            root = new Node<>(key);
            size++;
            return true;
        }
        Node<T> node = root;
        while (true) {
            int c = key.compareTo(node.key);
            if (c == 0) return false;
            Node<T> next = c < 0 ? node.left : node.right;
            if (next == null) {
                if (c < 0) node.left = new Node<>(key);
                else node.right = new Node<>(key);
                size++;
                return true;
            }
            node = next;
        }
    }

    boolean contains(T key) {
        Objects.requireNonNull(key, "key");
        Node<T> node = root;
        while (node != null) {
            int c = key.compareTo(node.key);
            if (c == 0) return true;
            node = c < 0 ? node.left : node.right;
        }
        return false;
    }

    boolean delete(T key) {
        Objects.requireNonNull(key, "key");
        int before = size;
        root = delete(root, key);
        return size < before;
    }

    private Node<T> delete(Node<T> node, T key) {
        if (node == null) return null;
        int c = key.compareTo(node.key);
        if (c < 0) {
            node.left = delete(node.left, key);
        } else if (c > 0) {
            node.right = delete(node.right, key);
        } else if (node.left == null) {
            size--;
            return node.right;
        } else if (node.right == null) {
            size--;
            return node.left;
        } else {
            Node<T> successor = node.right;
            while (successor.left != null) successor = successor.left;
            node.key = successor.key;
            node.right = delete(node.right, successor.key);
        }
        return node;
    }

    int size() {
        return size;
    }

    int height() {
        return height(root);
    }

    private int height(Node<T> node) {
        return node == null ? 0 : 1 + Math.max(height(node.left), height(node.right));
    }

    List<T> inOrder() {
        List<T> out = new ArrayList<>(size);
        List<Node<T>> stack = new ArrayList<>();
        Node<T> node = root;
        while (node != null || !stack.isEmpty()) {
            while (node != null) {
                stack.add(node);
                node = node.left;
            }
            node = stack.remove(stack.size() - 1);
            out.add(node.key);
            node = node.right;
        }
        return out;
    }
}
'''
time = "O(h) for insert, contains and delete; O(n) for height and inOrder"
space = "O(n) for the nodes; O(h) extra for delete, height and inOrder"
justification = '''
`insert` and `contains` follow one root-to-leaf path, doing one `compareTo` per level, so they
cost **O(h)**, where *h* is the height. They use loops, so they need only O(1) extra space.

`delete` also walks one path to the node. If the node has fewer than two children it is
replaced by its only child (or `null`) in O(1). With two children, finding the successor
continues down the same right subtree, and deleting the successor walks that path again; the
successor has no left child, so that second deletion is the easy case. The total is still
O(h), and the recursion uses **O(h)** stack frames. Counting deletions through `size` lets the
public method report whether the key was found without a second search.

`height` and `inOrder` must visit every node, so they are **O(n)**. `inOrder` keeps an explicit
stack of at most *h* nodes, so even the 3,000-node chain in the tests can't overflow the call
stack; the recursive `height` goes *h* frames deep, which the evaluator's stack handles easily
for these sizes.

For random insertion orders *h* is O(log n) on average (about 40 for 100,000 keys), so the
100,000 inserts and 50,000 deletes take O(n log n) in total. Inserting sorted keys gives
*h* = n, and every operation degrades to O(n): that is the case self-balancing trees such as
`TreeMap`'s red-black tree exist to prevent. The nodes themselves take **O(n)** space.
'''

[[unit]]
id = "java-u33-sorting-searching"
title = "Sorting and searching by hand"
level = "advanced"
difficulty = 33
intro = '''
`Arrays.sort` and `Arrays.binarySearch` are a call away, but writing them yourself is how you
learn why one algorithm is O(n²) and another O(n log n), and why a binary search is so easy to
get subtly wrong. You will write insertion sort, merge two sorted arrays into a full merge
sort, write an overflow-safe binary search, and finish by sorting while counting inversions.
'''
concepts = '''
## The idea

**Insertion sort** grows a sorted prefix one element at a time: take the next element and shift larger ones right until its place opens up. Each shift fixes exactly one **inversion**, a pair of positions `i < j` with `a[i] > a[j]`. A nearly sorted array has few inversions and sorts in almost O(n); a reversed one has n(n-1)/2 and costs **O(n²)**.

**Merge sort** uses **divide and conquer**: split the array in half, sort each half recursively, then **merge** the two sorted halves in one linear pass, always taking the smaller front element. The recursion is log₂ n levels deep and each level does O(n) merging work, so the total is **O(n log n)**, whatever the input. Taking from the left half on ties makes it **stable**: equal elements keep their original order.

**Binary search** finds a value in a *sorted* array by halving the range that could contain it. A million elements need about 20 comparisons: **O(log n)**. The hard part is the boundaries, so state an invariant and keep it, for example "every index before `lo` holds a value that is too small, and every index from `hi` on does not".

## How Java does it

The JDK sorts primitives with a dual-pivot quicksort (fast, not stable, which doesn't matter for numbers) and objects with TimSort, a stable, merge-based sort:

```java
int[] a = {5, 3, 8};
Arrays.sort(a);                                      // [3, 5, 8]
List<String> names = new ArrayList<>(List.of("eve", "al", "bo"));
names.sort(Comparator.comparing(String::length));    // stable: [al, bo, eve]
```

`Arrays.binarySearch(a, key)` returns the index when the key is present, otherwise `-(insertionPoint) - 1`, a negative number that still encodes where the key would go. With duplicates it may return any matching index.

`Arrays.copyOfRange(a, from, to)` copies a half-open slice, which is handy for splitting.

## What is special or tricky

- **`(lo + hi) / 2` can overflow.** When `lo + hi` exceeds `Integer.MAX_VALUE` the sum wraps negative and the next array access throws `ArrayIndexOutOfBoundsException`. This bug sat in the JDK's own binary search for nine years. Write `lo + (hi - lo) / 2` or `(lo + hi) >>> 1`.
- **Off-by-one boundaries** cause infinite loops or skipped elements. Mixing `[lo, hi]` with `[lo, hi)` is the usual culprit.
- **Counts can outgrow `int`.** An array of 100,000 elements can have about 5 × 10⁹ inversions, more than `Integer.MAX_VALUE` (about 2.1 × 10⁹). Count in a `long`.
- **Don't sort with `(a, b) -> a - b`.** The subtraction overflows for large values of opposite sign. Use `Integer.compare(a, b)`.
- **Binary search needs sorted input.** On an unsorted array it returns nonsense, not an error.

## What you will practise

You will write insertion sort and count its shifts, merge two sorted arrays and build merge sort on top, and write a lower-bound binary search next to `Arrays.binarySearch`. The challenge sorts 100,000 elements while counting their inversions in O(n log n).
'''

[[unit.step]]
kind = "concept"
id = "java-u33-c1-divide-conquer"
title = "Divide, conquer, merge"
points = 5
difficulty = 33
intro = '''
Divide and conquer solves a problem by splitting it into smaller copies of itself, solving those
recursively, and combining the answers. Merge sort and binary search are its two most famous
examples, and their costs follow directly from how they split.
'''
body = '''
## Merge sort in three steps

1. **Divide**: split the array at the middle.
2. **Conquer**: sort each half recursively. An array of 0 or 1 elements is already sorted.
3. **Combine**: merge the two sorted halves.

Merging is the only real work. Keep a cursor in each half; repeatedly copy the smaller front
element to the output and advance that cursor; when one half runs out, copy the rest of the
other. Every element is copied once, so merging n elements is O(n).

## Why O(n log n)

Write T(n) for the time to sort n elements. Splitting gives two problems of size n/2 plus a
linear merge: T(n) = 2·T(n/2) + O(n). The recursion has log₂ n levels, and at every level the
merges together touch all n elements once. That is n per level times log₂ n levels. Merge sort
also needs an O(n) buffer to merge into.

## Binary search: halve the range

Binary search keeps the half-open range `[lo, hi)` of positions it hasn't ruled out yet: every
value before `lo` is known to be too small, every value from `hi` on is known not to be. It looks
at the middle and throws away the half that can't hold the answer:

```java
int lo = 0, hi = a.length;
while (lo < hi) {
    int mid = (lo + hi) >>> 1;
    if (a[mid] < target) lo = mid + 1; else hi = mid;
}
```

Each step halves the range, so it takes about log₂ n steps. The loop ends with `lo == hi`, the
first position whose value is not smaller than `target`.
'''

