[[unit.step]]
kind = "challenge"
id = "java-u09-x1-bank-account"
title = "A bank account that keeps its invariants"
points = 30
difficulty = 9
entry = "BankAccount"
intro = '''
A class earns its keep when it makes invalid states impossible. Money is the classic case:
amounts are stored as whole **cents** in a `long`, because binary floating point cannot
represent 0.10 exactly, and every operation either succeeds completely or changes nothing.
The tests also check that all state is private and that a static counter is shared by
every account.
'''
instructions = '''
## Your turn

Implement the class `BankAccount`. All amounts are in cents, as `long`.

```java
public BankAccount(String owner, long openingCents)
public String owner()
public long balance()
public void deposit(long cents)
public boolean withdraw(long cents)
public boolean transferTo(BankAccount target, long cents)
public static int opened()
public String toString()
```

Rules:

- The constructor throws `IllegalArgumentException` if `owner` is `null` or blank (only
  spaces), or if `openingCents` is negative.
- `deposit` throws `IllegalArgumentException` unless `cents > 0`.
- `withdraw` throws `IllegalArgumentException` unless `cents > 0`. If the balance is too
  small it returns `false` and changes nothing; otherwise it subtracts and returns `true`.
- `transferTo` moves money to `target`. It throws `IllegalArgumentException` if `target` is
  `null`, is this same account, or `cents <= 0`. It returns `false` and changes nothing if
  the balance is too small.
- `opened()` returns how many accounts have been created successfully so far (a failed
  constructor does not count).
- `toString()` returns the owner, a colon and the balance in units with two decimals:
  `"Ada: 1234.56"`, `"Bo: 0.05"`.
- Every field must be `private`.

Example:

```java
var a = new BankAccount("Ada", 10_000);
a.withdraw(2_500);     // true, balance 7500
a.withdraw(9_000);     // false, balance still 7500
a.toString();          // "Ada: 75.00"
```

**Hint:** `String.isBlank()` detects blank names, and `withdraw` is the natural building
block for `transferTo`.

Hidden tests decide correctness.
'''
