  "A `double` holds a decimal number.",
  "A `char` is a single character in single quotes.",
  "A `boolean` is either `true` or `false`.",
  "`var` lets the compiler infer the type: here it is `String`.",
  "`final` means this variable can be assigned only once.",
  "Reads 12, adds 3 and stores 15 back into `apples`.",
  "Numbers are turned into text as they join the string: `15 apples at 1.25 each`.",
  "`*` binds tighter than `+`, so the multiplication happens first: `Total: 18.75`.",
  "Prints the long value without the underscores.",
  "A `char`, a `boolean` and a `String` joined with spaces: `J true Lisbon`.",
  "A constant used in a calculation: `364 days in 52 weeks`.",
  "Closes `main`.",
  "Closes the class.",
]
explanation = '''
The program printed `15 apples at 1.25 each`, `Total: 18.75`, `9000000000 stars`,
`J true Lisbon` and `364 days in 52 weeks`. Each variable kept the type it was declared
with: `apples` could be updated because it is not `final`, while `DAYS_PER_WEEK` could only
be read. In `apples * price` the `int` was widened to a `double` automatically, because no
information is lost going that way.
'''

[[unit.step]]
kind = "drill"
id = "java-u02-d2-casting"
title = "Integer division and casts"
points = 10
difficulty = 2
placeholder_policy = "shown"
run_command = "java Main.java"
intro = '''
When both operands of `/` are `int`, Java performs **integer division** and throws the
fraction away. A **cast** such as `(double)` or `(int)` converts a value to another type,
explicitly when information could be lost. Characters are stored as numbers, which is why
`'A' + 1` is `66`.
'''
prompt = '''
Divide two `int`s with and without a cast, convert a decimal to a whole number in two
different ways, and do arithmetic with a `char`.

**Why:** a wrong average or a lost fraction is one of the most common bugs in real code,
