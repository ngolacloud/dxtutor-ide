test("runs every vendor on the given executor", () -> {
    Set<String> threads = ConcurrentHashMap.newKeySet();
    List<Supplier<Integer>> vendors = List.of(
            () -> { threads.add(Thread.currentThread().getName()); return 3; },
            () -> { threads.add(Thread.currentThread().getName()); return 1; },
            () -> { threads.add(Thread.currentThread().getName()); return 2; });
    equal(Quotes.bestPrice(vendors, pool).get(2, TimeUnit.SECONDS), 1);
    equal(threads, Set.of("vendor-pool"));
});
test("asks the vendors concurrently", () -> {
    CountDownLatch everyone = new CountDownLatch(4);
    AtomicBoolean overlapped = new AtomicBoolean(true);
    Supplier<Integer> vendor = () -> {
        everyone.countDown();
        try {
            if (!everyone.await(2, TimeUnit.SECONDS)) overlapped.set(false);
        } catch (InterruptedException e) {
            throw new IllegalStateException(e);
        }
        return 10;
    };
    equal(Quotes.bestPrice(List.of(vendor, vendor, vendor, vendor), pool).get(10, TimeUnit.SECONDS), 10);
    check(overlapped.get(), "the four vendors never ran at the same time");
});
'''

[unit.step.gabarito]
solution = '''
import java.util.List;
import java.util.NoSuchElementException;
import java.util.Optional;
import java.util.concurrent.CompletableFuture;
import java.util.concurrent.Executor;
import java.util.function.Supplier;

class Quotes {
    static CompletableFuture<Integer> bestPrice(List<Supplier<Integer>> vendors, Executor executor) {
        List<CompletableFuture<Optional<Integer>>> quotes = vendors.stream()
                .map(vendor -> CompletableFuture.supplyAsync(vendor, executor)
                        .thenApply(Optional::of)                  // null fails here too
                        .exceptionally(ex -> Optional.empty()))   // a failed vendor is just "no quote"
                .toList();
        return CompletableFuture.allOf(quotes.toArray(new CompletableFuture<?>[0]))
                .thenApply(done -> quotes.stream()
                        .map(CompletableFuture::join)             // all complete: join never blocks here
                        .flatMap(Optional::stream)
                        .min(Integer::compare)
                        .orElseThrow(() -> new NoSuchElementException("no vendor answered")));
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
For n vendors, `bestPrice` itself does O(n) work: it creates three small stages per vendor
and one `allOf` stage, then returns. The waiting is not ours: the wall-clock time is that of
the **slowest** vendor (given enough executor threads), instead of the sum of all of them.
When `allOf` completes, the final stage scans the n results once to find the minimum, which
is **O(n)** time. It keeps one future and one `Optional` per vendor, so space is **O(n)**.

Correctness comes from making every per-vendor future infallible: `thenApply(Optional::of)`
turns a `null` quote into a failure (`Optional.of(null)` throws), and `exceptionally` maps any
failure to `Optional.empty()`. That guarantees `allOf` completes normally, so `join()` inside
the final stage never blocks and never throws. If no value is present, `orElseThrow` throws
inside the stage, which completes the returned future exceptionally with the
`NoSuchElementException` instead of throwing at the caller. Joining each vendor in a loop
inside `bestPrice` would also find the minimum, but it would block the caller until the
slowest vendor answered; calling `supplyAsync` without the executor would run blocking vendors
on the common pool.
'''

[[unit]]
id = "java-u27-virtual-threads"
title = "Virtual threads"
level = "advanced"
difficulty = 27
intro = '''
Java 21's virtual threads make a thread so cheap that you can give every task its own,
even a million of them, and still write plain blocking code. You will start virtual threads
by hand, run ten thousand sleeping tasks on a thread-per-task executor, cap concurrency with
a semaphore, and finish with a concurrent `mapAll` that fans work out over virtual threads.
'''
concepts = '''
## The idea

Every `Thread` before Java 21 is a **platform thread**: a thin wrapper around an
operating-system thread, with a large reserved stack, a kernel scheduling entry and a context
switch that costs microseconds. A server can afford a few thousand. Yet the simplest way to
write a server is **thread-per-request**: each request gets its own thread and its blocking
code reads top to bottom. When requests spend most of their time waiting on databases and
networks, a few thousand threads cap throughput long before the CPU is busy. The classic
workarounds, bounded pools that queue requests and async callbacks (unit 26), scale better
but are harder to write, read and debug.

## How Java does it

**Virtual threads** (JEP 444, final in Java 21) are `Thread` objects scheduled by the JVM
instead of the OS. The JVM runs them on a few **carrier** threads, about one per CPU core.
When a virtual thread blocks on a socket, a sleep, a `BlockingQueue` or a
`java.util.concurrent` lock, the JVM **unmounts** it: its stack moves to the heap and the
carrier runs another virtual thread. When the operation completes, the thread is mounted
again, possibly on a different carrier. A parked virtual thread costs a few hundred bytes to
a few kilobytes of heap, so a million of them fit comfortably.

```java
Thread t = Thread.ofVirtual().name("worker").start(() -> System.out.println("hi"));
t.join();

try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
    Future<String> page = executor.submit(() -> download("a"));
}   // close() waits for every submitted task
```

`newVirtualThreadPerTaskExecutor()` starts a fresh virtual thread for every task. There is
nothing to size and nothing to reuse: virtual threads are cheap to create and meant to be
thrown away.

## When they help, and when they don't

- They help with **many concurrent tasks that mostly wait**: HTTP calls, database queries,
  file I/O, sleeps. Throughput grows with the number of tasks in flight.
- They do **not** make CPU-bound work faster. Ten thousand threads hashing data still share
  the same cores; use a fixed pool or a parallel stream for that.
- **Don't pool them.** A pool exists to ration an expensive thing, and virtual threads are
  not expensive. To protect a scarce resource, say a database that accepts ten connections,
  use a `Semaphore`.
- **Pinning.** In Java 21, a virtual thread that blocks *inside* a `synchronized` block can't
  unmount and holds its carrier hostage. Prefer `ReentrantLock` around blocking calls. Java 24
  removed most of this limitation.
- **`ThreadLocal` caches** become per-task caches, recreated for every task.
- Virtual threads are always daemon threads, and `Thread.currentThread().isVirtual()` tells
  you which kind you are on.

## What you will practise

You will start a virtual thread by hand, run ten thousand sleeping tasks in a fraction of the
sequential time, and cap concurrency with a semaphore. The challenge is `mapAll`: run a
function over a list with one virtual thread per item, keep the results in input order,
respect a concurrency limit and report failures.
'''

[[unit.step]]
kind = "concept"
id = "java-u27-c1-mount"
title = "Mount, block, unmount"
points = 5
difficulty = 27
intro = '''
A virtual thread is a continuation, a paused computation the JVM can resume later, scheduled
on a small set of carrier threads. Blocking no longer means holding an OS thread hostage;
it means "park me and run someone else".
'''
body = '''
## Two layers

- **Carrier threads** are ordinary platform threads in a `ForkJoinPool`, by default one per
  CPU core. They are the only threads the operating system sees.
- **Virtual threads** are Java objects. To run, one is **mounted** on a free carrier, and its
  frames execute on that carrier's stack.

## What happens when it blocks

When a virtual thread calls a blocking operation such as `Thread.sleep`, a socket read,
`BlockingQueue.take()` or `ReentrantLock.lock()`, the JDK code underneath notices that it is
on a virtual thread. Instead of blocking the carrier, it **unmounts**: the virtual thread's
stack frames are copied to the heap and the carrier picks up the next runnable virtual
thread. When the sleep ends or the data arrives, the virtual thread becomes runnable again
and is mounted on whatever carrier is free.

So ten thousand tasks that each sleep for 10 ms need only a handful of carriers: while one
sleeps, another runs. The cost of a blocked task drops from "one OS thread" to "a small heap
object".

## What it does not change

The CPU still has the same number of cores. If every task computes instead of waiting, the
carriers are always busy and virtual threads add nothing. And the code you write is the same
blocking, sequential code you would write for a platform thread. That is the whole point:
the scalability of async callbacks, with the readability of straight-line code and stack
traces that make sense.
'''

