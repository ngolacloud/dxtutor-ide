import java.util.ArrayList;
import java.util.Arrays;
import java.util.Collections;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        List<Integer> fixed = List.of(42, 7, 19, 7, 3);
        try {
            fixed.add(99);
        } catch (UnsupportedOperationException e) {
            System.out.println("List.of cannot grow");
        }

        List<Integer> work = new ArrayList<>(fixed);
        Collections.sort(work);
        System.out.println("sorted " + work);
        Collections.reverse(work);
        System.out.println("reversed " + work);
        System.out.println("max " + Collections.max(work) + ", min " + Collections.min(work)
                + ", sevens " + Collections.frequency(work, 7));

        work.removeIf(n -> n < 10);
        System.out.println("at least 10: " + work);

        List<String> view = Arrays.asList("c", "a", "b");
        Collections.sort(view);
        System.out.println(view + " " + fixed);
    }
}
