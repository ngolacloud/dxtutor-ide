target = '''
import java.util.HashMap;
import java.util.HashSet;
import java.util.List;
import java.util.Map;
import java.util.Set;
import java.util.TreeSet;

public class Main {
    public static void main(String[] args) {
        String[] words = "to be or not to be that is the question".split(" ");
        Map<String, Integer> freq = new HashMap<>();
        for (String w : words) {
            freq.merge(w, 1, Integer::sum);
        }
        System.out.println(freq.get("to") + " " + freq.get("be") + " " + freq.getOrDefault("dog", 0));

        Set<String> mine = new HashSet<>(List.of("go", "rust", "python"));
        Set<String> yours = new HashSet<>(List.of("python", "java", "go"));
        Set<String> both = new TreeSet<>(mine);
        both.retainAll(yours);
        Set<String> either = new TreeSet<>(mine);
        either.addAll(yours);
        Set<String> onlyMine = new TreeSet<>(mine);
        onlyMine.removeAll(yours);
        System.out.println(both + " " + either + " " + onlyMine);
        System.out.println(mine.contains("rust") + " " + new HashSet<>(List.of(words)).size());
    }
}
