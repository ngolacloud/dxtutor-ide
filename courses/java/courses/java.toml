[[unit.step]]
kind = "drill"
id = "java-u20-d2-comparable"
title = "A natural order with Comparable"
points = 10
difficulty = 20
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
Version numbers must be compared field by field as integers: as strings, `"10.0.0"` sorts before
`"2.0.0"`. Implementing `Comparable` gives a type its natural order, which `Collections.sort`,
`TreeSet` and `TreeMap` use automatically.
'''
prompt = '''
Give a `Version` record a natural order (major, then minor, then patch) with `Integer.compare`,
sort a list of versions, put them in a `TreeSet`, and compare with plain string order.

**Why:** a lexicographic comparison over several keys is the pattern behind every multi-field
ordering, and string order is the classic wrong answer for numbers.
'''
target = '''
import java.util.ArrayList;
import java.util.Collections;
import java.util.List;
import java.util.TreeSet;

public class Main {
    public static void main(String[] args) {
        List<Version> versions = new ArrayList<>(List.of(
                Version.parse("1.10.0"), Version.parse("1.2.3"),
                Version.parse("1.2.10"), Version.parse("0.9.9")));
        Collections.sort(versions);
        System.out.println(versions);

        TreeSet<Version> set = new TreeSet<>(versions);
        set.add(Version.parse("1.2.3"));
        System.out.println(set.size() + " " + set.first() + " " + set.last());
        System.out.println(Version.parse("2.0.0").compareTo(Version.parse("10.0.0")) < 0);
        System.out.println("2.0.0".compareTo("10.0.0") < 0);
    }
}

record Version(int major, int minor, int patch) implements Comparable<Version> {
    static Version parse(String text) {
        String[] p = text.split("\\.");
        return new Version(Integer.parseInt(p[0]), Integer.parseInt(p[1]), Integer.parseInt(p[2]));
    }

    @Override
    public int compareTo(Version other) {
        int c = Integer.compare(major, other.major);
        if (c == 0) c = Integer.compare(minor, other.minor);
        if (c == 0) c = Integer.compare(patch, other.patch);
        return c;
    }

    @Override
    public String toString() {
        return major + "." + minor + "." + patch;
    }
}
'''
