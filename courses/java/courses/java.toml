tests = '''
import java.util.ArrayList;
import java.util.Arrays;
import java.util.List;
import java.util.NoSuchElementException;
import java.util.function.Function;
Function<SinglyLinkedList<Integer>, List<Integer>> walk = l -> {
    var out = new ArrayList<Integer>();
    SinglyLinkedList.Node<Integer> last = null;
    for (var n = l.head; n != null; n = n.next) {
        out.add(n.val);
        last = n;
        if (out.size() > 3_000_000) throw new AssertionError("the list has a cycle: an old next was not cleared");
    }
    if (last != l.tail) throw new AssertionError("tail must be the last node reached from head");
    return out;
};
test("an empty list", () -> {
    var list = new SinglyLinkedList<Integer>();
    equal(list.size(), 0);
    check(list.head == null && list.tail == null, "an empty list has a null head and tail");
    check(!list.iterator().hasNext(), "iterating an empty list yields nothing");
    assertThrows(NoSuchElementException.class, () -> list.removeFirst());
    assertThrows(NoSuchElementException.class, () -> list.iterator().next());
    list.reverse();
    equal(walk.apply(list), List.of());
});
test("addFirst and addLast keep the order and the tail", () -> {
    var list = new SinglyLinkedList<Integer>();
    list.addLast(2);
    list.addLast(3);
    list.addFirst(1);
    list.addFirst(0);
    equal(walk.apply(list), List.of(0, 1, 2, 3));
    equal(list.size(), 4);
    equal(list.tail.val, 3);
    check(list.tail.next == null, "tail.next must be null");
    var seen = new ArrayList<Integer>();
    for (int v : list) seen.add(v);
    equal(seen, List.of(0, 1, 2, 3));
});
test("removeFirst until empty, then reuse the list", () -> {
    var list = new SinglyLinkedList<Integer>();
    list.addFirst(5);
    list.addLast(6);
    equal(list.removeFirst(), 5);
    equal(list.removeFirst(), 6);
    equal(list.size(), 0);
    check(list.head == null && list.tail == null, "removing the last node must clear head and tail");
    assertThrows(NoSuchElementException.class, () -> list.removeFirst());
    list.addLast(9);
    equal(walk.apply(list), List.of(9));
    check(list.head == list.tail, "a one-node list has head == tail");
});
test("get checks its bounds", () -> {
    var list = new SinglyLinkedList<String>();
    for (String s : List.of("a", "b", "c")) list.addLast(s);
    equal(list.get(0), "a");
    equal(list.get(2), "c");
    assertThrows(IndexOutOfBoundsException.class, () -> list.get(-1));
    assertThrows(IndexOutOfBoundsException.class, () -> list.get(3));
});
test("reverse rewires the same nodes", () -> {
    var list = new SinglyLinkedList<Integer>();
    for (int v : new int[] {10, 20, 30, 40}) list.addLast(v);
    var before = new ArrayList<SinglyLinkedList.Node<Integer>>();
    for (var n = list.head; n != null; n = n.next) before.add(n);
    list.reverse();
    equal(walk.apply(list), List.of(40, 30, 20, 10));
    var after = new ArrayList<SinglyLinkedList.Node<Integer>>();
    for (var n = list.head; n != null; n = n.next) after.add(n);
    equal(after.size(), 4);
    for (int i = 0; i < 4; i++) check(after.get(i) == before.get(3 - i), "nodes must be rewired, not recreated");
    check(list.tail == before.get(0) && list.tail.next == null, "the old head must become the tail");
    list.addLast(50);
    equal(walk.apply(list), List.of(40, 30, 20, 10, 50));
    equal(list.size(), 5);
});
test("one node, duplicates and null values", () -> {
    var one = new SinglyLinkedList<Integer>();
    one.addLast(7);
    var node = one.head;
    one.reverse();
    check(one.head == node && one.tail == node && node.next == null, "a one-node list stays the same node");
    var list = new SinglyLinkedList<Integer>();
    for (Integer v : Arrays.asList(-1, null, -1, 2, 2)) list.addLast(v);
    list.reverse();
    equal(walk.apply(list), Arrays.asList(2, 2, -1, null, -1));
    equal(list.get(3), null);
    equal(list.size(), 5);
});
test("a million nodes, fast and without recursion", () -> {
    int n = 1_000_000;
    var list = new SinglyLinkedList<Integer>();
    long start = System.nanoTime();
    for (int i = 0; i < n; i++) {
        if (i % 2 == 0) list.addLast(i);
        else list.addFirst(i);
    }
    list.reverse();
    list.reverse();
    list.reverse();
    long sum = 0;
    for (int v : list) sum += v;
    long ms = (System.nanoTime() - start) / 1_000_000;
    equal(list.size(), n);
    equal(sum, (long) n * (n - 1) / 2);
    equal(list.head.val, n - 2);
    equal(list.tail.val, n - 1);
    var values = walk.apply(list);
    equal(values.size(), n);
    equal(values.get(n / 2), 1);
    check(ms < 2000, "a million O(1) inserts and three O(n) reversals took " + ms + " ms");
});
