[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.List;
import java.util.concurrent.ExecutionException;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;
import java.util.concurrent.Future;
import java.util.function.Function;

class Parallel {
    static <T, R> List<R> map(List<T> items, Function<? super T, ? extends R> fn, int threads) {
        if (threads < 1) throw new IllegalArgumentException("threads must be at least 1: " + threads);
        List<Future<R>> futures = new ArrayList<>(items.size());
        // close() at the end of the block waits for the tasks and stops the threads,
        // also when an exception leaves the block.
        try (ExecutorService pool = Executors.newFixedThreadPool(threads)) {
            for (T item : items) {
                futures.add(pool.submit(() -> fn.apply(item)));
            }
            List<R> results = new ArrayList<>(items.size());
            for (Future<R> future : futures) {
                results.add(future.get());
            }
            return results;
        } catch (ExecutionException e) {
            Throwable cause = e.getCause();
            if (cause instanceof RuntimeException re) throw re;
            if (cause instanceof Error err) throw err;
            throw new IllegalStateException(cause);
        } catch (InterruptedException e) {
            Thread.currentThread().interrupt();
            throw new IllegalStateException("interrupted while waiting for results", e);
        }
    }
}
'''
time = "O(n) work, about O(n / threads) elapsed"
space = "O(n)"
justification = '''
Let `n` be the number of items and assume each call to `fn` costs O(1). Submitting the tasks
is O(n), each `get` returns in O(1) once its task is done, and building the result list is
O(n), so the total **work** is **O(n)** plus the pool's fixed start-up cost of creating
`threads` threads. With `threads` cores available, the calls to `fn` run `threads` at a
time, so the **elapsed time** for the `fn` calls drops towards O(n / threads). For tiny `fn`s
the per-task overhead (queueing and a context switch, microseconds each) dominates and a
plain loop is faster: parallelism pays only when each call does real work.

Space is **O(n)**: one `Future` per item plus the result list, and O(threads) for the pool's
stacks. Order comes for free because the futures are stored in submission order and read in
that order; `get` simply waits when a later item happened to finish first. Unwrapping
`ExecutionException` restores the caller's view of the failure, and try-with-resources
guarantees `close()`, which waits for queued tasks and terminates the threads on both the
success and the failure path. When a task fails, the remaining tasks still run to completion
before `close()` returns; `shutdownNow()` could interrupt them instead.
'''

[[unit]]
id = "java-u25-synchronization"
title = "Synchronization and thread safety"
level = "advanced"
difficulty = 25
intro = '''
When threads share mutable data, the order in which their steps interleave can change the
result, and the bug may show up once in a thousand runs. This unit explains why `count++` is
not safe, then gives you the tools that fix it: `synchronized`, explicit locks, atomic
variables and `ConcurrentHashMap`. The challenge is a thread-safe bank that must never lose
money and never deadlock.
'''
concepts = '''
## The idea

A **race condition** happens when the correctness of a program depends on how the steps of
several threads interleave. The classic example is a shared counter. `count++` looks like one
operation, but it is three: read `count`, add one, write it back. If two threads both read 41,
both add one and both write 42, one increment is lost. With millions of increments across
four threads, the final total is usually far below the expected value, and different on every
run.

There is a second, subtler problem: **visibility**. Without synchronization, the JIT compiler
and the CPU may keep a value in a register or a core's cache, so a write by one thread might
never be seen by another. Java's memory model promises visibility only along
**happens-before** edges, such as releasing a lock and later acquiring the same lock.

The cure for both is to make each **read-modify-write** sequence **atomic**: no other thread
can observe or interfere with it half-done. A section of code that must run atomically is a
**critical section**.

## How Java does it

- **`synchronized`**: every object has a built-in lock (a *monitor*). A `synchronized` method
  or block holds it, so only one thread at a time runs code guarded by the same object, and
  everything written before the release is visible after the next acquire.
- **`ReentrantLock`** (in `java.util.concurrent.locks`): the same guarantees as an explicit
  object, plus `tryLock` with a timeout. Always unlock in `finally`:

```java
lock.lock();
try {
    balance += amount;
} finally {
    lock.unlock();
}
```

- **Atomics** such as `AtomicInteger` and `AtomicLong` use the CPU's compare-and-set
  instruction: `incrementAndGet()` is a lock-free, atomic `++`.
- **`ConcurrentHashMap`** is a thread-safe map whose `merge`, `compute` and `computeIfAbsent`
  update one key atomically.

## Pitfalls

- **Different locks protect nothing.** Two threads synchronizing on two different objects do
  not exclude each other. Every access to the shared state must use the *same* lock.
- **Check-then-act.** `if (!map.containsKey(k)) map.put(k, v)` is two atomic steps, not one
  atomic step; another thread can slip in between. Use `putIfAbsent` or `merge`.
- **Deadlock.** Thread A holds lock 1 and waits for lock 2 while thread B holds 2 and waits for
  1: both wait forever, with no error message. Always acquire multiple locks in one global
  order.
- `wait()` or `notify()` outside a `synchronized` block on that object throws
  `IllegalMonitorStateException`; `ConcurrentHashMap` rejects `null` keys and values with
  `NullPointerException`.

## What you will practise

You will fix a shared counter with `synchronized`, guard an account with a `ReentrantLock`,
and count words from several threads with `ConcurrentHashMap.merge` and an `AtomicInteger`.
The challenge is a bank whose transfers stay correct under heavy concurrency and whose locks
are always taken in the same order.
'''

[[unit.step]]
kind = "concept"
id = "java-u25-c1-races-and-locks"
title = "Races, atomicity and locks"
points = 5
difficulty = 25
intro = '''
Mutual exclusion is the oldest idea in concurrent programming: make the critical section run
as if it were a single indivisible step. Every tool in this unit is a different way of
building that guarantee, with different costs.
'''
body = '''
## Watching an increment get lost

Here is one possible interleaving of two threads running `count++` when `count` is 41:

```text
thread A: read count   (41)
thread B: read count   (41)
thread A: write 41 + 1 (42)
thread B: write 41 + 1 (42)   <- A's increment is lost
```

Nothing crashed and no exception was thrown; the answer is just wrong. That is what makes
races dangerous: tests usually pass, and the bug appears under load.

## Making it atomic

```java
class Counter {
    private int value;
    synchronized void increment() { value++; }
    synchronized int get() { return value; }
}
```

`synchronized` on an instance method locks `this`. A second thread calling `increment()`
blocks until the first one leaves the method, so the three steps of `value++` can no longer
interleave. Note that `get()` is synchronized too: the lock also guarantees that the reader
sees the latest value.

## Choosing a tool

- **`synchronized`** is simple and right for most small critical sections.
- **`ReentrantLock`** adds `tryLock`, timeouts and fairness; you must `unlock()` in `finally`.
- **`AtomicInteger`/`AtomicLong`** suit a single variable updated independently, such as a
  counter or an id generator.
- **`ConcurrentHashMap`** is the shared map to use; update one key with `merge` or `compute`.

## Making it correct, then fast

Holding a lock serializes the code inside it, so keep critical sections short, never call
slow or unknown code while holding a lock, and never acquire two locks in different orders in
different places.
'''

