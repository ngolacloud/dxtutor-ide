    }
    long start = System.nanoTime();
    Map<String, List<String>> g = Anagrams.group(words);
    long ms = (System.nanoTime() - start) / 1_000_000;
    equal(g.size(), 7);
    equal(g.get("0opst").size(), 14_286);
    equal(g.get("0opst").get(1), "pots0");
