`Leaky` stores the caller's array, so `scores[0] = 0` in `main` changes its state, and its
getter returns the same array, so `leaky.scores()[1] = 0` changes it again. `Safe` clones in
the constructor, which cuts the link to `scores`, and clones in the getter, so the write in
`main` lands on a temporary copy. `private final` on the field did nothing for `Leaky`: it
protects the reference, not the elements.
'''

[[unit.step]]
kind = "challenge"
id = "java-u21-x1-cart"
title = "An immutable shopping cart"
points = 30
difficulty = 21
entry = "Cart"
intro = '''
A shopping cart is shared between the web layer, pricing, and the order service, often on
different threads. Making it an immutable value means each of them can hold it without locks and
without worrying that someone else changed it, and every update produces a new cart that can be
compared, cached or undone.
'''
instructions = '''
## Your turn

Write an immutable class `Cart` that maps product codes (SKUs) to quantities:

```java
public final class Cart {
    public Cart(Map<String, Integer> items)
    public static Cart empty()
    public Cart add(String sku, int quantity)
    public Cart remove(String sku)
    public int quantity(String sku)
    public int totalItems()
    public Map<String, Integer> items()
    public boolean equals(Object o)
    public int hashCode()
}
```

Rules:

- **Constructor.** Copies `items`, so later changes to the caller's map do not affect the cart.
  A `null` map, a `null` SKU or a `null` quantity throws `NullPointerException`; a quantity of
  0 or less throws `IllegalArgumentException`.
- **`empty()`** returns a cart with no items.
- **`add(sku, quantity)`** returns a **new** cart where `sku`'s quantity is increased by
  `quantity` (added if absent). The original cart is unchanged. A `null` SKU throws
  `NullPointerException`; `quantity <= 0` throws `IllegalArgumentException`.
- **`remove(sku)`** returns a cart without `sku`. Removing a SKU that is not there returns a cart
  with the same contents.
- **`quantity(sku)`** is the quantity, or `0` if the SKU is not in the cart.
  **`totalItems()`** is the sum of all quantities.
- **`items()`** returns the contents as a **read-only** map that iterates in SKU order (A to Z).
  Any attempt to change it, including through its entries, throws
  `UnsupportedOperationException`.
- **Value semantics.** Two carts are `equal` when they have the same items, whatever order they
  were added in, and equal carts have equal hash codes.

Examples:

- `Cart.empty().add("milk", 2).add("bread", 1).add("milk", 1)` → `{bread=1, milk=3}`
- `cart.remove("milk").quantity("milk")` → `0`, while `cart.quantity("milk")` is still `3`
- `cart.items().put("eggs", 12)` → throws `UnsupportedOperationException`

**Hint:** keep one `private final Map<String, Integer>` holding an unmodifiable sorted copy:
copy into a `TreeMap`, validate as you copy, and wrap it with `Collections.unmodifiableMap`. Every
"change" copies the map, changes the copy, and calls the constructor.

Hidden tests decide correctness.
'''
