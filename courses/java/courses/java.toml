Counting and grouping are the two classic uses of a map. `merge` combines a new value with
the existing one in a single hash lookup, and `computeIfAbsent` creates a group the first
time its key appears. Both replace the "check, get, put" dance that is slower and easier to
get wrong.
'''
prompt = '''
Count how often each word occurs with `merge`, group the distinct words by length with
`computeIfAbsent`, and find the most frequent word.

**Why:** word counts, histograms and "group by" are everyday data processing, and these two
methods are the idiomatic way to write them in Java.
'''
target = '''
import java.util.ArrayList;
import java.util.HashMap;
import java.util.List;
import java.util.Map;
import java.util.TreeMap;
import java.util.TreeSet;

public class Main {
    public static void main(String[] args) {
        String text = "the cat and the dog and the bird";
        Map<String, Integer> counts = new HashMap<>();
        for (String word : text.split(" ")) {
            counts.merge(word, 1, Integer::sum);
        }
        System.out.println(new TreeMap<>(counts));

        Map<Integer, List<String>> byLength = new TreeMap<>();
        for (String word : new TreeSet<>(counts.keySet())) {
            byLength.computeIfAbsent(word.length(), k -> new ArrayList<>()).add(word);
        }
        System.out.println(byLength);

        String best = null;
        for (Map.Entry<String, Integer> e : counts.entrySet()) {
            if (best == null || e.getValue() > counts.get(best)) {
                best = e.getKey();
            }
        }
        System.out.println("most common: " + best + " x" + counts.get(best));
    }
}
'''
