[unit.step.gabarito]
solution = '''
import java.util.Objects;

enum Suit {
    CLUBS('C'), DIAMONDS('D'), HEARTS('H'), SPADES('S');

    private final char symbol;

    Suit(char symbol) {
        this.symbol = symbol;
    }

    char symbol() {
        return symbol;
    }

    static Suit fromSymbol(char c) {
        char upper = Character.toUpperCase(c);
        for (Suit suit : values()) {
            if (suit.symbol == upper) {
                return suit;
            }
        }
        throw new IllegalArgumentException("unknown suit: " + c);
    }
}

enum Rank {
    TWO(2, "2"), THREE(3, "3"), FOUR(4, "4"), FIVE(5, "5"), SIX(6, "6"), SEVEN(7, "7"),
    EIGHT(8, "8"), NINE(9, "9"), TEN(10, "10"), JACK(11, "J"), QUEEN(12, "Q"), KING(13, "K"),
    ACE(14, "A");

    private final int value;
    private final String symbol;

    Rank(int value, String symbol) {
        this.value = value;
        this.symbol = symbol;
    }

    int value() {
        return value;
    }

    String symbol() {
        return symbol;
    }

    static Rank fromSymbol(String s) {
        for (Rank rank : values()) {
            if (rank.symbol.equalsIgnoreCase(s)) {
                return rank;
            }
        }
        throw new IllegalArgumentException("unknown rank: " + s);
    }
}

record Card(Rank rank, Suit suit) {
    Card {
        Objects.requireNonNull(rank, "rank");
        Objects.requireNonNull(suit, "suit");
    }

    static Card parse(String text) {
        if (text == null) {
            throw new IllegalArgumentException("no card text");
        }
        String t = text.strip();
        if (t.length() < 2) {
            throw new IllegalArgumentException("not a card: '" + text + "'");
        }
        int last = t.length() - 1;
        return new Card(Rank.fromSymbol(t.substring(0, last)), Suit.fromSymbol(t.charAt(last)));
    }

    boolean beats(Card other) {
        return rank.value() > other.rank().value();
    }

    @Override
    public String toString() {
        return rank.symbol() + suit.symbol();
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
The sets involved are fixed: 4 suits and 13 ranks. `fromSymbol` scans at most 13 constants,
comparing strings of at most two characters, and `parse` strips a short string, takes one
substring and does two lookups, so each operation is **O(1)** (strictly, O(L) in the length
`L` of the input text for `strip`, which valid cards bound by 3). `beats` compares two
integers, and `toString` concatenates at most three characters. Nothing grows with the
input, so the space is **O(1)** per card.

The design carries the correctness. Because `Rank` and `Suit` are enums, a `Card` can only
ever hold one of the 52 real combinations, and the compact constructor rules out `null`, so
every `Card` that exists is valid. The record supplies `equals` and `hashCode` from its two
components, which is why parsed cards compare equal to constructed ones and why the set of
the whole deck has exactly 52 elements. Overriding `toString` to print the symbols makes
`parse` and `toString` exact inverses. Splitting at the *last* character, instead of the
first, is what lets the two-character rank `10` work.
'''

