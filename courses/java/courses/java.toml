intro = '''
A generic class is written once and checked separately for every type argument. The same
`Stack<T>` holds `String`s in one variable and `Integer`s in another, and the compiler refuses
to mix them up. Internally it delegates to an `ArrayList<T>`, where adding and removing at the
end are amortised O(1).
'''
prompt = '''
Write a `Stack<T>` class with `push`, `pop`, `peek` and `isEmpty`, then use it with words and
with numbers.

**Why:** this is how the standard collections are written. The values that come out are already
typed, so `top.toUpperCase()` and `sum += nums.pop()` need no casts.
'''
target = '''
import java.util.ArrayList;

public class Main {
    public static void main(String[] args) {
        Stack<String> words = new Stack<>();
        words.push("alpha");
        words.push("beta");
        String top = words.pop();
        System.out.println(top.toUpperCase() + " " + words.peek());
        Stack<Integer> nums = new Stack<>();
        for (int i = 1; i <= 3; i++) {
            nums.push(i * 10);
        }
        int sum = 0;
        while (!nums.isEmpty()) {
            sum += nums.pop();
        }
        System.out.println("sum = " + sum);
    }
}

class Stack<T> {
    private final ArrayList<T> items = new ArrayList<>();

    void push(T item) {
        items.add(item);
    }

    T pop() {
        return items.remove(items.size() - 1);
    }

    T peek() {
        return items.get(items.size() - 1);
    }

    boolean isEmpty() {
        return items.isEmpty();
    }
}
'''
