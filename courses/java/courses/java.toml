[[unit.step]]
kind = "drill"
id = "java-u32-d3-height"
title = "Height: balanced versus degenerate"
points = 10
difficulty = 32
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
The height of a BST depends entirely on the order of insertion. Sorted input builds a chain,
height n; inserting the middle key first and recursing on each half builds a perfectly
balanced tree, height about log₂ n. Every operation's cost follows the height.
'''
prompt = '''
Insert the keys 0 to 1022 in sorted order, build a second tree from the same keys by always
taking the middle first, and print both heights.

**Why:** the same 1,023 keys give a tree of height 1,023 or of height 10, and that is the
difference between O(n) and O(log n) per operation.
'''
target = '''
public class Main {
    public static void main(String[] args) {
        int n = 1023;
        int[] keys = new int[n];
        for (int i = 0; i < n; i++) keys[i] = i;

        Node chain = null;
        for (int key : keys) chain = insert(chain, key);
        Node balanced = build(keys, 0, n - 1);

        System.out.println("sorted inserts: height " + height(chain));
        System.out.println("middle first:   height " + height(balanced));
    }

    static Node insert(Node node, int key) {
        if (node == null) return new Node(key);
        if (key < node.key) node.left = insert(node.left, key);
        else if (key > node.key) node.right = insert(node.right, key);
        return node;
    }

    static Node build(int[] keys, int lo, int hi) {
        if (lo > hi) return null;
        int mid = (lo + hi) >>> 1;
        Node node = new Node(keys[mid]);
        node.left = build(keys, lo, mid - 1);
        node.right = build(keys, mid + 1, hi);
        return node;
    }

    static int height(Node node) {
        return node == null ? 0 : 1 + Math.max(height(node.left), height(node.right));
    }
}

class Node {
    int key;
    Node left, right;
    Node(int key) { this.key = key; }
}
'''
