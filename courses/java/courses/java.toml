the caller never asked. A separate `ready` flag, instead of testing `next != null`, keeps the
iterator correct even when `null` is a legitimate element.
'''

[[unit.step]]
kind = "challenge"
id = "java-u23-x1-ring-buffer"
title = "A ring buffer with a fail-fast iterator"
points = 40
difficulty = 23
entry = "RingBuffer"
intro = '''
A ring buffer (circular buffer) keeps the last *N* items in a fixed array: when it is full,
each new item overwrites the oldest one. Logging systems, audio pipelines and network stacks
use it because it never allocates after creation. Iterating it in order means translating
logical positions into array indices with modular arithmetic.
'''
instructions = '''
## Your turn

Implement a generic class `RingBuffer<T>` that implements `Iterable<T>`:

```java
class RingBuffer<T> implements Iterable<T> {
    RingBuffer(int capacity)
    void add(T value)
    int size()
    public Iterator<T> iterator()
}
```

Rules:

- The constructor throws `IllegalArgumentException` when `capacity < 1`.
- `add` appends a value. When the buffer already holds `capacity` values, the new value
  replaces the **oldest** one. `null` is a valid value.
- `size()` is the number of values currently held (never more than the capacity).
- `iterator()` returns a new, independent iterator that walks from the **oldest** value to the
  **newest**:
  - `hasNext()` never changes anything;
  - `next()` throws `NoSuchElementException` when the walk is over;
  - `next()` throws `ConcurrentModificationException` if `add` was called after this iterator
    was created (fail-fast, like `ArrayList`);
  - `remove()` is not supported (the default method already throws).
- `add` and every iterator step must be O(1). Store the values in a fixed array, not in a list
  that you shift.

Examples, with capacity 3:

- after `add(1)`, `add(2)` it iterates as `1, 2`;
- after `add(1)` … `add(5)` it holds `3, 4, 5` and `size()` is 3.

**Hint:** keep the index of the oldest element and the count. Element number `i` of the walk
is at `(start + i) % capacity`. For fail-fast, count modifications and let each iterator
remember the count it saw when it was created. Java cannot create a generic array, so use an
`Object[]` and cast on the way out.

Hidden tests decide correctness.
'''
starter = '''
import java.util.Iterator;

class RingBuffer<T> implements Iterable<T> {
    // A buffer that keeps the last `capacity` values; iteration goes oldest to newest.
    RingBuffer(int capacity) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Append a value, overwriting the oldest one when the buffer is full.
    void add(T value) {
        throw new UnsupportedOperationException("not implemented");
    }

    // How many values the buffer holds right now.
    int size() {
        throw new UnsupportedOperationException("not implemented");
    }

    // A fresh iterator: oldest to newest, fail-fast after add().
    @Override
    public Iterator<T> iterator() {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
tests = '''
import java.util.ArrayList;
import java.util.Arrays;
import java.util.ConcurrentModificationException;
import java.util.Iterator;
import java.util.List;
import java.util.NoSuchElementException;
record Collect() {
    static <T> List<T> all(Iterable<T> source) {
        List<T> out = new ArrayList<>();
        for (T value : source) {
            out.add(value);
            if (out.size() > 10_000_000) throw new IllegalStateException("iterator never ends");
        }
        return out;
    }
}
test("a new buffer is empty", () -> {
    RingBuffer<String> rb = new RingBuffer<>(4);
    equal(rb.size(), 0);
    Iterator<String> it = rb.iterator();
    check(!it.hasNext(), "an empty buffer has nothing to iterate");
    assertThrows(NoSuchElementException.class, it::next);
});
test("below capacity keeps insertion order", () -> {
    RingBuffer<Integer> rb = new RingBuffer<>(5);
    rb.add(1);
    rb.add(2);
    rb.add(3);
    equal(rb.size(), 3);
    equal(Collect.all(rb), List.of(1, 2, 3));
});
test("a full buffer overwrites the oldest", () -> {
    RingBuffer<Integer> rb = new RingBuffer<>(3);
    for (int i = 1; i <= 5; i++) rb.add(i);
    equal(rb.size(), 3);
    equal(Collect.all(rb), List.of(3, 4, 5));
    rb.add(6);
    rb.add(7);
    rb.add(8);
    equal(Collect.all(rb), List.of(6, 7, 8));
});
test("capacity one keeps only the newest", () -> {
    RingBuffer<String> rb = new RingBuffer<>(1);
    rb.add("a");
    rb.add("b");
    equal(rb.size(), 1);
    equal(Collect.all(rb), List.of("b"));
});
test("invalid capacity throws IllegalArgumentException", () -> {
    assertThrows(IllegalArgumentException.class, () -> new RingBuffer<Integer>(0));
    assertThrows(IllegalArgumentException.class, () -> new RingBuffer<Integer>(-3));
});
test("hasNext is idempotent and next ends with NoSuchElementException", () -> {
    RingBuffer<Integer> rb = new RingBuffer<>(2);
    rb.add(10);
    rb.add(20);
    rb.add(30);
    Iterator<Integer> it = rb.iterator();
    check(it.hasNext());
    check(it.hasNext());
    equal(it.next(), 20);
    equal(it.next(), 30);
    check(!it.hasNext());
    check(!it.hasNext());
    assertThrows(NoSuchElementException.class, it::next);
});
test("iterators are independent", () -> {
    RingBuffer<Integer> rb = new RingBuffer<>(3);
    for (int i = 0; i < 4; i++) rb.add(i);
    Iterator<Integer> a = rb.iterator();
    Iterator<Integer> b = rb.iterator();
    equal(a.next(), 1);
    equal(a.next(), 2);
    equal(b.next(), 1);
    equal(a.next(), 3);
    equal(b.next(), 2);
});
test("add during iteration fails fast", () -> {
    RingBuffer<Integer> rb = new RingBuffer<>(3);
    rb.add(1);
    rb.add(2);
    Iterator<Integer> it = rb.iterator();
    equal(it.next(), 1);
    rb.add(3);
    assertThrows(ConcurrentModificationException.class, it::next);
    equal(Collect.all(rb), List.of(1, 2, 3));
});
test("null is a valid value and remove is unsupported", () -> {
    RingBuffer<String> rb = new RingBuffer<>(3);
    rb.add(null);
    rb.add("x");
    equal(Collect.all(rb), Arrays.asList(null, "x"));
    Iterator<String> it = rb.iterator();
    it.next();
    assertThrows(UnsupportedOperationException.class, it::remove);
});
test("large input wraps many times", () -> {
    RingBuffer<Integer> rb = new RingBuffer<>(1000);
    for (int i = 0; i < 1_000_000; i++) rb.add(i);
    equal(rb.size(), 1000);
    List<Integer> expected = new ArrayList<>();
    for (int i = 999_000; i < 1_000_000; i++) expected.add(i);
    List<Integer> got = Collect.all(rb);
    equal(got.size(), 1000);
    if (got.isEmpty()) return;
    equal(got.get(0), 999_000);
    equal(got.get(got.size() - 1), 999_999);
    check(got.equals(expected), "the buffer must hold 999000..999999 from oldest to newest");
});
'''

[unit.step.gabarito]
solution = '''
import java.util.ConcurrentModificationException;
import java.util.Iterator;
import java.util.NoSuchElementException;

class RingBuffer<T> implements Iterable<T> {
    private final Object[] items;
    private int start;     // index of the oldest value
    private int size;      // how many slots are in use
    private int modCount;  // bumped on every add, for fail-fast iterators

    RingBuffer(int capacity) {
        if (capacity < 1) throw new IllegalArgumentException("capacity must be at least 1: " + capacity);
        items = new Object[capacity];
    }

    void add(T value) {
        if (size < items.length) {
            items[(start + size) % items.length] = value;
            size++;
        } else {
            items[start] = value;
            start = (start + 1) % items.length;
        }
        modCount++;
    }

    int size() {
        return size;
    }

    @Override
    public Iterator<T> iterator() {
        return new Iterator<>() {
            private final int expectedModCount = modCount;
            private int index;

            @Override
            public boolean hasNext() {
                return index < size;
            }

            @Override
            @SuppressWarnings("unchecked")
            public T next() {
                if (modCount != expectedModCount) throw new ConcurrentModificationException();
                if (!hasNext()) throw new NoSuchElementException();
                return (T) items[(start + index++) % items.length];
            }
        };
    }
}
'''
time = "O(1) per add and per step"
space = "O(capacity)"
justification = '''
`add` does a constant amount of work in both branches: one array write, an index computed
with `%`, and two counter updates. Nothing is shifted, because overwriting the oldest value
only moves the `start` index forward by one, so `add` is **O(1)**. Each iterator step is also
**O(1)**: a comparison of two counters, a bounds check and one array read at
`(start + index) % capacity`. Walking the whole buffer therefore costs O(size).

The buffer allocates its `Object[]` once, so the space is **O(capacity)**, independent of how
many values were ever added: the large test adds a million values into 1,000 slots. Each
iterator adds O(1) space (two ints and a reference to the buffer). A version backed by an
`ArrayList` with `remove(0)` would be O(capacity) per add, because every element shifts left.

Fail-fast works by comparison, not by locking: the iterator copies `modCount` when it is
created and `next()` checks that it has not changed. This is the same mechanism `ArrayList`
uses; it detects bugs in single-threaded code and is not a substitute for synchronization.
'''

[[unit]]
id = "java-u24-threads-executors"
title = "Threads, executors and futures"
level = "advanced"
difficulty = 24
intro = '''
A thread is an independent path of execution inside your program, and Java has had them since
version 1.0. This unit starts with raw `Thread` objects and `join`, then moves to the way
real code runs concurrent work: tasks submitted to an `ExecutorService`, with results and
failures delivered through `Future`s. The challenge is a parallel `map` that keeps the input
order.
'''
concepts = '''
## The idea

A **thread** is a sequence of instructions with its own call stack, running alongside other
threads in the same process and sharing the same heap. With several CPU cores, threads run in
**parallel**; even on one core they let a program make progress on one job while another waits
for a disk, a network or a lock. That second benefit, overlapping waiting, is often the bigger
one in server code.

Creating an operating-system thread is expensive (it reserves a stack and a kernel
structure), and starting one per tiny job wastes most of the time on setup. So production code
separates the **task** (what to do) from the **thread** (who does it): a **thread pool** keeps a
few threads alive and feeds them tasks from a queue.

## How Java does it

A `Runnable` is a task with no result; `start()` runs it on a new thread, and `join()` waits
for that thread to finish:

```java
Thread t = new Thread(() -> System.out.println("hi from " + Thread.currentThread().getName()));
t.start();
t.join();
```

An `ExecutorService` is a pool. You `submit` a `Runnable`, or a `Callable<V>`, which returns a
value and may throw, and you get back a `Future<V>`, a handle on a result that may not exist
yet. `future.get()` blocks until the task is done and returns its value. Since Java 19 an
executor is `AutoCloseable`, and closing it waits for submitted tasks and shuts the threads
down:

```java
try (ExecutorService pool = Executors.newFixedThreadPool(4)) {
    Future<Integer> f = pool.submit(() -> 6 * 7);
    System.out.println(f.get());
}
```

`invokeAll` submits a whole list of callables and returns their futures in the same order.

## Pitfalls

- **`run()` is not `start()`.** Calling `t.run()` executes the task on the *current* thread;
  nothing runs concurrently.
- **Reading results too early.** Until you `join` the thread or `get` the future, there is no
  guarantee the work is done, or that its writes are visible to you.
- **Checked exceptions.** `get()` throws `InterruptedException` and `ExecutionException`;
  forget them and `javac` says `unreported exception ... must be caught or declared to be
  thrown`. A task's own exception arrives wrapped: call `getCause()`.
- **Forgotten pools.** Pool threads are not daemons. Never shutting a pool down keeps the
  JVM alive after `main` ends. Use try-with-resources or `shutdown()`.
- **Output order.** Threads interleave unpredictably. Collect results and print them in a
  fixed order afterwards.

## What you will practise

You will split a sum across threads and join them, run `Callable`s on a fixed pool, and handle
a failing task through `invokeAll` and `ExecutionException`. The challenge is a parallel `map`
that preserves order, honours a thread limit, unwraps errors and always shuts its pool down.
'''

[[unit.step]]
kind = "concept"
id = "java-u24-c1-tasks-and-pools"
title = "Tasks, threads and pools"
points = 5
difficulty = 24
intro = '''
Concurrency libraries everywhere converge on the same design: describe work as small tasks,
hand them to a scheduler that owns the threads, and receive results through a placeholder
such as a future or a promise. Java's executors were one of the first mainstream versions.
'''
body = '''
## Three kinds of objects

- A **task** describes work. `Runnable` has `void run()`; `Callable<V>` has `V call() throws
  Exception`, so it can return a value and throw checked exceptions.
- A **thread** executes tasks. `new Thread(task).start()` makes one thread for one task.
- An **executor** owns a set of threads and a queue. `Executors.newFixedThreadPool(n)` keeps
  exactly `n` threads; extra tasks wait in the queue until a thread is free.

## Futures

`submit` returns immediately with a `Future<V>`. The task may be queued, running or done:

```java
Future<String> f = pool.submit(() -> download(url));
// ... do other work here ...
String page = f.get();     // blocks until the task has finished
```

If the task threw, `get()` throws `ExecutionException` whose `getCause()` is the original
exception. `isDone()` asks without blocking, and `cancel(true)` tries to interrupt the task.

## Visibility, not just timing

Waiting matters for correctness, not only for the order of output. Without synchronization,
one thread is not guaranteed to *see* values another thread wrote. Java defines a
**happens-before** relation: everything a thread did before it ended happens-before another
thread's `join()` on it returns, and everything a task did happens-before `future.get()`
returns its result. That is why reading results after `join` or `get` is safe, while peeking
at them from another thread earlier is a data race.

## Shutting down

`shutdown()` stops accepting new tasks and lets queued ones finish; `close()` (Java 19+)
does that and then waits. Using the executor in try-with-resources does both for you.
'''

[[unit.step]]
