test("palindromes", () -> {
    check(Text.isPalindrome("level"), "level");
    check(Text.isPalindrome("Racecar"), "Racecar ignores case");
    check(Text.isPalindrome("Never odd or even"), "ignores spaces and case");
    check(Text.isPalindrome("abba"), "even length");
});
test("not palindromes", () -> {
    check(!Text.isPalindrome("Java"), "Java");
    check(!Text.isPalindrome("ab"), "ab");
    check(!Text.isPalindrome("abca"), "abca");
});
test("palindrome edge cases", () -> {
    check(Text.isPalindrome(""), "empty string");
    check(Text.isPalindrome("x"), "single character");
    check(Text.isPalindrome("   "), "only spaces");
});
test("mask a card number", () -> equal(Text.mask("1234567812345678"), "************5678"));
test("mask five characters", () -> equal(Text.mask("12345"), "*2345"));
test("mask leaves short strings alone", () -> {
    equal(Text.mask("1234"), "1234");
    equal(Text.mask("123"), "123");
    equal(Text.mask(""), "");
});
test("mask keeps any characters", () -> equal(Text.mask("ab-cd-ef"), "****d-ef"));
test("inputs are not changed", () -> {
    String word = "jAVA";
    Text.capitalize(word);
    equal(word, "jAVA");
});
'''

[unit.step.gabarito]
solution = '''
// Text: three small string utilities. Strings are immutable: return new values.
public class Text {

    // First character upper case, the rest lower case; "" stays "".
    static String capitalize(String word) {
        if (word.isEmpty()) {
            return word;
        }
        return word.substring(0, 1).toUpperCase() + word.substring(1).toLowerCase();
    }

    // True when the text reads the same backwards, ignoring case and spaces.
    static boolean isPalindrome(String text) {
        String clean = text.replace(" ", "").toLowerCase();
        String reversed = new StringBuilder(clean).reverse().toString();
        return clean.equals(reversed);
    }

    // Replace all but the last four characters with '*'.
    static String mask(String digits) {
        if (digits.length() <= 4) {
            return digits;
        }
        int hidden = digits.length() - 4;
        return "*".repeat(hidden) + digits.substring(hidden);
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Every method is a short chain of string operations, and each operation walks over the
characters once: `substring`, `toUpperCase`, `toLowerCase`, `replace`, `reverse`, `repeat`,
`equals` and the final concatenation all take time proportional to the length `n` of the
string they process. A constant number of linear passes is still linear, so each method runs
in **O(n)** time.

Because strings are immutable, those steps cannot work in place: `isPalindrome` builds a
cleaned copy and a reversed copy, and `capitalize` and `mask` build their result from new
pieces. Each copy has at most `n` characters and only a fixed number of them exist at once,
so the extra space is **O(n)**. A version that compares characters from both ends with two
indexes would need only O(1) extra space for `isPalindrome`; you will write loops like that
in unit 5.
'''

[[unit]]
id = "java-u04-control-flow"
title = "Decisions: if, switch and the ternary operator"
level = "basic"
difficulty = 4
intro = '''
So far every program ran each line exactly once, top to bottom. Real programs choose: they
take one path when a condition holds and another when it does not. This unit covers
`boolean` conditions, `if`/`else` chains, modern `switch` expressions with arrows, and the
ternary operator for picking between two values.
'''
concepts = '''
## The idea

**Control flow** is the order in which statements run. A **condition** is an expression
whose value is `true` or `false`, and a **branch** runs some code only when the condition
holds. With branches, the same program can react differently to different data: a grade
from a score, a price from a day of the week, an error message from an invalid input.

## How Java does it

Conditions are built from **comparison operators** (`==`, `!=`, `<`, `<=`, `>`, `>=`) and
combined with **logical operators**: `&&` (and), `||` (or) and `!` (not). `&&` and `||`
**short-circuit**: if the left side already decides the answer, the right side is never
evaluated. That makes `s != null && s.isEmpty()` safe.

An `if` statement runs its block when the condition is `true`; `else if` tries the next
condition, and `else` catches everything left. Only the first matching branch runs.

```java
if (speed > 120) {
    System.out.println("too fast");
} else if (speed > 50) {
    System.out.println("cruising");
} else {
    System.out.println("slow");
}
```

When you pick a value from many fixed cases, a **switch expression** is clearer. Each `case`
uses an arrow, several labels can share one arm, and the whole `switch` produces a value:

```java
int price = switch (size) {
    case "S" -> 3;
    case "M", "L" -> 4;
    default -> 0;
};
```

An arm that needs several statements uses a block and hands its value back with `yield`.
For choosing between just two values, the **ternary operator** `condition ? a : b` is an
expression too: `String label = n == 1 ? "item" : "items";`.

## What is special or tricky

- **`=` is not `==`.** `if (x = 5)` fails with `incompatible types: int cannot be converted
  to boolean`, because `=` assigns.
- **A switch expression must cover every value.** Without `default`, a switch on an `int`
  or `String` fails with `the switch expression does not cover all possible input values`.
- **Every path must return.** A method whose `if` returns but whose other path falls off
  the end fails with `missing return statement`.
- **Use braces.** Without them, only the next single statement belongs to the `if`; a
  second indented line runs every time, whatever the indentation suggests.
- **Old-style `switch` falls through.** In the classic `case 1:` form, execution continues
  into the next case unless you write `break`. The arrow form never falls through, which is
  why this course uses it.
- **Compare strings with `equals`**, never `==` (unit 3). `switch` on a `String` already
  uses `equals` for you.

## What you will practise

You will write an `if`/`else if` chain with logical operators, two switch expressions
(one with `yield`), and several ternaries. The challenge turns calendar and grading rules
into methods that also reject invalid input.
'''

[[unit.step]]
kind = "concept"
id = "java-u04-c1-branches"
title = "Conditions and branches"
points = 5
difficulty = 4
intro = '''
A condition is just a `boolean` expression, and a branch is code that runs only when that
expression is `true`. Ordering matters: in an `if`/`else if` chain the first true condition
wins and the rest are never even evaluated.
'''
body = '''
## Booleans drive every decision

```java
int age = 17;
boolean adult = age >= 18;          // false
boolean teen = age >= 13 && age <= 19; // true
```

A comparison produces a `boolean`, and logical operators combine booleans. You can store a
condition in a well-named variable, which often makes the code read like a sentence:
`if (teen && !adult)`.

## Chains are checked in order

```java
if (score >= 90) {
    grade = "A";
} else if (score >= 80) {
    grade = "B";
} else {
    grade = "C or below";
}
```

For a score of 95, the first condition is true, so `grade` becomes `"A"` and the other
branches are skipped. The second test does not need `score < 90`: it only runs when the
first one failed. Ordering the conditions from most to least specific keeps each one simple.

## Statements versus expressions

An `if` is a **statement**: it does something. A `switch` with arrows and the ternary
operator `? :` can be **expressions**: they produce a value you can assign directly.

```java
String kind = switch (day) {
    case 6, 7 -> "weekend";
    default -> "weekday";
};
String sign = n < 0 ? "negative" : "non-negative";
```

Prefer the expression forms when every branch just computes a value, because the compiler
then guarantees the variable is assigned exactly once on every path. Use `if` when the
branches do different work, such as printing or returning early.
'''

