[[unit.step]]
kind = "drill"
id = "java-u10-d3-interfaces"
title = "Interfaces and default methods"
points = 10
difficulty = 10
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
An interface describes a capability rather than a family, so unrelated classes can share
it, and one class can have many of them. Default methods build convenience behaviour on top
of the abstract ones, and static interface methods hold helpers that belong to the contract.
'''
prompt = '''
Declare the interfaces `Named` and `Priced` with default methods, implement both in `Book`
and only `Priced` in `Gift`, then use a static interface method and an `instanceof` pattern.

**Why:** programming to interfaces is how Java code stays decoupled; the whole collections
library (`List`, `Map`, `Comparable`) is built this way.
'''
target = '''
public class Main {
    public static void main(String[] args) {
        Book book = new Book("Dune", 1299);
        System.out.println(book.label() + " costs " + book.priceLabel());
        Priced gift = new Gift();
        System.out.println(gift.isFree() + " " + Priced.cheapest(book, gift).priceLabel());
        Priced item = book;
        if (item instanceof Named n) {
            System.out.println("also named " + n.name());
        }
    }
}

interface Named {
    String name();
    default String label() { return "<" + name() + ">"; }
}

interface Priced {
    long priceCents();
    default boolean isFree() { return priceCents() == 0; }
    default String priceLabel() {
        return String.format("$%d.%02d", priceCents() / 100, priceCents() % 100);
    }
    static Priced cheapest(Priced a, Priced b) { return a.priceCents() <= b.priceCents() ? a : b; }
}

class Book implements Named, Priced {
    private final String title;
    private final long cents;
    Book(String title, long cents) { this.title = title; this.cents = cents; }
    @Override public String name() { return title; }
    @Override public long priceCents() { return cents; }
}

class Gift implements Priced {
    @Override public long priceCents() { return 0; }
}
'''
