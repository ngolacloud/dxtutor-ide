target = '''
import java.util.List;
import java.util.Map;
import java.util.TreeMap;
import java.util.concurrent.ConcurrentHashMap;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;
import java.util.concurrent.atomic.AtomicInteger;

public class Main {
    public static void main(String[] args) {
        List<String> lines = List.of("to be or not to be", "be quick", "not now", "to do or not");
        Map<String, Integer> counts = new ConcurrentHashMap<>();
        AtomicInteger totalWords = new AtomicInteger();
        try (ExecutorService pool = Executors.newFixedThreadPool(3)) {
            for (String line : lines) {
                pool.submit(() -> {
                    for (String word : line.split(" ")) {
                        counts.merge(word, 1, Integer::sum);
                        totalWords.incrementAndGet();
                    }
                });
            }
        }
        System.out.println("words: " + totalWords.get());
        System.out.println(new TreeMap<>(counts));
    }
}
