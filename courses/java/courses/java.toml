[[unit.step]]
kind = "drill"
id = "java-u28-d2-top-k"
title = "Top k with a bounded heap"
points = 10
difficulty = 28
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
To keep the k largest of n values you don't need to sort all n. A **min-heap of size k**
holds the best k seen so far, with the weakest of them at the root, ready to be evicted. Each
value costs O(log k), so the whole pass is O(n log k).
'''
prompt = '''
Keep the top 3 scores with a size-bounded `PriorityQueue`, then drain a max-heap to see that
`poll` produces sorted output.

**Why:** top-k with a bounded heap is the standard answer for "best k of a huge stream",
where sorting everything would be wasteful or impossible.
'''
target = '''
import java.util.ArrayList;
import java.util.Collections;
import java.util.List;
import java.util.PriorityQueue;

public class Main {
    static List<Integer> topK(int[] values, int k) {
        PriorityQueue<Integer> heap = new PriorityQueue<>();
        for (int v : values) {
            heap.offer(v);
            if (heap.size() > k) {
                heap.poll();
            }
        }
        List<Integer> result = new ArrayList<>(heap);
        result.sort(Collections.reverseOrder());
        return result;
    }

    public static void main(String[] args) {
        int[] scores = {42, 7, 99, 15, 63, 99, 8, 71};
        System.out.println("top 3: " + topK(scores, 3));

        PriorityQueue<Integer> max = new PriorityQueue<>(Collections.reverseOrder());
        for (int s : scores) max.offer(s);
        StringBuilder drained = new StringBuilder("drain:");
        while (!max.isEmpty()) {
            drained.append(' ').append(max.poll());
        }
        System.out.println(drained);
    }
}
'''
