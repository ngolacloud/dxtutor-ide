intro = '''
Insertion sort keeps a sorted prefix and slides each new element left until it fits. It is
O(n²) in the worst case but O(n) on nearly sorted data, and it is stable. Counting its shifts
counts the array's inversions, which the challenge will compute much faster.
'''
prompt = '''
Sort an array of six integers with insertion sort, in place, and print it with the number of
shifts made.

**Why:** insertion sort is the simplest correct sort, the base case inside TimSort for short
runs, and its shift count is exactly the number of out-of-order pairs.
'''
target = '''
import java.util.Arrays;

public class Main {
    public static void main(String[] args) {
        int[] a = {5, 2, 9, 1, 5, 6};
        long shifts = insertionSort(a);
        System.out.println(Arrays.toString(a) + " shifts=" + shifts);
    }

    static long insertionSort(int[] a) {
        long shifts = 0;
        for (int i = 1; i < a.length; i++) {
            int key = a[i];
            int j = i - 1;
            while (j >= 0 && a[j] > key) {
                a[j + 1] = a[j];
                j--;
                shifts++;
            }
            a[j + 1] = key;
        }
        return shifts;
    }
}
'''
