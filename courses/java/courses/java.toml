target = '''
import java.util.concurrent.CompletableFuture;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class Main {
    static CompletableFuture<Integer> price(String item, ExecutorService pool) {
        return CompletableFuture.supplyAsync(() -> item.length() * 10, pool);
    }

    static CompletableFuture<Integer> withTax(int amount, ExecutorService pool) {
        return CompletableFuture.supplyAsync(() -> amount + amount / 5, pool);
    }

    public static void main(String[] args) {
        try (ExecutorService pool = Executors.newFixedThreadPool(4)) {
            CompletableFuture<Integer> book = price("book", pool);
            CompletableFuture<Integer> lamp = price("desk lamp", pool);
            CompletableFuture<Integer> total = book.thenCombine(lamp, Integer::sum);
            CompletableFuture<Integer> billed = total.thenCompose(t -> withTax(t, pool));
            System.out.println("subtotal " + total.join());
            System.out.println("with tax " + billed.join());
        }
    }
}
'''
