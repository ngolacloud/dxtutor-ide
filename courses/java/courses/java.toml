    equal(Billing.nextBillingDate(start, LocalDate.of(2024, 4, 1)), LocalDate.of(2024, 4, 30));
    equal(Billing.nextBillingDate(start, LocalDate.of(2024, 5, 1)), LocalDate.of(2024, 5, 31));
