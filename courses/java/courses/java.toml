intro = '''
A lower-bound binary search returns the first index whose value is not smaller than the target,
which answers "is it here?", "where would it go?" and "how many are smaller?" at once. Keeping
the half-open invariant `[lo, hi)` and an overflow-safe midpoint makes it correct by
construction.
'''
prompt = '''
Write `lowerBound` for a sorted array with duplicates, and print it next to
`Arrays.binarySearch` for a present key, a missing key and both ends.

**Why:** a lower bound is the binary search you can trust with duplicates, and comparing it with
the JDK's encoding of a missing key shows two ways to report "not found".
'''
target = '''
import java.util.Arrays;

public class Main {
    public static void main(String[] args) {
        int[] a = {2, 4, 4, 4, 7, 9};
        for (int target : new int[] {4, 5, 1, 10}) {
            int lb = lowerBound(a, target);
            boolean found = lb < a.length && a[lb] == target;
            System.out.println(target + ": lowerBound=" + lb + " found=" + found
                    + " binarySearch=" + Arrays.binarySearch(a, target));
        }
    }

    static int lowerBound(int[] a, int target) {
        int lo = 0, hi = a.length;
        while (lo < hi) {
            int mid = (lo + hi) >>> 1;
            if (a[mid] < target) {
                lo = mid + 1;
            } else {
                hi = mid;
            }
        }
        return lo;
    }
}
'''
