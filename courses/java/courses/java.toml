test("a failing task's exception reaches the caller unwrapped", () -> {
    assertThrows(ArithmeticException.class, () -> Parallel.map(List.of(5, 0, 2), x -> 10 / x, 2));
    assertThrows(IllegalStateException.class, () -> Parallel.map(List.of("a", "b"), s -> {
        if (s.equals("b")) throw new IllegalStateException("bad item " + s);
        return s;
