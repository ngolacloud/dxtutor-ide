[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.LinkedHashMap;
import java.util.List;
import java.util.Map;

public class Csv {
    static List<String> parseLine(String line) {
        List<String> fields = new ArrayList<>();
        StringBuilder field = new StringBuilder();
        boolean inQuotes = false;
        for (int i = 0; i < line.length(); i++) {
            char c = line.charAt(i);
            if (inQuotes) {
                if (c != '"') {
                    field.append(c);
                } else if (i + 1 < line.length() && line.charAt(i + 1) == '"') {
                    field.append('"');
                    i++;
                } else {
                    inQuotes = false;
                }
            } else if (c == '"') {
                inQuotes = true;
            } else if (c == ',') {
                fields.add(field.toString());
                field.setLength(0);
            } else {
                field.append(c);
            }
        }
        if (inQuotes) {
            throw new IllegalArgumentException("unterminated quoted field: " + line);
        }
        fields.add(field.toString());
        return fields;
    }

    static List<Map<String, String>> parse(String text) {
        List<Map<String, String>> records = new ArrayList<>();
        List<String> header = null;
        String[] lines = text.split("\\R");
        for (int n = 0; n < lines.length; n++) {
            if (lines[n].isBlank()) {
                continue;
            }
            List<String> fields = parseLine(lines[n]);
            if (header == null) {
                header = fields;
                continue;
            }
            if (fields.size() != header.size()) {
                throw new IllegalArgumentException("line " + (n + 1) + ": expected "
                        + header.size() + " fields, found " + fields.size());
            }
            Map<String, String> record = new LinkedHashMap<>();
            for (int i = 0; i < header.size(); i++) {
                record.put(header.get(i), fields.get(i));
            }
            records.add(record);
        }
        return records;
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Let `n` be the number of characters in the input.

`parseLine` is a single left-to-right pass. Every character is looked at once (a doubled quote
consumes two characters in one step and skips the second), and each one does O(1) work:
compare, append to the `StringBuilder`, or close a field. `setLength(0)` reuses the builder's
buffer instead of allocating a new one per field. So the time is **O(n)**, and the space is
**O(n)** for the fields it returns.

`parse` splits the text into lines with one regex pass (`\R` matches `\n`, `\r\n` and the other
line breaks), then calls `parseLine` on each line and copies its fields into a map, so the total
work is proportional to the total length: **O(n)** time and **O(n)** space for the records.

The `inQuotes` flag is what a regex or `split(",")` cannot express: whether a comma ends a field
depends on everything read before it. A state machine keeps that history in one boolean, which
also makes the error case precise: if the line ends while the flag is still set, a quote was
never closed. Building each field with `+=` on a `String` instead would copy the field on every
character, which is O(k²) for a field of `k` characters.
'''

[[unit]]
id = "java-u20-equality-ordering"
title = "Equality, hashing and ordering"
level = "intermediate"
difficulty = 20
intro = '''
`HashMap`, `HashSet`, `TreeSet` and `List.sort` all depend on two questions your classes must
answer correctly: "are these two objects the same value?" and "which one comes first?". This
unit covers the `equals`/`hashCode` contract, natural ordering with `Comparable`, and composable
orderings with `Comparator` chains.
'''
concepts = '''
## The idea

There are two kinds of sameness. **Identity** asks whether two references point to the very
same object; **equality** asks whether two objects represent the same value. Two `Point(1, 2)`
objects created separately are different objects but the same point. Collections that find
elements by value, such as `HashMap`, `HashSet` and `List.contains`, need equality, and hash-based
ones also need a **hash code**: a number computed from the value that picks the bucket where the
object lives.

Sorted structures need a third answer: an **ordering**, a rule that says whether `a` comes
before, after, or at the same place as `b`.

## How Java does it

`==` compares identity (for objects). `equals` compares values, but the version inherited from
`Object` is identity too, so a class that represents a value must override **both** `equals` and
`hashCode`:

```java
@Override public boolean equals(Object o) {
    return o instanceof Point p && x == p.x && y == p.y;
}
@Override public int hashCode() { return Objects.hash(x, y); }
```

The contract: `equals` is reflexive, symmetric, transitive, consistent, and `x.equals(null)` is
`false`. And **equal objects must have equal hash codes**; otherwise a `HashSet` looks in the
wrong bucket and "loses" an element it holds. Records generate both methods from their
components.

A class with a natural order implements `Comparable<T>`; `compareTo` returns a negative number,
zero or a positive number. Other orders are `Comparator` objects built from key extractors:

```java
Comparator<Person> order = Comparator.comparing(Person::city)
        .thenComparing(Person::age, Comparator.reverseOrder());
```

## Pitfalls

- **`equals(Point other)`** is an *overload*, not an override: collections call
  `equals(Object)` and never see it. `@Override` makes the compiler catch this: `method does not
  override or implement a method from a supertype`.
- **Overriding `equals` without `hashCode`** compiles fine and silently breaks hash collections.
- **Mutable keys.** Changing a field used by `hashCode` after inserting the object into a
  `HashSet` strands it in the wrong bucket. Value objects should be immutable.
- **`return a - b;` in a comparison** overflows for large or negative values. Use
  `Integer.compare(a, b)`.
- **Inconsistent orders.** A `TreeSet` treats `compareTo == 0` as "duplicate", so an ordering
  that ignores a field `equals` uses will drop elements.
- **No order at all.** Putting a class without `Comparable` into a `TreeSet` throws
  `ClassCastException: class X cannot be cast to class java.lang.Comparable`.

## What you will practise

You will watch a `HashSet` keep duplicates until `equals` and `hashCode` are defined, give a
version number a natural order, and sort with a multi-key `Comparator`. The challenge is an
`EmailAddress` value class whose equality ignores case, so it must keep the hash code consistent
with that rule.
'''

[[unit.step]]
kind = "concept"
id = "java-u20-c1-contract"
title = "The equals and hashCode contract"
points = 5
difficulty = 20
intro = '''
A hash table finds an element in O(1) by computing its hash code, going to that bucket, and only
then calling `equals` on the few objects there. That two-step search only works if equal
objects always produce the same hash code.
'''
body = '''
## How a HashSet looks things up

`set.contains(x)` does not scan the whole set. It computes `x.hashCode()`, maps the number to a
bucket, and calls `equals` only on the objects in that bucket. So two methods cooperate:

- `hashCode` chooses **where to look**;
- `equals` decides **whether it is there**.

If two equal objects returned different hash codes, `contains` would look in the wrong bucket
and answer `false`, and `add` would happily store a duplicate.

## The rules

1. Reflexive: `x.equals(x)` is true.
2. Symmetric: `x.equals(y)` exactly when `y.equals(x)`.
3. Transitive: if `x` equals `y` and `y` equals `z`, then `x` equals `z`.
4. Consistent: the answer does not change unless the objects do.
5. `x.equals(null)` is false, and never throws.
6. Equal objects have equal hash codes. Unequal objects *may* share one; that only costs speed.

## The recipe

Use exactly the same fields in both methods, and normalise them the same way. If equality
ignores case, the hash code must be computed from the lower-cased text too. `instanceof` with a
pattern (`o instanceof Money m`) handles `null` and wrong types in one test, and
`Objects.hash(a, b, c)` combines several fields. A `final` class avoids subclasses that would
break symmetry. Better still, when the class is a plain carrier of data, declare a `record` and
let the compiler write both methods.
'''

