import java.util.ArrayList;
import java.util.Comparator;
import java.util.List;
import java.util.NoSuchElementException;

// A generic pair of two values, possibly of different types.
record Pair<A, B>(A first, B second) {
    // TODO: return a new pair with first and second exchanged.
    Pair<B, A> swap() {
        throw new UnsupportedOperationException("not implemented");
    }
}

// Generic algorithms. Keep the signatures exactly as they are.
class Algos {
    // Pairs elements at the same index; stops at the shorter list.
    static <A, B> List<Pair<A, B>> zip(List<A> left, List<B> right) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The largest element by natural order; NoSuchElementException when empty.
    static <T extends Comparable<? super T>> T maxOf(List<? extends T> items) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The first largest element by `order`; NoSuchElementException when empty.
    static <T> T maxBy(List<? extends T> items, Comparator<? super T> order) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Appends all of `source`, in order, to the end of `target`.
    static <T> void copyInto(List<? super T> target, List<? extends T> source) {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
