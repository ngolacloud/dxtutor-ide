prompt = '''
Write a small CSV with a `BufferedWriter`, sum its `amount` column by streaming it with
`Files.lines`, and read just the header with a `BufferedReader`.

**Why:** streaming is how you process a 10 GB log file with a few kilobytes of memory, and
closing what you open is what keeps a long-running server from running out of file handles.
'''
target = '''
import java.io.BufferedWriter;
import java.io.IOException;
import java.nio.file.Files;
import java.nio.file.Path;
import java.util.stream.Stream;

public class Main {
    public static void main(String[] args) throws IOException {
        Path dir = Files.createTempDirectory("dxt-sales");
        Path file = dir.resolve("sales.csv");
        try {
            try (BufferedWriter out = Files.newBufferedWriter(file)) {
                out.write("item,amount");
                out.newLine();
                for (int i = 1; i <= 5; i++) {
                    out.write("item" + i + "," + i * 10);
                    out.newLine();
                }
            }
            int total;
            try (Stream<String> lines = Files.lines(file)) {
                total = lines.skip(1)
                        .mapToInt(line -> Integer.parseInt(line.split(",")[1]))
                        .sum();
            }
            System.out.println("total = " + total);
            try (var reader = Files.newBufferedReader(file)) {
                System.out.println("header = " + reader.readLine());
            }
        } finally {
            Files.deleteIfExists(file);
            Files.delete(dir);
        }
    }
}
'''
