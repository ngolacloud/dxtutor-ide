test("many updates", () -> {
    var cart = Cart.empty();
    for (int i = 0; i < 5_000; i++) cart = cart.add("sku" + (i % 50), 1 + i % 3);
    equal(cart.items().size(), 50);
    int expected = 0;
    for (int i = 0; i < 5_000; i++) expected += 1 + i % 3;
    equal(cart.totalItems(), expected);
    for (int i = 0; i < 50; i += 2) cart = cart.remove("sku" + i);
    equal(cart.items().size(), 25);
