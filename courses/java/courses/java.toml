key already in the tree is not added again.
'''
target = '''
import java.util.ArrayList;
import java.util.List;

public class Main {
    public static void main(String[] args) {
        Node<Integer> root = null;
        for (int key : new int[] {50, 30, 70, 20, 40, 60, 80, 30}) {
            root = insert(root, key);
        }
        List<Integer> out = new ArrayList<>();
        inOrder(root, out);
        System.out.println(out + " root=" + root.key);
    }

    static <T extends Comparable<T>> Node<T> insert(Node<T> node, T key) {
        if (node == null) return new Node<>(key);
        int c = key.compareTo(node.key);
        if (c < 0) node.left = insert(node.left, key);
        else if (c > 0) node.right = insert(node.right, key);
        return node;
    }

    static <T> void inOrder(Node<T> node, List<T> out) {
        if (node == null) return;
        inOrder(node.left, out);
        out.add(node.key);
        inOrder(node.right, out);
    }
}

class Node<T> {
    final T key;
    Node<T> left, right;

    Node(T key) { this.key = key; }
}
'''
