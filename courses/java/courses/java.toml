[[unit.step]]
kind = "challenge"
id = "java-u20-x1-email-address"
title = "A case-insensitive email value"
points = 30
difficulty = 20
entry = "EmailAddress"
intro = '''
Email addresses are compared case-insensitively in practice: `Ana@Example.com` and
`ana@example.com` reach the same inbox. A value class that encodes that rule must make
`equals`, `hashCode` and `compareTo` agree with each other, or hash sets and tree sets will
disagree about which addresses are duplicates.
'''
instructions = '''
## Your turn

Write an immutable value class `EmailAddress`:

```java
public final class EmailAddress implements Comparable<EmailAddress> {
    public EmailAddress(String text)
    public boolean equals(Object o)
    public int hashCode()
    public int compareTo(EmailAddress other)
    public String toString()
}
```

Rules:

- **Validation.** `text` must contain exactly one `@`, with at least one character before it
  and at least one after it. Otherwise throw `IllegalArgumentException`. A `null` text throws
  `NullPointerException`.
- **Equality ignores case.** Two addresses are equal when their local parts (before `@`) are
  equal ignoring case and their domains (after `@`) are equal ignoring case. Follow the whole
  contract: reflexive, symmetric, never equal to `null` or to a non-`EmailAddress` (not even the
  `String` with the same text).
- **`hashCode`** must be consistent with that equality: `Ana@X.org` and `ana@x.org` must have
  the same hash code, so a `HashSet` or `HashMap` treats them as the same key.
- **Natural order**: by domain, then by local part, both ignoring case. `compareTo` returns 0
  exactly when `equals` is true, so a `TreeSet` keeps the same elements as a `HashSet`.
- **`toString`** returns the address exactly as it was written.

Examples:

- `new EmailAddress("Ana@Example.com").equals(new EmailAddress("ana@EXAMPLE.com"))` → `true`
- a `HashSet` with `Ana@Example.com`, `ana@example.com` and `bob@example.com` has size 2
- sorted: `zed@alpha.io` < `amy@beta.io` < `bob@beta.io` (domain first)
- `new EmailAddress("a@b@c")` → throws `IllegalArgumentException`

**Hint:** normalise once, in the constructor: store the lower-cased local part and domain
(`toLowerCase(Locale.ROOT)`, so the result does not depend on the machine's language) and build
`equals`, `hashCode` and `compareTo` from those two fields only.

Hidden tests decide correctness.
'''
starter = '''
public final class EmailAddress implements Comparable<EmailAddress> {
    // Validate (exactly one '@', non-empty on both sides) and keep what you need.
    public EmailAddress(String text) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Equal when local part and domain match, ignoring case.
    @Override
    public boolean equals(Object o) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Consistent with equals.
    @Override
    public int hashCode() {
        throw new UnsupportedOperationException("not implemented");
    }

    // By domain, then local part, ignoring case; 0 exactly when equal.
    @Override
    public int compareTo(EmailAddress other) {
        throw new UnsupportedOperationException("not implemented");
    }

    // The address as originally written.
    @Override
    public String toString() {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
tests = '''
import java.util.HashMap;
import java.util.HashSet;
import java.util.Map;
import java.util.TreeSet;
test("equality ignores case and is symmetric", () -> {
    var a = new EmailAddress("Ana@Example.com");
    var b = new EmailAddress("ana@EXAMPLE.COM");
    check(a.equals(b), "a should equal b");
    check(b.equals(a), "b should equal a");
    check(a.equals(a), "equals must be reflexive");
});
test("different addresses are not equal", () -> {
    var a = new EmailAddress("ana@example.com");
    check(!a.equals(new EmailAddress("ana@example.org")), "different domains");
    check(!a.equals(new EmailAddress("bob@example.com")), "different local parts");
    check(!a.equals(new EmailAddress("example.com@ana")), "parts must not be mixed up");
});
test("never equal to null or another type", () -> {
    var a = new EmailAddress("ana@example.com");
    check(!a.equals(null), "equals(null) must be false");
    check(!a.equals("ana@example.com"), "an address is not a String");
});
test("equal addresses have equal hash codes", () -> {
    String[] variants = {"Ana@Example.com", "ana@example.com", "ANA@EXAMPLE.COM", "aNa@eXaMpLe.CoM"};
    int h = new EmailAddress(variants[0]).hashCode();
    for (String v : variants) equal(new EmailAddress(v).hashCode(), h);
});
test("HashSet deduplicates case variants", () -> {
    var set = new HashSet<EmailAddress>();
    set.add(new EmailAddress("Ana@Example.com"));
    set.add(new EmailAddress("ana@example.com"));
    set.add(new EmailAddress("ANA@EXAMPLE.COM"));
    set.add(new EmailAddress("bob@example.com"));
    equal(set.size(), 2);
    check(set.contains(new EmailAddress("ana@Example.COM")), "contains should ignore case");
});
test("works as a HashMap key", () -> {
    var counts = new HashMap<EmailAddress, Integer>();
    counts.merge(new EmailAddress("Ana@Example.com"), 1, Integer::sum);
    counts.merge(new EmailAddress("ana@example.com"), 1, Integer::sum);
    counts.merge(new EmailAddress("bob@example.com"), 1, Integer::sum);
    equal(counts.get(new EmailAddress("ANA@example.com")), 2);
    equal(counts.size(), 2);
});
test("toString keeps the original text", () -> {
    equal(new EmailAddress("Ana@Example.com").toString(), "Ana@Example.com");
});
test("natural order is domain, then local part", () -> {
    var set = new TreeSet<EmailAddress>();
    for (String s : new String[] {"bob@beta.io", "zed@alpha.io", "Amy@Beta.io", "amy@beta.io", "carl@alpha.io"}) {
        set.add(new EmailAddress(s));
    }
    var order = new ArrayList<String>();
    for (EmailAddress e : set) order.add(e.toString().toLowerCase(java.util.Locale.ROOT));
    equal(order, List.of("carl@alpha.io", "zed@alpha.io", "amy@beta.io", "bob@beta.io"));
});
test("compareTo is consistent with equals", () -> {
    var a = new EmailAddress("Ana@Example.com");
    var b = new EmailAddress("ana@example.com");
    var c = new EmailAddress("anb@example.com");
    equal(a.compareTo(b), 0);
    check(a.compareTo(c) < 0 && c.compareTo(a) > 0, "compareTo must be antisymmetric");
    check(new EmailAddress("z@a.com").compareTo(new EmailAddress("a@b.com")) < 0, "domain decides first");
});
test("rejects malformed addresses", () -> {
    for (String bad : new String[] {"", "no-at-sign", "@example.com", "ana@", "a@b@c", "@"}) {
        assertThrows(IllegalArgumentException.class, () -> new EmailAddress(bad));
    }
    assertThrows(NullPointerException.class, () -> new EmailAddress(null));
});
test("many addresses", () -> {
    var hash = new HashSet<EmailAddress>();
    var tree = new TreeSet<EmailAddress>();
    for (int i = 0; i < 20_000; i++) {
        int id = i % 10_000;
        String s = "user" + id + "@host" + (id % 7) + ".com";
        var e = new EmailAddress(i < 10_000 ? s : s.toUpperCase(java.util.Locale.ROOT));
        hash.add(e);
        tree.add(e);
    }
    equal(hash.size(), 10_000);
    equal(tree.size(), 10_000);
    check(hash.containsAll(tree) && tree.containsAll(hash), "HashSet and TreeSet must agree");
});
'''

[unit.step.gabarito]
solution = '''
import java.util.Locale;
import java.util.Objects;

public final class EmailAddress implements Comparable<EmailAddress> {
    private final String text;
    private final String local;
    private final String domain;

    public EmailAddress(String text) {
        Objects.requireNonNull(text, "text");
        int at = text.indexOf('@');
        if (at <= 0 || at == text.length() - 1 || text.indexOf('@', at + 1) >= 0) {
            throw new IllegalArgumentException("not an email address: " + text);
        }
        this.text = text;
        this.local = text.substring(0, at).toLowerCase(Locale.ROOT);
        this.domain = text.substring(at + 1).toLowerCase(Locale.ROOT);
    }

    @Override
    public boolean equals(Object o) {
        return o instanceof EmailAddress e && local.equals(e.local) && domain.equals(e.domain);
    }

    @Override
    public int hashCode() {
        return Objects.hash(local, domain);
    }

    @Override
    public int compareTo(EmailAddress other) {
        int c = domain.compareTo(other.domain);
        return c != 0 ? c : local.compareTo(other.local);
    }

    @Override
    public String toString() {
        return text;
    }
}
'''
time = "O(L) per operation"
space = "O(L) per address"
justification = '''
Let `L` be the length of an address. The constructor scans the text a constant number of times
(two `indexOf` calls, two `substring`s, two `toLowerCase`s): **O(L)** time, and it stores the
original text plus the two normalised parts, **O(L)** space.

`equals`, `hashCode` and `compareTo` each look at the stored normalised strings once, so they
are **O(L)** too (and `String` caches its own hash code after the first call). Normalising once
in the constructor, rather than lower-casing in every `equals` call, is both faster and the key
to correctness: because all three methods read the **same two fields**, equal addresses are
guaranteed to produce the same hash code and a `compareTo` of 0, which is exactly the contract
`HashSet`, `HashMap` and `TreeSet` rely on.

With a consistent hash, a `HashSet` of `n` addresses answers `add` and `contains` in expected
O(L), and a `TreeSet` in O(L log n). `Locale.ROOT` matters: in a Turkish locale,
`"I".toLowerCase()` is a dotless `ı`, which would make the same address hash differently on
different machines. The class is `final` with `final` fields, so its hash code can never change
while it sits in a set.
'''

[[unit]]
id = "java-u21-immutability"
title = "Immutability and defensive copies"
level = "intermediate"
difficulty = 21
intro = '''
An object that can never change is easy to reason about, safe to share between threads, and a
reliable `HashMap` key. This unit shows how to build one in Java: `final` fields, no setters,
unmodifiable collections, defensive copies on the way in and out, and "wither" methods that
return a new object instead of changing the old one.
'''
concepts = '''
## The idea

A **mutable** object can change after it is created; an **immutable** one cannot. Immutability
removes whole classes of bugs. You never wonder who else changed an object you are holding,
because nobody can. You can share it across threads without locks, cache it, and use it as a
`HashMap` key without its hash code shifting under the map. `String`, `Integer`, `LocalDate` and
`List.of(...)` are all immutable, and so is every well-designed value class.

The price is that "changing" a value means creating a new one, the way `s.toUpperCase()`
returns a new `String`. For small values that cost is negligible.

## How Java does it

An immutable class has four ingredients:

```java
public final class Range {               // 1. final: no mutable subclasses
    private final int low, high;         // 2. private final fields
    public Range(int low, int high) { this.low = low; this.high = high; }
    public int low() { return low; }     // 3. getters only, no setters
    public Range withHigh(int h) {       // 4. "changes" return a new object
        return new Range(low, h);
    }
}
```

Records give you 1 to 3 for free. Fields that refer to **mutable** objects (lists, maps,
arrays) need one more ingredient: **defensive copies**. Copy what callers pass in, so they cannot
change your state later through their own reference, and never hand out a reference to your
internal mutable state.

```java
record Team(String name, List<String> members) {
    Team { members = List.copyOf(members); }   // copy in; the copy is unmodifiable
}
```

`List.copyOf`, `Set.copyOf` and `Map.copyOf` make an unmodifiable copy (and return the argument
itself if it is already one of those). `Collections.unmodifiableList(list)` is different: it is a
read-only **view** of a list that its owner can still change.

## Pitfalls

- **`final` is not immutable.** A `final List<String>` cannot be reassigned, but `list.add(…)`
  still works. `final` freezes the reference, not the object.
- **Views leak.** An unmodifiable view over a list someone else holds changes when they change
  it.
- **Mutating an unmodifiable collection** throws `UnsupportedOperationException` at run time, not
  at compile time: the `List` interface still has `add`.
- **Nulls.** `List.of`, `List.copyOf` and `Map.of` reject `null` elements with a
  `NullPointerException`.
- **Arrays are always mutable.** Store `array.clone()` and return a clone, or use a `List`.
- **Records are shallowly immutable.** A record component of type `List` is only as immutable as
  the list you store in it.

## What you will practise

You will compare a view with a copy, add a defensive copy and a wither to a record, and see an
array leak out of a class that forgot to copy. The challenge is an immutable shopping `Cart`
whose every "change" returns a new cart and whose contents no caller can alter.
'''

[[unit.step]]
kind = "concept"
id = "java-u21-c1-final-vs-immutable"
title = "final is not immutable"
points = 5
difficulty = 21
intro = '''
Immutability is a property of the whole object graph a value can reach, not of a single
keyword. An object is only as immutable as the most mutable thing it exposes.
'''
body = '''
## Three different guarantees

| Code | Can you reassign it? | Can you change the contents? |
|---|---|---|
| `final List<String> a = new ArrayList<>();` | no | **yes** |
| `List<String> b = Collections.unmodifiableList(src);` | yes | not through `b`, but `src` still can |
| `List<String> c = List.copyOf(src);` | yes | **no one** can |

`final` protects a variable; an unmodifiable view protects one access path; only an unmodifiable
**copy** protects the data itself.

## Copy in, copy (or wrap) out

A class keeps its invariants only if no outsider holds a reference to its mutable parts:

- **In:** the constructor copies every mutable argument (`List.copyOf(list)`, `array.clone()`,
  `new HashMap<>(map)`), so the caller's later changes do not reach the object. Validate the
  **copy**, not the original, so nobody can change the data between the check and the store.
- **Out:** getters return the unmodifiable copy itself, a read-only view of private data, or a
  fresh clone, never the private mutable object.

## Change by construction

Immutable objects "change" by returning a new instance, often through a method named
`withX(...)`:

```java
Range wider = range.withHigh(100);   // range itself is untouched
```

The old value stays valid for everyone who holds it. That is why an immutable object can be
shared freely, cached, or used as a map key without surprises.
'''

