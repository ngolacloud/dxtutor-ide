solution = '''
import java.util.ArrayList;
import java.util.List;
import java.util.Objects;

class HashTable<K, V> {
    record Entry<K, V>(K key, V value) {}

    List<List<Entry<K, V>>> buckets = new ArrayList<>();
    int size;

    HashTable() {
        this(8);
    }

    HashTable(int capacity) {
        for (int i = 0; i < capacity; i++) buckets.add(new ArrayList<>());
    }

    private List<Entry<K, V>> bucketFor(K key) {
        Objects.requireNonNull(key, "key");
        return buckets.get(Math.floorMod(key.hashCode(), buckets.size()));
    }

    private int indexIn(List<Entry<K, V>> bucket, K key) {
        for (int i = 0; i < bucket.size(); i++) {
            if (bucket.get(i).key().equals(key)) return i;
        }
        return -1;
    }

    void put(K key, V value) {
        List<Entry<K, V>> bucket = bucketFor(key);
        int i = indexIn(bucket, key);
        if (i >= 0) {
            bucket.set(i, new Entry<>(key, value));
            return;
        }
        bucket.add(new Entry<>(key, value));
        size++;
        if (size > 0.75 * buckets.size()) resize(2 * buckets.size());
    }

    private void resize(int newCapacity) {
        List<List<Entry<K, V>>> fresh = new ArrayList<>(newCapacity);
        for (int i = 0; i < newCapacity; i++) fresh.add(new ArrayList<>());
        for (List<Entry<K, V>> bucket : buckets) {
            for (Entry<K, V> e : bucket) {
                fresh.get(Math.floorMod(e.key().hashCode(), newCapacity)).add(e);
            }
        }
        buckets = fresh;
    }

    V get(K key) {
        List<Entry<K, V>> bucket = bucketFor(key);
        int i = indexIn(bucket, key);
        return i >= 0 ? bucket.get(i).value() : null;
    }

    boolean containsKey(K key) {
        return indexIn(bucketFor(key), key) >= 0;
    }

    boolean remove(K key) {
        List<Entry<K, V>> bucket = bucketFor(key);
        int i = indexIn(bucket, key);
        if (i < 0) return false;
        bucket.set(i, bucket.get(bucket.size() - 1));
        bucket.remove(bucket.size() - 1);
        size--;
        return true;
    }

    int size() {
        return size;
    }

    int capacity() {
        return buckets.size();
    }
}
'''
time = "O(1) average per operation (amortised for put)"
space = "O(n)"
justification = '''
`get`, `containsKey` and `remove` hash the key once and scan a single bucket. Because the table
doubles whenever the load factor passes 0.75, the average chain length stays below a constant,
so these operations are **O(1) on average**. They are O(n) only in the degenerate case where
every key collides, as with the `Collide` test keys whose `hashCode` is always 7.

`put` is O(1) plus an occasional resize. A resize to *2m* buckets moves all ~0.75·m entries in
O(m), but it happens only after the number of entries has doubled since the last one. Summing
the resize costs over n inserts gives a geometric series (… + n/4 + n/2 + n), which is O(n) in
total, so each insert is **O(1) amortised**. That is why 200,000 inserts finish in
milliseconds, while a table stuck at 8 buckets would scan chains of 25,000 entries on every
operation.

`Math.floorMod` keeps every index in `0 .. capacity - 1` even for negative hash codes such as
`Integer.MIN_VALUE`, where `Math.abs` would fail. Removing by moving the last entry of the chain
into the hole and dropping the last slot keeps deletion O(1) within the bucket, since
`ArrayList.remove(last)` shifts nothing.

Space is **O(n)**: the entries plus a bucket list kept within a constant factor of n (it never
shrinks on removal, so it is bounded by the peak size).
'''

[[unit]]
id = "java-u32-binary-search-tree"
title = "Binary search trees"
level = "advanced"
difficulty = 32
intro = '''
A binary search tree keeps its keys ordered by shape: everything smaller goes left, everything
larger goes right, so each comparison discards a whole subtree. You will insert keys with a
generic `Comparable` bound and read them back sorted, search with a loop, see how insertion
order decides the height, and finish with a complete `BST<T>` that can delete any key.
'''
concepts = '''
## The idea

A **binary search tree** (BST) is a tree of nodes, each with a key and up to two children, that keeps one rule everywhere, the **BST property**: every key in a node's left subtree is smaller than the node's key, and every key in its right subtree is larger.

That rule turns search into a series of decisions. At each node you compare once and go left or right, throwing away the other subtree. The cost of search, insert and delete is therefore **O(h)**, where *h* is the tree's **height**, the number of nodes on its longest root-to-leaf path.

- A **balanced** tree with n keys has height about log₂ n: a million keys need only about 20 comparisons.
- A **degenerate** tree is a linked list in disguise. Inserting keys in sorted order makes every node a right child, so the height is n and every operation is O(n).

Random insertion orders give trees of height O(log n) on average. Self-balancing trees (red-black, AVL) rotate nodes to guarantee it; `java.util.TreeMap` and `TreeSet` are red-black trees. An **in-order traversal** (left subtree, node, right subtree) visits the keys in sorted order, which is why a BST can serve as a sorted collection.

## How Java does it

Keys must be comparable, so the class takes a bounded type parameter, and `compareTo` returns a negative number, zero or a positive number:

```java
class Tree<T extends Comparable<T>> {
    static final class Node<T> {
        final T key;
        Node<T> left, right;
        Node(T key) { this.key = key; }
    }
    Node<T> root;
}
```

Recursive insertion returns the root of the subtree it worked on, and the caller stores it back. That one pattern handles the empty tree and every level below it:

```java
Node<T> insert(Node<T> node, T key) {
    if (node == null) return new Node<>(key);
    int c = key.compareTo(node.key);
    if (c < 0) node.left = insert(node.left, key);
    else if (c > 0) node.right = insert(node.right, key);
    return node;
}
```

## What is special or tricky

- **`key < node.key` does not compile** for a generic `T` ("bad operand types for binary operator '<'"). Operators work only on primitives; use `compareTo`.
- **Forget the bound** and `key.compareTo(...)` fails with "cannot find symbol". Declare `T extends Comparable<T>`.
- **Store the returned subtree.** Calling `insert(node.left, key)` without `node.left = ...` builds the new node and throws it away.
- **Decide on duplicates.** Here a key is stored once, and inserting it again changes nothing.
- **`null` keys** would throw `NullPointerException` inside `compareTo`, but not on an empty tree, where no comparison happens. Reject them explicitly.
- **Degenerate trees and recursion.** A recursive walk is as deep as the tree. Balanced trees are shallow, but a sorted insertion of 100,000 keys would also make every insert O(n).

## What you will practise

You will insert keys and read them back in order, search iteratively while printing the path, and compare the height of a degenerate tree with a balanced one. The challenge is a complete `BST<T extends Comparable<T>>` with deletion, tested on 100,000 random keys.
'''

[[unit.step]]
kind = "concept"
id = "java-u32-c1-bst-property"
title = "The BST property and O(h)"
points = 5
difficulty = 32
intro = '''
A binary search tree is ordered by position: smaller keys to the left, larger to the right.
That single invariant is what makes search fast, and the tree's height is what limits how fast.
'''
body = '''
## The property

For every node, all keys in its **left** subtree are smaller and all keys in its **right**
subtree are larger. It must hold for the whole subtree, not just the direct children.

```text
        50
       /  \
     30    70
    /  \   / \
   20  40 60  80
```

## Searching

Start at the root. If the key is smaller, go left; if larger, go right; if equal, you found
it; if you fall off the tree (`null`), it is absent. Each step goes one level down, so a search
costs at most *h* + 1 comparisons, where *h* is the height.

```java
Node<T> n = root;
while (n != null && key.compareTo(n.key) != 0) {
    n = key.compareTo(n.key) < 0 ? n.left : n.right;
}
```

## Inserting

Search for the key; the place where the search falls off the tree is exactly where the new
node belongs. Insertion never moves existing nodes.

## In-order traversal

Visit the left subtree, then the node, then the right subtree. Because of the property, this
visits the keys in ascending order: the tree above yields 20, 30, 40, 50, 60, 70, 80.

## Height decides everything

Search, insert and delete all cost O(h). For n keys, *h* ranges from about log₂ n (balanced)
to n (a chain). The same seven keys inserted as 20, 30, 40, 50, 60, 70, 80 produce a chain of
height 7 instead of the tree of height 3 above.
'''

