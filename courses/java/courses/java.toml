target = '''
import java.util.HashMap;
import java.util.Map;
import java.util.TreeMap;

public class Main {
    public static void main(String[] args) {
        Map<String, Integer> prices = new HashMap<>();
        prices.put("coffee", 250);
        prices.put("tea", 180);
        prices.put("cake", 320);
        Integer old = prices.put("tea", 200);
        System.out.println("tea was " + old + ", now " + prices.get("tea"));

        System.out.println("juice? " + prices.containsKey("juice") + " -> " + prices.get("juice"));
        System.out.println("juice or 0: " + prices.getOrDefault("juice", 0));
        prices.remove("cake");
        prices.putIfAbsent("coffee", 999);
        prices.putIfAbsent("water", 100);

        int total = 0;
        for (Map.Entry<String, Integer> e : new TreeMap<>(prices).entrySet()) {
            System.out.println(e.getKey() + " = " + e.getValue());
            total += e.getValue();
        }
        System.out.println(prices.size() + " items, total " + total);
    }
}
'''
