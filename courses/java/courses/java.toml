import java.util.HashMap;
import java.util.Map;
import java.util.Optional;

public class Main {
    public static void main(String[] args) {
        Map<String, String> config = new HashMap<>();
        config.put("port", " 9090 ");
        config.put("host", "   ");
        config.put("timeout", null);

        System.out.println(intSetting(config, "port", 8080));
        System.out.println(intSetting(config, "timeout", 30));
        System.out.println(intSetting(config, "retries", 3));

