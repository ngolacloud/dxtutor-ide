prompt = '''
Reformat ISO dates to day-first with `$3/$2/$1`, collapse runs of whitespace, compare
`replaceAll(".")` with the literal `replace`, remove a literal with `Pattern.quote`, split on any
line ending and list the words of a sentence with `results()`.

**Why:** these are the text-cleaning steps of every import job, and the dot-versus-literal
confusion is a bug worth meeting on purpose.
'''
target = '''
import java.util.List;
import java.util.regex.Pattern;

public class Main {
    public static void main(String[] args) {
        String text = "Paid 2025-03-07,   due 2025-04-01.";
        String dmy = text.replaceAll("(\\d{4})-(\\d{2})-(\\d{2})", "$3/$2/$1");
        System.out.println(dmy);
        System.out.println(dmy.replaceAll("\\s+", " "));

        String price = "total: 3.50 (approx.)";
        System.out.println(price.replaceAll(".", "_"));
        System.out.println(price.replace(".", ","));
        System.out.println(price.replaceAll(Pattern.quote("(approx.)"), "").strip());

        String report = "line one\r\nline two\nline three";
        List<String> lines = List.of(report.split("\\R"));
        System.out.println(lines.size() + " lines: " + lines);

        Pattern word = Pattern.compile("\\b[a-z]+\\b", Pattern.CASE_INSENSITIVE);
        System.out.println(word.matcher("Java 21 is FAST").results().map(r -> r.group()).toList());
