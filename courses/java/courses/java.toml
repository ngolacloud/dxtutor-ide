'''
prompt = '''
Build an adder and a counter with factory methods, then compose functions and predicates.

**Why:** composition and closures are how functional code stays small: each piece does one
thing, and the combinations are new functions you never had to write by hand.
'''
target = '''
import java.util.function.Function;
import java.util.function.IntSupplier;
import java.util.function.Predicate;
import java.util.function.UnaryOperator;

public class Main {
    static UnaryOperator<Integer> adder(int n) {
        return x -> x + n;
    }

    static IntSupplier counter() {
        int[] count = {0};
        return () -> ++count[0];
    }

    public static void main(String[] args) {
        Function<Integer, Integer> plus3 = adder(3);
        Function<Integer, Integer> times2 = x -> x * 2;
        System.out.println(plus3.andThen(times2).apply(5));
        System.out.println(plus3.compose(times2).apply(5));

        Predicate<String> nonEmpty = s -> !s.isEmpty();
        Predicate<String> shortWord = s -> s.length() <= 3;
        Predicate<String> keep = nonEmpty.and(shortWord.negate());
        System.out.println(keep.test("") + " " + keep.test("cat") + " " + keep.test("lambda"));

        IntSupplier next = counter();
        next.getAsInt();
        next.getAsInt();
        System.out.println("counter at " + next.getAsInt());
    }
}
