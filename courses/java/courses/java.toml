[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.Comparator;
import java.util.HashMap;
import java.util.List;
import java.util.Map;
import java.util.TreeSet;

class Leaderboard {
    private record Standing(String player, int score) {}

    private static final Comparator<Standing> ORDER =
            Comparator.comparingInt(Standing::score).reversed().thenComparing(Standing::player);

    private final Map<String, Integer> best = new HashMap<>();
    private final TreeSet<Standing> ranking = new TreeSet<>(ORDER);

    void submit(String player, int score) {
        Integer old = best.get(player);
        if (old != null) {
            if (score <= old) return;
            ranking.remove(new Standing(player, old));   // never mutate inside the tree
        }
        best.put(player, score);
        ranking.add(new Standing(player, score));
    }

    List<String> top(int k) {
        if (k < 0) throw new IllegalArgumentException("k must not be negative, got " + k);
        List<String> out = new ArrayList<>(Math.min(k, ranking.size()));
        for (Standing s : ranking) {
            if (out.size() == k) break;
            out.add(s.player());
        }
        return out;
    }

    List<String> atLeast(int minScore) {
        List<String> out = new ArrayList<>();
        for (Standing s : ranking) {
            if (s.score() < minScore) break;
            out.add(s.player());
        }
        return out;
    }

    int size() {
        return best.size();
    }
}
'''
time = "O(log n) submit, O(log n + k) top"
space = "O(n)"
justification = '''
For n distinct players, the tree holds exactly one `Standing` per player, because an
improvement **removes** the old record before adding the new one. `submit` does one hash
lookup (O(1) expected), at most one tree `remove` and one tree `add`, each O(log n) in a
red-black tree, so it is **O(log n)**.

`top(k)` starts an in-order iteration of the tree: finding the first element walks one path,
O(log n), and each following element costs amortized O(1), so returning k names is
**O(log n + k)**. `atLeast` is the same walk stopped at the first score below the bound, so it
costs O(log n + r) for r returned players: it is output-sensitive and never scans players it
does not return. `size()` is O(1).

Space is **O(n)**: one map entry and one tree node per player. The comparator is the key to
correctness. Without the name tie-break, two players with equal scores would compare as
equal and the `TreeSet` would silently keep only one of them. Sorting all players on every
`top` call would also be correct but costs O(n log n) per query, which the performance test
rules out.
'''

[[unit]]
id = "java-u29-stacks-queues"
title = "Stacks and queues"
level = "advanced"
difficulty = 29
intro = '''
Stacks hand back the newest item first and queues the oldest, and between them they power
undo, parsing, scheduling and graph search. You will use `ArrayDeque` as a stack to match
brackets and as a queue to run breadth-first search, write an array-backed stack by hand,
and finish with a growable circular deque that behaves exactly like `ArrayDeque`.
'''
concepts = '''
## The idea

A **stack** is last-in, first-out (LIFO): you push onto the top and pop from the top, like
a pile of plates. Undo histories, the call stack of a running program, bracket matching and
depth-first search are stacks. A **queue** is first-in, first-out (FIFO): you add at the back
and remove from the front, like a line at a counter. Print spoolers, message buffers, task
schedulers and breadth-first search are queues. A **deque** (double-ended queue, said
"deck") allows both ends and can play either role.

## How Java does it

`ArrayDeque<E>` is the go-to implementation of all three. It is a **circular array**: a head
index and a tail index move around the array, so adding or removing at either end is
amortized O(1) and nothing is ever shifted. When it fills up, it grows. Use it through the
`Deque` or `Queue` interface:

```java
Deque<Integer> stack = new ArrayDeque<>();
stack.push(1);
stack.push(2);        // the top is 2
stack.pop();          // 2

Queue<String> line = new ArrayDeque<>();
line.offer("first");
line.offer("second");
line.poll();          // "first"
```

Most operations come in two flavours. `push`, `pop`, `remove` and `element` throw
`NoSuchElementException` on an empty deque; `offer`, `poll` and `peek` return `false` or
`null` instead. Pick the one that says what "empty" means for your code.

## Building them by hand

Underneath, a stack is an array plus a size: push writes `data[size++]`, pop reads
`data[--size]`. A queue in an array needs **wraparound**: keep a `head` index and a `size`,
the back slot is `(head + size) % capacity`, and removing from the front advances
`head = (head + 1) % capacity`. Growing a full circular buffer means copying the elements
into a bigger array **in logical order**, because physically they may be split around the
end of the array.

## What is special or tricky

- **Don't use `java.util.Stack`.** It extends `Vector`, synchronizes every call and exposes
  index access. Its own Javadoc recommends `ArrayDeque`.
- **`ArrayDeque` rejects `null`** with a `NullPointerException`, because `poll` and `peek`
  use `null` to mean "empty". `LinkedList` accepts `null` but allocates a node per element.
- **`push` adds at the front**, so printing a stack-used `ArrayDeque` shows the top first,
  and mixing `push` with `offer` (which adds at the back) produces surprising orders.
- **`ArrayList.remove(0)` is O(n)**: it looks like a queue, but every removal shifts the
  whole array.
- **Generic arrays.** `new T[n]` fails with "generic array creation"; hand-written containers
  store an `Object[]` and cast on the way out, with `@SuppressWarnings("unchecked")`.
- **Loitering.** When you pop by hand, set the freed slot to `null`, or the array keeps the
  object alive for the garbage collector.

## What you will practise

You will check balanced brackets with a stack, run breadth-first search with a queue, and
write a growable array stack by hand. The challenge is `RingDeque`, a circular deque that
grows by doubling and matches `ArrayDeque` operation for operation.
'''

[[unit.step]]
kind = "concept"
id = "java-u29-c1-lifo-fifo"
title = "LIFO, FIFO and the ring"
points = 5
difficulty = 29
intro = '''
Stacks and queues are defined by **which end** you remove from, not by how they are stored.
A circular array gives both O(1) ends without ever shifting an element.
'''
body = '''
## Two disciplines

- **Stack (LIFO):** the element removed is always the one added most recently. Nesting is a
  stack: the innermost open bracket, call or HTML tag must close first.
- **Queue (FIFO):** the element removed is always the one waiting longest. Fairness is a
  queue: requests, print jobs and the frontier of a breadth-first search are served in
  arrival order.

## Why an array, and why a ring

An array-backed stack only touches the end of its array, so it never shifts anything. A
queue is harder: it adds at one end and removes at the other. If the front were always index
0, each removal would shift every remaining element, which costs O(n).

The fix is to let the front **move**. Keep `head`, the index of the first element, and
`size`. Removing from the front advances `head`; adding at the back writes slot
`(head + size) % capacity`. When an index passes the end of the array it wraps to 0, so the
array behaves like a ring:

```text
capacity 8, head 6, size 4:   [ c  d  .  .  .  .  a  b ]
                                 front is a at index 6, back is d at index 1
```

## Growing the ring

When `size == capacity`, allocate an array twice as large and copy the elements **in logical
order**, from `head` around to the back, into slots 0, 1, 2 and so on, then reset `head` to 0.
Doubling makes each element's share of the copying a constant, so adds stay amortized O(1).
This is how `ArrayDeque` works, and the challenge asks you to build exactly this.
'''

