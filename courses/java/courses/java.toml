[unit.step.gabarito]
solution = '''
import java.util.ArrayList;
import java.util.Comparator;
import java.util.List;
import java.util.NoSuchElementException;

record Pair<A, B>(A first, B second) {
    Pair<B, A> swap() {
        return new Pair<>(second, first);
    }
}

class Algos {
    static <A, B> List<Pair<A, B>> zip(List<A> left, List<B> right) {
        int n = Math.min(left.size(), right.size());
        List<Pair<A, B>> out = new ArrayList<>(n);
        for (int i = 0; i < n; i++) {
            out.add(new Pair<>(left.get(i), right.get(i)));
        }
        return out;
    }

    static <T extends Comparable<? super T>> T maxOf(List<? extends T> items) {
        return maxBy(items, Comparator.naturalOrder());
    }

    static <T> T maxBy(List<? extends T> items, Comparator<? super T> order) {
        if (items.isEmpty()) {
            throw new NoSuchElementException("maxBy of an empty list");
        }
        T best = items.get(0);
        for (T item : items) {
            if (order.compare(item, best) > 0) {   // strictly larger: the first of equals wins
                best = item;
            }
        }
        return best;
    }

    static <T> void copyInto(List<? super T> target, List<? extends T> source) {
        for (T item : source) {
            target.add(item);
        }
    }
}
'''
time = "O(n)"
space = "O(n)"
justification = '''
Each method makes a single pass over its input. `maxOf` and `maxBy` look at each of the `n`
elements once and do one comparison per element, so they run in **O(n)** time with **O(1)**
extra space: only the current best is kept. `copyInto` appends `n` elements; `ArrayList.add` is
amortised O(1), so the copy is **O(n)** time and needs no space beyond the target's own growth.
`zip` reads `min(len(left), len(right))` index pairs and creates one `Pair` per index, so it is
**O(n)** in time and **O(n)** in space for the result. `get(i)` is O(1) for the array-backed
lists used here; on a `LinkedList` an iterator-based loop would keep it linear.

The bounds carry the correctness. `maxOf` reuses `maxBy` with `Comparator.naturalOrder()`,
which type-checks because `T extends Comparable<? super T>`; with the narrower
`Comparable<T>`, `LocalDate` would be rejected. `Comparator<? super T>` lets a
`Comparator<CharSequence>` or `Comparator<Object>` order strings and integers. In `copyInto`,
`? extends T` makes `source` a producer of `T`s and `? super T` makes `target` a consumer, so a
`List<Integer>` can flow into a `List<Number>` without a single cast.
'''

# ---------------------------------------------------------------------------
# Unit 14 — Lambdas and functional interfaces
# ---------------------------------------------------------------------------
[[unit]]
id = "java-u14-lambdas"
title = "Lambdas and functional interfaces"
level = "intermediate"
difficulty = 14
intro = '''
A lambda is a piece of behaviour you can store in a variable, pass to a method and return from
one. In this unit you learn the functional interfaces of `java.util.function`, the short
syntax of lambdas and method references, how lambdas capture variables, and how small functions
compose into bigger ones. The challenge is a toolkit of higher-order functions.
'''
concepts = '''
## The idea

Many methods need to be told not only *what data* to work on but *what to do* with it: which
elements to keep, how to order them, what to run later. Before Java 8 you passed that behaviour
as an object of an anonymous class, five lines of ceremony around one line of logic. A
**lambda expression** is that one line: a function without a name, written where it is used.
Code that takes or returns functions is called **higher-order**, and it lets you write a general
algorithm once and plug in the details.

## How Java does it

Java has no separate function type. A lambda is always converted to a **functional interface**:
an interface with exactly one abstract method. The compiler infers the parameter types from
that method. The `java.util.function` package provides the common shapes:

| Interface | Method | Shape |
|---|---|---|
| `Function<T, R>` | `R apply(T t)` | transform a value |
| `BiFunction<T, U, R>` | `R apply(T t, U u)` | combine two values |
| `Predicate<T>` | `boolean test(T t)` | ask a yes/no question |
| `Supplier<T>` | `T get()` | produce a value on demand |
| `Consumer<T>` | `void accept(T t)` | do something with a value |
| `UnaryOperator<T>`, `BinaryOperator<T>` | `T apply(…)` | a function from and to the same type |

`IntPredicate`, `IntUnaryOperator`, `ToIntFunction` and friends avoid boxing for primitives.
Familiar older interfaces such as `Runnable` and `Comparator` are functional interfaces too.

```java
Predicate<String> blank = s -> s.isBlank();
BinaryOperator<Integer> max = (a, b) -> a >= b ? a : b;
Comparator<String> byLength = (a, b) -> Integer.compare(a.length(), b.length());
```

When a lambda only calls an existing method, a **method reference** is shorter:
`String::length` (an instance method of the argument), `Integer::parseInt` (a static method),
`System.out::println` (a method of a particular object) and `ArrayList::new` (a constructor).

The interfaces also carry default methods that **compose** functions:
`f.andThen(g)`, `f.compose(g)`, `p.and(q)`, `p.negate()` and
`Comparator.comparing(Person::age).thenComparing(Person::name)`.

## Pitfalls and compiler errors

- A lambda may read local variables of the enclosing method only if they are **effectively
  final** (never reassigned). Otherwise: `error: local variables referenced from a lambda
  expression must be final or effectively final`. Fields and the contents of objects are fine.
- `error: incompatible types: bad return type in lambda expression` means the body returns
  the wrong type for the interface, for example a `String` where a `Predicate` needs a `boolean`.
- A lambda alone has no type: `var f = x -> x + 1;` fails with
  `error: cannot infer type for local variable f`. Give the interface type.
- The methods of `java.util.function` declare no checked exceptions, so a lambda that calls
  `Files.readString` must catch `IOException` inside its body.
- Keep lambdas short. Two or three lines are fine; beyond that, a named method and a method
  reference read better.

## What you will practise

You will create and call each of the core functional interfaces, replace lambdas with method
references while sorting and filtering a list, and build functions out of functions with
composition and closures. The challenge asks you to implement `mapAll`, `allOf`, `pipeline`,
`repeat` and `memoize`.
'''

[[unit.step]]
kind = "concept"
id = "java-u14-c1-functional-interfaces"
title = "Functional interfaces"
points = 5
difficulty = 14
intro = '''
A lambda in Java is not a free-standing function: it is an object that implements an interface
with a single abstract method. The interface gives the lambda its parameter types, its return
type and the name you call it by.
'''
body = '''
## One abstract method

An interface with exactly one abstract method is a **functional interface**. Any lambda whose
parameters and result fit that method can be used where the interface is expected:

```java
@FunctionalInterface
interface Discount {
    double apply(double price);
}

Discount tenPercent = price -> price * 0.9;
double paid = tenPercent.apply(50.0);       // 45.0
```

The optional `@FunctionalInterface` annotation asks the compiler to check that the interface
really has only one abstract method. Default and static methods don't count, which is how
`Function` can offer `andThen` and still be functional.

## The same lambda, different types

A lambda has no type of its own. Its type comes from the **target**, the place where it is
used: a variable declaration, a method parameter or a `return`. The text `x -> x * 2` can become
a `Function<Integer, Integer>`, a `UnaryOperator<Integer>` or an `IntUnaryOperator`, depending
on what the context expects. That is why `var f = x -> x * 2;` doesn't compile: there is no
target to learn from.

## Calling it

You call the behaviour through the interface's method, whose name depends on the interface:
`apply` for a `Function`, `test` for a `Predicate`, `get` for a `Supplier`, `accept` for a
`Consumer`, `run` for a `Runnable`. Nothing runs when the lambda is created. The body runs each
time that method is called, which is what makes lambdas useful for deferred and repeated work.
'''

