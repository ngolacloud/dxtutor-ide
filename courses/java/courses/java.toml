import java.util.List;
record Collide(String name) {
    @Override
    public int hashCode() {
        return 7;
    }
}
test("put and get", () -> {
    var t = new HashTable<String, Integer>();
    t.put("a", 1);
    t.put("b", 2);
    equal(t.get("a"), 1);
    equal(t.get("b"), 2);
    equal(t.size(), 2);
    check(t.containsKey("a") && t.containsKey("b"), "both keys must be present");
});
test("overwriting keeps the size", () -> {
    var t = new HashTable<String, Integer>();
    t.put("a", 1);
    t.put("a", 3);
    equal(t.get("a"), 3);
    equal(t.size(), 1);
    int total = 0;
    for (var bucket : t.buckets) total += bucket.size();
    equal(total, 1);
});
test("missing keys and null values", () -> {
    var t = new HashTable<String, String>();
    equal(t.get("x"), null);
    check(!t.containsKey("x"), "an empty table contains nothing");
    check(!t.remove("x"), "removing an absent key returns false");
    t.put("k", null);
    check(t.containsKey("k"), "a stored null value is still a key");
    equal(t.get("k"), null);
    equal(t.size(), 1);
});
test("null keys are rejected", () -> {
    var t = new HashTable<String, Integer>();
    assertThrows(NullPointerException.class, () -> t.put(null, 1));
    assertThrows(NullPointerException.class, () -> t.get(null));
    assertThrows(NullPointerException.class, () -> t.containsKey(null));
    assertThrows(NullPointerException.class, () -> t.remove(null));
    equal(t.size(), 0);
});
test("remove", () -> {
    var t = new HashTable<String, String>();
    for (String k : List.of("a", "b", "c")) t.put(k, k.toUpperCase());
    check(t.remove("b"), "removing a present key returns true");
    check(!t.containsKey("b"), "a removed key is gone");
    equal(t.get("b"), null);
    equal(t.size(), 2);
    equal(t.get("c"), "C");
    check(!t.remove("b"), "removing twice returns false");
    t.put("b", "again");
    equal(t.get("b"), "again");
    equal(t.size(), 3);
});
test("collisions are resolved with equals", () -> {
    var t = new HashTable<Collide, Integer>();
    for (int i = 0; i < 50; i++) t.put(new Collide("k" + i), i);
    equal(t.size(), 50);
    for (int i = 0; i < 50; i++) equal(t.get(new Collide("k" + i)), i);
    t.put(new Collide("k3"), -3);
    equal(t.size(), 50);
    equal(t.get(new Collide("k3")), -3);
    check(t.remove(new Collide("k10")), "remove finds an equal key");
    check(!t.containsKey(new Collide("k10")), "the removed key is gone");
    equal(t.size(), 49);
});
test("negative hash codes", () -> {
    var t = new HashTable<Object, String>();
    t.put(-5, "neg");
    t.put(Integer.MIN_VALUE, "min");
    t.put("polygenelubricants", "MIN_VALUE hash");
    t.put("pineapple", "negative hash");
    equal(t.get(-5), "neg");
    equal(t.get(Integer.MIN_VALUE), "min");
    equal(t.get("polygenelubricants"), "MIN_VALUE hash");
    equal(t.get("pineapple"), "negative hash");
    for (int i = 0; i < t.capacity(); i++) {
        for (var e : t.buckets.get(i)) {
            equal(Math.floorMod(e.key().hashCode(), t.capacity()), i);
        }
