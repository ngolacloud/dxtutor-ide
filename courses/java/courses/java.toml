test("copies the map, so later changes do not leak in", () -> {
    var m = new HashMap<String, String>();
    m.put("mode", "safe");
    var s = new Settings(m);
    m.put("mode", "unsafe");
    m.put("extra", "1");
    equal(s.get("mode"), Optional.of("safe"));
    equal(s.get("extra"), Optional.empty());
});
test("many settings", () -> {
    var m = new HashMap<String, String>();
