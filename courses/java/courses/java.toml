- `{3, 1, 3, 1}` gives `[1, 1, 3, 3]` and 3.
- `{5, 4, 3, 2, 1}` gives `[1, 2, 3, 4, 5]` and 10.

The hidden tests include arrays of 100,000 and 1,000,000 elements, so checking every pair is far
too slow. A reversed array of 100,000 elements has 4,999,950,000 inversions, which doesn't fit
