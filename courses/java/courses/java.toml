    Node<T> head;
    Node<T> tail;
    int size;

    // Insert val at the front in O(1).
    void addFirst(T val) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Append val at the end in O(1), using tail.
    void addLast(T val) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Remove and return the first value; NoSuchElementException when empty.
    T removeFirst() {
        throw new UnsupportedOperationException("not implemented");
    }

    // The value at index; IndexOutOfBoundsException when index < 0 or index >= size().
    T get(int index) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Reverse the list in place: rewire next references, create no nodes.
    void reverse() {
        throw new UnsupportedOperationException("not implemented");
    }

    int size() {
        throw new UnsupportedOperationException("not implemented");
    }

    // Values from head to tail; next() throws NoSuchElementException when exhausted.
