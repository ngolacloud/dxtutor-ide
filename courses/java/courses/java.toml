import java.util.function.Function;

class Fanout {
    // Apply fn to every item, each call on its own virtual thread, at most
    // maxConcurrent calls at a time. Return the results in input order.
    // If a call throws, throw IllegalStateException caused by the first failure
    // in input order. maxConcurrent < 1 is an IllegalArgumentException.
    static <T, R> List<R> mapAll(List<T> items, int maxConcurrent,
                                 Function<? super T, ? extends R> fn) throws InterruptedException {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
