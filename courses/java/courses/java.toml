'''
prompt = '''
Build two score holders from the same array, one that stores and returns the array as-is and
one that clones it in both directions, then try to change their scores from outside.

**Why:** an array field returned by a getter is the most common way private state escapes a
class, and the fix is two calls to `clone()`.
'''
target = '''
import java.util.Arrays;

public class Main {
    public static void main(String[] args) {
        int[] scores = {90, 75, 60};
        Leaky leaky = new Leaky(scores);
        Safe safe = new Safe(scores);

        scores[0] = 0;
        leaky.scores()[1] = 0;
        safe.scores()[1] = 0;

        System.out.println("leaky " + Arrays.toString(leaky.scores()));
        System.out.println("safe  " + Arrays.toString(safe.scores()));
        System.out.println("best  " + safe.best());
    }
}

final class Leaky {
    private final int[] scores;
    Leaky(int[] scores) { this.scores = scores; }

    int[] scores() { return scores; }
}

final class Safe {
    private final int[] scores;

    Safe(int[] scores) {
        this.scores = scores.clone();
    }

    int[] scores() {
        return scores.clone();
    }

    int best() {
        return Arrays.stream(scores).max().orElse(0);
    }
}
'''
