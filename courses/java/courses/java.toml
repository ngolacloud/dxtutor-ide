entry = "Anagrams"
intro = '''
Two words are anagrams when they use the same letters the same number of times. Sorting each
word's letters gives a **canonical form** that all its anagrams share, so a hash map from
canonical form to word list groups them in one pass, instead of comparing every pair of
words in O(n²).
'''
instructions = '''
## Your turn

Implement the class `Anagrams` with two static methods:

```java
public static String key(String word)
public static Map<String, List<String>> group(List<String> words)
```

- `key` returns the grouping key of one word: its letters converted to lower case and then
  sorted. `key("Listen")` → `"eilnst"`, `key("")` → `""`.
- `group` puts every word under its key. Each value lists the **original** words (not lower
  cased) in the order they appear in `words`, duplicates included.

Examples:

- `group(List.of("listen", "silent", "google", "enlist"))` →
  `{eilnst=[listen, silent, enlist], eggloo=[google]}`
- `group(List.of("Tea", "eat", "tea"))` → `{aet=[Tea, eat, tea]}`
- `group(List.of())` → `{}`

The order of the map's keys does not matter. Lists of 100,000 words must be handled quickly.

**Hint:** `toCharArray`, `Arrays.sort` and `new String(char[])` build the key;
`computeIfAbsent` builds the groups. Use `toLowerCase(Locale.ROOT)` so the result does not
depend on the computer's language settings.

Hidden tests decide correctness.
'''
