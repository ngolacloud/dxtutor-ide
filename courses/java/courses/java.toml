[[unit.step]]
kind = "challenge"
id = "java-u30-x1-linked-list"
title = "A singly linked list that reverses in place"
points = 40
difficulty = 30
entry = "SinglyLinkedList"
intro = '''
A useful list class keeps its head, tail and size consistent through every operation, which is
where most linked-list bugs hide: a removal that forgets the tail, or a reversal that leaves a
cycle. Reversing a singly linked list in place is the classic test of pointer rewiring, done in
one pass with O(1) extra memory and no new nodes.
'''
instructions = '''
## Your turn

Complete the generic class `SinglyLinkedList<T>`:

```java
class SinglyLinkedList<T> implements Iterable<T> {
    void addFirst(T val)          // insert at the front, O(1)
    void addLast(T val)           // append at the end, O(1)
    T removeFirst()               // remove and return the first value, O(1)
    T get(int index)              // the value at index, O(index)
    void reverse()                // reverse in place, O(n) time, O(1) extra space
    int size()                    // O(1)
    Iterator<T> iterator()        // values from head to tail
}
```

The nested `Node<T>` class and the fields `head`, `tail` and `size` are provided in the
starter; keep them, because the tests inspect the nodes.

Rules:

- `head` and `tail` are both `null` when the list is empty. After every operation, `tail` is
  the last node and `tail.next` is `null`.
- `removeFirst` throws `NoSuchElementException` on an empty list. `get` throws
  `IndexOutOfBoundsException` when `index < 0` or `index >= size()`.
- `reverse` reuses the existing nodes: rewire their `next` references, don't create nodes and
  don't change any `val`. The old head becomes the new tail.
- Values may be `null` or repeated; store them as they are.
- The iterator's `next()` throws `NoSuchElementException` when there are no values left.

Example:

```java
var list = new SinglyLinkedList<Integer>();
list.addLast(2); list.addLast(3); list.addFirst(1);   // 1 -> 2 -> 3
list.reverse();                                       // 3 -> 2 -> 1
list.removeFirst();                                   // returns 3
list.get(1);                                          // 1
```

Lists can hold a million nodes, so a recursive walk will overflow the stack. Use loops.

**Hint:** for `reverse`, walk once with two references, the part already reversed and the part
not yet visited. Save the next node before you overwrite `next`.

Hidden tests decide correctness.
'''
