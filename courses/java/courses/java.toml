[[unit]]
id = "java-u12-exceptions"
title = "Exceptions"
level = "intermediate"
difficulty = 12
intro = '''
Real programs meet input that is not a number, files that are missing and withdrawals larger
than the balance. In this unit you learn how Java reports such problems with exceptions, why
the compiler forces you to handle some of them and not others, and how try-with-resources
closes what you opened. You finish by designing a bank account with its own checked exception.
'''
concepts = '''
## The idea

Sooner or later a method meets a situation it cannot handle where it stands: the text it was
given is not a number, a file does not exist, an amount is negative. Returning a special value
such as `-1` or `null` forces every caller to remember to check, and the ones that forget carry
on with garbage. Java uses **exceptions** instead. The method creates an object that describes
the problem and **throws** it. Normal execution stops at once, and the JVM **unwinds the call
stack**, method by method, until it finds a `catch` block that accepts that type. If none does,
the thread dies and the JVM prints a **stack trace**: the exception, its message and the chain
of calls that led to it.

## How Java does it

Every exception is an object whose class extends `Throwable`. The hierarchy decides how the
compiler treats it:

- `Error` (`OutOfMemoryError`, `StackOverflowError`): the JVM itself is in trouble. Don't catch these.
- `RuntimeException` and its subclasses are **unchecked**: `NullPointerException`,
  `IllegalArgumentException`, `ArithmeticException`, `IndexOutOfBoundsException`. They signal
  bugs or broken preconditions, and the compiler doesn't make you handle them.
- Every other `Exception` is **checked**: `IOException`, `InterruptedException`. The caller can
  reasonably recover, so a method that may throw one must either catch it or declare it with
  `throws`.

```java
static int parsePort(String text) {
    int port = Integer.parseInt(text);              // may throw NumberFormatException
    if (port < 1 || port > 65_535) {
        throw new IllegalArgumentException("port out of range: " + port);
    }
    return port;
}
```

`try` runs code that may throw, each `catch` handles one family of types (`catch (A | B e)`
handles two), and `finally` always runs, whether the block finished, threw or returned. For
anything that must be closed, **try-with-resources** is the safe form: every resource declared
in the parentheses implements `AutoCloseable` and is closed automatically, in reverse order.

```java
try (BufferedReader in = Files.newBufferedReader(path)) {
    return in.readLine();
}   // in.close() runs here, even when readLine threw
```

Your own exception is an ordinary class. Extend `Exception` for a checked one or
`RuntimeException` for an unchecked one, and pass the message (and the cause, when you wrap
another exception) to `super`.

## Pitfalls and compiler errors

- `error: unreported exception IOException; must be caught or declared to be thrown`: you
  called a method with a checked exception and did neither.
- `error: exception IOException is never thrown in body of corresponding try statement`: you
  catch a checked exception that the `try` block cannot throw.
- `error: exception NumberFormatException has already been caught`: a `catch` for a subclass
  sits below a `catch` for its superclass and can never run. Put specific types first.
- An empty `catch {}` swallows the error and hides the bug. Handle it, or rethrow it.
- When you wrap an exception, pass the original as the **cause**
  (`new ConfigException("bad file", e)`), or the real reason disappears from the stack trace.
- Exceptions are for exceptional situations. Don't use them for ordinary loop control.

## What you will practise

You will catch a parsing error while a `finally` block reports progress, watch
try-with-resources close resources in reverse order and record a **suppressed** exception, and
declare a checked exception of your own. The challenge asks you to build an account class whose
withdrawals throw a checked `InsufficientFundsException` and whose transfers never leave money
half-moved.
'''

[[unit.step]]
kind = "concept"
id = "java-u12-c1-checked-unchecked"
title = "Checked or unchecked?"
points = 5
difficulty = 12
intro = '''
Java is one of the few languages that splits exceptions into two kinds and lets the compiler
enforce one of them. Knowing which kind to throw, and which to catch, is the core design
decision of error handling in Java.
'''
body = '''
## Two kinds of failure

Some failures are part of normal life. A user types the name of a file that does not exist; a
payment is refused. The caller can do something sensible about it: ask again, show a message,
try another server. These are **checked** exceptions. They extend `Exception` (but not
`RuntimeException`), and the compiler insists that each caller either handles them or passes
them on:

```java
void load(Path p) throws IOException {      // passes it on
    String text = Files.readString(p);
}
```

Other failures are bugs: a `null` where an object was required, an index past the end of an
array, an argument that breaks the method's contract. Catching them rarely helps, because the
fix belongs in the code. These are **unchecked** exceptions: `RuntimeException` and its
subclasses. You may catch them, but the compiler never makes you.

## Choosing for your own code

- Use `IllegalArgumentException` when a parameter is invalid and `IllegalStateException` when
  the object is in the wrong state for the call. Throw them at the start of the method, before
  anything has changed.
- Use a **custom checked exception** when the failure is expected and the caller must decide
  what to do, such as a payment that exceeds the balance.
- Put the useful facts in the exception: a clear message, and fields the caller can inspect.

A good rule of thumb is that a method should either do its whole job or throw before changing
anything. Then a caller that catches the exception can trust the object to be exactly as it was.
'''

