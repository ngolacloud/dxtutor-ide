placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
Compiling a pattern turns it into a matching automaton once, so it can be reused for every input.
A `Matcher` then walks one input: `find` jumps to each match in turn, `matches` tests the whole
string, and groups pull out the captured parts.
'''
prompt = '''
Extract `key=value` pairs from a log line with named groups, then compare `matches()` and
`find()` on a date pattern and report where the first date starts.

**Why:** "pull the fields out of a line" is the everyday job of log parsers, routers and
validators, and the `matches`/`find` distinction is the most common regex mistake.
'''
target = '''
import java.util.LinkedHashMap;
import java.util.Map;
import java.util.regex.Matcher;
import java.util.regex.Pattern;

public class Main {
    private static final Pattern PAIR = Pattern.compile("(?<key>\\w+)=(?<value>[^;\\s]+)");
    private static final Pattern ISO_DATE = Pattern.compile("\\d{4}-\\d{2}-\\d{2}");

    public static void main(String[] args) {
        String line = "user=ana; role=admin;  region=eu-west-1";
        Map<String, String> fields = new LinkedHashMap<>();
        Matcher m = PAIR.matcher(line);
        while (m.find()) {
            fields.put(m.group("key"), m.group("value"));
        }
        System.out.println(fields);

        System.out.println(ISO_DATE.matcher("2025-03-07").matches());
        System.out.println(ISO_DATE.matcher("on 2025-03-07").matches());
        System.out.println(ISO_DATE.matcher("on 2025-03-07").find());

        Matcher first = ISO_DATE.matcher("deadline 2025-03-07, review 2025-04-01");
        if (first.find()) {
            System.out.println(first.group() + " at index " + first.start());
        }
    }
}
'''
