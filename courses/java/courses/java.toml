[unit.step.gabarito]
solution = '''
public class BankAccount {
    private static int opened = 0;

    private final String owner;
    private long balance;

    public BankAccount(String owner, long openingCents) {
        if (owner == null || owner.isBlank()) {
            throw new IllegalArgumentException("owner must not be blank");
        }
        if (openingCents < 0) {
            throw new IllegalArgumentException("opening balance must not be negative");
        }
        this.owner = owner;
        this.balance = openingCents;
        opened++;
    }

    public String owner() {
        return owner;
    }

    public long balance() {
        return balance;
    }

    public void deposit(long cents) {
        requirePositive(cents);
        balance += cents;
    }

    public boolean withdraw(long cents) {
        requirePositive(cents);
        if (cents > balance) {
            return false;
        }
        balance -= cents;
        return true;
    }

    public boolean transferTo(BankAccount target, long cents) {
        if (target == null || target == this) {
            throw new IllegalArgumentException("transfer needs another account");
        }
        if (!withdraw(cents)) {
            return false;
        }
        target.balance += cents;
        return true;
    }

    public static int opened() {
        return opened;
    }

    @Override
    public String toString() {
        return String.format("%s: %d.%02d", owner, balance / 100, balance % 100);
    }

    private static void requirePositive(long cents) {
        if (cents <= 0) {
            throw new IllegalArgumentException("amount must be positive, got " + cents);
        }
    }
}
'''
time = "O(1)"
space = "O(1)"
justification = '''
Every method does a fixed amount of work: a few comparisons and one or two additions or
subtractions on `long` fields, so each runs in **O(1)** time. An account stores one
reference and one `long` whatever its history, and the static counter is a single `int`
shared by all accounts, so the space per account is **O(1)**. (`toString` builds a string
whose length grows with the number of digits, at most 19, which is a constant bound.)

Correctness rests on the invariant. The constructor validates before it assigns anything
and increments `opened` last, so a rejected account leaves no trace. `withdraw` checks the
balance before subtracting, so it either fully succeeds or changes nothing, and `transferTo`
reuses it: the money is credited to `target` only after the debit has succeeded. Because
`private` is per class, `transferTo` may update `target.balance` directly. Storing cents in a
`long` keeps arithmetic exact; a `double` would turn 0.1 + 0.2 into 0.30000000000000004.
'''

[[unit]]
id = "java-u10-inheritance-interfaces"
title = "Inheritance and interfaces"
level = "intermediate"
difficulty = 10
intro = '''
Classes come in families, and Java has two tools to describe them: **inheritance**, where a
class extends another and overrides its behaviour, and **interfaces**, contracts that any
class can promise to fulfil. This unit covers `extends`, `super`, `@Override`, abstract
classes, interfaces with default methods, and the polymorphism that ties them together. The
challenge is a payroll in which three kinds of employee are paid through one abstract type.
'''
concepts = '''
## The idea

A circle and a square are both shapes; a salaried and an hourly worker are both employees.
**Inheritance** lets a class reuse and specialise another: `class Dog extends Animal` says a
dog **is an** animal, so it inherits the animal's fields and methods and may **override**
some of them. An **interface** is a pure contract, a list of methods that a type promises to
provide, without any instance state. Code written against the general type (`Animal`,
`Shape`, `Payable`) works with every specialisation, including ones written later. That is
**polymorphism**, and the mechanism behind it is **dynamic dispatch**: when you call
`shape.area()`, the JVM looks at the class of the actual object at run time, not at the
declared type of the variable, and runs that class's version.

## How Java does it

```java
abstract class Animal {                        // cannot be instantiated
    abstract String sound();                   // every subclass must implement it
    String describe() { return getClass().getSimpleName() + " says " + sound(); }
}

class Cat extends Animal {
    @Override String sound() { return "Meow"; }
}

interface Named {
    String name();                             // implicitly public and abstract
    default String greeting() { return "Hello, " + name(); }
}
```

A class `extends` exactly one class but may `implement` any number of interfaces. A
subclass constructor must call a superclass constructor with `super(...)` as its first
statement; Java inserts `super()` for you only when the parent has a constructor without
parameters. Inside an override, `super.sound()` runs the parent's version. **Default
methods** let an interface ship behaviour built on its abstract methods, and **static
methods** in an interface hold related helpers. Every class ultimately extends `Object`,
which is where `toString`, `equals` and `hashCode` come from.

## What is special or tricky

- **Always write `@Override`.** Without it, a typo such as `tostring()` silently adds a new
  method; with it, the compiler reports `method does not override or implement a method from
  a supertype`.
- **Abstract types cannot be instantiated.** `new Animal()` gives
  `Animal is abstract; cannot be instantiated`, and a concrete subclass that forgets a method
  gets `Cat is not abstract and does not override abstract method sound() in Animal`.
- **A missing `super(...)`** when the parent only has constructors with parameters fails
  with `constructor Animal in class Animal cannot be applied to given types`.
- **Overrides cannot narrow access.** Interface methods are `public`, so an implementation
  without `public` fails with `attempting to assign weaker access privileges; was public`.
- **Only instance methods are polymorphic.** Fields and static methods are chosen by the
  declared type.
- **Downcasts can fail at run time.** `(Dog) animal` throws `ClassCastException` when the
  object is really a cat. Test and cast in one step with `if (animal instanceof Dog d)`.
- **Prefer composition** when the relationship is "has a" rather than "is a": deep class
  hierarchies are hard to change.

## What you will practise

You will override methods along a small hierarchy, write an abstract class whose template
method calls abstract steps, and combine interfaces with default and static methods. The
challenge builds a payroll on an interface, an abstract class and three subclasses.
'''

[[unit.step]]
kind = "concept"
id = "java-u10-c1-dispatch"
title = "Dynamic dispatch"
points = 5
difficulty = 10
intro = '''
The declared type of a variable decides which methods you may call; the class of the object
decides which code runs. The JVM resolves an overridden method through a per-class method
table at run time, which is how one loop can treat circles and squares differently.
'''
body = '''
## Two types per variable

```java
Shape s = new Circle(2);
```

`s` has a **static type**, `Shape`, fixed at compile time, and it refers to an object whose
**runtime class** is `Circle`. The compiler uses the static type to check what you are
allowed to call: `s.area()` compiles because every `Shape` has `area`, while `s.radius()`
does not, even though the object has one.

## The object decides

At run time, `s.area()` runs `Circle`'s implementation. Every class has a method table that
maps each method to the code for that class, with overrides replacing the inherited entries.
A call looks up the entry in the table of the object's class, so it costs a single extra
indirection, and the JVM usually inlines it away.

```java
List<Shape> shapes = List.of(new Circle(1), new Square(2));
for (Shape shape : shapes) {
    System.out.println(shape.area());   // Circle.area, then Square.area
}
```

## Why it matters

The loop above never asks what kind of shape it holds, and it never needs to change when
someone adds a `Triangle` subclass. That is the **open/closed principle**: code that is open
to new kinds of objects but closed to modification. Replacing a chain of
`if (kind.equals("circle")) ... else if ...` with overridden methods is one of the most common
refactorings in object-oriented code. When you do need the concrete type, use pattern
matching, `if (shape instanceof Circle c)`, which checks and casts in one safe step.
'''

