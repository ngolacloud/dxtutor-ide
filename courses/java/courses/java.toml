explanation = '''
The min-heap never holds more than k + 1 values. Whenever it overflows, `poll` throws out the
smallest, so after the pass it holds exactly the three largest: 99, 99 and 71. Copying the
heap gives heap order, not sorted order, so the result is sorted explicitly, which costs only
O(k log k). The max-heap shows the other side: each `poll` returns the current maximum, so
draining it prints `drain: 99 99 71 63 42 15 8 7`.
'''

[[unit.step]]
kind = "drill"
id = "java-u28-d3-lru"
title = "An LRU cache from LinkedHashMap"
points = 10
difficulty = 28
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
An **LRU cache** keeps the most recently used entries and evicts the least recently used one
when it is full. `LinkedHashMap` with `accessOrder = true` keeps entries in recency order,
and its `removeEldestEntry` hook decides after every insert whether to drop the oldest.
'''
prompt = '''
Subclass `LinkedHashMap` into a three-entry LRU cache, touch an entry with `get`, and watch
which key is evicted when a fourth one arrives.

**Why:** an LRU cache is a hash map and a recency list working together, and the JDK gives
you both in one class.
'''
target = '''
import java.util.LinkedHashMap;
import java.util.Map;

public class Main {
    public static void main(String[] args) {
        LruCache<String, Integer> cache = new LruCache<>(3);
        cache.put("a", 1);
        cache.put("b", 2);
        cache.put("c", 3);
        System.out.println(cache.keySet());
        cache.get("a");
        System.out.println("after get(a): " + cache.keySet());
        cache.put("d", 4);
        System.out.println("after put(d): " + cache.keySet());
        System.out.println("b evicted: " + !cache.containsKey("b"));
    }
}

class LruCache<K, V> extends LinkedHashMap<K, V> {
    private final int capacity;

    LruCache(int capacity) {
        super(16, 0.75f, true);
        this.capacity = capacity;
    }

    @Override
    protected boolean removeEldestEntry(Map.Entry<K, V> eldest) {
        return size() > capacity;
    }
}
'''
