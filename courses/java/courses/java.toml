[[unit.step]]
kind = "challenge"
id = "java-u32-x1-bst"
title = "A generic BST with deletion"
points = 40
difficulty = 32
entry = "BST"
intro = '''
Insertion and search only ever touch one root-to-leaf path, and so does deletion, but deletion
must also keep the BST property when it removes a node with two children. The classic answer is
to replace that node's key with its in-order successor, the smallest key in its right subtree,
and then delete the successor, which has at most one child.
'''
instructions = '''
## Your turn

Complete the generic class `BST<T extends Comparable<T>>`:

```java
class BST<T extends Comparable<T>> {
    boolean insert(T key)      // false if the key was already there
    boolean contains(T key)
    boolean delete(T key)      // false if the key was not there
    int size()                 // the number of keys, O(1)
    int height()               // nodes on the longest root-to-leaf path; 0 when empty
    List<T> inOrder()          // a new list with the keys in ascending order
}
```

The nested `Node<T>` class and the fields `root` and `size` are provided in the starter.

Rules:

- Keys are unique and compared with `compareTo`. Inserting a key that is already present
  changes nothing and returns `false`.
- `insert`, `contains` and `delete` throw `NullPointerException` for a `null` key, even on an
  empty tree.
- `delete` has three cases for the node that holds the key:
  1. **No children**: remove it.
  2. **One child**: the child takes its place.
  3. **Two children**: replace its key with its in-order successor (the smallest key in its
     right subtree), then delete that successor from the right subtree.
- After every operation the tree must satisfy the BST property and hold exactly the keys
  inserted and not yet deleted.

Example, inserting `50, 30, 70, 20, 40, 60, 80`:

- `height()` is 3 and `inOrder()` is `[20, 30, 40, 50, 60, 70, 80]`.
- `delete(20)` removes a leaf; `delete(50)` removes the root, which has two children, and 60
  takes its place.
- `delete(99)` returns `false` and changes nothing.

Hidden tests decide correctness, including thousands of deletions from a tree of 100,000 random
keys.
'''
starter = '''
import java.util.ArrayList;
import java.util.List;
import java.util.Objects;

class BST<T extends Comparable<T>> {
    // The node type and the fields are provided: keep them.
    static final class Node<T> {
        T key;
        Node<T> left, right;

        Node(T key) {
            this.key = key;
        }
    }

    Node<T> root;
    int size;

    // Insert key; return false if it was already present. Null keys throw NullPointerException.
    boolean insert(T key) {
        throw new UnsupportedOperationException("not implemented");
    }

    boolean contains(T key) {
        throw new UnsupportedOperationException("not implemented");
    }

    // Delete key; return false if it was absent. Two children: use the in-order successor.
    boolean delete(T key) {
        throw new UnsupportedOperationException("not implemented");
    }

    int size() {
        throw new UnsupportedOperationException("not implemented");
    }

    // Nodes on the longest root-to-leaf path; 0 for an empty tree.
    int height() {
        throw new UnsupportedOperationException("not implemented");
    }

    // A new list with every key in ascending order.
    List<T> inOrder() {
        throw new UnsupportedOperationException("not implemented");
    }
}
'''
tests = '''
import java.util.ArrayList;
import java.util.Collections;
import java.util.List;
import java.util.Random;
import java.util.function.Function;
Function<BST<Integer>, Boolean> valid = t -> {
    var keys = new ArrayList<Integer>();
    var stack = new ArrayList<BST.Node<Integer>>();
    var n = t.root;
    while (n != null || !stack.isEmpty()) {
        while (n != null) { stack.add(n); n = n.left; }
        n = stack.remove(stack.size() - 1);
        keys.add(n.key);
        n = n.right;
    }
    for (int i = 1; i < keys.size(); i++) if (keys.get(i - 1) >= keys.get(i)) return false;
    return keys.equals(t.inOrder()) && keys.size() == t.size();
};
Function<int[], BST<Integer>> build = keys -> {
    var t = new BST<Integer>();
    for (int k : keys) t.insert(k);
    return t;
};
test("an empty tree", () -> {
    var t = new BST<Integer>();
    equal(t.size(), 0);
    equal(t.height(), 0);
    equal(t.inOrder(), List.of());
    check(!t.contains(5), "an empty tree contains nothing");
    check(!t.delete(5), "deleting from an empty tree returns false");
    assertThrows(NullPointerException.class, () -> t.insert(null));
    assertThrows(NullPointerException.class, () -> t.contains(null));
    assertThrows(NullPointerException.class, () -> t.delete(null));
});
test("insert, contains, duplicates and height", () -> {
    var t = new BST<Integer>();
    for (int k : new int[] {50, 30, 70, 20, 40, 60, 80}) check(t.insert(k), "a new key returns true");
    check(!t.insert(30), "a duplicate returns false");
    equal(t.size(), 7);
    equal(t.height(), 3);
    equal(t.inOrder(), List.of(20, 30, 40, 50, 60, 70, 80));
    check(t.contains(60) && !t.contains(65) && !t.contains(-1), "contains follows the BST property");
    equal(t.root.key, 50);
    check(valid.apply(t), "the tree must be a valid BST");
});
test("delete a leaf, a one-child node and a missing key", () -> {
    var t = build.apply(new int[] {50, 30, 70, 20, 40, 60, 80, 65});
    check(t.delete(20), "deleting a leaf returns true");
    equal(t.inOrder(), List.of(30, 40, 50, 60, 65, 70, 80));
    check(t.delete(60), "deleting a node with one child returns true");
    equal(t.inOrder(), List.of(30, 40, 50, 65, 70, 80));
    check(!t.contains(60) && t.contains(65), "the child takes the deleted node's place");
    check(!t.delete(99), "deleting a missing key returns false");
    equal(t.size(), 6);
    check(valid.apply(t), "the tree must be a valid BST");
});
test("delete the root with two children", () -> {
    var t = build.apply(new int[] {50, 30, 70, 20, 40, 60, 80});
    check(t.delete(50), "deleting the root returns true");
    equal(t.root.key, 60);
    equal(t.inOrder(), List.of(20, 30, 40, 60, 70, 80));
    check(t.delete(60) && t.delete(70), "two more root deletions");
    equal(t.root.key, 80);
    equal(t.inOrder(), List.of(20, 30, 40, 80));
    check(valid.apply(t), "the tree must be a valid BST");
    for (int k : new int[] {20, 30, 40, 80}) t.delete(k);
    check(t.root == null && t.size() == 0 && t.height() == 0, "deleting every key empties the tree");
});
test("strings and negative keys", () -> {
    var words = new BST<String>();
    for (String w : List.of("pear", "apple", "fig", "apple", "Zebra")) words.insert(w);
    equal(words.inOrder(), List.of("Zebra", "apple", "fig", "pear"));
    check(words.delete("apple") && !words.contains("apple"), "string keys delete too");
    var t = build.apply(new int[] {0, -10, 10, -20, -5, 5, 20});
    check(t.delete(-10), "delete a negative key with two children");
    equal(t.inOrder(), List.of(-20, -5, 0, 5, 10, 20));
    check(valid.apply(t), "the tree must be a valid BST");
});
test("a degenerate tree of sorted keys", () -> {
    var t = new BST<Integer>();
    for (int i = 0; i < 3000; i++) t.insert(i);
    equal(t.height(), 3000);
    equal(t.size(), 3000);
    for (int i = 0; i < 3000; i += 2) t.delete(i);
    equal(t.size(), 1500);
    equal(t.inOrder().get(0), 1);
    check(valid.apply(t), "the tree must be a valid BST");
});
test("100,000 random keys", () -> {
    int n = 100_000;
    var keys = new ArrayList<Integer>();
    for (int i = 0; i < n; i++) keys.add(i * 3 - 150_000);
    Collections.shuffle(keys, new Random(42));
    var t = new BST<Integer>();
    long start = System.nanoTime();
    for (int k : keys) t.insert(k);
    int deleted = 0;
    for (int i = 0; i < n; i += 2) if (t.delete(keys.get(i))) deleted++;
    long ms = (System.nanoTime() - start) / 1_000_000;
    equal(deleted, n / 2);
    equal(t.size(), n / 2);
    check(t.height() < 100, "a random tree should be shallow, height " + t.height());
    var expected = new ArrayList<Integer>();
    for (int i = 1; i < n; i += 2) expected.add(keys.get(i));
    Collections.sort(expected);
    equal(t.inOrder(), expected);
    check(valid.apply(t), "the tree must be a valid BST");
    int wrong = 0;
    for (int i = 0; i < n; i++) if (t.contains(keys.get(i)) != (i % 2 == 1)) wrong++;
    equal(wrong, 0);
    check(ms < 3000, "100,000 inserts and 50,000 deletes took " + ms + " ms: they must be O(h)");
});
