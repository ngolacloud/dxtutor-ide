target = '''
import java.util.Comparator;
import java.util.List;
import java.util.stream.Collectors;

public class Main {
    public static void main(String[] args) {
        List<Integer> nums = List.of(5, 3, 8, 3, 1, 8, 9, 2);

        int product = nums.stream().limit(3).reduce(1, (a, b) -> a * b);
        System.out.println("product of first three: " + product);

        String top3 = nums.stream()
                .distinct()
                .sorted(Comparator.reverseOrder())
                .limit(3)
                .map(String::valueOf)
                .collect(Collectors.joining(", ", "[", "]"));
        System.out.println("top three distinct: " + top3);

        StringBuilder seen = new StringBuilder();
        int firstBig = nums.stream()
                .filter(n -> {
