[[unit.step]]
kind = "challenge"
id = "java-u17-x1-billing"
title = "A billing calendar"
points = 30
difficulty = 17
entry = "Billing"
intro = '''
Subscription billing is a classic source of date bugs: customers who signed up on the 31st,
leap years, and dates typed in different layouts. Computing every billing date from the original
start date, instead of from the previous bill, is what keeps the schedule from drifting.
'''
instructions = '''
## Your turn

Write a class `Billing` with three static methods:

```java
public class Billing {
    static LocalDate parseDate(String text)
    static LocalDate nextBillingDate(LocalDate start, LocalDate today)
    static long overdueDays(LocalDate due, LocalDate paid)
}
```

**`parseDate`** accepts a date in either of two layouts, after stripping surrounding spaces:
ISO `2025-03-07` or day-first `07/03/2025` (`dd/MM/uuuu`). It must reject impossible dates such
as `31/02/2025` or `2025-02-30`, and anything else, by throwing `IllegalArgumentException`.
A `null` text throws `NullPointerException`.

**`nextBillingDate`**: a monthly subscription that starts on `start` bills on
`start.plusMonths(k)` for k = 0, 1, 2, … Return the first billing date that is **on or after**
`today`. Compute every billing date from `start`, so a subscription that starts on 31 January
2024 bills on 2024-02-29, then 2024-03-31 (not 2024-03-29), then 2024-04-30, and so on. If
`today` is on or before `start`, the answer is `start`. `null` arguments throw
`NullPointerException`.

**`overdueDays`**: the number of days between `due` and `paid` when the payment was late, and
`0` when it was on time or early.

Examples:

- `parseDate(" 07/03/2025 ")` → `2025-03-07`; `parseDate("31/02/2025")` → throws
- `nextBillingDate(2024-01-31, 2024-03-01)` → `2024-03-31`
- `nextBillingDate(2024-01-31, 2024-02-29)` → `2024-02-29`
- `overdueDays(2025-03-01, 2025-03-11)` → `10`; `overdueDays(2025-03-01, 2025-02-20)` → `0`

The tests use far-apart dates (centuries), so avoid looping one month at a time from `start`.

**Hint:** `DateTimeFormatter.ISO_LOCAL_DATE` is already strict; build the other formatter with
`ResolverStyle.STRICT`. `ChronoUnit.MONTHS.between(start, today)` tells you roughly which `k`
to try first.

Hidden tests decide correctness.
'''
