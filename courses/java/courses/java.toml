prompt = '''
Run 50 tasks on virtual threads, but let at most 3 of them use the "connection" at once,
and record the peak number in flight.

**Why:** the virtual-thread way to limit concurrency is to limit access to the scarce
resource, not the number of threads.
'''
target = '''
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;
import java.util.concurrent.Semaphore;
import java.util.concurrent.atomic.AtomicInteger;

public class Main {
    public static void main(String[] args) {
        Semaphore connections = new Semaphore(3);
        AtomicInteger inFlight = new AtomicInteger();
        AtomicInteger peak = new AtomicInteger();
        AtomicInteger done = new AtomicInteger();
        try (ExecutorService executor = Executors.newVirtualThreadPerTaskExecutor()) {
            for (int i = 0; i < 50; i++) {
                executor.submit(() -> {
                    connections.acquire();
                    try {
                        peak.accumulateAndGet(inFlight.incrementAndGet(), Math::max);
                        Thread.sleep(5);
                    } finally {
                        inFlight.decrementAndGet();
                        connections.release();
                    }
                    return done.incrementAndGet();
                });
            }
        }
        System.out.println("done " + done.get());
        System.out.println("peak within limit: " + (peak.get() <= 3));
    }
}
'''
