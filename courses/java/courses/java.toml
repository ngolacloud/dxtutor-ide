Group a list of books by genre three ways (count, titles, total pages), then partition them
into long and short books.

**Why:** "count per category", "list per category" and "total per category" are the most common
reports in business code, and each is a single `collect` call.
'''
target = '''
import java.util.List;
import java.util.Map;
import java.util.TreeMap;
import java.util.stream.Collectors;

public class Main {
    record Book(String title, String genre, int pages) {}

    public static void main(String[] args) {
        List<Book> books = List.of(
                new Book("Dune", "sci-fi", 412),
                new Book("Emma", "classic", 474),
                new Book("Neuromancer", "sci-fi", 271),
                new Book("Ulysses", "classic", 730),
                new Book("Hyperion", "sci-fi", 482));

        Map<String, Long> countByGenre = books.stream()
                .collect(Collectors.groupingBy(Book::genre, TreeMap::new, Collectors.counting()));
        System.out.println(countByGenre);

        Map<String, List<String>> titlesByGenre = books.stream()
                .collect(Collectors.groupingBy(Book::genre, TreeMap::new,
                        Collectors.mapping(Book::title, Collectors.toList())));
        System.out.println(titlesByGenre);

        Map<String, Integer> pagesByGenre = books.stream()
                .collect(Collectors.groupingBy(Book::genre, TreeMap::new, Collectors.summingInt(Book::pages)));
        System.out.println(pagesByGenre);

        Map<Boolean, List<String>> longBooks = books.stream()
                .collect(Collectors.partitioningBy(b -> b.pages() > 450,
                        Collectors.mapping(Book::title, Collectors.toList())));
        System.out.println(longBooks);
    }
}
'''
