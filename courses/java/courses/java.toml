[[unit.step]]
kind = "drill"
id = "java-u12-d3-custom-exception"
title = "A custom checked exception"
points = 10
difficulty = 12
placeholder_policy = "on_demand"
run_command = "java Main.java"
intro = '''
A custom exception carries domain facts that a generic one cannot, such as how many items were
missing. Because `OutOfStockException` extends `Exception`, it is **checked**: the compiler
rejects any caller of `reserve` that neither catches it nor declares it.
'''
prompt = '''
Reserve items from a small stock, throwing a checked `OutOfStockException` when there are not
enough and an `IllegalArgumentException` for an unknown item.

**Why:** a checked exception for the expected failure and an unchecked one for invalid input
is the split most Java APIs use. Notice too that `NumberFormatException` is a subclass of
`IllegalArgumentException`.
'''
target = '''
import java.util.Map;

public class Main {
    static final Map<String, Integer> STOCK = Map.of("apple", 3, "pear", 0);

    static int reserve(String item, int qty) throws OutOfStockException {
        Integer have = STOCK.get(item);
        if (have == null) {
            throw new IllegalArgumentException("unknown item: " + item);
        }
        if (qty > have) {
            throw new OutOfStockException(item, qty - have);
        }
        return have - qty;
    }

    public static void main(String[] args) {
        String[][] orders = {{"apple", "2"}, {"pear", "1"}, {"kiwi", "1"}, {"apple", "x"}};
        for (String[] order : orders) {
            try {
                int left = reserve(order[0], Integer.parseInt(order[1]));
                System.out.println(order[0] + ": ok, " + left + " left");
            } catch (OutOfStockException e) {
                System.out.println(e.getMessage() + ", missing " + e.missing);
            } catch (IllegalArgumentException e) {
                System.out.println("bad order: " + e.getMessage());
            }
        }
    }
}

class OutOfStockException extends Exception {
    final int missing;

    OutOfStockException(String item, int missing) {
        super("out of stock: " + item);
        this.missing = missing;
    }
}
