instructions = '''
## Your turn

The starter declares `Suit` and `Rank` with their constants and symbols. Implement:

- **`Suit.fromSymbol(char c)`**: the suit whose symbol is `c`, ignoring case (`'h'` →
  `HEARTS`). Throw `IllegalArgumentException` for any other character.
- **`Rank.fromSymbol(String s)`**: the rank whose symbol is `s`, ignoring case (`"10"` →
  `TEN`, `"q"` → `QUEEN`). Throw `IllegalArgumentException` for anything else, including
  `null`.
- **`record Card(Rank rank, Suit suit)`**:
  - a compact constructor that throws `NullPointerException` if `rank` or `suit` is `null`;
  - `static Card parse(String text)`: strip surrounding spaces; the last character is the
    suit and everything before it is the rank, so `"QH"`, `"10S"` and `" 2c "` are valid.
