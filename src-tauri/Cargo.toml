# dxtutor-ide — casca desktop Tauri. Membro do workspace da raiz; os comandos
# são finos e a lógica vive nos módulos e nos crates tutor-* (o "cérebro").
[package]
name = "dxtutor-ide"
version.workspace = true
description = "dxtutor IDE — desktop shell (Co-Dev + tutor dxtutor)"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "dxtutor_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = "1"

# Terminal PTY verdadeiro (xterm na UI ↔ pty real).
portable-pty = "0.8"
libc = "0.2"

# Bridge v7 (llm/keys/vsix) e Co-Dev.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

# PairCode (sessão par-a-par, exclusiva do dxtutor-ide).
tokio = { version = "1", features = ["time", "net", "sync", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
chacha20poly1305 = "0.10"
local-ip-address = "0.6"

# O "cérebro" dxtutor.
tutor-core = { path = "../crates/tutor-core" }
tutor-eval = { path = "../crates/tutor-eval" }
tutor-llm = { path = "../crates/tutor-llm" }
tutor-board = { path = "../crates/tutor-board" }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Kept so `cargo build` matches the Tauri v2 convention even without the CLI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
